<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048 powers - prototype</title>
<!--
  Prototype: 2048 with fifteen tile palettes (one per pair of stages), a
  magnetic hint between twins, a lean that previews a drag, a nudge on a
  blocked move, then fourteen powers dropped at random.

  Swipe, drag or arrows / WASD. A slow drag previews the move and is
  cancelled by coming back to where it started.
  Keys: [ ] stage, P palettes, M material, V all values, U undo, R restart,
  T auto powers.
  Materials: the grey PNGs are read from ../fusionMania/ (file names in
  MATERIALS); a missing one is drawn in code instead.
  ?autoplay=1 plays random moves and forces every power in turn.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none;
           -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
// ---------------------------------------------------------------- tunables
var N = 4;                 // board size
var MOVE_T = 0.12;         // seconds a slide takes
var STAMP_T = 0.7;         // merge: pressed flat like a stamp, then springs back (fx page, round 2, #10)
var SPAWN_T = 0.18;        // new tile grows in
var POWER_MOVES = 5;       // how many moves a tile or side power lasts
var POWER_EVERY_MIN = 4;   // auto powers: one every 4..7 moves
var POWER_EVERY_MAX = 7;
var MAGNET = 0.05;         // pull between twins, in cells (comet pull, fx page round 2, #8)
var MAGNET_NEAR = 0.3;     // share of it for twins side by side: a discreet move
var MAGNET_FAR = 0.6;      // share of it for twins with empty cells between
// targets (targets page, round 3): one ring in the gutters every PING_PERIOD s
var PING_PERIOD = 2.1;     // the ring's beat
var PING_REACH = 1.4;      // how far it travels, in cells
var PING_ALPHA = 0.6;      // its opacity as it leaves the target
var PING_WIDTH = 1.6;      // its width, in gutters
var TARGET_TINT = 0.14;    // the target cell's floor tint
var TARGET_BORDER = 0.5;   // the border in the gutter around it
var BADGE = 0.14;          // the power's badge radius, in cells
var LEAN = 0.16;           // how far a drag leans the tiles that would move, in cells
var RUBBER = 0.04;         // how far a drag leans a board that cannot move, in cells
var COMMIT_DRAG = 0.75;    // a drag this long (in cells) commits without release
var RELEASE_DRAG = 0.3;    // a release past this (in cells) commits
var FOUR_CHANCE = 0.1;
var STAGES = 30;
var COMET_T = 0.16;        // comet flight before impact

var FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
var FONT_K = [0.52, 0.5, 0.42, 0.34, 0.28, 0.24];

var POWERS = [
  { key: 'freeze',   label: 'Freeze',   cat: 'tile', color: '#7fd3ff', ink: '#06283a' },
  { key: 'ghostV',   label: 'Ghost ↕',  cat: 'tile', color: '#c9b8ff', ink: '#231546' },
  { key: 'ghostH',   label: 'Ghost ↔',  cat: 'tile', color: '#c9b8ff', ink: '#231546' },
  { key: 'mystery',  label: 'Mystery',  cat: 'tile', color: '#9aa0a6', ink: '#16181a' },
  { key: 'stone',    label: 'Stone',    cat: 'tile', color: '#a08f7a', ink: '#1e1710' },
  { key: 'fire',     label: 'Fireball', cat: 'cell', color: '#ff7a2a', ink: '#2a0d00' },
  { key: 'purple',   label: 'Purple',   cat: 'cell', color: '#b04dff', ink: '#ffffff' },
  { key: 'comet',    label: 'Comet',    cat: 'cell', color: '#5fe6ff', ink: '#00262b' },
  { key: 'black',    label: 'Black',    cat: 'cell', color: '#4a3f57', ink: '#ffffff' },
  { key: 'boltV',    label: 'Bolt ↕',   cat: 'cell', color: '#ffd21f', ink: '#2b2300' },
  { key: 'boltH',    label: 'Bolt ↔',   cat: 'cell', color: '#ffd21f', ink: '#2b2300' },
  { key: 'switch',   label: 'Switch',   cat: 'cell', color: '#2fd6b4', ink: '#00261f' },
  { key: 'teleport', label: 'Teleport', cat: 'side', color: '#5ad1ff', ink: '#002233' },
  { key: 'lock',     label: 'Lock',     cat: 'side', color: '#ff4d5e', ink: '#ffffff' }
];
var POWER = {};
POWERS.forEach(function (p) { POWER[p.key] = p; });

// A material is a grey texture laid over the tile colour in hard-light: 50%
// grey changes nothing, lighter lifts, darker sinks, so one file fits every
// palette. The PNG named in `file` (under TEX_DIR) replaces the stand-in
// drawn below as soon as it loads. `crop` is the share of the texture one
// tile shows, at an offset picked per value (1 = whole, centred).
// `tone` is [brightness, contrast] applied to the PNG only: a file:// image
// cannot be read back, so its mean grey and contrast were measured once
// (mean -> 128, standard deviation -> ~38) and are corrected here.
var TEX_DIR = '../fusionMania/';
var MATERIALS = {
  none:      { label: 'Smooth' },
  wood:      { label: 'Wood',      alpha: 0.55, crop: 0.7,  tone: [1.02, 3],    file: 'Texture de bois monochrome en niveaux de gris.png' },
  diamond:   { label: 'Diamond',   alpha: 0.6,  crop: 1,    tone: [0.85, 0.85], file: 'Gemme géométrique en noir et blanc.png' },
  crystal:   { label: 'Crystal',   alpha: 0.55, crop: 0.75, tone: [0.87, 1.06], file: 'Texture cristalline monochrome facettée.png' },
  marble:    { label: 'Marble',    alpha: 0.5,  crop: 0.7,  tone: [0.855, 2.5], file: 'Texture de marbre gris veiné concat.png' },
  metal:     { label: 'Metal',     alpha: 0.55, crop: 0.8,  tone: [0.89, 1.7],  file: 'Texture de métal brossé argenté.png' },
  leather:   { label: 'Leather',   alpha: 0.5,  crop: 1,    tone: [1.135, 2.4], file: 'Panneau en cuir gris cousu.png' },
  candy:     { label: 'Candy',     alpha: 0.5,  crop: 1,    tone: [1.034, 2],   file: 'Bulles en suspension sur gel brillant.png' },
  honeycomb: { label: 'Honeycomb', alpha: 0.45, crop: 0.7,  tone: [1.063, 1.05], file: 'Texture hexagonale métallique en relief.png' }
};
var MAT_ORDER = ['auto', 'none', 'wood', 'diamond', 'crystal', 'marble', 'metal', 'leather', 'candy', 'honeycomb'];
// the material each palette wears when the selector is on auto
var PALETTE_MAT = ['none', 'crystal', 'wood', 'marble', 'candy', 'metal', 'diamond', 'honeycomb',
                   'leather', 'candy', 'marble', 'wood', 'diamond', 'crystal', 'metal'];

// From 128 up a tile starts to look premium: gold, then rainbow.
var PREMIUM = [
  { from: 128,  rim: 'gold',    rimW: 0.03 },
  { from: 256,  rim: 'gold',    rimW: 0.04,  inner: true, sweep: 0.22 },
  { from: 512,  rim: 'gold',    rimW: 0.05,  inner: true, sweep: 0.28, glints: 2 },
  { from: 1024, rim: 'gold',    rimW: 0.055, inner: true, sweep: 0.35, glints: 4, goldText: true },
  { from: 2048, rim: 'rainbow', rimW: 0.06,  inner: true, sweep: 0.4,  glints: 4, goldText: true },
  { from: 4096, rim: 'rainbow', rimW: 0.065, inner: true, sweep: 0.45, glints: 4, goldText: true, holo: true }
];
function premiumFor(v) {
  var p = null;
  for (var i = 0; i < PREMIUM.length; i++) if (v >= PREMIUM[i].from) p = PREMIUM[i];
  return p;
}

// ------------------------------------------------------------------ colour
// Every palette is a path through OKLCH: lightness, chroma and hue all move
// one step per value, so 2 -> 4 -> 8 reads as a climb on every palette.
function labToLin(L, a, b) {
  var l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  var m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  var s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  var l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  return [ 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
function inGamut(c) {
  return c[0] >= -0.001 && c[0] <= 1.001 && c[1] >= -0.001 && c[1] <= 1.001 && c[2] >= -0.001 && c[2] <= 1.001;
}
function enc(x) {
  x = Math.max(0, Math.min(1, x));
  return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
}
function oklch(L, C, h) {
  L = Math.max(0, Math.min(1, L));
  var hr = h * Math.PI / 180, ca = Math.cos(hr), sa = Math.sin(hr);
  var lin = labToLin(L, C * ca, C * sa);
  if (!inGamut(lin)) {
    var lo = 0, hi = C;
    for (var i = 0; i < 18; i++) {
      var mid = (lo + hi) / 2;
      if (inGamut(labToLin(L, mid * ca, mid * sa))) lo = mid; else hi = mid;
    }
    lin = labToLin(L, lo * ca, lo * sa);
  }
  return [enc(lin[0]) * 255, enc(lin[1]) * 255, enc(lin[2]) * 255];
}
function css(c, a) {
  return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a == null ? 1 : a) + ')';
}
function mixRgb(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }

// h: hue at 2 and at 2048 (the path goes the way the numbers go),
// L: lightness at 2 and 2048, C: chroma at 2 and 2048.
var PALETTES = [
  { name: 'Classic', h: [88, 22],    L: [0.94, 0.56], C: [0.045, 0.2] },
  { name: 'Lagoon',  h: [185, 258],  L: [0.94, 0.45], C: [0.05, 0.16] },
  { name: 'Forest',  h: [118, 162],  L: [0.93, 0.42], C: [0.05, 0.15] },
  { name: 'Sunset',  h: [75, -28],   L: [0.92, 0.5],  C: [0.06, 0.21] },
  { name: 'Candy',   h: [355, 290],  L: [0.93, 0.5],  C: [0.05, 0.2] },
  { name: 'Lava',    h: [22, 95],    L: [0.45, 0.88], C: [0.14, 0.19], dark: true },
  { name: 'Glacier', h: [215, 272],  L: [0.95, 0.48], C: [0.025, 0.15] },
  { name: 'Neon',    h: [320, 150],  L: [0.56, 0.87], C: [0.2, 0.2],   dark: true },
  { name: 'Desert',  h: [85, 38],    L: [0.91, 0.5],  C: [0.04, 0.13] },
  { name: 'Berry',   h: [12, -55],   L: [0.88, 0.4],  C: [0.07, 0.19] },
  { name: 'Mint',    h: [178, 140],  L: [0.95, 0.45], C: [0.04, 0.15] },
  { name: 'Autumn',  h: [110, 35],   L: [0.88, 0.46], C: [0.08, 0.16] },
  { name: 'Royal',   h: [290, 250],  L: [0.9, 0.36],  C: [0.05, 0.17] },
  { name: 'Reef',    h: [25, 200],   L: [0.86, 0.55], C: [0.12, 0.13] },
  { name: 'Aurora',  h: [150, 305],  L: [0.56, 0.86], C: [0.15, 0.17], dark: true }
];
function lerp(a, b, k) { return a + (b - a) * k; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function buildPalette(p) {
  var h0 = p.h[0], h1 = p.h[1], hm = (h0 + h1) / 2, dir = h1 >= h0 ? 1 : -1;
  p.tiles = [];
  for (var n = 1; n <= 17; n++) {
    var t = (n - 1) / 10, L, C, h;
    if (t <= 1) {
      L = lerp(p.L[0], p.L[1], Math.pow(t, 0.92));
      C = lerp(p.C[0], p.C[1], t) + 0.025 * Math.sin(Math.PI * t);
      h = lerp(h0, h1, t);
    } else {
      // past 2048 the hue keeps walking and the tile wears a shine
      L = p.L[1] + (p.dark ? -0.04 : -0.04) * Math.min(n - 11, 3);
      C = p.C[1];
      h = h1 + dir * 24 * (n - 11);
    }
    p.tiles.push({
      L: L, rgb: oklch(L, C, h),
      top: oklch(L + 0.045, C * 0.95, h), bot: oklch(L - 0.04, C * 1.05, h),
      light: oklch(Math.min(0.97, L + 0.2), C * 0.8, h),
      text: L > 0.7 ? oklch(0.3, 0.06, h) : oklch(0.985, 0.01, h)
    });
  }
  var mL = p.dark ? 0.42 : 0.72;
  p.mystery = { L: mL, rgb: oklch(mL, 0.004, hm), top: oklch(mL + 0.04, 0.004, hm),
                bot: oklch(mL - 0.04, 0.004, hm), text: oklch(0.98, 0, 0) };
  if (p.dark) {
    p.bg = oklch(0.18, 0.03, hm); p.bg2 = oklch(0.12, 0.03, h1);
    p.board = oklch(0.25, 0.035, hm); p.cell = oklch(0.3, 0.035, hm);
    p.ink = oklch(0.93, 0.02, hm); p.inkSoft = oklch(0.7, 0.03, hm);
  } else {
    p.bg = oklch(0.965, 0.012, h0); p.bg2 = oklch(0.92, 0.022, hm);
    p.board = oklch(0.8, 0.03, hm); p.cell = oklch(0.86, 0.022, hm);
    p.ink = oklch(0.3, 0.04, hm); p.inkSoft = oklch(0.5, 0.03, hm);
  }
}
PALETTES.forEach(buildPalette);

// ------------------------------------------------------------------ canvas
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W, H, dpr, S, BX, BY, GAP, CELL, spriteCache = {};

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  var topH = 112, botH = 176;
  S = Math.floor(Math.min(W - 44, H - topH - botH - 16, 560));
  if (S < 220) S = Math.floor(Math.min(W - 44, 260));
  BX = Math.round((W - S) / 2);
  BY = Math.round(topH + Math.max(0, (H - topH - botH - S) / 2));
  GAP = S * 0.03;
  CELL = (S - GAP * (N + 1)) / N;
  spriteCache = {};
}
function cx(x) { return BX + GAP + CELL / 2 + x * (CELL + GAP); }
function cy(y) { return BY + GAP + CELL / 2 + y * (CELL + GAP); }

function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function makeCanvas(w) {
  var c = document.createElement('canvas');
  c.width = c.height = Math.ceil(w * dpr);
  var g = c.getContext('2d');
  g.scale(dpr, dpr);
  return { c: c, g: g };
}

// ---------------------------------------------------------------- materials
var TEX_SIZE = 512, texDrawn = {}, texImg = {}, matMode = 'auto';

function matFor(pi) { return matMode === 'auto' ? PALETTE_MAT[pi] : matMode; }
function texSource(name) {
  if (texImg[name]) return texImg[name];
  if (!texDrawn[name]) texDrawn[name] = drawTexture(name);
  return texDrawn[name];
}
function loadTextures() {
  Object.keys(MATERIALS).forEach(function (name) {
    if (!MATERIALS[name].file) return;
    var im = new Image();
    im.onload = function () { texImg[name] = im; spriteCache = {}; };
    im.src = TEX_DIR + encodeURIComponent(MATERIALS[name].file);
  });
}

function makeNoise(seed) {
  var r = mulberry(seed), G = 256, v = new Float32Array(G * G);
  for (var i = 0; i < G * G; i++) v[i] = r();
  return function (x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    var a = v[(yi & 255) * G + (xi & 255)], b = v[(yi & 255) * G + ((xi + 1) & 255)];
    var c = v[((yi + 1) & 255) * G + (xi & 255)], d = v[((yi + 1) & 255) * G + ((xi + 1) & 255)];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
function fbm(n, x, y, oct) {
  var s = 0, amp = 0.5, f = 1;
  for (var i = 0; i < oct; i++) { s += amp * n(x * f, y * f); f *= 2; amp *= 0.5; }
  return s / (1 - Math.pow(0.5, oct));
}

// Stand-ins for the PNGs, grey only, re-centred on 50% grey so hard-light
// keeps the palette's own colour on average.
function drawTexture(name) {
  var Z = TEX_SIZE, c = document.createElement('canvas');
  c.width = c.height = Z;
  var g = c.getContext('2d'), n = makeNoise(name.length * 0.137 + 0.21), r = mulberry(name.length * 0.29 + 0.07), i;
  g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, Z, Z);
  function pixels(fn) {
    var img = g.createImageData(Z, Z), d = img.data;
    for (var y = 0; y < Z; y++) for (var x = 0; x < Z; x++) {
      var k = (y * Z + x) * 4, v = fn(x, y);
      d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  function hex(x, y, R) {
    g.beginPath();
    for (var a = 0; a < 6; a++) {
      var t = Math.PI / 6 + a * Math.PI / 3;
      if (a) g.lineTo(x + Math.cos(t) * R, y + Math.sin(t) * R); else g.moveTo(x + Math.cos(t) * R, y + Math.sin(t) * R);
    }
    g.closePath();
  }
  if (name === 'wood') {
    pixels(function (x, y) {
      var t = y * 0.04 + fbm(n, x * 0.004, y * 0.012, 3) * 5 + Math.sin(x * 0.006) * 0.8;
      var ring = Math.pow(Math.abs(Math.sin(t * Math.PI)), 0.5);
      return 160 - ring * 75 + (n(x * 0.6, y * 0.04 + 50) - 0.5) * 34;
    });
  } else if (name === 'marble') {
    pixels(function (x, y) {
      var t = (x * 0.7 + y * 0.5) * 0.01 + fbm(n, x * 0.005, y * 0.005, 5) * 6;
      var vein = Math.pow(1 - Math.abs(Math.sin(t * Math.PI)), 7);
      return 150 + (fbm(n, x * 0.012 + 9, y * 0.012, 4) - 0.5) * 50 - vein * 120;
    });
  } else if (name === 'metal') {
    pixels(function (x, y) {
      var band = Math.exp(-Math.pow((x + y - Z * 0.75) / (Z * 0.22), 2));
      return 110 + (n(x * 0.012, y * 1.4) - 0.5) * 60 + (n(x * 0.05, y * 3.1 + 7) - 0.5) * 24 + band * 70;
    });
  } else if (name === 'leather') {
    pixels(function (x, y) {
      var cell = fbm(n, x * 0.05, y * 0.05, 2), pebble = Math.pow(Math.abs(cell - 0.5) * 2, 0.6);
      return 155 - pebble * 80 + (n(x * 0.45, y * 0.45) - 0.5) * 18;
    });
    var ins = Z * 0.085;
    g.setLineDash([Z * 0.035, Z * 0.022]); g.lineCap = 'round';
    g.lineWidth = Z * 0.016; g.strokeStyle = 'rgba(40,40,40,0.6)';
    rr(g, ins, ins + 3, Z - ins * 2, Z - ins * 2, Z * 0.1); g.stroke();
    g.strokeStyle = 'rgba(235,235,235,0.95)';
    rr(g, ins, ins, Z - ins * 2, Z - ins * 2, Z * 0.1); g.stroke();
    g.setLineDash([]);
  } else if (name === 'diamond') {
    // a brilliant cut seen from above: an octagonal table, kites around it
    var C = Z / 2, tr = Z * 0.24, or = Z * 0.78;
    var tv = [], ov = [];
    for (i = 0; i < 8; i++) {
      var a = Math.PI / 8 + i * Math.PI / 4;
      tv.push([C + Math.cos(a) * tr, C + Math.sin(a) * tr]);
      ov.push([C + Math.cos(a) * or, C + Math.sin(a) * or]);
    }
    for (i = 0; i < 8; i++) {
      var j = (i + 1) % 8, mx = (ov[i][0] + ov[j][0]) / 2, my = (ov[i][1] + ov[j][1]) / 2;
      [[tv[i], tv[j], [mx, my]], [tv[i], ov[i], [mx, my]], [tv[j], ov[j], [mx, my]]].forEach(function (tri, q) {
        var sh = 60 + r() * 170;
        g.fillStyle = 'rgb(' + (sh | 0) + ',' + (sh | 0) + ',' + (sh | 0) + ')';
        g.beginPath(); g.moveTo(tri[0][0], tri[0][1]); g.lineTo(tri[1][0], tri[1][1]); g.lineTo(tri[2][0], tri[2][1]); g.closePath(); g.fill();
      });
    }
    var tg = g.createLinearGradient(C - tr, C - tr, C + tr, C + tr);
    tg.addColorStop(0, 'rgb(205,205,205)'); tg.addColorStop(1, 'rgb(105,105,105)');
    g.fillStyle = tg; g.beginPath(); tv.forEach(function (p, k) { if (k) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = Z * 0.006;
    for (i = 0; i < 8; i++) {
      var k2 = (i + 1) % 8;
      g.beginPath(); g.moveTo(tv[i][0], tv[i][1]); g.lineTo(tv[k2][0], tv[k2][1]); g.lineTo(ov[k2][0], ov[k2][1]); g.stroke();
      g.beginPath(); g.moveTo(tv[i][0], tv[i][1]); g.lineTo((ov[i][0] + ov[k2][0]) / 2, (ov[i][1] + ov[k2][1]) / 2); g.lineTo(tv[k2][0], tv[k2][1]); g.stroke();
    }
  } else if (name === 'crystal') {

      }
      [['rgba(255,230,80,' + al * 0.35 + ')', 14], ['rgba(255,245,170,' + al * 0.8 + ')', 6], ['rgba(255,255,255,' + al + ')', 2.5]].forEach(function (st) {
        ctx.strokeStyle = st[0]; ctx.lineWidth = st[1]; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (var m = 1; m < pts.length; m++) ctx.lineTo(pts[m][0], pts[m][1]);
        ctx.stroke();
      });
    } else if (f.kind === 'comet') {
      var sx = f.x + S * 0.9, sy = f.y - S * 1.1, e = k * k;
      var hx = lerp(sx, f.x, e), hy = lerp(sy, f.y, e);
      var tx = lerp(sx, f.x, Math.max(0, e - 0.35)), ty = lerp(sy, f.y, Math.max(0, e - 0.35));
      var g = ctx.createLinearGradient(tx, ty, hx, hy);
      g.addColorStop(0, 'rgba(127,240,255,0)'); g.addColorStop(1, 'rgba(230,255,255,0.95)');
      ctx.strokeStyle = g; ctx.lineWidth = CELL * 0.22; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke(); ctx.lineCap = 'butt';
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, CELL * 0.16, 0, 6.283); ctx.fill();
    }
  }
}

function drawParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    var dk = Math.pow(p.drag, dt * 60);
    p.vx *= dk; p.vy = p.vy * dk + p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 8;
    var a = p.life / p.max;
    ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
    if (p.kind === 'puff') {
      ctx.globalAlpha = a * 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1 - a) * 1.6), 0, 6.283); ctx.fill();
    } else if (p.kind === 'shard') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
      setWorld();
    } else if (p.kind === 'spark') {
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * a), 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (i = rings.length - 1; i >= 0; i--) {
    var r = rings[i], k = (clock - r.t0) / r.dur;
    if (k >= 1) { rings.splice(i, 1); continue; }
    if (k < 0) continue;
    var e = 1 - Math.pow(1 - k, 2);
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - k) + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, Math.max(0.1, lerp(r.r0, r.r1, e)), 0, 6.283); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (i = floats.length - 1; i >= 0; i--) {
    var f = floats[i], fk = (clock - f.t0) / f.dur;
    if (fk >= 1) { floats.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - fk * fk;
    ctx.font = '800 ' + Math.round(Math.max(16, CELL * 0.24)) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = css(f.color);
    ctx.fillText(f.text, f.x, f.y - fk * CELL * 0.6);
  }
  ctx.globalAlpha = 1;
}

// --------------------------------------------------------------------- hud
function button(x, y, w, h, label, fn, fill, ink, font) {
  ctx.fillStyle = fill; rr(ctx, x, y, w, h, Math.min(9, h / 2)); ctx.fill();
  ctx.fillStyle = ink; ctx.font = font || ('700 12px ' + FONT);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 0.5);
  buttons.push({ x: x, y: y, w: w, h: h, fn: fn });
}

function drawHud(P, mix) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var ink = css(mix('ink')), soft = css(mix('inkSoft')), boardC = css(mix('board'));
  var x0 = BX, x1 = BX + S, top = 14;
  // stage selector
  button(x0, top, 34, 34, '‹', function () { setStage(stage - 1); }, boardC, ink, '800 20px ' + FONT);
  ctx.fillStyle = ink; ctx.font = '800 20px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Stage ' + stage, x0 + 34 + 52, top + 13);
  ctx.fillStyle = soft; ctx.font = '600 12px ' + FONT;
  var mk = matFor(palIdx);
  ctx.fillText(P.name + ' · ' + MATERIALS[mk].label + (texImg[mk] ? ' png' : ''), x0 + 34 + 52, top + 31);
  button(x0 + 34 + 104, top, 34, 34, '›', function () { setStage(stage + 1); }, boardC, ink, '800 20px ' + FONT);
  // score boxes
  var bw = 74, bh = 42;
  [['Score', Math.round(dispScore)], ['Best', best]].forEach(function (s, i) {
    var bx = x1 - bw - (1 - i) * (bw + 6);
    ctx.fillStyle = boardC; rr(ctx, bx, top - 4, bw, bh, 9); ctx.fill();
    ctx.fillStyle = soft; ctx.font = '700 11px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText(s[0], bx + bw / 2, top + 7);
    ctx.fillStyle = ink; ctx.font = '800 17px ' + FONT;
    ctx.fillText(String(s[1]), bx + bw / 2, top + 25);
  });
  // second row: moves, power clock
  ctx.textAlign = 'left'; ctx.fillStyle = soft; ctx.font = '600 12px ' + FONT;
  var info = 'Moves ' + moves + (autoPowers ? ' · next power in ' + powerCountdown : ' · auto powers off');
  ctx.fillText(info, x0, top + 56);
  // what strikes on the next move
  var inc = cellPowers.map(function (c) { return POWER[c.type].label; });
  ctx.textAlign = 'left'; ctx.font = '700 13px ' + FONT;
  if (inc.length) { ctx.fillStyle = ink; ctx.fillText('Next move: ' + inc.join(', '), x0, BY - 22); }
  // fps readout, bottom right
  ctx.textAlign = 'right'; ctx.font = '600 10px ' + FONT; ctx.fillStyle = soft;
  ctx.fillText(Math.round(fps) + ' fps · worst ' + worstMs.toFixed(0) + ' ms', W - 8, H - 8);
  if (lastError) { ctx.textAlign = 'left'; ctx.fillStyle = '#e00'; ctx.fillText(lastError, 8, H - 8); }
}

function drawDebug(P, mix) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var y = BY + S + 24, soft = css(mix('inkSoft')), ink = css(mix('ink')), boardC = css(mix('board'));
  ctx.fillStyle = soft; ctx.font = '600 11px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Tap to force a power', BX, y);
  y += 12;
  var per = 5, gap = 6, w = (S - gap * (per - 1)) / per, h = 28;
  POWERS.forEach(function (p, i) {
    var col = i % per, row = Math.floor(i / per);
    button(BX + col * (w + gap), y + row * (h + gap), w, h, p.label, function () { addPower(p.key); }, p.color, p.ink, '700 11px ' + FONT);
  });
  // the fifteenth slot cycles the material: auto follows the palette
  var ml = matMode === 'auto' ? 'Auto · ' + MATERIALS[matFor(palIdx)].label : MATERIALS[matMode].label;
  button(BX + 4 * (w + gap), y + 2 * (h + gap), w, h, ml, cycleMaterial, ink, css(mix('bg')), '700 11px ' + FONT);
  y += 3 * (h + gap) + 4;
  var tw = (S - gap * 4) / 5, f11 = '700 11px ' + FONT;
  button(BX, y, tw, 30, 'Auto: ' + (autoPowers ? 'on' : 'off'), function () { autoPowers = !autoPowers; }, boardC, ink, f11);
  button(BX + (tw + gap), y, tw, 30, 'All values', fillAllValues, boardC, ink, f11);
  button(BX + 2 * (tw + gap), y, tw, 30, 'Undo', undo, boardC, ink, f11);
  button(BX + 3 * (tw + gap), y, tw, 30, 'Restart', newGame, boardC, ink, f11);
  button(BX + 4 * (tw + gap), y, tw, 30, 'Palettes', function () { showPalettes = true; }, boardC, ink, f11);
}

function drawPalettes() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(12,12,16,0.95)'; ctx.fillRect(0, 0, W, H);
  buttons = [{ x: 0, y: 0, w: W, h: H, fn: function () { showPalettes = false; } }];
  var top = 40, rowH = Math.min(52, (H - top - 10) / 15), cols = 12, gap = 3;
  var avail = Math.min(W - 24, 680), ts = Math.floor(Math.min(rowH - 16, (avail - gap * (cols - 1)) / cols));
  var x0 = Math.round((W - (ts * cols + gap * (cols - 1))) / 2);
  ctx.fillStyle = '#fff'; ctx.font = '700 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('15 palettes, two stages each · tap a row to play it, elsewhere to close', W / 2, 20);
  PALETTES.forEach(function (p, i) {
    var y = top + i * rowH;
    if (i === palIdx) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; rr(ctx, x0 - 6, y - 2, ts * cols + gap * (cols - 1) + 12, rowH - 2, 6); ctx.stroke(); }
    ctx.fillStyle = css(p.bg); rr(ctx, x0 - 4, y + 12, ts * cols + gap * (cols - 1) + 8, ts + 4, 4); ctx.fill();
    ctx.fillStyle = '#ddd'; ctx.font = '600 11px ' + FONT; ctx.textAlign = 'left';
    ctx.fillText('Stages ' + (i * 2 + 1) + '-' + (i * 2 + 2) + ' · ' + p.name, x0, y + 5);
    for (var j = 0; j < cols; j++) {
      var spr = tileSprite(i, 2 << j, ts, false), pad = (spr.w - ts) / 2, tx = x0 + j * (ts + gap);
      ctx.drawImage(spr.c, tx - pad, y + 14 - pad, spr.w, spr.w);
      ctx.setTransform(dpr, 0, 0, dpr, dpr * (tx + ts / 2), dpr * (y + 14 + ts / 2));
      premiumLive(2 << j, ts, j * 0.13);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    buttons.push({ x: 0, y: y - 2, w: W, h: rowH, fn: (function (k) { return function () { setStage(k * 2 + 1); showPalettes = false; }; })(i) });
  });
}

// -------------------------------------------------------------------- frame
function draw(dt) {
  var P = PALETTES[palIdx], Q = PALETTES[prevPalIdx], pk = clamp((clock - palT0) / 0.5, 0, 1);
  function mix(key) { return pk >= 1 ? P[key] : mixRgb(Q[key], P[key], pk); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, css(mix('bg'))); g.addColorStop(1, css(mix('bg2')));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  buttons = [];
  drawHud(P, mix);

  shakeAmp *= Math.exp(-dt * 14);
  shakeX = (Math.random() - 0.5) * 2 * shakeAmp; shakeY = (Math.random() - 0.5) * 2 * shakeAmp;
  setWorld();
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; rr(ctx, BX, BY + 5, S, S, S * 0.04); ctx.fill();
  ctx.fillStyle = css(mix('board')); rr(ctx, BX, BY, S, S, S * 0.04); ctx.fill();
  ctx.fillStyle = css(mix('cell'));
  for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { rr(ctx, cx(x) - CELL / 2, cy(y) - CELL / 2, CELL, CELL, CELL * 0.15); ctx.fill(); }
  drawTargets();

  computeMagnet();
  var nud = nudgeOffset(), live = liveTiles(), i;
  live.forEach(function (t) { placeTile(t, true, dt, nud); });
  for (i = dying.length - 1; i >= 0; i--) {
    if (clock > dying[i].deadAt) { dying.splice(i, 1); continue; }
    placeTile(dying[i], false, dt, nud);
  }

  ctx.save();
  rr(ctx, BX, BY, S, S, S * 0.04); ctx.clip();
  dying.forEach(function (t) { if (t.fx.kind === 'away' || t.fx.kind === 'exit') paintTile(t, pk); });
  live.sort(function (a, b) { return (a._top ? 1 : 0) - (b._top ? 1 : 0); });
  live.forEach(function (t) { paintTile(t, pk); });
  drawComets();
  dying.forEach(function (t) { if (t.fx.kind !== 'away' && t.fx.kind !== 'exit') paintTile(t, pk); });
  ctx.restore();

  setWorld();
  drawSides();
  drawWallFlash(P);
  drawFx();
  drawParticles(dt);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (flashA > 0.002) { ctx.fillStyle = 'rgba(255,255,240,' + flashA * 0.5 + ')'; ctx.fillRect(0, 0, W, H); flashA *= Math.exp(-dt * 10); }
  drawDebug(P, mix);

  if (gameOver && clock > gameOverAt) {
    var a = clamp((clock - gameOverAt) / 0.4, 0, 1);
    ctx.fillStyle = css(mix('bg'), 0.75 * a); rr(ctx, BX, BY, S, S, S * 0.04); ctx.fill();
    ctx.globalAlpha = a; ctx.fillStyle = css(mix('ink')); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 30px ' + FONT; ctx.fillText('No moves left', BX + S / 2, BY + S / 2 - 14);
    ctx.font = '600 14px ' + FONT; ctx.fillText('Tap to restart · Undo to go back', BX + S / 2, BY + S / 2 + 18);
    ctx.globalAlpha = 1;
    buttons.push({ x: BX, y: BY, w: S, h: S, fn: newGame });
  }
  if (showPalettes) drawPalettes();
}

function frame(ts) {
  var now = ts / 1000, dt = lastTs ? Math.min(0.05, now - lastTs) : 1 / 60;
  if (lastTs) {
    fps += (1 / Math.max(0.001, now - lastTs) - fps) * 0.05;
    var ms = (now - lastTs) * 1000;
    if (ms > worstMs || clock - worstT > 3) { worstMs = ms; worstT = clock; }
  }
  lastTs = now; clock += dt;
  dispScore += (score - dispScore) * Math.min(1, dt * 12);
  if (Math.abs(score - dispScore) < 0.5) dispScore = score;
  for (var i = events.length - 1; i >= 0; i--) {
    if (clock >= events[i].at) { var f = events[i].fn; events.splice(i, 1); f(); }
  }
  try { draw(dt); } catch (e) { lastError = String(e && e.message || e); }
  requestAnimationFrame(frame);
}

// -------------------------------------------------------------------- input
var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
             a: 'left', d: 'right', w: 'up', s: 'down', q: 'left', z: 'up' };
window.addEventListener('keydown', function (e) {
  var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYS[k]) { e.preventDefault(); doMove(KEYS[k]); return; }
  if (k === '[') setStage(stage - 1);
  else if (k === ']') setStage(stage + 1);
  else if (k === 'p') showPalettes = !showPalettes;
  else if (k === 'u') undo();
  else if (k === 'r') newGame();
  else if (k === 't') autoPowers = !autoPowers;
  else if (k === 'm') cycleMaterial();
  else if (k === 'v') fillAllValues();
  else if (k === 'Escape') showPalettes = false;
});

cv.addEventListener('pointerdown', function (e) {
  var x = e.clientX, y = e.clientY;
  for (var i = buttons.length - 1; i >= 0; i--) {
    var b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); e.preventDefault(); return; }
  }
  if (showPalettes) return;
  drag = { x0: x, y0: y, id: e.pointerId, done: false };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
function dragDir(dx, dy) {
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}
cv.addEventListener('pointermove', function (e) {
  if (!drag || drag.done || e.pointerId !== drag.id) return;
  var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) { leanTarget = 0; return; }
  var dir = dragDir(dx, dy), along = Math.abs(dir === 'left' || dir === 'right' ? dx : dy);
  setPreview(dir);
  leanTarget = 1 - Math.exp(-along / (CELL * 0.45));
  if (along > CELL * COMMIT_DRAG) { drag.done = true; leanTarget = 0; doMove(dir); }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.done) {
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    var dir = dragDir(dx, dy), along = Math.abs(dir === 'left' || dir === 'right' ? dx : dy);
    leanTarget = 0;
    if (along > Math.max(22, CELL * RELEASE_DRAG)) doMove(dir);
  }
  leanTarget = 0;
  drag = null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
// One tile of every value, 2 to 65536, in reading order: the whole ladder of
// the current palette, material and premium tiers on the real board.
// The board is full and has no twin, so Undo is the way back to the game.
function fillAllValues() {
  if (showPalettes) return;
  pushUndo();
  grid = []; dying = [];
  for (var i = 0; i < N * N; i++) {
    var t = makeTile(2 << i, i % N, Math.floor(i / N));
    t.born = clock + i * 0.03;
    grid.push(t);
  }
  gameOver = false; previewDirty = true;
}
function cycleMaterial() { matMode = MAT_ORDER[(MAT_ORDER.indexOf(matMode) + 1) % MAT_ORDER.length]; }
window.addEventListener('resize', layout);
window.addEventListener('error', function (e) { lastError = e.message; });

// ----------------------------------------------------------------- autoplay
// ?autoplay=1 — random moves, every power forced in turn; for a quick look.
if (/autoplay=1/.test(location.search)) {
  var apStep = 0;
  setInterval(function () {
    if (gameOver) { newGame(); return; }
    if (apStep % 3 === 0) addPower(POWERS[(apStep / 3) % POWERS.length].key);
    var order = shuffle(SIDES.slice());
    for (var i = 0; i < order.length; i++) if (doMove(order[i])) break;
    if (apStep % 8 === 7) setStage(stage + 2);
    apStep++;
  }, 260);
}

layout();
loadTextures();
newGame();
requestAnimationFrame(frame);
</script>
</body>
</html>
