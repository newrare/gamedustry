}
function overFed(pj) { return pj.owner === BLUE ? Math.max(0, pj.n + pj.prod - GRAIN_FEED) : 0; }
var PJ = null;

function draw() {
  F = phase === "plan" ? forecast(dragExtra()) : null;
  PJ = F ? projected() : null;
  ctx.fillStyle = "#10141c";
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(mapCv, 0, MY0, MW, MH);

  // border marks: bridges and passes
  for (var bk in borders) {
    var bm = bmid[bk];
    if (!bm) continue;
    if (borders[bk] === "bridge") chip(bm.x, bm.y, "bridge", "#8a5a2a", "#fff", 18);
    if (borders[bk] === "mountain") { ctx.font = "34px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("⛰⛰", bm.x, bm.y); }
    if (borders[bk] === "pass") chip(bm.x, bm.y, "pass", "#c9a46a", "#2a1a00", 18);
  }
  works.forEach(function (w) {
    var at = w.kind === "bridge" ? bmid[key(w.at, w.to)] : { x: regions[w.at].cx, y: regions[w.at].cy - 84 };
    if (at) chip(at.x, at.y, "🔨 " + w.kind + " " + w.left, "#5a4a2a", "#fff", 18);
  });

  // the storm, and where it will be at the bell
  if (storm) {
    var ns = nextStorm();
    ctx.fillStyle = "rgba(60,64,80,0.55)";
    ctx.beginPath(); ctx.arc(storm.x, storm.y, STORM_R, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(230,230,255,0.8)";
    ctx.beginPath(); ctx.arc(ns.x, ns.y, STORM_R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    arrow({ cx: storm.x, cy: storm.y }, { cx: ns.x, cy: ns.y }, "rgba(230,230,255,0.7)", "", true, 4);
    chip(storm.x, storm.y, "⛈ storm", "rgba(20,24,36,0.8)");
    chip(ns.x, ns.y + STORM_R - 16, "at the bell", "rgba(20,24,36,0.8)", "#ddd", 18);
  }

  if (phase !== "resolve") {
    // standing orders: dotted, they fire by themselves
    for (var sk in standing) {
      var s = standing[sk];
      arrow(regions[sk], regions[s.to], "rgba(220,220,220,0.7)", s.cond === "attacked" ? "if attacked" : "if lost", true, 3);
    }
    // the AI's orders, where something shows them
    aiPlans(true).forEach(function (pl) {
      var ar = regions[pl.from];
      if (pl.o.kind === "fire") { arrow(ar, regions[pl.o.to], GHOST[pl.camp], "💥 −" + CANNON_DAMAGE, true, 5); return; }
      var n = pl.o.n != null ? Math.min(pl.o.n, ar.troops) : ar.troops;
      arrow(ar, regions[pl.o.to], GHOST[pl.camp], WHO[pl.camp] + " " + n, true, 5);
    });
    // couriers that arrived: these orders leave at this bell
    courierDue.forEach(function (d) {
      var r = regions[d.from];
      var tip = arrow(r, regions[d.o.to], "rgba(160,205,255,0.95)", "📯 " + orderLabel(d.from, d.o));
      drawVerdict(d.o.to, tip);
    });
    // the player's orders
    playerOrderList().forEach(function (it) {
      var o = it.o, r = regions[it.from], to = regions[o.to];
      if (o.kind === "fire") { arrow(r, to, "rgba(255,170,90,0.95)", "💥 −" + CANNON_DAMAGE, true, 5); return; }
      // a cavalry order rides beside the foot one, a little to its side
      if (cavSlot(o)) {
        var dx = to.cx - r.cx, dy = to.cy - r.cy, l = Math.hypot(dx, dy) || 1;
        r = { cx: r.cx - dy / l * 14, cy: r.cy + dx / l * 14 };
        to = { cx: to.cx - dy / l * 14, cy: to.cy + dx / l * 14 };
      }
      var c = classifyOrder(it.from, o, BLUE);
      var later = c.ok && (c.delayed || c.eta > 0);
      var label = orderLabel(it.from, o) + (o.auto ? " · standing" : "");
      var tip2 = arrow(r, to, later ? LATER_COL : "rgba(160,205,255,0.95)", label, later);
      if (!c.ok) chip(tip2.x, tip2.y, "✗ " + (c.why || "refused"), BAD_COL);
      else if (later) chip(tip2.x, tip2.y, c.delayed ? "📯 +1 bell" : "+1 bell", "#b07a10");
      else drawVerdict(o.to, tip2);
    });
  }
  if (drag) drawDrag();
  if (mode) {
    land.forEach(function (r) {
      if (!modeTarget(r.id)) return;
      ctx.beginPath(); ctx.arc(r.cx, r.cy, 34, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = "#ffd34d"; ctx.stroke();
    });
  }

  // regions: buildings, token, pieces, badges
  var oos = outOfSupply();
  land.forEach(function (r) {
    var vis = seen[r.id];
    if (vis || r.owner === BLUE) {
      if (r.capital) crown(r.cx, r.cy - 40, "#ffd34d");
      else if (r.city) star(r.cx, r.cy - 38, 14, "#ffd34d");
      var icons = [];
      for (var b in BUILD_ICON) if (r[b]) icons.push(BUILD_ICON[b]);
      if (icons.length) {
        ctx.font = "22px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(icons.join(""), r.cx + (r.capital || r.city ? 44 : 0), r.cy - 40);
      }
    }
    var n = r.troops;
    if (phase === "resolve") anim.forEach(function (m) { if (m.src === r.id) n -= m.n0; });
    if (!vis) { token(r.cx, r.cy, "?", r.owner === BLUE ? BLUE : NEUTRAL); return; }
    token(r.cx, r.cy, n, r.owner);
    var pieces = [];
    for (var pk in PIECE_ICON) if (r[pk]) pieces.push(PIECE_ICON[pk]);
    if (r.cav) pieces.push("🐎" + r.cav);
    if (balloon === r.id) pieces.push("🎈");
    if (pieces.length) {
      ctx.font = "20px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.fillText(pieces.join(" "), r.cx, r.cy + 38);
    }
    if (PJ && PJ[r.id].prod) {
      // next bell's production, as a ghost beside the troops: 5 +2
      ctx.globalAlpha = 0.6;
      chip(r.cx + 38, r.cy - 16, "+" + PJ[r.id].prod, "rgba(255,211,77,0.35)", "#ffe9a0", 18);
      ctx.globalAlpha = 1;
    }
    if (rules.morale && r.morale && r.owner !== NEUTRAL) chip(r.cx - 38, r.cy + 18, "♥" + (r.morale > 0 ? "+" : "") + r.morale, r.morale > 0 ? "#8a3a8a" : "#555", "#fff", 18);
    if (r.owner !== BLUE) return;
    if (F) drawShield(r);
    if (oos[r.id]) {
      ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 4; ctx.strokeStyle = BAD_COL;
      ctx.beginPath(); ctx.arc(r.cx, r.cy, 30, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      chip(r.cx + 40, r.cy + 18, "−1 supply", BAD_COL, "#fff", 18);
    }
    var eats = PJ ? overFed(PJ[r.id]) : 0;
    if (rules.grain && eats) {
      ctx.lineWidth = 4; ctx.strokeStyle = RISK_COL;
      ctx.beginPath(); ctx.arc(r.cx, r.cy, 27, 0, Math.PI * 2); ctx.stroke();
      chip(r.cx + 40, r.cy + 18, "eats " + eats, RISK_COL, "#2a1a00", 18);
    }
    if (rules.revolt && !r.capital && tick - r.takenAt < REVOLT_TICKS && r.troops < REVOLT_TROOPS) {
      chip(r.cx + 40, r.cy + 18, "revolt " + Math.round(REVOLT_CHANCE * 100) + "%", "#965abe", "#fff", 18);
    }
    if (r.wonder) chip(r.cx, r.cy - 76, "🏛 " + wonderHold[BLUE] + "/" + WONDER_HOLD, "#6a5a20", "#fff", 18);
  });

  // columns on the road: gone from home, defending nothing, landing next bell
  if (phase === "plan") transit.forEach(function (t) {
    ctx.globalAlpha = 0.35;
    arrow(regions[t.from], regions[t.to], LATER_COL, "", true, 5);
    ctx.globalAlpha = 1;
    token(t.x, t.y, t.n, t.camp, 18);
    var ns2 = nextStorm(), hit = ns2 && t.kind === "fleet" && Math.hypot(ns2.x - t.x, ns2.y - t.y) < STORM_R;
    chip(t.x, t.y + 32, hit ? "⛈ −" + Math.round(t.n * STORM_LOSS) + " at the bell" : "lands at the bell", hit ? BAD_COL : "#b07a10", "#fff", 18);
    arrow({ cx: t.x, cy: t.y }, regions[t.to], LATER_COL, "", true, 4);
  });

  if (phase === "resolve") {
    var tt = Math.min(1, animT / animLen());
    anim.forEach(function (m) {
      var e = ease(tt);
      if (m.clash && tt > 0.5 && m.n === 0) return;
      var x = m.a.cx + (m.b.cx - m.a.cx) * e, y = m.a.cy + (m.b.cy - m.a.cy) * e;
      token(x, y, m.clash && tt < 0.5 ? m.n0 : m.n, m.camp, 17);
    });
  }

  floaters.forEach(function (f) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 1.6);
    ctx.fillStyle = f.col; ctx.font = "bold 22px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.text, f.x, f.y - f.t * 24);
    ctx.globalAlpha = 1;
  });

  if (bubble && phase === "plan") drawBubble();
  drawHud();
  drawBottom();
  if (menuOpen) drawMenu();
  else if (pickDoctrine) drawDoctrine();
  else if (outcome) drawOutcome();
}

function drawVerdict(t, tip) {
  if (!F) return;
  var v = verdict(t, F);
  if (v) chip(tip.x, tip.y, v.text, v.col);
}

// A frontier region of yours: green holds against every enemy neighbour
// striking at once, red falls (with the troops that could come), ? unknown.
function drawShield(r) {
  var w = F.worst[r.id], now = F.now[r.id], th = F.threat[r.id] || 0;
  if (!w && !now) return;
  if (!th && !(now && now.fight)) return;
  var x = r.cx - 38, y = r.cy - 14, text, col;
  if (now && now.fight && now.owner !== BLUE) { text = "✗ falls"; col = BAD_COL; }
  else if (F.unknown[r.id]) { text = "🛡?"; col = RISK_COL; }
  else if (w && w.owner !== BLUE) { text = "⚠" + th; col = BAD_COL; }
  else { text = "🛡"; col = OK_COL; }
  chip(x, y, text, col, "#fff", 18);
}

function dragExtra() {
  if (!drag || hover < 0) return null;
  var c = classify(drag.from, hover, null, BLUE);
  if (!c.ok || c.delayed || c.eta > 0) return null;
  return { camp: BLUE, from: drag.from, o: dragOrder(drag.from, hover) };
}

function dragOrder(from, to) {
  var c = classify(from, to, null, BLUE);
  return c.kind === "cav" ? { to: to, frac: 1, kind: "cav", unit: "cav" } : { to: to, frac: 1, kind: c.kind };
}

function drawDrag() {
  var from = drag.from;
  land.forEach(function (rn) {
    if (rn.id === from) return;
    var c = classify(from, rn.id, null, BLUE);
    if (!c.ok && !c.why) return;
    ctx.save();
    ctx.lineWidth = 4;
    if (!c.ok) {
      ctx.strokeStyle = BAD_COL;
      ctx.beginPath(); ctx.moveTo(rn.cx - 14, rn.cy - 14); ctx.lineTo(rn.cx + 14, rn.cy + 14);
      ctx.moveTo(rn.cx + 14, rn.cy - 14); ctx.lineTo(rn.cx - 14, rn.cy + 14); ctx.stroke();
    } else {
      var later = c.delayed || c.eta > 0;
      ctx.strokeStyle = later ? LATER_COL : "rgba(255,255,255,0.75)";
      if (later) ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.arc(rn.cx, rn.cy, 34, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      if (later) chip(rn.cx + 30, rn.cy - 30, "+1", "#b07a10", "#fff", 18);
      if (c.kind === "cav") chip(rn.cx - 30, rn.cy - 30, "🐎", "#333", "#fff", 18);
      if (c.kind === "fleet") chip(rn.cx - 30, rn.cy - 30, "⚓", "#333", "#fff", 18);
    }
    ctx.restore();
  });
  var rf = regions[from];
  ctx.beginPath(); ctx.moveTo(rf.cx, rf.cy); ctx.lineTo(drag.x, drag.y);
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.stroke();
}

function resourceLine() {
  var L = [];
  if (rules.gold || rules.spy || rules.courier) {
    var inc = 0;
    land.forEach(function (r) { if (r.mine && r.owner === BLUE) inc += doctrine === "merchant" ? 2 : MINE_GOLD; });
    L.push("Gold " + gold[BLUE] + (inc ? " (+" + inc + "/bell)" : ""));
  }
  if (rules.grain) {
    var farms = 0, eat = 0;
    land.forEach(function (r) {
      var pj = PJ ? PJ[r.id] : { owner: r.owner, n: r.troops, prod: 0 };
      if (pj.owner !== BLUE) return;
      if (r.farm) farms += FARM_GRAIN;
      eat += overFed(pj);
    });
    var after = grain + farms - eat;
    L.push("Grain " + grain + " +" + farms + " farm −" + eat + " eaten = " + after + (after < 0 ? " → 1 deserts per orange ring" : ""));
  }
  if (rules.winter) {
    var left = SEASON_LEN - (tick + seasonShift) % SEASON_LEN;
    L.push(isWinter() ? "❄ Winter · spring in " + left : "Summer · winter in " + left);
  }
  if (rules.wonder) L.push("Wonder: you " + wonderHold[BLUE] + "/" + WONDER_HOLD + ", red " + wonderHold[RED]);
  if (rules.truce) aiCamps.forEach(function (c) {
    var t = truce[c] > tick ? "truce " + (truce[c] - tick) : "war";
    L.push(WHO[c] + ": " + t + (temper[c] ? " (" + temper[c] + ")" : ""));
  });
  if (doctrine) L.push("Doctrine: " + doctrine);
  if (captured[RED]) L.push("Red general captured");
  if (captured[BLUE]) L.push("Your general is captured");
  return L.join(" · ");
}

// What happens at this bell, and what waits for the next one.
function agenda() {
  var now = 0, next = [];
  playerOrderList().forEach(function (it) {
    if (it.o.kind === "fire") { now++; return; }
    var c = classifyOrder(it.from, it.o, BLUE);
    if (!c.ok) return;
    if (c.delayed) next.push("courier"); else if (c.eta > 0) next.push(c.kind === "fleet" ? "at sea" : "on the road"); else now++;
  });
  now += courierDue.length;
  transit.forEach(function (t) { if (t.camp === BLUE && t.land === tick) now++; });
  return "This bell: " + now + " · next bell: " + (next.length ? next.length + " (" + next.join(", ") + ")" : "0");
}

function drawHud() {
  var tl = TICK_PRESETS[tickIx];
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#fff"; ctx.font = "bold 26px system-ui, sans-serif";
  ctx.fillText(sc.lv + " · " + sc.name, 16, 32);
  ctx.font = "20px system-ui, sans-serif"; ctx.fillStyle = "#cfd6e4";
  wrap(sc.rule, 16, 60, W - 32, 24, 2);
  ctx.font = "bold 21px system-ui, sans-serif"; ctx.fillStyle = "#ffd34d";
  ctx.fillText("Goal: " + sc.goal, 16, 114, W - 32);
  ctx.font = "20px system-ui, sans-serif"; ctx.fillStyle = "#cfd6e4";
  var clock = phase === "resolve" ? "resolving…" : "bell in " + fmt(tl - timer);
  ctx.fillText("Tick " + (tick + 1) + " · " + clock + (paused ? " · paused" : "") + " · " + agenda(), 16, 142, W - 32);
  ctx.fillStyle = "#2a3242"; ctx.fillRect(16, 152, W - 32, 6);
  ctx.fillStyle = "#ffd34d"; ctx.fillRect(16, 152, (W - 32) * (phase === "resolve" ? 1 : timer / tl), 6);
  var res = resourceLine();
  if (res) { ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui, sans-serif"; ctx.fillText(res, 16, 182, W - 32); }
}

function wrap(text, x, y, w, lh, max) {
  var words = text.split(" "), line = "", n = 0;
  for (var i = 0; i < words.length; i++) {
    var t = line ? line + " " + words[i] : words[i];
    if (ctx.measureText(t).width > w && line) {
      ctx.fillText(line, x, y + n * lh, w); n++; line = words[i];
      if (n >= max) return;
    } else line = t;
  }
  if (line && n < max) ctx.fillText(line, x, y + n * lh, w);
}

// ---- the panel: the arithmetic of a fight -----------------------------------
function partsText(parts) {
  var extra = parts.slice(1).filter(function (p) { return p.v; }).map(function (p) { return p.t + " " + sgn(p.v); });
  return extra.length ? " [" + extra.join(", ") + "]" : "";
}

function sideText(s, res) {
  if (s === res.def) return s.raw + " × " + r1(s.k) + partsText(s.parts) + " = " + r1(s.str);
  return s.items.map(function (m) {
    var k = mult(m.parts);
    return m.n + (k !== 1 ? " × " + r1(k) : "") + partsText(m.parts);
  }).join(" + ") + " = " + r1(s.str);
}

function resultText(res, camp) {
  if (!res) return "?";
  if (res.tie) return "tie, nobody keeps a troop";
  if (res.owner === camp) return (res.def.camp === camp ? "held, " : "taken, ") + res.left + " left";
  return "lost to " + WHO[res.owner] + (sideOf(res, camp) ? ", " + needMore(res, camp) + " more needed" : "");
}

function orderLines(from, to, o, Fc) {
  var c = o.kind === "fire" ? { ok: true, kind: "fire", tags: [] } : classifyOrder(from, o, BLUE);
  var L = [];
  var head = regions[from].name + " → " + regions[to].name;
  if (!c.ok) return [head, "Refused: " + (c.why || "not a neighbour")];
  if (c.kind === "fire") return [head + " · cannon", "Fires first: −" + CANNON_DAMAGE + " in " + regions[to].name + " before anything moves; the cannon's region stays put."];
  L.push(head + " · " + orderLabel(from, o) + (c.tags.length ? " · " + c.tags.join(", ") : ""));
  if (c.delayed) { L.push("The courier needs a bell: the troops leave at the NEXT bell, with what is there then."); return L; }
  if (c.eta > 0) { L.push("On the road for a bell: gone from home now, it lands at the NEXT bell, against what is there then."); return L; }
  if (!seen[to]) { L.push("Hidden by the fog: the defence is unknown (?)."); return L; }
  var res = Fc.now[to];
  if (!res) return L;
  var mine = sideOf(res, BLUE), def = res.def;
  if (def.camp === BLUE) L.push("Reinforcement: " + regions[to].name + " ends with " + res.left + (res.fight ? " after the fight" : ""));
  else L.push("Attack " + (mine ? sideText(mine, res) : "0") + "  vs  defence " + sideText(def, res));
  var w = Fc.worst[to];
  var tail = "";
  if (Fc.unknown[to]) tail = " · worst case: unknown, enemy troops in the fog";
  else if (w && w !== res) tail = " · worst case (" + threatNames(to) + " strike too): " + resultText(w, BLUE);
  L.push("Now: " + resultText(res, BLUE) + tail);
  return L;
}

function threatNames(t) {
  var by = {};
  adj[t].forEach(function (n) { var o = regions[n].owner; if (aiCamps.indexOf(o) >= 0) by[o] = (by[o] || 0) + regions[n].troops; });
  return Object.keys(by).map(function (c) { return WHO[c] + " " + by[c]; }).join(", ") || "nobody";
}

function defenceLine(r, Fc) {
  var w = Fc.worst[r.id], th = Fc.threat[r.id] || 0;
  if (!th) return "No enemy can reach " + r.name + " at this bell.";
  if (Fc.unknown[r.id]) return "Defence: an enemy neighbour is in the fog (?).";
  if (!w) return "";
  var att = w.sides.filter(function (s) { return s !== w.def; }).map(function (s) { return WHO[s.camp] + " " + sideText(s, w); }).join("; ");
  return "If every enemy neighbour strikes: " + sideText(w.def, w) + " vs " + att + " → " + resultText(w, BLUE);
}

function regionLine(r) {
  if (!seen[r.id]) return r.name + " · hidden by the fog";
  var L = [r.name, WHO[r.owner], r.troops + " troops" + (r.cav ? " (" + r.cav + " cavalry)" : "")];
  if (r.capital) L.push("capital +" + PROD_CAPITAL);
  else if (r.city) L.push("city +" + PROD_CITY);
  for (var b in BUILD_ICON) if (r[b]) L.push(b);
  for (var p in PIECE_ICON) if (r[p]) L.push(p);
  if (r.morale) L.push("morale " + sgn(r.morale));
  if (r.terrain !== "meadow") L.push(r.terrain);
  return L.join(" · ");
}

function takeLine(r) {
  if (!seen[r.id]) return "Its troops are unknown.";
  var parts = defParts(r.id, r.owner, r.general), k = mult(parts);
  return "To take it: more than " + r.troops + " × " + r1(k) + partsText(parts) + " = " + r1(r.troops * k) + " attack strength.";
}

function notes(r) {
  var L = [];
  if (lockedByCourier(r.id)) L.push("Its courier has arrived: its order leaves at this bell.");
  if (rules.courier && courierSteps(r.id) > COURIER_RANGE) L.push("Beyond the couriers' reach: its orders leave one bell late.");
  if (outOfSupply()[r.id]) L.push("Out of supply: −1 troop at the bell.");
  var eats = PJ ? overFed(PJ[r.id]) : 0;
  if (rules.grain && eats) L.push("After the bell it holds " + (PJ[r.id].n + PJ[r.id].prod) + ", " + eats + " over the " + GRAIN_FEED + " it feeds: they eat " + eats + " grain.");
  if (standing[r.id]) L.push("Standing order: " + (standing[r.id].cond === "attacked" ? "if " + regions[standing[r.id].to].name + " is attacked, reinforce it" : "if " + regions[standing[r.id].to].name + " is lost, retake it") + ".");
  return L;
}

function panelLines() {
  var L = [];
  if (phase !== "plan" || !F) return log.slice(-4);
  if (mode) {
    var what = { fire: "Fire cannon: tap the region to bombard (−" + CANNON_DAMAGE + " before anything moves).",
      lift: "Airlift: tap a region within reach (yellow rings). Up to " + LIFT_MAX + " troops land at this bell.",
      standA: "Standing order: tap the region of yours it reinforces the moment it is attacked.",
      standL: "Standing order: tap the region of yours it retakes, at the next bell, if it is lost.",
      balloon: "Move the balloon: tap a neighbouring region. It sees two regions around it.",
      bridge: "Bridge: tap the region across the river. Ready in " + WORK_TICKS + " bells." }[mode];
    return [what, "Tap a yellow ring, or the button again to cancel."];
  }
  if (bubble) return ["Pick how many go: each line forecasts its fight.", "✓ taken (troops left) · ✗ +N troops short · = tie · ⚠ the enemy can still stop it.", "Tap elsewhere to close without ordering."];
  if (drag && hover >= 0) return orderLines(drag.from, hover, dragOrder(drag.from, hover), F);
  if (selected >= 0) {
    var r = regions[selected];
    L.push(regionLine(r));
    if (r.owner === BLUE) {
      var o = orders[selected], oc = cavOrders[selected];
      // two orders (foot and cavalry): one line each, the route and its outcome
      var short = function (q) { var t = orderLines(selected, q.to, q, F); return t[0] + " → " + t[t.length - 1]; };
      if (o && oc) L.push(short(o), short(oc));
      else if (o || oc) L = L.concat(orderLines(selected, (o || oc).to, o || oc, F).slice(1));
      var dl = defenceLine(r, F);
      if (dl) L.push(dl);
      L = L.concat(notes(r));
    } else L.push(takeLine(r));
    return L;
  }
  return tick === 0 ? ["Try: " + sc.hint] : log.slice(-3).concat(["Try: " + sc.hint]);
}

function wrapLines(text, w) {
  var words = String(text).split(" "), out = [], line = "";
  words.forEach(function (wd) {
    var t = line ? line + " " + wd : wd;
    if (ctx.measureText(t).width > w && line) { out.push(line); line = wd; } else line = t;
  });
  if (line) out.push(line);
  return out;
}

function drawBottom() {
  var L = layoutActions();
  L.forEach(function (a) {
    ctx.fillStyle = mode && a.mode === mode || a.sel ? "#8a6a10" : a.on ? "#2f3a52" : "#222833";
    ctx.fillRect(a.x, a.y, a.w, a.h);
    ctx.strokeStyle = a.on ? "#6a7aa0" : "#333a48"; ctx.lineWidth = 2; ctx.strokeRect(a.x + 1, a.y + 1, a.w - 2, a.h - 2);
    ctx.fillStyle = a.on ? "#fff" : "#6a7080"; ctx.font = "bold 20px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(a.label, a.x + a.w / 2, a.y + a.h / 2 + 1);
  });
  ctx.fillStyle = "#151a24"; ctx.fillRect(0, 1064, W, 122);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  var row = 0;
  panelLines().forEach(function (l, i) {
    ctx.font = (i === 0 ? "bold " : "") + "20px system-ui, sans-serif";
    ctx.fillStyle = i === 0 ? "#fff" : "#cfd6e4";
    wrapLines(l, W - 32).forEach(function (t) {
      if (row < 5) ctx.fillText(t, 16, 1086 + row * 24, W - 32);
      row++;
    });
  });
  buttons.forEach(function (b) {
    ctx.fillStyle = b.send ? "#2b5aa8" : b.pause && paused ? "#8a6a10" : "#273044"; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = "#4a5670"; ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    if (b.send && phase === "plan") {
      var left = 1 - timer / TICK_PRESETS[tickIx];
      ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + 22, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left);
      ctx.lineWidth = 4; ctx.strokeStyle = "#ffd34d"; ctx.stroke();
    }
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(b.label(), b.x + b.w / 2, b.y + (b.send ? 56 : b.h / 2 + 1), b.w - 8);
  });
}

function drawMenu() {
  ctx.fillStyle = "rgba(8,10,16,0.95)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff"; ctx.font = "bold 28px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("Mechanics: pick one to test", 16, 54);
  SCENARIOS.forEach(function (s, i) {
    var b = menuBox(i);
    ctx.fillStyle = i === scIx ? "#2b5aa8" : "#222a3a"; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#fff"; ctx.font = "bold 21px system-ui, sans-serif"; ctx.textBaseline = "middle";
    ctx.fillText(s.lv + " · " + s.name, b.x + 12, b.y + b.h / 2 + 1, b.w - 20);
  });
  ctx.fillStyle = "#cfd6e4"; ctx.font = "20px system-ui, sans-serif"; ctx.textBaseline = "middle";
  ctx.fillText("Tick", 16, 1064);
  TICK_PRESETS.forEach(function (t, i) {
    var b = tickBox(i);
    ctx.fillStyle = i === tickIx ? "#2b5aa8" : "#222a3a"; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 20px system-ui, sans-serif";
    ctx.fillText(fmt(t), b.x + b.w / 2, b.y + b.h / 2 + 1);
    ctx.textAlign = "left";
  });
  ctx.fillStyle = "#273044"; ctx.fillRect(220, 1180, 280, 70);
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 22px system-ui, sans-serif";
  ctx.fillText("Close", 360, 1216);
}

function drawDoctrine() {
  ctx.fillStyle = "rgba(8,10,16,0.88)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff"; ctx.font = "bold 30px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("Pick a doctrine for this stage", W / 2, 360);
  DOCTRINES.forEach(function (d, i) {
    var b = doctrineBox(i);
    ctx.fillStyle = "#273a5a"; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#fff"; ctx.font = "bold 28px system-ui, sans-serif";
    ctx.fillText(d.name, W / 2, b.y + 40);
    ctx.font = "21px system-ui, sans-serif"; ctx.fillStyle = "#cfd6e4";
    ctx.fillText(d.text, W / 2, b.y + 82);
  });
}

function drawOutcome() {
  ctx.fillStyle = "rgba(8,10,16,0.75)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = outcome.win ? "#7fd18a" : "#ff8a7a";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold 56px system-ui, sans-serif";
  ctx.fillText(outcome.text, W / 2, 560);
  ctx.fillStyle = "#fff"; ctx.font = "24px system-ui, sans-serif";
  ctx.fillText(tick + " bell" + (tick > 1 ? "s" : "") + " · " + sc.goal, W / 2, 630, W - 40);
  ["Replay", "Next", "Mechanics"].forEach(function (t, i) {
    var b = outcomeBox(i);
    ctx.fillStyle = "#273044"; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#fff"; ctx.font = "bold 22px system-ui, sans-serif";
    ctx.fillText(t, b.x + b.w / 2, b.y + b.h / 2 + 1);
  });
}

// ---- loop -----------------------------------------------------------------
function animLen() { return ANIM_SECONDS / Math.min(SPEEDS[speedIx], 3); }

function update(dt) {
  floaters.forEach(function (f) { f.t += dt; });
  floaters = floaters.filter(function (f) { return f.t < 1.6; });
  if (menuOpen || pickDoctrine) return;
  if (phase === "plan" && !paused) {
    timer += dt * SPEEDS[speedIx];
    if (timer >= TICK_PRESETS[tickIx]) startResolve();
  } else if (phase === "resolve") {
    animT += dt;
    if (animT >= animLen()) applyResolve();
  }
}

function resize() {
  var dpr = window.devicePixelRatio || 1, ww = window.innerWidth, wh = window.innerHeight;
  fit.s = Math.min(ww / W, wh / H);
  fit.ox = (ww - W * fit.s) / 2; fit.oy = (wh - H * fit.s) / 2;
  cv.width = ww * dpr; cv.height = wh * dpr;
  cv.style.width = ww + "px"; cv.style.height = wh + "px";
  ctx.setTransform(dpr * fit.s, 0, 0, dpr * fit.s, fit.ox * dpr, fit.oy * dpr);
}
window.addEventListener("resize", resize);

var last = 0;
function frame(ts) {
  var dt = Math.min(0.1, (ts - last) / 1000 || 0);
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

resize();
load(Math.max(0, Math.min(SCENARIOS.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
requestAnimationFrame(frame);
</script>
