<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>parrynormal prototype</title>
<meta name="lab-game" content="parrynormal">
<style>
  html, body { margin: 0; height: 100%; background: #0b0712; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
<canvas id="cv"></canvas>
<script>
// ---------------------------------------------------------------------------
// Parrynormal - a remake of Magic Shield Brick, turned into a tower defense.
//
// A little witch stands in the middle of the screen with an arc of shield
// around her. On a phone it is steered with a DIAL at the bottom of the
// screen (the shield points where the thumb is on the dial, so the thumb
// never covers the action); on a desk it points at the mouse. The shield
// never closes: an opening always stays. Every impact makes it bounce.
//
// Balls bounce off the edges and are pulled towards her:
//   blue   - the witch's own: she LAUNCHES it (the hub of the dial, or a
//            click / SPACE on a desk), 3 at most, with a cooldown. A parry
//            sends it back out; every 5 parries it drops a brown ball. If it
//            gets through to her it costs no heart, but the shield is frozen
//            in place for 1 s.
//   brown  - a bonus ball: parrying it scores, touching the witch only
//            destroys it.
// Every ball that hits a MONSTER hurts it: the balls are the witch's
// ammunition, and the spin of the shield on a parry is how she aims.
//
// Monsters walk, fly, dig or hop towards the witch. The shield throws them
// far back (1 damage), and a monster thrown into another one hurts it and
// sends it flying too. A monster that reaches her costs a heart. A stage is
// won when every monster of it is gone. 30 stages in 5 biomes, each biome
// brings 4 monsters, each stage 1 or 2 kinds of them - 20 monsters.
//
// Before each stage a card announces the monsters, what each is weak to,
// and the player picks the SUPER POWERS for the stage: 2 slots, 3 from
// stage 10, 4 from stage 20. A new super power is found every few stages.
// In the round the supers are the buttons beside the dial, each with its
// own cooldown: fired at the right moment, they are the counter.
//
// Pickups float around the arena; any ball that touches one takes it, the
// brown balls too: star (the shield grows, progressively), pumpkin (blast,
// brown balls pop in a chain), candle (a turret for 12 s), tombstone (a wall
// the monsters must break), web (a zone that slows them), potion (brown
// balls split in two), heart.
//
// Keys: SPACE ball, Z X C V supers, 1-7 pickups, N brown ball, K clear the stage,
//       arrows turn the dial, P pause, R back to the stage card.
//       On the card: [ ] change stage, Enter fight.
// ---------------------------------------------------------------------------

// --- tunables --------------------------------------------------------------
var W = 720, H = 1280;              // design space, portrait
var CX = 360, CY = 590;             // the witch
var HERO_R = 46;
var SHIELD_R = 118;                 // radius of the shield's centre line
var SHIELD_W = 16;
var BASE_ARC = 70;                  // degrees covered at rest
var STAR_ARC = 40;                  // degrees added by one star
var STAR_TIME = 7;                  // seconds one star's share lasts
var MAX_ARC = 320;                  // never closed: 40 degrees stay open
var JAM_ARC = 28;                   // what an imp's blast leaves of it
var ARC_GROW = 110;                 // degrees per second, both ways
var LIVES = 3;

var BALL_R = 11;
var SPAWN_SPEED = 320;
var SPAWN_SPREAD = 25;
var SPAWN_WARN = 0.8;
var GRAVITY = 220;                  // px/s^2 towards the witch...
var GRAVITY_STAGE = 5;              // ...+ this per stage
var MAX_SPEED = 950;
var RESTITUTION = 0.9;
var REPEL_PUSH = 240;
var SPIN_KICK = 0.5;
var WALL_BOUNCE = 0.96;
var SUBSTEPS = 4;
var RICOCHETS_FOR_BROWN = 5;
var MAX_BROWN = 24;
var PARRY_SCORE = 10;
var COMBO_STEP = 10, MAX_MULT = 5;
var PERFECT_DEG = 8, PERFECT_SCORE = 20, PERFECT_SPEED = 1.3;

var MAX_BLUE = 3;                   // blue balls the witch may have out at once
var BALL_CD = 2;                    // seconds between two launches
var LAUNCH_SPEED = 620;
var SHIELD_LOCK = 1;                // seconds the shield is frozen by her own ball

var KNOCK_SPEED = 1150;             // px/s a monster is thrown back by the shield...
var KNOCK_DAMP = 3.5;               // ...slowing down like this: ~330 px of slide
var KNOCK_BOSS = 0.45;              // the dragon slides this share of it
var KNOCK_HIT = 280;                // faster than this, a thrown monster bowls others over
var KNOCK_PASS = 0.6;               // share of its speed it passes on

var SPRING_K = 900, SPRING_D = 16;  // the shield's bounce: stiffness, damping
var BOUNCE_SPREAD = 0.55;           // radians either side of the impact that dent

var SPIT_SPEED = 260, SPIT_R = 9;

var PICKUP_EVERY = 6, PICKUP_LIFE = 8, PICKUP_R = 26;
var CANDLE_TIME = 12, CANDLE_EVERY = 0.9, CANDLE_RANGE = 420;
var TOMB_HP = 6, TOMB_R = 30, TOMB_TIME = 25;
var WEB_TIME = 10, WEB_R = 110, WEB_SLOW = 0.35;
var BLAST_R = 190, BLAST_PUSH = 650, CHAIN_R = 85, CHAIN_DELAY = 0.08, POP_SCORE = 25;
var SPLIT_DEG = 22;

var FREEZE_TIME = 4, FREEZE_SCALE = 0.3;
var MOON_TIME = 4;
var SWEEP_TIME = 1.0;               // the broom: two turns in this long
var SALT_TIME = 5, SALT_R = 250;
var FAMILIAR_TIME = 8, FAMILIAR_R = 210, FAMILIAR_SPIN = 2.6;
var TOAD_TIME = 6;

var DIAL_X = 360, DIAL_Y = 1120, DIAL_R = 90;
var HUB_R = 36;                     // the dial's hub is the launch button
var SLOT_POS = [190, 530, 80, 640]; // super buttons, x, in the order slots open
var SLOT_Y = 1120, SLOT_R = 46;

var DEG = Math.PI / 180;

// --- the cast --------------------------------------------------------------
// beh is the behaviour (see updateEnemy), weak the supers that counter it.
var ENEMIES = [
  // haunted forest
  { key: "bat",       name: "Bat",        biome: 0, hp: 1, speed: 85,  r: 18, score: 30,  beh: "wobble",   weak: ["lightning", "familiars"], line: "Flutters straight at the witch" },
  { key: "jack",      name: "Jack",       biome: 0, hp: 3, speed: 50,  r: 26, score: 60,  beh: "walk",     weak: ["lightning", "meteor"],    line: "Slow, but takes three hits" },
  { key: "wisp",      name: "Wisp",       biome: 0, hp: 1, speed: 80,  r: 16, score: 40,  beh: "dash",     weak: ["freeze", "salt"],         line: "Dashes in, stops, dashes again" },
  { key: "spider",    name: "Spider",     biome: 0, hp: 2, speed: 70,  r: 22, score: 50,  beh: "pounce",   weak: ["freeze", "wave"],         line: "Waits at a distance, then leaps" },
  // graveyard
  { key: "zombie",    name: "Zombie",     biome: 1, hp: 5, speed: 32,  r: 26, score: 80,  beh: "walk",     weak: ["wave", "banish"],         line: "Very slow, very tough" },
  { key: "skeleton",  name: "Skeleton",   biome: 1, hp: 2, speed: 55,  r: 22, score: 60,  beh: "bones",    weak: ["lightning", "meteor"],    line: "Falls apart, then pulls itself together" },
  { key: "ghost",     name: "Ghost",      biome: 1, hp: 2, speed: 60,  r: 22, score: 60,  beh: "phase",    weak: ["lightning", "broom"],     line: "Balls pass through it when it fades" },
  { key: "mole",      name: "Gravedigger",biome: 1, hp: 2, speed: 70,  r: 22, score: 60,  beh: "burrow",   weak: ["wave", "lightning"],      line: "Digs its way in, out of reach" },
  // witch's swamp
  { key: "slime",     name: "Slime",      biome: 2, hp: 3, speed: 45,  r: 26, score: 50,  beh: "split",    weak: ["meteor", "wave"],         line: "Splits in two when it pops" },
  { key: "frog",      name: "Bullfrog",   biome: 2, hp: 2, speed: 55,  r: 22, score: 50,  beh: "hop",      weak: ["freeze", "salt"],         line: "Hops in long leaps" },
  { key: "mosquito",  name: "Mosquitoes", biome: 2, hp: 1, speed: 110, r: 11, score: 20,  beh: "swarm",    weak: ["wave", "familiars"],      line: "A buzzing swarm of five", group: 5 },
  { key: "shaman",    name: "Toad shaman",biome: 2, hp: 3, speed: 50,  r: 24, score: 80,  beh: "shooter",  weak: ["freeze", "lightning"],    line: "Spits from afar: parry the spit back" },
  // castle crypt
  { key: "knight",    name: "Knight",     biome: 3, hp: 5, speed: 40,  r: 26, score: 90,  beh: "armored",  weak: ["lightning", "meteor"],    line: "The shield cannot hurt its armour" },
  { key: "gargoyle",  name: "Gargoyle",   biome: 3, hp: 3, speed: 70,  r: 22, score: 80,  beh: "stone",    weak: ["lightning", "banish"],    line: "Turns to stone, out of harm's way" },
  { key: "vampire",   name: "Vampire",    biome: 3, hp: 3, speed: 40,  r: 22, score: 90,  beh: "teleport", weak: ["salt", "lightning"],      line: "Blinks from one side to the other" },
  { key: "rat",       name: "Rats",       biome: 3, hp: 1, speed: 125, r: 13, score: 20,  beh: "swarm",    weak: ["wave", "familiars"],      line: "A fast pack from one side", group: 4 },
  // dragon's throne
  { key: "imp",       name: "Imp",        biome: 4, hp: 1, speed: 110, r: 18, score: 50,  beh: "kamikaze", weak: ["salt", "meteor"],         line: "Blows up on the shield and jams it" },
  { key: "salamander",name: "Salamander", biome: 4, hp: 2, speed: 120, r: 20, score: 70,  beh: "spiral",   weak: ["freeze", "salt"],         line: "Spirals in from the side" },
  { key: "priest",    name: "Dark priest",biome: 4, hp: 3, speed: 45,  r: 22, score: 100, beh: "healer",   weak: ["lightning", "banish"],    line: "Heals the monsters around it" },
  { key: "dragon",    name: "Dragon",     biome: 4, hp: 30,speed: 25,  r: 52, score: 1000,beh: "boss",     weak: ["lightning", "banish"],    line: "The boss: breathes fire and charges" },
  // not one of the twenty: what a slime splits into
  { key: "slimelet",  name: "Slimelet",   biome: 2, hp: 1, speed: 75,  r: 15, score: 20,  beh: "walk",     weak: [], line: "", child: true }
];
var EN = {};
ENEMIES.forEach(function (e) { EN[e.key] = e; });

var BIOMES = [
  { name: "Haunted forest",  top: "#2b1636", mid: "#3a2a52", low: "#2a2740" },
  { name: "Graveyard",       top: "#141e2c", mid: "#283446", low: "#1b222e" },
  { name: "Witch's swamp",   top: "#10221a", mid: "#22402c", low: "#18281c" },
  { name: "Castle crypt",    top: "#23131a", mid: "#3c2128", low: "#21151a" },
  { name: "Dragon's throne", top: "#2c0d0d", mid: "#481a14", low: "#230f0f" }
];
// The six stages of a biome, as indices into its four monsters...
var PATTERN = [[0], [1], [0, 1], [2], [3], [2, 3]];
// ...except the last biome, whose priest needs company and whose last stage is the boss.
var FINAL = [["imp"], ["salamander"], ["imp", "salamander"], ["priest", "salamander"], ["priest", "imp"], ["dragon", "imp"]];

var SUPERS = [
  { key: "lightning", name: "Lightning",  from: 1,  cd: 12, col: "#9fd8ff", line: "Strikes the 3 nearest monsters" },
  { key: "freeze",    name: "Freeze",     from: 1,  cd: 16, col: "#bff4ff", line: "Everything at a crawl for 4 s" },
  { key: "wave",      name: "Shockwave",  from: 3,  cd: 14, col: "#ffd36b", line: "Throws every monster back, digs them up" },
  { key: "moon",      name: "Full moon",  from: 5,  cd: 20, col: "#3dff6a", line: "The shield opens wide for 4 s" },
  { key: "brew",      name: "Brew",       from: 8,  cd: 18, col: "#c07a44", line: "Six brown balls burst out" },
  { key: "familiars", name: "Familiars",  from: 10, cd: 22, col: "#d6a8ff", line: "Three bats circle the witch for 8 s" },
  { key: "meteor",    name: "Fire rain",  from: 13, cd: 20, col: "#ff7a3d", line: "Fireballs fall on the monsters" },
  { key: "salt",      name: "Salt circle",from: 16, cd: 24, col: "#ffffff", line: "Nothing gets in for 5 s" },
  { key: "broom",     name: "Broom",      from: 19, cd: 10, col: "#d29a55", line: "The shield sweeps two full turns" },
  { key: "toad",      name: "Toadify",    from: 22, cd: 28, col: "#7bd34a", line: "Every monster is a harmless toad for 6 s" },
  { key: "banish",    name: "Banish",     from: 25, cd: 30, col: "#ff5af0", line: "The toughest monster vanishes" }
];
var SU = {};
SUPERS.forEach(function (s) { SU[s.key] = s; });

var PICKUPS = [
  { key: "star",    name: "Star",      col: "#3dff6a", w: 3 },
  { key: "pumpkin", name: "Pumpkin",   col: "#ff8a1f", w: 1.5 },
  { key: "candle",  name: "Candle",    col: "#fff1c2", w: 1.5 },
  { key: "tomb",    name: "Tombstone", col: "#9aa4b8", w: 1.2 },
  { key: "web",     name: "Web",       col: "#e8e8f0", w: 1.2 },
  { key: "potion",  name: "Potion",    col: "#3fe0d0", w: 1.2 },
  { key: "heart",   name: "Heart",     col: "#e8364a", w: 0.6 }
];

function stageDef(n) {
  var b = Math.floor((n - 1) / 6), i = (n - 1) % 6;
  var types = b === 4 ? FINAL[i] : PATTERN[i].map(function (k) {
    return ENEMIES.filter(function (e) { return e.biome === b && !e.child; })[k].key;
  });
  return { n: n, biome: b, types: types, count: 6 + n, every: Math.max(1.2, 3.2 - n * 0.065) };
}
var FIRST = {};                     // the stage each monster first shows up on
for (var sn = 30; sn >= 1; sn--) stageDef(sn).types.forEach(function (k) { FIRST[k] = sn; });

function slotCount(n) { return n >= 20 ? 4 : n >= 10 ? 3 : 2; }
function unlocked(n) { return SUPERS.filter(function (s) { return s.from <= n; }); }

// --- canvas ----------------------------------------------------------------
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");
var scale = 1, dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.round(W * scale) + "px";
  cv.style.height = Math.round(H * scale) + "px";
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
}
window.addEventListener("resize", resize);
resize();

// --- state -----------------------------------------------------------------
var mode = "brief";                 // brief | play | clear | down
var stage = 1, def = stageDef(1);
var loadout = [];
var cds = {};                       // super key -> seconds left
var paused = false, modeTime = 0;
var balls, spits, enemies, queue, pending, pickups, towers, pops, rings, chain, bolts, meteors, familiars, stacks, fx;
var dialAngle, angle, prevAngle, omega, arcNow, lockAngle, ballCd, spring;
var score, combo, lives, hurt, flash, shake, playTime, pickupTimer, spawnTimer;
var keys = {}, ptrs = {};
// a desk aims with the mouse and needs no dial; the last pointer used decides
var desk = !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);

function wrap(a) {
  while (a > Math.PI) a -= 2 * Math.PI;
  while (a < -Math.PI) a += 2 * Math.PI;
  return a;
}
function rotate(vx, vy, a) {
  var c = Math.cos(a), s = Math.sin(a);
  return { x: vx * c - vy * s, y: vx * s + vy * c };
}
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function openBrief(n) {
  stage = Math.max(1, Math.min(30, n));
  def = stageDef(stage);
  mode = "brief"; modeTime = 0;
  var open = unlocked(stage), slots = slotCount(stage);
  loadout = loadout.filter(function (k) { return SU[k].from <= stage; });
  // a super found on this stage goes in, so it is met
  open.forEach(function (s) {
    if (s.from === stage && loadout.indexOf(s.key) < 0) {
      if (loadout.length >= slots) loadout.pop();
      loadout.push(s.key);
    }
  });
  // then what counters this stage's monsters, then anything
  var want = [];
  def.types.forEach(function (k) { EN[k].weak.forEach(function (w) { want.push(w); }); });
  open.forEach(function (s) { want.push(s.key); });
  for (var i = 0; i < want.length && loadout.length < slots; i++) {
    if (SU[want[i]].from <= stage && loadout.indexOf(want[i]) < 0) loadout.push(want[i]);
  }
  loadout = loadout.slice(0, slots);
  resetArena();
}

function resetArena() {
  balls = []; spits = []; enemies = []; pending = []; pickups = []; towers = [];
  pops = []; rings = []; chain = []; bolts = []; meteors = []; familiars = []; stacks = [];
  fx = { freeze: 0, moon: 0, sweep: 0, salt: 0, familiars: 0, jam: 0, lock: 0 };
  dialAngle = angle = prevAngle = lockAngle = -Math.PI / 2; omega = 0; arcNow = BASE_ARC;
  ballCd = 0; spring = { s: 0, v: 0, at: 0 };
  score = 0; combo = 0; lives = LIVES; hurt = 0; flash = 0; shake = 0;
  playTime = 0; pickupTimer = 4; spawnTimer = 2;
  queue = [];
  var others = def.types.filter(function (k) { return k !== "dragon"; });
  if (def.types.indexOf("dragon") >= 0) { queue.push("dragon"); spawnTimer = 3; }
  while (queue.length < def.count) queue.push(others[Math.floor(Math.random() * others.length)]);
  cds = {};
}

function startStage() {
  resetArena();
  mode = "play"; modeTime = 0;
}

function launchBall() {
  if (mode !== "play" || ballCd > 0 || countBalls("blue") >= MAX_BLUE) return;
  ballCd = BALL_CD;
  var o = SHIELD_R + SHIELD_W + BALL_R + 2, c = Math.cos(angle), s = Math.sin(angle);
  spawnBall("blue", CX + c * o, CY + s * o, c * LAUNCH_SPEED, s * LAUNCH_SPEED);
  kickShield(angle, -260);
}

// The bounce: a spring on the shield's radius, strongest where it was hit.
// A positive amount dents it in, a negative one pushes it out.
function kickShield(worldAngle, amount) {
  spring.at = wrap(worldAngle - angle);
  spring.v -= amount;
}

function edgePoint() {
  var a = Math.random() * Math.PI * 2;
  var dx = Math.cos(a), dy = Math.sin(a), m = 24;
  var tx = dx > 0 ? (W - m - CX) / dx : dx < 0 ? (m - CX) / dx : 1e9;
  var ty = dy > 0 ? (H - m - CY) / dy : dy < 0 ? (m - CY) / dy : 1e9;
  var t = Math.min(tx, ty);
  return { x: CX + dx * t, y: CY + dy * t };
}

function queueSpawn(p) {
  var e = edgePoint();
  p.x = e.x; p.y = e.y; p.t = SPAWN_WARN;
  pending.push(p);
}

function spawnBall(kind, x, y, vx, vy) {
  var b = { kind: kind, x: x, y: y, vx: vx, vy: vy, ric: 0, trail: [], doomed: false };
  balls.push(b);
  return b;
}

function newEnemy(key, x, y) {
  var d = EN[key];
  var e = { key: key, def: d, x: x, y: y, hp: d.hp, maxHp: d.hp, r: d.r, t: Math.random() * 2,
    st: 0, state: 0, stun: 0, noHit: 0, hitFlash: 0, toad: 0, dead: false, kx: 0, ky: 0, knockedBy: null,
    under: d.beh === "burrow", dir: Math.random() < 0.5 ? -1 : 1, cd: 0 };
  enemies.push(e);
  return e;
}

function spawnPending(p) {
  var d = EN[p.key], n = d.group || 1;
  var ux = (CX - p.x), uy = (CY - p.y), ul = Math.hypot(ux, uy) || 1;
  for (var i = 0; i < n; i++) {
    var off = (i - (n - 1) / 2) * 38;
    newEnemy(p.key, p.x - uy / ul * off - ux / ul * Math.abs(off) * 0.5, p.y + ux / ul * off - uy / ul * Math.abs(off) * 0.5);
  }
}

function countBalls(kind) {
  var n = 0, i;
  for (i = 0; i < balls.length; i++) if (balls[i].kind === kind) n++;
  for (i = 0; i < pending.length; i++) if (pending[i].kind === kind) n++;
  return n;
}

function monstersLeft() {
  var n = enemies.length, i;
  for (i = 0; i < queue.length; i++) n += EN[queue[i]].group || 1;
  for (i = 0; i < pending.length; i++) if (pending[i].kind === "enemy") n += EN[pending[i].key].group || 1;
  return n;
}

function dropBrown(b, spread) {
  if (countBalls("brown") >= MAX_BROWN) return;
  var v = rotate(b.vx, b.vy, spread);
  spawnBall("brown", b.x, b.y, v.x, v.y);
}

function pop(x, y, str, col, big) { pops.push({ x: x, y: y, str: str, col: col, t: 0, big: !!big }); }
function ring(x, y, r0, r1, life, col) { rings.push({ x: x, y: y, r0: r0, r1: r1, t: 0, life: life, col: col }); }
function mult() { return Math.min(MAX_MULT, 1 + Math.floor(combo / COMBO_STEP)); }
function gain(base, x, y, col, label) {
  var pts = base * mult();
  score += pts;
  pop(x, y, (label ? label + " " : "") + "+" + pts, col, !!label);
}

// --- the shield ------------------------------------------------------------
function arcDeg() { return fx.jam > 0 ? Math.min(arcNow, JAM_ARC) : arcNow; }

function onShield(x, y, r) {
  var dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy) || 1;
  if (d - r > SHIELD_R + SHIELD_W / 2 || d < SHIELD_R - SHIELD_W / 2) return null;
  var diff = wrap(Math.atan2(dy, dx) - angle);
  if (Math.abs(diff) <= arcDeg() * DEG / 2 + Math.asin(Math.min(1, r / d))) return { diff: diff };
  return null;
}

// Her own blue ball got through: no heart, but the shield is stuck for a moment.
function freezeShield() {
  combo = 0;
  lockAngle = angle;
  fx.lock = SHIELD_LOCK;
  pop(CX, CY - HERO_R - 60, "Shield frozen", "#cfeeff", true);
  ring(CX, CY, HERO_R, SHIELD_R + 30, 0.4, "200,235,255");
}

function hurtWitch() {
  if (mode !== "play") return;
  lives--; combo = 0; hurt = 0.7; shake = 0.3;
  pop(CX, CY - HERO_R - 60, "Ouch", "#ff5a6a", true);
  ring(CX, CY, HERO_R, HERO_R + 60, 0.4, "255,90,106");
  if (lives <= 0) { mode = "down"; modeTime = 0; }
}

// --- monsters --------------------------------------------------------------
function phased(e) { return e.def.beh === "phase" && !e.toad && (e.t % 2) < 0.9; }
function stoned(e) { return e.def.beh === "stone" && !e.toad && (e.t % 3.2) > 2.0; }

function hurtEnemy(e, dmg, src) {
  if (e.dead) return;
  var magic = src === "lightning" || src === "banish";
  if (!magic) {
    if (e.under && src !== "wave") return;
    if (phased(e) && src === "ball") return;
    if (stoned(e)) return;
    if (e.def.beh === "armored" && src === "shield" && !e.toad) return;
  }
  if (e.toad > 0 && e.def.beh !== "boss") dmg = e.hp;
  e.hp -= dmg; e.hitFlash = 0.12;
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e, final) {
  // a skeleton falls into a pile first, and pulls itself together unless hit again
  if (e.def.beh === "bones" && e.state === 0 && !final && !e.toad) {
    e.state = 1; e.st = 0; e.hp = 1;
    ring(e.x, e.y, 6, 40, 0.3, "235,235,220");
    return;
  }
  e.dead = true;
  ring(e.x, e.y, 6, e.r + 34, 0.35, "255,255,255");
  gain(e.def.score, e.x, e.y - e.r - 10, "#ffffff", e.def.child ? "" : e.def.name);
  if (e.def.beh === "split" && !final && !e.toad) {
    for (var i = -1; i <= 1; i += 2) newEnemy("slimelet", e.x + i * 22, e.y + i * 10);
  }
  if (e.def.beh === "kamikaze") explode(e.x, e.y, 110, 1);
}

// a small blast: hurts the monsters around, throws the balls
function explode(x, y, r, dmg) {
  ring(x, y, 10, r, 0.35, "255,138,31");
  for (var i = 0; i < enemies.length; i++) {
    var o = enemies[i];
    if (!o.dead && dist(o.x, o.y, x, y) < r + o.r) hurtEnemy(o, dmg, "fire");
  }
  for (var j = 0; j < balls.length; j++) {
    var b = balls[j], d = dist(b.x, b.y, x, y) || 1;
    if (d < r) { var k = (1 - d / r) * BLAST_PUSH * 0.6; b.vx += (b.x - x) / d * k; b.vy += (b.y - y) / d * k; }
  }
}

function advance(e, step) {
  var dx = CX - e.x, dy = CY - e.y, d = Math.hypot(dx, dy) || 1;
  e.x += dx / d * step; e.y += dy / d * step;
}

function sideStep(e, amount) {
  var dx = CX - e.x, dy = CY - e.y, d = Math.hypot(dx, dy) || 1;
  e.x += -dy / d * amount; e.y += dx / d * amount;
}

function spit(e, ang, fire) {
  var a = Math.atan2(CY - e.y, CX - e.x) + (ang || 0);
  spits.push({ x: e.x, y: e.y, vx: Math.cos(a) * SPIT_SPEED, vy: Math.sin(a) * SPIT_SPEED, fire: !!fire });
}

function webK(e) {
  for (var i = 0; i < towers.length; i++) {
    var t = towers[i];
    if (t.kind === "web" && dist(e.x, e.y, t.x, t.y) < WEB_R) return WEB_SLOW;
  }
  return 1;
}

function updateEnemy(e, wdt) {
  var edt = wdt * webK(e) * (e.toad > 0 ? 0.5 : 1);
  var sp = e.def.speed, d = dist(e.x, e.y, CX, CY);
  e.t += edt; e.hitFlash = Math.max(0, e.hitFlash - wdt); e.noHit = Math.max(0, e.noHit - wdt);
  e.toad = Math.max(0, e.toad - wdt);
  if (slide(e, wdt)) return;
  if (e.stun > 0) { e.stun -= edt; return; }

  if (e.toad > 0 && e.def.beh !== "boss") { advance(e, 35 * edt); return; }

  switch (e.def.beh) {
    case "walk": case "armored": case "split": case "kamikaze":
      advance(e, sp * edt); break;
    case "wobble":
      advance(e, sp * edt); sideStep(e, Math.cos(e.t * 2.2 * Math.PI * 2) * 150 * edt); break;
    case "swarm":
      advance(e, sp * edt); sideStep(e, Math.cos(e.t * 3 * Math.PI * 2) * 70 * edt); break;
    case "dash":
      if ((e.t % 1.2) < 0.5) advance(e, sp * 3 * edt); break;
    case "hop":
      if ((e.t % 1.1) < 0.35) advance(e, sp * 3.2 * edt); break;
    case "pounce":
      if (e.state === 0) { if (d > 270) advance(e, sp * edt); else { e.state = 1; e.st = 0; } }
      else if (e.state === 1) { e.st += edt; if (e.st > 0.9) e.state = 2; }
      else advance(e, 520 * edt);
      break;
    case "bones":
      if (e.state === 1) { e.st += edt; if (e.st > 2.5) { e.state = 0; e.hp = e.maxHp; ring(e.x, e.y, 6, 40, 0.3, "235,235,220"); } }
      else advance(e, sp * edt);
      break;
    case "phase":
      advance(e, sp * edt); break;
    case "burrow":
      advance(e, sp * edt);
      if (e.under && d < 230) { e.under = false; ring(e.x, e.y, 6, 50, 0.3, "150,110,70"); }
      break;
    case "shooter":
      if (d > 340) advance(e, sp * edt);
      else { e.st += edt; if (e.st > 2.2) { e.st = 0; spit(e, 0, false); } }
      break;
    case "stone":
      if (!stoned(e)) { advance(e, sp * edt); sideStep(e, Math.cos(e.t * 1.5 * Math.PI * 2) * 80 * edt); }
      break;
    case "teleport":
      advance(e, sp * edt);
      e.st += edt;
      if (e.st > 1.6) {
        e.st = 0;
        ring(e.x, e.y, 6, 36, 0.3, "160,40,60");
        var a = Math.atan2(e.y - CY, e.x - CX) + e.dir * (1 + Math.random());
        var nd = Math.max(250, d - 50);
        e.x = CX + Math.cos(a) * nd; e.y = CY + Math.sin(a) * nd;
        e.dir = -e.dir;
        ring(e.x, e.y, 36, 6, 0.3, "160,40,60");
      }
      break;
    case "spiral":
      sideStep(e, e.dir * sp * edt); advance(e, 38 * edt); break;
    case "healer":
      if (d > 360) advance(e, sp * edt);
      else {
        e.st += edt;
        if (e.st > 2) {
          e.st = 0;
          ring(e.x, e.y, 10, 220, 0.5, "90,255,120");
          for (var i = 0; i < enemies.length; i++) {
            var o = enemies[i];
            if (o !== e && !o.dead && o.hp < o.maxHp && dist(o.x, o.y, e.x, e.y) < 220) { o.hp++; pop(o.x, o.y - o.r - 8, "+1", "#5dff8c"); }
          }
        }
      }
      break;
    case "boss":
      if (e.state === 0) { if (d > 300) advance(e, sp * edt); else { e.state = 1; e.st = 0; e.cd = 0; } }
      else if (e.state === 1) {
        e.st += edt; e.cd += edt;
        if (e.cd > 2.6) { e.cd = 0; spit(e, -0.3, true); spit(e, 0, true); spit(e, 0.3, true); }
        if (e.st > 8) { e.state = 2; pop(e.x, e.y - e.r - 20, "Charge!", "#ff7a3d", true); }
      } else advance(e, 230 * edt);
      break;
  }
}

function throwBack(e, speed) {
  var dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
  var k = e.def.beh === "boss" ? KNOCK_BOSS : 1;
  e.kx = dx / d * speed * k; e.ky = dy / d * speed * k;
  e.knockedBy = null;
}

// A thrown monster slides out, slowing down, off the screen edges, and
// bowls over whatever it meets while it is still fast. True while sliding.
function slide(e, wdt) {
  var ks = Math.hypot(e.kx, e.ky);
  if (ks < 40) { e.kx = e.ky = 0; return false; }
  e.x += e.kx * wdt; e.y += e.ky * wdt;
  var f = Math.exp(-KNOCK_DAMP * wdt);
  e.kx *= f; e.ky *= f;
  if (e.x < e.r) { e.x = e.r; e.kx = Math.abs(e.kx) * 0.5; }
  if (e.x > W - e.r) { e.x = W - e.r; e.kx = -Math.abs(e.kx) * 0.5; }
  if (e.y < e.r) { e.y = e.r; e.ky = Math.abs(e.ky) * 0.5; }
  if (e.y > H - e.r) { e.y = H - e.r; e.ky = -Math.abs(e.ky) * 0.5; }
  if (ks > KNOCK_HIT && !e.under) {
    for (var i = 0; i < enemies.length; i++) {
      var o = enemies[i];
      if (o === e || o.dead || o.under || o.knockedBy === e) continue;
      if (dist(o.x, o.y, e.x, e.y) < o.r + e.r) {
        o.knockedBy = e;
        o.kx += e.kx * KNOCK_PASS; o.ky += e.ky * KNOCK_PASS;
        e.kx *= 0.5; e.ky *= 0.5;
        ring((o.x + e.x) / 2, (o.y + e.y) / 2, 6, 44, 0.3, "255,230,140");
        pop(o.x, o.y - o.r - 12, "Strike", "#ffe68c");
        hurtEnemy(o, 1, "knock");
      }
    }
  }
  return true;
}

function collideEnemy(e) {
  var dx = e.x - CX, dy = e.y - CY, d = Math.hypot(dx, dy) || 1;
  // tombstones stop them and get chewed
  for (var i = 0; i < towers.length; i++) {
    var t = towers[i];
    if (t.kind !== "tomb" || e.under) continue;
    var td = dist(e.x, e.y, t.x, t.y) || 1;
    if (td < TOMB_R + e.r) {
      e.x = t.x + (e.x - t.x) / td * (TOMB_R + e.r);
      e.y = t.y + (e.y - t.y) / td * (TOMB_R + e.r);
      t.hp -= 1 / 60;
    }
  }
  // the salt circle keeps out whoever is outside it
  if (fx.salt > 0 && !e.under && d < SALT_R + e.r && d > SALT_R - 40) {
    e.x = CX + dx / d * (SALT_R + e.r); e.y = CY + dy / d * (SALT_R + e.r);
    dx = e.x - CX; dy = e.y - CY; d = Math.hypot(dx, dy);
  }
  if (e.under || e.state === 1 && e.def.beh === "bones") return;

  if (e.noHit <= 0 && onShield(e.x, e.y, e.r)) {
    combo++; flash = 0.12;
    if (e.def.beh === "kamikaze" && !e.toad) {
      fx.jam = 1.5;
      pop(CX, CY - HERO_R - 90, "Shield jammed", "#ff7a3d", true);
      killEnemy(e);
      return;
    }
    var to = SHIELD_R + SHIELD_W / 2 + e.r + 4;
    e.x = CX + dx / d * to; e.y = CY + dy / d * to;
    throwBack(e, KNOCK_SPEED);
    e.noHit = 0.25;
    kickShield(Math.atan2(dy, dx), 520 + e.r * 8);
    if (e.def.beh === "pounce") e.state = 0;
    if (e.def.beh === "boss") { e.state = 1; e.st = 0; }
    hurtEnemy(e, 1, "shield");
    return;
  }
  if (d <= HERO_R + e.r) {
    if (e.toad > 0 && e.def.beh !== "boss") { e.dead = true; ring(e.x, e.y, 6, 30, 0.3, "123,211,74"); return; }
    hurtWitch();
    if (e.def.beh === "boss") { e.x = CX + dx / d * 380; e.y = CY + dy / d * 380; e.state = 1; e.st = 0; }
    else { e.dead = true; ring(e.x, e.y, 6, 40, 0.3, "255,90,106"); }
  }
}

// --- pickups ---------------------------------------------------------------
function spawnPickup(key) {
  if (!key) {
    var total = 0, i;
    for (i = 0; i < PICKUPS.length; i++) total += PICKUPS[i].w;
    var roll = Math.random() * total;
    for (i = 0; i < PICKUPS.length; i++) { roll -= PICKUPS[i].w; if (roll <= 0) break; }
    key = PICKUPS[Math.min(i, PICKUPS.length - 1)].key;
  }
  var a = Math.random() * Math.PI * 2, d = 200 + Math.random() * 230;
  var x = Math.max(60, Math.min(W - 60, CX + Math.cos(a) * d));
  var y = Math.max(200, Math.min(DIAL_Y - DIAL_R - 60, CY + Math.sin(a) * d));
  pickups.push({ key: key, x: x, y: y, t: PICKUP_LIFE });
  return pickups[pickups.length - 1];
}

function apply(key, x, y) {
  var pd = PICKUPS.filter(function (p) { return p.key === key; })[0];
  pop(x, y - 30, pd.name, pd.col, true);
  ring(x, y, 10, 70, 0.4, "255,255,255");
  if (key === "star") stacks.push(STAR_TIME);
  if (key === "pumpkin") blast(x, y);
  if (key === "candle") towers.push({ kind: "candle", x: x, y: y, t: CANDLE_TIME, cd: 0 });
  if (key === "tomb") towers.push({ kind: "tomb", x: x, y: y, t: TOMB_TIME, hp: TOMB_HP });
  if (key === "web") towers.push({ kind: "web", x: x, y: y, t: WEB_TIME });
  if (key === "heart") lives = Math.min(LIVES, lives + 1);
  if (key === "potion") {
    var browns = balls.filter(function (b) { return b.kind === "brown"; });
    if (!browns.length) balls.forEach(function (b) { dropBrown(b, SPLIT_DEG * DEG); });
    browns.forEach(function (b) {
      if (countBalls("brown") >= MAX_BROWN) return;
      var v = rotate(b.vx, b.vy, SPLIT_DEG * DEG), u = rotate(b.vx, b.vy, -SPLIT_DEG * DEG);
      b.vx = u.x; b.vy = u.y;
      spawnBall("brown", b.x, b.y, v.x, v.y);
    });
  }
}

// The pumpkin: monsters in range take 2, balls are thrown away, brown balls
// in range pop one after the other, each pop setting off its neighbours.
function blast(x, y) {
  ring(x, y, 20, BLAST_R, 0.45, "255,138,31");
  shake = 0.25;
  for (var e = 0; e < enemies.length; e++) {
    if (dist(enemies[e].x, enemies[e].y, x, y) < BLAST_R) hurtEnemy(enemies[e], 2, "fire");
  }
  for (var i = 0; i < balls.length; i++) {
    var b = balls[i], d = dist(b.x, b.y, x, y) || 1;
    if (d > BLAST_R) continue;
    var k = (1 - d / BLAST_R) * BLAST_PUSH;
    b.vx += (b.x - x) / d * k; b.vy += (b.y - y) / d * k;
    if (b.kind === "brown" && !b.doomed) { b.doomed = true; chain.push({ b: b, t: d / BLAST_R * 0.25 }); }
  }
}

function updateChain(dt) {
  for (var i = chain.length - 1; i >= 0; i--) {
    var c = chain[i];
    c.t -= dt;
    if (c.t > 0) continue;
    chain.splice(i, 1);
    var idx = balls.indexOf(c.b);
    if (idx < 0) continue;
    balls.splice(idx, 1);
    ring(c.b.x, c.b.y, 6, 50, 0.3, "255,170,60");
    gain(POP_SCORE, c.b.x, c.b.y - 16, "#ffb347");
    for (var e = 0; e < enemies.length; e++) {
      if (dist(enemies[e].x, enemies[e].y, c.b.x, c.b.y) < CHAIN_R) hurtEnemy(enemies[e], 1, "fire");
    }
    for (var j = 0; j < balls.length; j++) {
      var o = balls[j];
      if (o.kind === "brown" && !o.doomed && dist(o.x, o.y, c.b.x, c.b.y) < CHAIN_R) {
        o.doomed = true; chain.push({ b: o, t: CHAIN_DELAY });
      }
    }
  }
}

// --- super powers ----------------------------------------------------------
function fireSuper(slot) {
  var key = loadout[slot];
  if (!key || mode !== "play" || (cds[key] || 0) > 0) return;
  var s = SU[key];
  cds[key] = s.cd;
  pop(CX, CY - HERO_R - 120, s.name, s.col, true);
  var live = enemies.filter(function (e) { return !e.dead; });

  if (key === "lightning") {
    live.sort(function (a, b) { return dist(a.x, a.y, CX, CY) - dist(b.x, b.y, CX, CY); });
    live.slice(0, 3).forEach(function (e) {
      bolts.push({ x1: e.x + (Math.random() * 2 - 1) * 60, y1: 0, x2: e.x, y2: e.y, t: 0.3, col: "159,216,255", zig: true });
      e.under = false;
      hurtEnemy(e, 3, "lightning");
    });
  }
  if (key === "freeze") fx.freeze = FREEZE_TIME;
  if (key === "wave") {
    ring(CX, CY, SHIELD_R, 700, 0.5, "255,211,107");
    shake = 0.2;
    live.forEach(function (e) {
      var d = dist(e.x, e.y, CX, CY) || 1;
      e.under = false;
      throwBack(e, KNOCK_SPEED * (0.4 + 0.6 * Math.max(0, 1 - d / 900)));
      if (e.def.beh === "pounce") e.state = 0;
      hurtEnemy(e, 1, "wave");
    });
    spits = spits.filter(function (sp) { return dist(sp.x, sp.y, CX, CY) > 700; });
  }
  if (key === "moon") fx.moon = MOON_TIME;
  if (key === "brew") {
    for (var i = 0; i < 6; i++) {
      var a = angle + i * Math.PI / 3, o = SHIELD_R + SHIELD_W + BALL_R;
      spawnBall("brown", CX + Math.cos(a) * o, CY + Math.sin(a) * o, Math.cos(a) * 520, Math.sin(a) * 520);
    }
  }
  if (key === "familiars") {
    fx.familiars = FAMILIAR_TIME;
    familiars = [0, 1, 2].map(function (k) { return { a: k * Math.PI * 2 / 3, cd: 0 }; });
  }
  if (key === "meteor") {
    for (var m = 0; m < 6; m++) {
      var tgt = live.length ? live[m % live.length] : null;
      var mx = tgt ? tgt.x : 80 + Math.random() * (W - 160), my = tgt ? tgt.y : 220 + Math.random() * 700;
      meteors.push({ x: mx + (Math.random() * 2 - 1) * 20, y: my + (Math.random() * 2 - 1) * 20, t: 0.5 + m * 0.15, life: 0.5 + m * 0.15 });
    }
  }
  if (key === "salt") fx.salt = SALT_TIME;
  if (key === "broom") fx.sweep = SWEEP_TIME;
  if (key === "toad") live.forEach(function (e) { if (e.def.beh !== "boss") { e.toad = TOAD_TIME; e.under = false; } });
  if (key === "banish") {
    live.sort(function (a, b) { return b.hp - a.hp; });
    var top = live[0];
    if (top) {
      ring(top.x, top.y, top.r + 40, 4, 0.5, "255,90,240");
      if (top.def.beh === "boss") hurtEnemy(top, 10, "banish");
      else killEnemy(top, true);
    }
  }
}

// --- update ----------------------------------------------------------------
function update(dt) {
  modeTime += dt;
  if (paused) return;
  if (mode === "clear") {
    for (var q0 = pops.length - 1; q0 >= 0; q0--) { pops[q0].t += dt; if (pops[q0].t > 0.8) pops.splice(q0, 1); }
    if (modeTime > 1.8) openBrief(stage >= 30 ? 1 : stage + 1);
    return;
  }
  if (mode !== "play") return;
  playTime += dt;

  for (var c in cds) cds[c] = Math.max(0, cds[c] - dt);
  ballCd = Math.max(0, ballCd - dt);
  if (keys.ArrowLeft) dialAngle = wrap(dialAngle - 330 * DEG * dt);
  if (keys.ArrowRight) dialAngle = wrap(dialAngle + 330 * DEG * dt);
  for (var e in fx) fx[e] = Math.max(0, fx[e] - dt);
  var sweepOff = fx.sweep > 0 ? Math.PI * 4 * (1 - fx.sweep / SWEEP_TIME) : 0;
  angle = fx.lock > 0 ? lockAngle : wrap(dialAngle + sweepOff);

  var acc = -SPRING_K * spring.s - SPRING_D * spring.v;
  spring.v += acc * dt; spring.s += spring.v * dt;
  spring.s = Math.max(-26, Math.min(26, spring.s));
  var raw = wrap(angle - prevAngle) / Math.max(dt, 1e-4);
  omega = Math.max(-30, Math.min(30, omega * 0.7 + raw * 0.3));
  prevAngle = angle;

  for (var s = stacks.length - 1; s >= 0; s--) { stacks[s] -= dt; if (stacks[s] <= 0) stacks.splice(s, 1); }
  var target = fx.moon > 0 ? MAX_ARC : Math.min(MAX_ARC, BASE_ARC + stacks.length * STAR_ARC);
  var grow = (fx.moon > 0 ? 4 : 1) * ARC_GROW * dt;
  arcNow += Math.max(-grow, Math.min(grow, target - arcNow));

  hurt = Math.max(0, hurt - dt);
  flash = Math.max(0, flash - dt);
  shake = Math.max(0, shake - dt);
  for (var q = pops.length - 1; q >= 0; q--) { pops[q].t += dt; if (pops[q].t > 0.8) pops.splice(q, 1); }
  for (var r = rings.length - 1; r >= 0; r--) { rings[r].t += dt; if (rings[r].t > rings[r].life) rings.splice(r, 1); }
  for (var bo = bolts.length - 1; bo >= 0; bo--) { bolts[bo].t -= dt; if (bolts[bo].t <= 0) bolts.splice(bo, 1); }

  var wdt = dt * (fx.freeze > 0 ? FREEZE_SCALE : 1);   // the world's own clock
  var g = GRAVITY + GRAVITY_STAGE * stage;

  // spawning: the monsters come in turn
  spawnTimer -= wdt;
  if (spawnTimer <= 0 && queue.length) { spawnTimer = def.every; queueSpawn({ kind: "enemy", key: queue.shift() }); }
  for (var p = pending.length - 1; p >= 0; p--) {
    pending[p].t -= wdt;
    if (pending[p].t <= 0) { spawnPending(pending[p]); pending.splice(p, 1); }
  }
  pickupTimer -= wdt;
  if (pickupTimer <= 0) { pickupTimer = PICKUP_EVERY; spawnPickup(); }
  for (var k = pickups.length - 1; k >= 0; k--) { pickups[k].t -= wdt; if (pickups[k].t <= 0) pickups.splice(k, 1); }

  updateChain(wdt);
  updateTowers(wdt);
  updateMeteors(wdt);
  updateFamiliars(dt);
  for (var i = 0; i < enemies.length; i++) {
    if (enemies[i].dead) continue;
    updateEnemy(enemies[i], wdt);
    if (!enemies[i].dead) collideEnemy(enemies[i]);
    if (mode !== "play") return;
  }
  updateBalls(wdt, g);
  updateSpits(wdt);
  enemies = enemies.filter(function (en) { return !en.dead; });

  if (mode === "play" && monstersLeft() === 0) {
    mode = "clear"; modeTime = 0;
    pop(CX, CY - 200, stage >= 30 ? "All 30 stages cleared" : "Stage clear", "#ffd23a", true);
  }
}

function updateTowers(wdt) {
  for (var i = towers.length - 1; i >= 0; i--) {
    var t = towers[i];
    t.t -= wdt;
    if (t.kind === "candle") {
      t.cd -= wdt;
      if (t.cd <= 0) {
        var best = null, bd = CANDLE_RANGE;
        for (var e = 0; e < enemies.length; e++) {
          var en = enemies[e], d = dist(en.x, en.y, t.x, t.y);
          if (!en.dead && !en.under && d < bd) { bd = d; best = en; }
        }
        if (best) {
          t.cd = CANDLE_EVERY;
          bolts.push({ x1: t.x, y1: t.y - 26, x2: best.x, y2: best.y, t: 0.15, col: "255,200,90" });
          hurtEnemy(best, 1, "tower");
        }
      }
    }
    if (t.t <= 0 || (t.kind === "tomb" && t.hp <= 0)) {
      ring(t.x, t.y, 6, 40, 0.3, "200,200,210");
      towers.splice(i, 1);
    }
  }
}

function updateMeteors(wdt) {
  for (var i = meteors.length - 1; i >= 0; i--) {
    var m = meteors[i];
    m.t -= wdt;
    if (m.t > 0) continue;
    meteors.splice(i, 1);
    shake = 0.15;
    ring(m.x, m.y, 10, 95, 0.35, "255,122,61");
    for (var e = 0; e < enemies.length; e++) {
      if (dist(enemies[e].x, enemies[e].y, m.x, m.y) < 95 + enemies[e].r) hurtEnemy(enemies[e], 2, "fire");
    }
  }
}

function updateFamiliars(dt) {
  if (fx.familiars <= 0) { familiars = []; return; }
  for (var i = 0; i < familiars.length; i++) {
    var f = familiars[i];
    f.a += FAMILIAR_SPIN * dt;
    f.cd = Math.max(0, f.cd - dt);
    f.x = CX + Math.cos(f.a) * FAMILIAR_R; f.y = CY + Math.sin(f.a) * FAMILIAR_R;
    if (f.cd > 0) continue;
    for (var e = 0; e < enemies.length; e++) {
      var en = enemies[e];
      if (!en.dead && !en.under && dist(en.x, en.y, f.x, f.y) < en.r + 18) { hurtEnemy(en, 1, "tower"); f.cd = 0.35; break; }
    }
  }
}

function parry(b, res, nx, ny, vr) {
  var tx = -ny, ty = nx;
  var perfect = Math.abs(res.diff) <= PERFECT_DEG * DEG;
  var before = mult();
  combo++;
  flash = 0.12;
  if (perfect) {
    gain(PARRY_SCORE + PERFECT_SCORE, b.x, b.y - 22, "#ffffff", "Perfect");
    ring(b.x, b.y, 6, 40, 0.25, "255,255,255");
  } else {
    gain(PARRY_SCORE, b.x, b.y - 20, b.kind === "brown" ? "#ffb347" : "#ffe14d");
  }
  if (mult() > before) pop(CX, CY - HERO_R - 90, "Combo x" + mult(), "#ffd23a", true);
  kickShield(Math.atan2(ny, nx), Math.min(700, 220 + Math.abs(vr) * 0.6));
  if (b.kind === "blue") {
    b.ric++;
    if (b.ric >= RICOCHETS_FOR_BROWN) {
      b.ric = 0;
      dropBrown(b, (Math.random() < 0.5 ? -1 : 1) * 35 * DEG);
      ring(b.x, b.y, 6, 34, 0.3, "240,160,80");
    }
  }
  var vt = b.vx * tx + b.vy * ty + omega * SHIELD_R * SPIN_KICK;
  var nvr = -vr * RESTITUTION + REPEL_PUSH;
  if (perfect) nvr *= PERFECT_SPEED;
  b.vx = nx * nvr + tx * vt;
  b.vy = ny * nvr + ty * vt;
}

// a ball against a round obstacle: bounce off it, and say so
function bounceOff(b, ox, oy, or) {
  var dx = b.x - ox, dy = b.y - oy, d = Math.hypot(dx, dy) || 1;
  if (d >= or + BALL_R) return false;
  var nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
  b.x = ox + nx * (or + BALL_R); b.y = oy + ny * (or + BALL_R);
  if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
  return true;
}

function updateBalls(wdt, g) {
  var h = wdt / SUBSTEPS;
  var outer = SHIELD_R + SHIELD_W / 2;
  for (var i = balls.length - 1; i >= 0; i--) {
    var b = balls[i], gone = false;
    for (var k = 0; k < SUBSTEPS && !gone; k++) {
      var dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy) || 1;
      b.vx -= dx / d * g * h;
      b.vy -= dy / d * g * h;
      b.x += b.vx * h;
      b.y += b.vy * h;

      if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx) * WALL_BOUNCE; }
      if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx) * WALL_BOUNCE; }
      if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy) * WALL_BOUNCE; }
      if (b.y > H - BALL_R) { b.y = H - BALL_R; b.vy = -Math.abs(b.vy) * WALL_BOUNCE; }

      dx = b.x - CX; dy = b.y - CY; d = Math.hypot(dx, dy) || 1;
      var nx = dx / d, ny = dy / d;
      var vr = b.vx * nx + b.vy * ny;
      if (vr < 0) {
        var res = onShield(b.x, b.y, BALL_R);
        if (res) {
          b.x = CX + nx * (outer + BALL_R);
          b.y = CY + ny * (outer + BALL_R);
          parry(b, res, nx, ny, vr);
        }
      }
      if (d <= HERO_R + BALL_R) {
        balls.splice(i, 1); gone = true;
        if (b.kind === "brown") ring(b.x, b.y, 4, 26, 0.25, "240,160,80");
        else freezeShield();
        break;
      }
      // the balls are the ammunition
      for (var e = 0; e < enemies.length; e++) {
        var en = enemies[e];
        if (en.dead || en.under || phased(en)) continue;
        if (bounceOff(b, en.x, en.y, en.r)) hurtEnemy(en, 1, "ball");
      }
      for (var t = 0; t < towers.length; t++) {
        if (towers[t].kind === "tomb") bounceOff(b, towers[t].x, towers[t].y, TOMB_R);
      }
      for (var p = pickups.length - 1; p >= 0; p--) {
        var pk = pickups[p];
        if (dist(b.x, b.y, pk.x, pk.y) < PICKUP_R + BALL_R) { pickups.splice(p, 1); apply(pk.key, pk.x, pk.y); }
      }
    }
    if (gone) continue;
    var sp = Math.hypot(b.vx, b.vy);
    if (sp > MAX_SPEED) { b.vx *= MAX_SPEED / sp; b.vy *= MAX_SPEED / sp; }
    b.trail.push(b.x, b.y);
    if (b.trail.length > 20) b.trail.splice(0, 2);
  }
}

// What the shaman and the dragon spit: parried, it becomes a brown ball.
function updateSpits(wdt) {
  for (var i = spits.length - 1; i >= 0; i--) {
    var s = spits[i];
    s.x += s.vx * wdt; s.y += s.vy * wdt;
    var dx = s.x - CX, dy = s.y - CY, d = Math.hypot(dx, dy) || 1;
    if (s.x < -40 || s.x > W + 40 || s.y < -40 || s.y > H + 40) { spits.splice(i, 1); continue; }
    if (fx.salt > 0 && Math.abs(d - SALT_R) < 12) { ring(s.x, s.y, 4, 24, 0.25, "255,255,255"); spits.splice(i, 1); continue; }
    if (onShield(s.x, s.y, SPIT_R)) {
      var nx = dx / d, ny = dy / d;
      spawnBall("brown", CX + nx * (SHIELD_R + SHIELD_W + BALL_R), CY + ny * (SHIELD_R + SHIELD_W + BALL_R), nx * 480, ny * 480);
      pop(s.x, s.y - 20, "Return", "#ffb347");
      combo++; flash = 0.12;
      kickShield(Math.atan2(dy, dx), 380);
      spits.splice(i, 1);
      continue;
    }
    if (d <= HERO_R + SPIT_R) { spits.splice(i, 1); hurtWitch(); if (mode !== "play") return; }
  }
}

// --- input -----------------------------------------------------------------
function toDesign(e) {
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}

function steer(p) {
  if (dist(p.x, p.y, DIAL_X, DIAL_Y) > 12) dialAngle = Math.atan2(p.y - DIAL_Y, p.x - DIAL_X);
}

function slotAt(p) {
  for (var i = 0; i < loadout.length; i++) {
    if (dist(p.x, p.y, SLOT_POS[i], SLOT_Y) < SLOT_R + 12) return i;
  }
  return -1;
}

function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

// on a desk the shield simply points at the mouse
function aimMouse(p) {
  if (dist(p.x, p.y, CX, CY) > 8) dialAngle = Math.atan2(p.y - CY, p.x - CX);
}

cv.addEventListener("pointerdown", function (e) {
  var p = toDesign(e);
  desk = e.pointerType === "mouse";
  cv.setPointerCapture(e.pointerId);
  if (mode === "brief") { briefTap(p); return; }
  if (mode === "down") { if (modeTime > 0.6) openBrief(stage); return; }
  if (mode !== "play") return;
  var slot = slotAt(p);
  if (slot >= 0) { ptrs[e.pointerId] = "button"; fireSuper(slot); return; }
  if (desk) { launchBall(); return; }
  if (dist(p.x, p.y, DIAL_X, DIAL_Y) < HUB_R + 6) { ptrs[e.pointerId] = "button"; launchBall(); return; }
  ptrs[e.pointerId] = "dial";
  steer(p);
});
cv.addEventListener("pointermove", function (e) {
  if (e.pointerType === "mouse") { desk = true; aimMouse(toDesign(e)); return; }
  if (ptrs[e.pointerId] !== "dial") return;
  steer(toDesign(e));
});
function release(e) { delete ptrs[e.pointerId]; }
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);

window.addEventListener("keydown", function (e) {
  keys[e.key] = true;
  var k = e.key.toLowerCase();
  if (mode === "brief") {
    if (k === "[") openBrief(stage - 1);
    if (k === "]") openBrief(stage + 1);
    if (k === "enter" || k === " ") startStage();
    return;
  }
  if (mode === "down" && (k === "enter" || k === " ")) { openBrief(stage); return; }
  if (mode !== "play") return;
  var zi = ["z", "x", "c", "v"].indexOf(k);
  if (zi >= 0) fireSuper(zi);
  if (k === " ") { e.preventDefault(); launchBall(); }
  if (e.key >= "1" && e.key <= "7") { var pk = spawnPickup(PICKUPS[+e.key - 1].key); pickups.pop(); apply(pk.key, pk.x, pk.y); }
  if (k === "n") { var a = Math.random() * Math.PI * 2; spawnBall("brown", CX + Math.cos(a) * 400, CY + Math.sin(a) * 400, 0, 0); }
  if (k === "k") { queue = []; pending = pending.filter(function (p) { return p.kind !== "enemy"; }); enemies.forEach(function (en) { en.dead = true; }); }
  if (k === "p") paused = !paused;
  if (k === "r") openBrief(stage);
});
window.addEventListener("keyup", function (e) { keys[e.key] = false; });

// --- the stage card --------------------------------------------------------
function briefLayout() {
  var L = { prev: { x: 50, y: 160, w: 80, h: 80 }, next: { x: 590, y: 160, w: 80, h: 80 }, tiles: [],
    fight: { x: 200, y: 1110, w: 320, h: 86 } };
  var open = unlocked(stage);
  var top = 330 + def.types.length * 150 + 70;
  for (var i = 0; i < open.length; i++) {
    L.tiles.push({ key: open[i].key, x: 56 + (i % 4) * 154, y: top + Math.floor(i / 4) * 138, w: 146, h: 128 });
  }
  L.tilesTop = top;
  return L;
}

function briefTap(p) {
  var L = briefLayout();
  if (inRect(p, L.prev)) { openBrief(stage - 1); return; }
  if (inRect(p, L.next)) { openBrief(stage + 1); return; }
  if (inRect(p, L.fight)) { startStage(); return; }
  for (var i = 0; i < L.tiles.length; i++) {
    if (!inRect(p, L.tiles[i])) continue;
    var key = L.tiles[i].key, at = loadout.indexOf(key);
    if (at >= 0) loadout.splice(at, 1);
    else { if (loadout.length >= slotCount(stage)) loadout.shift(); loadout.push(key); }
    return;
  }
}

// --- render: glyphs --------------------------------------------------------
function circle(x, y, r, col) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
}
function tri(ax, ay, bx, by, cx2, cy2, col) {
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx2, cy2); ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
}
function line(ax, ay, bx, by, w, col) {
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineWidth = w; ctx.lineCap = "round"; ctx.strokeStyle = col; ctx.stroke();
}
function eyes(x, y, r, col) {
  circle(x - r * 0.35, y - r * 0.15, r * 0.2, "#ffffff"); circle(x + r * 0.35, y - r * 0.15, r * 0.2, "#ffffff");
  circle(x - r * 0.35, y - r * 0.12, r * 0.1, col || "#111"); circle(x + r * 0.35, y - r * 0.12, r * 0.1, col || "#111");
}
function starShape(x, y, r, col) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function frogGlyph(x, y, r, col) {
  circle(x, y + r * 0.1, r, col);
  circle(x - r * 0.45, y - r * 0.6, r * 0.35, col); circle(x + r * 0.45, y - r * 0.6, r * 0.35, col);
  circle(x - r * 0.45, y - r * 0.6, r * 0.18, "#fff"); circle(x + r * 0.45, y - r * 0.6, r * 0.18, "#fff");
  circle(x - r * 0.45, y - r * 0.6, r * 0.09, "#111"); circle(x + r * 0.45, y - r * 0.6, r * 0.09, "#111");
}

// Placeholder monsters, one look each - just enough to tell them apart.
function drawMonster(key, x, y, r, t, e) {
  var flap = Math.sin(t * 18) * r * 0.5;
  switch (key) {
    case "bat":
      tri(x, y, x - r * 1.7, y - r * 0.4 + flap, x - r * 0.8, y + r * 0.5, "#1c1024");
      tri(x, y, x + r * 1.7, y - r * 0.4 + flap, x + r * 0.8, y + r * 0.5, "#1c1024");
      circle(x, y, r * 0.75, "#2a1836");
      circle(x - r * 0.28, y - r * 0.1, r * 0.16, "#ff3040"); circle(x + r * 0.28, y - r * 0.1, r * 0.16, "#ff3040");
      break;
    case "jack":
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.85, 0, 0, Math.PI * 2); ctx.fillStyle = "#ff8a1f"; ctx.fill();
      ctx.fillStyle = "#3a6b1f"; ctx.fillRect(x - 3, y - r - 4, 6, 10);
      tri(x - r * 0.5, y - r * 0.05, x - r * 0.15, y - r * 0.05, x - r * 0.32, y - r * 0.4, "#ffe25a");
      tri(x + r * 0.5, y - r * 0.05, x + r * 0.15, y - r * 0.05, x + r * 0.32, y - r * 0.4, "#ffe25a");
      ctx.fillStyle = "#ffe25a"; ctx.fillRect(x - r * 0.45, y + r * 0.25, r * 0.9, r * 0.2);
      break;
    case "wisp":
      circle(x, y, r * 1.6, "rgba(120,220,255,0.18)"); circle(x, y, r * 1.15, "rgba(120,220,255,0.35)");
      circle(x, y, r, "#bff0ff"); eyes(x, y, r, "#1a4a6a");
      break;
    case "spider":
      for (var l = 0; l < 4; l++) {
        var la = 0.5 + l * 0.35, wig = Math.sin(t * 10 + l) * 0.1;
        line(x, y, x - Math.cos(la + wig) * r * 1.7, y + Math.sin(la + wig) * r * 1.2 - r * 0.3, 3, "#2a1d33");
        line(x, y, x + Math.cos(la - wig) * r * 1.7, y + Math.sin(la - wig) * r * 1.2 - r * 0.3, 3, "#2a1d33");
      }
      circle(x, y, r, "#3a2550");
      for (var se = 0; se < 4; se++) circle(x - r * 0.42 + se * r * 0.28, y - r * 0.2, r * 0.1, "#ff3040");
      break;
    case "zombie":
      ctx.fillStyle = "#5f8f4a"; ctx.fillRect(x - r * 1.3, y - r * 0.25, r * 0.6, r * 0.3); ctx.fillRect(x + r * 0.7, y - r * 0.25, r * 0.6, r * 0.3);
      circle(x, y, r, "#7fb55e");
      circle(x - r * 0.35, y - r * 0.15, r * 0.22, "#fff"); circle(x + r * 0.35, y - r * 0.1, r * 0.14, "#fff");
      circle(x - r * 0.35, y - r * 0.15, r * 0.1, "#111"); circle(x + r * 0.35, y - r * 0.1, r * 0.07, "#111");
      line(x - r * 0.3, y + r * 0.45, x + r * 0.35, y + r * 0.35, 3, "#2c4a20");
      break;
    case "skeleton":
      if (e && e.state === 1) {
        line(x - r, y + r * 0.3, x + r * 0.2, y - r * 0.1, 6, "#e8e4d4");
        line(x - r * 0.3, y - r * 0.4, x + r, y + r * 0.4, 6, "#e8e4d4");
        circle(x + r * 0.2, y + r * 0.3, r * 0.45, "#e8e4d4");
        break;
      }
      circle(x, y, r, "#ece8d8");
      circle(x - r * 0.35, y - r * 0.15, r * 0.24, "#1a1a1a"); circle(x + r * 0.35, y - r * 0.15, r * 0.24, "#1a1a1a");
      tri(x, y + r * 0.1, x - r * 0.1, y + r * 0.3, x + r * 0.1, y + r * 0.3, "#1a1a1a");
      for (var tt = -2; tt <= 2; tt++) line(x + tt * r * 0.15, y + r * 0.5, x + tt * r * 0.15, y + r * 0.7, 2, "#1a1a1a");
      break;
    case "ghost":
      ctx.globalAlpha *= e && phased(e) ? 0.25 : 0.9;
      ctx.beginPath(); ctx.arc(x, y - r * 0.2, r, Math.PI, 0);
      ctx.lineTo(x + r, y + r * 0.8);
      for (var gw = 0; gw < 4; gw++) ctx.lineTo(x + r - (gw + 0.5) * r * 0.5, y + r * (gw % 2 ? 0.8 : 0.5));
      ctx.lineTo(x - r, y + r * 0.8); ctx.closePath(); ctx.fillStyle = "#f0f0ff"; ctx.fill();
      circle(x - r * 0.35, y - r * 0.25, r * 0.16, "#202040"); circle(x + r * 0.35, y - r * 0.25, r * 0.16, "#202040");
      ctx.globalAlpha = 1;
      break;
    case "mole":
      if (e && e.under) {
        ctx.beginPath(); ctx.ellipse(x, y, r * 1.1, r * 0.55, 0, Math.PI, 0); ctx.fillStyle = "#6b4a2e"; ctx.fill();
        circle(x - r * 0.6, y - r * 0.1, r * 0.15, "#5a3d24"); circle(x + r * 0.5, y - r * 0.2, r * 0.12, "#5a3d24");
        break;
      }
      circle(x, y, r, "#7a5a3c"); eyes(x, y, r);
      circle(x, y + r * 0.3, r * 0.2, "#ff9ab0");
      break;
    case "slime": case "slimelet":
      var sq = 1 + Math.sin(t * 6) * 0.08;
      ctx.beginPath(); ctx.ellipse(x, y + r * 0.1, r * 1.15 * sq, r * 0.9 / sq, 0, 0, Math.PI * 2); ctx.fillStyle = "#4fd6a0"; ctx.fill();
      circle(x - r * 0.4, y - r * 0.35, r * 0.18, "rgba(255,255,255,0.6)");
      eyes(x, y, r);
      break;
    case "frog":
      frogGlyph(x, y, r, "#5fae3a");
      break;
    case "mosquito":
      ctx.beginPath(); ctx.ellipse(x - r * 0.7, y - r * 0.6, r * 0.8, r * 0.4, -0.5 + Math.sin(t * 40) * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(220,230,255,0.55)"; ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + r * 0.7, y - r * 0.6, r * 0.8, r * 0.4, 0.5 - Math.sin(t * 40) * 0.3, 0, Math.PI * 2); ctx.fill();
      circle(x, y, r * 0.7, "#55505c");
      line(x, y + r * 0.3, x, y + r * 1.3, 2, "#2a2a2a");
      circle(x - r * 0.25, y - r * 0.1, r * 0.18, "#ff3040"); circle(x + r * 0.25, y - r * 0.1, r * 0.18, "#ff3040");
      break;
    case "shaman":
      line(x + r * 1.1, y + r, x + r * 1.1, y - r * 1.2, 4, "#8a5a2a");
      circle(x + r * 1.1, y - r * 1.25, r * 0.22, "#ff5af0");
      frogGlyph(x, y, r, "#7a8a3a");
      ctx.fillStyle = "#b03ad0"; ctx.fillRect(x - r * 0.9, y - r * 0.45, r * 1.8, r * 0.2);
      break;
    case "knight":
      circle(x, y, r, "#9aa4b8");
      ctx.fillStyle = "#2a2e38"; ctx.fillRect(x - r * 0.6, y - r * 0.2, r * 1.2, r * 0.18);
      line(x, y + r * 0.1, x, y + r * 0.7, 3, "#6a7488");
      tri(x - r * 0.2, y - r, x + r * 0.2, y - r, x + r * 0.6, y - r * 1.7, "#d0303a");
      break;
    case "gargoyle":
      var stone = e && stoned(e);
      var gc = stone ? "#6a6a72" : "#8a8a96";
      tri(x, y, x - r * 1.6, y - r * 0.8, x - r * 0.6, y + r * 0.4, gc);
      tri(x, y, x + r * 1.6, y - r * 0.8, x + r * 0.6, y + r * 0.4, gc);
      circle(x, y, r, gc);
      tri(x - r * 0.6, y - r * 0.6, x - r * 0.3, y - r * 0.8, x - r * 0.6, y - r * 1.4, "#55555e");
      tri(x + r * 0.6, y - r * 0.6, x + r * 0.3, y - r * 0.8, x + r * 0.6, y - r * 1.4, "#55555e");
      if (!stone) { circle(x - r * 0.35, y - r * 0.1, r * 0.15, "#ffcc33"); circle(x + r * 0.35, y - r * 0.1, r * 0.15, "#ffcc33"); }
      break;
    case "vampire":
      tri(x, y - r * 0.6, x - r * 1.4, y + r * 1.1, x + r * 1.4, y + r * 1.1, "#1a0a14");
      tri(x, y - r * 0.2, x - r * 0.9, y + r * 1.0, x + r * 0.9, y + r * 1.0, "#8a1020");
      circle(x, y - r * 0.2, r * 0.8, "#e8dce8");
      circle(x - r * 0.3, y - r * 0.3, r * 0.13, "#d01030"); circle(x + r * 0.3, y - r * 0.3, r * 0.13, "#d01030");
      tri(x - r * 0.2, y + r * 0.2, x - r * 0.1, y + r * 0.2, x - r * 0.15, y + r * 0.42, "#fff");
      tri(x + r * 0.2, y + r * 0.2, x + r * 0.1, y + r * 0.2, x + r * 0.15, y + r * 0.42, "#fff");
      break;
    case "rat":
      line(x - r * 0.9, y + r * 0.2, x - r * 2, y + r * 0.6 + Math.sin(t * 12) * r * 0.3, 3, "#d88a9a");
      ctx.beginPath(); ctx.ellipse(x, y, r * 1.2, r * 0.85, 0, 0, Math.PI * 2); ctx.fillStyle = "#7a7480"; ctx.fill();
      circle(x - r * 0.5, y - r * 0.7, r * 0.35, "#8a8490"); circle(x + r * 0.5, y - r * 0.7, r * 0.35, "#8a8490");
      circle(x - r * 0.3, y - r * 0.1, r * 0.13, "#ff3040"); circle(x + r * 0.3, y - r * 0.1, r * 0.13, "#ff3040");
      break;
    case "imp":
      circle(x + r * 0.9, y + r * 0.5, r * 0.45, "#1a1a1a");
      line(x + r * 1.1, y + r * 0.1, x + r * 1.3, y - r * 0.2, 2, "#ffcc33");
      circle(x + r * 1.3, y - r * 0.25, r * 0.12, Math.sin(t * 20) > 0 ? "#ffee88" : "#ff7a3d");
      circle(x, y, r, "#d03a2a");
      tri(x - r * 0.7, y - r * 0.6, x - r * 0.3, y - r * 0.8, x - r * 0.8, y - r * 1.4, "#3a1010");
      tri(x + r * 0.7, y - r * 0.6, x + r * 0.3, y - r * 0.8, x + r * 0.8, y - r * 1.4, "#3a1010");
      eyes(x, y, r, "#d03a2a");
      break;
    case "salamander":
      line(x - r * 0.8, y + r * 0.3, x - r * 2.1, y + r * 0.9 + Math.sin(t * 8) * r * 0.4, r * 0.5, "#ff7a2a");
      ctx.beginPath(); ctx.ellipse(x, y, r * 1.2, r * 0.8, 0, 0, Math.PI * 2); ctx.fillStyle = "#ff9a3a"; ctx.fill();
      circle(x - r * 0.4, y - r * 0.2, r * 0.18, "#ffe14d"); circle(x + r * 0.2, y + r * 0.1, r * 0.14, "#ffe14d");
      eyes(x + r * 0.3, y - r * 0.1, r * 0.8);
      break;
    case "priest":
      tri(x, y - r * 1.5, x - r * 1.1, y + r * 1.0, x + r * 1.1, y + r * 1.0, "#4a1d6a");
      circle(x, y - r * 0.1, r * 0.55, "#140a1c");
      circle(x - r * 0.2, y - r * 0.15, r * 0.11, "#5dff8c"); circle(x + r * 0.2, y - r * 0.15, r * 0.11, "#5dff8c");
      break;
    case "dragon":
      tri(x, y, x - r * 1.8, y - r * 1.0 + flap * 0.4, x - r * 0.6, y + r * 0.5, "#7a1010");
      tri(x, y, x + r * 1.8, y - r * 1.0 + flap * 0.4, x + r * 0.6, y + r * 0.5, "#7a1010");
      circle(x, y, r, "#c0201a");
      tri(x - r * 0.6, y - r * 0.6, x - r * 0.3, y - r * 0.8, x - r * 0.7, y - r * 1.4, "#ffcc66");
      tri(x + r * 0.6, y - r * 0.6, x + r * 0.3, y - r * 0.8, x + r * 0.7, y - r * 1.4, "#ffcc66");
      circle(x - r * 0.35, y - r * 0.15, r * 0.15, "#ffe14d"); circle(x + r * 0.35, y - r * 0.15, r * 0.15, "#ffe14d");
      ctx.fillStyle = "#3a0808"; ctx.fillRect(x - r * 0.4, y + r * 0.35, r * 0.8, r * 0.12);
      break;
  }
}

function drawSuperGlyph(key, x, y, r) {
  var s = SU[key], c = s.col;
  ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 4; ctx.lineCap = "round";
  switch (key) {
    case "lightning":
      ctx.beginPath(); ctx.moveTo(x + r * 0.2, y - r); ctx.lineTo(x - r * 0.4, y + r * 0.1); ctx.lineTo(x, y + r * 0.1);
      ctx.lineTo(x - r * 0.2, y + r); ctx.lineTo(x + r * 0.45, y - r * 0.15); ctx.lineTo(x + r * 0.05, y - r * 0.15); ctx.closePath(); ctx.fill();
      break;
    case "freeze":
      for (var i = 0; i < 3; i++) { var a = i * Math.PI / 3; line(x - Math.cos(a) * r, y - Math.sin(a) * r, x + Math.cos(a) * r, y + Math.sin(a) * r, 4, c); }
      break;
    case "wave":
      ctx.beginPath(); ctx.arc(x, y, r * 0.4, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r * 0.85, 0, Math.PI * 2); ctx.stroke();
      break;
    case "moon":
      circle(x, y, r * 0.85, c); circle(x + r * 0.4, y - r * 0.25, r * 0.7, "#1a1424");
      break;
    case "brew":
      ctx.beginPath(); ctx.arc(x, y + r * 0.1, r * 0.75, 0, Math.PI); ctx.fillStyle = "#2a2a30"; ctx.fill();
      ctx.fillStyle = "#2a2a30"; ctx.fillRect(x - r * 0.85, y, r * 1.7, r * 0.18);
      circle(x - r * 0.3, y - r * 0.3, r * 0.2, c); circle(x + r * 0.25, y - r * 0.55, r * 0.2, c); circle(x + r * 0.1, y - r * 0.1, r * 0.18, c);
      break;
    case "familiars":
      drawMonster("bat", x, y + r * 0.1, r * 0.55, 0);
      break;
    case "meteor":
      line(x - r * 0.9, y - r * 0.9, x - r * 0.1, y - r * 0.1, 6, "rgba(255,200,90,0.8)");
      circle(x + r * 0.1, y + r * 0.1, r * 0.5, c);
      break;
    case "salt":
      ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      circle(x, y, r * 0.2, c);
      break;
    case "broom":
      line(x - r * 0.8, y - r * 0.8, x + r * 0.2, y + r * 0.2, 5, "#8a5a2a");
      tri(x, y, x + r * 0.95, y + r * 0.3, x + r * 0.3, y + r * 0.95, c);
      break;
    case "toad":
      frogGlyph(x, y + r * 0.1, r * 0.65, c);
      break;
    case "banish":
      starShape(x, y, r * 0.9, c); circle(x, y, r * 0.3, "#1a1424");
      break;
  }
}

function drawPickupGlyph(key, x, y, r) {
  var pd = PICKUPS.filter(function (p) { return p.key === key; })[0];
  switch (key) {
    case "star": starShape(x, y, r, pd.col); break;
    case "pumpkin": drawMonster("jack", x, y, r * 0.9, 0); break;
    case "candle":
      ctx.fillStyle = pd.col; ctx.fillRect(x - r * 0.3, y - r * 0.3, r * 0.6, r * 1.2);
      ctx.beginPath(); ctx.ellipse(x, y - r * 0.6, r * 0.2, r * 0.35, 0, 0, Math.PI * 2); ctx.fillStyle = "#ffb03a"; ctx.fill();
      break;
    case "tomb":
      ctx.beginPath(); ctx.arc(x, y - r * 0.2, r * 0.7, Math.PI, 0); ctx.lineTo(x + r * 0.7, y + r * 0.9); ctx.lineTo(x - r * 0.7, y + r * 0.9);
      ctx.closePath(); ctx.fillStyle = pd.col; ctx.fill();
      line(x, y - r * 0.5, x, y + r * 0.3, 4, "#4a5060"); line(x - r * 0.3, y - r * 0.2, x + r * 0.3, y - r * 0.2, 4, "#4a5060");
      break;
    case "web":
      for (var k = 0; k < 4; k++) {
        var a = k * Math.PI / 4;
        line(x - Math.cos(a) * r, y - Math.sin(a) * r, x + Math.cos(a) * r, y + Math.sin(a) * r, 2, pd.col);
      }
      ctx.lineWidth = 2; ctx.strokeStyle = pd.col;
      ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r * 0.9, 0, Math.PI * 2); ctx.stroke();
      break;
    case "potion":
      circle(x, y + r * 0.25, r * 0.65, pd.col);
      ctx.fillStyle = pd.col; ctx.fillRect(x - r * 0.22, y - r * 0.8, r * 0.44, r * 0.6);
      circle(x - r * 0.2, y + r * 0.1, r * 0.15, "rgba(255,255,255,0.7)");
      break;
    case "heart":
      circle(x - r * 0.35, y - r * 0.2, r * 0.42, pd.col); circle(x + r * 0.35, y - r * 0.2, r * 0.42, pd.col);
      tri(x - r * 0.75, y - r * 0.05, x + r * 0.75, y - r * 0.05, x, y + r * 0.8, pd.col);
      break;
  }
}

// --- render: arena ---------------------------------------------------------
function drawBackground() {
  var bm = BIOMES[def.biome];
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, bm.top); bg.addColorStop(0.55, bm.mid); bg.addColorStop(1, bm.low);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  if (fx.freeze > 0) { ctx.fillStyle = "rgba(190,240,255,0.08)"; ctx.fillRect(0, 0, W, H); }
}

function drawWitch() {
  var body = hurt > 0 ? "#e86a3a" : "#f5a028";
  circle(CX, CY, HERO_R, body);
  ctx.lineWidth = 3; ctx.strokeStyle = "#a8561a"; ctx.stroke();
  circle(CX - 15, CY - 2, 5, "#3a1d0e"); circle(CX + 15, CY - 2, 5, "#3a1d0e");
  ctx.beginPath();
  if (hurt > 0) ctx.arc(CX, CY + 26, 12, Math.PI * 1.15, Math.PI * 1.85);
  else ctx.arc(CX, CY + 10, 12, Math.PI * 0.15, Math.PI * 0.85);
  ctx.lineWidth = 3; ctx.strokeStyle = "#3a1d0e"; ctx.stroke();
  var hy = CY - HERO_R + 14;
  ctx.fillStyle = "#6b3fb8";
  ctx.beginPath(); ctx.ellipse(CX, hy, HERO_R + 24, 12, 0, 0, Math.PI * 2); ctx.fill();
  tri(CX - 34, hy - 4, CX + 10, hy - 68, CX + 34, hy - 4, "#6b3fb8");
  ctx.fillStyle = "#c0303a"; ctx.fillRect(CX - 30, hy - 13, 60, 8);
}

// The shield as a polyline, so the spring can dent it: deepest where it
// was hit, fading out either side, plus a little of it all along.
function shieldPath(from, to) {
  var n = Math.max(6, Math.ceil((to - from) / (3 * DEG))), hit = angle + spring.at;
  ctx.beginPath();
  for (var i = 0; i <= n; i++) {
    var a = from + (to - from) * i / n, off = wrap(a - hit) / BOUNCE_SPREAD;
    var r = SHIELD_R - spring.s * (0.25 + Math.exp(-off * off));
    if (i === 0) ctx.moveTo(CX + Math.cos(a) * r, CY + Math.sin(a) * r);
    else ctx.lineTo(CX + Math.cos(a) * r, CY + Math.sin(a) * r);
  }
}

function drawShield() {
  var half = arcDeg() * DEG / 2;
  var col = fx.lock > 0 ? "200,235,255" : fx.jam > 0 ? "150,150,160" : stacks.length || fx.moon > 0 ? "60,255,120" : "25,230,255";
  var thick = 1 + Math.min(0.6, Math.abs(spring.s) / 30);   // it fattens a little as it bounces
  var layers = [[SHIELD_W + 18, 0.12], [SHIELD_W + 8, 0.25], [SHIELD_W, 1]];
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (var i = 0; i < layers.length; i++) {
    shieldPath(angle - half, angle + half);
    ctx.lineWidth = layers[i][0] * thick;
    ctx.strokeStyle = "rgba(" + col + "," + layers[i][1] + ")";
    ctx.stroke();
  }
  if (flash > 0) {
    shieldPath(angle - half, angle + half);
    ctx.lineWidth = SHIELD_W * 0.4; ctx.strokeStyle = "#ffffff"; ctx.stroke();
  }
  if (fx.lock > 0) {                        // frozen: a few frost ticks across it
    for (var k = -2; k <= 2; k++) {
      var fa = angle + k * half / 2.5;
      line(CX + Math.cos(fa) * (SHIELD_R - 14), CY + Math.sin(fa) * (SHIELD_R - 14),
        CX + Math.cos(fa) * (SHIELD_R + 14), CY + Math.sin(fa) * (SHIELD_R + 14), 3, "#ffffff");
    }
  }
  shieldPath(angle - PERFECT_DEG * DEG, angle + PERFECT_DEG * DEG);
  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.stroke();
}

// The dial (phone only) and its hub, the launch button (on a desk too, as
// the readout of the ball's cooldown - a click anywhere launches there).
function drawDial() {
  if (!desk) {
    circle(DIAL_X, DIAL_Y, DIAL_R, "rgba(255,255,255,0.06)");
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.stroke();
    var half = arcDeg() * DEG / 2;
    ctx.beginPath(); ctx.arc(DIAL_X, DIAL_Y, DIAL_R, angle - half, angle + half);
    ctx.lineWidth = 10; ctx.lineCap = "round";
    ctx.strokeStyle = fx.lock > 0 ? "rgba(200,235,255,0.8)" : "rgba(25,230,255,0.8)"; ctx.stroke();
    circle(DIAL_X + Math.cos(dialAngle) * DIAL_R, DIAL_Y + Math.sin(dialAngle) * DIAL_R, 9, "rgba(255,255,255,0.9)");
  }
  var ready = ballCd <= 0 && countBalls("blue") < MAX_BLUE;
  circle(DIAL_X, DIAL_Y, HUB_R, ready ? "rgba(40,60,90,0.95)" : "rgba(20,24,34,0.9)");
  ctx.lineWidth = 3; ctx.strokeStyle = ready ? "rgb(120,240,255)" : "rgba(255,255,255,0.2)"; ctx.stroke();
  circle(DIAL_X, DIAL_Y - 4, 13, ready ? "rgb(120,240,255)" : "rgba(120,240,255,0.3)");
  if (ballCd > 0) {
    ctx.beginPath(); ctx.moveTo(DIAL_X, DIAL_Y);
    ctx.arc(DIAL_X, DIAL_Y, HUB_R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ballCd / BALL_CD);
    ctx.closePath(); ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fill();
  }
  // how many of the three are still in hand
  var left = MAX_BLUE - countBalls("blue");
  for (var i = 0; i < MAX_BLUE; i++) {
    circle(DIAL_X - 16 + i * 16, DIAL_Y + 20, 5, i < left ? "rgb(120,240,255)" : "rgba(255,255,255,0.2)");
  }
}

function drawSlots() {
  ctx.textAlign = "center";
  for (var i = 0; i < loadout.length; i++) {
    var key = loadout[i], x = SLOT_POS[i], s = SU[key], left = cds[key] || 0;
    circle(x, SLOT_Y, SLOT_R, left > 0 ? "rgba(20,14,30,0.85)" : "rgba(40,30,60,0.95)");
    ctx.lineWidth = 3; ctx.strokeStyle = left > 0 ? "rgba(255,255,255,0.2)" : s.col; ctx.stroke();
    ctx.globalAlpha = left > 0 ? 0.35 : 1;
    drawSuperGlyph(key, x, SLOT_Y, SLOT_R * 0.6);
    ctx.globalAlpha = 1;
    if (left > 0) {
      ctx.beginPath(); ctx.moveTo(x, SLOT_Y);
      ctx.arc(x, SLOT_Y, SLOT_R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left / s.cd);
      ctx.closePath(); ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fill();
      ctx.font = "bold 24px sans-serif"; ctx.fillStyle = "#ffffff";
      ctx.fillText(Math.ceil(left), x, SLOT_Y + 8);
    }
    ctx.font = "20px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillText(s.name, x, SLOT_Y + SLOT_R + 26);
  }
}

function drawEnemy(e) {
  var t = e.t;
  if (e.toad > 0 && e.def.beh !== "boss") frogGlyph(e.x, e.y, e.r * 0.8, "#7bd34a");
  else drawMonster(e.key, e.x, e.y, e.r, t, e);
  if (e.hitFlash > 0) circle(e.x, e.y, e.r, "rgba(255,255,255,0.5)");
  if (e.maxHp > 1 && e.hp < e.maxHp && !e.under) {
    var w = Math.max(30, e.r * 1.6);
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w, 6);
    ctx.fillStyle = "#ff5a6a"; ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w * e.hp / e.maxHp, 6);
  }
}

function drawArena(now) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * 10 * shake / 0.3, (Math.random() * 2 - 1) * 10 * shake / 0.3);

  drawDial();
  for (var w = 0; w < towers.length; w++) {
    var tw = towers[w];
    if (tw.kind === "web") {
      circle(tw.x, tw.y, WEB_R, "rgba(232,232,240,0.07)");
      drawPickupGlyph("web", tw.x, tw.y, WEB_R * 0.9);
    }
  }
  if (fx.salt > 0) {
    ctx.setLineDash([10, 12]); ctx.beginPath(); ctx.arc(CX, CY, SALT_R, 0, Math.PI * 2);
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255," + Math.min(1, fx.salt) + ")"; ctx.stroke(); ctx.setLineDash([]);
  }
  for (var k = 0; k < pickups.length; k++) {
    var pk = pickups[k];
    if (pk.t < 1.5 && Math.floor(pk.t * 8) % 2) continue;
    var py = pk.y + Math.sin(now * 3 + pk.x) * 5;
    circle(pk.x, py, PICKUP_R + 8, "rgba(0,0,0,0.25)");
    drawPickupGlyph(pk.key, pk.x, py, PICKUP_R);
  }
  for (var p = 0; p < pending.length; p++) {
    var pd = pending[p], f = 1 - pd.t / SPAWN_WARN;
    ctx.beginPath(); ctx.arc(pd.x, pd.y, 10 + 22 * f, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = pd.kind === "enemy" ? "rgba(255,60,80," + (1 - f) + ")" : "rgba(120,240,255," + (1 - f) + ")";
    ctx.stroke();
  }
  for (var t = 0; t < towers.length; t++) {
    var tw2 = towers[t];
    if (tw2.kind === "candle") drawPickupGlyph("candle", tw2.x, tw2.y, 26);
    if (tw2.kind === "tomb") {
      ctx.globalAlpha = 0.4 + 0.6 * tw2.hp / TOMB_HP;
      drawPickupGlyph("tomb", tw2.x, tw2.y, TOMB_R);
      ctx.globalAlpha = 1;
    }
  }
  for (var m = 0; m < meteors.length; m++) {
    var mt = meteors[m], u = 1 - mt.t / mt.life;
    circle(mt.x, mt.y, 20 + 60 * u, "rgba(0,0,0," + 0.25 * u + ")");
    circle(mt.x, mt.y - (1 - u) * 500, 16, "#ff7a3d");
  }

  drawWitch();
  drawShield();
  for (var e = 0; e < enemies.length; e++) drawEnemy(enemies[e]);
  for (var f2 = 0; f2 < familiars.length; f2++) drawMonster("bat", familiars[f2].x, familiars[f2].y, 15, now, null);

  for (var i = 0; i < balls.length; i++) {
    var b = balls[i], col = b.kind === "brown" ? "176,110,60" : "120,240,255";
    for (var tr = 2; tr < b.trail.length; tr += 2) {
      line(b.trail[tr - 2], b.trail[tr - 1], b.trail[tr], b.trail[tr + 1], BALL_R * 1.4 * tr / b.trail.length,
        "rgba(" + col + "," + (0.5 * tr / b.trail.length) + ")");
    }
    circle(b.x, b.y, BALL_R, "rgb(" + col + ")");
    circle(b.x - 3, b.y - 3, BALL_R * 0.4, "rgba(255,255,255,0.7)");
    if (b.kind === "blue") {
      for (var rc = 0; rc < b.ric; rc++) {
        var ra = -Math.PI / 2 + rc * Math.PI * 2 / RICOCHETS_FOR_BROWN;
        circle(b.x + Math.cos(ra) * (BALL_R + 7), b.y + Math.sin(ra) * (BALL_R + 7), 3, "rgb(240,160,80)");
      }
    }
  }
  for (var s = 0; s < spits.length; s++) {
    circle(spits[s].x, spits[s].y, SPIT_R + 4, spits[s].fire ? "rgba(255,122,61,0.35)" : "rgba(160,200,60,0.35)");
    circle(spits[s].x, spits[s].y, SPIT_R, spits[s].fire ? "#ff7a3d" : "#a8d040");
  }
  for (var bo = 0; bo < bolts.length; bo++) {
    var bt = bolts[bo];
    if (bt.zig) {
      ctx.beginPath(); ctx.moveTo(bt.x1, bt.y1);
      for (var z = 1; z < 8; z++) {
        var zu = z / 8;
        ctx.lineTo(bt.x1 + (bt.x2 - bt.x1) * zu + (Math.random() * 2 - 1) * 26, bt.y1 + (bt.y2 - bt.y1) * zu);
      }
      ctx.lineTo(bt.x2, bt.y2);
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(" + bt.col + ",0.95)"; ctx.stroke();
    } else line(bt.x1, bt.y1, bt.x2, bt.y2, 4, "rgba(" + bt.col + ",0.9)");
  }
  for (var r = 0; r < rings.length; r++) {
    var rg = rings[r], ru = rg.t / rg.life;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, Math.max(1, rg.r0 + (rg.r1 - rg.r0) * ru), 0, Math.PI * 2);
    ctx.lineWidth = 5 * (1 - ru) + 1; ctx.strokeStyle = "rgba(" + rg.col + "," + (1 - ru) + ")"; ctx.stroke();
  }
  ctx.textAlign = "center";
  for (var q = 0; q < pops.length; q++) {
    var pp = pops[q];
    ctx.font = "bold " + (pp.big ? 30 : 24) + "px sans-serif";
    ctx.fillStyle = pp.col;
    ctx.globalAlpha = Math.max(0, 1 - pp.t / 0.8);
    ctx.fillText(pp.str, pp.x, pp.y - pp.t * 50);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawSlots();
}

function drawHud() {
  for (var i = 0; i < LIVES; i++) circle(34 + i * 34, 34, 13, i < lives ? "#e8364a" : "rgba(255,255,255,0.15)");
  ctx.textAlign = "center";
  ctx.font = "bold 54px sans-serif"; ctx.fillStyle = "#ffd23a";
  ctx.fillText(score, W / 2, 70);
  ctx.font = "22px sans-serif"; ctx.fillStyle = "#ffffff";
  ctx.fillText("Stage " + stage + " · " + BIOMES[def.biome].name + " · monsters left " + monstersLeft(), W / 2, 104);
  ctx.font = "20px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.7)";
  var on = ["Combo " + combo + " x" + mult(), "shield " + Math.round(arcDeg()) + "°"];
  var names = { freeze: "Freeze", moon: "Moon", salt: "Salt", familiars: "Familiars", jam: "Jammed", lock: "Frozen" };
  for (var k in names) if (fx[k] > 0) on.push(names[k] + " " + fx[k].toFixed(1));
  ctx.fillText(on.join(" · "), W / 2, 132);
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.fillText((desk ? "Click / SPACE ball" : "Hub: ball") + " · Z X C V supers · 1-7 pickups · K clear · R card", W / 2, H - 12);

  if (mode === "down" || paused || mode === "clear") {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, CY - 90, W, 180);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 44px sans-serif";
    var title = mode === "down" ? "The witch is down" : mode === "clear" ? (stage >= 30 ? "All 30 stages cleared" : "Stage clear") : "Paused";
    ctx.fillText(title, W / 2, CY);
    ctx.font = "24px sans-serif";
    ctx.fillText(mode === "down" ? "Tap to try again" : mode === "clear" ? "Score " + score : "P to resume", W / 2, CY + 46);
  }
}

function drawBrief(now) {
  var L = briefLayout(), slots = slotCount(stage);
  ctx.fillStyle = "rgba(8,5,14,0.82)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.fillRect(36, 140, W - 72, 1080);

  ctx.textAlign = "center";
  ctx.font = "bold 48px sans-serif"; ctx.fillStyle = "#ffd23a";
  ctx.fillText("Stage " + stage, W / 2, 200);
  ctx.font = "24px sans-serif"; ctx.fillStyle = "#ffffff";
  ctx.fillText(BIOMES[def.biome].name, W / 2, 236);
  ctx.font = "bold 44px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("‹", L.prev.x + L.prev.w / 2, L.prev.y + 54);
  ctx.fillText("›", L.next.x + L.next.w / 2, L.next.y + 54);

  ctx.textAlign = "left";
  ctx.font = "bold 24px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText(def.count + " monsters", 60, 300);
  for (var i = 0; i < def.types.length; i++) {
    var m = EN[def.types[i]], y = 330 + i * 150;
    circle(120, y + 64, 52, "rgba(0,0,0,0.3)");
    drawMonster(m.key, 120, y + 64, Math.min(34, m.r * 1.3), now, null);
    ctx.textAlign = "left";
    ctx.font = "bold 30px sans-serif"; ctx.fillStyle = "#ffffff";
    ctx.fillText(m.name, 196, y + 42);
    if (FIRST[m.key] === stage) {
      var nw = ctx.measureText(m.name).width;
      ctx.fillStyle = "#ff5a6a"; ctx.fillRect(206 + nw, y + 18, 64, 30);
      ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#ffffff"; ctx.fillText("New", 216 + nw, y + 40);
    }
    ctx.font = "22px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillText(m.line, 196, y + 76);
    var weak = m.weak.filter(function (k) { return SU[k].from <= stage; });
    ctx.font = "22px sans-serif";
    var wx = 196;
    ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fillText("Weak to:", wx, y + 110);
    wx += ctx.measureText("Weak to: ").width;
    if (!weak.length) { ctx.fillText("a good shield", wx, y + 110); }
    weak.forEach(function (k, j) {
      var label = SU[k].name + (j < weak.length - 1 ? ", " : "");
      ctx.fillStyle = loadout.indexOf(k) >= 0 ? "#5dff8c" : "#ffffff";
      ctx.fillText(label, wx, y + 110);
      wx += ctx.measureText(label).width;
    });
  }

  ctx.font = "bold 24px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("Super powers · pick " + slots + "  (" + loadout.length + "/" + slots + ")", 60, L.tilesTop - 18);
  var counters = {};
  def.types.forEach(function (k) { EN[k].weak.forEach(function (w) { counters[w] = true; }); });
  for (var t = 0; t < L.tiles.length; t++) {
    var tl = L.tiles[t], s = SU[tl.key], on = loadout.indexOf(tl.key) >= 0;
    ctx.fillStyle = on ? "rgba(255,210,58,0.18)" : "rgba(255,255,255,0.05)";
    ctx.fillRect(tl.x, tl.y, tl.w, tl.h);
    ctx.lineWidth = on ? 4 : 2; ctx.strokeStyle = on ? "#ffd23a" : "rgba(255,255,255,0.15)";
    ctx.strokeRect(tl.x, tl.y, tl.w, tl.h);
    drawSuperGlyph(tl.key, tl.x + tl.w / 2, tl.y + 46, 28);
    ctx.textAlign = "center";
    ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#ffffff";
    ctx.fillText(s.name, tl.x + tl.w / 2, tl.y + 100);
    if (s.from === stage) {
      ctx.fillStyle = "#ff5a6a"; ctx.fillRect(tl.x + tl.w - 58, tl.y + 4, 54, 26);
      ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#ffffff"; ctx.fillText("New", tl.x + tl.w - 31, tl.y + 24);
    }
    if (counters[tl.key]) circle(tl.x + 16, tl.y + 16, 7, "#5dff8c");
    ctx.textAlign = "left";
  }
  // the picked powers' own lines, so a new one says what it does
  ctx.font = "22px sans-serif";
  var ly = L.tiles.length ? L.tiles[L.tiles.length - 1].y + 128 + 34 : L.tilesTop + 30;
  for (var j = 0; j < loadout.length && ly < L.fight.y - 10; j++) {
    var su = SU[loadout[j]];
    ctx.fillStyle = su.col; ctx.fillText(su.name + ":", 60, ly);
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.fillText(su.line, 60 + ctx.measureText(su.name + ": ").width, ly);
    ly += 30;
  }

  var ready = loadout.length > 0;
  ctx.fillStyle = ready ? "#ff9a2a" : "rgba(255,255,255,0.2)";
  ctx.fillRect(L.fight.x, L.fight.y, L.fight.w, L.fight.h);
  ctx.textAlign = "center"; ctx.font = "bold 34px sans-serif"; ctx.fillStyle = "#2a1406";
  ctx.fillText("Fight", W / 2, L.fight.y + 56);
  ctx.font = "20px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.fillText("[ ] stage · Enter fight · green dot: counters a monster", W / 2, H - 30);
}

function render(now) {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  drawBackground();
  drawArena(now);
  if (mode === "brief") drawBrief(now);
  else drawHud();
}

// --- loop ------------------------------------------------------------------
var last = 0;
function frame(now) {
  var dt = Math.min(1 / 30, (now - last) / 1000 || 0);
  last = now;
  update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}
openBrief(1);
requestAnimationFrame(frame);
</script>
