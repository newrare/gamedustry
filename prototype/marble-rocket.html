<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>marble-rocket prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0a07; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<canvas id="cv"></canvas>
<script>
// ---------------------------------------------------------------------------
// The marble machine of marble-router, put to work: it FUELS A ROCKET.
//
// A rocket stands on a launch pad down the right edge of the screen, three
// tanks stacked in it, each with its own colour and a fill level you can read
// from across the room. A hopper at the top pours marbles onto brass rails;
// they roll down (real slope physics, loops, a notched wheel that merges two
// lines, a coil), through four flip-flop switches S0-S3, and land in one of
// four intakes at the bottom:
//   Tank 1 / Tank 2 / Tank 3 - fuel intakes. A good marble dropped in one
//              runs up its pipe (the pipe lights up) into its tank. A tank
//              that is already full refuses it: "Full", and it rolls away
//              into the gutter. So the stream has to be steered toward the
//              EMPTIEST tank, which moves every few seconds.
//   Furnace  - where bombs belong. A good marble burnt there is wasted.
// A bomb dropped in a fuel intake runs up the pipe too and cracks the rocket
// (a crack on the hull, a shake) and the tank leaks some fuel. Three cracks
// and the rocket is scrapped.
//
// Every rocket has a countdown ("T-12", big, top right). All three tanks full
// before zero -> LIFTOFF: ignition, smoke, flame, the rocket climbs out
// through the top of the screen over the machine, and pays 1 to 3 stars by
// the time it had to spare. Then the next rocket rolls in: bigger tanks, a
// shorter countdown. Zero with a tank short -> the engine fizzles, the rocket
// slumps, and the run is over. Play as many rockets as you can.
//
// Each switch flips itself as every marble passes it, so the machine keeps
// re-routing itself and the player keeps correcting it: a tap flips the
// nearest switch. Escapements (pendulum + pallet) hold a short visible queue
// before each switch so the next few marbles can be read. Spent marbles go
// back up to the hopper through the background (gutter -> screw -> top rail).
//
// The question: is fuelling a rocket against a countdown, ending on a launch,
// a satisfying level loop?
//
// Tap: flip the nearest switch. Tap "Auto" (or A) to let it play itself.
// Keys 1-4 flip S0-S3, R restarts.
// ---------------------------------------------------------------------------

// --- tunables --------------------------------------------------------------
var W = 720, H = 1280;          // design space, portrait
var R = 14;                     // marble radius
var G = 780;                    // px/s^2 of gravity along a slope
var FRICTION = 55;              // px/s^2 of rolling drag
var VMIN = 110, VMAX = 400;     // a marble never stalls and never flies off
var LEVEL_RAMP = 4;             // rockets until the machine runs at its END values
var TEMPO_START = 0.95, TEMPO_END = 1.1;    // time scale of the rails
var SPAWN_START = 0.95, SPAWN_END = 0.62;    // seconds between two marbles
var HOPPER_HOLD = 6;            // the hopper stops pouring while the top gate holds this many
var BAD_START = 0.34, BAD_END = 0.4;       // share of bombs in the stream
var GOLD_CHANCE = 0.05;         // a rare big marble, worth GOLD_FILL
var GOLD_FILL = 2;
// The rocket.
var TANK_START = 5, TANK_STEP = 1;         // marbles per tank, rocket 1 and each rocket after
var COUNT_START = 41, COUNT_STEP = 4, COUNT_MIN = 22;   // countdown seconds
var CRACKS = 3;                 // bombs in the tanks before the rocket is scrapped
var CRACK_SPILL = 2;            // fuel a crack leaks out of the tank it hit
var STAR3_LEFT = 9, STAR2_LEFT = 4;         // seconds to spare for 3 and 2 stars (else 1)
var PIPE_SPEED = 650;           // px/s of a marble up its fuel pipe
var IGNITE_SECONDS = 1.2, RISE_ACC = 520;  // the launch: ignition, then the climb
var ROLL_AT = 4.3, ROLL_SECONDS = 1.0;     // when the next rocket rolls in, and how long it takes
var FAIL_SECONDS = 2.6;         // the fizzle before the end screen
var AUTO_RESTART = 3;           // Auto starts a new run this long after one ends
var TAP_REACH = 240;            // a tap farther than this from every switch does nothing
var FLIP_TIME = 0.09;
var TOGGLE_ON_PASS = true;      // a marble passing a switch flips it
var WHEEL_OMEGA = 1.8;          // rad/s
var WHEEL_NOTCHES = 8;
var GUTTER_SPEED = 220;
// Escapements: channel, where on it (share of its length), seconds per marble
// at the start and at the end of the ramp, and where the pendulum's pivot
// hangs from, relative to the pallet.
var GATES = [["top", 0.8, 0.95, 0.75, 0, -88], ["S0L", 0.78, 1.2, 0.9, 0, -88],
  ["S0R", 0.78, 1.2, 0.9, 0, -88], ["wout", 0.6, 0.9, 0.7, 52, -52]];
var GATE_PRESSURE = 3;          // a queue this long swings the pendulum faster...
var GATE_RUSH = 0.6;            // ... by this factor
var WOUT_CAP = 2;               // marbles the gate under the wheel stores before the wheel keeps them
var SCREW_X = 24, SCREW_BOT = 1238, SCREW_TOP = 44, SCREW_SPEED = 110;
var BG_RAIL_SPEED = 120;
var FERRIS = { cx: 590, cy: 350, r: 56, buckets: 6, omega: 0.6, marbles: 5 };
var BG_ALPHA = 0.42;            // how far back the return circuits sit
var AUTO_RATE = 0.22;           // seconds between two flips of the autopilot

// --- palette ---------------------------------------------------------------
var C_BG = "#1c140e", C_BG2 = "#241a12", C_WOOD = "#5a3d25", C_BRASS = "#c9994a",
    C_BRASS_D = "#7a5a2a", C_STEEL = "#8d95a3", C_GOOD = "#f2b53a", C_BAD = "#1d1d22",
    C_HULL = "#e9e1cf", C_NOSE = "#c8443a";

// --- the network -------------------------------------------------------------
var DS = 5;                     // rails are resampled every DS px
var MID = 330;                  // the machine is symmetric about x = MID
function mir(pts) { var o = []; for (var i = 0; i < pts.length; i++) o.push([2 * MID - pts[i][0], pts[i][1], pts[i][2]]); return o; }
function loopPts(cx, cy, r) {
  var o = [];
  for (var i = 1; i <= 60; i++) { var a = Math.PI / 2 - i / 60 * Math.PI * 2; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return o;
}
// A spiral seen from slightly above: x = sin, depth = cos, the near half lower.
function coilPts(cx, y0, y1, r, turns) {
  var o = [], n = turns * 48;
  for (var i = 0; i <= n; i++) {
    var a = i / n * turns * Math.PI * 2;
    o.push([cx + r * Math.sin(a), y0 + (y1 - y0) * i / n + r * 0.35 * Math.cos(a), Math.cos(a)]);
  }
  return o;
}
var SW = { S0: [MID, 262], S1: [150, 470], S2: [2 * MID - 150, 470], S3: [MID, 790] };
var WHEEL = { cx: MID, cy: 615, r: 70 };
var S0L = [[MID, 262], [215, 318], [252, 392], [150, 470]];
var S1L = [[150, 470], [60, 560], [110, 650], [30, 760], [32, 830], [52, 858], [100, 870]]
  .concat(loopPts(100, 820, 50), [[140, 880], [168, 930], [85, 1005], [85, 1074]]);
var S1R = [[150, 470], [250, 535], [205, 595], [WHEEL.cx - WHEEL.r, WHEEL.cy]];
// The right outer line is narrower than its left twin: the rocket needs the
// right edge. Drawn on the left, then mirrored.
var S2R_L = [[150, 470], [92, 548], [132, 632], [84, 722], [86, 790], [100, 818], [130, 830]]
  .concat(loopPts(130, 784, 46), [[166, 842], [160, 900], [124, 1000], [124, 1074]]);
var RAW = {
  top:  { to: "S0", pts: [[650, 152], [560, 186], [450, 212], [MID, 262]] },
  S0L:  { to: "S1", pts: S0L },            S0R: { to: "S2", pts: mir(S0L) },
  S1L:  { to: "A", pts: S1L },              S1R: { to: "wheelL", pts: S1R },
  S2L:  { to: "wheelR", pts: mir(S1R) },    S2R: { to: "C", pts: mir(S2R_L) },
  wout: { to: "S3", pts: [[MID, WHEEL.cy + WHEEL.r], [MID, 790]] },
  S3L:  { to: "furnace", pts: [[MID, 790], [255, 850], [300, 930], [250, 1000], [250, 1074]] },
  S3R:  { to: "B", pts: [[MID, 790], [420, 842]].concat(coilPts(410, 850, 1030, 44, 2), [[410, 1074]]) }
};
var OUT = { S0: ["S0L", "S0R"], S1: ["S1L", "S1R"], S2: ["S2L", "S2R"], S3: ["S3L", "S3R"] };
// The rocket: RX is its axis, PAD_Y the top of the pad it stands on, and every
// height below is measured up from there (negative = higher).
var RX = 666, RW = 42, PAD_Y = 1222;
var TANKS = [
  { name: "Tank 1", intake: "A", color: "#5ab4ff", y0: -242, y1: -70, riser: 620, level: 1210 },
  { name: "Tank 2", intake: "B", color: "#4fe0b0", y0: -422, y1: -250, riser: 612, level: 1200 },
  { name: "Tank 3", intake: "C", color: "#c77dff", y0: -602, y1: -430, riser: 604, level: 1190 }
];
var MACHINE_DEFS = [
  { id: "A", tank: 0, x: 85 },
  { id: "furnace", name: "Furnace", x: 250, color: "#ff6a2a" },
  { id: "B", tank: 1, x: 410 },
  { id: "C", tank: 2, x: 536 }
];
var BOX_Y = 1080, BOX_H = 100, BOX_W = 120;
var GUTTER_L = 12, GUTTER_R = 596, GUTTER_Y = 1240;
var HOPPER = { x: 690, y: 118 };
var CHIMES = [["top", 0.22], ["top", 0.42], ["top", 0.62], ["S0L", 0.55], ["S0R", 0.55], ["S3L", 0.5]];
var DECO_GEARS = [[120, 250, 58, 11], [470, 740, 52, 10],
  [185, 740, 44, 9], [540, 960, 44, 9], [60, 960, 40, 8], [520, 1010, 36, 7]];
// Which tanks a switch can still reach down each of its two branches (-1 is
// the furnace). The autopilot reads it.
var REACH = { S0: [[0, 1, -1], [2, 1, -1]], S1: [[0], [1, -1]], S2: [[1, -1], [2]], S3: [[-1], [1]] };

// Background rails: the top return from the screw, and the ferris wheel's run.
var BG_RAW = {
  back: [[SCREW_X, SCREW_TOP], [200, 50], [380, 58], [560, 64], [656, 70]],
  ferris: [[612, 292], [650, 318], [618, 350], [652, 382], [606, 410]]
};

// Resample every channel to one point every DS px, keeping a depth per point.
var CH = {}, BG = {}, PIPES = [];
function makeChannel(k, to, raw) {
  var xs = [], ys = [], zs = [];
  xs.push(raw[0][0]); ys.push(raw[0][1]); zs.push(raw[0][2] === undefined ? 1 : raw[0][2]);
  var carry = 0;
  for (var i = 1; i < raw.length; i++) {
    var a = raw[i - 1], b = raw[i], za = a[2] === undefined ? 1 : a[2], zb = b[2] === undefined ? 1 : b[2];
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy), s = DS - carry;
    while (s <= L) { var q = s / L; xs.push(a[0] + dx * q); ys.push(a[1] + dy * q); zs.push(za + (zb - za) * q); s += DS; }
    carry = L - (s - DS);
  }
  var last = raw[raw.length - 1];
  xs.push(last[0]); ys.push(last[1]); zs.push(last[2] === undefined ? 1 : last[2]);
  var n = xs.length, coil = false;
  for (i = 0; i < n; i++) if (zs[i] < 0) coil = true;
  return { id: k, to: to, xs: xs, ys: ys, zs: zs, n: n, len: (n - 1) * DS, coil: coil };
}
for (var chk in RAW) CH[chk] = makeChannel(chk, RAW[chk].to, RAW[chk].pts);
for (chk in BG_RAW) BG[chk] = makeChannel(chk, null, BG_RAW[chk]);
// Fuel pipes: down out of the intake, along the bottom, up the rocket's side
// and into the middle of its tank. Nested so that no two of them cross.
for (var ti = 0; ti < TANKS.length; ti++) {
  var tk = TANKS[ti], ix = MACHINE_DEFS[[0, 2, 3][ti]].x, ey = PAD_Y + (tk.y0 + tk.y1) / 2;
  PIPES.push(makeChannel("pipe" + ti, null, [[ix, BOX_Y + BOX_H], [ix, tk.level], [tk.riser, tk.level], [tk.riser, ey], [RX - RW, ey]]));
}
function at(ch, d) {
  var f = Math.max(0, Math.min(ch.n - 1.001, d / DS)), i = Math.floor(f), q = f - i;
  return { x: ch.xs[i] + (ch.xs[i + 1] - ch.xs[i]) * q, y: ch.ys[i] + (ch.ys[i + 1] - ch.ys[i]) * q,
           z: ch.zs[i] + (ch.zs[i + 1] - ch.zs[i]) * q, slope: (ch.ys[i + 1] - ch.ys[i]) / DS };
}
// The gutter runs down to the left, into the screw.
function gutterY(x) { return GUTTER_Y + (GUTTER_R - x) * 0.012; }

// --- canvas ------------------------------------------------------------------
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var scale = 1, offX = 0, offY = 0, dpr = 1, trackLayer = null, frontLayer = null;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
  buildLayers();
}

// The rails never move, so they are drawn once: sleepers, a shadow, two brass
// rails. The coil's near half is also drawn on a second layer that goes OVER
// the marbles, which is what puts a marble behind its own rails.
function buildLayers() {
  var k = scale * dpr;
  trackLayer = document.createElement("canvas"); frontLayer = document.createElement("canvas");
  trackLayer.width = frontLayer.width = Math.max(1, Math.round(W * k));
  trackLayer.height = frontLayer.height = Math.max(1, Math.round(H * k));
  var t = trackLayer.getContext("2d"), f = frontLayer.getContext("2d");
  t.setTransform(k, 0, 0, k, 0, 0); f.setTransform(k, 0, 0, k, 0, 0);
  for (var id in CH) {
    var ch = CH[id];
    drawRails(t, ch, function (z) { return z < 0; }, 0.4);
    drawRails(t, ch, function (z) { return z >= 0; }, 1);
    if (ch.coil) drawRails(f, ch, function (z) { return z >= 0.15; }, 1);
  }
}
function normalAt(ch, i) {
  var a = Math.max(0, i - 1), b = Math.min(ch.n - 1, i + 1);
  var dx = ch.xs[b] - ch.xs[a], dy = ch.ys[b] - ch.ys[a], L = Math.sqrt(dx * dx + dy * dy) || 1;
  return [-dy / L, dx / L];
}
function drawRails(c, ch, keep, alpha) {
  c.globalAlpha = alpha; c.lineCap = "round"; c.lineJoin = "round";
  var i, nv;
  c.strokeStyle = C_WOOD; c.lineWidth = 5;
  for (i = 0; i < ch.n; i += 5) {
    if (!keep(ch.zs[i])) continue;
    nv = normalAt(ch, i);
    c.beginPath(); c.moveTo(ch.xs[i] - nv[0] * (R + 7), ch.ys[i] - nv[1] * (R + 7));
    c.lineTo(ch.xs[i] + nv[0] * (R + 7), ch.ys[i] + nv[1] * (R + 7)); c.stroke();
  }
  var sides = [-(R + 2), R + 2], pass, s;
  for (pass = 0; pass < 2; pass++) {
    c.strokeStyle = pass ? C_BRASS : "rgba(0,0,0,0.45)"; c.lineWidth = pass ? 3.5 : 5;
    for (s = 0; s < 2; s++) {
      var open = false;
      c.beginPath();
      for (i = 0; i < ch.n; i++) {
        if (!keep(ch.zs[i])) { open = false; continue; }
        nv = normalAt(ch, i);
        var x = ch.xs[i] + nv[0] * sides[s] + (pass ? 0 : 1.5), y = ch.ys[i] + nv[1] * sides[s] + (pass ? 0 : 2.5);
        if (!open) { c.moveTo(x, y); open = true; } else c.lineTo(x, y);
      }
      c.stroke();
    }
  }
  c.globalAlpha = 1;
}
addEventListener("resize", resize);

// --- state -------------------------------------------------------------------
var marbles, queue, machines, sw, parts, smoke, floats, rings, wheel, chimes, gates, ferris, blobs, pipeLit;
var state, t, spawnT, shake, stats, flow, gearA, stock, screwPhase;
var rocket, countLeft, phaseT, lastLaunch, launches, failWhy, overT;
var auto = false, autoT = 0;

function newRocket(n) {
  return { n: n, cap: TANK_START + (n - 1) * TANK_STEP, fill: [0, 0, 0], flash: [0, 0, 0],
    cracks: [], jolt: 0, x: 0, y: 0, tilt: 0, flame: 0 };
}
function countFor(n) { return Math.max(COUNT_MIN, COUNT_START - (n - 1) * COUNT_STEP); }

function reset() {
  marbles = []; queue = []; parts = []; smoke = []; floats = []; rings = []; blobs = [];
  pipeLit = [0, 0, 0];
  machines = {};
  for (var i = 0; i < MACHINE_DEFS.length; i++) {
    var d = MACHINE_DEFS[i], tank = d.tank === undefined ? -1 : d.tank;
    machines[d.id] = { id: d.id, x: d.x, tank: tank, name: tank >= 0 ? TANKS[tank].name : d.name,
      color: tank >= 0 ? TANKS[tank].color : d.color, flash: 0 };
  }
  sw = {};
  for (var k in SW) {
    var dir = k === "S1" ? 1 : 0;
    sw[k] = { x: SW[k][0], y: SW[k][1], dir: dir, ang: branchAngle(k, dir), spin: 0, flash: 0 };
  }
  wheel = { phase: 0, notch: [], q: { wheelL: [], wheelR: [] } };
  for (i = 0; i < WHEEL_NOTCHES; i++) wheel.notch.push(null);
  gates = [];
  for (i = 0; i < GATES.length; i++) {
    var gc = CH[GATES[i][0]], gd = gc.len * GATES[i][1], gp = at(gc, gd), ga = at(gc, gd + 5);
    var tl = Math.sqrt((ga.x - gp.x) * (ga.x - gp.x) + (ga.y - gp.y) * (ga.y - gp.y)) || 1;
    gc.gate = { ch: gc, d: gd, p0: GATES[i][2], p1: GATES[i][3], q: [], timer: 0, open: 0, side: 1,
      x: gp.x, y: gp.y, tx: (ga.x - gp.x) / tl, ty: (ga.y - gp.y) / tl, px: GATES[i][4], py: GATES[i][5] };
    gates.push(gc.gate);
  }
  ferris = { phase: 0, bucket: [], rail: [], wait: [] };
  for (i = 0; i < FERRIS.buckets; i++) ferris.bucket.push(i < FERRIS.marbles ? { rot: i } : null);
  chimes = [];
  for (i = 0; i < CHIMES.length; i++) {
    var ch = CH[CHIMES[i][0]], cd = ch.len * CHIMES[i][1], p = at(ch, cd), nv = normalAt(ch, Math.round(cd / DS));
    if (nv[1] > 0) nv = [-nv[0], -nv[1]];      // hang it on the upper side of the rail
    chimes.push({ ch: ch, d: cd, x: p.x + nv[0] * 30, y: p.y + nv[1] * 30, hit: 9 });
  }
  rocket = newRocket(1); countLeft = countFor(1);
  for (i = 0; i < 3; i++) queue.push(rollKind(0));
  state = "play"; t = 0; spawnT = 0.6; shake = 0; phaseT = 0; overT = 0;
  flow = 0; gearA = 0; screwPhase = 0; stock = 6; lastLaunch = null; launches = []; failWhy = "";
  stats = { fuel: 0, full: 0, burnt: 0, wasted: 0, cracks: 0, starsTotal: 0 };
}

function branchAngle(id, dir) {
  var ch = CH[OUT[id][dir]], p = at(ch, 30);
  return Math.atan2(p.y - SW[id][1], p.x - SW[id][0]);
}
// How far up the difficulty ramp this rocket is.
function progress() { return Math.min(1, (rocket.n - 1) / LEVEL_RAMP); }
function lerp(a, b, k) { return a + (b - a) * k; }
function mod(a, m) { return ((a % m) + m) % m; }
function ease(k) { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); }
function rollKind(k) {
  var r = Math.random();
  if (r < GOLD_CHANCE) return "gold";
  return r < GOLD_CHANCE + lerp(BAD_START, BAD_END, k) ? "bad" : "good";
}
function newMarble(kind, x, y) {
  var m = { kind: kind, st: "track", ch: null, d: 0, v: VMIN, x: x, y: y, z: 1, rot: Math.random() * 6 };
  marbles.push(m); return m;
}
function spawn(kind) {
  var m = newMarble(kind === "gold" ? "good" : kind, CH.top.xs[0], CH.top.ys[0]);
  m.ch = CH.top; m.gold = kind === "gold";
  if (stock > 0) stock--;
}
// Fuel already on its way up a pipe counts as in the tank, so the "Full"
// refusal and the autopilot never over-fill.
function pending(ti) {
  var n = 0;
  for (var i = 0; i < blobs.length; i++) if (blobs[i].tank === ti && blobs[i].kind === "good") n += blobs[i].amount;
  return n;
}
function need(ti) { return rocket.cap - rocket.fill[ti] - pending(ti); }
function neediest() {
  var best = -1, bn = 0;
  for (var i = 0; i < 3; i++) { var n = need(i); if (n > bn) { bn = n; best = i; } }
  return best;
}
function tankY(ti) { return PAD_Y + (TANKS[ti].y0 + TANKS[ti].y1) / 2; }

// --- events ------------------------------------------------------------------
function deliver(m, id) {
  var mc = machines[id];
  if (id === "furnace") {
    kill(m);
    if (m.kind === "bad") { stats.burnt++; burst(mc.x, BOX_Y + 20, "#ff6a2a", 14); }
    else { stats.wasted++; say("Wasted", mc.x, BOX_Y - 30, "#c8b8a0"); burst(mc.x, BOX_Y + 20, "#ffd27a", 8); }
    return;
  }
  // No rocket on the pad (it is leaving, or it is dead): the intakes are shut.
  if (state !== "play") { toGutter(m); return; }
  var ti = mc.tank;
  if (m.kind === "bad") {
    kill(m); mc.flash = 0.5;
    blobs.push({ tank: ti, d: 0, kind: "bad", amount: 0, rot: m.rot });
    say("Bomb!", mc.x, BOX_Y - 30, "#ff5a5a"); burst(mc.x, BOX_Y + 30, "#ff5a5a", 12);
    return;
  }
  if (need(ti) <= 0) { toGutter(m); stats.full++; say("Full", mc.x, BOX_Y - 30, "#c8b8a0"); return; }
  kill(m); mc.flash = 0.35; stats.fuel++;
  blobs.push({ tank: ti, d: 0, kind: "good", amount: m.gold ? GOLD_FILL : 1, gold: m.gold, rot: m.rot });
  burst(mc.x, BOX_Y + 50, mc.color, 6);
}
function kill(m) { m.st = "dead"; }
function toGutter(m) { m.st = "drop"; m.vy = 0; m.kind = "spent"; }

// A marble reaches the top of its pipe.
function arrive(b) {
  if (state !== "play") return;
  var ti = b.tank, y = tankY(ti);

function makeCrack(ti) {

function startLaunch() {

// --- update --------------------------------------------------------------------

    var sm = smoke[i]; sm.t += dt; sm.x += sm.vx * dt; sm.y += sm.vy * dt; sm.vx *= 1 - dt * 1.5; sm.vy *= 1 - dt * 1.5;
    sm.r += dt * 40;

    return;

}

// The launch: the engine lights, smoke floods the pad, the rocket climbs out

    if (lt < IGNITE_SECONDS) {
      var k = lt / IGNITE_SECONDS;

      if (Math.random() < 0.7) puff(RX + (Math.random() - 0.5) * 40, PAD_Y + 6, (Math.random() < 0.5 ? -1 : 1) * (120 + Math.random() * 260), -20 - Math.random() * 40, 16 + Math.random() * 10, 1.4 + Math.random());
    } else {
      var rt = lt - IGNITE_SECONDS;

      if (rocket.y > -900) shake = Math.max(shake, 0.35);

          parts.push({ x: RX + (Math.random() - 0.5) * 30, y: nozzleY + 30 + Math.random() * 40, vx: (Math.random() - 0.5) * 120,
            vy: 200 + Math.random() * 200, g: 0, life: 0.35 + Math.random() * 0.3, t: 0, color: Math.random() < 0.5 ? "#ffc23a" : "#ff6a2a" });
        }

// A marble on the rails: gravity along the slope, rolling drag, clamped so it

// --- autopilot -------------------------------------------------------------------
// Where a switch should send the marble about to reach it: a bomb toward the

function autoWant(id, m) {
  var cur = sw[id].dir;

  var sc = [0, 0];
  for (var d = 0; d < 2; d++) {
    for (var j = 0; j < REACH[id][d].length; j++) {

// --- render ----------------------------------------------------------------------

}

    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);

}

  ctx.globalAlpha = ga;

function drawWheel() {
  var step = Math.PI * 2 / WHEEL_NOTCHES;
  cog(WHEEL.cx, WHEEL.cy, WHEEL.r + 14, 24, wheel.phase, C_BRASS_D);
  ctx.fillStyle = C_WOOD; ctx.beginPath(); ctx.arc(WHEEL.cx, WHEEL.cy, WHEEL.r - 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C_BRASS; ctx.lineWidth = 6;
  for (var j = 0; j < WHEEL_NOTCHES; j++) {
    var a = wheel.phase + j * step;
    ctx.beginPath(); ctx.moveTo(WHEEL.cx, WHEEL.cy);
    ctx.lineTo(WHEEL.cx + Math.cos(a) * (WHEEL.r - 8), WHEEL.cy + Math.sin(a) * (WHEEL.r - 8)); ctx.stroke();
    ctx.fillStyle = "#120c08";
    ctx.beginPath(); ctx.arc(WHEEL.cx + Math.cos(a) * WHEEL.r, WHEEL.cy + Math.sin(a) * WHEEL.r, R + 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = C_BRASS; ctx.beginPath(); ctx.arc(WHEEL.cx, WHEEL.cy, 14, 0, Math.PI * 2); ctx.fill();
}

function drawSwitches() {
  for (var k in sw) {
    var s = sw[k], live = CH[OUT[k][s.dir]];
    // The first stretch of the live branch glows, so the route reads at a glance.
    ctx.strokeStyle = "rgba(255,210,120,0.35)"; ctx.lineWidth = 2 * R + 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(live.xs[0], live.ys[0]);
    for (var i = 1; i < Math.min(live.n, 16); i++) ctx.lineTo(live.xs[i], live.ys[i]);
    ctx.stroke();
    cog(s.x, s.y, 30, 10, s.spin, s.flash > 0 ? "#ffe9b0" : C_STEEL);
    ctx.strokeStyle = C_BRASS; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(s.ang) * 58, s.y + Math.sin(s.ang) * 58); ctx.stroke();
    ctx.fillStyle = C_BRASS; ctx.beginPath(); ctx.arc(s.x + Math.cos(s.ang) * 58, s.y + Math.sin(s.ang) * 58, 7, 0, Math.PI * 2); ctx.fill();
  }
}

// Everything behind the machine: the screw, the top return rail and the
// ferris wheel, all faded back so they read as depth and never as a route.
function drawBackground() {
  ctx.globalAlpha = BG_ALPHA;
  var i, j;
  // Archimedes screw: a tube with a thread that climbs.

    }
    ctx.fillStyle = "#f3e6cf"; ctx.font = "700 28px system-ui, sans-serif";
    ctx.fillText("Rocket " + lastLaunch.n + ", " + Math.floor(lastLaunch.left) + " s to spare", 300, 686);
    ctx.globalAlpha = 1;
  }
  if (state === "fizzle" && phaseT > 0.8) {
    ctx.globalAlpha = Math.min(1, (phaseT - 0.8) / 0.3);
    ctx.fillStyle = "rgba(14,10,7,0.82)"; ctx.fillRect(40, 490, 500, 100);
    ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 3; ctx.strokeRect(40, 490, 500, 100);
    ctx.fillStyle = "#ff5a5a"; ctx.font = "800 56px system-ui, sans-serif";
    ctx.fillText(failWhy === "scrap" ? "Rocket scrapped" : "Launch failed", 300, 560);
    ctx.globalAlpha = 1;
  }

  if (state === "over") {
    ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f3e6cf"; ctx.font = "800 60px system-ui, sans-serif";
    ctx.fillText(failWhy === "scrap" ? "Rocket scrapped" : "Launch failed", W / 2, 420);
    ctx.font = "700 36px system-ui, sans-serif";
    ctx.fillText("Rockets launched " + launches.length, W / 2, 500);
    ctx.fillText("Stars " + stats.starsTotal, W / 2, 550);
    ctx.font = "600 24px system-ui, sans-serif";
    for (i = 0; i < Math.min(launches.length, 8); i++) {
      var L = launches[i], ly = 610 + i * 46;
      ctx.textAlign = "right"; ctx.fillStyle = "#cdbb9c"; ctx.fillText("Rocket " + L.n, 300, ly + 8);
      for (var s2 = 0; s2 < 3; s2++) starShape(340 + s2 * 36, ly, 14, s2 < L.stars);
      ctx.textAlign = "left"; ctx.fillStyle = "#cdbb9c"; ctx.fillText(Math.floor(L.left) + " s", 470, ly + 8);
    }
    ctx.textAlign = "center"; ctx.font = "26px system-ui, sans-serif"; ctx.fillStyle = "#cdbb9c";
    ctx.fillText(auto ? "Auto restarts in a moment" : "Tap to play again", W / 2, 640 + Math.min(launches.length, 8) * 46 + 30);
  }
}

// --- input ---------------------------------------------------------------------
function setAuto(on) { auto = on; reset(); }
cv.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale;
  if (x >= 290 && x <= 410 && y >= 30 && y <= 74) { setAuto(!auto); return; }
  if (state === "over") { reset(); return; }
  if (auto) return;
  var best = null, bd = TAP_REACH;
  for (var k in sw) {
    var d = Math.sqrt((sw[k].x - x) * (sw[k].x - x) + (sw[k].y - y) * (sw[k].y - y));
    if (d < bd) { bd = d; best = k; }
  }
  if (best) flip(best);
});
addEventListener("keydown", function (e) {
  if (e.repeat) return;
  if (e.key >= "1" && e.key <= "4" && !auto && state !== "over") flip("S" + (e.key - 1));
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "a" || e.key === "A") setAuto(!auto);
});

// --- loop ----------------------------------------------------------------------
var lastT = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
reset();
requestAnimationFrame(frame);
</script>
