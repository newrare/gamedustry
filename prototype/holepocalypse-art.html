<script>
"use strict";

/* ------------------------------------------------------------------
   HOLEPOCALYPSE, ART PASS — a throwaway copy of siege-golf.html dressed
   with the first painted pieces: the biome 1 fairway and the walker's
   sprite sheet (walk, hit, knockout), both embedded below as webp. The
   walls follow the white fences painted on the fairway, which narrows
   toward the gate the zombies pour out of. The boomer is still drawn.
   POWER SLOTS at the foot of the fairway: on the left two SIDE HOLES,
   where a ball rolled in slowly loads ball kinds (ice, fire, explosive...)
   on the tee; on the right two SUPERS charged by kills and fired by a tap
   (twenty of them).
   LAUNCH: the arc around the tee is two bands. The inner one rolls the
   ball (Direct: bounces off the fences), the outer one lobs it (flies over
   the horde, lands, rolls on). The band the touch STARTS in picks the
   shot for the whole gesture (a start beyond the arc is Direct, so a tap
   on a zombie blasts it); the finger can then roam anywhere, and its
   distance from the tee across the whole arc is the power. The preview
   says which: blue dots on the grass for Direct, an orange arc with a
   landing target for Lob.
   Everything is picked in the Powers menu (top right).

   HOLEPOCALYPSE (working name Siege Golf) — golf against a zombie horde.
   Is it fun to fling ricocheting golf balls up a sloped fairway into
   a zombie horde shambling down at you, and does the hole hidden among them
   make you dose a shot instead of spraying?

   The launcher is an ARC PAD: touch anywhere, the angle of the finger
   around the tee aims and its distance from the tee is the power
   (rings drawn every third of PAD_R). The green ring on the preview
   is where the ball tops out, the bar by the tee its power.
   Two phases switch the launcher to a GUN, balls free: hold to auto
   fire toward the finger, tap for a putt that tops out right there.
     Rush: hit the gold token that shows up on the fairway.
     Last stand: the flag that would end the run buys LAST_TIME of it
     instead, once a run; survive it and get one flag back.
   The fairway slopes toward you, so every ball rolls back into the
   bag (5 balls). Hits damage by speed and knock monsters into each
   other like billiard balls; a boomer (the bloated one) bursts and
   blows up its neighbours.
   A ball rolling SLOWLY over the hole drops in: a shockwave wipes
   SHOCK_COVER of the arena and a special ball is loaded (explosive
   or multiball); straight from the tee, two of them.
   A monster crossing the line costs a flag. Three flags.
   R restarts, D toggles the debug lines, 1 starts a rush, 2 a last stand.
------------------------------------------------------------------ */

// ---- tunables ----------------------------------------------------
var DES_W = 720, DES_H = 1280;
var RAIL_L = 60, RAIL_R = 660, TOP_Y = 140, DEFENSE_Y = 1107;   // RAIL_L/R: the widest the fairway gets
var TEE_X = 360, TEE_Y = 1186;
var GATE_L = 260, GATE_R = 465;   // where the zombies come through
var FAN_SPEED = 40;                // px/s a zombie drifts toward its own lane once through the gate

// the white fences painted on the fairway, measured off the picture (design px)
function wallL(y){ return Math.max(RAIL_L, 180 - 0.165*y); }
function wallR(y){ return Math.min(RAIL_R, 539 + 0.189*y); }
var WALL_SLOPE_L = -0.165, WALL_SLOPE_R = 0.189;

// walker sprite: its drawn height, where its feet sit under the body circle, frame rates
var SPRITE_H  = 118;
var FEET_DROP = 0.19;   // feet at m.y + FEET_DROP*SPRITE_H: the body circle is the zombie's footprint on the grass
var WALK_FPS  = 7;
var HIT_TIME  = 0.3;
var KO_TIME   = 0.6, KO_HOLD = 0.7, KO_FADE = 0.4;

// shot
var BALL_R       = 11;
var SHOT_MIN     = 420, SHOT_MAX = 1900;
var HOLD_DELAY   = 0.15;  // released sooner = a full-power tap
var HOLD_TIME    = 1.1;   // seconds for the power to drain from full to POWER_MIN
var POWER_MIN    = 0;     // 0 = SHOT_MIN, 1 = SHOT_MAX
var DEAD_ZONE    = 50;    // a finger this close to the tee does not aim
var MIN_UP       = 0.15;  // a shot always leaves at least this much upward
var FIRE_COOLDOWN= 0.12;
var BAG_MAX      = 5;
var BAG_REGEN    = 2.5;   // seconds to replace a ball that is gone for good
var PREVIEW_T    = 1.4;

// launcher
var PAD_R        = 280;   // gun putt only now
var SPLIT_R      = 210;   // where the touch starts: DEAD_ZONE..SPLIT_R is Direct,
var LOB_R        = 380;   // SPLIT_R..LOB_R is Lob, beyond the arc is Direct again;
                          // the power is the distance DEAD_ZONE..LOB_R, whatever the shot
var AUTO_RATE    = 0.12;  // gun: seconds between auto shots
var MIN_CLIMB    = 120;   // gun putt: slowest shot it may send

// phases
var RUSH_FIRST     = 10;  // seconds before the first rush token
var RUSH_EVERY_MIN = 20, RUSH_EVERY_MAX = 30;
var TOKEN_R        = 22, TOKEN_LIFE = 10;
var RUSH_TIME      = 6;
var LAST_TIME      = 8;
var LAST_PUSH      = 450; // knockback given to every monster when a last stand starts

// table
var SLOPE        = 300;   // px/s² pulling every ball down toward the tee
var ROLL_DECEL   = 90;    // rolling friction, px/s²
var RAIL_BOUNCE  = 0.85;
var BUMPER_COUNT = 2, BUMPER_R = 30, BUMPER_KICK = 1.15;
var BALL_LIFE    = 12;

// hole
var HOLE_R         = 22;
var HOLE_MAX_SPEED = 560; // faster than this skips over the hole
var HOLE_PULL      = 1600;
var SPECIAL_MAX    = 4;
var HOLE_SPECIAL   = true; // false = the shockwave is the whole reward
var SHOCK_COVER    = 0.8;  // share of the arena the shockwave wipes
var SHOCK_TIME     = 0.5;  // seconds for the wave to reach its full radius
var SHAKE          = 14;   // screen shake on a shockwave, px

// monsters
var WALKER_HP = 3, WALKER_R = 30;
var BOOMER_HP = 2, BOOMER_R = 28, BOOMER_CHANCE = 0.25;

var MON_E        = 0.6;   // monster / monster restitution

var LOB_MIN   = 120, LOB_MAX = 950;   // landing distance from the tee, pad power 0 to 1

// ---- frame -------------------------------------------------------
var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var scale = 1, offX = 0, offY = 0, dpr = 1;

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+"px"; cv.style.height = h+"px";
  scale = Math.min(w/DES_W, h/DES_H);
  offX = (w - DES_W*scale)/2; offY = (h - DES_H*scale)/2;
}
window.addEventListener("resize", resize);
resize();

function toDesign(e){
  var r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left - offX)/scale, y:(e.clientY - r.top - offY)/scale };
}

function rand(a, b){ return a + Math.random()*(b - a); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

// ---- state -------------------------------------------------------
var balls, mons, bumpers, hole, bag, regenT, cool, specials, lastShot, shotId, chains;
var flags, score, time, spawnT, rings, texts, over, bestChain, holes, kills, redT, aim, shock, shakeT, fps = 0;
var teeX = TEE_X, helpT = 8, kos = [];

function reset(){
  balls = []; mons = []; rings = []; texts = []; specials = []; chains = {}; kos = [];
  bag = BAG_MAX; regenT = 0; cool = 0; lastShot = null; shotId = 0;
  flags = FLAGS; score = 0; time = 0; spawnT = 1; over = false;
  bestChain = 0; holes = 0; kills = 0; redT = 0; aim = null; shock = null; shakeT = 0;
  phase = "normal"; phaseT = 0; phaseHelpT = 0; lastUsed = false; token = null; tokenT = RUSH_FIRST;
  drops = []; zones = []; sweeps = []; freezeT = goldT = magnetT = 0; buildSlots();
  bumpers = [];
  for (var i = 0; i < BUMPER_COUNT; i++){
    for (var k = 0; k < 20; k++){
      var b = { x:rand(140, 580), y:rand(420, 860) };
      if (farFrom(b.x, b.y, 170)){ bumpers.push(b); break; }
    }
  }
  hole = { x:0, y:0 };
  moveHole();
}

function farFrom(x, y, d){
  for (var i = 0; i < bumpers.length; i++){
    var dx = bumpers[i].x - x, dy = bumpers[i].y - y;
    if (dx*dx + dy*dy < d*d) return false;
  }
  return true;
}

function moveHole(){
  for (var k = 0; k < 30; k++){
    var y = rand(260, 760), x = rand(wallL(y) + 60, wallR(y) - 60);
    var dx = x - hole.x, dy = y - hole.y;
    if (farFrom(x, y, BUMPER_R + 70) && dx*dx + dy*dy > 200*200){ hole.x = x; hole.y = y; return; }
  }
}

function say(x, y, s, c, big){ texts.push({ x:x, y:y, s:s, c:c || "#fff", t:0, big:!!big }); }

// ---- shooting ----------------------------------------------------
// free = a gun phase shot, which takes nothing from the bag
function fire(vx, vy, free, lob){
  if (over) return;
  if (!free && bag <= 0){ say(teeX, TEE_Y - 50, "Empty", "#ff6a6a"); return; }
  if (cool > 0) return;
  var sp = Math.sqrt(vx*vx + vy*vy);
  if (sp < 1) return;
  var ux = vx/sp, uy = vy/sp;
  if (uy > -MIN_UP){ uy = -MIN_UP; ux = (ux < 0 ? -1 : 1)*Math.sqrt(1 - uy*uy); }
  vx = ux*sp; vy = uy*sp;
  if (!free) bag--;
  cool = FIRE_COOLDOWN; shotId++;
  var b = { x:teeX, y:TEE_Y, vx:vx, vy:vy, id:shotId, age:0, kind:"plain", bounces:0, touched:false, lipped:false };
  applyMod(b, specials.length ? specials.shift() : "plain");
  if (lob){ b.air = true; b.z = 0.01; b.vz = lob.vz; }
  balls.push(b);
  lastShot = { vx:vx, vy:vy };
}

// ---- launcher ----------------------------------------------------
// Two ways to shoot, and the phase decides which:
//   normal              the ARC PAD: the angle of the finger around the tee
//                       aims, its distance from the tee is the power
//   rush, last stand    the GUN: hold to auto fire toward the finger, tap
//                       for a putt that tops out where you tapped; balls free
var phase, phaseT, phaseHelpT, lastUsed, token, tokenT;

function gunPhase(){ return phase !== "normal"; }

function startPhase(k){
  phase = k; phaseT = k === "rush" ? RUSH_TIME : LAST_TIME; phaseHelpT = 2.5;
  token = null;
  say(DES_W/2, 520, k === "rush" ? "Rush!" : "Last stand!", k === "rush" ? "#ffd34d" : "#ff4d4d", true);
  if (k === "last") for (var i = 0; i < mons.length; i++) mons[i].ky -= LAST_PUSH;
}

function updatePhase(dt){
  phaseHelpT -= dt;
  if (phase === "normal"){
    if (!TOKEN_ON) return;
    if (token){
      token.life -= dt;
      if (token.life <= 0){ token = null; tokenT = rand(RUSH_EVERY_MIN, RUSH_EVERY_MAX); }
    } else {
      tokenT -= dt;
      if (tokenT <= 0){
        for (var k = 0; k < 20; k++){
          var y = rand(300, 820), x = rand(wallL(y) + 50, wallR(y) - 50);
          if (farFrom(x, y, BUMPER_R + 60) && Math.hypot(x - hole.x, y - hole.y) > 90){ token = { x:x, y:y, life:TOKEN_LIFE }; break; }
        }
        tokenT = rand(RUSH_EVERY_MIN, RUSH_EVERY_MAX);
      }
    }
    return;
  }
  phaseT -= dt;
  if (phaseT <= 0){
    if (phase === "last"){ flags = 1; say(DES_W/2, 520, "Saved, one flag back", "#7dff9a", true); }
    phase = "normal";
    tokenT = rand(RUSH_EVERY_MIN, RUSH_EVERY_MAX);
  }
}

// full on a tap; held, it drains to POWER_MIN over HOLD_TIME and climbs back
function speedOf(p){ return SHOT_MIN + (SHOT_MAX - SHOT_MIN)*clamp(p, 0, 1); }
function angleTo(x, y){ return Math.atan2(x - teeX, TEE_Y - y); }
function vecTo(x, y, p){
  var dx = x - teeX, dy = y - TEE_Y, l = Math.sqrt(dx*dx + dy*dy);
  if (l < DEAD_ZONE) return null;
  var s = speedOf(p);
  return { vx:dx/l*s, vy:dy/l*s, p:p };
}
function padPower(x, y){
  var dx = x - teeX, dy = y - TEE_Y;
  return clamp((Math.sqrt(dx*dx + dy*dy) - DEAD_ZONE)/(PAD_R - DEAD_ZONE), 0, 1);
}

// where a shot stops climbing (slope and friction, no rails)
function apexOf(vx, vy){
  var x = teeX, y = TEE_Y, h = 1/120;
  for (var i = 0; i < 480; i++){
    vy += SLOPE*h;
    if (vy >= 0 || y < TOP_Y + BALL_R) break;
    var sp = Math.sqrt(vx*vx + vy*vy), dec = Math.min(sp, ROLL_DECEL*h);
    vx -= vx/sp*dec; vy -= vy/sp*dec;
    x += vx*h; y += vy*h;
  }
  return { x:x, y:y };
}

// the shot that tops out on (x, y): the gun's putt
function climbTo(x, y){
  y = Math.max(TOP_Y + BALL_R, Math.min(y, TEE_Y - 40));
  var a = angleTo(x, y), s = SHOT_MAX;
  for (var k = 0; k < 6; k++){
    var lo = MIN_CLIMB, hi = SHOT_MAX;
    for (var it = 0; it < 16; it++){
      s = (lo + hi)/2;
      if (apexOf(Math.sin(a)*s, -Math.cos(a)*s).y > y) lo = s; else hi = s;
    }
    var ap = apexOf(Math.sin(a)*s, -Math.cos(a)*s);
    a += Math.atan2(x - ap.x, Math.max(80, TEE_Y - y));
  }
  return { vx:Math.sin(a)*s, vy:-Math.cos(a)*s, p:(s - SHOT_MIN)/(SHOT_MAX - SHOT_MIN) };
}

// the shot the current touch would send, for the preview (null = none)
function aimVec(){
  if (!aim) return null;
  if (gunPhase()) return aim.held >= HOLD_DELAY ? vecTo(aim.x, aim.y, 1) : null;
  var d = Math.hypot(aim.x - teeX, aim.y - TEE_Y), p = clamp((d - DEAD_ZONE)/(LOB_R - DEAD_ZONE), 0, 1);
  return aim.mode === "lob" ? lobVec(aim.x, aim.y, p) : vecTo(aim.x, aim.y, p);
}

// which band the finger is in, for the drawing
function bandOf(x, y){ var d = Math.hypot(x - teeX, y - TEE_Y); return d < DEAD_ZONE ? null : d >= SPLIT_R && d < LOB_R ? "lob" : "direct"; }

// a lob toward the finger: p picks how far it lands
function lobVec(x, y, p){
  var dx = x - teeX, dy = y - TEE_Y, l = Math.sqrt(dx*dx + dy*dy);
  if (l < DEAD_ZONE) return null;
  var ux = dx/l, uy = dy/l;
  if (uy > -MIN_UP){ uy = -MIN_UP; ux = (ux < 0 ? -1 : 1)*Math.sqrt(1 - uy*uy); }
  var range = LOB_MIN + (LOB_MAX - LOB_MIN)*p, T = LOB_T0 + range*LOB_TK, sp = range/T;
  return { vx:ux*sp, vy:uy*sp, p:p, lob:true, vz:LOB_G*T/2, T:T };
}

// the band under the touch's first point picks the shot for the whole gesture
function controlDown(p){ aim = { x:p.x, y:p.y, held:0, autoT:0, auto:false, mode:bandOf(p.x, p.y) === "lob" ? "lob" : "direct" }; }
function controlMove(p){ aim.x = p.x; aim.y = p.y; }

function controlUp(){
  var v;
  if (gunPhase()){ if (!aim.auto){ v = climbTo(aim.x, aim.y); fire(v.vx, v.vy, true); } }
  else { v = aimVec(); if (v) fire(v.vx, v.vy, false, v.lob ? v : null); }
  aim = null;
}

function updateControl(dt){
  helpT -= dt;
  if (!aim) return;
  aim.held += dt;
  if (gunPhase() && aim.held >= HOLD_DELAY){
    aim.autoT -= dt;
    if (aim.autoT <= 0){
      var v = vecTo(aim.x, aim.y, 1);
      if (v) fire(v.vx, v.vy, true);
      aim.autoT = AUTO_RATE; aim.auto = true;
    }
  }
}

cv.addEventListener("pointerdown", function(e){
  if (over){ reset(); return; }
  var p = toDesign(e);
  if (superTap(p)) return;
  controlDown(p);
});
cv.addEventListener("pointermove", function(e){ if (aim) controlMove(toDesign(e)); });
cv.addEventListener("pointerup", function(){ if (aim) controlUp(); });
cv.addEventListener("pointercancel", function(){ aim = null; });
window.addEventListener("keydown", function(e){
  if (e.key === "r" || e.key === "R") reset();
  if (e.key === "d" || e.key === "D") SHOW_DEBUG = !SHOW_DEBUG;
  if (!over && e.key === "1") startPhase("rush");
  if (!over && e.key === "2") startPhase("last");
});

function modOf(key){ for (var i = 0; i < MODS.length; i++) if (MODS[i].key === key) return MODS[i]; return MODS[0]; }

function buildSlots(){
  slots = [];
  for (var i = 0; i < 4; i++){
    var left = i < 2, y = SLOT_YS[i % 2];
    slots.push({ x:left ? wallL(y) + SLOT_R + 8 : wallR(y) - SLOT_R - 8, y:y, left:left,
                 power:left ? loadout.left[i] : loadout.right[i - 2], cool:0, hit:0, charge:0 });
  }
}

// a ball takes a kind, with whatever state that kind runs on
function applyMod(b, kind){
  b.kind = kind;
  if (kind === "pierce") b.hits = {};
  if (kind === "bouncy") b.bounceT = 6;
  if (kind === "split") b.gen = 0;
  if (kind === "homing") b.homeT = HOMING_TIME;
}

function newTag(){ return ++shotId; }
function fairwayPoint(){ var y = rand(TOP_Y + 60, DEFENSE_Y - 80); return { x:rand(wallL(y) + 30, wallR(y) - 30), y:y }; }
function drop(x, y, delay, o){
  drops.push({ x:x, y:y, t:-delay, fall:o.fall || 0.45, R:o.R || 44, dmg:o.dmg || 2, push:o.push || 140,
               kind:o.kind || "plain", tag:o.tag, up:!!o.up, done:false });
}
function powerBall(vx, vy, kind, tag, extra){
  var b = { x:teeX, y:TEE_Y, vx:vx, vy:vy, id:tag, age:0, kind:"plain", bounces:0, touched:false, lipped:false, free:true };
  applyMod(b, kind);
  if (extra) for (var k in extra) b[k] = extra[k];
  balls.push(b);
  return b;
}
function fan(n, spread, speed, kind, tag, extra){
  for (var i = 0; i < n; i++){
    var a = n > 1 ? -spread + 2*spread*i/(n - 1) : 0;
    powerBall(Math.sin(a)*speed, -Math.cos(a)*speed, kind, tag, extra ? JSON.parse(JSON.stringify(extra)) : null);
  }
}
function lowest(n){ return mons.slice().sort(function(a, b){ return b.y - a.y; }).slice(0, n); }
function densest(){
  var best = null, bn = -1;
  for (var i = 0; i < mons.length; i++){
    var n = 0;
    for (var j = 0; j < mons.length; j++) if (Math.hypot(mons[i].x - mons[j].x, mons[i].y - mons[j].y) < 150) n++;
    if (n > bn){ bn = n; best = mons[i]; }
  }
  return best;
}
function rainOf(n, every, o){ for (var i = 0; i < n; i++){ var p = fairwayPoint(); drop(p.x, p.y, i*every, o); } }

function powerOf(key){ for (var i = 0; i < POWERS.length; i++) if (POWERS[i].key === key) return POWERS[i]; return POWERS[0]; }

function firePower(key){
  var p = powerOf(key);
  p.fire(newTag());
  say(DES_W/2, 560, p.icon + " " + p.name, "#ffd34d", true);
}

// a drop has landed: damage around it, never pushing a zombie toward the line
function land(d){
  rings.push({ x:d.x, y:d.y, r:d.R, t:0 });
  if (d.kind === "meteor") shakeT = SHOCK_TIME*0.8;
  for (var i = 0; i < mons.length; i++){
    var m = mons[i];
    if (m.dead) continue;
    var dx = m.x - d.x, dy = m.y - d.y, dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > d.R + m.r*0.6) continue;
    if (d.up) m.ky -= d.push;
    else if (dist > 1){ m.kx += dx/dist*d.push*0.6; m.ky += Math.min(0, dy/dist)*d.push*0.6 - d.push*0.2; }
    if (d.kind === "ice") m.frozenT = 3;
    hurt(m, d.dmg, d.tag);
  }
  if (d.kind === "fire") zones.push({ kind:"fire", x:d.x, y:d.y, r:55, life:4, tick:0, tag:d.tag });
  if (d.kind === "cluster") for (var k = 0; k < 5; k++){
    var a = k*Math.PI*2/5;
    drop(d.x + Math.cos(a)*60, d.y + Math.sin(a)*60, 0.1, { tag:d.tag, R:34, dmg:2, fall:0.22 });
  }
}

function updatePowers(dt){
  freezeT = Math.max(0, freezeT - dt); goldT = Math.max(0, goldT - dt); magnetT = Math.max(0, magnetT - dt);
  var i;
  for (i = 0; i < slots.length; i++){ slots[i].cool -= dt; slots[i].hit -= dt; }
  for (i = drops.length - 1; i >= 0; i--){
    var d = drops[i];
    d.t += dt;
    if (!d.done && d.t >= d.fall){ d.done = true; land(d); }
    if (d.done) drops.splice(i, 1);
  }
  for (i = zones.length - 1; i >= 0; i--){
    var z = zones[i];
    z.life -= dt; z.tick -= dt;
    if (z.tick <= 0){
      z.tick = 0.5;
      for (var j = 0; j < mons.length; j++) if (Math.hypot(mons[j].x - z.x, mons[j].y - z.y) < z.r + mons[j].r*0.5) hurt(mons[j], 1, z.tag);
    }
    if (z.life <= 0) zones.splice(i, 1);
  }
  for (i = sweeps.length - 1; i >= 0; i--){
    var s = sweeps[i];
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    for (var k = 0; k < mons.length; k++){
      var m = mons[k];
      if (m.dead || s.hits[m.id] || Math.abs(m.x - s.x) > s.w/2 + m.r || Math.abs(m.y - s.y) > s.h/2 + m.r) continue;
      s.hits[m.id] = 1;
      if (s.kind === "mower"){ m.ky -= 380; hurt(m, m.kind === "walker" ? 99 : 3, s.tag); }
      else { m.ky -= 500; m.kx += (m.x < s.x ? -1 : 1)*320; hurt(m, 3, s.tag); }
    }
    if (s.life <= 0) sweeps.splice(i, 1);
  }
}

// a player's ball rolling over an open SIDE HOLE: slow enough, it drops in
// and the hole loads its kind on the tee (the ball itself comes home); too
// fast, it skips over; a capped hole, or a power's ball, just rolls over
// (the right slots are buttons: balls go through them)
function sideHoleHit(b, h){
  if (b.free || b.air) return false;
  var sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
  for (var i = 0; i < 2; i++){
    var s = slots[i];
    if (s.cool > 0) continue;
    var dx = s.x - b.x, dy = s.y - b.y, d = Math.sqrt(dx*dx + dy*dy);
    if (d >= SIDE_HOLE_R + BALL_R || sp >= SIDE_HOLE_MAX) continue;
    if (d < SIDE_HOLE_R*0.7){
      var m = modOf(s.power);
      s.cool = NO_COOLDOWN ? 0.5 : TARGET_COOL; s.hit = 0.4;
      for (var k = 0; k < LEFT_EXTRA && specials.length < SPECIAL_MAX; k++) specials.push(s.power);
      bag = Math.min(BAG_MAX, bag + 1);
      rings.push({ x:s.x, y:s.y, r:50, t:0 });
      say(s.x + 160, s.y - 40, m.icon + " " + m.name + " x" + LEFT_EXTRA, "#7dff9a", true);
      return true;
    }
    b.vx += dx/d*SIDE_HOLE_PULL*h; b.vy += dy/d*SIDE_HOLE_PULL*h;
  }
  return false;
}

// a tap on a RIGHT slot: a full super fires, an empty one says how full it is
function superTap(p){
  for (var i = 2; i < 4; i++){
    var s = slots[i];
    if (Math.hypot(p.x - s.x, p.y - s.y) > SLOT_R + 18) continue;
    if (NO_COOLDOWN || s.charge >= 1){ s.charge = 0; s.hit = 0.4; firePower(s.power); }
    else say(s.x - 120, s.y - 40, "Charging " + Math.floor(s.charge*100) + "%", "#ffffff");
    return true;
  }
  return false;
}

// every kill feeds both supers
function chargeSupers(){ for (var i = 2; i < slots.length; i++) slots[i].charge = Math.min(1, slots[i].charge + 1/SUPER_KILLS); }

// ---- drawing the powers ------------------------------------------
var DROP_COLORS = { plain:"#ffffff", fire:"#ff8a2a", ice:"#9fe8ff", gold:"#ffd34d", cluster:"#555555", meteor:"#8a5a3a" };

function drawZones(){
  for (var i = 0; i < zones.length; i++){
    var z = zones[i], a = Math.min(1, z.life)*(0.35 + 0.1*Math.sin(time*20 + i));
    ctx.fillStyle = "rgba(255,110,30," + a + ")";
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,220,80," + a + ")";
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r*0.5, 0, Math.PI*2); ctx.fill();
  }
}

function drawDrops(){
  for (var i = 0; i < drops.length; i++){
    var d = drops[i];
    if (d.t < 0) continue;
    var k = clamp(d.t/d.fall, 0, 1), big = d.kind === "meteor" ? 3.5 : 1;
    ctx.fillStyle = "rgba(0,0,0," + 0.35*k + ")";
    ctx.beginPath(); ctx.ellipse(d.x, d.y, d.R*0.35*(0.4 + 0.6*k), d.R*0.14*(0.4 + 0.6*k), 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = DROP_COLORS[d.kind] || "#fff";
    ctx.beginPath(); ctx.arc(d.x, d.y - (1 - k)*420, BALL_R*big*(1.7 - 0.7*k), 0, Math.PI*2); ctx.fill();

}

function drawSweeps(){
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "72px sans-serif";
  for (var i = 0; i < sweeps.length; i++){
    var s = sweeps[i];
    ctx.save(); ctx.translate(s.x, s.y);

// a side hole: an open cup with a flag showing its kind, or capped while it recharges
function drawSideHole(s, p, ready, k, pulse){
  var r = SIDE_HOLE_R;
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.beginPath(); ctx.arc(s.x, s.y, r + 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = ready ? "#0e1a10" : "#8a8f80";
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.fill();
  if (ready){
    ctx.strokeStyle = "rgba(125,255,154," + (0.5 + 0.5*pulse) + ")"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(s.x, s.y, r + 7 + pulse*3, 0, Math.PI*2); ctx.stroke();
  } else {
    ctx.strokeStyle = "#7dff9a"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(s.x, s.y, r + 7, -Math.PI/2, -Math.PI/2 + Math.PI*2*clamp(k, 0, 1)); ctx.stroke();
  }
  if (s.hit > 0){ ctx.fillStyle = "rgba(255,255,255," + s.hit*1.5 + ")"; ctx.beginPath(); ctx.arc(s.x, s.y, r + 12, 0, Math.PI*2); ctx.fill(); }
  // the flag: a pole out of the cup, the kind's icon on the pennant
  var fx = s.x + 4, top = s.y - 74;
  ctx.strokeStyle = "#eee"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(fx, s.y); ctx.lineTo(fx, top); ctx.stroke();
  ctx.fillStyle = ready ? (COLORS[s.power] || "#fff") : "#999";
  ctx.beginPath(); ctx.moveTo(fx, top); ctx.lineTo(fx + 46, top + 14); ctx.lineTo(fx, top + 28); ctx.fill();
  ctx.globalAlpha = ready ? 1 : 0.5;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "18px sans-serif";
  ctx.fillText(p.icon, fx + 16, top + 14);
  ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  ctx.font = "bold 20px ui-monospace,Menlo,monospace"; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
  ctx.fillText(p.name, s.x + r + 12, s.y + 7);
}

function drawSlots(){
  for (var i = 0; i < slots.length; i++){
    var s = slots[i], p = s.left ? modOf(s.power) : powerOf(s.power), pulse = 0.5 + 0.5*Math.sin(time*5 + i);
    var ready = s.left ? s.cool <= 0 : (NO_COOLDOWN || s.charge >= 1);
    var k = s.left ? 1 - s.cool/(NO_COOLDOWN ? 0.5 : TARGET_COOL) : s.charge;
    var col = s.left ? "125,255,154" : "255,211,77";
    if (s.left){ drawSideHole(s, p, ready, k, pulse); continue; }
    // a super is a raised button
    ctx.fillStyle = "rgba(40,20,50,0.85)";
    ctx.beginPath(); ctx.arc(s.x, s.y, SLOT_R, 0, Math.PI*2); ctx.fill();
    if (ready){
      ctx.strokeStyle = "rgba(" + col + "," + (0.6 + 0.4*pulse) + ")"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(s.x, s.y, SLOT_R + 3 + pulse*3, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(s.x, s.y, SLOT_R + 3, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = "rgb(" + col + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, SLOT_R + 3, -Math.PI/2, -Math.PI/2 + Math.PI*2*clamp(k, 0, 1)); ctx.stroke();
    }
    if (s.hit > 0){ ctx.fillStyle = "rgba(255,255,255," + s.hit*1.5 + ")"; ctx.beginPath(); ctx.arc(s.x, s.y, SLOT_R + 10, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = ready ? 1 : 0.45;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "30px sans-serif";
    ctx.fillText(p.icon, s.x, s.y + 1);
    ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
    ctx.font = "bold 20px ui-monospace,Menlo,monospace"; ctx.fillStyle = "#fff";
    ctx.textAlign = s.left ? "left" : "right";
    var label = s.left ? p.name : (ready ? "Tap: " : "") + p.name;
    ctx.fillText(label, s.x + (s.left ? 1 : -1)*(SLOT_R + 10), s.y + 7);
  }
  ctx.textAlign = "center";
}

function drawPowerOverlays(){
  if (freezeT > 0){ ctx.fillStyle = "rgba(150,220,255," + Math.min(0.18, freezeT*0.1) + ")"; ctx.fillRect(0, 0, DES_W, DES_H); }
  if (magnetT > 0){
    ctx.strokeStyle = "rgba(125,255,154," + (0.4 + 0.3*Math.sin(time*10)) + ")"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(hole.x, hole.y, HOLE_R*4, 0, Math.PI*2); ctx.stroke();
  }
  var lines = [];
  if (goldT > 0) lines.push("Gold x3  " + Math.ceil(goldT) + " s");
  if (freezeT > 0) lines.push("Frozen  " + Math.ceil(freezeT) + " s");
  if (magnetT > 0) lines.push("Magnet  " + Math.ceil(magnetT) + " s");
  ctx.textAlign = "right"; ctx.font = "bold 22px ui-monospace,Menlo,monospace"; ctx.fillStyle = "#ffd34d";
  for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], RAIL_R - 10, TOP_Y + 40 + i*28);
}

// ---- damage, kills, explosions -----------------------------------
function hurt(m, dmg, tag){
  if (m.dead) return;
  m.hp -= dmg; m.flash = 0.12; m.hitT = HIT_TIME;
  if (tag){ m.tag = tag; m.tagT = 1.5; }
  if (m.hp <= 0) kill(m, tag);
}

function kill(m, tag){
  m.dead = true; kills++; chargeSupers();
  if (m.kind === "walker") kos.push({ x:m.x, y:m.y, t:0, flip:m.kx < 0 });
  var n = 1;
  if (tag){ n = chains[tag] = (chains[tag] || 0) + 1; }
  var gain = KILL_SCORE*n*(goldT > 0 ? 3 : 1);
  score += gain;
  say(m.x, m.y, "+" + gain, goldT > 0 ? "#ffd34d" : "#ffe27a");
  if (n >= 2) say(m.x, m.y - 34, "Chain x" + n, "#ff9a3d", n >= 4);
  if (n > bestChain) bestChain = n;
  if (m.kind === "boomer") explode(m.x, m.y, BOOMER_RADIUS, BOOMER_DMG, BOOMER_PUSH, tag);
}

function explode(x, y, R, dmg, push, tag){
  rings.push({ x:x, y:y, r:R, t:0 });
  for (var i = 0; i < mons.length; i++){
    var m = mons[i];
    if (m.dead) continue;
    var dx = m.x - x, dy = m.y - y, d = Math.sqrt(dx*dx + dy*dy);
    if (d > R + m.r) continue;
    var nx = d > 1 ? dx/d : 0, ny = d > 1 ? dy/d : -1;
    var k = push*(1 - 0.5*d/(R + m.r));
    m.kx += nx*k; m.ky += ny*k;
    hurt(m, dmg, tag);
  }
}

// ---- balls -------------------------------------------------------
function bounced(b){
  b.bounces++;
  if (b.kind === "split"){
    if (b.gen >= SPLIT_GENS || balls.length >= BALLS_CAP){ b.kind = "plain"; return; }
    b.gen++;
    for (var g = -1; g <= 1; g += 2){
      var ga = g*0.45, gc = Math.cos(ga), gs = Math.sin(ga);
      balls.push({ x:b.x, y:b.y, vx:b.vx*gc - b.vy*gs, vy:b.vx*gs + b.vy*gc, id:b.id, age:b.age,
                   kind:"split", gen:b.gen, bounces:b.bounces, touched:true, lipped:false, free:true });
    }
    return;
  }
  if (b.kind !== "multi") return;
  b.kind = "plain";
  for (var s = -1; s <= 1; s += 2){
    var a = s*MULTI_SPREAD, c = Math.cos(a), si = Math.sin(a);
    balls.push({ x:b.x, y:b.y, vx:b.vx*c - b.vy*si, vy:b.vx*si + b.vy*c, id:b.id, age:b.age,
                 kind:"plain", bounces:b.bounces, touched:true, lipped:false });
  }
}

// the radius around (x, y) whose circle covers `frac` of the arena
function coverRadius(x, y, frac){
  var lo = 0, hi = 1600, GX = 36, GY = 40;
  for (var it = 0; it < 14; it++){
    var r = (lo + hi)/2, r2 = r*r, inside = 0, all = 0;
    for (var i = 0; i < GX; i++){
      var px = RAIL_L + (i + 0.5)*(RAIL_R - RAIL_L)/GX;
      for (var j = 0; j < GY; j++){
        var py = TOP_Y + (j + 0.5)*(DEFENSE_Y - TOP_Y)/GY;
        if (px < wallL(py) || px > wallR(py)) continue;
        all++;
        if ((px - x)*(px - x) + (py - y)*(py - y) < r2) inside++;
      }
    }
    if (inside/all < frac) lo = r; else hi = r;
  }
  return hi;
}

function holed(b){
  holes++;
  var inOne = b.bounces === 0 && !b.touched;
  var n = inOne ? 2 : 1;
  if (HOLE_SPECIAL) for (var i = 0; i < n && specials.length < SPECIAL_MAX; i++) specials.push(Math.random() < 0.5 ? "explosive" : "multi");
  score += HOLE_SCORE*n;
  say(hole.x, hole.y - 40, inOne ? "Hole in one!" : "Hole!", "#7dff9a", true);
  bag = Math.min(BAG_MAX, bag + 1);
  shock = { x:hole.x, y:hole.y, R:coverRadius(hole.x, hole.y, SHOCK_COVER), t:0, tag:b.id };
  shakeT = SHOCK_TIME;
  moveHole();
}

// the wave kills every monster its front reaches; the kills chain on the hole shot
function updateShock(dt){
  if (!shock) return;
  shock.t += dt;
  var k = Math.min(1, shock.t/SHOCK_TIME), r = shock.R*(1 - (1 - k)*(1 - k));
  if (k < 1){
    for (var i = 0; i < mons.length; i++){
      var m = mons[i];
      if (m.dead) continue;
      var dx = m.x - shock.x, dy = m.y - shock.y;
      if (Math.sqrt(dx*dx + dy*dy) - m.r*0.5 < r) hurt(m, 99, shock.tag);
    }
  }
  if (shock.t > SHOCK_TIME + 0.35) shock = null;
}

// a fence is a slanted line: push the ball back inside and reflect it on the
// fence's normal (works for the preview's plain {x, y, vx, vy} too)
function fenceBounce(b){
  var hit = false, n, vd, k;
  var l = wallL(b.y), r = wallR(b.y);
  if (b.x < l + BALL_R){
    b.x = l + BALL_R; hit = true;
    k = b.y*WALL_SLOPE_L + 180 > RAIL_L ? WALL_SLOPE_L : 0;
    n = { x:1/Math.sqrt(1 + k*k), y:-k/Math.sqrt(1 + k*k) };
  } else if (b.x > r - BALL_R){
    b.x = r - BALL_R; hit = true;
    k = 539 + b.y*WALL_SLOPE_R < RAIL_R ? WALL_SLOPE_R : 0;
    n = { x:-1/Math.sqrt(1 + k*k), y:k/Math.sqrt(1 + k*k) };
  }
  if (!hit) return false;
  vd = b.vx*n.x + b.vy*n.y;
  if (vd < 0){ b.vx -= (1 + RAIL_BOUNCE)*vd*n.x; b.vy -= (1 + RAIL_BOUNCE)*vd*n.y; }
  return true;
}

// a lob coming down: whatever it lands on takes the hit and its kind's effect
function lobLand(b){
  rings.push({ x:b.x, y:b.y, r:30, t:0 });
  if (b.kind === "explosive"){ explode(b.x, b.y, EXP_RADIUS, EXP_DMG, EXP_PUSH, b.id); return true; }
  for (var i = 0; i < mons.length; i++){
    var m = mons[i];
    if (m.dead || Math.hypot(m.x - b.x, m.y - b.y) > m.r + (b.kind === "giant" ? BALL_R*GIANT_R : BALL_R) + 6) continue;
    m.ky -= 220;
    if (b.kind === "ice") m.frozenT = 3;
    if (b.kind === "fire") zones.push({ kind:"fire", x:m.x, y:m.y, r:50, life:3, tick:0, tag:b.id });
    hurt(m, LOB_DMG*(b.kind === "heavy" ? 2 : 1), b.id);
    b.touched = true;
  }
  if (b.kind === "fire" && !b.touched) zones.push({ kind:"fire", x:b.x, y:b.y, r:45, life:2, tick:0, tag:b.id });
  return false;
}

// returns true when the ball is gone
function updateBall(b, dt){
  b.age += dt;
  if (b.age > BALL_LIFE) return true;
  if (b.kind === "bouncy"){ b.bounceT -= dt; if (b.bounceT <= 0) b.kind = "plain"; }
  var bouncy = b.kind === "bouncy";
  if (b.kind === "homing"){ b.homeT -= dt; if (b.homeT <= 0) b.kind = "plain"; }
  var sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
  var n = Math.max(1, Math.ceil(sp*dt/6)), h = dt/n;
  for (var s = 0; s < n; s++){
    if (b.air){
      // a lob in flight: over everything, bounced only by the fences and the top
      b.x += b.vx*h; b.y += b.vy*h;
      b.vz -= LOB_G*h; b.z += b.vz*h;
      fenceBounce(b);
      if (b.y < TOP_Y + BALL_R){ b.y = TOP_Y + BALL_R; b.vy = Math.abs(b.vy)*RAIL_BOUNCE; }
      if (b.z <= 0){ b.z = 0; b.air = false; b.vx *= LOB_ROLL; b.vy *= LOB_ROLL; if (lobLand(b)) return true; }
      continue;
    }
    if (b.kind === "homing"){
      var tgt = null, td = 1e9;
      for (var hm = 0; hm < mons.length; hm++){ var dd = Math.hypot(mons[hm].x - b.x, mons[hm].y - b.y); if (!mons[hm].dead && dd < td){ td = dd; tgt = mons[hm]; } }
      if (tgt){ b.vx += (tgt.x - b.x)/td*HOMING_ACC*h; b.vy += (tgt.y - b.y)/td*HOMING_ACC*h; }
    }
    if (!bouncy){
      b.vy += SLOPE*h;
      sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
      if (sp > 0){ var dec = Math.min(sp, ROLL_DECEL*h); b.vx -= b.vx/sp*dec; b.vy -= b.vy/sp*dec; }
    }

    // the hole: slow enough drops in, too fast skips over (the magnet takes anything near)
    var hx = hole.x - b.x, hy = hole.y - b.y, hd = Math.sqrt(hx*hx + hy*hy);
    var mag = magnetT > 0;
    if (hd < (mag ? HOLE_R*4 : HOLE_R + BALL_R)){
      if (sp < HOLE_MAX_SPEED || mag){
        if (hd < HOLE_R*(mag ? 1.2 : 0.6)){ holed(b); return true; }
        b.vx += hx/hd*HOLE_PULL*(mag ? 3 : 1)*h; b.vy += hy/hd*HOLE_PULL*(mag ? 3 : 1)*h;
      } else if (!b.lipped && hd < HOLE_R){
        b.lipped = true; say(hole.x, hole.y - 30, "Too fast", "#ffffff");
      }
    }

    b.x += b.vx*h; b.y += b.vy*h;

    if (fenceBounce(b)) bounced(b);
    if (b.y < TOP_Y + BALL_R){ b.y = TOP_Y + BALL_R; b.vy = Math.abs(b.vy)*RAIL_BOUNCE; bounced(b); }

    if (sideHoleHit(b, h)) return true;

    if (token && Math.hypot(b.x - token.x, b.y - token.y) < TOKEN_R + BALL_R){
      token = null; startPhase("rush");
    }

    for (var i = 0; i < bumpers.length; i++){
      var u = bumpers[i], dx = b.x - u.x, dy = b.y - u.y, d = Math.sqrt(dx*dx + dy*dy);
      if (d < BUMPER_R + BALL_R && d > 0){
        var nx = dx/d, ny = dy/d, vd = b.vx*nx + b.vy*ny;
        b.x = u.x + nx*(BUMPER_R + BALL_R); b.y = u.y + ny*(BUMPER_R + BALL_R);
        if (vd < 0){
          b.vx -= 2*vd*nx; b.vy -= 2*vd*ny;
          var k = Math.min(BUMPER_KICK, SHOT_MAX/Math.max(1, Math.sqrt(b.vx*b.vx + b.vy*b.vy)));
          b.vx *= k; b.vy *= k; u.hit = 0.15; bounced(b);
        }
      }
    }

    for (var j = 0; j < mons.length; j++){
      var m = mons[j];
      if (m.dead) continue;
      var mx = b.x - m.x, my = b.y - m.y, md = Math.sqrt(mx*mx + my*my);
      var rr = b.kind === "giant" ? BALL_R*GIANT_R : BALL_R;
      if (md >= m.r + rr || md === 0) continue;
      if (b.kind === "pierce"){
        if (!b.hits[m.id]){ b.hits[m.id] = 1; m.ky -= 200; hurt(m, 3, b.id); }
        continue;
      }
      var ex = mx/md, ey = my/md;
      b.x = m.x + ex*(m.r + rr); b.y = m.y + ey*(m.r + rr);
      var rv = (b.vx - m.kx)*ex + (b.vy - m.ky)*ey;
      if (rv >= 0) continue;
      var impact = -rv;
      if (b.kind === "explosive"){ explode(b.x, b.y, EXP_RADIUS, EXP_DMG, EXP_PUSH, b.id); return true; }
      var bm = b.kind === "heavy" ? HEAVY_MASS : 1;
      var jn = -(1 + BALL_E)*rv/(1/bm + 1/MON_MASS);
      b.vx += jn/bm*ex; b.vy += jn/bm*ey;
      m.kx -= jn/MON_MASS*ex; m.ky -= jn/MON_MASS*ey;
      b.touched = true;
      var dmg = Math.max(1, Math.floor(impact/DMG_SPEED))*(b.kind === "heavy" ? 2 : 1) + (b.kind === "giant" ? 1 : 0);
      if (b.kind === "ice") m.frozenT = 3;
      if (b.kind === "fire") zones.push({ kind:"fire", x:m.x, y:m.y, r:50, life:3, tick:0, tag:b.id });
      if (impact > MIN_DMG_SPEED) hurt(m, dmg, b.id);
      bounced(b);
    }

    if (bouncy){
      // a bouncy ball keeps its speed and bounces off the line instead of coming home
      if (b.y > DEFENSE_Y - 20 && b.vy > 0){ b.vy = -b.vy; bounced(b); }
      sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
      if (sp > 0){ b.vx *= BOUNCY_SPEED/sp; b.vy *= BOUNCY_SPEED/sp; }
    }

    // rolled back past the line: into the bag (a power's ball just goes)
    if (b.vy > 0 && b.age > 0.3 && b.y > DEFENSE_Y + 20){
      if (!b.free) bag = Math.min(BAG_MAX, bag + 1);
      return true;
    }
  }
  return false;
}

// ---- monsters ----------------------------------------------------
function spawn(){
  var group = Math.min(3, 1 + Math.floor(time/GROUP_EVERY));
  var n = 1 + Math.floor(Math.random()*group);
  for (var i = 0; i < n; i++){
    var boomer = Math.random() < BOOMER_CHANCE;
    var r = boomer ? BOOMER_R : WALKER_R;
    mons.push({ id:++monId, animT:0, frozenT:0, kind:boomer ? "boomer" : "walker", x:rand(GATE_L + r, GATE_R - r), y:TOP_Y - r - i*60,
                r:r, hp:boomer ? BOOMER_HP : WALKER_HP, maxHp:boomer ? BOOMER_HP : WALKER_HP,
                kx:0, ky:0, phase:rand(0, 6.28), speed:rand(0.85, 1.15), lane:rand(0.08, 0.92), tag:0, tagT:0, flash:0, dead:false });
  }
}

function updateMonsters(dt){
  var walk = Math.min(WALK_MAX, WALK_BASE + WALK_RAMP*time);
  var drag = Math.exp(-MON_DRAG*dt);
  var i, j, m;
  for (i = 0; i < mons.length; i++){
    m = mons[i];
    if (m.dead) continue;
    m.flash -= dt; m.hitT = (m.hitT || 0) - dt; m.tagT -= dt; if (m.tagT <= 0) m.tag = 0;
    m.frozenT -= dt;
    var frozen = freezeT > 0 || m.frozenT > 0;
    if (!frozen){
      m.animT += dt*m.speed;
      // fan out of the gate: each zombie steers toward its own share of the fairway width
      if (m.y > TOP_Y){
        var lx = wallL(m.y) + m.lane*(wallR(m.y) - wallL(m.y));
        m.x += clamp((lx - m.x)*1.2, -FAN_SPEED, FAN_SPEED)*dt;
      }
      m.x += Math.sin(time*1.3 + m.phase)*WOBBLE*dt;
      m.y += walk*m.speed*dt;
    }
    m.x += m.kx*dt;
    m.y += m.ky*dt;
    m.kx *= drag; m.ky *= drag;
    var ml = wallL(m.y) + m.r*0.8, mr = wallR(m.y) - m.r*0.8;
    if (m.y < TOP_Y){ ml = Math.max(ml, GATE_L); mr = Math.min(mr, GATE_R); }
    if (m.x < ml){ m.x = ml; m.kx = Math.abs(m.kx)*0.5; }
    if (m.x > mr){ m.x = mr; m.kx = -Math.abs(m.kx)*0.5; }
    if (m.y < TOP_Y - 200) { m.y = TOP_Y - 200; m.ky = Math.abs(m.ky)*0.5; }
  }
  // billiards between monsters
  for (i = 0; i < mons.length; i++){
    var a = mons[i]; if (a.dead) continue;
    for (j = i + 1; j < mons.length; j++){
      var b = mons[j]; if (b.dead) continue;
      var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx + dy*dy), rr = a.r + b.r;
      if (d >= rr || d === 0) continue;
      var nx = dx/d, ny = dy/d, push = (rr - d)/2;
      a.x -= nx*push; a.y -= ny*push; b.x += nx*push; b.y += ny*push;
      var rv = (a.kx - b.kx)*nx + (a.ky - b.ky)*ny;
      if (rv <= 0) continue;
      var jn = (1 + MON_E)*rv/2;
      a.kx -= jn*nx; a.ky -= jn*ny; b.kx += jn*nx; b.ky += jn*ny;
      if (rv > MON_HIT_SPEED){
        var tag = a.tag || b.tag;
        hurt(a, 1, tag); hurt(b, 1, tag);
      }
    }
  }
  // the line
  for (i = 0; i < mons.length; i++){
    m = mons[i];
    if (m.dead || m.y + m.r*0.5 < DEFENSE_Y) continue;
    m.dead = true; flags--; redT = 0.4;
    say(m.x, DEFENSE_Y - 30, "Flag lost", "#ff4d4d", true);
    if (flags <= 0){
      if (!lastUsed){ lastUsed = true; flags = 0; startPhase("last"); }
      else over = true;
    }
  }
  var keep = [];
  for (i = 0; i < mons.length; i++) if (!mons[i].dead) keep.push(mons[i]);
  mons = keep;
}

// ---- update ------------------------------------------------------
function update(dt){
  for (var t = texts.length - 1; t >= 0; t--){
    texts[t].t += dt; texts[t].y -= 40*dt;
    if (texts[t].t > 1.1) texts.splice(t, 1);
  }
  for (var r = rings.length - 1; r >= 0; r--){ rings[r].t += dt; if (rings[r].t > 0.35) rings.splice(r, 1); }
  for (var o = kos.length - 1; o >= 0; o--){ kos[o].t += dt; if (kos[o].t > KO_TIME + KO_HOLD + KO_FADE) kos.splice(o, 1); }
  for (var u = 0; u < bumpers.length; u++) bumpers[u].hit = Math.max(0, (bumpers[u].hit || 0) - dt);
  redT = Math.max(0, redT - dt);
  shakeT = Math.max(0, shakeT - dt);
  updateControl(dt);
  if (over) return;
  updatePhase(dt);

  time += dt; cool -= dt;
  spawnT -= dt;
  if (spawnT <= 0){ spawn(); spawnT = Math.max(SPAWN_MIN, SPAWN_START - SPAWN_RAMP*time); }

  for (var i = balls.length - 1; i >= 0; i--) if (updateBall(balls[i], dt)) balls.splice(i, 1);
  updatePowers(dt);
  updateShock(dt);
  updateMonsters(dt);

  // a ball lost for good (exploded, timed out) comes back slowly
  var own = 0;
  for (var ob = 0; ob < balls.length; ob++) if (!balls[ob].free) own++;
  if (bag + own < BAG_MAX){
    regenT += dt;
    if (regenT >= BAG_REGEN){ bag++; regenT = 0; }
  } else regenT = 0;
}

// ---- render ------------------------------------------------------
var COLORS = { plain:"#ffffff", explosive:"#ff5a2a", multi:"#4de1ff", pierce:"#ff4dff", bouncy:"#ff9de2", split:"#9dff8a",
               ice:"#9fe8ff", fire:"#ffb02a", heavy:"#6a6a7a", homing:"#c08aff", giant:"#ffffff" };

var bgImg = new Image(), sheetImg = new Image();
bgImg.src = ART.bg; sheetImg.src = ART.sheet;

function drawTable(){
  if (bgImg.complete && bgImg.naturalWidth) ctx.drawImage(bgImg, 0, 0, DES_W, DES_H);
  else { ctx.fillStyle = "#357a3a"; ctx.fillRect(0, 0, DES_W, DES_H); }
  if (SHOW_DEBUG){
    // the fences the physics uses, to check them against the picture
    ctx.strokeStyle = "rgba(255,255,0,0.5)"; ctx.lineWidth = 2; ctx.beginPath();
    for (var y = TOP_Y; y <= DES_H; y += 20){ if (y === TOP_Y) ctx.moveTo(wallL(y), y); else ctx.lineTo(wallL(y), y); }
    for (var y2 = TOP_Y; y2 <= DES_H; y2 += 20){ if (y2 === TOP_Y) ctx.moveTo(wallR(y2), y2); else ctx.lineTo(wallR(y2), y2); }
    ctx.moveTo(wallL(TOP_Y), TOP_Y); ctx.lineTo(wallR(TOP_Y), TOP_Y);
    ctx.stroke();
  }
}

// one frame of the walker's sheet, its feet on (x, feetY)
function drawFrame(i, x, feetY, alpha, flip){
  var f = ART.frames[i], s = SPRITE_H/180;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, feetY);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(sheetImg, f[0], f[1], f[2], f[3], (f[0] - f[4])*s, (f[1] - f[5])*s, f[2]*s, f[3]*s);
  ctx.restore();
}

function drawShadow(x, y, w){
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(x, y, w, w*0.32, 0, 0, Math.PI*2); ctx.fill();
}

function drawKos(){
  for (var i = 0; i < kos.length; i++){
    var o = kos[i], feet = o.y + FEET_DROP*SPRITE_H;
    var k = Math.min(3, Math.floor(o.t/KO_TIME*4));
    var a = o.t < KO_TIME + KO_HOLD ? 1 : 1 - (o.t - KO_TIME - KO_HOLD)/KO_FADE;
    drawFrame(12 + k, o.x, feet, Math.max(0, a), o.flip);
  }
}

function drawHole(){
  ctx.fillStyle = "#0e1a10"; ctx.beginPath(); ctx.arc(hole.x, hole.y, HOLE_R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = "#eee"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hole.x, hole.y); ctx.lineTo(hole.x, hole.y - 70); ctx.stroke();
  ctx.fillStyle = "#ff3b3b";
  ctx.beginPath(); ctx.moveTo(hole.x, hole.y - 70); ctx.lineTo(hole.x + 30, hole.y - 60); ctx.lineTo(hole.x, hole.y - 50); ctx.fill();
}

function drawBall(b){
  var br = BALL_R*(b.kind === "giant" ? GIANT_R : b.kind === "heavy" ? 1.3 : 1);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(b.x, b.y + br*0.5, br, br*0.45, 0, 0, Math.PI*2); ctx.fill();
  if (b.air) br *= 1 + b.z/400;
  ctx.fillStyle = COLORS[b.kind] || "#fff";
  ctx.beginPath(); ctx.arc(b.x, b.y - (b.z || 0), br, 0, Math.PI*2); ctx.fill();
  if (b.kind !== "plain"){ ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawMonster(m){
  if (m.kind === "walker" && sheetImg.complete && sheetImg.naturalWidth){
    var feet = m.y + FEET_DROP*SPRITE_H, fi;
    if (m.hitT > 0) fi = 8 + Math.min(3, Math.floor((1 - m.hitT/HIT_TIME)*4));
    else fi = Math.floor(m.animT*WALK_FPS + m.phase*3) % 8;
    drawShadow(m.x, feet - 4, 26);
    drawFrame(fi, m.x, feet, 1, false);
    if (m.flash > 0){
      ctx.globalCompositeOperation = "lighter";
      drawFrame(fi, m.x, feet, 0.55, false);
      ctx.globalCompositeOperation = "source-over";
    }
    if (freezeT > 0 || m.frozenT > 0){
      ctx.fillStyle = "rgba(160,230,255,0.45)";
      ctx.beginPath(); ctx.ellipse(m.x, feet - SPRITE_H*0.45, 34, SPRITE_H*0.5, 0, 0, Math.PI*2); ctx.fill();
    }
    for (var p = 0; p < m.maxHp; p++){
      ctx.fillStyle = p < m.hp ? "#ff5a5a" : "rgba(0,0,0,0.45)";
      ctx.fillRect(m.x - m.maxHp*7 + p*14, feet - SPRITE_H - 10, 11, 6);
    }
    return;
  }
  drawBoomer(m);
}

// top-down zombies: arms reaching down toward the tee, shoulders swaying
function drawBoomer(m){
  var boomer = m.kind === "boomer", sway = Math.sin(time*4 + m.phase)*0.18;
  var skin = m.flash > 0 ? "#ffffff" : boomer ? "#8fa04a" : "#7f9c78";
  var r = boomer ? m.r*(1 + Math.sin(time*6 + m.phase)*0.05) : m.r;
  // arms
  ctx.strokeStyle = skin; ctx.lineWidth = r*0.28; ctx.lineCap = "round";
  for (var s = -1; s <= 1; s += 2){
    var a = Math.PI/2 + s*0.35 + sway*s;
    ctx.beginPath();
    ctx.moveTo(m.x + s*r*0.7, m.y + r*0.1);
    ctx.lineTo(m.x + s*r*0.7 + Math.cos(a)*r*0.9, m.y + r*0.1 + Math.sin(a)*r*0.9);
    ctx.stroke();
  }
  ctx.lineCap = "butt";
  // body: torn shirt, then the head
  ctx.fillStyle = m.flash > 0 ? "#ffffff" : boomer ? "#6b3d6e" : "#4a5a7a";
  ctx.beginPath(); ctx.ellipse(m.x, m.y, r, r*0.75, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(m.x, m.y + r*0.15, r*0.55, 0, Math.PI*2); ctx.fill();
  if (boomer){
    // glowing pustules: it is about to burst
    ctx.fillStyle = (Math.floor(time*6 + m.phase) % 2) ? "#d6ff4a" : "#9fe03a";
    ctx.beginPath();
    ctx.arc(m.x - r*0.55, m.y - r*0.3, r*0.16, 0, Math.PI*2);
    ctx.arc(m.x + r*0.6, m.y - r*0.15, r*0.13, 0, Math.PI*2);
    ctx.arc(m.x + r*0.2, m.y - r*0.55, r*0.11, 0, Math.PI*2);
    ctx.fill();
  }
  // hollow eyes and a torn mouth, facing the player
  ctx.fillStyle = "#1a0f0f";
  ctx.beginPath(); ctx.arc(m.x - r*0.2, m.y + r*0.15, r*0.11, 0, Math.PI*2);
  ctx.arc(m.x + r*0.2, m.y + r*0.15, r*0.11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#ff3b3b";
  ctx.beginPath(); ctx.arc(m.x - r*0.2, m.y + r*0.15, r*0.04, 0, Math.PI*2);
  ctx.arc(m.x + r*0.2, m.y + r*0.15, r*0.04, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#3a1010"; ctx.fillRect(m.x - r*0.22, m.y + r*0.38, r*0.44, r*0.1);
  for (var i = 0; i < m.maxHp; i++){
    ctx.fillStyle = i < m.hp ? "#ff5a5a" : "rgba(0,0,0,0.4)";
    ctx.fillRect(m.x - m.maxHp*7 + i*14, m.y - r - 12, 11, 6);
  }
}

// the mode's colours: blue rolls, orange flies
var DIRECT_COL = "#8fd3ff", LOB_COL = "#ffa640";

// the power bar beside the tee, topped by the mode it will shoot
function drawPowerBar(p, mode){

}

// LOB: an orange arc lifted by its height, the dots growing toward the top,
// its shadow dashed on the grass, and an orange target where it comes down
function drawLobPreview(v){
  var lx = teeX + v.vx*v.T, ly = TEE_Y + v.vy*v.T, i, t;
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 3; ctx.setLineDash([8, 10]);
  ctx.beginPath(); ctx.moveTo(teeX, TEE_Y); ctx.lineTo(lx, ly); ctx.stroke(); ctx.setLineDash([]);
  var top = v.vz*v.vz/(2*LOB_G);
  for (i = 1; i < 24; i++){
    t = v.T*i/24;
    var x = teeX + v.vx*t, y = TEE_Y + v.vy*t, z = v.vz*t - LOB_G*t*t/2;
    ctx.fillStyle = LOB_COL;
    ctx.beginPath(); ctx.arc(x, y - z, 3 + 4*z/top, 0, Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle = LOB_COL; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(lx, ly, 30, 14, 0, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(lx, ly, 14, 6, 0, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx - 40, ly); ctx.lineTo(lx - 32, ly); ctx.moveTo(lx + 32, ly); ctx.lineTo(lx + 40, ly); ctx.stroke();
}

// DIRECT: small blue dots flat on the grass, a white star at every fence
// bounce, the green ring where it slows to a stop
function drawPreview(){
  var v = aimVec(); if (!v) return;
  if (v.lob){ drawLobPreview(v); drawPowerBar(clamp(v.p, 0, 1), "lob"); return; }
  var x = teeX, y = TEE_Y, vx = v.vx, vy = v.vy, h = 1/120, topped = false;
  // dots for PREVIEW_T, then keep going (undrawn) until the top-out ring is placed
  for (var i = 1; i <= 360; i++){
    if (i > PREVIEW_T*120 && topped) break;
    vy += SLOPE*h;
    if (vy >= 0 && !topped){
      // where the ball tops out: slowest point, the one to put on the hole
      topped = true;
      ctx.strokeStyle = "#7dff9a"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, HOLE_R, 0, Math.PI*2); ctx.stroke();
    }
    var sp = Math.sqrt(vx*vx + vy*vy), dec = Math.min(sp, ROLL_DECEL*h);
    if (sp > 0){ vx -= vx/sp*dec; vy -= vy/sp*dec; }
    x += vx*h; y += vy*h;
    var pb = { x:x, y:y, vx:vx, vy:vy }, kink = false;
    if (fenceBounce(pb)){ x = pb.x; y = pb.y; vx = pb.vx; vy = pb.vy; kink = true; }
    if (y < TOP_Y + BALL_R){ y = TOP_Y + BALL_R; vy = Math.abs(vy)*RAIL_BOUNCE; kink = true; }
    if (i > PREVIEW_T*120) continue;
    if (kink){
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath();
      for (var k = 0; k < 4; k++){ var a = k*Math.PI/4; ctx.moveTo(x - Math.cos(a)*10, y - Math.sin(a)*10); ctx.lineTo(x + Math.cos(a)*10, y + Math.sin(a)*10); }
      ctx.stroke();
    }
    if (i % 5 === 0){ ctx.fillStyle = DIRECT_COL; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill(); }
  }
  drawPowerBar(clamp(v.p, 0, 1), "direct");
}

// the pad's rings in normal play, the gun's reticle in a phase
function drawControlGuides(){
  ctx.lineWidth = 2;
  if (!gunPhase()){
    var on = aim ? aim.mode : null;
    // the bands stop at the fences
    ctx.save(); ctx.beginPath(); ctx.moveTo(wallL(TOP_Y), TOP_Y);
    for (var cy = TOP_Y; cy <= DES_H; cy += 40) ctx.lineTo(wallL(cy), cy);
    for (var cy2 = DES_H; cy2 >= TOP_Y; cy2 -= 40) ctx.lineTo(wallR(cy2), cy2);
    ctx.closePath(); ctx.clip();
    // outer band, Lob: orange
    ctx.fillStyle = on === "lob" ? "rgba(255,150,40,0.26)" : "rgba(255,150,40,0.10)";
    ctx.beginPath(); ctx.arc(teeX, TEE_Y, LOB_R, Math.PI, 2*Math.PI); ctx.arc(teeX, TEE_Y, SPLIT_R, 2*Math.PI, Math.PI, true); ctx.closePath(); ctx.fill();
    // inner band, Direct: blue
    ctx.fillStyle = on === "direct" ? "rgba(80,180,255,0.30)" : "rgba(80,180,255,0.13)";
    ctx.beginPath(); ctx.arc(teeX, TEE_Y, SPLIT_R, Math.PI, 2*Math.PI); ctx.arc(teeX, TEE_Y, DEAD_ZONE, 2*Math.PI, Math.PI, true); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(teeX, TEE_Y, SPLIT_R, Math.PI, 2*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(teeX, TEE_Y, LOB_R, Math.PI, 2*Math.PI); ctx.stroke();
    ctx.restore();
    ctx.font = "bold 20px ui-monospace,Menlo,monospace"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(200,235,255,0.95)"; ctx.fillText("Direct", teeX, TEE_Y - SPLIT_R + 34);
    ctx.fillStyle = "rgba(255,215,160,0.95)"; ctx.fillText("Lob", teeX, TEE_Y - LOB_R + 34);
    return;
  }
  if (!aim) return;
  if (aim.held < HOLD_DELAY){
    ctx.strokeStyle = "rgba(125,255,154,0.9)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(aim.x, aim.y, HOLE_R, 0, Math.PI*2); ctx.stroke();
  } else {
    ctx.strokeStyle = phase === "rush" ? "#ffd34d" : "#ff4d4d"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(aim.x, aim.y, 26, 0, Math.PI*2);
    ctx.moveTo(aim.x - 40, aim.y); ctx.lineTo(aim.x + 40, aim.y);
    ctx.moveTo(aim.x, aim.y - 40); ctx.lineTo(aim.x, aim.y + 40); ctx.stroke();
  }
}

function drawToken(){
  if (!token) return;
  var pulse = 1 + Math.sin(time*8)*0.1, r = TOKEN_R*pulse;
  ctx.fillStyle = "#ffd34d"; ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var a = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? r*0.45 : r;
    ctx.lineTo(token.x + Math.cos(a)*rr, token.y + Math.sin(a)*rr);
  }
  ctx.fill();
  ctx.strokeStyle = "rgba(255,211,77,0.7)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(token.x, token.y, TOKEN_R + 10, -Math.PI/2, -Math.PI/2 + Math.PI*2*token.life/TOKEN_LIFE); ctx.stroke();
}

// a phase dresses the frame and counts down along the top
function drawPhase(){
  if (!gunPhase()) return;
  var c = phase === "rush" ? "255,211,77" : "255,77,77", k = phaseT/(phase === "rush" ? RUSH_TIME : LAST_TIME);
  ctx.strokeStyle = "rgba(" + c + "," + (0.55 + 0.25*Math.sin(time*10)) + ")"; ctx.lineWidth = 12;
  ctx.strokeRect(RAIL_L + 6, TOP_Y + 6, RAIL_R - RAIL_L - 12, DES_H - TOP_Y - 12);
  ctx.fillStyle = "rgba(" + c + ",1)"; ctx.fillRect(RAIL_L, TOP_Y, (RAIL_R - RAIL_L)*k, 8);
}

function drawShock(){
  if (!shock) return;
  var k = Math.min(1, shock.t/SHOCK_TIME), r = shock.R*(1 - (1 - k)*(1 - k));
  var fade = shock.t > SHOCK_TIME ? 1 - (shock.t - SHOCK_TIME)/0.35 : 1;
  ctx.fillStyle = "rgba(180,255,200," + 0.18*fade + ")";
  ctx.beginPath(); ctx.arc(shock.x, shock.y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(220,255,230," + fade + ")"; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(shock.x, shock.y, r, 0, Math.PI*2); ctx.stroke();
  if (shock.t < 0.12){ ctx.fillStyle = "rgba(255,255,255," + (1 - shock.t/0.12)*0.7 + ")"; ctx.fillRect(0, 0, DES_W, DES_H); }
}

function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0b0d14"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, DES_W, DES_H); ctx.clip();
  if (shakeT > 0){ var sk = SHAKE*shakeT/SHOCK_TIME; ctx.translate(rand(-sk, sk), rand(-sk, sk)); }

  drawTable();
  drawHole();
  for (var u = 0; u < bumpers.length; u++){
    var bp = bumpers[u];
    ctx.fillStyle = bp.hit > 0 ? "#ffe27a" : "#e0a030";
    ctx.beginPath(); ctx.arc(bp.x, bp.y, BUMPER_R, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#7a4a10"; ctx.beginPath(); ctx.arc(bp.x, bp.y, BUMPER_R*0.45, 0, Math.PI*2); ctx.fill();
  }
  drawZones();
  drawSlots();
  drawKos();
  // depth: zombies (by their feet) and rolling balls are painted far to near,
  // so a ball behind a zombie is hidden by it; balls in the air go on top
  var order = [], j;
  for (var i = 0; i < mons.length; i++) order.push({ y:mons[i].y + FEET_DROP*SPRITE_H, m:mons[i] });
  for (j = 0; j < balls.length; j++) if (!balls[j].air) order.push({ y:balls[j].y, b:balls[j] });
  order.sort(function(a, b){ return a.y - b.y; });
  for (j = 0; j < order.length; j++){ if (order[j].m) drawMonster(order[j].m); else drawBall(order[j].b); }
  for (j = 0; j < balls.length; j++) if (balls[j].air) drawBall(balls[j]);
  for (var r = 0; r < rings.length; r++){
    var g = rings[r], k = g.t/0.35;
    ctx.strokeStyle = "rgba(255,170,60," + (1 - k) + ")"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.r*(0.4 + 0.6*k), 0, Math.PI*2); ctx.stroke();
  }
  drawDrops();
  drawSweeps();
  drawShock();
  drawToken();
  drawPowerOverlays();

  // tee, next ball, bag
  drawControlGuides();
  ctx.fillStyle = "#c9a36a"; ctx.fillRect(teeX - 4, TEE_Y + 8, 8, 18);
  ctx.fillStyle = bag > 0 ? COLORS[specials.length ? specials[0] : "plain"] : "rgba(255,255,255,0.2)";
  ctx.beginPath(); ctx.arc(teeX, TEE_Y, BALL_R + 2, 0, Math.PI*2); ctx.fill();
  drawPreview();
  for (var s = 0; s < BAG_MAX; s++){
    ctx.fillStyle = s < bag ? "#ffffff" : "rgba(255,255,255,0.18)";
    ctx.beginPath(); ctx.arc(90 + s*26, 1256, 9, 0, Math.PI*2); ctx.fill();
  }
  // the balls loaded on the tee, next one first
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "22px sans-serif";
  for (var q = 0; q < specials.length; q++){
    ctx.fillText(modOf(specials[q]).icon, DES_W - 90 - q*30, 1256);
  }
  ctx.textBaseline = "alphabetic";
  drawPhase();
  ctx.textAlign = "center";

  for (var t = 0; t < texts.length; t++){
    var tx = texts[t];
    ctx.globalAlpha = 1 - tx.t/1.1; ctx.fillStyle = tx.c;
    ctx.font = "bold " + (tx.big ? 34 : 24) + "px ui-monospace,Menlo,monospace";
    ctx.fillText(tx.s, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;

  if (redT > 0){ ctx.fillStyle = "rgba(255,0,0," + redT*0.6 + ")"; ctx.fillRect(0, 0, DES_W, DES_H); }

  ctx.textAlign = "left"; ctx.font = "bold 22px ui-monospace,Menlo,monospace"; ctx.fillStyle = "#fff";
  var fl = ""; for (var f = 0; f < FLAGS; f++) fl += f < flags ? "■ " : "□ ";
  if (phase === "last") fl = "last stand " + Math.ceil(phaseT) + " s ";
  ctx.fillText("Score " + score + "   Flags " + fl + "  " + time.toFixed(0) + " s", 52, 34);
  if (SHOW_DEBUG){
    ctx.font = "20px ui-monospace,Menlo,monospace"; ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillText("Kills " + kills + "  Holes " + holes + "  Best chain x" + bestChain + "  Monsters " + mons.length, 52, 62);
    ctx.fillText("Spawn " + Math.max(SPAWN_MIN, SPAWN_START - SPAWN_RAMP*time).toFixed(2) + " s  Walk " +
                 Math.round(Math.min(WALK_MAX, WALK_BASE + WALK_RAMP*time)) + "  Balls out " + balls.length + "  Fps " + fps, 52, 84);
  }
  var hl = phaseHelpT > 0 ? ["Hold: auto fire, the balls are free", "Tap: a putt that stops right there"]
         : helpT > 0 ? ["Start in blue: roll. In orange: lob", "Then drag: the distance is the power"] : null;
  if (hl && !over){
    ctx.textAlign = "center"; ctx.font = "22px ui-monospace,Menlo,monospace";
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(RAIL_L, DEFENSE_Y - 128, RAIL_R - RAIL_L, 104);
    ctx.fillStyle = "#fff";
    ctx.fillText(hl[0], DES_W/2, DEFENSE_Y - 100);
    ctx.fillText(hl[1], DES_W/2, DEFENSE_Y - 70);
    ctx.fillStyle = "#7dff9a"; ctx.fillText("Left holes: ball kinds. Right: supers", DES_W/2, DEFENSE_Y - 40);
  }
  if (over){
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, DES_W, DES_H);
    ctx.textAlign = "center"; ctx.fillStyle = "#fff";
    ctx.font = "bold 44px ui-monospace,Menlo,monospace"; ctx.fillText("Overrun", DES_W/2, 560);
    ctx.font = "26px ui-monospace,Menlo,monospace";
    ctx.fillText("Score " + score + " in " + time.toFixed(0) + " s, best chain x" + bestChain, DES_W/2, 610);
    ctx.fillText("Tap to restart", DES_W/2, 660);
  }
  ctx.restore();
}

// ---- loop --------------------------------------------------------
var last = 0, fpsAcc = 0, fpsN = 0;
function frame(ts){
  var dt = Math.min(1/30, (ts - last)/1000 || 0); last = ts;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){ fps = Math.round(fpsN/fpsAcc); fpsAcc = 0; fpsN = 0; }
  if (!menuOpen) update(dt);
  render();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
</body>
