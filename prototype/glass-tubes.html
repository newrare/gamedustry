<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>glass-tubes prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f16; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<canvas id="cv"></canvas>
<script>
// ---------------------------------------------------------------------------
// Glass tubes: a marble run built from PAINTED tube pieces instead of drawn
// rails.
//
// The seven pieces are the cuts of assets/image/master/gearball-object-tube.png
// (assets/image/object/gearball-tube-01..07.png), embedded below as webp.
// Each piece carries its centreline, measured by hand on the cut, in the
// cut's own pixels. A track is a TREE of placements: every piece hangs off an
// exit of its parent, and is turned and moved so its entry mouth sits on that
// exit, heading the same way (plus an optional kink at the coupling). The Y
// has two exits, and it is a switch: tap it to send the next marbles down the
// other branch. A marble that leaves an open mouth falls out of the run.
//
// The painted glass is opaque (alpha ~252), so "translucent" is faked in
// three passes:
//   1. every tube, at full opacity;
//   2. the marbles;
//   3. clipped to a disc around each marble only: every tube again at GLASS
//      opacity, then the tube's FRONT layer at full opacity - the metal
//      collars and the white highlights, pulled out of the picture by colour
//      (grey, not blue). Outside the discs nothing is drawn twice, so a tube
//      with no marble in it is exactly the painted picture.
//
// The question: do painted tube pieces read as a marble run, and does a
// marble inside the glass look like it is IN the tube?
//
// Tap: drop a marble (or flip the Y under the finger).
// Keys: SPACE drop, G cycle the glass mode, +/- glass opacity, D centrelines,
//   1-7 append a piece to the last open exit, F flip it, V reverse it,
//   [ ] kink it by 10 degrees, BACKSPACE remove it, P print the layout,
//   R back to the preset.
// ---------------------------------------------------------------------------

var W = 720, H = 1280;
var TUBE_D = 40;        // design px: every piece is scaled to this outer diameter
var BALL_R = 12;        // marble radius
var GLASS = 0.4;        // how much of the glass lies over a marble inside it
var GRAV = 1100;        // px/s2 along the slope
var DRAG = 0.35;        // per second
var VMIN = 170;         // a marble never stalls inside a tube
var VMAX = 1100;
var SPAWN = 0.75;       // seconds between auto drops
var FRONT_CUT = 26;     // a pixel whose blue exceeds its red by less than this is "front" (metal, highlight)
var FRONT_SOFT = 14;    // ...and it fades out over this many levels

var MODES = ["glass + front", "glass only", "marble on top", "marble hidden"];
var mode = 0;
var debug = false;

// Centrelines, in the cut's own pixels. gauge = the tube's outer diameter in
// that cut (the pieces were painted at different sizes). smooth = Catmull-Rom
// through the points, otherwise straight segments (the zigzag's joints).
var PIECES = {
  "01": { name: "coil", gauge: 68, smooth: true, paths: [[[70,65],[150,75],[230,85],[300,95],[345,110],[385,135],[395,165],[375,190],[330,200],[270,205],[210,215],[150,230],[90,245],[55,265],[55,290],[90,305],[150,310],[220,310],[290,310],[340,320],[385,345],[400,375],[380,400],[330,415],[270,420],[205,425],[140,440],[80,455],[45,475],[55,505],[100,520],[170,525],[250,530],[320,540],[370,560],[400,600],[395,635],[360,645],[320,645],[285,650]]] },
  "02": { name: "loop", gauge: 77, smooth: true, paths: [[[50,420],[200,420],[330,420],[400,412],[470,385],[515,340],[530,280],[520,200],[485,130],[420,85],[345,72],[270,85],[205,130],[172,200],[168,280],[190,340],[240,385],[300,410],[370,420],[500,420],[650,420]]] },
  "03": { name: "zigzag", gauge: 72, smooth: false, paths: [[[65,118],[225,62],[385,128],[585,62],[775,128],[965,62]]] },
  "04": { name: "Y", gauge: 83, smooth: true, paths: [[[55,190],[300,190],[380,135],[560,72]], [[55,190],[300,190],[400,240],[555,285]]] },
  "05": { name: "straight", gauge: 85, smooth: false, paths: [[[40,79],[840,79]]] },
  "06": { name: "elbow", gauge: 88, smooth: true, paths: [[[70,232],[92,195],[128,155],[170,122],[218,98],[262,85],[300,75]]] },
  "07": { name: "curve", gauge: 78, smooth: true, paths: [[[58,128],[110,98],[170,75],[230,62],[290,58],[350,60]]] }
};

// The preset run, top to bottom. parent = index of the placement it hangs off
// (-1 = the root, placed at x,y heading `a` degrees), port = which exit.
var PRESET = [
  { p: "05", parent: -1, x: 70, y: 70, a: 9 },
  { p: "01", parent: 0, port: 0, kink: 0 },
  { p: "03", parent: 1, port: 0, flip: true, kink: -10 },
  { p: "06", parent: 2, port: 0, rev: true, kink: 0 },
  { p: "07", parent: 3, port: 0, flip: true, kink: 0 },
  { p: "06", parent: 4, port: 0, flip: true, kink: 0 },
  { p: "02", parent: 5, port: 0, kink: -32 },
  { p: "04", parent: 6, port: 0, kink: 0 }
];

// ---------------------------------------------------------------------------
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(cv.width / W, cv.height / H);
  offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener("resize", resize); resize();

// --- pieces: images, front masks, sampled centrelines -------------------------
function catmull(pts) {
  var out = [];
  for (var i = 0; i < pts.length - 1; i++) {
    var p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
    for (var k = 0; k < 10; k++) {
      var t = k / 10, t2 = t * t, t3 = t2 * t, q = [];
      for (var j = 0; j < 2; j++)
        q.push(0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3));
      out.push(q);
    }
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
function resample(pts, step) {           // even spacing, so s maps to an index
  var out = [pts[0].slice()], carry = 0;
  for (var i = 1; i < pts.length; i++) {
    var ax = pts[i - 1][0], ay = pts[i - 1][1], dx = pts[i][0] - ax, dy = pts[i][1] - ay;
    var len = Math.hypot(dx, dy), d = step - carry;
    while (d <= len) { out.push([ax + dx * d / len, ay + dy * d / len]); d += step; }
    carry = len - (d - step);
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
// TUBE_IMG (the seven cuts as data URIs) is the last script of the page.
var loaded = 0, total = 0;
addEventListener("load", function () { for (var key in PIECES) loadPiece(key); });
function loadPiece(key) {
  var pc = PIECES[key];
  pc.img = new Image(); total++;
  pc.img.onload = function () { buildFront(pc); loaded++; if (loaded === total) start(); };
  pc.img.src = TUBE_IMG[key];
}

// FRONT layer: what stays opaque over a marble - the grey metal and the white
// highlights. Glass is blue (b - r ~ 40..60), metal and highlights are not.
function buildFront(pc) {
  var w = pc.img.width, h = pc.img.height, c = document.createElement("canvas");
  c.width = w; c.height = h;
  var g = c.getContext("2d"); g.drawImage(pc.img, 0, 0);
  var id = g.getImageData(0, 0, w, h), d = id.data;
  for (var i = 0; i < d.length; i += 4) {
    var k = (FRONT_CUT - (d[i + 2] - d[i])) / FRONT_SOFT;
    k = k < 0 ? 0 : k > 1 ? 1 : k;
    d[i + 3] = d[i + 3] * k;
  }
  g.putImageData(id, 0, 0);
  pc.front = c;
}

// --- track --------------------------------------------------------------------
var track = [];
function localPath(pc, i, flip, rev) {
  var raw = pc.paths[i].map(function (q) { return [flip ? pc.img.width - q[0] : q[0], q[1]]; });
  var pts = pc.smooth ? catmull(raw) : raw;
  pts = resample(pts, 2);
  if (rev) pts.reverse();
  return pts;
}
function buildTrack(list) {
  track = [];
  for (var n = 0; n < list.length; n++) {
    var L = list[n], pc = PIECES[L.p], s = TUBE_D / pc.gauge;
    var rev = !!L.rev && pc.paths.length === 1;
    var locals = pc.paths.map(function (_, i) { return localPath(pc, i, !!L.flip, rev); });
    var e = locals[0], t0 = Math.atan2(e[6][1] - e[0][1], e[6][0] - e[0][0]);
    var px, py, pa;
    if (L.parent < 0) { px = L.x; py = L.y; pa = L.a * Math.PI / 180; }
    else {
      var par = track[L.parent], pp = par.paths[L.port || 0], m = pp.pts.length;
      px = pp.pts[m - 1][0]; py = pp.pts[m - 1][1];
      pa = Math.atan2(pp.pts[m - 1][1] - pp.pts[m - 7][1], pp.pts[m - 1][0] - pp.pts[m - 7][0]);
    }
    var a = pa + (L.kink || 0) * Math.PI / 180 - t0, ca = Math.cos(a), sa = Math.sin(a);
    var tx = px - (ca * e[0][0] - sa * e[0][1]) * s, ty = py - (sa * e[0][0] + ca * e[0][1]) * s;
    var pl = { L: L, pc: pc, s: s, a: a, tx: tx, ty: ty, flip: !!L.flip, next: 0, paths: [] };
    for (var i = 0; i < locals.length; i++) {
      var pts = locals[i].map(function (q) {
        return [tx + (ca * q[0] - sa * q[1]) * s, ty + (sa * q[0] + ca * q[1]) * s];
      });
      pl.paths.push({ pts: pts, len: (pts.length - 1) * 2 * s, child: -1 });
    }
    track.push(pl);
    if (L.parent >= 0) track[L.parent].paths[L.port || 0].child = n;
  }
}
var layout = JSON.parse(JSON.stringify(PRESET));

// --- marbles ------------------------------------------------------------------
var balls = [], spawnT = 0, fallen = 0;
function drop() {
  if (!track.length) return;
  balls.push({ pl: 0, path: 0, s: 0, v: VMIN, x: 0, y: 0, free: false, vx: 0, vy: 0, hue: Math.random() < 0.15 });
}
function sampleAt(path, s, pl) {
  var f = s / (2 * pl.s), i = Math.min(Math.floor(f), path.pts.length - 2), t = f - i;
  var a = path.pts[i], b = path.pts[i + 1];
  var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
  return { x: a[0] + dx * t, y: a[1] + dy * t, tx: dx / l, ty: dy / l };
}
function update(dt) {
  spawnT -= dt;
  if (spawnT <= 0) { spawnT = SPAWN; drop(); }
  for (var i = balls.length - 1; i >= 0; i--) {
    var b = balls[i];
    if (b.free) {
      b.vy += GRAV * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H + 60 || b.x < -60 || b.x > W + 60) { balls.splice(i, 1); fallen++; }
      continue;
    }
    var pl = track[b.pl], path = pl.paths[b.path], q = sampleAt(path, b.s, pl);
    b.v += GRAV * q.ty * dt;
    b.v -= b.v * DRAG * dt;
    b.v = Math.max(VMIN, Math.min(VMAX, b.v));
    b.s += b.v * dt;
    while (b.s >= path.len) {
      var over = b.s - path.len;
      if (path.child < 0) {
        q = sampleAt(path, path.len, pl);
        b.free = true; b.x = q.x; b.y = q.y; b.vx = q.tx * b.v; b.vy = q.ty * b.v;
        break;
      }
      var ch = track[path.child];
      b.pl = path.child; b.path = ch.paths.length > 1 ? ch.next : 0; b.s = over;
      pl = ch; path = ch.paths[b.path];
    }
    if (!b.free) { q = sampleAt(path, b.s, pl); b.x = q.x; b.y = q.y; }
  }
}

// --- drawing ------------------------------------------------------------------
var ballSprite = makeBall("#ff9f1c", "#9a3d00"), sparkSprite = makeBall("#9fe6ff", "#1f6fd1");
function makeBall(c1, c2) {
  var r = BALL_R * 3, c = document.createElement("canvas"); c.width = c.height = r * 2 + 4;
  var g = c.getContext("2d"), gr = g.createRadialGradient(r * 0.7, r * 0.6, r * 0.1, r + 2, r + 2, r);
  gr.addColorStop(0, "#fff8e8"); gr.addColorStop(0.25, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.beginPath(); g.arc(r + 2, r + 2, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = 3; g.stroke();
  return c;
}
function drawBall(b) {
  var spr = b.hue ? sparkSprite : ballSprite, d = BALL_R * 2 + 4 / 3;
  ctx.drawImage(spr, b.x - d / 2, b.y - d / 2, d, d);
}
function drawPiece(pl, img) {
  ctx.save();
  ctx.translate(pl.tx, pl.ty); ctx.rotate(pl.a); ctx.scale(pl.s, pl.s);
  if (pl.flip) { ctx.translate(pl.pc.img.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#06080c"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#2a3446"); bg.addColorStop(1, "#141a24");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  var i, inside = balls.filter(function (b) { return !b.free; });
  for (i = 0; i < track.length; i++) drawPiece(track[i], track[i].pc.img);
  if (mode !== 2) inside.forEach(drawBall);
  if ((mode === 0 || mode === 1 || mode === 3) && inside.length) {
    ctx.save();
    ctx.beginPath();
    inside.forEach(function (b) { ctx.moveTo(b.x + BALL_R + 3, b.y); ctx.arc(b.x, b.y, BALL_R + 3, 0, Math.PI * 2); });
    ctx.clip();
    ctx.globalAlpha = mode === 3 ? 1 : GLASS;
    for (i = 0; i < track.length; i++) drawPiece(track[i], track[i].pc.img);
    ctx.globalAlpha = 1;
    if (mode === 0) for (i = 0; i < track.length; i++) drawPiece(track[i], track[i].pc.front);
    ctx.restore();
  }
  if (mode === 2) inside.forEach(drawBall);
  balls.forEach(function (b) { if (b.free) drawBall(b); });

  // the Y switches: which branch is armed
  track.forEach(function (pl) {
    if (pl.paths.length < 2) return;
    var p = pl.paths[pl.next].pts, q = p[Math.floor(p.length * 0.75)];
    ctx.fillStyle = "rgba(120,255,160,0.9)";
    ctx.beginPath(); ctx.arc(q[0], q[1], 7, 0, Math.PI * 2); ctx.fill();
  });

  if (debug) {
    ctx.lineWidth = 2;
    track.forEach(function (pl, n) {
      pl.paths.forEach(function (p) {
        ctx.strokeStyle = "rgba(255,60,60,0.9)"; ctx.beginPath();
        p.pts.forEach(function (q, k) { if (k) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
        ctx.stroke();
      });
      var e = pl.paths[0].pts[0];
      ctx.fillStyle = "#ff0"; ctx.font = "bold 20px sans-serif";
      ctx.fillText(n + " " + pl.pc.name, e[0] + 8, e[1] - 8);
    });
  }

  ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "22px sans-serif";
  ctx.fillText("Mode: " + MODES[mode] + "  (G)", 20, 34);
  ctx.fillText("Glass " + GLASS.toFixed(2) + " (+/-)   marbles " + balls.length + "   out " + fallen, 360, 34);
}

// --- input --------------------------------------------------------------------
function toDesign(e) {
  var r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * dpr - offX) / scale, y: ((e.clientY - r.top) * dpr - offY) / scale };
}
cv.addEventListener("pointerdown", function (e) {
  var p = toDesign(e), best = null, bd = 70;
  track.forEach(function (pl) {
    if (pl.paths.length < 2) return;
    pl.paths.forEach(function (path) {
      path.pts.forEach(function (q) { var d = Math.hypot(q[0] - p.x, q[1] - p.y); if (d < bd) { bd = d; best = pl; } });
    });
  });
  if (best) best.next = 1 - best.next; else drop();
});
function lastOpen() {
  for (var n = track.length - 1; n >= 0; n--)
    for (var i = 0; i < track[n].paths.length; i++) if (track[n].paths[i].child < 0) return [n, i];
  return null;
}
addEventListener("keydown", function (e) {
  var k = e.key, last = layout[layout.length - 1];
  if (k === " ") drop();
  else if (k === "g" || k === "G") mode = (mode + 1) % MODES.length;
  else if (k === "d" || k === "D") debug = !debug;
  else if (k === "+" || k === "=") GLASS = Math.min(1, GLASS + 0.05);
  else if (k === "-") GLASS = Math.max(0, GLASS - 0.05);
  else if (k >= "1" && k <= "7") {
    var o = lastOpen(); if (!o) return;
    layout.push({ p: "0" + k, parent: o[0], port: o[1], kink: 0 }); rebuild();
  }
  else if ((k === "f" || k === "F") && last) { last.flip = !last.flip; rebuild(); }
  else if ((k === "v" || k === "V") && last) { last.rev = !last.rev; rebuild(); }
  else if (k === "[" && last && last.parent >= 0) { last.kink = (last.kink || 0) - 10; rebuild(); }
  else if (k === "]" && last && last.parent >= 0) { last.kink = (last.kink || 0) + 10; rebuild(); }
  else if (k === "Backspace" && layout.length > 1) { layout.pop(); rebuild(); }
  else if (k === "p" || k === "P") console.log(JSON.stringify(layout));
  else if (k === "r" || k === "R") { layout = JSON.parse(JSON.stringify(PRESET)); rebuild(); }
});
function rebuild() { buildTrack(layout); balls = []; }

// --- loop ---------------------------------------------------------------------
var lastT = 0;
function start() {
  buildTrack(layout);
  // #t=<seconds> fast-forwards the run, for a deterministic screenshot
  var m = /t=([\d.]+)/.exec(location.hash);
  if (m) { var seed = 1; Math.random = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (var f = 0; f < +m[1] * 60; f++) update(1 / 60); }
  if (/debug/.test(location.hash)) debug = true;
  var gm = /mode=(\d)/.exec(location.hash); if (gm) mode = +gm[1];
  requestAnimationFrame(frame);
}
function frame(t) {
  var dt = Math.min(0.033, (t - lastT) / 1000 || 0); lastT = t;
  if (!/t=/.test(location.hash)) update(dt);
  render();
  requestAnimationFrame(frame);
}
</script>
<script>
