<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>marble-mix prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0a07; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<canvas id="cv"></canvas>
<script>
// ---------------------------------------------------------------------------
// Marble mix: the marble-router machine, with locking gates and electric
// marbles.
//
// The brass-and-wood run of marble-router: a hopper pours marbles onto rails
// with real slope physics, four flip-flop switches S0-S3 (a tap flips one,
// and every marble passing flips it too), two loops, the notched wheel that
// merges the two inner lines, the coil, the chimes, and the gutter that
// carries everything home through the background (screw, top rail, bucket
// lift, ferris wheel). Four receptacles at the bottom: Bell, Furnace,
// Launcher, Cannon.
//
//   marbles   - classic amber marbles score in any receptacle. About one in
//               ten is ELECTRIC: a blue core, crackling arcs, a spark trail.
//   arrival   - one receptacle, drawn at random each game, is the ELECTRIC
//               ARRIVAL: a socket with a lightning mark and a blue glow, and
//               the rails that lead to it glow blue at every switch. An
//               electric marble steered into it pays a big bonus: an arc runs
//               up the rails to the wheel hub, the hub flashes, the combo
//               jumps. An electric marble in any other receptacle fizzles:
//               no bonus, and the combo breaks.
//   gates     - the main verb. The four gates are open and let marbles pass.
//               At random moments one LOCKS: it holds the marbles in its
//               visible slots and its plate turns into a big pulsing button
//               with a padlock. A tap unlocks it: the queue runs out in a
//               burst and the gate stays open until its next lock. A marble
//               that reaches a locked gate whose slots are full is DESTROYED
//               and costs a heart. The wheel's two entries work the same way:
//               while the gate under the wheel is locked and full, the wheel
//               keeps its marbles aboard, the entries fill, and a marble that
//               finds a full entry is destroyed too.
//   combo     - on the wheel hub ("x12"): one per marble delivered, plus a
//               jump for an electric marble on target. A fizzled electric
//               marble or a destroyed one breaks it. Its tiers change the
//               hub's glow, add sparks orbiting the wheel, turn the wheel a
//               little faster, and multiply the points.
//   pace      - the rails speed up, the pour gets denser, locks come more
//               often, and more gates can be locked at once.
//
// Hearts run out: the game is over.
//
// The question: is unlocking gates before they overflow, while steering the
// odd electric marble home, fun?
//
// Tap: flip the nearest switch or unlock the nearest locked gate. Tap "Auto"
// (or A) to let it play itself. Keys 1-4 flip S0-S3, 5-8 unlock the four
// gates, R restarts.
// ---------------------------------------------------------------------------

// --- tunables --------------------------------------------------------------
var W = 720, H = 1280;          // design space, portrait
var R = 14;                     // marble radius
var HEARTS = 5;
var G = 780;                    // px/s^2 of gravity along a slope
var FRICTION = 55;              // px/s^2 of rolling drag
var VMIN = 110, VMAX = 400;     // a marble never stalls and never flies off
var RAMP_SECONDS = 120;         // the pace rises over this long, then holds
var TEMPO_START = 0.9, TEMPO_END = 1.7;     // time scale of the rails
var POUR_START = 0.95, POUR_END = 0.2;     // seconds between two marbles
var PREVIEW = 3;                // marbles waiting at the hopper's mouth
var ELECTRIC_EVERY = 10, ELECTRIC_JITTER = 3;   // one electric marble every 10 +/- 3
var PTS_CLASSIC = 10, PTS_ELECTRIC = 150;  // x the combo multiplier
var ELECTRIC_JUMP = 5;          // an electric marble on target adds this much to the combo
// Combo: the tier is how many of these thresholds the run has passed, and
// the multiplier is tier + 1.
var TIERS = [15, 50, 150];
var TIER_SPIN = 0.12;           // the wheel turns this much faster per tier
var ORBIT_SPARKS = [0, 4, 8, 14];
// Locks.
var LOCK_FIRST = 14;            // seconds before the first lock
var LOCK_RATE = 0.12;           // locks per second at the start...
var LOCK_RATE_GROW = 0.02;      // ... plus this much per second of game
var LOCK_MORE_EVERY = 45;       // one more gate may be locked at once every this many seconds...
var LOCK_MAX = 4;               // ... up to this many
var MIN_OPEN_START = 2.5, MIN_OPEN_END = 0.4;   // an unlocked gate stays open at least this long, over the ramp
var FLUSH_GAP = 0.14;           // seconds between two marbles of an unlock burst
var FLUSH_V = 230;              // px/s a released marble leaves at
var WAIT_CAP = 5;               // marbles a wheel entry holds
var TAP_REACH = 200;            // a tap farther than this from every switch and plate does nothing
var FLIP_TIME = 0.09;
var TOGGLE_ON_PASS = true;      // a marble passing a switch flips it
var WHEEL_OMEGA = 1.8;          // rad/s
var WHEEL_NOTCHES = 8;
var ARC_SPEED = 1700;           // px/s of the payoff arc running up the rails
var GUTTER_SPEED = 220, LIFT_SPEED = 150, CUP_GAP = 56;
// Gates: channel, where on it (share of its length), capacity, and where its
// plate hangs (absolute). The plates sit at least 150 px from every switch
// and from each other, so a tap is never ambiguous.
var GATES = [["top", 0.72, 5, 440, 118], ["S0L", 0.78, 4, 80, 330],
  ["S0R", 0.78, 4, 580, 330], ["wout", 0.6, 3, 470, 730]];
var SCREW_X = 24, SCREW_BOT = 1238, SCREW_TOP = 44, SCREW_SPEED = 110;
var BG_RAIL_SPEED = 120;
var FERRIS = { cx: 170, cy: 196, r: 50, buckets: 6, omega: 0.6, marbles: 5 };
var BG_ALPHA = 0.42;            // how far back the return circuits sit
var AUTO_RATE = 0.22;           // seconds between two actions of the autopilot
var AUTO_RESTART = 4;           // seconds the autopilot shows its end screen before it plays again

// --- palette ---------------------------------------------------------------
var C_BG = "#1c140e", C_BG2 = "#241a12", C_WOOD = "#5a3d25", C_BRASS = "#c9994a",
    C_BRASS_D = "#7a5a2a", C_STEEL = "#8d95a3", C_TEXT = "#f3e6cf", C_DIM = "#cdbb9c";
var C_GLASS = "#f2b53a";        // a classic marble
var C_VOLT = "#4fd8ff", C_VOLT_HI = "#d8f8ff";   // everything electric
var C_CALM = "#7fd48a", C_WARN = "#f2c14e", C_FULL = "#ff4a3a";   // a queue's gauge
var C_HEART = "#ff4d5e";
var TIER_COLS = ["#cdbb9c", "#ffd24a", "#ff8a3a", "#ff6af0"];

// --- the network -------------------------------------------------------------
var DS = 5;                     // rails are resampled every DS px
var MID = 330;                  // the machine is symmetric about x = MID
function mir(pts) { var o = []; for (var i = 0; i < pts.length; i++) o.push([2 * MID - pts[i][0], pts[i][1], pts[i][2]]); return o; }
function loopPts(cx, cy, r) {
  var o = [];
  for (var i = 1; i <= 60; i++) { var a = Math.PI / 2 - i / 60 * Math.PI * 2; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return o;
}
// A spiral seen from slightly above: x = sin, depth = cos, the near half lower.
function coilPts(cx, y0, y1, r, turns) {
  var o = [], n = turns * 48;
  for (var i = 0; i <= n; i++) {
    var a = i / n * turns * Math.PI * 2;
    o.push([cx + r * Math.sin(a), y0 + (y1 - y0) * i / n + r * 0.35 * Math.cos(a), Math.cos(a)]);
  }
  return o;
}
var SW = { S0: [MID, 262], S1: [150, 470], S2: [2 * MID - 150, 470], S3: [MID, 790] };
var WHEEL = { cx: MID, cy: 615, r: 70 };
var RIM = WHEEL.r + 14;
var BOX_Y = 1080, BOX_H = 120, BOX_W = 150;
var S0L = [[MID, 262], [215, 318], [252, 392], [150, 470]];
var S1L = [[150, 470], [60, 560], [110, 650], [30, 760], [32, 830], [52, 858], [100, 870]]
  .concat(loopPts(100, 820, 50), [[140, 880], [168, 930], [85, 1005], [85, 1074]]);
var S1R = [[150, 470], [250, 535], [205, 595], [WHEEL.cx - WHEEL.r, WHEEL.cy]];
var RAW = {
  top:  { to: "S0", pts: [[650, 152], [560, 186], [450, 212], [MID, 262]] },
  S0L:  { to: "S1", pts: S0L },            S0R: { to: "S2", pts: mir(S0L) },
  S1L:  { to: "bell", pts: S1L },           S1R: { to: "wheelL", pts: S1R },
  S2L:  { to: "wheelR", pts: mir(S1R) },    S2R: { to: "cannon", pts: mir(S1L) },
  wout: { to: "S3", pts: [[MID, WHEEL.cy + WHEEL.r], [MID, 790]] },
  S3L:  { to: "furnace", pts: [[MID, 790], [255, 850], [300, 930], [250, 1000], [250, 1074]] },
  S3R:  { to: "launcher", pts: [[MID, 790], [420, 842]].concat(coilPts(410, 850, 1030, 44, 2), [[410, 1074]]) }
};
var OUT = { S0: ["S0L", "S0R"], S1: ["S1L", "S1R"], S2: ["S2L", "S2R"], S3: ["S3L", "S3R"] };
var MACHINE_DEFS = [
  { id: "bell", name: "Bell", x: 85, color: "#f5c542" },
  { id: "furnace", name: "Furnace", x: 250, color: "#ff6a2a" },
  { id: "launcher", name: "Launcher", x: 410, color: "#7fe0c0" },
  { id: "cannon", name: "Cannon", x: 575, color: "#b18cff" }
];
// For each receptacle, the rails an electric payoff runs up to reach the
// hub: [channel, reversed?], then the hub itself.
var PAY_ROUTE = {
  bell: [["S1L", true], ["S1R", false]],     cannon: [["S2R", true], ["S2L", false]],
  furnace: [["S3L", true], ["wout", true]],   launcher: [["S3R", true], ["wout", true]]
};
// Which channels can still lead to a receptacle (to colour the live branches).
var REACH = {
  bell: { top: 1, S0L: 1, S1L: 1 },           cannon: { top: 1, S0R: 1, S2R: 1 },
  furnace: { top: 1, S0L: 1, S0R: 1, S1R: 1, S2L: 1, wout: 1, S3L: 1 },
  launcher: { top: 1, S0L: 1, S0R: 1, S1R: 1, S2L: 1, wout: 1, S3R: 1 }
};
var GUTTER_L = 12, GUTTER_Y = 1226;
var LIFT_X = 690, LIFT_BOT = 1240, LIFT_TOP = 118;
var HOPPER = { x: 650, y: 152, l: 598, r: 714, top: 22, bot: 104 };   // mouth, then the box
var CHIMES = [["top", 0.3], ["top", 0.9], ["S0L", 0.2], ["S0R", 0.2], ["S1R", 0.22], ["S3L", 0.5]];
var DECO_GEARS = [[60, 250, 44, 9], [185, 740, 44, 9], [600, 900, 66, 13], [60, 960, 40, 8], [520, 1010, 36, 7]];

// Background rails: the top return from the screw, and the ferris wheel's run.
var FX = FERRIS.cx, FY = FERRIS.cy;
var BG_RAW = {
  back: [[SCREW_X, SCREW_TOP], [200, 50], [380, 58], [560, 64], [656, 70]],
  ferris: [[FX + 22, FY - 58], [FX + 60, FY - 32], [FX + 28, FY], [FX + 62, FY + 32], [FX + 16, FY + 56]]
};

// Resample every channel to one point every DS px, keeping a depth per point.
var CH = {}, BG = {};
function makeChannel(k, to, raw) {
  var xs = [], ys = [], zs = [];
  xs.push(raw[0][0]); ys.push(raw[0][1]); zs.push(raw[0][2] === undefined ? 1 : raw[0][2]);
  var carry = 0;
  for (var i = 1; i < raw.length; i++) {
    var a = raw[i - 1], b = raw[i], za = a[2] === undefined ? 1 : a[2], zb = b[2] === undefined ? 1 : b[2];
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy), s = DS - carry;
    while (s <= L) { var q = s / L; xs.push(a[0] + dx * q); ys.push(a[1] + dy * q); zs.push(za + (zb - za) * q); s += DS; }
    carry = L - (s - DS);
  }
  var last = raw[raw.length - 1];
  xs.push(last[0]); ys.push(last[1]); zs.push(last[2] === undefined ? 1 : last[2]);
  var n = xs.length, coil = false;
  for (i = 0; i < n; i++) if (zs[i] < 0) coil = true;
  return { id: k, to: to, xs: xs, ys: ys, zs: zs, n: n, len: (n - 1) * DS, coil: coil };
}
for (var chk in RAW) CH[chk] = makeChannel(chk, RAW[chk].to, RAW[chk].pts);
for (chk in BG_RAW) BG[chk] = makeChannel(chk, null, BG_RAW[chk]);
function at(ch, d) {
  var f = Math.max(0, Math.min(ch.n - 1.001, d / DS)), i = Math.floor(f), q = f - i;
  return { x: ch.xs[i] + (ch.xs[i + 1] - ch.xs[i]) * q, y: ch.ys[i] + (ch.ys[i + 1] - ch.ys[i]) * q,
           z: ch.zs[i] + (ch.zs[i + 1] - ch.zs[i]) * q, slope: (ch.ys[i + 1] - ch.ys[i]) / DS };
}
// The gutter is a shallow V: each half runs out to its own return circuit.
function gutterY(x) { return GUTTER_Y + Math.abs(x - MID) * 0.03; }
// The payoff arc's path for a receptacle: its rails back up to the hub, as
// points with their running length.
function payPath(id) {
  var xs = [], ys = [], route = PAY_ROUTE[id];
  for (var k = 0; k < route.length; k++) {
    var ch = CH[route[k][0]], rev = route[k][1];
    for (var i = 0; i < ch.n; i += 2) { var j = rev ? ch.n - 1 - i : i; xs.push(ch.xs[j]); ys.push(ch.ys[j]); }
  }
  xs.push(WHEEL.cx); ys.push(WHEEL.cy);
  var ls = [0];
  for (i = 1; i < xs.length; i++) ls.push(ls[i - 1] + Math.sqrt((xs[i] - xs[i - 1]) * (xs[i] - xs[i - 1]) + (ys[i] - ys[i - 1]) * (ys[i] - ys[i - 1])));
  return { xs: xs, ys: ys, ls: ls, len: ls[ls.length - 1] };
}

// --- canvas ------------------------------------------------------------------
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var scale = 1, offX = 0, offY = 0, dpr = 1, trackLayer = null, frontLayer = null;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
  buildLayers();
}

// The rails never move, so they are drawn once: sleepers, a shadow, two brass
// rails. The coil's near half is also drawn on a second layer that goes OVER
// the marbles, which is what puts a marble behind its own rails.
function buildLayers() {
  var k = scale * dpr;
  trackLayer = document.createElement("canvas"); frontLayer = document.createElement("canvas");
  trackLayer.width = frontLayer.width = Math.max(1, Math.round(W * k));
  trackLayer.height = frontLayer.height = Math.max(1, Math.round(H * k));
  var t = trackLayer.getContext("2d"), f = frontLayer.getContext("2d");
  t.setTransform(k, 0, 0, k, 0, 0); f.setTransform(k, 0, 0, k, 0, 0);
  for (var id in CH) {
    var ch = CH[id];
    drawRails(t, ch, function (z) { return z < 0; }, 0.4);
    drawRails(t, ch, function (z) { return z >= 0; }, 1);
    if (ch.coil) drawRails(f, ch, function (z) { return z >= 0.15; }, 1);
  }
}
function normalAt(ch, i) {
  var a = Math.max(0, i - 1), b = Math.min(ch.n - 1, i + 1);
  var dx = ch.xs[b] - ch.xs[a], dy = ch.ys[b] - ch.ys[a], L = Math.sqrt(dx * dx + dy * dy) || 1;
  return [-dy / L, dx / L];
}
function drawRails(c, ch, keep, alpha) {
  c.globalAlpha = alpha; c.lineCap = "round"; c.lineJoin = "round";
  var i, nv;
  c.strokeStyle = C_WOOD; c.lineWidth = 5;
  for (i = 0; i < ch.n; i += 5) {
    if (!keep(ch.zs[i])) continue;
    nv = normalAt(ch, i);
    c.beginPath(); c.moveTo(ch.xs[i] - nv[0] * (R + 7), ch.ys[i] - nv[1] * (R + 7));
    c.lineTo(ch.xs[i] + nv[0] * (R + 7), ch.ys[i] + nv[1] * (R + 7)); c.stroke();
  }
  var sides = [-(R + 2), R + 2], pass, s;
  for (pass = 0; pass < 2; pass++) {
    c.strokeStyle = pass ? C_BRASS : "rgba(0,0,0,0.45)"; c.lineWidth = pass ? 3.5 : 5;
    for (s = 0; s < 2; s++) {
      var open = false;
      c.beginPath();
      for (i = 0; i < ch.n; i++) {
        if (!keep(ch.zs[i])) { open = false; continue; }
        nv = normalAt(ch, i);
        var x = ch.xs[i] + nv[0] * sides[s] + (pass ? 0 : 1.5), y = ch.ys[i] + nv[1] * sides[s] + (pass ? 0 : 2.5);
        if (!open) { c.moveTo(x, y); open = true; } else c.lineTo(x, y);
      }
      c.stroke();
    }
  }
  c.globalAlpha = 1;
}
addEventListener("resize", resize);

// --- state -------------------------------------------------------------------
var marbles, queue, machines, sw, parts, floats, rings, shards, arcs, wheel, chimes, gates, ferris;
var state, t, spawnT, lockT, electricIn, arrival, path, score, combo, bestCombo, hearts;
var shake, flash, heartHit, hubPop, hubBreak, hubZap, stats, flow, gearA, liftPhase, screwPhase;
var auto = false, autoT = 0, overT = 0;

function reset() {
  marbles = []; queue = []; parts = []; floats = []; rings = []; shards = []; arcs = [];
  machines = {};
  for (var i = 0; i < MACHINE_DEFS.length; i++) {
    var d = MACHINE_DEFS[i];
    machines[d.id] = { id: d.id, name: d.name, x: d.x, color: d.color, kick: 0, fizz: 0, aim: -Math.PI / 2 };
  }
  arrival = MACHINE_DEFS[Math.floor(Math.random() * MACHINE_DEFS.length)].id;
  path = payPath(arrival);
  sw = {};
  for (var k in SW) {
    var dir = k === "S1" ? 1 : 0;
    sw[k] = { x: SW[k][0], y: SW[k][1], dir: dir, ang: branchAngle(k, dir), spin: 0, flash: 0 };
  }
  wheel = { phase: 0, notch: [], q: { wheelL: [], wheelR: [] }, flashT: { wheelL: 0, wheelR: 0 }, omega: WHEEL_OMEGA };
  for (i = 0; i < WHEEL_NOTCHES; i++) wheel.notch.push(null);
  gates = [];
  for (i = 0; i < GATES.length; i++) {
    var gc = CH[GATES[i][0]], gd = gc.len * GATES[i][1], gp = at(gc, gd), ga = at(gc, gd + 5);
    var tl = Math.sqrt((ga.x - gp.x) * (ga.x - gp.x) + (ga.y - gp.y) * (ga.y - gp.y)) || 1;
    var g = { id: GATES[i][0], ch: gc, d: gd, cap: GATES[i][2], q: [], locked: false, lockAge: 0, flush: false, flushT: 0,
      open: 9, broke: 0, x: gp.x, y: gp.y, tx: (ga.x - gp.x) / tl, ty: (ga.y - gp.y) / tl };
    // The pallet stands just ahead of the head of the queue; the plate hangs
    // where GATES puts it, linked to the pallet.
    g.fx = g.x + g.tx * (R + 4); g.fy = g.y + g.ty * (R + 4);
    g.px = GATES[i][3]; g.py = GATES[i][4];
    gc.gate = g; gates.push(g);
  }
  ferris = { phase: 0, bucket: [], rail: [], wait: [] };
  for (i = 0; i < FERRIS.buckets; i++) ferris.bucket.push(i < FERRIS.marbles ? { rot: i } : null);
  chimes = [];
  for (i = 0; i < CHIMES.length; i++) {
    var ch = CH[CHIMES[i][0]], cd = ch.len * CHIMES[i][1], p = at(ch, cd), nv = normalAt(ch, Math.round(cd / DS));
    if (nv[1] > 0) nv = [-nv[0], -nv[1]];      // hang it on the upper side of the rail
    chimes.push({ ch: ch, d: cd, x: p.x + nv[0] * 30, y: p.y + nv[1] * 30, hit: 9 });
  }
  electricIn = nextElectric();
  for (i = 0; i < PREVIEW; i++) queue.push(rollKind());
  state = "play"; t = 0; spawnT = 0.5; lockT = LOCK_FIRST; score = 0; combo = 0; bestCombo = 0; hearts = HEARTS;
  shake = 0; flash = 0; heartHit = 0; hubPop = 0; hubBreak = 0; hubZap = 0; overT = 0;
  flow = 0; gearA = 0; liftPhase = 0; screwPhase = 0;
  stats = { delivered: 0, eOn: 0, eWasted: 0, destroyed: 0, unlocks: 0, locks: 0, ptsE: 0, ptsC: 0 };
}

function branchAngle(id, dir) {
  var ch = CH[OUT[id][dir]], p = at(ch, 30);
  return Math.atan2(p.y - SW[id][1], p.x - SW[id][0]);
}
function progress() { return Math.min(1, t / RAMP_SECONDS); }
function lerp(a, b, k) { return a + (b - a) * k; }
function mod(a, m) { return ((a % m) + m) % m; }
function tempo() { return lerp(TEMPO_START, TEMPO_END, progress()); }
function pourGap() { return lerp(POUR_START, POUR_END, progress()); }
function lockGap() { return 1 / (LOCK_RATE + LOCK_RATE_GROW * t); }
function minOpen() { return lerp(MIN_OPEN_START, MIN_OPEN_END, progress()); }
function lockMax() { return Math.min(LOCK_MAX, 1 + Math.floor(t / LOCK_MORE_EVERY)); }
function nextElectric() { return ELECTRIC_EVERY - ELECTRIC_JITTER + Math.floor(Math.random() * (2 * ELECTRIC_JITTER + 1)); }
// The next marble of the pour: classic, or the electric one that is due.
function rollKind() {
  electricIn--;
  if (electricIn <= 0) { electricIn = nextElectric(); return "e"; }
  return "c";
}
function newMarble(kind, x, y) {
  var m = { e: kind === "e", st: "track", ch: null, d: 0, v: VMIN, x: x, y: y, z: 1, rot: Math.random() * 6 };
  marbles.push(m); return m;
}
function spawn(kind) { var m = newMarble(kind, CH.top.xs[0], CH.top.ys[0]); m.ch = CH.top; }
function gateLoad(g) {
  var n = g.q.length;
  for (var i = 0; i < marbles.length; i++) {
    var m = marbles[i];
    if (m.st === "track" && m.ch === g.ch && !m.gateOk) n++;
  }
  return n;
}
function tier(c) { var n = 0; for (var i = 0; i < TIERS.length; i++) if (c >= TIERS[i]) n = i + 1; return n; }
function mult() { return tier(combo) + 1; }
function lockedCount() { var n = 0; for (var i = 0; i < gates.length; i++) if (gates[i].locked) n++; return n; }
// The way a switch should lie for an electric marble to reach the arrival,
// or null when either way is as good (or the marble is already off its route).
function routeWant(id) {
  var a = arrival;
  if (id === "S0") return a === "bell" ? 0 : a === "cannon" ? 1 : null;
  if (id === "S1") return a === "bell" ? 0 : a === "cannon" ? null : 1;

}
function drawSocket(mc, kick) {
  // A wall socket: a rounded face, two slots and a ground hole, crackling.
  var cx = mc.x, cy = BOX_Y + 48;
  ctx.fillStyle = "#d8e4ea"; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - 40, cy - 34, 80, 68, 16); else ctx.rect(cx - 40, cy - 34, 80, 68);
  ctx.fill();
  ctx.fillStyle = "#22313a";
  ctx.fillRect(cx - 22, cy - 18, 9, 24); ctx.fillRect(cx + 13, cy - 18, 9, 24);
  ctx.beginPath(); ctx.arc(cx, cy + 18, 6, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = C_VOLT; ctx.lineWidth = 2;
  var n = kick > 0 ? 6 : 1;
  for (var i = 0; i < n; i++) if (kick > 0 || Math.random() < 0.3) {
    var a = Math.random() * Math.PI * 2;
    bolt(cx + (Math.random() < 0.5 ? -17 : 17), cy - 6, cx + Math.cos(a) * 60, cy + Math.sin(a) * 40, 6, 4);
  }
}
function drawBell(mc, kick) {
  var swing = kick > 0 ? Math.sin(t * 30) * 0.5 * kick / 0.35 : Math.sin(t * 2) * 0.03;
  ctx.save(); ctx.translate(mc.x, BOX_Y + 18); ctx.rotate(swing);
  ctx.fillStyle = mc.color; ctx.beginPath();
  ctx.moveTo(-26, 60); ctx.quadraticCurveTo(-24, 8, 0, 6); ctx.quadraticCurveTo(24, 8, 26, 60); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C_BRASS_D; ctx.beginPath(); ctx.arc(0, 64, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawFurnace(mc, kick) {
  var base = BOX_Y + 88;
  ctx.fillStyle = "#120c08"; ctx.fillRect(mc.x - 55, BOX_Y + 26, 110, 62);
  for (var i = 0; i < 6; i++) {
    var fx = mc.x - 48 + i * 19, h = (22 + 12 * Math.sin(t * 9 + i * 1.7) + 7 * Math.sin(t * 23 + i)) * (1 + 1.4 * kick);
    ctx.fillStyle = i % 2 ? "#ff6a2a" : "#ffb03a";
    ctx.beginPath(); ctx.moveTo(fx - 10, base); ctx.lineTo(fx, base - h); ctx.lineTo(fx + 10, base); ctx.fill();
  }
  ctx.strokeStyle = C_STEEL; ctx.lineWidth = 3;
  for (i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(mc.x - 50 + i * 25, BOX_Y + 26); ctx.lineTo(mc.x - 50 + i * 25, base); ctx.stroke(); }
}
function drawLauncher(mc, kick) {
  // A spring that jolts under every marble.
  var top = BOX_Y + 22 + (kick > 0 ? 20 * Math.sin(kick / 0.35 * Math.PI) : 0);
  ctx.strokeStyle = C_STEEL; ctx.lineWidth = 4; ctx.beginPath();
  var bottom = BOX_Y + 90, n = 8;
  for (var i = 0; i <= n; i++) ctx.lineTo(mc.x + (i % 2 ? 18 : -18), top + 12 + (bottom - top - 12) * i / n);
  ctx.stroke();
  ctx.fillStyle = mc.color; ctx.fillRect(mc.x - 28, top, 56, 12);
}
function drawCannon(mc, kick) {
  var px = mc.x, py = BOX_Y + 66, a = -Math.PI / 2 + 0.5 * Math.sin(t * 0.8);
  ctx.save(); ctx.translate(px, py); ctx.rotate(a);
  ctx.fillStyle = C_STEEL; ctx.fillRect(-6 - (kick > 0 ? 12 * kick / 0.35 : 0), -11, 58, 22);
  ctx.restore();
  if (kick > 0.2) { ctx.fillStyle = "rgba(230,220,255,0.6)"; ctx.beginPath(); ctx.arc(px + Math.cos(a) * 60, py + Math.sin(a) * 60, 12, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = mc.color; ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI * 2); ctx.fill();
}

function heartShape(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.2, y + s * 0.1, x - s * 0.9, y - s * 0.9, x, y - s * 0.3);
  ctx.bezierCurveTo(x + s * 0.9, y - s * 0.9, x + s * 1.2, y + s * 0.1, x, y + s * 0.9);
  ctx.closePath(); ctx.fill();
}
function drawHud() {
  ctx.textAlign = "left"; ctx.fillStyle = C_TEXT; ctx.font = "800 40px system-ui, sans-serif";
  ctx.fillText(Math.floor(score), 28, 58);
  ctx.font = "600 22px system-ui, sans-serif"; ctx.fillStyle = C_DIM;
  ctx.fillText(Math.floor(t) + " s   best x" + bestCombo, 28, 90);
  ctx.textAlign = "center";
  ctx.fillStyle = auto ? C_BRASS : "#3a2c1e"; ctx.fillRect(290, 30, 120, 44);
  ctx.fillStyle = auto ? "#1c140e" : C_DIM; ctx.font = "700 22px system-ui, sans-serif";
  ctx.fillText(auto ? "Auto on" : "Auto", 350, 60);
  // Hearts: the one just lost bursts.
  for (var i = 0; i < HEARTS; i++) {
    var hx = 446 + i * 29, hy = 50, lost = i >= hearts, fresh = i === hearts && heartHit > 0;
    var s = 11 * (fresh ? 1 + heartHit : 1);
    ctx.fillStyle = lost ? (fresh ? "rgba(255,77,94," + heartHit + ")" : "#3a2c1e") : C_HEART;
    heartShape(hx, hy, s);
    if (fresh) {
      // The heart just lost cracks down the middle.
      ctx.strokeStyle = "#1c140e"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(hx, hy - s * 0.35); ctx.lineTo(hx - s * 0.25, hy); ctx.lineTo(hx + s * 0.2, hy + s * 0.3); ctx.lineTo(hx, hy + s * 0.85); ctx.stroke();
    }
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0e0a07"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  var sx = shake > 0 ? (Math.random() - 0.5) * 16 * shake / 0.35 : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * 16 * shake / 0.35 : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (offX + sx * scale) * dpr, (offY + sy * scale) * dpr);
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, C_BG2); bg.addColorStop(1, C_BG);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Background works: meshing gears that turn faster when the rails are busy.
  ctx.globalAlpha = 0.16;
  for (var i = 0; i < DECO_GEARS.length; i++) {
    var gdef = DECO_GEARS[i], dir = i % 2 ? -1 : 1;
    cog(gdef[0], gdef[1], gdef[2], gdef[3], gearA * dir * 60 / gdef[2], C_BRASS);
  }
  ctx.globalAlpha = 1;

  drawBackground();
  ctx.globalAlpha = 0.75; drawLift(); ctx.globalAlpha = 1;
  drawHopper();
  drawGlow();
  drawWheel();
  ctx.drawImage(trackLayer, 0, 0, W, H);
  for (i = 0; i < chimes.length; i++) {
    var c = chimes[i], lit = Math.max(0, 1 - c.hit / 0.35), wob = lit * Math.sin(c.hit * 60) * 0.3;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(wob);
    ctx.fillStyle = lit > 0 ? "rgba(255,230,160," + (0.5 + lit * 0.5) + ")" : C_BRASS_D;
    ctx.fillRect(-14, -5, 28, 10);
    if (lit > 0) { ctx.strokeStyle = "rgba(255,230,160," + lit + ")"; ctx.lineWidth = 2; ctx.strokeRect(-20 - lit * 8, -10 - lit * 6, 40 + lit * 16, 20 + lit * 12); }
    ctx.restore();
  }
  drawSwitches();
  drawGates();
  drawArcs();

  for (i = 0; i < marbles.length; i++) if (marbles[i].z < 0) drawMarble(marbles[i]);
  ctx.drawImage(frontLayer, 0, 0, W, H);
  for (i = 0; i < marbles.length; i++) {
    var m = marbles[i];
    if (m.z >= 0 && m.st !== "drop" && m.st !== "gutter" && m.st !== "cupwait" && m.st !== "screw" && m.st !== "back") drawMarble(m);
  }
  drawMachines();
  for (i = 0; i < marbles.length; i++) if (marbles[i].st === "gutter" || marbles[i].st === "cupwait") drawMarble(marbles[i]);
  drawOrbit();

  for (i = 0; i < parts.length; i++) {
    var p = parts[i], ps = p.small ? 3 : 4;
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - ps, p.y - ps, ps * 2, ps * 2);
  }
  for (i = 0; i < shards.length; i++) {
    var sh = shards[i], sl = sh.small ? 6 : 9;
    ctx.globalAlpha = 1 - sh.t / sh.life; ctx.strokeStyle = sh.color; ctx.lineWidth = sh.small ? 4 : 5;
    ctx.beginPath(); ctx.moveTo(sh.x - Math.cos(sh.a) * sl, sh.y - Math.sin(sh.a) * sl); ctx.lineTo(sh.x + Math.cos(sh.a) * sl, sh.y + Math.sin(sh.a) * sl); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = "rgba(255,40,30," + (flash / 0.3 * 0.14) + ")"; ctx.fillRect(0, 0, W, H); }

  drawHud();

  ctx.textAlign = "center";
  for (i = 0; i < floats.length; i++) {
    var f = floats[i], life = f.life || 1, k = f.t / life;
    ctx.globalAlpha = Math.max(0, 1 - k); ctx.fillStyle = f.color;
    ctx.font = "800 " + (f.size || 28) + "px system-ui, sans-serif";
    // Kept on screen and clear of the HUD band; a big word gets a dark rim so
    // it reads over the rails.
    var hw = ctx.measureText(f.str).width / 2 + 12;
    var fx2 = Math.max(hw, Math.min(W - hw, f.x)), fy2 = Math.max(150, f.y) - k * (life > 1 ? 30 : 70);
    if ((f.size || 28) >= 30) { ctx.strokeStyle = "rgba(14,10,7,0.9)"; ctx.lineWidth = 7; ctx.lineJoin = "round"; ctx.strokeText(f.str, fx2, fy2); }
    ctx.fillText(f.str, fx2, fy2);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#7d6a52"; ctx.font = "20px system-ui, sans-serif";
  ctx.fillText("Debug: pour " + (1 / pourGap()).toFixed(1) + "/s  tempo " + tempo().toFixed(2) + "  lock every " + lockGap().toFixed(1) +
    " s  locked " + lockedCount() + "/" + lockMax() + "  electric " + stats.eOn + "/" + (stats.eOn + stats.eWasted), MID, 1268);

  if (state === "over") {
    ctx.fillStyle = "rgba(0,0,0,0.74)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = C_TEXT; ctx.font = "800 64px system-ui, sans-serif";
    ctx.fillText("Out of hearts", W / 2, 460);
    ctx.font = "800 44px system-ui, sans-serif"; ctx.fillStyle = C_WARN;
    var mm = Math.floor(t / 60), ss = Math.floor(t % 60);
    ctx.fillText("Survived " + (mm ? mm + " min " : "") + ss + " s", W / 2, 535);
    ctx.font = "700 40px system-ui, sans-serif"; ctx.fillStyle = C_TEXT;
    ctx.fillText("Score " + Math.floor(score), W / 2, 605);
    ctx.font = "600 30px system-ui, sans-serif"; ctx.fillStyle = C_DIM;
    ctx.fillText("Best combo x" + bestCombo, W / 2, 665);
    ctx.fillStyle = C_VOLT;
    ctx.fillText("Electric on target " + stats.eOn + "   wasted " + stats.eWasted, W / 2, 710);
    ctx.fillStyle = C_DIM;
    ctx.fillText("Marbles destroyed " + stats.destroyed, W / 2, 755);
    ctx.font = "26px system-ui, sans-serif";
    ctx.fillText(auto ? "Auto plays again in " + Math.max(1, Math.ceil(AUTO_RESTART - overT)) + " s" : "Tap to play again", W / 2, 840);
  }
}

// --- input ---------------------------------------------------------------------
function setAuto(on) { auto = on; reset(); }
cv.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale;
  if (x >= 290 && x <= 410 && y >= 30 && y <= 74) { setAuto(!auto); return; }
  if (state === "over") { reset(); return; }
  if (auto || state !== "play") return;
  // The nearest of the four switches and the locked gates' buttons gets the tap.
  var best = null, gate = null, bd = TAP_REACH, d;
  for (var k in sw) {
    d = Math.sqrt((sw[k].x - x) * (sw[k].x - x) + (sw[k].y - y) * (sw[k].y - y));
    if (d < bd) { bd = d; best = k; }
  }
  for (var i = 0; i < gates.length; i++) {
    if (!gates[i].locked) continue;
    d = Math.sqrt((gates[i].px - x) * (gates[i].px - x) + (gates[i].py - y) * (gates[i].py - y));
    if (d < bd) { bd = d; gate = gates[i]; best = null; }
  }
  if (gate) unlock(gate); else if (best) flip(best);
});
addEventListener("keydown", function (e) {
  if (e.repeat) return;
  if (e.key >= "1" && e.key <= "4" && !auto && state === "play") flip("S" + (e.key - 1));
  else if (e.key >= "5" && e.key <= "8" && !auto) unlock(gates[e.key - 5]);
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "a" || e.key === "A") setAuto(!auto);
});

// --- loop ----------------------------------------------------------------------
var lastT = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
reset();
requestAnimationFrame(frame);
</script>
