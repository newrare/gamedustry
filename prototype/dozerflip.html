     cannot import a local module, and the classic build is the one a plain

<script>
// ---------------------------------------------------------------------------
// Dozerflip - a bulldozer that skates. Tricks fill the demolition gauge, the
// gauge decides what the blade can break.
//
// The question: do the two loops feed each other - shred the skate roads to
// level up, then cash the level in on a demolition zone - and does a combo
// that strings tricks and destruction together make you want to keep going?
//
// The map
//   - four DEMOLITION ZONES in the corners, each built in a band of tiers:
//     south-west 1-2, south-east 3-4, north-east 5-7, north-west 8-10.
//   - between them, SKATE ROADS with three kinds of trick spot:
//     PITS - a pool in the middle, a half-pipe down the east and the west
//     avenue, a bowl up north. Go straight up a wall: the dozer turns in the
//     air and comes back in. Carve over the lip at an angle to get out.
//     RIDE RAILS - absurd bars with loops, spirals and barrel rolls. Touch
//     one (its way in is the ring on the ground) and it carries you to the
//     end, then throws you into the air.
//     BUMPS and a few kiosks to smash on the way.
//
// Tricks (semi-automatic, after Denshattack)
//   - SPACE in the air plays a trick, and the game picks one that fits the
//     air time left: more air, bigger trick. Press again while it plays to
//     queue the next one; every extra trick in the same jump pays more.
//   - land in the middle of a trick and you BAIL: the combo is lost. Land
//     near its end: sketchy, half points. Land just after it ended: PERFECT,
//     a bonus and a boost.
//   - on a rail, SPACE plays a rail trick, which never bails.
//
// The gauge (levels 1 to 10, it only ever goes up)
//   - every block wears its tier's colour: 1 green, 2 blue, 3 purple, 4 pink,
//     5 red, 6 orange, 7 yellow, 8 cyan, 9 white, 10 black.
//   - a block at or under your level breaks normally. Above it, every level
//     missing doubles the damage it needs (TIER_STEP).
//   - the gauge fills with TRICKS only: drift, rails, carving a pit wall, air
//     time, air tricks. Destruction scores, it does not level you up.
//
// The combo (the score)
//   - every trick and every destruction adds its points to the combo and +1
//     to its multiplier. In the air, on a rail, drifting or on a pit wall
//     the combo holds; back on flat ground it has COMBO_WINDOW seconds to get
//     a new move, then it is banked: points x multiplier.
//
// The look ("Arcade", the default style; the menu keeps the earlier ones)
//   - a toy bulldozer in yellow and orange on purple tracks, with a violet
//     cab, a silver blade and lights that glow; it rocks on its tracks, its
//     treads roll, its blade lifts in the air and it wears a pink glow while a
//     combo is alive.
//   - a skate city under a saturated blue sky: tier blocks with a white roof
//     and windows, candy-striped rails on trusses, orange ramps with a hazard
//     lip, purple asphalt with yellow paint, low poly trees, cones, barriers
//     and hedges to run over, a skyline and clouds behind the walls.
//   - bloom, ribbons, star flashes, hit-stop and a jelly wobble on every hit.
//
// Controls
//   phone : drag = drive (direction on screen). A quick tap or a second
//           finger = jump, in the air a trick; a second finger held = drift.
//   desk  : up = throttle, left / right = turn, down = brake / reverse,
//           SPACE = jump, in the air a trick, SHIFT = drift.
//           R = new map, M = menu (camera and style).
//   ?bot=1 drives itself, ?seed=N fixes the map
// ---------------------------------------------------------------------------

// camera

var CAMS = [

var TIERS = [null,
  { name: "Green", hex: 0x46d160 }, { name: "Blue", hex: 0x3b86ff }, { name: "Purple", hex: 0x9a55f2 },
  { name: "Pink", hex: 0xff5aa8 }, { name: "Red", hex: 0xf5483b }, { name: "Orange", hex: 0xff8f2e },
  { name: "Yellow", hex: 0xffd22e }, { name: "Cyan", hex: 0x2fd9de }, { name: "White", hex: 0xf3efff },

var ZONES = [
  { cx: -ZC, cz: ZC, t0: 1, t1: 2 },        // south-west, next to the start
  { cx: ZC, cz: ZC, t0: 3, t1: 4 },
  { cx: ZC, cz: -ZC, t0: 5, t1: 7 },
  { cx: -ZC, cz: -ZC, t0: 8, t1: 10 }
];
var RAIL_COLS = [[0xff3fa4, 0xffffff], [0x2ee6ff, 0xffffff], [0xffc928, 0xffffff], [0x7cf04a, 0xffffff],
  [0xa66bff, 0xffffff], [0xff7a1a, 0xffffff]];
// what the city is dressed with, whatever the tier
var PAL = { cap: 0xf1eaff, glass: 0xa9e6ff, glassDim: 0x6fb4f2, trunk: 0x8a5a36, leaf: [0x8be04a, 0x6fd13f, 0xa6ee58],
  hedge: 0x58c43c, cone: 0xff7a1a, barrier: 0xece5fa, stripe: 0xff7a1a, truss: 0x5a63e6, glow: 0xff3fa4 };

// ---- styles ----------------------------------------------------------------------
var hsl = { h: 0, s: 0, l: 0 }, tmpC = null;
function shade(hex, fn) { tmpC = tmpC || new THREE.Color(); tmpC.setHex(hex).getHSL(hsl); fn(hsl); return tmpC.setHSL(hsl.h, hsl.s, hsl.l).getHex(); }
var STYLES = [
  // Arcade: the reference look. Flat shaded low poly in candy colours, a warm

  { name: "Arcade", arcade: true, lowpoly: true, ao: true, tone: 1.0, outline: true,
    post: { band: 0.26, soft: 0.5, blur: 1.0, sat: 1.2, vignette: 0.14, bloom: 0.85, arcade: true },
    sky: [0x1846e0, 0x2b8cff, 0x9be2ff], bg: 0x9be2ff, fogAbs: [230, 800],
    hemi: [0xe8e4ff, 0xb596f2, 2.2], sun: [0xffe4b8, 2.4], sunPos: [58, 66, 44],
    ground: { dirt: "#62cf46", park: "#8d7dc6", joint: "rgba(44, 22, 96, 0.10)", asphalt: "#5e5096", side: "#efe7fd", lot: "#c3b4ec",
      line: "#ffd84a", deck: "#cfc3ee" },
    wall: 0xece5fa, ramp: [0xf0782a, 0xffdcaa], rail: 0xfff0fa, mark: 0x2a1650, dust: 0xfff3ff },
  { name: "Pastel", bg: 0x3b3a36, hemi: [0xe4ecff, 0x5a4e40, 1.5], sun: [0xfff0d8, 2.2],
    ground: { dirt: "#6b5f4c", park: "#a9adb2", joint: "rgba(0, 0, 0, 0.12)", asphalt: "#4d525a", side: "#8e949a", lot: "#7d8a6e" },
    wall: 0x2c2f33, ramp: [0x8a3f12, 0xffb347], rail: 0xc9ced4, mark: 0x1d1a16, dust: 0xc8bca8 },
  { name: "Toon", toon: 3, bg: 0x2e3440, hemi: [0xffffff, 0x6a6a7a, 1.4], sun: [0xffffff, 2.8],
    ground: { dirt: "#5b8a3c", park: "#c9d0d8", joint: "rgba(0, 0, 0, 0.15)", asphalt: "#3d4452", side: "#b9c2cc", lot: "#69b85a" },
    wall: 0x22262e, ramp: [0xc0441a, 0xffc93c], rail: 0xe8eef4, mark: 0x1a1d24, dust: 0xffffff,
    pal: function (hex, keep) { return keep ? hex : shade(hex, function (c) { c.s = Math.min(1, c.s * 1.7 + 0.1); }); } },
  { name: "Clay", bg: 0xd9d4cc, hemi: [0xffffff, 0x8f887d, 1.9], sun: [0xffffff, 2.1],
    ground: { dirt: "#bcb5aa", park: "#e4dfd7", joint: "rgba(0, 0, 0, 0.06)", asphalt: "#c3bdb3", side: "#dcd7cf", lot: "#d0cac0" },
    wall: 0xa49e95, ramp: [0xaa9c88, 0xece2d2], rail: 0xf2eee8, mark: 0x8a8378, dust: 0xf0ebe3,
    pal: function (hex, keep) { return keep ? hex : shade(hex, function (c) { c.h = 0.09; c.s = 0.07; c.l = 0.72 + (c.l - 0.6) * 0.4; }); } },
  { name: "Night", bg: 0x0b0f18, hemi: [0x5a6aa8, 0x1c2030, 1.0], sun: [0xa8bcff, 1.0], fog: true, headlight: true,

    pal: function (hex, keep) { return keep ? hex : shade(hex, function (c) { c.l *= 0.8; }); } },
  { name: "Desert", bg: 0xe3c79a, hemi: [0xfff2d8, 0xa07a4a, 1.4], sun: [0xffe0b0, 2.6],
    ground: { dirt: "#cfae7c", park: "#dcc39a", joint: "rgba(90, 60, 30, 0.15)", asphalt: "#8a6f52", side: "#c9a878", lot: "#d9b884" },

// ---- seeded random ------------------------------------------------------------
var params = new URLSearchParams(location.search);
var BOT = params.get("bot") === "1";
var seed = +params.get("seed") || ((Math.random() * 1e9) | 0);
var rnd;
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(a, b) { return a + (b - a) * rnd(); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function wrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

// ---- post: bloom, tilt-shift, grade, tone mapping (styles with a `post` block) ----
// The scene is rendered linear into a half-float target. What is brighter than
// white (the lights, the ribbons, the sparks: their colours are written above
// 1 on purpose) is pulled out at half size and blurred at a quarter: the bloom.
// The frame is then blurred across and down with a radius that grows away from
// a horizontal band in focus (the band follows the dozer on screen), the bloom

// ---- loop -----------------------------------------------------------------------

  if (!dozer.ground && !dozer.rail && dozer.air.cur) ts *= TRICK_TIME;
  stopCd -= rdt;
  if (stopT > 0) { stopT -= rdt; ts = 0.03; }             // hit-stop: the frame holds on the blow
  var dt = rdt * ts;
  if (!menuOpen) { step(dt); playT += rdt; }
  levelFlash = Math.max(0, levelFlash - rdt * 1.5);
  for (var f = floats.length - 1; f >= 0; f--) { floats[f].t += rdt; if (floats[f].t > (floats[f].life || 1.2)) floats.splice(f, 1); }
  for (var d = 0; d < railDecals.length; d++) { railDecals[d].material.opacity = 0.5 + 0.4 * Math.sin(now / 160 + d); railDecals[d].scale.setScalar(1 + 0.08 * Math.sin(now / 160 + d)); }
  placeCamera(rdt);
  drawDozer(rdt, menuOpen ? 0 : dt);
  updateTrail(rdt);
  renderFrame(rdt);
  drawHud(fpsS, rdt);
  window.__s = { score: score, level: level, gauge: Math.round(gauge), combo: combo.mult, bestCombo: stats.bestCombo,
