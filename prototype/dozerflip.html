<script>
// ---------------------------------------------------------------------------
// Dozerflip - a bulldozer that skates. Tricks fill the demolition gauge, the
// gauge decides what the blade can break.
//
// The question: do the two loops feed each other - shred the skate roads to
// level up, then cash the level in on a demolition zone - and does a combo
// that strings tricks and destruction together make you want to keep going?
//
// The map
//   - four DEMOLITION ZONES in the corners, each built in a band of tiers:
//     south-west 1-2, south-east 3-4, north-east 5-7, north-west 8-10.
//   - between them, SKATE ROADS with three kinds of trick spot:
//     PITS - a pool in the middle, a half-pipe down the east and the west
//     avenue, a bowl up north. Go straight up a wall: the dozer turns in the
//     air and comes back in. Carve over the lip at an angle to get out.
//     RIDE RAILS - absurd bars with loops, spirals and barrel rolls. Touch
//     one (its way in is the ring on the ground) and it carries you to the
//     end, then throws you into the air.
//     BUMPS and a few kiosks to smash on the way.
//
// Tricks (semi-automatic, after Denshattack)
//   - SPACE in the air plays a trick, and the game picks one that fits the
//     air time left: more air, bigger trick. Press again while it plays to
//     queue the next one; every extra trick in the same jump pays more.
//   - land in the middle of a trick and you BAIL: the combo is lost. Land
//     near its end: sketchy, half points. Land just after it ended: PERFECT,
//     a bonus and a boost.
//   - on a rail, SPACE plays a rail trick, which never bails.
//
// The gauge (levels 1 to 10, it only ever goes up)
//   - every block wears its tier's colour: 1 green, 2 blue, 3 purple, 4 pink,
//     5 red, 6 orange, 7 yellow, 8 cyan, 9 white, 10 black.
//   - a block at or under your level breaks normally. Above it, every level
//     missing doubles the damage it needs (TIER_STEP).
//   - the gauge fills with TRICKS only: drift, rails, carving a pit wall, air
//     time, air tricks. Destruction scores, it does not level you up.
//
// The combo (the score)
//   - every trick and every destruction adds its points to the combo and +1
//     to its multiplier. In the air, on a rail, drifting or on a pit wall
//     the combo holds; back on flat ground it has COMBO_WINDOW seconds to get
//     a new move, then it is banked: points x multiplier.
//
// Controls
//   phone : drag = drive (direction on screen). A quick tap or a second
//           finger = jump, in the air a trick; a second finger held = drift.
//   desk  : up = throttle, left / right = turn, down = brake / reverse,
//           SPACE = jump, in the air a trick, SHIFT = drift.
//           R = new map, M = menu (camera and style).
//   ?bot=1 drives itself, ?seed=N fixes the map
// ---------------------------------------------------------------------------

var TIERS = [null,
  { name: "Green", hex: 0x4cbf56 }, { name: "Blue", hex: 0x3d7be8 }, { name: "Purple", hex: 0x9b59d0 },
  { name: "Pink", hex: 0xf06aa8 }, { name: "Red", hex: 0xe0433a }, { name: "Orange", hex: 0xf59331 },

// ---- styles ----------------------------------------------------------------------

    wall: 0x0c0e11, ramp: [0x4a220a, 0xff9a30], rail: 0x9aa6c0, mark: 0x050505, dust: 0x6b6a75,
    pal: function (hex, keep) { return keep ? hex : shade(hex, function (c) { c.l *= 0.8; }); } },
  { name: "Desert", bg: 0xe3c79a, hemi: [0xfff2d8, 0xa07a4a, 1.4], sun: [0xffe0b0, 2.6],
    ground: { dirt: "#cfae7c", park: "#dcc39a", joint: "rgba(90, 60, 30, 0.15)", asphalt: "#8a6f52", side: "#c9a878", lot: "#d9b884" },

    ground: { dirt: "#6b5f4c", park: "#a9adb2", joint: "rgba(0, 0, 0, 0.18)", asphalt: "#4d525a", side: "#8e949a", lot: "#7d8a6e" },
    wall: 0x2c2f33, ramp: [0x8a3f12, 0xffb347], rail: 0xc9ced4, mark: 0x1d1a16, dust: 0xc8bca8 },

var STYLE = STYLES[0];

function save(k, v) { try { localStorage.setItem("dozerflip:" + k, String(v)); } catch (e) {} }

// ---- seeded random ------------------------------------------------------------
var params = new URLSearchParams(location.search);
var BOT = params.get("bot") === "1";
var seed = +params.get("seed") || ((Math.random() * 1e9) | 0);
var rnd;
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(a, b) { return a + (b - a) * rnd(); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function wrap(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

// ---- renderer, scene, lights ---------------------------------------------------

// ---- post: tilt-shift, grade, tone mapping (styles with a `post` block) ---------
// The scene is rendered linear into a half-float target, blurred across then
// down with a radius that grows away from a horizontal band in focus (the band
// follows the dozer on screen), then graded, tone mapped (ACES, three's own
// fit) and written as sRGB. Two full-screen passes, 13 taps each.
var rtScene = null, rtBlur = null, postScene, postCam, postQuad, blurH, blurV, focusY = 0.5, vFocus = new THREE.Vector3();
var POST_VS = "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
var POST_BLUR = [
  "uniform sampler2D tSrc; uniform vec2 uDir; uniform float uFocus, uBand, uSoft, uMax;",
  "varying vec2 vUv;",
  "vec3 blurred() {",
  "  float r = uMax * smoothstep(uBand, uBand + uSoft, abs(vUv.y - uFocus));",
  "  if (r < 0.05) return texture2D(tSrc, vUv).rgb;",
  "  vec3 c = vec3(0.0); float ws = 0.0;",
  "  for (int i = -6; i <= 6; i++) {",
  "    float fi = float(i), w = exp(-fi * fi / 18.0);",
  "    c += texture2D(tSrc, vUv + uDir * fi * r / 3.0).rgb * w; ws += w;",
  "  }",
  "  return c / ws;",
  "}"
].join("\n");
var POST_GRADE = [
  "uniform float uExposure, uSat, uVig;",
  "vec3 aces(vec3 v) {",
  "  const mat3 IN = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));",
  "  const mat3 OUT = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));",
  "  v = IN * (v * uExposure / 0.6);",
  "  vec3 a = v * (v + 0.0245786) - 0.000090537, b = v * (0.983729 * v + 0.4329510) + 0.238081;",
  "  return clamp(OUT * (a / b), 0.0, 1.0);",
  "}",
  "vec3 srgb(vec3 c) { return mix(pow(c, vec3(0.41666)) * 1.055 - vec3(0.055), c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308)))); }"
].join("\n");
function sizePost() {
  if (!rtScene) return;
  var pr = renderer.getPixelRatio(), w = Math.round(W * pr), h = Math.round(H * pr);
  rtScene.setSize(w, h); rtBlur.setSize(w, h);
  blurH.uniforms.uDir.value.set(1 / w, 0); blurV.uniforms.uDir.value.set(0, 1 / h);

function ensurePost() {

      b.mesh.position.set(b.x + rr(-0.3, 0.3), b.base + b.ht * k / 2, b.z + rr(-0.3, 0.3));
      if (b.crumble >= 1) scene.remove(b.mesh);
    }
  }
  for (var p = pend.length - 1; p >= 0; p--) {
    var e = pend[p]; e.t -= dt;
    if (e.t <= 0) { pend.splice(p, 1); if (!e.o.fall) damage(e.o, e.dmg, e.dx, e.dz, e.cause); }
  }
  for (var j = 0; j < blasts.length; j++) {
    var bl = blasts[j]; if (bl.t >= 1) continue;
    bl.t = Math.min(1, bl.t + dt / 0.45);
    bl.m.scale.setScalar(bl.r * (0.3 + 0.7 * Math.sqrt(bl.t)));
    bl.m.material.opacity = 0.85 * (1 - bl.t);
    if (bl.t >= 1) bl.m.visible = false;
  }
}

function busy() { return !dozer.ground || dozer.rail || dozer.drift || (dozer.pit && dozer.n.y < 0.9); }
function step(dt) {
  readInput(dt);
  if (!over) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; over = true; overText = "Time's up"; bankCombo(); }
  }
  if (over) { inp.m = 0; inp.thr = 0; inp.rev = false; inp.steer = 0; inp.press = false; }
  var sub = 3, h = dt / sub;
  for (var s = 0; s < sub; s++) stepDozer(h, s === 0 && inp.press);
  for (var r = 0; r < rails.length; r++) rails[r].cool = Math.max(0, rails[r].cool - dt);
  stepBuildings(dt);
  stepChunks(dt);
  stepDust(dt);
  stepSparks(dt);
  stepRings(dt);
  // the combo holds while something is going on, then has a short window
  if (combo.mult > 0 && !over) {
    if (busy()) combo.t = COMBO_WINDOW;
    else { combo.t -= dt; if (combo.t <= 0) bankCombo(); }
  }
}

// ---- camera, menu, styles --------------------------------------------------------
var CAM = CAMS[0];
var cam = { x: 0, y: 0, z: 0, zf: 1, yaw: -Math.PI / 2 };
function placeCamera(dt) {
  var speed = Math.sqrt(dozer.vx * dozer.vx + dozer.vz * dozer.vz), sp3 = Math.sqrt(speed * speed + dozer.vy * dozer.vy);
  var k = 1 - Math.exp(-CAM_SMOOTH * dt);
  if (CAM.yaw === "chase") cam.yaw = wrap(cam.yaw + wrap(dozer.a - cam.yaw) * (1 - Math.exp(-3 * dt)));
  var fx = Math.cos(cam.yaw), fz = Math.sin(cam.yaw), ahead = CAM.ahead || 0;
  var tx = dozer.x + dozer.vx * CAM_LEAD + fx * ahead, tz = dozer.z + dozer.vz * CAM_LEAD + fz * ahead;
  cam.x += (tx - cam.x) * k; cam.z += (tz - cam.z) * k;
  cam.y += (dozer.y * 0.7 - cam.y) * k;
  cam.zf += (1 + Math.min(speed, 32) * CAM_ZOOM - cam.zf) * k * 0.5;
  shake = Math.max(0, shake - dt * 2.2);
  var sx = (Math.random() - 0.5) * shake * 1.6, sz = (Math.random() - 0.5) * shake * 1.6;
  var back = CAM.back * cam.zf, h = CAM.h * cam.zf;
  camera.position.set(cam.x - fx * back + sx, cam.y + h, cam.z - fz * back + sz);
  if (CAM.back < 5) camera.up.set(fx, 0, fz); else camera.up.set(0, 1, 0);
  camera.lookAt(cam.x + sx, cam.y, cam.z + sz);
  fovPunch = Math.max(0, fovPunch - dt * 18);
  if (CAM.ortho) {
    var oh = CAM.ortho * cam.zf * (1 + fovPunch * 0.01), aspect = W / H;
    orthoCam.left = -oh * aspect; orthoCam.right = oh * aspect; orthoCam.top = oh; orthoCam.bottom = -oh;
    orthoCam.updateProjectionMatrix();
  } else {                                // speed widens the lens a touch, a big moment kicks it
    perspCam.fov = CAM.fov * (1 + 0.14 * clamp((sp3 - 20) / 20, 0, 1)) + fovPunch * CAM.fov / 30;
    perspCam.updateProjectionMatrix();
  }
  if (scene.fog) {
    var d = Math.sqrt(back * back + h * h), fk = STYLE.fog.length ? STYLE.fog : [0.75, 1.8];
    scene.fog.near = d * fk[0]; scene.fog.far = d * fk[1];
  }
  var sp = STYLE.sunPos || [55, 70, 35];
  sun.position.set(cam.x + sp[0], sp[1], cam.z + sp[2]);
  sun.target.position.set(cam.x, 0, cam.z);
}
var menuEl = document.getElementById("menu"), menuOpen = false, camIdx = 0, styleIdx = 0;
function applyCam(i) {
  CAM = CAMS[i]; camIdx = i; save("cam", i);
  camera = CAM.ortho ? orthoCam : perspCam;
  if (!CAM.ortho) { perspCam.fov = CAM.fov; perspCam.updateProjectionMatrix(); }
  cam.yaw = CAM.yaw === "iso" ? -Math.PI / 4 : CAM.yaw === "chase" ? dozer.a : -Math.PI / 2;
  refreshMenu();
}
function applyStyle(i) {
  STYLE = STYLES[i]; styleIdx = i; save("style", i);
  scene.background.setHex(STYLE.bg);
  hemi.color.setHex(STYLE.hemi[0]); hemi.groundColor.setHex(STYLE.hemi[1]); hemi.intensity = STYLE.hemi[2];
  sun.color.setHex(STYLE.sun[0]); sun.intensity = STYLE.sun[1];
  drawGround();
  groundMesh.material = STYLE.lowpoly ? groundMatLow : groundMat;
  renderer.toneMapping = STYLE.tone && !STYLE.post ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = STYLE.tone || 1;
  sun.shadow.normalBias = STYLE.lowpoly ? 0.05 : 0;
  matCache = {};
  scene.traverse(function (o) { if (o.isMesh && (o.userData.hex !== undefined || o.userData.wall)) dress(o); });
  buildings.forEach(function (b) { if (b.ao) b.ao.visible = !!STYLE.ao; });
  chunkMesh.material = makeMat({ color: 0xffffff });
  dustMesh.material.color.setHex(STYLE.dust); markMesh.material.color.setHex(STYLE.mark);
  buildParkMeshes();
  headlight.visible = !!STYLE.headlight;
  scene.fog = STYLE.fog ? new THREE.Fog(STYLE.bg, 100, 300) : null;
  scene.traverse(function (o) { if (o.material) o.material.needsUpdate = true; });
  renderer.setPixelRatio(STYLE.pixel || DPR);
  glCv.style.imageRendering = STYLE.pixel ? "pixelated" : "";
  resize();
  refreshMenu();
}
function setMenu(open) { menuOpen = open; menuEl.hidden = !open; }
function buildMenu() {
  function fill(id, list, fn) {
    var box = document.getElementById(id);
    list.forEach(function (item, i) {
      var b = document.createElement("button");
      b.textContent = item.name; b.onclick = function () { fn(i); };
      box.appendChild(b);
    });
  }
  fill("camList", CAMS, applyCam);
  fill("styleList", STYLES, applyStyle);
  document.getElementById("menuBtn").onclick = function () { setMenu(!menuOpen); };
  document.getElementById("menuPlay").onclick = function () { setMenu(false); };
}
function refreshMenu() {
  [["camList", camIdx], ["styleList", styleIdx]].forEach(function (p) {
    var bs = document.getElementById(p[0]).children;
    for (var i = 0; i < bs.length; i++) bs[i].className = i === p[1] ? "on" : "";
  });
}

// ---- draw ----------------------------------------------------------------------
var showQ = new THREE.Quaternion(), qGoal = new THREE.Quaternion(), qTrick = new THREE.Quaternion(), qA = new THREE.Quaternion();
var vUp = new THREE.Vector3();
function ease(t) { return t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t); }
function trickQuat(def, t, out) {         // the trick as a turn on top of the body: whole turns, back where it started
  var e = ease(clamp(t, 0, 1)), TAU = 2 * Math.PI;
  out.identity();
  if (def.yaw) out.multiply(qA.setFromAxisAngle(upY, -def.yaw * TAU * e));
  if (def.pitch) out.multiply(qA.setFromAxisAngle(AX_Z, -def.pitch * TAU * e));
  if (def.roll) out.multiply(qA.setFromAxisAngle(AX_X, def.roll * TAU * e));
  if (def.grab) out.multiply(qA.setFromAxisAngle(AX_Z, -0.6 * Math.sin(Math.PI * t)));
  if (def.stand) out.multiply(qA.setFromAxisAngle(AX_Z, -1.1 * Math.sin(Math.PI * t)));
  return out;
}
function activeTrick() { return dozer.rail ? dozer.rail.trick : !dozer.ground ? dozer.air.cur : null; }
function drawDozer(dt) {
  if (dozer.rail) bodyQuat(dozer.railF, dozer.railU, qGoal);
  else if (dozer.ground) bodyQuat(dozer.f, dozer.n, qGoal);
  else qGoal.copy(dozer.q);
  showQ.slerp(qGoal, 1 - Math.exp(-(dozer.ground ? 16 : 30) * dt));
  vUp.set(0, 1, 0).applyQuaternion(showQ);
  var tk = activeTrick(), hop = 0, puff = 0;
  qTrick.identity();
  if (tk) { trickQuat(tk.def, tk.t, qTrick); puff = Math.sin(Math.PI * clamp(tk.t, 0, 1)); if (tk.def.hop) hop = puff * 1.6; }
  dozer.mesh.quaternion.multiplyQuaternions(showQ, qTrick);
  var up = COM + hop;
  dozer.mesh.position.set(dozer.x + vUp.x * up, dozer.y + vUp.y * up, dozer.z + vUp.z * up);
  dozer.squash *= Math.exp(-9 * dt);       // squash on landing, stretch on take-off, swell in a trick
  var sq = dozer.squash, sw = 0.08 * puff;
  dozer.mesh.scale.set(1 + 0.6 * sq + sw, 1 - sq + sw, 1 + 0.6 * sq + sw);
  dozer.flame.visible = dozer.boost > 0;
  if (dozer.boost > 0) dozer.flame.scale.set(0.9 + Math.random() * 1.2, 0.5, 0.9);
}

var pv = new THREE.Vector3();
function txt(s, x, y, size, color, align) {
  hx.font = "700 " + size + "px system-ui, sans-serif";
  hx.textAlign = align || "left";
  hx.lineWidth = 4; hx.strokeStyle = "rgba(0,0,0,0.6)"; hx.strokeText(s, x, y);
  hx.fillStyle = color || "#fff"; hx.fillText(s, x, y);
}
var hudT = 0;
function drawHud(fps, dt) {
  hudT += dt;
  hx.setTransform(DPR, 0, 0, DPR, 0, 0);
  hx.clearRect(0, 0, W, H);
  hx.lineJoin = "round";
  if (levelFlash > 0) { hx.globalAlpha = levelFlash * 0.35; hx.fillStyle = hexCss(TIERS[level].hex); hx.fillRect(0, 0, W, H); hx.globalAlpha = 1; }

  // speed lines, past a speed only rails, pit drops and boosts reach
  var sp3 = Math.sqrt(dozer.vx * dozer.vx + dozer.vy * dozer.vy + dozer.vz * dozer.vz);
  if (sp3 > 26) {
    var la = clamp((sp3 - 26) / 16, 0, 0.55), diag = Math.sqrt(W * W + H * H) / 2;
    hx.strokeStyle = "rgba(255,255,255," + la + ")"; hx.lineWidth = 2;
    for (var sl = 0; sl < 22; sl++) {
      var an = Math.random() * 6.283, r0 = diag * (0.62 + Math.random() * 0.2), r1 = diag * 1.05;
      hx.beginPath(); hx.moveTo(W / 2 + Math.cos(an) * r0, H / 2 + Math.sin(an) * r0); hx.lineTo(W / 2 + Math.cos(an) * r1, H / 2 + Math.sin(an) * r1); hx.stroke();
    }
  }

  // the gauge: level badge, the bar toward the next tier, the ten colours
  var lc = hexCss(TIERS[level].hex);
  hx.fillStyle = lc; hx.beginPath(); hx.arc(28, 30, 19, 0, 6.283); hx.fill();
  hx.lineWidth = 3; hx.strokeStyle = "rgba(0,0,0,0.5)"; hx.stroke();
  txt(String(level), 28, 37, 20, level >= 8 ? "#111" : "#fff", "center");
  var bx = 56, bw = W - 70, by = 18;
  hx.fillStyle = "rgba(0,0,0,0.45)"; hx.fillRect(bx, by, bw, 12);
  if (level < 10) {
    hx.fillStyle = hexCss(TIERS[level + 1].hex);
    hx.fillRect(bx, by, bw * clamp(gauge / LEVEL_COST[level + 1], 0, 1), 12);
  } else { hx.fillStyle = lc; hx.fillRect(bx, by, bw, 12); }
  for (var t = 1; t <= 10; t++) {
    hx.globalAlpha = t <= level ? 1 : 0.3;
    hx.fillStyle = hexCss(TIERS[t].hex); hx.fillRect(bx + (t - 1) * 16, by + 18, 12, 10);
    hx.globalAlpha = 1;
  }
  txt(level < 10 ? "Next: " + TIERS[level + 1].name : "Max level", W - 14, by + 28, 12, "#cfd6dd", "right");

  txt("Score " + score, 14, 82, 18);
  txt("Time " + Math.ceil(timeLeft), 14, 102, 15, timeLeft < 15 ? "#ff8a7a" : "#fff");
  txt(Math.round(fps) + " fps", 14, H - 56, 11, "#9aa4ad");

  if (combo.mult > 0) {                   // the combo: multiplier, points, the last moves, the window
    combo.bump = Math.max(0, combo.bump - dt * 5);
    txt("x" + combo.mult, W / 2, 150, Math.round(34 * (1 + 0.35 * combo.bump)), "#ffd34d", "center");
    txt(String(combo.base), W / 2, 172, 16, "#fff", "center");
    txt(combo.list.join(" + "), W / 2, 192, 13, "#c9f27a", "center");
    if (!busy()) { hx.fillStyle = "#ffd34d"; hx.fillRect(W / 2 - 50, 200, 100 * combo.t / COMBO_WINDOW, 4); }
  }
  var tk = activeTrick();
  if (tk) {                               // the trick playing, and how far it has gone
    txt(tk.def.name + (dozer.air.queued && !dozer.rail ? "  +1" : ""), W / 2, H - 120, 18, "#c9f27a", "center");
    var tb = clamp(tk.t, 0, 1), safe = !dozer.rail && tb < SKETCHY_AT;
    hx.fillStyle = "rgba(0,0,0,0.45)"; hx.fillRect(W / 2 - 60, H - 112, 120, 6);
    hx.fillStyle = safe ? "#ff8a7a" : "#c9f27a"; hx.fillRect(W / 2 - 60, H - 112, 120 * tb, 6);
  } else if (!dozer.ground && !dozer.rail && dozer.air.t > 0.05) {
    var rem = predictAir();
    hx.globalAlpha = 0.6 + 0.4 * Math.sin(hudT * 12);
    txt(rem > 0.4 ? "Space: trick" : "Landing", W / 2, H - 120, 16, rem > 0.4 ? "#fff" : "#ffcf7a", "center");
    hx.globalAlpha = 1;
  }
  if (dozer.rail) {
    var R = dozer.rail, sg = R.seg >= 0 ? R.r.segs[R.seg].name : "Grind";
    txt("Rail · " + sg, W / 2, H - 140, 16, "#ff9ad5", "center");
  } else if (dozer.pit && dozer.ground) txt(dozer.pit.name, W / 2, H - 140, 14, "#ffb35a", "center");
  if (dozer.boost > 0) txt("Boost", W / 2, H - 86, 15, "#ffb35a", "center");
  else if (dozer.drift) txt("Drift", W / 2, H - 86, 15, "#a6ecff", "center");

  for (var i = 0; i < floats.length; i++) {
    var f = floats[i], sx2, sy2;
    if (f.screen) { sx2 = f.x * W; sy2 = f.y * H - f.t * 20; }
    else { pv.set(f.x, f.y + f.t * 5, f.z).project(camera); sx2 = (pv.x + 1) / 2 * W; sy2 = (1 - pv.y) / 2 * H; }
    var life = f.life || 1.2, k = f.pop ? 1 + 0.8 * Math.max(0, 1 - f.t / 0.14) : 1;
    hx.globalAlpha = Math.max(0, 1 - Math.max(0, f.t - life + 0.4) / 0.4);
    hx.save(); hx.translate(sx2, sy2); if (f.rot) hx.rotate(f.rot);
    txt(f.txt, 0, 0, Math.round((f.size || 16) * k), f.col || "#fff3c4", "center");
    hx.restore();
    hx.globalAlpha = 1;
  }
  if (joy.id >= 0) {
    hx.strokeStyle = "rgba(255,255,255,0.35)"; hx.lineWidth = 3;
    hx.beginPath(); hx.arc(joy.sx, joy.sy, JOY_R, 0, 6.283); hx.stroke();
    hx.fillStyle = "rgba(255,255,255,0.45)";
    hx.beginPath(); hx.arc(joy.x, joy.y, 22, 0, 6.283); hx.fill();
  }
  txt("Phone: drag drive · tap or 2nd finger: jump, in the air a trick (hold: drift)", W / 2, H - 34, 10, "#cfd6dd", "center");
  txt("Keys: arrows drive · space jump, in the air a trick · shift drift · M menu", W / 2, H - 18, 10, "#cfd6dd", "center");
  if (over) {
    hx.fillStyle = "rgba(0,0,0,0.55)"; hx.fillRect(0, H / 2 - 90, W, 170);
    txt(overText, W / 2, H / 2 - 40, 32, "#ffd34d", "center");
    txt("Score " + score + " · level " + level + " · best combo x" + stats.bestCombo, W / 2, H / 2 - 6, 15, "#fff", "center");
    txt(flattened + " / " + total + " flattened · " + stats.tricks + " tricks · " + stats.bails + " bails", W / 2, H / 2 + 18, 14, "#cfd6dd", "center");
    txt("Tap to play again", W / 2, H / 2 + 52, 15, "#cfd6dd", "center");
  }
}

// ---- loop -----------------------------------------------------------------------
var last = performance.now(), fpsS = 60;
function frame(now) {
  var rdt = clamp((now - last) / 1000, 0, 0.05); last = now;
  if (rdt > 0) fpsS += (1 / rdt - fpsS) * 0.05;
  var ts = 1;                             // slow motion: a perfect landing, a level, a trick in the air
  if (slowT > 0) { slowT -= rdt; ts = slowK; }
  if (!dozer.ground && !dozer.rail && dozer.air.cur) ts *= TRICK_TIME;
  var dt = rdt * ts;
  if (!menuOpen) step(dt);
  levelFlash = Math.max(0, levelFlash - rdt * 1.5);
  for (var f = floats.length - 1; f >= 0; f--) { floats[f].t += rdt; if (floats[f].t > (floats[f].life || 1.2)) floats.splice(f, 1); }
  for (var d = 0; d < railDecals.length; d++) railDecals[d].material.opacity = 0.5 + 0.35 * Math.sin(now / 160 + d);
  placeCamera(rdt);
  drawDozer(rdt);
  updateTrail(rdt);
  renderFrame(rdt);
  drawHud(fpsS, rdt);
  window.__s = { score: score, level: level, gauge: Math.round(gauge), combo: combo.mult, bestCombo: stats.bestCombo,
    tricks: stats.tricks, bails: stats.bails, perfects: stats.perfects, rides: stats.rides, airMax: +stats.airMax.toFixed(2),
    flattened: flattened, total: total, pits: pits.length, rails: rails.length, fps: Math.round(fpsS),
    x: Math.round(dozer.x), y: +dozer.y.toFixed(1), z: Math.round(dozer.z), ground: dozer.ground, onRail: !!dozer.rail,
    inPit: dozer.pit ? dozer.pit.name : "", trick: activeTrick() ? activeTrick().def.name : "", list: combo.list.join(" + "),
    t: Math.round(ROUND_SECONDS - timeLeft) };
  requestAnimationFrame(frame);
}
newCity();
buildMenu();
applyStyle(Math.min(load("style"), STYLES.length - 1));
applyCam(Math.min(load("cam"), CAMS.length - 1));
requestAnimationFrame(frame);
</script>
