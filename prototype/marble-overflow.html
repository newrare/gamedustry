<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>marble-overflow prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0a07; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<canvas id="cv"></canvas>
<script>
// ---------------------------------------------------------------------------
// Marble overflow: the marble run of marble-router, under PRESSURE.
//
// The hopper at the top right pours marbles faster and faster, and the
// machine cannot pass them all on its own. Every escapement gate stores the
// stream in a queue with a fixed CAPACITY, drawn as sockets along the rail
// behind its pallet and read on its round plaque (4/6); the sockets go from
// calm green to amber to red as the queue fills. A marble that reaches a full
// queue SPILLS off the rail and is lost, and that costs a life. The hopper is
// storage too: while the top gate is full it fills up, and a marble poured
// into a full hopper spills over its rim. The two entries of the notched
// wheel hold a few marbles each and spill the same way.
//
// The pendulums never speed up: the pour outgrows them within seconds, so the
// queues grow unless the player acts. Two verbs, and a tap goes to whichever
// is closer:
//   flip   - tap near a switch (S0-S3) to flip it. Every marble passing a
//            switch still flips it on its way through (a flip-flop).
//   flush  - tap a gate's plaque: the pallet lifts and the whole queue runs
//            through in one quick burst, then the gate cools down for a few
//            seconds (the ring on its plaque). A burst runs through the
//            flip-flops as a dense train, so it alternates left and right:
//            flushing clears a gauge, but decides where six marbles go at
//            once, and fills the gates below.
//
// Everything else is marble-router: loops, the wheel that merges the two
// inner lines, the coil, chimes, and at the bottom the Bell, the Furnace
// (where bombs belong), the Launcher (fires three bonus marbles back into the
// hopper) and the Cannon (shoots every bomb on the rails, which also frees
// their sockets). A bomb in a machine jams it and costs a life. Spills and
// jams share the lives; endless survival until the last one goes. The score
// grows with the time survived and with every delivery.
//
// The question: is keeping a machine from choking fun pressure, or just
// stress?
//
// Tap: flip the nearest switch or flush the nearest gate. Tap "Auto" (or A)
// to let it play itself. Keys 1-4 flip S0-S3, 5-8 flush the four gates,
// R restarts.
// ---------------------------------------------------------------------------

// --- tunables --------------------------------------------------------------
var W = 720, H = 1280;          // design space, portrait
var R = 14;                     // marble radius
var LIVES = 3;
var G = 780;                    // px/s^2 of gravity along a slope
var FRICTION = 55;              // px/s^2 of rolling drag
var VMIN = 110, VMAX = 400;     // a marble never stalls and never flies off
var RAMP_SECONDS = 60;          // the pour speeds up over this long, then holds
var TEMPO_START = 0.95, TEMPO_END = 1.05;   // time scale of the rails over the ramp
var SPAWN_START = 0.7, SPAWN_END = 0.34;    // seconds between two marbles poured into the hopper
var HOPPER_CAP = 8;             // marbles the hopper holds; one more spills over its rim
var HOPPER_START = 3;           // marbles in the hopper when a run starts
var HOPPER_GAP = 0.3;           // seconds between two marbles the hopper lets onto the top rail
var BAD_START = 0.25, BAD_END = 0.35;      // share of bombs in the stream
var GOLD_CHANCE = 0.05;         // a rare big marble, worth GOLD_FILL
var GOLD_FILL = 3;
var GAUGE = 5;                  // good marbles a machine needs to fire
var JAM_SECONDS = 3;
var RUSH_EVERY_MIN = 7, RUSH_EVERY_MAX = 11, RUSH_SECONDS = 6, RUSH_MULT = 3;
var LAUNCH_BONUS = 3;           // marbles the launcher fires back into the hopper
var PTS_GOOD = 10, PTS_BURN = 5, PTS_BELL = 150, PTS_SHOT = 20;
var PTS_SECOND = 10;            // points per second survived
var COMBO_STEP = 5;             // correct sorts per +1 multiplier
var TAP_REACH = 240;            // a tap farther than this from every switch and plaque does nothing
var FLIP_TIME = 0.09;
var TOGGLE_ON_PASS = true;      // a marble passing a switch flips it
var WHEEL_OMEGA = 1.8;          // rad/s
var WHEEL_NOTCHES = 8;
var GUTTER_SPEED = 220, LIFT_SPEED = 150, CUP_GAP = 56;
// Escapements: channel, where on it (share of its length), seconds per swing
// (fixed: the pour is what speeds up), capacity, and where the pendulum's
// pivot and plaque hang, relative to the pallet.
var GATES = [["top", 0.8, 0.95, 6, 0, -92], ["S0L", 0.78, 1.2, 6, -44, -76],
  ["S0R", 0.78, 1.2, 6, 44, -76], ["wout", 0.6, 0.8, 2, 56, -52]];
var FLUSH_GAP = 0.14;           // seconds between two marbles of a flush
var FLUSH_V = 230;              // px/s a flushed marble leaves at
var FLUSH_COOLDOWN = 3;         // seconds before a flushed gate can flush again
var WAIT_CAP = 5;               // marbles that may wait at a wheel entry before one spills
var SPILL_GRACE = 1.5;          // a spill this soon after a spill costs no second life
var SCREW_X = 24, SCREW_BOT = 1238, SCREW_TOP = 44, SCREW_SPEED = 110;
var BG_RAIL_SPEED = 120;
var FERRIS = { cx: 590, cy: 350, r: 56, buckets: 6, omega: 0.6, marbles: 5 };
var BG_ALPHA = 0.42;            // how far back the return circuits sit
var AUTO_RATE = 0.22;           // seconds between two actions of the autopilot
var AUTO_RESTART = 4;           // seconds the autopilot shows its end screen before it plays again

// --- palette ---------------------------------------------------------------
var C_BG = "#1c140e", C_BG2 = "#241a12", C_WOOD = "#5a3d25", C_BRASS = "#c9994a",
    C_BRASS_D = "#7a5a2a", C_STEEL = "#8d95a3", C_GOOD = "#f2b53a", C_BAD = "#1d1d22";
var C_CALM = "#7fd48a", C_WARN = "#f2c14e", C_FULL = "#ff4a3a";   // a queue's gauge

// --- the network -------------------------------------------------------------
var DS = 5;                     // rails are resampled every DS px
var MID = 330;                  // the machine is symmetric about x = MID
function mir(pts) { var o = []; for (var i = 0; i < pts.length; i++) o.push([2 * MID - pts[i][0], pts[i][1], pts[i][2]]); return o; }
function loopPts(cx, cy, r) {
  var o = [];
  for (var i = 1; i <= 60; i++) { var a = Math.PI / 2 - i / 60 * Math.PI * 2; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return o;
}
// A spiral seen from slightly above: x = sin, depth = cos, the near half lower.
function coilPts(cx, y0, y1, r, turns) {
  var o = [], n = turns * 48;
  for (var i = 0; i <= n; i++) {
    var a = i / n * turns * Math.PI * 2;
    o.push([cx + r * Math.sin(a), y0 + (y1 - y0) * i / n + r * 0.35 * Math.cos(a), Math.cos(a)]);
  }
  return o;
}
var SW = { S0: [MID, 262], S1: [150, 470], S2: [2 * MID - 150, 470], S3: [MID, 790] };
var WHEEL = { cx: MID, cy: 615, r: 70 };
var S0L = [[MID, 262], [215, 318], [252, 392], [150, 470]];
var S1L = [[150, 470], [60, 560], [110, 650], [30, 760], [32, 830], [52, 858], [100, 870]]
  .concat(loopPts(100, 820, 50), [[140, 880], [168, 930], [85, 1005], [85, 1074]]);
var S1R = [[150, 470], [250, 535], [205, 595], [WHEEL.cx - WHEEL.r, WHEEL.cy]];
var RAW = {
  top:  { to: "S0", pts: [[650, 152], [560, 186], [450, 212], [MID, 262]] },
  S0L:  { to: "S1", pts: S0L },            S0R: { to: "S2", pts: mir(S0L) },
  S1L:  { to: "bell", pts: S1L },           S1R: { to: "wheelL", pts: S1R },
  S2L:  { to: "wheelR", pts: mir(S1R) },    S2R: { to: "cannon", pts: mir(S1L) },
  wout: { to: "S3", pts: [[MID, WHEEL.cy + WHEEL.r], [MID, 790]] },
  S3L:  { to: "furnace", pts: [[MID, 790], [255, 850], [300, 930], [250, 1000], [250, 1074]] },
  S3R:  { to: "launcher", pts: [[MID, 790], [420, 842]].concat(coilPts(410, 850, 1030, 44, 2), [[410, 1074]]) }
};
var OUT = { S0: ["S0L", "S0R"], S1: ["S1L", "S1R"], S2: ["S2L", "S2R"], S3: ["S3L", "S3R"] };
var MACHINE_DEFS = [
  { id: "bell", name: "Bell", x: 85, color: "#f5c542" },
  { id: "furnace", name: "Furnace", x: 250, color: "#ff6a2a" },
  { id: "launcher", name: "Launcher", x: 410, color: "#4fd1c5" },
  { id: "cannon", name: "Cannon", x: 575, color: "#b18cff" }
];
var BOX_Y = 1080, BOX_H = 120, BOX_W = 150;
var GUTTER_L = 12, GUTTER_Y = 1226;
var LIFT_X = 690, LIFT_BOT = 1240, LIFT_TOP = 118;
var HOPPER = { x: 650, y: 152, l: 598, r: 714, top: 22, bot: 104 };   // mouth, then the box
var CHIMES = [["top", 0.08], ["top", 0.19], ["top", 0.3], ["S0L", 0.2], ["S0R", 0.2], ["S3L", 0.5]];   // clear of the queues
var DECO_GEARS = [[120, 250, 58, 11], [470, 740, 52, 10],
  [185, 740, 44, 9], [600, 900, 66, 13], [60, 960, 40, 8], [520, 1010, 36, 7]];

// Background rails: the top return from the screw, and the ferris wheel's run.
var BG_RAW = {
  back: [[SCREW_X, SCREW_TOP], [200, 50], [380, 58], [560, 64], [656, 70]],
  ferris: [[612, 292], [650, 318], [618, 350], [652, 382], [606, 410]]
};

// Resample every channel to one point every DS px, keeping a depth per point.
var CH = {}, BG = {};
function makeChannel(k, to, raw) {
  var xs = [], ys = [], zs = [];
  xs.push(raw[0][0]); ys.push(raw[0][1]); zs.push(raw[0][2] === undefined ? 1 : raw[0][2]);
  var carry = 0;
  for (var i = 1; i < raw.length; i++) {
    var a = raw[i - 1], b = raw[i], za = a[2] === undefined ? 1 : a[2], zb = b[2] === undefined ? 1 : b[2];
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy), s = DS - carry;
    while (s <= L) { var q = s / L; xs.push(a[0] + dx * q); ys.push(a[1] + dy * q); zs.push(za + (zb - za) * q); s += DS; }
    carry = L - (s - DS);
  }
  var last = raw[raw.length - 1];
  xs.push(last[0]); ys.push(last[1]); zs.push(last[2] === undefined ? 1 : last[2]);
  var n = xs.length, coil = false;
  for (i = 0; i < n; i++) if (zs[i] < 0) coil = true;
  return { id: k, to: to, xs: xs, ys: ys, zs: zs, n: n, len: (n - 1) * DS, coil: coil };
}
for (var chk in RAW) CH[chk] = makeChannel(chk, RAW[chk].to, RAW[chk].pts);
for (chk in BG_RAW) BG[chk] = makeChannel(chk, null, BG_RAW[chk]);
function at(ch, d) {
  var f = Math.max(0, Math.min(ch.n - 1.001, d / DS)), i = Math.floor(f), q = f - i;
  return { x: ch.xs[i] + (ch.xs[i + 1] - ch.xs[i]) * q, y: ch.ys[i] + (ch.ys[i + 1] - ch.ys[i]) * q,
           z: ch.zs[i] + (ch.zs[i + 1] - ch.zs[i]) * q, slope: (ch.ys[i + 1] - ch.ys[i]) / DS };
}
// The gutter is a shallow V: each half runs out to its own return circuit.
function gutterY(x) { return GUTTER_Y + Math.abs(x - MID) * 0.03; }

// --- canvas ------------------------------------------------------------------
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var scale = 1, offX = 0, offY = 0, dpr = 1, trackLayer = null, frontLayer = null;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
  buildLayers();
}

// The rails never move, so they are drawn once: sleepers, a shadow, two brass
// rails. The coil's near half is also drawn on a second layer that goes OVER
// the marbles, which is what puts a marble behind its own rails.
function buildLayers() {
  var k = scale * dpr;
  trackLayer = document.createElement("canvas"); frontLayer = document.createElement("canvas");
  trackLayer.width = frontLayer.width = Math.max(1, Math.round(W * k));
  trackLayer.height = frontLayer.height = Math.max(1, Math.round(H * k));
  var t = trackLayer.getContext("2d"), f = frontLayer.getContext("2d");
  t.setTransform(k, 0, 0, k, 0, 0); f.setTransform(k, 0, 0, k, 0, 0);
  for (var id in CH) {
    var ch = CH[id];
    drawRails(t, ch, function (z) { return z < 0; }, 0.4);
    drawRails(t, ch, function (z) { return z >= 0; }, 1);
    if (ch.coil) drawRails(f, ch, function (z) { return z >= 0.15; }, 1);
  }
}
function normalAt(ch, i) {
  var a = Math.max(0, i - 1), b = Math.min(ch.n - 1, i + 1);
  var dx = ch.xs[b] - ch.xs[a], dy = ch.ys[b] - ch.ys[a], L = Math.sqrt(dx * dx + dy * dy) || 1;
  return [-dy / L, dx / L];
}
function drawRails(c, ch, keep, alpha) {
  c.globalAlpha = alpha; c.lineCap = "round"; c.lineJoin = "round";
  var i, nv;
  c.strokeStyle = C_WOOD; c.lineWidth = 5;
  for (i = 0; i < ch.n; i += 5) {
    if (!keep(ch.zs[i])) continue;
    nv = normalAt(ch, i);
    c.beginPath(); c.moveTo(ch.xs[i] - nv[0] * (R + 7), ch.ys[i] - nv[1] * (R + 7));
    c.lineTo(ch.xs[i] + nv[0] * (R + 7), ch.ys[i] + nv[1] * (R + 7)); c.stroke();
  }
  var sides = [-(R + 2), R + 2], pass, s;
  for (pass = 0; pass < 2; pass++) {
    c.strokeStyle = pass ? C_BRASS : "rgba(0,0,0,0.45)"; c.lineWidth = pass ? 3.5 : 5;
    for (s = 0; s < 2; s++) {
      var open = false;
      c.beginPath();
      for (i = 0; i < ch.n; i++) {
        if (!keep(ch.zs[i])) { open = false; continue; }
        nv = normalAt(ch, i);
        var x = ch.xs[i] + nv[0] * sides[s] + (pass ? 0 : 1.5), y = ch.ys[i] + nv[1] * sides[s] + (pass ? 0 : 2.5);
        if (!open) { c.moveTo(x, y); open = true; } else c.lineTo(x, y);
      }
      c.stroke();
    }
  }
  c.globalAlpha = 1;
}
addEventListener("resize", resize);

// --- state -------------------------------------------------------------------
var marbles, hopper, machines, sw, parts, floats, beams, rings, wheel, chimes, gates, ferris;
var state, t, spawnT, releaseT, rushT, score, combo, lives, shake, flash, grace, stats, flow, gearA, liftPhase, screwPhase;
var auto = false, autoT = 0, overT = 0;

function reset() {
  marbles = []; hopper = []; parts = []; floats = []; beams = []; rings = [];
  machines = {};
  for (var i = 0; i < MACHINE_DEFS.length; i++) {
    var d = MACHINE_DEFS[i];
    machines[d.id] = { id: d.id, name: d.name, x: d.x, color: d.color, fill: 0, jam: 0, rush: 0, fire: 0, aim: -Math.PI / 2 };
  }
  sw = {};
  for (var k in SW) {
    var dir = k === "S1" ? 1 : 0;
    sw[k] = { x: SW[k][0], y: SW[k][1], dir: dir, ang: branchAngle(k, dir), spin: 0, flash: 0 };
  }
  wheel = { phase: 0, notch: [], q: { wheelL: [], wheelR: [] } };
  for (i = 0; i < WHEEL_NOTCHES; i++) wheel.notch.push(null);
  gates = [];
  for (i = 0; i < GATES.length; i++) {
    var gc = CH[GATES[i][0]], gd = gc.len * GATES[i][1], gp = at(gc, gd), ga = at(gc, gd + 5);
    var tl = Math.sqrt((ga.x - gp.x) * (ga.x - gp.x) + (ga.y - gp.y) * (ga.y - gp.y)) || 1;
    var g = { id: GATES[i][0], ch: gc, d: gd, period: GATES[i][2], cap: GATES[i][3], q: [], timer: 0, open: 0, side: 1,
      flush: false, flushT: 0, cool: 0, x: gp.x, y: gp.y, tx: (ga.x - gp.x) / tl, ty: (ga.y - gp.y) / tl };
    // The pallet stands just ahead of the head of the queue; the plaque (the
    // pendulum's pivot, and what a tap flushes) hangs from it.
    g.fx = g.x + g.tx * (R + 4); g.fy = g.y + g.ty * (R + 4);
    g.px = g.fx + GATES[i][4]; g.py = g.fy + GATES[i][5];
    gc.gate = g; gates.push(g);
  }
  ferris = { phase: 0, bucket: [], rail: [], wait: [] };
  for (i = 0; i < FERRIS.buckets; i++) ferris.bucket.push(i < FERRIS.marbles ? { rot: i } : null);
  chimes = [];
  for (i = 0; i < CHIMES.length; i++) {
    var ch = CH[CHIMES[i][0]], cd = ch.len * CHIMES[i][1], p = at(ch, cd), nv = normalAt(ch, Math.round(cd / DS));
    if (nv[1] > 0) nv = [-nv[0], -nv[1]];      // hang it on the upper side of the rail
    chimes.push({ ch: ch, d: cd, x: p.x + nv[0] * 30, y: p.y + nv[1] * 30, hit: 9 });
  }
  for (i = 0; i < HOPPER_START; i++) hopper.push(rollKind(0));
  state = "play"; t = 0; spawnT = SPAWN_START; releaseT = 0.4; rushT = 5; score = 0; combo = 0; lives = LIVES;
  shake = 0; flash = 0; grace = 0; overT = 0;
  flow = 0; gearA = 0; liftPhase = 0; screwPhase = 0;
  stats = { good: 0, burnt: 0, wasted: 0, jams: 0, fired: 0, shot: 0, spills: 0, flushes: 0 };
}

function branchAngle(id, dir) {
  var ch = CH[OUT[id][dir]], p = at(ch, 30);
  return Math.atan2(p.y - SW[id][1], p.x - SW[id][0]);
}
function progress() { return Math.min(1, t / RAMP_SECONDS); }
function lerp(a, b, k) { return a + (b - a) * k; }
function mod(a, m) { return ((a % m) + m) % m; }
function rollKind(k) {
  var r = Math.random();
  if (r < GOLD_CHANCE) return "gold";
  return r < GOLD_CHANCE + lerp(BAD_START, BAD_END, k) ? "bad" : "good";
}
function newMarble(kind, x, y) {
  var m = { kind: kind, st: "track", ch: null, d: 0, v: VMIN, x: x, y: y, z: 1, rot: Math.random() * 6 };
  marbles.push(m); return m;
}
function spawn(kind) {
  var m = newMarble(kind === "gold" ? "good" : kind, CH.top.xs[0], CH.top.ys[0]);
  m.ch = CH.top; m.gold = kind === "gold";
}
// Marbles on a gate's channel that are rolling towards its queue, plus the queue.
function gateLoad(g) {
  var n = g.q.length;
  for (var i = 0; i < marbles.length; i++) {
    var m = marbles[i];
    if (m.st === "track" && m.ch === g.ch && !m.gateOk) n++;
  }
  return n;
}
// Into the hopper from above: the pour, and the launcher's bonus marbles. One
// more than it holds spills over the rim.
function pour(kind) {
  hopper.push(kind);
  if (hopper.length > HOPPER_CAP) {
    var k = hopper.pop(), m = newMarble(k === "gold" ? "good" : k, HOPPER.l + 8, HOPPER.top + 14);
    m.gold = k === "gold"; m.st = "track";
    spill(m, -170 - Math.random() * 80, -160);
  }
}
function mult() { return 1 + Math.floor(combo / COMBO_STEP); }

// --- events ------------------------------------------------------------------
function deliver(m, id) {
  var mc = machines[id];
  if (id === "furnace") {
    kill(m);
    if (m.kind === "bad") { combo++; stats.burnt++; gain(PTS_BURN * mult(), mc.x, BOX_Y - 10, mc.color); burst(mc.x, BOX_Y + 20, "#ff6a2a", 14); }
    else { combo = 0; stats.wasted++; say("Wasted", mc.x, BOX_Y - 30, "#c8b8a0"); burst(mc.x, BOX_Y + 20, "#ffd27a", 8); }
    return;
  }
  if (m.kind === "bad") {
    kill(m);
    if (mc.jam > 0) { say("Jammed", mc.x, BOX_Y - 30, "#ff5a5a"); return; }
    mc.jam = JAM_SECONDS; mc.fill = 0; combo = 0; stats.jams++; shake = 0.35;
    lives--;
    burst(mc.x, BOX_Y + 30, "#ff5a5a", 26); say("Jam!", mc.x, BOX_Y - 30, "#ff5a5a");
    if (lives <= 0) state = "over";
    return;
  }
  // Whatever a machine swallows falls through it to the gutter and goes home.
  m.st = "drop"; m.vy = 0; m.kind = "spent"; m.gdir = m.x < MID ? -1 : 1;
  if (mc.jam > 0) { combo = 0; say("Jammed", mc.x, BOX_Y - 30, "#ff5a5a"); return; }
  var r = mc.rush > 0 ? RUSH_MULT : 1, gold = m.gold;
  combo++; stats.good++;
  gain(PTS_GOOD * mult() * r, mc.x, BOX_Y - 10, mc.color);
  mc.fill += (gold ? GOLD_FILL : 1) * (mc.rush > 0 ? 2 : 1);
  burst(mc.x, BOX_Y, mc.color, 6);
  if (mc.fill >= GAUGE) { mc.fill = 0; fire(mc, r); }
}
function kill(m) { m.st = "dead"; }

function fire(mc, r) {
  mc.fire = 0.7; stats.fired++; shake = Math.max(shake, 0.2);
  burst(mc.x, BOX_Y + 40, mc.color, 30);
  if (mc.id === "bell") {
    gain(PTS_BELL * mult() * r, mc.x, BOX_Y - 60, mc.color, "Ding! ");
    for (var i = 0; i < 3; i++) rings.push({ x: mc.x, y: BOX_Y + 70, t: -i * 0.12, color: mc.color });
  } else if (mc.id === "launcher") {
    say("Launch!", mc.x, BOX_Y - 60, mc.color);
    for (i = 0; i < LAUNCH_BONUS; i++) {
      var m = newMarble("good", mc.x, BOX_Y);
      m.st = "fly"; m.fly = { x0: mc.x, y0: BOX_Y + 10, x1: HOPPER.x, y1: HOPPER.top + 10, t: -i * 0.25, T: 1.1 };
    }
  } else if (mc.id === "cannon") {
    var n = 0;
    for (i = 0; i < marbles.length; i++) {
      var b = marbles[i];
      if (b.kind === "bad" && (b.st === "track" || b.st === "wait" || b.st === "wheel" || b.st === "gate")) {
        releaseNotch(b); kill(b); n++;

  var i, j;
  // Archimedes screw: a tube with a thread that climbs.
  ctx.fillStyle = "#2b2016"; ctx.fillRect(SCREW_X - 16, SCREW_TOP - 10, 32, SCREW_BOT - SCREW_TOP + 20);
  ctx.strokeStyle = C_BRASS; ctx.lineWidth = 3;
  for (var y = SCREW_BOT - mod(screwPhase, 22); y > SCREW_TOP; y -= 22) {
    ctx.beginPath(); ctx.moveTo(SCREW_X - 14, y); ctx.lineTo(SCREW_X + 14, y - 11); ctx.stroke();
  }
  ctx.strokeStyle = C_BRASS_D; ctx.lineWidth = 2; ctx.strokeRect(SCREW_X - 16, SCREW_TOP - 10, 32, SCREW_BOT - SCREW_TOP + 20);
  // Thin rails for the two background runs.
  for (var k in BG) {
    var ch = BG[k];
    ctx.strokeStyle = C_BRASS; ctx.lineWidth = 2;
    for (var sd = -1; sd <= 1; sd += 2) {
      ctx.beginPath();
      for (i = 0; i < ch.n; i++) {
        var nv = normalAt(ch, i), x = ch.xs[i] + nv[0] * sd * 9, yy = ch.ys[i] + nv[1] * sd * 9;
        if (i) ctx.lineTo(x, yy); else ctx.moveTo(x, yy);
      }
      ctx.stroke();
    }
  }
  // Ferris wheel.
  var step = Math.PI * 2 / FERRIS.buckets;
  ctx.strokeStyle = C_BRASS; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(FERRIS.cx, FERRIS.cy, FERRIS.r, 0, Math.PI * 2); ctx.stroke();
  cog(FERRIS.cx, FERRIS.cy, 18, 8, ferris.phase, C_BRASS);
  cog(FERRIS.cx + 30, FERRIS.cy + 26, 14, 7, -ferris.phase * 18 / 14, C_BRASS_D);
  for (j = 0; j < FERRIS.buckets; j++) {
    var a = ferris.phase + j * step, bx = FERRIS.cx + Math.cos(a) * FERRIS.r, by = FERRIS.cy + Math.sin(a) * FERRIS.r;
    ctx.strokeStyle = C_BRASS; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(FERRIS.cx, FERRIS.cy); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = C_BRASS_D; ctx.fillRect(bx - 11, by + 6, 22, 6);
    if (ferris.bucket[j]) drawMarble({ kind: "spent", x: bx, y: by, z: 1, rot: ferris.bucket[j].rot });
  }
  for (i = 0; i < ferris.rail.length; i++) {
    var fp = at(BG.ferris, ferris.rail[i].d);
    drawMarble({ kind: "spent", x: fp.x, y: fp.y - 6, z: 1, rot: ferris.rail[i].rot });
  }
  for (i = 0; i < ferris.wait.length; i++) drawMarble({ kind: "spent", x: 606 - i * 26, y: 404, z: 1, rot: 0 });
  for (i = 0; i < marbles.length; i++) {
    var m = marbles[i];
    if (m.st === "screw" || m.st === "back") drawMarble(m);
  }
  ctx.globalAlpha = 1;
}

// A queue's capacity, drawn as sockets along the rail behind its head: the
// rim of every socket in use takes the gauge's colour, and a red bar across
// the rail past the last one marks where a marble no longer fits.
function drawSockets(ch, dHead, cap, n) {
  var col = gaugeColor(n / cap), full = n >= cap, blink = full && Math.sin(t * 18) > 0;
  for (var j = 0; j < cap; j++) {
    var sp = at(ch, dHead - j * 2.2 * R);
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.arc(sp.x, sp.y, R + 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = j < n ? (blink ? "#ffffff" : col) : "rgba(220,200,160,0.3)"; ctx.lineWidth = j < n ? 4 : 2;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, R + 4, 0, Math.PI * 2); ctx.stroke();
  }
  var dl = dHead - (cap - 1) * 2.2 * R - R - 8, lp = at(ch, dl), nv = normalAt(ch, Math.max(0, Math.round(dl / DS)));
  ctx.strokeStyle = full ? C_FULL : "rgba(255,74,58,0.55)"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(lp.x - nv[0] * (R + 10), lp.y - nv[1] * (R + 10));
  ctx.lineTo(lp.x + nv[0] * (R + 10), lp.y + nv[1] * (R + 10)); ctx.stroke();
}
// A round plaque with a queue's count on it; the ring around it runs down
// while the gate cools after a flush.
function drawPlaque(x, y, n, cap, g) {
  var col = gaugeColor(n / cap), cool = g && g.cool > 0, busy = g && g.flush;
  if (g && !cool && !busy && n >= cap - 1 && n > 0) {
    var pl = 0.5 + 0.5 * Math.sin(t * 10);
    ctx.strokeStyle = col; ctx.globalAlpha = 0.35 + 0.5 * pl; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 30 + pl * 5, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = busy ? "#6b5530" : "#2e2217"; ctx.beginPath(); ctx.arc(x, y, 25, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = cool ? "#4a4038" : busy ? "#ffe9b0" : col;
  ctx.beginPath(); ctx.arc(x, y, 25, 0, Math.PI * 2); ctx.stroke();
  if (cool) {
    ctx.strokeStyle = C_STEEL; ctx.beginPath();
    ctx.arc(x, y, 25, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - g.cool / FLUSH_COOLDOWN)); ctx.stroke();
  }
  ctx.fillStyle = cool ? "#9a8d78" : "#f3e6cf"; ctx.font = "800 20px system-ui, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(n + "/" + cap, x, y + 1);
  ctx.textBaseline = "alphabetic";
}
// An escapement: a pendulum hanging from the plaque, a pallet that blocks the
// rail and lifts for a moment each time it lets a marble through, and stays
// up for the length of a flush.
function drawGates() {
  var i;
  for (i = 0; i < gates.length; i++) { var g0 = gates[i]; drawSockets(g0.ch, g0.d, g0.cap, g0.q.length); }
  drawSockets(CH.S1R, CH.S1R.len, WAIT_CAP, wheel.q.wheelL.length);
  drawSockets(CH.S2L, CH.S2L.len, WAIT_CAP, wheel.q.wheelR.length);
  for (i = 0; i < gates.length; i++) {
    var g = gates[i], k = Math.max(0, Math.min(1, g.timer / (g.period || 1)));
    var swing = g.flush ? g.side * 0.7 : g.side * 0.5 * Math.cos(Math.PI * k);
    var fx = g.fx, fy = g.fy, lift = g.open > 0 ? (g.flush ? 26 : 16) : 0, px = g.px, py = g.py;
    ctx.strokeStyle = "rgba(200,210,225,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(fx, fy - R - 10 - lift); ctx.stroke();
    ctx.strokeStyle = g.open > 0 ? "#ffe9b0" : C_BRASS; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(fx, fy - R - 10 - lift); ctx.lineTo(fx, fy + R - 2 - lift); ctx.stroke();
    ctx.strokeStyle = C_STEEL; ctx.lineWidth = 3;
    var arm = 50, bx = px + Math.sin(swing) * arm, by = py + Math.cos(swing) * arm;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = C_BRASS; ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fill();
    drawPlaque(px, py, g.q.length, g.cap, g);
  }
}

// The hopper: what it holds, in the order it lets them go, and how full it is.
function drawHopper() {
  var n = hopper.length, col = gaugeColor(n / HOPPER_CAP), full = n >= HOPPER_CAP;
  var l = HOPPER.l, r = HOPPER.r, tp = HOPPER.top, bt = HOPPER.bot;
  ctx.fillStyle = "#2b2016"; ctx.beginPath();
  ctx.moveTo(l, tp); ctx.lineTo(r, tp); ctx.lineTo(r, bt); ctx.lineTo(HOPPER.x + 20, HOPPER.y - 14);
  ctx.lineTo(HOPPER.x - 20, HOPPER.y - 14); ctx.lineTo(l, bt); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = full && Math.sin(t * 18) > 0 ? "#ffffff" : col; ctx.lineWidth = 4; ctx.stroke();
  for (var i = 0; i < n; i++) {
    var k = hopper[i];
    drawMarble({ kind: k === "gold" ? "good" : k, gold: k === "gold", x: l + 16 + (i % 4) * 28, y: bt - 16 - Math.floor(i / 4) * 28, z: 1, rot: i });
  }
  // The brim: a marble poured over it spills.
  var by = bt - 16 - Math.ceil(HOPPER_CAP / 4) * 28 + 12;
  ctx.strokeStyle = full ? C_FULL : "rgba(255,74,58,0.55)"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(l + 4, by); ctx.lineTo(r - 4, by); ctx.stroke();
  drawPlaque(l - 30, (tp + bt) / 2, n, HOPPER_CAP, null);
}

function drawLift() {
  ctx.fillStyle = "#2b2016"; ctx.fillRect(LIFT_X - 24, LIFT_TOP, 48, LIFT_BOT - LIFT_TOP + 10);
  ctx.strokeStyle = C_BRASS_D; ctx.lineWidth = 3;
  ctx.strokeRect(LIFT_X - 24, LIFT_TOP, 48, LIFT_BOT - LIFT_TOP + 10);
  ctx.fillStyle = C_BRASS_D;
  for (var y = LIFT_BOT - mod(liftPhase, CUP_GAP); y > LIFT_TOP + 10; y -= CUP_GAP) {
    ctx.fillRect(LIFT_X - 20, y, 30, 5); ctx.fillRect(LIFT_X - 20, y - 12, 4, 12);
  }
  // Gutter under the machines.
  ctx.strokeStyle = C_BRASS; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(GUTTER_L, gutterY(GUTTER_L)); ctx.lineTo(MID, gutterY(MID)); ctx.lineTo(LIFT_X + 20, gutterY(LIFT_X + 20)); ctx.stroke();
}

function drawMachines() {
  for (var k in machines) {
    var mc = machines[k], bx = mc.x - BOX_W / 2, pulse = 0.5 + 0.5 * Math.sin(t * 12), fire = mc.fire / 0.7;
    ctx.fillStyle = mc.jam > 0 ? "#4a1f1a" : "#2e2217";
    ctx.fillRect(bx, BOX_Y, BOX_W, BOX_H);
    ctx.lineWidth = mc.rush > 0 ? 6 : 3;
    ctx.strokeStyle = mc.rush > 0 ? "rgba(255,255,255," + (0.4 + 0.6 * pulse) + ")" : mc.color;
    ctx.strokeRect(bx, BOX_Y, BOX_W, BOX_H);
    ctx.save(); ctx.beginPath(); ctx.rect(bx, BOX_Y, BOX_W, BOX_H); ctx.clip();
    if (k === "bell") drawBell(mc, fire);
    else if (k === "furnace") drawFurnace(mc);
    else if (k === "launcher") drawLauncher(mc, fire);
    else drawCannon(mc, fire);
    ctx.restore();
    ctx.fillStyle = "#f3e6cf"; ctx.font = "700 20px system-ui, sans-serif"; ctx.textAlign = "center";
    var label = mc.jam > 0 ? "Jammed " + mc.jam.toFixed(1) : mc.rush > 0 ? "Rush x" + RUSH_MULT + " " + Math.ceil(mc.rush) : mc.name;
    ctx.fillText(label, mc.x, BOX_Y + BOX_H - 10);
  }
  for (var i = 0; i < rings.length; i++) {
    var rg = rings[i];
    if (rg.t < 0) continue;
    ctx.globalAlpha = 1 - rg.t / 0.8; ctx.strokeStyle = rg.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, 20 + rg.t * 160, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawBell(mc, fire) {
  // A bucket fills with a marble per pip, tips when it fires; the bell swings.
  var tip = fire > 0 ? Math.sin((1 - fire) * Math.PI) * 1.1 : 0;
  ctx.save(); ctx.translate(mc.x - 30, BOX_Y + 34); ctx.rotate(tip);
  ctx.strokeStyle = C_STEEL; ctx.lineWidth = 3; ctx.strokeRect(-26, -18, 52, 30);
  for (var i = 0; i < mc.fill; i++) drawMarble({ kind: "good", x: -16 + (i % 3) * 16, y: 2 - Math.floor(i / 3) * 12, z: 1, rot: i });
  ctx.restore();
  var swing = fire > 0 ? Math.sin(t * 30) * 0.5 * fire : Math.sin(t * 2) * 0.03;
  ctx.save(); ctx.translate(mc.x + 36, BOX_Y + 22); ctx.rotate(swing);
  ctx.fillStyle = mc.color; ctx.beginPath();
  ctx.moveTo(-20, 50); ctx.quadraticCurveTo(-18, 6, 0, 4); ctx.quadraticCurveTo(18, 6, 20, 50); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C_BRASS_D; ctx.beginPath(); ctx.arc(0, 52, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawFurnace(mc) {
  ctx.fillStyle = "#120c08"; ctx.fillRect(mc.x - 55, BOX_Y + 30, 110, 55);
  for (var i = 0; i < 6; i++) {
    var fx = mc.x - 48 + i * 19, h = 22 + 14 * Math.sin(t * 9 + i * 1.7) + 8 * Math.sin(t * 23 + i);
    ctx.fillStyle = i % 2 ? "#ff6a2a" : "#ffb03a";
    ctx.beginPath(); ctx.moveTo(fx - 10, BOX_Y + 85); ctx.lineTo(fx, BOX_Y + 85 - h); ctx.lineTo(fx + 10, BOX_Y + 85); ctx.fill();
  }
  ctx.strokeStyle = C_STEEL; ctx.lineWidth = 3;
  for (i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(mc.x - 50 + i * 25, BOX_Y + 30); ctx.lineTo(mc.x - 50 + i * 25, BOX_Y + 85); ctx.stroke(); }
}
function drawLauncher(mc, fire) {
  // A spring squashed a notch per marble; it kicks the plunger when it fires.
  var squash = fire > 0 ? 1 - fire : mc.fill / GAUGE, top = BOX_Y + 22 + (fire > 0 ? -20 * fire : squash * 30);
  ctx.strokeStyle = C_STEEL; ctx.lineWidth = 4; ctx.beginPath();
  var bottom = BOX_Y + 92, n = 8;
  for (var i = 0; i <= n; i++) ctx.lineTo(mc.x + (i % 2 ? 18 : -18), top + 12 + (bottom - top - 12) * i / n);
  ctx.stroke();
  ctx.fillStyle = mc.color; ctx.fillRect(mc.x - 28, top, 56, 12);
  for (i = 0; i < GAUGE; i++) {
    ctx.fillStyle = i < mc.fill ? mc.color : "#4a3a2a";
    ctx.fillRect(mc.x + 44, BOX_Y + 84 - i * 13, 14, 9);
  }
}
function drawCannon(mc, fire) {
  var px = mc.x, py = BOX_Y + 60, a = Math.max(-Math.PI + 0.3, Math.min(-0.3, mc.aim));
  ctx.save(); ctx.translate(px, py); ctx.rotate(a);
  ctx.fillStyle = C_STEEL; ctx.fillRect(-6 - (fire > 0 ? 10 * fire : 0), -11, 58, 22);
  ctx.restore();
  ctx.fillStyle = mc.color; ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI * 2); ctx.fill();
  for (var i = 0; i < GAUGE; i++) {
    ctx.fillStyle = i < mc.fill ? mc.color : "#4a3a2a";
    ctx.beginPath(); ctx.arc(px - 48 + i * 24, BOX_Y + 14, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0e0a07"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  var sx = shake > 0 ? (Math.random() - 0.5) * 16 * shake / 0.35 : 0;
  var sy = shake > 0 ? (Math.random() - 0.5) * 16 * shake / 0.35 : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (offX + sx * scale) * dpr, (offY + sy * scale) * dpr);
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, C_BG2); bg.addColorStop(1, C_BG);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Background works: meshing gears that turn faster when the rails are busy.
  ctx.globalAlpha = 0.16;
  for (var i = 0; i < DECO_GEARS.length; i++) {
    var gdef = DECO_GEARS[i], dir = i % 2 ? -1 : 1;
    cog(gdef[0], gdef[1], gdef[2], gdef[3], gearA * dir * 60 / gdef[2], C_BRASS);
  }
  ctx.globalAlpha = 1;

  drawBackground();
  ctx.globalAlpha = 0.75; drawLift(); ctx.globalAlpha = 1;
  drawHopper();
  drawWheel();
  ctx.drawImage(trackLayer, 0, 0, W, H);
  for (i = 0; i < chimes.length; i++) {
    var c = chimes[i], lit = Math.max(0, 1 - c.hit / 0.35), wob = lit * Math.sin(c.hit * 60) * 0.3;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(wob);
    ctx.fillStyle = lit > 0 ? "rgba(255,230,160," + (0.5 + lit * 0.5) + ")" : C_BRASS_D;
    ctx.fillRect(-14, -5, 28, 10);
    if (lit > 0) { ctx.strokeStyle = "rgba(255,230,160," + lit + ")"; ctx.lineWidth = 2; ctx.strokeRect(-20 - lit * 8, -10 - lit * 6, 40 + lit * 16, 20 + lit * 12); }
    ctx.restore();
  }
  drawSwitches();
  drawGates();

  for (i = 0; i < beams.length; i++) {
    var b = beams[i];
    if (b.t < 0) continue;
    ctx.globalAlpha = 1 - b.t / 0.25; ctx.strokeStyle = "#e0d0ff"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(b.x0, b.y0); ctx.lineTo(b.x1, b.y1); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (i = 0; i < marbles.length; i++) if (marbles[i].z < 0) drawMarble(marbles[i]);
  ctx.drawImage(frontLayer, 0, 0, W, H);
  for (i = 0; i < marbles.length; i++) {
    var m = marbles[i];
    if (m.z >= 0 && m.st !== "drop" && m.st !== "gutter" && m.st !== "cupwait" && m.st !== "screw" && m.st !== "back") drawMarble(m);
  }
  drawMachines();
  for (i = 0; i < marbles.length; i++) if (marbles[i].st === "gutter" || marbles[i].st === "cupwait") drawMarble(marbles[i]);
  for (i = 0; i < marbles.length; i++) {
    var spm = marbles[i];
    if (spm.st !== "spill") continue;
    ctx.globalAlpha = Math.max(0, 1 - spm.life / 2); drawMarble(spm); ctx.globalAlpha = 1;
  }

  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = "rgba(255,40,30," + (flash / 0.35 * 0.35) + ")"; ctx.fillRect(0, 0, W, H); }

  // HUD.
  ctx.textAlign = "left"; ctx.fillStyle = "#f3e6cf"; ctx.font = "800 40px system-ui, sans-serif";
  ctx.fillText(Math.floor(score), 28, 60);
  ctx.font = "600 22px system-ui, sans-serif"; ctx.fillStyle = "#cdbb9c";
  ctx.fillText("Combo " + combo + "  x" + mult(), 28, 94);
  ctx.textAlign = "center";
  ctx.fillStyle = auto ? C_BRASS : "#3a2c1e"; ctx.fillRect(290, 30, 120, 44);
  ctx.fillStyle = auto ? "#1c140e" : "#cdbb9c"; ctx.font = "700 22px system-ui, sans-serif";
  ctx.fillText(auto ? "Auto on" : "Auto", 350, 60);
  ctx.textAlign = "right"; ctx.fillStyle = "#cdbb9c";
  ctx.fillText(Math.floor(t) + " s", 520, 60);
  var hearts = ""; for (i = 0; i < lives; i++) hearts += "● ";
  ctx.fillStyle = "#ff5a5a"; ctx.fillText(hearts, 520, 90);

  ctx.textAlign = "center";
  for (i = 0; i < floats.length; i++) {
    var f = floats[i];
    ctx.globalAlpha = Math.max(0, 1 - f.t); ctx.fillStyle = f.color;
    ctx.font = "800 " + (f.size || 28) + "px system-ui, sans-serif";
    // Kept on screen and clear of the HUD band.
    ctx.fillText(f.str, Math.max(90, Math.min(W - 90, f.x)), Math.max(150, f.y) - f.t * 70);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#7d6a52"; ctx.font = "22px system-ui, sans-serif";
  ctx.fillText("Debug: pour " + (1 / lerp(SPAWN_START, SPAWN_END, progress())).toFixed(1) + "/s  spills " + stats.spills +
    "  jams " + stats.jams + "  flushes " + stats.flushes + "  marbles " + marbles.length, MID, 1268);

  if (state === "over") {
    ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f3e6cf"; ctx.font = "800 64px system-ui, sans-serif";
    ctx.fillText("Machine choked", W / 2, 520);
    ctx.font = "800 44px system-ui, sans-serif"; ctx.fillStyle = C_WARN;
    ctx.fillText("Survived " + Math.floor(t) + " s", W / 2, 590);
    ctx.font = "700 36px system-ui, sans-serif"; ctx.fillStyle = "#f3e6cf";
    ctx.fillText("Score " + Math.floor(score), W / 2, 650);
    ctx.fillText("Spills " + stats.spills + "   jams " + stats.jams + "   flushes " + stats.flushes, W / 2, 700);
    ctx.font = "26px system-ui, sans-serif"; ctx.fillStyle = "#cdbb9c";
    ctx.fillText(auto ? "Auto plays again in " + Math.max(1, Math.ceil(AUTO_RESTART - overT)) + " s" : "Tap to play again", W / 2, 780);
  }
}

// --- input ---------------------------------------------------------------------
function setAuto(on) { auto = on; reset(); }
cv.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale;
  if (x >= 290 && x <= 410 && y >= 30 && y <= 74) { setAuto(!auto); return; }
  if (state === "over") { reset(); return; }
  if (auto || state !== "play") return;
  // The nearest of the four switches and the four plaques gets the tap.
  var best = null, gate = null, bd = TAP_REACH, d;
  for (var k in sw) {
    d = Math.sqrt((sw[k].x - x) * (sw[k].x - x) + (sw[k].y - y) * (sw[k].y - y));
    if (d < bd) { bd = d; best = k; }
  }
  for (var i = 0; i < gates.length; i++) {
    d = Math.sqrt((gates[i].px - x) * (gates[i].px - x) + (gates[i].py - y) * (gates[i].py - y));
    if (d < bd) { bd = d; gate = gates[i]; best = null; }
  }
  if (gate) flushGate(gate); else if (best) flip(best);
});
addEventListener("keydown", function (e) {
  if (e.repeat) return;
  if (e.key >= "1" && e.key <= "4" && !auto && state === "play") flip("S" + (e.key - 1));
  else if (e.key >= "5" && e.key <= "8" && !auto) flushGate(gates[e.key - 5]);
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "a" || e.key === "A") setAuto(!auto);
});

// --- loop ----------------------------------------------------------------------
var lastT = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
reset();
requestAnimationFrame(frame);
</script>
