<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>marble-chain prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0a07; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<canvas id="cv"></canvas>
<script>
// ---------------------------------------------------------------------------
// Marble chain: the marble router's machine, wired into a Rube Goldberg loop.
//
// Same run as marble-router: a hopper pours marbles and bombs onto brass
// rails, four flip-flop switches (a tap flips the nearest, every marble
// passing flips it too), loops, a notched wheel, a coil, escapements storing a
// queue before each switch, and the gutter / screw / lift / ferris wheel that
// bring everything back up through the background. Bombs belong in the
// furnace; a bomb in a machine jams it and costs a life.
//
// What is new: the machines FEED EACH OTHER, and every cause is a thing that
// travels on screen from one machine to the next.
//   Bell     -> a light runs up the pipe on the left and opens the trapdoor
//               of the TANK (upper left), a glass reservoir that fills on its
//               own with good marbles dripping from the top rail. The tank
//               floods them onto S0.
//   Launcher -> throws its marbles in an arc straight into the Cannon: +3.
//   Cannon   -> shoots every bomb on the rails, AND fires a shell up at the
//               GONG (upper right). The gong drives a belt to the wheel (it
//               spins faster for a few seconds) and throws two marbles across
//               the machine into the Bell: +2, which closes the loop.
// CHAIN: a machine firing while the ring around the wheel is still alive
// extends the chain; the ring drains over a few seconds once nothing is
// travelling (a light, a shell, a thrown marble, a flood). Every fire pays
// times the chain. At chain 5, a grand finale: every machine fires at once,
// every link lights up, confetti, and the chain starts again.
//
// The question: is setting off a visible chain of machines fun enough to
// play for?
//
// Tap: flip the nearest switch. Tap "Auto" (or A) to let it play itself.
// Keys 1-4 flip S0-S3, R restarts.
// ---------------------------------------------------------------------------

// --- tunables --------------------------------------------------------------
var W = 720, H = 1280;          // design space, portrait
var R = 14;                     // marble radius
var ROUND_SECONDS = 75;
var LIVES = 3;
var G = 780;                    // px/s^2 of gravity along a slope
var FRICTION = 55;              // px/s^2 of rolling drag
var VMIN = 110, VMAX = 400;     // a marble never stalls and never flies off
var TEMPO_START = 0.9, TEMPO_END = 1.1;     // time scale of the rails over the round
var SPAWN_START = 1.05, SPAWN_END = 0.7;    // seconds between two marbles
var HOPPER_HOLD = 6;            // the hopper stops pouring while the top gate holds this many
var BAD_START = 0.25, BAD_END = 0.40;      // share of bombs in the stream
var GOLD_CHANCE = 0.05;         // a rare big marble, worth GOLD_FILL
var GOLD_FILL = 3;
var GAUGES = { bell: 6, launcher: 5, cannon: 6 };   // good marbles a machine needs to fire
var JAM_SECONDS = 3;
var RUSH_EVERY_MIN = 7, RUSH_EVERY_MAX = 11, RUSH_SECONDS = 6, RUSH_MULT = 3;
var LAUNCH_BONUS = 3;           // marbles the launcher throws into the cannon
var GONG_BELL = 2;              // marbles the gong throws into the bell
var WHEEL_BOOST = 2.2, BOOST_SECONDS = 4;           // the gong spins the wheel faster
var TANK_CAP = 10, TANK_START = 5, TANK_EVERY = 2.4; // the tank fills by one every TANK_EVERY s
var FLOOD_GAP = 0.14;           // seconds between two marbles out of the open tank
var PULSE_SPEED = 1500, SHELL_SPEED = 2000;          // px/s of a light on a cable, of the cannon shell
var CHAIN_WINDOW = 4;           // seconds the ring gives the next machine, once nothing travels
var CHAIN_HOLD_FLOOD = false;   // true: flood marbles still on the rails hold the ring too (too lenient)
var CHAIN_FINALE = 5;           // chain length that sets the grand finale off
var FINALE_DELAY = 0.5;
var PTS_GOOD = 10, PTS_BURN = 5, PTS_BELL = 150, PTS_LAUNCH = 80, PTS_CANNON = 80, PTS_SHOT = 20, PTS_FINALE = 1000;
var COMBO_STEP = 5;             // correct sorts per +1 multiplier
var TAP_REACH = 240;            // a tap farther than this from every switch does nothing
var FLIP_TIME = 0.09;
var TOGGLE_ON_PASS = true;      // a marble passing a switch flips it
var WHEEL_OMEGA = 1.8;          // rad/s
var WHEEL_NOTCHES = 8;
var GUTTER_SPEED = 220, LIFT_SPEED = 150, CUP_GAP = 56;
// Escapements: channel, where on it (share of its length), seconds per marble
// at the start and at the end of the round, and where the pendulum's pivot
// hangs from, relative to the pallet.
var GATES = [["top", 0.8, 1.0, 0.75, 0, -88], ["S0L", 0.78, 1.25, 0.9, 0, -88],
  ["S0R", 0.78, 1.25, 0.9, 0, -88], ["wout", 0.6, 0.9, 0.7, 52, -52]];
var GATE_PRESSURE = 3;          // a queue this long swings the pendulum faster...
var GATE_RUSH = 0.6;            // ... by this factor
var WOUT_CAP = 2;               // marbles the gate under the wheel stores before the wheel keeps them
var SCREW_X = 24, SCREW_BOT = 1238, SCREW_TOP = 44, SCREW_SPEED = 110;
var BG_RAIL_SPEED = 120;
var FERRIS = { cx: 590, cy: 350, r: 56, buckets: 6, omega: 0.6, marbles: 5 };
var BG_ALPHA = 0.42;            // how far back the return circuits sit
var AUTO_RATE = 0.22;           // seconds between two flips of the autopilot

// --- palette ---------------------------------------------------------------
var C_BG = "#1c140e", C_BG2 = "#241a12", C_WOOD = "#5a3d25", C_BRASS = "#c9994a",
    C_BRASS_D = "#7a5a2a", C_STEEL = "#8d95a3", C_GOOD = "#f2b53a", C_BAD = "#1d1d22";

// --- the network -------------------------------------------------------------
var DS = 5;                     // rails are resampled every DS px
var MID = 330;                  // the machine is symmetric about x = MID
function mir(pts) { var o = []; for (var i = 0; i < pts.length; i++) o.push([2 * MID - pts[i][0], pts[i][1], pts[i][2]]); return o; }
function loopPts(cx, cy, r) {
  var o = [];
  for (var i = 1; i <= 60; i++) { var a = Math.PI / 2 - i / 60 * Math.PI * 2; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return o;
}
// A spiral seen from slightly above: x = sin, depth = cos, the near half lower.
function coilPts(cx, y0, y1, r, turns) {
  var o = [], n = turns * 48;
  for (var i = 0; i <= n; i++) {
    var a = i / n * turns * Math.PI * 2;
    o.push([cx + r * Math.sin(a), y0 + (y1 - y0) * i / n + r * 0.35 * Math.cos(a), Math.cos(a)]);
  }
  return o;
}
var SW = { S0: [MID, 262], S1: [150, 470], S2: [2 * MID - 150, 470], S3: [MID, 790] };
var WHEEL = { cx: MID, cy: 615, r: 70 };
var S0L = [[MID, 262], [215, 318], [252, 392], [150, 470]];
var S1L = [[150, 470], [60, 560], [110, 650], [30, 760], [32, 830], [52, 858], [100, 870]]
  .concat(loopPts(100, 820, 50), [[140, 880], [168, 930], [85, 1005], [85, 1074]]);
var S1R = [[150, 470], [250, 535], [205, 595], [WHEEL.cx - WHEEL.r, WHEEL.cy]];
var TANK = { x: 150, y: 108, w: 124, h: 96 };
var GONG = { x: 600, y: 240, r: 28 };
var RAW = {
  tank: { to: "S0", pts: [[TANK.x + TANK.w - 10, TANK.y + TANK.h + 8], [292, 234], [MID, 262]] },
  top:  { to: "S0", pts: [[650, 152], [560, 186], [450, 212], [MID, 262]] },
  S0L:  { to: "S1", pts: S0L },            S0R: { to: "S2", pts: mir(S0L) },
  S1L:  { to: "bell", pts: S1L },           S1R: { to: "wheelL", pts: S1R },
  S2L:  { to: "wheelR", pts: mir(S1R) },    S2R: { to: "cannon", pts: mir(S1L) },
  wout: { to: "S3", pts: [[MID, WHEEL.cy + WHEEL.r], [MID, 790]] },
  S3L:  { to: "furnace", pts: [[MID, 790], [255, 850], [300, 930], [250, 1000], [250, 1074]] },
  S3R:  { to: "launcher", pts: [[MID, 790], [420, 842]].concat(coilPts(410, 850, 1030, 44, 2), [[410, 1074]]) }
};
var OUT = { S0: ["S0L", "S0R"], S1: ["S1L", "S1R"], S2: ["S2L", "S2R"], S3: ["S3L", "S3R"] };
var MACHINE_DEFS = [
  { id: "bell", name: "Bell", x: 85, color: "#f5c542" },
  { id: "furnace", name: "Furnace", x: 250, color: "#ff6a2a" },
  { id: "launcher", name: "Launcher", x: 410, color: "#4fd1c5" },
  { id: "cannon", name: "Cannon", x: 575, color: "#b18cff" }
];
var BOX_Y = 1080, BOX_H = 120, BOX_W = 150;
var GUTTER_L = 12, GUTTER_Y = 1226;
var LIFT_X = 690, LIFT_BOT = 1240, LIFT_TOP = 118;
var HOPPER = { x: 690, y: 118 };
var CHIMES = [["top", 0.22], ["top", 0.42], ["top", 0.62], ["S0L", 0.55], ["S0R", 0.55], ["S3L", 0.5]];
var DECO_GEARS = [[120, 250, 58, 11], [470, 740, 52, 10],
  [185, 740, 44, 9], [600, 900, 66, 13], [60, 960, 40, 8], [520, 1010, 36, 7]];

// Background rails: the top return from the screw, and the ferris wheel's run.
var BG_RAW = {
  back: [[SCREW_X, SCREW_TOP], [200, 50], [380, 58], [560, 64], [656, 70]],
  ferris: [[612, 292], [650, 318], [618, 350], [652, 382], [606, 410]]
};

// Resample every channel to one point every DS px, keeping a depth per point.
var CH = {}, BG = {};
function makeChannel(k, to, raw) {
  var xs = [], ys = [], zs = [];
  xs.push(raw[0][0]); ys.push(raw[0][1]); zs.push(raw[0][2] === undefined ? 1 : raw[0][2]);
  var carry = 0;
  for (var i = 1; i < raw.length; i++) {
    var a = raw[i - 1], b = raw[i], za = a[2] === undefined ? 1 : a[2], zb = b[2] === undefined ? 1 : b[2];
    var dx = b[0] - a[0], dy = b[1] - a[1], L = Math.sqrt(dx * dx + dy * dy), s = DS - carry;
    while (s <= L) { var q = s / L; xs.push(a[0] + dx * q); ys.push(a[1] + dy * q); zs.push(za + (zb - za) * q); s += DS; }
    carry = L - (s - DS);
  }
  var last = raw[raw.length - 1];
  xs.push(last[0]); ys.push(last[1]); zs.push(last[2] === undefined ? 1 : last[2]);
  var n = xs.length, coil = false;
  for (i = 0; i < n; i++) if (zs[i] < 0) coil = true;
  return { id: k, to: to, xs: xs, ys: ys, zs: zs, n: n, len: (n - 1) * DS, coil: coil };
}
for (var chk in RAW) CH[chk] = makeChannel(chk, RAW[chk].to, RAW[chk].pts);
for (chk in BG_RAW) BG[chk] = makeChannel(chk, null, BG_RAW[chk]);

// The cause-links. Three are cables a light runs down; two are the arcs that
// thrown marbles follow (drawn only while something is on them).
var LINK_RAW = {
  bellTank: [[40, BOX_Y], [48, 1050], [48, 290], [90, 232], [TANK.x + 14, TANK.y + TANK.h - 4]],
  cannonGong: [[575, BOX_Y + 30], [GONG.x, GONG.y + GONG.r]],
  gongWheel: [[GONG.x - 8, GONG.y + 12], [WHEEL.cx + 52, WHEEL.cy - 52]]
};
var LNK = {};
for (chk in LINK_RAW) LNK[chk] = makeChannel(chk, null, LINK_RAW[chk]);
var ARCS = {
  launchCannon: { x0: 410, y0: BOX_Y + 20, x1: 575, y1: BOX_Y + 30, h: 250, T: 0.9 },
  gongBell: { x0: GONG.x - 10, y0: GONG.y + 20, x1: 85, y1: BOX_Y + 20, h: 200, T: 1.5 }
};
var LINK_COLOR = { bellTank: "#f5c542", cannonGong: "#d8c4ff", gongWheel: "#ffcf7a",
  launchCannon: "#4fd1c5", gongBell: "#ffcf7a", tank: "#9fe6ff" };
function arcAt(a, q) { return { x: lerp(a.x0, a.x1, q), y: lerp(a.y0, a.y1, q) - a.h * 4 * q * (1 - q) }; }
function at(ch, d) {
  var f = Math.max(0, Math.min(ch.n - 1.001, d / DS)), i = Math.floor(f), q = f - i;
  return { x: ch.xs[i] + (ch.xs[i + 1] - ch.xs[i]) * q, y: ch.ys[i] + (ch.ys[i + 1] - ch.ys[i]) * q,
           z: ch.zs[i] + (ch.zs[i + 1] - ch.zs[i]) * q, slope: (ch.ys[i + 1] - ch.ys[i]) / DS };
}
// The gutter is a shallow V: each half runs out to its own return circuit.
function gutterY(x) { return GUTTER_Y + Math.abs(x - MID) * 0.03; }

// --- canvas ------------------------------------------------------------------
var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
var scale = 1, offX = 0, offY = 0, dpr = 1, trackLayer = null, frontLayer = null;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
  buildLayers();
}

// The rails never move, so they are drawn once: sleepers, a shadow, two brass
// rails. The coil's near half is also drawn on a second layer that goes OVER
// the marbles, which is what puts a marble behind its own rails.
function buildLayers() {
  var k = scale * dpr;
  trackLayer = document.createElement("canvas"); frontLayer = document.createElement("canvas");
  trackLayer.width = frontLayer.width = Math.max(1, Math.round(W * k));
  trackLayer.height = frontLayer.height = Math.max(1, Math.round(H * k));
  var t = trackLayer.getContext("2d"), f = frontLayer.getContext("2d");
  t.setTransform(k, 0, 0, k, 0, 0); f.setTransform(k, 0, 0, k, 0, 0);
  for (var id in CH) {
    var ch = CH[id];
    drawRails(t, ch, function (z) { return z < 0; }, 0.4);
    drawRails(t, ch, function (z) { return z >= 0; }, 1);
    if (ch.coil) drawRails(f, ch, function (z) { return z >= 0.15; }, 1);
  }
}
function normalAt(ch, i) {
  var a = Math.max(0, i - 1), b = Math.min(ch.n - 1, i + 1);
  var dx = ch.xs[b] - ch.xs[a], dy = ch.ys[b] - ch.ys[a], L = Math.sqrt(dx * dx + dy * dy) || 1;
  return [-dy / L, dx / L];
}
function drawRails(c, ch, keep, alpha) {
  c.globalAlpha = alpha; c.lineCap = "round"; c.lineJoin = "round";
  var i, nv;
  c.strokeStyle = C_WOOD; c.lineWidth = 5;
  for (i = 0; i < ch.n; i += 5) {
    if (!keep(ch.zs[i])) continue;
    nv = normalAt(ch, i);
    c.beginPath(); c.moveTo(ch.xs[i] - nv[0] * (R + 7), ch.ys[i] - nv[1] * (R + 7));
    c.lineTo(ch.xs[i] + nv[0] * (R + 7), ch.ys[i] + nv[1] * (R + 7)); c.stroke();
  }
  var sides = [-(R + 2), R + 2], pass, s;
  for (pass = 0; pass < 2; pass++) {
    c.strokeStyle = pass ? C_BRASS : "rgba(0,0,0,0.45)"; c.lineWidth = pass ? 3.5 : 5;
    for (s = 0; s < 2; s++) {
      var open = false;
      c.beginPath();
      for (i = 0; i < ch.n; i++) {
        if (!keep(ch.zs[i])) { open = false; continue; }
        nv = normalAt(ch, i);
        var x = ch.xs[i] + nv[0] * sides[s] + (pass ? 0 : 1.5), y = ch.ys[i] + nv[1] * sides[s] + (pass ? 0 : 2.5);
        if (!open) { c.moveTo(x, y); open = true; } else c.lineTo(x, y);
      }
      c.stroke();
    }
  }
  c.globalAlpha = 1;
}
addEventListener("resize", resize);

// --- state -------------------------------------------------------------------
var marbles, queue, machines, sw, parts, floats, beams, rings, wheel, chimes, gates, ferris;
var state, t, spawnT, rushT, score, combo, lives, shake, stats, flow, gearA, liftPhase, stock, screwPhase;
var tank, gong, pulses, lit, confetti, chain, chainT, chainPop, held, finaleT, bigText;
var auto = false, autoT = 0;

function reset() {
  marbles = []; queue = []; parts = []; floats = []; beams = []; rings = [];
  machines = {};
  for (var i = 0; i < MACHINE_DEFS.length; i++) {
    var d = MACHINE_DEFS[i];
    machines[d.id] = { id: d.id, name: d.name, x: d.x, color: d.color, fill: 0, jam: 0, rush: 0, fire: 0, aim: -Math.PI / 2,
      gauge: GAUGES[d.id] || 0 };
  }
  sw = {};
  for (var k in SW) {
    var dir = k === "S1" ? 1 : 0;
    sw[k] = { x: SW[k][0], y: SW[k][1], dir: dir, ang: branchAngle(k, dir), spin: 0, flash: 0 };
  }
  wheel = { phase: 0, notch: [], q: { wheelL: [], wheelR: [] }, boost: 0 };
  tank = { n: TANK_START, pour: false, pourT: 0, dripT: TANK_EVERY, drip: -1, door: 0 };
  gong = { hit: 0 };
  pulses = []; confetti = []; lit = {};
  for (var lk in LINK_COLOR) lit[lk] = 0;
  chain = 0; chainT = 0; chainPop = 0; held = false; finaleT = 0; bigText = null;
  for (i = 0; i < WHEEL_NOTCHES; i++) wheel.notch.push(null);
  gates = [];
  for (i = 0; i < GATES.length; i++) {
    var gc = CH[GATES[i][0]], gd = gc.len * GATES[i][1], gp = at(gc, gd), ga = at(gc, gd + 5);
    var tl = Math.sqrt((ga.x - gp.x) * (ga.x - gp.x) + (ga.y - gp.y) * (ga.y - gp.y)) || 1;
    gc.gate = { ch: gc, d: gd, p0: GATES[i][2], p1: GATES[i][3], q: [], timer: 0, open: 0, side: 1,
      x: gp.x, y: gp.y, tx: (ga.x - gp.x) / tl, ty: (ga.y - gp.y) / tl, px: GATES[i][4], py: GATES[i][5] };
    gates.push(gc.gate);
  }
  ferris = { phase: 0, bucket: [], rail: [], wait: [] };
  for (i = 0; i < FERRIS.buckets; i++) ferris.bucket.push(i < FERRIS.marbles ? { rot: i } : null);
  chimes = [];
  for (i = 0; i < CHIMES.length; i++) {
    var ch = CH[CHIMES[i][0]], cd = ch.len * CHIMES[i][1], p = at(ch, cd), nv = normalAt(ch, Math.round(cd / DS));
    if (nv[1] > 0) nv = [-nv[0], -nv[1]];      // hang it on the upper side of the rail
    chimes.push({ ch: ch, d: cd, x: p.x + nv[0] * 30, y: p.y + nv[1] * 30, hit: 9 });
  }
  for (i = 0; i < 3; i++) queue.push(rollKind(0));
  state = "play"; t = 0; spawnT = 0.6; rushT = 5; score = 0; combo = 0; lives = LIVES; shake = 0;
  flow = 0; gearA = 0; liftPhase = 0; screwPhase = 0; stock = 6;
  stats = { good: 0, burnt: 0, wasted: 0, jams: 0, fired: 0, shot: 0, bestChain: 0, finales: 0, chains: [] };
}

function branchAngle(id, dir) {
  var ch = CH[OUT[id][dir]], p = at(ch, 30);
  return Math.atan2(p.y - SW[id][1], p.x - SW[id][0]);
}
function progress() { return auto ? 0.5 : Math.min(1, t / ROUND_SECONDS); }
function lerp(a, b, k) { return a + (b - a) * k; }
function mod(a, m) { return ((a % m) + m) % m; }
function rollKind(k) {
  var r = Math.random();
  if (r < GOLD_CHANCE) return "gold";
  return r < GOLD_CHANCE + lerp(BAD_START, BAD_END, k) ? "bad" : "good";
}
function newMarble(kind, x, y) {
  var m = { kind: kind, st: "track", ch: null, d: 0, v: VMIN, x: x, y: y, z: 1, rot: Math.random() * 6 };
  marbles.push(m); return m;
}
function spawn(kind) {
  var m = newMarble(kind === "gold" ? "good" : kind, CH.top.xs[0], CH.top.ys[0]);
  m.ch = CH.top; m.gold = kind === "gold";
  if (stock > 0) stock--;
}
function mult() { return 1 + Math.floor(combo / COMBO_STEP); }

// --- events ------------------------------------------------------------------
function deliver(m, id) {
  var mc = machines[id];
  m.carrier = null;
  if (id === "furnace") {
    kill(m);
    if (m.kind === "bad") { combo++; stats.burnt++; gain(PTS_BURN * mult(), mc.x, BOX_Y - 10, mc.color); burst(mc.x, BOX_Y + 20, "#ff6a2a", 14); }
    else { combo = 0; stats.wasted++; say("Wasted", mc.x, BOX_Y - 30, "#c8b8a0"); burst(mc.x, BOX_Y + 20, "#ffd27a", 8); }
    return;
  }
  if (m.kind === "bad") {
    kill(m);
    if (mc.jam > 0) { say("Jammed", mc.x, BOX_Y - 30, "#ff5a5a"); return; }
    mc.jam = JAM_SECONDS; mc.fill = 0; combo = 0; stats.jams++; shake = 0.35;
    if (!auto) lives--;
    burst(mc.x, BOX_Y + 30, "#ff5a5a", 26); say("Jam!", mc.x, BOX_Y - 30, "#ff5a5a");
    if (lives <= 0) state = "over";
    return;
  }
  // Whatever a machine swallows falls through it to the gutter and goes home.
  m.st = "drop"; m.vy = 0; m.kind = "spent"; m.gdir = m.x < MID ? -1 : 1;
  if (mc.jam > 0) { combo = 0; say("Jammed", mc.x, BOX_Y - 30, "#ff5a5a"); return; }
  var r = mc.rush > 0 ? RUSH_MULT : 1, gold = m.gold;
  combo++; stats.good++;
  gain(PTS_GOOD * mult() * r, mc.x, BOX_Y - 10, mc.color);
  mc.fill += (gold ? GOLD_FILL : 1) * (mc.rush > 0 ? 2 : 1);
  burst(mc.x, BOX_Y, mc.color, 6);
  if (mc.fill >= mc.gauge) { mc.fill = 0; fire(mc, r); }
}
function kill(m) { m.st = "dead"; }

// A marble thrown along a link lands in a machine and charges it by one.
function land(m, id) {
  var mc = machines[id];
  m.carrier = null; m.st = "drop"; m.vy = 0; m.kind = "spent"; m.gdir = m.x < MID ? -1 : 1;
  if (mc.jam > 0) { say("Jammed", mc.x, BOX_Y - 30, "#ff5a5a"); return; }
  mc.fill += mc.rush > 0 ? 2 : 1;
  burst(mc.x, BOX_Y + 10, mc.color, 8);

}

  ctx.fillStyle = hit > 0.5 ? "#ffd98a" : "#b8862f"; ctx.beginPath(); ctx.arc(0, cy, r * s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#7a5a2a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, cy, r * s * 0.62, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#7a5a2a"; ctx.beginPath(); ctx.arc(0, cy, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// The chain lives on the wheel: a ring that drains, and the count in the hub.
var CHAIN_COLORS = ["#cdbb9c", "#f5c542", "#4fd1c5", "#b18cff", "#ff6a2a", "#ffffff"];
function drawChain() {
  if (chain <= 0) return;
  var cx = WHEEL.cx, cy = WHEEL.cy, col = CHAIN_COLORS[Math.min(chain, CHAIN_COLORS.length - 1)];
  var k = held ? 1 : chainT / CHAIN_WINDOW, rr = WHEEL.r + 20;
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 9;
  ctx.globalAlpha = held ? 0.65 + 0.35 * Math.sin(t * 10) : 1;
  ctx.beginPath(); ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
  ctx.globalAlpha = 1;
  if (held) {
    var ha = t * 5;
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(cx + Math.cos(ha) * rr, cy + Math.sin(ha) * rr, 6, 0, Math.PI * 2); ctx.fill();
  }
  var pop = 1 + chainPop * 0.9;
  ctx.fillStyle = "rgba(14,10,7,0.88)"; ctx.beginPath(); ctx.arc(cx, cy, 52, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
  ctx.textAlign = "center"; ctx.fillStyle = "#cdbb9c"; ctx.font = "700 20px system-ui, sans-serif";
  ctx.fillText("Chain", cx, cy - 16);
  ctx.save(); ctx.translate(cx, cy + 26); ctx.scale(pop, pop);
  ctx.fillStyle = col; ctx.font = "900 44px system-ui, sans-serif";
  ctx.fillText("x" + chain, 0, 0);
  ctx.restore();
  // The next steps to the finale, as pips under the ring.
  for (var i = 1; i <= CHAIN_FINALE; i++) {
    ctx.fillStyle = i <= chain ? col : "rgba(0,0,0,0.55)";
    ctx.beginPath(); ctx.arc(cx - (CHAIN_FINALE - 1) * 9 + (i - 1) * 18, cy + rr + 22, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0e0a07"; ctx.fillRect(0, 0, innerWidth, innerHeight);
  var amp = shake > 0 ? 16 * Math.min(1.8, shake / 0.35) : 0;
  var sx = (Math.random() - 0.5) * amp, sy = (Math.random() - 0.5) * amp;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (offX + sx * scale) * dpr, (offY + sy * scale) * dpr);
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, C_BG2); bg.addColorStop(1, C_BG);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Background works: meshing gears that turn faster when the rails are busy.
  ctx.globalAlpha = 0.16;
  for (var i = 0; i < DECO_GEARS.length; i++) {
    var gdef = DECO_GEARS[i], dir = i % 2 ? -1 : 1;
    cog(gdef[0], gdef[1], gdef[2], gdef[3], gearA * dir * 60 / gdef[2], C_BRASS);
  }
  ctx.globalAlpha = 1;

  drawBackground();
  ctx.globalAlpha = 0.75; drawLift(); ctx.globalAlpha = 1;
  drawCables();
  drawWheel();
  ctx.drawImage(trackLayer, 0, 0, W, H);
  drawTank();
  drawGong();
  for (i = 0; i < chimes.length; i++) {
    var c = chimes[i], lit = Math.max(0, 1 - c.hit / 0.35), wob = lit * Math.sin(c.hit * 60) * 0.3;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(wob);
    ctx.fillStyle = lit > 0 ? "rgba(255,230,160," + (0.5 + lit * 0.5) + ")" : C_BRASS_D;
    ctx.fillRect(-14, -5, 28, 10);
    if (lit > 0) { ctx.strokeStyle = "rgba(255,230,160," + lit + ")"; ctx.lineWidth = 2; ctx.strokeRect(-20 - lit * 8, -10 - lit * 6, 40 + lit * 16, 20 + lit * 12); }
    ctx.restore();
  }
  drawSwitches();
  drawGates();
  drawChain();

  for (i = 0; i < beams.length; i++) {
    var b = beams[i];
    if (b.t < 0) continue;
    ctx.globalAlpha = 1 - b.t / 0.25; ctx.strokeStyle = "#e0d0ff"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(b.x0, b.y0); ctx.lineTo(b.x1, b.y1); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (i = 0; i < marbles.length; i++) if (marbles[i].z < 0) drawMarble(marbles[i]);
  ctx.drawImage(frontLayer, 0, 0, W, H);
  for (i = 0; i < marbles.length; i++) {
    var m = marbles[i];
    if (m.z < 0 || m.st === "drop" || m.st === "gutter" || m.st === "cupwait" || m.st === "screw" || m.st === "back" || m.st === "fly") continue;
    if (m.carrier === "flood") { ctx.fillStyle = "rgba(159,230,255,0.28)"; ctx.beginPath(); ctx.arc(m.x, m.y, R * 1.6, 0, Math.PI * 2); ctx.fill(); }
    drawMarble(m);
  }
  drawMachines();
  for (i = 0; i < marbles.length; i++) if (marbles[i].st === "gutter" || marbles[i].st === "cupwait") drawMarble(marbles[i]);
  drawArcs();
  // Marbles thrown along a link fly over everything, with a halo.
  for (i = 0; i < marbles.length; i++) {
    var fm = marbles[i];
    if (fm.st !== "fly" || fm.fly.t < 0) continue;
    ctx.fillStyle = "rgba(255,240,200,0.25)"; ctx.beginPath(); ctx.arc(fm.x, fm.y, R * 1.9, 0, Math.PI * 2); ctx.fill();
    drawMarble(fm);
  }
  drawPulses();

  for (i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
  }
  for (i = 0; i < confetti.length; i++) {
    var cf = confetti[i];
    ctx.globalAlpha = Math.min(1, (cf.life - cf.t) * 2); ctx.fillStyle = cf.color;
    ctx.save(); ctx.translate(cf.x, cf.y); ctx.rotate(cf.rot); ctx.scale(1, Math.cos(cf.rot * 1.7));
    ctx.fillRect(-6, -10, 12, 20); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // HUD.
  ctx.textAlign = "left"; ctx.fillStyle = "#f3e6cf"; ctx.font = "800 40px system-ui, sans-serif";
  ctx.fillText(score, 28, 60);
  ctx.font = "600 22px system-ui, sans-serif"; ctx.fillStyle = "#cdbb9c";
  ctx.fillText("Combo " + combo + "  x" + mult(), 28, 94);
  ctx.textAlign = "center";
  ctx.fillStyle = auto ? C_BRASS : "#3a2c1e"; ctx.fillRect(290, 30, 120, 44);
  ctx.fillStyle = auto ? "#1c140e" : "#cdbb9c"; ctx.font = "700 22px system-ui, sans-serif";
  ctx.fillText(auto ? "Auto on" : "Auto", 350, 60);
  ctx.textAlign = "right"; ctx.fillStyle = "#cdbb9c";
  ctx.fillText(auto ? "Endless" : Math.ceil(ROUND_SECONDS - t) + " s", 520, 60);
  var hearts = ""; for (i = 0; i < lives; i++) hearts += "● ";
  ctx.fillStyle = "#ff5a5a"; ctx.fillText(auto ? "" : hearts, 520, 90);

  ctx.textAlign = "center";
  for (i = 0; i < floats.length; i++) {
    var f = floats[i];
    ctx.globalAlpha = Math.max(0, 1 - f.t); ctx.fillStyle = f.color;
    ctx.font = "800 28px system-ui, sans-serif";
    ctx.lineWidth = 6; ctx.strokeStyle = "#0e0a07"; ctx.lineJoin = "round";
    ctx.strokeText(f.str, f.x, f.y - f.t * 70);
    ctx.fillText(f.str, f.x, f.y - f.t * 70);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#7d6a52"; ctx.font = "20px system-ui, sans-serif";
  ctx.fillText("Debug: good " + stats.good + "  jams " + stats.jams + "  fired " + stats.fired + "  shot " + stats.shot +
    "  best chain x" + stats.bestChain + "  finales " + stats.finales + "  marbles " + marbles.length, W / 2, 1268);

  if (bigText) {
    var bt = bigText.t, bs = bt < 0.25 ? 0.4 + bt / 0.25 * 0.8 : 1.2 - Math.min(0.2, (bt - 0.25) * 0.4);
    ctx.globalAlpha = Math.min(1, (2.2 - bt) * 2);
    ctx.save(); ctx.translate(W / 2, 470); ctx.scale(bs, bs); ctx.rotate(-0.05);
    ctx.font = "900 68px system-ui, sans-serif"; ctx.textAlign = "center";
    ctx.lineWidth = 12; ctx.strokeStyle = "#1c140e"; ctx.strokeText(bigText.str, 0, 0);
    ctx.fillStyle = CHAIN_COLORS[(Math.floor(bt * 10) % 4) + 1]; ctx.fillText(bigText.str, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  if (state === "over") {
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f3e6cf"; ctx.font = "800 64px system-ui, sans-serif";
    ctx.fillText(lives <= 0 ? "Machine wrecked" : "Time's up", W / 2, 540);
    ctx.font = "700 36px system-ui, sans-serif";
    ctx.fillText("Score " + score, W / 2, 610);
    ctx.fillText("Longest chain x" + stats.bestChain + "   finales " + stats.finales, W / 2, 660);
    ctx.font = "26px system-ui, sans-serif"; ctx.fillStyle = "#cdbb9c";
    ctx.fillText("Machines fired " + stats.fired + "   bombs shot " + stats.shot, W / 2, 706);
    ctx.fillText("Tap to play again", W / 2, 780);
  }
}

// --- input ---------------------------------------------------------------------
function setAuto(on) { auto = on; reset(); }
cv.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale;
  if (x >= 290 && x <= 410 && y >= 30 && y <= 74) { setAuto(!auto); return; }
  if (state === "over") { reset(); return; }
  if (auto) return;
  var best = null, bd = TAP_REACH;
  for (var k in sw) {
    var d = Math.sqrt((sw[k].x - x) * (sw[k].x - x) + (sw[k].y - y) * (sw[k].y - y));
    if (d < bd) { bd = d; best = k; }
  }
  if (best && state === "play") flip(best);
});
addEventListener("keydown", function (e) {
  if (e.repeat) return;
  if (e.key >= "1" && e.key <= "4" && !auto && state === "play") flip("S" + (e.key - 1));
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "a" || e.key === "A") setAuto(!auto);
});

// --- loop ----------------------------------------------------------------------
var lastT = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
resize();
reset();
requestAnimationFrame(frame);
</script>
