      // a plate around it (`combo`) or a shockwave behind it, and #ov-pops
      // clips, so an off-centre anchor would slice those off. Measure the body
      // and the ring and fold them into the clamp. Only those two: the soft
      // decors (band, dots, rays, chevrons, stripes) are drawn wider than the
      // frame ON PURPOSE and must keep bleeding off both edges.
      var ringEl = anim.querySelector(".pop-d-ring");
      var bodyW = Math.min(Math.max(body.offsetWidth, wordW), Layout.w);
      var half = Math.min(Math.max(bodyW / 2 + 8, ringEl ? ringEl.offsetWidth / 2 : 0), view.w / 2);
      pop.style.left = clamp(px, half, view.w - half) + "px";

      // Full-frame impact, borrowed from the layers that own it. `opt.silent`
      // opts out: the prewarm pass below builds every style while the intro is
      // up, and must not shake, flash, glow the frame edges or drop confetti.
      if (!opt.silent) {
        if (st.shake) Fx.shake(st.shake, st.shakeDur || 0.3);
        if (st.flash) Fx.flash(st.flashCol || "#ffffff", st.flash);
        if (st.vignette) Overlay.vignette(st.vignette, 1, Math.min(st.vignetteMs || 520, enter + Math.max(hold, 0)));
        if (st.confetti) Confetti.burst(st.confetti);
      }

      var handle;
      function remove() {
        var i = live.indexOf(handle);
        if (i >= 0) live.splice(i, 1);
        if (pop.parentNode) pop.parentNode.removeChild(pop);
      }
      function close(delay) {
        if (out.getAttribute("data-closing")) return;
        out.setAttribute("data-closing", "1");
        out.style.animation = "pop-out-" + st.anim + " " + exit + "ms ease-in " + delay + "ms forwards";
        later(remove, delay + exit + 60);
      }
      if (hold >= 0) close(enter + hold);

      handle = { el: pop, close: function () { close(0); }, remove: remove };
      live.push(handle);
      // Over the cap: drop the oldest outright rather than play it out — under a
      // burst it is already faded, and an exit animation costs another frame.
      while (live.length > MAX_LIVE) live[0].remove();
      return handle;
    }

    /* The catalogue. Each entry is one visual language:
         cls is implicit (".pop-<key>")
         anim                 entry/exit pair ("slam" -> pop-in-slam/pop-out-slam)
         enter / hold / exit  default timing in ms; `hold` is what a caller tunes
         decor                layers painted behind the word
         at / rot             default anchor and static tilt
         letters              split the word per glyph (staggered drop-in); off
                              by default because one layer rasterizes far faster
         vertical             manga column, one glyph per line
         shake / flash / vignette / confetti: full-frame impact
       Timings are deliberately tight: a callout that outstays the beat hides the
       gameplay it is celebrating. Lengthen `hold` per call, never by default. */
    var STYLES = {
      // the tiny frequent one, spawned at the impact point
      score:    { anim:"float", enter:240, hold:240, exit:420, decor:[], at:"center", rot:-5 },
      // a mistake: chain lost, wall hit. Sits where a toast would, but styled
      // like the rest of the callouts instead of looking like a leftover pill.
      alert:    { anim:"punch", enter:220, hold:320, exit:220, decor:[], at:"hudUnder", rot:-2 },
      // a scoring milestone: a compact chip with a shockwave, off to one side.
      // This is the one callout a good run fires over and over, so it is built
      // to cost nothing (see .pop-combo and pop-in-chip): no full-frame veil,
      // no clip-path, and a footprint the size of its own text. `ultra` keeps
      // the flash for the moment that really is rare.
      combo:    { anim:"chip", enter:260, hold:520, exit:220, decor:["ring","dashes"],
                  at:"upperRight", rot:-7, shake:4 },
      // a chain staying alive: chevrons pushing the eye sideways
      streak:   { anim:"punch", enter:300, hold:480, exit:240, decor:["chevrons"],
                  at:"left", rot:-7, shake:4 },
      // a comic banner sweeping across the play area
      ribbon:   { anim:"swipe", enter:420, hold:620, exit:320, decor:["band","lines"],
                  at:"upper", shake:5 },
      // poster energy for a big announcement (level up, unlock)
      manifest: { anim:"drop", enter:520, hold:820, exit:320, decor:["dots","band"],
                  at:"center", letters:true, shake:12,
                  vignette:"rgba(214,27,60,.9)", vignetteMs:700 },
      // "you nailed it": gold, sparkles, gentle rays
      perfect:  { anim:"punch", enter:360, hold:620, exit:280, decor:["sparks"],
                  at:"upper", rot:-3, vignette:"rgba(255,190,60,.8)" },
      // the hero moment: rays, chroma, maximum size
      ultra:    { anim:"zoom", enter:440, hold:640, exit:320, decor:["rays"],
                  at:"center", shake:16, flash:0.5, vignette:"rgba(120,70,255,.85)" },
      // a reward sticker
      bonus:    { anim:"drop", enter:380, hold:620, exit:280, decor:["dots"], at:"lower", rot:-4 },
      // hazard tape, blinking for the whole hold
      danger:   { anim:"alarm", enter:240, hold:1100, exit:260, pulse:true, decor:["stripes"],
                  at:"top", vignette:"rgba(255,40,40,.85)", vignetteMs:1100 },
      // the end-of-run peak (its confetti only shows once the end screen is up,
      // since Confetti draws on the end-screen canvas)
      record:   { anim:"drop", enter:620, hold:1500, exit:380, decor:["rays","band","sparks"],
                  at:"center", shake:8, confetti:28 },
      // vertical manga column hugging one edge
      vert:     { anim:"punch", enter:320, hold:560, exit:260, decor:["rays"],
                  at:"edgeRight", rot:4, vertical:true }
    };

    function clear() {
      var i; for (i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = []; live = [];
      $("ov-pops").innerHTML = "";
    }

    /* Rasterizing a style for the first time costs 50-80 ms (gradient text,
       clip-paths, masks). That must never land on a milestone frame, so every
       style is built once — hidden, one per animation frame — while the intro is
       up and nothing is being played. Idempotent and self-cancelling. */
    var warmed = false;
    function prewarm() {
      if (warmed) return;
      warmed = true;
      var keys = [], k;
      for (k in STYLES) if (STYLES.hasOwnProperty(k)) keys.push(k);
      var i = 0;
      function step() {
        if (i >= keys.length) return;
        // Not visibility:hidden — an invisible layer is never rasterized, which
        // is the whole point of the pass. Near-zero opacity still paints.
        var h = show(keys[i++], { word: "WARM UP", sub: "0", hold: 0, enter: 1, exit: 1, silent: true });
        if (h) h.el.style.opacity = "0.004";
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    return { show: show, clear: clear, prewarm: prewarm, styles: STYLES, anchors: ANCHORS };
  })();

  // --- Intro: logo, copy and the animated how-to-play demo ----------------
  function buildIntro() {
    var logo = CONFIG.intro.logo && ASSETS.images[CONFIG.intro.logo];
    var img = $("app-icon");
    if (logo) { img.src = logo; img.alt = CONFIG.title; } else { img.style.display = "none"; }
    $("intro-title").textContent = CONFIG.title;
    $("intro-tagline").innerHTML = CONFIG.tagline;
    $("intro-demo").className = "demo-" + (CONFIG.intro.demo || "tap");
    $("demo-caption").textContent = CONFIG.intro.caption || "";
    $("btn-start").textContent = CONFIG.copy.start;
    $("btn-cta").textContent = CONFIG.copy.ctaBar;
    $("btn-install").textContent = CONFIG.copy.ctaEnd;
    $("btn-replay").textContent = CONFIG.copy.replay;
    $("hud-score-lbl").textContent = CONFIG.copy.scoreLabel;
    $("eo-scorelbl").textContent = CONFIG.copy.endScore;
  }

  // --- End screen: the cinematic reveal ----------------------------------
  // Beats: title -> score count-up (+confetti) -> stars -> stat rows -> CTA.
  var EndScreen = (function () {
    var timers = [];
    var T_TITLE = 120, T_SCORE = 560, T_STARS = 1950, STAR_GAP = 440,
        ROW_GAP = 250, T_CTA_AFTER = 1500;
    // The reveal climbs: each star rings the same chime a step higher. RATE
    // drives the embedded "uiStar" clip, FREQ the synthesized fallback.
    var STAR_RATE = [1, 1.19, 1.42], STAR_FREQ = [660, 880, 1180];

    function countUp(el, target, dur, cb) {
      var start = performance.now();
      function step(now) {
        var p = clamp((now - start) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(e * target);
        if (p < 1) requestAnimationFrame(step);
        else { el.textContent = target; if (cb) cb(); }
      }
      requestAnimationFrame(step);
    }

    // result: { title, variant:""|"win"|"perfect", score, stars:0..3|null,
    //           rows:[{label, value, grade}] }
    function show(result) {
      timers.forEach(clearTimeout); timers = [];
      Confetti.clear();
      function T(fn, ms) { timers.push(setTimeout(fn, ms)); }

      var title = $("eo-title");
      title.textContent = result.title || CONFIG.copy.gameOver;
      title.className = "eo-title" + (result.variant ? " " + result.variant : "");
      ["eo-title", "eo-scorelbl", "eo-score"].forEach(function (id) { $(id).classList.remove("show", "pop"); });
      $("eo-score").textContent = "0";
      $("btn-install").classList.remove("show");
      $("btn-replay").classList.remove("show");

      // Stars (pass null / undefined to hide the row entirely).
      var stars = result.stars;
      var hasStars = stars != null;
      $("eo-stars").classList.toggle("hidden", !hasStars);
      for (var i = 1; i <= 3; i++) $("star-" + i).className = "star";

      // Stat rows are rebuilt every round so a replay starts clean.
      var rows = result.rows || [];
      var box = $("eo-stats"), html = "";
      rows.forEach(function (r, i) {
        var label = r.grade === "gold"
          ? '<span class="spark">✦</span> ' + r.label + ' <span class="spark">✦</span>'
          : r.label;
        html += '<div class="eo-row' + (r.grade ? " " + r.grade : "") + '" id="eo-row-' + i + '">' +
                '<span>' + label + '</span><span class="eo-val" id="eo-val-' + i + '">0</span></div>';
      });
      box.innerHTML = html;

      // 1) Title slams in.
      T(function () { title.classList.add("show"); }, T_TITLE);

      // 2) Final score counts up, greeted by confetti.
      T(function () {
        $("eo-scorelbl").classList.add("show");
        $("eo-score").classList.add("show");
        Confetti.burst(70);
        countUp($("eo-score"), result.score || 0, 1100, function () {
          $("eo-score").classList.add("pop");
          Sound.cue("uiScore", 0.8, 1, 900, 0.14);
          Confetti.burst(90);
        });
      }, T_SCORE);

      // 3) Stars slam in one by one, each with a rising chime.
      var afterStars = T_SCORE + 900;
      if (hasStars) {
        T(function () { for (var s = 1; s <= 3; s++) $("star-" + s).classList.add("dim"); }, T_STARS - 160);
        for (var si = 0; si < stars; si++) {
          (function (idx) {
            T(function () {
              var el = $("star-" + (idx + 1));
              el.classList.remove("dim"); el.classList.add("on");
              Sound.cue("uiStar", 0.75, STAR_RATE[idx] || 1.42, STAR_FREQ[idx] || 1180, 0.16);
              Confetti.burst(30);
            }, T_STARS + idx * STAR_GAP);
          })(si);
        }
        afterStars = T_STARS + Math.max(stars, 1) * STAR_GAP + 350;
      }

      // 4) Stat rows cascade in, counters animating.
      rows.forEach(function (r, i) {
        T(function () {
          $("eo-row-" + i).classList.add("show");
          var el = $("eo-val-" + i);
          if (typeof r.value === "number") countUp(el, r.value, 450);
          else el.textContent = r.value;
          Sound.cue("uiRow", 0.5, 1 + i * 0.07, 480 + i * 70, 0.05);
        }, afterStars + i * ROW_GAP);
      });

      // 5) Install CTA, then the discreet replay link.
      var ctaAt = afterStars + rows.length * ROW_GAP + T_CTA_AFTER;
      T(function () { $("btn-install").classList.add("show"); }, ctaAt);
      T(function () { $("btn-replay").classList.add("show"); }, ctaAt + 500);
    }
    return { show: show };
  })();

  /* --- Perf: a readout on the device itself ------------------------------
     Add `?perf=1` to a game's URL and this box appears; without it not a line
     of it runs. It exists because the two machines disagree: a desktop absorbs
     costs a phone cannot, and no bench on a laptop reproduces the phone that
     is actually stuttering.

     What it shows, and why that split is the whole point:

       fps / worst     the real frame interval, which includes everything —
                       script, style, layout, paint, raster, composite.
       main            how much of the worst frame the MAIN THREAD owned, read
                       from the browser's own long-animation-frame report
                       (Chromium; Firefox has no equivalent and shows "n/a").
       verdict         `main` says which half to look at. A long frame with a
                       long `main` is JavaScript, style or layout — profile the
                       game code. A long frame with a SHORT `main` is paint,
                       raster or compositing: the main thread was idle and the
                       frame still missed, which is what an animated paint
                       property or an oversized layer does, and it is the one
                       failure a JS profiler cannot see.

     Read it while playing, not on the menu: the callouts and the HUD only cost
     anything once a round is running.                                       */
  var Perf = (function () {
    var on = false;
    /* `perf=1` is the live readout, `perf=bench` the self-measuring sweep
       further down. Anything else, and not a line of this module runs. */
    try { on = /[?&#]perf=(1|bench)\b/.test(location.search + location.hash); } catch (e) {}
    if (!on) return { frame: function () {} };

    /* `?perf=1&off=vig,decor` switches a suspect off ON THE DEVICE. The probe
       above says whether a stutter is main-thread or paint/raster; it cannot
       say WHICH layer, and no bench on a laptop reproduces a phone's raster.
       So the bisect moves here: turn one thing off, play the same beat, watch
       `worst`. What is available, from the cheapest guess to the broadest:

         vig     Overlay.vignette — a full-frame repaint, because the colour is
                 assigned per call, blurred over the whole frame
         fx      the canvas juice: bursts, rings, the full-frame flash, shake
         pops    every callout, outright
       and, once `pops` has been shown to be the one, inside a callout:
         decor   the layers behind the word (band, dots, rays, ring, chevrons)
         word    the word's glyph layers, all of them
         glow    just the two BLURRED text-shadows
         shadow  the whole text-shadow stack, blurred and solid
         stroke  just the 14px path stroke around the glyphs
         face    just the gradient face (a second glyph pass, clipped)
         sub     the sub-line under the word

       Canvas drawing is rasterized off the main thread too, so `fx` and `pops`
       together separate the two halves of a pickup: if `off=fx` flattens the
       spike it is the canvas, if `off=pops` does it is the DOM. The box lists
       what is currently off, so a reading is never misattributed. */
    var off = {};
    try {
      var m = /[?&]off=([a-z,]+)/.exec(location.search + location.hash);
      if (m) {
        var names = m[1].split(",");
        for (var k = 0; k < names.length; k++) off[names[k]] = true;
      }
    } catch (e) {}

    function noop() {}
    if (off.vig)  Overlay.vignette = noop;
    if (off.pops) Pop.show = function () { return null; };
    if (off.fx) {
      Fx.burst = noop; Fx.ring = noop; Fx.flash = noop; Fx.shake = noop; Fx.text = noop;
    }
    /* Inside a callout, the word is rendered several times over: a 14px path
       stroke, three solid extrusion copies, two blurred ones, and a second
       glyph pass used as the mask for the gradient face. Each of these takes
       one of them out, so a reading names the layer instead of the module. */
    var OFF_CSS = {
      decor:  ".pop-d,.pop-d-dash,.pop-d-spark{display:none!important}",
      shadow: ".pop-ltr{text-shadow:none!important}",
      glow:   ".pop-ltr{text-shadow:0 5px 0 var(--ink),0 10px 0 var(--ink)," +
              "0 15px 0 var(--ink2)!important}",              // the two blurs only
      stroke: ".pop-ltr{-webkit-text-stroke-width:0!important}",
      face:   ".pop-ltr::before{display:none!important}",
      sub:    ".pop-sub{display:none!important}",
      word:   ".pop-ltr{text-shadow:none!important;-webkit-text-stroke-width:0!important}" +
              ".pop-ltr::before{display:none!important}"
    };
    var rules = "", key;   /* OFF_CSS is also what the ?perf=bench sweep applies */
    for (key in OFF_CSS) if (off[key]) rules += OFF_CSS[key];
    if (rules) {
      var css = document.createElement("style");
      css.textContent = rules;
      document.head.appendChild(css);
    }
    var offList = Object.keys(off).join(",");

    /* `?perf=bench` — the device measures itself.
       A laptop cannot stand in for a phone here, and it was tried: a software
       rasterizer says a callout's halftone decor is 92% of its cost and the
       blurred shadows nothing, while this phone said the opposite, because a
       GPU fills area almost for free and pays for blur passes instead. And the
       GPU's own work cannot be read back — it is asynchronous and Chrome
       exposes no per-layer timing (see tools/lab/bench-raster.mjs, which says
       the same at more length).
       So the sweep runs here. It fires the same callout over and over, once
       per variant, back to back in one session on one device, and prints a
       table: same hardware, same thermal state, same everything but the layer
       under test. Read the ORDER of the rows, not the milliseconds.
       Start a round, put the phone down, wait — it takes about a minute. */
    var bench = false;
    try { bench = /[?&]perf=bench\b/.test(location.search + location.hash); } catch (e) {}

    var box = null, prev = 0, frames = 0, worst = 0, over = 0, since = 0;
    var mainWorst = 0, mainKnown = false;
    /* Ask whether the browser CAN report a long main-thread frame, rather than
       waiting for one to arrive. It is the case that matters: a long frame with
       no report is the verdict, so "no report yet" and "cannot report" must not
       look the same. */
    try {
      mainKnown = !!(window.PerformanceObserver && PerformanceObserver.supportedEntryTypes &&
        PerformanceObserver.supportedEntryTypes.indexOf("long-animation-frame") >= 0);
    } catch (e) {}

    /* The browser reports a long animation frame with the main thread's share
       of it already broken down. Only the total is used here: the interesting
       question on a phone is not which main-thread phase was slow, it is
       whether the main thread was involved at all. */
    try {
      new PerformanceObserver(function (list) {
        var e = list.getEntries();
        for (var i = 0; i < e.length; i++) if (e[i].duration > mainWorst) mainWorst = e[i].duration;
      }).observe({ type: "long-animation-frame", buffered: false });
    } catch (e) {}

    function ensure() {
      if (box) return box;
      box = document.createElement("div");
      /* Inline styles, outside the frame: a probe must not need a rule in the
         motor stylesheet, and it must not ride the frame's scale transform. */
      box.style.cssText = "position:fixed;left:6px;top:6px;z-index:9999;" +
        "padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.72);color:#eafcff;" +
        "font:700 11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;" +
        "pointer-events:none;text-align:left";
      document.body.appendChild(box);
      return box;
    }

    function frame() {
      var t = (window.performance && performance.now) ? performance.now() : Date.now();
      if (prev) {
        var dt = t - prev;
        frames++; since += dt;
        if (dt > worst) worst = dt;
        if (dt > 32) over++;
        /* In sweep mode the box belongs to the sweep's table: the live
           readout would overwrite it once a second. */
        if (since >= 1000 && bench) { frames = 0; since = 0; worst = 0; over = 0; mainWorst = 0; }
        else if (since >= 1000) {
          var fps = Math.round(frames * 1000 / since);
          var main = mainKnown ? Math.round(mainWorst) + "ms" : "n/a";
          var verdict = worst < 32 ? "ok"
            : !mainKnown ? "slow — no main-thread report here"
            : mainWorst > worst * 0.6 ? "main thread" : "paint/raster";
          ensure().textContent =
            "fps " + fps + "   worst " + Math.round(worst) + "ms\n" +
            "main " + main + "   >32ms " + over + "/s" +
            (verdict ? "\n" + verdict : "") +
            (offList ? "\noff: " + offList : "");
          frames = 0; since = 0; worst = 0; over = 0; mainWorst = 0;
        }
      }
      prev = t;
    }

    /* --- the device sweep ------------------------------------------------
       Each pass: apply one variant's CSS, fire N callouts on a fixed cadence,
       and keep the frame intervals. Nothing here touches the game's own state
       beyond showing callouts, so the round keeps playing under it. */
    var PASSES = ["base", "glow", "shadow", "face", "decor", "word", "sub"];
    var SWEEP_STYLE = "bonus";        // the callout a pickup fires
    var SWEEP_N = 16, SWEEP_GAP = 260;

    function benchRun() {
      var css = document.createElement("style");
      document.head.appendChild(css);
      var results = [], pass = 0;

      function report(done) {
        var lines = ["callout: " + SWEEP_STYLE + "  x" + SWEEP_N, ""], i, r;
        lines.push("variant   p95  worst  slow/s");
        for (i = 0; i < results.length; i++) {
          r = results[i];
          lines.push(pad(r.name, 9) + pad(Math.round(r.p95), 5) + pad(Math.round(r.worst), 7) +
            (Math.round(r.rate * 10) / 10));
        }
        if (!done) lines.push("…" + PASSES[pass]);
        ensure().textContent = lines.join("\n");
      }
      function pad(v, n) { v = String(v); while (v.length < n) v += " "; return v; }

      function next() {
        if (pass >= PASSES.length) { report(true); return; }
        var name = PASSES[pass];
        css.textContent = name === "base" ? "" : (OFF_CSS[name] || "");
        report(false);
        var stamps = [], fired = 0;
        var running = true;
        function tick(t) { if (!running) return; stamps.push(t); requestAnimationFrame(tick); }
        requestAnimationFrame(tick);
        var iv = setInterval(function () {
          if (fired++ >= SWEEP_N) {
            clearInterval(iv);
            setTimeout(function () {
              running = false;
              var d = [], i;
              for (i = 1; i < stamps.length; i++) d.push(stamps[i] - stamps[i - 1]);
              d.sort(function (a, b) { return a - b; });
              var over = 0;
              for (i = 0; i < d.length; i++) if (d[i] > 32) over++;
              /* Frames over 32 ms per SECOND, not per pass: a pass that ran a
                 little longer would otherwise look worse than one that did
                 not. p95 and worst are already durations. */
              var secs = 0, j;
              for (j = 0; j < d.length; j++) secs += d[j];
              secs = secs / 1000 || 1;
              results.push({
                name: name,
                p95: d.length ? d[Math.min(d.length - 1, Math.floor(d.length * 0.95))] : 0,
                worst: d.length ? d[d.length - 1] : 0,
                rate: over / secs
              });
              pass++;
              Pop.clear();
              next();
            }, 500);
            return;
          }
          Pop.show(SWEEP_STYLE, { word: "COMBO X5", sub: "+120", silent: true });
        }, SWEEP_GAP);
      }
      next();
    }

    /* The sweep needs a round underway: a callout over the menu measures the
       menu. It starts itself on the first frame the game actually renders. */
    var benchStarted = false;
    function maybeBench() {
      if (!bench || benchStarted) return;
      benchStarted = true;
      ensure().textContent = "bench: starting…";
      setTimeout(benchRun, 1200);
    }

    return { frame: function () { maybeBench(); frame(); } };
  })();

  // --- Round clock -------------------------------------------------------
  var Round = (function () {
    var left = 0, running = false, fired = false;
    function reset() {
      left = CONFIG.gameSeconds; running = true; fired = false;
      if (CONFIG.gameSeconds > 0) HUD.setTime(left);
    }
    function tick(dt) {
      if (!running || CONFIG.gameSeconds <= 0) return;
      left = Math.max(0, left - dt);
      HUD.setTime(left);
      if (left <= 0 && !fired) {
        fired = true;
        // The game decides what "time up" means (end now, sudden death…).
        if (Game.onTimeUp) Game.onTimeUp();
        else endRound({ title: CONFIG.copy.timeUp });
      }
    }
    return {
      reset: reset, tick: tick, stop: function () { running = false; },
      left: function () { return left; },
      elapsed: function () { return CONFIG.gameSeconds - left; }
    };
  })();

  // --- The single way a round ends ---------------------------------------
  // result: { title, variant, score, stars, rows, track }
  function endRound(result) {
    if (State === "end") return;
    result = result || {};
    Loop.stop(); Round.stop();
    Music.duck(0.55, 0.8);        // let the end-screen cues sit on top
    var score = result.score == null ? Math.round(HUD.score()) : result.score;
    var best = Math.max(score, Store.get("bestScore", 0));
    Store.set("bestScore", best);
    setState("end");
    EndScreen.show({
      title: result.title || CONFIG.copy.gameOver,
      variant: result.variant || "",
      score: score,
      stars: result.stars,
      rows: result.rows || []
    });
    Ad.track("game_end", result.track || { score: score, best: best });
  }

  /* ===================================================================
     6. GAME — CHAINRING
     Rings close in on a bouncing ball; tap on contact — and contact is always
     on a beat of the bed, because every ring is launched on the musical grid
     Beat hands out and interpolated so it lands on its beat. Everything here is
     mechanic-specific: the shell, HUD, overlay, juice and end screen above
     are the shared motor.
     =================================================================== */
  var Game = (function () {
    var PALETTE = ["#00e5ff", "#ff2d95", "#c86bff", "#39ff14", "#ffe600", "#ff6b35", "#18dcff"];
    // The ball glows a hotter colour the higher the combo climbs.
    var BALL_COLORS = ["#00e5ff", "#39ff14", "#ffe600", "#ff9f1c", "#ff2d95", "#c86bff", "#ff1744"];
    // Timing grades, tightest window first: higher tier = more points + juice.
    // `win` is how far off the beat the tap may be, **in beats** — a ring lands
    // on the beat, so the grade is pure rhythm accuracy and the widest window
    // (0.46) covers all but the last sliver before the next landing.
    // `pop` is the extra class the timing callout wears (palettes in the SKIN).
    // `rate` pitches the "hit" sample: the tighter the tap, the brighter the
    // plink — the combo then pushes it further up (see popRing).
    var TIERS = [
      { name:"PERFECT", win:0.19, mult:3,   color:"#ffd43b", parts:14, flash:0.60, shake:13, rate:1.30, fxTier:3, pop:"pop-p3" },
      { name:"GOOD",    win:0.28, mult:2,   color:"#69db7c", parts:10, flash:0.38, shake:9,  rate:1.12, fxTier:2, pop:"pop-p2" },
      { name:"OK",      win:0.37, mult:1.5, color:"#4dabf7", parts:8,  flash:0.24, shake:6,  rate:0.98, fxTier:1, pop:"pop-p1" },
      { name:"CLOSE",   win:0.46, mult:1,   color:"#ffa94d", parts:6,  flash:0.14, shake:4,  rate:0.86, fxTier:0, pop:"pop-p0" }
    ];
    var MAXWIN = TIERS[TIERS.length - 1].win;
    // Shortest hop the solver may pick, as an angle along the rim (~330 px of
    // chord in a 600 px bowl). Below it the ball skims the rim instead of
    // crossing the arena, and the bounce stops reading as a bounce.
    var MINARC = 1.2;

    var C, arenaR, ball, segs, rings, trail, colorIdx, bgGrad, doom;
    var shockwaves, rays, ballPop, hitFx, tAnim;
    var held, heldT, startAt, readyPop;   // the lead-in hold, see CONFIG
    var lastA, prevA, lastBeats;          // the last two bounces, for variety
    var lastStyle, sinceLow;              // bounce shape, and time since the last fall
    var score, combo, bestCombo, stats;
    var maxScore, idealCombo;   // running "perfect play" reference for the stars

    function ballColor() { return BALL_COLORS[Math.min(combo, BALL_COLORS.length - 1)]; }
    function period() { return Beat.period() || 0.5; }
    function ballDist() {
      return Math.sqrt((ball.x - C.x) * (ball.x - C.x) + (ball.y - C.y) * (ball.y - C.y));
    }

    function reset() {
      onResize();                          // C and the bowl, before anything reads them
      // The round opens held: the ball floats at the centre until the bed is
      // audible (see CONFIG --- lead-in ---), then release() launches the chain.
      held = true; heldT = 0; startAt = null; readyPop = false;
      ball = { x: C.x, y: C.y - 90, vx: 0, vy: 0 };
      segs = []; rings = []; trail = []; colorIdx = 0; bgGrad = null; doom = null;
      lastA = null; prevA = null; lastBeats = 0; lastStyle = null; sinceLow = 0;
      shockwaves = []; rays = []; ballPop = 0; hitFx = 0; tAnim = 0;
      score = 0; combo = 0; bestCombo = 0;
      maxScore = 0; idealCombo = 0;
      stats = { perfect: 0, good: 0, ok: 0, close: 0, miss: 0 };
      HUD.setScoreNow(0);
      HUD.setLeft("x0", "COMBO");
    }

    function onResize() {
      C = { x: Layout.cx, y: Layout.cy }; bgGrad = null;
      // The bowl: the widest disc centred on the arena whose rim still leaves a
      // ring inside the frame, and never wider than the band gameplay owns.
      arenaR = Math.min(view.w / 2, Layout.h / 2) - CONFIG.arenaMargin;
    }

    /* Difficulty. The rings always land on the beat — what ramps is the flight,
       which shortens from travelBeats to travelBeatsEnd, so the same rhythm
       arrives with less and less run-up to read.                              */
    function travelBeats() {
      var k = clamp(Round.elapsed() / Math.max(1, CONFIG.gameSeconds), 0, 1);
      return CONFIG.travelBeats + (CONFIG.travelBeatsEnd - CONFIG.travelBeats) * k;
    }

    /* =====================================================================
       Ballistics — the ball's flight is solved, not simulated.
       ===================================================================== */

    // The one parabola that leaves P and reaches Q exactly T seconds later.
    function solve(px, py, qx, qy, T) {
      return { vx: (qx - px) / T,
               vy: (qy - py - 0.5 * CONFIG.gravity * T * T) / T };
    }
    // Does that parabola stay inside the bowl for the whole flight? Sampled:
    // an arc that bulged through the rim would bounce off nothing.
    function fits(px, py, v, T, lim) {
      for (var i = 1; i < 16; i++) {
        var u = T * i / 16;
        var x = px + v.vx * u - C.x;
        var y = py + v.vy * u + 0.5 * CONFIG.gravity * u * u - C.y;
        if (x * x + y * y > lim * lim) return false;
      }
      return true;
    }

    /* Bounce archetypes. Drawing the landing spot at random spread the ball
       around the rim but every *arc* still came out the same shape: a wide
       sweep at mid height, over and over. So each bounce is cast as one of a
       handful of shapes instead, biased against repeating the last one — and
       whenever the ball has stayed up in the top half for too long the next
       bounce is forced to be a fall. That fall is the break in the pattern:
       the ball drops back to the floor of the bowl and a new cycle starts.
         at     where on the rim it wants to land (bottom / flank / top / any)
         arc    how wide a spread around that it will accept, in radians
         rise   how high above its start the arc wants to climb, in px
         force  how hard it wants to be hit, 0 = speedMin .. 1 = speedMax
         span   nudge on how many beats the flight is allowed to take         */
    var STYLES = [
      { at:"bottom", arc:0.9, rise: 40,  force:0.15, span:0.6, weight:1.0 },  // straight back down
      { at:"bottom", arc:1.7, rise:210,  force:0.35, span:1.0, weight:1.0 },  // sweep along the floor
      { at:"flank",  arc:1.4, rise:180,  force:0.50, span:1.2, weight:1.2 },  // out to a side
      { at:"top",    arc:1.1, rise:420,  force:0.85, span:1.5, weight:0.9 },  // climb to the ceiling
      { at:"any",    arc:2.4, rise:340,  force:0.70, span:1.7, weight:0.8 }   // high lob, anywhere
    ];
    function styleAngle(s) {
      if (s.at === "bottom") return Math.PI * 0.5;                 // +y is down
      if (s.at === "top")    return -Math.PI * 0.5;
      if (s.at === "flank")  return Rand.chance(0.5) ? 0 : Math.PI;
      return Rand.range(-Math.PI, Math.PI);
    }
    function pickStyle(overdue) {
      // Overdue for a break: come back down whatever else was in the running.
      if (overdue) return STYLES[Rand.chance(0.6) ? 0 : 1];
      var w = [], tot = 0, i;
      for (i = 0; i < STYLES.length; i++) {
        w[i] = STYLES[i].weight * (STYLES[i] === lastStyle ? 0.25 : 1);
        tot += w[i];
      }
      var p = Rand.range(0, tot);
      for (i = 0; i < STYLES.length; i++) { p -= w[i]; if (p <= 0) return STYLES[i]; }
      return STYLES[0];
    }

    // Shortest angle between two directions, in radians.
    function angDist(a, b) {
      var d = Math.abs(a - b) % (Math.PI * 2);
      return d > Math.PI ? Math.PI * 2 - d : d;
    }
    // 0 right on top of `ref`, 1 a good way away from it. Everything is far
    // from a landing that has not happened yet.
    function awayFrom(a, ref) {
      return ref === null ? 1 : clamp(angDist(a, ref) / 1.5, 0, 1);
    }

    /* Plan one bounce: from where the ball leaves the rim, choose how many beats
       it flies and where on the rim it comes back down.

       Every candidate here is an exact solution, so the choice is never about
       whether the ball can make it — it is only about which arc reads best, and
       "best" is deliberately different on every bounce. Picking the single
       highest-scoring arc gave the ball one habit and it kept it: the widest
       arc is the one across the middle, so it settled into a left-right
       metronome. So each call now draws its own character — how hard this
       bounce is hit and roughly where it is aimed — weights every candidate
       against that, pushes back on anything landing near the last two spots or
       repeating the last flight length, and then picks at *random* among what
       is left. Short snaps, high lobs and long crossings all stay on the table. */
    function planFlight(px, py) {
      var lim = arenaR - CONFIG.ballR, per = period();
      var prog = clamp(Round.elapsed() / Math.max(1, CONFIG.gameSeconds), 0, 1);
      // A flight longer than one beat is what leaves the beats it passes over
      // empty — that, and nothing else, is where the reading difficulty lives,
      // so long flights are worth more and more as the round runs out. The
      // opening is an unbroken pulse whatever else happens: the player needs a
      // metronome before they can be asked to read a gap in it.
      var wLong = Round.elapsed() < CONFIG.steadyFor ? 0.02
                : CONFIG.gapChance + (CONFIG.gapChanceEnd - CONFIG.gapChance) * prog;
      // What shape this bounce wants to be, and how hard it wants to be hit.
      // Once the ball is overdue for a fall the shape is not a preference any
      // more: anything that does not come back down is all but ruled out below.
      var overdue = sinceLow >= CONFIG.breakAfter;
      var st = pickStyle(overdue);
      var spanW = [0, 1, wLong * 1.6 * st.span, wLong * 0.5 * st.span];
      var wantA = styleAngle(st) + Rand.range(-0.35, 0.35);
      var wantRise = st.rise * Rand.range(0.7, 1.3);
      var wantSpeed = CONFIG.speedMin + (CONFIG.speedMax - CONFIG.speedMin)
                    * clamp(st.force + Rand.range(-0.15, 0.15), 0, 1);
      var a0 = Math.atan2(py - C.y, px - C.x);
      // `sum` is what keeps `spanW` honest: a two-beat flight can reach far more
      // of the rim than a one-beat snap, so without normalising per length the
      // sheer number of long candidates would decide the tempo on its own.
      var cands = [], sum = [0, 0, 0, 0], loose = null, looseW = -1;
      for (var beats = 1; beats <= 3; beats++) {
        var T = beats * per;
        for (var i = 1; i < 28; i++) {
          var off = Math.PI * 2 * i / 28;
          if (off < MINARC || off > Math.PI * 2 - MINARC) continue;   // no skim
          var a1 = a0 + off;
          var qx = C.x + Math.cos(a1) * lim, qy = C.y + Math.sin(a1) * lim;
          var v = solve(px, py, qx, qy, T);
          if (!fits(px, py, v, T, lim)) continue;
          var launch = Math.sqrt(v.vx * v.vx + v.vy * v.vy);
          var vy1 = v.vy + CONFIG.gravity * T;
          var land = Math.sqrt(v.vx * v.vx + vy1 * vy1);
          /* How far the arc climbs above the point it left. This is what tells
             a flat skim from a lob, and leaving it unweighted was what made
             every bounce come out the same shape.                            */
          var ua = clamp(-v.vy / CONFIG.gravity, 0, T);         // time of the apex
          var rise = -(v.vy * ua + 0.5 * CONFIG.gravity * ua * ua);
          var w = 260 / (260 + Math.abs(land - wantSpeed));     // the force drawn
          w *= st.arc / (st.arc + angDist(a1, wantA));          // where it lands
          w *= 200 / (200 + Math.abs(rise - wantRise));         // how high it goes
          w *= 0.12 + 0.88 * awayFrom(a1, lastA);               // not there again
          w *= 0.45 + 0.55 * awayFrom(a1, prevA);
          if (beats === lastBeats) w *= 0.6;                    // nor that length
          if (overdue && qy < C.y + lim * 0.34) w *= 0.02;       // the break is due
          var cand = { v: v, x1: qx, y1: qy, a1: a1, beats: beats, T: T, w: w };
          if (launch < CONFIG.speedMin || launch > CONFIG.speedMax || land > CONFIG.speedMax) {
            if (w > looseW) { looseW = w; loose = cand; }       // exact, just harsh
            continue;
          }
          cands.push(cand); sum[beats] += w;
        }
      }
      // Nothing inside the comfort band: take the likeliest exact solution
      // anyway. It is still a real parabola onto a real ring, only harsher.
      var chosen = null;
      if (!cands.length) chosen = loose;
      else {
        var total = 0, n;
        for (n = 0; n < cands.length; n++) {
          cands[n].w *= spanW[cands[n].beats] / sum[cands[n].beats];
          total += cands[n].w;
        }
        var pick = Rand.range(0, total);
        for (n = 0; n < cands.length; n++) { pick -= cands[n].w; if (pick <= 0) { chosen = cands[n]; break; } }
        if (!chosen) chosen = cands[cands.length - 1];
      }
      lastStyle = st;
      // A landing in the lower third of the bowl resets the break counter: that
      // is the ball touching the floor, which is what the pattern is built on.
      sinceLow = chosen && chosen.y1 > C.y + lim * 0.34 ? 0 : sinceLow + 1;
      return chosen;
    }

    // A ring is launched for every planned bounce: it is the surface the ball
    // will turn around on, and it closes onto the rim exactly on that beat.
    function spawnRing(slot) {
      var span = travelBeats();
      var ring = { hit: slot, born: slot - span, span: span, r: CONFIG.spawnR,
                   color: PALETTE[colorIdx++ % PALETTE.length], pulse: 0, struck: false };
      rings.push(ring);
      return ring;
    }

    function addSeg(px, py, b0) {
      var f = planFlight(px, py);
      // Remember what this bounce did, so the next two are pushed elsewhere.
      prevA = lastA; lastA = f.a1; lastBeats = f.beats;
      var seg = { b0: b0, b1: b0 + f.beats, T: f.T, x0: px, y0: py,
                  vx: f.v.vx, vy: f.v.vy, x1: f.x1, y1: f.y1 };
      seg.ring = spawnRing(seg.b1);
      seg.color = seg.ring.color;
      segs.push(seg);
      return seg;
    }

    // Keep the chain of bounces planned a full ring flight ahead, so every ring
    // gets its whole run-up before the ball needs it.
    function planAhead(now) {
      var guard = 0, horizon = now + travelBeats() + 1;
      while (segs.length && segs[segs.length - 1].b1 < horizon && guard++ < 16) {
        var last = segs[segs.length - 1];
        addSeg(last.x1, last.y1, last.b1);
      }
    }

    // Place the ball on its current parabola, straight off the musical clock —
    // no integration, so it cannot drift away from the ring waiting for it.
    function placeBall(now) {
      var s = segs[0], u = (now - s.b0) * period();
      ball.x = s.x0 + s.vx * u;
      ball.y = s.y0 + s.vy * u + 0.5 * CONFIG.gravity * u * u;
      ball.vx = s.vx; ball.vy = s.vy + CONFIG.gravity * u;
    }

    // The ball reaches the rim and the ring turns it around. The impact is worth
    // its own kick of juice whether or not the player tapped it.
    function bounce(seg) {
      Fx.burst(seg.x1, seg.y1, { color: seg.color, count: 6, speed: 280, size: 5, life: 0.35 });
      spawnShock(arenaR, seg.color, 0.5);
    }

    /* =====================================================================
       Lead-in — hold the round until the bed is actually playing.
       `Beat.locked()` turns true as soon as the music has a grid to lock onto;
       when there is no track at all (muted, or a decode the WebView refused)
       `leadInMax` lets the round go anyway and the clock falls back to dt.
       ===================================================================== */
    function hold(dt) {
      heldT += dt;
      // Hold the clock at full: waiting for the bed must not eat into the run.
      Round.reset();
      if (!readyPop) {
        readyPop = true;
        Pop.show("alert", { word: "GET READY", sub: "FEEL THE BEAT", hold: 700 });
      }
      if (startAt === null && (Beat.locked() || heldT >= CONFIG.leadInMax)) {
        startAt = Beat.on() ? Beat.next(1) + CONFIG.leadInBeats : Beat.beats();
        /* Arm the whole chain now, not on the drop. The first bounce is only a
           beat or two after the ball leaves the centre, but its ring needs a
           full flight of run-up — planning here is what buys it: the rings fly
           in *during* the lead-in, over the music, and the arena is already
           populated by the time the ball starts falling. Nothing lands before
           `startAt`, so none of them can be missed while the round is held.  */
        addSeg(C.x, C.y - 90, startAt);
        planAhead(startAt);
      }
      /* Float the ball on the spot, easing the bob out as the drop approaches
         so it is exactly on the launch point when the flight takes over. The
         rim behind it flares on every beat, so the tempo is readable before the
         first ring even gets close.                                          */
      var settle = startAt === null ? 1 : clamp((startAt - Beat.beats()) / CONFIG.leadInBeats, 0, 1);
      ball.x = C.x;
      ball.y = C.y - 90 + Math.sin(tAnim * 2.4) * 24 * settle;
      ball.vx = 0; ball.vy = 0;
      trail.length = 0;
    }

    function release() {
      held = false;
      Fx.flash("#ffffff", 0.18);
      Pop.show("alert", { word: "GO!", hold: 200 });
    }

    // Timer out: a spiked ring is released. It cannot be tapped away — when it
    // reaches the ball the run is over. Keeps the last seconds tense.
    function spawnDoom() {
      // Just past the corners of the frame, not at spawnR: this one closes at a
      // fixed speed and must not take a beat longer than the rings do.
      doom = { r: 750 };
      Sound.clip("doom", 0.85);                           // warm mallet taps, at pitch
      Pop.show("danger", { word: "SUDDEN DEATH", sub: "DODGE THE SPIKES", hold: 1200 });
      Overlay.vignette("#ff2d55", 1);                     // stays on until the end
    }

    // A ring of energy expanding from the centre. As it sweeps past each ring
    // it lights that ring up, so one tap ripples through the whole stack.
    function spawnShock(startR, color, power) {
      shockwaves.push({ r: Math.max(0, startR), color: color, power: power || 1,
        speed: 640 + (power || 1) * 260, life: 0, maxLife: 0.55 + (power || 1) * 0.15, hit: {} });
    }
    function spawnRays(x, y, color, n) {
      for (var i = 0; i < n; i++) {
        rays.push({ x: x, y: y, a: (i / n) * Math.PI * 2 + Rand.range(-0.1, 0.1),
          len: Rand.range(120, 260), life: 0, maxLife: 0.45, color: color });
      }
    }

    function addScore(amount, color) {
      score += amount;
      HUD.setScore(score);
      HUD.punch(color);
    }

    // Every ring that leaves play (tapped OR missed) is one scoring chance. We
    // tally what a flawless chain would have scored for the exact same set of
    // chances: that is the 100% reference the stars measure against.
    function chance() {
      idealCombo++;
      maxScore += Math.round(10 * idealCombo * 2);                            // a solid GOOD
      if (idealCombo % CONFIG.chainEvery === 0) maxScore += idealCombo * 20;   // ideal chain bonus
    }

    function popRing(ring, tier, gained) {
      // Juice scales with the combo: the deeper the chain, the bigger the bang.
      var cf = Math.min(2.4, 1 + combo * 0.14);
      Fx.burst(ball.x, ball.y, { color: ring.color, count: Math.round(tier.parts * cf), speed: 420, size: 6, life: 0.5 });
      if (tier.name === "PERFECT") Fx.burst(ball.x, ball.y, { color: "#ffffff", count: Math.round(5 * cf), speed: 500, size: 5, life: 0.45 });
      // The ring is not removed here: it is the surface the ball is about to
      // bounce on. It is marked spent, drawn as a ghost, and cleared the instant
      // the ball actually reaches it (see the ring pass in update).
      ring.struck = true;
      addScore(gained, tier.color);
      spawnShock(arenaR, tier.color, Math.min(2.2, 0.6 + combo * 0.12));
      ballPop = 1; hitFx = Math.min(1, 0.5 + combo * 0.06);
      // The grade and the gain ride out of the impact point as one comic pop,
      // tinted (and sized) by the timing tier — see the SKIN block. Kept under
      // one beat so two callouts never stack up while a chain is running.
      Pop.show("score", { word: tier.name + " x" + combo, sub: "+" + gained, cls: tier.pop,
                          at: { x: clamp(ball.x, 200, view.w - 200), y: ball.y - 56 },
                          enter: 200, hold: 150, exit: 320 });
      /* Flash and shake are deliberately NOT scaled by the combo: a chain lands
         one hit per beat, and a combo-scaled flash never decays in the 0.47 s in
         between — the screen just sits white. The escalation lives in the
         particles, the shockwaves and the rising pitch instead. */
      Fx.flash("#ffffff", tier.flash * 0.5);
      Fx.shake(tier.shake * Math.min(1.4, cf), 0.22);
      // Pitch climbs with the chain for a rising, satisfying ladder of hits:
      // the sample is pitched by the timing tier, then by the combo depth.
      Sound.clip("hit", 0.75, tier.rate + Math.min(combo, 14) * 0.045);
      // A PERFECT gets a bright confirmation layered on top of the plink.
      if (tier.name === "PERFECT") Sound.clip("perfect", 0.55, 1 + Math.min(combo, 10) * 0.02);
    }

    // Fired every `chainEvery` hits: stacked shockwaves, radial rays, an edge
    // pulse, a bonus and a rising arpeggio — the payoff for a clean chain.
    function triggerChain() {
      var col = ballColor();
      spawnShock(arenaR, "#ffffff", 2.2);
      spawnShock(arenaR, col, 1.7);
      spawnShock(Math.max(0, arenaR - 60), col, 1.3);
      spawnRays(ball.x, ball.y, col, 12);
      Fx.burst(ball.x, ball.y, { color: "#ffffff", count: 22, speed: 520, size: 6, life: 0.55 });
      Fx.burst(ball.x, ball.y, { color: col, count: 26, speed: 460, size: 7, life: 0.6 });
      var bonus = combo * 20;
      addScore(bonus, col);
      Fx.flash("#ffffff", 0.7);
      Fx.shake(16, 0.35);
      // One discreet reward sticker instead of a hero callout: the canvas juice
      // above already carries the impact, and the rings keep closing in while
      // the pop is up. It sits high, clear of the ball and of the score pops.
      Pop.show("bonus", { word: "MEGA BONUS", sub: "x" + combo + "  +" + bonus,
                          at: "upper", enter: 240, hold: 260, exit: 220 });
      Overlay.vignette(col, 1, 600);                     // edge glow in ball colour
      Sound.clip("chain", 0.8, 1 + Math.min(combo, 20) * 0.012);   // ascending run
    }

    // Tap: grade the ring nearest to its landing and score it, else break the
    // chain. "Nearest" is measured in beats, not pixels — the ring lands on the
    // ball on its beat, so the gap that matters is the timing one.
    function onDown() {
      if (held) return;                     // the lead-in is not part of the run
      var now = Beat.beats(), best = null, bestGap = 1e9;
      for (var i = 0; i < rings.length; i++) {
        if (rings[i].struck) continue;      // already scored, waiting for the ball
        var gap = Math.abs(rings[i].hit - now);
        if (gap < bestGap) { bestGap = gap; best = rings[i]; }
      }
      if (!best) return;
      if (bestGap <= MAXWIN) {
        var tier = TIERS[TIERS.length - 1];
        for (var t = 0; t < TIERS.length; t++) { if (bestGap <= TIERS[t].win) { tier = TIERS[t]; break; } }
        combo++;
        if (combo > bestCombo) bestCombo = combo;
        stats[tier.name.toLowerCase()]++;
        chance();
        var gained = Math.round(10 * combo * tier.mult);
        popRing(best, tier, gained);
        HUD.setLeft("x" + combo, "COMBO", combo >= CONFIG.chainEvery ? "hot" : "");
        if (combo % CONFIG.chainEvery === 0) triggerChain();
      } else {
        // Mistimed tap: break the chain (no score penalty — stay forgiving).
        // No ring within 0.7 of a beat means the ball is mid-flight over a beat
        // no ring lands on: name it, because reading the arc is the whole skill.
        combo = 0; stats.miss++;
        HUD.setLeft("x0", "COMBO");
        Pop.show("score", { word: bestGap > 0.7 ? "EMPTY BEAT" : "MISS", cls: "pop-miss", hold: 180,
                            at: { x: clamp(ball.x, 200, view.w - 200), y: ball.y - 56 } });
        Fx.shake(5, 0.2);
        Sound.clip("miss", 0.6);
      }
    }

    function update(dt) {
      tAnim += dt;
      var now = Beat.beats();

      // Music first: the ball stays put until the bed is audible. The rings are
      // already on their way in by then — hold() arms the chain, not release().
      if (held) {
        hold(dt);
        if (startAt !== null && now >= startAt) release();
      }
      if (!held) {
        // Walk the plan forward: every segment that has run out is a bounce, and
        // the segment that follows was solved from its landing point.
        planAhead(now);
        while (segs.length > 1 && now >= segs[0].b1) { bounce(segs[0]); segs.shift(); }
        placeBall(now);
        trail.push({ x: ball.x, y: ball.y });
        if (trail.length > 16) trail.shift();
      }

      /* Close the rings in. A ring's radius is a straight interpolation from
         spawnR down to the rim over its flight, so it lands on the rim — and on
         the ball, which the plan has arriving there at the same instant — on
         its beat. A struck ring hangs on as a ghost until the ball reaches it,
         an untapped one for one CLOSE window past the bounce (still tappable,
         see onDown) and is then a miss.                                       */
      for (var i = rings.length - 1; i >= 0; i--) {
        var ring = rings[i];
        var p = clamp((now - ring.born) / ring.span, 0, 1);
        ring.r = CONFIG.spawnR + (arenaR - CONFIG.spawnR) * p;
        if (ring.struck) {
          if (now >= ring.hit) rings.splice(i, 1);        // the ball has hit it
        } else if (now > ring.hit + MAXWIN) {
          Fx.burst(ball.x, ball.y, { color: ring.color, count: 5, speed: 260, size: 5, life: 0.4 });
          rings.splice(i, 1);
          combo = 0; chance();                 // missed the beat (still a chance faced)
          HUD.setLeft("x0", "COMBO");
          Sound.clip("miss", 0.45, 1.15);                 // quiet: the tap was never made
        }
      }

      // Game-over ring closes in and ends the run when it reaches the ball.
      if (doom) {
        doom.r -= CONFIG.doomSpeed * dt;
        if (doom.r <= ballDist() + CONFIG.ballR) return end();
      }

      // Shockwaves expand and light up each ring the front passes through.
      for (var s = shockwaves.length - 1; s >= 0; s--) {
        var sw = shockwaves[s];
        sw.life += dt; sw.r += sw.speed * dt;
        for (var ri = 0; ri < rings.length; ri++) {
          if (!sw.hit[ri] && Math.abs(rings[ri].r - sw.r) < 26) {
            sw.hit[ri] = 1;
            rings[ri].pulse = Math.min(1.4, rings[ri].pulse + sw.power);
            var d = ballDist() || 1;
            Fx.burst(C.x + rings[ri].r * (ball.x - C.x) / d,
                     C.y + rings[ri].r * (ball.y - C.y) / d,
                     { color: rings[ri].color, count: 3, speed: 220, size: 4, life: 0.35 });
          }
        }
        if (sw.life >= sw.maxLife) shockwaves.splice(s, 1);
      }
      for (var rp = 0; rp < rings.length; rp++) {
        if (rings[rp].pulse > 0) rings[rp].pulse = Math.max(0, rings[rp].pulse - dt * 3.2);
      }
      for (var ry = rays.length - 1; ry >= 0; ry--) {
        rays[ry].life += dt;
        if (rays[ry].life >= rays[ry].maxLife) rays.splice(ry, 1);
      }
      if (ballPop > 0) ballPop = Math.max(0, ballPop - dt * 4);
      if (hitFx > 0) hitFx = Math.max(0, hitFx - dt * 2.5);
    }

    function render() {
      // Dark backdrop. The radial gradient is built once and reused (cheap).
      if (!bgGrad) {
        bgGrad = ctx.createRadialGradient(view.w / 2, C.y, 60, view.w / 2, C.y, 730);
        bgGrad.addColorStop(0, "#151439");
        bgGrad.addColorStop(0.6, "#0a0a1c");
        bgGrad.addColorStop(1, "#05050e");
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, view.w, view.h);

      var bc = ballColor();
      var now = Beat.beats(), beat = Beat.pulse(1);

      /* The rim (where every ring lands and where the ball turns around), the
         dotted guide along the ball's flight and the marker on its landing spot
         are all deliberately NOT drawn: the closing rings and the ball itself
         carry the read, and the arena stays clean.                            */

      // Rings — plain solid strokes (no shadowBlur: it wrecks the frame rate).
      // The ring inside the timing window reads "hot" via a wider translucent
      // stroke behind it. Hot means tappable, so the window it lights up over is
      // exactly the one onDown grades against. A struck ring is a pale ghost:
      // already scored, still there for the ball to bounce off.
      for (var i = 0; i < rings.length; i++) {
        var ring = rings[i], hot = !ring.struck && Math.abs(ring.hit - now) <= MAXWIN;
        var rr = Math.max(1, ring.r), pl = ring.pulse || 0;
        if (ring.struck) {
          ctx.globalAlpha = 0.3; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(C.x, C.y, rr, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
          continue;
        }
        if (pl > 0) {
          ctx.globalAlpha = Math.min(0.5, pl * 0.4); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 18 + pl * 16;
          ctx.beginPath(); ctx.arc(C.x, C.y, rr, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
        }
        if (hot) {
          ctx.globalAlpha = 0.22; ctx.strokeStyle = ring.color; ctx.lineWidth = 20;
          ctx.beginPath(); ctx.arc(C.x, C.y, rr, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
        }
        ctx.strokeStyle = pl > 0 ? "#ffffff" : ring.color;
        ctx.lineWidth = (hot ? 11 : 7) + pl * 6;
        ctx.beginPath(); ctx.arc(C.x, C.y, rr, 0, Math.PI * 2); ctx.stroke();
      }

      // Shockwave fronts.
      for (var sw = 0; sw < shockwaves.length; sw++) {
        var w = shockwaves[sw], wp = 1 - w.life / w.maxLife;
        if (wp <= 0) continue;
        ctx.globalAlpha = wp * 0.85; ctx.strokeStyle = w.color; ctx.lineWidth = 2 + w.power * 4;
        ctx.beginPath(); ctx.arc(C.x, C.y, Math.max(1, w.r), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Game-over ring — a red spiked circle closing in (spikes point inward).
      if (doom) {
        var DR = Math.max(1, doom.r), spikes = 40, spikeLen = 28;
        ctx.strokeStyle = "#ff2d55"; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.arc(C.x, C.y, DR, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "#ff2d55"; ctx.beginPath();
        for (var d = 0; d < spikes; d++) {
          var da = (d / spikes) * Math.PI * 2 + tAnim * 0.5, a1 = da + 0.045, a2 = da - 0.045;
          ctx.moveTo(C.x + Math.cos(a1) * DR, C.y + Math.sin(a1) * DR);
          ctx.lineTo(C.x + Math.cos(da) * (DR - spikeLen), C.y + Math.sin(da) * (DR - spikeLen));
          ctx.lineTo(C.x + Math.cos(a2) * DR, C.y + Math.sin(a2) * DR);
          ctx.closePath();
        }
        ctx.fill();
      }

      // Ball trail — one stroked streak of the recent path.
      if (trail.length > 1) {
        ctx.globalAlpha = Math.min(0.85, 0.5 + combo * 0.03);
        ctx.strokeStyle = bc;
        ctx.lineWidth = CONFIG.ballR * (0.8 + Math.min(0.6, combo * 0.05));
        ctx.lineJoin = "round"; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
        for (var t = 1; t < trail.length; t++) ctx.lineTo(trail[t].x, trail[t].y);
        ctx.stroke(); ctx.globalAlpha = 1;
      }

      // Milestone rays shooting out of the ball.
      for (var r2 = 0; r2 < rays.length; r2++) {
        var ry = rays[r2], rp = 1 - ry.life / ry.maxLife;
        if (rp <= 0) continue;
        var l = ry.len * (0.4 + 0.6 * (1 - rp));
        ctx.globalAlpha = rp * 0.8; ctx.strokeStyle = ry.color; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(ry.x + Math.cos(ry.a) * 18, ry.y + Math.sin(ry.a) * 18);
        ctx.lineTo(ry.x + Math.cos(ry.a) * (18 + l), ry.y + Math.sin(ry.a) * (18 + l));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Ball — cheap "glow" from concentric circles: halo + body + core. The
      // halo breathes on the beat so the ball itself keeps the tempo.
      var br = CONFIG.ballR * (1 + ballPop * 0.5 + beat * beat * 0.10);
      ctx.globalAlpha = 0.3 + hitFx * 0.4 + beat * beat * 0.12; ctx.fillStyle = bc;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, br * (1.7 + ballPop * 0.6 + beat * beat * 0.25), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = bc;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, br, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, br * (0.5 + ballPop * 0.25), 0, Math.PI * 2); ctx.fill();
    }

    // The clock hitting zero does not end the run: it releases the spiked ring.
    function onTimeUp() { if (!doom) spawnDoom(); }

    function end() {
      // Stars by absolute score: 0 | 1–2999 | 3000–5999 | 6000+.
      var stars = score <= 0 ? 0 : score < 3000 ? 1 : score < 6000 ? 2 : 3;
      var perfect = maxScore > 0 && score >= maxScore;   // matched flawless play
      endRound({
        title: perfect ? "PERFECT" : CONFIG.copy.gameOver,
        variant: perfect ? "perfect" : "",
        score: score,
        stars: stars,
        rows: [
          { label: "PERFECT",   value: stats.perfect, grade: "gold" },
          { label: "GOOD",      value: stats.good,    grade: "good" },
          { label: "OK",        value: stats.ok },
          { label: "CLOSE",     value: stats.close,   grade: "warn" },
          { label: "MISS",      value: stats.miss,    grade: "bad" },
          { label: "MAX COMBO", value: bestCombo,     grade: "accent" }
        ],
        track: { score: score, bestCombo: bestCombo, stars: stars, perfect: perfect, stats: stats }
      });
    }

    return { reset: reset, onDown: onDown, update: update, render: render,
             onTimeUp: onTimeUp, onResize: onResize };
  })();

  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
    Perf.frame();    // no-op unless the URL carries ?perf=1
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
