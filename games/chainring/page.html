<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chainring</title>
<!--
  CHAINRING — built on the PLAYABLE MOTOR (template/game-template.html).
  Sections 3/4/5/7 are the shared engine: do not fork them, extend them.

  Mechanic: a ball falls and bounces under gravity inside an invisible bowl at
  the centre of Layout (the band the engine keeps clear of the HUD, the CTA bar
  and the device insets), sized so the rings around it always fit the frame.
  Concentric rings close in from outside; TAP the instant one reaches the ball.
  A round opens on a short hold so the music is audible first. Timing is
  graded MISS / CLOSE / OK / GOOD / PERFECT, consecutive hits build a combo
  multiplier, and every 5th hit fires a chain-reaction celebration. When the
  round clock runs out a spiked game-over ring is released instead of ending
  the run: it closes in and the run ends when it touches the ball.
-->
<style>{{MOTOR_CSS}}{{SKIN_CSS}}</style>
</head>
<body>

<div id="safe-probe"></div>
<div id="backdrop"></div>

<div id="stage">
  <div id="frame">

    <canvas id="game" width="720" height="1280"></canvas>

    <div id="overlay">
      <div id="ov-toasts"></div>
      <div id="ov-banner"><div id="ov-banner-main"></div><div id="ov-banner-sub"></div></div>
      <div id="ov-reward"></div>
      <div id="ov-vignette"></div>
      <!-- comic callouts sit last: they are the loudest layer of the overlay -->
      <div id="ov-pops"></div>
    </div>

    <div id="hud" class="hidden">
      <div id="hud-left"></div>
      <div id="hud-center"><div id="hud-score">0</div><div id="hud-score-lbl">SCORE</div></div>
      <div id="hud-right"></div>
    </div>

    <div id="cta-bar" class="hidden">
      <button class="btn sm" id="btn-cta">INSTALL NOW</button>
    </div>

    <div id="screen-loading" class="screen">
      <div class="spinner"></div>
      <div class="loading-lbl">Loading…</div>
    </div>

    <div id="screen-intro" class="screen hidden">
      <img id="app-icon" alt="">
      <div id="intro-title">CHAINRING</div>
      <div id="intro-tagline">Tap the instant a <b class="w-ball">ball</b> hits a <b class="w-ring">ring</b></div>
      <div id="intro-demo">
        <div class="demo-stage">
          <div class="demo-track"></div>
          <div class="demo-beam"></div>
          <div class="demo-target"><span class="demo-ripple"></span><span class="demo-ripple d2"></span></div>
          <div class="demo-hand"></div>
          <div class="demo-arrow"></div>
        </div>
        <div class="demo-caption" id="demo-caption"></div>
      </div>
      <button class="btn lg" id="btn-start">TAP TO PLAY</button>
    </div>

    <div id="screen-end" class="screen hidden">
      <canvas id="confetti" width="720" height="1280"></canvas>
      <div class="eo-title" id="eo-title">GAME OVER</div>
      <div class="eo-scorelbl" id="eo-scorelbl">FINAL SCORE</div>
      <div class="eo-score" id="eo-score">0</div>
      <div class="eo-stars" id="eo-stars">
        <span class="star" id="star-1">★</span>
        <span class="star" id="star-2">★</span>
        <span class="star" id="star-3">★</span>
      </div>
      <div class="eo-stats" id="eo-stats"></div>
      <button class="btn lg" id="btn-install">PLAY THE FULL GAME</button>
      <button class="link" id="btn-replay">Replay the demo</button>
    </div>

  </div>
</div>

{{SCRIPT}}
