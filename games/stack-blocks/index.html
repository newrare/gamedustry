<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stack Blocks</title>
<!--
  EXAMPLE GAME 2 — "Stack Blocks"
  Mechanic: a block slides back and forth. Tap to drop it onto the tower.
  The overhang is sliced off; the block gets narrower. Miss completely and
  the run ends. The camera scrolls up as the tower grows.
  Built from template/game-template.html — see docs/CREATING_A_GAME.md.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1e3f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; touch-action:none; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; color:#fff; padding:24px; transition:opacity .25s ease; z-index:10; }
  .screen.hidden { opacity:0; pointer-events:none; }
  .title { font-size:clamp(24px,8vw,48px); font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.25); }
  .subtitle { margin-top:12px; font-size:clamp(14px,4vw,20px); opacity:.9; }
  .btn { margin-top:24px; padding:16px 36px; border:none; border-radius:999px;
    font-size:clamp(16px,5vw,22px); font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#42e6c8,#0aa385); box-shadow:0 8px 24px rgba(10,163,133,.5);
    animation:pulse 1.4s ease-in-out infinite; }
  .btn:active { transform:scale(.96); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  #hud { position:absolute; top:0; left:0; right:0; z-index:15; display:flex; justify-content:center;
    padding:16px; color:#fff; font-weight:900; font-size:clamp(28px,9vw,52px);
    pointer-events:none; text-shadow:0 3px 8px rgba(0,0,0,.5); }
  #hud.hidden { display:none; }
  #hint { position:absolute; top:50%; left:0; right:0; text-align:center; z-index:15;
    color:#fff; font-weight:800; font-size:clamp(16px,5vw,24px); pointer-events:none;
    opacity:.9; animation:blink 1s ease-in-out infinite; }
  #hint.hidden { display:none; }
  @keyframes blink { 0%,100%{opacity:.35;} 50%{opacity:1;} }
  #cta-bar { position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center;
    justify-content:center; padding:12px; background:rgba(0,0,0,.35); backdrop-filter:blur(4px); }
  #cta-bar.hidden { display:none; }
  .spinner { width:46px; height:46px; border-radius:50%; border:5px solid rgba(255,255,255,.2);
    border-top-color:#fff; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="stage"><canvas id="game"></canvas></div>

<div id="hud" class="hidden"><span id="score">0</span></div>
<div id="hint" class="hidden">TAP TO DROP</div>

<div id="screen-loading" class="screen">
  <div class="spinner"></div><div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<div id="screen-intro" class="screen hidden">
  <div class="title">STACK BLOCKS</div>
  <div class="subtitle">Tap to drop the block.<br>Stack as high as you can!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice tower!</div>
  <div class="subtitle">Height: <span id="end-score">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<script>
"use strict";
(function () {

  /* ---------- 1. CONFIG ---------- */
  var CONFIG = {
    title: "STACK BLOCKS",
    gameSeconds: 0,               // endless: run ends on a miss
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    designWidth: 720, designHeight: 1280, bg: "#0b1e3f",
    blockHeight: 64,              // px per block
    startWidth: 460,              // width of the first movable block
    baseSpeed: 300,               // px/s horizontal, ramps up with height
    perfectTolerance: 8           // px overlap error still counted as perfect
  };

  /* ---------- 2. ASSETS (none) ---------- */
  var ASSETS = { images: {}, sounds: {} };

  /* ---------- 3. ENGINE (shared plumbing) ---------- */
  function $(id){ return document.getElementById(id); }
  var canvas=$("game"), ctx=canvas.getContext("2d");
  var view={ w:CONFIG.designWidth, h:CONFIG.designHeight, scale:1 };
  function fitCanvas(){
    var vw=window.innerWidth, vh=window.innerHeight, dpr=Math.min(window.devicePixelRatio||1,2);
    var scale=Math.min(vw/view.w, vh/view.h); view.scale=scale;
    canvas.width=Math.round(view.w*dpr); canvas.height=Math.round(view.h*dpr);
    canvas.style.width=Math.round(view.w*scale)+"px"; canvas.style.height=Math.round(view.h*scale)+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  var Input=(function(){
    var L={down:[]};
    function emit(e){ L.down.forEach(function(fn){ fn(); }); }
    canvas.addEventListener("mousedown", emit);
    canvas.addEventListener("touchstart", function(e){ e.preventDefault(); emit(e); }, {passive:false});
    return { on:function(fn){ L.down.push(fn); } };
  })();

  var Loop=(function(){
    var running=false,last=0,u=null,r=null;
    function frame(now){ if(!running)return; var dt=Math.min((now-last)/1000,0.05); last=now; if(u)u(dt); if(r)r(); requestAnimationFrame(frame); }
    return { start:function(uu,rr){ u=uu;r=rr;running=true;last=performance.now();requestAnimationFrame(frame); },
             stop:function(){ running=false; } };
  })();

  var Sound=(function(){
    var actx=null;
    function ensure(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
      if(actx&&actx.state==="suspended")actx.resume(); return actx; }
    function beep(freq,dur,type){ var a=ensure(); if(!a)return;
      var o=a.createOscillator(),g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq||440;
      g.gain.setValueAtTime(0.001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.3,a.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(dur||0.15));
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.15)); }
    return { unlock:ensure, beep:beep };
  })();

  var Store={ get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
              set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

  /* ---------- 4. AD NETWORK GLUE ---------- */
  var Ad=(function(){
    function platform(){ var ua=navigator.userAgent||""; if(/iPad|iPhone|iPod/.test(ua))return "ios"; if(/android/i.test(ua))return "android"; return "fallback"; }
    function targetUrl(){ return CONFIG.storeUrl[platform()]||CONFIG.storeUrl.fallback; }
    function whenReady(cb){ if(!window.mraid)return cb();
      if(mraid.getState&&mraid.getState()==="loading"){ mraid.addEventListener("ready",cb); } else cb(); }
    function openStore(){ track("cta_click"); var url=targetUrl();
      try{ if(window.mraid&&typeof mraid.open==="function"){ mraid.open(url); return; } }catch(e){}
      try{ if(typeof window.install==="function"){ window.install(); return; } }catch(e){}
      try{ if(window.ExitApi&&typeof ExitApi.exit==="function"){ ExitApi.exit(); return; } }catch(e){}
      try{ if(typeof window.mintegral_playable_exit==="function"){ window.mintegral_playable_exit(); return; } }catch(e){}
      window.open(url,"_blank"); }
    function track(ev,data){ try{ console.log("[playable]",ev,data||""); }catch(e){} }
    return { whenReady:whenReady, openStore:openStore, track:track };
  })();

  /* ---------- 5. STATE MACHINE ---------- */
  var UI={ show:function(name){ ["loading","intro","end"].forEach(function(s){ $("screen-"+s).classList.toggle("hidden",s!==name); });
      $("hud").classList.toggle("hidden",name!=="playing"); $("cta-bar").classList.toggle("hidden",name!=="playing"); },
    setScore:function(v){ $("score").textContent=v; },
    setEnd:function(title,score){ $("end-title").textContent=title; $("end-score").textContent=score; },
    hint:function(show){ $("hint").classList.toggle("hidden",!show); } };
  var State="loading";
  function setState(s){ State=s; Ad.track("state",s); UI.show(s); }

  /* ---------- 6. GAME ---------- */
  var Game=(function(){
    // Tower blocks are stored in design space with a "camera" offset so the
    // view scrolls up as the stack grows. Each block: {x, w, y, color}.
    var stack, current, camY, score, over, speed, scraps, hintShown;
    var HUE=200;

    function colorFor(i){ return "hsl("+((HUE+i*8)%360)+",65%,55%)"; }

    function reset(){
      stack=[]; scraps=[]; score=0; over=false; camY=0; hintShown=true;
      HUE=190+Math.floor(Math.random()*40);
      // Base block sits near the bottom.
      var baseY=view.h-180;
      stack.push({ x:(view.w-CONFIG.startWidth)/2, w:CONFIG.startWidth, y:baseY, color:colorFor(0) });
      spawnMover();
      UI.setScore(0); UI.hint(true);
    }

    function spawnMover(){
      var top=stack[stack.length-1];
      speed=CONFIG.baseSpeed + score*8;
      current={ x:0, w:top.w, y:top.y-CONFIG.blockHeight, dir:1, color:colorFor(stack.length) };
    }

    function onDown(){
      if(over || !current) return;
      hintShown=false; UI.hint(false);
      var top=stack[stack.length-1];
      var overlapL=Math.max(current.x, top.x);
      var overlapR=Math.min(current.x+current.w, top.x+top.w);
      var overlap=overlapR-overlapL;

      if(overlap<=0){ // total miss -> game over
        Sound.beep(120,0.3,"sawtooth");
        current.falling=true; scraps.push({ x:current.x, w:current.w, y:current.y, color:current.color, vy:0 });
        current=null; return end();
      }

      // Slice: keep the overlapping part, drop the overhang as a scrap.
      var err=Math.abs(current.x-top.x);
      if(err<=CONFIG.perfectTolerance){
        // Perfect: snap and keep full width (satisfying feedback).
        current.x=top.x; Sound.beep(880,0.12,"triangle");
      } else {
        if(current.x<top.x){
          scraps.push({ x:overlapL-(top.x-current.x), w:top.x-current.x, y:current.y, color:current.color, vy:0, side:-1 });
        } else {
          scraps.push({ x:overlapR, w:current.x+current.w-overlapR, y:current.y, color:current.color, vy:0, side:1 });
        }
        current.x=overlapL; current.w=overlap;
        Sound.beep(520,0.1,"square");
      }

      stack.push({ x:current.x, w:current.w, y:current.y, color:current.color });
      score++; UI.setScore(score);

      // Scroll the camera up so the new top stays in the upper-middle area.
      var targetTop=view.h*0.42;
      var newTopY=current.y - camY;
      if(newTopY < targetTop){ camY -= (targetTop-newTopY); }

      spawnMover();
    }

    function update(dt){
      // animate falling scraps
      for(var i=scraps.length-1;i>=0;i--){ var s=scraps[i]; s.vy+=1800*dt; s.y+=s.vy*dt; if(s.y-camY>view.h+200) scraps.splice(i,1); }
      if(over || !current) return;
      current.x += current.dir*speed*dt;
      if(current.x<=0){ current.x=0; current.dir=1; }
      if(current.x+current.w>=view.w){ current.x=view.w-current.w; current.dir=-1; }
    }

    function drawBlock(b){
      var y=b.y-camY;
      ctx.fillStyle=b.color; ctx.fillRect(b.x, y, b.w, CONFIG.blockHeight);
      // top highlight + bottom shade for a 3D feel
      ctx.fillStyle="rgba(255,255,255,.18)"; ctx.fillRect(b.x, y, b.w, 8);
      ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(b.x, y+CONFIG.blockHeight-8, b.w, 8);
    }

    function render(){
      // gradient sky
      var g=ctx.createLinearGradient(0,0,0,view.h);
      g.addColorStop(0,"#0b1e3f"); g.addColorStop(1,"#123a6b");
      ctx.fillStyle=g; ctx.fillRect(0,0,view.w,view.h);
      for(var i=0;i<scraps.length;i++) drawBlock(scraps[i]);
      for(var j=0;j<stack.length;j++) drawBlock(stack[j]);
      if(current) drawBlock(current);
    }

    function end(){
      over=true; Loop.stop();
      Store.set("bestHeight", Math.max(score, Store.get("bestHeight",0)));
      UI.setEnd(score>=10?"Sky high!":"Nice tower!", score);
      setState("end"); Ad.track("game_end",{height:score});
    }

    return { reset:reset, onDown:onDown, update:update, render:render };
  })();

  /* ---------- 7. BOOTSTRAP ---------- */
  function startGame(){ Sound.unlock(); Game.reset(); setState("playing"); Ad.track("game_start"); Loop.start(Game.update, Game.render); }
  function init(){
    fitCanvas();
    Input.on(function(){ if(State==="playing") Game.onDown(); });
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);
    Ad.whenReady(function(){ setState("intro"); Ad.track("loaded"); });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); } else { init(); }

})();
</script>
</body>
</html>
