<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Speed Shift</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     ===================================================================== -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0d12;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .85; }

  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ffb03a, #f7531f);
    box-shadow: 0 8px 24px rgba(247,83,31,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(15px, 4.5vw, 22px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Speed: <span id="score">0</span></div>
  <div id="hud-right">Time: <span id="time">0</span></div>
</div>

<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<div id="screen-intro" class="screen hidden">
  <div class="title">Speed Shift</div>
  <div class="subtitle">Tap to shift the instant the needle is in the green.</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Finish!</div>
  <div class="subtitle" id="end-subtitle">Distance: <span id="end-score">0</span> m</div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined) — 7-section structure
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     =================================================================== */
  var CONFIG = {
    title: "Speed Shift",
    gameSeconds: 20,
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    designWidth: 720,
    designHeight: 1280,
    bg: "#0b0d12"
  };

  /* ===================================================================
     2. ASSETS
     =================================================================== */
  var ASSETS = { images: {}, sounds: {} };

  /* ===================================================================
     3. ENGINE
     =================================================================== */
  function $(id) { return document.getElementById(id); }

  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }
    function whenReady(cb) {
      if (!window.mraid) return cb();
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {}
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }
    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; },
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME — Speed Shift
     A tachometer needle sweeps back and forth across a rev gauge. Tap to
     shift gears: land the needle in the green band for a PERFECT shift (big
     acceleration), the yellow for an OK shift, or hit the red and you
     over-rev and lose speed. Faster car = more distance before the flag.
     =================================================================== */
  var Game = (function () {
    var timeLeft, distance, speed, needle, needleDir, needleSpeed,
        greenLo, greenHi, banner, road, shake, wheelSpin, elapsed;

    // Gauge geometry (a horizontal bar near the bottom-center).
    var GAUGE_X = 90, GAUGE_W = view.w - 180, GAUGE_Y = view.h - 300, GAUGE_H = 44;
    var MAX_SPEED = 320;               // km/h ceiling
    var MIN_SPEED = 40;

    function reset() {
      timeLeft = CONFIG.gameSeconds; elapsed = 0;
      distance = 0; speed = MIN_SPEED;
      needle = 0; needleDir = 1; needleSpeed = 1.35;
      banner = null; shake = 0; wheelSpin = 0;
      placeGreen();
      // Dashed road markings.
      road = [];
      for (var i = 0; i < 9; i++) road.push(i / 9);
      UI.setScore(Math.round(speed)); UI.setTime(Math.ceil(timeLeft));
    }

    // The green band lives in the upper rev range and shrinks as you speed up.
    function placeGreen() {
      var w = Math.max(0.12, 0.26 - elapsed * 0.004);
      var lo = Rand.range(0.5, 0.86 - w);
      greenLo = lo; greenHi = lo + w;
    }

    function say(text, color) { banner = { text: text, color: color, t: 0 }; }

    function onDown() {
      // Grade the shift by where the needle sits (0..1).
      if (needle >= greenLo && needle <= greenHi) {
        speed = Math.min(MAX_SPEED, speed + 46);
        say("PERFECT SHIFT!", "#4ade80");
        Sound.beep(880, 0.14, "sawtooth");
        wheelSpin = 1;
      } else if (needle >= greenLo - 0.12 && needle <= greenHi + 0.12) {
        speed = Math.min(MAX_SPEED, speed + 16);
        say("OK", "#ffd23f");
        Sound.beep(500, 0.12, "sawtooth");
      } else if (needle > greenHi + 0.12) {
        speed = Math.max(MIN_SPEED, speed - 40);
        say("OVER-REV!", "#ff6b6b");
        Sound.beep(150, 0.28, "square");
        shake = 14;
      } else {
        speed = Math.max(MIN_SPEED, speed - 18);
        say("TOO SOON", "#ff9f6b");
        Sound.beep(240, 0.16, "square");
      }
      UI.setScore(Math.round(speed));
      needleSpeed = 1.35 + elapsed * 0.03;   // gauge sweeps faster over time
      placeGreen();
    }

    function update(dt) {
      timeLeft -= dt; elapsed += dt;
      UI.setTime(Math.max(0, Math.ceil(timeLeft)));

      // Sweep the needle back and forth.
      needle += needleDir * needleSpeed * dt;
      if (needle >= 1) { needle = 1; needleDir = -1; }
      if (needle <= 0) { needle = 0; needleDir = 1; }

      // Natural drag pulls the speed down; shifts push it back up.
      speed = Math.max(MIN_SPEED, speed - 12 * dt);
      UI.setScore(Math.round(speed));

      // Distance in metres (speed km/h -> m/s).
      distance += (speed / 3.6) * dt;

      // Scroll the road proportionally to speed.
      var adv = (speed / MAX_SPEED) * 1.6 * dt;
      for (var i = 0; i < road.length; i++) {
        road[i] += adv;
        if (road[i] > 1) road[i] -= 1;
      }

      if (banner) { banner.t += dt; if (banner.t > 0.6) banner = null; }
      if (shake > 0) shake = Math.max(0, shake - 55 * dt);
      if (wheelSpin > 0) wheelSpin = Math.max(0, wheelSpin - dt * 2);

      if (timeLeft <= 0) return end();
    }

    function render() {
      ctx.save();
      if (shake > 0) ctx.translate(Rand.range(-shake, shake), Rand.range(-shake, shake));

      // Sky + ground.
      var sky = ctx.createLinearGradient(0, 0, 0, view.h);
      sky.addColorStop(0, "#141b2e"); sky.addColorStop(1, "#0b0d12");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, view.w, view.h);

      drawRoad();
      drawCar();
      drawGauge();

      // Distance readout.
      ctx.fillStyle = "#fff";
      ctx.font = "800 30px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(Math.round(distance) + " m", view.w / 2, GAUGE_Y - 70);

      if (banner) {
        ctx.globalAlpha = Math.max(0, 1 - banner.t / 0.6);
        ctx.fillStyle = banner.color;
        ctx.font = "800 54px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(banner.text, view.w / 2, 260);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }

    function drawRoad() {
      // Perspective-ish road: narrow at the horizon, wide at the car.
      var horizon = view.h * 0.30, base = GAUGE_Y - 120;
      var topW = 120, botW = 460;
      ctx.fillStyle = "#20242e";
      ctx.beginPath();
      ctx.moveTo(view.w / 2 - topW / 2, horizon);
      ctx.lineTo(view.w / 2 + topW / 2, horizon);
      ctx.lineTo(view.w / 2 + botW / 2, base);
      ctx.lineTo(view.w / 2 - botW / 2, base);
      ctx.closePath(); ctx.fill();
      // Center dashes.
      ctx.fillStyle = "#ffd23f";
      for (var i = 0; i < road.length; i++) {
        var t = road[i];                     // 0 = horizon, 1 = near
        var y = horizon + (base - horizon) * t;
        var w = 4 + 20 * t;
        var h = 10 + 46 * t;
        ctx.globalAlpha = 0.35 + 0.65 * t;
        ctx.fillRect(view.w / 2 - w / 2, y, w, h);
      }
      ctx.globalAlpha = 1;
    }

    function drawCar() {
      var cx = view.w / 2, cy = GAUGE_Y - 150, w = 150, h = 90;
      // Body.
      ctx.fillStyle = "#f7531f";
      roundRect(cx - w / 2, cy - h / 2, w, h, 16); ctx.fill();
      ctx.fillStyle = "#ffb03a";
      roundRect(cx - w / 2 + 12, cy - h / 2 + 10, w - 24, 26, 8); ctx.fill();
      // Wheels (spin flash on a perfect shift).
      ctx.fillStyle = wheelSpin > 0 ? "#fff" : "#11131a";
      ctx.beginPath(); ctx.arc(cx - w / 2 + 24, cy + h / 2, 18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + w / 2 - 24, cy + h / 2, 18, 0, Math.PI * 2); ctx.fill();
    }

    function drawGauge() {
      // Track.
      ctx.fillStyle = "#1a1d26";
      roundRect(GAUGE_X, GAUGE_Y, GAUGE_W, GAUGE_H, GAUGE_H / 2); ctx.fill();
      // Red over-rev zone (right of green).
      ctx.fillStyle = "rgba(255,80,80,.35)";
      var redX = GAUGE_X + greenHi * GAUGE_W;
      ctx.fillRect(redX, GAUGE_Y, GAUGE_X + GAUGE_W - redX, GAUGE_H);
      // Green band.
      var gx = GAUGE_X + greenLo * GAUGE_W;
      var gw = (greenHi - greenLo) * GAUGE_W;
      ctx.fillStyle = "#4ade80";
      ctx.fillRect(gx, GAUGE_Y, gw, GAUGE_H);
      // Needle.
      var nx = GAUGE_X + needle * GAUGE_W;
      ctx.fillStyle = "#fff";
      ctx.fillRect(nx - 3, GAUGE_Y - 14, 6, GAUGE_H + 28);
      ctx.beginPath(); ctx.arc(nx, GAUGE_Y - 14, 8, 0, Math.PI * 2); ctx.fill();
      // Label.
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.font = "700 20px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("TAP IN THE GREEN TO SHIFT", view.w / 2, GAUGE_Y + GAUGE_H + 40);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function end() {
      Loop.stop();
      var m = Math.round(distance);
      Store.set("bestDistance", Math.max(m, Store.get("bestDistance", 0)));
      var title = m >= 1200 ? "Track record!" : m >= 700 ? "Fast lap!" : "Finish!";
      UI.setEnd(title, m);
      setState("end");
      Ad.track("game_end", { distance: m });
    }

    return { reset: reset, onDown: onDown, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP
     =================================================================== */
  function startGame() {
    Sound.unlock();
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
