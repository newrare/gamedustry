<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Catch It!</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #120e26;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the square-ish play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
    background: radial-gradient(ellipse at center, rgba(30,20,60,.55), rgba(10,8,20,.85));
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .85; }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #3a2400; cursor: pointer;
    background: linear-gradient(180deg, #ffe27a, #ffb400);
    box-shadow: 0 8px 24px rgba(255,180,0,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  /* ---- Persistent CTA banner (visible during gameplay, common in playables) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, lives, timer) ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(14px, 4.2vw, 20px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #hud.hidden { display: none; }
  #hud-mid { opacity: .95; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #ffcf3f;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP  (structure of the creative)
     - #stage/#game : the canvas the game renders into.
     - #hud         : in-game score / lives / timer.
     - .screen      : one overlay per game state (intro, end).
     - #cta-bar     : always-available install button.
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Score: <span id="score">0</span></div>
  <div id="hud-mid">Lives: <span id="lives">3</span></div>
  <div id="hud-right">Time: <span id="time">0</span></div>
</div>

<!-- Loading screen: shown until assets + ad container are ready -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<!-- Intro screen: title + start button -->
<div id="screen-intro" class="screen hidden">
  <div class="title">Catch It!</div>
  <div class="subtitle">Drag to move the basket. Catch gems, dodge bombs!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<!-- End screen: result + primary CTA to the store -->
<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice!</div>
  <div class="subtitle" id="end-subtitle">You scored <span id="end-score">0</span> points</div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<!-- Persistent CTA (hidden until gameplay begins) -->
<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined)
     Organized top-to-bottom in clearly labeled sections so a new game can
     be produced by editing mostly the CONFIG + GAME sections and leaving
     the ENGINE / AD glue untouched.
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     The knobs a new game changes first. Copy of business/creative params.
     =================================================================== */
  var CONFIG = {
    title: "Catch It!",
    gameSeconds: 25,               // round length; 0 = endless
    // Store links used by the CTA. The correct one is chosen at runtime.
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    // Design resolution — the game logic is authored against this virtual
    // size, then the canvas is scaled to fit any screen (see fitCanvas()).
    designWidth: 720,
    designHeight: 1280,
    bg: "#161230",

    // ---- game-specific tunables ----
    lives: 3,
    basket: { w: 176, h: 50, bottomGap: 210 }, // bottomGap keeps clear of cta-bar
    spawn: { startInterval: 1.05, minInterval: 0.40 }, // seconds between drops
    fall: { startSpeed: 250, maxSpeed: 640 },           // px/sec (design units)
    bombChance: { start: 0.16, end: 0.32 },             // probability a drop is a bomb
    bonusChance: 0.12,                                  // probability a non-bomb drop is a big bonus gem
    values: { normal: 10, bonus: 50 },
    goodColors: ["#ffd23f", "#4cc9f0", "#f72585", "#7bf1a8", "#ff9f5c", "#c084fc"]
  };

  /* ===================================================================
     2. ASSETS  (embedded, no network requests)
     Register every asset as a data URI so the file stays self-contained.
     Use tools/embed-asset.mjs to generate these strings.
     Prefer CSS/canvas drawing & WebAudio synth over binary assets to stay
     well under the 5 MB budget; only embed images/sounds you truly need.
     =================================================================== */
  var ASSETS = {
    images: {},
    sounds: {}
  };

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  // We render at CONFIG.designWidth x designHeight and letterbox-fit the
  // canvas to the viewport using CSS, accounting for devicePixelRatio so
  // drawing stays crisp on retina screens.
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    // Backing store size (crisp), CSS size (fit).
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  // Handles mouse + touch. Coordinates are converted from screen pixels to
  // the virtual design space so game logic never worries about scaling.
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  // Generates simple tones so you get sound without embedding audio files.
  // For richer sound, put base64 clips in ASSETS.sounds and play via Audio.clip.
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      // iOS requires resume() inside a user gesture.
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     Playable ads run inside a network's iframe. We must:
       - wait for the ad container ("mraid") to be ready before starting,
       - route the install button through the network's open() when present,
       - report standard lifecycle events for analytics/QA.
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    // Resolve when the creative may start drawing/interacting.
    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    // The single entry point for "user wants the app". Order matters:
    // MRAID first, then common network globals, then a plain window.open.
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}       // ironSource / generic
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {} // Google Ads
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    // Lightweight event hook. Swap console.log for a network SDK call if needed.
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     States: loading -> intro -> playing -> end. UI.show() toggles overlays.
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      // HUD + CTA bar are only visible during play.
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; },
    setLives: function (v) { $("lives").textContent = v; },
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME  (the part a new prompt mostly rewrites)
     Everything above is reusable plumbing. A concrete game implements:
       Game.reset()            -> initialize round state
       Game.onDown(p)          -> pointer input (design coords)
       Game.update(dt)         -> advance simulation (seconds)
       Game.render()           -> draw a frame (design coords)
       Game.onEnd()            -> compute result before end screen
     "Catch It!": a basket follows the pointer horizontally. Good items
     (coins/gems/stars) fall from the top and are worth points when
     caught; bombs cost a life when caught. Missing a good item is free
     (forgiving). Round is timed; fall speed & spawn rate ramp up.
     =================================================================== */
  var Game = (function () {
    var score, lives, timeLeft;
    var basket;
    var items;        // falling entities
    var particles;    // sparkle / poof fx
    var stars;        // static background twinkle, generated once
    var spawnTimer;
    var flashTimer;   // red screen flash on bomb hit
    var squashTimer;  // basket squash juice on any catch
    var ended;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }

    function clampBasketX(x) {
      var half = basket.w / 2;
      return clamp(x, half, view.w - half);
    }

    function ensureStars() {
      if (stars) return;
      stars = [];
      for (var i = 0; i < 46; i++) {
        stars.push({
          x: Rand.range(0, view.w),
          y: Rand.range(0, view.h * 0.75),
          r: Rand.range(0.6, 2.2),
          a: Rand.range(0.15, 0.6)
        });
      }
    }

    function reset() {
      score = 0;
      lives = CONFIG.lives;
      timeLeft = CONFIG.gameSeconds;
      basket = { x: view.w / 2, w: CONFIG.basket.w, h: CONFIG.basket.h, y: view.h - CONFIG.basket.bottomGap };
      items = [];
      particles = [];
      spawnTimer = 0.4; // small delay before first drop
      flashTimer = 0;
      squashTimer = 0;
      ended = false;
      ensureStars();
      UI.setScore(0);
      UI.setLives(lives);
      UI.setTime(Math.ceil(timeLeft));
    }

    function onDown(p) { basket.x = clampBasketX(p.x); }
    function onMove(p) { basket.x = clampBasketX(p.x); }
    function onUp(p) { /* nothing to do — basket simply stops following */ }

    function progress() {
      // 0 at round start, 1 at round end — drives the difficulty ramp.
      return clamp((CONFIG.gameSeconds - timeLeft) / CONFIG.gameSeconds, 0, 1);
    }

    function currentSpawnInterval() {
      return lerp(CONFIG.spawn.startInterval, CONFIG.spawn.minInterval, progress());
    }

    function currentFallSpeed() {
      return lerp(CONFIG.fall.startSpeed, CONFIG.fall.maxSpeed, progress());
    }

    function spawnItem() {
      var t = progress();
      var isBomb = Math.random() < lerp(CONFIG.bombChance.start, CONFIG.bombChance.end, t);
      var isBonus = !isBomb && Math.random() < CONFIG.bonusChance;
      var r = isBomb ? 28 : (isBonus ? 34 : 24);
      var vy = currentFallSpeed() * Rand.range(0.85, 1.2);
      items.push({
        x: Rand.range(r + 14, view.w - r - 14),
        y: -r - 10,
        r: r,
        vy: vy,
        rot: Rand.range(0, Math.PI * 2),
        spin: Rand.range(-2.4, 2.4),
        type: isBomb ? "bomb" : (isBonus ? "bonus" : "good"),
        color: isBonus ? "#ffd54a" : Rand.pick(CONFIG.goodColors),
        value: isBonus ? CONFIG.values.bonus : CONFIG.values.normal
      });
    }

    function spawnParticles(x, y, color, count, speedMul) {
      speedMul = speedMul || 1;
      for (var i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: Rand.range(-170, 170) * speedMul,
          vy: Rand.range(-260, -60) * speedMul,
          life: Rand.range(0.35, 0.7),
          maxLife: 0.7,
          color: color,
          size: Rand.range(2, 5)
        });
      }
    }

    function catchGood(it) {
      score += it.value;
      UI.setScore(score);
      squashTimer = 0.14;
      spawnParticles(it.x, it.y, it.color, it.type === "bonus" ? 22 : 12, it.type === "bonus" ? 1.3 : 1);
      Sound.beep(it.type === "bonus" ? 880 : 620, it.type === "bonus" ? 0.22 : 0.12, "triangle");
      if (it.type === "bonus") Sound.beep(1180, 0.15, "triangle");
    }

    function catchBomb(it) {
      lives = Math.max(0, lives - 1);
      UI.setLives(lives);
      squashTimer = 0.18;
      flashTimer = 0.18;
      spawnParticles(it.x, it.y, "#ff5d5d", 16, 1.1);
      spawnParticles(it.x, it.y, "#555", 10, 0.8);
      Sound.beep(110, 0.28, "sawtooth");
      if (lives <= 0) end("Boom! Game Over", "bombed");
    }

    function update(dt) {
      if (ended) return;

      // Timer
      if (CONFIG.gameSeconds > 0) {
        timeLeft -= dt;
        UI.setTime(Math.max(0, Math.ceil(timeLeft)));
        if (timeLeft <= 0) { end("Time's Up!", "timeout"); return; }
      }

      // Spawn falling items, ramping up rate over time.
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnItem(); spawnTimer = currentSpawnInterval(); }

      // Advance items; check basket catches; drop missed ones silently.
      var basketTop = basket.y, basketBottom = basket.y + basket.h;
      var basketLeft = basket.x - basket.w / 2, basketRight = basket.x + basket.w / 2;
      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        it.y += it.vy * dt;
        it.rot += it.spin * dt;

        var overlapsY = (it.y + it.r >= basketTop) && (it.y - it.r <= basketBottom);
        var overlapsX = (it.x + it.r >= basketLeft) && (it.x - it.r <= basketRight);
        if (overlapsY && overlapsX) {
          if (it.type === "bomb") catchBomb(it); else catchGood(it);
          items.splice(i, 1);
          continue;
        }
        if (it.y - it.r > view.h) { items.splice(i, 1); } // missed — no penalty
      }

      // Particles
      for (var j = particles.length - 1; j >= 0; j--) {
        var p = particles[j];
        p.vy += 520 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(j, 1);
      }

      if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);
      if (squashTimer > 0) squashTimer = Math.max(0, squashTimer - dt);
    }

    function drawBackground() {
      var g = ctx.createLinearGradient(0, 0, 0, view.h);
      g.addColorStop(0, "#1c1740");
      g.addColorStop(1, CONFIG.bg);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, view.w, view.h);

      ctx.fillStyle = "#ffffff";
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        ctx.globalAlpha = s.a;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawBasket() {
      var squash = squashTimer > 0 ? (squashTimer / 0.18) * 0.28 : 0;
      var w = basket.w, h = basket.h * (1 - squash);
      var x = basket.x, y = basket.y + (basket.h - h);

      ctx.save();
      ctx.translate(x, y);
      // Body (trapezoid bucket)
      ctx.beginPath();
      ctx.moveTo(-w / 2, 0);
      ctx.lineTo(w / 2, 0);
      ctx.lineTo(w / 2 - 14, h);
      ctx.lineTo(-w / 2 + 14, h);
      ctx.closePath();
      var bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, "#c9863f");
      bg.addColorStop(1, "#8a5a24");
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#5c3a15";
      ctx.stroke();

      // Rim highlight
      ctx.beginPath();
      ctx.ellipse(0, 0, w / 2, 9, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#f0b96b";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#5c3a15";
      ctx.stroke();

      // Slats (juice detail)
      ctx.strokeStyle = "rgba(0,0,0,.25)";
      ctx.lineWidth = 2;
      for (var k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(k * (w / 4), 6);
        ctx.lineTo(k * (w / 4) * 0.82, h - 4);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawGood(it) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      var glow = ctx.createRadialGradient(0, 0, 1, 0, 0, it.r * 1.6);
      glow.addColorStop(0, it.color);
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0, 0, it.r * 1.6, 0, Math.PI * 2); ctx.fill();

      if (it.type === "bonus") {
        drawStar(0, 0, it.r, 5, "#ffe27a", "#c98b00");
      } else {
        ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2);
        ctx.fillStyle = it.color; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.stroke();
        // shine
        ctx.beginPath(); ctx.arc(-it.r * 0.3, -it.r * 0.3, it.r * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
      }
      ctx.restore();
    }

    function drawStar(cx, cy, r, points, fill, stroke) {
      ctx.beginPath();
      for (var i = 0; i < points * 2; i++) {
        var rad = (i % 2 === 0) ? r : r * 0.45;
        var ang = (Math.PI / points) * i - Math.PI / 2;
        var px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke();
    }

    function drawBomb(it) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot * 0.3);
      // fuse
      ctx.strokeStyle = "#8a5a24";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -it.r); ctx.lineTo(it.r * 0.5, -it.r * 1.6); ctx.stroke();
      ctx.beginPath();
      ctx.arc(it.r * 0.5, -it.r * 1.6, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffbe0b"; ctx.fill();
      // body
      var bg = ctx.createRadialGradient(-it.r * 0.3, -it.r * 0.3, 1, 0, 0, it.r);
      bg.addColorStop(0, "#4a4a4a"); bg.addColorStop(1, "#161616");
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2);
      ctx.fillStyle = bg; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#000"; ctx.stroke();
      // shine
      ctx.beginPath(); ctx.arc(-it.r * 0.35, -it.r * 0.35, it.r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill();
      ctx.restore();
    }

    function drawParticles() {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      drawBackground();

      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.type === "bomb") drawBomb(it); else drawGood(it);
      }

      drawBasket();
      drawParticles();

      if (flashTimer > 0) {
        ctx.fillStyle = "rgba(255,40,40," + (0.35 * (flashTimer / 0.18)) + ")";
        ctx.fillRect(0, 0, view.w, view.h);
      }
    }

    function end(title, reason) {
      if (ended) return;
      ended = true;
      Loop.stop();
      Store.set("bestScore", Math.max(score, Store.get("bestScore", 0)));
      UI.setEnd(title || "Nice!", score);
      setState("end");
      Ad.track("game_end", { score: score, reason: reason || "unknown" });
    }

    return { reset: reset, onDown: onDown, onMove: onMove, onUp: onUp, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;

    // Route all inputs to the current game (basket follows the pointer
    // both on initial press and while dragging/moving).
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing") Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing") Game.onUp(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  // Kick off after DOM is parsed.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
