<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ring Combo</title>
<!--
  EXAMPLE GAME — "Ring Combo"
  Mechanic: a ball falls and bounces under gravity across the whole play area
  (there is no visible container — only the invisible screen edges bound it).
  Concentric rings close in from the outside toward the ball, kept at least a
  minimum gap apart and capped at 8. When a ring reaches the ball it is
  destroyed and kicks the ball back the other way with a speed boost, and a
  fresh ring spawns outside.
  TAP as a ring hits the ball to score; timing is graded MISS / CLOSE / OK /
  GOOD / PERFECT with escalating juice, and consecutive hits build a combo
  multiplier on a global score shown large at the top. A neon look, a ball
  trail, a combo-driven ball colour and an animated counter sell the feedback.
  The round does not end on the timer: when time runs out a spiked game-over
  ring is released and closes in — the run ends when the ball touches it.
  Built from template/game-template.html — see docs/CREATING_A_GAME.md.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden;
    background:radial-gradient(1100px 900px at 50% 42%, #191748 0%, #0a0a1c 58%, #04040c 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; touch-action:none; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; color:#fff; padding:24px; transition:opacity .25s ease; z-index:10; }
  .screen.hidden { opacity:0; pointer-events:none; }
  /* Neon type — a single static glow layer (light on repaints). */
  .title { font-size:clamp(24px,8vw,48px); font-weight:800; color:#eafcff; letter-spacing:1px;
    text-shadow:0 0 14px rgba(0,229,255,.75); }
  .subtitle { margin-top:14px; font-size:clamp(14px,4vw,20px); color:#c9d6ff; opacity:.92; }
  /* Neon button: static glow rim; the pulse animates transform only (GPU-cheap). */
  .btn { margin-top:26px; padding:16px 38px; border:2px solid rgba(255,255,255,.8); border-radius:999px;
    font-size:clamp(16px,5vw,22px); font-weight:800; color:#04040c; cursor:pointer; letter-spacing:.5px;
    background:linear-gradient(180deg,#4bf5ff,#00d0ff);
    box-shadow:0 0 16px rgba(0,229,255,.7); animation:pulse 1.4s ease-in-out infinite; }
  .btn:active { transform:scale(.96); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

  /* ---- Dramatic game-over sequence (staggered reveals, animated counters) ---- */
  #screen-end { justify-content:center; background:rgba(6,7,18,.86); }
  .eo-title { font-size:clamp(32px,11vw,64px); font-weight:900; letter-spacing:3px; color:#ff2d55;
    text-shadow:0 0 20px rgba(255,45,85,.85), 0 0 42px rgba(255,45,85,.5);
    opacity:0; transform:scale(.55);
    transition:opacity .4s ease, transform .45s cubic-bezier(.2,1.7,.4,1); }
  .eo-title.show { opacity:1; transform:scale(1); }
  .eo-scorelbl { margin-top:20px; font-size:13px; font-weight:800; letter-spacing:5px; color:#9fb0e0;
    opacity:0; transition:opacity .4s ease; }
  .eo-scorelbl.show { opacity:1; }
  .eo-score { font-size:clamp(56px,18vw,104px); font-weight:900; line-height:1; color:#eafcff;
    text-shadow:0 0 18px rgba(0,229,255,.7);
    opacity:0; transform:scale(.7); transition:opacity .35s ease, transform .35s ease; }
  .eo-score.show { opacity:1; transform:scale(1); }
  .eo-score.pop { animation:eopop .45s ease; }
  @keyframes eopop { 0%{transform:scale(1);} 40%{transform:scale(1.2);} 100%{transform:scale(1);} }
  .eo-stats { margin-top:24px; width:min(340px,82vw); display:flex; flex-direction:column; gap:9px; }
  .eo-row { display:flex; justify-content:space-between; align-items:center; padding:10px 16px;
    border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    font-weight:800; font-size:clamp(15px,4.6vw,20px);
    opacity:0; transform:translateX(-18px); transition:opacity .3s ease, transform .3s ease; }
  .eo-row.show { opacity:1; transform:translateX(0); }
  .eo-val { font-variant-numeric:tabular-nums; }
  .eo-row[data-grade="PERFECT"] { color:#ffd43b; }
  .eo-row[data-grade="GOOD"]    { color:#69db7c; }
  .eo-row[data-grade="OK"]      { color:#4dabf7; }
  .eo-row[data-grade="CLOSE"]   { color:#ffa94d; }
  .eo-row[data-grade="MISS"]    { color:#ff6b6b; }
  .eo-row[data-grade="COMBO"]   { color:#00e5ff; background:rgba(0,229,255,.09); border-color:rgba(0,229,255,.3); }
  #screen-end .btn { opacity:0; pointer-events:none; transition:opacity .5s ease; }
  #screen-end .btn.show { opacity:1; pointer-events:auto; }

  /* HUD: the global score is always shown large at the top-center. */
  #hud { position:absolute; top:0; left:0; right:0; z-index:15; pointer-events:none; }
  #hud.hidden { display:none; }
  #scorewrap { position:absolute; top:12px; left:0; right:0; text-align:center; }
  #score { display:inline-block; transform-origin:center bottom; color:#eafcff;
    font-size:clamp(42px,13vw,78px); font-weight:900; line-height:1;
    text-shadow:0 0 12px rgba(0,229,255,.6); transition:color .25s ease; }
  #score.bump { animation:scorebump .4s cubic-bezier(.2,1.5,.4,1); }
  @keyframes scorebump { 0%{transform:scale(1);} 28%{transform:scale(1.42);} 100%{transform:scale(1);} }
  #scorelbl { margin-top:0; font-size:12px; font-weight:800; letter-spacing:4px; color:rgba(255,255,255,.55); }
  #timebadge { position:absolute; top:18px; right:18px; color:#fff; opacity:.85;
    font-weight:800; letter-spacing:1px; font-size:clamp(14px,4vw,20px); text-shadow:0 2px 6px rgba(0,0,0,.5); }

  /* No backdrop-filter (that blur is GPU-costly) — a solid tint instead. */
  #cta-bar { position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center;
    justify-content:center; padding:12px; background:rgba(6,8,20,.78);
    border-top:1px solid rgba(0,229,255,.25); }
  #cta-bar.hidden { display:none; }
  .spinner { width:46px; height:46px; border-radius:50%; border:5px solid rgba(255,255,255,.15);
    border-top-color:#00e5ff; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="stage"><canvas id="game"></canvas></div>

<div id="hud" class="hidden">
  <div id="scorewrap"><div id="score">0</div><div id="scorelbl">SCORE</div></div>
  <div id="timebadge">TIME <span id="time">0</span></div>
</div>

<div id="screen-loading" class="screen">
  <div class="spinner"></div><div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<div id="screen-intro" class="screen hidden">
  <div class="title">RING COMBO</div>
  <div class="subtitle">Tap the instant a ring hits the ball.<br>Chain perfect taps for a huge combo!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<div id="screen-end" class="screen hidden">
  <div class="eo-title" id="eo-title">GAME OVER</div>
  <div class="eo-scorelbl" id="eo-scorelbl">FINAL SCORE</div>
  <div class="eo-score" id="eo-score">0</div>
  <div class="eo-stats">
    <div class="eo-row" id="eo-r-perfect" data-grade="PERFECT"><span class="eo-name">PERFECT</span><span class="eo-val" id="eo-v-perfect">0</span></div>
    <div class="eo-row" id="eo-r-good"    data-grade="GOOD"><span class="eo-name">GOOD</span><span class="eo-val" id="eo-v-good">0</span></div>
    <div class="eo-row" id="eo-r-ok"      data-grade="OK"><span class="eo-name">OK</span><span class="eo-val" id="eo-v-ok">0</span></div>
    <div class="eo-row" id="eo-r-close"   data-grade="CLOSE"><span class="eo-name">CLOSE</span><span class="eo-val" id="eo-v-close">0</span></div>
    <div class="eo-row" id="eo-r-miss"    data-grade="MISS"><span class="eo-name">MISS</span><span class="eo-val" id="eo-v-miss">0</span></div>
    <div class="eo-row" id="eo-r-combo"   data-grade="COMBO"><span class="eo-name">MAX COMBO</span><span class="eo-val" id="eo-v-combo">0</span></div>
  </div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<script>
"use strict";
(function () {

  /* ---------- 1. CONFIG ---------- */
  var CONFIG = {
    title: "RING COMBO",
    gameSeconds: 30,
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    designWidth: 720, designHeight: 1280, bg: "#0a0a18",
    ballR: 26,
    gravity: 1250,         // px/s^2 downward — natural falling motion
    wallBounce: 0.9,       // energy kept when hitting the invisible screen edges
    minSpeed: 320,         // speed floor so the ball never dies out
    maxSpeed: 940,         // per-frame speed cap
    ringImpulse: 470,      // inward kick given to the ball each time a ring is destroyed
    boundX: 30,            // horizontal margin of the ball's play area
    boundTop: 205,         // top of the play area (below the big score)
    boundBot: 200,         // gap kept above the CTA bar
    spawnR: 600,           // radius new rings spawn at (beyond the view edges)
    shrink: 190,           // px/s rings close in
    spawnEvery: 0.60,      // seconds between spawn attempts
    maxRings: 8,           // hard cap on concurrent rings
    minGap: 95,            // minimum radial spacing so rings never stick together
    doomSpeed: 265         // closing speed of the spiked game-over ring
  };

  /* ---------- 2. ASSETS (none — everything drawn on canvas) ---------- */
  var ASSETS = { images: {}, sounds: {} };

  /* ---------- 3. ENGINE (shared plumbing) ---------- */
  function $(id){ return document.getElementById(id); }
  var canvas=$("game"), ctx=canvas.getContext("2d");
  var view={ w:CONFIG.designWidth, h:CONFIG.designHeight, scale:1 };
  function fitCanvas(){
    var vw=window.innerWidth, vh=window.innerHeight, dpr=Math.min(window.devicePixelRatio||1,2);
    var scale=Math.min(vw/view.w, vh/view.h); view.scale=scale;
    canvas.width=Math.round(view.w*dpr); canvas.height=Math.round(view.h*dpr);
    canvas.style.width=Math.round(view.w*scale)+"px"; canvas.style.height=Math.round(view.h*scale)+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  var Input=(function(){
    var L={down:[]};
    function toDesign(cx,cy){ var r=canvas.getBoundingClientRect();
      return { x:(cx-r.left)/r.width*view.w, y:(cy-r.top)/r.height*view.h }; }
    function emit(e){ var t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e);
      var p=toDesign(t.clientX,t.clientY); L.down.forEach(function(fn){ fn(p); }); }
    canvas.addEventListener("mousedown", emit);
    canvas.addEventListener("touchstart", function(e){ e.preventDefault(); emit(e); }, {passive:false});
    return { on:function(fn){ L.down.push(fn); } };
  })();

  var Loop=(function(){
    var running=false,last=0,u=null,r=null;
    function frame(now){ if(!running)return; var dt=Math.min((now-last)/1000,0.05); last=now; if(u)u(dt); if(r)r(); requestAnimationFrame(frame); }
    return { start:function(uu,rr){ u=uu;r=rr;running=true;last=performance.now();requestAnimationFrame(frame); },
             stop:function(){ running=false; } };
  })();

  var Sound=(function(){
    var actx=null;
    function ensure(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
      if(actx&&actx.state==="suspended")actx.resume(); return actx; }
    function beep(freq,dur,type){ var a=ensure(); if(!a)return;
      var o=a.createOscillator(),g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq||440;
      g.gain.setValueAtTime(0.001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.3,a.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(dur||0.15));
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.15)); }
    return { unlock:ensure, beep:beep };
  })();

  var Store={ get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
              set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  var Rand={ range:function(a,b){ return a+Math.random()*(b-a); }, pick:function(arr){ return arr[Math.floor(Math.random()*arr.length)]; } };

  /* ---------- 4. AD NETWORK GLUE ---------- */
  var Ad=(function(){
    function platform(){ var ua=navigator.userAgent||""; if(/iPad|iPhone|iPod/.test(ua))return "ios"; if(/android/i.test(ua))return "android"; return "fallback"; }
    function targetUrl(){ return CONFIG.storeUrl[platform()]||CONFIG.storeUrl.fallback; }
    function whenReady(cb){ if(!window.mraid)return cb();
      if(mraid.getState&&mraid.getState()==="loading"){ mraid.addEventListener("ready",cb); } else cb(); }
    function openStore(){ track("cta_click"); var url=targetUrl();
      try{ if(window.mraid&&typeof mraid.open==="function"){ mraid.open(url); return; } }catch(e){}
      try{ if(typeof window.install==="function"){ window.install(); return; } }catch(e){}
      try{ if(window.ExitApi&&typeof ExitApi.exit==="function"){ ExitApi.exit(); return; } }catch(e){}
      try{ if(typeof window.mintegral_playable_exit==="function"){ window.mintegral_playable_exit(); return; } }catch(e){}
      window.open(url,"_blank"); }
    function track(ev,data){ try{ console.log("[playable]",ev,data||""); }catch(e){} }
    return { whenReady:whenReady, openStore:openStore, track:track };
  })();

  /* ---------- 5. STATE MACHINE ---------- */
  var UI={ show:function(name){ ["loading","intro","end"].forEach(function(s){ $("screen-"+s).classList.toggle("hidden",s!==name); });
      $("hud").classList.toggle("hidden",name!=="playing"); $("cta-bar").classList.toggle("hidden",name!=="playing"); },
    setTime:function(v){ $("time").textContent=v; } };
  var State="loading";
  function setState(s){ State=s; Ad.track("state",s); UI.show(s); }

  // Count a number up from 0 to target with easing, writing into an element.
  function countUp(el, target, dur, cb){
    var start=performance.now();
    function step(now){ var p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(e*target);
      if(p<1) requestAnimationFrame(step); else { el.textContent=target; if(cb) cb(); } }
    requestAnimationFrame(step);
  }

  // Cinematic game-over reveal: GAME OVER -> final score count-up (highlighted)
  // -> stat rows one after another (each counter animating) -> then, 2 seconds
  // after the last row, the install CTA appears.
  var endTimers=[];
  function runEndSequence(score, stats, bestCombo){
    endTimers.forEach(clearTimeout); endTimers=[];
    var rows=[["perfect",stats.perfect],["good",stats.good],["ok",stats.ok],
              ["close",stats.close],["miss",stats.miss],["combo",bestCombo]];
    // Reset every animated element to its hidden/zero state.
    ["eo-title","eo-scorelbl","eo-score"].forEach(function(id){ $(id).classList.remove("show","pop"); });
    $("eo-score").textContent="0"; $("btn-install").classList.remove("show");
    rows.forEach(function(r){ $("eo-r-"+r[0]).classList.remove("show"); $("eo-v-"+r[0]).textContent="0"; });
    function T(fn,ms){ endTimers.push(setTimeout(fn,ms)); }
    T(function(){ $("eo-title").classList.add("show"); Sound.beep(150,0.5,"sawtooth"); }, 120);
    T(function(){ $("eo-scorelbl").classList.add("show"); $("eo-score").classList.add("show");
        countUp($("eo-score"), score, 1100, function(){ $("eo-score").classList.add("pop"); Sound.beep(900,0.14,"triangle"); }); }, 560);
    var rowStart=1850, gap=280;
    rows.forEach(function(r,i){ T(function(){ $("eo-r-"+r[0]).classList.add("show");
        countUp($("eo-v-"+r[0]), r[1], 450); Sound.beep(480+i*70,0.05,"triangle"); }, rowStart+i*gap); });
    T(function(){ $("btn-install").classList.add("show"); }, rowStart + rows.length*gap + 2000);
  }

  /* ---------- 6. GAME ---------- */
  var Game=(function(){
    var PALETTE=["#00e5ff","#ff2d95","#c86bff","#39ff14","#ffe600","#ff6b35","#18dcff"]; // neon rings
    // The ball glows a hotter colour the higher the combo climbs.
    var BALL_COLORS=["#00e5ff","#39ff14","#ffe600","#ff9f1c","#ff2d95","#c86bff","#ff1744"];
    function ballColor(){ return BALL_COLORS[Math.min(combo, BALL_COLORS.length-1)]; }
    // Timing grades, tightest window first. Higher tiers = more points + more
    // juice. Windows are deliberately wide so hits are easy and misses are rare.
    var TIERS=[
      { name:"PERFECT", win:34,  mult:3,   color:"#ffd43b", parts:14, flash:0.60, shake:13, freq:980 },
      { name:"GOOD",    win:70,  mult:2,   color:"#69db7c", parts:10, flash:0.38, shake:9,  freq:770 },
      { name:"OK",      win:108, mult:1.5, color:"#4dabf7", parts:8,  flash:0.24, shake:6,  freq:610 },
      { name:"CLOSE",   win:150, mult:1,   color:"#ffa94d", parts:6,  flash:0.14, shake:4,  freq:490 }
    ];
    var MAXWIN=TIERS[TIERS.length-1].win;

    var C, ball, bounds, rings, particles, trail, spawnTimer, colorIdx, bgGrad, doom;
    var score, scoreShown, combo, bestCombo, timeLeft, tAnim, shake, flash, popup, bumpT, stats;

    function reset(){
      bounds={ L:CONFIG.boundX, R:view.w-CONFIG.boundX, T:CONFIG.boundTop, B:view.h-CONFIG.boundBot };
      C={ x:view.w/2, y:(bounds.T+bounds.B)/2 };
      // Start near centre with a sideways kick, then let gravity take over.
      ball={ x:C.x, y:C.y-120, vx:(Math.random()<0.5?-1:1)*Rand.range(230,320), vy:0 };
      rings=[]; particles=[]; trail=[]; colorIdx=0; bgGrad=null; doom=null;
      score=0; scoreShown=0; combo=0; bestCombo=0; timeLeft=CONFIG.gameSeconds;
      stats={ perfect:0, good:0, ok:0, close:0, miss:0 };
      tAnim=0; shake=0; flash=0; popup=null;
      // Seed a few well-spaced rings already on their way in.
      spawnRing(CONFIG.spawnR); spawnRing(CONFIG.spawnR-150); spawnRing(CONFIG.spawnR-300);
      spawnTimer=CONFIG.spawnEvery;
      $("score").textContent="0"; $("score").style.color=""; UI.setTime(timeLeft);
    }

    function spawnRing(radius){ rings.push({ r:radius, color:PALETTE[colorIdx++ % PALETTE.length] }); }

    // When the timer runs out, a spiked "game-over" ring closes in from outside.
    // It can't be tapped away — when it reaches the ball, the run is over.
    function spawnDoom(){ doom={ r:CONFIG.spawnR+90 }; Sound.beep(120,0.35,"sawtooth"); }

    // Spawn respecting the 8-ring cap and the minimum radial spacing so rings
    // never appear stuck together at the outer edge.
    function trySpawn(){
      if(rings.length>=CONFIG.maxRings) return;
      var maxR=0; for(var i=0;i<rings.length;i++) if(rings[i].r>maxR) maxR=rings[i].r;
      if(rings.length>0 && maxR > CONFIG.spawnR-CONFIG.minGap) return;
      spawnRing(CONFIG.spawnR);
    }

    function ballDist(){ return Math.sqrt((ball.x-C.x)*(ball.x-C.x)+(ball.y-C.y)*(ball.y-C.y)); }

    // When a ring is destroyed, kick the ball back the opposite way (inward,
    // away from the ring surface) and give it a speed boost so it keeps roaming.
    function repelBall(){
      var dx=ball.x-C.x, dy=ball.y-C.y, bd=Math.sqrt(dx*dx+dy*dy);
      var nx, ny; if(bd<1){ nx=0; ny=-1; } else { nx=dx/bd; ny=dy/bd; }
      var vr=ball.vx*nx+ball.vy*ny;                              // outward radial component
      if(vr>0){ ball.vx-=1.4*vr*nx; ball.vy-=1.4*vr*ny; }        // reflect it off the ring
      ball.vx-=nx*CONFIG.ringImpulse; ball.vy-=ny*CONFIG.ringImpulse;  // inward impulse
      var sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)||1;
      var boosted=Math.min(CONFIG.maxSpeed, Math.max(CONFIG.minSpeed, sp*1.18));
      ball.vx=ball.vx/sp*boosted; ball.vy=ball.vy/sp*boosted;
    }

    function burst(x,y,color,n){
      for(var i=0;i<n;i++){ var a=Rand.range(0,Math.PI*2), s=Rand.range(120,460);
        particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:Rand.range(0.3,0.65), color:color, size:Rand.range(3,7) }); }
    }

    // Animated score counter: eases toward the real score and pulses on gain.
    function addScore(amount, color){
      score+=amount;
      var el=$("score"); el.style.color=color;
      el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
      clearTimeout(bumpT); bumpT=setTimeout(function(){ el.style.color=""; }, 300);
    }
    function tickScore(dt){
      if(scoreShown!==score){
        scoreShown += (score-scoreShown)*Math.min(1,dt*14);
        if(Math.abs(score-scoreShown)<0.5) scoreShown=score;
        $("score").textContent=Math.round(scoreShown);
      }
    }

    function popRing(idx, tier, gained){
      var ring=rings[idx];
      burst(ball.x, ball.y, ring.color, tier.parts);
      if(tier.name==="PERFECT") burst(ball.x, ball.y, "#ffffff", 5);
      rings.splice(idx,1); trySpawn(); repelBall();
      addScore(gained, tier.color);
      popup={ t:0, dur:0.7, text:tier.name+"  x"+combo, gained:gained, color:tier.color, big:tier.name==="PERFECT", x:ball.x, y:ball.y };
      flash=Math.max(flash,tier.flash); shake=Math.max(shake,tier.shake);
      Sound.beep(tier.freq+combo*12, 0.10, "triangle");
    }

    // Tap: grade the ring nearest to contact and score it, else break the chain.
    function onDown(){
      if(rings.length===0) return;
      var bd=ballDist(), best=-1, bestGap=1e9;
      for(var i=0;i<rings.length;i++){ var gap=Math.abs(rings[i].r-bd); if(gap<bestGap){ bestGap=gap; best=i; } }
      if(best<0) return;
      if(bestGap<=MAXWIN){
        var tier=TIERS[0];
        for(var t=0;t<TIERS.length;t++){ if(bestGap<=TIERS[t].win){ tier=TIERS[t]; break; } }
        combo++; if(combo>bestCombo) bestCombo=combo;
        stats[tier.name.toLowerCase()]++;
        var gained=Math.round(10*combo*tier.mult);
        popRing(best, tier, gained);
      } else {
        // Mistimed tap: break the chain (no score penalty, no sound — forgiving).
        combo=0; stats.miss++;
        popup={ t:0, dur:0.45, text:"MISS", gained:0, color:"#ff3b6b", big:false, x:ball.x, y:ball.y };
        shake=Math.max(shake,5);
      }
    }

    function update(dt){
      tAnim+=dt;
      timeLeft-=dt; UI.setTime(Math.max(0,Math.ceil(timeLeft)));
      if(timeLeft<=0 && !doom) spawnDoom();   // timer out -> release the spiked ring

      // Difficulty ramp.
      var elapsed=CONFIG.gameSeconds-timeLeft;
      var shrink=CONFIG.shrink+elapsed*4.5;
      var spawnEvery=Math.max(0.42, CONFIG.spawnEvery-elapsed*0.005);

      // Natural physics: gravity pulls the ball down. There is NO visible
      // container — the ball roams the whole play area and only bounces off the
      // invisible screen edges. The rings repel it (handled in the ring loop).
      ball.vy+=CONFIG.gravity*dt;
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      if(ball.x<bounds.L){ ball.x=bounds.L; ball.vx=Math.abs(ball.vx)*CONFIG.wallBounce; }
      else if(ball.x>bounds.R){ ball.x=bounds.R; ball.vx=-Math.abs(ball.vx)*CONFIG.wallBounce; }
      if(ball.y<bounds.T){ ball.y=bounds.T; ball.vy=Math.abs(ball.vy)*CONFIG.wallBounce; }
      else if(ball.y>bounds.B){ ball.y=bounds.B; ball.vy=-Math.abs(ball.vy)*CONFIG.wallBounce; }
      // Cap top speed every frame so fast falls stay controllable.
      var csp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)||1;
      if(csp>CONFIG.maxSpeed){ ball.vx=ball.vx/csp*CONFIG.maxSpeed; ball.vy=ball.vy/csp*CONFIG.maxSpeed; }

      // Record the ball path for the neon trail.
      trail.push({ x:ball.x, y:ball.y }); if(trail.length>16) trail.shift();

      // Spawn rings on a cadence (stop once the game-over ring is out).
      spawnTimer-=dt; if(spawnTimer<=0){ if(!doom) trySpawn(); spawnTimer=spawnEvery; }

      // Shrink rings; auto-destroy any that reach the ball untapped (breaks combo).
      var bd=ballDist();
      for(var i=rings.length-1;i>=0;i--){
        rings[i].r-=shrink*dt;
        if(rings[i].r<=bd+CONFIG.ballR*0.5){
          burst(ball.x,ball.y,rings[i].color,5);
          rings.splice(i,1); trySpawn(); repelBall();   // ring touched -> ball repelled
          combo=0;                                      // missed the beat
          Sound.beep(220,0.08,"sine");
        }
      }

      // Game-over ring: closes in and ends the run when it reaches the ball.
      if(doom){
        doom.r -= CONFIG.doomSpeed*dt;
        if(doom.r <= ballDist()+CONFIG.ballR) return end();
      }

      // Particles.
      for(var j=particles.length-1;j>=0;j--){ var p=particles[j];
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.9; p.vy*=0.9; p.life-=dt; if(p.life<=0) particles.splice(j,1); }

      if(popup){ popup.t+=dt; if(popup.t>=popup.dur) popup=null; }
      if(shake>0) shake=Math.max(0,shake-dt*40);
      if(flash>0) flash=Math.max(0,flash-dt*1.6);
      tickScore(dt);
    }

    function render(){
      // Dark backdrop. The radial gradient is built once and reused (cheap).
      if(!bgGrad){ bgGrad=ctx.createRadialGradient(view.w/2, C.y, 60, view.w/2, C.y, 730);
        bgGrad.addColorStop(0,"#151439"); bgGrad.addColorStop(0.6,"#0a0a1c"); bgGrad.addColorStop(1,"#05050e"); }
      ctx.fillStyle=bgGrad; ctx.fillRect(0,0,view.w,view.h);

      ctx.save();
      if(shake>0) ctx.translate(Rand.range(-shake,shake), Rand.range(-shake,shake));

      var bd=ballDist(), bc=ballColor();

      // Rings — plain solid strokes (NO shadowBlur). The ring in the timing
      // window reads as "hot" via a translucent wider stroke behind it.
      for(var i=0;i<rings.length;i++){
        var ring=rings[i], gap=Math.abs(ring.r-bd), hot=gap<=MAXWIN, rr=Math.max(1,ring.r);
        if(hot){ ctx.globalAlpha=0.22; ctx.strokeStyle=ring.color; ctx.lineWidth=20;
          ctx.beginPath(); ctx.arc(C.x,C.y,rr,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
        ctx.strokeStyle=ring.color; ctx.lineWidth=hot?11:7;
        ctx.beginPath(); ctx.arc(C.x,C.y,rr,0,Math.PI*2); ctx.stroke();
      }

      // Game-over ring — a red spiked circle closing in (spikes point inward).
      if(doom){
        var DR=Math.max(1,doom.r), spikes=40, spikeLen=28;
        ctx.strokeStyle="#ff2d55"; ctx.lineWidth=9;
        ctx.beginPath(); ctx.arc(C.x,C.y,DR,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle="#ff2d55"; ctx.beginPath();
        for(var d=0;d<spikes;d++){
          var da=(d/spikes)*Math.PI*2 + tAnim*0.5, a1=da+0.045, a2=da-0.045;
          ctx.moveTo(C.x+Math.cos(a1)*DR, C.y+Math.sin(a1)*DR);
          ctx.lineTo(C.x+Math.cos(da)*(DR-spikeLen), C.y+Math.sin(da)*(DR-spikeLen));
          ctx.lineTo(C.x+Math.cos(a2)*DR, C.y+Math.sin(a2)*DR);
          ctx.closePath();
        }
        ctx.fill();
      }

      // Ball trail — one simple stroked streak of the recent path.
      if(trail.length>1){
        ctx.globalAlpha=0.5; ctx.strokeStyle=bc; ctx.lineWidth=CONFIG.ballR*0.8;
        ctx.lineJoin="round"; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(trail[0].x,trail[0].y);
        for(var t=1;t<trail.length;t++) ctx.lineTo(trail[t].x,trail[t].y);
        ctx.stroke(); ctx.globalAlpha=1;
      }

      // Particles — plain solid dots (NO shadowBlur).
      for(var k=0;k<particles.length;k++){ var p=particles[k];
        ctx.globalAlpha=Math.max(0,p.life*1.8); ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;

      // Ball — cheap "glow" using concentric circles: soft halo + body + core.
      ctx.globalAlpha=0.3; ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(ball.x,ball.y,CONFIG.ballR*1.7,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(ball.x,ball.y,CONFIG.ballR,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(ball.x,ball.y,CONFIG.ballR*0.5,0,Math.PI*2); ctx.fill();

      ctx.restore();

      // Combo popup rendered AT the contact point, drifting upward and fading.
      if(popup){
        var e=popup.t/popup.dur, scale=1+(popup.big?0.7:0.45)*Math.max(0,1-e*3), alpha=1-e;
        var px=Math.max(96, Math.min(view.w-96, popup.x)), py=popup.y-42-e*54;
        ctx.globalAlpha=alpha; ctx.textAlign="center"; ctx.fillStyle=popup.color;
        ctx.font="800 "+Math.round((popup.big?52:42)*scale)+"px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.fillText(popup.text, px, py);
        if(popup.gained>0){ ctx.fillStyle="#fff";
          ctx.font="800 "+Math.round(24*scale)+"px -apple-system,Segoe UI,Roboto,sans-serif";
          ctx.fillText("+"+popup.gained, px, py+30); }
        ctx.globalAlpha=1; ctx.textAlign="left";
      }

      // Current combo readout below the play area (solid, in the ball colour).
      if(combo>=2){ ctx.textAlign="center"; ctx.fillStyle=bc;
        ctx.font="800 34px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.fillText("COMBO x"+combo, C.x, bounds.B+52); ctx.textAlign="left"; }

      // Success flash overlay (stronger for higher grades).
      if(flash>0){ ctx.fillStyle="rgba(255,255,255,"+flash+")"; ctx.fillRect(0,0,view.w,view.h); }
    }

    function end(){
      Loop.stop();
      Store.set("bestScore", Math.max(score, Store.get("bestScore",0)));
      setState("end");
      runEndSequence(score, stats, bestCombo);
      Ad.track("game_end",{ score:score, bestCombo:bestCombo, stats:stats });
    }

    return { reset:reset, onDown:onDown, update:update, render:render };
  })();

  /* ---------- 7. BOOTSTRAP ---------- */
  function startGame(){ Sound.unlock(); Game.reset(); setState("playing"); Ad.track("game_start"); Loop.start(Game.update, Game.render); }
  function init(){
    fitCanvas();
    Input.on(function(){ if(State==="playing") Game.onDown(); });
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);
    Ad.whenReady(function(){ setState("intro"); Ad.track("loaded"); });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); } else { init(); }

})();
</script>
</body>
</html>
