<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bubble Rescue</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #141733;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the square-ish play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .85; }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ff8fab, #ff5964);
    box-shadow: 0 8px 24px rgba(255,89,100,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  /* ---- Persistent CTA banner (visible during gameplay, common in playables) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, timer) ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(15px, 4.5vw, 22px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP  (structure of the creative)
     - #stage/#game : the canvas the game renders into.
     - #hud         : in-game score / timer.
     - .screen      : one overlay per game state (intro, end).
     - #cta-bar     : always-available install button.
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Score: <span id="score">0</span></div>
  <div id="hud-right">Time: <span id="time">0</span></div>
</div>

<!-- Loading screen: shown until assets + ad container are ready -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<!-- Intro screen: title + start button -->
<div id="screen-intro" class="screen hidden">
  <div class="title">BUBBLE RESCUE</div>
  <div class="subtitle">Dig up through the bubbles to free Buddy!<br>Match 3, and pop ⚡ bubbles for huge chain combos.</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<!-- End screen: result + primary CTA to the store -->
<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice!</div>
  <div class="subtitle" id="end-subtitle">You scored <span id="end-score">0</span></div>
  <div class="subtitle" id="end-note" style="margin-top:4px;font-size:clamp(12px,3.5vw,16px);opacity:.7"></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<!-- Persistent CTA (hidden until gameplay begins) -->
<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined)
     Organized top-to-bottom in clearly labeled sections so a new game can
     be produced by editing mostly the CONFIG + GAME sections and leaving
     the ENGINE / AD glue untouched.
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     The knobs a new game changes first. Copy of business/creative params.
     =================================================================== */
  var CONFIG = {
    title: "BUBBLE RESCUE",
    gameSeconds: 45,               // round length; 0 = endless
    // Store links used by the CTA. The correct one is chosen at runtime.
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    // Design resolution — the game logic is authored against this virtual
    // size, then the canvas is scaled to fit any screen (see fitCanvas()).
    designWidth: 720,
    designHeight: 1280,
    bg: "#141733",

    // --- Bubble Rescue specific tunables ---
    cell: 60,                      // grid cell size (square grid, 4-neighbor flood fill)
    cols: 12,                      // 12 * 60 = 720 = designWidth (exact fit)
    rows: 14,                      // total grid rows available
    gridTop: 150,                  // y of the grid's top-left corner (leaves room for the caged mascot above)
    initialRows: 8,                // thick wall of bubbles the player must dig through
    dangerRow: 12,                 // if the wall grows down to this row, the round is lost
    colors: ["#ff5964", "#ffd23f", "#3bceac", "#5390d9", "#c86bfa"],
    ballRadius: 26,
    ballSpeed: 950,                // px/sec
    launcherX: 360,
    launcherY: 1080,
    maxAimDeg: 78,                 // clamp aim so you can't shoot sideways/down

    // --- Rescue objective + electric-chain twist ---
    electricChance: 0.20,          // chance a launched bubble is an electric power bubble
    wallElectricChance: 0.10,      // chance a wall bubble starts electric (fuels chain reactions)
    electricRadius: 2,             // blast radius (in cells) of an electric detonation
    rescueRemaining: 16,           // free the mascot once this few bubbles remain
    comboColor: "#ffd23f"
  };

  /* ===================================================================
     2. ASSETS  (embedded, no network requests)
     Register every asset as a data URI so the file stays self-contained.
     Use tools/embed-asset.mjs to generate these strings.
     Prefer CSS/canvas drawing & WebAudio synth over binary assets to stay
     well under the 5 MB budget; only embed images/sounds you truly need.
     =================================================================== */
  var ASSETS = {
    images: {
      // logo: "data:image/png;base64,iVBORw0KGgo..."
    },
    sounds: {
      // pop: "data:audio/mp3;base64,SUQzBAAAAAA..."
    }
  };

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  // We render at CONFIG.designWidth x designHeight and letterbox-fit the
  // canvas to the viewport using CSS, accounting for devicePixelRatio so
  // drawing stays crisp on retina screens.
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    // Backing store size (crisp), CSS size (fit).
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  // Handles mouse + touch. Coordinates are converted from screen pixels to
  // the virtual design space so game logic never worries about scaling.
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  // Generates simple tones so you get sound without embedding audio files.
  // For richer sound, put base64 clips in ASSETS.sounds and play via Audio.clip.
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      // iOS requires resume() inside a user gesture.
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     Playable ads run inside a network's iframe. We must:
       - wait for the ad container ("mraid") to be ready before starting,
       - route the install button through the network's open() when present,
       - report standard lifecycle events for analytics/QA.
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    // Resolve when the creative may start drawing/interacting.
    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    // The single entry point for "user wants the app". Order matters:
    // MRAID first, then common network globals, then a plain window.open.
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}       // ironSource / generic
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {} // Google Ads
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    // Lightweight event hook. Swap console.log for a network SDK call if needed.
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     States: loading -> intro -> playing -> end. UI.show() toggles overlays.
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      // HUD + CTA bar are only visible during play.
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; },
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME  (the part a new prompt mostly rewrites)
     -------------------------------------------------------------------
     BUBBLE RESCUE — a bubble shooter with a "dig-to-rescue" objective
     and an electric chain-reaction twist:

       - A THICK WALL of bubbles fills the top rows. A caged mascot
         ("Buddy") sits above the wall. The goal is to DIG UPWARD through
         the wall until few enough bubbles remain, which frees the mascot.
       - A launcher at the bottom center holds a "current" bubble and shows
         a "next" one. Aim follows the pointer and is clamped to the upper
         half so you can never shoot sideways or downward.
       - Firing shoots the current bubble in a straight line; it bounces off
         the side walls and stops when it reaches the top or touches an
         existing bubble, snapping to the nearest empty grid cell (BFS).
       - MATCH: after snapping a normal bubble, we flood-fill same-color
         4-neighbors; groups of size >= 3 pop.
       - ELECTRIC (the twist): ~1 in 5 launched bubbles (and some wall
         bubbles) are electric. An electric bubble DETONATES on contact,
         clearing a radius of bubbles regardless of color and CHAINING to
         any other electric bubble caught in the blast — which detonates in
         turn. Big chains = big combos, drawn as lightning arcs.
       - DETACH: any bubble no longer connected to the ceiling (row 0) after
         a pop/detonation falls off-screen (and scores) — so one good chain
         can collapse a huge chunk of the wall.
       - COMBO: every bubble cleared by a single shot is tallied; the flashy
         "MEGA CHAIN xN" callout + a running streak multiplier reward chains.
       - END CONDITIONS:
           (a) rescue: bubbles remaining <= CONFIG.rescueRemaining -> WIN
           (b) 45s timer runs out -> "Time's Up!"
           (c) the wall grows down to CONFIG.dangerRow -> "Wall Too Low!"
     =================================================================== */
  var Game = (function () {
    var CELL = CONFIG.cell, COLS = CONFIG.cols, ROWS = CONFIG.rows,
        GRID_TOP = CONFIG.gridTop, COLORS = CONFIG.colors,
        BALL_R = CONFIG.ballRadius, BALL_SPEED = CONFIG.ballSpeed,
        LX = CONFIG.launcherX, LY = CONFIG.launcherY,
        MAX_AIM = CONFIG.maxAimDeg * Math.PI / 180,
        E_RADIUS = CONFIG.electricRadius;

    var COLLIDE_DIST = CELL * 0.92; // distance threshold to treat two bubbles as touching
    var PI2 = Math.PI * 2;
    var MASCOT_X = 360, MASCOT_BASE_Y = 72, MASCOT_R = 38;

    var grid;            // grid[row][col] = color index or null
    var elec;            // elec[row][col] = true if that bubble is electric
    var score, timeLeft;
    var ball;            // { x, y, vx, vy, color, r, flying, electric }
    var nextColor, nextElectric;
    var aimAngle;        // radians, 0 = straight up, clamped to +/- MAX_AIM
    var particles;       // pop dust
    var fallers;         // detached bubbles falling off-screen
    var arcs;            // lightning arcs (visual only)
    var comboText;       // floating combo callout { text, life, maxLife, big }
    var streak;          // consecutive clearing shots (score multiplier)
    var maxChain;        // biggest single-shot clear (shown on end screen)
    var initialCount;    // bubbles at start (for the rescue progress bar)
    var ended, rescued, rescueT;
    var mascotY;         // animated mascot y (rises when freed)

    // --- grid helpers -------------------------------------------------
    function cellX(col) { return col * CELL + CELL / 2; }
    function cellY(row) { return GRID_TOP + row * CELL + CELL / 2; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function key(r, c) { return r + "_" + c; }

    function makeGrid() {
      var g = [];
      for (var r = 0; r < ROWS; r++) {
        var row = [];
        for (var c = 0; c < COLS; c++) row.push(null);
        g.push(row);
      }
      return g;
    }
    function makeElec() {
      var g = [];
      for (var r = 0; r < ROWS; r++) {
        var row = [];
        for (var c = 0; c < COLS; c++) row.push(false);
        g.push(row);
      }
      return g;
    }

    function fillInitialRows() {
      for (var r = 0; r < CONFIG.initialRows; r++) {
        for (var c = 0; c < COLS; c++) {
          grid[r][c] = Rand.int(0, COLORS.length - 1);
          elec[r][c] = Math.random() < CONFIG.wallElectricChance;
        }
      }
    }

    function bubbleCount() {
      var n = 0;
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) if (grid[r][c] !== null) n++;
      }
      return n;
    }

    // BFS outward from (row,col) to find the nearest empty cell (4-neighbor).
    // Always terminates: the grid is finite and every visited cell is queued once.
    function findNearestEmpty(row, col) {
      row = clamp(row, 0, ROWS - 1);
      col = clamp(col, 0, COLS - 1);
      var visited = {};
      var queue = [{ r: row, c: col }];
      visited[key(row, col)] = true;
      while (queue.length > 0) {
        var cur = queue.shift();
        if (grid[cur.r][cur.c] === null) return cur;
        var neighbors = [
          { r: cur.r - 1, c: cur.c }, { r: cur.r + 1, c: cur.c },
          { r: cur.r, c: cur.c - 1 }, { r: cur.r, c: cur.c + 1 }
        ];
        for (var i = 0; i < neighbors.length; i++) {
          var n = neighbors[i];
          if (n.r < 0 || n.r >= ROWS || n.c < 0 || n.c >= COLS) continue;
          var k = key(n.r, n.c);
          if (visited[k]) continue;
          visited[k] = true;
          queue.push(n);
        }
      }
      return null; // board completely full (edge case)
    }

    // BFS collecting the connected same-color group from (row,col).
    function floodFillGroup(row, col) {
      var color = grid[row][col];
      var visited = {};
      var queue = [{ r: row, c: col }];
      visited[key(row, col)] = true;
      var group = [];
      while (queue.length > 0) {
        var cur = queue.shift();
        group.push(cur);
        var neighbors = [
          { r: cur.r - 1, c: cur.c }, { r: cur.r + 1, c: cur.c },
          { r: cur.r, c: cur.c - 1 }, { r: cur.r, c: cur.c + 1 }
        ];
        for (var i = 0; i < neighbors.length; i++) {
          var n = neighbors[i];
          if (n.r < 0 || n.r >= ROWS || n.c < 0 || n.c >= COLS) continue;
          if (grid[n.r][n.c] !== color) continue;
          var k = key(n.r, n.c);
          if (visited[k]) continue;
          visited[k] = true;
          queue.push(n);
        }
      }
      return group;
    }

    function checkGridCollision(b) {
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          if (grid[r][c] === null) continue;
          var dx = b.x - cellX(c), dy = b.y - cellY(r);
          if (Math.sqrt(dx * dx + dy * dy) <= COLLIDE_DIST) return true;
        }
      }
      return false;
    }

    // Remove a matched group; returns nothing (grid mutated in place).
    function popGroup(group) {
      for (var i = 0; i < group.length; i++) {
        var g = group[i];
        spawnParticles(cellX(g.c), cellY(g.r), COLORS[grid[g.r][g.c]], 8);
        grid[g.r][g.c] = null;
        elec[g.r][g.c] = false;
      }
    }

    // Electric chain reaction: detonate a radius blast from each seed cell,
    // hopping to any other electric bubble caught in the blast. Returns the
    // number of bubbles removed. Terminates (each electric cell queued once).
    function detonateElectric(seeds) {
      var queue = seeds.slice();
      var queued = {};
      for (var s = 0; s < seeds.length; s++) queued[key(seeds[s].r, seeds[s].c)] = true;
      var removed = 0;
      while (queue.length > 0) {
        var e = queue.shift();
        var ex = cellX(e.c), ey = cellY(e.r);
        for (var r = e.r - E_RADIUS; r <= e.r + E_RADIUS; r++) {
          for (var c = e.c - E_RADIUS; c <= e.c + E_RADIUS; c++) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
            if (grid[r][c] === null) continue;
            var dr = r - e.r, dc = c - e.c;
            if (dr * dr + dc * dc > E_RADIUS * E_RADIUS + 0.5) continue; // roughly circular
            // Chain to other electric bubbles before we clear them.
            if (elec[r][c] && !queued[key(r, c)]) { queued[key(r, c)] = true; queue.push({ r: r, c: c }); }
            arcs.push({ x1: ex, y1: ey, x2: cellX(c), y2: cellY(r), life: 0.22, maxLife: 0.22 });
            spawnParticles(cellX(c), cellY(r), COLORS[grid[r][c]], 6);
            grid[r][c] = null;
            elec[r][c] = false;
            removed++;
          }
        }
      }
      return removed;
    }

    // Remove bubbles no longer connected to the ceiling (row 0). They fall.
    // Returns the number of bubbles that dropped.
    function dropFloating() {
      var anchored = {};
      var queue = [];
      for (var c = 0; c < COLS; c++) {
        if (grid[0][c] !== null) { anchored[key(0, c)] = true; queue.push({ r: 0, c: c }); }
      }
      while (queue.length > 0) {
        var cur = queue.shift();
        var neighbors = [
          { r: cur.r - 1, c: cur.c }, { r: cur.r + 1, c: cur.c },
          { r: cur.r, c: cur.c - 1 }, { r: cur.r, c: cur.c + 1 }
        ];
        for (var i = 0; i < neighbors.length; i++) {
          var n = neighbors[i];
          if (n.r < 0 || n.r >= ROWS || n.c < 0 || n.c >= COLS) continue;
          if (grid[n.r][n.c] === null) continue;
          var k = key(n.r, n.c);
          if (anchored[k]) continue;
          anchored[k] = true;
          queue.push(n);
        }
      }
      var count = 0;
      for (var r = 0; r < ROWS; r++) {
        for (var cc = 0; cc < COLS; cc++) {
          if (grid[r][cc] === null) continue;
          if (anchored[key(r, cc)]) continue;
          fallers.push({
            x: cellX(cc), y: cellY(r),
            vx: Rand.range(-40, 40), vy: Rand.range(0, 90),
            color: COLORS[grid[r][cc]], electric: elec[r][cc], r: BALL_R
          });
          grid[r][cc] = null;
          elec[r][cc] = false;
          count++;
        }
      }
      return count;
    }

    // --- particles ------------------------------------------------------
    function spawnParticles(x, y, color, count) {
      for (var i = 0; i < count; i++) {
        var ang = Rand.range(0, PI2);
        var spd = Rand.range(60, 240);
        particles.push({
          x: x, y: y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          life: 0.5, maxLife: 0.5, color: color, r: Rand.range(3, 6)
        });
      }
    }

    // --- launcher / ball --------------------------------------------------
    function rollElectric() { return Math.random() < CONFIG.electricChance; }
    function newBall(colorIndex, isElectric) {
      return { x: LX, y: LY, vx: 0, vy: 0, color: colorIndex, r: BALL_R, flying: false, electric: !!isElectric };
    }

    function updateAimFromPoint(p) {
      var dx = p.x - LX, dy = p.y - LY;
      var raw = Math.atan2(dx, -dy); // 0 = straight up
      aimAngle = clamp(raw, -MAX_AIM, MAX_AIM);
    }

    function fire() {
      if (ball.flying || ended || rescued) return;
      var dirX = Math.sin(aimAngle), dirY = -Math.cos(aimAngle);
      ball.vx = dirX * BALL_SPEED;
      ball.vy = dirY * BALL_SPEED;
      ball.flying = true;
      Sound.beep(ball.electric ? 260 : 320, 0.06, "square");
    }

    function snapBall() {
      var col = Math.round((ball.x - CELL / 2) / CELL);
      var row = Math.round((ball.y - GRID_TOP - CELL / 2) / CELL);
      var cell = findNearestEmpty(row, col);
      if (!cell) { endRound("Board Full!"); return; }

      grid[cell.r][cell.c] = ball.color;
      elec[cell.r][cell.c] = ball.electric;
      ball.flying = false;

      var cleared = 0;

      if (ball.electric) {
        // Power bubble: detonate on contact and chain through the wall.
        cleared += detonateElectric([{ r: cell.r, c: cell.c }]);
        Sound.beep(190, 0.16, "sawtooth");
        Sound.beep(90, 0.24, "square");
      } else {
        // Normal bubble: resolve a >=3 same-color match.
        var group = floodFillGroup(cell.r, cell.c);
        if (group.length >= 3) {
          // Capture electric bubbles in the group before we clear it.
          var seeds = [];
          for (var i = 0; i < group.length; i++) {
            if (elec[group[i].r][group[i].c]) seeds.push({ r: group[i].r, c: group[i].c });
          }
          popGroup(group);
          cleared += group.length;
          Sound.beep(500 + group.length * 40, 0.16, "triangle");
          if (seeds.length) { cleared += detonateElectric(seeds); Sound.beep(190, 0.16, "sawtooth"); }
        }
      }

      // Bubbles cut off from the ceiling drop away (and score).
      var fell = dropFloating();
      cleared += fell;

      // Combo + scoring.
      if (cleared > 0) {
        streak++;
        score += cleared * 10 * streak;
        if (cleared > maxChain) maxChain = cleared;
        UI.setScore(score);
        showCombo(streak, cleared);
        if (fell > 0) Sound.beep(300 + Math.min(fell, 20) * 15, 0.2, "triangle");
      } else {
        streak = 0;
      }

      // Win / lose checks triggered by this placement.
      var remaining = bubbleCount();
      if (remaining <= CONFIG.rescueRemaining) { freeMascot(); return; }
      if (cell.r >= CONFIG.dangerRow) { endRound("Wall Too Low!"); return; }

      // Prepare the next shot.
      ball = newBall(nextColor, nextElectric);
      nextColor = Rand.int(0, COLORS.length - 1);
      nextElectric = rollElectric();
    }

    function showCombo(mult, cleared) {
      var big = cleared >= 6;
      var txt = big ? ("MEGA CHAIN x" + cleared + "!")
                    : (mult > 1 ? ("COMBO x" + mult) : ("+" + cleared));
      comboText = { text: txt, life: 1.0, maxLife: 1.0, big: big };
    }

    // Rescue succeeded: play a short celebration, then show the end screen.
    function freeMascot() {
      if (rescued || ended) return;
      rescued = true;
      rescueT = 1.1;
      spawnParticles(MASCOT_X, MASCOT_BASE_Y, "#ffd23f", 30);
      Sound.beep(660, 0.12, "triangle");
      Sound.beep(880, 0.16, "triangle");
    }

    // --- lifecycle --------------------------------------------------------
    function reset() {
      grid = makeGrid();
      elec = makeElec();
      fillInitialRows();
      score = 0;
      timeLeft = CONFIG.gameSeconds;
      aimAngle = 0;
      particles = []; fallers = []; arcs = []; comboText = null;
      streak = 0; maxChain = 0;
      ended = false; rescued = false; rescueT = 0;
      mascotY = MASCOT_BASE_Y;
      initialCount = bubbleCount();
      ball = newBall(Rand.int(0, COLORS.length - 1), rollElectric());
      nextColor = Rand.int(0, COLORS.length - 1);
      nextElectric = rollElectric();
      UI.setScore(0);
      UI.setTime(timeLeft);
    }

    // onMove: continuously aim toward the pointer (desktop drag-to-aim).
    function onMove(p) {
      if (ended || rescued || ball.flying) return;
      updateAimFromPoint(p);
    }

    // onDown: snap the aim to the tap point first (touch fires "down" before
    // any "move"), then fire the current bubble along that aim.
    function onDown(p) {
      if (ended || rescued || ball.flying) return;
      updateAimFromPoint(p);
      fire();
    }

    function update(dt) {
      if (ended) return;

      // Victory celebration: mascot rises, cage fades, then end screen.
      if (rescued) {
        rescueT -= dt;
        mascotY -= dt * 170;
        updateFx(dt);
        if (rescueT <= 0) endRound("Buddy Freed!");
        return;
      }

      if (CONFIG.gameSeconds > 0) {
        timeLeft -= dt;
        UI.setTime(Math.max(0, Math.ceil(timeLeft)));
        if (timeLeft <= 0) { endRound("Time's Up!"); return; }
      }

      // Sub-step the flying ball so fast motion can't tunnel through walls
      // or bubbles; each step is small relative to the ball radius.
      if (ball.flying) {
        var remaining = dt;
        var maxStep = BALL_R / BALL_SPEED;
        while (ball.flying && remaining > 0) {
          var step = Math.min(remaining, maxStep);
          ball.x += ball.vx * step;
          ball.y += ball.vy * step;
          remaining -= step;

          if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = -ball.vx; }
          else if (ball.x + BALL_R > view.w) { ball.x = view.w - BALL_R; ball.vx = -ball.vx; }

          if (ball.y - BALL_R <= GRID_TOP) { snapBall(); break; }
          if (checkGridCollision(ball)) { snapBall(); break; }
        }
      }

      updateFx(dt);
    }

    // Advance all visual-only effects (particles, fallers, arcs, combo text).
    function updateFx(dt) {
      for (var i = particles.length - 1; i >= 0; i--) {
        var pt = particles[i];
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vy += 500 * dt; // gentle gravity for juice
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }
      for (var j = fallers.length - 1; j >= 0; j--) {
        var f = fallers[j];
        f.x += f.vx * dt; f.y += f.vy * dt;
        f.vy += 1400 * dt; // heavier gravity so they drop away quickly
        if (f.y - f.r > view.h) fallers.splice(j, 1);
      }
      for (var a = arcs.length - 1; a >= 0; a--) {
        arcs[a].life -= dt;
        if (arcs[a].life <= 0) arcs.splice(a, 1);
      }
      if (comboText) { comboText.life -= dt; if (comboText.life <= 0) comboText = null; }
    }

    function render() {
      ctx.fillStyle = CONFIG.bg;
      ctx.fillRect(0, 0, view.w, view.h);

      drawMascot();
      drawRescueBar();

      // Danger line hint (wall must not reach here).
      var dangerY = GRID_TOP + CONFIG.dangerRow * CELL;
      ctx.save();
      ctx.strokeStyle = "rgba(255,89,100,.45)";
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(0, dangerY); ctx.lineTo(view.w, dangerY);
      ctx.stroke();
      ctx.restore();

      // Grid bubbles.
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var ci = grid[r][c];
          if (ci === null) continue;
          drawBubble(cellX(c), cellY(r), BALL_R, COLORS[ci], elec[r][c]);
        }
      }

      // Falling (detached) bubbles.
      for (var f = 0; f < fallers.length; f++) {
        drawBubble(fallers[f].x, fallers[f].y, fallers[f].r, fallers[f].color, fallers[f].electric);
      }

      // Pop particles.
      for (var i = 0; i < particles.length; i++) {
        var pt = particles[i];
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, PI2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Lightning arcs from electric chains.
      drawArcs();

      // Aim line (only while the current ball waits at the launcher).
      if (!ball.flying && !ended && !rescued) {
        var dirX = Math.sin(aimAngle), dirY = -Math.cos(aimAngle);
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,.5)";
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 10]);
        ctx.beginPath();
        ctx.moveTo(LX, LY);
        ctx.lineTo(LX + dirX * 260, LY + dirY * 260);
        ctx.stroke();
        ctx.restore();
      }

      // Launcher pad.
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.beginPath(); ctx.arc(LX, LY, BALL_R + 14, 0, PI2); ctx.fill();

      // Current ball.
      if (!rescued) drawBubble(ball.x, ball.y, BALL_R, COLORS[ball.color], ball.electric);

      // Next-bubble preview.
      var nx = LX + 130, ny = LY;
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("NEXT", nx, ny - BALL_R * 0.62 - 10);
      drawBubble(nx, ny, BALL_R * 0.62, COLORS[nextColor], nextElectric);

      // Combo callout.
      drawCombo();
    }

    function drawBubble(x, y, r, color, electric) {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, PI2);
      if (electric) {
        var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
        g.addColorStop(0, "#eafcff");
        g.addColorStop(0.5, "#5ad7ff");
        g.addColorStop(1, "#2a6df4");
        ctx.fillStyle = g;
        ctx.shadowColor = "#5ad7ff";
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = color;
        ctx.shadowColor = "rgba(0,0,0,.35)";
        ctx.shadowBlur = 4;
      }
      ctx.fill();
      ctx.restore();

      // Simple shine to make it read as glossy/juicy.
      ctx.beginPath();
      ctx.arc(x - r * 0.32, y - r * 0.32, r * 0.32, 0, PI2);
      ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fill();

      // Lightning bolt glyph on electric bubbles.
      if (electric) {
        ctx.save();
        ctx.strokeStyle = "#fffde0";
        ctx.lineWidth = Math.max(2, r * 0.09);
        ctx.lineJoin = "round"; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x + r * 0.10, y - r * 0.5);
        ctx.lineTo(x - r * 0.18, y + r * 0.06);
        ctx.lineTo(x + r * 0.06, y + r * 0.06);
        ctx.lineTo(x - r * 0.12, y + r * 0.5);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawArcs() {
      for (var i = 0; i < arcs.length; i++) {
        var a = arcs[i], t = a.life / a.maxLife;
        ctx.save();
        ctx.globalAlpha = t;
        ctx.strokeStyle = "#bfefff";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#5ad7ff";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(a.x1, a.y1);
        var seg = 4;
        for (var s = 1; s < seg; s++) {
          var fr = s / seg;
          var mx = a.x1 + (a.x2 - a.x1) * fr + (Math.random() - 0.5) * 14;
          var my = a.y1 + (a.y2 - a.y1) * fr + (Math.random() - 0.5) * 14;
          ctx.lineTo(mx, my);
        }
        ctx.lineTo(a.x2, a.y2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // The caged mascot the player is digging up to rescue.
    function drawMascot() {
      var x = MASCOT_X, y = mascotY, r = MASCOT_R;

      // Body.
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, PI2);
      var g = ctx.createRadialGradient(x - 10, y - 12, 6, x, y, r);
      g.addColorStop(0, "#fff2a8");
      g.addColorStop(1, "#ffcf3f");
      ctx.fillStyle = g;
      ctx.shadowColor = "rgba(0,0,0,.35)";
      ctx.shadowBlur = 6;
      ctx.fill();
      ctx.restore();

      // Eyes.
      ctx.fillStyle = "#2a2140";
      ctx.beginPath(); ctx.arc(x - 11, y - 4, 5, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 11, y - 4, 5, 0, PI2); ctx.fill();
      // Eye sparkle.
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x - 13, y - 6, 1.6, 0, PI2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 9, y - 6, 1.6, 0, PI2); ctx.fill();

      // Beak.
      ctx.fillStyle = "#ff8a3d";
      ctx.beginPath();
      ctx.moveTo(x - 7, y + 8); ctx.lineTo(x + 7, y + 8); ctx.lineTo(x, y + 18);
      ctx.closePath(); ctx.fill();

      // Cage bars — fade out as the mascot is freed.
      var cageA = rescued ? Math.max(0, rescueT / 1.1) : 1;
      if (cageA > 0) {
        ctx.save();
        ctx.globalAlpha = cageA;
        ctx.strokeStyle = "rgba(205,214,235,.9)";
        ctx.lineWidth = 5; ctx.lineCap = "round";
        for (var i = -2; i <= 2; i++) {
          var bx = MASCOT_X + i * 18;
          ctx.beginPath();
          ctx.moveTo(bx, MASCOT_BASE_Y - r - 12);
          ctx.lineTo(bx, MASCOT_BASE_Y + r + 12);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(MASCOT_X - r - 6, MASCOT_BASE_Y - r - 12);
        ctx.lineTo(MASCOT_X + r + 6, MASCOT_BASE_Y - r - 12);
        ctx.stroke();
        ctx.restore();
      }
    }

    // Progress toward the rescue, drawn just above the wall.
    function drawRescueBar() {
      var remaining = bubbleCount();
      var denom = Math.max(1, initialCount - CONFIG.rescueRemaining);
      var prog = clamp((initialCount - remaining) / denom, 0, 1);
      var bw = view.w * 0.6, bh = 14, bx = (view.w - bw) / 2, by = GRID_TOP - 26;

      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,.12)";
      roundRectPath(bx, by, bw, bh, 7); ctx.fill();
      ctx.fillStyle = "#ffd23f";
      roundRectPath(bx, by, bw * prog, bh, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("RESCUE " + Math.round(prog * 100) + "%", view.w / 2, by - 6);
      ctx.restore();
    }

    function drawCombo() {
      if (!comboText) return;
      var t = comboText.life / comboText.maxLife;
      var scale = comboText.big ? (1.2 + (1 - t) * 0.3) : (1 + (1 - t) * 0.15);
      ctx.save();
      ctx.globalAlpha = Math.min(1, t * 1.5);
      ctx.translate(view.w / 2, LY - 170);
      ctx.scale(scale, scale);
      ctx.textAlign = "center";
      ctx.font = "bold " + (comboText.big ? 40 : 30) + "px sans-serif";
      ctx.fillStyle = comboText.big ? "#5ad7ff" : CONFIG.comboColor;
      ctx.shadowColor = "rgba(0,0,0,.5)";
      ctx.shadowBlur = 6;
      ctx.fillText(comboText.text, 0, 0);
      ctx.restore();
    }

    // Rounded-rect path (older WebViews lack ctx.roundRect).
    function roundRectPath(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function endRound(title) {
      if (ended) return;
      ended = true;
      Loop.stop();
      Store.set("bestScore", Math.max(score, Store.get("bestScore", 0)));
      UI.setEnd(title, score);
      var note = $("end-note");
      if (note) note.textContent = "Best chain: " + maxChain + " bubble" + (maxChain === 1 ? "" : "s");
      setState("end");
      Ad.track("game_end", { score: score, reason: title, maxChain: maxChain });
    }

    return { reset: reset, onDown: onDown, onMove: onMove, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;

    // Route all inputs to the current game.
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing") Game.onMove(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  // Kick off after DOM is parsed.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
