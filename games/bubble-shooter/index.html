<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bubble Blight</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0e24;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title {
    font-size: clamp(26px, 9vw, 56px); font-weight: 900; letter-spacing: 1px;
    background: linear-gradient(180deg, #ffffff, #9fd0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 4px 30px rgba(90,150,255,.5);
  }
  .subtitle { margin-top: 14px; font-size: clamp(14px, 4vw, 20px); opacity: .9; line-height: 1.5; }

  /* App icon on the intro screen */
  #app-icon {
    width: clamp(120px, 38vw, 190px); height: auto;
    border-radius: 26px;
    box-shadow: 0 12px 34px rgba(0,0,0,.55), 0 0 40px rgba(58,160,255,.4);
    animation: iconfloat 3s ease-in-out infinite;
    margin-bottom: 6px;
  }
  @keyframes iconfloat { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 26px; padding: 17px 40px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 23px); font-weight: 900; color: #fff; cursor: pointer;
    letter-spacing: .5px;
    background: linear-gradient(180deg, #ff8fab, #ff3d6b);
    box-shadow: 0 10px 30px rgba(255,61,107,.5), inset 0 2px 6px rgba(255,255,255,.4);
    animation: pulse 1.3s ease-in-out infinite;
  }
  .btn:active { transform: scale(.95); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.07);} }

  /* ---- Persistent CTA banner (visible during gameplay) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, timer) — sits above the top row, drawn with a strong
         shadow so it stays readable over the flush-to-top bubbles. ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 12px 18px;
    color: #fff; font-weight: 900; font-size: clamp(16px, 4.6vw, 24px);
    pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.8);
  }
  #hud.hidden { display: none; }
  #hud .label { font-size: .62em; opacity: .85; font-weight: 800; letter-spacing: 1px; }
  #hud .pill { background: rgba(0,0,0,.4); padding: 4px 12px; border-radius: 12px; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ==== Cinematic end screen (adapted from Bubbly) ==== */
  #screen-end { justify-content: center; background: rgba(5,8,24,.90); }
  .eo-title {
    font-size: clamp(28px,10vw,60px); font-weight: 900; letter-spacing: 3px; color: #ff4d6d;
    text-shadow: 0 0 20px rgba(255,77,109,.85), 0 0 42px rgba(255,77,109,.4);
    opacity: 0; transform: scale(.55);
    transition: opacity .4s ease, transform .45s cubic-bezier(.2,1.7,.4,1);
  }
  .eo-title.show { opacity: 1; transform: scale(1); }
  .eo-scorelbl {
    margin-top: 16px; font-size: 13px; font-weight: 800; letter-spacing: 5px; color: #9fc4e0;
    opacity: 0; transition: opacity .4s ease;
  }
  .eo-scorelbl.show { opacity: 1; }
  .eo-score {
    font-size: clamp(52px,17vw,100px); font-weight: 900; line-height: 1; color: #eafcff;
    text-shadow: 0 0 18px rgba(58,160,255,.8);
    opacity: 0; transform: scale(.7); transition: opacity .35s ease, transform .35s ease;
  }
  .eo-score.show { opacity: 1; transform: scale(1); }
  .eo-score.pop { animation: eopop .45s ease; }
  @keyframes eopop { 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }
  /* Star rating */
  .eo-stars { margin-top: 18px; display: flex; gap: 14px; justify-content: center; align-items: center; }
  .star {
    font-size: clamp(38px,12vw,66px); line-height: 1;
    opacity: 0; transform: scale(.3); transition: opacity .2s ease;
  }
  .star.dim { opacity: 1; transform: scale(.82); color: rgba(255,255,255,.12); text-shadow: 0 0 6px rgba(0,0,0,.4); }
  .star.on {
    opacity: 1; color: #ffd43b;
    background: linear-gradient(180deg,#fff6bf 0%,#ffd43b 55%,#ff9f1c 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: starslam .6s cubic-bezier(.2,1.8,.35,1), starglow 1.9s ease-in-out .6s infinite;
  }
  @keyframes starslam { 0%{transform:scale(2.6);} 55%{transform:scale(.86);} 100%{transform:scale(1);} }
  @keyframes starglow {
    0%,100%{filter:drop-shadow(0 0 8px rgba(255,200,60,.7));}
    50%{filter:drop-shadow(0 0 20px rgba(255,225,130,1));}
  }
  /* Stat rows */
  .eo-stats { margin-top: 22px; width: min(340px,82vw); display: flex; flex-direction: column; gap: 8px; }
  .eo-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-radius: 12px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    font-weight: 800; font-size: clamp(14px,4.4vw,19px);
    opacity: 0; transform: translateX(-18px); transition: opacity .3s ease, transform .3s ease;
  }
  .eo-row.show { opacity: 1; transform: translateX(0); }
  .eo-val { font-variant-numeric: tabular-nums; }
  .eo-row[data-grade="COMBO"] { color: #3aa0ff; background: rgba(58,160,255,.09); border-color: rgba(58,160,255,.3); }
  .eo-row[data-grade="BEST"] {
    position: relative; overflow: hidden; color: #fff3b0;
    background: linear-gradient(90deg,rgba(255,175,40,.16),rgba(255,220,130,.26),rgba(255,175,40,.16));
    border-color: rgba(255,215,110,.6); box-shadow: 0 0 18px rgba(255,200,60,.3);
  }
  .eo-row[data-grade="BEST"] .eo-val { color: #ffe58a; text-shadow: 0 0 10px rgba(255,205,70,.7); }
  .eo-row[data-grade="BEST"]::after {
    content:""; position:absolute; top:0; left:-60%; width:45%; height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg); animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%{left:-60%;} 55%,100%{left:130%;} }
  .ps { display: inline-block; color: #ffd43b; filter: drop-shadow(0 0 6px rgba(255,205,80,.9));
    animation: twinkle 1.8s ease-in-out infinite; }
  .ps:last-child { animation-delay: .9s; }
  @keyframes twinkle { 0%,100%{opacity:.65;transform:scale(.85) rotate(0deg);} 50%{opacity:1;transform:scale(1.15) rotate(20deg);} }
  /* Confetti overlay */
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
  #screen-end .btn { opacity: 0; pointer-events: none; transition: opacity .5s ease; margin-top: 24px; }
  #screen-end .btn.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

     MARKUP  (structure of the creative)

  <canvas id="game"></canvas>

</div>

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type, vol) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      var v = vol == null ? 0.3 : vol;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(v, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {}
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  // Lightweight confetti on its own overlay canvas — independent rAF, idles
  // when all pieces leave the screen.
  var Confetti = (function () {
    var cvs = null, cx = null, parts = [], running = false, last = 0, W = 0, H = 0;
    var COLORS = ["#3aa0ff","#ff4d6d","#ffd43b","#39ff14","#c86bff","#ff8fab","#ffffff"];
    function size() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px"; cvs.style.height = H + "px";
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function frame(now) {
      var dt = Math.min((now - last) / 1000, 0.05); last = now;
      cx.clearRect(0, 0, W, H);
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
        if (p.life <= 0 || p.y > H + 30) { parts.splice(i, 1); continue; }
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
        cx.globalAlpha = Math.max(0, Math.min(1, p.life));
        cx.fillStyle = p.color; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cx.restore();
      }
      if (parts.length > 0) { requestAnimationFrame(frame); } else { running = false; cx.clearRect(0, 0, W, H); }
    }
    function burst(n) {
      cvs = cvs || $("confetti"); if (!cvs) return;
      cx = cx || cvs.getContext("2d"); size();
      for (var i = 0; i < n; i++) {
        parts.push({ x: W * (0.15 + Math.random() * 0.7), y: H * (0.28 + Math.random() * 0.12),
          vx: (Math.random() - 0.5) * 520, vy: -Math.random() * 520 - 120,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12,
          w: 6 + Math.random() * 8, h: 9 + Math.random() * 11,
          color: COLORS[(Math.random() * COLORS.length) | 0], life: 1.8 + Math.random() * 1.4 });
      }
      if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
    }
    function clear() { parts = []; if (cx) cx.clearRect(0, 0, W, H); }
    return { burst: burst, clear: clear };
  })();

  // Animate a number from 0 to target inside an element, with ease-out cubic.
  function countUp(el, target, dur, cb) {
    var start = performance.now();
    function step(now) {
      var p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(e * target);
      if (p < 1) { requestAnimationFrame(step); } else { el.textContent = target; if (cb) cb(); }
    }
    requestAnimationFrame(step);
  }

  // Cinematic end-screen sequence: title → score count-up + confetti → stars
  // slam in → stat rows cascade → install CTA appears.
  var endTimers = [];
  function runEndSequence(title, score, cleared, maxCombo, best, stars) {
    endTimers.forEach(clearTimeout); endTimers = [];
    Confetti.clear();
    // Reset all animated elements.
    ["eo-title","eo-scorelbl","eo-score"].forEach(function (id) { $(id).classList.remove("show","pop"); });
    $("eo-score").textContent = "0";
    $("btn-install").classList.remove("show");
    $("eo-stars").classList.remove("show");
    for (var s0 = 1; s0 <= 3; s0++) { $("star-" + s0).classList.remove("on","dim"); }
    ["cleared","combo","best"].forEach(function (k) {
      $("eo-r-" + k).classList.remove("show"); $("eo-v-" + k).textContent = "0";
    });
    function T(fn, ms) { endTimers.push(setTimeout(fn, ms)); }

    // 1) Title slams in.
    $("eo-title").textContent = title;
    T(function () { $("eo-title").classList.add("show"); }, 120);

    // 2) Score counts up with confetti bursts.
    T(function () {
      $("eo-scorelbl").classList.add("show"); $("eo-score").classList.add("show");
      Confetti.burst(70);
      countUp($("eo-score"), score, 1100, function () {
        $("eo-score").classList.add("pop");
        Sound.beep(900, 0.14, "triangle");
        Confetti.burst(90);
      });
    }, 560);

    // 3) Stars slam in one by one with chimes.
    var starBase = 1950, starGap = 440, starFreqs = [660, 880, 1180];
    T(function () {
      $("eo-stars").classList.add("show");
      for (var s = 1; s <= 3; s++) $("star-" + s).classList.add("dim");
    }, starBase - 160);
    for (var si = 0; si < stars; si++) { (function (idx) {
      T(function () {
        var el = $("star-" + (idx + 1));
        el.classList.remove("dim"); el.classList.add("on");
        Sound.beep(starFreqs[idx] || 1180, 0.16, "triangle");
        Confetti.burst(30);
      }, starBase + idx * starGap);
    })(si); }

    // 4) Stat rows cascade in.
    var rows = [["cleared", cleared], ["combo", maxCombo], ["best", best]];
    var rowStart = starBase + Math.max(stars, 1) * starGap + 350, gap = 260;
    rows.forEach(function (r, i) {
      T(function () {
        $("eo-r-" + r[0]).classList.add("show");
        countUp($("eo-v-" + r[0]), r[1], 450);
        Sound.beep(480 + i * 80, 0.05, "triangle");
      }, rowStart + i * gap);
    });

    // 5) Install CTA appears last.
    T(function () { $("btn-install").classList.add("show"); }, rowStart + rows.length * gap + 1400);
  }

  /* ===================================================================
     6. GAME
     -------------------------------------------------------------------
     BUBBLE BLAST — a classic hexagonal bubble shooter, tuned for a smooth
     frame rate and maximum visual impact:

       - A hex grid of colored bubbles hangs flush against the top. Rows are
         staggered; a `rowShift` counter lets us push new rows in from the
         top while every existing bubble keeps its geometry (parity =
         (row + rowShift)). Only THREE base colors are used.
       - SUPER bubbles: rare multicolor (rainbow) bubbles. They act as
         wildcards in a match, and — the key twist — popping ONE super
         detonates EVERY other super on the board at once (each clears its
         neighbors), for a huge multicolor chain.
       - Drag to aim (a dotted trajectory with one wall-bounce shows the
         path — no ghost bubble); release to fire. Taps fire straight away.
       - MATCH: same-color flood-fill of the landing cell; groups of >=3 pop.
         Disconnected bubbles fall and score.
       - PERFORMANCE: every bubble (and the background) is pre-rendered once
         to a cached sprite and blitted with drawImage — no per-frame canvas
         gradients or shadowBlur, which is what makes it run smoothly. Juice
         (shake, flash, hit-stop, particles, combo text) uses only cheap
         fills.
       - END: 60s timer -> "TIME'S UP!";  a bubble past the danger line -> "OVERRUN!".
     =================================================================== */
  var Game = (function () {
    var R = CONFIG.bubbleR, COLS = CONFIG.cols;
    var ROWS = 22;                          // fixed grid height
    var GRID_TOP = CONFIG.gridTop;
    var ROWH = R * Math.sqrt(3);            // vertical spacing between hex rows
    var LX = CONFIG.designWidth / 2, LY = CONFIG.launcherY;
    var PAL = CONFIG.palette;
    var SPEED = CONFIG.shootSpeed;
    var MAX_AIM = CONFIG.maxAimDeg * Math.PI / 180;
    var DANGER_Y = CONFIG.dangerY;
    var ADD_SHOTS = CONFIG.addRowShots;
    var WALL_SUP = CONFIG.wallSuperChance, SHOT_SUP = CONFIG.shotSuperChance;
    var PI2 = Math.PI * 2;
    var COLLIDE = R * 2 * 0.9;              // centers this close => touching
    var MAX_PARTICLES = 220;               // hard cap so bursts never flood the frame

    // --- state -------------------------------------------------------
    var grid;            // grid[r][c] = color index or null
    var sup;             // sup[r][c]  = true if that bubble is a SUPER (rainbow)
    var blk;             // blk[r][c]  = true if that bubble is contaminated (black)
    var wobble;          // wobble[r][c] = 0..1 impact tremor intensity (decays per frame)
    var rowShift;        // parity offset so pushed-in rows keep geometry consistent
    var score, timeLeft;
    var ball;            // { x, y, vx, vy, color, sup, flying }
    var nextColor, nextSuper;
    var aimAngle;        // radians, 0 = straight up, clamped to +/- MAX_AIM
    var aiming;          // pointer is held down
    var shotCount, maxCombo, streak, ended;
    var blackContamTimer; // accumulator — fires one contamination per interval
    var totalCleared;    // running tally of all bubbles cleared this round

    // --- fx state ----------------------------------------------------
    var particles, rings, fallers, floaters, trail;
    var shakeMag, shakeT, shakeDur, flashCol, flashA, freezeT, bgT, fieldY, launchPunch;

    // --- cached sprites (built once — the core perf win) -------------
    var bubbleSprites = null, superSprite = null, blackSprite = null, bgCanvas = null, SPRITE_HALF = 0;

    // --- hex geometry ------------------------------------------------
    function isOffset(r) { return (((r + rowShift) % 2) + 2) % 2 === 1; }
    function rowCols(r)  { return isOffset(r) ? COLS - 1 : COLS; }
    function cellX(r, c) { return R + c * 2 * R + (isOffset(r) ? R : 0); }
    function cellY(r)    { return GRID_TOP + r * ROWH + R; }
    function validCell(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < rowCols(r); }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function key(r, c) { return r + "_" + c; }

    function neighbors(r, c) {
      if (isOffset(r)) return [[r, c - 1], [r, c + 1], [r - 1, c], [r - 1, c + 1], [r + 1, c], [r + 1, c + 1]];
      return [[r, c - 1], [r, c + 1], [r - 1, c - 1], [r - 1, c], [r + 1, c - 1], [r + 1, c]];
    }

    function makeGrid(fill) {
      var g = [];
      for (var r = 0; r < ROWS; r++) {
        var row = [];
        for (var c = 0; c < COLS; c++) row.push(fill);
        g.push(row);
      }
      return g;
    }

    function fillStartRows() {
      for (var r = 0; r < CONFIG.startRows; r++) {
        var n = rowCols(r);
        for (var c = 0; c < n; c++) {
          grid[r][c] = Rand.int(0, PAL.length - 1);
          sup[r][c] = Math.random() < WALL_SUP;
        }
      }
      // Place exactly ONE black bubble in a random non-super cell of the start grid.
      var candidates = [];
      for (var br = 0; br < CONFIG.startRows; br++) {
        var bn = rowCols(br);
        for (var bc = 0; bc < bn; bc++) {
          if (!sup[br][bc]) candidates.push([br, bc]);
        }
      }
      if (candidates.length) {
        var bpick = Rand.pick(candidates);
        blk[bpick[0]][bpick[1]] = true;
      }
    }

    function activeColors() {
      var seen = {}, list = [];
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < rowCols(r); c++) {
          var v = grid[r][c];
          if (v !== null && !sup[r][c] && !seen[v]) { seen[v] = true; list.push(v); }
        }
      }
      return list;
    }
    function pickShootColor() {
      var a = activeColors();
      return a.length ? Rand.pick(a) : Rand.int(0, PAL.length - 1);
    }

    // --- collision / snapping ---------------------------------------
    function collideAt(x, y) {
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < rowCols(r); c++) {
          if (grid[r][c] === null) continue;
          var dx = x - cellX(r, c), dy = y - cellY(r);
          if (dx * dx + dy * dy <= COLLIDE * COLLIDE) return true;
        }
      }
      return false;
    }

    function snapCell(x, y) {
      var r = clamp(Math.round((y - GRID_TOP - R) / ROWH), 0, ROWS - 1);
      var c = clamp(Math.round((x - R - (isOffset(r) ? R : 0)) / (2 * R)), 0, rowCols(r) - 1);
      if (grid[r][c] === null) return { r: r, c: c };
      var seen = {}, q = [{ r: r, c: c }];
      seen[key(r, c)] = true;
      while (q.length) {
        var cur = q.shift();
        if (validCell(cur.r, cur.c) && grid[cur.r][cur.c] === null) return cur;
        var nb = neighbors(cur.r, cur.c);
        for (var i = 0; i < nb.length; i++) {
          var nr = nb[i][0], nc = nb[i][1];
          if (!validCell(nr, nc)) continue;
          var k = key(nr, nc);
          if (seen[k]) continue;
          seen[k] = true; q.push({ r: nr, c: nc });
        }
      }
      return null;
    }

    // Same-color connected group. SUPER and BLK bubbles never take part in a color
    // match — they only pop when disconnected from the ceiling (or super detonation).
    function floodGroup(sr, sc) {
      if (sup[sr][sc] || blk[sr][sc]) return [];
      var color = grid[sr][sc];
      var seen = {}, q = [{ r: sr, c: sc }], group = [];
      seen[key(sr, sc)] = true;
      while (q.length) {
        var cur = q.shift();
        group.push(cur);
        var nb = neighbors(cur.r, cur.c);
        for (var i = 0; i < nb.length; i++) {
          var nr = nb[i][0], nc = nb[i][1];
          if (!validCell(nr, nc) || grid[nr][nc] === null || sup[nr][nc] || blk[nr][nc]) continue;
          if (grid[nr][nc] !== color) continue;
          var k = key(nr, nc);
          if (seen[k]) continue;
          seen[k] = true; q.push({ r: nr, c: nc });
        }
      }
      return group;
    }

    function dropFloating() {
      var anchored = {}, q = [];
      for (var c = 0; c < rowCols(0); c++) {
        if (grid[0][c] !== null) { anchored[key(0, c)] = true; q.push({ r: 0, c: c }); }
      }
      while (q.length) {
        var cur = q.shift();
        var nb = neighbors(cur.r, cur.c);
        for (var i = 0; i < nb.length; i++) {
          var nr = nb[i][0], nc = nb[i][1];
          if (!validCell(nr, nc) || grid[nr][nc] === null) continue;
          var k = key(nr, nc);
          if (anchored[k]) continue;
          anchored[k] = true; q.push({ r: nr, c: nc });
        }
      }
      var dropped = [];
      for (var r = 0; r < ROWS; r++) {
        for (var cc = 0; cc < rowCols(r); cc++) {
          if (grid[r][cc] === null || anchored[key(r, cc)]) continue;
          dropped.push({ x: cellX(r, cc), y: cellY(r), color: grid[r][cc], sup: sup[r][cc], blk: blk[r][cc] });
          grid[r][cc] = null; sup[r][cc] = false; blk[r][cc] = false;
        }
      }
      return dropped;
    }

    // --- cheap effect spawners --------------------------------------
    function spawnPop(x, y, idx, isSuper) {
      if (particles.length > MAX_PARTICLES) return;
      var base = (idx != null && PAL[idx]) ? PAL[idx] : PAL[0];
      var i, ang, spd;
      for (i = 0; i < 6; i++) {
        ang = Rand.range(0, PI2); spd = Rand.range(120, 340);
        var pc = isSuper ? PAL[Rand.int(0, PAL.length - 1)].core : base.core;
        particles.push({ x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 50,
          life: Rand.range(0.35, 0.6), maxLife: 0.6, r: Rand.range(3, 6), color: pc, grav: 900 });
      }
      for (i = 0; i < 3; i++) {
        ang = Rand.range(0, PI2); spd = Rand.range(220, 440);
        particles.push({ x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          life: 0.3, maxLife: 0.3, r: Rand.range(1.5, 3), color: isSuper ? "#ffffff" : base.light, grav: 0 });
      }
      rings.push({ x: x, y: y, r: R * 0.6, maxR: R * 2.4, life: 0.35, maxLife: 0.35, color: isSuper ? "#ffffff" : base.core, width: 4 });
    }
    function radialBurst(x, y, color) {
      if (particles.length > MAX_PARTICLES) return;
      for (var i = 0; i < 12; i++) {
        var ang = (i / 12) * PI2, spd = Rand.range(300, 520);
        particles.push({ x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          life: 0.5, maxLife: 0.5, r: Rand.range(2, 4), color: color, grav: 0 });
      }
      rings.push({ x: x, y: y, r: R, maxR: R * 5, life: 0.5, maxLife: 0.5, color: color, width: 6 });
    }
    function addFloater(x, y, text, color, size, tier) {
      floaters.push({ x: x, y: y, vy: -70, life: 1.0, maxLife: 1.0, text: text, color: color, size: size, tier: tier });
    }
    function addShake(mag, dur) {
      if (shakeT <= 0 || mag > shakeMag * (shakeT / (shakeDur || 1))) { shakeMag = mag; shakeT = dur; shakeDur = dur; }
    }
    function addFlash(color, a) { flashCol = color; flashA = Math.max(flashA, a); }

    // --- launcher / ball --------------------------------------------
    function newBall(colorIndex, isSuper) {
      return { x: LX, y: LY, vx: 0, vy: 0, color: colorIndex, sup: !!isSuper, r: R, flying: false };
    }
    function rollSuper() { return Math.random() < SHOT_SUP; }
    function updateAimFromPoint(p) {
      var dx = p.x - LX, dy = p.y - LY;
      if (dy > -1) dy = -1;                     // keep the aim pointing upward
      aimAngle = clamp(Math.atan2(dx, -dy), -MAX_AIM, MAX_AIM);
    }
    function fire() {
      if (ball.flying || ended) return;
      var dirX = Math.sin(aimAngle), dirY = -Math.cos(aimAngle);
      ball.vx = dirX * SPEED; ball.vy = dirY * SPEED;
      ball.flying = true;
      trail = [];
      shotCount++;
      launchPunch = 1;
      Sound.beep(360, 0.05, "square", 0.18);
    }

    // Contaminate exactly ONE random neighbor of any black bubble each interval.
    function spreadBlack() {
      var targets = [], seen = {};
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < rowCols(r); c++) {
          if (!blk[r][c] || grid[r][c] === null) continue;
          var nb = neighbors(r, c);
          for (var i = 0; i < nb.length; i++) {
            var nr = nb[i][0], nc = nb[i][1];
            if (!validCell(nr, nc)) continue;
            if (grid[nr][nc] === null || blk[nr][nc] || sup[nr][nc]) continue;
            var bk = key(nr, nc);
            if (!seen[bk]) { seen[bk] = true; targets.push([nr, nc]); }
          }
        }
      }
      if (!targets.length) return;
      var pick = targets[Math.floor(Math.random() * targets.length)];
      blk[pick[0]][pick[1]] = true;
      // Dark expanding ring at the newly contaminated bubble.
      rings.push({ x: cellX(pick[0], pick[1]), y: cellY(pick[0]),
        r: R * 0.2, maxR: R * 2.2, life: 0.45, maxLife: 0.45,
        color: "rgba(130,0,255,0.85)", width: 4 });
      Sound.beep(75, 0.18, "sawtooth", 0.08);
    }

    // Simulate the shot for the dotted aim preview (mirrors real flight).
    function simulateShot(angle) {
      var stepLen = R * 0.6;
      var x = LX, y = LY, dx = Math.sin(angle) * stepLen, dy = -Math.cos(angle) * stepLen;
      var pts = [{ x: x, y: y }];
      for (var i = 0; i < 360; i++) {
        x += dx; y += dy;
        if (x - R < 0) { x = R; dx = -dx; }
        else if (x + R > view.w) { x = view.w - R; dx = -dx; }
        if (y - R <= GRID_TOP || collideAt(x, y)) return pts;
        pts.push({ x: x, y: y });
      }
      return pts;
    }

    function comboTier(n) { return n >= 12 ? 3 : n >= 8 ? 2 : n >= 5 ? 1 : 0; }
    function tierText(tier, n) {
      if (tier === 3) return "UNREAL!";
      if (tier === 2) return "AWESOME!";
      if (tier === 1) return "GREAT!";
      return "NICE! x" + n;
    }

    // Add every super on the board (plus each one's neighbors) to a clear set.
    // This is the chain reaction: one detonation takes them all.
    function collectSuperBlast(add) {
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < rowCols(r); c++) {
          if (!sup[r][c] || grid[r][c] === null) continue;
          add(r, c);
          var nb = neighbors(r, c);
          for (var i = 0; i < nb.length; i++) add(nb[i][0], nb[i][1]);
        }
      }
    }

    // Is the just-placed bubble directly touching a SUPER bubble?
    function touchesSuper(cell) {
      var nb = neighbors(cell.r, cell.c);
      for (var i = 0; i < nb.length; i++) {
        var r = nb[i][0], c = nb[i][1];
        if (validCell(r, c) && grid[r][c] !== null && sup[r][c]) return true;
      }
      return false;
    }

    // Resolve the shot after the ball has snapped into `cell`.
    //   - A same-color group of >=3 pops (SUPER bubbles are never part of it).
    //   - A SUPER bubble only detonates when the shot DIRECTLY hits it (the
    //     ball lands touching it — with a normal OR a super bubble); that hit
    //     then chains to every other super on the board.
    function resolveShot(cell) {
      var mark = {}, list = [];
      function add(r, c) {
        if (validCell(r, c) && grid[r][c] !== null) {
          var k = key(r, c);
          if (!mark[k]) { mark[k] = true; list.push({ r: r, c: c }); }
        }
      }

      // 1) Colour match — only when the placed bubble is a normal colour.
      if (!sup[cell.r][cell.c]) {
        var group = floodGroup(cell.r, cell.c);
        if (group.length >= 3) for (var i = 0; i < group.length; i++) add(group[i].r, group[i].c);
      }

      // 2) Direct super hit -> detonate ALL supers (+ their neighbours).
      var hadSuper = touchesSuper(cell);
      if (hadSuper) collectSuperBlast(add);

      if (list.length === 0) {
        // Nothing cleared: the bubble just sticks. A lone super becomes a wall
        // super you can trigger later by hitting it directly.
        streak = 0;
        Sound.beep(220, 0.05, "sine", 0.12);
        addShake(2, 0.1);
        return;
      }

      // --- clear everything in the set ---
      var cx = 0, cy = 0, color = grid[cell.r][cell.c];
      for (var k = 0; k < list.length; k++) {
        var g = list[k];
        spawnPop(cellX(g.r, g.c), cellY(g.r), grid[g.r][g.c], sup[g.r][g.c]);
        cx += cellX(g.r, g.c); cy += cellY(g.r);
        grid[g.r][g.c] = null; sup[g.r][g.c] = false; blk[g.r][g.c] = false;
      }
      var cleared = list.length;
      cx /= list.length; cy /= list.length;

      // Cascade: everything cut off from the ceiling falls.
      var dropped = dropFloating();
      for (var d = 0; d < dropped.length; d++) {
        fallers.push({ x: dropped[d].x, y: dropped[d].y, vx: Rand.range(-70, 70), vy: Rand.range(-40, 40),
          color: dropped[d].color, sup: dropped[d].sup, blk: dropped[d].blk, r: R, life: 1.3 });
      }
      if (dropped.length >= 5) spawnFireworks(dropped);
      cleared += dropped.length;
      totalCleared += cleared;

      // --- scoring ---
      streak++;
      var mult = Math.min(streak, 6);
      var gained = cleared * 12 * mult + (hadSuper ? 150 : 0);
      score += gained;
      if (cleared > maxCombo) maxCombo = cleared;
      UI.setScore(score);

      // --- impact (all cheap) ---
      var mc = PAL[color] || PAL[0];
      var tier = comboTier(cleared);
      if (hadSuper) {
        addShake(24, 0.4); addFlash("#ffffff", 0.32); freezeT = 0.06; radialBurst(cx, cy, "#ffffff");
      } else {
        addShake(Math.min(4 + cleared * 1.3, 26), 0.32);
        if (tier >= 2) { addFlash(mc.glow, 0.22); freezeT = 0.05; radialBurst(cx, cy, mc.light); }
        else if (tier >= 1) { addFlash(mc.glow, 0.15); }
      }
      var label = hadSuper ? "SUPER BLAST!" : tierText(tier, cleared);
      addFloater(view.w / 2, 372, label, hadSuper ? "#ffffff" : mc.core, hadSuper ? 48 : (tier >= 2 ? 46 : (tier >= 1 ? 38 : 30)), hadSuper ? 3 : tier);
      if (mult > 1) addFloater(view.w / 2, 372 + 44, "x" + mult + " STREAK", "#ffe27a", 22, 0);
      addFloater(cx, cy, "+" + gained, "#ffffff", 24, 0);

      // --- audio ---
      Sound.beep(420 + Math.min(cleared, 30) * 40, 0.12, "triangle", 0.22);
      if (hadSuper) { Sound.beep(150, 0.22, "sawtooth", 0.2); Sound.beep(620, 0.18, "triangle", 0.2); }
      if (dropped.length) Sound.beep(300 + Math.min(dropped.length, 20) * 14, 0.2, "triangle", 0.18);
    }

    function pushRow() {
      var bottom = grid[ROWS - 1];
      for (var c0 = 0; c0 < COLS; c0++) if (bottom[c0] !== null) return; // overflow -> handled by danger check
      grid.pop(); sup.pop(); blk.pop(); wobble.pop();
      rowShift++;
      var row = [], srow = [], brow = [], wrow = [];
      for (var c = 0; c < COLS; c++) { row.push(null); srow.push(false); brow.push(false); wrow.push(0); }
      var n = rowCols(0);
      for (var cc = 0; cc < n; cc++) { row[cc] = Rand.int(0, PAL.length - 1); srow[cc] = Math.random() < WALL_SUP; }
      grid.unshift(row); sup.unshift(srow); blk.unshift(brow); wobble.unshift(wrow);
      fieldY = -ROWH;
      addShake(6, 0.25);
      Sound.beep(140, 0.14, "square", 0.15);
    }

    function lowestBubbleBottom() {
      for (var r = ROWS - 1; r >= 0; r--)
        for (var c = 0; c < rowCols(r); c++)
          if (grid[r][c] !== null) return cellY(r) + R;
      return 0;
    }

    // --- lifecycle ---------------------------------------------------
    function reset() {
      buildSprites();
      buildBackground();
      grid = makeGrid(null);
      sup = makeGrid(false);
      blk = makeGrid(false);
      wobble = makeGrid(0);
      rowShift = 0;
      fillStartRows();
      score = 0;
      timeLeft = CONFIG.gameSeconds;
      aimAngle = 0; aiming = false;
      shotCount = 0; maxCombo = 0; streak = 0;
      ended = false;
      blackContamTimer = 0;
      totalCleared = 0;
      particles = []; rings = []; fallers = []; floaters = []; trail = [];
      shakeMag = 0; shakeT = 0; shakeDur = 1;
      flashCol = "#ffffff"; flashA = 0;
      freezeT = 0; bgT = 0; fieldY = 0; launchPunch = 0;
      ball = newBall(pickShootColor(), rollSuper());
      nextColor = pickShootColor(); nextSuper = rollSuper();
      UI.setScore(0);
      UI.setTime(timeLeft);
    }

    function onDown(p) { if (ended || ball.flying) return; aiming = true; updateAimFromPoint(p); }
    function onMove(p) { if (ended || ball.flying || !aiming) return; updateAimFromPoint(p); }
    function onUp(p) {
      if (ended || ball.flying || !aiming) { aiming = false; return; }
      updateAimFromPoint(p); aiming = false; fire();
    }

    function update(dt) {
      bgT += dt;
      if (shakeT > 0) shakeT -= dt;
      if (flashA > 0) flashA -= dt * 1.8;
      if (launchPunch > 0) launchPunch -= dt * 5;
      if (fieldY < 0) fieldY = Math.min(0, fieldY + Math.abs(fieldY) * Math.min(1, dt * 16) + dt * 20);

      if (ended) { updateFx(dt); return; }
      if (freezeT > 0) { freezeT -= dt; return; }   // hit-stop

      // Decay per-bubble wobble.
      for (var wr = 0; wr < ROWS; wr++)
        for (var wc = 0; wc < rowCols(wr); wc++)
          if (wobble[wr][wc] > 0) wobble[wr][wc] = Math.max(0, wobble[wr][wc] - dt * 3.5);

      // Black bubble contamination — one spread per interval, never exponential.
      if (!ended) {
        blackContamTimer += dt;
        if (blackContamTimer >= CONFIG.blackContamInterval) {
          blackContamTimer = 0;
          spreadBlack();
        }
      }

      if (CONFIG.gameSeconds > 0) {
        timeLeft -= dt;
        UI.setTime(Math.max(0, Math.ceil(timeLeft)));
        if (timeLeft <= 0) { endRound("TIME'S UP!"); return; }
      }

      if (ball.flying) {
        var remaining = dt, maxStep = R / SPEED;
        while (ball.flying && remaining > 0) {
          var step = Math.min(remaining, maxStep);
          ball.x += ball.vx * step; ball.y += ball.vy * step;
          remaining -= step;
          if (ball.x - R < 0) {
            ball.x = R; ball.vx = -ball.vx;
            rings.push({ x: ball.x, y: ball.y, r: R*0.3, maxR: R*1.8, life: 0.22, maxLife: 0.22, color: "rgba(255,255,255,0.55)", width: 2.5 });
          } else if (ball.x + R > view.w) {
            ball.x = view.w - R; ball.vx = -ball.vx;
            rings.push({ x: ball.x, y: ball.y, r: R*0.3, maxR: R*1.8, life: 0.22, maxLife: 0.22, color: "rgba(255,255,255,0.55)", width: 2.5 });
          }
          if (ball.y - R <= GRID_TOP || collideAt(ball.x, ball.y)) { landBall(); break; }
        }
        trail.push({ x: ball.x, y: ball.y });
        if (trail.length > 8) trail.shift();
      }

      updateFx(dt);
    }

    // Fireworks when 5+ bubbles fall at once.
    function spawnFireworks(drops) {
      var pts = drops.slice(0, Math.min(drops.length, 4));
      for (var p = 0; p < pts.length; p++) {
        var fw = pts[p], fCol = PAL[fw.color] || PAL[p % PAL.length];
        for (var i = 0; i < 14; i++) {
          var ang = (i / 14) * PI2, spd = Rand.range(300, 640);
          particles.push({ x: fw.x, y: fw.y,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 80,
            life: Rand.range(0.45, 0.85), maxLife: 0.85,
            r: Rand.range(3, 7), grav: 560,
            color: (i % 3 === 0) ? "#ffffff" : (i % 3 === 1 ? fCol.light : fCol.core) });
        }
        rings.push({ x: fw.x, y: fw.y, r: R * 0.4, maxR: R * 5,
          life: 0.55, maxLife: 0.55, color: fCol.glow, width: 5 });
      }
      addFlash(PAL[Rand.int(0, PAL.length - 1)].glow, 0.2);
      Sound.beep(540 + Rand.range(0, 160), 0.22, "triangle", 0.18);
      Sound.beep(270 + Rand.range(0, 80),  0.28, "sawtooth",  0.10);
    }

    // Animated smoke aura drawn live each frame around blk bubbles.
    function drawBlackSmoke() {
      ctx.save();
      ctx.translate(0, fieldY);
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < rowCols(r); c++) {
          if (!blk[r][c] || grid[r][c] === null) continue;
          var bx = cellX(r, c), by = cellY(r);
          var phase = r * 2.3 + c * 5.7;
          // Pulsing outer aura.
          var auraR = R * (1.06 + 0.09 * Math.sin(bgT * 2.4 + phase));
          ctx.globalAlpha = 0.18 + 0.07 * Math.sin(bgT * 2.1 + phase);
          ctx.fillStyle = "#4a0090";
          ctx.beginPath(); ctx.arc(bx, by, auraR, 0, PI2); ctx.fill();
          // 3 wispy smoke orbs orbiting.
          for (var w = 0; w < 3; w++) {
            var a = (w / 3) * PI2 + bgT * (0.9 + w * 0.22) + phase;
            var dist = R * (0.6 + 0.14 * Math.sin(bgT * 1.7 + w * 1.3));
            var wr = R * (0.19 + 0.08 * Math.sin(bgT * 2.5 + w));
            ctx.globalAlpha = 0.28 + 0.1 * Math.sin(bgT * 1.9 + w * 0.8);
            ctx.fillStyle = w === 0 ? "#8800ff" : (w === 1 ? "#3d0070" : "#c050ff");
            ctx.beginPath(); ctx.arc(bx + Math.cos(a) * dist, by + Math.sin(a) * dist * 0.82, wr, 0, PI2); ctx.fill();
          }
        }
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function landBall() {
      var cell = snapCell(ball.x, ball.y);
      if (!cell) { endRound("OVERRUN!"); return; }
      // Landing impact: ripple ring + wobble on neighbours.
      var lx = cellX(cell.r, cell.c), ly = cellY(cell.r);
      var ballCol = ball.sup ? PAL[0] : (PAL[ball.color] || PAL[0]);
      rings.push({ x: lx, y: ly, r: R * 0.35, maxR: R * 2.4, life: 0.28, maxLife: 0.28,
        color: ball.sup ? "rgba(255,255,255,0.7)" : ballCol.glow, width: 3 });
      wobble[cell.r][cell.c] = 1.0;
      var landNb = neighbors(cell.r, cell.c);
      for (var ni = 0; ni < landNb.length; ni++) {
        var lnr = landNb[ni][0], lnc = landNb[ni][1];
        if (validCell(lnr, lnc) && grid[lnr][lnc] !== null)
          wobble[lnr][lnc] = Math.max(wobble[lnr][lnc], 0.6);
      }
      grid[cell.r][cell.c] = ball.color;
      sup[cell.r][cell.c] = ball.sup;
      ball.flying = false; trail = [];

      resolveShot(cell);

      if (shotCount > 0 && shotCount % ADD_SHOTS === 0) pushRow();
      if (lowestBubbleBottom() >= DANGER_Y) { endRound("OVERRUN!"); return; }

      ball = newBall(nextColor, nextSuper);
      nextColor = pickShootColor(); nextSuper = rollSuper();
    }

    function updateFx(dt) {
      var i;
      for (i = particles.length - 1; i >= 0; i--) {
        var pt = particles[i];
        pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += pt.grav * dt;
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }
      for (i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }
      for (i = fallers.length - 1; i >= 0; i--) {
        var f = fallers[i];
        f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 1600 * dt; f.life -= dt;
        if (f.y - f.r > view.h || f.life <= 0) fallers.splice(i, 1);
      }
      for (i = floaters.length - 1; i >= 0; i--) {
        var fl = floaters[i];
        fl.y += fl.vy * dt; fl.vy *= 0.9; fl.life -= dt;
        if (fl.life <= 0) floaters.splice(i, 1);
      }
    }

    /* ---------------- sprite / background caching ---------------- */
    function makeCanvas(w, h) {
      var cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      return cv;
    }
    // A glossy bubble, rendered ONCE (gradients + glow baked in), then blitted.
    function makeBubbleSprite(pal) {
      var pad = 10, size = (R + pad) * 2, cv = makeCanvas(size, size), c = cv.getContext("2d");
      var x = size / 2, y = size / 2;
      c.shadowColor = pal.glow; c.shadowBlur = 10;
      var g = c.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.15, x, y, R);
      g.addColorStop(0, pal.light); g.addColorStop(0.55, pal.core); g.addColorStop(1, pal.edge);
      c.fillStyle = g; c.beginPath(); c.arc(x, y, R, 0, PI2); c.fill();
      c.shadowBlur = 0;
      var hx = x - R * 0.3, hy = y - R * 0.34;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, R * 0.55);
      hg.addColorStop(0, "rgba(255,255,255,0.85)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, R * 0.4, 0, PI2); c.fill();
      return cv;
    }
    // The rainbow SUPER bubble: three color wedges + white rim + gloss.
    function makeSuperSprite() {
      var pad = 10, size = (R + pad) * 2, cv = makeCanvas(size, size), c = cv.getContext("2d");
      var x = size / 2, y = size / 2, n = PAL.length;
      c.shadowColor = "rgba(255,255,255,0.9)"; c.shadowBlur = 12;
      c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, R, 0, PI2); c.fill();
      c.shadowBlur = 0;
      for (var i = 0; i < n; i++) {
        var a0 = -Math.PI / 2 + i * PI2 / n, a1 = a0 + PI2 / n;
        c.beginPath(); c.moveTo(x, y); c.arc(x, y, R, a0, a1); c.closePath();
        var g = c.createRadialGradient(x, y, R * 0.2, x, y, R);
        g.addColorStop(0, PAL[i].light); g.addColorStop(1, PAL[i].core);
        c.fillStyle = g; c.fill();
      }
      c.lineWidth = R * 0.12; c.strokeStyle = "rgba(255,255,255,0.9)";
      c.beginPath(); c.arc(x, y, R * 0.88, 0, PI2); c.stroke();
      var hx = x - R * 0.3, hy = y - R * 0.34;
      var hg = c.createRadialGradient(hx, hy, 0, hx, hy, R * 0.5);
      hg.addColorStop(0, "rgba(255,255,255,0.85)"); hg.addColorStop(1, "rgba(255,255,255,0)");
      c.fillStyle = hg; c.beginPath(); c.arc(hx, hy, R * 0.36, 0, PI2); c.fill();
      return cv;
    }
    // A dark gas-cloud contaminated bubble — irregular blobs, no hard cross marks.
    function makeBlackSprite() {
      var pad = 14, size = (R + pad) * 2, cv = makeCanvas(size, size), c = cv.getContext("2d");
      var x = size / 2, y = size / 2;
      // Outer diffuse aura.
      var aura = c.createRadialGradient(x, y, R * 0.4, x, y, R + 10);
      aura.addColorStop(0, "rgba(80,0,160,0.5)");
      aura.addColorStop(1, "rgba(10,0,30,0)");
      c.fillStyle = aura; c.beginPath(); c.arc(x, y, R + 10, 0, Math.PI * 2); c.fill();
      // Irregular dark body — several overlapping blobs at random offsets.
      var blobs = [[0,0,1.0],[R*-0.18,R*-0.12,0.90],[R*0.15,R*0.09,0.86],[R*-0.10,R*0.17,0.83],[R*0.13,R*-0.17,0.85]];
      for (var i = 0; i < blobs.length; i++) {
        var ox = blobs[i][0], oy = blobs[i][1], rs = blobs[i][2];
        var g = c.createRadialGradient(x+ox-R*0.15, y+oy-R*0.18, R*0.08, x+ox, y+oy, R*rs);
        g.addColorStop(0, "rgba(65,0,105,0.92)");
        g.addColorStop(0.5, "rgba(18,0,32,0.96)");
        g.addColorStop(1, "rgba(4,0,8,0)");
        c.fillStyle = g;
        c.beginPath(); c.arc(x+ox, y+oy, R*rs, 0, Math.PI*2); c.fill();
      }
      // Subtle glowing rim.
      c.shadowColor = "rgba(150,0,255,0.65)"; c.shadowBlur = 10;
      c.strokeStyle = "rgba(120,0,220,0.45)"; c.lineWidth = 2;
      c.beginPath(); c.arc(x, y, R * 0.87, 0, Math.PI * 2); c.stroke();
      c.shadowBlur = 0;
      // Faint gas core glow.
      var core = c.createRadialGradient(x, y, 0, x, y, R * 0.52);
      core.addColorStop(0, "rgba(170,50,255,0.22)");
      core.addColorStop(1, "rgba(170,50,255,0)");
      c.fillStyle = core; c.beginPath(); c.arc(x, y, R * 0.52, 0, Math.PI * 2); c.fill();
      return cv;
    }
    function buildSprites() {
      if (bubbleSprites) return;
      bubbleSprites = [];
      for (var i = 0; i < PAL.length; i++) bubbleSprites.push(makeBubbleSprite(PAL[i]));
      superSprite = makeSuperSprite();
      blackSprite = makeBlackSprite();
      SPRITE_HALF = superSprite.width / 2;
    }
    function buildBackground() {
      if (bgCanvas) return;
      bgCanvas = makeCanvas(view.w, view.h);
      var c = bgCanvas.getContext("2d");
      var img = Images.bg;
      if (img && img.width) {
        // Cover-fit the embedded artwork to the design canvas (crop, no stretch).
        var s = Math.max(view.w / img.width, view.h / img.height);
        var dw = img.width * s, dh = img.height * s;
        c.drawImage(img, (view.w - dw) / 2, (view.h - dh) / 2, dw, dh);
      } else {
        // Fallback gradient if the image failed to decode.
        var g = c.createLinearGradient(0, 0, 0, view.h);
        g.addColorStop(0, "#231a4a"); g.addColorStop(1, "#0b0820");
        c.fillStyle = g; c.fillRect(0, 0, view.w, view.h);
      }
      // Darken the very top so the HUD reads clearly over the art.
      var tg = c.createLinearGradient(0, 0, 0, 210);
      tg.addColorStop(0, "rgba(0,0,0,0.5)"); tg.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = tg; c.fillRect(0, 0, view.w, 210);
      // Gentle vignette to focus the play area.
      var vg = c.createRadialGradient(view.w / 2, view.h * 0.5, view.h * 0.34, view.w / 2, view.h * 0.5, view.h * 0.82);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.42)");
      c.fillStyle = vg; c.fillRect(0, 0, view.w, view.h);
    }

    /* ---------------- rendering (blit-based, cheap) ---------------- */
    // Draw a cached bubble sprite (optionally scaled / rotated / faded).
    // isBlack overrides everything — draws the contaminated dark sprite.
    function drawSprite(x, y, r, idx, isSuper, isBlack, alpha, rot) {
      var spr = isBlack ? blackSprite : (isSuper ? superSprite : bubbleSprites[idx]);
      var s = r / R, half = SPRITE_HALF * s;
      ctx.save();
      if (alpha != null && alpha < 1) ctx.globalAlpha = alpha;
      if ((isSuper && !isBlack) && rot) {
        ctx.translate(x, y); ctx.rotate(rot);
        ctx.drawImage(spr, -half, -half, spr.width * s, spr.height * s);
      } else {
        ctx.drawImage(spr, x - half, y - half, spr.width * s, spr.height * s);
      }
      ctx.restore();
    }

    function render() {
      ctx.drawImage(bgCanvas, 0, 0, view.w, view.h);

      ctx.save();
      if (shakeT > 0) {
        var s = shakeMag * (shakeT / shakeDur);
        ctx.translate(Rand.range(-s, s), Rand.range(-s, s));
      }

      drawDangerLine();

      // Grid bubbles (with the brief push-down slide offset + per-bubble wobble).
      ctx.save();
      ctx.translate(0, fieldY);
      var superRot = bgT * 0.6;
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < rowCols(r); c++) {
          if (grid[r][c] === null) continue;
          var wob = wobble[r][c];
          if (wob > 0.01) {
            var ws = 1 + wob * 0.13 * Math.sin(bgT * 32);
            var gbx = cellX(r, c), gby = cellY(r);
            ctx.save();
            ctx.translate(gbx, gby); ctx.scale(ws, ws); ctx.translate(-gbx, -gby);
            drawSprite(gbx, gby, R, grid[r][c], sup[r][c], blk[r][c], 1, sup[r][c] ? superRot : 0);
            ctx.restore();
          } else {
            drawSprite(cellX(r, c), cellY(r), R, grid[r][c], sup[r][c], blk[r][c], 1, sup[r][c] ? superRot : 0);
          }
        }
      }
      ctx.restore();

      drawBlackSmoke();

      for (var fi = 0; fi < fallers.length; fi++) {
        var f = fallers[fi];
        drawSprite(f.x, f.y, f.r, f.color, f.sup, f.blk, clamp(f.life, 0, 1), 0);
      }

      drawRings();
      drawParticles();

      if (!ball.flying && !ended) drawAim();
      drawLauncher();
      if (ball.flying) drawTrail();
      if (!ended) drawSprite(ball.x, ball.y, R, ball.color, ball.sup, false, 1, ball.sup ? superRot : 0);
      drawNextPreview();

      drawFloaters();
      ctx.restore();

      if (flashA > 0) {
        ctx.save();
        ctx.globalAlpha = clamp(flashA, 0, 0.35);
        ctx.fillStyle = flashCol;
        ctx.fillRect(0, 0, view.w, view.h);
        ctx.restore();
      }
    }

    function drawParticles() {
      for (var i = 0; i < particles.length; i++) {
        var pt = particles[i];
        ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, PI2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawRings() {
      for (var i = 0; i < rings.length; i++) {
        var rg = rings[i], t = rg.life / rg.maxLife;
        var rad = rg.r + (rg.maxR - rg.r) * (1 - t);
        ctx.globalAlpha = t * 0.7;
        ctx.strokeStyle = rg.color;
        ctx.lineWidth = rg.width * t;
        ctx.beginPath(); ctx.arc(rg.x, rg.y, rad, 0, PI2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawTrail() {
      var col = PAL[ball.color] || PAL[0];
      for (var i = 0; i < trail.length; i++) {
        ctx.globalAlpha = (i / trail.length) * 0.3;
        ctx.fillStyle = ball.sup ? "#ffffff" : col.core;
        ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, R * (0.35 + 0.5 * (i / trail.length)), 0, PI2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Only the dotted trajectory — no ghost bubble at the landing spot.
    function drawAim() {
      var pts = simulateShot(aimAngle);
      ctx.fillStyle = "#ffffff";
      for (var i = 0; i < pts.length; i += 3) {
        ctx.globalAlpha = 0.5 * (1 - i / pts.length);
        ctx.beginPath(); ctx.arc(pts[i].x, pts[i].y, 4, 0, PI2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawLauncher() {
      var punch = launchPunch > 0 ? launchPunch : 0;
      var rr = (R + 16) * (1 - punch * 0.12);
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(LX, LY, rr, 0, PI2); ctx.stroke();
      ctx.restore();
    }

    function drawNextPreview() {
      var nx = LX + 118, ny = LY, nr = R * 0.6;
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("NEXT", nx, ny - nr - 12);
      ctx.restore();
      drawSprite(nx, ny, nr, nextColor, nextSuper, false, 1, 0);
    }

    function drawDangerLine() {
      var nearest = lowestBubbleBottom();
      var closeness = clamp((nearest - (DANGER_Y - 260)) / 260, 0, 1);
      if (closeness <= 0.02) return;
      var pulse = 0.35 + 0.35 * Math.abs(Math.sin(bgT * 4));
      ctx.save();
      ctx.globalAlpha = closeness * pulse;
      ctx.strokeStyle = "#ff4d6d";
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 10]);
      ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(view.w, DANGER_Y); ctx.stroke();
      ctx.restore();
    }

    function drawFloaters() {
      for (var i = 0; i < floaters.length; i++) {
        var fl = floaters[i], t = fl.life / fl.maxLife;
        var popT = t > 0.85 ? (1 - t) / 0.15 : 1; // quick pop-in from nothing
        var alpha = Math.min(1, t * 2.2) * popT;
        var scale = 1 + (1 - t) * (fl.tier >= 2 ? 0.45 : fl.tier >= 1 ? 0.25 : 0.12);
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.translate(fl.x, fl.y);
        ctx.scale(scale, scale);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "900 " + fl.size + "px sans-serif";
        // Per-tier glow shadow.
        if (fl.tier >= 3) {
          ctx.shadowColor = "#ff44ff"; ctx.shadowBlur = 22;
        } else if (fl.tier >= 2) {
          ctx.shadowColor = "#ffaa00"; ctx.shadowBlur = 16;
        } else if (fl.tier >= 1) {
          ctx.shadowColor = "#22ccff"; ctx.shadowBlur = 12;
        } else {
          ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 4;
        }
        // Dark outline.
        ctx.lineWidth = Math.max(4, fl.size * 0.17);
        ctx.strokeStyle = fl.tier >= 3 ? "rgba(80,0,80,0.8)" : "rgba(0,0,0,0.75)";
        ctx.strokeText(fl.text, 0, 0);
        ctx.shadowBlur = 0;
        // Gradient fill for high-tier combos.
        if (fl.tier >= 3) {
          var gr = ctx.createLinearGradient(0, -fl.size * 0.5, 0, fl.size * 0.5);
          gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.3, "#ff88ff"); gr.addColorStop(0.7, "#ff00cc"); gr.addColorStop(1, "#ffbb00");
          ctx.fillStyle = gr;
        } else if (fl.tier >= 2) {
          var gr2 = ctx.createLinearGradient(0, -fl.size * 0.5, 0, fl.size * 0.5);
          gr2.addColorStop(0, "#ffffff"); gr2.addColorStop(0.4, "#ffe060"); gr2.addColorStop(1, "#ff7700");
          ctx.fillStyle = gr2;
        } else if (fl.tier >= 1) {
          var gr1 = ctx.createLinearGradient(0, -fl.size * 0.5, 0, fl.size * 0.5);
          gr1.addColorStop(0, "#e8f8ff"); gr1.addColorStop(1, "#38c0ff");
          ctx.fillStyle = gr1;
        } else {
          ctx.fillStyle = fl.color;
        }
        ctx.fillText(fl.text, 0, 0);
        ctx.restore();
      }
    }

    function endRound(title) {
      if (ended) return;
      ended = true;
      Loop.stop();
      var best = Math.max(score, Store.get("bestScore", 0));
      Store.set("bestScore", best);
      var stars = score >= 1200 ? 3 : score >= 500 ? 2 : score >= 100 ? 1 : 0;
      runEndSequence(title, score, totalCleared, maxCombo, best, stars);
      setState("end");
      Ad.track("game_end", { score: score, reason: title, maxCombo: maxCombo });
    }

    return { reset: reset, onDown: onDown, onMove: onMove, onUp: onUp, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;

    // Route all inputs to the current game (drag to aim, release to fire).
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing") Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing") Game.onUp(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
