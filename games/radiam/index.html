<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to the device size, no user scaling. Mandatory for playable
  ads: the creative must fill the ad container and never scroll or zoom.
  `viewport-fit=cover` is what makes env(safe-area-inset-*) report real values,
  which the engine uses to keep the HUD clear of notches and home indicators.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Radiam</title>

<!--
  ============================================================================
  PLAYABLE MOTOR — the shared shell every game in this repo is built on.
  ============================================================================
  A playable always has the same skeleton, so it lives here once:

    portrait frame  →  a fixed 720x1280 design space, letterbox-scaled to any
                       screen. Canvas AND DOM overlays share those coordinates.
    intro           →  logo, title, one-line pitch, an ANIMATED how-to-play
                       demo, and the start button.
    playing         →  canvas world + HUD (top, notch-safe) + free-form
                       overlay (toasts / banners / rewards) + CTA bar (bottom).
    end             →  cinematic score reveal, stars, stat rows, a big install
                       CTA and a small replay link.

  Only sections 1 (CONFIG), 2 (ASSETS) and 6 (GAME) change per game.
  Full reference: docs/ENGINE.md — recipe: docs/CREATING_A_GAME.md
  ============================================================================
-->

<style>
  /* =========================================================================
     THEME TOKENS — reskin a game by editing these, not the rules below.
     ========================================================================= */
  :root {
    --bg:        #0a0a1c;   /* page / letterbox background            */
    --text:      #eafcff;   /* primary text                          */
    --muted:     #9fb0e0;   /* labels, secondary text                */
    --accent:    #00e5ff;   /* glow / highlight colour               */
    --cta-a:     #4bf5ff;   /* CTA gradient top                      */
    --cta-b:     #00d0ff;   /* CTA gradient bottom                   */
    --cta-text:  #04040c;   /* CTA label                             */
    --danger:    #ff2d55;   /* game over, warnings                   */
    --gold:      #ffd43b;   /* stars, best score                     */
    --good:      #69db7c;
    --panel:     rgba(255,255,255,.05);
    --panel-line:rgba(255,255,255,.09);

    /* Written by the engine at runtime (all in DESIGN pixels). */
    --scale: 1;             /* design px -> screen px factor          */
    --hud-h: 150px;         /* band reserved at the top (CONFIG)      */
    --cta-h: 112px;         /* band reserved at the bottom (CONFIG)   */
    --inset-top: 0px;       /* notch / status bar, in design px       */
    --inset-bottom: 0px;    /* home indicator, in design px           */
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); -webkit-user-select:none; user-select:none;
    touch-action:none;                    /* every gesture is ours */
  }

  /* Invisible probe: the only reliable way to read env(safe-area-inset-*)
     from JS is to apply it as padding somewhere and measure it. */
  #safe-probe {
    position:fixed; top:0; left:0; width:0; height:0; visibility:hidden; pointer-events:none;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }

  /* =========================================================================
     FRAME — the whole creative is authored at 720x1280 and scaled as one
     block, so DOM overlays and canvas drawings share a single coordinate
     system. Never use vw/vh/clamp() inside the frame: use design px.
     ========================================================================= */
  #backdrop { position:fixed; inset:0; z-index:1; background:rgba(4,5,14,.9);
    opacity:0; pointer-events:none; transition:opacity .3s ease; }
  #backdrop.on { opacity:1; }
  #stage { position:fixed; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; }
  #frame {
    position:relative; flex:0 0 auto; width:720px; height:1280px; overflow:hidden;
    transform:scale(var(--scale)); transform-origin:center center;
  }
  #game { display:block; width:720px; height:1280px; touch-action:none; }

  /* =========================================================================
     HUD — top band. Sits below the notch thanks to --inset-top, and gets a
     scrim so it stays readable over a busy game world.
     ========================================================================= */
  #hud {
    position:absolute; left:0; right:0; top:0; z-index:15; pointer-events:none;
    height:calc(var(--inset-top) + var(--hud-h));
    padding:calc(var(--inset-top) + 18px) 26px 0;
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
    transition:opacity .2s ease;
  }
  #hud.hidden { opacity:0; }
  #hud::before {
    content:""; position:absolute; left:0; right:0; top:0; bottom:0; z-index:-1;
    background:linear-gradient(180deg, rgba(4,5,16,.62), rgba(4,5,16,0));
  }
  /* Centre column: the big animated score (the number a playable sells on). */
  #hud-center { position:absolute; left:0; right:0; top:calc(var(--inset-top) + 12px); text-align:center; }
  #hud-score {
    display:inline-block; transform-origin:center bottom; font-size:78px; font-weight:900;
    line-height:1; color:var(--text); text-shadow:0 0 14px rgba(0,229,255,.55);
    transition:color .25s ease; font-variant-numeric:tabular-nums;
  }
  #hud-score.bump { animation:scorebump .4s cubic-bezier(.2,1.5,.4,1); }
  @keyframes scorebump { 0%{transform:scale(1);} 28%{transform:scale(1.38);} 100%{transform:scale(1);} }
  #hud-score-lbl { margin-top:2px; font-size:15px; font-weight:800; letter-spacing:5px; color:rgba(255,255,255,.55); }
  #hud-left, #hud-right { position:relative; z-index:1; min-width:120px; }
  #hud-right { text-align:right; }
  .hud-pill {
    display:inline-block; padding:9px 18px; border-radius:18px;
    background:rgba(0,0,0,.42); border:1px solid var(--panel-line);
    font-size:28px; font-weight:900; text-shadow:0 2px 6px rgba(0,0,0,.5);
    font-variant-numeric:tabular-nums;
  }
  .hud-pill .lbl { display:block; font-size:14px; font-weight:800; letter-spacing:2px; opacity:.65; }
  .hud-pill.warn { color:var(--danger); border-color:rgba(255,45,85,.5); }
  #hud-left:empty, #hud-right:empty { display:none; }

  /* =========================================================================
     OVERLAY — the game-view notification layer: score toasts, combo banners,
     rewards, dramatic edge glow. Screen-space and pointer-transparent.
     World-space juice (particles, floating "+120") belongs to Fx on canvas.
     ========================================================================= */
  #overlay { position:absolute; inset:0; z-index:16; pointer-events:none; overflow:hidden; }

  #ov-toasts {
    position:absolute; left:0; right:0; top:calc(var(--inset-top) + var(--hud-h) + 10px);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .ov-toast {
    padding:12px 26px; border-radius:999px; font-size:28px; font-weight:900; letter-spacing:.5px;
    background:rgba(8,10,24,.78); border:1px solid var(--panel-line);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:toastIn .28s cubic-bezier(.2,1.7,.4,1);
  }
  .ov-toast.out { animation:toastOut .3s ease forwards; }
  @keyframes toastIn  { from{opacity:0; transform:translateY(-18px) scale(.9);} to{opacity:1; transform:none;} }
  @keyframes toastOut { to{opacity:0; transform:translateY(-14px) scale(.95);} }

  #ov-banner { position:absolute; left:0; right:0; top:42%; text-align:center; opacity:0; }
  #ov-banner.show { animation:bannerPunch var(--ov-banner-dur, 1s) cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes bannerPunch {
    0%   { opacity:0; transform:scale(.5); }
    18%  { opacity:1; transform:scale(1.08); }
    30%  { transform:scale(1); }
    76%  { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.12); }
  }
  #ov-banner-main { font-size:74px; font-weight:900; letter-spacing:2px; text-shadow:0 0 26px rgba(0,0,0,.55); }
  #ov-banner-sub  { margin-top:6px; font-size:36px; font-weight:900; color:#fff; text-shadow:0 0 18px rgba(0,0,0,.6); }

  /* Reward badge: the "you earned something" moment (combo chest, bonus…). */
  #ov-reward {
    position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(.4);
    padding:20px 34px; border-radius:26px; opacity:0;
    background:linear-gradient(180deg, rgba(255,232,150,.22), rgba(255,175,40,.16));
    border:1px solid rgba(255,215,110,.6); box-shadow:0 0 34px rgba(255,200,60,.35);
    font-size:40px; font-weight:900; color:#ffe58a; text-shadow:0 0 14px rgba(255,205,70,.7);
  }
  #ov-reward.show { animation:rewardPop 1.7s cubic-bezier(.2,1.7,.4,1) forwards; }
  @keyframes rewardPop {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4);}
    14%{opacity:1; transform:translate(-50%,-50%) scale(1.1);}
    24%{transform:translate(-50%,-50%) scale(1);}
    78%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-70%) scale(1.02);}
  }

  /* Dramatic edge glow — pulse it on a milestone or a near-death moment. */
  #ov-vignette { position:absolute; inset:0; opacity:0; transition:opacity .5s ease;
    box-shadow:inset 0 0 130px 34px var(--accent); }

  /* =========================================================================
     POP LAYER — comic / manga onomatopoeia callouts (the Pop module).
     This is the loud half of the notification layer: score gains, combo
     milestones, hero moments. Designed in lab/overlay-comic.html.

     A callout is three nested nodes on purpose, so no two animations ever
     fight over the same `transform`:
       .pop       -> placement (left/top in design px)
       .pop-out   -> the exit animation, delayed by enter + hold
       .pop-anim  -> the entry animation (+ the decor layers behind the word)
       .pop-body  -> static rotation + auto shrink-to-fit
     Retheme a style by overriding its tokens in the SKIN block; never edit
     the machinery here.
     ========================================================================= */
  #ov-pops { position:absolute; inset:0; overflow:hidden; }

  .pop {
    position:absolute; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    /* defaults, overridden by each style class */
    --sz:78px;                                 /* cap height of the word     */
    --ink:#0b0a1e;                             /* outline + extrusion colour */
    --ink2:rgba(0,0,0,.45);
    --fill:linear-gradient(180deg,#ffffff,#cfd6ff);
    --glow:rgba(120,180,255,.6);
    --stroke:14px;
    --ray:rgba(255,255,255,.22);
    --dot:rgba(0,0,0,.4);
    --band:#0b0a1e;
    --band-line:#fff;
    --burst:#ff9500;
  }
  /* will-change keeps the entry/exit on the compositor: without it the word's
     filter is re-rasterized on every frame of the scale and the callout eats
     the frame budget the gameplay needs. */
  .pop-out, .pop-anim {
    position:relative; display:flex; align-items:center; justify-content:center;
    will-change:transform, opacity;
  }
  .pop-body {
    position:relative; z-index:2; text-align:center;
    transform:rotate(var(--rot,0deg)) scale(var(--fit,1));
  }
  /* alarm styles blink for the whole hold, however long it is */
  .pop-body.pulse { animation:pop-pulse .5s steps(1,end) infinite; }

  /* --- the word ---------------------------------------------------------- */
  .pop-word {
    display:flex; justify-content:center; align-items:flex-end; flex-wrap:nowrap;
    /* Impact-class display face. iOS has no Impact: it degrades to a heavy
       sans. Embed a base64 woff2 subset if a campaign needs it guaranteed. */
    font-family:Impact,"Haettenschweiler","Arial Black","Arial Bold",sans-serif;
    font-weight:900; font-size:var(--sz); line-height:.92;
    letter-spacing:var(--track,2px); text-transform:uppercase;
    white-space:nowrap;
    /* NO css `filter` here, ever. A filter forces the word onto its own
       offscreen render surface, which the compositor re-rasterizes at the
       LARGEST scale of the entry animation — `slam` starts at scale(3.1), so a
       glow costs ~9x the pixels of the word itself, on the raster thread, right
       on the frame the callout appears. Measured on a throttled mobile profile:
       50 ms of stalled frames for a `combo` callout, 9 ms without. The glow
       below is a text-shadow instead: Skia blurs the glyph mask in place, at
       layer scale, for free. */
    /* Own compositing layer, kept for the callout's whole life: without it the
       gradient text is re-rasterized the moment the entry animation ends, which
       is a dropped frame right on the beat the player just earned. */
    will-change:transform;
  }
  .pop-word.vert { flex-direction:column; align-items:center; line-height:.82; }

  /* Two stacked copies of the same glyph:
       .pop-ltr  -> the ink layer: thick outline + 3D extrusion
       ::before  -> the gradient face, painted ON TOP
     The face has to be the absolutely-positioned pseudo-element, not the other
     way round: background-clip:text paints at the background stage, so an ink
     layer above it in the paint order would bury the colour. */
  .pop-ltr {
    position:relative; display:inline-block;
    color:var(--ink); -webkit-text-fill-color:var(--ink);
    -webkit-text-stroke:var(--stroke) var(--ink);
    /* Extrusion, ground shadow, then the coloured glow the style asks for —
       cast by the stroked glyph, so it reads outside the ink outline exactly
       like the drop-shadow filter this replaces, without its render surface.
       These blurs are cheap where a `filter` is not: Skia blurs the glyph mask
       into the tiles the page already rasterizes, spread over the raster
       threads, instead of forcing one blocking pass over a private surface. */
    text-shadow:
      0 5px 0 var(--ink), 0 10px 0 var(--ink), 0 15px 0 var(--ink2),
      0 22px 26px rgba(0,0,0,.55), 0 0 16px var(--glow);
    animation:pop-ltr .3s cubic-bezier(.2,1.9,.4,1) backwards;
    animation-delay:calc(var(--i,0) * var(--stagger, 0ms));
  }
  .pop-ltr::before {
    content:attr(data-t); position:absolute; left:0; top:0;
    -webkit-text-stroke:0;
    background-image:var(--fill); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    text-shadow:none;
  }
  .pop-sp { display:inline-block; width:.28em; }

  /* --- the sub-line (score, context) ------------------------------------- */
  .pop-sub {
    display:inline-block; margin-top:14px; padding:7px 20px; border-radius:10px;
    font-family:inherit; font-size:calc(var(--sz) * .34); font-weight:900; letter-spacing:3px;
    background:var(--ink); color:#fff; border:3px solid rgba(255,255,255,.85);
    box-shadow:0 8px 0 rgba(0,0,0,.4);
    animation:pop-subin .4s .12s cubic-bezier(.2,1.8,.4,1) backwards;
  }

  /* --- decor primitives, composed per style, centred behind the word ----- */
  .pop-d { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1; }

  /* Radiating manga speed rays. A masked conic gradient is one of the most
     expensive things on the page and the layer area is what the raster cost
     scales with, so the box is sized to the MASK, not to the frame: everything
     past 62% of the radius was fully transparent, i.e. a 760px layer spent a
     third of its raster budget on nothing. 560px with the stops rescaled by the
     same factor paints the identical circle for 23% less stalled frame time.
     Deliberately static — rotating it repaints the mask every frame and costs
     the gameplay ~40% of its frame budget for as long as the callout is up. */
  .pop-d-rays {
    width:560px; height:560px; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, var(--ray) 0 4.5deg, transparent 4.5deg 13deg);
    -webkit-mask-image:radial-gradient(circle, #000 13.6%, rgba(0,0,0,.5) 46%, transparent 84%);
            mask-image:radial-gradient(circle, #000 13.6%, rgba(0,0,0,.5) 46%, transparent 84%);
  }
  /* comic ben-day halftone dots */
  .pop-d-dots {
    width:1100px; height:520px;
    background-image:radial-gradient(circle, var(--dot) 2px, transparent 2.4px);
    background-size:14px 14px;
    -webkit-mask-image:radial-gradient(ellipse at center, #000 20%, transparent 72%);
            mask-image:radial-gradient(ellipse at center, #000 20%, transparent 72%);
  }
  /* The two impact primitives a frequent callout may use. Both are a solid
     colour on a rounded box animated with nothing but `transform` and
     `opacity`, so the compositor plays them without ever re-rasterizing —
     which is the whole point: they replaced a pair of 32-point `clip-path`
     stars that had to be re-rasterized at the entry animation's largest scale.
     Shockwave: one hollow ellipse expanding once. Wider than tall so it clears
     the chip it sits behind instead of reading as two arcs. */
  .pop-d-ring {
    width:var(--ring-w,430px); height:var(--ring-h,250px); border-radius:50%;
    border:var(--ring-s,7px) solid var(--chip-line,#ffb02e);
    opacity:0; animation:pop-ring .42s cubic-bezier(.15,.8,.3,1) forwards;
  }
  /* Four ticks flicked diagonally off the callout's corners. */
  .pop-d-dash {
    position:absolute; left:50%; top:50%; z-index:1;
    width:var(--dw,44px); height:8px; border-radius:4px;
    background:var(--chip-line,#ffb02e);
    opacity:0; animation:pop-dash .38s cubic-bezier(.2,.75,.3,1) forwards;
  }
  /* the comic banner the word sits on */
  .pop-d-band {
    width:1400px; height:var(--band-h,190px); background:var(--band);
    border-top:7px solid var(--band-line); border-bottom:7px solid var(--band-line);
    transform:translate(-50%,-50%) skewY(var(--band-skew,-5deg));
    box-shadow:0 22px 0 rgba(0,0,0,.3);
  }
  /* The three scrolling decors — speed lines, hazard tape, chevrons — all used
     to animate `background-position`, which is a PAINT property: the browser
     repainted the whole masked gradient layer on EVERY frame the callout was
     up, for as long as it was up. Measured with tools/lab/bench-pop.mjs on a
     mobile viewport at DPR 3, raster time over a 3 s window: `ribbon` 2575 ms,
     `danger` 818 ms, `streak` 390 ms — the raster threads never came back, and
     that is the stall a phone shows and a desktop absorbs.
     The gradient now lives on a ::before wider than its own box and slides
     with `transform`, which the compositor plays without one repaint: 106 / 31
     / 55 ms for the same three callouts. Identical picture, identical motion.
     The rule for anything added here: a decor may animate `transform` and
     `opacity` and nothing else. A new scrolling decor joins the two selector
     lists below and declares its own `--tile` / `--tile-x` / `--tile-t`. */
  .pop-d-lines, .pop-d-stripes, .pop-d-chevrons { overflow:hidden; }
  .pop-d-lines::before, .pop-d-stripes::before, .pop-d-chevrons::before {
    content:""; position:absolute; top:0; bottom:0;
    /* wider than the box on both sides, so the slide never uncovers an edge */
    left:calc(var(--tile) * -1.2); right:calc(var(--tile) * -1.2);
    animation:pop-scroll var(--tile-t,.45s) linear infinite;
    will-change:transform;
  }
  /* One tile per iteration, so the loop has no seam. */
  @keyframes pop-scroll { to { transform:translateX(var(--tile-x)); } }

  /* horizontal speed lines inside the banner */
  .pop-d-lines {
    width:1400px; height:var(--band-h,190px);
    transform:translate(-50%,-50%) skewY(var(--band-skew,-5deg));
    -webkit-mask-image:linear-gradient(90deg,#000,transparent 36%,transparent 64%,#000);
            mask-image:linear-gradient(90deg,#000,transparent 36%,transparent 64%,#000);
    --tile:17px; --tile-x:17px; --tile-t:.45s;
  }
  .pop-d-lines::before {
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.20) 0 5px, transparent 5px 17px);
  }
  /* hazard tape. The stripes run at -45deg, so one 60px tile of the gradient
     is 60/cos(45) = 84.85px of horizontal travel. */
  .pop-d-stripes {
    width:1400px; height:var(--band-h,150px);
    transform:translate(-50%,-50%) skewY(var(--band-skew,0deg));
    border-top:6px solid #ffd400; border-bottom:6px solid #ffd400;
    --tile:85px; --tile-x:84.853px; --tile-t:1.1s;
  }
  .pop-d-stripes::before {
    background:repeating-linear-gradient(-45deg,#ffd400 0 30px,#141020 30px 60px);
  }
  /* arrow chevrons pushing the eye forward */
  .pop-d-chevrons {
    width:900px; height:var(--band-h,200px);
    transform:translate(-50%,-50%) skewX(-16deg);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);
    opacity:.85;
    --tile:52px; --tile-x:-52px; --tile-t:.5s;
  }
  .pop-d-chevrons::before {
    background:repeating-linear-gradient(90deg, var(--burst) 0 22px, transparent 22px 52px);
  }
  /* There is deliberately no white-flash decor: `flash` on a style routes to
     Fx.flash, which paints the same beat on the canvas we already draw every
     frame instead of adding a full-screen gradient layer to composite. */
  .pop-d-spark {
    position:absolute; width:var(--s,54px); height:var(--s,54px); background:#fff5c2;
    clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
    animation:pop-twinkle 1.1s ease-in-out infinite;
  }

  @keyframes pop-ltr {
    0%  { opacity:0; transform:translateY(-64px) rotate(-18deg) scale(1.6); }
    70% { opacity:1; }
    100%{ opacity:1; transform:none; }
  }
  @keyframes pop-subin { 0%{opacity:0; transform:translateY(-16px) scale(.7);} 100%{opacity:1; transform:none;} }
  @keyframes pop-twinkle { 0%,100%{opacity:.25; transform:scale(.6) rotate(0);} 50%{opacity:1; transform:scale(1.15) rotate(45deg);} }
  @keyframes pop-pulse { 0%,49%{ opacity:1; } 50%,100%{ opacity:.32; } }
  /* Both start where the callout's own plate stops hiding them (the plate is
     opaque and sits on top), so the whole animation is actually seen. */
  @keyframes pop-ring {
    0%  { opacity:.9; transform:translate(-50%,-50%) scale(.62); }
    100%{ opacity:0;  transform:translate(-50%,-50%) scale(1.06); }
  }
  @keyframes pop-dash {
    0%  { opacity:0; transform:translate(-50%,-50%) translate(calc(var(--tx) * .8), calc(var(--ty) * .8)) rotate(var(--rd)) scaleX(.5); }
    22% { opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) translate(var(--tx), var(--ty)) rotate(var(--rd)) scaleX(1); }
  }

  /* Entry / exit pairs. Every `pop-in-*` ends on the neutral state and every
     `pop-out-*` starts from it, so the hold in between can last any duration.
     A style names the pair once (anim:"slam" -> pop-in-slam / pop-out-slam). */

  /* SLAM — arrives from the camera, overshoots, settles, blows out. */
  @keyframes pop-in-slam {
    0%  { opacity:0; transform:scale(3.1) rotate(-16deg); }
    34% { opacity:1; transform:scale(.84) rotate(4deg); }
    58% { transform:scale(1.09) rotate(-3deg); }
    80% { transform:scale(.98) rotate(1deg); }
    100%{ opacity:1; transform:scale(1) rotate(0); }
  }
  @keyframes pop-out-slam { from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(1.3) translateY(-46px); } }

  /* SWIPE — a banner crossing the screen, comic-strip style. */
  @keyframes pop-in-swipe {
    0%  { opacity:0; transform:translateX(-130%) skewX(-18deg); }
    62% { opacity:1; transform:translateX(20px) skewX(0); }
    100%{ opacity:1; transform:translateX(0) skewX(0); }
  }
  @keyframes pop-out-swipe { from{ opacity:1; transform:translateX(0); } to{ opacity:0; transform:translateX(130%) skewX(18deg); } }

  /* DROP — slams down from the top with a bounce. */
  @keyframes pop-in-drop {
    0%  { opacity:0; transform:translateY(-460px) scale(1.35) rotate(-7deg); }
    52% { opacity:1; transform:translateY(0) scale(1) rotate(0); }
    74% { transform:translateY(-32px) scale(.97); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes pop-out-drop { from{ opacity:1; transform:translateY(0); } to{ opacity:0; transform:translateY(70px) scale(.9); } }

  /* ZOOM — the hero moment: rushes in, then swallows the screen on exit. */
  @keyframes pop-in-zoom {
    0%  { opacity:0; transform:scale(.35) rotate(14deg); }
    28% { opacity:1; transform:scale(1.2) rotate(-5deg); }
    54% { transform:scale(.93) rotate(3deg); }
    78% { transform:scale(1.07) rotate(-1deg); }
    100%{ opacity:1; transform:scale(1) rotate(0); }
  }
  @keyframes pop-out-zoom { from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(1.7); } }

  /* PUNCH — the cheap, frequent one. Use for small callouts. */
  @keyframes pop-in-punch {
    0%  { opacity:0; transform:scale(.4) rotate(-8deg); }
    58% { opacity:1; transform:scale(1.14) rotate(2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0); }
  }
  @keyframes pop-out-punch { from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(1.08) translateY(-30px); } }

  /* CHIP — the cheapest entry in the catalogue, for the callout a good run
     fires over and over. A composited layer is rasterized at the LARGEST scale
     of its animation, so `slam` (scale 3.1) pays for ~9x the pixels it ever
     shows — that was the hitch every combo used to cost. This one never leaves
     0.86..1.06, i.e. the raster is the callout's own size, and it only moves
     and fades. */
  @keyframes pop-in-chip {
    0%  { opacity:0; transform:translateY(24px) scale(.86); }
    55% { opacity:1; transform:translateY(0) scale(1.06); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes pop-out-chip { from{ opacity:1; transform:translateY(0) scale(1); } to{ opacity:0; transform:translateY(-30px) scale(.97); } }

  /* ALARM — hard cut in, then .pop-body pulses for the whole hold. */
  @keyframes pop-in-alarm { from{ opacity:0; transform:scale(1.25); } to{ opacity:1; transform:scale(1); } }
  @keyframes pop-out-alarm { from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(.94); } }

  /* FLOAT — the "+250" that rises off the impact point. */
  @keyframes pop-in-float {
    0%  { opacity:0; transform:translateY(30px) scale(.5); }
    64% { opacity:1; transform:translateY(0) scale(1.12); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes pop-out-float { from{ opacity:1; transform:translateY(0); } to{ opacity:0; transform:translateY(-150px) scale(.9); } }

  /* --- the style catalogue ----------------------------------------------
     One class per entry in Pop.STYLES. Palette tokens only, so a game can
     retune any of them from its SKIN block with a one-line override.
     -------------------------------------------------------------------- */

  /* +250 — the tiny frequent one, spawned at the impact point. */
  .pop-score {
    --sz:64px; --track:1px; --ink:#001428; --stroke:9px;
    --fill:linear-gradient(180deg,#fff 0%,#a8f0ff 100%);
    --glow:rgba(90,220,255,.7);
  }
  /* ALERT — a compact negative callout (chain lost, wall hit). No decor on
     purpose: it fires as often as the player makes a mistake, so it has to cost
     nothing. Red by default; retint it from the SKIN if the game disagrees. */
  .pop-alert {
    --sz:56px; --track:2px; --ink:#2a000c; --stroke:9px;
    --fill:linear-gradient(180deg,#ffffff 0%,#ffd6de 45%,#ff4d6d 100%);
    --glow:rgba(255,77,109,.7);
  }
  .pop-alert .pop-sub { background:#2a000c; border-color:#ff9fb0; color:#ffd6de; letter-spacing:4px; }

  /* COMBO x2 — a compact chip that hugs its own word.
     This is the one callout a good run fires over and over, so it is the one
     that must cost nothing: no clip-path, no mask, no filter, no full-frame
     layer, and an entry that never scales past 1.06. A game retints it with
     --chip / --chip-line and leaves the geometry alone. */
  .pop-combo {
    --sz:58px; --track:3px; --ink:#20100a; --ink2:rgba(80,30,0,.4); --stroke:0px;
    --fill:linear-gradient(180deg,#fff6d8 0%,#ffd257 52%,#ff9f1c 100%);
    --glow:rgba(255,170,50,.5);
    --chip:#1a1024;                  /* plate behind the word                  */
    --chip-line:#ffb02e;             /* border, shockwave ring and corner ticks */
    --ring-w:430px; --ring-h:250px; --ring-s:7px;
  }
  /* The plate is a background on .pop-body, not a decor node: it inherits the
     body's rotation for free and it is exactly as wide as the copy inside. */
  .pop-combo .pop-body {
    padding:13px 26px 15px; border-radius:18px;
    background:var(--chip); border:4px solid var(--chip-line);
    box-shadow:0 7px 0 rgba(0,0,0,.4), inset 0 3px 0 rgba(255,255,255,.09);
  }
  /* On a chip this small the extrusion and the glow only muddy the word. */
  .pop-combo .pop-ltr { text-shadow:0 3px 0 rgba(0,0,0,.5); animation:none; }
  .pop-combo .pop-sub {
    margin-top:2px; padding:0; border:0; box-shadow:none; background:none;
    color:var(--chip-line); font-size:calc(var(--sz) * .44); letter-spacing:2px;
  }
  /* STREAK — chevrons pushing the eye sideways. */
  .pop-streak {
    --sz:84px; --ink:#1a0018; --stroke:13px;
    --fill:linear-gradient(180deg,#fff 0%,#ffd9f2 50%,#ff5ecb 100%);
    --glow:rgba(255,80,190,.75); --burst:#ff2d9b; --band-h:210px;
  }
  /* RIBBON — comic banner sweeping across the play area. */
  .pop-ribbon {
    --sz:82px; --track:4px; --ink:#0a0a16; --stroke:12px;
    --fill:linear-gradient(180deg,#ffffff 0%,#dfe6ff 55%,#9fb4ff 100%);
    --glow:rgba(90,140,255,.6); --band:#141033; --band-line:var(--accent);
    --band-h:210px; --band-skew:-5deg;
  }
  /* MANIFEST — political-poster energy: red band, halftone, chroma split. */
  .pop-manifest {
    --sz:70px; --track:1px; --ink:#12000a; --stroke:11px;
    --fill:linear-gradient(180deg,#fff 0%,#ffe3e8 60%,#ffb3c1 100%);
    --glow:rgba(255,45,85,.75); --band:#d61b3c; --band-line:#12000a;
    --band-h:230px; --band-skew:-3deg; --dot:rgba(0,0,0,.5); --stagger:34ms;
  }
  /* chromatic split: the colour fringes go first, the extrusion still follows */
  .pop-manifest .pop-ltr {
    text-shadow:
      -7px 0 0 rgba(0,225,255,.7), 7px 0 0 rgba(255,0,80,.7),
      0 5px 0 var(--ink), 0 10px 0 var(--ink), 0 15px 0 var(--ink2),
      0 22px 26px rgba(0,0,0,.55);
  }
  .pop-manifest .pop-sub { background:#12000a; border-color:#ffd400; color:#ffd400; letter-spacing:5px; }
  /* PERFECT — gold, sparkles, gentle rays. The "you nailed it" beat. */
  .pop-perfect {
    --sz:100px; --ink:#3a2200; --ink2:rgba(90,50,0,.55); --stroke:15px;
    --fill:linear-gradient(180deg,#fffdf0 0%,#ffe27a 34%,#f5b400 62%,#fff3b0 78%,#c98a00 100%);
    --glow:rgba(255,205,80,.85); --ray:rgba(255,220,120,.28);
  }
  .pop-perfect .pop-sub { background:#3a2200; border-color:#ffe27a; color:#ffe27a; }
  /* ULTRA — the hero moment: rays, chroma, maximum size. */
  .pop-ultra {
    --sz:132px; --track:5px; --ink:#0b0020; --ink2:rgba(80,0,140,.55); --stroke:16px;
    --fill:linear-gradient(180deg,#fdfbff 0%,#a6e9ff 38%,#7b6bff 70%,#ff3fd0 100%);
    --glow:rgba(150,110,255,.85); --ray:rgba(190,150,255,.30);
  }
  .pop-ultra .pop-ltr {
    text-shadow:
      -10px 0 0 rgba(255,0,120,.65), 10px 0 0 rgba(0,220,255,.65),
      0 6px 0 var(--ink), 0 12px 0 var(--ink), 0 18px 0 var(--ink2),
      0 26px 30px rgba(0,0,0,.55);
  }
  .pop-ultra .pop-sub { background:#0b0020; border-color:#a6e9ff; color:#a6e9ff; }
  /* BONUS — sticker slapped over halftone dots. */
  .pop-bonus {
    --sz:74px; --track:3px; --ink:#001a14; --stroke:12px;
    --fill:linear-gradient(180deg,#f4fff9 0%,#7dffcf 55%,#00d58a 100%);
    --glow:rgba(0,230,160,.7); --dot:rgba(0,60,45,.45);
  }
  .pop-bonus .pop-sub { background:#001a14; border-color:#7dffcf; color:#7dffcf; }
  /* DANGER — hazard tape, blinking. */
  .pop-danger {
    --sz:62px; --track:4px; --ink:#14100a; --stroke:10px;
    --fill:linear-gradient(180deg,#fff 0%,#ffe9a8 100%);
    --glow:rgba(255,60,60,.75); --band-h:160px;
  }
  /* RECORD — band + rays + sparkles + confetti. The end-of-run peak. */
  .pop-record {
    --sz:76px; --track:3px; --ink:#2b1a00; --stroke:12px;
    --fill:linear-gradient(180deg,#fffbe8 0%,#ffd977 40%,#ffab00 72%,#fff1b8 100%);
    --glow:rgba(255,200,70,.8); --ray:rgba(255,215,120,.26);
    --band:#1b1330; --band-line:#ffd977; --band-h:200px; --band-skew:-2deg;
  }
  .pop-record .pop-sub { background:#1b1330; border-color:#ffd977; color:#ffd977; }
  /* VERT — vertical manga column hugging one edge. */
  .pop-vert {
    --sz:88px; --track:0; --ink:#0d0016; --stroke:14px;
    --fill:linear-gradient(180deg,#fff 0%,#b8f5ff 60%,#00c6ff 100%);
    --glow:rgba(0,200,255,.75); --ray:rgba(120,230,255,.24);
  }

  /* =========================================================================
     CTA BAR — always reachable while playing. Lifted above the home indicator.
     ========================================================================= */
  #cta-bar {
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    min-height:calc(var(--cta-h) + var(--inset-bottom));
    padding:16px 22px calc(16px + var(--inset-bottom));
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(6,8,20,0), rgba(6,8,20,.85) 42%);
    transition:opacity .2s ease;
  }
  #cta-bar.hidden { opacity:0; pointer-events:none; }

  /* =========================================================================
     BUTTONS
     ========================================================================= */
  .btn {
    border:2px solid rgba(255,255,255,.8); border-radius:999px; cursor:pointer;
    font-family:inherit; font-weight:900; letter-spacing:.5px; color:var(--cta-text);
    background:linear-gradient(180deg, var(--cta-a), var(--cta-b));
    box-shadow:0 0 20px rgba(0,229,255,.6);
    padding:22px 52px; font-size:34px;
    animation:pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform:scale(.96); }
  .btn.sm { padding:14px 36px; font-size:30px; }
  .btn.lg { padding:26px 62px; font-size:38px; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  .link {
    margin-top:22px; background:none; border:none; cursor:pointer; font-family:inherit;
    color:var(--muted); font-size:26px; font-weight:700; text-decoration:underline;
    text-underline-offset:5px; padding:10px 16px;
  }
  .link:active { opacity:.6; }

  /* =========================================================================
     SCREENS — loading / intro / end
     ========================================================================= */
  .screen {
    position:absolute; inset:0; z-index:30; padding:70px 48px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    transition:opacity .25s ease;
  }
  .screen.hidden { opacity:0; pointer-events:none; }

  .spinner { width:76px; height:76px; border-radius:50%;
    border:8px solid rgba(255,255,255,.15); border-top-color:var(--accent);
    animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-lbl { margin-top:26px; font-size:28px; color:var(--muted); }

  /* ---- Intro ---- */
  #app-icon {
    width:230px; height:auto; border-radius:44px; margin-bottom:14px;
    box-shadow:0 14px 44px rgba(0,0,0,.55), 0 0 44px rgba(0,229,255,.34);
    animation:iconfloat 3s ease-in-out infinite;
  }
  @keyframes iconfloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
  #intro-title { font-size:76px; font-weight:900; letter-spacing:1px; line-height:1.05;
    text-shadow:0 0 22px rgba(0,229,255,.7); }
  /* ONE sentence, and nothing else: the stage below already shows the rest.
     Wrap the two or three words that carry the mechanic in <b class="w-…">
     inside CONFIG.tagline and they burn in the accent colour — a SKIN retints
     each class on its own (`#intro-tagline .w-foo { color:… }`). */
  #intro-tagline { margin-top:16px; font-size:32px; line-height:1.4; color:#c9d6ff; }
  #intro-tagline b { font-weight:900; color:var(--accent); text-shadow:0 0 16px currentColor; }

  /* ---- Animated how-to-play demo -------------------------------------------
     One markup block, five variants (tap / hold / drag / swipe / aim) picked
     by CONFIG.intro.demo. Pure CSS so it costs nothing and never blocks.

     Those five are the GENERIC shapes of a gesture; a game re-dresses the same
     nodes from its SKIN so the stage plays its own mechanic — the finger stays
     the shared one, the target becomes the character, the track becomes the
     world. See games/orbinity or games/vipera. */
  #intro-demo { margin-top:34px; }
  #screen-intro #btn-start { margin-top:40px; }
  .demo-stage {
    position:relative; width:380px; height:210px; margin:0 auto; overflow:hidden;
    border-radius:28px; background:var(--panel); border:1px solid var(--panel-line);
  }
  /* Last-resort label for a stage that cannot speak for itself. Leave
     CONFIG.intro.caption empty — the norm — and it collapses. */
  .demo-caption { margin-top:18px; font-size:26px; font-weight:800; letter-spacing:1px; color:var(--muted); }
  .demo-caption:empty { display:none; }

  /* pieces — hidden by default, each variant opts in */
  .demo-target, .demo-hand, .demo-track, .demo-arrow, .demo-beam { display:none; position:absolute; }

  .demo-target { left:50%; top:28px; width:96px; height:96px; margin-left:-48px;
    border:5px solid var(--accent); border-radius:50%; box-shadow:0 0 22px rgba(0,229,255,.5); }
  .demo-ripple { position:absolute; inset:-6px; border:4px solid var(--accent); border-radius:50%;
    opacity:0; animation:rip 1.6s ease-out infinite; }
  .demo-ripple.d2 { animation-delay:.18s; }
  @keyframes rip { 0%,36%{transform:scale(.4); opacity:0;} 42%{opacity:.8;} 100%{transform:scale(2.1); opacity:0;} }

  /* a fingertip coming from the bottom of the frame — assets/svg/finger.svg,
     turned 180deg so the index finger points up, inlined as a data URI so the
     file stays self-contained. The tip sits at the top edge of the box. */

    filter:drop-shadow(0 8px 18px rgba(0,0,0,.55)); }

  .demo-track { left:60px; right:60px; bottom:52px; height:0;
    border-top:5px dashed rgba(255,255,255,.28); }
  .demo-arrow { left:50%; top:50%; margin:-16px 0 0 40px; width:0; height:0;
    border:18px solid transparent; border-left-color:var(--accent);
    animation:arrowPush 1.4s ease-in-out infinite; }
  @keyframes arrowPush { 0%,100%{opacity:.15; transform:translateX(0);} 50%{opacity:1; transform:translateX(22px);} }
  /* pivoting dotted aim line, anchored at the fingertip */
  .demo-beam { left:50%; bottom:90px; width:6px; height:118px; margin-left:-3px;
    transform-origin:50% 100%;
    background:repeating-linear-gradient(180deg, var(--accent) 0 12px, transparent 12px 24px);
    animation:beamSweep 2.6s ease-in-out infinite; }
  @keyframes beamSweep { 0%,100%{transform:rotate(-34deg);} 50%{transform:rotate(34deg);} }

  /* variant: TAP — finger taps a pulsing target */
  .demo-tap  .demo-target, .demo-tap  .demo-hand { display:block; }
  .demo-tap  .demo-hand { animation:handTap 1.6s ease-in-out infinite; }
  @keyframes handTap { 0%,30%{transform:translateY(0);} 40%{transform:translateY(-26px);} 52%{transform:translateY(0);} }

  /* variant: HOLD — finger stays pressed, target charges up */
  .demo-hold .demo-target, .demo-hold .demo-hand { display:block; }
  .demo-hold .demo-target { animation:holdCharge 1.8s ease-in-out infinite; }
  .demo-hold .demo-ripple { animation-duration:1.8s; }
  .demo-hold .demo-hand { transform:translateY(-24px); }
  @keyframes holdCharge { 0%,100%{transform:scale(.9); opacity:.7;} 60%{transform:scale(1.12); opacity:1;} }

  /* variant: DRAG — finger slides along a dashed track */
  .demo-drag .demo-track, .demo-drag .demo-hand { display:block; }
  .demo-drag .demo-hand { animation:handSlide 2.4s ease-in-out infinite; }
  @keyframes handSlide { 0%,100%{transform:translateX(-108px);} 50%{transform:translateX(108px);} }

  /* variant: SWIPE — finger flicks across, an arrow shows the direction */
  .demo-swipe .demo-hand, .demo-swipe .demo-arrow { display:block; }
  .demo-swipe .demo-hand { animation:handFlick 1.6s ease-in-out infinite; }
  @keyframes handFlick {
    0%,20%   { transform:translateX(-96px); opacity:0; }
    30%      { opacity:1; }
    70%      { transform:translateX(96px); opacity:1; }
    85%,100% { transform:translateX(96px); opacity:0; }
  }

  /* variant: AIM — finger drags at the bottom, a dotted line sweeps a target */
  .demo-aim .demo-hand, .demo-aim .demo-beam, .demo-aim .demo-target { display:block; }
  .demo-aim .demo-target { top:22px; width:70px; height:70px; margin-left:-35px; }
  .demo-aim .demo-hand { animation:handSweep 2.6s ease-in-out infinite; }
  @keyframes handSweep { 0%,100%{transform:translateX(-56px);} 50%{transform:translateX(56px);} }

  /* ---- End screen: staggered cinematic reveal ---- */
  #screen-end { justify-content:center; background:rgba(6,7,18,.86); }
  /* Confetti sits above the dark tint but below every piece of end-screen text. */
  #confetti { position:absolute; inset:0; width:720px; height:1280px; pointer-events:none; z-index:0; }
  #screen-end > *:not(#confetti) { position:relative; z-index:1; }

  .eo-title {
    font-size:96px; font-weight:900; letter-spacing:4px; color:var(--danger);
    text-shadow:0 0 24px rgba(255,45,85,.85), 0 0 52px rgba(255,45,85,.45);
    opacity:0; transform:scale(.55);
    transition:opacity .4s ease, transform .45s cubic-bezier(.2,1.7,.4,1);
  }
  .eo-title.show { opacity:1; transform:scale(1); }
  /* A great run gets a brighter, celebratory title instead of the red one. */
  .eo-title.win { color:var(--good); text-shadow:0 0 24px rgba(105,219,124,.8), 0 0 52px rgba(105,219,124,.4); }
  .eo-title.perfect { color:#5cf0ff; animation:perfectglow 1.6s ease-in-out infinite; }
  @keyframes perfectglow {
    0%,100%{ text-shadow:0 0 24px rgba(0,229,255,.9), 0 0 52px rgba(0,180,255,.55); }
    50%    { text-shadow:0 0 38px rgba(120,240,255,1), 0 0 78px rgba(0,200,255,.8); }
  }
  .eo-scorelbl { margin-top:24px; font-size:16px; font-weight:800; letter-spacing:6px; color:var(--muted);
    opacity:0; transition:opacity .4s ease; }
  .eo-scorelbl.show { opacity:1; }
  .eo-score {
    font-size:150px; font-weight:900; line-height:1; color:var(--text);
    text-shadow:0 0 22px rgba(0,229,255,.65); font-variant-numeric:tabular-nums;
    opacity:0; transform:scale(.7); transition:opacity .35s ease, transform .35s ease;
  }
  .eo-score.show { opacity:1; transform:scale(1); }
  .eo-score.pop { animation:eopop .45s ease; }
  @keyframes eopop { 0%{transform:scale(1);} 40%{transform:scale(1.2);} 100%{transform:scale(1);} }

  .eo-stars { margin-top:24px; display:flex; gap:22px; justify-content:center; align-items:center; }
  .eo-stars.hidden { display:none; }
  .star { font-size:98px; line-height:1; color:rgba(255,255,255,.10); opacity:0; transform:scale(.3);
    transition:opacity .2s ease; }
  .star.dim { opacity:1; transform:scale(.82); color:rgba(255,255,255,.12); }
  .star.on {
    opacity:1; color:var(--gold);
    background:linear-gradient(180deg,#fff6bf 0%,#ffd43b 55%,#ff9f1c 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:starslam .6s cubic-bezier(.2,1.8,.35,1), starglow 1.9s ease-in-out .6s infinite;
  }
  @keyframes starslam { 0%{transform:scale(2.6);} 55%{transform:scale(.86);} 100%{transform:scale(1);} }
  @keyframes starglow { 0%,100%{filter:drop-shadow(0 0 10px rgba(255,200,60,.7));}
    50%{filter:drop-shadow(0 0 24px rgba(255,225,130,1));} }

  .eo-stats { margin-top:28px; width:520px; display:flex; flex-direction:column; gap:12px; }
  .eo-row {
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:14px 22px; border-radius:16px;
    background:var(--panel); border:1px solid var(--panel-line);
    font-size:30px; font-weight:800;
    opacity:0; transform:translateX(-22px); transition:opacity .3s ease, transform .3s ease;
  }
  .eo-row.show { opacity:1; transform:translateX(0); }
  .eo-val { font-variant-numeric:tabular-nums; }
  /* grades: accent / good / warn / bad / gold (gold gets the trophy treatment) */
  .eo-row.accent { color:var(--accent); background:rgba(0,229,255,.09); border-color:rgba(0,229,255,.3); }
  .eo-row.good   { color:var(--good); }
  .eo-row.warn   { color:#ffa94d; }
  .eo-row.bad    { color:#ff6b6b; }
  .eo-row.gold {
    position:relative; overflow:hidden; color:#fff3b0;
    background:linear-gradient(90deg, rgba(255,175,40,.16), rgba(255,220,130,.26), rgba(255,175,40,.16));
    border-color:rgba(255,215,110,.6);
    box-shadow:0 0 20px rgba(255,200,60,.3), inset 0 0 16px rgba(255,215,130,.18);
  }
  .eo-row.gold .eo-val { color:#ffe58a; text-shadow:0 0 12px rgba(255,205,70,.7); }
  .eo-row.gold::after {
    content:""; position:absolute; top:0; left:-60%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-20deg); animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%{left:-60%;} 55%,100%{left:130%;} }
  .eo-row .spark { display:inline-block; color:var(--gold); filter:drop-shadow(0 0 8px rgba(255,205,80,.9));
    animation:twinkle 1.8s ease-in-out infinite; }
  .eo-row .spark:last-child { animation-delay:.9s; }
  @keyframes twinkle { 0%,100%{opacity:.65; transform:scale(.85) rotate(0deg);}
    50%{opacity:1; transform:scale(1.15) rotate(20deg);} }

  /* The install CTA and the replay link arrive last, together. */
  #screen-end #btn-install, #screen-end #btn-replay { opacity:0; pointer-events:none; transition:opacity .5s ease; }
  #screen-end #btn-install { margin-top:34px; }
  #screen-end #btn-install.show, #screen-end #btn-replay.show { opacity:1; pointer-events:auto; }

  /* =========================================================================
     SKIN — RADIAM. Everything above is the shared motor stylesheet; the theme
     lives in these tokens and the few overrides below.
     ========================================================================= */
  :root {
    --bg:#070512; --text:#f4f0ff; --muted:#a293cf;
    --accent:#35e0ff;
    --cta-a:#ffcf4d; --cta-b:#ff8a1f; --cta-text:#2a1400;
    --danger:#ff3d6e; --gold:#ffd43b; --good:#3ff0a0;
    --panel:rgba(140,112,236,.07); --panel-line:rgba(168,142,255,.18);
    /* the dial is drawn in one cold wire colour so the beads own every hue */
    --wire:#6f5ea8;
    /* the five bead colours, in the order the game hands them out */
    --c1:#ff4d6d; --c2:#ffc23d; --c3:#35e0ff; --c4:#8b6cff; --c5:#3ff0a0;
  }
  html, body { background:radial-gradient(820px 900px at 50% 42%, #1a1440 0%, #0c0824 54%, #050310 100%); }
  .btn { box-shadow:0 10px 30px rgba(255,138,31,.42), inset 0 2px 6px rgba(255,255,255,.4); }
  #intro-title {
    background:linear-gradient(180deg,#ffffff,#8b6cff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 30px rgba(139,108,255,.5);
  }
  #hud-score { text-shadow:0 0 14px rgba(53,224,255,.5), 0 3px 10px rgba(5,3,16,.9); }
  .hud-pill { background:rgba(10,7,26,.66); }
  .hud-pill.warn { color:#ffd7e2; background:rgba(200,26,80,.4);
    box-shadow:0 0 18px rgba(255,61,110,.5); }
  .eo-score { text-shadow:0 0 22px rgba(53,224,255,.7); }
  #cta-bar { border-top:1px solid rgba(255,207,77,.22); }
  .pop-combo { --chip:#150c33; --chip-line:#c3b0ff;
    --fill:linear-gradient(180deg,#ffffff,#8b6cff); }
  /* the same cheap chip, in the supers' gold — RING BLAST rides it */
  .pop-combo.blast { --chip:#2a1a02; --chip-line:#ffd98a;
    --fill:linear-gradient(180deg,#fff6cf,#ffb020); }
  .pop-bonus { --fill:linear-gradient(180deg,#fff3cf,#ffc23d); }
  .pop-score { --fill:linear-gradient(180deg,#ffffff,#35e0ff); }

  /* ---- intro: the dial, and the ray that pays ---------------------------
     "Turn a ring, line up three on one ray" — the stage plays exactly that,
     once every 3.4 s: the finger rests on the toothed outer rim, rocks it one
     slot clockwise, and the amber bead it carries slides onto the ray the
     middle and inner ambers already sit on. The ray flares, two rings pop out
     of it, and the finger rocks the rim back for the next hunt.

     Every motor node is recycled as one part of the dial, so the stage is the
     game seen from the front:
       .demo-track  -> the OUTER ring: teeth, track, and the six beads it turns
       .demo-beam   -> the MIDDLE ring, holding still
       .demo-arrow  -> the INNER ring, holding still
       .demo-target -> the ray, flaring when the three ambers land on it
       .demo-ripple -> the pop rings leaving that ray
       .demo-hand   -> the shared finger, never replaced

     Geometry, in the 420x300 stage: the dial is centred on (210,148); bead
     orbits are 87.5 / 57.5 / 30 px and the toothed rim runs 105 to 118. The
     three ambers the demo is about sit at 12 o'clock, which is why the ray is
     the vertical bar from y=41 to y=132. Every bead below is "centre + orbit,
     at 60 deg steps" resolved to a pixel, so the alignment is exact by
     construction. */
  .demo-caption { display:none; }
  #intro-tagline { margin-top:18px; font-size:30px; font-weight:700; color:#ffffff; }
  #intro-tagline .w-turn  { color:#35e0ff; text-shadow:0 0 18px rgba(53,224,255,.85); }
  #intro-tagline .w-three { color:#ffc23d; text-shadow:0 0 18px rgba(255,194,61,.85); }
  #intro-tagline .w-ray   { color:#8b6cff; text-shadow:0 0 18px rgba(139,108,255,.95); }
  #intro-demo { margin-top:22px; }

  .demo-stage {
    width:420px; height:300px; overflow:hidden;
    background:
      radial-gradient(circle 190px at 210px 148px, rgba(111,94,168,.20) 0 108px, rgba(111,94,168,0) 168px),
      radial-gradient(330px 290px at 50% 49%, rgba(52,34,110,.55), rgba(7,5,18,0) 76%),
      #0a0720;
    box-shadow:inset 0 0 0 3px rgba(111,94,168,.16);
  }
  /* the two inner plates hold still, so the drag is the only motion on stage */
  .demo-drag .demo-beam, .demo-drag .demo-arrow, .demo-drag .demo-target { display:block; }

  /* THE OUTER RING — the one you turn. Teeth on the rim, a track under the
     beads, and its six beads painted straight into its own background so they
     turn with it and the alignment can never drift. Each bead is the same HARD
     ENAMEL the canvas sprite uses, in two hard-edged layers: the gloss cap on
     top, then a flat body inside a dark wall. Every stop is a pair, never a
     fade — a soft stop here is what made the dial look out of focus. */
  .demo-drag .demo-track {
    display:block; left:100px; top:38px; right:auto; bottom:auto;
    width:220px; height:220px; border:0; border-radius:50%;
    background-image:
      radial-gradient(circle 5px at 110px 16px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 5px at 186px 59px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 5px at 186px 147px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 5px at 110px 191px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 5px at 34px 147px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 5px at 34px 59px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 15px at 110px 23px, var(--c2) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 15px at 186px 66px, var(--c3) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 15px at 186px 154px, var(--c1) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 15px at 110px 198px, var(--c3) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 15px at 34px 154px, var(--c4) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 15px at 34px 66px, var(--c1) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle at 50% 50%, transparent 0 70px, rgba(111,94,168,.16) 70px 105px, rgba(111,94,168,.5) 105px 108px, transparent 108px);
    animation:radRim 3.4s ease-in-out infinite;
  }
  /* the teeth: a repeating conic wedge masked down to the rim annulus is the
     cheapest cog CSS can draw, and it turns with the ring that carries it.
     closest-side, not the default farthest-CORNER: the mask has to measure the
     same 118 px the box does, or the annulus lands outside the element. */
  .demo-drag .demo-track::before {
    content:""; position:absolute; inset:-8px; border-radius:50%;
    background:repeating-conic-gradient(from 0deg,
      rgba(111,94,168,.85) 0 6deg, transparent 6deg 15deg);
    -webkit-mask:radial-gradient(circle closest-side, transparent 0 89%, #000 89% 100%);
    mask:radial-gradient(circle closest-side, transparent 0 89%, #000 89% 100%);
  }

  /* THE MIDDLE RING — same recipe, holding still. */
  .demo-drag .demo-beam {
    left:135px; top:73px; bottom:auto; margin:0; width:150px; height:150px;
    border-radius:50%; transform:none; animation:none;
    background-image:
      radial-gradient(circle 4px at 75px 13px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 4px at 125px 41px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 4px at 125px 99px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 4px at 75px 128px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 4px at 25px 99px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 4px at 25px 41px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 12px at 75px 18px, var(--c2) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 12px at 125px 46px, var(--c4) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 12px at 125px 104px, var(--c3) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 12px at 75px 133px, var(--c1) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 12px at 25px 104px, var(--c4) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 12px at 25px 46px, var(--c3) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle at 50% 50%, transparent 0 44px, rgba(111,94,168,.16) 44px 71px, transparent 71px);
  }

  /* THE INNER RING — the smallest plate, holding still. */
  .demo-drag .demo-arrow {
    left:165px; top:103px; margin:0; width:90px; height:90px;
    border:0; border-radius:50%; animation:none;
    background-image:
      radial-gradient(circle 3px at 45px 10px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 3px at 71px 26px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 3px at 71px 56px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 3px at 45px 70px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 3px at 19px 56px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 3px at 19px 26px, rgba(255,255,255,.5) 0 100%, transparent 100%),
      radial-gradient(circle 10px at 45px 15px, var(--c2) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 10px at 71px 30px, var(--c3) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 10px at 71px 60px, var(--c1) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 10px at 45px 75px, var(--c4) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 10px at 19px 60px, var(--c3) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle 10px at 19px 30px, var(--c1) 0 87%, rgba(10,6,26,.92) 87% 100%, transparent 100%),
      radial-gradient(circle at 50% 50%, transparent 0 18px, rgba(111,94,168,.16) 18px 42px, transparent 42px);
  }
  /* the hub the three plates turn on */
  .demo-drag .demo-arrow::after {
    content:""; position:absolute; left:30px; top:30px; width:30px; height:30px;
    border-radius:50%; background:#120c2c; box-shadow:inset 0 0 0 2px rgba(111,94,168,.6);
  }

  /* THE RAY — the 12 o'clock spoke, dark until the three ambers land on it. */
  .demo-drag .demo-target {
    left:190px; top:41px; width:40px; height:91px; margin:0;
    border:0; border-radius:20px; opacity:0;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,194,61,.26));
    box-shadow:0 0 26px rgba(255,194,61,.85), 0 0 62px rgba(255,194,61,.5);
    mix-blend-mode:screen;
    animation:radRay 3.4s ease-out infinite;
  }
  .demo-drag .demo-ripple {
    inset:auto; left:20px; top:45px; width:56px; height:56px; margin:-28px 0 0 -28px;
    border:3px solid #ffe6a8; border-radius:50%; opacity:0;
    animation:radPop 3.4s ease-out infinite;
  }
  .demo-drag .demo-ripple.d2 { animation-delay:.16s; }

  /* THE FINGER — parked on the rim at 5 o'clock, rocking the ring around the
     dial's centre. Its transform-origin IS that centre, expressed from the
     finger's own box, so finger and ring share one rotation and can never
     disagree about where the beads are. */
  .demo-drag .demo-hand {
    left:263px; top:227px; bottom:auto; width:52px; height:66px; margin:0;
    transform-origin:-53px -79px;
    animation:radRim 3.4s ease-in-out infinite;
  }

  @keyframes radRim {
    0%,10%   { transform:rotate(-60deg); }
    46%,62%  { transform:rotate(0deg); }
    96%,100% { transform:rotate(-60deg); }
  }
  @keyframes radRay {
    0%,44%   { opacity:0; }
    48%      { opacity:1; }
    64%      { opacity:.75; }
    76%,100% { opacity:0; }
  }
  @keyframes radPop {
    0%,45%  { transform:scale(.25); opacity:0; }
    50%     { opacity:.95; }
    80%     { transform:scale(2.9); opacity:0; }
    100%    { transform:scale(2.9); opacity:0; }
  }
</style>
</head>
<body>

<div id="safe-probe"></div>
<div id="backdrop"></div>

<!-- ==========================================================================
     MARKUP — one frame, four layers: canvas world, overlay, HUD/CTA, screens.
     Everything below is positioned in 720x1280 design pixels.
     ========================================================================== -->
<div id="stage">
  <div id="frame">

    <canvas id="game" width="720" height="1280"></canvas>

    <!-- game-view overlay: toasts, banners, rewards, comic pops, glow -->
    <div id="overlay">
      <div id="ov-toasts"></div>
      <div id="ov-banner"><div id="ov-banner-main"></div><div id="ov-banner-sub"></div></div>
      <div id="ov-reward"></div>
      <div id="ov-vignette"></div>
      <!-- comic callouts sit last: they are the loudest layer of the overlay -->
      <div id="ov-pops"></div>
    </div>

    <!-- HUD: left slot / big centre score / right slot (timer by default) -->
    <div id="hud" class="hidden">
      <div id="hud-left"></div>
      <div id="hud-center"><div id="hud-score">0</div><div id="hud-score-lbl">SCORE</div></div>
      <div id="hud-right"></div>
    </div>

    <!-- persistent install CTA, visible during play -->
    <div id="cta-bar" class="hidden">
      <button class="btn sm" id="btn-cta">INSTALL NOW</button>
    </div>

    <!-- loading -->
    <div id="screen-loading" class="screen">
      <div class="spinner"></div>
      <div class="loading-lbl">Loading…</div>
    </div>

    <!-- intro: logo + title + ONE-sentence pitch + animated how-to-play + start
         (both strings are rewritten from CONFIG at boot; keep them in sync) -->
    <div id="screen-intro" class="screen hidden">
      <img id="app-icon" alt="">
      <div id="intro-title">RADIAM</div>
      <div id="intro-tagline"><b class="w-turn">Turn</b> a ring, line up <b class="w-three">three</b> on one <b class="w-ray">ray</b></div>
      <div id="intro-demo">
        <div class="demo-stage">
          <div class="demo-track"></div>
          <div class="demo-beam"></div>
          <div class="demo-target"><span class="demo-ripple"></span><span class="demo-ripple d2"></span></div>
          <div class="demo-hand"></div>
          <div class="demo-arrow"></div>
        </div>
        <div class="demo-caption" id="demo-caption"></div>
      </div>
      <button class="btn lg" id="btn-start">TAP TO PLAY</button>
    </div>

    <!-- end: cinematic score reveal + stars + stats + CTA + replay link -->
    <div id="screen-end" class="screen hidden">
      <canvas id="confetti" width="720" height="1280"></canvas>
      <div class="eo-title" id="eo-title">GAME OVER</div>
      <div class="eo-scorelbl" id="eo-scorelbl">FINAL SCORE</div>
      <div class="eo-score" id="eo-score">0</div>
      <div class="eo-stars" id="eo-stars">
        <span class="star" id="star-1">★</span>
        <span class="star" id="star-2">★</span>

<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG — the knobs a new game changes first.
     =================================================================== */
  var CONFIG = {
    title:   "RADIAM",
    /* One sentence, and the stage below plays it: the finger rocks the toothed
       outer ring one slot, the amber bead it carries joins the two ambers
       already sitting on the 12 o'clock ray, and the ray pays. */
    tagline: "<b class=\"w-turn\">Turn</b> a ring, line up <b class=\"w-three\">three</b> on one <b class=\"w-ray\">ray</b>",
    gameSeconds: 40,                 // round length in seconds; 0 = endless

    // Store links used by every CTA. The right one is picked at runtime from the
    // user agent. Until this game has a real listing all three point at the
    // newrare site, where the game can actually be played — never leave a
    // placeholder store URL here, it ships as a 404 on the device.
    storeUrl: {
      ios:     "https://newrare-website.vercel.app/#playables",
      android: "https://newrare-website.vercel.app/#playables",
      fallback:"https://newrare-website.vercel.app/#playables"
    },

    // Design resolution — all game logic and all DOM overlays use these units.
    designWidth: 720,
    designHeight: 1280,
    bg: "#070512",

    // One round disc centred in Layout: it can never reach the score, the
    // timer or the install button, whatever the device does to the frame.
    layout: { hudHeight: 150, ctaHeight: 112, sideMargin: 26 },

    // The gesture IS the game: you put a finger on a ring and turn it. SPACE
    // therefore only starts and replays — a synthetic tap at a fixed point
    // would grab a ring the player never chose. Mouse-drag covers the desktop.
    intro: { logo: "logo", demo: "drag", caption: "" },
    keyboard: true,

    hud: { score: true, timer: true },

    // The background bed (ASSETS.sounds.music): kept low under the dial's
    // clicks, with a 1.8 s crossfade over the loop seam.
    music: { volume: 0.10, fade: 1.8 },

    // All user-facing copy in one place.
    copy: {
      start:      "TAP TO PLAY",
      ctaBar:     "INSTALL NOW",
      ctaEnd:     "PLAY THE FULL GAME",
      replay:     "Replay the demo",
      scoreLabel: "SCORE",
      timeLabel:  "TIME",
      endScore:   "FINAL SCORE",
      gameOver:   "JAMMED!",
      timeUp:     "TIME'S UP!"
    },

    /* --- the dial ---------------------------------------------------------
       Three coaxial plates on one hub, each carrying `slots` beads in its own
       housings, and `slots` rays drawn between the hub and the toothed rim.
       Drag a plate and it turns alone; the two others hold. When the three
       beads sitting on one ray share a colour they pop, and the emptied
       housings are re-fed from outside the rim.

       Everything is expressed as a FRACTION of `unit` — the rim radius, which
       is derived from Layout — so the same numbers hold on a tall phone and
       inside a squat ad frame. `ballR` gives the bead radii; the orbits are
       NOT authored, they are stacked outward from the hub so that the same
       `gap` of empty sky shows between the hub and the first track and between
       every pair of tracks. Hand-written orbits drifted: the middle and outer
       housings ended up overlapping while the inner pair had a clear gap, and
       the three plates stopped reading as three. The touch bands that decide
       "which plate did the finger land on" are split from those same radii,
       and the outermost reaches well past the rim so a thumb sliding off the
       disc keeps turning the plate it grabbed.

       The two numbers that shape the round most: `comboWindow`, the seconds a
       chain survives without a pop (short enough that sweeping blindly loses
       it, long enough that a deliberate second ray keeps it), and `colours`,
       whose length sets how often a ray happens to line up at all. */
    dial: {
      slots: 12,                     // beads per plate, and rays on the dial
      maxRadius: 330,                // the rim never grows past this (design px)
      margin: 8,                     // breathing room inside Layout
      ballR:  [0.068, 0.098, 0.125], // bead radius, inner -> outer, x unit
      housing: 0.018,                // clearance a housing track adds around its bead
      gap:     0.045,                // the SAME sky between hub and every track
      grabPad: 1.40,                 // last touch band, well past the rim, x unit
      hubR:   0.175,                 // the cap the three plates turn on

      /* The dial is a DETENT wheel: let go and the plate clicks onto the
         nearest housing, it never coasts. Free spin was tried and thrown out —
         a released plate took ~0.6 s to stop, and since a ray only pays once
         the dial is at rest (see settled()), a player making a move every half
         second was never paid for any of them. */
      snap:   22,                    // how hard a released plate clicks onto its detent
      dwell:  0.08,                  // seconds a plate must hold still to pay

      fillDelay: 0.14,               // beat before the first refill leaves the rim
      fillStagger: 0.05,             // ...and between the three of one ray
      fillTime: 0.30,                // seconds from the rim to the outer housing
      fillFrom: 1.14,                // where a refill starts, x unit
      popTime: 0.26,                 // a popped bead's dissolve
      flareTime: 0.42,               // the ray staying lit after it paid

      colours:  ["#ff4d6d", "#ffc23d", "#35e0ff", "#8b6cff", "#3ff0a0"],
      bagPer: 3,                     // beads of each hue in a plate's refill bag
      startColours: 4,               // hues in play at the start...
      colourUpAt: 22,                // ...and the second the fifth joins them

      /* Supers. A move that pays two rays at once, or a chain reaching x4,
         upgrades one of the refills already flying in: two rays / x4 give a
         CHARGE, three rays / x8 give a NOVA. `fuseStep` is how fast a ring
         blast unzips its plate and `novaSpeed` how fast a nova's shockwave
         crosses the dial — both are what the wave you SEE is drawn from, so
         the picture and the beads going off can never disagree. */
      chargeNeed: 4,                 // rays that fill the hub's charge meter
      superCap:   3,                 // supers allowed on the dial at once
      fuseStep:   0.035,             // seconds between two housings of a blast
      novaSpeed:  1100,              // design px/s a nova's wave travels
      chargePing: 1.05,              // seconds a CHARGE's target ring takes to leave it
      novaSpin:   0.62,              // seconds the NOVA's spectrum takes to step one hue
      /* What a power PAYS. A bead taken by a wave is worth `blastScore` times
         the chain, and every further bead of the same wave adds `blastRamp`
         of that again, up to `blastRampMax`: emptying the dial with one nova
         is the biggest single payout in the game, and a two-bead splash still
         is not. The chain announces itself once, past `blastCall` beads. */
      blastScore: 30,                // a bead taken by a wave, times the combo
      blastRamp:  0.15,              // ...growing this much per bead of the chain
      blastRampMax: 3,               // ...up to this ceiling
      blastCall:  4,                 // beads before a chain reports its payout

      rayScore:   25,                // a ray pays this, times the combo
      comboMax:   8,
      comboWindow: 1.0,              // seconds a chain survives without a pop
      comboBonus: 20,                // extra per combo step, on every 4th
      /* Two or three rays in one move multiply what that move already paid,
         by ray count — so the skill beat scales with the chain instead of
         handing out the same flat bonus at x1 and at x8. */
      multiMult: [1, 2.5, 5],

      wire:  "#6f5ea8",              // the whole machine is drawn in this
      plate: "#3d2c85",              // the housing track under the beads
      hub:   "#120c2c",
      sky:   ["#241a52", "#0d0827", "#050310"],
      rays:  36,                     // the radiance painted behind the dial

      /* The finale. The clock never cuts a move short: it hands the round over
         to a wind-down that waits for the dial, then plays the machine out. */
      finaleWait:  4.5,              // seconds the board is given to go quiet
      finaleCalm:  0.55,             // stillness it must then HOLD (see quiet())
      finaleDrain: 0.85,             // the light draining into the hub...
      finaleDrama: 2.0,              // ...inside the whole power-down

      star2: 7000, star3: 18000
    }
  };

  /* ===================================================================
     3. ENGINE — reusable plumbing shared by every game. Extend, don't fork.
     =================================================================== */

  function $(id) { return document.getElementById(id); }
  function cssVar(name, value) { document.documentElement.style.setProperty(name, value); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // --- Canvas, design-space scaling and the notch-safe layout -------------
  var canvas = $("game"), ctx = canvas.getContext("2d");

  // The virtual screen every coordinate refers to.
  var view = {
    w: CONFIG.designWidth, h: CONFIG.designHeight,
    scale: 1,          // design px -> screen px
    insetTop: 0,       // design px eaten by the notch / status bar
    insetBottom: 0     // design px eaten by the home indicator
  };

  // The rectangle gameplay may safely use: below the HUD, above the CTA bar,
  // and clear of the device insets. Recomputed on every resize.
  var Layout = { top: 0, bottom: 0, left: 0, right: 0, w: 0, h: 0, cx: 0, cy: 0 };

  // env(safe-area-inset-*) is only observable through a probe element.
  function safeInsets() {
    var cs = window.getComputedStyle($("safe-probe"));
    return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
  }

  function fitCanvas() {
    var winW = window.innerWidth, winH = window.innerHeight;

    /* CONFIG.layout.framePad reserves a margin of SCREEN pixels around the
       frame before the scale is computed. A playable leaves it at 0 — an ad
       fills its container, always — while the web target sets it on a desktop
       window so the dressing of packages/frame-web is not cut off by the edge
       of the screen. It may be an accessor (see packages/platform/web.js), so
       it is read on every fit rather than cached. */
    var pad = CONFIG.layout.framePad || 0;
    var vw = Math.max(1, winW - pad * 2), vh = Math.max(1, winH - pad * 2);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;

    // Backing store at design size x DPR; the frame transform does the rest.
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);                // draw in design px
    cssVar("--scale", scale);

    // Letterbox bars already push the frame away from the notch: only the
    // remaining overlap has to be padded, converted to design px.
    var ins = safeInsets(), bar = Math.max(0, (winH - view.h * scale) / 2);
    view.insetTop    = Math.max(0, (ins.top - bar) / scale);
    view.insetBottom = Math.max(0, (ins.bottom - bar) / scale);
    cssVar("--inset-top", view.insetTop.toFixed(1) + "px");
    cssVar("--inset-bottom", view.insetBottom.toFixed(1) + "px");

    relayout();
  }

  function relayout() {
    var m = CONFIG.layout;
    Layout.top    = view.insetTop + m.hudHeight;
    Layout.bottom = view.h - view.insetBottom - m.ctaHeight;
    Layout.left   = m.sideMargin;
    Layout.right  = view.w - m.sideMargin;
    Layout.w = Layout.right - Layout.left;
    Layout.h = Layout.bottom - Layout.top;
    Layout.cx = (Layout.left + Layout.right) / 2;
    Layout.cy = (Layout.top + Layout.bottom) / 2;
    if (typeof Game !== "undefined" && Game && Game.onResize) Game.onResize();
  }

  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: mouse + touch unified, mapped into design coordinates -------
  // Also exposes `at()` so the desktop keyboard fallback (section 7) can
  // synthesize a tap without a real pointer.
  var Input = (function () {
    var L = { down: [], move: [], up: [] };
    function toDesign(cx, cy) {
      var r = canvas.getBoundingClientRect();          // accounts for the scale
      return { x: (cx - r.left) / r.width * view.w, y: (cy - r.top) / r.height * view.h };
    }
    function emit(type, e) {
      var t = (e.touches && e.touches[0]) ? e.touches[0]
            : ((e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      for (var i = 0; i < L[type].length; i++) L[type][i](p, e);
    }
    canvas.addEventListener("mousedown", function (e) { emit("down", e); });
    canvas.addEventListener("mousemove", function (e) { emit("move", e); });
    window.addEventListener("mouseup",   function (e) { emit("up",   e); });
    canvas.addEventListener("touchstart",  function (e) { e.preventDefault(); emit("down", e); }, { passive: false });
    canvas.addEventListener("touchmove",   function (e) { e.preventDefault(); emit("move", e); }, { passive: false });
    canvas.addEventListener("touchend",    function (e) { e.preventDefault(); emit("up",   e); }, { passive: false });
    canvas.addEventListener("touchcancel", function (e) { emit("up", e); });
    // Fire a synthetic pointer event at a design-space point. `e` is null:
    // listeners must not depend on the raw DOM event.
    function at(type, x, y) {
      var p = { x: x, y: y };
      for (var i = 0; i < L[type].length; i++) L[type][i](p, null);
    }
    /* A whole synthetic flick: down at the centre of the play area, one move
       `dist` to the side, then up. This is how the desktop keyboard fallback
       (section 7) drives a swipe game — the gesture goes through the same
       down/move/up path as a finger, so a game never grows a second input
       API for the arrow keys. dir is -1 (left) or +1 (right). */
    function swipe(dir, dist) {
      var d = dist == null ? 150 : dist, x = Layout.cx, y = Layout.cy;
      at("down", x, y);
      at("move", x + dir * d, y);
      at("up",   x + dir * d, y);
    }
    return { on: function (type, fn) { L[type].push(fn); }, at: at, swipe: swipe };
  })();

  // --- Loop: rAF with clamped dt, pausable when the ad is not visible -----
  var Loop = (function () {
    var running = false, paused = false, last = 0, u = null, r = null;

                  vignette:"rgba(214,27,60,.9)", vignetteMs:700 },
      // "you nailed it": gold, sparkles, gentle rays
      perfect:  { anim:"punch", enter:360, hold:620, exit:280, decor:["sparks"],
                  at:"upper", rot:-3, vignette:"rgba(255,190,60,.8)" },
      // the hero moment: rays, chroma, maximum size
      ultra:    { anim:"zoom", enter:440, hold:640, exit:320, decor:["rays"],
                  at:"center", shake:16, flash:0.5, vignette:"rgba(120,70,255,.85)" },
      // a reward sticker
      bonus:    { anim:"drop", enter:380, hold:620, exit:280, decor:["dots"], at:"lower", rot:-4 },
      // hazard tape, blinking for the whole hold
      danger:   { anim:"alarm", enter:240, hold:1100, exit:260, pulse:true, decor:["stripes"],
                  at:"top", vignette:"rgba(255,40,40,.85)", vignetteMs:1100 },
      // the end-of-run peak (its confetti only shows once the end screen is up,
      // since Confetti draws on the end-screen canvas)
      record:   { anim:"drop", enter:620, hold:1500, exit:380, decor:["rays","band","sparks"],
                  at:"center", shake:8, confetti:28 },
      // vertical manga column hugging one edge
      vert:     { anim:"punch", enter:320, hold:560, exit:260, decor:["rays"],
                  at:"edgeRight", rot:4, vertical:true }
    };

    function clear() {
      var i; for (i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = []; live = [];
      $("ov-pops").innerHTML = "";
    }

    /* Rasterizing a style for the first time costs 50-80 ms (gradient text,
       clip-paths, masks). That must never land on a milestone frame, so every
       style is built once — hidden, one per animation frame — while the intro is
       up and nothing is being played. Idempotent and self-cancelling. */
    var warmed = false;
    function prewarm() {
      if (warmed) return;
      warmed = true;
      var keys = [], k;
      for (k in STYLES) if (STYLES.hasOwnProperty(k)) keys.push(k);
      var i = 0;
      function step() {
        if (i >= keys.length) return;
        // Not visibility:hidden — an invisible layer is never rasterized, which
        // is the whole point of the pass. Near-zero opacity still paints.
        var h = show(keys[i++], { word: "WARM UP", sub: "0", hold: 0, enter: 1, exit: 1, silent: true });
        if (h) h.el.style.opacity = "0.004";
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    return { show: show, clear: clear, prewarm: prewarm, styles: STYLES, anchors: ANCHORS };
  })();
