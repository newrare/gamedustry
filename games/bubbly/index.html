<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bubbly</title>
<!--
  GAME — "Bubbly" (reskin of Ring Combo)
  Mechanic: a glossy shooter bubble drifts and bounces off the invisible screen
  edges under gravity. Rings made of small bubbles ("clusters") close in from
  outside toward the shooter. When a cluster reaches the shooter bubble it pops
  on its own and breaks your chain, and a fresh cluster spawns outside.
  TAP the instant a cluster touches the shooter bubble to pop it; timing is
  graded MISS / CLOSE / OK / GOOD / PERFECT with escalating juice, and
  consecutive pops build a combo multiplier shown large at the top. Each pop
  sends a shockwave rippling outward that lights up the remaining clusters — a
  chain reaction that grows with the combo. Bubble particles float up, an
  aquatic neon look, a bubble trail and animated counters sell the feedback.
  The round does not end on the timer: when time runs out a menacing spiked
  bubble closes in — the run ends when it reaches the shooter bubble.
  Built from template/game-template.html — see docs/CREATING_A_GAME.md.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden;
    background:radial-gradient(1100px 900px at 50% 38%, #0d3b66 0%, #06203f 55%, #030f22 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; touch-action:none; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; color:#fff; padding:24px; transition:opacity .25s ease; z-index:10; }
  .screen.hidden { opacity:0; pointer-events:none; }
  /* Neon type — a single static glow layer (light on repaints). */
  .title { font-size:clamp(24px,8vw,48px); font-weight:800; color:#eafcff; letter-spacing:1px;
    text-shadow:0 0 14px rgba(0,229,255,.75); }
  /* App icon on the title screen: gently floating, glowing rounded tile. */
  #app-icon { width:clamp(128px,40vw,196px); height:auto; margin-bottom:8px; border-radius:28px;
    box-shadow:0 12px 34px rgba(0,0,0,.5), 0 0 44px rgba(80,200,255,.5);
    animation:iconfloat 3s ease-in-out infinite; }
  @keyframes iconfloat { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  .subtitle { margin-top:14px; font-size:clamp(14px,4vw,20px); color:#c9e6ff; opacity:.92; }
  /* Neon button: static glow rim; the pulse animates transform only (GPU-cheap). */
  .btn { margin-top:26px; padding:16px 38px; border:2px solid rgba(255,255,255,.8); border-radius:999px;
    font-size:clamp(16px,5vw,22px); font-weight:800; color:#04040c; cursor:pointer; letter-spacing:.5px;
    background:linear-gradient(180deg,#4bf5ff,#00d0ff);
    box-shadow:0 0 16px rgba(0,229,255,.7); animation:pulse 1.4s ease-in-out infinite; }
  .btn:active { transform:scale(.96); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

  /* ---- Dramatic game-over sequence (staggered reveals, animated counters) ---- */
  #screen-end { justify-content:center; background:rgba(4,15,30,.86); }
  .eo-title { font-size:clamp(32px,11vw,64px); font-weight:900; letter-spacing:3px; color:#ff2d55;
    text-shadow:0 0 20px rgba(255,45,85,.85), 0 0 42px rgba(255,45,85,.5);
    opacity:0; transform:scale(.55);
    transition:opacity .4s ease, transform .45s cubic-bezier(.2,1.7,.4,1); }
  .eo-title.show { opacity:1; transform:scale(1); }
  /* Flawless run: bright electric-blue PERFECT with a pulsing glow. */
  .eo-title.perfect { color:#5cf0ff;
    text-shadow:0 0 22px rgba(0,229,255,.95), 0 0 48px rgba(0,180,255,.6);
    animation:perfectglow 1.6s ease-in-out infinite; }
  @keyframes perfectglow { 0%,100%{ text-shadow:0 0 22px rgba(0,229,255,.9), 0 0 48px rgba(0,180,255,.55); }
    50%{ text-shadow:0 0 34px rgba(120,240,255,1), 0 0 72px rgba(0,200,255,.8); } }
  .eo-scorelbl { margin-top:20px; font-size:13px; font-weight:800; letter-spacing:5px; color:#9fc4e0;
    opacity:0; transition:opacity .4s ease; }
  .eo-scorelbl.show { opacity:1; }
  .eo-score { font-size:clamp(56px,18vw,104px); font-weight:900; line-height:1; color:#eafcff;
    text-shadow:0 0 18px rgba(0,229,255,.7);
    opacity:0; transform:scale(.7); transition:opacity .35s ease, transform .35s ease; }
  .eo-score.show { opacity:1; transform:scale(1); }
  .eo-score.pop { animation:eopop .45s ease; }
  @keyframes eopop { 0%{transform:scale(1);} 40%{transform:scale(1.2);} 100%{transform:scale(1);} }
  .eo-stats { margin-top:24px; width:min(340px,82vw); display:flex; flex-direction:column; gap:9px; }
  .eo-row { display:flex; justify-content:space-between; align-items:center; padding:10px 16px;
    border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    font-weight:800; font-size:clamp(15px,4.6vw,20px);
    opacity:0; transform:translateX(-18px); transition:opacity .3s ease, transform .3s ease; }
  .eo-row.show { opacity:1; transform:translateX(0); }
  .eo-val { font-variant-numeric:tabular-nums; }
  /* Golden PERFECT row: warm gradient, glowing rim, a shine sweep and twinkling stars. */
  .eo-row[data-grade="PERFECT"] { position:relative; overflow:hidden; color:#fff3b0;
    background:linear-gradient(90deg, rgba(255,175,40,.16), rgba(255,220,130,.26), rgba(255,175,40,.16));
    border-color:rgba(255,215,110,.6);
    box-shadow:0 0 18px rgba(255,200,60,.3), inset 0 0 14px rgba(255,215,130,.18); }
  .eo-row[data-grade="PERFECT"] .eo-val { color:#ffe58a; text-shadow:0 0 10px rgba(255,205,70,.7); }
  .eo-row[data-grade="PERFECT"]::after { content:""; position:absolute; top:0; left:-60%; width:45%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-20deg); animation:shine 2.8s ease-in-out infinite; }
  @keyframes shine { 0%{left:-60%;} 55%,100%{left:130%;} }
  .ps { display:inline-block; color:#ffd43b; filter:drop-shadow(0 0 6px rgba(255,205,80,.9));
    animation:twinkle 1.8s ease-in-out infinite; }
  .ps:last-child { animation-delay:.9s; }
  @keyframes twinkle { 0%,100%{ opacity:.65; transform:scale(.85) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(20deg); } }

  /* Star rating — three slots; earned ones slam in gold, empty ones stay dark. */
  .eo-stars { margin-top:20px; display:flex; gap:16px; justify-content:center; align-items:center; }
  .eo-stars.show { }
  .star { font-size:clamp(40px,13vw,68px); line-height:1; color:rgba(255,255,255,.10);
    opacity:0; transform:scale(.3); transition:opacity .2s ease; }
  .star.dim { opacity:1; transform:scale(.82); color:rgba(255,255,255,.12);
    text-shadow:0 0 6px rgba(0,0,0,.4); }
  .star.on { opacity:1; color:#ffd43b;
    background:linear-gradient(180deg,#fff6bf 0%,#ffd43b 55%,#ff9f1c 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:starslam .6s cubic-bezier(.2,1.8,.35,1), starglow 1.9s ease-in-out .6s infinite; }
  @keyframes starslam { 0%{ transform:scale(2.6); } 55%{ transform:scale(.86); } 100%{ transform:scale(1); } }
  @keyframes starglow { 0%,100%{ filter:drop-shadow(0 0 8px rgba(255,200,60,.7)); }
    50%{ filter:drop-shadow(0 0 20px rgba(255,225,130,1)); } }

  /* Confetti overlay: z-index:-1 keeps it above the dark tint but behind the text. */
  #confetti { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:-1; }
  .eo-row[data-grade="GOOD"]    { color:#69db7c; }
  .eo-row[data-grade="OK"]      { color:#4dabf7; }
  .eo-row[data-grade="CLOSE"]   { color:#ffa94d; }
  .eo-row[data-grade="MISS"]    { color:#ff6b6b; }
  .eo-row[data-grade="COMBO"]   { color:#00e5ff; background:rgba(0,229,255,.09); border-color:rgba(0,229,255,.3); }
  #screen-end .btn { opacity:0; pointer-events:none; transition:opacity .5s ease; }
  #screen-end .btn.show { opacity:1; pointer-events:auto; }

  /* HUD: the global score is always shown large at the top-center. */
  #hud { position:absolute; top:0; left:0; right:0; z-index:15; pointer-events:none; }
  #hud.hidden { display:none; }
  #scorewrap { position:absolute; top:12px; left:0; right:0; text-align:center; }
  #score { display:inline-block; transform-origin:center bottom; color:#eafcff;
    font-size:clamp(42px,13vw,78px); font-weight:900; line-height:1;
    text-shadow:0 0 12px rgba(0,229,255,.6); transition:color .25s ease; }
  #score.bump { animation:scorebump .4s cubic-bezier(.2,1.5,.4,1); }
  @keyframes scorebump { 0%{transform:scale(1);} 28%{transform:scale(1.42);} 100%{transform:scale(1);} }
  #scorelbl { margin-top:0; font-size:12px; font-weight:800; letter-spacing:4px; color:rgba(255,255,255,.55); }
  #timebadge { position:absolute; top:18px; right:18px; color:#fff; opacity:.85;
    font-weight:800; letter-spacing:1px; font-size:clamp(14px,4vw,20px); text-shadow:0 2px 6px rgba(0,0,0,.5); }

  /* No backdrop-filter (that blur is GPU-costly) — a solid tint instead. */
  #cta-bar { position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center;
    justify-content:center; padding:12px; background:rgba(4,12,26,.78);
    border-top:1px solid rgba(0,229,255,.25); }
  #cta-bar.hidden { display:none; }
  .spinner { width:46px; height:46px; border-radius:50%; border:5px solid rgba(255,255,255,.15);
    border-top-color:#00e5ff; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

  <div id="scorewrap"><div id="score">0</div><div id="scorelbl">SCORE</div></div>
  <div id="timebadge">TIME <span id="time">0</span></div>
</div>

  <div class="spinner"></div><div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

  /* ---------- 3. ENGINE (shared plumbing) ---------- */
  function $(id){ return document.getElementById(id); }
  var canvas=$("game"), ctx=canvas.getContext("2d");
  var view={ w:CONFIG.designWidth, h:CONFIG.designHeight, scale:1 };
  function fitCanvas(){
    var vw=window.innerWidth, vh=window.innerHeight, dpr=Math.min(window.devicePixelRatio||1,2);
    var scale=Math.min(vw/view.w, vh/view.h); view.scale=scale;
    canvas.width=Math.round(view.w*dpr); canvas.height=Math.round(view.h*dpr);
    canvas.style.width=Math.round(view.w*scale)+"px"; canvas.style.height=Math.round(view.h*scale)+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  var Input=(function(){
    var L={down:[]};
    function toDesign(cx,cy){ var r=canvas.getBoundingClientRect();
      return { x:(cx-r.left)/r.width*view.w, y:(cy-r.top)/r.height*view.h }; }
    function emit(e){ var t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e);
      var p=toDesign(t.clientX,t.clientY); L.down.forEach(function(fn){ fn(p); }); }
    canvas.addEventListener("mousedown", emit);
    canvas.addEventListener("touchstart", function(e){ e.preventDefault(); emit(e); }, {passive:false});
    return { on:function(fn){ L.down.push(fn); } };
  })();

  var Loop=(function(){
    var running=false,last=0,u=null,r=null;
    function frame(now){ if(!running)return; var dt=Math.min((now-last)/1000,0.05); last=now; if(u)u(dt); if(r)r(); requestAnimationFrame(frame); }
    return { start:function(uu,rr){ u=uu;r=rr;running=true;last=performance.now();requestAnimationFrame(frame); },
             stop:function(){ running=false; } };
  })();

  var Sound=(function(){
    var actx=null, buffers={}, loaded=false;
    function ensure(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
      if(actx&&actx.state==="suspended")actx.resume(); return actx; }
    // Decode the embedded base64 mp3 samples (ASSETS.sounds) into AudioBuffers
    // once, after a user gesture has unlocked audio. Silent fallback on failure.
    function b64ToBuf(b64){ var bin=atob(b64), len=bin.length, u8=new Uint8Array(len);
      for(var i=0;i<len;i++) u8[i]=bin.charCodeAt(i); return u8.buffer; }
    function load(){ var a=ensure(); if(!a||loaded)return; loaded=true;
      for(var k in ASSETS.sounds){ (function(key){ try{
        a.decodeAudioData(b64ToBuf(ASSETS.sounds[key]),
          function(buf){ buffers[key]=buf; }, function(){}); }catch(e){} })(k); } }
    function unlock(){ ensure(); load(); }
    function beep(freq,dur,type){ var a=ensure(); if(!a)return;
      var o=a.createOscillator(),g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq||440;
      g.gain.setValueAtTime(0.001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.3,a.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(dur||0.15));
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.15)); }
    // Play a quick ascending run of notes — used for combo-milestone celebrations.
    function arp(freqs,step,dur,type){ for(var i=0;i<freqs.length;i++){ (function(f,d){
      setTimeout(function(){ beep(f,dur||0.12,type||"triangle"); }, d); })(freqs[i], i*(step||55)); } }
    // Play a decoded mp3 sample. vol 0..1; rate pitches it up/down.
    function sample(name, vol, rate){ var a=ensure(); if(!a||!buffers[name])return;
      var src=a.createBufferSource(); src.buffer=buffers[name];
      if(rate) src.playbackRate.value=rate;
      var g=a.createGain(); g.gain.value=(vol==null?1:vol);
      src.connect(g); g.connect(a.destination); try{ src.start(); }catch(e){} }
    return { unlock:unlock, beep:beep, arp:arp, sample:sample };
  })();

  var Store={ get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
              set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  var Rand={ range:function(a,b){ return a+Math.random()*(b-a); }, pick:function(arr){ return arr[Math.floor(Math.random()*arr.length)]; } };

  // --- Image asset preloader (decode embedded base64 PNGs before start) ----
  var Images={};
  function preloadImages(done){
    var keys=Object.keys(ASSETS.images), left=keys.length;
    if(left===0) return done();
    keys.forEach(function(k){ var img=new Image();
      img.onload=img.onerror=function(){ if(--left===0) done(); };
      img.src=ASSETS.images[k]; Images[k]=img; });
  }

  // Lightweight confetti on its own overlay canvas — runs an independent rAF
  // (the game loop is stopped by the time the end screen shows) and idles out
  // once every scrap has fallen off-screen.
  var Confetti=(function(){
    var cvs=null, cx=null, parts=[], running=false, last=0, W=0, H=0;
    var COLORS=["#00e5ff","#ff2d95","#ffd43b","#39ff14","#c86bff","#ff6b35","#ffffff"];
    function size(){ var dpr=Math.min(window.devicePixelRatio||1,2);
      W=window.innerWidth; H=window.innerHeight;
      cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
      cvs.style.width=W+"px"; cvs.style.height=H+"px"; cx.setTransform(dpr,0,0,dpr,0,0); }
    function frame(now){ var dt=Math.min((now-last)/1000,0.05); last=now;
      cx.clearRect(0,0,W,H);
      for(var i=parts.length-1;i>=0;i--){ var p=parts[i];
        p.vy+=420*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; p.life-=dt;
        if(p.life<=0 || p.y>H+30){ parts.splice(i,1); continue; }
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.globalAlpha=Math.max(0,Math.min(1,p.life)); cx.fillStyle=p.color;
        cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); }
      if(parts.length>0){ requestAnimationFrame(frame); } else { running=false; cx.clearRect(0,0,W,H); } }
    function burst(n){ cvs=cvs||$("confetti"); if(!cvs) return; cx=cx||cvs.getContext("2d"); size();
      for(var i=0;i<n;i++){ parts.push({
        x:W*(0.15+Math.random()*0.7), y:H*(0.28+Math.random()*0.12),
        vx:(Math.random()-0.5)*520, vy:-Math.random()*520-120,
        rot:Math.random()*6.28, vr:(Math.random()-0.5)*12,
        w:6+Math.random()*8, h:9+Math.random()*11,
        color:COLORS[(Math.random()*COLORS.length)|0], life:1.8+Math.random()*1.4 }); }
      if(!running){ running=true; last=performance.now(); requestAnimationFrame(frame); } }
    function clear(){ parts=[]; if(cx){ cx.clearRect(0,0,W,H); } }
    return { burst:burst, clear:clear };
  })();

  /* ---------- 4. AD NETWORK GLUE ---------- */
  var Ad=(function(){
    function platform(){ var ua=navigator.userAgent||""; if(/iPad|iPhone|iPod/.test(ua))return "ios"; if(/android/i.test(ua))return "android"; return "fallback"; }
    function targetUrl(){ return CONFIG.storeUrl[platform()]||CONFIG.storeUrl.fallback; }
    function whenReady(cb){ if(!window.mraid)return cb();
      if(mraid.getState&&mraid.getState()==="loading"){ mraid.addEventListener("ready",cb); } else cb(); }
    function openStore(){ track("cta_click"); var url=targetUrl();
      try{ if(window.mraid&&typeof mraid.open==="function"){ mraid.open(url); return; } }catch(e){}
      try{ if(typeof window.install==="function"){ window.install(); return; } }catch(e){}
      try{ if(window.ExitApi&&typeof ExitApi.exit==="function"){ ExitApi.exit(); return; } }catch(e){}
      try{ if(typeof window.mintegral_playable_exit==="function"){ window.mintegral_playable_exit(); return; } }catch(e){}
      window.open(url,"_blank"); }
    function track(ev,data){ try{ console.log("[playable]",ev,data||""); }catch(e){} }
    return { whenReady:whenReady, openStore:openStore, track:track };
  })();

  /* ---------- 5. STATE MACHINE ---------- */
  var UI={ show:function(name){ ["loading","intro","end"].forEach(function(s){ $("screen-"+s).classList.toggle("hidden",s!==name); });
      $("hud").classList.toggle("hidden",name!=="playing"); $("cta-bar").classList.toggle("hidden",name!=="playing"); },
    setTime:function(v){ $("time").textContent=v; } };
  var State="loading";
  function setState(s){ State=s; Ad.track("state",s); UI.show(s); }

  // Count a number up from 0 to target with easing, writing into an element.
  function countUp(el, target, dur, cb){
    var start=performance.now();
    function step(now){ var p=Math.min(1,(now-start)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(e*target);
      if(p<1) requestAnimationFrame(step); else { el.textContent=target; if(cb) cb(); } }
    requestAnimationFrame(step);
  }

  // Cinematic game-over reveal: GAME OVER -> final score count-up (highlighted)
  // -> stat rows one after another (each counter animating) -> then, 2 seconds
  // after the last row, the install CTA appears.
  var endTimers=[];
  function runEndSequence(score, stats, bestCombo, stars, perfect){
    endTimers.forEach(clearTimeout); endTimers=[];
    Confetti.clear();
    var rows=[["perfect",stats.perfect],["good",stats.good],["ok",stats.ok],
              ["close",stats.close],["miss",stats.miss],["combo",bestCombo]];
    // A flawless run is celebrated: "PERFECT" in bright blue instead of the red "GAME OVER".
    var titleEl=$("eo-title");
    titleEl.textContent = perfect ? "PERFECT" : "GAME OVER";
    titleEl.classList.toggle("perfect", !!perfect);
    // Reset every animated element to its hidden/zero state.
    ["eo-title","eo-scorelbl","eo-score"].forEach(function(id){ $(id).classList.remove("show","pop"); });
    $("eo-score").textContent="0"; $("btn-install").classList.remove("show");
    $("eo-stars").classList.remove("show");
    for(var s0=1;s0<=3;s0++){ $("star-"+s0).classList.remove("on","dim"); }
    rows.forEach(function(r){ $("eo-r-"+r[0]).classList.remove("show"); $("eo-v-"+r[0]).textContent="0"; });
    function T(fn,ms){ endTimers.push(setTimeout(fn,ms)); }

    // 1) Title — silent now (the game-over SFX was removed).
    T(function(){ $("eo-title").classList.add("show"); }, 120);

    // 2) Final score counts up, greeted by a confetti pop.
    T(function(){ $("eo-scorelbl").classList.add("show"); $("eo-score").classList.add("show");
        Confetti.burst(70);
        countUp($("eo-score"), score, 1100, function(){
          $("eo-score").classList.add("pop"); Sound.beep(900,0.14,"triangle"); Confetti.burst(90); }); }, 560);

    // 3) Stars slam in one after another — each with a rising chime + a puff.
    var starBase=1950, starGap=440, starFreqs=[660,880,1180];
    T(function(){ $("eo-stars").classList.add("show");
        for(var s=1;s<=3;s++) $("star-"+s).classList.add("dim"); }, starBase-160);
    for(var si=0; si<stars; si++){ (function(idx){
      T(function(){ var el=$("star-"+(idx+1)); el.classList.remove("dim"); el.classList.add("on");
          Sound.beep(starFreqs[idx]||1180,0.16,"triangle"); Confetti.burst(30); }, starBase+idx*starGap);
    })(si); }

    // 4) Stat rows cascade in, then the install CTA arrives.
    var rowStart=starBase + stars*starGap + 350, gap=250;
    rows.forEach(function(r,i){ T(function(){ $("eo-r-"+r[0]).classList.add("show");
        countUp($("eo-v-"+r[0]), r[1], 450); Sound.beep(480+i*70,0.05,"triangle"); }, rowStart+i*gap); });
    T(function(){ $("btn-install").classList.add("show"); }, rowStart + rows.length*gap + 1500);
  }

  /* ---------- 6. GAME ---------- */
  var Game=(function(){
    var TAU=Math.PI*2;
    // Cluster bubbles: each is drawn from an embedded PNG sprite; the paired
    // colour drives the halo, pop particles and shockwave tint for that bubble.
    var BUBBLES=[
      { key:"lightBlue", color:"#43d9ff" },
      { key:"red",       color:"#ff5b6b" },
      { key:"purple",    color:"#c86bff" },
      { key:"green",     color:"#5cff9d" },
      { key:"yellow",    color:"#ffe066" },
      { key:"orange",    color:"#ff8a3d" },
      { key:"blue",      color:"#4d7bff" }
    ];
    // The shooter bubble glows a hotter colour the higher the combo climbs.
    var BALL_COLORS=["#00e5ff","#39ff14","#ffe066","#ff9f1c","#ff2d95","#c86bff","#ff1744"];
    function ballColor(){ return BALL_COLORS[Math.min(combo, BALL_COLORS.length-1)]; }
    // Timing grades, tightest window first. Higher tiers = more points + more
    // juice. Windows are deliberately wide so pops are easy and misses are rare.
    var TIERS=[
      { name:"PERFECT", win:34,  mult:3,   color:"#ffd43b", parts:14, flash:0.60, shake:13, freq:980 },
      { name:"GOOD",    win:70,  mult:2,   color:"#69db7c", parts:10, flash:0.38, shake:9,  freq:770 },
      { name:"OK",      win:108, mult:1.5, color:"#4dabf7", parts:8,  flash:0.24, shake:6,  freq:610 },
      { name:"CLOSE",   win:150, mult:1,   color:"#ffa94d", parts:6,  flash:0.14, shake:4,  freq:490 }
    ];
    var MAXWIN=TIERS[TIERS.length-1].win;
    var POPS=["pop1","pop2","pop3"];   // the three bubble-pop samples, rotated

    var C, ball, bounds, rings, particles, trail, spawnTimer, colorIdx, bgGrad, doom, ambient;
    var shockwaves, rays, ballPop, edgeGlow, banner, hitFx, wallCd;
    var score, scoreShown, combo, bestCombo, timeLeft, tAnim, shake, flash, popup, bumpT, stats;
    var maxScore, idealCombo;   // running "perfect play" reference used for the star rating

    function reset(){
      bounds={ L:CONFIG.boundX, R:view.w-CONFIG.boundX, T:CONFIG.boundTop, B:view.h-CONFIG.boundBot };
      C={ x:view.w/2, y:(bounds.T+bounds.B)/2 };
      // Start near centre with a sideways kick, then let gravity take over.
      ball={ x:C.x, y:C.y-120, vx:(Math.random()<0.5?-1:1)*Rand.range(230,320), vy:0 };
      rings=[]; particles=[]; trail=[]; colorIdx=0; bgGrad=null; doom=null;
      shockwaves=[]; rays=[]; ballPop=0; edgeGlow=0; banner=null; hitFx=0; wallCd=0;
      score=0; scoreShown=0; combo=0; bestCombo=0; timeLeft=CONFIG.gameSeconds;
      maxScore=0; idealCombo=0;
      stats={ perfect:0, good:0, ok:0, close:0, miss:0 };
      tAnim=0; shake=0; flash=0; popup=null;
      // Ambient background bubbles rising slowly (pure decoration).
      ambient=[]; for(var ai=0; ai<16; ai++) ambient.push({
        x:Rand.range(0,view.w), y:Rand.range(0,view.h), r:Rand.range(6,26),
        spd:Rand.range(18,55), a:Rand.range(0.05,0.16) });
      // Seed a few well-spaced clusters already on their way in.
      spawnRing(CONFIG.spawnR); spawnRing(CONFIG.spawnR-150); spawnRing(CONFIG.spawnR-300);
      spawnTimer=CONFIG.spawnEvery;
      $("score").textContent="0"; $("score").style.color=""; UI.setTime(timeLeft);
    }

    function spawnRing(radius){ var b=BUBBLES[colorIdx++ % BUBBLES.length];
      rings.push({ r:radius, color:b.color, sprite:b.key,
      pulse:0, rot:Rand.range(0,TAU), spin:(Math.random()<0.5?-1:1)*Rand.range(0.15,0.4) }); }

    // When the timer runs out, a spiked "game-over" bubble closes in from outside.
    // It can't be popped away — when it reaches the shooter bubble, the run is over.
    function spawnDoom(){ doom={ r:CONFIG.spawnR+90 }; Sound.beep(120,0.35,"sawtooth"); }

    // Spawn respecting the 8-cluster cap and the minimum radial spacing so
    // clusters never appear stuck together at the outer edge.
    function trySpawn(){
      if(rings.length>=CONFIG.maxRings) return;
      var maxR=0; for(var i=0;i<rings.length;i++) if(rings[i].r>maxR) maxR=rings[i].r;
      if(rings.length>0 && maxR > CONFIG.spawnR-CONFIG.minGap) return;
      spawnRing(CONFIG.spawnR);
    }

    function ballDist(){ return Math.sqrt((ball.x-C.x)*(ball.x-C.x)+(ball.y-C.y)*(ball.y-C.y)); }

    // A throttled bubble "boink" off the invisible walls; volume tracks impact
    // speed and small/settling bounces are skipped so it never machine-guns.
    function wallHit(speed){ if(wallCd>0 || speed<150) return; wallCd=0.08;
      Sound.sample("wall", 0.22+Math.min(0.5, speed/900*0.5)); }

    // When a cluster pops, kick the shooter bubble back the opposite way
    // (inward, away from the cluster surface) and give it a speed boost so it
    // keeps roaming.
    function repelBall(){
      var dx=ball.x-C.x, dy=ball.y-C.y, bd=Math.sqrt(dx*dx+dy*dy);
      var nx, ny; if(bd<1){ nx=0; ny=-1; } else { nx=dx/bd; ny=dy/bd; }
      var vr=ball.vx*nx+ball.vy*ny;                              // outward radial component
      if(vr>0){ ball.vx-=1.4*vr*nx; ball.vy-=1.4*vr*ny; }        // reflect it off the cluster
      ball.vx-=nx*CONFIG.ringImpulse; ball.vy-=ny*CONFIG.ringImpulse;  // inward impulse
      var sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)||1;
      var boosted=Math.min(CONFIG.maxSpeed, Math.max(CONFIG.minSpeed, sp*1.18));
      ball.vx=ball.vx/sp*boosted; ball.vy=ball.vy/sp*boosted;
    }

    // A burst of little bubbles that float up and fade — the "pop".
    function burst(x,y,color,n){
      for(var i=0;i<n;i++){ var a=Rand.range(0,Math.PI*2), s=Rand.range(120,460);
        particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:Rand.range(0.3,0.65), color:color, size:Rand.range(3,7) }); }
    }

    // A ring of energy that expands from the centre. As it sweeps past each
    // cluster it lights that cluster up — so a single pop ripples outward
    // through the whole stack. This is the "chain reaction" that grows with the
    // combo.
    function spawnShock(startR, color, power){
      shockwaves.push({ r:Math.max(0,startR), color:color, power:power||1,
        speed:640+ (power||1)*260, life:0, maxLife:0.55+ (power||1)*0.15, hit:{} });
    }
    // Radial light rays fired from a point — pure celebration at milestones.
    function spawnRays(x,y,color,n){
      for(var i=0;i<n;i++){ var a=(i/n)*Math.PI*2 + Rand.range(-0.1,0.1);
        rays.push({ x:x, y:y, a:a, len:Rand.range(120,260), life:0, maxLife:0.45, color:color }); }
    }

    // Animated score counter: eases toward the real score and pulses on gain.
    function addScore(amount, color){
      score+=amount;
      var el=$("score"); el.style.color=color;
      el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
      clearTimeout(bumpT); bumpT=setTimeout(function(){ el.style.color=""; }, 300);
    }
    function tickScore(dt){
      if(scoreShown!==score){
        scoreShown += (score-scoreShown)*Math.min(1,dt*14);
        if(Math.abs(score-scoreShown)<0.5) scoreShown=score;
        $("score").textContent=Math.round(scoreShown);
      }
    }

    // Every cluster that leaves play (popped OR auto-destroyed) is one scoring
    // "chance". We tally what a flawless, unbroken chain would have scored for
    // the exact same set of chances — that becomes the 100% reference the final
    // star rating is measured against, so it self-scales to how the round went.
    function chance(){
      idealCombo++;
      maxScore += Math.round(10*idealCombo*2);                 // ref multiplier = a solid GOOD
      if(idealCombo % CONFIG.chainEvery === 0) maxScore += idealCombo*20;   // ideal chain bonus
    }

    function popRing(idx, tier, gained){
      var ring=rings[idx];
      // Juice scales with the combo: the deeper the chain, the bigger the bang.
      var cf=Math.min(2.4, 1+combo*0.14);
      burst(ball.x, ball.y, ring.color, Math.round(tier.parts*cf));
      if(tier.name==="PERFECT") burst(ball.x, ball.y, "#ffffff", Math.round(5*cf));
      rings.splice(idx,1); trySpawn(); repelBall();
      addScore(gained, tier.color);
      // Every pop fires a shockwave from the centre that ripples through the
      // remaining clusters — power grows with the combo.
      spawnShock(ballDist(), tier.color, Math.min(2.2, 0.6+combo*0.12));
      ballPop=1; hitFx=Math.min(1, 0.5+combo*0.06);
      popup={ t:0, dur:0.7, text:tier.name+"  x"+combo, gained:gained, color:tier.color, big:tier.name==="PERFECT", x:ball.x, y:ball.y };
      flash=Math.max(flash, tier.flash*cf); shake=Math.max(shake, tier.shake*Math.min(1.9,cf));
      // Real bubble-pop sample; rotate the three hits for variety and pitch it
      // up with the chain for a rising, satisfying "ladder" of pops.
      Sound.sample(POPS[combo % POPS.length], 0.9, 1+Math.min(0.5, combo*0.02));
    }

    // Fired every `chainEvery` pops: a full chain-reaction celebration —
    // stacked shockwaves, radial rays, a screen-edge pulse, a bonus and a
    // rising arpeggio. The bigger the milestone, the louder everything gets.
    function triggerChain(){
      var lvl=Math.floor(combo/CONFIG.chainEvery);           // 1,2,3,…
      var col=ballColor(), bd=ballDist();
      spawnShock(bd, "#ffffff", 2.2);
      spawnShock(bd, col, 1.7);
      spawnShock(Math.max(0,bd-60), col, 1.3);
      spawnRays(ball.x, ball.y, col, 12);
      burst(ball.x, ball.y, "#ffffff", 22);
      burst(ball.x, ball.y, col, 26);
      var bonus=combo*20;
      addScore(bonus, col);
      flash=Math.max(flash, 0.7); shake=Math.max(shake, 16); edgeGlow=1;
      banner={ t:0, dur:1.0, text:"CHAIN x"+combo, sub:"+"+bonus, color:col };
      Sound.arp([523,659,784,1046,1318], 55, 0.14, "triangle");
    }

    // Tap: grade the cluster nearest to contact and pop it, else break the chain.
    function onDown(){
      if(rings.length===0) return;
      var bd=ballDist(), best=-1, bestGap=1e9;
      for(var i=0;i<rings.length;i++){ var gap=Math.abs(rings[i].r-bd); if(gap<bestGap){ bestGap=gap; best=i; } }
      if(best<0) return;
      if(bestGap<=MAXWIN){
        var tier=TIERS[0];
        for(var t=0;t<TIERS.length;t++){ if(bestGap<=TIERS[t].win){ tier=TIERS[t]; break; } }
        combo++; if(combo>bestCombo) bestCombo=combo;
        stats[tier.name.toLowerCase()]++;
        chance();
        var gained=Math.round(10*combo*tier.mult);
        popRing(best, tier, gained);
        if(combo % CONFIG.chainEvery === 0) triggerChain();   // chain-reaction payoff
      } else {
        // Mistimed tap: break the chain (no score penalty, no sound — forgiving).
        combo=0; stats.miss++;
        popup={ t:0, dur:0.45, text:"MISS", gained:0, color:"#ff3b6b", big:false, x:ball.x, y:ball.y };
        shake=Math.max(shake,5);
      }
    }

    function update(dt){
      tAnim+=dt;
      timeLeft-=dt; UI.setTime(Math.max(0,Math.ceil(timeLeft)));
      if(timeLeft<=0 && !doom) spawnDoom();   // timer out -> release the spiked bubble

      // Difficulty ramp.
      var elapsed=CONFIG.gameSeconds-timeLeft;
      var shrink=CONFIG.shrink+elapsed*4.5;
      var spawnEvery=Math.max(0.42, CONFIG.spawnEvery-elapsed*0.005);

      // Natural physics: gravity pulls the bubble down. There is NO visible
      // container — the bubble roams the whole play area and only bounces off
      // the invisible screen edges. The clusters repel it (handled below).
      ball.vy+=CONFIG.gravity*dt;
      ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
      if(wallCd>0) wallCd-=dt;
      if(ball.x<bounds.L){ ball.x=bounds.L; ball.vx=Math.abs(ball.vx)*CONFIG.wallBounce; wallHit(Math.abs(ball.vx)); }
      else if(ball.x>bounds.R){ ball.x=bounds.R; ball.vx=-Math.abs(ball.vx)*CONFIG.wallBounce; wallHit(Math.abs(ball.vx)); }
      if(ball.y<bounds.T){ ball.y=bounds.T; ball.vy=Math.abs(ball.vy)*CONFIG.wallBounce; wallHit(Math.abs(ball.vy)); }
      else if(ball.y>bounds.B){ ball.y=bounds.B; ball.vy=-Math.abs(ball.vy)*CONFIG.wallBounce; wallHit(Math.abs(ball.vy)); }
      // Cap top speed every frame so fast falls stay controllable.
      var csp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)||1;
      if(csp>CONFIG.maxSpeed){ ball.vx=ball.vx/csp*CONFIG.maxSpeed; ball.vy=ball.vy/csp*CONFIG.maxSpeed; }

      // Record the bubble path for the neon trail.
      trail.push({ x:ball.x, y:ball.y }); if(trail.length>16) trail.shift();

      // Ambient bubbles drift up and wrap around.
      for(var am=0;am<ambient.length;am++){ var o=ambient[am];
        o.y-=o.spd*dt; o.x+=Math.sin((tAnim+am)*0.6)*8*dt;
        if(o.y<-o.r){ o.y=view.h+o.r; o.x=Rand.range(0,view.w); } }

      // Spawn clusters on a cadence (stop once the game-over bubble is out).
      spawnTimer-=dt; if(spawnTimer<=0){ if(!doom) trySpawn(); spawnTimer=spawnEvery; }

      // Shrink clusters; spin them; auto-destroy any that reach the shooter
      // bubble untapped (breaks combo).
      var bd=ballDist();
      for(var i=rings.length-1;i>=0;i--){
        rings[i].r-=shrink*dt;
        rings[i].rot+=rings[i].spin*dt;
        if(rings[i].r<=bd+CONFIG.ballR*0.5){
          burst(ball.x,ball.y,rings[i].color,5);
          rings.splice(i,1); trySpawn(); repelBall();   // cluster touched -> bubble repelled
          combo=0; chance();                            // missed the beat (still a chance faced)
          Sound.beep(220,0.08,"sine");
        }
      }

      // Game-over bubble: closes in and ends the run when it reaches the shooter.
      if(doom){
        doom.r -= CONFIG.doomSpeed*dt;
        if(doom.r <= ballDist()+CONFIG.ballR) return end();
      }

      // Particles float up and fade (bubbles rise).
      for(var j=particles.length-1;j>=0;j--){ var p=particles[j];
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.9; p.vy*=0.9; p.vy-=90*dt; p.life-=dt; if(p.life<=0) particles.splice(j,1); }

      // Shockwaves: expand outward and light up each cluster the front passes
      // through — this is what makes a single pop cascade across the stack.
      for(var s=shockwaves.length-1;s>=0;s--){ var sw=shockwaves[s];
        sw.life+=dt; sw.r+=sw.speed*dt;
        for(var ri=0;ri<rings.length;ri++){
          if(!sw.hit[ri] && Math.abs(rings[ri].r-sw.r)<26){ sw.hit[ri]=1;
            rings[ri].pulse=Math.min(1.4, rings[ri].pulse+sw.power);      // flare it up
            burst(C.x+(rings[ri].r)* (ball.x-C.x)/(ballDist()||1),
                  C.y+(rings[ri].r)* (ball.y-C.y)/(ballDist()||1), rings[ri].color, 3);
          }
        }
        if(sw.life>=sw.maxLife) shockwaves.splice(s,1);
      }
      // Cluster pulses decay.
      for(var rp=0;rp<rings.length;rp++) if(rings[rp].pulse>0) rings[rp].pulse=Math.max(0,rings[rp].pulse-dt*3.2);
      // Rays fade.
      for(var ry=rays.length-1;ry>=0;ry--){ rays[ry].life+=dt; if(rays[ry].life>=rays[ry].maxLife) rays.splice(ry,1); }
      // Bubble pop + edge glow + hit shimmer relax back to rest.
      if(ballPop>0) ballPop=Math.max(0,ballPop-dt*4);
      if(edgeGlow>0) edgeGlow=Math.max(0,edgeGlow-dt*1.4);
      if(hitFx>0) hitFx=Math.max(0,hitFx-dt*2.5);
      if(banner){ banner.t+=dt; if(banner.t>=banner.dur) banner=null; }

      if(popup){ popup.t+=dt; if(popup.t>=popup.dur) popup=null; }
      if(shake>0) shake=Math.max(0,shake-dt*40);
      if(flash>0) flash=Math.max(0,flash-dt*1.6);
      tickScore(dt);
    }

    function render(){
      // Aquatic backdrop. The radial gradient is built once and reused (cheap).
      if(!bgGrad){ bgGrad=ctx.createRadialGradient(view.w/2, C.y, 60, view.w/2, C.y, 730);
        bgGrad.addColorStop(0,"#0e3a63"); bgGrad.addColorStop(0.6,"#072139"); bgGrad.addColorStop(1,"#03101f"); }
      ctx.fillStyle=bgGrad; ctx.fillRect(0,0,view.w,view.h);

      // Ambient rising bubbles (steady — not affected by screen shake).
      for(var a0=0;a0<ambient.length;a0++){ var o=ambient[a0];
        ctx.globalAlpha=o.a; ctx.fillStyle="#bfefff";
        ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,TAU); ctx.fill();
        ctx.globalAlpha=o.a*0.9; ctx.fillStyle="#ffffff";
        ctx.beginPath(); ctx.arc(o.x-o.r*0.3,o.y-o.r*0.32,o.r*0.3,0,TAU); ctx.fill();
      }
      ctx.globalAlpha=1;

      ctx.save();
      if(shake>0) ctx.translate(Rand.range(-shake,shake), Rand.range(-shake,shake));

      var bd=ballDist(), bc=ballColor();

      // Clusters — each drawn as a ring ("necklace") of small bubbles. The
      // cluster inside the timing window reads as "hot" via a translucent halo
      // and slightly larger bubbles.
      for(var i=0;i<rings.length;i++){
        var ring=rings[i], rr=Math.max(1,ring.r), gap=Math.abs(ring.r-bd), hot=gap<=MAXWIN, pl=ring.pulse||0;
        // Timing-window halo.
        if(hot){ ctx.globalAlpha=0.16; ctx.strokeStyle=ring.color; ctx.lineWidth=26;
          ctx.beginPath(); ctx.arc(C.x,C.y,rr,0,TAU); ctx.stroke(); ctx.globalAlpha=1; }
        var count=Math.max(8, Math.min(28, Math.round(TAU*rr/54)));
        var bgap=TAU*rr/count, br=Math.min(19, bgap*0.42) * (hot?1.28:1) * (1+pl*0.5);
        var img=Images[ring.sprite], ready=img && img.width;
        for(var b=0;b<count;b++){
          var ang=ring.rot + b/count*TAU;
          var bx=C.x+Math.cos(ang)*rr, by=C.y+Math.sin(ang)*rr;
          if(ready){
            var d=br*2.2; ctx.globalAlpha=1; ctx.drawImage(img, bx-d/2, by-d/2, d, d);
            // Chain-reaction flare: brighten the sprite with a white overlay.
            if(pl>0){ ctx.globalAlpha=Math.min(0.7,pl*0.55); ctx.fillStyle="#ffffff";
              ctx.beginPath(); ctx.arc(bx,by,br,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
          } else {
            // Fallback (sprite not decoded yet): a plain glossy dot.
            var col= pl>0 ? "#ffffff" : ring.color;
            ctx.globalAlpha=1; ctx.fillStyle=col;
            ctx.beginPath(); ctx.arc(bx,by,br,0,TAU); ctx.fill();
            ctx.globalAlpha=0.8; ctx.fillStyle="#ffffff";
            ctx.beginPath(); ctx.arc(bx-br*0.3,by-br*0.32,br*0.28,0,TAU); ctx.fill();
          }
        }
        ctx.globalAlpha=1;
      }

      // Shockwave fronts — expanding rings that fade as they travel.
      for(var sw=0;sw<shockwaves.length;sw++){ var w=shockwaves[sw], wp=1-w.life/w.maxLife;
        if(wp<=0) continue;
        ctx.globalAlpha=wp*0.85; ctx.strokeStyle=w.color; ctx.lineWidth=2+w.power*4;
        ctx.beginPath(); ctx.arc(C.x,C.y,Math.max(1,w.r),0,TAU); ctx.stroke();
      }
      ctx.globalAlpha=1;

      // Game-over bubble — a red spiked circle closing in (spikes point inward).
      if(doom){
        var DR=Math.max(1,doom.r), spikes=40, spikeLen=28;
        ctx.strokeStyle="#ff2d55"; ctx.lineWidth=9;
        ctx.beginPath(); ctx.arc(C.x,C.y,DR,0,TAU); ctx.stroke();
        ctx.fillStyle="#ff2d55"; ctx.beginPath();
        for(var d=0;d<spikes;d++){
          var da=(d/spikes)*Math.PI*2 + tAnim*0.5, a1=da+0.045, a2=da-0.045;
          ctx.moveTo(C.x+Math.cos(a1)*DR, C.y+Math.sin(a1)*DR);
          ctx.lineTo(C.x+Math.cos(da)*(DR-spikeLen), C.y+Math.sin(da)*(DR-spikeLen));
          ctx.lineTo(C.x+Math.cos(a2)*DR, C.y+Math.sin(a2)*DR);
          ctx.closePath();
        }
        ctx.fill();
      }

      // Bubble trail — one simple stroked streak of the recent path.
      if(trail.length>1){
        ctx.globalAlpha=Math.min(0.7,0.4+combo*0.03); ctx.strokeStyle=bc; ctx.lineWidth=CONFIG.ballR*(0.8+Math.min(0.6,combo*0.05));
        ctx.lineJoin="round"; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(trail[0].x,trail[0].y);
        for(var t=1;t<trail.length;t++) ctx.lineTo(trail[t].x,trail[t].y);
        ctx.stroke(); ctx.globalAlpha=1;
      }

      // Pop particles — little bubbles with a highlight.
      for(var k=0;k<particles.length;k++){ var p=particles[k]; var pa=Math.min(0.9,Math.max(0,p.life*1.8));
        ctx.globalAlpha=pa; ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.fill();
        ctx.globalAlpha=pa*0.7; ctx.fillStyle="#ffffff";
        ctx.beginPath(); ctx.arc(p.x-p.size*0.3,p.y-p.size*0.3,p.size*0.35,0,TAU); ctx.fill(); }
      ctx.globalAlpha=1;

      // Milestone rays shooting out of the bubble.
      for(var r2=0;r2<rays.length;r2++){ var ry=rays[r2], rp=1-ry.life/ry.maxLife; if(rp<=0) continue;
        var l=ry.len*(0.4+0.6*(1-rp)); ctx.globalAlpha=rp*0.8; ctx.strokeStyle=ry.color; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(ry.x+Math.cos(ry.a)*18, ry.y+Math.sin(ry.a)*18);
        ctx.lineTo(ry.x+Math.cos(ry.a)*(18+l), ry.y+Math.sin(ry.a)*(18+l)); ctx.stroke(); }
      ctx.globalAlpha=1;

      // Shooter bubble — glossy: soft halo + translucent body + rim + highlight.
      // Pops bigger on each hit and shimmers brighter deep into a combo.
      var br2=CONFIG.ballR*(1+ballPop*0.5);
      ctx.globalAlpha=0.28+hitFx*0.4; ctx.fillStyle=bc;
      ctx.beginPath(); ctx.arc(ball.x,ball.y,br2*(1.7+ballPop*0.6),0,TAU); ctx.fill();
      ctx.globalAlpha=0.92; ctx.fillStyle=bc;
      ctx.beginPath(); ctx.arc(ball.x,ball.y,br2,0,TAU); ctx.fill();
      ctx.globalAlpha=1; ctx.lineWidth=br2*0.16; ctx.strokeStyle="rgba(255,255,255,.7)";
      ctx.beginPath(); ctx.arc(ball.x,ball.y,br2*0.9,0,TAU); ctx.stroke();
      ctx.globalAlpha=0.95; ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.arc(ball.x-br2*0.34,ball.y-br2*0.36,br2*0.28,0,TAU); ctx.fill();
      ctx.globalAlpha=0.55;
      ctx.beginPath(); ctx.arc(ball.x+br2*0.28,ball.y+br2*0.30,br2*0.12,0,TAU); ctx.fill();
      ctx.globalAlpha=1;

      ctx.restore();

      // Combo popup rendered AT the contact point, drifting upward and fading.
      if(popup){
        var e=popup.t/popup.dur, scale=1+(popup.big?0.7:0.45)*Math.max(0,1-e*3), alpha=1-e;
        var px=Math.max(96, Math.min(view.w-96, popup.x)), py=popup.y-42-e*54;
        ctx.globalAlpha=alpha; ctx.textAlign="center"; ctx.fillStyle=popup.color;
        ctx.font="800 "+Math.round((popup.big?52:42)*scale)+"px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.fillText(popup.text, px, py);
        if(popup.gained>0){ ctx.fillStyle="#fff";
          ctx.font="800 "+Math.round(24*scale)+"px -apple-system,Segoe UI,Roboto,sans-serif";
          ctx.fillText("+"+popup.gained, px, py+30); }
        ctx.globalAlpha=1; ctx.textAlign="left";
      }

      // Current combo readout below the play area (solid, in the bubble colour).
      if(combo>=2){ ctx.textAlign="center"; ctx.fillStyle=bc;
        ctx.font="800 34px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.fillText("COMBO x"+combo, C.x, bounds.B+52); ctx.textAlign="left"; }

      // Success flash overlay (stronger for higher grades).
      if(flash>0){ ctx.fillStyle="rgba(255,255,255,"+Math.min(0.85,flash)+")"; ctx.fillRect(0,0,view.w,view.h); }

      // Screen-edge glow that pulses on a chain milestone (drawn as an inset
      // rectangular gradient — cheap, no blur).
      if(edgeGlow>0){ var eg=edgeGlow, band=90;
        var col=ballColor();
        var g1=ctx.createLinearGradient(0,0,0,band); g1.addColorStop(0,tintRGBA(col,0.5*eg)); g1.addColorStop(1,tintRGBA(col,0));
        ctx.fillStyle=g1; ctx.fillRect(0,0,view.w,band);
        var g2=ctx.createLinearGradient(0,view.h,0,view.h-band); g2.addColorStop(0,tintRGBA(col,0.5*eg)); g2.addColorStop(1,tintRGBA(col,0));
        ctx.fillStyle=g2; ctx.fillRect(0,view.h-band,view.w,band);
        var g3=ctx.createLinearGradient(0,0,band,0); g3.addColorStop(0,tintRGBA(col,0.5*eg)); g3.addColorStop(1,tintRGBA(col,0));
        ctx.fillStyle=g3; ctx.fillRect(0,0,band,view.h);
        var g4=ctx.createLinearGradient(view.w,0,view.w-band,0); g4.addColorStop(0,tintRGBA(col,0.5*eg)); g4.addColorStop(1,tintRGBA(col,0));
        ctx.fillStyle=g4; ctx.fillRect(view.w-band,0,band,view.h);
      }

      // Chain-milestone banner: punches in, holds, then fades out.
      if(banner){ var be=banner.t/banner.dur;
        var bs=be<0.2 ? 0.5+2.5*be : (be>0.75 ? 1-(be-0.75)*4*0.15 : 1);
        var balpha=be>0.75 ? 1-(be-0.75)*4 : 1;
        ctx.globalAlpha=Math.max(0,balpha); ctx.textAlign="center";
        ctx.fillStyle=banner.color;
        ctx.font="900 "+Math.round(64*bs)+"px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.fillText(banner.text, view.w/2, view.h*0.42);
        ctx.fillStyle="#ffffff";
        ctx.font="900 "+Math.round(34*bs)+"px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.fillText(banner.sub, view.w/2, view.h*0.42+46);
        ctx.globalAlpha=1; ctx.textAlign="left";
      }
    }

    // Convert a #rrggbb colour into an rgba() string at the given alpha.
    function tintRGBA(hex, a){
      var h=hex.replace("#",""); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      var n=parseInt(h,16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
    }

    function end(){
      Loop.stop();
      Store.set("bestScore", Math.max(score, Store.get("bestScore",0)));
      // Star rating by absolute score:
      //   0 -> 0★ | 1–2999 -> 1★ | 3000–5999 -> 2★ | 6000+ -> 3★.
      var stars = score<=0 ? 0 : score<3000 ? 1 : score<6000 ? 2 : 3;
      var ratio = maxScore>0 ? score/maxScore : 0;
      var perfect = ratio>=1;            // matched or beat the flawless-play reference
      setState("end");
      runEndSequence(score, stats, bestCombo, stars, perfect);
      Ad.track("game_end",{ score:score, bestCombo:bestCombo, stars:stars, perfect:perfect, stats:stats });
    }

    return { reset:reset, onDown:onDown, update:update, render:render };
  })();

  /* ---------- 7. BOOTSTRAP ---------- */
  function startGame(){ Sound.unlock(); Game.reset(); setState("playing"); Ad.track("game_start");
    // Launch "shoot" whoosh — delayed slightly so the sample has decoded.
    setTimeout(function(){ Sound.sample("shoot", 0.5); }, 280);
    Loop.start(Game.update, Game.render); }
  function init(){
    fitCanvas();
    Input.on(function(){ if(State==="playing") Game.onDown(); });
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);
    Ad.whenReady(function(){ preloadImages(function(){ setState("intro"); Ad.track("loaded"); }); });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); } else { init(); }

})();
</script>
</body>
</html>
