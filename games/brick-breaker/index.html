<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brick Breaker</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0e1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the square-ish play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .85; }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #fb923c, #ea580c);
    box-shadow: 0 8px 24px rgba(234,88,12,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  /* ---- Persistent CTA banner (visible during gameplay, common in playables) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, lives) ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(15px, 4.5vw, 22px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP  (structure of the creative)
     - #stage/#game : the canvas the game renders into.
     - #hud         : in-game score / lives.
     - .screen      : one overlay per game state (intro, end).
     - #cta-bar     : always-available install button.
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Score: <span id="score">0</span></div>
  <div id="hud-right">Lives: <span id="lives">3</span></div>
</div>

<!-- Loading screen: shown until assets + ad container are ready -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<!-- Intro screen: title + start button -->
<div id="screen-intro" class="screen hidden">
  <div class="title">BRICK BREAKER</div>
  <div class="subtitle">Drag to slide the paddle. Smash every brick!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<!-- End screen: result + primary CTA to the store -->
<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice!</div>
  <div class="subtitle" id="end-subtitle">You scored <span id="end-score">0</span> · Best <span id="end-best">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<!-- Persistent CTA (hidden until gameplay begins) -->
<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined)
     Organized top-to-bottom in clearly labeled sections so a new game can
     be produced by editing mostly the CONFIG + GAME sections and leaving
     the ENGINE / AD glue untouched.
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     The knobs a new game changes first. Copy of business/creative params.
     =================================================================== */
  var CONFIG = {
    title: "BRICK BREAKER",
    gameSeconds: 0,                // endless — round ends on lives/clear, not a clock
    // Store links used by the CTA. The correct one is chosen at runtime.
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    // Design resolution — the game logic is authored against this virtual
    // size, then the canvas is scaled to fit any screen (see fitCanvas()).
    designWidth: 720,
    designHeight: 1280,
    bg: "#0b0e1a",

    // --- Brick Breaker tunables ---
    startLives: 3,
    paddleW: 176,
    paddleH: 26,
    paddleY: 1140,          // paddle center y
    ballRadius: 13,
    ballBaseSpeed: 400,     // starting speed (px/sec)
    ballMaxSpeed: 640,
    ballSpeedRampPerHit: 1.012, // gentle ramp so it stays forgiving
    maxBounceAngleDeg: 62,  // how far a paddle-edge hit can deflect the ball
    cols: 6,
    rows: 5,
    brickTop: 168,
    brickSideMargin: 34,
    brickGap: 10,
    brickHeight: 46,
    rowColors: ["#f43f5e", "#fb923c", "#facc15", "#4ade80", "#38bdf8"],
    rowPoints:  [50, 40, 30, 20, 10],
    clearBonus: 500
  };

  /* ===================================================================
     2. ASSETS  (embedded, no network requests)
     Register every asset as a data URI so the file stays self-contained.
     This game draws everything with canvas and synthesizes audio, so both
     registries stay empty — that keeps the file well under the 5 MB budget.
     =================================================================== */
  var ASSETS = {
    images: {
      // logo: "data:image/png;base64,iVBORw0KGgo..."
    },
    sounds: {
      // pop: "data:audio/mp3;base64,SUQzBAAAAAA..."
    }
  };

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  // We render at CONFIG.designWidth x designHeight and letterbox-fit the
  // canvas to the viewport using CSS, accounting for devicePixelRatio so
  // drawing stays crisp on retina screens.
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    // Backing store size (crisp), CSS size (fit).
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  // Handles mouse + touch. Coordinates are converted from screen pixels to
  // the virtual design space so game logic never worries about scaling.
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  // Generates simple tones so you get sound without embedding audio files.
  // For richer sound, put base64 clips in ASSETS.sounds and play via Audio.clip.
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      // iOS requires resume() inside a user gesture.
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     Playable ads run inside a network's iframe. We must:
       - wait for the ad container ("mraid") to be ready before starting,
       - route the install button through the network's open() when present,
       - report standard lifecycle events for analytics/QA.
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    // Resolve when the creative may start drawing/interacting.
    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    // The single entry point for "user wants the app". Order matters:
    // MRAID first, then common network globals, then a plain window.open.
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}       // ironSource / generic
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {} // Google Ads
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    // Lightweight event hook. Swap console.log for a network SDK call if needed.
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     States: loading -> intro -> playing -> end. UI.show() toggles overlays.
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      // HUD + CTA bar are only visible during play.
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setLives: function (v) { $("lives").textContent = v; },
    setEnd:   function (title, score, best) {
      $("end-title").textContent = title;
      $("end-score").textContent = score;
      $("end-best").textContent = best;
    }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME  (the part a new prompt mostly rewrites)
     Everything above is reusable plumbing. This game implements:
       Game.reset()            -> initialize round state
       Game.onDown(p)          -> pointer press (moves paddle, launches ball)
       Game.onMove(p)          -> pointer drag (tracks paddle while held)
       Game.update(dt)         -> advance simulation (seconds)
       Game.render()           -> draw a frame (design coords)
       end()                   -> compute result, show end screen
     Brick Breaker: drag the paddle to keep the ball alive and smash every
     brick. Ball-paddle bounce angle depends on where it hits the paddle so
     the player can aim shots at remaining bricks.
     =================================================================== */
  var Game = (function () {
    var score, lives, bricks, bricksLeft, paddleX, ball, particles, flashes, cleared;

    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

    function buildBricks() {
      bricks = [];
      bricksLeft = 0;
      var cols = CONFIG.cols, rows = CONFIG.rows;
      var usable = view.w - CONFIG.brickSideMargin * 2 - CONFIG.brickGap * (cols - 1);
      var bw = usable / cols;
      var bh = CONFIG.brickHeight;
      for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
          var x = CONFIG.brickSideMargin + col * (bw + CONFIG.brickGap);
          var y = CONFIG.brickTop + row * (bh + CONFIG.brickGap);
          bricks.push({
            x: x, y: y, w: bw, h: bh,
            alive: true,
            color: CONFIG.rowColors[row % CONFIG.rowColors.length],
            points: CONFIG.rowPoints[row % CONFIG.rowPoints.length]
          });
          bricksLeft++;
        }
      }
    }

    function serveBall() {
      ball = {
        x: paddleX, y: CONFIG.paddleY - CONFIG.paddleH / 2 - CONFIG.ballRadius - 2,
        vx: 0, vy: 0,
        speed: CONFIG.ballBaseSpeed,
        stuck: true
      };
    }

    function reset() {
      score = 0;
      lives = CONFIG.startLives;
      cleared = false;
      paddleX = view.w / 2;
      particles = [];
      flashes = [];
      buildBricks();
      serveBall();
      UI.setScore(0);
      UI.setLives(lives);
    }

    function launchBall() {
      if (!ball.stuck) return;
      ball.stuck = false;
      var angle = Rand.range(-18, 18) * (Math.PI / 180); // small random aim near vertical
      ball.vx = ball.speed * Math.sin(angle);
      ball.vy = -ball.speed * Math.cos(angle);
      Sound.beep(520, 0.08, "square");
    }

    function movePaddle(p) {
      var half = CONFIG.paddleW / 2;
      paddleX = clamp(p.x, half, view.w - half);
      if (ball.stuck) {
        ball.x = paddleX;
      }
    }

    // A pointer press moves the paddle to that x and — if the ball is still
    // sitting on the paddle — launches it. Subsequent presses during play
    // just reposition (a fresh press count as a "tap" too, which is fine).
    function onDown(p) {
      movePaddle(p);
      launchBall();
    }

    // Drag tracking: keep following the pointer while it is held/moving.
    function onMove(p) {
      movePaddle(p);
    }

    function addParticles(x, y, color) {
      for (var i = 0; i < 7; i++) {
        particles.push({
          x: x, y: y,
          vx: Rand.range(-160, 160), vy: Rand.range(-200, -20),
          life: 0.45, maxLife: 0.45,
          color: color
        });
      }
    }

    function addFlash(x, y, w, h) {
      flashes.push({ x: x, y: y, w: w, h: h, life: 0.14, maxLife: 0.14 });
    }

    function breakBrick(b) {
      b.alive = false;
      bricksLeft--;
      score += b.points;
      UI.setScore(score);
      addParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
      addFlash(b.x, b.y, b.w, b.h);
      Sound.beep(300 + b.points * 6, 0.09, "triangle");
      ball.speed = Math.min(CONFIG.ballMaxSpeed, ball.speed * CONFIG.ballSpeedRampPerHit);
      if (bricksLeft <= 0) {
        cleared = true;
        score += CONFIG.clearBonus;
        UI.setScore(score);
        end();
      }
    }

    // Circle-vs-AABB collision with the simplest-axis-of-penetration bounce.
    function collideBrick(b) {
      var cx = clamp(ball.x, b.x, b.x + b.w);
      var cy = clamp(ball.y, b.y, b.y + b.h);
      var dx = ball.x - cx, dy = ball.y - cy;
      if (dx * dx + dy * dy > CONFIG.ballRadius * CONFIG.ballRadius) return false;
      // Decide bounce axis: whichever overlap is shallower gets reflected.
      var overlapLeft = ball.x - b.x, overlapRight = (b.x + b.w) - ball.x;
      var overlapTop = ball.y - b.y, overlapBottom = (b.y + b.h) - ball.y;
      var minX = Math.min(overlapLeft, overlapRight);
      var minY = Math.min(overlapTop, overlapBottom);
      if (minX < minY) { ball.vx *= -1; } else { ball.vy *= -1; }
      breakBrick(b);
      return true;
    }

    function bounceOffPaddle() {
      var half = CONFIG.paddleW / 2;
      var top = CONFIG.paddleY - CONFIG.paddleH / 2;
      var withinX = ball.x >= paddleX - half - CONFIG.ballRadius && ball.x <= paddleX + half + CONFIG.ballRadius;
      var withinY = ball.y + CONFIG.ballRadius >= top && ball.y <= CONFIG.paddleY + CONFIG.paddleH / 2;
      if (ball.vy > 0 && withinX && withinY) {
        var offset = clamp((ball.x - paddleX) / half, -1, 1); // -1 left edge .. +1 right edge
        var maxAngle = CONFIG.maxBounceAngleDeg * (Math.PI / 180);
        var angle = offset * maxAngle;
        ball.vx = ball.speed * Math.sin(angle);
        ball.vy = -Math.abs(ball.speed * Math.cos(angle));
        ball.y = top - CONFIG.ballRadius; // pop out so it doesn't re-collide next frame
        Sound.beep(420, 0.07, "sine");
      }
    }

    function loseLife() {
      lives--;
      UI.setLives(Math.max(0, lives));
      Sound.beep(160, 0.25, "sawtooth");
      if (lives <= 0) { end(); return; }
      serveBall();
    }

    function updateParticles(dt) {
      for (var i = particles.length - 1; i >= 0; i--) {
        var pt = particles[i];
        pt.life -= dt;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vy += 420 * dt; // light gravity for a nice arc
      }
      for (var j = flashes.length - 1; j >= 0; j--) {
        flashes[j].life -= dt;
        if (flashes[j].life <= 0) flashes.splice(j, 1);
      }
    }

    function update(dt) {
      if (ball.stuck) { updateParticles(dt); return; }

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // Side walls
      if (ball.x - CONFIG.ballRadius < 0) { ball.x = CONFIG.ballRadius; ball.vx *= -1; Sound.beep(500, 0.05, "square"); }
      if (ball.x + CONFIG.ballRadius > view.w) { ball.x = view.w - CONFIG.ballRadius; ball.vx *= -1; Sound.beep(500, 0.05, "square"); }
      // Top wall
      if (ball.y - CONFIG.ballRadius < 0) { ball.y = CONFIG.ballRadius; ball.vy *= -1; Sound.beep(500, 0.05, "square"); }

      bounceOffPaddle();

      // Bricks (stop at first hit per frame — keeps physics simple & stable)
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (b.alive && collideBrick(b)) break;
      }

      // Fell below the paddle -> lose a life
      if (ball.y - CONFIG.ballRadius > view.h) {
        loseLife();
      }

      updateParticles(dt);
    }

    function drawPaddle() {
      var half = CONFIG.paddleW / 2;
      var top = CONFIG.paddleY - CONFIG.paddleH / 2;
      var r = CONFIG.paddleH / 2;
      ctx.fillStyle = "#e2e8f0";
      ctx.beginPath();
      ctx.moveTo(paddleX - half + r, top);
      ctx.arcTo(paddleX + half, top, paddleX + half, top + CONFIG.paddleH, r);
      ctx.arcTo(paddleX + half, top + CONFIG.paddleH, paddleX - half, top + CONFIG.paddleH, r);
      ctx.arcTo(paddleX - half, top + CONFIG.paddleH, paddleX - half, top, r);
      ctx.arcTo(paddleX - half, top, paddleX + half, top, r);
      ctx.closePath();
      ctx.fill();
    }

    function drawBricks() {
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "rgba(255,255,255,.18)";
        ctx.fillRect(b.x, b.y, b.w, b.h * 0.35);
      }
      for (var f = 0; f < flashes.length; f++) {
        var fl = flashes[f];
        ctx.globalAlpha = fl.life / fl.maxLife;
        ctx.fillStyle = "#fff";
        ctx.fillRect(fl.x, fl.y, fl.w, fl.h);
        ctx.globalAlpha = 1;
      }
    }

    function drawParticles() {
      for (var i = 0; i < particles.length; i++) {
        var pt = particles[i];
        ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6);
      }
      ctx.globalAlpha = 1;
    }

    function drawBall() {
      ctx.fillStyle = "#f8fafc";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, CONFIG.ballRadius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(ball.x - 4, ball.y - 4, CONFIG.ballRadius * 0.4, 0, Math.PI * 2); ctx.fill();
    }

    function render() {
      ctx.fillStyle = CONFIG.bg;
      ctx.fillRect(0, 0, view.w, view.h);
      drawBricks();
      drawParticles();
      drawPaddle();
      drawBall();
      if (ball.stuck) {
        ctx.fillStyle = "rgba(255,255,255,.75)";
        ctx.font = "600 24px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Tap to launch", view.w / 2, CONFIG.paddleY - 90);
      }
    }

    function end() {
      Loop.stop();
      var best = Math.max(score, Store.get("bb_bestScore", 0));
      Store.set("bb_bestScore", best);
      var title = cleared ? "PERFECT CLEAR!" : (lives <= 0 ? "GAME OVER" : "Nice run!");
      UI.setEnd(title, score, best);
      setState("end");
      Ad.track("game_end", { score: score, cleared: cleared, lives: lives });
    }

    return { reset: reset, onDown: onDown, onMove: onMove, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;

    // Route all inputs to the current game. Brick Breaker needs the paddle
    // to track the pointer while it moves, not just on the initial press.
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing") Game.onMove(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  // Kick off after DOM is parsed.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
