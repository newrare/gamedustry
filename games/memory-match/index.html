<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Memory Match</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #191033;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the square-ish play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .85; }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ff9f43, #ee5a24);
    box-shadow: 0 8px 24px rgba(238,90,36,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  /* ---- Persistent CTA banner (visible during gameplay, common in playables) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, timer) ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(15px, 4.5vw, 22px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP  (structure of the creative)
     - #stage/#game : the canvas the game renders into.
     - #hud         : in-game score / timer.
     - .screen      : one overlay per game state (intro, end).
     - #cta-bar     : always-available install button.
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Pairs: <span id="score">0</span>/8</div>
  <div id="hud-right">Time: <span id="time">0</span></div>
</div>

<!-- Loading screen: shown until assets + ad container are ready -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<!-- Intro screen: title + start button -->
<div id="screen-intro" class="screen hidden">
  <div class="title">GAME TITLE</div>
  <div class="subtitle">Flip 2 cards to find matching shapes. Clear the board before time runs out!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<!-- End screen: result + primary CTA to the store -->
<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice!</div>
  <div class="subtitle" id="end-subtitle">You matched <span id="end-score">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<!-- Persistent CTA (hidden until gameplay begins) -->
<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined)
     Organized top-to-bottom in clearly labeled sections so a new game can
     be produced by editing mostly the CONFIG + GAME sections and leaving
     the ENGINE / AD glue untouched.
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     The knobs a new game changes first. Copy of business/creative params.
     =================================================================== */
  var CONFIG = {
    title: "MEMORY MATCH",
    gameSeconds: 45,               // round length; 0 = endless
    // Store links used by the CTA. The correct one is chosen at runtime.
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    // Design resolution — the game logic is authored against this virtual
    // size, then the canvas is scaled to fit any screen (see fitCanvas()).
    designWidth: 720,
    designHeight: 1280,
    bg: "#191033",

    // --- game-specific tunables ---
    cols: 4,
    rows: 4,
    gridMarginX: 40,      // side margin around the card grid
    gridTop: 170,         // top of the grid (below HUD)
    gridBottom: 1160,     // bottom of the grid (above CTA bar)
    cardGap: 12,
    flipSeconds: 0.22,    // flip animation duration
    mismatchDelay: 0.7,   // delay before flipping back a mismatched pair
    matchPointBonus: 10,  // score value per pair (not shown, kept for future use)
    timeBonusPerSecond: 5 // bonus added per second left when solved
  };

  /* ===================================================================
     2. ASSETS  (embedded, no network requests)
     Register every asset as a data URI so the file stays self-contained.
     Use tools/embed-asset.mjs to generate these strings.
     Prefer CSS/canvas drawing & WebAudio synth over binary assets to stay
     well under the 5 MB budget; only embed images/sounds you truly need.
     =================================================================== */
  var ASSETS = {
    images: {
      // logo: "data:image/png;base64,iVBORw0KGgo..."
    },
    sounds: {
      // pop: "data:audio/mp3;base64,SUQzBAAAAAA..."
    }
  };

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  // We render at CONFIG.designWidth x designHeight and letterbox-fit the
  // canvas to the viewport using CSS, accounting for devicePixelRatio so
  // drawing stays crisp on retina screens.
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    // Backing store size (crisp), CSS size (fit).
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  // Handles mouse + touch. Coordinates are converted from screen pixels to
  // the virtual design space so game logic never worries about scaling.
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  // Generates simple tones so you get sound without embedding audio files.
  // For richer sound, put base64 clips in ASSETS.sounds and play via Audio.clip.
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      // iOS requires resume() inside a user gesture.
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     Playable ads run inside a network's iframe. We must:
       - wait for the ad container ("mraid") to be ready before starting,
       - route the install button through the network's open() when present,
       - report standard lifecycle events for analytics/QA.
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    // Resolve when the creative may start drawing/interacting.
    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    // The single entry point for "user wants the app". Order matters:
    // MRAID first, then common network globals, then a plain window.open.
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}       // ironSource / generic
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {} // Google Ads
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    // Lightweight event hook. Swap console.log for a network SDK call if needed.
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     States: loading -> intro -> playing -> end. UI.show() toggles overlays.
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      // HUD + CTA bar are only visible during play.
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; },
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME  (the part a new prompt mostly rewrites)
     Memory Match: a 4x4 grid of face-down cards hiding 8 symbol pairs.
     Tap two cards to reveal them; matches stay face-up, mismatches flip
     back after a short delay. Clear the board or beat the clock.
     =================================================================== */
  var Game = (function () {
    // Distinct canvas-drawn symbols, one color each — no images/emoji.
    var SYMBOLS = [
      { shape: "circle",   color: "#ff5e5e" },
      { shape: "star",     color: "#ffd93d" },
      { shape: "heart",    color: "#ff6fb0" },
      { shape: "triangle", color: "#4ade80" },
      { shape: "square",   color: "#38bdf8" },
      { shape: "diamond",  color: "#c084fc" },
      { shape: "plus",     color: "#fb923c" },
      { shape: "ring",     color: "#2dd4bf" }
    ];

    var cards;          // flat array of card objects
    var cardW, cardH;   // computed card size
    var gridX0, gridY0; // top-left of grid in design units
    var flippedIdx;     // indices currently face-up & unresolved (0,1, or 2 while resolving)
    var resolveTimer;   // countdown before flipping back a mismatch
    var pairsFound, moves, timeLeft, locked, solved;
    var bursts;         // little particle bursts on match

    function layoutGrid() {
      var cols = CONFIG.cols, rows = CONFIG.rows;
      var usableW = view.w - CONFIG.gridMarginX * 2;
      var usableH = CONFIG.gridBottom - CONFIG.gridTop;
      var gap = CONFIG.cardGap;
      cardW = (usableW - gap * (cols - 1)) / cols;
      cardH = (usableH - gap * (rows - 1)) / rows;
      // Keep cards from getting too tall/rectangular; clamp to a nice ratio.
      var maxH = cardW * 1.25;
      if (cardH > maxH) cardH = maxH;
      var gridW = cardW * cols + gap * (cols - 1);
      var gridH = cardH * rows + gap * (rows - 1);
      gridX0 = (view.w - gridW) / 2;
      gridY0 = CONFIG.gridTop + (usableH - gridH) / 2;
    }

    function buildDeck() {
      var pairSymbols = SYMBOLS.slice(0, (CONFIG.cols * CONFIG.rows) / 2);
      var deck = [];
      pairSymbols.forEach(function (sym, i) {
        deck.push(sym); deck.push(sym);
      });
      // Fisher-Yates shuffle
      for (var i = deck.length - 1; i > 0; i--) {
        var j = Rand.int(0, i);
        var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
      }
      return deck;
    }

    function reset() {
      layoutGrid();
      var deck = buildDeck();
      var cols = CONFIG.cols, gap = CONFIG.cardGap;
      cards = deck.map(function (sym, i) {
        var cx = i % cols, ry = Math.floor(i / cols);
        return {
          sym: sym,
          x: gridX0 + cx * (cardW + gap),
          y: gridY0 + ry * (cardH + gap),
          faceUp: false,
          matched: false,
          flipT: 0,        // 0 = face-down, 1 = face-up (animated)
          flipDir: 0        // +1 flipping up, -1 flipping down, 0 idle
        };
      });
      flippedIdx = [];
      resolveTimer = 0;
      pairsFound = 0; moves = 0; timeLeft = CONFIG.gameSeconds;
      locked = false; solved = false;
      bursts = [];
      UI.setScore(0); UI.setTime(Math.ceil(timeLeft));
    }

    function cardAt(p) {
      for (var i = 0; i < cards.length; i++) {
        var c = cards[i];
        if (p.x >= c.x && p.x <= c.x + cardW && p.y >= c.y && p.y <= c.y + cardH) return i;
      }
      return -1;
    }

    function onDown(p) {
      if (solved || locked) return;
      var i = cardAt(p);
      if (i < 0) return;
      var c = cards[i];
      if (c.matched || c.faceUp) return;
      if (flippedIdx.length >= 2) return;

      c.faceUp = true; c.flipDir = 1;
      Sound.beep(520, 0.08, "square");
      flippedIdx.push(i);

      if (flippedIdx.length === 2) {
        moves++;
        var a = cards[flippedIdx[0]], b = cards[flippedIdx[1]];
        if (a.sym === b.sym) {
          a.matched = true; b.matched = true;
          pairsFound++;
          UI.setScore(pairsFound);
          Sound.beep(880, 0.16, "triangle");
          spawnBurst(a.x + cardW / 2, a.y + cardH / 2, a.sym.color);
          spawnBurst(b.x + cardW / 2, b.y + cardH / 2, b.sym.color);
          flippedIdx = [];
          if (pairsFound >= cards.length / 2) {
            solved = true;
            end();
          }
        } else {
          // Lock input until the mismatch flip-back resolves.
          locked = true;
          resolveTimer = CONFIG.mismatchDelay;
        }
      }
    }

    function spawnBurst(x, y, color) {
      for (var i = 0; i < 10; i++) {
        var ang = (Math.PI * 2 * i) / 10;
        bursts.push({
          x: x, y: y,
          vx: Math.cos(ang) * Rand.range(80, 180),
          vy: Math.sin(ang) * Rand.range(80, 180),
          life: 0.5, age: 0, color: color
        });
      }
    }

    function update(dt) {
      // Timer
      if (CONFIG.gameSeconds > 0 && !solved) {
        timeLeft -= dt;
        UI.setTime(Math.max(0, Math.ceil(timeLeft)));
        if (timeLeft <= 0) { timeLeft = 0; return end(); }
      }

      // Flip animation for every card (approaches target based on faceUp).
      for (var i = 0; i < cards.length; i++) {
        var c = cards[i];
        var target = (c.faceUp || c.matched) ? 1 : 0;
        if (c.flipT < target) { c.flipT = Math.min(target, c.flipT + dt / CONFIG.flipSeconds); }
        else if (c.flipT > target) { c.flipT = Math.max(target, c.flipT - dt / CONFIG.flipSeconds); }
      }

      // Mismatch resolution countdown.
      if (locked) {
        resolveTimer -= dt;
        if (resolveTimer <= 0) {
          flippedIdx.forEach(function (i) { cards[i].faceUp = false; });
          flippedIdx = [];
          locked = false;
        }
      }

      // Particle bursts.
      for (var i = bursts.length - 1; i >= 0; i--) {
        var b = bursts[i];
        b.age += dt;
        if (b.age >= b.life) { bursts.splice(i, 1); continue; }
        b.x += b.vx * dt; b.y += b.vy * dt;
        b.vx *= 0.92; b.vy *= 0.92;
      }
    }

    // --- drawing helpers -------------------------------------------------
    function drawCardBack(x, y, w, h) {
      var r = Math.min(w, h) * 0.12;
      roundRect(x, y, w, h, r);
      ctx.fillStyle = "#2b2350";
      ctx.fill();
      ctx.strokeStyle = "#4a3f80";
      ctx.lineWidth = 3;
      ctx.stroke();
      // simple diamond pattern
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y + h * 0.22);
      ctx.lineTo(x + w * 0.78, y + h / 2);
      ctx.lineTo(x + w / 2, y + h * 0.78);
      ctx.lineTo(x + w * 0.22, y + h / 2);
      ctx.closePath();
      ctx.stroke();
    }

    function drawCardFace(x, y, w, h, sym, matched) {
      var r = Math.min(w, h) * 0.12;
      roundRect(x, y, w, h, r);
      ctx.fillStyle = matched ? "#233324" : "#20264a";
      ctx.fill();
      ctx.strokeStyle = matched ? "#4ade80" : "#5865c9";
      ctx.lineWidth = matched ? 4 : 3;
      ctx.stroke();
      drawSymbol(sym, x + w / 2, y + h / 2, Math.min(w, h) * 0.30);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y,     x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x,     y + h, r);
      ctx.arcTo(x,     y + h, x,     y,     r);
      ctx.arcTo(x,     y,     x + w, y,     r);
      ctx.closePath();
    }

    function drawSymbol(sym, cx, cy, s) {
      ctx.save();
      ctx.fillStyle = sym.color;
      ctx.strokeStyle = sym.color;
      ctx.lineWidth = s * 0.24;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      switch (sym.shape) {
        case "circle":
          ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI * 2); ctx.fill();
          break;
        case "square":
          roundRect(cx - s, cy - s, s * 2, s * 2, s * 0.25); ctx.fill();
          break;
        case "triangle":
          ctx.beginPath();
          ctx.moveTo(cx, cy - s);
          ctx.lineTo(cx + s * 0.95, cy + s * 0.8);
          ctx.lineTo(cx - s * 0.95, cy + s * 0.8);
          ctx.closePath(); ctx.fill();
          break;
        case "diamond":
          ctx.beginPath();
          ctx.moveTo(cx, cy - s);
          ctx.lineTo(cx + s, cy);
          ctx.lineTo(cx, cy + s);
          ctx.lineTo(cx - s, cy);
          ctx.closePath(); ctx.fill();
          break;
        case "star":
          drawStar(cx, cy, s, s * 0.42, 5); ctx.fill();
          break;
        case "heart":
          drawHeart(cx, cy, s); ctx.fill();
          break;
        case "plus":
          var t = s * 0.55;
          roundRect(cx - s, cy - t / 2, s * 2, t, t * 0.3); ctx.fill();
          roundRect(cx - t / 2, cy - s, t, s * 2, t * 0.3); ctx.fill();
          break;
        case "ring":
          ctx.beginPath(); ctx.arc(cx, cy, s * 0.78, 0, Math.PI * 2); ctx.stroke();
          break;
      }
      ctx.restore();
    }

    function drawStar(cx, cy, outerR, innerR, points) {
      ctx.beginPath();
      for (var i = 0; i < points * 2; i++) {
        var r = (i % 2 === 0) ? outerR : innerR;
        var ang = (Math.PI / points) * i - Math.PI / 2;
        var x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }

    function drawHeart(cx, cy, s) {
      ctx.beginPath();
      var topY = cy - s * 0.45;
      ctx.moveTo(cx, cy + s * 0.9);
      ctx.bezierCurveTo(cx - s * 1.3, cy + s * 0.15, cx - s * 0.7, topY - s * 0.6, cx, topY);
      ctx.bezierCurveTo(cx + s * 0.7, topY - s * 0.6, cx + s * 1.3, cy + s * 0.15, cx, cy + s * 0.9);
      ctx.closePath();
    }

    function render() {
      ctx.fillStyle = CONFIG.bg;
      ctx.fillRect(0, 0, view.w, view.h);

      for (var i = 0; i < cards.length; i++) {
        var c = cards[i];
        var showFace = c.flipT > 0.5;
        // Flip animation: squash horizontally as the card rotates.
        var t = c.flipT;
        var scaleX = showFace ? (t - 0.5) * 2 : (0.5 - t) * 2;
        scaleX = Math.max(0.05, Math.min(1, scaleX));
        var cx = c.x + cardW / 2, cy = c.y + cardH / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scaleX, c.matched ? 1 + Math.sin(Math.min(1, (1 - t) + t)) * 0 : 1);
        ctx.translate(-cardW / 2, -cardH / 2);
        if (showFace) {
          drawCardFace(0, 0, cardW, cardH, c.sym, c.matched);
        } else {
          drawCardBack(0, 0, cardW, cardH);
        }
        ctx.restore();
      }

      // Particle bursts (drawn above cards).
      for (var i = 0; i < bursts.length; i++) {
        var b = bursts[i];
        var alpha = 1 - b.age / b.life;
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5 * alpha + 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function end() {
      Loop.stop();
      var timeBonus = solved ? Math.floor(timeLeft) * CONFIG.timeBonusPerSecond : 0;
      var bestMoves = Store.get("bestMoves", null);
      if (solved && (bestMoves === null || moves < bestMoves)) {
        Store.set("bestMoves", moves);
      }
      var title = solved ? "Board cleared!" : "Time's up!";
      var subtitleText = pairsFound + "/" + (cards.length / 2) +
        (solved ? " — bonus +" + timeBonus : "");
      UI.setEnd(title, subtitleText);
      setState("end");
      Ad.track("game_end", { pairs: pairsFound, moves: moves, solved: solved, timeBonus: timeBonus });
    }

    return { reset: reset, onDown: onDown, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;

    // Route all inputs to the current game.
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  // Kick off after DOM is parsed.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
