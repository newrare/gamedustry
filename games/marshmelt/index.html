      anim.style.animation = "pop-in-" + st.anim + " " + enter + "ms cubic-bezier(.2,.9,.3,1) forwards";

      // decor behind the word
      var i, decor = st.decor || [];
      for (i = 0; i < decor.length; i++) {
        if (decor[i] === "sparks") { addSparks(anim); continue; }
        if (decor[i] === "dashes") { addDashes(anim); continue; }
        anim.appendChild(decorNode(decor[i]));
      }

      var body = document.createElement("div");
      body.className = "pop-body" + (st.pulse ? " pulse" : "");
      body.style.setProperty("--rot", (opt.rot != null ? opt.rot : (st.rot || 0)) + "deg");
      body.appendChild(buildWord(String(word), st));
      if (sub) {
        var sb = document.createElement("div");
        sb.className = "pop-sub"; sb.textContent = sub;
        body.appendChild(sb);
      }
      anim.appendChild(body);
      out.appendChild(anim);
      pop.appendChild(out);
      $("ov-pops").appendChild(pop);

      // Keep the callout on screen: shrink an over-long word first (offsetWidth
      // is untransformed, i.e. already design px), then pull the anchor in so
      // neither half of a wide word hangs outside the frame.
      var wordEl = body.querySelector(".pop-word");
      var wordW = wordEl.offsetWidth, maxW = st.vertical ? Layout.w * 0.4 : Layout.w;
      if (wordW > maxW) { body.style.setProperty("--fit", (maxW / wordW).toFixed(3)); wordW = maxW; }
      // The word is not always the widest thing in the callout: a style may put
      // a plate around it (`combo`) or a shockwave behind it, and #ov-pops
      // clips, so an off-centre anchor would slice those off. Measure the body
      // and the ring and fold them into the clamp. Only those two: the soft
      // decors (band, dots, rays, chevrons, stripes) are drawn wider than the
      // frame ON PURPOSE and must keep bleeding off both edges.
      var ringEl = anim.querySelector(".pop-d-ring");
      var bodyW = Math.min(Math.max(body.offsetWidth, wordW), Layout.w);
      var half = Math.min(Math.max(bodyW / 2 + 8, ringEl ? ringEl.offsetWidth / 2 : 0), view.w / 2);
      pop.style.left = clamp(px, half, view.w - half) + "px";

      // Full-frame impact, borrowed from the layers that own it. `opt.silent`
      // opts out: the prewarm pass below builds every style while the intro is
      // up, and must not shake, flash, glow the frame edges or drop confetti.
      if (!opt.silent) {
        if (st.shake) Fx.shake(st.shake, st.shakeDur || 0.3);
        if (st.flash) Fx.flash(st.flashCol || "#ffffff", st.flash);
        if (st.vignette) Overlay.vignette(st.vignette, 1, Math.min(st.vignetteMs || 520, enter + Math.max(hold, 0)));
        if (st.confetti) Confetti.burst(st.confetti);
      }

      var handle;
      function remove() {
        var i = live.indexOf(handle);
        if (i >= 0) live.splice(i, 1);
        if (pop.parentNode) pop.parentNode.removeChild(pop);
      }
      function close(delay) {
        if (out.getAttribute("data-closing")) return;
        out.setAttribute("data-closing", "1");
        out.style.animation = "pop-out-" + st.anim + " " + exit + "ms ease-in " + delay + "ms forwards";
        later(remove, delay + exit + 60);
      }
      if (hold >= 0) close(enter + hold);

      handle = { el: pop, close: function () { close(0); }, remove: remove };
      live.push(handle);
      // Over the cap: drop the oldest outright rather than play it out — under a
      // burst it is already faded, and an exit animation costs another frame.
      while (live.length > MAX_LIVE) live[0].remove();
      return handle;
    }

    /* The catalogue. Each entry is one visual language:
         cls is implicit (".pop-<key>")
         anim                 entry/exit pair ("slam" -> pop-in-slam/pop-out-slam)
         enter / hold / exit  default timing in ms; `hold` is what a caller tunes
         decor                layers painted behind the word
         at / rot             default anchor and static tilt
         letters              split the word per glyph (staggered drop-in); off
                              by default because one layer rasterizes far faster
         vertical             manga column, one glyph per line
         shake / flash / vignette / confetti: full-frame impact
       Timings are deliberately tight: a callout that outstays the beat hides the
       gameplay it is celebrating. Lengthen `hold` per call, never by default. */
    var STYLES = {
      // the tiny frequent one, spawned at the impact point
      score:    { anim:"float", enter:240, hold:240, exit:420, decor:[], at:"center", rot:-5 },
      // a mistake: chain lost, wall hit. Sits where a toast would, but styled
      // like the rest of the callouts instead of looking like a leftover pill.
      alert:    { anim:"punch", enter:220, hold:320, exit:220, decor:[], at:"hudUnder", rot:-2 },
      // a scoring milestone: a compact chip with a shockwave, off to one side.
      // This is the one callout a good run fires over and over, so it is built
      // to cost nothing (see .pop-combo and pop-in-chip): no full-frame veil,
      // no clip-path, and a footprint the size of its own text. `ultra` keeps
      // the flash for the moment that really is rare.
      combo:    { anim:"chip", enter:260, hold:520, exit:220, decor:["ring","dashes"],
                  at:"upperRight", rot:-7, shake:4 },
      // a chain staying alive: chevrons pushing the eye sideways
      streak:   { anim:"punch", enter:300, hold:480, exit:240, decor:["chevrons"],
                  at:"left", rot:-7, shake:4 },
      // a comic banner sweeping across the play area
      ribbon:   { anim:"swipe", enter:420, hold:620, exit:320, decor:["band","lines"],
                  at:"upper", shake:5 },
      // poster energy for a big announcement (level up, unlock)
      manifest: { anim:"drop", enter:520, hold:820, exit:320, decor:["dots","band"],
                  at:"center", letters:true, shake:12,
                  vignette:"rgba(214,27,60,.9)", vignetteMs:700 },
      // "you nailed it": gold, sparkles, gentle rays
      perfect:  { anim:"punch", enter:360, hold:620, exit:280, decor:["sparks"],
                  at:"upper", rot:-3, vignette:"rgba(255,190,60,.8)" },
      // the hero moment: rays, chroma, maximum size
      ultra:    { anim:"zoom", enter:440, hold:640, exit:320, decor:["rays"],
                  at:"center", shake:16, flash:0.5, vignette:"rgba(120,70,255,.85)" },
      // a reward sticker
      bonus:    { anim:"drop", enter:380, hold:620, exit:280, decor:["dots"], at:"lower", rot:-4 },
      // hazard tape, blinking for the whole hold
      danger:   { anim:"alarm", enter:240, hold:1100, exit:260, pulse:true, decor:["stripes"],
                  at:"top", vignette:"rgba(255,40,40,.85)", vignetteMs:1100 },
      // the end-of-run peak (its confetti only shows once the end screen is up,
      // since Confetti draws on the end-screen canvas)
      record:   { anim:"drop", enter:620, hold:1500, exit:380, decor:["rays","band","sparks"],
                  at:"center", shake:8, confetti:28 },
      // vertical manga column hugging one edge
      vert:     { anim:"punch", enter:320, hold:560, exit:260, decor:["rays"],
                  at:"edgeRight", rot:4, vertical:true }
    };

    function clear() {
      var i; for (i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = []; live = [];
      $("ov-pops").innerHTML = "";
    }

    /* Rasterizing a style for the first time costs 50-80 ms (gradient text,
       clip-paths, masks). That must never land on a milestone frame, so every
       style is built once — hidden, one per animation frame — while the intro is
       up and nothing is being played. Idempotent and self-cancelling. */
    var warmed = false;
    function prewarm() {
      if (warmed) return;
      warmed = true;
      var keys = [], k;
      for (k in STYLES) if (STYLES.hasOwnProperty(k)) keys.push(k);
      var i = 0;
      function step() {
        if (i >= keys.length) return;
        // Not visibility:hidden — an invisible layer is never rasterized, which
        // is the whole point of the pass. Near-zero opacity still paints.
        var h = show(keys[i++], { word: "WARM UP", sub: "0", hold: 0, enter: 1, exit: 1, silent: true });
        if (h) h.el.style.opacity = "0.004";
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    return {
      show: show, clear: clear, prewarm: prewarm, styles: STYLES, anchors: ANCHORS,
      setEnabled: function (v) { enabled = !!v; if (!enabled) clear(); },
      isEnabled: function () { return enabled; }
    };
  })();

  // --- Intro: logo, copy and the animated how-to-play demo ----------------
  function buildIntro() {
    var logo = CONFIG.intro.logo && ASSETS.images[CONFIG.intro.logo];
    var img = $("app-icon");
    if (logo) { img.src = logo; img.alt = CONFIG.title; } else { img.style.display = "none"; }
    $("intro-title").textContent = CONFIG.title;
    $("intro-tagline").innerHTML = CONFIG.tagline;
    $("intro-demo").className = "demo-" + (CONFIG.intro.demo || "tap");
    $("demo-caption").textContent = CONFIG.intro.caption || "";
    $("btn-start").textContent = CONFIG.copy.start;
    $("btn-cta").textContent = CONFIG.copy.ctaBar;
    $("btn-install").textContent = CONFIG.copy.ctaEnd;
    $("btn-replay").textContent = CONFIG.copy.replay;
    $("hud-score-lbl").textContent = CONFIG.copy.scoreLabel;
    $("eo-scorelbl").textContent = CONFIG.copy.endScore;
  }

  // --- End screen: the cinematic reveal ----------------------------------
  // Beats: title -> score count-up (+confetti) -> stars -> stat rows -> CTA.
  var EndScreen = (function () {
    var timers = [];
    var T_TITLE = 120, T_SCORE = 560, T_STARS = 1950, STAR_GAP = 440,
        ROW_GAP = 250, T_CTA_AFTER = 1500;
    // The reveal climbs: each star rings the same chime a step higher. RATE
    // drives the embedded "uiStar" clip, FREQ the synthesized fallback.
    var STAR_RATE = [1, 1.19, 1.42], STAR_FREQ = [660, 880, 1180];

    function countUp(el, target, dur, cb) {
      var start = performance.now();
      function step(now) {
        var p = clamp((now - start) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(e * target);
        if (p < 1) requestAnimationFrame(step);
        else { el.textContent = target; if (cb) cb(); }
      }
      requestAnimationFrame(step);
    }

    // result: { title, variant:""|"win"|"perfect", score, stars:0..3|null,
    //           rows:[{label, value, grade}] }
    function show(result) {
      timers.forEach(clearTimeout); timers = [];
      Confetti.clear();
      function T(fn, ms) { timers.push(setTimeout(fn, ms)); }

      var title = $("eo-title");
      title.textContent = result.title || CONFIG.copy.gameOver;
      title.className = "eo-title" + (result.variant ? " " + result.variant : "");
      ["eo-title", "eo-scorelbl", "eo-score"].forEach(function (id) { $(id).classList.remove("show", "pop"); });
      $("eo-score").textContent = "0";
      $("btn-install").classList.remove("show");
      $("btn-replay").classList.remove("show");

      // Stars (pass null / undefined to hide the row entirely).
      var stars = result.stars;
      var hasStars = stars != null;
      $("eo-stars").classList.toggle("hidden", !hasStars);
      for (var i = 1; i <= 3; i++) $("star-" + i).className = "star";

      // Stat rows are rebuilt every round so a replay starts clean.
      var rows = result.rows || [];
      var box = $("eo-stats"), html = "";
      rows.forEach(function (r, i) {
        var label = r.grade === "gold"
          ? '<span class="spark">✦</span> ' + r.label + ' <span class="spark">✦</span>'
          : r.label;
        html += '<div class="eo-row' + (r.grade ? " " + r.grade : "") + '" id="eo-row-' + i + '">' +
                '<span>' + label + '</span><span class="eo-val" id="eo-val-' + i + '">0</span></div>';
      });
      box.innerHTML = html;

      // 1) Title slams in.
      T(function () { title.classList.add("show"); }, T_TITLE);

      // 2) Final score counts up, greeted by confetti.
      T(function () {
        $("eo-scorelbl").classList.add("show");
        $("eo-score").classList.add("show");
        Confetti.burst(70);
        countUp($("eo-score"), result.score || 0, 1100, function () {
          $("eo-score").classList.add("pop");
          Sound.cue("uiScore", 0.8, 1, 900, 0.14);
          Confetti.burst(90);
        });
      }, T_SCORE);

      // 3) Stars slam in one by one, each with a rising chime.
      var afterStars = T_SCORE + 900;
      if (hasStars) {
        T(function () { for (var s = 1; s <= 3; s++) $("star-" + s).classList.add("dim"); }, T_STARS - 160);
        for (var si = 0; si < stars; si++) {
          (function (idx) {
            T(function () {
              var el = $("star-" + (idx + 1));
              el.classList.remove("dim"); el.classList.add("on");
              Sound.cue("uiStar", 0.75, STAR_RATE[idx] || 1.42, STAR_FREQ[idx] || 1180, 0.16);
              Confetti.burst(30);
            }, T_STARS + idx * STAR_GAP);
          })(si);
        }
        afterStars = T_STARS + Math.max(stars, 1) * STAR_GAP + 350;
      }

      // 4) Stat rows cascade in, counters animating.
      rows.forEach(function (r, i) {
        T(function () {
          $("eo-row-" + i).classList.add("show");
          var el = $("eo-val-" + i);
          if (typeof r.value === "number") countUp(el, r.value, 450);
          else el.textContent = r.value;
          Sound.cue("uiRow", 0.5, 1 + i * 0.07, 480 + i * 70, 0.05);
        }, afterStars + i * ROW_GAP);
      });

      // 5) Install CTA, then the discreet replay link.
      var ctaAt = afterStars + rows.length * ROW_GAP + T_CTA_AFTER;
      T(function () { $("btn-install").classList.add("show"); }, ctaAt);
      T(function () { $("btn-replay").classList.add("show"); }, ctaAt + 500);
    }
    return { show: show };
  })();

  /* --- Perf: a readout on the device itself ------------------------------
     Add `?perf=1` to a game's URL and this box appears; without it not a line
     of it runs. It exists because the two machines disagree: a desktop absorbs
     costs a phone cannot, and no bench on a laptop reproduces the phone that
     is actually stuttering.

     What it shows, and why that split is the whole point:

       fps / worst     the real frame interval, which includes everything —
                       script, style, layout, paint, raster, composite.
       main            how much of the worst frame the MAIN THREAD owned, read
                       from the browser's own long-animation-frame report
                       (Chromium; Firefox has no equivalent and shows "n/a").
       verdict         `main` says which half to look at. A long frame with a
                       long `main` is JavaScript, style or layout — profile the
                       game code. A long frame with a SHORT `main` is paint,
                       raster or compositing: the main thread was idle and the
                       frame still missed, which is what an animated paint
                       property or an oversized layer does, and it is the one
                       failure a JS profiler cannot see.

     Read it while playing, not on the menu: the callouts and the HUD only cost
     anything once a round is running.                                       */
  var Perf = (function () {
    var on = false;
    /* `perf=1` is the live readout, `perf=bench` the self-measuring sweep
       further down. Anything else, and not a line of this module runs. */
    try { on = /[?&#]perf=(1|bench)\b/.test(location.search + location.hash); } catch (e) {}
    if (!on) return { frame: function () {} };

    /* `?perf=1&off=vig,decor` switches a suspect off ON THE DEVICE. The probe
       above says whether a stutter is main-thread or paint/raster; it cannot
       say WHICH layer, and no bench on a laptop reproduces a phone's raster.
       So the bisect moves here: turn one thing off, play the same beat, watch
       `worst`. What is available, from the cheapest guess to the broadest:

         vig     Overlay.vignette — a full-frame repaint, because the colour is
                 assigned per call, blurred over the whole frame
         fx      the canvas juice: bursts, rings, the full-frame flash, shake
         pops    every callout, outright
       and, once `pops` has been shown to be the one, inside a callout:
         decor   the layers behind the word (band, dots, rays, ring, chevrons)
         word    the word's glyph layers, all of them
         glow    just the two BLURRED text-shadows
         shadow  the whole text-shadow stack, blurred and solid
         stroke  just the 14px path stroke around the glyphs
         face    just the gradient face (a second glyph pass, clipped)
         sub     the sub-line under the word

       Canvas drawing is rasterized off the main thread too, so `fx` and `pops`
       together separate the two halves of a pickup: if `off=fx` flattens the
       spike it is the canvas, if `off=pops` does it is the DOM. The box lists
       what is currently off, so a reading is never misattributed. */
    var off = {};
    try {
      var m = /[?&]off=([a-z,]+)/.exec(location.search + location.hash);
      if (m) {
        var names = m[1].split(",");
        for (var k = 0; k < names.length; k++) off[names[k]] = true;
      }
    } catch (e) {}

    function noop() {}
    if (off.vig)  Overlay.vignette = noop;
    if (off.pops) Pop.show = function () { return null; };
    if (off.fx) {
      Fx.burst = noop; Fx.ring = noop; Fx.flash = noop; Fx.shake = noop; Fx.text = noop;
    }
    /* Inside a callout, the word is rendered several times over: a 14px path
       stroke, three solid extrusion copies, two blurred ones, and a second
       glyph pass used as the mask for the gradient face. Each of these takes
       one of them out, so a reading names the layer instead of the module. */
    var OFF_CSS = {
      decor:  ".pop-d,.pop-d-dash,.pop-d-spark{display:none!important}",
      shadow: ".pop-ltr{text-shadow:none!important}",
      glow:   ".pop-ltr{text-shadow:0 5px 0 var(--ink),0 10px 0 var(--ink)," +
              "0 15px 0 var(--ink2)!important}",              // the two blurs only
      stroke: ".pop-ltr{-webkit-text-stroke-width:0!important}",
      face:   ".pop-ltr::before{display:none!important}",
      sub:    ".pop-sub{display:none!important}",
      word:   ".pop-ltr{text-shadow:none!important;-webkit-text-stroke-width:0!important}" +
              ".pop-ltr::before{display:none!important}"
    };
    var rules = "", key;   /* OFF_CSS is also what the ?perf=bench sweep applies */
    for (key in OFF_CSS) if (off[key]) rules += OFF_CSS[key];
    if (rules) {
      var css = document.createElement("style");
      css.textContent = rules;
      document.head.appendChild(css);
    }
    var offList = Object.keys(off).join(",");

    /* `?perf=bench` — the device measures itself.
       A laptop cannot stand in for a phone here, and it was tried: a software
       rasterizer says a callout's halftone decor is 92% of its cost and the
       blurred shadows nothing, while this phone said the opposite, because a
       GPU fills area almost for free and pays for blur passes instead. And the
       GPU's own work cannot be read back — it is asynchronous and Chrome
       exposes no per-layer timing (see tools/lab/bench-raster.mjs, which says
       the same at more length).
       So the sweep runs here. It fires the same callout over and over, once
       per variant, back to back in one session on one device, and prints a
       table: same hardware, same thermal state, same everything but the layer
       under test. Read the ORDER of the rows, not the milliseconds.
       Start a round, put the phone down, wait — it takes about a minute. */
    var bench = false;
    try { bench = /[?&]perf=bench\b/.test(location.search + location.hash); } catch (e) {}

    var box = null, prev = 0, frames = 0, worst = 0, over = 0, since = 0;
    var mainWorst = 0, mainKnown = false;
    /* Ask whether the browser CAN report a long main-thread frame, rather than
       waiting for one to arrive. It is the case that matters: a long frame with
       no report is the verdict, so "no report yet" and "cannot report" must not
       look the same. */
    try {
      mainKnown = !!(window.PerformanceObserver && PerformanceObserver.supportedEntryTypes &&
        PerformanceObserver.supportedEntryTypes.indexOf("long-animation-frame") >= 0);
    } catch (e) {}

    /* The browser reports a long animation frame with the main thread's share
       of it already broken down. Only the total is used here: the interesting
       question on a phone is not which main-thread phase was slow, it is
       whether the main thread was involved at all. */
    try {
      new PerformanceObserver(function (list) {
        var e = list.getEntries();
        for (var i = 0; i < e.length; i++) if (e[i].duration > mainWorst) mainWorst = e[i].duration;
      }).observe({ type: "long-animation-frame", buffered: false });
    } catch (e) {}

    function ensure() {
      if (box) return box;
      box = document.createElement("div");
      /* Inline styles, outside the frame: a probe must not need a rule in the
         motor stylesheet, and it must not ride the frame's scale transform. */
      box.style.cssText = "position:fixed;left:6px;top:6px;z-index:9999;" +
        "padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.72);color:#eafcff;" +
        "font:700 11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;" +
        "pointer-events:none;text-align:left";
      document.body.appendChild(box);
      return box;
    }

    function frame() {
      var t = (window.performance && performance.now) ? performance.now() : Date.now();
      if (prev) {
        var dt = t - prev;
        frames++; since += dt;
        if (dt > worst) worst = dt;
        if (dt > 32) over++;
        /* In sweep mode the box belongs to the sweep's table: the live
           readout would overwrite it once a second. */
        if (since >= 1000 && bench) { frames = 0; since = 0; worst = 0; over = 0; mainWorst = 0; }
        else if (since >= 1000) {
          var fps = Math.round(frames * 1000 / since);
          var main = mainKnown ? Math.round(mainWorst) + "ms" : "n/a";
          var verdict = worst < 32 ? "ok"
            : !mainKnown ? "slow — no main-thread report here"
            : mainWorst > worst * 0.6 ? "main thread" : "paint/raster";
          ensure().textContent =
            "fps " + fps + "   worst " + Math.round(worst) + "ms\n" +
            "main " + main + "   >32ms " + over + "/s" +
            (verdict ? "\n" + verdict : "") +
            (offList ? "\noff: " + offList : "");
          frames = 0; since = 0; worst = 0; over = 0; mainWorst = 0;
        }
      }
      prev = t;
    }

    /* --- the device sweep ------------------------------------------------
       Each pass: apply one variant's CSS, fire N callouts on a fixed cadence,
       and keep the frame intervals. Nothing here touches the game's own state
       beyond showing callouts, so the round keeps playing under it. */
    var PASSES = ["base", "glow", "shadow", "face", "decor", "word", "sub"];
    var SWEEP_STYLE = "bonus";        // the callout a pickup fires
    var SWEEP_N = 16, SWEEP_GAP = 260;

    function benchRun() {
      var css = document.createElement("style");
      document.head.appendChild(css);
      var results = [], pass = 0;

      function report(done) {
        var lines = ["callout: " + SWEEP_STYLE + "  x" + SWEEP_N, ""], i, r;
        lines.push("variant   p95  worst  slow/s");
        for (i = 0; i < results.length; i++) {
          r = results[i];
          lines.push(pad(r.name, 9) + pad(Math.round(r.p95), 5) + pad(Math.round(r.worst), 7) +
            (Math.round(r.rate * 10) / 10));
        }
        if (!done) lines.push("…" + PASSES[pass]);
        ensure().textContent = lines.join("\n");
      }
      function pad(v, n) { v = String(v); while (v.length < n) v += " "; return v; }

      function next() {
        if (pass >= PASSES.length) { report(true); return; }
        var name = PASSES[pass];
        css.textContent = name === "base" ? "" : (OFF_CSS[name] || "");
        report(false);
        var stamps = [], fired = 0;
        var running = true;
        function tick(t) { if (!running) return; stamps.push(t); requestAnimationFrame(tick); }
        requestAnimationFrame(tick);
        var iv = setInterval(function () {
          if (fired++ >= SWEEP_N) {
            clearInterval(iv);
            setTimeout(function () {
              running = false;
              var d = [], i;
              for (i = 1; i < stamps.length; i++) d.push(stamps[i] - stamps[i - 1]);
              d.sort(function (a, b) { return a - b; });
              var over = 0;
              for (i = 0; i < d.length; i++) if (d[i] > 32) over++;
              /* Frames over 32 ms per SECOND, not per pass: a pass that ran a
                 little longer would otherwise look worse than one that did
                 not. p95 and worst are already durations. */
              var secs = 0, j;
              for (j = 0; j < d.length; j++) secs += d[j];
              secs = secs / 1000 || 1;
              results.push({
                name: name,
                p95: d.length ? d[Math.min(d.length - 1, Math.floor(d.length * 0.95))] : 0,
                worst: d.length ? d[d.length - 1] : 0,
                rate: over / secs
              });
              pass++;
              Pop.clear();
              next();
            }, 500);
            return;
          }
          Pop.show(SWEEP_STYLE, { word: "COMBO X5", sub: "+120", silent: true });
        }, SWEEP_GAP);
      }
      next();
    }

    /* The sweep needs a round underway: a callout over the menu measures the
       menu. It starts itself on the first frame the game actually renders. */
    var benchStarted = false;
    function maybeBench() {
      if (!bench || benchStarted) return;
      benchStarted = true;
      ensure().textContent = "bench: starting…";
      setTimeout(benchRun, 1200);
    }

    return { frame: function () { maybeBench(); frame(); } };
  })();

  // --- Round clock -------------------------------------------------------
  var Round = (function () {
    var left = 0, running = false, fired = false;
    function reset() {
      left = CONFIG.gameSeconds; running = true; fired = false;
      if (CONFIG.gameSeconds > 0) HUD.setTime(left);
    }
    function tick(dt) {
      if (!running || CONFIG.gameSeconds <= 0) return;
      left = Math.max(0, left - dt);
      HUD.setTime(left);
      if (left <= 0 && !fired) {
        fired = true;
        // The game decides what "time up" means (end now, sudden death…).
        if (Game.onTimeUp) Game.onTimeUp();
        else endRound({ title: CONFIG.copy.timeUp });
      }
    }
    return {
      reset: reset, tick: tick, stop: function () { running = false; },
      left: function () { return left; },
      elapsed: function () { return CONFIG.gameSeconds - left; }
    };
  })();

  // --- The single way a round ends ---------------------------------------
  // result: { title, variant, score, stars, rows, track }
  function endRound(result) {
    if (State === "end") return;
    result = result || {};
    Loop.stop(); Round.stop();
    Music.duck(0.55, 0.8);        // let the end-screen cues sit on top
    var score = result.score == null ? Math.round(HUD.score()) : result.score;
    var best = Math.max(score, Store.get("bestScore", 0));
    Store.set("bestScore", best);
    setState("end");
    EndScreen.show({
      title: result.title || CONFIG.copy.gameOver,
      variant: result.variant || "",
      score: score,
      stars: result.stars,
      rows: result.rows || []
    });
    Ad.track("game_end", result.track || { score: score, best: best });
  }

  /* ===================================================================
     6. GAME — MARSHMELT. A sticky marshmallow over a rising lava lake.

     The whole game is one rule: the body is stuck to whatever it last hit, and
     everything it can stick to is falling. A tap flings it along the line to
     the finger; it sticks to the first rock it meets and rides that rock down.
     Rocks melt when they reach the lava, so a landing is never a resting place
     — the only way to stay alive is to keep moving up the falling ones.

     Contract: reset / update(dt) / render / onDown / onMove / onUp / onResize.
     =================================================================== */
  var Game = (function () {
    var C = CONFIG, TAU = Math.PI * 2;

    /* The marshmallow browns as it takes heat: four shades, charcoal last.
       Toasting is cosmetic — the lava is the only thing that ends a run — but
       it is the read on how badly the last minute went. */
    var TOAST = [
      { skin:"#fff3dd", lit:"#ffffff", face:"#5a3a1c" },
      { skin:"#f7d9a4", lit:"#fff0cf", face:"#4a2c12" },
      { skin:"#d99a55", lit:"#f3c187", face:"#33200c" },
      { skin:"#7d5130", lit:"#a97a4c", face:"#170d05" }
    ];

    var rocks, mallow, embers, bubbles;
    var score, combo, bestCombo, rocksHit, best, nextMile, toast;
    var elapsed, spawnT, wave, wallT, bonkT, aim, dead, deadT, sink;
    var lavaY, lavaLo, lavaHi;
    var bg = null, fire = null;

    /* ---- helpers --------------------------------------------------------- */

    function makeCanvas(w, h) {
      var c = document.createElement("canvas");
      var SPR = view.dpr;                        // the motor's rule, read per build
      c.width = Math.round(w * SPR); c.height = Math.round(h * SPR);
      c._w = w; c._h = h;
      c.getContext("2d").setTransform(SPR, 0, 0, SPR, 0, 0);
      return c;
    }

    function geometry() {
      lavaLo = Layout.bottom - Layout.h * C.lavaStart;
      lavaHi = Layout.bottom - Layout.h * C.lavaEnd;
      if (lavaY == null) lavaY = lavaLo;
    }

    // The lava surface is two sine waves, so it never reads as a straight line
    // and the same function decides what has fallen in.
    function surfaceAt(x) {
      return lavaY + Math.sin(x * 0.011 + wave) * 8 + Math.sin(x * 0.029 - wave * 1.7) * 4;
    }

    function ramp() { return clamp(elapsed / C.rampSeconds, 0, 1); }

    /* ---- the rocks ------------------------------------------------------- */

    function makeRock(x, y, r, hot) {
      var i, shape = [], veins = [], n = 11;
      var drift = Rand.range(-C.driftMax, C.driftMax);
      for (i = 0; i < n; i++) shape.push(Rand.range(0.88, 1.1));
      for (i = 0; i < 3; i++) {
        veins.push({ a: Rand.range(0, TAU), b: Rand.range(0, TAU), w: Rand.range(0.1, 0.45) });
      }
      return {
        x: x, y: y, r: r, hot: !!hot,
        /* vx/vy are what the rock is doing right now; drift/fall are the lane
           it was given and the velocity it is always pulled back toward. */
        vx: drift, vy: 0, drift: drift, fall: 0,
        rot: Rand.range(0, TAU), spin: Rand.range(-C.spinMax, C.spinMax),
        shape: shape, veins: veins, seed: Rand.range(0, TAU),
        used: false, sunk: 0, burning: false, burn: 0, glow: 3.1
      };
    }

    // The local radius of a rock at a LOCAL angle, so the body plants itself on
    // the silhouette instead of on an imaginary circle.
    function radiusAt(rk, a) {
      var n = rk.shape.length;
      var t = (((a % TAU) + TAU) % TAU) / TAU * n;
      var i = Math.floor(t), f = t - i;
      return rk.r * (rk.shape[i % n] * (1 - f) + rk.shape[(i + 1) % n] * f);
    }

    function spawnRock(y, k) {
      var hot = Rand.chance(C.fireChance0 + (C.fireChance1 - C.fireChance0) * k);
      var r = hot ? Rand.range(C.fireMinR, C.fireMaxR) : Rand.range(C.rockMinR, C.rockMaxR);
      var x = 0, i, j, ok;
      // Six tries at a lane that is not already taken, then give up and drop it
      // anyway — a crowded ceiling is a fair thing to have to read.
      for (i = 0; i < 6; i++) {
        x = Rand.range(Layout.left + r, Layout.right - r);
        ok = true;
        for (j = 0; j < rocks.length; j++) {
          if (rocks[j].y > y + 260) continue;
          if (Math.abs(rocks[j].x - x) < rocks[j].r + r + 24) { ok = false; break; }
        }
        if (ok) break;
      }
      var rk = makeRock(x, y, r, hot);
      // One of the two lanes, then the ramp on top of it.
      var fast = Rand.chance(C.fastChance);
      rk.fall = (fast ? Rand.range(C.fastMin, C.fastMax) : Rand.range(C.fallMin, C.fallMax))
              * (1 + C.fallRamp * k) * (hot ? C.fireFall : 1);
      rk.vy = rk.fall;
      rocks.push(rk);
      return rk;
    }

    /* Structures bounce off one another. Mass goes as the area, so a boulder
       shrugs a pebble aside and a pebble is sent flying; the settle term in
       update() then bleeds the knock away over about half a second. */
    function collideRocks(d) {
      var i, j, a, b, dx, dy, dist, min, nx, ny, ma, mb, push, rel, imp;
      for (i = 0; i < rocks.length; i++) {
        a = rocks[i];
        /* A burning structure is being eaten away: it stops pushing anything
           around, or the rocks above it pile onto it and the lower half of the
           screen turns into a raft instead of a fall. */
        if (a.sunk > 0 || a.burning) continue;
        for (j = i + 1; j < rocks.length; j++) {
          b = rocks[j];
          if (b.sunk > 0 || b.burning) continue;
          dx = b.x - a.x; dy = b.y - a.y;
          dist = Math.hypot(dx, dy);
          min = a.r + b.r;
          if (dist >= min || dist < 0.001) continue;
          nx = dx / dist; ny = dy / dist;
          ma = a.r * a.r; mb = b.r * b.r;

          // separate them first, each by the other's share of the mass
          push = min - dist;
          a.x -= nx * push * (mb / (ma + mb)); a.y -= ny * push * (mb / (ma + mb));
          b.x += nx * push * (ma / (ma + mb)); b.y += ny * push * (ma / (ma + mb));

          // then the impulse along the normal — only if they are still closing
          rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel >= 0) continue;
          imp = -(1 + C.rockBounce) * rel / (1 / ma + 1 / mb);
          a.vx -= imp / ma * nx; a.vy -= imp / ma * ny;
          b.vx += imp / mb * nx; b.vy += imp / mb * ny;

          // a knock also sets them turning, which is what makes it read as a hit
          a.spin = clamp(a.spin - rel * C.knockSpin, -C.spinMax * 2.4, C.spinMax * 2.4);
          b.spin = clamp(b.spin + rel * C.knockSpin, -C.spinMax * 2.4, C.spinMax * 2.4);

          if (bonkT <= 0) {
            bonkT = 0.09;
            Sound.clip("wall", clamp(-rel / 900, 0.1, 0.4), Rand.range(0.62, 0.82));
            Fx.burst(a.x + nx * a.r, a.y + ny * a.r,
                     { color:["#c9b8a0", "#ffd9a0"], count:5, speed:190, life:.26, grav:400, size:3 });
          }
        }
      }
    }

    /* ---- the body -------------------------------------------------------- */

    /* Plant the marshmallow on its host, along the anchor angle it stuck at.
       The host spins, so this is also what makes a landing expire.

       `grip` is the inward slide: 0 is the point of impact on the silhouette,
       1 is the hold near the centre. Passing dt advances it; calling ride()
       bare (from attach, from reset) only re-plants at the grip it already has. */
    function ride(d) {
      var rk = mallow.host, a = rk.rot + mallow.rel;
      if (d) mallow.grip = Math.min(1, mallow.grip + d * C.gripSpeed);
      var reach = radiusAt(rk, mallow.rel) + C.mallowLen * (0.5 - C.embed);
      var dd = reach * (1 - C.gripCenter * mallow.grip);
      mallow.x = rk.x + Math.cos(a) * dd;
      mallow.y = rk.y + Math.sin(a) * dd;
      mallow.ang = a; mallow.vx = 0; mallow.vy = 0;
    }

    // Closest point of the capsule axis to a circle centre.
    function hits(rk) {
      var hx = Math.cos(mallow.ang) * C.mallowLen * 0.5;
      var hy = Math.sin(mallow.ang) * C.mallowLen * 0.5;
      var ax = mallow.x - hx, ay = mallow.y - hy;
      var dx = hx * 2, dy = hy * 2;
      var t = ((rk.x - ax) * dx + (rk.y - ay) * dy) / (dx * dx + dy * dy);
      t = clamp(t, 0, 1);
      var cx = ax + dx * t, cy = ay + dy * t;
      return Math.hypot(rk.x - cx, rk.y - cy) < rk.r + C.mallowR + C.stickPad;
    }

    function attach(rk) {
      mallow.host = rk; mallow.flying = false; mallow.ignore = null; mallow.hold = 0;
      mallow.rel = Math.atan2(mallow.y - rk.y, mallow.x - rk.x) - rk.rot;
      mallow.grip = 0;                      // it slides inward from here
      ride();
      Fx.burst(mallow.x, mallow.y, { color:["#fff3dd", "#ffd9a0"], count:8, speed:210, life:.32, grav:420, size:4 });

      if (rk.hot) { scorch(rk); return; }
      if (rk.used) {                                  // a rock already claimed
        combo = 0; HUD.setRight(null);
        Sound.clip("stick", 0.4, Rand.range(1.1, 1.25));
        return;
      }
      claim(rk);
    }

    // A fresh rock: the only thing in the game that scores.
    function claim(rk) {
      rk.used = true; rocksHit++; combo++;
      mallow.air = C.airShots;      // a fresh rock is what reloads the recovery
      if (combo > bestCombo) bestCombo = combo;
      Sound.clip("stick", 0.62, Rand.range(0.86, 1.02) * (rk.r > 70 ? 0.9 : 1.1));

      // Higher is worth more, which is the whole reason to climb rather than to
      // sit on the first thing that floats past.
      var high = clamp((Layout.bottom - mallow.y) / Layout.h, 0, 1);
      var mult = Math.min(1 + (combo - 1) * C.chainStep, C.chainMax);
      var gain = Math.round((C.baseScore + C.heightBonus * high) * mult);
      score += gain;
      HUD.setScore(score);
      HUD.punch(combo >= 5 ? "#ffd166" : "#fff3dd");
      HUD.setRight(combo >= 2 ? "x" + combo : null, "CHAIN", combo >= 5 ? "on" : "");
      Pop.show("score", { word:"+" + gain, at:{ x: mallow.x, y: mallow.y - 54 } });
      Fx.ring(rk.x, rk.y, { from: rk.r * 0.7, to: rk.r * 1.9, color:"#ffd9a0", width:5, life:.32 });

      if (rocksHit >= nextMile) {
        nextMile += C.milestone;
        Pop.show(rocksHit >= 40 ? "ultra" : rocksHit >= 20 ? "combo" : "streak",
                 { word: rocksHit + " ROCKS", sub:"keep climbing" });
        Sound.clip("climb", 0.5, 1 + Math.min(rocksHit / 60, 0.35));
      }
    }

    // Landing on a fireball: no score, no chain, one shade darker, and a clock.
    function scorch(rk) {
      combo = 0; HUD.setRight(null);
      toast = Math.min(3, toast + 1);
      Sound.clip("burn", 0.55, Rand.range(0.95, 1.12));
      Fx.flash("#ff7a1a", 0.22, 3);
      Fx.shake(7, 0.2);
      Fx.burst(mallow.x, mallow.y, { color:["#ffd166", "#ff7a1a"], count:16, speed:330, life:.45, grav:-120 });
      Pop.show("danger", { word: toast >= 3 ? "BURNT!" : "HOT!", sub:"jump", at:"upper" });
    }

    /* A structure that touches the lava catches fire. It becomes a fireball —
       flames, no score, and a clock that throws the body off — and it settles
       into the crust while it blazes, so the fire is a warning with time in it
       rather than an instant death. */
    function ignite(rk) {
      rk.burning = true; rk.hot = true; rk.glow = 1.9; rk.burn = 0;
      rk.fall = C.burnSink; rk.vy = Math.max(rk.vy * 0.35, C.burnSink); rk.drift *= 0.4;
      if (mallow.host === rk) mallow.hold = 0;      // the eject clock starts now
      Sound.clip("burn", 0.3, Rand.range(1.15, 1.32));
      Fx.burst(rk.x, rk.y + rk.r * 0.5,
               { color:["#ffd166", "#ff7a1a"], count:12, speed:250, life:.5, grav:-160, size:4 });
      Fx.ring(rk.x, rk.y, { from: rk.r * 0.6, to: rk.r * 1.7, color:"#ff9d2e", width:4, life:.3 });
    }

    function fling(dirx, diry) {
      var rk = mallow.host, mid = !rk;
      if (mid) {                             // a recovery shot, and it is spent
        mallow.air--;
        Fx.ring(mallow.x, mallow.y, { from:14, to:82, color:"#ffd166", width:5, life:.3 });
      }
      mallow.vx = dirx * C.flingSpeed;
      mallow.vy = diry * C.flingSpeed;
      /* The structure it just left is out for the WHOLE flight, not only while
         they still overlap: a jump has to find a new hold, so the shot is a
         commitment instead of a way to hop in place on one safe rock. */
      mallow.ignore = rk;
      mallow.flying = true; mallow.host = null; mallow.hold = 0;
      if (rk) {                              // small rocks get kicked harder
        var m = Math.max(0.25, 60 / rk.r);
        rk.vx -= dirx * C.flingSpeed * C.recoil * m * 0.15;
        rk.vy -= diry * C.flingSpeed * C.recoil * m * 0.15;
      }
      Sound.clip("fling", mid ? 0.42 : 0.5, mid ? Rand.range(1.22, 1.32) : Rand.range(0.96, 1.08));
      Fx.burst(mallow.x, mallow.y, { color:["#fff3dd", "#ffd9a0"], count:9, speed:230,
                                     life:.3, grav:300, angle: Math.atan2(-diry, -dirx), spread: 1.5 });
    }

    /* ---- input ----------------------------------------------------------- */

    // Direction = body -> finger, at one fixed speed. A single tap is a whole
    // shot; holding it only slows time and draws the arc.
    function canShoot() { return !dead && (mallow.host !== null || mallow.air > 0); }

    function aimVec() {
      if (!aim || !canShoot()) return null;
      var dx = aim.x - mallow.x, dy = aim.y - mallow.y;
      var len = Math.hypot(dx, dy);
      if (len < C.aimMinDist) return null;
      return { x: dx / len, y: dy / len };
    }

    function onDown(p) { if (canShoot()) aim = { x: p.x, y: p.y }; }
    function onMove(p) { if (aim) { aim.x = p.x; aim.y = p.y; } }
    function onUp() {
      var v = aimVec();
      if (v) fling(v.x, v.y);
      aim = null;
    }

    /* ---- the run --------------------------------------------------------- */

    function reset() {
      score = 0; combo = 0; bestCombo = 0; rocksHit = 0; toast = 0;
      elapsed = 0; wave = 0; wallT = 0; bonkT = 0; spawnT = 0.9;
      nextMile = C.milestone;
      dead = false; deadT = 0; sink = 0; aim = null;
      best = Store.get("bestScore", 0);
      lavaY = null; geometry();

      rocks = []; bubbles = []; embers = [];
      // The rock the run starts on: dead centre, big, and already falling.
      var start = makeRock(Layout.cx, Layout.top + Layout.h * 0.34, 96, false);
      start.vx = 0; start.drift = 0; start.spin *= 0.4;
      start.fall = C.fallMin * 0.75; start.vy = start.fall;
      rocks.push(start);
      /* Four more, spread over the whole band and up past the ceiling. The
         opening is the one moment the player has no idea what the rhythm is,
         and an empty upper half reads as "there was nothing I could do". */
      spawnRock(Layout.top + Layout.h * 0.1, 0);
      spawnRock(Layout.top - 40, 0);
      spawnRock(Layout.top - 250, 0);
      spawnRock(Layout.top - 470, 0);

      mallow = { x:0, y:0, vx:0, vy:0, ang:-Math.PI / 2,
                 host: start, rel: -Math.PI / 2 - start.rot,
                 flying:false, ignore:null, hold:0, grip:1, air: C.airShots };
      ride();

      var i;
      for (i = 0; i < 26; i++) embers.push(newEmber(true));
      for (i = 0; i < 7; i++) bubbles.push(newBubble());

      HUD.setScoreNow(0);
      HUD.setLeft(best, "BEST");
      HUD.setRight(null);
      Fx.reset();
      buildSprites();
    }

    function die() {
      if (dead) return;
      dead = true; deadT = 0; sink = 0; aim = null;
      mallow.flying = false; mallow.host = null;
      Sound.clip("melt", 0.85);
      Fx.flash("#ff6b1a", 0.5, 2.2);
      Fx.shake(13, 0.5);
      Fx.freeze(0.08);
      splash(mallow.x, 26);
      Pop.show("danger", { word:"MELTED", at:"center" });
      Overlay.vignette("#ff3b00", 0.55);
    }

    function finish() {
      var stars = score >= 1100 ? 3 : score >= 500 ? 2 : score > 0 ? 1 : 0;
      endRound({
        title: stars === 3 ? "SURVIVOR!" : CONFIG.copy.gameOver,
        variant: stars === 3 ? "perfect" : "",
        score: score,
        stars: stars,
        rows: [
          { label:"ROCKS", value: rocksHit },
          { label:"BEST CHAIN", value: bestCombo, grade:"accent" },
          { label:"BEST SCORE", value: Math.max(score, best), grade:"gold" }
        ]
      });
    }

    /* ---- ambience -------------------------------------------------------- */

    function newEmber(scatter) {
      return {
        x: Rand.range(0, view.w),
        y: scatter ? Rand.range(Layout.top, view.h) : view.h + 10,
        vy: -Rand.range(28, 90), vx: Rand.range(-16, 16),
        r: Rand.range(1.5, 3.6), a: Rand.range(0.25, 0.8), t: Rand.range(0, TAU)
      };
    }

    function newBubble() {
      return { x: Rand.range(20, view.w - 20), t: Rand.range(0, 1), life: Rand.range(1.1, 2.4), r: Rand.range(6, 16) };
    }

    function splash(x, n) {
      Fx.burst(x, surfaceAt(x), { color:["#ffd166", "#ff7a1a", "#ffe9c4"], count:n,
                                  speed:420, life:.6, grav:900, size:6 });
      Fx.ring(x, surfaceAt(x), { from:12, to:150, color:"#ffb347", width:6, life:.45 });
    }

    /* ---- update ---------------------------------------------------------- */

    function update(dt) {
      var d = aimVec() ? dt * C.aimSlow : dt;      // holding the finger slows time
      var i, rk, k;

      elapsed += dt;
      wave += d * 1.5;
      if (wallT > 0) wallT -= dt;
      geometry();
      lavaY = lavaLo + (lavaHi - lavaLo) * clamp(elapsed / C.riseSeconds, 0, 1);
      k = ramp();

      // --- ambience (keeps running through the death beat) ---
      for (i = 0; i < embers.length; i++) {
        var e = embers[i];
        e.t += d * 3;
        e.y += e.vy * d; e.x += (e.vx + Math.sin(e.t) * 12) * d;
        if (e.y < Layout.top - 20) embers[i] = newEmber(false);
      }
      for (i = 0; i < bubbles.length; i++) {
        var b = bubbles[i];
        b.t += d / b.life;
        if (b.t >= 1) bubbles[i] = newBubble();
      }

      // --- rocks: integrate, then let the lanes reassert themselves ---
      if (bonkT > 0) bonkT -= dt;
      for (i = 0; i < rocks.length; i++) {
        rk = rocks[i];
        if (rk.sunk > 0) continue;
        rk.x += rk.vx * d; rk.y += rk.vy * d; rk.rot += rk.spin * d;
        if (rk.hot) rk.x += Math.sin(elapsed * 2 + rk.seed) * 26 * d;
        // A bounce is a moment, not a new trajectory: both axes ease back to
        // the lane the rock was given, and the spin back toward its own.
        var s = Math.min(1, C.fallSettle * d);
        rk.vy += (rk.fall - rk.vy) * s;
        rk.vx += (rk.drift - rk.vx) * s;
      }
      collideRocks(d);

      for (i = rocks.length - 1; i >= 0; i--) {
        rk = rocks[i];
        if (rk.x < Layout.left + rk.r) {
          rk.x = Layout.left + rk.r;
          rk.vx = Math.abs(rk.vx); rk.drift = Math.abs(rk.drift);
        }
        if (rk.x > Layout.right - rk.r) {
          rk.x = Layout.right - rk.r;
          rk.vx = -Math.abs(rk.vx); rk.drift = -Math.abs(rk.drift);
        }
        if (rk.y < Layout.top - 700) rk.y = Layout.top - 700;   // knocked too high

        // The base kisses the crust: the structure catches fire.
        if (!rk.burning && rk.sunk === 0 && rk.y + rk.r * 0.8 > surfaceAt(rk.x)) ignite(rk);
        if (rk.burning) rk.burn += d;

        // Then it melts, and it takes whoever is still riding it.
        if (rk.sunk > 0 || rk.burn > C.burnSeconds || rk.y - rk.r * 0.35 > surfaceAt(rk.x)) {
          if (mallow.host === rk && !dead) die();
          if (rk.sunk === 0) { splash(rk.x, rk.hot ? 8 : 14); Sound.clip("crumble", 0.24, 1.4); }
          rk.sunk += d;
          if (rk.sunk > 0.5) rocks.splice(i, 1);
          continue;
        }
      }

      spawnT -= d;
      if ((spawnT <= 0 && rocks.length < C.maxRocks) || rocks.length < C.minRocks) {
        spawnT = (C.spawnEvery + (C.spawnMin - C.spawnEvery) * k) * Rand.range(0.75, 1.25);
        spawnRock(Layout.top - 150, k);
      }

      if (dead) {
        deadT += dt;
        sink += dt * 120;                        // the body slides under the crust
        if (deadT > 1.5) finish();
        return;
      }

      // --- the marshmallow ---
      if (mallow.flying) {
        mallow.vy += C.gravity * d;
        mallow.x += mallow.vx * d; mallow.y += mallow.vy * d;
        if (mallow.x < Layout.left + C.mallowR) {
          mallow.x = Layout.left + C.mallowR; mallow.vx = -mallow.vx * C.wallBounce; bump();
        }
        if (mallow.x > Layout.right - C.mallowR) {
          mallow.x = Layout.right - C.mallowR; mallow.vx = -mallow.vx * C.wallBounce; bump();
        }
        if (mallow.y < Layout.top + C.mallowR) {
          mallow.y = Layout.top + C.mallowR; mallow.vy = -mallow.vy * C.wallBounce; bump();
        }
        mallow.ang = Math.atan2(mallow.vy, mallow.vx);

        for (i = 0; i < rocks.length; i++) {
          rk = rocks[i];
          if (rk.sunk > 0) continue;
          if (rk === mallow.ignore) continue;   // no going back to what we left
          if (hits(rk)) { attach(rk); break; }
        }
      } else if (mallow.host) {
        ride(d);
        if (mallow.host.hot) {                  // a fireball only lends its back
          mallow.hold += d;
          if (mallow.hold >= C.fireHold) {
            var a = mallow.ang;
            fling(Math.cos(a), Math.sin(a) - 0.5);
            mallow.vx *= C.fireEject / C.flingSpeed;
            mallow.vy *= C.fireEject / C.flingSpeed;
            Sound.clip("crumble", 0.6);
          }
        }
      }

      if (mallow.y + C.mallowR > surfaceAt(mallow.x)) die();
    }

    // The cave walls, rate-limited: a body pinballing in a corner would
    // otherwise fire the same clip every frame.
    function bump() {
      if (wallT > 0) return;
      wallT = 0.12;
      Sound.clip("wall", 0.3, Rand.range(0.95, 1.2));
      Fx.burst(mallow.x, mallow.y, { color:"#c9b8a0", count:5, speed:200, life:.25, grav:500, size:3 });
    }

    /* ---- sprites --------------------------------------------------------- */

    function buildSprites() { bg = null; buildFire(); }

    // The fireball halo, drawn once: a per-frame shadowBlur or radial gradient
    // for every fireball on screen is the one thing that costs a frame here.
    function buildFire() {
      var S = 168, c;
      fire = makeCanvas(S, S);
      c = fire.getContext("2d");
      var g = c.createRadialGradient(S / 2, S / 2, 2, S / 2, S / 2, S / 2);
      g.addColorStop(0, "#fffdf0");
      g.addColorStop(0.18, "#ffe08a");
      g.addColorStop(0.36, "#ff9d2e");
      g.addColorStop(0.62, "rgba(255,88,10,.45)");
      g.addColorStop(1, "rgba(255,50,0,0)");
      c.fillStyle = g;
      c.beginPath(); c.arc(S / 2, S / 2, S / 2, 0, TAU); c.fill();
    }

    function buildBackground() {
      bg = makeCanvas(view.w, view.h);
      var c = bg.getContext("2d"), i, x, h;
      var g = c.createLinearGradient(0, 0, 0, view.h);
      g.addColorStop(0, "#150912");
      g.addColorStop(0.5, "#1b0c11");
      g.addColorStop(0.84, "#2c0f0b");
      g.addColorStop(1, "#571604");
      c.fillStyle = g; c.fillRect(0, 0, view.w, view.h);

      // basalt down both edges — one jagged silhouette per side
      c.fillStyle = "rgba(9,4,8,.85)";
      wall(c, 0, 1); wall(c, view.w, -1);

      // stalactites, so the ceiling the rocks fall from is a place
      c.fillStyle = "rgba(7,3,6,.9)";
      for (i = 0; i < 9; i++) {
        x = 30 + i * (view.w - 60) / 8;
        h = 46 + ((i * 37) % 5) * 24;
        c.beginPath(); c.moveTo(x - 26, 0); c.lineTo(x + 26, 0); c.lineTo(x, h); c.closePath(); c.fill();
      }

      // the lava's bounce light on the walls
      var lg = c.createRadialGradient(view.w / 2, view.h * 1.06, 40, view.w / 2, view.h * 1.06, view.h * 0.58);
      lg.addColorStop(0, "rgba(255,120,20,.42)");
      lg.addColorStop(1, "rgba(255,60,0,0)");
      c.fillStyle = lg; c.fillRect(0, 0, view.w, view.h);
    }

    function wall(c, x0, dir) {
      var i, w;
      c.beginPath(); c.moveTo(x0, 0);
      for (i = 0; i <= 18; i++) {
        w = 14 + Math.sin(i * 1.9) * 8 + (i % 3) * 5;
        c.lineTo(x0 + dir * w, i * view.h / 18);
      }
      c.lineTo(x0, view.h); c.closePath(); c.fill();
    }

    function onResize() { geometry(); buildSprites(); }

    /* ---- render ---------------------------------------------------------- */

    function render() {
      if (!bg) buildBackground();
      ctx.drawImage(bg, 0, 0, bg._w, bg._h);
      drawEmbers();

      // A rock that caught fire keeps its silhouette and wears the flames on
      // top: it reads as "that rock is burning", not as a new object.
      var i;
      for (i = 0; i < rocks.length; i++) if (!rocks[i].hot) drawRock(rocks[i]);
      // the burning ones go over the plain ones: a rock that is about to give
      // way is the read the player needs, and array order must not bury it
      for (i = 0; i < rocks.length; i++) if (rocks[i].burning) drawRock(rocks[i]);
      for (i = 0; i < rocks.length; i++) if (rocks[i].hot) drawFire(rocks[i]);

      if (dead) drawMallow();          // sinking: the crust closes over it
      drawLava();
      if (!dead) { drawAim(); drawMallow(); }
    }

    function drawEmbers() {
      var i, e;
      for (i = 0; i < embers.length; i++) {
        e = embers[i];
        ctx.fillStyle = rgba("#ff9d2e", e.a * (0.5 + 0.5 * Math.sin(e.t)));
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
      }
    }

    function drawRock(rk) {
      var i, a, r, n = rk.shape.length;

      /* The smear behind a fast one. It is the only cue that says "this lane is
         quick" before it goes past, and it is a plain scaled arc — no
         shadowBlur, no gradient, nothing per-frame that costs a raster. */
      if (rk.vy > C.fastRead && rk.sunk === 0 && !rk.burning) {
        var tl = Math.min((rk.vy - C.fastRead) / 240, 1);
        ctx.save();
        ctx.translate(rk.x, rk.y - rk.r * 0.66);
        ctx.fillStyle = rgba("#ff8a1f", 0.13 * tl);
        ctx.scale(0.4, 1.25);
        ctx.beginPath(); ctx.arc(0, 0, rk.r, 0, TAU); ctx.fill();
        ctx.fillStyle = rgba("#ffd9a0", 0.11 * tl);
        ctx.scale(0.45, 0.8);
        ctx.beginPath(); ctx.arc(0, 0, rk.r, 0, TAU); ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.translate(rk.x, rk.y + rk.sunk * 60); ctx.rotate(rk.rot);
      ctx.beginPath();
      for (i = 0; i < n; i++) {
        a = i / n * TAU; r = rk.r * rk.shape[i];
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fillStyle = rk.used ? "#2b2530" : "#514550";
      ctx.fill();

      ctx.save(); ctx.clip();
      // lit face, from the ceiling side
      ctx.fillStyle = rk.used ? "rgba(200,180,190,.06)" : "rgba(255,214,170,.17)";
      ctx.fillRect(-rk.r, -rk.r, rk.r * 2, rk.r * 0.9);
      // a rock that caught fire is heated right through
      if (rk.burning) { ctx.fillStyle = "rgba(255,104,20,.38)"; ctx.fillRect(-rk.r, -rk.r, rk.r * 2, rk.r * 2); }
      /* The veins are the read on whether a rock still scores: molten on a
         fresh one, all but out on a claimed one. Colour alone carries it, so a
         player never has to remember where they have already been. */
      ctx.strokeStyle = rk.used ? "rgba(120,90,90,.3)" : "rgba(255,140,44,.8)";
      ctx.lineWidth = Math.max(2.5, rk.r * (rk.used ? 0.05 : 0.09));
      for (i = 0; i < rk.veins.length; i++) {
        var v = rk.veins[i];
        ctx.beginPath();
        ctx.moveTo(Math.cos(v.a) * rk.r, Math.sin(v.a) * rk.r);
        ctx.quadraticCurveTo(Math.cos(v.b) * rk.r * v.w, Math.sin(v.b) * rk.r * v.w,
                             Math.cos(v.b) * rk.r, Math.sin(v.b) * rk.r);
        ctx.stroke();
      }
      ctx.restore();

      // the silhouette, then a hot rim on top of it while the rock is unclaimed
      ctx.strokeStyle = "rgba(12,6,10,.95)";
      ctx.lineWidth = 5; ctx.stroke();
      if (!rk.used) {
        ctx.strokeStyle = "rgba(255,150,50,.5)";
        ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.restore();
    }

    function drawFire(rk) {
      var y = rk.y + rk.sunk * 60;
      var s = rk.r * rk.glow + Math.sin(wave * 4 + rk.seed) * 6;
      ctx.drawImage(fire, rk.x - s / 2, y - s / 2, s, s);
      if (rk.burning) {
        /* Tongues fanned across the upper face, each one a two-curve leaf that
           breathes on its own phase — a rock on fire, not a rock with dots. */
        var f, ph, hgt, bx, by, wd;
        for (f = 0; f < 5; f++) {
          ph = wave * 5 + rk.seed + f * 1.9;
          hgt = rk.r * (0.46 + 0.3 * Math.sin(ph));
          wd = rk.r * 0.16;
          // bases fanned along the upper edge, tallest in the middle
          bx = rk.x + (f - 2) * rk.r * 0.34;
          by = y - rk.r * (0.74 - 0.14 * Math.abs(f - 2));
          ctx.fillStyle = rgba(f % 2 ? "#ffd166" : "#ff7a1a", 0.72);
          ctx.beginPath();
          ctx.moveTo(bx - wd, by);
          ctx.quadraticCurveTo(bx - wd * 0.7, by - hgt * 0.6,
                               bx + Math.sin(ph) * rk.r * 0.14, by - hgt);
          ctx.quadraticCurveTo(bx + wd * 0.7, by - hgt * 0.6, bx + wd, by);
          ctx.closePath(); ctx.fill();
        }
      } else {
        ctx.fillStyle = "#fff6cf";
        ctx.beginPath(); ctx.arc(rk.x, y, rk.r * 0.55 + Math.sin(wave * 7 + rk.seed) * 2, 0, TAU); ctx.fill();
      }

      // the clock, drawn only while the body is riding it
      if (mallow.host === rk && mallow.hold > 0) {
        var t = 1 - clamp(mallow.hold / C.fireHold, 0, 1);
        ctx.strokeStyle = t < 0.35 ? "#ff3b30" : "#fff3dd";
        ctx.lineWidth = 7; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(rk.x, y, rk.r + 20, -Math.PI / 2, -Math.PI / 2 + TAU * t);
        ctx.stroke();
        ctx.lineCap = "butt";
      }
    }

    function drawLava() {
      var x, g;
      ctx.beginPath();
      ctx.moveTo(0, view.h);
      ctx.lineTo(0, surfaceAt(0));
      for (x = 18; x <= view.w; x += 18) ctx.lineTo(x, surfaceAt(x));
      ctx.lineTo(view.w, view.h);
      ctx.closePath();
      g = ctx.createLinearGradient(0, lavaY - 14, 0, view.h);
      g.addColorStop(0, "#ffd76a");
      g.addColorStop(0.16, "#ff8a1f");
      g.addColorStop(0.55, "#e0380a");
      g.addColorStop(1, "#7d1802");
      ctx.fillStyle = g;
      ctx.fill();

      // bubbles, clipped to the lake so they never float over a rock
      ctx.save(); ctx.clip();
      var i, b, by;
      for (i = 0; i < bubbles.length; i++) {
        b = bubbles[i];
        by = surfaceAt(b.x) + (1 - b.t) * 70;
        ctx.fillStyle = rgba("#ffe9a8", 0.5 * (1 - b.t));
        ctx.beginPath(); ctx.arc(b.x, by, b.r * (0.4 + b.t), 0, TAU); ctx.fill();
      }
      ctx.restore();

      // the crust line: the thing the player actually reads as "the floor"
      ctx.beginPath();
      ctx.moveTo(0, surfaceAt(0));
      for (x = 18; x <= view.w; x += 18) ctx.lineTo(x, surfaceAt(x));
      ctx.strokeStyle = "rgba(255,244,205,.85)";
      ctx.lineWidth = 5; ctx.stroke();
    }

    // The dotted arc, simulated with the same numbers the flight uses so the
    // preview cannot lie. Rocks are advanced too — they are all falling.
    function drawAim() {
      var v = aimVec();
      if (!v) return;
      var h = 1 / 60, n = Math.round(C.previewSeconds / h);
      var px = mallow.x, py = mallow.y;
      var vx = v.x * C.flingSpeed, vy = v.y * C.flingSpeed;
      // Whatever the body is on (or has just left) is out of the preview for
      // good, exactly as it is out of the flight.
      var skip = mallow.host || mallow.ignore, hit = null;
      var i, j, rk, sx, sy, dd, t;

      for (i = 0; i < n && !hit; i++) {
        vy += C.gravity * h; px += vx * h; py += vy * h;
        if (px < Layout.left + C.mallowR)  { px = Layout.left + C.mallowR;  vx = -vx * C.wallBounce; }
        if (px > Layout.right - C.mallowR) { px = Layout.right - C.mallowR; vx = -vx * C.wallBounce; }
        if (py < Layout.top + C.mallowR)   { py = Layout.top + C.mallowR;   vy = -vy * C.wallBounce; }
        t = i * h;
        for (j = 0; j < rocks.length; j++) {
          rk = rocks[j];
          if (rk.sunk > 0) continue;
          if (rk === skip) continue;
          sx = rk.x + rk.vx * t; sy = rk.y + rk.vy * t;
          dd = Math.hypot(px - sx, py - sy);
          if (dd < rk.r + C.mallowR) { hit = { x: px, y: py, rk: rk }; break; }
        }
        if (py > surfaceAt(px)) break;
        if (i % 3 === 0) {
          ctx.fillStyle = rgba("#fff3dd", 0.62 * (1 - i / n) + 0.12);
          ctx.beginPath(); ctx.arc(px, py, 5 - 3 * (i / n), 0, TAU); ctx.fill();
        }
      }

      if (hit) {
        ctx.strokeStyle = hit.rk.hot ? "#ff7a1a" : "#9dff8a";
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(hit.x, hit.y, 18, 0, TAU); ctx.stroke();
      }
      // where the finger is: the body goes there
      ctx.strokeStyle = "rgba(255,243,221,.9)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(aim.x, aim.y, 26, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(aim.x, aim.y, 6, 0, TAU); ctx.stroke();
    }

    function drawMallow() {
      var T = TOAST[toast], L = C.mallowLen * 0.5 - C.mallowR, R = C.mallowR;
      var y = mallow.y + sink;
      // A ring around the body while a mid-air shot is still in hand: it is the
      // only resource in the game, so it is drawn on the thing that spends it.
      if (!dead && mallow.flying && mallow.air > 0) {
        ctx.strokeStyle = rgba("#ffd166", 0.5 + 0.22 * Math.sin(wave * 6));
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(mallow.x, y, C.mallowLen * 0.5 + 9, 0, TAU); ctx.stroke();
      }
      ctx.save();
      ctx.translate(mallow.x, y); ctx.rotate(mallow.ang);
      if (dead) ctx.globalAlpha = clamp(1 - deadT / 1.4, 0, 1);

      // body: one thick round-capped stroke, plus a thinner lit one on top
      ctx.lineCap = "round";
      ctx.lineWidth = R * 2; ctx.strokeStyle = T.skin;
      ctx.beginPath(); ctx.moveTo(-L, 0); ctx.lineTo(L, 0); ctx.stroke();
      ctx.lineWidth = R * 0.9; ctx.strokeStyle = T.lit;
      ctx.beginPath(); ctx.moveTo(-L * 0.9, -R * 0.45); ctx.lineTo(L * 0.9, -R * 0.45); ctx.stroke();
      // the seam every marshmallow has
      ctx.lineWidth = 2.5; ctx.strokeStyle = rgba(T.face, 0.22);
      ctx.beginPath(); ctx.moveTo(0, -R * 0.85); ctx.lineTo(0, R * 0.85); ctx.stroke();

      // the face rides the outward end, so it always looks where it is going
      ctx.fillStyle = T.face; ctx.strokeStyle = T.face; ctx.lineWidth = 2.6;
      if (dead) {
        cross(L * 0.22, -6.5); cross(L * 0.22, 6.5);
        ctx.beginPath(); ctx.arc(L * 0.66, 0, 4.5, 0, TAU); ctx.stroke();   // an "o" mouth
      } else {
        ctx.beginPath(); ctx.arc(L * 0.22, -6.5, 3.2, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(L * 0.22, 6.5, 3.2, 0, TAU); ctx.fill();
        ctx.beginPath();
        ctx.arc(L * 0.6, 0, 6, Math.PI * 0.55, Math.PI * 1.45);            // a small smile
        ctx.stroke();
      }
      ctx.restore();
    }

    function cross(x, y) {
      var s = 3.4;
      ctx.beginPath();
      ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
      ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
      ctx.stroke();
    }

    return { reset: reset, update: update, render: render,
             onDown: onDown, onMove: onMove, onUp: onUp, onResize: onResize };
  })();
  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
    Perf.frame();    // no-op unless the URL carries ?perf=1
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
