<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maze Runner</title>
<!--
  EXAMPLE GAME — "Maze Runner"
  Mechanic: the runner auto-moves through the maze. Swipe to steer at
  junctions; it auto-follows corridors and turns corners on its own. Grab
  the coins and reach the glowing exit before time runs out.
  A recursive-backtracker maze generator makes every round different.
  Built from template/game-template.html — see docs/CREATING_A_GAME.md.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d1b2a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { display:block; touch-action:none; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; color:#fff; padding:24px; transition:opacity .25s ease; z-index:10; }
  .screen.hidden { opacity:0; pointer-events:none; }
  .title { font-size:clamp(24px,8vw,48px); font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.25); }
  .subtitle { margin-top:12px; font-size:clamp(14px,4vw,20px); opacity:.9; }
  .btn { margin-top:24px; padding:16px 36px; border:none; border-radius:999px;
    font-size:clamp(16px,5vw,22px); font-weight:800; color:#fff; cursor:pointer;
    background:linear-gradient(180deg,#41ead4,#0aa38a); box-shadow:0 8px 24px rgba(10,163,138,.5);
    animation:pulse 1.4s ease-in-out infinite; }
  .btn:active { transform:scale(.96); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  #hud { position:absolute; top:0; left:0; right:0; z-index:15; display:flex; justify-content:space-between;
    padding:14px 20px; color:#fff; font-weight:800; font-size:clamp(15px,4.5vw,22px);
    pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.4); }
  #hud.hidden { display:none; }
  #cta-bar { position:absolute; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center;
    justify-content:center; padding:12px; background:rgba(0,0,0,.35); backdrop-filter:blur(4px); }
  #cta-bar.hidden { display:none; }
  .spinner { width:46px; height:46px; border-radius:50%; border:5px solid rgba(255,255,255,.2);
    border-top-color:#fff; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="stage"><canvas id="game"></canvas></div>

<div id="hud" class="hidden">
  <div>Coins: <span id="score">0</span></div>
  <div>Time: <span id="time">0</span></div>
</div>

<div id="screen-loading" class="screen">
  <div class="spinner"></div><div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<div id="screen-intro" class="screen hidden">
  <div class="title">MAZE RUNNER</div>
  <div class="subtitle">Swipe to steer. Grab the coins<br>and reach the glowing exit!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">You escaped!</div>
  <div class="subtitle">Coins: <span id="end-score">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<script>
"use strict";
(function () {

  /* ---------- 1. CONFIG ---------- */
  var CONFIG = {
    title: "MAZE RUNNER",
    gameSeconds: 30,
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    designWidth: 720, designHeight: 1280, bg: "#0d1b2a",
    cols: 9, rows: 13,          // maze dimensions (odd-friendly, portrait)
    coins: 9,                   // coins scattered through the maze
    speedCells: 5.0             // runner speed in cells per second
  };

  /* ---------- 2. ASSETS (none — everything drawn on canvas) ---------- */
  var ASSETS = { images: {}, sounds: {} };

  /* ---------- 3. ENGINE (shared plumbing) ---------- */
  function $(id){ return document.getElementById(id); }
  var canvas=$("game"), ctx=canvas.getContext("2d");
  var view={ w:CONFIG.designWidth, h:CONFIG.designHeight, scale:1 };
  function fitCanvas(){
    var vw=window.innerWidth, vh=window.innerHeight, dpr=Math.min(window.devicePixelRatio||1,2);
    var scale=Math.min(vw/view.w, vh/view.h); view.scale=scale;
    canvas.width=Math.round(view.w*dpr); canvas.height=Math.round(view.h*dpr);
    canvas.style.width=Math.round(view.w*scale)+"px"; canvas.style.height=Math.round(view.h*scale)+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // Input: normalized mouse+touch, coordinates in design space (down/move/up).
  var Input=(function(){
    var L={down:[],move:[],up:[]};
    function toDesign(cx,cy){ var r=canvas.getBoundingClientRect();
      return { x:(cx-r.left)/r.width*view.w, y:(cy-r.top)/r.height*view.h }; }
    function emit(type,e){ var t=e.touches&&e.touches[0]?e.touches[0]:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0]:e);
      var p=toDesign(t.clientX,t.clientY); L[type].forEach(function(fn){ fn(p,e); }); }
    canvas.addEventListener("mousedown", function(e){ emit("down",e); });
    canvas.addEventListener("mousemove", function(e){ emit("move",e); });
    window.addEventListener("mouseup",   function(e){ emit("up",e); });
    canvas.addEventListener("touchstart",function(e){ e.preventDefault(); emit("down",e); }, {passive:false});
    canvas.addEventListener("touchmove", function(e){ e.preventDefault(); emit("move",e); }, {passive:false});
    canvas.addEventListener("touchend",  function(e){ e.preventDefault(); emit("up",e); }, {passive:false});
    return { on:function(type,fn){ L[type].push(fn); } };
  })();

  var Loop=(function(){
    var running=false,last=0,u=null,r=null;
    function frame(now){ if(!running)return; var dt=Math.min((now-last)/1000,0.05); last=now; if(u)u(dt); if(r)r(); requestAnimationFrame(frame); }
    return { start:function(uu,rr){ u=uu;r=rr;running=true;last=performance.now();requestAnimationFrame(frame); },
             stop:function(){ running=false; } };
  })();

  var Sound=(function(){
    var actx=null;
    function ensure(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
      if(actx&&actx.state==="suspended")actx.resume(); return actx; }
    function beep(freq,dur,type){ var a=ensure(); if(!a)return;
      var o=a.createOscillator(),g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq||440;
      g.gain.setValueAtTime(0.001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.3,a.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(dur||0.15));
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.15)); }
    return { unlock:ensure, beep:beep };
  })();

  var Store={ get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
              set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  var Rand={ range:function(a,b){ return a+Math.random()*(b-a); }, int:function(a,b){ return Math.floor(a+Math.random()*(b-a+1)); } };

  /* ---------- 4. AD NETWORK GLUE ---------- */
  var Ad=(function(){
    function platform(){ var ua=navigator.userAgent||""; if(/iPad|iPhone|iPod/.test(ua))return "ios"; if(/android/i.test(ua))return "android"; return "fallback"; }
    function targetUrl(){ return CONFIG.storeUrl[platform()]||CONFIG.storeUrl.fallback; }
    function whenReady(cb){ if(!window.mraid)return cb();
      if(mraid.getState&&mraid.getState()==="loading"){ mraid.addEventListener("ready",cb); } else cb(); }
    function openStore(){ track("cta_click"); var url=targetUrl();
      try{ if(window.mraid&&typeof mraid.open==="function"){ mraid.open(url); return; } }catch(e){}
      try{ if(typeof window.install==="function"){ window.install(); return; } }catch(e){}
      try{ if(window.ExitApi&&typeof ExitApi.exit==="function"){ ExitApi.exit(); return; } }catch(e){}
      try{ if(typeof window.mintegral_playable_exit==="function"){ window.mintegral_playable_exit(); return; } }catch(e){}
      window.open(url,"_blank"); }
    function track(ev,data){ try{ console.log("[playable]",ev,data||""); }catch(e){} }
    return { whenReady:whenReady, openStore:openStore, track:track };
  })();

  /* ---------- 5. STATE MACHINE ---------- */
  var UI={ show:function(name){ ["loading","intro","end"].forEach(function(s){ $("screen-"+s).classList.toggle("hidden",s!==name); });
      $("hud").classList.toggle("hidden",name!=="playing"); $("cta-bar").classList.toggle("hidden",name!=="playing"); },
    setScore:function(v){ $("score").textContent=v; }, setTime:function(v){ $("time").textContent=v; },
    setEnd:function(title,score){ $("end-title").textContent=title; $("end-score").textContent=score; } };
  var State="loading";
  function setState(s){ State=s; Ad.track("state",s); UI.show(s); }

  /* ---------- 6. GAME ---------- */
  var Game=(function(){
    // Four movement directions with their corresponding wall flag.
    var DIRS=[{dc:0,dr:-1,w:"n"},{dc:1,dr:0,w:"e"},{dc:0,dr:1,w:"s"},{dc:-1,dr:0,w:"w"}];
    var cols,rows,cell,offX,offY;
    var grid, player, curDir, bufDir, coins, exit, score, timeLeft, won, tAnim;

    // --- Maze generation: recursive backtracker (iterative) ---
    function genMaze(){
      grid=[];
      for(var i=0;i<cols*rows;i++) grid.push({n:true,e:true,s:true,w:true,v:false});
      function idx(c,r){ return r*cols+c; }
      var stack=[{c:0,r:0}]; grid[0].v=true;
      while(stack.length){
        var cur=stack[stack.length-1], opts=[];
        for(var d=0;d<4;d++){ var nc=cur.c+DIRS[d].dc, nr=cur.r+DIRS[d].dr;
          if(nc>=0&&nc<cols&&nr>=0&&nr<rows&&!grid[idx(nc,nr)].v) opts.push(DIRS[d]); }
        if(opts.length){
          var p=opts[Math.floor(Math.random()*opts.length)];
          var ni=idx(cur.c+p.dc,cur.r+p.dr);
          // Carve: remove the wall on both cells between them.
          grid[idx(cur.c,cur.r)][p.w]=false;
          grid[ni][{n:"s",e:"w",s:"n",w:"e"}[p.w]]=false;
          grid[ni].v=true; stack.push({c:cur.c+p.dc,r:cur.r+p.dr});
        } else stack.pop();
      }
    }

    function cellX(c){ return offX + c*cell + cell/2; }
    function cellY(r){ return offY + r*cell + cell/2; }
    function inb(c,r){ return c>=0&&c<cols&&r>=0&&r<rows; }
    function isOpenDir(c,r,d){
      for(var i=0;i<4;i++) if(DIRS[i].dc===d.dc&&DIRS[i].dr===d.dr)
        return grid[r*cols+c][DIRS[i].w]===false && inb(c+d.dc,r+d.dr);
      return false;
    }
    function same(a,b){ return a&&b&&a.dc===b.dc&&a.dr===b.dr; }

    function layout(){
      // Fit the maze inside the play area (leaving room for HUD + CTA bar).
      var padX=40, padTop=120, padBot=120;
      cell=Math.floor(Math.min((view.w-2*padX)/cols, (view.h-padTop-padBot)/rows));
      offX=Math.round((view.w-cell*cols)/2);
      offY=padTop;
    }

    function reset(){
      cols=CONFIG.cols; rows=CONFIG.rows;
      layout(); genMaze();
      score=0; timeLeft=CONFIG.gameSeconds; won=false; tAnim=0;
      curDir=null; bufDir=null;
      exit={ c:cols-1, r:rows-1 };
      player={ c:0, r:0, x:cellX(0), y:cellY(0), tc:0, tr:0 };
      // Scatter coins on random cells that are not the start or the exit.
      coins=[]; var used={"0,0":1}; used[exit.c+","+exit.r]=1;
      var tries=0;
      while(coins.length<CONFIG.coins && tries<500){
        tries++;
        var c=Rand.int(0,cols-1), r=Rand.int(0,rows-1), k=c+","+r;
        if(!used[k]){ used[k]=1; coins.push({c:c,r:r}); }
      }
      UI.setScore(0); UI.setTime(timeLeft);
    }

    // Choose the next heading when the runner reaches a cell center.
    function chooseDir(){
      var c=player.c, r=player.r;
      var rev=curDir?{dc:-curDir.dc,dr:-curDir.dr}:null;
      // 1) honor a buffered swipe if that way is open
      if(bufDir && isOpenDir(c,r,bufDir)){ curDir=bufDir; bufDir=null; return; }
      bufDir=null;
      // 2) keep going straight through corridors
      if(curDir && isOpenDir(c,r,curDir)) return;
      // 3) auto-turn: take the only sensible exit (excluding a U-turn)
      var opts=[];
      for(var i=0;i<4;i++){ var d={dc:DIRS[i].dc,dr:DIRS[i].dr};
        if(isOpenDir(c,r,d) && !(rev&&same(d,rev))) opts.push(d); }
      if(opts.length){ curDir=opts[0]; return; }
      // 4) dead-end: reverse
      if(rev && isOpenDir(c,r,rev)){ curDir=rev; return; }
      curDir=null;
    }

    function onArrive(){
      // Collect a coin on this cell.
      for(var i=0;i<coins.length;i++){ if(coins[i].c===player.c && coins[i].r===player.r){
        coins.splice(i,1); score++; UI.setScore(score); Sound.beep(720+score*20,0.08,"triangle"); break; } }
      if(player.c===exit.c && player.r===exit.r){ won=true; return end(); }
      chooseDir();
      if(curDir){ player.tc=player.c+curDir.dc; player.tr=player.r+curDir.dr; }
      else { player.tc=player.c; player.tr=player.r; }
    }

    // The runner starts moving on its own (auto-run feel).
    function onDown(){ /* steering is via swipe; tap does nothing here */ }

    function steer(dc,dr){ bufDir={dc:dc,dr:dr}; }

    function update(dt){
      tAnim+=dt;
      timeLeft-=dt; UI.setTime(Math.max(0,Math.ceil(timeLeft)));
      if(timeLeft<=0) return end();

      // On the very first frame, kick off movement from the start cell.
      if(!curDir && player.tc===player.c && player.tr===player.r) onArrive();

      var speed=CONFIG.speedCells*cell;
      var tx=cellX(player.tc), ty=cellY(player.tr);
      var dx=tx-player.x, dy=ty-player.y, dist=Math.sqrt(dx*dx+dy*dy);
      var mv=speed*dt;
      if(dist<=mv){ player.x=tx; player.y=ty; player.c=player.tc; player.r=player.tr; onArrive(); }
      else { player.x+=dx/dist*mv; player.y+=dy/dist*mv; }
    }

    function render(){
      ctx.fillStyle=CONFIG.bg; ctx.fillRect(0,0,view.w,view.h);

      // Maze floor
      ctx.fillStyle="rgba(255,255,255,.03)";
      ctx.fillRect(offX,offY,cell*cols,cell*rows);

      // Exit tile (pulsing beacon)
      var ex=offX+exit.c*cell, ey=offY+exit.r*cell;
      var glow=0.5+0.5*Math.sin(tAnim*4);
      ctx.fillStyle="rgba(65,234,212,"+(0.35+0.4*glow)+")";
      ctx.fillRect(ex+4,ey+4,cell-8,cell-8);

      // Coins
      for(var i=0;i<coins.length;i++){
        ctx.fillStyle="#ffd23f";
        ctx.beginPath(); ctx.arc(cellX(coins[i].c),cellY(coins[i].r),cell*0.18,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.7)";
        ctx.beginPath(); ctx.arc(cellX(coins[i].c)-cell*0.05,cellY(coins[i].r)-cell*0.05,cell*0.06,0,Math.PI*2); ctx.fill();
      }

      // Walls
      ctx.strokeStyle="#5ea0d6"; ctx.lineWidth=Math.max(4,cell*0.09); ctx.lineCap="round";
      ctx.beginPath();
      for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
        var g=grid[r*cols+c], x=offX+c*cell, y=offY+r*cell;
        if(g.n){ ctx.moveTo(x,y); ctx.lineTo(x+cell,y); }
        if(g.w){ ctx.moveTo(x,y); ctx.lineTo(x,y+cell); }
        if(c===cols-1 && g.e){ ctx.moveTo(x+cell,y); ctx.lineTo(x+cell,y+cell); }
        if(r===rows-1 && g.s){ ctx.moveTo(x,y+cell); ctx.lineTo(x+cell,y+cell); }
      }
      ctx.stroke();

      // Player (with a small nub showing heading)
      ctx.fillStyle="#ff5c8a";
      ctx.beginPath(); ctx.arc(player.x,player.y,cell*0.28,0,Math.PI*2); ctx.fill();
      if(curDir){ ctx.fillStyle="#fff";
        ctx.beginPath(); ctx.arc(player.x+curDir.dc*cell*0.14, player.y+curDir.dr*cell*0.14, cell*0.09,0,Math.PI*2); ctx.fill(); }
    }

    function end(){
      Loop.stop();
      Store.set("bestCoins", Math.max(score, Store.get("bestCoins",0)));
      UI.setEnd(won?"You escaped!":"Time's up!", score);
      setState("end"); Ad.track("game_end",{coins:score,won:won});
    }

    return { reset:reset, onDown:onDown, steer:steer, update:update, render:render };
  })();

  /* ---------- 7. BOOTSTRAP ---------- */
  function startGame(){ Sound.unlock(); Game.reset(); setState("playing"); Ad.track("game_start"); Loop.start(Game.update, Game.render); }

  // Swipe detection: record the press point, resolve a direction on release.
  var swipeStart=null;
  function init(){
    fitCanvas();
    Input.on("down", function(p){ if(State==="playing"){ swipeStart=p; Game.onDown(); } });
    Input.on("up", function(p){
      if(State!=="playing" || !swipeStart) return;
      var dx=p.x-swipeStart.x, dy=p.y-swipeStart.y; swipeStart=null;
      if(Math.abs(dx)<20 && Math.abs(dy)<20) return;   // ignore tiny taps
      if(Math.abs(dx)>Math.abs(dy)) Game.steer(dx>0?1:-1,0);
      else Game.steer(0,dy>0?1:-1);
    });
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);
    Ad.whenReady(function(){ setState("intro"); Ad.track("loaded"); });
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", init); } else { init(); }

})();
</script>
</body>
</html>
