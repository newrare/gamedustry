        c.restore();

        c.save(); c.scale(1, 0.94);
        // the eyeball
        c.beginPath(); c.arc(0, 0, EYE_R, 0, TAU);
        c.fillStyle = "#fffdf0"; c.fill();
        c.lineWidth = 3.4; c.strokeStyle = "rgba(3,17,12,.9)"; c.stroke();
        // the iris, low and a touch inward: an eye looking at the player
        c.beginPath(); c.arc(-R * 0.026 * s, R * 0.03, R * 0.16, 0, TAU);
        g = c.createLinearGradient(0, -R * 0.16, 0, R * 0.16);
        g.addColorStop(0, "#ffe9a3");
        g.addColorStop(1, "#e08a12");
        c.fillStyle = g; c.fill();
        // ...and the round pupil inside it
        c.beginPath(); c.arc(-R * 0.026 * s, R * 0.026, R * 0.1, 0, TAU);
        c.fillStyle = "#160a02"; c.fill();
        c.restore();

        // two catchlights, the big one up and forward: they are most of what
        // makes an eye read as alive
        c.beginPath(); c.arc(-R * 0.08, -R * 0.088, R * 0.055, 0, TAU);
        c.fillStyle = "rgba(255,255,255,.92)"; c.fill();
        c.beginPath(); c.arc(R * 0.078, R * 0.088, R * 0.028, 0, TAU);
        c.fillStyle = "rgba(255,255,255,.5)"; c.fill();
        c.restore();
      }

      // nostrils, high on the snout
      for (s = -1; s <= 1; s += 2) {
        c.beginPath(); c.arc(w * 0.24 * s, -R * 1.2, R * 0.05, 0, TAU);
        c.fillStyle = "rgba(3,17,12,.65)"; c.fill();
      }

      // the lip line, running back from the snout under each cheek
      for (s = -1; s <= 1; s += 2) {
        c.beginPath();
        c.moveTo(w * 0.2 * s, -R * 1.24);
        c.quadraticCurveTo(w * 0.86 * s, -R * 0.7, w * 0.9 * s, cheek + R * 0.28);
        c.lineWidth = 2.6; c.strokeStyle = "rgba(3,17,12,.35)"; c.stroke();
      }

      /* THE SMILE. It sits BETWEEN AND BELOW the eyes rather than out on the
         snout: this head is seen from above, and a mouth drawn where the real one
         is — forward of the eyes — reads as a frown on a forehead however it is
         curved. Below them it reads as what it is, the way the app icon draws it.
         One bowed stroke with both corners curling up, and nothing else. */
      c.lineCap = "round"; c.lineJoin = "round";
      c.strokeStyle = "rgba(3,17,12,.8)";
      c.beginPath();
      c.moveTo(-w * 0.32, -R * 0.3);
      c.quadraticCurveTo(0, R * 0.06, w * 0.32, -R * 0.3);
      c.lineWidth = R * 0.095; c.stroke();
      for (s = -1; s <= 1; s += 2) {          // the corners ride up
        c.beginPath();
        c.moveTo(w * 0.32 * s, -R * 0.3);
        c.quadraticCurveTo(w * 0.38 * s, -R * 0.37, w * 0.36 * s, -R * 0.44);
        c.lineWidth = R * 0.065; c.stroke();
      }

      skull();
      c.lineWidth = 4; c.strokeStyle = "rgba(3,17,12,.9)"; c.stroke();
      return cv;
    }

    // Sprites are tier-static: built once here, never per frame.
    function buildSkin() {
      var t, s;
      plateSprites = []; headSprites = [];
      for (t = 0; t < TIERS.length; t++) {
        plateSprites[t] = [];
        for (s = 0; s < 3; s++) plateSprites[t][s] = buildPlate(TIERS[t], s);
        headSprites[t] = buildHead(TIERS[t]);
      }
    }

    /* Per-block screen pose, rebuilt once per frame and shared by the plate
       pass, the zigzag and the armour sheen. Module-level arrays: three walks of
       the body must not allocate three arrays every frame. */
    var bsx = [], bsy = [], bang = [];

    function poseBody(n) {
      var i, fx, fy, bx, by;
      for (i = 0; i < n; i++) { bsx[i] = bodyPts[i].x; bsy[i] = sy(bodyPts[i].y); }
      for (i = 0; i < n; i++) {
        fx = bsx[i > 0 ? i - 1 : 0];         fy = bsy[i > 0 ? i - 1 : 0];
        bx = bsx[i < n - 1 ? i + 1 : n - 1]; by = bsy[i < n - 1 ? i + 1 : n - 1];
        bang[i] = Math.atan2(fy - by, fx - bx);   // headward, in screen space
      }
    }

    // The tail has to END in a tail: without this the last plate reads as a body
    // sawn off mid-stack. Drawn before the plates, so the last one laps over it.
    function drawTailTip(n) {
      var i = n - 1, r = blockRadius(i, n) * 0.6, a = bang[i] + Math.PI;   // backward
      var tx = bsx[i] + Math.cos(a) * T.block * 1.15;
      var ty = bsy[i] + Math.sin(a) * T.block * 1.15;
      var nx = -Math.sin(a), ny = Math.cos(a);
      if (ty < -110 || ty > view.h + 110) return;
      ctx.beginPath();
      ctx.moveTo(bsx[i] + nx * r, bsy[i] + ny * r);
      ctx.quadraticCurveTo(tx + nx * r * 0.35, ty + ny * r * 0.35, tx, ty);
      ctx.quadraticCurveTo(tx - nx * r * 0.35, ty - ny * r * 0.35, bsx[i] - nx * r, bsy[i] - ny * r);
      ctx.closePath();
      ctx.fillStyle = darker(TIERS[tier].stops[3], 0.78);
      ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(3,17,12,.8)"; ctx.stroke();
    }

    /* THE ZIGZAG. Vipera's signature, and the cheapest way to say "snake" in one
       glance. One polyline over the plates so the band never breaks at a seam,
       swinging flank to flank every second block, inked underneath for contrast
       against the lit ridge. */
    function drawZigzag(n) {
      var i, s, ox, oy, r = headRadius(), pass, started;
      if (n < 3) return;
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      for (pass = 0; pass < 2; pass++) {
        ctx.beginPath(); started = false;
        for (i = 1; i < n; i++) {
          s = ((i % 2) ? 1 : -1) * blockRadius(i, n) * 0.34;
          ox = bsx[i] - Math.sin(bang[i]) * s;      // lateral: the spine's normal
          oy = bsy[i] + Math.cos(bang[i]) * s;
          if (started) ctx.lineTo(ox, oy);
          else { ctx.moveTo(ox, oy); started = true; }
        }
        ctx.lineWidth = pass ? r * 0.2 : r * 0.32;
        ctx.strokeStyle = pass ? rgba(darker(TIERS[tier].stops[3], 0.55), 0.85)
                               : "rgba(2,14,9,.3)";
        ctx.stroke();
      }
    }

    /* Plated: a sheen runs the whole length of the body. The player has to be
       able to tell at a glance whether the next thorn is free or costs them half
       the viper, and the head ring alone is too easy to miss mid-weave. */
    function drawSheen(n) {
      var i, pulse = 0.55 + 0.45 * Math.sin(runT * 5);
      ctx.beginPath();
      ctx.moveTo(bsx[0], bsy[0]);
      for (i = 1; i < n; i++) ctx.lineTo(bsx[i], bsy[i]);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.lineWidth = headRadius() * 1.95;
      ctx.strokeStyle = rgba("#8dffbf", 0.06 + 0.05 * pulse);
      ctx.stroke();
    }

    // ...and a pair of counter-turning hex rings on the head, so the armour has
    // a shape of its own instead of just a colour.
    function drawAegis(hx, hy, r) {
      var i, j, a, rr, pulse = 0.5 + 0.5 * Math.sin(runT * 4.5), spin = runT * 0.9;
      for (j = 0; j < 2; j++) {
        rr = r * (j ? 2.15 : 2.6);
        ctx.beginPath();
        for (i = 0; i <= 6; i++) {
          a = (j ? -spin : spin) + i / 6 * TAU;
          if (i) ctx.lineTo(hx + Math.cos(a) * rr, hy + Math.sin(a) * rr);
          else ctx.moveTo(hx + Math.cos(a) * rr, hy + Math.sin(a) * rr);
        }
        ctx.lineWidth = j ? 3 : 5;
        ctx.strokeStyle = rgba(j ? "#d8fff0" : "#8dffbf", (j ? 0.35 : 0.5) + 0.3 * pulse);
        ctx.stroke();
      }
    }

    function drawBody() {
      var n = bodyPts.length, T2 = TIERS[tier], i, t, kx, shade;
      /* The plate is scaled ACROSS by the body's radius and ALONG by the block
         spacing, not by its own aspect: that is what fixes the exposed band at
         exactly one block, whatever the viper's girth, so the layers stay evenly
         stacked from the nape to the tail. */
      var ky = T.block * PLATE_LEN / (PLATE_F + PLATE_B);
      if (invT > 0 && Math.floor(invT * 14) % 2) return;  // blink while immune
      // dying: the tail end has already been torn off, block by block, and the
      // last of it goes with the head
      if (dieT >= 0) { n -= crumbled; if (popped || n < 1) return; }
      poseBody(n);

      /* One soft pass for the whole body, so it glows without shadowBlur — and
         as ONE stroked spine, not one disc per block: a disc bulges out at every
         joint, and that row of bulges is exactly the bead silhouette the plates
         are here to kill. */
      ctx.beginPath();
      ctx.moveTo(bsx[0], bsy[0]);
      for (i = 1; i < n; i++) ctx.lineTo(bsx[i], bsy[i]);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.lineWidth = headRadius() * 2.4;
      ctx.strokeStyle = rgba(T2.glow, 0.07);
      ctx.stroke();

      drawTailTip(n);

      // TAIL FIRST: every plate must overlap the one behind it — that ordering
      // IS the imbrication
      for (i = n - 1; i >= 1; i--) {
        if (bsy[i] < -100 || bsy[i] > view.h + 100) continue;
        t = i / Math.max(1, n - 1);
        shade = t < 0.42 ? 0 : t < 0.76 ? 1 : 2;
        kx = blockRadius(i, n) * 1.06 / PLATE_HW;
        ctx.save();
        ctx.translate(bsx[i], bsy[i]);
        ctx.rotate(bang[i] + Math.PI / 2);              // sprite forward is -y
        ctx.scale(kx, ky);
        ctx.drawImage(plateSprites[tier][shade], -PLATE_PX * 0.5, -PLATE_PX * 0.5, PLATE_PX, PLATE_PX);
        ctx.restore();
      }

      drawZigzag(n);
      if (shield) drawSheen(n);
    }

    /* The head, once the run is over: eyes crossed out at the sprite's own eye
       spots and a limp tongue hanging out of the grin. The tongue is drawn in
       SCREEN space, not in the head's — limp means "wherever down is", whatever
       the skull has rolled to. */
    function drawDeadFace(hx, hy, a, k, r) {
      var t = limpT(), s, e = EYE_R * 0.62, mx, my;
      ctx.save();
      ctx.translate(hx, hy); ctx.rotate(a); ctx.scale(k, k);
      ctx.lineCap = "round";
      for (s = -1; s <= 1; s += 2) {
        ctx.save(); ctx.translate(EYE_X * s, EYE_Y);
        ctx.beginPath(); ctx.arc(0, 0, EYE_R, 0, TAU);
        ctx.fillStyle = "#fff4de"; ctx.fill();
        ctx.lineWidth = 3.4; ctx.strokeStyle = "rgba(3,17,12,.9)"; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-e, -e); ctx.lineTo(e, e);
        ctx.moveTo(e, -e); ctx.lineTo(-e, e);
        ctx.lineWidth = EYE_R * 0.4; ctx.strokeStyle = "#1b0a10"; ctx.stroke();
        ctx.restore();
      }
      ctx.restore();

      mx = hx + Math.sin(a) * r * 1.15;
      my = hy - Math.cos(a) * r * 1.15;
      ctx.strokeStyle = "#ff5d8f"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.quadraticCurveTo(mx + 10 * t, my + 34 * t, mx - 8 * t, my + 58 * t);
      ctx.stroke();
      ctx.beginPath();                                    // the forked tip, drooping
      ctx.moveTo(mx - 8 * t, my + 58 * t);
      ctx.lineTo(mx - 20 * t, my + 70 * t);
      ctx.moveTo(mx - 8 * t, my + 58 * t);
      ctx.lineTo(mx + 2 * t, my + 74 * t);
      ctx.lineWidth = 4; ctx.stroke();
    }

    function drawHead() {
      // 1.34, not 1: a viper's head is visibly WIDER than the neck behind it,
      // and that flare is most of what stops the body reading as a worm.
      var r = headRadius(), T2 = TIERS[tier], k = r * 1.35 / HEAD_R;
      var hx = headX, hy = anchorY, a = ang, dead = dieT >= 0, lt = 0;
      var px, py, nx, ny, s;
      if (invT > 0 && Math.floor(invT * 14) % 2) return;

      /* Dying: the head shudders where it was hit, then rolls over toward the
         side it was carving and sinks as it gives up. It shrinks a little with
         it — a body going out of a creature reads as deflation. */
      if (dead) {
        if (popped) return;                               // it has burst
        lt = limpT();
        hy = deathHeadY();
        a += deathSide * 1.5 * lt
           + Math.sin(dieT * 46) * 0.07 * (1 - lt);       // the shudder, fading out
        k *= 1 - 0.08 * lt;
        r *= 1 - 0.08 * lt;
      }
      px = Math.sin(a); py = -Math.cos(a);                // heading, screen space
      nx = -py; ny = px;

      // halo — concentric discs, never shadowBlur. Kept faint: a bright disc
      // behind the skull puts the round silhouette straight back.
      ctx.fillStyle = rgba(T2.halo, 0.09);
      ctx.beginPath(); ctx.arc(hx, hy, r * 2.3, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(T2.halo, 0.13);
      ctx.beginPath(); ctx.arc(hx, hy, r * 1.6, 0, TAU); ctx.fill();

      // the tongue, flicked on every swerve — drawn first so it comes OUT of the
      // mouth instead of lying across it
      if (tongueT > 0 && !dead) {
        s = ease(tongueT / 0.26);
        ctx.strokeStyle = "#ff5d8f"; ctx.lineWidth = 5; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(hx + px * r * 1.2, hy + py * r * 1.2);
        ctx.lineTo(hx + px * r * (1.8 + s * 0.7), hy + py * r * (1.8 + s * 0.7));
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(hx + px * r * (1.8 + s * 0.7), hy + py * r * (1.8 + s * 0.7));
        ctx.lineTo(hx + px * r * (2.2 + s * 0.9) + nx * r * 0.34, hy + py * r * (2.2 + s * 0.9) + ny * r * 0.34);
        ctx.moveTo(hx + px * r * (1.8 + s * 0.7), hy + py * r * (1.8 + s * 0.7));
        ctx.lineTo(hx + px * r * (2.2 + s * 0.9) - nx * r * 0.34, hy + py * r * (2.2 + s * 0.9) - ny * r * 0.34);
        ctx.stroke();
      }

      // the skull sprite, rotated onto the heading: local -y is where it points
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(a);
      ctx.drawImage(headSprites[tier],
                    -HEAD_PX * 0.5 * k, -HEAD_PX * 0.5 * k, HEAD_PX * k, HEAD_PX * k);
      ctx.restore();

      if (dead) { drawDeadFace(hx, hy, a, k, r); return; }
      if (shield) drawAegis(hx, hy, r);
    }

    function render() {
      var z, hy;
      // Floor, corner frame and inner lip in one opaque blit — see buildBackdrop().
      ctx.drawImage(bgCv, 0, 0);

      /* Dying: the whole world is pushed in on the viper. Only the world — the Fx
         layer draws outside this transform, which is why the zoom is kept small
         enough that a burst still lands where its block was. */
      if (dieT >= 0) {
        z = 1 + 0.22 * ease(clamp(deathT() / D_POP, 0, 1));
        hy = deathHeadY();
        ctx.save();
        ctx.translate(headX, hy); ctx.scale(z, z); ctx.translate(-headX, -hy);
      }

      /* Scenery, back to front, and ALL of it under the items: whatever the
         jungle does, a gem and a thorn are still painted on top of it. */
      drawFar();
      drawSparks();
      drawFlies();
      drawBanks();
      drawWalls();
      drawItems();
      drawBody();
      drawHead();

      if (dieT >= 0) { ctx.restore(); drawDeathVeil(); }
    }

    function onResize() { metrics(); }

    return { reset: reset, update: update, render: render, onDown: onDown, onResize: onResize };
  })();

  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
