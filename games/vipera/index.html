    $("demo-caption").textContent = CONFIG.intro.caption || "";
    $("btn-start").textContent = CONFIG.copy.start;
    $("btn-cta").textContent = CONFIG.copy.ctaBar;
    $("btn-install").textContent = CONFIG.copy.ctaEnd;
    $("btn-replay").textContent = CONFIG.copy.replay;
    $("hud-score-lbl").textContent = CONFIG.copy.scoreLabel;
    $("eo-scorelbl").textContent = CONFIG.copy.endScore;
  }

  // --- End screen: the cinematic reveal ----------------------------------
  // Beats: title -> score count-up (+confetti) -> stars -> stat rows -> CTA.
  var EndScreen = (function () {
    var timers = [];
    var T_TITLE = 120, T_SCORE = 560, T_STARS = 1950, STAR_GAP = 440,
        ROW_GAP = 250, T_CTA_AFTER = 1500;
    // The reveal climbs: each star rings the same chime a step higher. RATE
    // drives the embedded "uiStar" clip, FREQ the synthesized fallback.
    var STAR_RATE = [1, 1.19, 1.42], STAR_FREQ = [660, 880, 1180];

    function countUp(el, target, dur, cb) {
      var start = performance.now();
      function step(now) {
        var p = clamp((now - start) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(e * target);
        if (p < 1) requestAnimationFrame(step);
        else { el.textContent = target; if (cb) cb(); }
      }
      requestAnimationFrame(step);
    }

    // result: { title, variant:""|"win"|"perfect", score, stars:0..3|null,
    //           rows:[{label, value, grade}] }
    function show(result) {
      timers.forEach(clearTimeout); timers = [];
      Confetti.clear();
      function T(fn, ms) { timers.push(setTimeout(fn, ms)); }

      var title = $("eo-title");
      title.textContent = result.title || CONFIG.copy.gameOver;
      title.className = "eo-title" + (result.variant ? " " + result.variant : "");
      ["eo-title", "eo-scorelbl", "eo-score"].forEach(function (id) { $(id).classList.remove("show", "pop"); });
      $("eo-score").textContent = "0";
      $("btn-install").classList.remove("show");
      $("btn-replay").classList.remove("show");

      // Stars (pass null / undefined to hide the row entirely).
      var stars = result.stars;
      var hasStars = stars != null;
      $("eo-stars").classList.toggle("hidden", !hasStars);
      for (var i = 1; i <= 3; i++) $("star-" + i).className = "star";

      // Stat rows are rebuilt every round so a replay starts clean.
      var rows = result.rows || [];
      var box = $("eo-stats"), html = "";
      rows.forEach(function (r, i) {
        var label = r.grade === "gold"
          ? '<span class="spark">✦</span> ' + r.label + ' <span class="spark">✦</span>'
          : r.label;
        html += '<div class="eo-row' + (r.grade ? " " + r.grade : "") + '" id="eo-row-' + i + '">' +
                '<span>' + label + '</span><span class="eo-val" id="eo-val-' + i + '">0</span></div>';
      });
      box.innerHTML = html;

      // 1) Title slams in.
      T(function () { title.classList.add("show"); }, T_TITLE);

      // 2) Final score counts up, greeted by confetti.
      T(function () {
        $("eo-scorelbl").classList.add("show");
        $("eo-score").classList.add("show");
        Confetti.burst(70);
        countUp($("eo-score"), result.score || 0, 1100, function () {
          $("eo-score").classList.add("pop");
          Sound.cue("uiScore", 0.8, 1, 900, 0.14);
          Confetti.burst(90);
        });
      }, T_SCORE);

      // 3) Stars slam in one by one, each with a rising chime.
      var afterStars = T_SCORE + 900;
      if (hasStars) {
        T(function () { for (var s = 1; s <= 3; s++) $("star-" + s).classList.add("dim"); }, T_STARS - 160);
        for (var si = 0; si < stars; si++) {
          (function (idx) {
            T(function () {
              var el = $("star-" + (idx + 1));
              el.classList.remove("dim"); el.classList.add("on");
              Sound.cue("uiStar", 0.75, STAR_RATE[idx] || 1.42, STAR_FREQ[idx] || 1180, 0.16);
              Confetti.burst(30);
            }, T_STARS + idx * STAR_GAP);
          })(si);
        }
        afterStars = T_STARS + Math.max(stars, 1) * STAR_GAP + 350;
      }

      // 4) Stat rows cascade in, counters animating.
      rows.forEach(function (r, i) {
        T(function () {
          $("eo-row-" + i).classList.add("show");
          var el = $("eo-val-" + i);
          if (typeof r.value === "number") countUp(el, r.value, 450);
          else el.textContent = r.value;
          Sound.cue("uiRow", 0.5, 1 + i * 0.07, 480 + i * 70, 0.05);
        }, afterStars + i * ROW_GAP);
      });

      // 5) Install CTA, then the discreet replay link.
      var ctaAt = afterStars + rows.length * ROW_GAP + T_CTA_AFTER;
      T(function () { $("btn-install").classList.add("show"); }, ctaAt);
      T(function () { $("btn-replay").classList.add("show"); }, ctaAt + 500);
    }
    return { show: show };
  })();

  // --- Round clock -------------------------------------------------------
  var Round = (function () {
    var left = 0, running = false, fired = false;
    function reset() {
      left = CONFIG.gameSeconds; running = true; fired = false;
      if (CONFIG.gameSeconds > 0) HUD.setTime(left);
    }
    function tick(dt) {
      if (!running || CONFIG.gameSeconds <= 0) return;
      left = Math.max(0, left - dt);
      HUD.setTime(left);
      if (left <= 0 && !fired) {
        fired = true;
        // The game decides what "time up" means (end now, sudden death…).
        if (Game.onTimeUp) Game.onTimeUp();
        else endRound({ title: CONFIG.copy.timeUp });
      }
    }
    return {
      reset: reset, tick: tick, stop: function () { running = false; },
      left: function () { return left; },
      elapsed: function () { return CONFIG.gameSeconds - left; }
    };
  })();

  // --- The single way a round ends ---------------------------------------
  // result: { title, variant, score, stars, rows, track }
  function endRound(result) {
    if (State === "end") return;
    result = result || {};
    Loop.stop(); Round.stop();
    Music.duck(0.55, 0.8);        // let the end-screen cues sit on top
    var score = result.score == null ? Math.round(HUD.score()) : result.score;
    var best = Math.max(score, Store.get("bestScore", 0));
    Store.set("bestScore", best);
    setState("end");
    EndScreen.show({
      title: result.title || CONFIG.copy.gameOver,
      variant: result.variant || "",
      score: score,
      stars: result.stars,
      rows: result.rows || []
    });
    Ad.track("game_end", result.track || { score: score, best: best });
  }

  /* ===================================================================
     6. GAME — VIPERA: a viper races up an endless burrow.

     STEERING. The viper never stops moving forward, and it never stops
     TURNING: it carves at `turn` rad/s toward whichever side `dir` points at,
     up to `maxAngle` off straight-up. A tap flips `dir` — that is the whole
     input. Left alone the head runs into the angle cap and hugs one diagonal;
     tapped on a rhythm it traces a sine, which is the line the burrow is
     designed around. There is no "go straight" button, and that is what makes
     one finger enough to play.

     COORDINATES. `p` is PROGRESS: world pixels travelled up the burrow. The
     head's progress IS the camera, so the head sits exactly on `anchorY` every
     frame and everything else is placed with

         sy(y) = anchorY - (y - camP)

     Items live at { p, x }: p up the burrow, x in design pixels across it.

     THE SQUEEZE. `anchorY` is a function of the body LENGTH, not of time: at 3
     blocks the head rides near the bottom with the whole screen to read ahead,
     at 16 it has climbed some 350 px and the same thorn arrives in half the
     time. Eating is at once the reward, the score and the difficulty curve —
     the player can see the ramp they are choosing.
     =================================================================== */
  var Game = (function () {
    var TAU = Math.PI * 2;
    var T = CONFIG.play;

    /* How the body evolves with its length: fatter, hotter, one tier at a
       time, so the reward lands on the character and not only in the HUD.
       `at` is the length the tier starts at. */
    var TIERS = [
      { at: 3,  name: "VIPER",   stops: ["#eaffef", "#7dffbb", "#12b86a", "#0a6d4a"], glow: "#4dff9b", halo: "#8dffbf" },
      { at: 7,  name: "ADDER",   stops: ["#f6ffe6", "#d3ff7a", "#7bc91a", "#2f6b12"], glow: "#b6ff5a", halo: "#d3ff7a" },
      { at: 11, name: "MAMBA",   stops: ["#fffbe6", "#ffd43b", "#ff9f1c", "#8a4200"], glow: "#ffb703", halo: "#ffd43b" },
      { at: 15, name: "BASILISK", stops: ["#ffffff", "#ffb0f2", "#ff2d95", "#6a0f66"], glow: "#ff2d95", halo: "#ff9ae6" }
    ];
    // Extra class per tier for the score pops, so "+40" burns the same colour
    // as the body that earned it (palettes live in the SKIN block).
    var POP_TIER = ["pop-t0", "pop-t1", "pop-t2", "pop-t3"];

    /* WHERE A CALLOUT LANDS ------------------------------------------------
       The head is the only thing the player is really reading, and the burrow
       is narrow: a callout dropped on a fixed anchor keeps landing on top of
       the viper and on the row of items about to reach it. So no Pop in this
       game uses a named anchor — every one asks popSpot() at fire time and
       gets the candidate that is furthest from the head right now.
       Fractions of the Layout band; the motor clamps x to keep the sticker on
       screen, so the outer columns can sit closer to the walls than the
       motor's own anchors do. */
    var POP_SPOTS = [
      [0.18, 0.10], [0.50, 0.08], [0.82, 0.10],
      [0.16, 0.30], [0.84, 0.30],
      [0.16, 0.52], [0.84, 0.52],
      [0.18, 0.72], [0.82, 0.72],
      [0.24, 0.88], [0.76, 0.88]
    ];
    var lastSpot = -1;
    function popSpot() {
      var bestI = 0, bestD = -1, i, s, x, y, d;
      for (i = 0; i < POP_SPOTS.length; i++) {
        s = POP_SPOTS[i];
        x = Layout.left + s[0] * Layout.w;
        y = Layout.top  + s[1] * Layout.h;
        // Horizontal clearance is worth more than vertical: the body trails
        // straight down from the head, and the next items travel down the same
        // column, so a spot on the other side of the burrow is the safe one.
        d = Math.abs(x - headX) * 1.8 + Math.abs(y - anchorY);
        // Two callouts in a row on the same spot stack on each other; make the
        // previous winner fight for it.
        if (i === lastSpot) d *= 0.5;
        if (d > bestD) { bestD = d; bestI = i; }
      }
      lastSpot = bestI;
      s = POP_SPOTS[bestI];
      return { x: Layout.left + s[0] * Layout.w, y: Layout.top + s[1] * Layout.h };
    }

    // Draw radius / hit radius per item type. The hit radius is deliberately
    // generous on the pickups and tight on the thorns: a playable should bias
    // toward the player succeeding.
    var ITEM_R  = { orb: 25, mega: 33, thorn: 30, shield: 26 };
    var ITEM_HIT = { orb: 30, mega: 38, thorn: 23, shield: 30 };

    // --- world -------------------------------------------------------------
    var items, trail, bodyPts;

    // --- run state ---------------------------------------------------------
    // len / lenF / tier carry a value from the start: fitCanvas() runs (and
    // asks the game to re-measure) before the first reset().
    var len = T.startLen, lenF = T.startLen, tier = 0;
    var camP = 0, speed = 0, runT = 0;
    var headX = 0, ang = 0, dir = 1, wallT = 0, tapT = 0;
    var score, pick, orbs, chain, bestChain, bestLen, bites;
    var venom, shield, invT, tongueT;
    var dist, nextMile;
    var nextP, lastRowP, lastPop, best;

    // --- cached per layout ---------------------------------------------------
    var anchorY = 0, pMin = 0, pMax = 0, bgGrad = null, sparks = [], wallGlow = { l: 0, r: 0 };

    function sy(y) { return anchorY - (y - camP); }
    function ease(t) { return t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t); }

    /* ====================================================================
       THE VIPER
       ==================================================================== */

    // The head's line on screen for a given body length (see THE SQUEEZE).
    function anchorFor(l) {
      var t = clamp((l - T.startLen) / (T.maxLen - T.startLen), 0, 1);
      var lo = Layout.bottom - T.anchorLow;          // 3 blocks: down here
      var hi = Layout.top + T.anchorHigh;            // full length: up there
      return lo + (hi - lo) * Math.pow(t, 0.85);     // most of the climb early
    }
    function headRadius() { return T.headR + (lenF - T.startLen) * T.headGrow; }
    function blockRadius(i, n) {
      // near-uniform body, tapering over the last third into the tail
      var t = i / Math.max(1, n - 1);
      return headRadius() * (0.92 - 0.42 * Math.pow(Math.max(0, t - 0.62) / 0.38, 1.4));
    }
    function tierFor(l) {
      var t = 0, i;
      for (i = 0; i < TIERS.length; i++) if (l >= TIERS[i].at) t = i;
      return t;
    }

    /* The trail is the body's spine: world-space breadcrumbs, head first, kept
       just long enough to lay every block out. A sample is only committed once
       the head is `sample` px away from the LAST COMMITTED one (trail[1]) —
       comparing against trail[0] would compare the head with itself. */
    function pushTrail() {
      var i, dx, dy, run = 0, need = (len + 1) * T.block + 60;
      dx = trail.length > 1 ? headX - trail[1].x : 0;
      dy = trail.length > 1 ? camP - trail[1].y : 0;
      if (trail.length < 2 || dx * dx + dy * dy >= T.sample * T.sample) trail.unshift({ x: 0, y: 0 });
      trail[0].x = headX; trail[0].y = camP;
      for (i = 1; i < trail.length; i++) {
        dx = trail[i].x - trail[i - 1].x; dy = trail[i].y - trail[i - 1].y;
        run += Math.sqrt(dx * dx + dy * dy);
        if (run > need) { trail.length = i + 1; break; }
      }
      if (trail.length > 220) trail.length = 220;
    }

    /* Place the blocks along the spine, one walk of the trail for all of them:
       block k sits k * block px of ARC LENGTH behind the head, so the body
       keeps its shape whatever the head is doing. */
    function layoutBody() {
      var n = Math.max(T.startLen, Math.round(lenF)), i, k, acc = 0, need = T.block, seg, dx, dy, t;
      while (bodyPts.length < n) bodyPts.push({ x: 0, y: 0 });
      bodyPts.length = n;
      bodyPts[0].x = trail[0].x; bodyPts[0].y = trail[0].y;
      k = 1;
      for (i = 1; i < trail.length && k < n; i++) {
        dx = trail[i].x - trail[i - 1].x; dy = trail[i].y - trail[i - 1].y;
        seg = Math.sqrt(dx * dx + dy * dy);
        while (k < n && acc + seg >= need) {
          t = seg > 0 ? (need - acc) / seg : 0;
          bodyPts[k].x = trail[i - 1].x + dx * t;
          bodyPts[k].y = trail[i - 1].y + dy * t;
          k++; need += T.block;
        }
        acc += seg;
      }
      // The spine is still shorter than the body (the frame it just grew):
      // stack what is left straight down the burrow behind the last sample.
      for (; k < n; k++) {
        bodyPts[k].x = trail[trail.length - 1].x;
        bodyPts[k].y = trail[trail.length - 1].y - (need - acc);
        need += T.block;
      }
    }

    /* A wall is a rail, not a trap: the head is stopped, the steering is
       turned away and the arc is straightened, so the player always comes back
       into play. It costs nothing but the tempo of the weave. */
    function bounce(away) {
      dir = away; ang = 0;
      if (away > 0) wallGlow.l = 1; else wallGlow.r = 1;
      if (wallT > 0) return;                        // one thud per approach
      wallT = T.wallHold;
      Fx.shake(4, 0.12);
      Fx.burst(headX, anchorY, { color: ["#8dffbf", "#ffffff"], count: 7, speed: 230,
                                 life: 0.28, size: 4, angle: away > 0 ? 0 : Math.PI, spread: 1.6 });
      Sound.clip("wall", 0.32, 1.15);
    }

    /* ====================================================================
       THE BURROW — what comes down at the viper
       ==================================================================== */

    function diff()    { return Math.min(1, dist / T.diffFull); }
    function rowChance() { return T.rowMin + (T.rowMax - T.rowMin) * diff(); }
    function rowGap()    { return T.rowFar - (T.rowFar - T.rowNear) * diff(); }
    function gateGap()   {
      var d = clamp((diff() - T.wallFrom) / (1 - T.wallFrom), 0, 1);
      return T.gapWide - (T.gapWide - T.gapTight) * d;
    }

    function push(p, x, type) { items.push({ p: p, x: x, type: type, seed: Rand.range(0, TAU) }); }

    /* A run of orbs laid on a sine — the very curve a tapping player draws, so
       eating the whole run is a rhythm rather than a chase. */
    function spawnWave(p) {
      var lo = Layout.left + T.edge + 16, hi = Layout.right - T.edge - 16;
      // centred near the viper's lane, like the gates: an orb run the player
      // cannot physically reach is scenery, not a reward
      var cx = clamp(headX + Rand.range(-230, 230), lo + 70, hi - 70);
      var amp = Math.min(Rand.range(80, 190), Math.min(cx - lo, hi - cx));
      var n = Rand.int(3, 6), step = Rand.range(98, 132), ph = Rand.range(0, TAU), k = Rand.range(0.5, 0.95), i;
      for (i = 0; i < n; i++) push(p + i * step, cx + amp * Math.sin(ph + i * k), "orb");
      nextP = p + n * step + Rand.range(150, 280);
    }

    /* THORNS. Early on they are a scatter the player weaves between; past
       `wallFrom` they line the whole burrow with a single gate, which is the
       beat the run builds towards. The gate is always at least `gateGap` wide
       and often holds a pickup: threading it has to pay, or the player only
       ever learns what NOT to do. */
    function spawnRow(p) {
      var lo = Layout.left + T.edge, hi = Layout.right - T.edge;
      var half = gateGap() * 0.5, gx, x, n, i, prev;
      if (diff() < T.wallFrom) {
        n = Rand.chance(0.35) ? 2 : 1;
        prev = -1e9;
        for (i = 0; i < n; i++) {
          x = Rand.range(lo, hi);
          if (Math.abs(x - prev) < 240) x = prev + (x > prev ? 240 : -240);
          x = clamp(x, lo, hi);
          push(p + Rand.range(-16, 16), x, "thorn");
          prev = x;
        }
      } else {
        // The gate is aimed near the head's current lane: a wall the viper
        // physically cannot reach in time is not a challenge, it is a tax.
        gx = clamp(headX + Rand.range(-300, 300), lo + half, hi - half);
        for (x = lo; x <= hi + 1; x += T.thornStep) {
          if (Math.abs(x - gx) < half) continue;
          push(p + Rand.range(-14, 14), x, "thorn");
        }
        if (Rand.chance(T.gateReward)) push(p, gx, Rand.chance(0.24) ? "shield" : "orb");
      }
      lastRowP = p;
      nextP = p + rowGap() * Rand.range(0.9, 1.3);
    }

    function spawnMega(p) {
      push(p, Rand.range(Layout.left + T.edge + 40, Layout.right - T.edge - 40), "mega");
      nextP = p + Rand.range(260, 380);
    }

    function spawnAhead(horizon) {
      var p, r;
      while (nextP < horizon) {
        p = nextP; r = Rand.range(0, 1);
        if (r < rowChance() && p - lastRowP > rowGap()) spawnRow(p);
        else if (r > 0.95) spawnMega(p);
        else spawnWave(p);
      }
    }

    function resolveItems() {
      var i, it, dx, dy, rr;
      for (i = items.length - 1; i >= 0; i--) {
        it = items[i];
        if (it.p < camP - 300) { items.splice(i, 1); continue; }
        if (it.p > camP + 220) continue;                  // still far ahead
        dx = it.x - headX; dy = it.p - camP;
        rr = headRadius() * 0.72 + ITEM_HIT[it.type];
        if (dx * dx + dy * dy <= rr * rr) { items.splice(i, 1); collect(it); }
      }
    }

    /* ====================================================================
       EATING, GROWING, GETTING BITTEN
       ==================================================================== */

    function grow(n) {
      var before = len;
      len = Math.min(T.maxLen, len + n);
      if (len > bestLen) bestLen = len;
      HUD.setLeft(len, "LENGTH");
      checkTier();
      return len - before;                              // 0 when already maxed
    }

    function checkTier() {
      var t = tierFor(len), T2;
      if (t <= tier) { tier = t; return; }
      tier = t; T2 = TIERS[tier];
      Pop.show("manifest", { word: T2.name, sub: "EVOLVED", at: popSpot() });
      Overlay.vignette(rgba(T2.halo, 0.9), 1, 620);
      Fx.flash(T2.halo, 0.22);
      Fx.ring(headX, anchorY, { from: 24, to: 210, color: T2.halo, width: 8, life: 0.5 });
      Fx.burst(headX, anchorY, { color: [T2.halo, "#ffffff"], count: 24, speed: 420, life: 0.55, size: 6 });
      HUD.punch(T2.halo);
      Sound.clip("grow", 0.85);
    }

    function collect(it) {
      var x = headX, y = anchorY, T2 = TIERS[tier], g, added;

      if (it.type === "orb" || it.type === "mega") {
        chain++;
        if (chain > bestChain) bestChain = chain;
        orbs++;
        added = grow(it.type === "mega" ? 2 : 1);
        g = it.type === "mega" ? 140 : 12 + Math.min(chain, 12) * 4;
        if (added === 0) g += 60;                       // full length: pay instead
        pick += g;
        HUD.punch(it.type === "mega" ? "#ffd43b" : T2.halo);
        // the burst wears the gem's colour, not the body's: it is the food
        // that just went off
        Fx.burst(x, y, { color: it.type === "mega" ? ["#ffd43b", "#ffffff"] : ["#4bf0ff", "#ffffff"],
                         count: it.type === "mega" ? 22 : 12,
                         speed: it.type === "mega" ? 430 : 290, life: 0.42, size: 5 });

        if (it.type === "mega") {
          Fx.ring(x, y, { from: 18, to: 150, color: "#ffd43b", width: 6, life: 0.4 });
          Pop.show("bonus", { word: "GOLD EGG", sub: "+" + g, at: popSpot() });
          Sound.clip("mega", 0.8);
        } else {
          // Orbs arrive faster than a callout can be read: one pop per quarter
          // second, and the burst plus the HUD punch carry the ones between.
          if (runT - lastPop > 0.24) {
            lastPop = runT;
            // Not at the impact point: this is the pop that fires most often,
            // and stacked over the head it is the one that blinds the player.
            Pop.show("score", { word: "+" + g, at: popSpot(), cls: POP_TIER[tier] });
          }
          Sound.clip("orb", 0.6, 1 + Math.min(chain, 14) * 0.045);
        }
        if (added === 0 && Rand.chance(0.3)) Pop.show("streak", { word: "MAX LENGTH", at: popSpot() });

        if (chain > 0 && chain % 5 === 0) {
          g = 40 * (chain / 5);
          pick += g;
          Pop.show(chain >= 25 ? "ultra" : "combo", { word: "CHAIN x" + chain, sub: "+" + g, at: popSpot() });
          Sound.clip("chain", 0.85, 1 + Math.min(chain, 24) * 0.008);
        }

      } else if (it.type === "shield") {
        shield = true;
        Pop.show("bonus", { word: "SCALES", sub: "ONE BITE", at: popSpot() });
        Fx.ring(x, y, { from: 20, to: 130, color: "#8dffbf", width: 6, life: 0.4 });
        Sound.clip("power", 0.75, 1.18);

      } else {
        bite();
      }
    }

    function bite() {
      var x = headX, y = anchorY;
      if (invT > 0) return;                              // still blinking
      chain = 0;
      Fx.burst(x, y, { color: ["#ff2d55", "#ffd43b", "#ffffff"], count: 26, speed: 470, life: 0.55, size: 6 });
      Fx.ring(x, y, { from: 18, to: 190, color: "#ff2d55", width: 8, life: 0.42 });

      if (shield) {
        shield = false; invT = 0.8;
        Fx.shake(9, 0.24); Fx.flash("#8dffbf", 0.3);
        Pop.show("alert", { word: "SCALES GONE", at: popSpot() });
        Sound.clip("bite", 0.5, 1.45);                   // the same hit, shrugged off
        return;
      }

      venom++; bites++;
      len = Math.max(T.startLen, len - 1);                // a bite costs a block
      tier = tierFor(len);
      HUD.setLeft(len, "LENGTH");
      showVenom();
      Fx.shake(17, 0.4); Fx.flash("#ff2d55", 0.45); Fx.freeze(0.06);
      Overlay.vignette("rgba(255,45,85,.9)", 1, 620);
      Sound.clip("bite", 0.9);

      if (venom >= T.venom) { die(); return; }
      invT = T.invTime;
      Pop.show("danger", { word: venom === T.venom - 1 ? "LAST BITE" : "BITTEN!",
                           sub: (T.venom - venom) + " LEFT", cls: "pop-venom", at: popSpot() });
    }

    function showVenom() {
      var s = "", i, leftPips = T.venom - venom;
      for (i = 0; i < T.venom; i++) s += i < leftPips ? "◆" : "·";
      HUD.setRight(s, "VENOM", leftPips <= 1 ? "warn" : "");
    }

    /* ====================================================================
       INPUT — one tap, one swerve
       ==================================================================== */
    function onDown() {
      // A mashed screen is still one swerve per tap: two flips inside a frame
      // would cancel each other out and read as a dead touch.
      if (tapT > 0) return;
      tapT = T.tapLock;
      dir = -dir;
      tongueT = 0.26;
      Fx.burst(headX, anchorY, { color: [TIERS[tier].halo, "#ffffff"], count: 6, speed: 210,
                                 life: 0.26, size: 4, angle: dir > 0 ? Math.PI : 0, spread: 1.5 });
      Sound.clip("turn", 0.4, dir > 0 ? 1.07 : 0.93);
    }

    /* ====================================================================
       FRAME
       ==================================================================== */
    function reset() {
      var i;
      best = Store.get("bestScore", 0);
      metrics();

      camP = 0; runT = 0; speed = T.speedMin;
      headX = Layout.cx; ang = 0; dir = Rand.chance(0.5) ? 1 : -1; wallT = 0; tapT = 0;
      len = T.startLen; lenF = len; tier = 0;
      score = 0; pick = 0; orbs = 0; chain = 0; bestChain = 0; bestLen = len; bites = 0;
      venom = 0; shield = false; invT = 0; tongueT = 0;
      dist = 0; nextMile = T.mileStep;
      items = []; bodyPts = []; nextP = 700; lastRowP = 0; lastPop = -1; lastSpot = -1;
      wallGlow.l = 0; wallGlow.r = 0;

      // Pre-lay the spine straight down the burrow so the body exists, at its
      // full length, on the very first frame.
      trail = [];
      for (i = 0; i < 90; i++) trail.push({ x: headX, y: camP - i * T.sample });

      anchorY = anchorFor(len);
      layoutBody();
      HUD.setScoreNow(0);
      HUD.setLeft(len, "LENGTH");
      showVenom();
      Fx.reset();
    }

    function update(dt) {
      var lo = Layout.left + T.edge, hi = Layout.right - T.edge;

      runT += dt;
      speed = Math.min(T.speedCap,
        T.speedMin + (T.speedMax - T.speedMin) * Math.min(1, runT / T.ramp) + (len - T.startLen) * T.lenSpeed);

      // steer: the arc always bends toward `dir`, a tap only flips the side
      ang = clamp(ang + dir * T.turn * dt, -T.maxAngle, T.maxAngle);
      headX += Math.sin(ang) * speed * dt;
      camP  += Math.cos(ang) * speed * dt;
      if (headX < lo)      { headX = lo; bounce(1); }
      else if (headX > hi) { headX = hi; bounce(-1); }

      if (wallT > 0) wallT -= dt;
      if (tapT > 0) tapT -= dt;
      if (invT > 0) invT -= dt;
      if (tongueT > 0) tongueT -= dt;
      wallGlow.l = Math.max(0, wallGlow.l - dt * 2.6);
      wallGlow.r = Math.max(0, wallGlow.r - dt * 2.6);

      // the body follows the head, and the head line follows the body length
      pushTrail();
      lenF += (len - lenF) * Math.min(1, dt * 6);
      anchorY += (anchorFor(lenF) - anchorY) * Math.min(1, dt * T.anchorEase);
      layoutBody();

      // the visible progress window
      pMin = camP - (view.h - anchorY) - 200;
      pMax = camP + anchorY + 200;

      spawnAhead(camP + T.ahead);
      resolveItems();

      dist = camP / T.pxPerM;
      score = pick + Math.floor(dist);
      HUD.setScore(score);

      if (dist >= nextMile) {
        nextMile += T.mileStep;
        Pop.show("ribbon", { word: Math.round(dist) + " M", sub: "DEEPER", at: popSpot() });
        Overlay.vignette(rgba(TIERS[tier].halo, 0.7), 1, 420);
        Sound.clip("chain", 0.6, 0.82);
      }
    }

    function die() {
      var d = Math.floor(dist), sc = pick + d;
      var st = sc >= 1800 ? 3 : sc >= 800 ? 2 : 1;
      endRound({
        title: st === 3 ? "APEX VIPER!" : st === 2 ? "GREAT RUN!" : CONFIG.copy.gameOver,
        variant: st === 3 ? "perfect" : st === 2 ? "win" : "",
        score: sc,
        stars: st,
        rows: [
          { label: "LONGEST BODY", value: bestLen + " BLOCKS", grade: "accent" },
          { label: "EATEN", value: orbs },
          { label: "DISTANCE (M)", value: d },
          { label: "BEST CHAIN", value: bestChain, grade: "accent" },
          { label: "BEST SCORE", value: Math.max(sc, best), grade: "gold" }
        ]
      });
    }

    /* ====================================================================
       RENDER
       ==================================================================== */

    function metrics() {
      anchorY = anchorFor(len);
      bgGrad = ctx.createRadialGradient(view.w * 0.5, view.h * 0.26, 40, view.w * 0.5, view.h * 0.4, view.h * 0.98);
      bgGrad.addColorStop(0, "#0f3d2c");
      bgGrad.addColorStop(0.55, "#07231a");
      bgGrad.addColorStop(1, "#020c08");
      buildSparks();
    }

    /* Background: far spores for depth, near streaks for speed. Both scroll
       off camP with their own parallax and wrap on the frame height. */
    function buildSparks() {
      var i, spore;
      sparks = [];
      for (i = 0; i < 72; i++) {
        spore = i < 50;
        sparks.push({
          x: Rand.range(0, view.w),
          y: Rand.range(0, view.h + 80),
          w: spore ? Rand.range(2, 3.6) : 2,
          h: spore ? Rand.range(2, 3.6) : Rand.range(40, 120),
          par: spore ? Rand.range(0.14, 0.4) : Rand.range(0.85, 1.3),
          a: spore ? Rand.range(0.18, 0.5) : Rand.range(0.05, 0.12)
        });
      }
    }

    function drawSparks() {
      var span = view.h + 80, i, s, y;
      ctx.fillStyle = "#b9ffdb";
      for (i = 0; i < sparks.length; i++) {
        s = sparks[i];
        y = (s.y + camP * s.par) % span;                 // the world scrolls DOWN
        if (y < 0) y += span;
        ctx.globalAlpha = s.a;
        ctx.fillRect(s.x, y - 40, s.w, s.h);
      }
      ctx.globalAlpha = 1;
    }

    /* The burrow walls. Almost subliminal at rest, they flare on the side the
       head just brushed — a rail the player can see is never a surprise. */
    function drawWalls() {
      var x0 = Layout.left + T.edge, x1 = Layout.right - T.edge;
      var y0 = Layout.top - 40, y1 = view.h;
      var breathe = 0.06 + 0.02 * Math.sin(runT * 2), i, x, g;
      for (i = 0; i < 2; i++) {
        x = i ? x1 : x0; g = i ? wallGlow.r : wallGlow.l;
        if (g > 0) {
          ctx.strokeStyle = rgba("#4dff9b", 0.28 * g); ctx.lineWidth = 16;
          ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
        }
        ctx.strokeStyle = rgba("#8dffbf", breathe + 0.6 * g); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      }
    }

    /* A soft glow behind an item. A radial gradient, not stacked flat discs: a
       hard-edged disc over the dark burrow reads as a plate rather than light.
       Only a handful of items are ever on screen, so building the gradient per
       draw is cheaper than caching one sprite per colour. */
    function halo(x, y, r, col) {
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(col, 0.5));
      g.addColorStop(0.42, rgba(col, 0.16));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    function spiked(x, y, n, ro, ri, fill, ink, rot) {
      var i, a, r;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.beginPath();
      for (i = 0; i < n * 2; i++) {
        a = (i / (n * 2)) * TAU;
        r = i % 2 ? ri : ro;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = Math.max(3.5, ro * 0.13); ctx.strokeStyle = ink; ctx.stroke();
      ctx.restore();
    }
    /* A gem. The gradient is built INSIDE the rotated frame, so the shading
       spins with the stone (a free glint) instead of being dragged out of the
       shape by the transform. */
    function gem(x, y, r, rot, top, mid, bot, ink) {
      var g;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      g = ctx.createLinearGradient(0, -r, 0, r);
      g.addColorStop(0, top);
      if (mid) g.addColorStop(0.5, mid);
      g.addColorStop(1, bot);
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.72, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.72, 0);
      ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = Math.max(3.5, r * 0.2); ctx.strokeStyle = ink; ctx.stroke();
      ctx.restore();
    }

    function drawItem(it, x, y) {
      var pu;
      /* Food is a GEM, never a bead: the viper is itself a chain of green
         spheres, and an edible sphere would read as a piece of the body. The
         cyan against an all-green burrow is the same call. */
      if (it.type === "orb") {
        pu = 1 + Math.sin(runT * 4 + it.seed) * 0.06;
        halo(x, y, 40 * pu, "#4bf0ff");
        gem(x, y, ITEM_R.orb * pu, runT * 1.5 + it.seed, "#ffffff", null, "#12b8d8", "rgba(2,20,26,.8)");

      } else if (it.type === "mega") {
        pu = 1 + Math.sin(runT * 5 + it.seed) * 0.08;
        halo(x, y, 58 * pu, "#ffd43b");
        gem(x, y, ITEM_R.mega * pu, -runT * 1.2 + it.seed, "#fffbe8", "#ffd43b", "#ff9f1c", "#2b1a00");

      } else if (it.type === "thorn") {
        // the hazard has to be the loudest thing in the burrow: it is the only
        // item the player MUST read in time
        pu = 1 + Math.sin(runT * 7 + it.seed) * 0.09;
        halo(x, y, 62 * pu, "#ff2d55");
        spiked(x, y, 8, ITEM_R.thorn * pu * 1.35, 18, "#2a0410", "#ff2d55", runT * 1.1 + it.seed);
        ctx.fillStyle = "#ff2d55";
        ctx.beginPath(); ctx.arc(x, y, 13, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffe3ea";
        ctx.beginPath(); ctx.arc(x, y, 5.5, 0, TAU); ctx.fill();

      } else {                                            // shield
        halo(x, y, 48, "#8dffbf");
        spiked(x, y, 6, 30, 26, "#062a1c", "#8dffbf", Math.PI / 6);
        ctx.fillStyle = "#d8fff0";
        ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill();
      }
    }

    function drawItems() {
      var i, it, y;
      for (i = 0; i < items.length; i++) {
        it = items[i];
        if (it.p < pMin || it.p > pMax) continue;
        y = sy(it.p);
        if (y < -70 || y > view.h + 70) continue;
        drawItem(it, it.x, y);
      }
    }

    function drawBody() {
      var n = bodyPts.length, cols = TIERS[tier].stops, glow = TIERS[tier].glow;
      var i, p, y, r, t;
      if (invT > 0 && Math.floor(invT * 14) % 2) return;  // blink while immune

      // one soft pass for the whole body, so it glows without shadowBlur
      ctx.fillStyle = rgba(glow, 0.09);
      for (i = n - 1; i >= 1; i--) {
        p = bodyPts[i]; y = sy(p.y);
        if (y < -70 || y > view.h + 70) continue;
        r = blockRadius(i, n);
        ctx.beginPath(); ctx.arc(p.x, y, r * 1.6, 0, TAU); ctx.fill();
      }
      // tail first, so every block overlaps the one behind it
      for (i = n - 1; i >= 1; i--) {
        p = bodyPts[i]; y = sy(p.y);
        if (y < -70 || y > view.h + 70) continue;
        t = i / Math.max(1, n - 1);
        r = blockRadius(i, n);
        ctx.fillStyle = cols[Math.min(cols.length - 1, Math.floor(t * cols.length))];
        ctx.beginPath(); ctx.arc(p.x, y, r, 0, TAU); ctx.fill();
        ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(3,17,12,.75)";
        ctx.beginPath(); ctx.arc(p.x, y, r, 0, TAU); ctx.stroke();
        // the scale: a small light dot, brightest near the head
        ctx.fillStyle = rgba("#ffffff", 0.3 * (1 - t));
        ctx.beginPath(); ctx.arc(p.x - r * 0.28, y - r * 0.3, r * 0.26, 0, TAU); ctx.fill();
      }
      if (shield) {
        p = bodyPts[0];
        ctx.lineWidth = 4; ctx.strokeStyle = rgba("#8dffbf", 0.8);
        ctx.beginPath(); ctx.arc(p.x, sy(p.y), headRadius() * 1.6, 0, TAU); ctx.stroke();
      }
    }

    function drawHead() {
      var r = headRadius(), T2 = TIERS[tier];
      var hx = headX, hy = anchorY;
      var px = Math.sin(ang), py = -Math.cos(ang);        // heading, screen space
      var nx = -py, ny = px, s, ex, ey, g;
      if (invT > 0 && Math.floor(invT * 14) % 2) return;

      // halo — concentric discs, never shadowBlur
      ctx.fillStyle = rgba(T2.halo, 0.16);
      ctx.beginPath(); ctx.arc(hx, hy, r * 2, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(T2.halo, 0.22);
      ctx.beginPath(); ctx.arc(hx, hy, r * 1.45, 0, TAU); ctx.fill();

      // the tongue, flicked on every swerve
      if (tongueT > 0) {
        s = ease(tongueT / 0.26);
        ctx.strokeStyle = "#ff5d8f"; ctx.lineWidth = 5; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(hx + px * r * 0.8, hy + py * r * 0.8);
        ctx.lineTo(hx + px * r * (1.1 + s * 0.7), hy + py * r * (1.1 + s * 0.7));
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(hx + px * r * (1.1 + s * 0.7), hy + py * r * (1.1 + s * 0.7));
        ctx.lineTo(hx + px * r * (1.5 + s * 0.9) + nx * r * 0.34, hy + py * r * (1.5 + s * 0.9) + ny * r * 0.34);
        ctx.moveTo(hx + px * r * (1.1 + s * 0.7), hy + py * r * (1.1 + s * 0.7));
        ctx.lineTo(hx + px * r * (1.5 + s * 0.9) - nx * r * 0.34, hy + py * r * (1.5 + s * 0.9) - ny * r * 0.34);
        ctx.stroke();
      }

      // the head itself, lit from the direction it is going
      g = ctx.createRadialGradient(hx + px * r * 0.3, hy + py * r * 0.3, r * 0.1, hx, hy, r * 1.05);
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.42, T2.stops[1]);
      g.addColorStop(1, T2.stops[2]);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(hx, hy, r * 1.05, 0, TAU); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(3,17,12,.85)";
      ctx.beginPath(); ctx.arc(hx, hy, r * 1.05, 0, TAU); ctx.stroke();

      // eyes, looking where it is heading
      for (s = -1; s <= 1; s += 2) {
        ex = hx + px * r * 0.32 + nx * r * 0.46 * s;
        ey = hy + py * r * 0.32 + ny * r * 0.46 * s;
        ctx.fillStyle = "#04120c";
        ctx.beginPath(); ctx.arc(ex, ey, r * 0.22, 0, TAU); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(ex + px * r * 0.07, ey + py * r * 0.07 - r * 0.06, r * 0.08, 0, TAU); ctx.fill();
      }
    }

    function render() {
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, view.w, view.h);
      drawSparks();
      drawWalls();
      drawItems();
      drawBody();
      drawHead();
    }

    function onResize() { metrics(); }

    return { reset: reset, update: update, render: render, onDown: onDown, onResize: onResize };
  })();

  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
