<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sunset Sprint</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #2b1055;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the square-ish play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; text-shadow: 0 3px 10px rgba(0,0,0,.35); }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .9; }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #3a1400; cursor: pointer;
    background: linear-gradient(180deg, #ffd66b, #ff9a3c);
    box-shadow: 0 8px 24px rgba(255,140,20,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  /* ---- Persistent CTA banner (visible during gameplay, common in playables) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, best) ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(15px, 4.5vw, 22px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP  (structure of the creative)
     - #stage/#game : the canvas the game renders into.
     - #hud         : in-game score / best.
     - .screen      : one overlay per game state (intro, end).
     - #cta-bar     : always-available install button.
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Score: <span id="score">0</span></div>
  <div id="hud-right">Best: <span id="time">0</span></div>
</div>

<!-- Loading screen: shown until assets + ad container are ready -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<!-- Intro screen: title + start button -->
<div id="screen-intro" class="screen hidden">
  <div class="title">GAME TITLE</div>
  <div class="subtitle">Tap to jump. Dodge obstacles. Grab coins!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<!-- End screen: result + primary CTA to the store -->
<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice!</div>
  <div class="subtitle" id="end-subtitle">You scored <span id="end-score">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<!-- Persistent CTA (hidden until gameplay begins) -->
<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined)
     Organized top-to-bottom in clearly labeled sections so a new game can
     be produced by editing mostly the CONFIG + GAME sections and leaving
     the ENGINE / AD glue untouched.
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     The knobs a new game changes first. Copy of business/creative params.
     =================================================================== */
  var CONFIG = {
    title: "SUNSET SPRINT",
    gameSeconds: 0,                // endless — the run only ends on a crash
    // Store links used by the CTA. The correct one is chosen at runtime.
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    // Design resolution — the game logic is authored against this virtual
    // size, then the canvas is scaled to fit any screen (see fitCanvas()).
    designWidth: 720,
    designHeight: 1280,
    bg: "#2b1055",

    // --- Endless runner tunables ---
    groundY: 1080,             // y of the ground surface (top of the ground band)
    playerX: 170,              // fixed screen x of the runner
    playerW: 78,
    playerH: 104,
    gravity: 2700,             // px/s^2
    jumpVelocity: -980,        // first jump impulse
    doubleJumpVelocity: -840,  // forgiving second jump impulse
    baseSpeed: 360,            // starting scroll speed, px/s
    maxSpeedBonus: 420,        // speed ramps up to baseSpeed + this
    speedRampPerSec: 6,        // how fast the ramp bonus accrues
    obstacleGapMin: 1.05,      // seconds between obstacle spawns (time-based
    obstacleGapMax: 1.6,       // so spacing stays jumpable at any speed)
    coinGapMin: 1.4,
    coinGapMax: 2.2
  };

  /* ===================================================================
     2. ASSETS  (embedded, no network requests)
     Register every asset as a data URI so the file stays self-contained.
     Use tools/embed-asset.mjs to generate these strings.
     Prefer CSS/canvas drawing & WebAudio synth over binary assets to stay
     well under the 5 MB budget; only embed images/sounds you truly need.
     =================================================================== */
  var ASSETS = {
    images: {
      // logo: "data:image/png;base64,iVBORw0KGgo..."
    },
    sounds: {
      // pop: "data:audio/mp3;base64,SUQzBAAAAAA..."
    }
  };

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  // We render at CONFIG.designWidth x designHeight and letterbox-fit the
  // canvas to the viewport using CSS, accounting for devicePixelRatio so
  // drawing stays crisp on retina screens.
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    // Backing store size (crisp), CSS size (fit).
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  // Handles mouse + touch. Coordinates are converted from screen pixels to
  // the virtual design space so game logic never worries about scaling.
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  // Generates simple tones so you get sound without embedding audio files.
  // For richer sound, put base64 clips in ASSETS.sounds and play via Audio.clip.
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      // iOS requires resume() inside a user gesture.
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     Playable ads run inside a network's iframe. We must:
       - wait for the ad container ("mraid") to be ready before starting,
       - route the install button through the network's open() when present,
       - report standard lifecycle events for analytics/QA.
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    // Resolve when the creative may start drawing/interacting.
    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    // The single entry point for "user wants the app". Order matters:
    // MRAID first, then common network globals, then a plain window.open.
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}       // ironSource / generic
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {} // Google Ads
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    // Lightweight event hook. Swap console.log for a network SDK call if needed.
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     States: loading -> intro -> playing -> end. UI.show() toggles overlays.
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      // HUD + CTA bar are only visible during play.
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; }, // repurposed as "Best" for this game
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME  (the part a new prompt mostly rewrites)
     Everything above is reusable plumbing. A concrete game implements:
       Game.reset()            -> initialize round state
       Game.onDown(p)          -> pointer input (design coords)
       Game.update(dt)         -> advance simulation (seconds)
       Game.render()           -> draw a frame (design coords)
       Game.onEnd()            -> compute result before end screen
     ENDLESS RUNNER: the character runs in place at a fixed x while the
     ground and parallax scenery scroll left to right->left, creating the
     illusion of forward motion. Tap anywhere to jump (a forgiving double
     jump is allowed). Obstacles scroll in and must be jumped over; coins
     float by for bonus points. The run is endless — speed ramps up over
     time and the score grows with distance + coins collected.
     =================================================================== */
  var Game = (function () {
    var C = CONFIG;
    var player, obstacles, coins, particles;
    var elapsed, distance, coinsCollected, score, best;
    var speed;
    var obstacleTimer, coinTimer;
    var bgFarOffset, bgNearOffset, groundOffset;
    var runPhase;

    function reset() {
      player = {
        x: C.playerX, y: C.groundY - C.playerH,
        w: C.playerW, h: C.playerH,
        vy: 0, grounded: true, jumpsUsed: 0,
        scaleX: 1, scaleY: 1,     // squash/stretch, eases back to 1
        dustTimer: 0
      };
      obstacles = [];
      coins = [];
      particles = [];
      elapsed = 0; distance = 0; coinsCollected = 0; score = 0;
      speed = C.baseSpeed;
      obstacleTimer = Rand.range(C.obstacleGapMin, C.obstacleGapMax);
      coinTimer = Rand.range(C.coinGapMin, C.coinGapMax);
      bgFarOffset = 0; bgNearOffset = 0; groundOffset = 0;
      runPhase = 0;
      best = Store.get("endlessRunnerBest", 0);
      UI.setScore(0);
      UI.setTime(best);
    }

    // --- particles: dust puffs on jump/land, sparkle on coin pickup ---
    function spawnDust(x, y, count, spread) {
      for (var i = 0; i < count; i++) {
        particles.push({
          x: x + Rand.range(-spread, spread), y: y,
          vx: Rand.range(-70, 70) - speed * 0.15,
          vy: Rand.range(-160, -30),
          r: Rand.range(4, 9),
          life: Rand.range(0.25, 0.45), age: 0,
          color: "224,214,255"
        });
      }
    }
    function spawnSparkle(x, y) {
      for (var i = 0; i < 8; i++) {
        var a = (Math.PI * 2 * i) / 8;
        particles.push({
          x: x, y: y,
          vx: Math.cos(a) * 220, vy: Math.sin(a) * 220,
          r: Rand.range(3, 6),
          life: 0.4, age: 0,
          color: "255,214,107"
        });
      }
    }

    // --- jump handling (called from onDown) ----------------------------
    function doJump() {
      if (player.jumpsUsed >= 2) return;
      var first = player.jumpsUsed === 0;
      player.vy = first ? C.jumpVelocity : C.doubleJumpVelocity;
      player.jumpsUsed++;
      player.grounded = false;
      player.scaleX = 0.78; player.scaleY = 1.28; // stretch on takeoff
      Sound.beep(first ? 520 : 700, 0.09, "square");
      spawnDust(player.x + player.w * 0.5, C.groundY, 10, 18);
    }

    function onDown(p) { doJump(); }

    // --- obstacle & coin spawning ---------------------------------------
    var OBSTACLE_KINDS = ["block", "spike", "tall"];
    function spawnObstacle() {
      var kind = elapsed > 8 ? Rand.pick(OBSTACLE_KINDS) : Rand.pick(["block", "spike"]);
      var w, h;
      if (kind === "block")      { w = Rand.range(56, 76); h = Rand.range(70, 110); }
      else if (kind === "spike") { w = Rand.range(60, 80); h = Rand.range(90, 120); }
      else /* tall */            { w = Rand.range(60, 74); h = Rand.range(150, 190); }
      obstacles.push({ x: view.w + w, y: C.groundY - h, w: w, h: h, kind: kind, passed: false });
    }
    function spawnCoin() {
      var high = Math.random() < 0.55;
      var y = high ? (C.groundY - Rand.range(230, 300)) : (C.groundY - Rand.range(40, 70));
      coins.push({ x: view.w + 20, y: y, r: 17, spin: Rand.range(0, Math.PI * 2), taken: false });
    }

    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function update(dt) {
      elapsed += dt;
      speed = C.baseSpeed + Math.min(C.maxSpeedBonus, elapsed * C.speedRampPerSec);
      distance += speed * dt;

      // --- physics ---
      player.vy += C.gravity * dt;
      player.y += player.vy * dt;
      var floorY = C.groundY - player.h;
      if (player.y >= floorY) {
        var wasAirborne = !player.grounded;
        player.y = floorY; player.vy = 0;
        if (wasAirborne) {
          player.scaleX = 1.3; player.scaleY = 0.72; // squash on landing
          spawnDust(player.x + player.w * 0.5, C.groundY, 12, 22);
        }
        player.grounded = true;
        player.jumpsUsed = 0;
      } else {
        player.grounded = false;
      }
      // ease squash/stretch back to normal
      player.scaleX += (1 - player.scaleX) * Math.min(1, dt * 10);
      player.scaleY += (1 - player.scaleY) * Math.min(1, dt * 10);

      if (player.grounded) {
        runPhase += dt * (6 + speed * 0.01);
        player.dustTimer -= dt;
        if (player.dustTimer <= 0) {
          player.dustTimer = 0.11;
          spawnDust(player.x + player.w * 0.35, C.groundY, 1, 6);
        }
      }

      // --- obstacles ---
      obstacleTimer -= dt;
      if (obstacleTimer <= 0) {
        spawnObstacle();
        obstacleTimer = Rand.range(C.obstacleGapMin, C.obstacleGapMax);
      }
      var pLeft = player.x + 14, pRight = player.x + player.w - 14;
      var pTop = player.y + 10, pBottom = player.y + player.h;
      for (var i = obstacles.length - 1; i >= 0; i--) {
        var o = obstacles[i];
        o.x -= speed * dt;
        if (o.x + o.w < -10) { obstacles.splice(i, 1); continue; }
        if (rectsOverlap(pLeft, pTop, pRight - pLeft, pBottom - pTop, o.x + 6, o.y + 4, o.w - 12, o.h - 4)) {
          return end();
        }
      }

      // --- coins ---
      coinTimer -= dt;
      if (coinTimer <= 0) {
        spawnCoin();
        coinTimer = Rand.range(C.coinGapMin, C.coinGapMax);
      }
      var pcx = player.x + player.w * 0.5, pcy = player.y + player.h * 0.5;
      for (var j = coins.length - 1; j >= 0; j--) {
        var c = coins[j];
        c.x -= speed * dt;
        c.spin += dt * 6;
        if (c.x < -30) { coins.splice(j, 1); continue; }
        if (!c.taken) {
          var dx = c.x - pcx, dy = c.y - pcy, rr = c.r + 34;
          if (dx * dx + dy * dy <= rr * rr) {
            c.taken = true;
            coinsCollected++;
            score += 25;
            Sound.beep(880, 0.08, "triangle");
            spawnSparkle(c.x, c.y);
            coins.splice(j, 1);
          }
        }
      }

      // --- particles ---
      for (var k = particles.length - 1; k >= 0; k--) {
        var pt = particles[k];
        pt.age += dt;
        if (pt.age >= pt.life) { particles.splice(k, 1); continue; }
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vy += 500 * dt;
      }

      // --- parallax scroll offsets ---
      bgFarOffset  = (bgFarOffset  + speed * 0.15 * dt) % 360;
      bgNearOffset = (bgNearOffset + speed * 0.45 * dt) % 240;
      groundOffset = (groundOffset + speed * dt) % 60;

      // --- score ---
      score = Math.floor(distance / 9) + coinsCollected * 25;
      UI.setScore(score);
    }

    // ------------------------------------------------------------------
    // RENDER
    // ------------------------------------------------------------------
    function drawSky() {
      var g = ctx.createLinearGradient(0, 0, 0, C.groundY);
      g.addColorStop(0, "#2b1055");
      g.addColorStop(0.55, "#7b2f6e");
      g.addColorStop(1, "#ff8a4c");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, view.w, C.groundY);

      // sun
      ctx.fillStyle = "rgba(255, 232, 170, 0.9)";
      ctx.beginPath(); ctx.arc(view.w - 150, 260, 90, 0, Math.PI * 2); ctx.fill();
    }

    function drawFarHills() {
      ctx.fillStyle = "rgba(60, 25, 70, 0.85)";
      var tile = 360, y0 = C.groundY - 40;
      for (var i = -1; i <= Math.ceil(view.w / tile) + 1; i++) {
        var x = i * tile - bgFarOffset;
        ctx.beginPath();
        ctx.moveTo(x, y0);
        ctx.quadraticCurveTo(x + tile * 0.5, y0 - 170, x + tile, y0);
        ctx.lineTo(x + tile, C.groundY);
        ctx.lineTo(x, C.groundY);
        ctx.closePath(); ctx.fill();
      }
    }

    function drawNearHills() {
      ctx.fillStyle = "rgba(90, 35, 60, 0.9)";
      var tile = 240, y0 = C.groundY - 10;
      for (var i = -1; i <= Math.ceil(view.w / tile) + 1; i++) {
        var x = i * tile - bgNearOffset;
        ctx.beginPath();
        ctx.moveTo(x, y0);
        ctx.quadraticCurveTo(x + tile * 0.5, y0 - 90, x + tile, y0);
        ctx.lineTo(x + tile, C.groundY);
        ctx.lineTo(x, C.groundY);
        ctx.closePath(); ctx.fill();
      }
    }

    function drawGround() {
      ctx.fillStyle = "#3a1f2e";
      ctx.fillRect(0, C.groundY, view.w, view.h - C.groundY);
      // scrolling dashed stripe for a motion cue
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      var tile = 60;
      for (var x = -tile + (-groundOffset % tile); x < view.w; x += tile) {
        ctx.fillRect(x, C.groundY + 14, 30, 8);
      }
      ctx.fillStyle = "#241320";
      ctx.fillRect(0, C.groundY - 6, view.w, 6);
    }

    function drawObstacle(o) {
      if (o.kind === "spike") {
        ctx.fillStyle = "#e6e6f0";
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + o.h);
        ctx.lineTo(o.x + o.w * 0.5, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2; ctx.stroke();
      } else {
        ctx.fillStyle = o.kind === "tall" ? "#5b3a86" : "#8a4fae";
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(o.x, o.y, o.w, 8);
        ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      }
    }

    function drawCoin(c) {
      ctx.save();
      ctx.translate(c.x, c.y);
      var squeeze = Math.abs(Math.cos(c.spin));
      ctx.scale(Math.max(0.25, squeeze), 1);
      ctx.fillStyle = "#ffd66b";
      ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff9a3c";
      ctx.beginPath(); ctx.arc(0, 0, c.r * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawParticles() {
      for (var i = 0; i < particles.length; i++) {
        var pt = particles[i];
        var alpha = 1 - pt.age / pt.life;
        ctx.fillStyle = "rgba(" + pt.color + "," + alpha.toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * alpha, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawPlayer() {
      var cx = player.x + player.w * 0.5;
      var footY = player.y + player.h; // squash/stretch pivots at the feet
      ctx.save();
      ctx.translate(cx, footY);
      ctx.scale(player.scaleX, player.scaleY);
      ctx.translate(-cx, -footY);

      // legs (simple running animation while grounded)
      var legSwing = player.grounded ? Math.sin(runPhase) * 22 : 6;
      ctx.strokeStyle = "#2a1638"; ctx.lineWidth = 10; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx - 14, footY - 30); ctx.lineTo(cx - 14 + legSwing, footY);
      ctx.moveTo(cx + 14, footY - 30); ctx.lineTo(cx + 14 - legSwing, footY);
      ctx.stroke();

      // body
      var bodyTop = player.y + player.h * 0.18;
      ctx.fillStyle = "#ff6f61";
      roundRect(cx - player.w * 0.36, bodyTop, player.w * 0.72, player.h * 0.55, 16);
      ctx.fill();

      // head
      ctx.fillStyle = "#ffd6a5";
      ctx.beginPath();
      ctx.arc(cx, player.y + player.h * 0.14, player.w * 0.30, 0, Math.PI * 2);
      ctx.fill();

      // eye (faces direction of travel, i.e. forward/right)
      ctx.fillStyle = "#2a1638";
      ctx.beginPath();
      ctx.arc(cx + player.w * 0.12, player.y + player.h * 0.12, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // arm (small swinging accent)
      ctx.strokeStyle = "#ff6f61"; ctx.lineWidth = 9; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx + player.w * 0.28, bodyTop + 10);
      ctx.lineTo(cx + player.w * 0.28 + (player.grounded ? Math.cos(runPhase) * 14 : -6), bodyTop + 34);
      ctx.stroke();

      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function render() {
      drawSky();
      drawFarHills();
      drawNearHills();
      drawGround();
      for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
      for (var j = 0; j < coins.length; j++) drawCoin(coins[j]);
      drawPlayer();
      drawParticles();
    }

    function end() {
      Loop.stop();
      best = Math.max(score, Store.get("endlessRunnerBest", 0));
      Store.set("endlessRunnerBest", best);
      UI.setTime(best);
      UI.setEnd("Run Over!", score);
      setState("end");
      Ad.track("game_end", { score: score, best: best });
    }

    return { reset: reset, onDown: onDown, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;

    // Route all inputs to the current game.
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  // Kick off after DOM is parsed.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
