<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Whack-a-Mole</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #16241a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the square-ish play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .85; }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #4ade80, #16a34a);
    box-shadow: 0 8px 24px rgba(22,163,74,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  /* ---- Persistent CTA banner (visible during gameplay, common in playables) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, lives, timer) ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(14px, 4.2vw, 20px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP  (structure of the creative)
     - #stage/#game : the canvas the game renders into.
     - #hud         : in-game score / lives / timer.
     - .screen      : one overlay per game state (intro, end).
     - #cta-bar     : always-available install button.
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Score: <span id="score">0</span></div>
  <div id="hud-mid">Lives: <span id="lives">3</span></div>
  <div id="hud-right">Time: <span id="time">0</span></div>
</div>

<!-- Loading screen: shown until assets + ad container are ready -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<!-- Intro screen: title + start button -->
<div id="screen-intro" class="screen hidden">
  <div class="title">WHACK-A-MOLE</div>
  <div class="subtitle">Tap the moles, dodge the bombs!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<!-- End screen: result + primary CTA to the store -->
<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice!</div>
  <div class="subtitle" id="end-subtitle">You scored <span id="end-score">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<!-- Persistent CTA (hidden until gameplay begins) -->
<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined)
     Organized top-to-bottom in clearly labeled sections so a new game can
     be produced by editing mostly the CONFIG + GAME sections and leaving
     the ENGINE / AD glue untouched.
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     The knobs a new game changes first. Copy of business/creative params.
     =================================================================== */
  var CONFIG = {
    title: "Whack-a-Mole",
    gameSeconds: 25,               // round length; 0 = endless
    // Store links used by the CTA. The correct one is chosen at runtime.
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    // Design resolution — the game logic is authored against this virtual
    // size, then the canvas is scaled to fit any screen (see fitCanvas()).
    designWidth: 720,
    designHeight: 1280,
    bg: "#16241a",

    // --- Whack-a-Mole specific tunables ---
    gridCols: 3,
    gridRows: 3,
    startLives: 3,
    scorePerMole: 10,
    maxActiveMoles: 3,          // never more than this many up at once
    // Difficulty ramps linearly from "start" to "end" over the round.
    spawnIntervalStart: 1.0,    // seconds between spawn attempts, early round
    spawnIntervalEnd: 0.42,     // seconds between spawn attempts, late round
    upDurationStart: 1.25,      // seconds a mole/bomb stays fully up, early round
    upDurationEnd: 0.55,        // seconds a mole/bomb stays fully up, late round
    bombChanceStart: 0.10,      // probability a spawn is a bomb, early round
    bombChanceEnd: 0.30,        // probability a spawn is a bomb, late round
    riseTime: 0.12,             // seconds to pop up out of the hole
    retractTime: 0.12,          // seconds to retreat back into the hole
    squishTime: 0.22            // seconds for the whacked squish animation
  };

  /* ===================================================================
     2. ASSETS  (embedded, no network requests)
     Register every asset as a data URI so the file stays self-contained.
     Use tools/embed-asset.mjs to generate these strings.
     Prefer CSS/canvas drawing & WebAudio synth over binary assets to stay
     well under the 5 MB budget; only embed images/sounds you truly need.
     =================================================================== */
  var ASSETS = {
    images: {
      // logo: "data:image/png;base64,iVBORw0KGgo..."
    },
    sounds: {
      // pop: "data:audio/mp3;base64,SUQzBAAAAAA..."
    }
  };

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  // We render at CONFIG.designWidth x designHeight and letterbox-fit the
  // canvas to the viewport using CSS, accounting for devicePixelRatio so
  // drawing stays crisp on retina screens.
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    // Backing store size (crisp), CSS size (fit).
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  // Handles mouse + touch. Coordinates are converted from screen pixels to
  // the virtual design space so game logic never worries about scaling.
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  // Generates simple tones so you get sound without embedding audio files.
  // For richer sound, put base64 clips in ASSETS.sounds and play via Audio.clip.
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      // iOS requires resume() inside a user gesture.
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     Playable ads run inside a network's iframe. We must:
       - wait for the ad container ("mraid") to be ready before starting,
       - route the install button through the network's open() when present,
       - report standard lifecycle events for analytics/QA.
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    // Resolve when the creative may start drawing/interacting.
    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    // The single entry point for "user wants the app". Order matters:
    // MRAID first, then common network globals, then a plain window.open.
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}       // ironSource / generic
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {} // Google Ads
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    // Lightweight event hook. Swap console.log for a network SDK call if needed.
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     States: loading -> intro -> playing -> end. UI.show() toggles overlays.
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      // HUD + CTA bar are only visible during play.
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; },
    setLives: function (v) { $("lives").textContent = v; },
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME  (the part a new prompt mostly rewrites)
     Everything above is reusable plumbing. A concrete game implements:
       Game.reset()            -> initialize round state
       Game.onDown(p)          -> pointer input (design coords)
       Game.update(dt)         -> advance simulation (seconds)
       Game.render()           -> draw a frame (design coords)
       Game.onEnd()            -> compute result before end screen
     Whack-a-Mole: moles pop up out of a 3x3 grid of holes; tap them before
     they retreat for points. Occasionally a bomb pops instead — tapping a
     bomb costs a life. Difficulty ramps up over the 25 second round.
     =================================================================== */
  var Game = (function () {
    var score, lives, timeLeft, holes, nextSpawnIn, flashTimer, ended;

    // Layout: a 3x3 grid of holes occupying the lower ~65% of the screen.
    var holeAreaTop = view.h * 0.35;
    var holeAreaH = view.h - holeAreaTop;
    var cellW = view.w / CONFIG.gridCols;
    var cellH = holeAreaH / CONFIG.gridRows;
    var moundRX = Math.min(cellW, cellH) * 0.40;
    var moundRY = moundRX * 0.55;
    var creatureR = moundRX * 0.82;
    var hitR = moundRX * 1.15; // generous hit radius, forgiving taps

    function buildHoles() {
      var list = [];
      for (var row = 0; row < CONFIG.gridRows; row++) {
        for (var col = 0; col < CONFIG.gridCols; col++) {
          list.push({
            x: cellW * (col + 0.5),
            y: holeAreaTop + cellH * (row + 0.5),
            state: "idle",     // idle | rising | up | retracting | whacked
            type: "mole",      // mole | bomb
            pop: 0,             // 0 = hidden in hole, 1 = fully up
            timer: 0,           // seconds remaining in current state
            upDuration: 1,      // how long it stays fully up once risen
            squish: 0           // 0..1 progress of whacked squish animation
          });
        }
      }
      return list;
    }

    // Linear interpolation driven by round progress (0 = start, 1 = end).
    function difficulty(t) {
      function lerp(a, b) { return a + (b - a) * t; }
      return {
        spawnInterval: lerp(CONFIG.spawnIntervalStart, CONFIG.spawnIntervalEnd),
        upDuration:    lerp(CONFIG.upDurationStart, CONFIG.upDurationEnd),
        bombChance:    lerp(CONFIG.bombChanceStart, CONFIG.bombChanceEnd)
      };
    }

    function reset() {
      score = 0;
      lives = CONFIG.startLives;
      timeLeft = CONFIG.gameSeconds;
      holes = buildHoles();
      nextSpawnIn = 0.4; // quick first spawn so the round feels alive immediately
      flashTimer = 0;
      ended = false;
      UI.setScore(0);
      UI.setTime(Math.ceil(timeLeft));
      UI.setLives(lives);
    }

    function countActive() {
      var n = 0;
      for (var i = 0; i < holes.length; i++) {
        if (holes[i].state === "rising" || holes[i].state === "up") n++;
      }
      return n;
    }

    function spawnOne(diff) {
      var idle = [];
      for (var i = 0; i < holes.length; i++) if (holes[i].state === "idle") idle.push(holes[i]);
      if (idle.length === 0) return;
      var h = Rand.pick(idle);
      h.type = Math.random() < diff.bombChance ? "bomb" : "mole";
      h.state = "rising";
      h.pop = 0;
      h.upDuration = diff.upDuration;
      h.squish = 0;
    }

    function onDown(p) {
      for (var i = 0; i < holes.length; i++) {
        var h = holes[i];
        if (h.state !== "rising" && h.state !== "up") continue;
        var dx = p.x - h.x, dy = p.y - h.y;
        if (dx * dx + dy * dy > hitR * hitR) continue;

        // Hit! Retire this hole into the "whacked" squish animation.
        h.state = "whacked";
        h.squish = 0;
        h.timer = CONFIG.squishTime;
        if (h.type === "mole") {
          score += CONFIG.scorePerMole;
          UI.setScore(score);
          Sound.beep(720, 0.09, "triangle");
        } else {
          lives = Math.max(0, lives - 1);
          UI.setLives(lives);
          Sound.beep(140, 0.22, "sawtooth");
          flashTimer = 0.18;
          if (lives <= 0) { end(); return; }
        }
        return; // only one hole per tap
      }
    }

    function update(dt) {
      if (ended) return;

      // Timer
      if (CONFIG.gameSeconds > 0) {
        timeLeft -= dt;
        UI.setTime(Math.max(0, Math.ceil(timeLeft)));
        if (timeLeft <= 0) return end();
      }

      var t = CONFIG.gameSeconds > 0 ? 1 - Math.max(0, timeLeft) / CONFIG.gameSeconds : 0;
      var diff = difficulty(Math.min(1, Math.max(0, t)));

      // Spawner
      nextSpawnIn -= dt;
      if (nextSpawnIn <= 0) {
        if (countActive() < CONFIG.maxActiveMoles) spawnOne(diff);
        nextSpawnIn = diff.spawnInterval * Rand.range(0.7, 1.3);
      }

      // Per-hole animation state machine
      for (var i = 0; i < holes.length; i++) {
        var h = holes[i];
        if (h.state === "rising") {
          h.pop += dt / CONFIG.riseTime;
          if (h.pop >= 1) { h.pop = 1; h.state = "up"; h.timer = h.upDuration; }
        } else if (h.state === "up") {
          h.timer -= dt;
          if (h.timer <= 0) { h.state = "retracting"; }
        } else if (h.state === "retracting") {
          h.pop -= dt / CONFIG.retractTime;
          if (h.pop <= 0) { h.pop = 0; h.state = "idle"; }
        } else if (h.state === "whacked") {
          h.timer -= dt;
          h.squish = 1 - Math.max(0, h.timer) / CONFIG.squishTime;
          if (h.timer <= 0) { h.state = "idle"; h.pop = 0; h.squish = 0; }
        }
      }

      if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);
    }

    function drawHole(h) {
      // Dark dirt mound / hole shadow.
      ctx.fillStyle = "#0c1f10";
      ctx.beginPath();
      ctx.ellipse(h.x, h.y, moundRX, moundRY, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#3a2414";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(h.x, h.y, moundRX * 0.86, moundRY * 0.86, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawMole(h, cy) {
      var r = creatureR;
      var squishScale = h.state === "whacked" ? (1 + Math.sin(h.squish * Math.PI) * 0.35) : 1;
      var sy = h.state === "whacked" ? 1 - h.squish * 0.55 : 1;
      ctx.save();
      ctx.translate(h.x, cy);
      ctx.scale(squishScale, squishScale * sy);
      // Body
      ctx.fillStyle = "#8b5a2b";
      ctx.beginPath();
      ctx.ellipse(0, 0, r, r * 0.92, 0, 0, Math.PI * 2);
      ctx.fill();
      // Snout
      ctx.fillStyle = "#c98a52";
      ctx.beginPath();
      ctx.ellipse(0, r * 0.28, r * 0.42, r * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      // Nose
      ctx.fillStyle = "#3a2414";
      ctx.beginPath();
      ctx.arc(0, r * 0.28, r * 0.09, 0, Math.PI * 2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = "#1b1020";
      ctx.beginPath();
      ctx.arc(-r * 0.32, -r * 0.12, r * 0.11, 0, Math.PI * 2);
      ctx.arc(r * 0.32, -r * 0.12, r * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBomb(h, cy) {
      var r = creatureR * 0.9;
      var squishScale = h.state === "whacked" ? (1 + Math.sin(h.squish * Math.PI) * 0.4) : 1;
      ctx.save();
      ctx.translate(h.x, cy);
      ctx.scale(squishScale, squishScale);
      // Body
      ctx.fillStyle = "#2b2b2f";
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#55555c";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2);
      ctx.stroke();
      // Fuse
      ctx.strokeStyle = "#c98a52";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.95);
      ctx.quadraticCurveTo(r * 0.35, -r * 1.35, r * 0.05, -r * 1.6);
      ctx.stroke();
      // Spark (flickers)
      var sparkOn = Math.sin(performance.now() / 60) > 0;
      ctx.fillStyle = sparkOn ? "#ffcc55" : "#ff6a3d";
      ctx.beginPath();
      ctx.arc(r * 0.05, -r * 1.6, r * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function render() {
      // Ground: grass on top, dirt patch behind the holes.
      ctx.fillStyle = "#1b3320";
      ctx.fillRect(0, 0, view.w, holeAreaTop);
      ctx.fillStyle = "#4a2f18";
      ctx.fillRect(0, holeAreaTop, view.w, view.h - holeAreaTop);

      // Holes (mounds) drawn first so creatures appear to rise out of them.
      var i;
      for (i = 0; i < holes.length; i++) drawHole(holes[i]);

      // Creatures, clipped so they appear to emerge from their hole.
      for (i = 0; i < holes.length; i++) {
        var h = holes[i];
        if (h.pop <= 0 && h.state !== "whacked") continue;
        var riseOffset = (1 - h.pop) * creatureR * 1.6;
        var cy = h.y - creatureR * 0.35 + riseOffset;
        ctx.save();
        ctx.beginPath();
        ctx.rect(h.x - moundRX * 1.3, h.y - creatureR * 2.2, moundRX * 2.6, creatureR * 2.2 + moundRY);
        ctx.clip();
        if (h.type === "bomb") drawBomb(h, cy); else drawMole(h, cy);
        ctx.restore();
      }

      // Bomb-hit flash feedback.
      if (flashTimer > 0) {
        ctx.fillStyle = "rgba(255,40,40," + (flashTimer / 0.18 * 0.35) + ")";
        ctx.fillRect(0, 0, view.w, view.h);
      }
    }

    function end() {
      if (ended) return;
      ended = true;
      Loop.stop();
      var best = Math.max(score, Store.get("bestScoreWhackAMole", 0));
      Store.set("bestScoreWhackAMole", best);
      var title = lives <= 0 ? "Bombed Out!" : "Time's Up!";
      UI.setEnd(title, score);
      $("end-subtitle").innerHTML = "You scored <span id=\"end-score\">" + score + "</span> &middot; Best: " + best;
      setState("end");
      Ad.track("game_end", { score: score, lives: lives });
    }

    return { reset: reset, onDown: onDown, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title.toUpperCase();

    // Route all inputs to the current game.
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  // Kick off after DOM is parsed.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
