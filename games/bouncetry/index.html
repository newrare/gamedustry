    $("btn-replay").textContent = CONFIG.copy.replay;
    $("hud-score-lbl").textContent = CONFIG.copy.scoreLabel;
    $("eo-scorelbl").textContent = CONFIG.copy.endScore;
  }

  // --- End screen: the cinematic reveal ----------------------------------
  // Beats: title -> score count-up (+confetti) -> stars -> stat rows -> CTA.
  var EndScreen = (function () {
    var timers = [];
    var T_TITLE = 120, T_SCORE = 560, T_STARS = 1950, STAR_GAP = 440,
        ROW_GAP = 250, T_CTA_AFTER = 1500;
    // The reveal climbs: each star rings the same chime a step higher. RATE
    // drives the embedded "uiStar" clip, FREQ the synthesized fallback.
    var STAR_RATE = [1, 1.19, 1.42], STAR_FREQ = [660, 880, 1180];

    function countUp(el, target, dur, cb) {
      var start = performance.now();
      function step(now) {
        var p = clamp((now - start) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(e * target);
        if (p < 1) requestAnimationFrame(step);
        else { el.textContent = target; if (cb) cb(); }
      }
      requestAnimationFrame(step);
    }

    // result: { title, variant:""|"win"|"perfect", score, stars:0..3|null,
    //           rows:[{label, value, grade}] }
    function show(result) {
      timers.forEach(clearTimeout); timers = [];
      Confetti.clear();
      function T(fn, ms) { timers.push(setTimeout(fn, ms)); }

      var title = $("eo-title");
      title.textContent = result.title || CONFIG.copy.gameOver;
      title.className = "eo-title" + (result.variant ? " " + result.variant : "");
      ["eo-title", "eo-scorelbl", "eo-score"].forEach(function (id) { $(id).classList.remove("show", "pop"); });
      $("eo-score").textContent = "0";
      $("btn-install").classList.remove("show");
      $("btn-replay").classList.remove("show");

      // Stars (pass null / undefined to hide the row entirely).
      var stars = result.stars;
      var hasStars = stars != null;
      $("eo-stars").classList.toggle("hidden", !hasStars);
      for (var i = 1; i <= 3; i++) $("star-" + i).className = "star";

      // Stat rows are rebuilt every round so a replay starts clean.
      var rows = result.rows || [];
      var box = $("eo-stats"), html = "";
      rows.forEach(function (r, i) {
        var label = r.grade === "gold"
          ? '<span class="spark">✦</span> ' + r.label + ' <span class="spark">✦</span>'
          : r.label;
        html += '<div class="eo-row' + (r.grade ? " " + r.grade : "") + '" id="eo-row-' + i + '">' +
                '<span>' + label + '</span><span class="eo-val" id="eo-val-' + i + '">0</span></div>';
      });
      box.innerHTML = html;

      // 1) Title slams in.
      T(function () { title.classList.add("show"); }, T_TITLE);

      // 2) Final score counts up, greeted by confetti.
      T(function () {
        $("eo-scorelbl").classList.add("show");
        $("eo-score").classList.add("show");
        Confetti.burst(70);
        countUp($("eo-score"), result.score || 0, 1100, function () {
          $("eo-score").classList.add("pop");
          Sound.cue("uiScore", 0.8, 1, 900, 0.14);
          Confetti.burst(90);
        });
      }, T_SCORE);

      // 3) Stars slam in one by one, each with a rising chime.
      var afterStars = T_SCORE + 900;
      if (hasStars) {
        T(function () { for (var s = 1; s <= 3; s++) $("star-" + s).classList.add("dim"); }, T_STARS - 160);
        for (var si = 0; si < stars; si++) {
          (function (idx) {
            T(function () {
              var el = $("star-" + (idx + 1));
              el.classList.remove("dim"); el.classList.add("on");
              Sound.cue("uiStar", 0.75, STAR_RATE[idx] || 1.42, STAR_FREQ[idx] || 1180, 0.16);
              Confetti.burst(30);
            }, T_STARS + idx * STAR_GAP);
          })(si);
        }
        afterStars = T_STARS + Math.max(stars, 1) * STAR_GAP + 350;
      }

      // 4) Stat rows cascade in, counters animating.
      rows.forEach(function (r, i) {
        T(function () {
          $("eo-row-" + i).classList.add("show");
          var el = $("eo-val-" + i);
          if (typeof r.value === "number") countUp(el, r.value, 450);
          else el.textContent = r.value;
          Sound.cue("uiRow", 0.5, 1 + i * 0.07, 480 + i * 70, 0.05);
        }, afterStars + i * ROW_GAP);
      });

      // 5) Install CTA, then the discreet replay link.
      var ctaAt = afterStars + rows.length * ROW_GAP + T_CTA_AFTER;
      T(function () { $("btn-install").classList.add("show"); }, ctaAt);
      T(function () { $("btn-replay").classList.add("show"); }, ctaAt + 500);
    }
    return { show: show };
  })();

  // --- Round clock -------------------------------------------------------
  var Round = (function () {
    var left = 0, running = false, fired = false;
    function reset() {
      left = CONFIG.gameSeconds; running = true; fired = false;
      if (CONFIG.gameSeconds > 0) HUD.setTime(left);
    }
    function tick(dt) {
      if (!running || CONFIG.gameSeconds <= 0) return;
      left = Math.max(0, left - dt);
      HUD.setTime(left);
      if (left <= 0 && !fired) {
        fired = true;
        // The game decides what "time up" means (end now, sudden death…).
        if (Game.onTimeUp) Game.onTimeUp();
        else endRound({ title: CONFIG.copy.timeUp });
      }
    }
    return {
      reset: reset, tick: tick, stop: function () { running = false; },
      left: function () { return left; },
      elapsed: function () { return CONFIG.gameSeconds - left; }
    };
  })();

  // --- The single way a round ends ---------------------------------------
  // result: { title, variant, score, stars, rows, track }
  function endRound(result) {
    if (State === "end") return;
    result = result || {};
    Loop.stop(); Round.stop();
    Music.duck(0.55, 0.8);        // let the end-screen cues sit on top
    var score = result.score == null ? Math.round(HUD.score()) : result.score;
    var best = Math.max(score, Store.get("bestScore", 0));
    Store.set("bestScore", best);
    setState("end");
    EndScreen.show({
      title: result.title || CONFIG.copy.gameOver,
      variant: result.variant || "",
      score: score,
      stars: result.stars,
      rows: result.rows || []
    });
    Ad.track("game_end", result.track || { score: score, best: best });
  }

  /* ===================================================================
     6. GAME — BOUNCETRY: one wheel spin, one volley, as many ricochets as
     the player can read on the board.

     A round is three beats:
       wheel   the ammo wheel spins; a tap stops it on 2..10 balls
       aim     drag anywhere to swing the cannon — the preview traces the
               first bounces — and release to fire the whole volley at once,
               every ball a couple of degrees off its neighbour
       flight  the balls ricochet off the side walls and the ceiling; only the
               pit at the bottom takes them away. Every brick smashed while
               the chain is still alive is worth more than the last one.

     The board is rebuilt at random every run, but always around the same
     three landmarks, so the clever shot is always there to be found:
       * a two-row ceiling wall with ONE gap, and an open attic above it — a
         ball threaded through the gap rakes the whole wall from the inside;
       * a hollow pocket, open at the bottom, with a gold brick hanging in it;
       * a diagonal ramp feeding one of the side walls.
     The gap column is kept clear all the way down to the cannon, so that
     corridor is a shot the player can actually take, not a lucky bounce.
     =================================================================== */
  var Game = (function () {
    var C = CONFIG, TAU = Math.PI * 2;

    /* --- geometry, rebuilt whenever Layout moves ---------------------- */
    var field = { left: 0, right: 0, top: 0, floor: 0 };
    var G = { cols: 0, rows: 0, cw: 0, ch: 0, x0: 0, y0: 0 };
    var cannon = { x: 0, y: 0 };
    var BW = 0, BH = 0;             // a brick face, inside its cell
    var sprites = null;             // cached brick faces, one canvas per look
    var bgGrad = null;

    /* --- run state ---------------------------------------------------- */
    var phase;                      // "wheel" | "aim" | "flight" | "over"
    var cells, bricks, total, broken, corridor;
    var balls, ammo, alive;
    var score, chain, bestChain, chainT;
    var aimA, aiming, trace, traceHit;
    var wheel, clock, flightT, endT, idleT;
    var hinted, pulled, cleared, lastWall, lastPop;

    // The wheel reads cold on its low numbers and hot on the jackpot.
    var WHEEL_COLS = ["#4bf5ff", "#49d7ff", "#7ab4ff", "#b06bff", "#e15dff",
                      "#ff5fb0", "#ff7a5e", "#ffb44f", "#ffd43b"];

    /* --- small canvas helpers ---------------------------------------- */
    function rr(x, px, py, w, h, r) {
      var k = Math.min(r, w / 2, h / 2);
      x.beginPath();
      x.moveTo(px + k, py);
      x.lineTo(px + w - k, py); x.quadraticCurveTo(px + w, py, px + w, py + k);
      x.lineTo(px + w, py + h - k); x.quadraticCurveTo(px + w, py + h, px + w - k, py + h);
      x.lineTo(px + k, py + h); x.quadraticCurveTo(px, py + h, px, py + h - k);
      x.lineTo(px, py + k); x.quadraticCurveTo(px, py, px + k, py);
      x.closePath();
    }

    function geometry() {
      field.left  = Layout.left;
      field.right = Layout.right;
      field.top   = Layout.top + 6;
      field.floor = Layout.bottom - C.floorGap;
      G.cols = C.cols; G.rows = C.rows;
      G.cw = (field.right - field.left) / G.cols;
      G.ch = C.cellH;
      G.x0 = field.left;
      G.y0 = field.top + C.atticH;          // the attic stays open above row 0
      BW = G.cw - C.pad * 2; BH = G.ch - C.pad * 2;
      cannon.x = (field.left + field.right) / 2;
      cannon.y = field.floor - 16;
      bgGrad = ctx.createLinearGradient(0, Layout.top - 20, 0, Layout.bottom);
      bgGrad.addColorStop(0, "#151d5c");
      bgGrad.addColorStop(0.55, "#0c1136");
      bgGrad.addColorStop(1, "#070a1e");
    }

    /* --- brick faces, rendered once ---------------------------------- */
    // No shadowBlur per frame: each look is rasterized here and blitted.
    function face(pal, kind) {
      var w = Math.max(2, Math.round(BW)), h = Math.max(2, Math.round(BH));
      var cv = document.createElement("canvas"), x = cv.getContext("2d"), d = 2, g;
      cv.width = w * d; cv.height = h * d; x.setTransform(d, 0, 0, d, 0, 0);

      rr(x, 1, 1, w - 2, h - 2, 10);
      g = x.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, pal.light); g.addColorStop(0.52, pal.core); g.addColorStop(1, pal.edge);
      x.fillStyle = g; x.fill();
      x.strokeStyle = "rgba(255,255,255,.55)"; x.lineWidth = 2; x.stroke();
      rr(x, 7, 6, w - 14, h * 0.28, 6);
      x.fillStyle = "rgba(255,255,255,.3)"; x.fill();

      if (kind === "gold") {                       // a four-point sparkle
        x.fillStyle = "rgba(255,255,255,.92)";
        x.beginPath();
        x.moveTo(w / 2, h * 0.24); x.lineTo(w / 2 + 9, h / 2); x.lineTo(w / 2, h * 0.76);
        x.lineTo(w / 2 - 9, h / 2); x.closePath(); x.fill();
        x.beginPath();
        x.moveTo(w * 0.5 - 20, h / 2); x.lineTo(w / 2, h / 2 - 7); x.lineTo(w * 0.5 + 20, h / 2);
        x.lineTo(w / 2, h / 2 + 7); x.closePath(); x.fill();
      }
      if (kind === "bomb") {                       // a fuse ring
        x.strokeStyle = "rgba(255,255,255,.9)"; x.lineWidth = 4;
        x.beginPath(); x.arc(w / 2, h / 2, h * 0.3, 0, TAU); x.stroke();
        x.fillStyle = "rgba(42,20,0,.85)";
        x.beginPath(); x.arc(w / 2, h / 2, h * 0.17, 0, TAU); x.fill();
      }
      return cv;
    }
    function buildSprites() {
      var i, list = [];
      for (i = 0; i < C.palette.length; i++) list.push(face(C.palette[i], "plain"));
      sprites = {
        faces: list,
        gold: face({ light: "#fff6cf", core: "#ffd43b", edge: "#c98a00" }, "gold"),
        bomb: face({ light: "#ffd9a8", core: "#ff8a1a", edge: "#a33c00" }, "bomb")
      };
    }

    /* --- the board ---------------------------------------------------- */
    function cellAt(c, r) {
      if (c < 0 || c >= G.cols || r < 0 || r >= G.rows) return null;
      return cells[r * G.cols + c];
    }
    function put(c, r, type) {
      if (c < 0 || c >= G.cols || r < 0 || r >= G.rows) return;
      if (c === corridor) return;                  // the corridor stays open
      if (cells[r * G.cols + c]) return;
      var b = { c: c, r: r, type: type || 0, alive: true, flash: 0,
                col: Math.min((r / 2) | 0, C.palette.length - 1) };
      cells[r * G.cols + c] = b; bricks.push(b);
    }
    function buildBoard() {
      cells = new Array(G.cols * G.rows); bricks = [];
      var c, r, i, k;

      // 1. the ceiling wall, and the single gap that opens the attic
      corridor = Rand.int(1, G.cols - 2);
      for (r = 0; r < 2; r++) for (c = 0; c < G.cols; c++) put(c, r);

      // 2. the pocket: a hollow box open at the bottom, gold hanging inside.
      //    Kept off the corridor so it reads as a box, not as a broken one.
      var pw = Rand.int(3, 4), pc = 0, pr = Rand.int(3, 4), tries = 0;
      do { pc = Rand.int(0, G.cols - pw); tries++; }
      while (tries < 16 && corridor >= pc && corridor <= pc + pw - 1);
      for (c = pc; c < pc + pw; c++) put(c, pr);
      for (r = pr + 1; r <= pr + 3; r++) { put(pc, r); put(pc + pw - 1, r); }
      put(pc + (pw >> 1), pr + 2, 1);

      // 3. a ramp: four bricks on a diagonal, feeding one of the side walls
      var side = Rand.chance(0.5), r0 = Rand.int(6, 7);
      for (i = 0; i < 4; i++) put(side ? i : G.cols - 1 - i, r0 + i);

      // 4. a light scatter, thicker low down where the volley arrives first
      for (r = 2; r < G.rows; r++)
        for (c = 0; c < G.cols; c++)
          if (!cellAt(c, r) && Rand.chance(r >= 5 ? 0.2 : 0.09)) put(c, r);

      // 5. two bombs somewhere in the crowd
      for (i = 0; i < 2; i++) { k = Rand.pick(bricks); if (k && k.type === 0) k.type = 2; }

      total = bricks.length; broken = 0;
    }

    /* --- the wheel ---------------------------------------------------- */
    function wheelY() { return Layout.top + Layout.h * 0.36; }
    function wheelReset() {
      var segA = TAU / C.wheelValues.length, a = Rand.range(0, TAU);
      wheel = { a: a, state: "spin", t: 0, T: 1, a0: 0, seg: 0, hold: 0,
                tick: Math.floor(a / segA) };
    }
    function wheelStop() {
      var n = C.wheelValues.length, segA = TAU / n;
      var i = Rand.int(0, n - 1);
      // The rotation that parks segment i under the pointer, plus enough whole
      // turns that the wheel always slows down over ~2.3 to 3.4 seconds.
      var delta = (-Math.PI / 2 - (i + 0.5) * segA) - wheel.a;
      while (delta < C.wheelSpeed * 1.15) delta += TAU;
      // Linear deceleration from the speed it already has: no jump on the tap.
      wheel.a0 = wheel.a; wheel.T = 2 * delta / C.wheelSpeed;
      wheel.t = 0; wheel.seg = i; wheel.state = "slow";
      Sound.clip("tick", 0.5, 1.1);
    }
    function wheelLand() {
      ammo = C.wheelValues[wheel.seg]; alive = ammo;
      wheel.state = "done"; wheel.hold = 0;
      HUD.setLeft(ammo, "BALLS");
      Sound.clip("lock", 0.85);
      Fx.flash("#ffffff", 0.3); Fx.shake(9, 0.3);
      Fx.ring(cannon.x, wheelY(), { from: C.wheelRadius * 0.5, to: C.wheelRadius * 1.6,
                                    color: "#4bf5ff", width: 10, life: 0.5 });
      Pop.show(ammo >= 9 ? "ultra" : ammo >= 6 ? "combo" : "bonus",
               { word: ammo + " BALLS", sub: ammo >= 9 ? "JACKPOT" : "LOAD THEM UP", at: "upper" });
    }
    function updateWheel(dt) {
      var segA = TAU / C.wheelValues.length, v = 0, s;
      if (wheel.state === "spin") { wheel.a += C.wheelSpeed * dt; v = C.wheelSpeed; }
      else if (wheel.state === "slow") {
        wheel.t = Math.min(wheel.T, wheel.t + dt);
        v = C.wheelSpeed * (1 - wheel.t / wheel.T);
        wheel.a = wheel.a0 + C.wheelSpeed * wheel.t
                - C.wheelSpeed * wheel.t * wheel.t / (2 * wheel.T);
        if (wheel.t >= wheel.T) { wheelLand(); return; }
      } else {
        wheel.hold += dt;
        if (wheel.hold > 0.9) {
          phase = "aim"; idleT = 0;
          // The corridor is the shot that pays: say it once, then let the
          // lane and its chevrons do the teaching.
          Overlay.toast("THREAD THE GAP FOR A MEGA CHAIN", { color: "#4bf5ff", dur: 2400 });
        }
        return;
      }
      s = Math.floor(wheel.a / segA);
      if (s !== wheel.tick) {                      // one tick per segment
        if (v < 7) Sound.clip("tick", 0.3, 1.5);   // only once it is readable
        wheel.tick = s;
      }
    }

    /* --- aiming ------------------------------------------------------- */
    function aimAt(p) {
      var dx = p.x - cannon.x, dy = p.y - cannon.y;
      if (dy > -40) dy = -40;                      // never aim into the pit
      var lim = C.minAimDeg * Math.PI / 180;
      aimA = clamp(Math.atan2(dy, dx), -Math.PI + lim, -lim);
      traceShot();
    }
    /* The preview walks the exact same walls the balls will, so what it draws
       is what the shot does — up to the first brick, which is where a plan
       stops being predictable anyway. */
    function traceShot() {
      var R = C.ballR, step = 9, n = 0, walls = 0;
      var x = cannon.x + Math.cos(aimA) * C.muzzle;
      var y = cannon.y + Math.sin(aimA) * C.muzzle;
      var vx = Math.cos(aimA), vy = Math.sin(aimA);
      trace = [x, y]; traceHit = null;
      while (n++ < 300) {
        x += vx * step; y += vy * step;
        if (x - R < field.left) { x = field.left + R; vx = -vx; walls++; }
        else if (x + R > field.right) { x = field.right - R; vx = -vx; walls++; }
        if (y - R < field.top) { y = field.top + R; vy = -vy; walls++; }
        trace.push(x, y);
        traceHit = brickAt(x, y, R);
        if (traceHit || walls > 3 || y > field.floor) break;
      }
    }
    function brickAt(x, y, R) {
      var c, r, k, bx, by, dx, dy;
      var c0 = Math.floor((x - R - G.x0) / G.cw), c1 = Math.floor((x + R - G.x0) / G.cw);
      var r0 = Math.floor((y - R - G.y0) / G.ch), r1 = Math.floor((y + R - G.y0) / G.ch);
      for (r = r0; r <= r1; r++) for (c = c0; c <= c1; c++) {
        k = cellAt(c, r); if (!k || !k.alive) continue;
        bx = G.x0 + c * G.cw + C.pad; by = G.y0 + r * G.ch + C.pad;
        dx = x - clamp(x, bx, bx + BW); dy = y - clamp(y, by, by + BH);
        if (dx * dx + dy * dy <= R * R) return k;
      }
      return null;
    }

    /* --- the shot ----------------------------------------------------- */
    function fire() {
      var n = ammo, spread = C.spreadDeg * Math.PI / 180, i, a;
      var mx = cannon.x + Math.cos(aimA) * C.muzzle;
      var my = cannon.y + Math.sin(aimA) * C.muzzle;
      balls = [];
      for (i = 0; i < n; i++) {
        a = aimA + (i - (n - 1) / 2) * spread;     // a few degrees of fan
        balls.push({ x: mx, y: my, vx: Math.cos(a) * C.ballSpeed,
                     vy: Math.sin(a) * C.ballSpeed, alive: true });
      }
      phase = "flight"; flightT = 0;
      Sound.clip("shoot", 0.85);
      Fx.shake(10, 0.25);
      Fx.burst(mx, my, { color: ["#ffb44f", "#ffffff"], count: 16, speed: 420,
                         life: 0.35, angle: aimA, spread: 1.2 });
      Fx.ring(mx, my, { from: 12, to: 96, color: "#ffb44f", width: 6, life: 0.3 });
      HUD.setLeft(alive, "BALLS");
    }

    function wallHit(x, y) {
      if (clock - lastWall > 0.05) {               // ten balls, one click
        Sound.clip("wall", 0.25, Rand.range(0.92, 1.12));
        lastWall = clock;
      }
      Fx.burst(x, y, { color: "#9fd8ff", count: 3, speed: 150, life: 0.22 });
    }

    function killBall(b) {
      b.alive = false; alive--;
      HUD.setLeft(alive, "BALLS");
      Sound.clip("drop", 0.28, 0.85);
      Fx.burst(b.x, field.floor, { color: "#ff5fb0", count: 8, speed: 220, life: 0.4,
                                   angle: -Math.PI / 2, spread: 2.2 });
      if (alive <= 0 && phase === "flight") { phase = "over"; endT = 0; }
    }

    /* A ball that settles into a flat rally never comes down, and a volley
       that repeats the same loop is dull: every bounce gets a nudge and a
       floor on its vertical speed — until the pull takes over. */
    function keepLively(b) {
      var sp, k;
      b.vx += Rand.range(-45, 45);
      sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || C.ballSpeed;
      if (Math.abs(b.vy) < sp * C.minVyRatio) b.vy = (b.vy < 0 ? -1 : 1) * sp * C.minVyRatio;
      if (flightT > C.pullAfter) return;
      k = C.ballSpeed / Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      b.vx *= k; b.vy *= k;
    }

    function stepBall(b, dt) {
      var R = C.ballR;
      if (flightT > C.pullAfter) b.vy += C.pull * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x - R < field.left) { b.x = field.left + R; b.vx = Math.abs(b.vx); wallHit(b.x, b.y); }
      else if (b.x + R > field.right) { b.x = field.right - R; b.vx = -Math.abs(b.vx); wallHit(b.x, b.y); }
      if (b.y - R < field.top) { b.y = field.top + R; b.vy = Math.abs(b.vy); wallHit(b.x, b.y); }
      if (b.y - R > field.floor) { killBall(b); return; }
      hitBrick(b);
    }

    // Circle against the cell grid: the deepest overlap wins, the ball is
    // pushed back out along that contact normal and reflected around it, so a
    // corner deflects the shot instead of mirroring it like a face.
    function hitBrick(b) {
      var R = C.ballR, c, r, k, bx, by, dx, dy, d2;
      var best = null, bestD = 1e9, bnx = 0, bny = 0, bbx = 0, bby = 0, d, ux, uy, vn, ox, oy;
      var c0 = Math.floor((b.x - R - G.x0) / G.cw), c1 = Math.floor((b.x + R - G.x0) / G.cw);
      var r0 = Math.floor((b.y - R - G.y0) / G.ch), r1 = Math.floor((b.y + R - G.y0) / G.ch);
      for (r = r0; r <= r1; r++) for (c = c0; c <= c1; c++) {
        k = cellAt(c, r); if (!k || !k.alive) continue;
        bx = G.x0 + c * G.cw + C.pad; by = G.y0 + r * G.ch + C.pad;
        dx = b.x - clamp(b.x, bx, bx + BW); dy = b.y - clamp(b.y, by, by + BH);
        d2 = dx * dx + dy * dy;
        if (d2 > R * R || d2 >= bestD) continue;
        best = k; bestD = d2; bnx = dx; bny = dy; bbx = bx; bby = by;
      }
      if (!best) return;
      d = Math.sqrt(bestD);
      if (d > 0.0001) { ux = bnx / d; uy = bny / d; }
      else {                                       // dead centre: shortest way out
        ox = b.x - (bbx + BW / 2); oy = b.y - (bby + BH / 2);
        if (Math.abs(ox) / BW > Math.abs(oy) / BH) { ux = ox < 0 ? -1 : 1; uy = 0; }
        else { ux = 0; uy = oy < 0 ? -1 : 1; }
      }
      vn = b.vx * ux + b.vy * uy;
      if (vn < 0) { b.vx -= 2 * vn * ux; b.vy -= 2 * vn * uy; }
      b.x += ux * (R - d + 0.5); b.y += uy * (R - d + 0.5);
      keepLively(b);
      smash(best, 0);
    }

    /* --- scoring ------------------------------------------------------ */
    function chainBeat(gain) {
      if (chain === 5) {
        Pop.show("streak", { word: "HOT!", sub: "CHAIN x5" });
        Sound.clip("chain", 0.6, 1);
      } else if (chain === 10) {
        Pop.show("combo", { word: "CHAIN x10", sub: "+" + gain });
        Sound.clip("chain", 0.75, 1.12); Fx.flash("#4bf5ff", 0.18);
      } else if (chain === 15) {
        Pop.show("boom", { word: "SMASH!", sub: "CHAIN x15" });
        Sound.clip("chain", 0.85, 1.25);
      } else if (chain >= 20 && chain % 10 === 0) {
        Pop.show("ultra", { word: "CHAIN x" + chain, sub: "+" + gain });
        Sound.clip("chain", 0.95, 1.4);
        Overlay.vignette("rgba(75,245,255,.85)", 1, 620);
      }
    }

    function smash(k, depth) {
      if (!k || !k.alive) return;
      k.alive = false; k.flash = 1; broken++;
      chain++; chainT = 0; if (chain > bestChain) bestChain = chain;

      var bx = G.x0 + k.c * G.cw + C.pad, by = G.y0 + k.r * G.ch + C.pad;
      var cx = bx + BW / 2, cy = by + BH / 2, dc, dr;
      var pal = C.palette[k.col];
      var gain = C.brickScore * chain * (k.type === 1 ? C.goldMult : 1);

      score += gain;
      HUD.setScore(score);
      HUD.punch(chain >= 10 ? "#ffd43b" : "#4bf5ff");
      HUD.setRight(total - broken, "BRICKS");

      Fx.burst(cx, cy, { color: [pal.core, pal.light, "#ffffff"], count: 10,
                         speed: 280, life: 0.42, grav: 520 });
      Fx.ring(cx, cy, { from: 8, to: 64, color: pal.core, width: 4, life: 0.26 });
      Sound.clip("brick", 0.42, 1 + Math.min(chain, 18) * 0.045);

      // The comic callout is the loud one and bricks fall in bursts: it is
      // rate-limited, and the cheap canvas text carries the rest of the volley.
      if (clock - lastPop > 0.22 || k.type) {
        lastPop = clock;
        Pop.show("score", { word: "+" + gain, at: { x: cx, y: cy - 26 }, hold: 100,
                            cls: chain >= 15 ? "pop-t3" : chain >= 8 ? "pop-t2"
                               : chain >= 4 ? "pop-t1" : "pop-t0" });
      } else {
        Fx.text(cx, cy - 14, "+" + gain, { color: pal.light, size: 30,
                                           tier: chain >= 8 ? 1 : 0, life: 0.6 });
      }

      if (k.type === 1) {                          // gold: the pocket's prize
        Sound.clip("gold", 0.8);
        Fx.burst(cx, cy, { color: ["#ffd43b", "#fff3b0"], count: 22, speed: 420, life: 0.6, grav: 400 });
        Overlay.vignette("rgba(255,212,59,.8)", 1, 420);
        Pop.show("bonus", { word: "GOLD BRICK", sub: "x" + C.goldMult, at: "lower" });
      }
      if (k.type === 2) {                          // bomb: takes its neighbours
        Sound.clip("blast", 0.9);
        Fx.shake(15, 0.3); Fx.flash("#ffb44f", 0.28); Fx.freeze(0.04);
        Fx.burst(cx, cy, { color: ["#ffb44f", "#fff1c9", "#ff6a00"], count: 30, speed: 560, life: 0.6 });
        Fx.ring(cx, cy, { from: 20, to: 230, color: "#ffb44f", width: 9, life: 0.42 });
        if (!depth) Pop.show("boom", { word: "BOOM!", sub: "BOMB BRICK" });
        if (depth < 3)
          for (dr = -1; dr <= 1; dr++) for (dc = -1; dc <= 1; dc++)
            if (dc || dr) smash(cellAt(k.c + dc, k.r + dr), depth + 1);
      }

      chainBeat(gain);
      if (broken >= total) clearBoard();
    }

    function clearBoard() {
      if (cleared) return;
      cleared = true;
      var bonus = C.clearBonus + Math.max(0, alive) * C.ballBonus;
      score += bonus; HUD.setScore(score);
      Sound.clip("clear", 0.95);
      Confetti.burst(40);
      Pop.show("ultra", { word: "PERFECT CLEAR", sub: "+" + bonus, hold: 900 });
      phase = "over"; endT = -0.7;                 // let the callout land first
    }

    function finish() {
      var ratio = total ? broken / total : 0;
      var stars = (cleared || ratio >= 0.8) ? 3 : ratio >= 0.45 ? 2 : broken > 0 ? 1 : 0;
      endRound({
        title: cleared ? "PERFECT CLEAR!"
             : ratio >= 0.8 ? "HUGE SHOT!"
             : ratio >= 0.45 ? "NICE SHOT!" : C.copy.gameOver,
        variant: cleared ? "perfect" : ratio >= 0.45 ? "win" : "",
        score: score,
        stars: stars,
        rows: [
          { label: "BRICKS SMASHED", value: broken + " / " + total },
          { label: "BEST CHAIN", value: bestChain, grade: bestChain >= 10 ? "accent" : "" },
          { label: "BALLS FIRED", value: ammo },
          { label: "BEST SCORE", value: Math.max(score, Store.get("bestScore", 0)), grade: "gold" }
        ]
      });
    }

    /* --- the engine contract ------------------------------------------ */
    function reset() {
      geometry(); buildSprites(); buildBoard();
      phase = "wheel"; wheelReset();
      balls = []; ammo = 0; alive = 0;
      score = 0; chain = 0; bestChain = 0; chainT = 0;
      clock = 0; flightT = 0; endT = 0; idleT = 0;
      hinted = false; pulled = false; cleared = false;
      lastWall = -1; lastPop = -1;
      aimA = -Math.PI / 2; aiming = false; traceShot();
      HUD.setScoreNow(0);
      HUD.setLeft("?", "BALLS");
      HUD.setRight(total, "BRICKS");
      Fx.reset();
    }

    function onDown(p) {
      if (phase === "wheel") { if (wheel.state === "spin") wheelStop(); return; }
      if (phase !== "aim") return;
      aiming = true; idleT = 0; aimAt(p);
    }
    function onMove(p) { if (phase === "aim" && aiming) aimAt(p); }
    function onUp(p) {
      if (phase !== "aim" || !aiming) return;
      aiming = false; aimAt(p); fire();
    }

    function update(dt) {
      var i, s, b, sub, h;
      clock += dt;
      for (i = 0; i < bricks.length; i++) if (bricks[i].flash > 0) bricks[i].flash -= dt * 3.4;

      if (phase === "wheel") { updateWheel(dt); return; }
      if (phase === "aim") {
        idleT += dt;
        if (!hinted && idleT > 3.4) { hinted = true; Overlay.toast("DRAG TO AIM — RELEASE TO FIRE"); }
        return;
      }

      flightT += dt;
      if (chain > 0) { chainT += dt; if (chainT > C.chainWindow) chain = 0; }
      if (!pulled && flightT > C.pullAfter) {      // the run always ends
        pulled = true;
        Overlay.toast("GRAVITY PULL", { color: "#ff5fb0" });
        Overlay.vignette("rgba(255,45,120,.55)", 1, 900);
      }

      // Sub-stepped so a 1180 px/s ball never tunnels through a 38 px brick.
      sub = Math.ceil(C.ballSpeed * dt / 7);
      if (sub > 16) sub = 16; if (sub < 1) sub = 1;
      h = dt / sub;
      for (s = 0; s < sub; s++)
        for (i = 0; i < balls.length; i++) { b = balls[i]; if (b.alive) stepBall(b, h); }

      if (phase === "over") { endT += dt; if (endT > 0.9) finish(); }
    }

    /* --- drawing ------------------------------------------------------ */
    function drawWalls() {
      ctx.strokeStyle = "rgba(75,245,255,.10)"; ctx.lineWidth = 8;
      ctx.strokeRect(field.left - 4, field.top - 4,
                     field.right - field.left + 8, field.floor - field.top + 8);
      ctx.strokeStyle = "rgba(75,245,255,.4)"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(field.left, field.floor); ctx.lineTo(field.left, field.top);
      ctx.lineTo(field.right, field.top); ctx.lineTo(field.right, field.floor);
      ctx.stroke();
      // the attic: the lane a threaded shot rakes the wall from
      ctx.fillStyle = "rgba(75,245,255,.05)";
      ctx.fillRect(field.left, field.top, field.right - field.left, C.atticH);
    }

    // The corridor is the whole point of the board, so it says so while the
    // player is aiming: a lit lane and chevrons climbing through the wall.
    function drawCorridor() {
      var x = G.x0 + corridor * G.cw + G.cw / 2;
      var a = 0.2 + 0.12 * Math.sin(clock * 3), i, y;
      ctx.fillStyle = rgba("#4bf5ff", a * 0.35);
      ctx.fillRect(x - G.cw / 2 + 6, field.top, G.cw - 12, G.y0 + 2 * G.ch - field.top);
      ctx.strokeStyle = rgba("#4bf5ff", a + 0.3); ctx.lineWidth = 4;
      for (i = 0; i < 3; i++) {
        y = G.y0 + 2 * G.ch - 24 - i * 36 - ((clock * 70) % 36);
        ctx.beginPath();
        ctx.moveTo(x - 17, y + 15); ctx.lineTo(x, y); ctx.lineTo(x + 17, y + 15);
        ctx.stroke();
      }
    }

    function drawBricks() {
      var i, k, x, y, g;
      for (i = 0; i < bricks.length; i++) {
        k = bricks[i];
        x = G.x0 + k.c * G.cw + C.pad; y = G.y0 + k.r * G.ch + C.pad;
        if (k.alive) {
          ctx.drawImage(k.type === 1 ? sprites.gold : k.type === 2 ? sprites.bomb
                                                    : sprites.faces[k.col], x, y, BW, BH);
        } else if (k.flash > 0) {                  // the ghost of a smashed brick
          g = 1 - clamp(k.flash, 0, 1);
          ctx.globalAlpha = clamp(k.flash, 0, 1) * 0.65;
          ctx.fillStyle = "#ffffff";
          rr(ctx, x - 4 * g, y - 4 * g, BW + 8 * g, BH + 8 * g, 10);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    function drawPit() {
      var g = ctx.createLinearGradient(0, field.floor, 0, Layout.bottom);
      g.addColorStop(0, "rgba(255,45,120,.28)");
      g.addColorStop(1, "rgba(255,45,120,0)");
      ctx.fillStyle = g;
      ctx.fillRect(field.left, field.floor, field.right - field.left, Layout.bottom - field.floor);
      ctx.strokeStyle = "rgba(255,95,176,.75)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(field.left, field.floor); ctx.lineTo(field.right, field.floor); ctx.stroke();
    }

    function drawTrace() {
      if (!trace || trace.length < 6) return;
      var i, n = trace.length / 2, x, y;
      ctx.fillStyle = "#ffffff";
      for (i = 3; i < n; i += 3) {
        ctx.globalAlpha = clamp(1 - i / n, 0.1, 0.75);
        ctx.beginPath(); ctx.arc(trace[i * 2], trace[i * 2 + 1], 4.5, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (traceHit) {
        x = G.x0 + traceHit.c * G.cw + G.cw / 2; y = G.y0 + traceHit.r * G.ch + G.ch / 2;
        ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x, y, 17 + Math.sin(clock * 8) * 2, 0, TAU); ctx.stroke();
      }
    }

    function drawCannon() {
      var len = 62, g, i, n, x;
      ctx.save();
      ctx.translate(cannon.x, cannon.y);
      ctx.rotate(aimA + Math.PI / 2);              // the barrel is authored up
      g = ctx.createLinearGradient(-18, 0, 18, 0);
      g.addColorStop(0, "#c2660f"); g.addColorStop(0.42, "#ffc061"); g.addColorStop(1, "#ff8a1a");
      ctx.fillStyle = g;
      rr(ctx, -17, -len, 34, len + 18, 13); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.4)";
      rr(ctx, -9, -len + 9, 7, len - 6, 4); ctx.fill();
      ctx.restore();

      ctx.fillStyle = "#ff8a1a"; rr(ctx, cannon.x - 48, cannon.y - 2, 96, 28, 14); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.42)"; rr(ctx, cannon.x - 37, cannon.y + 4, 74, 8, 4); ctx.fill();

      // the volley still loaded, one dot per ball
      if (phase === "aim" && ammo > 0) {
        n = ammo; ctx.fillStyle = "#dffcff";
        for (i = 0; i < n; i++) {
          x = cannon.x + (i - (n - 1) / 2) * 18;
          ctx.beginPath(); ctx.arc(x, cannon.y + 40, 6, 0, TAU); ctx.fill();
        }
      }
      if (phase === "aim") drawTrace();
    }

    function drawBalls() {
      var i, b, sp;
      ctx.lineCap = "round";
      for (i = 0; i < balls.length; i++) {
        b = balls[i]; if (!b.alive) continue;
        sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
        ctx.strokeStyle = "rgba(126,249,255,.3)"; ctx.lineWidth = C.ballR * 1.4;
        ctx.beginPath();
        ctx.moveTo(b.x - b.vx / sp * 36, b.y - b.vy / sp * 36); ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.fillStyle = "rgba(126,249,255,.2)";
        ctx.beginPath(); ctx.arc(b.x, b.y, C.ballR * 1.9, 0, TAU); ctx.fill();
        ctx.fillStyle = "#dffcff";
        ctx.beginPath(); ctx.arc(b.x, b.y, C.ballR, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(b.x - C.ballR * 0.28, b.y - C.ballR * 0.3, C.ballR * 0.45, 0, TAU); ctx.fill();
      }
    }

    // The chain is the whole scoring rule, so it is on screen while it runs.
    function drawChain() {
      if (chain < 2 || phase === "wheel") return;
      var w = 250, h = 46, x = cannon.x - w / 2, y = field.floor - 92;
      var t = clamp(1 - chainT / C.chainWindow, 0, 1);
      var col = chain >= 15 ? "#ff2d78" : chain >= 8 ? "#ffb44f" : "#4bf5ff";
      ctx.fillStyle = "rgba(6,9,26,.72)"; rr(ctx, x, y, w, h, 23); ctx.fill();
      ctx.fillStyle = rgba(col, 0.3); rr(ctx, x + 4, y + 4, (w - 8) * t, h - 8, 19); ctx.fill();
      ctx.strokeStyle = rgba(col, 0.85); ctx.lineWidth = 2; rr(ctx, x, y, w, h, 23); ctx.stroke();
      ctx.fillStyle = col;
      ctx.font = "900 30px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("CHAIN x" + chain, x + w / 2, y + h / 2 + 1);
    }

    function drawWheel() {
      var cx = cannon.x, cy = wheelY(), R = C.wheelRadius;
      var n = C.wheelValues.length, segA = TAU / n, i, a0, mid;
      // Once the number is locked the whole wheel fades out onto the board.
      var fade = wheel.state === "done" ? clamp(1 - wheel.hold / 0.9, 0, 1) : 1;
      ctx.globalAlpha = fade;
      ctx.fillStyle = "rgba(4,6,20,.86)"; ctx.fillRect(0, 0, view.w, view.h);

      for (i = 3; i >= 1; i--) {                   // rim glow, no shadowBlur
        ctx.strokeStyle = rgba("#4bf5ff", 0.07 * i); ctx.lineWidth = 7 * i;
        ctx.beginPath(); ctx.arc(cx, cy, R + 10, 0, TAU); ctx.stroke();
      }
      for (i = 0; i < n; i++) {
        a0 = wheel.a + i * segA;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + segA); ctx.closePath();
        ctx.fillStyle = (wheel.state === "done" && i === wheel.seg) ? "#fff3b0" : WHEEL_COLS[i];
        ctx.fill();
        ctx.strokeStyle = "rgba(6,9,26,.6)"; ctx.lineWidth = 3; ctx.stroke();
      }
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (i = 0; i < n; i++) {
        mid = wheel.a + (i + 0.5) * segA;
        ctx.save();
        ctx.translate(cx + Math.cos(mid) * R * 0.68, cy + Math.sin(mid) * R * 0.68);
        ctx.rotate(mid + Math.PI / 2);
        ctx.fillStyle = "#0a0f2e";
        ctx.font = "900 54px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.fillText(C.wheelValues[i], 0, 0);
        ctx.restore();
      }
      ctx.fillStyle = "#0a0f2e"; ctx.beginPath(); ctx.arc(cx, cy, 56, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#4bf5ff"; ctx.lineWidth = 4; ctx.stroke();
      ctx.fillStyle = "#4bf5ff"; ctx.font = "900 26px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.fillText("BALLS", cx, cy + 1);

      ctx.fillStyle = "#ffb44f";                   // the pointer
      ctx.beginPath();
      ctx.moveTo(cx, cy - R + 30); ctx.lineTo(cx - 24, cy - R - 24); ctx.lineTo(cx + 24, cy - R - 24);
      ctx.closePath(); ctx.fill();

      ctx.font = "900 34px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.fillStyle = "rgba(255,255,255,.72)";
      ctx.fillText("SPIN FOR YOUR VOLLEY", cx, cy - R - 52);
      ctx.font = "900 42px -apple-system,Segoe UI,Roboto,sans-serif";
      if (wheel.state === "spin") {
        ctx.globalAlpha = fade * (0.55 + 0.45 * Math.sin(clock * 6));
        ctx.fillStyle = "#ffffff"; ctx.fillText("TAP TO STOP", cx, cy + R + 72);
      } else if (wheel.state === "done") {
        ctx.fillStyle = "#ffd43b"; ctx.fillText(ammo + " BALLS LOADED", cx, cy + R + 72);
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, view.w, view.h);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, Layout.top - 20, view.w, Layout.bottom - Layout.top + 20);
      drawWalls();
      if (phase === "aim") drawCorridor();
      drawBricks();
      drawPit();
      drawCannon();
      drawBalls();
      drawChain();
      if (phase === "wheel") drawWheel();
    }

    function onResize() { geometry(); buildSprites(); }

    return { reset: reset, update: update, render: render,
             onDown: onDown, onMove: onMove, onUp: onUp, onResize: onResize };
  })();

  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
