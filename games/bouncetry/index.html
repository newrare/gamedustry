  }

  /* ===================================================================
     6. GAME — BOUNCETRY: a glass wall in two colours, over a lake of lava.

     A round is three beats, and the middle two repeat until the balls run
     out:
       wheel   the bonus wheel spins itself and lands on one power — row,
               column, bomb, multiball or a mix of them — and hands it to
               THREE random bricks on the board. That is the whole draw: the
               player never chooses it, they read the board it produced.
       aim     drag to swing the turret. The dotted sight solves the next
               FIVE bounces — walls and bricks alike — and the release fires
               ONE ball. The player re-aims between every shot.
       flight  the ball ricochets until the lava takes it. The lake is the
               only thing that can destroy a ball. The three other walls are
               an electric fence: invisible until a ball strikes one, then
               lit as a crackling arc for a few tenths of a second.

     THE COLOUR RULE is the whole game. Bricks are red or blue, laid out in
     two-by-two blocks; the magazine alternates a red ball and a blue one,
     and a ball only breaks its OWN colour. The other colour is a wall — it
     ricochets, which is exactly what a chain needs. When one colour is wiped
     out, every ball left (in the magazine and in flight) turns to the colour
     that remains, so a run never dead-ends.

     Bonus bricks carry a Lucide pictogram (ASSETS.images.ico*, drawn through
     the motor's Icon helper) and, once broken by a ball of their colour:
       row        clears their whole row, both colours
       column     clears their whole column, both colours
       bomb       detonates the eight neighbours, both colours
       multiball  releases three extra balls, in the colour the board still
                  needs the most

     The board is one of three hand-drawn blueprints, mirrored at random and
     pierced by one random gap in the ceiling wall. Every blueprint is built
     out of funnels, wall channels and a chamber whose only way in is a slit,
     so a well-read ball rattles for a dozen bounces instead of dropping
     straight back into the lava. The two outermost columns are never built
     on: those lanes are what lets a ball run the walls and come back up.
     =================================================================== */
  var Game = (function () {
    var C = CONFIG, TAU = Math.PI * 2;

    /* --- the two sides ------------------------------------------------ */
    var RED = 0, BLUE = 1;
    var SIDE = [
      { key: "red",  light: "#ffd9dd", core: "#ff3b57", edge: "#8c0f22", name: "RED"  },
      { key: "blue", light: "#d4e9ff", core: "#2f86ff", edge: "#0b3f8c", name: "BLUE" }
    ];

    /* --- the bonuses the wheel hands out ------------------------------ */
    var B_ROW = "row", B_COL = "col", B_BOMB = "bomb", B_MULTI = "multi";
    var BONUS = {};
    BONUS[B_ROW]   = { icon: "icoRow",   word: "ROW BLAST",    sub: "CLEARS ITS ROW" };
    BONUS[B_COL]   = { icon: "icoCol",   word: "COLUMN BLAST", sub: "CLEARS ITS COLUMN" };
    BONUS[B_BOMB]  = { icon: "icoBomb",  word: "BOMB",         sub: "TAKES THE NEIGHBOURS" };
    BONUS[B_MULTI] = { icon: "icoMulti", word: "MULTIBALL",    sub: "+3 BALLS IN FLIGHT" };
    // The wheel's own faces: the four powers, then the mixed bag.
    var WHEEL = [
      { bonus: B_ROW,   icon: "icoRow",   label: "ROW",       col: "#22d3ee" },
      { bonus: B_MULTI, icon: "icoMulti", label: "MULTIBALL", col: "#4ade80" },
      { bonus: B_COL,   icon: "icoCol",   label: "COLUMN",    col: "#a855f7" },
      { bonus: B_BOMB,  icon: "icoBomb",  label: "BOMB",      col: "#ff8a1a" },
      { bonus: "mixed", icon: "icoMixed", label: "MIXED BAG", col: "#ffd43b" }
    ];

    /* --- the blueprints ------------------------------------------------
         .  empty    #  brick. Colours are laid on afterwards, in blocks. */
    var BLUEPRINTS = [
      // THE VAULT — a sealed treasure room with one slit at the bottom: the
      // shaft between its two walls is where a ball rattles the longest.
      [".######.",
       ".######.",
       "........",
       ".######.",
       ".#.##.#.",
       "..####..",
       "..####..",
       "..#..#..",
       ".#....#.",
       ".##..##.",
       "..#..#.."],
      // THE CATHEDRAL — a big nave with a single skylight at (4,8); a ball
      // that finds it never wants to leave.
      [".######.",
       ".######.",
       "........",
       ".######.",
       ".#....#.",
       ".#.##.#.",
       ".#....#.",
       ".#....#.",
       ".###.##.",
       "..#..#..",
       ".#.##.#."],
      // THE HOURGLASS — two mirrored funnels squeezing a solid core: every
      // diagonal face throws the ball sideways instead of back at the lava.
      [".######.",
       ".######.",
       "........",
       ".#....#.",
       ".##..##.",
       "..####..",
       "..####..",
       "..####..",
       ".##..##.",
       ".#....#.",
       ".#....#."]
    ];

    /* --- geometry, rebuilt whenever Layout moves ---------------------- */
    var field = { left: 0, right: 0, top: 0, floor: 0 };
    var G = { cols: 0, rows: 0, cw: 0, ch: 0, x0: 0, y0: 0 };
    var cannon = { x: 0, y: 0 };
    var BW = 0, BH = 0;             // a brick face, inside its cell
    var sprites = null;             // cached brick faces, one canvas per look
    var bgGrad = null, lavaGrad = null;

    /* --- run state ---------------------------------------------------- */
    var phase;                      // "wheel" | "aim" | "flight" | "over"
    var cells, bricks, total, broken, gap, standing;
    var balls, queue, fired, shotSide;
    var score, chain, bestChain, chainT;
    var aimA, aiming, trace, traceHits, traceMarks;
    var wheel, clock, flightT, endT, idleT, recoil;
    var hinted, pulled, cleared, converted, lastWall, lastPop;
    var beams, bubbles, zaps;

    /* --- small canvas helpers ---------------------------------------- */
    function rr(x, px, py, w, h, r) {
      var k = Math.min(r, w / 2, h / 2);
      x.beginPath();
      x.moveTo(px + k, py);
      x.lineTo(px + w - k, py); x.quadraticCurveTo(px + w, py, px + w, py + k);
      x.lineTo(px + w, py + h - k); x.quadraticCurveTo(px + w, py + h, px + w - k, py + h);
      x.lineTo(px + k, py + h); x.quadraticCurveTo(px, py + h, px, py + h - k);
      x.lineTo(px, py + k); x.quadraticCurveTo(px, py, px + k, py);
      x.closePath();
    }

    function geometry() {
      field.left  = Layout.left;
      field.right = Layout.right;
      field.top   = Layout.top + 6;
      field.floor = Layout.bottom - C.lavaH;      // the surface of the lake
      G.cols = C.cols; G.rows = C.rows;
      G.cw = (field.right - field.left) / G.cols;
      G.ch = C.cellH;
      G.x0 = field.left;
      G.y0 = field.top + C.atticH;          // the attic stays open above row 0
      BW = G.cw - C.pad * 2; BH = G.ch - C.pad * 2;
      cannon.x = (field.left + field.right) / 2;
      cannon.y = field.floor - C.cannonH;
      bgGrad = ctx.createLinearGradient(0, 0, 0, Layout.bottom);
      bgGrad.addColorStop(0, "#1b246c");
      bgGrad.addColorStop(0.42, "#131a4c");
      bgGrad.addColorStop(0.78, "#0c1136");
      bgGrad.addColorStop(1, "#1a0d24");
      lavaGrad = ctx.createLinearGradient(0, field.floor, 0, Layout.bottom + 12);
      lavaGrad.addColorStop(0, "#ffd36b");
      lavaGrad.addColorStop(0.16, "#ff8a1a");
      lavaGrad.addColorStop(0.55, "#e03400");
      lavaGrad.addColorStop(1, "#540900");
    }

    /* --- brick faces, rendered once -----------------------------------
       TEMPERED GLASS (the material picked in lab/brick.html): the body is
       barely tinted so the board reads THROUGH the wall, and the whole shape
       comes from a hard inner bevel, one diagonal refraction band and a
       chipped top corner. No shadowBlur: each look is rasterized here once
       and blitted afterwards. */
    function face(p, bonus) {
      var w = Math.max(2, Math.round(BW)), h = Math.max(2, Math.round(BH));
      var cv = document.createElement("canvas"), x = cv.getContext("2d"), d = 2, g;
      cv.width = w * d; cv.height = h * d; x.setTransform(d, 0, 0, d, 0, 0);

      rr(x, 1, 1, w - 2, h - 2, 12); x.fillStyle = rgba(p.core, 0.5); x.fill();
      x.save(); rr(x, 1, 1, w - 2, h - 2, 12); x.clip();
      g = x.createLinearGradient(0, h * 0.45, 0, h);      // the lip, full colour
      g.addColorStop(0, rgba(p.core, 0)); g.addColorStop(1, rgba(p.edge, 0.85));
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      g = x.createLinearGradient(0, h, w * 0.75, 0);        // the refraction
      g.addColorStop(0, "rgba(255,255,255,0)");
      g.addColorStop(0.42, "rgba(255,255,255,.34)");
      g.addColorStop(0.5, "rgba(255,255,255,.06)");
      g.addColorStop(0.62, "rgba(255,255,255,.22)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.fillStyle = "rgba(255,255,255,.42)";                // the chipped corner
      x.beginPath(); x.moveTo(w - 20, 0); x.lineTo(w, 0); x.lineTo(w, 15); x.closePath(); x.fill();
      x.restore();
      rr(x, 3.5, 3.5, w - 7, h - 7, 10);                    // the inner bevel
      x.strokeStyle = rgba(p.light, 0.5); x.lineWidth = 3; x.stroke();
      rr(x, 1.5, 1.5, w - 3, h - 3, 12);
      x.strokeStyle = rgba(p.light, 0.95); x.lineWidth = 2; x.stroke();

      if (bonus) {
        // A charged pane: the glass is lit from the inside, a second rim runs
        // around it, and the power's pictogram is etched on the face.
        x.save(); rr(x, 2, 2, w - 4, h - 4, 11); x.clip();
        g = x.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w * 0.55);
        g.addColorStop(0, "rgba(255,255,255,.4)"); g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g; x.fillRect(0, 0, w, h);
        x.restore();
        rr(x, 5.5, 5.5, w - 11, h - 11, 8);
        x.strokeStyle = "rgba(255,255,255,.8)"; x.lineWidth = 2; x.stroke();
        Icon.draw(x, BONUS[bonus].icon, w / 2, h / 2, Math.round(h * 0.7), "#ffffff");
      }
      return cv;
    }
    function buildSprites() {
      var i, k, plain = [], charged = [{}, {}];
      for (i = 0; i < SIDE.length; i++) {
        plain.push(face(SIDE[i], null));
        for (k in BONUS) if (BONUS.hasOwnProperty(k)) charged[i][k] = face(SIDE[i], k);
      }
      sprites = { plain: plain, charged: charged };
    }

    /* --- the board ---------------------------------------------------- */
    function cellAt(c, r) {
      if (c < 0 || c >= G.cols || r < 0 || r >= G.rows) return null;
      return cells[r * G.cols + c];
    }
    function removeAt(c, r) {
      var k = cellAt(c, r), i;
      if (!k) return;
      cells[r * G.cols + c] = null;
      i = bricks.indexOf(k);
      if (i >= 0) bricks.splice(i, 1);
    }
    function buildBoard() {
      var plan = Rand.pick(BLUEPRINTS), flip = Rand.chance(0.5), swap = Rand.chance(0.5) ? 1 : 0;
      var r, c, k, cand = [];
      cells = new Array(G.cols * G.rows); bricks = [];
      standing = [0, 0];
      for (r = 0; r < G.rows; r++) {
        for (c = 0; c < G.cols; c++) {
          // The two outermost columns are never built on: those lanes are
          // what lets a ball run the walls and come back up for another pass.
          if (c === 0 || c === G.cols - 1) continue;
          if (plan[r].charAt(flip ? G.cols - 1 - c : c) !== "#") continue;
          // Colour in two-by-two blocks: big enough to aim at, small enough
          // that both colours are always within reach of the same shot.
          k = { c: c, r: r, side: ((((c >> 1) + (r >> 1)) & 1) ^ swap),
                bonus: null, alive: true, flash: 0 };
          cells[r * G.cols + c] = k; bricks.push(k);
          standing[k.side]++;
        }
      }
      // The gap: one column punched out of the ceiling wall. Threading it puts
      // the ball in the attic, where it rakes the whole wall from the inside —
      // the single best shot on the board, and it moves every run.
      for (c = 1; c < G.cols - 1; c++) if (cellAt(c, 0) && cellAt(c, 1)) cand.push(c);
      gap = cand.length ? Rand.pick(cand) : (G.cols >> 1);
      if (cellAt(gap, 0)) standing[cellAt(gap, 0).side]--;
      if (cellAt(gap, 1)) standing[cellAt(gap, 1).side]--;
      removeAt(gap, 0); removeAt(gap, 1);

      total = bricks.length; broken = 0;
    }
    function makeBubbles() {
      var i;
      bubbles = [];
      for (i = 0; i < 14; i++)
        bubbles.push({ x: Rand.range(field.left + 16, field.right - 16),
                       r: Rand.range(3, 7), s: Rand.range(0.22, 0.55), o: Rand.range(0, 1) });
    }

    /* --- the wheel: it deals the powers, the player only reads them ---- */
    function wheelY() { return Layout.top + Layout.h * 0.34; }
    function wheelReset() {
      var segA = TAU / WHEEL.length, a = Rand.range(0, TAU);
      wheel = { a: a, state: "spin", t: 0, T: 1, a0: 0, seg: 0, hold: 0,
                tick: Math.floor(a / segA) };
    }
    function wheelStop() {
      var n = WHEEL.length, segA = TAU / n;
      var i = Rand.int(0, n - 1);
      // The rotation that parks segment i under the pointer, plus enough whole
      // turns that the wheel always brakes over ~1.1 to 2.2 seconds: it is the
      // opening beat of the round, not a minigame of its own.
      var delta = (-Math.PI / 2 - (i + 0.5) * segA) - wheel.a;
      while (delta < C.wheelSpeed * 0.55) delta += TAU;
      wheel.a0 = wheel.a; wheel.T = 2 * delta / C.wheelSpeed;
      wheel.t = 0; wheel.seg = i; wheel.state = "slow";
      Sound.clip("tick", 0.5, 1.1);
    }
    /* The prize is not a number, it is three charged bricks. They are picked
       away from the very bottom row so a power is never wasted on a brick the
       first shot would have taken anyway. */
    function dealBonus(kind) {
      var pool = [], i, k, n = 0, which;
      for (i = 0; i < bricks.length; i++) if (!bricks[i].bonus && bricks[i].r < G.rows - 1) pool.push(bricks[i]);
      for (i = 0; i < C.bonusBricks && pool.length; i++) {
        k = pool.splice(Rand.int(0, pool.length - 1), 1)[0];
        which = kind === "mixed" ? Rand.pick([B_ROW, B_COL, B_BOMB, B_MULTI]) : kind;
        k.bonus = which; n++;
        Fx.ring(brickX(k) + BW / 2, brickY(k) + BH / 2,
                { from: 6, to: 74, color: SIDE[k.side].core, width: 5, life: 0.5 });
      }
      return n;
    }
    function wheelLand() {
      var w = WHEEL[wheel.seg];
      wheel.state = "done"; wheel.hold = 0;
      dealBonus(w.bonus);
      Sound.clip("lock", 0.85);
      Fx.flash("#ffffff", 0.3); Fx.shake(9, 0.3);
      Fx.ring(cannon.x, wheelY(), { from: C.wheelRadius * 0.5, to: C.wheelRadius * 1.6,
                                    color: w.col, width: 10, life: 0.5 });
      Pop.show(w.bonus === "mixed" ? "ultra" : "combo",
               { word: w.label, sub: C.bonusBricks + " BRICKS CHARGED", at: popAt() });
    }
    function updateWheel(dt) {
      var segA = TAU / WHEEL.length, v = 0, s;
      if (wheel.state === "spin") {
        // The wheel is the dealer, not a minigame: it spins and stops on its
        // own, so the round opens on the shot instead of on a tap.
        wheel.a += C.wheelSpeed * dt; v = C.wheelSpeed;
        wheel.t += dt;
        if (wheel.t > C.wheelSpin) { wheelStop(); return; }
      } else if (wheel.state === "slow") {
        wheel.t = Math.min(wheel.T, wheel.t + dt);
        v = C.wheelSpeed * (1 - wheel.t / wheel.T);
        wheel.a = wheel.a0 + C.wheelSpeed * wheel.t
                - C.wheelSpeed * wheel.t * wheel.t / (2 * wheel.T);
        if (wheel.t >= wheel.T) { wheelLand(); return; }
      } else {
        wheel.hold += dt;
        if (wheel.hold > 0.6) {
          phase = "aim"; idleT = 0; traceShot();
          zapAll(0.55);                        // power the fence up once
          Overlay.toast("A BALL ONLY BREAKS ITS OWN COLOUR", { color: "#7ef9ff", dur: 2600 });
        }
        return;
      }
      s = Math.floor(wheel.a / segA);
      if (s !== wheel.tick) {                      // one tick per segment
        if (v < 7) Sound.clip("tick", 0.3, 1.5);   // only once it is readable
        wheel.tick = s;
      }
    }

    /* Every comic callout lands in the same band — the strip between the
       turret and the CTA bar — so a big word never covers the bricks the
       player is busy reading. */
    function popAt() {
      return { x: Layout.cx, y: field.floor + (Layout.bottom - field.floor) * 0.45 };
    }
    function brickX(k) { return G.x0 + k.c * G.cw + C.pad; }
    function brickY(k) { return G.y0 + k.r * G.ch + C.pad; }

    /* --- the electric fence --------------------------------------------
       The play area carries no painted frame: the three walls only exist at
       the instant a ball strikes one. Every contact drops a `zap` on that
       side, which lights it as a crackling line — white-hot at the impact,
       dying out toward the two corners — and fades in a few tenths of a
       second. The physics box never changes; the arcs are only what the
       player is shown of it. Same fence as games/spinshock. */
    var SIDE_L = 0, SIDE_R = 1, SIDE_T = 2;
    var ZAP_SEGS = 24;              // vertices of one lightning polyline
    var ZAP_MERGE = 90;             // px within which a hit re-lights the old arc
    // A wide dim halo down to a white-hot core: shadowBlur is banned in frame.
    var ZAP_PASSES = [[20, 0.10], [11, 0.22], [5, 0.5], [2.2, 1]];

    function zapSpan(side) { return side === SIDE_T ? field.right - field.left : field.floor - field.top; }
    function zapBase(side) { return side === SIDE_T ? field.left : field.top; }
    function zapEdge(side) {
      return side === SIDE_L ? field.left : side === SIDE_R ? field.right : field.top;
    }
    function zapRoll(z) {
      z.seg.length = 0;
      for (var i = 0; i <= ZAP_SEGS; i++) z.seg.push(Rand.range(-1, 1));
      z.seg[0] = 0; z.seg[ZAP_SEGS] = 0;         // pinned to the two corners
    }
    function zap(side, x, y, power, col) {
      var len = zapSpan(side);
      var p = clamp(((side === SIDE_T ? x - field.left : y - field.top)) / len, 0, 1);
      var i, z;
      for (i = 0; i < zaps.length; i++) {        // re-light, never stack
        z = zaps[i];
        if (z.side === side && Math.abs(z.p - p) * len < ZAP_MERGE) {
          z.t = 0; z.p = p; z.col = col; z.power = Math.max(z.power, power);
          zapRoll(z);
          return;
        }
      }
      z = { side: side, p: p, t: 0, life: 0.3 + 0.34 * power, power: power,
            col: col, crackle: 0, seg: [] };
      zapRoll(z);
      zaps.push(z);
    }
    // The round opens with the fence powering up once, so the player is told
    // where the walls are before the first ball ever reaches one.
    function zapAll(power) {
      zap(SIDE_T, (field.left + field.right) / 2, field.top, power, "#7ef9ff");
      zap(SIDE_L, field.left, (field.top + field.floor) / 2, power, "#7ef9ff");
      zap(SIDE_R, field.right, (field.top + field.floor) / 2, power, "#7ef9ff");
    }
    function updateZaps(dt) {
      for (var i = zaps.length - 1; i >= 0; i--) {
        var z = zaps[i];
        z.t += dt;
        if (z.t >= z.life) { zaps.splice(i, 1); continue; }
        z.crackle -= dt;                         // only the young arc crackles
        if (z.crackle <= 0 && z.t < z.life * 0.55) { zapRoll(z); z.crackle = 0.045; }
      }
    }
    // createLinearGradient only accepts offsets inside 0..1, and an impact
    // near a corner pushes the lit window past both ends.
    function addStop(g, at, col) { if (at > 0 && at < 1) g.addColorStop(at, col); }

    function drawZap(z) {
      var k = clamp(1 - z.t / z.life, 0, 1);     // 1 on impact, 0 once gone
      var flash = Math.pow(k, 0.55);
      var horiz = z.side === SIDE_T;
      var len = zapSpan(z.side), base = zapBase(z.side), edge = zapEdge(z.side);
      var w = (0.08 + 0.14 * z.power) * (0.85 + 0.4 * (1 - k));
      var amp = (6 + 15 * z.power) * (0.3 + 0.7 * k);
      var inward = z.side === SIDE_R ? -1 : 1;   // the arc bows into the field
      var i, q, u, d, o, x, y, g, a, col;

      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (q = 0; q < ZAP_PASSES.length; q++) {
        a = ZAP_PASSES[q][1] * flash;
        col = q === ZAP_PASSES.length - 1 ? "#ffffff" : z.col;
        g = horiz ? ctx.createLinearGradient(base, 0, base + len, 0)
                  : ctx.createLinearGradient(0, base, 0, base + len);
        g.addColorStop(0, rgba(col, 0));         // dark past the lit window
        addStop(g, z.p - w * 1.8, rgba(col, 0));
        addStop(g, z.p - w, rgba(col, a * 0.2));
        addStop(g, z.p, rgba(col, a));
        addStop(g, z.p + w, rgba(col, a * 0.2));
        addStop(g, z.p + w * 1.8, rgba(col, 0));
        g.addColorStop(1, rgba(col, 0));
        ctx.strokeStyle = g;
        ctx.lineWidth = ZAP_PASSES[q][0] * (0.35 + 0.65 * k);
        ctx.beginPath();
        for (i = 0; i <= ZAP_SEGS; i++) {
          u = i / ZAP_SEGS;
          d = base + u * len;
          o = z.seg[i] * amp * Math.max(0, 1 - Math.abs(u - z.p) / (w * 1.4));
          if (o * inward < 0) o *= 0.35;         // barely any overshoot outward
          x = horiz ? d : edge + o;
          y = horiz ? edge + o : d;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      var px = horiz ? base + z.p * len : edge;  // the contact node itself
      var py = horiz ? edge : base + z.p * len;
      ctx.globalAlpha = flash;
      ctx.fillStyle = rgba(z.col, 0.5);
      ctx.beginPath(); ctx.arc(px, py, 4 + 20 * z.power * k, 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(px, py, 2 + 7 * z.power * k, 0, TAU); ctx.fill();
      ctx.restore();
    }
    function drawZaps() { for (var i = 0; i < zaps.length; i++) drawZap(zaps[i]); }

    /* --- collision, shared by the ball and by the sight ----------------
       Circle against the cell grid: the deepest overlap wins and the contact
       normal is written into HIT, so a corner deflects the shot instead of
       mirroring it like a face. The preview calls the very same code, which
       is what makes the five-bounce sight honest. */
    var HIT = { k: null, ux: 0, uy: 0, d: 0 };
    function probe(x, y, R, skip) {
      var c, r, k, bx, by, dx, dy, d2, ox, oy, d;
      var best = null, bestD = 1e9, bnx = 0, bny = 0, bbx = 0, bby = 0;
      var c0 = Math.floor((x - R - G.x0) / G.cw), c1 = Math.floor((x + R - G.x0) / G.cw);
      var r0 = Math.floor((y - R - G.y0) / G.ch), r1 = Math.floor((y + R - G.y0) / G.ch);
      for (r = r0; r <= r1; r++) for (c = c0; c <= c1; c++) {
        k = cellAt(c, r);
        if (!k || !k.alive || (skip && skip[r * G.cols + c])) continue;
        bx = G.x0 + c * G.cw + C.pad; by = G.y0 + r * G.ch + C.pad;
        dx = x - clamp(x, bx, bx + BW); dy = y - clamp(y, by, by + BH);
        d2 = dx * dx + dy * dy;
        if (d2 > R * R || d2 >= bestD) continue;
        best = k; bestD = d2; bnx = dx; bny = dy; bbx = bx; bby = by;
      }
      HIT.k = best;
      if (!best) return null;
      d = Math.sqrt(bestD);
      if (d > 0.0001) { HIT.ux = bnx / d; HIT.uy = bny / d; }
      else {                                       // dead centre: shortest way out
        ox = x - (bbx + BW / 2); oy = y - (bby + BH / 2);
        if (Math.abs(ox) / BW > Math.abs(oy) / BH) { HIT.ux = ox < 0 ? -1 : 1; HIT.uy = 0; }
        else { HIT.ux = 0; HIT.uy = oy < 0 ? -1 : 1; }
      }
      HIT.d = d;
      return best;
    }

    /* A ball that settles into a flat rally never comes down. The floor on
       its vertical speed is applied at constant speed and WITHOUT any random
       nudge: every bounce is reproducible, or the sight would be lying. */
    function settle(o) {
      var sp = Math.sqrt(o.vx * o.vx + o.vy * o.vy) || 1, m = sp * C.minVyRatio;
      if (Math.abs(o.vy) >= m) return;
      o.vy = (o.vy < 0 ? -1 : 1) * m;
      o.vx = (o.vx < 0 ? -1 : 1) * Math.sqrt(Math.max(0, sp * sp - m * m));
    }
    function reflect(o, ux, uy) {
      var vn = o.vx * ux + o.vy * uy;
      if (vn < 0) { o.vx -= 2 * vn * ux; o.vy -= 2 * vn * uy; }
      settle(o);
    }

    /* --- aiming ------------------------------------------------------- */
    function aimAt(p) {
      var dx = p.x - cannon.x, dy = p.y - cannon.y;
      if (dy > -40) dy = -40;                      // never aim into the lava
      var lim = C.minAimDeg * Math.PI / 180;
      aimA = clamp(Math.atan2(dy, dx), -Math.PI + lim, -lim);
      traceShot();
    }
    /* The sight solves the next five bounces — walls AND bricks — for the
       ball ABOUT TO BE FIRED: a brick of its colour is taken out of the way
       once the preview has broken it, a brick of the other colour stays and
       keeps bouncing, exactly as it will in flight. */
    function traceShot() {
      var R = C.ballR, step = 7, n = 0, bounces = 0, skip = {}, k, push;
      var side = queue.length ? queue[0] : RED;
      var o = { x: cannon.x + Math.cos(aimA) * C.muzzle,
                y: cannon.y + Math.sin(aimA) * C.muzzle,
                vx: Math.cos(aimA), vy: Math.sin(aimA) };
      trace = [o.x, o.y]; traceHits = []; traceMarks = [];
      while (n++ < 2400 && bounces < C.traceBounces) {
        o.x += o.vx * step; o.y += o.vy * step;
        push = false;
        if (o.x - R < field.left)       { o.x = field.left + R;  reflect(o,  1, 0); push = true; }
        else if (o.x + R > field.right) { o.x = field.right - R; reflect(o, -1, 0); push = true; }
        if (o.y - R < field.top)        { o.y = field.top + R;   reflect(o, 0,  1); push = true; }
        if (push) { bounces++; traceMarks.push(o.x, o.y); }
        trace.push(o.x, o.y);
        if (o.y + R >= field.floor) break;         // the lava, and the shot is over
        k = probe(o.x, o.y, R, skip);
        if (!k) continue;
        o.x += HIT.ux * (R - HIT.d + 0.5); o.y += HIT.uy * (R - HIT.d + 0.5);
        reflect(o, HIT.ux, HIT.uy);
        bounces++; traceMarks.push(o.x, o.y);
        if (k.side === side) { traceHits.push(k); skip[k.r * G.cols + k.c] = 1; }
      }
    }

    /* --- the magazine -------------------------------------------------- */
    function ballsLeft() { return queue.length + balls.length; }
    function refreshHUD() {
      HUD.setLeft(ballsLeft(), "BALLS");
      HUD.setRight(total - broken, "BRICKS");
    }
    /* One colour left standing means half the magazine is dead weight, so the
       balls change side — in the queue AND in flight. A run never dead-ends
       on a colour that has nothing left to break. */
    function checkConvert() {
      var live = standing[RED] > 0 ? (standing[BLUE] > 0 ? -1 : RED) : BLUE;
      var i, n = 0;
      if (live < 0 || converted || broken >= total) return;
      converted = true;
      for (i = 0; i < queue.length; i++) if (queue[i] !== live) { queue[i] = live; n++; }
      for (i = 0; i < balls.length; i++) if (balls[i].side !== live) {
        balls[i].side = live; n++;
        Fx.ring(balls[i].x, balls[i].y, { from: 6, to: 60, color: SIDE[live].core, width: 5, life: 0.4 });
      }
      if (!n) return;
      Sound.clip("gold", 0.7, 1.15);
      Overlay.vignette(rgba(SIDE[live].core, 0.75), 1, 520);
      Pop.show("bonus", { word: "ALL " + SIDE[live].name, sub: "BALLS CONVERTED", at: popAt() });
    }

    /* --- the shot ----------------------------------------------------- */
    function spawn(side, x, y, a) {
      balls.push({ x: x, y: y, vx: Math.cos(a) * C.ballSpeed, vy: Math.sin(a) * C.ballSpeed,
                   side: side, alive: true });
    }
    function fire() {
      var mx = cannon.x + Math.cos(aimA) * C.muzzle;
      var my = cannon.y + Math.sin(aimA) * C.muzzle;
      var p = SIDE[shotSide = queue.shift()];
      spawn(shotSide, mx, my, aimA);
      fired++;
      phase = "flight"; flightT = 0; pulled = false; recoil = 1;
      chain = 0; chainT = 0;
      refreshHUD();
      Sound.clip("shoot", 0.85, shotSide === RED ? 1 : 1.12);
      Fx.shake(10, 0.22);
      Fx.burst(mx, my, { color: [p.core, "#ffffff"], count: 14, speed: 400,
                         life: 0.32, angle: aimA, spread: 1.1 });
      Fx.ring(mx, my, { from: 10, to: 84, color: p.core, width: 6, life: 0.28 });
    }

    function wallHit(b, side, v) {
      if (clock - lastWall > 0.05) {
        Sound.clip("wall", 0.25, Rand.range(0.92, 1.12));
        lastWall = clock;
      }
      zap(side, b.x, b.y, clamp(v / C.ballSpeed, 0.3, 1), SIDE[b.side].core);
      Fx.burst(b.x, b.y, { color: SIDE[b.side].light, count: 3, speed: 150, life: 0.22 });
    }

    /* The lava is the only thing that can take a ball, and it takes it for
       good: no bumper, no second chance, that is what makes an angle worth
       thinking about. */
    function burnBall(b) {
      b.alive = false;
      Sound.clip("burn", 0.5, 1.2);
      Fx.burst(b.x, field.floor - 4, { color: ["#fff0b8", "#ffb44f", "#ff4400"],
                                       count: 18, speed: 320, life: 0.55,
                                       angle: -Math.PI / 2, spread: 1.9, grav: 780 });
      Fx.ring(b.x, field.floor, { from: 8, to: 78, color: "#ff8a1a", width: 7, life: 0.38 });
      Fx.shake(7, 0.2);
    }

    // Between two shots the player revises: the board has changed, the sight
    // is solved again and nothing fires until the next release.
    function shotEnd() {
      if (cleared) return;
      if (broken >= total) { clearBoard(); return; }
      if (queue.length > 0) {
        phase = "aim"; aiming = false; idleT = 0; traceShot();
        if (queue.length === 1) Overlay.toast("LAST BALL", { color: "#ff8a1a" });
      } else {
        phase = "over"; endT = 0;
      }
    }

    function stepBall(b, dt) {
      var R = C.ballR, k;
      if (flightT > C.pullAfter) b.vy += C.pull * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x - R < field.left)       { b.x = field.left + R;  wallHit(b, SIDE_L, Math.abs(b.vx)); reflect(b,  1, 0); }
      else if (b.x + R > field.right) { b.x = field.right - R; wallHit(b, SIDE_R, Math.abs(b.vx)); reflect(b, -1, 0); }
      if (b.y - R < field.top)        { b.y = field.top + R;   wallHit(b, SIDE_T, Math.abs(b.vy)); reflect(b, 0,  1); }
      if (b.y + R >= field.floor) { burnBall(b); return; }
      k = probe(b.x, b.y, R, null);
      if (!k) return;
      b.x += HIT.ux * (R - HIT.d + 0.5); b.y += HIT.uy * (R - HIT.d + 0.5);
      reflect(b, HIT.ux, HIT.uy);
      if (k.side === b.side) smash(k, b, 0);
      else refuse(k, b);
    }

    /* The wrong colour does not break: it rings and throws the ball back.
       That is not a punishment, it is the geometry — half the wall is there
       to be used as a bumper. */
    function refuse(k, b) {
      var cx = brickX(k) + BW / 2, cy = brickY(k) + BH / 2;
      k.flash = 0.6;
      if (clock - lastWall > 0.05) {
        Sound.clip("steel", 0.4, k.side === RED ? 0.95 : 1.25);
        lastWall = clock;
      }
      Fx.burst(cx, cy, { color: [SIDE[k.side].light, "#ffffff"], count: 5, speed: 190, life: 0.26 });
    }

    /* --- scoring ------------------------------------------------------ */
    function chainBeat(gain) {
      if (chain === 5) {
        Pop.show("streak", { word: "HOT!", sub: "CHAIN x5", at: popAt() });
        Sound.clip("chain", 0.6, 1);
      } else if (chain === 10) {
        Pop.show("combo", { word: "CHAIN x10", sub: "+" + gain, at: popAt() });
        Sound.clip("chain", 0.75, 1.12); Fx.flash("#4bf5ff", 0.18);
      } else if (chain === 15) {
        Pop.show("combo", { word: "SMASH!", sub: "CHAIN x15", cls: "pop-blast", at: popAt() });
        Sound.clip("chain", 0.85, 1.25);
      } else if (chain >= 20 && chain % 10 === 0) {
        Pop.show("ultra", { word: "CHAIN x" + chain, sub: "+" + gain, at: popAt() });
        Sound.clip("chain", 0.95, 1.4);
        Overlay.vignette("rgba(75,245,255,.85)", 1, 620);
      }
    }

    function addBeam(horizontal, k, color) {
      beams.push({ h: horizontal, c: k.c, r: k.r, t: 0, life: 0.45, color: color });
    }

    /* `by` is the ball that caused the break, or null when a power did it:
       a power ignores colour, and that is what makes a charged brick worth
       hunting for. */
    function smash(k, by, depth) {
      if (!k || !k.alive) return;

      var bx = brickX(k), by0 = brickY(k);
      var cx = bx + BW / 2, cy = by0 + BH / 2, i, p, gain, bonus = k.bonus;

      k.alive = false; k.flash = 1; broken++; standing[k.side]--;
      chain++; chainT = 0; if (chain > bestChain) bestChain = chain;

      p = SIDE[k.side];
      gain = C.brickScore * chain * (bonus ? C.bonusMult : 1);
      score += gain;
      HUD.setScore(score);
      HUD.punch(chain >= 10 ? "#ffd43b" : p.core);
      HUD.setRight(total - broken, "BRICKS");

      Fx.burst(cx, cy, { color: [p.core, p.light, "#ffffff"], count: 10,
                         speed: 280, life: 0.42, grav: 520 });
      Fx.ring(cx, cy, { from: 8, to: 64, color: p.core, width: 4, life: 0.26 });
      Sound.clip("brick", 0.42, 1 + Math.min(chain, 18) * 0.045);

      // The comic callout is the loud one and it lives down in the callout
      // band, so only a gain worth celebrating climbs into the overlay: the
      // rest stays on the brick as cheap canvas text.
      if ((chain >= 4 || bonus) && clock - lastPop > 0.22) {
        lastPop = clock;
        Pop.show("score", { word: "+" + gain, at: popAt(), hold: 100,
                            cls: chain >= 15 ? "pop-t3" : chain >= 8 ? "pop-t2"
                               : chain >= 4 ? "pop-t1" : "pop-t0" });
      } else {
        Fx.text(cx, cy - 14, "+" + gain, { color: p.light, size: 30,
                                           tier: chain >= 8 ? 1 : 0, life: 0.6 });
      }

      if (bonus === B_BOMB) {                      // takes its eight neighbours
        Sound.clip("blast", 0.9);
        Fx.shake(15, 0.3); Fx.flash("#ffb44f", 0.28); Fx.freeze(0.04);
        Fx.burst(cx, cy, { color: ["#ffb44f", "#fff1c9", "#ff6a00"], count: 30, speed: 560, life: 0.6 });
        Fx.ring(cx, cy, { from: 20, to: 230, color: "#ffb44f", width: 9, life: 0.42 });
        if (!depth) popBonus(B_BOMB);
        smashRing(k, depth);

      } else if (bonus === B_ROW) {                // the whole row goes
        Sound.clip("line", 0.85, 0.94);
        Fx.shake(12, 0.26); Fx.flash("#22d3ee", 0.2);
        addBeam(true, k, "#22d3ee");
        if (!depth) popBonus(B_ROW);
        for (i = 0; i < G.cols; i++) smash(cellAt(i, k.r), null, depth + 1);

      } else if (bonus === B_COL) {                // the whole column goes
        Sound.clip("line", 0.85, 1.22);
        Fx.shake(12, 0.26); Fx.flash("#a855f7", 0.2);
        addBeam(false, k, "#a855f7");
        if (!depth) popBonus(B_COL);
        for (i = 0; i < G.rows; i++) smash(cellAt(k.c, i), null, depth + 1);

      } else if (bonus === B_MULTI) {              // three more balls, right now
        multiball(cx, cy, by);
      }

      chainBeat(gain);
      checkConvert();
      if (broken >= total) clearBoard();
    }
    function popBonus(kind) {
      Pop.show("combo", { word: BONUS[kind].word, sub: BONUS[kind].sub, at: popAt(),
                          cls: kind === B_BOMB ? "pop-blast" : "" });
    }
    function smashRing(k, depth) {
      var dc, dr;
      for (dr = -1; dr <= 1; dr++) for (dc = -1; dc <= 1; dc++)
        if (dc || dr) smash(cellAt(k.c + dc, k.r + dr), null, depth + 1);
    }

    /* Multiball releases its three balls in the colour the board still needs
       the most — there is no point handing out a colour that has nothing
       left to break. */
    function multiball(cx, cy, by) {
      var side = standing[RED] === standing[BLUE] ? (by ? by.side : RED)
               : (standing[RED] > standing[BLUE] ? RED : BLUE);
      var i, a;
      for (i = 0; i < C.multiBalls; i++) {
        a = -Math.PI / 2 + (i - (C.multiBalls - 1) / 2) * 0.5;
        spawn(side, cx, cy, a);
      }
      refreshHUD();
      Sound.clip("gold", 0.85);
      Fx.ring(cx, cy, { from: 10, to: 200, color: SIDE[side].core, width: 8, life: 0.45 });
      Overlay.vignette(rgba(SIDE[side].core, 0.7), 1, 420);
      Pop.show("bonus", { word: "MULTIBALL", sub: "+" + C.multiBalls + " " + SIDE[side].name,
                          at: popAt() });
    }

    function clearBoard() {
      if (cleared) return;
      cleared = true;
      var bonus = C.clearBonus + Math.max(0, queue.length) * C.ballBonus;
      score += bonus; HUD.setScore(score);
      Sound.clip("clear", 0.95);
      Confetti.burst(40);
      Pop.show("ultra", { word: "PERFECT CLEAR", sub: "+" + bonus, hold: 900, at: popAt() });
      phase = "over"; endT = -0.7;                 // let the callout land first
      for (var i = 0; i < balls.length; i++) balls[i].alive = false;
    }

    function finish() {
      var ratio = total ? broken / total : 0;
      var stars = (cleared || ratio >= 0.55) ? 3 : ratio >= 0.3 ? 2 : broken > 0 ? 1 : 0;
      endRound({
        title: cleared ? "PERFECT CLEAR!"
             : ratio >= 0.55 ? "HUGE RUN!"
             : ratio >= 0.3 ? "NICE RUN!" : C.copy.gameOver,
        variant: cleared ? "perfect" : ratio >= 0.3 ? "win" : "",
        score: score,
        stars: stars,
        rows: [
          { label: "BRICKS SMASHED", value: broken + " / " + total },
          { label: "BEST CHAIN", value: bestChain, grade: bestChain >= 10 ? "accent" : "" },
          { label: "BALLS FIRED", value: fired },
          { label: "BEST SCORE", value: Math.max(score, Store.get("bestScore", 0)), grade: "gold" }
        ]
      });
    }

    /* --- the engine contract ------------------------------------------ */
    function reset() {
      var i;
      geometry(); buildSprites(); buildBoard(); makeBubbles();
      phase = "wheel"; wheelReset();
      balls = []; queue = []; fired = 0; shotSide = RED;
      for (i = 0; i < C.startBalls; i++) queue.push(i % 2 === 0 ? RED : BLUE);
      score = 0; chain = 0; bestChain = 0; chainT = 0;
      clock = 0; flightT = 0; endT = 0; idleT = 0; recoil = 0;
      hinted = false; pulled = false; cleared = false; converted = false;
      lastWall = -1; lastPop = -1; beams = []; zaps = [];
      aimA = -Math.PI / 2; aiming = false; traceShot();
      HUD.setScoreNow(0);
      refreshHUD();
      Fx.reset();
    }

    function onDown(p) {
      if (phase !== "aim") return;                 // the wheel runs itself
      aiming = true; idleT = 0; aimAt(p);
    }
    function onMove(p) { if (phase === "aim" && aiming) aimAt(p); }
    function onUp(p) {
      if (phase !== "aim" || !aiming) return;
      aiming = false; aimAt(p); fire();
    }

    function update(dt) {
      var i, s, sub, h, live;
      clock += dt;
      updateZaps(dt);
      if (recoil > 0) recoil = Math.max(0, recoil - dt * 5);
      for (i = 0; i < bricks.length; i++) if (bricks[i].flash > 0) bricks[i].flash -= dt * 3.4;
      for (i = beams.length - 1; i >= 0; i--) { beams[i].t += dt; if (beams[i].t > beams[i].life) beams.splice(i, 1); }

      if (phase === "wheel") { updateWheel(dt); return; }
      if (phase === "aim") {
        idleT += dt;
        if (!hinted && idleT > 3.2) { hinted = true; Overlay.toast("DRAG TO AIM — RELEASE TO FIRE"); }
        return;
      }
      if (phase === "over") { endT += dt; if (endT > 0.9) finish(); return; }

      flightT += dt;
      if (chain > 0) { chainT += dt; if (chainT > C.chainWindow) chain = 0; }
      if (!pulled && flightT > C.pullAfter) {      // every shot ends in the lake
        pulled = true;
        Overlay.toast("THE LAVA PULLS", { color: "#ff8a1a" });
        Overlay.vignette("rgba(255,106,0,.5)", 1, 900);
      }

      // Sub-stepped so a 900 px/s ball never tunnels through a 42 px brick.
      sub = Math.ceil(C.ballSpeed * dt / 6);
      if (sub > 20) sub = 20; if (sub < 1) sub = 1;
      h = dt / sub;
      for (s = 0; s < sub && phase === "flight"; s++)
        for (i = 0; i < balls.length; i++) if (balls[i].alive) stepBall(balls[i], h);

      live = 0;
      for (i = balls.length - 1; i >= 0; i--) if (!balls[i].alive) balls.splice(i, 1); else live++;
      if (!live && phase === "flight") { refreshHUD(); shotEnd(); }
    }

    /* --- drawing ------------------------------------------------------ */
    function drawBricks() {
      var i, k, x, y, g;
      for (i = 0; i < bricks.length; i++) {
        k = bricks[i];
        x = brickX(k); y = brickY(k);
        if (k.alive) {
          ctx.drawImage(k.bonus ? sprites.charged[k.side][k.bonus] : sprites.plain[k.side],
                        x, y, BW, BH);
          if (k.flash > 0) {                       // a pane the wrong ball rang
            ctx.globalAlpha = clamp(k.flash, 0, 1) * 0.5;
            ctx.fillStyle = "#ffffff"; rr(ctx, x, y, BW, BH, 12); ctx.fill();
            ctx.globalAlpha = 1;
          }
        } else if (k.flash > 0) {                  // the ghost of a smashed pane
          g = 1 - clamp(k.flash, 0, 1);
          ctx.globalAlpha = clamp(k.flash, 0, 1) * 0.65;
          ctx.fillStyle = "#ffffff";
          rr(ctx, x - 4 * g, y - 4 * g, BW + 8 * g, BH + 8 * g, 12);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    // A charged brick fires a beam down its row or column: the cascade is
    // loud enough to be read while it happens.
    function drawBeams() {
      var i, b, a, t, x, y;
      for (i = 0; i < beams.length; i++) {
        b = beams[i]; a = 1 - b.t / b.life; t = 3 + 16 * a;
        ctx.globalAlpha = a * 0.8;
        ctx.fillStyle = b.color;
        if (b.h) {
          y = G.y0 + b.r * G.ch + G.ch / 2;
          ctx.fillRect(field.left, y - t, field.right - field.left, t * 2);
        } else {
          x = G.x0 + b.c * G.cw + G.cw / 2;
          ctx.fillRect(x - t, field.top, t * 2, field.floor - field.top);
        }
      }
      ctx.globalAlpha = 1;
    }

    /* The lake: a molten body, a crust that rolls on two slow waves, bubbles
       coming up through it and a heat glow faked with flat bands — the ball
       that touches any of it is gone. */
    function drawLava() {
      var l = 0, r = view.w, top = field.floor;
      var x, y, i, b, p;
      for (i = 3; i >= 1; i--) {                   // the heat above the surface
        ctx.fillStyle = rgba("#ff6a00", 0.05 * i);
        ctx.fillRect(0, top - 14 * i, view.w, 14 * i);
      }
      ctx.fillStyle = lavaGrad;
      ctx.fillRect(0, top, view.w, Layout.bottom + 14 - top);
      ctx.beginPath();
      ctx.moveTo(l, top + 20);
      for (x = l; x <= r; x += 10) {
        y = top + Math.sin(x * 0.028 + clock * 1.9) * 5 + Math.sin(x * 0.011 - clock * 1.1) * 4;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(r, top + 20); ctx.closePath();
      ctx.fillStyle = "rgba(255,196,60,.75)"; ctx.fill();
      for (i = 0; i < bubbles.length; i++) {       // bubbles bursting on the crust
        b = bubbles[i];
        p = (clock * b.s + b.o) % 1;
        ctx.globalAlpha = 0.2 + 0.5 * Math.sin(p * Math.PI);
        ctx.fillStyle = "#fff0b8";
        ctx.beginPath();
        ctx.arc(b.x, top + 38 - p * 32, b.r * (0.4 + p), 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawTrace() {
      if (!trace || trace.length < 6) return;
      var i, n = trace.length / 2, k, x, y, col = SIDE[queue.length ? queue[0] : RED];
      ctx.fillStyle = col.light;
      for (i = 4; i < n; i += 4) {
        ctx.globalAlpha = clamp(1 - i / n, 0.12, 0.8);
        ctx.beginPath();
        ctx.arc(trace[i * 2], trace[i * 2 + 1], 5 - 2.4 * (i / n), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = rgba(col.core, 0.85); ctx.lineWidth = 3;
      for (i = 0; i < traceMarks.length; i += 2) { // the five bounce points
        ctx.beginPath(); ctx.arc(traceMarks[i], traceMarks[i + 1], 10, 0, TAU); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3;
      for (i = 0; i < traceHits.length; i++) {     // and the bricks it breaks
        k = traceHits[i];
        x = brickX(k); y = brickY(k);
        ctx.globalAlpha = clamp(1 - i * 0.16, 0.3, 1);
        rr(ctx, x - 3, y - 3, BW + 6, BH + 6, 14); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    /* The turret: a pylon planted in the lava, a deck carrying the magazine,
       and a barrel that swings with the aim, recoils on the shot and holds a
       charged core in its throat. All flat fills and rings — no shadowBlur. */
    function drawCannon() {
      var x = cannon.x, y = cannon.y, g, i, a, n, dx, k, bay;
      var next = SIDE[queue.length ? queue[0] : shotSide];

      // the pylon, and the heat shield taking the lava head on
      ctx.fillStyle = "#0a1024";
      ctx.beginPath();
      ctx.moveTo(x - 30, y + 16); ctx.lineTo(x + 30, y + 16);
      ctx.lineTo(x + 52, field.floor + 14); ctx.lineTo(x - 52, field.floor + 14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = rgba("#4bf5ff", 0.3);        // two coolant veins
      ctx.fillRect(x - 17, y + 26, 5, field.floor - y - 26);
      ctx.fillRect(x + 12, y + 26, 5, field.floor - y - 26);
      g = ctx.createLinearGradient(0, field.floor - 18, 0, field.floor + 6);
      g.addColorStop(0, "#39466e"); g.addColorStop(1, "#0f1730");
      ctx.fillStyle = g; rr(ctx, x - 62, field.floor - 18, 124, 24, 8); ctx.fill();
      ctx.fillStyle = rgba("#ff8a1a", 0.5);        // the shield, glowing hot
      rr(ctx, x - 56, field.floor - 4, 112, 6, 3); ctx.fill();

      // the barrel, authored pointing up and swung onto the aim
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(aimA + Math.PI / 2);
      ctx.translate(0, recoil * 14);
      ctx.fillStyle = "rgba(6,10,26,.55)";         // the cradle behind the tube
      rr(ctx, -26, -34, 52, 52, 14); ctx.fill();
      g = ctx.createLinearGradient(-22, 0, 22, 0);
      g.addColorStop(0, "#0e1526"); g.addColorStop(0.3, "#6f86b8");
      g.addColorStop(0.52, "#a9bfea"); g.addColorStop(0.78, "#3d4c74"); g.addColorStop(1, "#111828");
      ctx.fillStyle = g; rr(ctx, -20, -92, 40, 110, 13); ctx.fill();
      ctx.strokeStyle = "rgba(9,13,28,.85)"; ctx.lineWidth = 3;
      rr(ctx, -20, -92, 40, 110, 13); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.3)";      // the rail highlight
      rr(ctx, -13, -84, 6, 92, 3); ctx.fill();
      ctx.fillStyle = rgba(next.core, 0.9);        // three rings, in the ball's colour
      rr(ctx, -22, -62, 44, 8, 4); ctx.fill();
      rr(ctx, -22, -42, 44, 8, 4); ctx.fill();
      rr(ctx, -22, -22, 44, 8, 4); ctx.fill();
      g = ctx.createLinearGradient(-27, 0, 27, 0); // the muzzle brake
      g.addColorStop(0, "#18213a"); g.addColorStop(0.48, "#d4e2ff"); g.addColorStop(1, "#18213a");
      ctx.fillStyle = g; rr(ctx, -26, -110, 52, 26, 9); ctx.fill();
      ctx.strokeStyle = "rgba(9,13,28,.8)"; ctx.lineWidth = 3;
      rr(ctx, -26, -110, 52, 26, 9); ctx.stroke();
      ctx.fillStyle = "#04070f"; rr(ctx, -13, -106, 26, 19, 6); ctx.fill();
      k = phase === "aim" ? 0.55 + 0.45 * Math.sin(clock * 5) : 0.22;
      for (i = 3; i >= 1; i--) {                   // the ball charged in the throat
        ctx.fillStyle = rgba(next.core, 0.15 * i * k);
        ctx.beginPath(); ctx.arc(0, -97, 6 + i * 6, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = rgba(next.light, 0.5 + 0.5 * k);
      ctx.beginPath(); ctx.arc(0, -97, 7.5, 0, TAU); ctx.fill();
      ctx.restore();

      // the shoulder the barrel turns in, over the tube's tail
      g = ctx.createLinearGradient(0, y - 36, 0, y + 18);
      g.addColorStop(0, "#a9bfea"); g.addColorStop(0.5, "#3c4b74"); g.addColorStop(1, "#141c31");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 36, Math.PI, TAU); ctx.closePath(); ctx.fill();
      ctx.fillRect(x - 36, y, 72, 10);
      ctx.strokeStyle = rgba(next.core, 0.75); ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, 36, Math.PI, TAU); ctx.stroke();
      ctx.strokeStyle = "rgba(9,13,28,.7)"; ctx.lineWidth = 3;
      for (i = 0; i <= 8; i++) {                   // notches, so the swing reads
        a = Math.PI + i * Math.PI / 8;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * 27, y + Math.sin(a) * 27);
        ctx.lineTo(x + Math.cos(a) * 35, y + Math.sin(a) * 35);
        ctx.stroke();
      }
      n = phase === "aim" ? 0.4 + 0.25 * Math.sin(clock * 5) : 0.25;
      ctx.fillStyle = rgba(next.core, n);          // the core, awake while aiming
      ctx.beginPath(); ctx.arc(x, y - 2, 13, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(next.light, 0.9);
      ctx.beginPath(); ctx.arc(x, y - 2, 6, 0, TAU); ctx.fill();

      /* the deck and its magazine, drawn LAST: the base has to hide the
         pivot, or the barrel's tail shows through it mid-swing. Every bead is
         one queued ball, in the order they will be fired. */
      g = ctx.createLinearGradient(0, y + 2, 0, y + 40);
      g.addColorStop(0, "#6a80bd"); g.addColorStop(0.45, "#39476e"); g.addColorStop(1, "#131a2e");
      ctx.fillStyle = g; rr(ctx, x - 80, y + 2, 160, 38, 13); ctx.fill();
      ctx.strokeStyle = "rgba(9,13,28,.7)"; ctx.lineWidth = 3;
      rr(ctx, x - 80, y + 2, 160, 38, 13); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.16)"; rr(ctx, x - 72, y + 6, 144, 7, 4); ctx.fill();
      bay = Math.min(Math.max(queue.length, 1), 9);
      ctx.fillStyle = "rgba(4,8,22,.75)";
      rr(ctx, x - bay * 8 - 7, y + 18, bay * 16 + 14, 18, 9); ctx.fill();
      for (i = 0; i < bay && i < queue.length; i++) {
        dx = x + (i - (bay - 1) / 2) * 16;
        ctx.fillStyle = rgba(SIDE[queue[i]].core, 0.35);
        ctx.beginPath(); ctx.arc(dx, y + 27, 7.5, 0, TAU); ctx.fill();
        ctx.fillStyle = SIDE[queue[i]].core;
        ctx.beginPath(); ctx.arc(dx, y + 27, 5.4, 0, TAU); ctx.fill();
        ctx.fillStyle = rgba(SIDE[queue[i]].light, 0.9);
        ctx.beginPath(); ctx.arc(dx - 1.6, y + 25.4, 2.2, 0, TAU); ctx.fill();
      }
      if (queue.length > 9) {
        ctx.fillStyle = "#dffcff";
        ctx.font = "900 24px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillText("+" + (queue.length - 9), x + 86, y + 27);
      }
    }

    function drawBalls() {
      var i, b, sp, p;
      ctx.lineCap = "round";
      for (i = 0; i < balls.length; i++) {
        b = balls[i]; if (!b.alive) continue;
        p = SIDE[b.side];
        sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
        ctx.strokeStyle = rgba(p.core, 0.32); ctx.lineWidth = C.ballR * 1.4;
        ctx.beginPath();
        ctx.moveTo(b.x - b.vx / sp * 44, b.y - b.vy / sp * 44); ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.fillStyle = rgba(p.core, 0.24);
        ctx.beginPath(); ctx.arc(b.x, b.y, C.ballR * 1.9, 0, TAU); ctx.fill();
        ctx.fillStyle = p.core;
        ctx.beginPath(); ctx.arc(b.x, b.y, C.ballR, 0, TAU); ctx.fill();
        ctx.fillStyle = p.light;
        ctx.beginPath(); ctx.arc(b.x - C.ballR * 0.28, b.y - C.ballR * 0.3, C.ballR * 0.45, 0, TAU); ctx.fill();
      }
    }

    // The chain is the whole scoring rule, so it is on screen while it runs.
    function drawChain() {
      if (chain < 2 || phase === "wheel") return;
      var w = 250, h = 46, x = cannon.x - w / 2, y = cannon.y - 108;
      var t = clamp(1 - chainT / C.chainWindow, 0, 1);
      var col = chain >= 15 ? "#ff2d78" : chain >= 8 ? "#ffb44f" : "#4bf5ff";
      ctx.fillStyle = "rgba(6,9,26,.72)"; rr(ctx, x, y, w, h, 23); ctx.fill();
      ctx.fillStyle = rgba(col, 0.3); rr(ctx, x + 4, y + 4, (w - 8) * t, h - 8, 19); ctx.fill();
      ctx.strokeStyle = rgba(col, 0.85); ctx.lineWidth = 2; rr(ctx, x, y, w, h, 23); ctx.stroke();
      ctx.fillStyle = col;
      ctx.font = "900 30px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("CHAIN x" + chain, x + w / 2, y + h / 2 + 1);
    }

    /* The wheel deals the powers, so its faces ARE the powers: one Lucide
       pictogram per segment, upright, plus the name of the one it lands on. */
    function drawWheel() {
      var cx = cannon.x, cy = wheelY(), R = C.wheelRadius;
      var n = WHEEL.length, segA = TAU / n, i, a0, mid, px, py;
      // Once the power is locked the whole wheel fades out onto the board.
      var fade = wheel.state === "done" ? clamp(1 - wheel.hold / 0.6, 0, 1) : 1;
      ctx.globalAlpha = fade;
      ctx.fillStyle = "rgba(4,6,20,.86)"; ctx.fillRect(0, 0, view.w, view.h);

      for (i = 3; i >= 1; i--) {                   // rim glow, no shadowBlur
        ctx.strokeStyle = rgba("#4bf5ff", 0.07 * i); ctx.lineWidth = 7 * i;
        ctx.beginPath(); ctx.arc(cx, cy, R + 10, 0, TAU); ctx.stroke();
      }
      for (i = 0; i < n; i++) {
        a0 = wheel.a + i * segA;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + segA); ctx.closePath();
        ctx.fillStyle = (wheel.state === "done" && i === wheel.seg) ? "#fff3b0" : WHEEL[i].col;
        ctx.fill();
        ctx.strokeStyle = "rgba(6,9,26,.6)"; ctx.lineWidth = 3; ctx.stroke();
      }
      for (i = 0; i < n; i++) {                    // upright, never rotated
        mid = wheel.a + (i + 0.5) * segA;
        px = cx + Math.cos(mid) * R * 0.66; py = cy + Math.sin(mid) * R * 0.66;
        Icon.draw(ctx, WHEEL[i].icon, px, py, 62, "rgba(10,15,46,.9)");
      }
      ctx.fillStyle = "#0a0f2e"; ctx.beginPath(); ctx.arc(cx, cy, 56, 0, TAU); ctx.fill();
      ctx.strokeStyle = "#4bf5ff"; ctx.lineWidth = 4; ctx.stroke();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#4bf5ff"; ctx.font = "900 24px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.fillText("BONUS", cx, cy + 1);

      ctx.fillStyle = "#ffb44f";                   // the pointer
      ctx.beginPath();
      ctx.moveTo(cx, cy - R + 30); ctx.lineTo(cx - 24, cy - R - 24); ctx.lineTo(cx + 24, cy - R - 24);
      ctx.closePath(); ctx.fill();

      ctx.font = "900 34px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.fillStyle = "rgba(255,255,255,.72)";
      ctx.fillText("SPIN FOR YOUR BONUS", cx, cy - R - 52);
      ctx.font = "900 42px -apple-system,Segoe UI,Roboto,sans-serif";
      if (wheel.state !== "done") {
        ctx.globalAlpha = fade * (0.55 + 0.45 * Math.sin(clock * 6));
        ctx.fillStyle = "#ffffff"; ctx.fillText("LOADING…", cx, cy + R + 72);
      } else {
        ctx.fillStyle = "#ffd43b"; ctx.fillText(WHEEL[wheel.seg].label, cx, cy + R + 72);
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, view.w, view.h);
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, view.w, Layout.bottom);
      drawBricks();
      drawBeams();
      if (phase === "aim") drawTrace();
      drawCannon();
      drawBalls();
      // The lake is the FOREGROUND: the turret is planted in it, so its base
      // and the ball that falls in both go behind the molten surface.
      drawLava();
      drawZaps();
      drawChain();
      if (phase === "wheel") drawWheel();
    }

    function onResize() {
      geometry(); buildSprites(); makeBubbles();
      if (phase === "aim") traceShot();
    }

    return { reset: reset, update: update, render: render,
             onDown: onDown, onMove: onMove, onUp: onUp, onResize: onResize };
  })();

  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
