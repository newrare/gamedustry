  }

  // --- End screen: the cinematic reveal ----------------------------------
  // Beats: title -> score count-up (+confetti) -> stars -> stat rows -> CTA.
  var EndScreen = (function () {
    var timers = [];
    var T_TITLE = 120, T_SCORE = 560, T_STARS = 1950, STAR_GAP = 440,
        ROW_GAP = 250, T_CTA_AFTER = 1500;
    // The reveal climbs: each star rings the same chime a step higher. RATE
    // drives the embedded "uiStar" clip, FREQ the synthesized fallback.
    var STAR_RATE = [1, 1.19, 1.42], STAR_FREQ = [660, 880, 1180];

    function countUp(el, target, dur, cb) {
      var start = performance.now();
      function step(now) {
        var p = clamp((now - start) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(e * target);
        if (p < 1) requestAnimationFrame(step);
        else { el.textContent = target; if (cb) cb(); }
      }
      requestAnimationFrame(step);
    }

    // result: { title, variant:""|"win"|"perfect", score, stars:0..3|null,
    //           rows:[{label, value, grade}] }
    function show(result) {
      timers.forEach(clearTimeout); timers = [];
      Confetti.clear();
      function T(fn, ms) { timers.push(setTimeout(fn, ms)); }

      var title = $("eo-title");
      title.textContent = result.title || CONFIG.copy.gameOver;
      title.className = "eo-title" + (result.variant ? " " + result.variant : "");
      ["eo-title", "eo-scorelbl", "eo-score"].forEach(function (id) { $(id).classList.remove("show", "pop"); });
      $("eo-score").textContent = "0";
      $("btn-install").classList.remove("show");
      $("btn-replay").classList.remove("show");

      // Stars (pass null / undefined to hide the row entirely).
      var stars = result.stars;
      var hasStars = stars != null;
      $("eo-stars").classList.toggle("hidden", !hasStars);
      for (var i = 1; i <= 3; i++) $("star-" + i).className = "star";

      // Stat rows are rebuilt every round so a replay starts clean.
      var rows = result.rows || [];
      var box = $("eo-stats"), html = "";
      rows.forEach(function (r, i) {
        var label = r.grade === "gold"
          ? '<span class="spark">✦</span> ' + r.label + ' <span class="spark">✦</span>'
          : r.label;
        html += '<div class="eo-row' + (r.grade ? " " + r.grade : "") + '" id="eo-row-' + i + '">' +
                '<span>' + label + '</span><span class="eo-val" id="eo-val-' + i + '">0</span></div>';
      });
      box.innerHTML = html;

      // 1) Title slams in.
      T(function () { title.classList.add("show"); }, T_TITLE);

      // 2) Final score counts up, greeted by confetti.
      T(function () {
        $("eo-scorelbl").classList.add("show");
        $("eo-score").classList.add("show");
        Confetti.burst(70);
        countUp($("eo-score"), result.score || 0, 1100, function () {
          $("eo-score").classList.add("pop");
          Sound.cue("uiScore", 0.8, 1, 900, 0.14);
          Confetti.burst(90);
        });
      }, T_SCORE);

      // 3) Stars slam in one by one, each with a rising chime.
      var afterStars = T_SCORE + 900;
      if (hasStars) {
        T(function () { for (var s = 1; s <= 3; s++) $("star-" + s).classList.add("dim"); }, T_STARS - 160);
        for (var si = 0; si < stars; si++) {
          (function (idx) {
            T(function () {
              var el = $("star-" + (idx + 1));
              el.classList.remove("dim"); el.classList.add("on");
              Sound.cue("uiStar", 0.75, STAR_RATE[idx] || 1.42, STAR_FREQ[idx] || 1180, 0.16);
              Confetti.burst(30);
            }, T_STARS + idx * STAR_GAP);
          })(si);
        }
        afterStars = T_STARS + Math.max(stars, 1) * STAR_GAP + 350;
      }

      // 4) Stat rows cascade in, counters animating.
      rows.forEach(function (r, i) {
        T(function () {
          $("eo-row-" + i).classList.add("show");
          var el = $("eo-val-" + i);
          if (typeof r.value === "number") countUp(el, r.value, 450);
          else el.textContent = r.value;
          Sound.cue("uiRow", 0.5, 1 + i * 0.07, 480 + i * 70, 0.05);
        }, afterStars + i * ROW_GAP);
      });

      // 5) Install CTA, then the discreet replay link.
      var ctaAt = afterStars + rows.length * ROW_GAP + T_CTA_AFTER;
      T(function () { $("btn-install").classList.add("show"); }, ctaAt);
      T(function () { $("btn-replay").classList.add("show"); }, ctaAt + 500);
    }
    return { show: show };
  })();

  // --- Round clock -------------------------------------------------------
  var Round = (function () {
    var left = 0, running = false, fired = false;
    function reset() {
      left = CONFIG.gameSeconds; running = true; fired = false;
      if (CONFIG.gameSeconds > 0) HUD.setTime(left);
    }
    function tick(dt) {
      if (!running || CONFIG.gameSeconds <= 0) return;
      left = Math.max(0, left - dt);
      HUD.setTime(left);
      if (left <= 0 && !fired) {
        fired = true;
        // The game decides what "time up" means (end now, sudden death…).
        if (Game.onTimeUp) Game.onTimeUp();
        else endRound({ title: CONFIG.copy.timeUp });
      }
    }
    return {
      reset: reset, tick: tick, stop: function () { running = false; },
      left: function () { return left; },
      elapsed: function () { return CONFIG.gameSeconds - left; }
    };
  })();

  // --- The single way a round ends ---------------------------------------
  // result: { title, variant, score, stars, rows, track }
  function endRound(result) {
    if (State === "end") return;
    result = result || {};
    Loop.stop(); Round.stop();
    Music.duck(0.55, 0.8);        // let the end-screen cues sit on top
    var score = result.score == null ? Math.round(HUD.score()) : result.score;
    var best = Math.max(score, Store.get("bestScore", 0));
    Store.set("bestScore", best);
    setState("end");
    EndScreen.show({
      title: result.title || CONFIG.copy.gameOver,
      variant: result.variant || "",
      score: score,
      stars: result.stars,
      rows: result.rows || []
    });
    Ad.track("game_end", result.track || { score: score, best: best });
  }

  /* ===================================================================
     6. GAME — TRIVERSE: ride one of three living ropes and stay alive.

     Three dotted ropes of light run up the screen, generated forever out of
     four kinds of segment. The arrow rides one of them on a fixed line near
     the bottom; the world scrolls past it, and a swipe (or a tap on either
     side of the arrow) hops it onto the neighbouring rope. Gems and power-ups
     pay, mines and voids cost — and the ropes cross, so the rope that looked
     safe a second ago may not be. The run ends when the third life goes.

     COORDINATES. Every curve is a closed-form function of the PROGRESS
     coordinate `p` (world pixels travelled). A segment answers { x, y } with
     y === p everywhere except inside a loop, which is exactly what lets a
     loop double back on itself without breaking the scroll:

       straight  x = x0
       curve     x = smoothstep(x0 -> x1)          flat tangent at both ends
       sine      x = x0 + amp * sin(2pi (p-p0)/wl) whole periods only
       loop      x = x0 + dir*r*(1 - cos th)
                 y = p + r*sin th,   th = 2pi (p-p0)/span

     The loop is tangent to the vertical at both ends (dx/dth = 0 there), so
     it chains onto anything, and it genuinely crosses itself as long as
     span < 2pi*r. Its y wanders +/- r around p: that is the arrow dipping
     down the screen and coming back while it flies the curl.

     SCREEN. sy(y) = anchorY - (y - camP). The camera IS the arrow's progress,
     so the arrow sits exactly on anchorY at all times except inside a loop.
     =================================================================== */
  var Game = (function () {
    var TAU = Math.PI * 2;
    var T = CONFIG.play;

    // --- world -------------------------------------------------------------
    var paths = null;                 // the three ropes
    var items, trail;                 // pickups ahead, breadcrumbs behind

    // --- run state ---------------------------------------------------------
    var lane, prevLane, switchT, switchDir, switchLock;
    var camP, prevP, speed, runT;
    var score, pick, gems, chain, bestChain, loops;
    var lives, shield, mult, multT, invT;
    var dist, distShown, distT;
    var nextItemP, lastHazardP, lastPairP, nextMile, loopSeg, best, lastPop;
    var gates;                 // mine pairs, and the rope each one leaves open
    var arrowX, arrowY, arrowAng;

    // --- cached per layout / per skin --------------------------------------
    var anchorY = 0, pMin = 0, pMax = 0, bgGrad = null, sparks = [];
    var dotDim = [], dotHot = [];     // pre-rendered rope dots, one per colour

    /* Scratch points. Allocating inside the frame loop is what makes a mobile
       WebView stutter, so every curve evaluation writes into one of these. */
    var pa = { x: 0, y: 0 }, pb = { x: 0, y: 0 }, pc = { x: 0, y: 0 }, pp = { x: 0, y: 0 };
    var sa = { x: 0, y: 0 }, sb = { x: 0, y: 0 };          // generator-side scratch

    function ease(t) { return t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t); }
    function sy(y) { return anchorY - (y - camP); }

    /* ====================================================================
       THE ROPES — generation and evaluation
       ==================================================================== */

    // Kinds: 0 straight, 1 curve, 2 sine, 3 loop.
    function segEval(s, p, out) {
      var t, u, th;
      if (s.k === 0) { out.x = s.x; out.y = p; }
      else if (s.k === 1) {
        t = (p - s.p0) / (s.p1 - s.p0);
        u = ease(t);
        out.x = s.x0 + (s.x1 - s.x0) * u; out.y = p;
      } else if (s.k === 2) {
        out.x = s.x + s.amp * Math.sin(TAU * (p - s.p0) / s.wl); out.y = p;
      } else {
        th = TAU * (p - s.p0) / (s.p1 - s.p0);
        out.x = s.x + s.dir * s.r * (1 - Math.cos(th));
        out.y = p + s.r * Math.sin(th);
      }
    }

    // The segment covering `p` (clamped to the ends of the live window).
    function pathSeg(path, p) {
      var segs = path.segs, i;
      for (i = 0; i < segs.length; i++) if (p < segs[i].p1) return segs[i];
      return segs[segs.length - 1];
    }
    function pathPoint(path, p, out) { segEval(pathSeg(path, p), p, out); }
    function pathX(i, p) { pathPoint(paths[i], p, pc); return pc.x; }

    /* Dots are laid out every `step` progress pixels from the START of their
       segment, so they never crawl or shimmer as the camera moves. `step` is
       pre-divided by how much the curve stretches arc length, which keeps the
       rope evenly dotted through a sine and through a loop. */
    function dotStep(kind, a, b) {
      if (kind === 2) return T.dot / Math.sqrt(1 + (a * TAU / b) * (a * TAU / b) * 0.5);
      if (kind === 3) return T.dot * b / Math.sqrt(a * a + b * b);
      return T.dot;
    }

    /* Aim a lane change at a spot the other two ropes are not sitting on, so
       the three stay tellable apart even though they are free to cross. */
    function pickTarget(path, lo, hi) {
      var bx = 0, bd = -1, i, j, cand, d;
      for (i = 0; i < 3; i++) {
        cand = Rand.range(lo, hi); d = 1e9;
        for (j = 0; j < 3; j++) if (paths[j] !== path) d = Math.min(d, Math.abs(cand - paths[j].endX));
        if (d > bd) { bd = d; bx = cand; }
      }
      return bx;
    }

    function pushSeg(path) {
      var lo = Layout.left + T.edge, hi = Layout.right - T.edge;
      var p0 = path.head, x = path.endX;
      var roomL = x - lo, roomR = hi - x, room = Math.max(roomL, roomR);
      var kinds, kind, s, len, amp, wl, n, r, dir, span, k, x1;

      // weights: 1 straight, 3 curves, 2 sines, 1 coil, and 2 loops when there
      // is room sideways for the lobe
      kinds = ["straight", "curve", "curve", "curve", "sine", "sine", "coil"];
      if (room > 130) { kinds.push("loop"); kinds.push("loop"); }
      // ease the player in: the first stretch of every rope stays readable
      kind = p0 < 900 ? Rand.pick(["straight", "curve", "curve"]) : Rand.pick(kinds);

      if (kind === "straight") {
        len = Rand.range(150, 300);
        s = { k: 0, p0: p0, p1: p0 + len, x: x, step: T.dot };

      } else if (kind === "curve") {
        x1 = pickTarget(path, lo, hi);
        len = clamp(210 + Math.abs(x1 - x) * 1.15, 230, 640);
        s = { k: 1, p0: p0, p1: p0 + len, x0: x, x1: x1, step: T.dot * 0.86 };
        path.endX = x1;

      } else if (kind === "sine" || kind === "coil") {
        var tight = kind === "coil";
        amp = Math.min(tight ? Rand.range(34, 60) : Rand.range(66, 132), Math.min(roomL, roomR));
        wl  = tight ? Rand.range(155, 215) : Rand.range(300, 460);
        n   = tight ? Rand.int(3, 4) : Rand.int(1, 2);
        if (amp < 26) {                                  // pinned to an edge
          x1 = pickTarget(path, lo, hi);
          s = { k: 1, p0: p0, p1: p0 + clamp(210 + Math.abs(x1 - x) * 1.15, 230, 640),
                x0: x, x1: x1, step: T.dot * 0.86 };
          path.endX = x1;
        } else {
          s = { k: 2, p0: p0, p1: p0 + wl * n, x: x, amp: amp, wl: wl,
                step: dotStep(2, amp, wl) };
        }

      } else {
        dir = roomR >= roomL ? 1 : -1;
        r = Math.min(T.loopR, room * 0.5);
        span = r * Rand.range(2.2, 2.9);                  // span < 2pi*r -> a real loop
        k = span / TAU;
        s = { k: 3, p0: p0, p1: p0 + span, x: x, r: r, dir: dir, step: dotStep(3, r, k) };
      }

      path.segs.push(s);
      path.head = s.p1;
    }

    function build(path, horizon) {
      while (path.head < horizon) pushSeg(path);
      while (path.segs.length > 1 && path.segs[0].p1 < camP - 700) path.segs.shift();
    }
    function buildAll(horizon) { var i; for (i = 0; i < 3; i++) build(paths[i], horizon); }

    /* ====================================================================
       PICKUPS — gems pay, mines and voids cost
       ==================================================================== */

    function diff() { return Math.min(1, dist / T.diffFull); }
    function hazardChance() { return T.hazardMin + (T.hazardMax - T.hazardMin) * diff(); }
    function hazardGap()    { return T.gapFar - (T.gapFar - T.gapNear) * diff(); }
    function pairChance()   { return clamp((diff() - T.pairFrom) / (1 - T.pairFrom), 0, 1) * T.pairMax; }
    function otherLane() { return (lane + 1 + Rand.int(0, 1)) % 3; }

    /* A hazard may never sit on a crossing. Two ropes running side by side is
       exactly where the player cannot tell WHICH one carries the mine, and a
       death you could not read is the one thing a playable must not do. So a
       candidate spot is only accepted when the other two ropes stay `hazardApart`
       design px away over a whole `hazardClear` window around it — the mine is
       then unmistakably on one rope, for long enough to be read and dodged. */
    function crossingFree(idx, p) {
      var i, q, stop = p + T.hazardClear;
      for (i = 0; i < 3; i++) {
        if (i === idx) continue;
        for (q = p - T.hazardClear; q <= stop; q += 20) {
          pathPoint(paths[idx], q, sa);
          pathPoint(paths[i], q, sb);
          if (Math.abs(sa.x - sb.x) < T.hazardApart) return false;
        }
      }
      return true;
    }
    /* Walk forward until a clear spot turns up: first the three ropes at `p`
       (the arrow's own rope first, that is what forces a jump), then a little
       further along. Returns the accepted { path, p } or null. */
    function hazardSpot(p) {
      var tries, i, order;
      for (tries = 0; tries < 5; tries++) {
        // The test has to read the real ropes: past `head` a segment lookup
        // extrapolates the last curve, which is not the shape the generator will
        // actually commit. Growing them first costs nothing — they are built
        // forward only, and never re-rolled.
        buildAll(p + T.hazardClear + 60);
        order = Rand.chance(0.55) ? [lane, (lane + 1) % 3, (lane + 2) % 3]
                                  : [Rand.int(0, 2), lane, (lane + 1) % 3];
        for (i = 0; i < 3; i++) if (crossingFree(order[i], p)) return { path: order[i], p: p };
        p += 150;
      }
      return null;
    }

    function pushMine(p, idx) {
      items.push({ p: p, path: idx, seed: Rand.range(0, TAU), type: "mine" });
    }

    /* TWO MINES ABREAST — the pressure beat the run builds towards. Both sit at
       the same progress, on two of the three ropes, so the wall can only be
       crossed through the third one.

       The crossing rule is turned around for a pair: it is the FREE rope that
       has to stand clear of the other two, because that is the thing the player
       must read from far away. The two mined ropes may run as close together as
       they like — either one kills, so there is nothing to tell apart. */
    function spawnPair(p) {
      var tries, i, free, order;
      for (tries = 0; tries < 5; tries++) {
        buildAll(p + T.hazardClear + 60);
        // Leave open a rope the arrow is NOT on: a wall you can ignore is not a
        // wall. Occasionally spare the current rope anyway, so a pair is never
        // a reflex the player can play blind.
        order = Rand.chance(0.78) ? [(lane + 1) % 3, (lane + 2) % 3, lane]
                                  : [lane, (lane + 1) % 3, (lane + 2) % 3];
        for (i = 0; i < 3; i++) {
          free = order[i];
          if (!crossingFree(free, p)) continue;
          pushMine(p, (free + 1) % 3);
          pushMine(p, (free + 2) % 3);
          gates.push({ p: p, free: free });
          lastHazardP = p; lastPairP = p;
          // a pair earns the player a breather: the next hazard is pushed back
          nextItemP = p + hazardGap() * T.pairAfter + Rand.range(60, 200);
          return true;
        }
        p += 150;
      }
      return false;
    }

    function spawnSingle(p) {
      var spot = hazardSpot(p);
      if (!spot) return false;
      items.push({ p: spot.p, path: spot.path, seed: Rand.range(0, TAU),
                   type: Rand.chance(0.72) ? "mine" : "void" });
      lastHazardP = spot.p;
      nextItemP = spot.p + Rand.range(hazardGap(), hazardGap() + 200);
      return true;
    }

    function spawnItems(horizon) {
      var p, i, n, gap, lp, wantPair;
      while (nextItemP < horizon) {
        p = nextItemP;
        if (Rand.chance(hazardChance()) && p - lastHazardP > hazardGap()) {
          // A pair by chance, or because it has been too long since the last one
          // — "regularly" has to survive a bad roll of the dice.
          wantPair = diff() > T.pairFrom &&
                     (Rand.chance(pairChance()) || p - lastPairP > T.pairEvery);
          if (!(wantPair ? spawnPair(p) : spawnSingle(p))) {
            // everything ahead is a tangle of crossings: leave this slot empty
            nextItemP = p + Rand.range(200, 320);
          }

        } else if (Rand.chance(0.16)) {
          items.push({ p: p, path: Rand.int(0, 2), type: Rand.chance(0.5) ? "x2" : "shield", seed: 0 });
          nextItemP = p + Rand.range(250, 380);

        } else {
          // a run of gems, often on a rope the arrow is NOT on
          lp = Rand.chance(0.45) ? lane : otherLane();
          n = Rand.int(3, 5); gap = Rand.range(70, 92);   // the gems are big: keep them apart
          for (i = 0; i < n; i++) {
            items.push({ p: p + i * gap, path: lp, seed: 0,
                         type: (i === n - 1 && Rand.chance(0.22)) ? "star" : "gem" });
          }
          nextItemP = p + n * gap + Rand.range(130, 260);
        }
      }
    }

    function resolveItems() {
      var i, it;
      for (i = items.length - 1; i >= 0; i--) {
        it = items[i];
        if (it.p < camP - 400) { items.splice(i, 1); continue; }
        if (it.p > camP || it.p <= prevP) continue;      // not crossed this frame
        if (it.path !== lane) continue;                  // it belongs to another rope
        items.splice(i, 1);
        collect(it);
      }
    }

    function gainScore(v) { pick += v; }

    function collect(it) {
      var x = arrowX, y = arrowY, col = paths[lane].color, g;

      if (it.type === "gem" || it.type === "star") {
        chain++;
        if (chain > bestChain) bestChain = chain;
        gems++;
        g = (it.type === "star" ? 120 : 15 + Math.min(chain, 12) * 3) * mult;
        gainScore(g);
        HUD.punch(it.type === "star" ? "#ffd43b" : col);
        Fx.burst(x, y, { color: [col, "#ffffff"], count: it.type === "star" ? 20 : 11,
                         speed: it.type === "star" ? 420 : 280, life: 0.42, size: 5 });
        if (it.type === "star") {
          Fx.ring(x, y, { from: 16, to: 130, color: "#ffd43b", width: 6, life: 0.38 });
          Pop.show("bonus", { word: "MEGA GEM", sub: "+" + g, at: "upperLeft" });
          Sound.clip("mega", 0.8);
        } else {
          // Gems arrive faster than a callout can be read: one pop per ~quarter
          // second, and the HUD punch plus the burst carry the ones in between.
          if (runT - lastPop > 0.24) {
            lastPop = runT;
            Pop.show("score", { word: "+" + g, at: { x: x, y: y - 116 }, cls: "pop-l" + lane });
          }
          // one sample, pitched by the chain: the run climbs as it grows
          Sound.clip("gem", 0.6, 1 + Math.min(chain, 14) * 0.045);
        }
        if (chain > 0 && chain % 6 === 0) {
          g = 50 * mult * (chain / 6);
          gainScore(g);
          Pop.show(chain >= 24 ? "ultra" : "combo", { word: "CHAIN x" + chain, sub: "+" + g });
          Sound.clip("chain", 0.85, 1 + Math.min(chain, 24) * 0.008);
        }

      } else if (it.type === "x2") {
        mult = 2; multT = T.multTime;
        Pop.show("bonus", { word: "SCORE x2", sub: T.multTime + "s", at: "upperLeft" });
        Overlay.vignette("rgba(166,255,61,.8)", 1, 460);
        Fx.burst(x, y, { color: ["#a6ff3d", "#ffffff"], count: 18, speed: 340, life: 0.45 });
        Sound.clip("power", 0.8);

      } else if (it.type === "shield") {
        shield = true;
        Pop.show("bonus", { word: "SHIELD", sub: "ONE CRASH", at: "upperLeft" });
        Fx.ring(x, y, { from: 20, to: 120, color: "#8ffff2", width: 6, life: 0.4 });
        Sound.clip("power", 0.7, 1.22);

      } else if (it.type === "void") {
        g = Math.min(70 * mult, pick);
        pick -= g;
        chain = 0;
        Pop.show("alert", { word: "-" + g, sub: "CHAIN LOST", cls: "pop-drain" });
        Fx.shake(7, 0.2);
        Fx.burst(x, y, { color: ["#a24bff", "#2b003f"], count: 16, speed: 300, life: 0.5 });
        Sound.clip("void", 0.75);

      } else {                                            // mine
        crash();
      }
    }

    function crash() {
      var x = arrowX, y = arrowY;
      if (invT > 0) return;                               // still blinking: a free pass
      chain = 0;
      Fx.burst(x, y, { color: ["#ff2d55", "#ffd43b", "#ffffff"], count: 26, speed: 460, life: 0.55, size: 6 });
      Fx.ring(x, y, { from: 18, to: 190, color: "#ff2d55", width: 8, life: 0.42 });

      if (shield) {
        shield = false; invT = 0.8;
        Fx.shake(9, 0.24); Fx.flash("#8ffff2", 0.3);
        Pop.show("alert", { word: "SHIELD DOWN" });
        Sound.clip("crash", 0.5, 1.45);        // the same impact, shrugged off
        return;
      }

      lives--;
      drawLives();
      Fx.shake(17, 0.4); Fx.flash("#ff2d55", 0.45); Fx.freeze(0.06);
      Overlay.vignette("rgba(255,45,85,.9)", 1, 620);
      Sound.clip("crash", 0.9);

      if (lives <= 0) { die(); return; }
      invT = T.invTime;
      Pop.show("danger", { word: lives === 1 ? "LAST LIFE" : "CRASH!",
                           sub: lives + (lives === 1 ? " LIFE LEFT" : " LIVES LEFT") });
    }

    /* Crossing a pair of mines through the one open rope is a skill beat, so it
       pays: without a reward the player only ever learns what NOT to do. */
    function checkGates() {
      var i, g, gain;
      for (i = gates.length - 1; i >= 0; i--) {
        g = gates[i];
        if (g.p < camP - 400) { gates.splice(i, 1); continue; }
        if (g.p > camP || g.p <= prevP) continue;      // not crossed this frame
        gates.splice(i, 1);
        if (lane !== g.free || invT > 0) continue;     // took the hit instead
        gain = 60 * mult;
        gainScore(gain);
        Pop.show("streak", { word: "THREADED!", sub: "+" + gain });
        Fx.ring(arrowX, arrowY, { from: 26, to: 170, color: "#ffffff", width: 5, life: 0.36 });
        HUD.punch("#ffffff");
        Sound.clip("chain", 0.6, 1.28);
      }
    }

    /* ====================================================================
       LOOPS — flying a whole curl is the run's showpiece
       ==================================================================== */
    function checkLoop() {
      var s = pathSeg(paths[lane], camP);
      if (s.k === 3 && camP > s.p0 + 6 && camP < s.p1) { loopSeg = s; return; }
      if (!loopSeg) return;
      if (camP >= loopSeg.p1) {
        var g = 150 * mult;
        loops++; gainScore(g);
        Pop.show("perfect", { word: "LOOP!", sub: "+" + g });
        Fx.ring(arrowX, arrowY, { from: 20, to: 200, color: "#ffd43b", width: 7, life: 0.45 });
        Fx.burst(arrowX, arrowY, { color: ["#ffd43b", "#ffffff"], count: 22, speed: 400, life: 0.5 });
        HUD.punch("#ffd43b");
        Sound.clip("loop", 0.85);
      }
      loopSeg = null;                                     // cleared, or bailed out
    }

    /* ====================================================================
       INPUT — a swipe, or a tap on either side of the arrow
       ==================================================================== */
    var gest = null;

    function switchLane(dir) {
      var curX, i, x, d, bi = -1, bd = 1e9;
      if (switchLock > 0) return;
      curX = pathX(lane, camP);
      for (i = 0; i < 3; i++) {
        if (i === lane) continue;
        x = pathX(i, camP);
        d = (x - curX) * dir;                             // > 0 = in the swipe direction
        if (d > 12 && d < bd) { bd = d; bi = i; }
      }
      if (bi < 0) {                                       // nothing that way: nudge
        Fx.shake(3, 0.1);
        Sound.clip("swipe", 0.3, 0.62);        // the flick, muffled: nothing there
        return;
      }
      prevLane = lane; lane = bi;
      switchT = 0; switchDir = dir; switchLock = T.switchLock;
      Fx.burst(arrowX, arrowY, { color: [paths[prevLane].color, "#ffffff"], count: 9,
                                 speed: 260, life: 0.3, angle: dir > 0 ? Math.PI : 0, spread: 1.7 });
      Fx.ring(arrowX, arrowY, { from: 14, to: 66, color: paths[lane].color, width: 4, life: 0.24 });
      Sound.clip("swipe", 0.6, dir > 0 ? 1.08 : 0.93);   // pitch tells the direction
    }

    function onDown(p) { gest = { x: p.x, done: false }; }
    function onMove(p) {
      if (!gest || gest.done) return;
      var dx = p.x - gest.x;
      if (Math.abs(dx) > T.swipeMin) { gest.done = true; switchLane(dx > 0 ? 1 : -1); }
    }
    function onUp(p) {
      if (!gest) return;
      if (!gest.done) {
        var dx = p.x - gest.x;
        // A short gesture is a tap: it means "go to the side I tapped".
        if (Math.abs(dx) > T.swipeMin) switchLane(dx > 0 ? 1 : -1);
        else switchLane(p.x >= arrowX ? 1 : -1);
      }
      gest = null;
    }

    /* ====================================================================
       FRAME
       ==================================================================== */
    function reset() {
      var lo, hi, x0, i;
      best = Store.get("bestScore", 0);
      metrics();
      buildDots();

      camP = 0; prevP = 0; runT = 0; speed = T.speedMin;
      score = 0; pick = 0; gems = 0; chain = 0; bestChain = 0; loops = 0;
      lives = T.lives; shield = false; mult = 1; multT = 0; invT = 0;
      dist = 0; distShown = 0; distT = 0;
      lane = 1; prevLane = 1; switchT = 1; switchDir = 0; switchLock = 0;
      loopSeg = null; gest = null; lastPop = -1;
      items = []; trail = []; gates = [];
      nextItemP = 560; lastHazardP = 0; lastPairP = 0; nextMile = T.mileStep;

      lo = Layout.left + T.edge; hi = Layout.right - T.edge;
      x0 = [lo + (hi - lo) * 0.17, (lo + hi) * 0.5, hi - (hi - lo) * 0.17];
      paths = [];
      for (i = 0; i < 3; i++) {
        // every rope opens on a calm straight so the first second reads clearly
        paths.push({ idx: i, color: T.colors[i], endX: x0[i], head: 340,
                     segs: [{ k: 0, p0: -800, p1: 340, x: x0[i], step: T.dot }] });
      }
      for (i = 0; i < 3; i++) build(paths[i], T.ahead);
      pMin = anchorY - view.h - 220; pMax = anchorY + 220;

      arrowX = x0[1]; arrowY = anchorY; arrowAng = -Math.PI / 2;
      HUD.setScoreNow(0);
      HUD.setLeft("0 M", "DIST");
      drawLives();
      Fx.reset();
    }

    function drawLives() {
      var s = "", i;
      for (i = 0; i < T.lives; i++) s += i < lives ? "♥" : "·";
      HUD.setRight(s, "LIVES", lives <= 1 ? "warn" : "");
    }

    function updateArrow() {
      var e = ease(switchT), x, y, ang;
      pathPoint(paths[lane], camP, pa);
      x = pa.x; y = pa.y;
      if (switchT < 1) {
        pathPoint(paths[prevLane], camP, pb);
        x = pb.x + (pa.x - pb.x) * e;
        y = pb.y + (pa.y - pb.y) * e;
      }
      // heading = the tangent of the rope, in screen space (y is flipped)
      pathPoint(paths[lane], camP + 7, pb);
      pathPoint(paths[lane], camP - 7, pc);
      ang = Math.atan2(-(pb.y - pc.y), pb.x - pc.x);
      if (switchT < 1) ang += switchDir * 0.5 * Math.sin(Math.PI * switchT);   // lean into the hop
      arrowX = x; arrowY = sy(y); arrowAng = ang;

      trail.push({ x: x, y: y });
      if (trail.length > 18) trail.shift();
    }

    function update(dt) {
      var i, m;
      runT += dt;
      speed = T.speedMin + (T.speedMax - T.speedMin) * Math.min(1, runT / T.ramp);
      prevP = camP;
      camP += speed * dt;

      // the visible progress window, plus a margin for the loops' wander
      pMin = camP + anchorY - view.h - 220;
      pMax = camP + anchorY + 220;

      for (i = 0; i < 3; i++) build(paths[i], camP + T.ahead);
      spawnItems(camP + T.ahead - 120);

      if (switchT < 1) switchT = Math.min(1, switchT + dt / T.switchTime);
      if (switchLock > 0) switchLock -= dt;
      if (invT > 0) invT -= dt;
      if (multT > 0) {
        multT -= dt;
        if (multT <= 0) { mult = 1; Overlay.toast("x2 OVER", { color: "#a6ff3d" }); }
      }

      updateArrow();
      resolveItems();
      checkGates();
      checkLoop();

      dist = camP / T.pxPerM;
      score = pick + Math.floor(dist);
      HUD.setScore(score);

      distT -= dt;
      m = Math.floor(dist);
      if (distT <= 0 && m !== distShown) { distShown = m; distT = 0.14; HUD.setLeft(m + " M", "DIST"); }

      if (dist >= nextMile) {
        nextMile += T.mileStep;
        Pop.show("ribbon", { word: Math.round(dist) + " M", sub: "FASTER" });
        Overlay.vignette(rgba(paths[lane].color, 0.75), 1, 420);
        Sound.clip("chain", 0.7, 0.8);
      }
    }

    function die() {
      var d = Math.floor(dist), sc = pick + d;
      var st = sc >= 3200 ? 3 : sc >= 1500 ? 2 : 1;
      endRound({
        title: st === 3 ? "LEGEND RUN!" : st === 2 ? "GREAT RUN!" : CONFIG.copy.gameOver,
        variant: st === 3 ? "perfect" : st === 2 ? "win" : "",
        score: sc,
        stars: st,
        rows: [
          { label: "DISTANCE (M)", value: d },
          { label: "GEMS", value: gems },
          { label: "LOOPS FLOWN", value: loops, grade: loops > 0 ? "accent" : "" },
          { label: "BEST CHAIN", value: bestChain, grade: "accent" },
          { label: "BEST SCORE", value: Math.max(sc, best), grade: "gold" }
        ]
      });
    }

    /* ====================================================================
       RENDER
       ==================================================================== */

    // One sprite per rope colour: the glow and the core in a single draw, so a
    // rope costs one drawImage per dot and never touches shadowBlur.
    function dotSprite(color, hot) {
      var s = hot ? 46 : 38, c = document.createElement("canvas"), k, h = s * 0.5, g;
      c.width = s; c.height = s;
      k = c.getContext("2d");
      g = k.createRadialGradient(h, h, 0, h, h, h);
      g.addColorStop(0, rgba(color, hot ? 0.55 : 0.26));
      g.addColorStop(0.45, rgba(color, hot ? 0.2 : 0.08));
      g.addColorStop(1, rgba(color, 0));
      k.fillStyle = g; k.fillRect(0, 0, s, s);
      k.fillStyle = color;
      k.beginPath(); k.arc(h, h, hot ? 7.5 : 5.2, 0, TAU); k.fill();
      if (hot) {
        k.fillStyle = "rgba(255,255,255,.92)";
        k.beginPath(); k.arc(h, h, 3.4, 0, TAU); k.fill();
      }
      return c;
    }
    function buildDots() {
      var i;
      if (dotDim.length === 3) return;
      for (i = 0; i < 3; i++) { dotDim.push(dotSprite(T.colors[i], false)); dotHot.push(dotSprite(T.colors[i], true)); }
    }

    function metrics() {
      anchorY = Layout.bottom - T.anchorUp;
      bgGrad = ctx.createRadialGradient(view.w * 0.5, view.h * 0.3, 40, view.w * 0.5, view.h * 0.42, view.h * 0.95);
      bgGrad.addColorStop(0, "#141a44");
      bgGrad.addColorStop(0.55, "#080b22");
      bgGrad.addColorStop(1, "#03040c");
      buildSparks();
    }

    /* Background: far stars for depth, near streaks for speed. Both scroll off
       camP with their own parallax and wrap on the frame height. */
    function buildSparks() {
      var i, star;
      sparks = [];
      for (i = 0; i < 70; i++) {
        star = i < 48;
        sparks.push({
          x: Rand.range(0, view.w),
          y: Rand.range(0, view.h + 80),
          w: star ? Rand.range(2, 3.4) : 2,
          h: star ? Rand.range(2, 3.4) : Rand.range(40, 110),
          par: star ? Rand.range(0.16, 0.42) : Rand.range(0.85, 1.3),
          a: star ? Rand.range(0.25, 0.6) : Rand.range(0.06, 0.14)
        });
      }
    }

    function drawSparks() {
      var span = view.h + 80, i, s, y;
      ctx.fillStyle = "#ffffff";
      for (i = 0; i < sparks.length; i++) {
        s = sparks[i];
        y = (s.y + camP * s.par) % span;
        if (y < 0) y += span;
        ctx.globalAlpha = s.a;
        ctx.fillRect(s.x, y - 40, s.w, s.h);
      }
      ctx.globalAlpha = 1;
    }

    function drawPath(path, hot) {
      var sprite = hot ? dotHot[path.idx] : dotDim[path.idx];
      var segs = path.segs, half = sprite.width * 0.5, i, s, k, k0, k1, p, y;
      for (i = 0; i < segs.length; i++) {
        s = segs[i];
        if (s.p1 < pMin || s.p0 > pMax) continue;
        k0 = Math.max(0, Math.floor((pMin - s.p0) / s.step));
        k1 = Math.ceil((Math.min(pMax, s.p1) - s.p0) / s.step);
        for (k = k0; k <= k1; k++) {
          p = s.p0 + k * s.step;
          if (p > s.p1) break;
          segEval(s, p, pp);
          y = sy(pp.y);
          if (y < -40 || y > view.h + 40) continue;
          ctx.drawImage(sprite, pp.x - half, y - half);
        }
      }
    }

    /* A soft glow behind a pickup. A radial gradient, not stacked flat discs:
       a hard-edged disc over the dark background reads as a muddy plate rather
       than as light. Only a handful of pickups are ever on screen, so building
       the gradient per draw is cheaper than caching one sprite per colour. */
    function halo(x, y, r, col) {
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(col, 0.5));
      g.addColorStop(0.42, rgba(col, 0.16));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    }
    /* A gem. The gradient is built INSIDE the rotated frame, so the shading
       spins with the stone (a free glint) instead of being dragged out of the
       shape by the transform. */
    function diamond(x, y, r, rot, top, mid, bot, ink) {
      var g;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      g = ctx.createLinearGradient(0, -r, 0, r);
      g.addColorStop(0, top);
      if (mid) g.addColorStop(0.5, mid);
      g.addColorStop(1, bot);
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.72, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.72, 0);
      ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = Math.max(3.5, r * 0.2); ctx.strokeStyle = ink; ctx.stroke();
      ctx.restore();
    }
    function spiked(x, y, n, ro, ri, fill, ink, rot) {
      var i, a, r;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.beginPath();
      for (i = 0; i < n * 2; i++) {
        a = (i / (n * 2)) * TAU;
        r = i % 2 ? ri : ro;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.lineWidth = Math.max(3.5, ro * 0.13); ctx.strokeStyle = ink; ctx.stroke();
      ctx.restore();
    }

    /* A hazard also wears a thin ring in the colour of the rope it sits on: the
       placement rule keeps it off crossings, this makes the ownership explicit
       even when another rope passes somewhere in the frame. */
    function ownerRing(x, y, r, col) {
      ctx.lineWidth = 3.5; ctx.strokeStyle = rgba(col, 0.75);
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    }

    function drawItem(it, x, y, col) {
      var pu;
      if (it.type === "gem") {
        halo(x, y, 36, col);
        diamond(x, y, 21, runT * 1.6, "#ffffff", null, col, "rgba(4,5,15,.75)");

      } else if (it.type === "star") {
        pu = 1 + Math.sin(runT * 5) * 0.07;
        halo(x, y, 52 * pu, "#ffd43b");
        diamond(x, y, 31 * pu, -runT * 1.2, "#fffbe8", "#ffd43b", "#ff9f1c", "#2b1a00");

      } else if (it.type === "mine") {
        // a hazard has to be the loudest thing on the rope: it is the only item
        // the player MUST read in time
        pu = 1 + Math.sin(runT * 7 + it.seed) * 0.09;
        halo(x, y, 62 * pu, "#ff2d55");
        ownerRing(x, y, 44, col);
        spiked(x, y, 9, 42 * pu, 23, "#22040f", "#ff2d55", runT * 1.1 + it.seed);
        ctx.fillStyle = "#ff2d55";
        ctx.beginPath(); ctx.arc(x, y, 15, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffe3ea";
        ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill();

      } else if (it.type === "void") {
        halo(x, y, 54, "#a24bff");
        ownerRing(x, y, 40, col);
        ctx.fillStyle = "#160a24";
        ctx.beginPath(); ctx.arc(x, y, 31, 0, TAU); ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = "#c07bff";
        ctx.beginPath(); ctx.arc(x, y, 31, 0, TAU); ctx.stroke();
        ctx.fillStyle = "#e8ccff";
        ctx.fillRect(x - 16, y - 4, 32, 8);

      } else if (it.type === "x2") {
        halo(x, y, 46, "#a6ff3d");
        ctx.fillStyle = "#0c2a12";
        ctx.beginPath(); ctx.arc(x, y, 28, 0, TAU); ctx.fill();
        ctx.lineWidth = 5; ctx.strokeStyle = "#a6ff3d";
        ctx.beginPath(); ctx.arc(x, y, 28, 0, TAU); ctx.stroke();
        ctx.fillStyle = "#eaffd0";
        ctx.font = "900 32px -apple-system,Segoe UI,Roboto,sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("x2", x, y + 1);

      } else {                                            // shield
        halo(x, y, 46, "#8ffff2");
        spiked(x, y, 6, 30, 27, "#062229", "#8ffff2", Math.PI / 6);
        ctx.fillStyle = "#d8fffb";
        ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill();
      }
    }

    function drawItems() {
      var i, it, y;
      for (i = 0; i < items.length; i++) {
        it = items[i];
        if (it.p < pMin || it.p > pMax) continue;
        pathPoint(paths[it.path], it.p, pp);
        y = sy(pp.y);
        if (y < -70 || y > view.h + 70) continue;
        drawItem(it, pp.x, y, paths[it.path].color);
      }
    }

    function drawTrail() {
      var n = trail.length, col = paths[lane].color, pass, i, t;
      if (n < 2) return;
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (pass = 0; pass < 2; pass++) {
        ctx.strokeStyle = pass ? "#ffffff" : rgba(col, 0.5);
        for (i = 1; i < n; i++) {
          t = i / n;
          ctx.globalAlpha = pass ? t * 0.4 : t * 0.75;
          ctx.lineWidth = (pass ? 5 : 16) * t;
          ctx.beginPath();
          ctx.moveTo(trail[i - 1].x, sy(trail[i - 1].y));
          ctx.lineTo(trail[i].x, sy(trail[i].y));
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawArrow() {
      var col = paths[lane].color, g;
      if (invT > 0 && Math.floor(invT * 14) % 2) return;  // blink while invulnerable
      ctx.save();
      ctx.translate(arrowX, arrowY);
      ctx.rotate(arrowAng + Math.PI / 2);                 // the shape points at -y
      // one soft halo, so the cursor stays readable on top of a rope
      g = ctx.createRadialGradient(0, 0, 0, 0, 0, 54);
      g.addColorStop(0, rgba(col, 0.55));
      g.addColorStop(0.4, rgba(col, 0.2));
      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 54, 0, TAU); ctx.fill();
      // the chevron: white core, rope-coloured belly, dark contour
      g = ctx.createLinearGradient(0, -36, 0, 26);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.55, col); g.addColorStop(1, "#ffffff");
      ctx.beginPath();
      ctx.moveTo(0, -36); ctx.lineTo(26, 27); ctx.lineTo(0, 14); ctx.lineTo(-26, 27);
      ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(3,4,12,.9)"; ctx.stroke();
      if (shield) {
        ctx.lineWidth = 4; ctx.strokeStyle = rgba("#8ffff2", 0.85);
        ctx.beginPath(); ctx.arc(0, 0, 42, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      var i;
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, view.w, view.h);
      drawSparks();
      // the ridden rope last, so it always reads on top of the crossings
      for (i = 0; i < 3; i++) if (i !== lane) drawPath(paths[i], false);
      drawPath(paths[lane], true);
      drawItems();
      drawTrail();
      drawArrow();
    }

    function onResize() { metrics(); }

    return { reset: reset, update: update, render: render,
             onDown: onDown, onMove: onMove, onUp: onUp, onResize: onResize };
  })();

  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
