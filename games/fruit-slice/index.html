<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport locked to device size, no user scaling. This is mandatory for
  playable ads: the creative must fill the ad container and never scroll/zoom.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fruit Slice</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     Keep everything inline so the whole creative is one self-contained file.
     ===================================================================== -->
<style>
  /* ---- Reset & root ---- */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #241542;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;                 /* we handle all gestures ourselves */
  }

  /* ---- Stage: the square-ish play area, centered, orientation-agnostic ---- */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game { display: block; touch-action: none; cursor: crosshair; }

  /* ---- Screens (state machine overlays) ---- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
    background: radial-gradient(circle at 50% 30%, rgba(60,20,90,.55), rgba(20,8,36,.85));
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title { font-size: clamp(24px, 8vw, 46px); font-weight: 800; letter-spacing: .5px;
    color: #ffe082; text-shadow: 0 3px 0 #b71c1c, 0 6px 12px rgba(0,0,0,.5); }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .9; }

  /* ---- Buttons / Call To Action ---- */
  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ff8a3d, #e6392b);
    box-shadow: 0 8px 24px rgba(230,57,43,.5);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  /* ---- Persistent CTA banner (visible during gameplay, common in playables) ---- */
  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  /* ---- HUD (score, timer) ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(15px, 4.5vw, 22px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  /* ---- Loading spinner ---- */
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP  (structure of the creative)
     - #stage/#game : the canvas the game renders into.
     - #hud         : in-game score / timer.
     - .screen      : one overlay per game state (intro, end).
     - #cta-bar     : always-available install button.
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Score: <span id="score">0</span></div>
  <div id="hud-right">Time: <span id="time">0</span></div>
</div>

<!-- Loading screen: shown until assets + ad container are ready -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<!-- Intro screen: title + start button -->
<div id="screen-intro" class="screen hidden">
  <div class="title">FRUIT SLICE</div>
  <div class="subtitle">Swipe to slice the fruit. Avoid the bombs!</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<!-- End screen: result + primary CTA to the store -->
<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Nice!</div>
  <div class="subtitle" id="end-subtitle">You scored <span id="end-score">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<!-- Persistent CTA (hidden until gameplay begins) -->
<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined)
     Organized top-to-bottom in clearly labeled sections so a new game can
     be produced by editing mostly the CONFIG + GAME sections and leaving
     the ENGINE / AD glue untouched.
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     The knobs a new game changes first. Copy of business/creative params.
     =================================================================== */
  var CONFIG = {
    title: "FRUIT SLICE",
    gameSeconds: 25,               // round length; 0 = endless
    // Store links used by the CTA. The correct one is chosen at runtime.
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    // Design resolution — the game logic is authored against this virtual
    // size, then the canvas is scaled to fit any screen (see fitCanvas()).
    designWidth: 720,
    designHeight: 1280,
    bg: "#241542",

    // --- Fruit Slice tunables ---
    gravity: 1700,                 // px/s^2, applied to everything that flies
    spawnIntervalStart: 1.15,      // seconds between waves at round start
    spawnIntervalMin: 0.5,         // seconds between waves at round end (ramps up)
    bombChance: 0.16,              // probability a wave includes one bomb
    fruitTypes: [
      { name: "cherry", color: "#e6392b", color2: "#ff8a80", points: 10 },
      { name: "orange", color: "#ffa726", color2: "#ffe0b2", points: 10 },
      { name: "lime",   color: "#7cb342", color2: "#dcedc8", points: 15 },
      { name: "grape",  color: "#8e24aa", color2: "#e1bee7", points: 15 },
      { name: "blueberry", color: "#3f51b5", color2: "#c5cae9", points: 20 }
    ]
  };

  /* ===================================================================
     2. ASSETS  (embedded, no network requests)
     Register every asset as a data URI so the file stays self-contained.
     Use tools/embed-asset.mjs to generate these strings.
     Prefer CSS/canvas drawing & WebAudio synth over binary assets to stay
     well under the 5 MB budget; only embed images/sounds you truly need.
     =================================================================== */
  var ASSETS = {
    images: {
      // logo: "data:image/png;base64,iVBORw0KGgo..."
    },
    sounds: {
      // pop: "data:audio/mp3;base64,SUQzBAAAAAA..."
    }
  };

  /* ===================================================================
     3. ENGINE  (reusable helpers — shared by every game, rarely edited)
     =================================================================== */

  // --- tiny DOM helper ---
  function $(id) { return document.getElementById(id); }

  // --- Canvas & responsive scaling ---------------------------------
  // We render at CONFIG.designWidth x designHeight and letterbox-fit the
  // canvas to the viewport using CSS, accounting for devicePixelRatio so
  // drawing stays crisp on retina screens.
  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap DPR for perf
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    // Backing store size (crisp), CSS size (fit).
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in design coordinates
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  // --- Input: unified pointer events, mapped to design coordinates ---
  // Handles mouse + touch. Coordinates are converted from screen pixels to
  // the virtual design space so game logic never worries about scaling.
  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  // --- Game loop: fixed-ish dt via requestAnimationFrame -------------
  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05); // clamp big gaps (tab switch)
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  // --- Audio: WebAudio synth (zero-asset SFX) ------------------------
  // Generates simple tones so you get sound without embedding audio files.
  // For richer sound, put base64 clips in ASSETS.sounds and play via Audio.clip.
  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      // iOS requires resume() inside a user gesture.
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  // --- Storage: safe localStorage (sandboxed ad frames may block it) --
  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // --- Random helpers ------------------------------------------------
  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  // --- Image asset preloader ----------------------------------------
  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE  (MRAID + CTA + tracking — rarely edited)
     Playable ads run inside a network's iframe. We must:
       - wait for the ad container ("mraid") to be ready before starting,
       - route the install button through the network's open() when present,
       - report standard lifecycle events for analytics/QA.
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }

    // Resolve when the creative may start drawing/interacting.
    function whenReady(cb) {
      if (!window.mraid) return cb();                 // running standalone
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }

    // The single entry point for "user wants the app". Order matters:
    // MRAID first, then common network globals, then a plain window.open.
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}       // ironSource / generic
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {} // Google Ads
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }

    // Lightweight event hook. Swap console.log for a network SDK call if needed.
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }

    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE  (screens + flow — light edits per game)
     States: loading -> intro -> playing -> end. UI.show() toggles overlays.
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      // HUD + CTA bar are only visible during play.
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; },
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME  (the part a new prompt mostly rewrites)
     Everything above is reusable plumbing. A concrete game implements:
       Game.reset()            -> initialize round state
       Game.onDown(p)          -> pointer input (design coords)
       Game.update(dt)         -> advance simulation (seconds)
       Game.render()           -> draw a frame (design coords)
       Game.onEnd()            -> compute result before end screen
     Fruit Slice also uses onMove(p)/onUp(p) to track the blade path — the
     bootstrap section below routes Input's move/up events into these.
     =================================================================== */
  var Game = (function () {
    var score, timeLeft;
    var fruits, pieces, particles, bladeTrail;
    var gameTime, spawnTimer, gameOver, shakeTimer;
    var pointerDown, lastPoint;

    function reset() {
      score = 0;
      timeLeft = CONFIG.gameSeconds;
      fruits = [];
      pieces = [];
      particles = [];
      bladeTrail = [];
      gameTime = 0;
      spawnTimer = 0.4;
      gameOver = false;
      shakeTimer = 0;
      pointerDown = false;
      lastPoint = null;
      UI.setScore(0);
      UI.setTime(timeLeft);
    }

    // --- spawning -----------------------------------------------------
    function computeSpawnInterval() {
      var elapsed = CONFIG.gameSeconds - timeLeft;
      var t = Math.max(0, Math.min(1, elapsed / CONFIG.gameSeconds));
      return CONFIG.spawnIntervalStart + (CONFIG.spawnIntervalMin - CONFIG.spawnIntervalStart) * t;
    }

    function spawnFruit() {
      var type = Rand.pick(CONFIG.fruitTypes);
      fruits.push({
        isBomb: false,
        color: type.color, color2: type.color2, points: type.points,
        x: Rand.range(90, view.w - 90), y: view.h + 60,
        r: Rand.range(46, 64),
        vx: Rand.range(-170, 170), vy: Rand.range(-1600, -1350),
        rot: Rand.range(0, Math.PI * 2), vrot: Rand.range(-2, 2)
      });
    }

    function spawnBomb() {
      fruits.push({
        isBomb: true,
        x: Rand.range(90, view.w - 90), y: view.h + 60,
        r: 52,
        vx: Rand.range(-140, 140), vy: Rand.range(-1500, -1300),
        rot: 0, vrot: Rand.range(-1, 1),
        fuseSeed: Math.random() * 10
      });
    }

    function spawnWave() {
      var elapsed = CONFIG.gameSeconds - timeLeft;
      var maxCount = 1 + Math.min(2, Math.floor(elapsed / 9));
      var count = Rand.int(1, maxCount);
      var bombSlot = Math.random() < CONFIG.bombChance ? Rand.int(0, count - 1) : -1;
      for (var i = 0; i < count; i++) {
        if (i === bombSlot) spawnBomb(); else spawnFruit();
      }
    }

    // --- slicing --------------------------------------------------------
    // Standard segment-vs-circle intersection test (blade segment p0->p1
    // against a fruit's hit circle), used while the pointer is down+moving.
    function segmentHitsCircle(p0, p1, cx, cy, r) {
      var dx = p1.x - p0.x, dy = p1.y - p0.y;
      var fx = p0.x - cx, fy = p0.y - cy;
      var a = dx * dx + dy * dy;
      if (a === 0) return (fx * fx + fy * fy) <= r * r;
      var b = 2 * (fx * dx + fy * dy);
      var c = fx * fx + fy * fy - r * r;
      var disc = b * b - 4 * a * c;
      if (disc < 0) return false;
      disc = Math.sqrt(disc);
      var t1 = (-b - disc) / (2 * a), t2 = (-b + disc) / (2 * a);
      if (t1 >= 0 && t1 <= 1) return true;
      if (t2 >= 0 && t2 <= 1) return true;
      if (t1 < 0 && t2 > 1) return true; // segment fully inside the circle
      return false;
    }

    function makeHalves(fruit, p0, p1) {
      var bladeAngle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
      var nx = -Math.sin(bladeAngle), ny = Math.cos(bladeAngle);
      var speed = 200;
      pieces.push({
        x: fruit.x, y: fruit.y,
        vx: fruit.vx + nx * speed + Rand.range(-30, 30),
        vy: fruit.vy + ny * speed - 140 + Rand.range(-30, 30),
        r: fruit.r, color: fruit.color, color2: fruit.color2,
        cutAngle: bladeAngle, half: 0, rot: 0, vrot: Rand.range(3, 6), life: 0.7
      });
      pieces.push({
        x: fruit.x, y: fruit.y,
        vx: fruit.vx - nx * speed + Rand.range(-30, 30),
        vy: fruit.vy - ny * speed - 140 + Rand.range(-30, 30),
        r: fruit.r, color: fruit.color, color2: fruit.color2,
        cutAngle: bladeAngle, half: 1, rot: 0, vrot: -Rand.range(3, 6), life: 0.7
      });
    }

    function makeJuice(x, y, vx, vy, color, count) {
      for (var i = 0; i < count; i++) {
        var ang = Rand.range(0, Math.PI * 2), spd = Rand.range(80, 320);
        particles.push({
          x: x, y: y,
          vx: Math.cos(ang) * spd + vx * 0.25, vy: Math.sin(ang) * spd + vy * 0.25,
          r: Rand.range(3, 7), color: color,
          life: Rand.range(0.35, 0.6), maxLife: 0.6
        });
      }
    }

    function triggerBombEnd(bomb) {
      if (gameOver) return;
      gameOver = true;
      shakeTimer = 0.45;
      Sound.beep(110, 0.45, "sawtooth");
      makeJuice(bomb.x, bomb.y, bomb.vx, bomb.vy, "#ff6f3d", 18);
    }

    function sliceFruit(fruit, p0, p1) {
      if (fruit.isBomb) { triggerBombEnd(fruit); return; }
      score += fruit.points;
      UI.setScore(score);
      Sound.beep(Rand.range(520, 760), 0.12, "triangle");
      makeHalves(fruit, p0, p1);
      makeJuice(fruit.x, fruit.y, fruit.vx, fruit.vy, fruit.color2, 12);
    }

    function checkSlice(p0, p1) {
      for (var i = 0; i < fruits.length; i++) {
        var f = fruits[i];
        if (f.dead) continue;
        if (segmentHitsCircle(p0, p1, f.x, f.y, f.r)) {
          f.dead = true;
          sliceFruit(f, p0, p1);
        }
      }
    }

    // --- input ------------------------------------------------------------
    function onDown(p) {
      if (gameOver) return;
      pointerDown = true;
      lastPoint = p;
      bladeTrail.push({ x: p.x, y: p.y, t: gameTime });
    }

    function onMove(p) {
      if (gameOver || !pointerDown) { lastPoint = p; return; }
      var prev = lastPoint;
      lastPoint = p;
      bladeTrail.push({ x: p.x, y: p.y, t: gameTime });
      if (prev) checkSlice(prev, p);
    }

    function onUp() {
      pointerDown = false;
      lastPoint = null;
    }

    // --- physics helpers --------------------------------------------------
    function updateMotion(list, dt, gravityScale) {
      for (var i = list.length - 1; i >= 0; i--) {
        var p = list[i];
        p.vy += CONFIG.gravity * gravityScale * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.vrot !== undefined) p.rot += p.vrot * dt;
        p.life -= dt;
        if (p.life <= 0 || p.y - (p.r || 0) > view.h + 80) list.splice(i, 1);
      }
    }

    function update(dt) {
      gameTime += dt;

      if (gameOver) {
        updateMotion(pieces, dt, 1);
        updateMotion(particles, dt, 0.6);
        shakeTimer -= dt;
        if (shakeTimer <= 0) end(true);
        return;
      }

      if (CONFIG.gameSeconds > 0) {
        timeLeft -= dt;
        UI.setTime(Math.max(0, Math.ceil(timeLeft)));
        if (timeLeft <= 0) { end(false); return; }
      }

      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnWave(); spawnTimer = computeSpawnInterval(); }

      for (var i = fruits.length - 1; i >= 0; i--) {
        var f = fruits[i];
        f.vy += CONFIG.gravity * dt;
        f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vrot * dt;
        if (f.dead || f.y - f.r > view.h + 60 || f.x < -f.r - 60 || f.x > view.w + f.r + 60) {
          fruits.splice(i, 1); // missed or already sliced: no penalty
        }
      }
      updateMotion(pieces, dt, 1);
      updateMotion(particles, dt, 0.6);

      for (var b = bladeTrail.length - 1; b >= 0; b--) {
        if (gameTime - bladeTrail[b].t > 0.15) bladeTrail.splice(b, 1);
      }
    }

    // --- rendering ----------------------------------------------------
    function drawFruit(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      if (f.isBomb) {
        var grd = ctx.createRadialGradient(-f.r * 0.3, -f.r * 0.3, f.r * 0.1, 0, 0, f.r);
        grd.addColorStop(0, "#5a5a5a"); grd.addColorStop(1, "#111");
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, -f.r);
        ctx.quadraticCurveTo(f.r * 0.3, -f.r * 1.3, f.r * 0.15, -f.r * 1.55);
        ctx.stroke();
        var flicker = 0.6 + 0.4 * Math.sin(gameTime * 20 + f.fuseSeed);
        ctx.fillStyle = "rgba(255," + Math.floor(140 + 80 * flicker) + ",0," + flicker.toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(f.r * 0.15, -f.r * 1.55, 6 + 3 * flicker, 0, Math.PI * 2); ctx.fill();
      } else {
        var grd2 = ctx.createRadialGradient(-f.r * 0.3, -f.r * 0.35, f.r * 0.15, 0, 0, f.r);
        grd2.addColorStop(0, f.color2); grd2.addColorStop(1, f.color);
        ctx.fillStyle = grd2;
        ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.beginPath();
        ctx.ellipse(-f.r * 0.35, -f.r * 0.4, f.r * 0.22, f.r * 0.14, -0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawPiece(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.7));
      var grd = ctx.createRadialGradient(0, 0, p.r * 0.1, 0, 0, p.r);
      grd.addColorStop(0, p.color2); grd.addColorStop(1, p.color);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      if (p.half === 0) ctx.arc(0, 0, p.r, p.cutAngle, p.cutAngle + Math.PI);
      else ctx.arc(0, 0, p.r, p.cutAngle + Math.PI, p.cutAngle + Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawParticle(pt) {
      var alpha = Math.max(0, pt.life / pt.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(1, pt.r * alpha), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawBlade() {
      if (bladeTrail.length < 2) return;
      ctx.save();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(255,255,255,0.8)"; ctx.shadowBlur = 12;
      for (var i = 1; i < bladeTrail.length; i++) {
        var a = bladeTrail[i - 1], b = bladeTrail[i];
        var age = gameTime - b.t;
        var alpha = Math.max(0, 1 - age / 0.15);
        if (alpha <= 0) continue;
        ctx.strokeStyle = "rgba(255,255,255," + alpha.toFixed(2) + ")";
        ctx.lineWidth = 6 + 14 * alpha;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      var shakeX = 0, shakeY = 0;
      if (gameOver && shakeTimer > 0) {
        var m = shakeTimer / 0.45;
        shakeX = Rand.range(-1, 1) * 10 * m;
        shakeY = Rand.range(-1, 1) * 10 * m;
      }
      ctx.save();
      ctx.translate(shakeX, shakeY);

      var g = ctx.createLinearGradient(0, 0, 0, view.h);
      g.addColorStop(0, "#241542"); g.addColorStop(1, "#4a2360");
      ctx.fillStyle = g;
      ctx.fillRect(-20, -20, view.w + 40, view.h + 40);

      for (var i = 0; i < fruits.length; i++) drawFruit(fruits[i]);
      for (var j = 0; j < pieces.length; j++) drawPiece(pieces[j]);
      for (var k = 0; k < particles.length; k++) drawParticle(particles[k]);
      drawBlade();

      ctx.restore();
    }

    function end(bombHit) {
      Loop.stop();
      Store.set("bestScore", Math.max(score, Store.get("bestScore", 0)));
      UI.setEnd(bombHit ? "BOOM!" : "Time's Up!", score);
      setState("end");
      Ad.track("game_end", { score: score, bombHit: !!bombHit });
    }

    return { reset: reset, onDown: onDown, onMove: onMove, onUp: onUp, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP  (wire everything together — rarely edited)
     Fruit Slice needs the full blade path, so all three Input events
     (down/move/up — already supported by the engine's Input helper) are
     routed to the game, not just "down" as in the base template.
     =================================================================== */
  function startGame() {
    Sound.unlock();                 // must happen in a user gesture (iOS)
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;

    // Route all inputs to the current game (down/move/up for the blade path).
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing") Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing") Game.onUp(p); });

    // Button wiring.
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    // Preload embedded images, then reveal the intro once the ad is ready.
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  // Kick off after DOM is parsed.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
