     which keeps the seam sample-accurate even when the rAF loop is paused.  */

       clock stays valid for the whole session; whatever is left of the buffer

  /* --- Beat: the musical clock -------------------------------------------

  /* --- Icons: embedded SVGs, tinted and cached --------------------------

  /* --- Fx: the shared canvas juice layer --------------------------------

      // opts out: the prewarm pass below builds every style while the intro is
      // up, and must not shake, flash, glow the frame edges or drop confetti.
      if (!opt.silent) {
        if (st.shake) Fx.shake(st.shake, st.shakeDur || 0.3);
        if (st.flash) Fx.flash(st.flashCol || "#ffffff", st.flash);
        if (st.vignette) Overlay.vignette(st.vignette, 1, Math.min(st.vignetteMs || 520, enter + Math.max(hold, 0)));
        if (st.confetti) Confetti.burst(st.confetti);
      }

      var handle;
      function remove() {
        var i = live.indexOf(handle);
        if (i >= 0) live.splice(i, 1);
        if (pop.parentNode) pop.parentNode.removeChild(pop);
      }
      function close(delay) {
        if (out.getAttribute("data-closing")) return;
        out.setAttribute("data-closing", "1");
        out.style.animation = "pop-out-" + st.anim + " " + exit + "ms ease-in " + delay + "ms forwards";
        later(remove, delay + exit + 60);
      }
      if (hold >= 0) close(enter + hold);

      handle = { el: pop, close: function () { close(0); }, remove: remove };
      live.push(handle);
      // Over the cap: drop the oldest outright rather than play it out — under a
      // burst it is already faded, and an exit animation costs another frame.
      while (live.length > MAX_LIVE) live[0].remove();
      return handle;
    }

    /* The catalogue. Each entry is one visual language:
         cls is implicit (".pop-<key>")
         anim                 entry/exit pair ("slam" -> pop-in-slam/pop-out-slam)
         enter / hold / exit  default timing in ms; `hold` is what a caller tunes
         decor                layers painted behind the word
         at / rot             default anchor and static tilt
         letters              split the word per glyph (staggered drop-in); off
                              by default because one layer rasterizes far faster
         vertical             manga column, one glyph per line
         shake / flash / vignette / confetti: full-frame impact
       Timings are deliberately tight: a callout that outstays the beat hides the
       gameplay it is celebrating. Lengthen `hold` per call, never by default. */
    var STYLES = {
      // the tiny frequent one, spawned at the impact point
      score:    { anim:"float", enter:240, hold:240, exit:420, decor:[], at:"center", rot:-5 },
      // a mistake: chain lost, wall hit. Sits where a toast would, but styled
      // like the rest of the callouts instead of looking like a leftover pill.
      alert:    { anim:"punch", enter:220, hold:320, exit:220, decor:[], at:"hudUnder", rot:-2 },
      // a scoring milestone: a compact chip with a shockwave, off to one side.
      // This is the one callout a good run fires over and over, so it is built
      // to cost nothing (see .pop-combo and pop-in-chip): no full-frame veil,
      // no clip-path, and a footprint the size of its own text. `ultra` keeps
      // the flash for the moment that really is rare.
      combo:    { anim:"chip", enter:260, hold:520, exit:220, decor:["ring","dashes"],
                  at:"upperRight", rot:-7, shake:4 },
      // a chain staying alive: chevrons pushing the eye sideways
      streak:   { anim:"punch", enter:300, hold:480, exit:240, decor:["chevrons"],
                  at:"left", rot:-7, shake:4 },
      // a comic banner sweeping across the play area
      ribbon:   { anim:"swipe", enter:420, hold:620, exit:320, decor:["band","lines"],
                  at:"upper", shake:5 },
      // poster energy for a big announcement (level up, unlock)
      manifest: { anim:"drop", enter:520, hold:820, exit:320, decor:["dots","band"],
                  at:"center", letters:true, shake:12,
                  vignette:"rgba(214,27,60,.9)", vignetteMs:700 },
      // "you nailed it": gold, sparkles, gentle rays
      perfect:  { anim:"punch", enter:360, hold:620, exit:280, decor:["sparks"],
                  at:"upper", rot:-3, vignette:"rgba(255,190,60,.8)" },
      // the hero moment: rays, chroma, maximum size
      ultra:    { anim:"zoom", enter:440, hold:640, exit:320, decor:["rays"],
                  at:"center", shake:16, flash:0.5, vignette:"rgba(120,70,255,.85)" },
      // a reward sticker
      bonus:    { anim:"drop", enter:380, hold:620, exit:280, decor:["dots"], at:"lower", rot:-4 },
      // hazard tape, blinking for the whole hold
      danger:   { anim:"alarm", enter:240, hold:1100, exit:260, pulse:true, decor:["stripes"],
                  at:"top", vignette:"rgba(255,40,40,.85)", vignetteMs:1100 },
      // the end-of-run peak (its confetti only shows once the end screen is up,
      // since Confetti draws on the end-screen canvas)
      record:   { anim:"drop", enter:620, hold:1500, exit:380, decor:["rays","band","sparks"],
                  at:"center", shake:8, confetti:28 },
      // vertical manga column hugging one edge
      vert:     { anim:"punch", enter:320, hold:560, exit:260, decor:["rays"],
                  at:"edgeRight", rot:4, vertical:true }
    };

    function clear() {
      var i; for (i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = []; live = [];
      $("ov-pops").innerHTML = "";
    }

    /* Rasterizing a style for the first time costs 50-80 ms (gradient text,
       clip-paths, masks). That must never land on a milestone frame, so every
       style is built once — hidden, one per animation frame — while the intro is
       up and nothing is being played. Idempotent and self-cancelling. */
    var warmed = false;
    function prewarm() {
      if (warmed) return;
      warmed = true;
      var keys = [], k;
      for (k in STYLES) if (STYLES.hasOwnProperty(k)) keys.push(k);
      var i = 0;
      function step() {
        if (i >= keys.length) return;
        // Not visibility:hidden — an invisible layer is never rasterized, which
        // is the whole point of the pass. Near-zero opacity still paints.
        var h = show(keys[i++], { word: "WARM UP", sub: "0", hold: 0, enter: 1, exit: 1, silent: true });
        if (h) h.el.style.opacity = "0.004";
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    return { show: show, clear: clear, prewarm: prewarm, styles: STYLES, anchors: ANCHORS };
  })();

  // --- Intro: logo, copy and the animated how-to-play demo ----------------
  function buildIntro() {
    var logo = CONFIG.intro.logo && ASSETS.images[CONFIG.intro.logo];
    var img = $("app-icon");
    if (logo) { img.src = logo; img.alt = CONFIG.title; } else { img.style.display = "none"; }
    $("intro-title").textContent = CONFIG.title;
    $("intro-tagline").innerHTML = CONFIG.tagline;
    $("intro-demo").className = "demo-" + (CONFIG.intro.demo || "tap");
    $("demo-caption").textContent = CONFIG.intro.caption || "";
    $("btn-start").textContent = CONFIG.copy.start;
    $("btn-cta").textContent = CONFIG.copy.ctaBar;
    $("btn-install").textContent = CONFIG.copy.ctaEnd;
    $("btn-replay").textContent = CONFIG.copy.replay;
    $("hud-score-lbl").textContent = CONFIG.copy.scoreLabel;
    $("eo-scorelbl").textContent = CONFIG.copy.endScore;
  }

  // --- End screen: the cinematic reveal ----------------------------------
  // Beats: title -> score count-up (+confetti) -> stars -> stat rows -> CTA.
  var EndScreen = (function () {
    var timers = [];
    var T_TITLE = 120, T_SCORE = 560, T_STARS = 1950, STAR_GAP = 440,
        ROW_GAP = 250, T_CTA_AFTER = 1500;
    // The reveal climbs: each star rings the same chime a step higher. RATE
    // drives the embedded "uiStar" clip, FREQ the synthesized fallback.
    var STAR_RATE = [1, 1.19, 1.42], STAR_FREQ = [660, 880, 1180];

    function countUp(el, target, dur, cb) {
      var start = performance.now();
      function step(now) {
        var p = clamp((now - start) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(e * target);
        if (p < 1) requestAnimationFrame(step);
        else { el.textContent = target; if (cb) cb(); }
      }
      requestAnimationFrame(step);
    }

    // result: { title, variant:""|"win"|"perfect", score, stars:0..3|null,
    //           rows:[{label, value, grade}] }
    function show(result) {
      timers.forEach(clearTimeout); timers = [];
      Confetti.clear();
      function T(fn, ms) { timers.push(setTimeout(fn, ms)); }

      var title = $("eo-title");
      title.textContent = result.title || CONFIG.copy.gameOver;
      title.className = "eo-title" + (result.variant ? " " + result.variant : "");
      ["eo-title", "eo-scorelbl", "eo-score"].forEach(function (id) { $(id).classList.remove("show", "pop"); });
      $("eo-score").textContent = "0";
      $("btn-install").classList.remove("show");
      $("btn-replay").classList.remove("show");

      // Stars (pass null / undefined to hide the row entirely).
      var stars = result.stars;
      var hasStars = stars != null;
      $("eo-stars").classList.toggle("hidden", !hasStars);
      for (var i = 1; i <= 3; i++) $("star-" + i).className = "star";

      // Stat rows are rebuilt every round so a replay starts clean.
      var rows = result.rows || [];
      var box = $("eo-stats"), html = "";
      rows.forEach(function (r, i) {
        var label = r.grade === "gold"
          ? '<span class="spark">✦</span> ' + r.label + ' <span class="spark">✦</span>'
          : r.label;
        html += '<div class="eo-row' + (r.grade ? " " + r.grade : "") + '" id="eo-row-' + i + '">' +
                '<span>' + label + '</span><span class="eo-val" id="eo-val-' + i + '">0</span></div>';
      });
      box.innerHTML = html;

      // 1) Title slams in.
      T(function () { title.classList.add("show"); }, T_TITLE);

      // 2) Final score counts up, greeted by confetti.
      T(function () {
        $("eo-scorelbl").classList.add("show");
        $("eo-score").classList.add("show");
        Confetti.burst(70);
        countUp($("eo-score"), result.score || 0, 1100, function () {
          $("eo-score").classList.add("pop");
          Sound.cue("uiScore", 0.8, 1, 900, 0.14);
          Confetti.burst(90);
        });
      }, T_SCORE);

      // 3) Stars slam in one by one, each with a rising chime.
      var afterStars = T_SCORE + 900;
      if (hasStars) {
        T(function () { for (var s = 1; s <= 3; s++) $("star-" + s).classList.add("dim"); }, T_STARS - 160);
        for (var si = 0; si < stars; si++) {
          (function (idx) {
            T(function () {
              var el = $("star-" + (idx + 1));
              el.classList.remove("dim"); el.classList.add("on");
              Sound.cue("uiStar", 0.75, STAR_RATE[idx] || 1.42, STAR_FREQ[idx] || 1180, 0.16);
              Confetti.burst(30);
            }, T_STARS + idx * STAR_GAP);
          })(si);
        }
        afterStars = T_STARS + Math.max(stars, 1) * STAR_GAP + 350;
      }

      // 4) Stat rows cascade in, counters animating.
      rows.forEach(function (r, i) {
        T(function () {
          $("eo-row-" + i).classList.add("show");
          var el = $("eo-val-" + i);
          if (typeof r.value === "number") countUp(el, r.value, 450);
          else el.textContent = r.value;
          Sound.cue("uiRow", 0.5, 1 + i * 0.07, 480 + i * 70, 0.05);
        }, afterStars + i * ROW_GAP);
      });

      // 5) Install CTA, then the discreet replay link.
      var ctaAt = afterStars + rows.length * ROW_GAP + T_CTA_AFTER;
      T(function () { $("btn-install").classList.add("show"); }, ctaAt);
      T(function () { $("btn-replay").classList.add("show"); }, ctaAt + 500);
    }
    return { show: show };
  })();

  /* --- Perf: a readout on the device itself ------------------------------
     Add `?perf=1` to a game's URL and this box appears; without it not a line
     of it runs. It exists because the two machines disagree: a desktop absorbs
     costs a phone cannot, and no bench on a laptop reproduces the phone that
     is actually stuttering.

     What it shows, and why that split is the whole point:

       fps / worst     the real frame interval, which includes everything —
                       script, style, layout, paint, raster, composite.
       main            how much of the worst frame the MAIN THREAD owned, read
                       from the browser's own long-animation-frame report
                       (Chromium; Firefox has no equivalent and shows "n/a").
       verdict         `main` says which half to look at. A long frame with a
                       long `main` is JavaScript, style or layout — profile the
                       game code. A long frame with a SHORT `main` is paint,
                       raster or compositing: the main thread was idle and the
                       frame still missed, which is what an animated paint
                       property or an oversized layer does, and it is the one
                       failure a JS profiler cannot see.

     Read it while playing, not on the menu: the callouts and the HUD only cost
     anything once a round is running.                                       */
  var Perf = (function () {
    var on = false;
    try { on = /(^|[?&#])perf=1\b/.test(location.search + location.hash); } catch (e) {}
    if (!on) return { frame: function () {} };

    var box = null, prev = 0, frames = 0, worst = 0, over = 0, since = 0;
    var mainWorst = 0, mainKnown = false;
    /* Ask whether the browser CAN report a long main-thread frame, rather than
       waiting for one to arrive. It is the case that matters: a long frame with
       no report is the verdict, so "no report yet" and "cannot report" must not
       look the same. */
    try {
      mainKnown = !!(window.PerformanceObserver && PerformanceObserver.supportedEntryTypes &&
        PerformanceObserver.supportedEntryTypes.indexOf("long-animation-frame") >= 0);
    } catch (e) {}

    /* The browser reports a long animation frame with the main thread's share
       of it already broken down. Only the total is used here: the interesting
       question on a phone is not which main-thread phase was slow, it is
       whether the main thread was involved at all. */
    try {
      new PerformanceObserver(function (list) {
        var e = list.getEntries();
        for (var i = 0; i < e.length; i++) if (e[i].duration > mainWorst) mainWorst = e[i].duration;
      }).observe({ type: "long-animation-frame", buffered: false });
    } catch (e) {}

    function ensure() {
      if (box) return box;
      box = document.createElement("div");
      /* Inline styles, outside the frame: a probe must not need a rule in the
         motor stylesheet, and it must not ride the frame's scale transform. */
      box.style.cssText = "position:fixed;left:6px;top:6px;z-index:9999;" +
        "padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.72);color:#eafcff;" +
        "font:700 11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;" +
        "pointer-events:none;text-align:left";
      document.body.appendChild(box);
      return box;
    }

    function frame() {
      var t = (window.performance && performance.now) ? performance.now() : Date.now();
      if (prev) {
        var dt = t - prev;
        frames++; since += dt;
        if (dt > worst) worst = dt;
        if (dt > 32) over++;
        if (since >= 1000) {
          var fps = Math.round(frames * 1000 / since);
          var main = mainKnown ? Math.round(mainWorst) + "ms" : "n/a";
          var verdict = worst < 32 ? "ok"
            : !mainKnown ? "slow — no main-thread report here"
            : mainWorst > worst * 0.6 ? "main thread" : "paint/raster";
          ensure().textContent =
            "fps " + fps + "   worst " + Math.round(worst) + "ms\n" +
            "main " + main + "   >32ms " + over + "/s" + (verdict ? "\n" + verdict : "");
          frames = 0; since = 0; worst = 0; over = 0; mainWorst = 0;
        }
      }
      prev = t;
    }
    return { frame: frame };
  })();

  // --- Round clock -------------------------------------------------------
  var Round = (function () {
    var left = 0, running = false, fired = false;
    function reset() {
      left = CONFIG.gameSeconds; running = true; fired = false;
      if (CONFIG.gameSeconds > 0) HUD.setTime(left);
    }
    function tick(dt) {
      if (!running || CONFIG.gameSeconds <= 0) return;
      left = Math.max(0, left - dt);
      HUD.setTime(left);
      if (left <= 0 && !fired) {
        fired = true;
        // The game decides what "time up" means (end now, sudden death…).
        if (Game.onTimeUp) Game.onTimeUp();
        else endRound({ title: CONFIG.copy.timeUp });
      }
    }
    return {
      reset: reset, tick: tick, stop: function () { running = false; },
      left: function () { return left; },
      elapsed: function () { return CONFIG.gameSeconds - left; }
    };
  })();

  // --- The single way a round ends ---------------------------------------
  // result: { title, variant, score, stars, rows, track }
  function endRound(result) {
    if (State === "end") return;
    result = result || {};
    Loop.stop(); Round.stop();
    Music.duck(0.55, 0.8);        // let the end-screen cues sit on top
    var score = result.score == null ? Math.round(HUD.score()) : result.score;
    var best = Math.max(score, Store.get("bestScore", 0));
    Store.set("bestScore", best);
    setState("end");
    EndScreen.show({
      title: result.title || CONFIG.copy.gameOver,
      variant: result.variant || "",
      score: score,
      stars: result.stars,
      rows: result.rows || []
    });
    Ad.track("game_end", result.track || { score: score, best: best });
  }

  /* ===================================================================
     6. GAME — GEARBALL: fill the loop.

     EVERY ROUND GROWS A CLOSED CIRCUIT. Eight cogs of wildly different sizes,
     each tangent to the next, packed into a ring that comes back to where it
     started — and their rims form ONE continuous track, cut into slots at a
     constant pitch. The whole slot ring rides the machine at a single rim
     speed, so a ball that finds a seat never changes pace and never changes
     neighbour.

                        hopper          tap to release
                          |
                          v
                     .--( o )--.        the entry: the highest point
                    /           \       of the track
                   |  O  o  O    |      the ring: cogs of every size
                    \           /       and the slot chain riding their rims
                     '---------'

     THE PLAYER ONLY EVER TAPS. The hopper holds three balls and refills them
     almost as fast as they leave, so a tap always fires and several balls can
     be in the air at once. Each falls straight down, from the hopper onto the
     entry:
       - the slot arriving there is FREE  -> the ball seats, scores, and the
         combo climbs;
       - the slot arriving there is TAKEN -> the ball is destroyed, the shift
         loses a life and the combo dies.
     Fill every slot and the circuit is CLOSED: that wins the shift there and
     then — a stage bonus, worth more the more clock is left, and the end
     screen. The 45 s are one ring to close, not a lap counter.

     THE SKILL IS A LEAD, NOT A REFLEX. The fall lasts about a third of a
     second, in which the machine turns nearly two slots — so the gap to aim at
     is never the one under the hopper when the finger goes down. That single
     idea is the whole game, and the ring fills up as it is learned: the last
     four slots are a real wait for a real gap.

     ONE ACCUMULATOR RUNS EVERYTHING. `spin` is the total rim distance the
     machine has turned. Slot k sits at arc (k*pitch + spin), gear i is rotated
     spin*dir/r, and the ball in the air lands on the slot at the spin the fall
     will END at — computed in closed form at release, so what the player sees
     coming is exactly what arrives. Nothing here can drift out of step.
     =================================================================== */
  var Game = (function () {

    var R = CONFIG.ring;
    var PI2 = Math.PI * 2;

    /* ---------------- the circuit ---------------------------------- */
    var gears = [];              // { x, y, r, dir }
    var seg = [], cum = [];      // one arc of track per gear, and where it starts
    var total = 0;               // length of the whole closed track
    var entryS = 0, entry = { x: 0, y: 0 }, hopperY = 0;
    var slotN = 0, pitch = 0, occ = [], filled = 0;
    var spin = 0, speed = 0;

    /* ---------------- the run -------------------------------------- */
    var score, combo, landed, jams, lives, circuits, best;
    var bestRun = 0, weldTotal = 0;   // the longest chain built, and what welding paid
    var warnLeft = true;              // the "3 slots left" callout, fired once
    var warnWeld = true;              // the chain is taught on the first weld
    var over = 0;                 // the beat between the last ball and the end screen
    var ended = false;            // the round is spoken for: nothing may end it twice
    var stageBonus = 0;           // what closing the circuit paid
    var stall = 0;                // the lockout after a jam
    var gap = 0;                  // the beat before the hopper lets another go
    var magQ = [], magT = 0;      // the loaded balls, HEAD FIRST, and the refill beat
    var specT = 0;                // seconds until the hopper loads a special
    var slide = 0;                // the queue shuffling up after a drop
    var slideN = 0;               // how many balls that drop left behind it
    var flying = [];              // the balls in the air, oldest first
    var ballR = 14;

    /* The magazine is a QUEUE whose head is the MIDDLE seat — the one on the
       drop line — so the ball that leaves is always the one the player is
       looking at. `magAdd` is the seat each rank of the queue sits in: the
       middle first, then outwards. Rank j therefore hangs at seatX(magAdd[j]),
       a drop empties the middle and every ball behind it moves up exactly one
       rank, so no ball ever crosses the drop line to take its place — and now
       that a ball has a TYPE, that identity has to survive the shuffle, which
       is why the queue is indexed by rank and never by screen position. */
    var magAdd = (function () {
      var c = Math.floor((R.magSize - 1) / 2), a = [c], d = 1;
      while (a.length < R.magSize) {
        if (c + d < R.magSize) a.push(c + d);
        if (a.length < R.magSize && c - d >= 0) a.push(c - d);
        d++;
      }
      return a;
    })();
    function seatX(i) {
      return entry.x + (i - (R.magSize - 1) / 2) * (R.ballR * 2 + 4);
    }

    /* ---------------- the ball types -------------------------------- */
    /* `plain` is the machine's own stock and is all the player ever sees for
       the first few seconds. The three specials arrive on CONFIG.ring.special
       and are told apart by colour AND by the mark stamped into the sprite —
       colour alone is not a read on a small phone over a lit machine. */
    var TYPES = {
      plain:  { col: R.ball,   mark: 0 },
      wild:   { col: R.wild,   mark: 1 },   // a cross: it cannot jam
      split:  { col: R.split,  mark: 2 },   // two dots: it seats twice
      charge: { col: R.charge, mark: 3 }    // a bolt: it discharges a chain
    };
    function typeOf(t) { return TYPES[t] || TYPES.plain; }

    /* ---------------- the light on the machine --------------------- */
    /* One jitter ring per cog, re-rolled on a crackle beat, plus the two
       levels that decide whether that cog is on screen at all: `lit`, the
       charge the balls riding it hold up, and `hot`, the flash of a contact
       dying out. See drawArc(). */
    var ZAP_SEGS = 24;
    var charge = [];
    var tmpArc = {};

    /* ---------------- sprites -------------------------------------- */
    var gearCv = {}, ballCv = {}, spriteR = 0, bgCv = null;

    // The band the ring may occupy: the Layout, minus the room the hopper and
    // its drop need at the top. Never a hard-coded screen coordinate.
    var HOPPER_ROOM = 150;
    function bandTop() {
      return Math.min(Layout.top + HOPPER_ROOM, Layout.bottom - 320);
    }

    /* ===============================================================
       THE GENERATOR — a closed ring of tangent gears.

       Two neighbours in the ring are tangent, so the segment joining their
       centres is exactly r[i] + r[i+1] long: the ring IS a closed polygon with
       prescribed side lengths. Of all such polygons the CYCLIC one — every
       vertex on one circumcircle — is the roundest and always convex, and it
       falls out of a single bisection: a chord d subtends 2*asin(d/2R) at the
       centre, so the circumradius is the R that makes those angles add up to a
       full turn.

       Then parity. Meshing gears counter-rotate, so the spin alternates all the
       way round the ring — and the ring only closes on itself with an EVEN
       number of gears. That is the one hard constraint on the whole generator.
       It also draws the track: a gear whose neighbours sit either side of it
       carries the ball over its OUTER arc when it turns one way and through its
       INNER arc when it turns the other, so consecutive gears alternate and the
       track weaves in and out of the ring instead of tracing a circle.
       =============================================================== */

    function ang(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }

    // Where the track is, `s` arc units from its origin.
    function posAt(s, out) {
      s = s % total; if (s < 0) s += total;
      var i = 0;
      while (i < seg.length - 1 && s >= cum[i + 1]) i++;
      var sg = seg[i], th = sg.inA + sg.dir * ((s - cum[i]) / sg.g.r);
      out = out || {};
      out.x = sg.g.x + Math.cos(th) * sg.g.r;
      out.y = sg.g.y + Math.sin(th) * sg.g.r;
      out.i = i;
      return out;
    }

    // The hopper hangs a fixed height above whatever the entry turns out to be,
    // so the fall — and with it the lead the player must give — is a tuned
    // number and not an accident of how the ring happened to pack.
    function placeHopper() {
      hopperY = Math.max(Layout.top + 56, entry.y - R.dropH);
    }

    /* One try at a whole circuit. Returns false the moment the geometry
       refuses, and every rejection leaves the state describing ONE consistent
       ring, so a generator that runs out of tries still hands back something
       playable. */
    function attempt(rmin, rmax) {
      var N = R.gears - (R.gears % 2), i, j;
      if (N < 6) N = 6;

      // the radii, and the polygon sides they impose
      var rr = [], d = [], dMax = 0;
      for (i = 0; i < N; i++) rr.push(Rand.range(rmin, rmax));
      for (i = 0; i < N; i++) {
        d.push(rr[i] + rr[(i + 1) % N]);
        if (d[i] > dMax) dMax = d[i];
      }

      // the circumradius: the central angles have to add up to one full turn
      function turn(rad) {
        var t = 0, q;
        for (q = 0; q < N; q++) t += 2 * Math.asin(clamp(d[q] / (2 * rad), -1, 1));
        return t;
      }
      var lo = dMax / 2 + 0.001, hi = dMax * 20;
      if (turn(lo) < PI2) return false;         // one gear too big for the rest
      for (i = 0; i < 50; i++) {
        var mid = (lo + hi) / 2;
        if (turn(mid) > PI2) lo = mid; else hi = mid;
      }
      var rad = (lo + hi) / 2;

      // the centres, on that circumcircle, at a random roll
      var a = Rand.range(0, PI2), g = [];
      for (i = 0; i < N; i++) {
        g.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad, r: rr[i], dir: (i % 2) ? 1 : -1 });
        a += 2 * Math.asin(clamp(d[i] / (2 * rad), -1, 1));
      }

      // non-neighbours must stay clear: a stray touch would be a false mesh
      for (i = 0; i < N; i++) {
        for (j = i + 2; j < N; j++) {
          if (i === 0 && j === N - 1) continue;             // they ARE neighbours
          var dx = g[i].x - g[j].x, dy = g[i].y - g[j].y;
          if (Math.sqrt(dx * dx + dy * dy) < g[i].r + g[j].r + 7) return false;
        }
      }

      // letterbox the ring into the band, uniformly — a ring is built out of
      // circles that have to stay tangent, so a squeezed axis would open a gap
      // at every mesh
      var top = bandTop();
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, m;
      for (i = 0; i < N; i++) {
        m = g[i].r * 1.15 + 5;
        x0 = Math.min(x0, g[i].x - m); x1 = Math.max(x1, g[i].x + m);
        y0 = Math.min(y0, g[i].y - m); y1 = Math.max(y1, g[i].y + m);
      }
      var sc = Math.min((Layout.right - Layout.left) / (x1 - x0),
                        (Layout.bottom - top) / (y1 - y0));
      var ox = Layout.cx - (x0 + x1) / 2 * sc;
      var oy = (top + Layout.bottom) / 2 - (y0 + y1) / 2 * sc;
      for (i = 0; i < N; i++) {
        g[i].x = g[i].x * sc + ox; g[i].y = g[i].y * sc + oy; g[i].r *= sc;
      }

      // the track: one arc per gear, from the mesh behind to the mesh ahead,
      // walked the way that gear turns
      var sg = [], cu = [], tot = 0, cur, prev, next, inA, outA, sweep;
      for (i = 0; i < N; i++) {
        cur = g[i]; prev = g[(i + N - 1) % N]; next = g[(i + 1) % N];
        inA = ang(cur, prev); outA = ang(cur, next);
        sweep = (cur.dir * (outA - inA)) % PI2;
        if (sweep < 0) sweep += PI2;
        cu.push(tot);
        sg.push({ g: cur, inA: inA, dir: cur.dir, sweep: sweep });
        tot += sweep * cur.r;
      }

      // commit, because the entry scan below needs posAt() live
      gears = g; seg = sg; cum = cu; total = tot;

      // the entry is the highest point of the track
      var p = {}, bestS = 0, bestY = 1e9, bestI = 0, s;
      for (s = 0; s < tot; s += 3) {
        posAt(s, p);
        if (p.y < bestY) { bestY = p.y; bestS = s; bestI = p.i; }
      }
      posAt(bestS, p);
      entryS = bestS; entry.x = p.x; entry.y = p.y;
      placeHopper();
      slotN = Math.max(10, Math.round(tot / R.pitch));
      pitch = tot / slotN;

      if (entry.y - hopperY < 130) return false;                   // no fall
      if (entry.x < Layout.left + 40 || entry.x > Layout.right - 40) return false;
      // the entry has to sit on the OUTER top of its own gear, not on an inner
      // arc tucked under that same cog's teeth
      if (p.y > g[bestI].y - g[bestI].r * 0.92) return false;
      // ...and the drop column has to be clear, or a ball falls through the
      // teeth of a gear it was never aimed at
      for (i = 0; i < N; i++) {
        if (i === bestI) continue;
        if (Math.abs(g[i].x - entry.x) < g[i].r * 1.15 + R.ballR + 4 &&
            g[i].y - g[i].r * 1.15 - 4 < entry.y) return false;
      }
      return true;
    }

    /* Grow circuits until one is legal. The knobs can describe an impossible
       ring, so the loop widens the spread rather than hanging. */
    function grow() {
      var tries = 0, rmin = R.rMin, rmax = R.rMax, i;
      while (tries < 900) {
        tries++;
        if (attempt(rmin, rmax)) break;
        if (tries % 300 === 0) { rmin *= 0.88; rmax *= 1.12; }
      }
      gearCv = {};
      occ = []; for (i = 0; i < slotN; i++) occ.push(null);
      filled = 0;
      initGears();
    }

    /* ===============================================================
       THE LIGHT ON THE MACHINE.

       Nothing here draws a cog because a cog exists: the ring is dark steel,
       and a cog only shows where a ball is actually riding it, as a crackling
       arc on its rim. It is the read of the walls in games/echomaze — a wall
       is on screen only for as long as the arc a pulse left on it takes to die
       out — turned into a progress bar: the shift opens on a dark loop and
       closes on a blazing one, so how much of the circuit is lit IS how much
       of it the player has already filled.
       =============================================================== */

    /* Every cog starts dark. `wait`/`pend` are a surge that has not reached
       this one yet, `col` the colour its arc is currently burning in — the
       machine's own cyan, or the red of a jam until that flash is spent. */
    function initGears() {
      var i, g;
      for (i = 0; i < gears.length; i++) {
        g = gears[i];
        g.lit = 0; g.hot = 0; g.wait = 0; g.pend = 0;
        g.col = R.slot; g.pendCol = R.slot;
        g.crackle = 0; g.seg = [];
        rollArc(g);
      }
    }
    function rollArc(g) {
      for (var i = 0; i < ZAP_SEGS; i++) g.seg[i] = Rand.range(-1, 1);
    }

    /* A CONTACT lights the cog it happened on, and — the way an echo in
       games/echomaze reads a whole face of a corridor rather than the stub
       that was struck — half-lights the two cogs meshed either side of it. A
       landing therefore reveals a length of the circuit, not one tooth. */
    function sparkGear(i, power, col) {
      var n = gears.length, k, g;
      if (!n) return;
      for (k = -1; k <= 1; k++) {
        g = gears[(i + k + n) % n];
        g.hot = Math.max(g.hot, k === 0 ? power : power * 0.55);
        g.col = col;
        rollArc(g);
      }
    }

    /* THE POWER COMING ON — every cog flashes in turn round the ring, one
       `surgeStep` apart. It spells the shape of the circuit out once as the
       shift opens, and once more, brighter, when the last slot closes it. */
    function surge(power, col) {
      for (var i = 0; i < gears.length; i++) {
        gears[i].wait = i * R.surgeStep + 0.001;
        gears[i].pend = power;
        gears[i].pendCol = col;
      }
    }

    /* The charge is recounted every frame from the balls actually on the
       track, so a cog carrying none falls dark on its own. It comes on fast
       and dies out slowly: a cog the last ball has just left still trails. */
    function updateArcs(dt) {
      var i, k, g, want;
      for (i = 0; i < gears.length; i++) charge[i] = 0;
      for (k = 0; k < slotN; k++) {
        if (!occ[k]) continue;
        posAt(k * pitch + spin, tmpArc);
        charge[tmpArc.i]++;
      }
      for (i = 0; i < gears.length; i++) {
        g = gears[i];
        if (g.wait > 0) {
          g.wait -= dt;
          if (g.wait <= 0) { g.hot = Math.max(g.hot, g.pend); g.col = g.pendCol; rollArc(g); }
        }
        want = charge[i] ? Math.min(1, 0.5 + 0.16 * charge[i]) : 0;
        g.lit += (want - g.lit) * Math.min(1, dt * (want > g.lit ? 14 : 2.6));
        if (g.hot > 0) {
          g.hot -= dt / R.zapFade;
          if (g.hot <= 0) { g.hot = 0; g.col = R.slot; }
        }
        g.crackle -= dt;
        if (g.crackle <= 0) { rollArc(g); g.crackle = 0.045; }
      }
    }
    function litness(g) { return clamp(g.lit + g.hot, 0, 1); }

    /* THE ARC ITSELF — the rim redrawn as a jittered polyline and stroked from
       a wide dim halo down to a white-hot core (shadowBlur is banned in
       frame), exactly the way games/echomaze draws a wall a pulse just hit.
       The jitter phase rides the cog's own rotation, so the crackle turns with
       the machine instead of sitting still on top of it, and the amplitude and
       the widths scale with the radius, or a 27 px pinion would disappear
       inside its own halo. Eight cogs, four passes, twenty-four segments: the
       whole electric layer is 32 strokes a frame. */
    var ZAP_PASSES = [[17, 0.10], [9, 0.22], [4, 0.5], [1.8, 1]];
    function drawArc(g, e) {
      var q, i, a, r, x, y;
      var ws = clamp(g.r / 90, 0.5, 1.25);
      var flash = Math.pow(e, 0.6);
      var amp = (2 + 5 * e) * ws;
      var rot = spin * g.dir / g.r;
      for (q = 0; q < ZAP_PASSES.length; q++) {
        ctx.beginPath();
        for (i = 0; i <= ZAP_SEGS; i++) {
          a = rot + i / ZAP_SEGS * PI2;
          r = g.r + g.seg[i % ZAP_SEGS] * amp;
          x = g.x + Math.cos(a) * r; y = g.y + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = rgba(q === ZAP_PASSES.length - 1 ? "#ffffff" : g.col,
                               ZAP_PASSES[q][1] * flash);
        ctx.lineWidth = ZAP_PASSES[q][0] * ws * (0.3 + 0.55 * e);
        ctx.stroke();
      }
    }

    /* ===============================================================
       SPRITES — the machine is a wireframe, rasterized once per radius.
       =============================================================== */

    function canvasOf(w, h) {
      var cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.ceil(w)); cv.height = Math.max(1, Math.ceil(h));
      return cv;
    }

    // One glowing stroke, painted as four passes instead of a shadowBlur.
    var HOT = [[12, 0.09], [6.5, 0.18], [3, 0.42], [1.35, 1]];
    function wire(c, path, weight, col, alpha) {
      for (var q = 0; q < HOT.length; q++) {
        c.beginPath(); path(c);
        c.lineWidth = HOT[q][0] * weight;
        c.strokeStyle = rgba(q === HOT.length - 1 ? "#ffffff" : col, HOT[q][1] * alpha);
        c.stroke();
      }
    }

    /* A cog: rim, teeth, hub and spokes. The tooth count follows the radius so
       every gear in the ring shares one pitch — which is why they can mesh. */
    function cogPath(c, r, tooth, teeth) {
      var i, a, st = PI2 / teeth, w1 = st * 0.24, w2 = st * 0.15;
      c.moveTo(r, 0); c.arc(0, 0, r, 0, PI2);
      for (i = 0; i < teeth; i++) {
        a = i * st;
        c.moveTo(Math.cos(a - w1) * r, Math.sin(a - w1) * r);
        c.lineTo(Math.cos(a - w2) * (r + tooth), Math.sin(a - w2) * (r + tooth));
        c.lineTo(Math.cos(a + w2) * (r + tooth), Math.sin(a + w2) * (r + tooth));
        c.lineTo(Math.cos(a + w1) * r, Math.sin(a + w1) * r);
      }
      var hb = Math.max(7, r * 0.22);
      c.moveTo(hb, 0); c.arc(0, 0, hb, 0, PI2);
      for (i = 0; i < 4; i++) {
        a = i * Math.PI / 2 + 0.4;
        c.moveTo(Math.cos(a) * hb, Math.sin(a) * hb);
        c.lineTo(Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.82);
      }
    }

    /* Two rasters per cog: the GHOST it sits at while nothing rides it, and
       the same cog LIT, in the machine's live cyan. render() crossfades one
       into the other, so a cog coming alive costs a second drawImage and not a
       per-frame redraw of forty teeth.

       Eight gears would be sixteen canvases if they were all different, so
       they are cached by rounded radius and a ring reuses what it repeats. */
    function gearSprite(r) {
      var key = Math.round(r);
      if (gearCv[key]) return gearCv[key];
      var teeth = Math.max(8, Math.round(key / 3.6));
      var tooth = key * 0.13, RR = key + tooth + 5, SS = 2;
      var path = function (x) { cogPath(x, key, tooth, teeth); };
      var cv = canvasOf(RR * 2 * SS, RR * 2 * SS), c = cv.getContext("2d");
      c.scale(SS, SS); c.translate(RR, RR);
      c.lineCap = "round"; c.lineJoin = "round";
      wire(c, path, 0.5, R.arc, 0.55);
      var hv = canvasOf(RR * 2 * SS, RR * 2 * SS), h = hv.getContext("2d");
      h.scale(SS, SS); h.translate(RR, RR);
      h.lineCap = "round"; h.lineJoin = "round";
      wire(h, path, 0.55, R.slot, 1);
      gearCv[key] = { cv: cv, hot: hv, sr: RR };
      return gearCv[key];
    }

    /* The backdrop: the painted gear hall (ASSETS.images.bg), cover-fit to the
       design canvas and then knocked well back. The machine on top of it is
       drawn in light and almost nothing else, so the art may only ever be the
       dark those arcs read against — never something that competes with them.
       Falls back to the cold gradient alone if the decode ever fails, so a
       bare frame is impossible.

       Game.render() owns the whole frame — the motor never clears the canvas
       for it — so the first thing every frame does is lay this down.
       Pre-rendered once per Layout rather than filled per frame: a full-screen
       image is one of the few things that still costs real time in a mobile
       WebView. */
    function buildBackdrop() {
      bgCv = canvasOf(view.w, view.h);
      var c = bgCv.getContext("2d"), img = Images.bg, sc, w, h;
      var g = c.createRadialGradient(view.w * 0.5, view.h * 0.26, 40,
                                     view.w * 0.5, view.h * 0.26, view.h * 0.86);
      g.addColorStop(0, "#241a48");
      g.addColorStop(0.52, "#120d28");
      g.addColorStop(1, "#05040e");
      c.fillStyle = g; c.fillRect(0, 0, view.w, view.h);
      if (img && img.width) {
        sc = Math.max(view.w / img.width, view.h / img.height);   // cover, never stretch
        w = img.width * sc; h = img.height * sc;
        c.drawImage(img, (view.w - w) / 2, (view.h - h) / 2, w, h);
        c.fillStyle = "rgba(5,4,14,.46)";                         // one stop under the dark
        c.fillRect(0, 0, view.w, view.h);
      }
      // the HUD and the CTA bar get their own darkened band to read over
      var band = c.createLinearGradient(0, 0, 0, view.h);
      band.addColorStop(0, "rgba(4,3,12,.86)");
      band.addColorStop(clamp(Layout.top / view.h, 0.02, 0.4), "rgba(4,3,12,0)");
      band.addColorStop(clamp(Layout.bottom / view.h, 0.6, 0.98), "rgba(4,3,12,0)");
      band.addColorStop(1, "rgba(4,3,12,.86)");
      c.fillStyle = band; c.fillRect(0, 0, view.w, view.h);
    }

    /* The glyph stamped into a special ball, drawn straight into its raster
       so it costs nothing per frame: a CROSS for the wild that cannot jam,
       two DOTS for the split that seats twice, a BOLT for the charge. */
    function ballMark(c, mark) {
      if (!mark) return;
      var r = ballR;
      c.lineCap = "round"; c.lineJoin = "round";
      c.strokeStyle = "rgba(255,255,255,.95)"; c.fillStyle = "rgba(255,255,255,.95)";
      c.lineWidth = r * 0.2;
      if (mark === 1) {
        c.beginPath();
        c.moveTo(-r * 0.36, 0); c.lineTo(r * 0.36, 0);
        c.moveTo(0, -r * 0.36); c.lineTo(0, r * 0.36);
        c.stroke();
      } else if (mark === 2) {
        c.beginPath(); c.arc(-r * 0.3, 0, r * 0.15, 0, PI2); c.fill();
        c.beginPath(); c.arc(r * 0.3, 0, r * 0.15, 0, PI2); c.fill();
      } else {
        c.beginPath();
        c.moveTo(r * 0.2, -r * 0.44); c.lineTo(-r * 0.22, r * 0.04);
        c.lineTo(r * 0.06, r * 0.04); c.lineTo(-r * 0.16, r * 0.46);
        c.stroke();
      }
    }

    /* One sphere and one glow per TYPE, in that type's colour. Four types at
       three times the design size is a dozen small rasters built once a round
       — the alternative, tinting per frame, is a per-ball gradient in the
       frame loop and that is exactly what this file never does. */
    function ballSprite(t) {
      var SS = 3, RR = ballR + 2;
      var cv = canvasOf(RR * 2 * SS, RR * 2 * SS), c = cv.getContext("2d");
      c.scale(SS, SS); c.translate(RR, RR);
      var g = c.createRadialGradient(-ballR * 0.3, -ballR * 0.34, ballR * 0.1, 0, 0, ballR);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.3, t.col);
      g.addColorStop(1, rgba(t.col, 0.4));
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, ballR, 0, PI2); c.fill();
      c.lineWidth = ballR * 0.18; c.strokeStyle = "rgba(255,255,255,.85)";
      c.beginPath(); c.arc(0, 0, ballR * 0.86, 0, PI2); c.stroke();
      ballMark(c, t.mark);

      var GR = ballR * 2.6;
      var gv = canvasOf(GR * 2, GR * 2), h = gv.getContext("2d");
      h.translate(GR, GR);
      g = h.createRadialGradient(0, 0, ballR * 0.5, 0, 0, GR);
      g.addColorStop(0, rgba(t.col, 0.45)); g.addColorStop(0.45, rgba(t.col, 0.14));
      g.addColorStop(1, rgba(t.col, 0));
      h.fillStyle = g; h.beginPath(); h.arc(0, 0, GR, 0, PI2); h.fill();
      return { cv: cv, glow: gv };
    }
    function buildBallSprites() {
      if (ballCv.plain && spriteR === ballR) return;
      spriteR = ballR;
      ballCv = {};
      for (var key in TYPES) {
        if (TYPES.hasOwnProperty(key)) ballCv[key] = ballSprite(TYPES[key]);
      }
    }
    // No type = stock: a ball already seated is drawn in the machine's orange
    // whatever put it there, so the ring stays one readable chain.
    function drawBall(x, y, s, type) {
      var sp = ballCv[type] || ballCv.plain;
      var gr = ballR * 2.6 * s, r = (ballR + 2) * s;
      ctx.drawImage(sp.glow, x - gr, y - gr, gr * 2, gr * 2);
      ctx.drawImage(sp.cv, x - r, y - r, r * 2, r * 2);
    }

    /* ===============================================================
       THE DROP — one closed form, read by both the ball and the verdict.
       =============================================================== */

    function fallTime() {
      return Math.sqrt(2 * Math.max(1, entry.y - hopperY) / R.gravity);
    }
    // Which slot sits at the entry once the machine has turned `at`.
    function slotAt(at) {
      var k = Math.round((entryS - at) / pitch) % slotN;
      return (k + slotN) % slotN;
    }
    /* How far the machine turns while the ball is in the air. In closed form,
       not by counting frames: the rim speed ramps at a constant R.accel/10 px/s
       per second, so over a fall of tf seconds it turns speed*tf + accel*tf²/20.
       A stepped fall would drift by up to a frame, which at this pitch is a
       fifth of a slot — enough to flip the verdict on a close call. */
    function spinAfterFall(tf) { return spin + speed * tf + R.accel * tf * tf / 20; }

    function release() {
      if (over > 0 || stall > 0 || gap > 0 || !magQ.length) return;
      var tf = fallTime(), type = magQ.shift();
      flying.push({ y: hopperY, t: 0, tf: tf, g: R.gravity,
                    landSpin: spinAfterFall(tf), type: type });
      gap = R.fireGap;
      slide = R.magSlide;
      slideN = magQ.length;              // who was in the queue when it moved up
      if (magT <= 0) magT = R.reload;
      // a special leaves the chute a note higher, so the ear knows before the eye
      Sound.clip("drop", 0.34, type === "plain" ? Rand.range(0.96, 1.06) : 1.22);
    }

    /* ===============================================================
       THE CHAIN — the reason a gap is worth more than another gap.
       =============================================================== */

    /* The unbroken run of filled slots that contains k, walked both ways round
       the ring. A circuit is twenty-odd slots, so this is cheaper than caching
       it would be — and it is always exact, which a cached count would not
       stay through a split, a wild rescue or a circuit reset. */
    function runLen(k) {
      var n = 1, i;
      for (i = 1; i < slotN; i++) { if (!occ[(k - i + slotN * 2) % slotN]) break; n++; }
      for (i = 1; i < slotN; i++) { if (!occ[(k + i) % slotN]) break; n++; }
      return Math.min(n, slotN);
    }
    // The free seat nearest k, searched outwards both ways. -1 on a full ring.
    function freeNear(k) {
      var i, a, b;
      if (!occ[k]) return k;
      for (i = 1; i <= slotN; i++) {
        a = (k + i) % slotN;              if (!occ[a]) return a;
        b = (k - i + slotN * 2) % slotN;  if (!occ[b]) return b;
      }
      return -1;
    }
    /* Where a SPLIT puts its second ball: a free slot beside the first, so the
       pair always lands welded. Given the choice it takes the side that closes
       a gap — the seat whose OWN far neighbour is filled — because that turns
       one tap into a splice. */
    function splitTarget(k) {
      var a = (k + 1) % slotN, b = (k - 1 + slotN) % slotN;
      var fa = !occ[a], fb = !occ[b];
      if (fa && fb) return occ[(a + 1) % slotN] ? a
                  : occ[(b - 1 + slotN) % slotN] ? b : a;
      if (fa) return a;
      if (fb) return b;
      return freeNear(k);
    }

    /* SEAT ONE BALL. Everything that puts a ball on the track comes through
       here — a plain drop, the second ball a split pulls in, a wild that had
       to hunt for a place — so the chain always pays the same way and the
       light always comes on the same way.

       `extra` is the ball's own bonus (a wild's rescue fee, a split's second
       slot, a charge's discharge) and `quiet` marks the passenger ball of a
       split: it scores, but it does not take a second combo step and does not
       get its own callout, or one tap would throw two of them. */
    function seat(k, type, extra, quiet) {
      var p = posAt(k * pitch + spin, {}), t = typeOf(type);
      var run, weld, splice, gain, style, word, sub_, at;

      // the neighbours BEFORE this ball goes down: two of them is a splice
      splice = !!(occ[(k + 1) % slotN] && occ[(k - 1 + slotN) % slotN]);
      occ[k] = { age: 0 }; filled++; landed++;
      sparkGear(p.i, 1, type && type !== "plain" ? t.col : R.slot);

      run = runLen(k);
      /* THE COMBO IS THE CHAIN. It climbs only while the player keeps WELDING,
         and a ball dropped in a hole that touches nothing starts it over at
         one — a jam is no longer the only way to lose the multiplier. This is
         what makes the seat a decision: taking whatever gap comes round is a
         real cost, not merely a smaller bonus, and it costs most early, when
         the ring is empty and isolated holes are everywhere. By the last third
         nearly every gap welds, so the discipline pays itself back as the
         circuit closes. */
      if (!quiet) combo = run > 1 ? Math.min(combo + 1, R.comboMax) : 1;
      if (run > bestRun) bestRun = run;

      weld = run > 1 ? R.weldScore * Math.min(run, R.weldMax) : 0;
      if (splice) weld = Math.round(weld * R.spliceBonus);
      weldTotal += weld;
      gain = R.landScore * combo + weld + (extra || 0);
      score += gain;
      HUD.setScore(score); HUD.punch(t.col);

      Sound.clip("good", 0.42, 0.9 + combo * 0.06);
      Fx.burst(p.x, p.y, { count: quiet ? 5 : 8, color: t.col, speed: 190 });
      Fx.ring(p.x, p.y, { from: ballR, to: weld ? 84 : 66,
                          color: weld ? R.ball : R.slot, width: 3, life: 0.26 });

      if (!quiet) {
        style = "score"; word = "+" + gain;
        sub_ = combo > 1 ? "x" + combo : ""; at = { x: p.x, y: p.y - 54 };
        if (splice)        { style = "bonus";  word = "SPLICE";        sub_ = "+" + gain; at = "bottom"; }
        else if (run >= 4) { style = "combo";  word = "WELD x" + run;  sub_ = "+" + gain; at = "bottom"; }
        else if (combo >= 6) { style = "streak"; at = "bottom"; }
        Pop.show(style, { word: word, sub: sub_, at: at });
        /* The chain is the one thing the opening toast cannot teach, because
           it needs a ball already on the track to point at. So it is taught by
           the first weld the player actually makes, and never again. */
        if (weld && warnWeld) {
          warnWeld = false;
          Overlay.toast(CONFIG.copy.hintWeld, { color: R.ball, dur: 1800 });
        }
      }
      if (combo === 4 || combo === 7 || combo === R.comboMax) {
        Sound.clip("chain", 0.4, 1 + combo * 0.03);
      }
      return run;
    }

    /* A CHARGE cashes in the run it joined: the whole chain flashes slot by
       slot from the ball outwards, and every ball in it pays. It is the reason
       to hold a special instead of spending it on the next gap. */
    function discharge(k, run) {
      var i, q = {}, kk;
      for (i = 0; i < run; i++) {
        kk = (k + i) % slotN;
        if (!occ[kk]) break;
        posAt(kk * pitch + spin, q);
        Fx.burst(q.x, q.y, { count: 4, color: R.charge, speed: 150 });
      }
      for (i = 1; i < run; i++) {
        kk = (k - i + slotN * 2) % slotN;
        if (!occ[kk]) break;
        posAt(kk * pitch + spin, q);
        Fx.burst(q.x, q.y, { count: 4, color: R.charge, speed: 150 });
      }
      Sound.clip("ship", 0.42, 1.18);
      Fx.flash(R.charge, 0.18);
    }

    function land(at, type) {
      var k = slotAt(at), p = posAt(k * pitch + spin, {}), j, run;
      type = type || "plain";

      if (occ[k]) {                                   // the slot was taken
        /* A WILD NEVER JAMS. It bounces off the ball it found and rolls on to
           the nearest free seat, so the one ball the player cannot misplace is
           also the one worth saving for a nearly closed ring. Nothing else in
           the game forgives a bad read, which is what makes it worth holding. */
        if (type === "wild") {
          j = freeNear(k);
          if (j >= 0) {
            Fx.ring(p.x, p.y, { from: ballR, to: 96, color: R.wild, width: 4, life: 0.3 });
            Sound.clip("chain", 0.45, 1.3);
            run = seat(j, "wild", R.wildScore);
            Pop.show("bonus", { word: "WILD SAVE", sub: "+" + R.wildScore, at: "bottom" });
            after();
            return;
          }
        }
        /* The wreck jams the chute: the hopper stays shut until it is cleared,
           however many balls are loaded. That stall, and the combo it wipes,
           are what a jam really costs — the life is only the backstop. */
        jams++; combo = 0; stall = R.jamClear;
        sparkGear(p.i, 1, R.danger);                  // the arc goes red there
        Sound.clip("bad", 0.5);
        Fx.shake(14, 0.3); Fx.flash("#ff3d6e", 0.3); Fx.freeze(0.06);
        Fx.burst(p.x, p.y, { count: 22, color: "#ff3d6e", speed: 340, grav: 500 });
        Fx.ring(p.x, p.y, { from: ballR, to: 120, color: "#ff3d6e", width: 5, life: 0.34 });
        Pop.show("danger", { word: "JAM", at: "bottom" });
        lives--;
        showLives();
        if (lives <= 0) { Overlay.vignette("#ff3d6e", 0.9); finish("jam"); }
        else if (lives === 1) Overlay.vignette("#ff3d6e", 0.5);
        return;
      }

      // the free seat: the ball goes down, then whatever its type adds to it
      run = seat(k, type, type === "wild" ? R.wildScore : 0);

      if (type === "split") {
        j = splitTarget(k);
        if (j >= 0 && !occ[j]) {
          run = seat(j, "split", R.splitScore, true);
          Pop.show("bonus", { word: "SPLIT", sub: "+" + R.splitScore, at: "bottom" });
        }
      } else if (type === "charge") {
        score += R.chargeScore * Math.min(run, R.weldMax);
        HUD.setScore(score);
        discharge(k, run);
        Pop.show("ultra", { word: "CHARGE x" + run,
                            sub: "+" + R.chargeScore * Math.min(run, R.weldMax),
                            at: "bottom" });
      }
      after();
    }

    // What every landing ends with: the ring may now be closed, or one callout
    // short of it. Both a plain seat and a split's pair come through here once.
    function after() {
      if (filled >= slotN) complete();
      else if (slotN - filled <= 3 && warnLeft) {
        /* A status line, not a celebration — so it goes through Overlay and
           not through Pop, which is already showing the callout for the ball
           that just landed. Two Pops on one frame stack on top of each other. */
        warnLeft = false;
        Overlay.toast((slotN - filled) + " SLOTS LEFT", { color: R.slot, dur: 1600 });
      }
    }

    /* THE WIN. A ring filled to the last slot ends the shift: every ball blows
       off the track, the stage bonus is banked and the end screen follows one
       beat later, while the dust is still falling. */
    function complete() {
      circuits++;
      stageBonus = R.circuitScore + R.clearBonus
                 + Math.round(Math.max(0, Round.left())) * R.timeBonus;
      score += stageBonus;
      HUD.setScore(score); HUD.punch(R.slot);
      over = R.outro;
      surge(1, R.slot);                // the loop closed: it lights end to end
      Sound.clip("ship", 0.6);
      Fx.shake(9, 0.4); Fx.flash(R.slot, 0.34);
      Overlay.vignette(R.slot, 0.7);
      Confetti.burst(70);
      Pop.show("manifest", { word: "CIRCUIT FULL", sub: "+" + stageBonus, at: "center" });
      var k, p = {};
      for (k = 0; k < slotN; k++) {
        if (!occ[k]) continue;
        posAt(k * pitch + spin, p);
        Fx.burst(p.x, p.y, { count: 5, color: R.ball, speed: 300, grav: 700 });
      }
      for (k = 0; k < slotN; k++) occ[k] = null;
      filled = 0;
      flying.length = 0;             // nothing lands after the circuit is closed
    }

    /* What the hopper loads next. Stock, unless the special clock has come
       round — then one of the three, and the clock is reset with a jitter so
       the rhythm is felt rather than counted. The clock runs on play time, not
       on refills, or a player who never fires would bank a magazine of them. */
    function nextBall() {
      var S = R.special;
      if (specT > 0) return "plain";
      specT = S.every + Rand.range(-S.jitter, S.jitter);
      Sound.clip("chain", 0.24, 0.7);        // something good just dropped in
      /* THE WILD ARRIVES WHEN IT IS THE ANSWER. Drawn evenly it is the one
         special a player barely ever sees pay off, because its rescue only
         fires on a drop that would have jammed — and those are rare until the
         two moments where they stop being the player's fault: a ring with four
         slots left, where the gaps no longer come round often enough, and a
         shift down to its last lives. Both are exactly where the bench found a
         jam is unavoidable rather than careless, so that is where the machine
         hands out insurance. Everywhere else the three are drawn evenly. */
      if ((lives <= 2 || slotN - filled <= 4) && Rand.chance(S.wildWhenStuck)) return "wild";
      return Rand.pick(S.kinds);
    }

    function showLives() {
      var s = "", i;
      for (i = 0; i < R.lives; i++) s += i < lives ? "●" : "○";
      HUD.setLeft(s, "LIVES", lives <= 1 ? "warn" : "");
    }

    function finish(reason) {
      if (ended) return;                             // a jam and the clock can race
      ended = true;
      var cleared = reason === "clear";
      // Filling the ring IS the perfect run: it is three stars whatever the
      // clock said. A shift that ran out is graded on score alone.
      var st = cleared ? 3
             : score >= R.star3 ? 3 : score >= R.star2 ? 2 : score > 0 ? 1 : 0;
      var rows = [
        { label: "BALLS SET", value: landed },
        { label: "LONGEST CHAIN", value: bestRun, grade: "accent" },
        { label: "WELD BONUS", value: weldTotal, grade: "accent" }
      ];
      // a cleared ring is the story of the shift; the jam count is only news
      // when the shift is what the jams ended
      if (!cleared) rows.push({ label: "JAMS", value: jams });
      // a number, so the end screen counts it up like the score itself
      if (cleared) rows.push({ label: "STAGE BONUS", value: stageBonus, grade: "accent" });
      rows.push({ label: "BEST SCORE", value: Math.max(score, best), grade: "gold" });
      endRound({
        title: cleared ? CONFIG.copy.cleared
             : reason === "jam" ? CONFIG.copy.gameOver : CONFIG.copy.timeUp,
        variant: cleared || st === 3 ? "perfect" : st === 2 ? "win" : "",
        score: score,
        stars: st,
        rows: rows
      });
    }

    /* ===============================================================
       THE MOTOR CONTRACT
       =============================================================== */

    function reset() {
      score = 0; combo = 0; landed = 0; jams = 0; circuits = 0;
      bestRun = 0; weldTotal = 0; warnLeft = true; warnWeld = true;
      stageBonus = 0; ended = false;
      lives = R.lives; best = Store.get("bestScore", 0);
      speed = R.speed; spin = 0; over = 0; stall = 0; gap = 0;
      // the shift opens on three rounds of plain stock: the first lesson is
      // the lead, and a special in the opening beat would bury it
      magQ = []; while (magQ.length < R.magSize) magQ.push("plain");
      specT = R.special.firstAt;
      magT = 0; slide = 0; slideN = 0; flying = [];
      ballR = R.ballR;
      buildBackdrop();
      buildBallSprites();
      grow();
      surge(0.85, R.slot);            // the shape of the loop, spelled out once
      HUD.setScoreNow(0);
      showLives();
      Overlay.toast(CONFIG.copy.hint, { color: R.slot, dur: 1900 });
    }

    function update(dt) {
      var i, b, done;

      // the victory lap: the machine keeps turning under the confetti, the
      // hopper is shut, and the end screen takes over when the dust settles
      if (over > 0) {
        over -= dt;
        spin += speed * dt;
        updateArcs(dt);
        if (over <= 0) finish("clear");
        return;
      }

      speed = R.speed + R.accel * Round.elapsed() / 10;
      spin += speed * dt;
      if (stall > 0) stall -= dt;
      if (gap > 0) gap -= dt;
      if (slide > 0) slide -= dt;

      if (specT > 0) specT -= dt;

      // the hopper refills on its own beat, one ball at a time, even mid-fall
      if (magQ.length < R.magSize) {
        magT -= dt;
        while (magT <= 0 && magQ.length < R.magSize) {
          magQ.push(nextBall());
          magT = magQ.length < R.magSize ? magT + R.reload : 0;
        }
      }

      // analytic free fall: the visual and the verdict share one clock. Balls
      // are fired in order and fall the same height, so the oldest lands first
      // and the array stays sorted — land from the front while it is due.
      for (i = 0; i < flying.length; i++) {
        b = flying[i];
        b.t += dt;
        b.y = Math.min(entry.y, hopperY + 0.5 * b.g * b.t * b.t);
      }
      while (!ended && over <= 0 && flying.length && flying[0].t >= flying[0].tf) {
        done = flying.shift();
        land(done.landSpin, done.type);
      }

      for (i = 0; i < slotN; i++) if (occ[i]) occ[i].age += dt;
      updateArcs(dt);
    }

    var tmp = {};
    function render() {
      var i, k, g, sp, s, a, e;

      ctx.drawImage(bgCv, 0, 0);

      /* The machine turns under everything else, and it is DARK: a cog sits at
         `ghost` alpha, a hint of steel against the painted hall, until a ball
         rides it. Then the lit raster fades in over the ghost and the rim
         crackles — see drawArc(). The arcs are a second pass so they overlay
         every cog, including the neighbour a big one overlaps. */
      for (i = 0; i < gears.length; i++) {
        g = gears[i]; sp = gearSprite(g.r);
        e = litness(g);
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(spin * g.dir / g.r);
        ctx.globalAlpha = R.ghost + (1 - R.ghost) * 0.3 * e;
        ctx.drawImage(sp.cv, -sp.sr, -sp.sr, sp.sr * 2, sp.sr * 2);
        if (e > 0.02) {
          ctx.globalAlpha = e * 0.9;
          ctx.drawImage(sp.hot, -sp.sr, -sp.sr, sp.sr * 2, sp.sr * 2);
        }
        ctx.restore();
      }
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (i = 0; i < gears.length; i++) {
        g = gears[i];
        e = litness(g);
        if (e > 0.02) drawArc(g, e);
      }

      // the entry: a funnel, and the line the ball will fall down
      ctx.lineCap = "round";
      ctx.lineWidth = 3; ctx.strokeStyle = rgba(R.slot, 0.5);
      ctx.beginPath();
      ctx.moveTo(entry.x - 34, entry.y - 58); ctx.lineTo(entry.x - 15, entry.y - 26);
      ctx.moveTo(entry.x + 34, entry.y - 58); ctx.lineTo(entry.x + 15, entry.y - 26);
      ctx.stroke();
      /* The drop line is tinted by the ball at the head of the magazine, so
         the column the player is aiming down already says what is coming. */
      var headCol = magQ.length ? typeOf(magQ[0]).col : R.slot;
      ctx.setLineDash([5, 13]); ctx.lineWidth = 2;
      ctx.strokeStyle = rgba(headCol, magQ.length && magQ[0] !== "plain" ? 0.45 : 0.16);
      ctx.beginPath();
      ctx.moveTo(entry.x, hopperY + 18); ctx.lineTo(entry.x, entry.y - 26);
      ctx.stroke();
      ctx.setLineDash([]);

      /* THE CHAIN, drawn before the balls themselves: wherever two filled
         slots are neighbours the track between them is WELDED, and the weld is
         a bar laid along the rim. A run therefore reads as one lit girder
         instead of beads that happen to touch — which is the whole point,
         because the bar is exactly what the weld bonus pays for and exactly
         what the player picks their next seat against. Four samples an arc is
         enough: a pitch never spans more than a few degrees of a cog. */
      var q = {};
      ctx.lineCap = "round";
      for (k = 0; k < slotN; k++) {
        if (!occ[k] || !occ[(k + 1) % slotN]) continue;
        ctx.beginPath();
        for (i = 0; i <= 4; i++) {
          posAt((k + i / 4) * pitch + spin, q);
          if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
        }
        ctx.strokeStyle = rgba(R.ball, 0.28); ctx.lineWidth = 11; ctx.stroke();
        ctx.strokeStyle = rgba(R.ball, 0.7);  ctx.lineWidth = 5;  ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.6; ctx.stroke();
      }

      // the slot chain: a hollow seat when free, a ball when taken. The free
      // ones breathe once the ring is nearly full — that is the last-slot hunt.
      var few = slotN - filled <= 6 && filled > 0;
      var pulse = 0.66 + (few ? 0.34 * Math.sin(Round.elapsed() * 7) : 0);
      ctx.lineWidth = 2.6;
      for (k = 0; k < slotN; k++) {
        posAt(k * pitch + spin, tmp);
        if (occ[k]) {
          a = occ[k].age;
          s = a < 0.18 ? 1 + 0.7 * (1 - a / 0.18) : 1;
          drawBall(tmp.x, tmp.y, s);
        } else {
          ctx.beginPath(); ctx.arc(tmp.x, tmp.y, ballR * 0.62, 0, PI2);
          ctx.fillStyle = "rgba(6,8,18,.9)"; ctx.fill();
          ctx.strokeStyle = rgba(R.slot, pulse); ctx.stroke();
        }
      }

      // the hopper, its pending ball, and the one in the air
      ctx.lineJoin = "round";
      wire(ctx, function (c) {
        c.moveTo(entry.x - 62, hopperY - 30); c.lineTo(entry.x - 62, hopperY + 4);
        c.lineTo(entry.x - 15, hopperY + 26);
        c.moveTo(entry.x + 62, hopperY - 30); c.lineTo(entry.x + 62, hopperY + 4);
        c.lineTo(entry.x + 15, hopperY + 26);
      }, 0.6, R.arc, 1.1);

      /* The magazine IS the ammo gauge: a loaded rank is a ball, a spent one
         the hollow it will refill into. The head sits on the drop line, and for
         `magSlide` after a drop the ones behind it are drawn between the seat
         they left and the seat they take — the queue visibly shuffles up. It
         dims while a jam is being cleared, the only time a loaded ball
         will not go. */
      if (over <= 0) {
        var bob = Math.sin(Round.elapsed() * 4) * 2, n = magQ.length, to, from;
        var u = slide > 0 ? 1 - slide / R.magSlide : 1;
        u = u * u * (3 - 2 * u);                       // ease the shuffle
        if (stall > 0) ctx.globalAlpha = 0.35;
        ctx.lineWidth = 2.6;
        for (i = n; i < R.magSize; i++) {              // the seats still to refill
          ctx.beginPath(); ctx.arc(seatX(magAdd[i]), hopperY - 2, ballR * 0.62, 0, PI2);
          ctx.fillStyle = "rgba(6,8,18,.9)"; ctx.fill();
          ctx.strokeStyle = rgba(R.ball, 0.35); ctx.stroke();
        }
        /* The loaded balls, HEAD FIRST — rank j hangs in seat magAdd[j], and
           for `magSlide` after a drop it is drawn between the seat it held one
           rank back and the seat it now takes, so the queue visibly moves up
           and a ball keeps its type across the shuffle. A ball the refill just
           dropped in (rank >= slideN) has no seat to come from: it appears. */
        for (i = 0; i < n; i++) {
          to = seatX(magAdd[i]);
          from = (u >= 1 || i >= slideN) ? to : seatX(magAdd[i + 1]);
          drawBall(from + (to - from) * u, hopperY - 2 + bob, 1, magQ[i]);
        }
        ctx.globalAlpha = 1;
      }
      for (i = 0; i < flying.length; i++) drawBall(entry.x, flying[i].y, 1, flying[i].type);
    }

    function onDown() { release(); }
    function onTimeUp() { if (over <= 0) finish("time"); }
    // A resize repacks the ring; the shift keeps the slots it had already won.
    function onResize() {
      var keep = filled, i;
      ballR = R.ballR;
      buildBackdrop();
      buildBallSprites();
      grow();
      for (i = 0; i < keep && i < slotN; i++) { occ[i] = { age: 1 }; filled++; }
      placeHopper();
    }

    return { reset: reset, update: update, render: render,
             onDown: onDown, onTimeUp: onTimeUp, onResize: onResize };
  })();
  /* ===================================================================
     7. BOOTSTRAP — wiring. Rarely edited.
     =================================================================== */
  function frameUpdate(dt) {
    Beat.update(dt);                                // music does not hit-stop
    if (Fx.frozen(dt)) { Fx.update(dt); return; }   // hit-stop: only fx advance
    Round.tick(dt);
    if (State !== "playing") return;                // a game may have ended us
    Game.update(dt);
    Fx.update(dt);
    HUD.tick(dt);
  }
  function frameRender() {
    Fx.begin();      // shake transform
    Game.render();   // the world
    Fx.render();     // particles / rings / floating text above it
    Fx.end();
    Fx.post();       // full-frame flash, unshaken
    Perf.frame();    // no-op unless the URL carries ?perf=1
  }

  function startGame() {
    Sound.unlock();                       // must run inside a user gesture (iOS)
    Music.start();                        // no-op without ASSETS.sounds.music
    Music.unduck();                       // back to full bed after an end screen
    Fx.reset(); Overlay.clear(); Confetti.clear();
    Beat.reset();                         // musical clock, before the game reads it
    Game.reset();
    Round.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(frameUpdate, frameRender);
  }

  /* Desktop convenience — the creative must be playable without a touchscreen.
     SPACE mirrors a screen tap: it starts the round from the intro, replays from
     the end screen (once the replay link is out), and during play it is
     forwarded to the game as a tap at the centre of the play area. That only
     makes sense for a one-touch mechanic, so it is enabled for the "tap" and
     "hold" demos.
     LEFT / RIGHT (or A / D) mirror a lateral flick for a "swipe" game: the
     engine synthesizes the whole down/move/up gesture through Input.swipe, so
     the game reads the keyboard through the very same code path as a finger.
     CONFIG.keyboard = false opts out of both. */
  function spaceIsATap() {
    if (CONFIG.keyboard === false) return false;
    var demo = CONFIG.intro.demo || "tap";
    return demo === "tap" || demo === "hold";
  }
  function arrowsAreASwipe() {
    if (CONFIG.keyboard === false) return false;
    return (CONFIG.intro.demo || "tap") === "swipe";
  }
  function bindKeys() {
    var held = false;                    // ignore the auto-repeat of a held key
    function isSpace(e) { return e.code === "Space" || e.key === " " || e.keyCode === 32; }
    function arrowDir(e) {
      if (e.code === "ArrowLeft"  || e.key === "ArrowLeft"  || e.key === "a" || e.key === "A" || e.keyCode === 37) return -1;
      if (e.code === "ArrowRight" || e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.keyCode === 39) return 1;
      return 0;
    }
    window.addEventListener("keydown", function (e) {
      var dir = arrowsAreASwipe() ? arrowDir(e) : 0;
      if (dir && State === "playing") {
        e.preventDefault();              // no page scroll
        if (!e.repeat) Input.swipe(dir); // one flick per press, never auto-repeat
        return;
      }
      if (!isSpace(e)) return;
      e.preventDefault();                // no page scroll, no button re-click
      if (e.repeat || held) return;
      if (State === "intro") { startGame(); return; }
      if (State === "end") {
        if ($("btn-replay").classList.contains("show")) startGame();
        return;
      }
      if (State !== "playing" || !spaceIsATap()) return;
      held = true;
      Input.at("down", Layout.cx, Layout.cy);
    });
    window.addEventListener("keyup", function (e) {
      if (!isSpace(e) || !held) return;
      held = false;
      Input.at("up", Layout.cx, Layout.cy);
    });
  }

  function init() {
    buildIntro();
    cssVar("--hud-h", CONFIG.layout.hudHeight + "px");
    cssVar("--cta-h", CONFIG.layout.ctaHeight + "px");
    fitCanvas();

    // Route pointer input to the game only while it is playing.
    Input.on("down", function (p) { if (State === "playing" && Game.onDown) Game.onDown(p); });
    Input.on("move", function (p) { if (State === "playing" && Game.onMove) Game.onMove(p); });
    Input.on("up",   function (p) { if (State === "playing" && Game.onUp)   Game.onUp(p); });

    bindKeys();

    $("btn-start").addEventListener("click", startGame);
    $("btn-replay").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);

    Ad.watchVisibility();
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Pop.prewarm();          // pay the callouts' first-raster cost off-gameplay
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

})();
</script>
</body>
</html>
