<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rhythm Tap</title>

<!-- =====================================================================
     STYLES  (vanilla CSS, inlined)
     ===================================================================== -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0714;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    transition: opacity .25s ease; z-index: 10;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .title { font-size: clamp(22px, 7vw, 44px); font-weight: 800; letter-spacing: .5px; }
  .subtitle { margin-top: 10px; font-size: clamp(14px, 4vw, 20px); opacity: .85; }

  .btn {
    margin-top: 22px; padding: 16px 34px; border: none; border-radius: 999px;
    font-size: clamp(16px, 5vw, 22px); font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #ff6ec7, #b5179e);
    box-shadow: 0 8px 24px rgba(181,23,158,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .btn:active { transform: scale(.96); }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  #cta-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 12px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px);
  }
  #cta-bar.hidden { display: none; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    display: flex; justify-content: space-between; padding: 14px 18px;
    color: #fff; font-weight: 800; font-size: clamp(15px, 4.5vw, 22px);
    pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  #hud.hidden { display: none; }

  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- =====================================================================
     MARKUP
     ===================================================================== -->
<div id="stage">
  <canvas id="game"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="hud-left">Score: <span id="score">0</span></div>
  <div id="hud-right">Time: <span id="time">0</span></div>
</div>

<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <div class="subtitle" style="margin-top:18px">Loading…</div>
</div>

<div id="screen-intro" class="screen hidden">
  <div class="title">Rhythm Tap</div>
  <div class="subtitle">Tap the instant a note hits the glowing line.</div>
  <button class="btn" id="btn-start">TAP TO PLAY</button>
</div>

<div id="screen-end" class="screen hidden">
  <div class="title" id="end-title">Great set!</div>
  <div class="subtitle" id="end-subtitle">You scored <span id="end-score">0</span></div>
  <button class="btn" id="btn-install">PLAY THE FULL GAME</button>
</div>

<div id="cta-bar" class="hidden">
  <button class="btn" id="btn-cta" style="margin-top:0; padding:12px 28px;">INSTALL NOW</button>
</div>

<!-- =====================================================================
     SCRIPT  (vanilla JS, inlined) — 7-section structure
     ===================================================================== -->
<script>
"use strict";
(function () {

  /* ===================================================================
     1. CONFIG
     =================================================================== */
  var CONFIG = {
    title: "Rhythm Tap",
    gameSeconds: 30,
    storeUrl: {
      ios:     "https://apps.apple.com/app/idXXXXXXXXX",
      android: "https://play.google.com/store/apps/details?id=com.example.game",
      fallback:"https://52-entertainment.com/our-games/"
    },
    designWidth: 720,
    designHeight: 1280,
    bg: "#0a0714"
  };

  /* ===================================================================
     2. ASSETS
     =================================================================== */
  var ASSETS = { images: {}, sounds: {} };

  /* ===================================================================
     3. ENGINE
     =================================================================== */
  function $(id) { return document.getElementById(id); }

  var canvas = $("game");
  var ctx = canvas.getContext("2d");
  var view = { w: CONFIG.designWidth, h: CONFIG.designHeight, scale: 1 };

  function fitCanvas() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var scale = Math.min(vw / view.w, vh / view.h);
    view.scale = scale;
    canvas.width  = Math.round(view.w * dpr);
    canvas.height = Math.round(view.h * dpr);
    canvas.style.width  = Math.round(view.w * scale) + "px";
    canvas.style.height = Math.round(view.h * scale) + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", fitCanvas);

  var Input = (function () {
    var listeners = { down: [], move: [], up: [] };
    function toDesign(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return {
        x: (clientX - r.left) / r.width  * view.w,
        y: (clientY - r.top)  / r.height * view.h
      };
    }
    function emit(type, e) {
      var t = e.touches && e.touches[0] ? e.touches[0]
            : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
      var p = toDesign(t.clientX, t.clientY);
      listeners[type].forEach(function (fn) { fn(p, e); });
    }
    canvas.addEventListener("mousedown",  function (e){ emit("down", e); });
    canvas.addEventListener("mousemove",  function (e){ emit("move", e); });
    window.addEventListener("mouseup",    function (e){ emit("up",   e); });
    canvas.addEventListener("touchstart", function (e){ e.preventDefault(); emit("down", e); }, {passive:false});
    canvas.addEventListener("touchmove",  function (e){ e.preventDefault(); emit("move", e); }, {passive:false});
    canvas.addEventListener("touchend",   function (e){ e.preventDefault(); emit("up",   e); }, {passive:false});
    return {
      on: function (type, fn) { listeners[type].push(fn); },
      off: function () { listeners = { down: [], move: [], up: [] }; }
    };
  })();

  var Loop = (function () {
    var running = false, last = 0, update = null, render = null;
    function frame(now) {
      if (!running) return;
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (update) update(dt);
      if (render) render();
      requestAnimationFrame(frame);
    }
    return {
      start: function (u, r) {
        update = u; render = r; running = true; last = performance.now();
        requestAnimationFrame(frame);
      },
      stop: function () { running = false; }
    };
  })();

  var Sound = (function () {
    var actx = null;
    function ensure() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === "suspended") actx.resume();
      return actx;
    }
    function beep(freq, dur, type) {
      var a = ensure(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq || 440;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (dur || 0.15));
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + (dur || 0.15));
    }
    var clips = {};
    function clip(name) {
      if (!ASSETS.sounds[name]) return;
      if (!clips[name]) { clips[name] = new Audio(ASSETS.sounds[name]); }
      try { clips[name].currentTime = 0; clips[name].play(); } catch (e) {}
    }
    return { unlock: ensure, beep: beep, clip: clip };
  })();

  var Store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var Rand = {
    range: function (min, max) { return min + Math.random() * (max - min); },
    int:   function (min, max) { return Math.floor(Rand.range(min, max + 1)); },
    pick:  function (arr)      { return arr[Math.floor(Math.random() * arr.length)]; }
  };

  var Images = {};
  function preloadImages(done) {
    var keys = Object.keys(ASSETS.images), left = keys.length;
    if (left === 0) return done();
    keys.forEach(function (k) {
      var img = new Image();
      img.onload = img.onerror = function () { if (--left === 0) done(); };
      img.src = ASSETS.images[k];
      Images[k] = img;
    });
  }

  /* ===================================================================
     4. AD NETWORK GLUE
     =================================================================== */
  var Ad = (function () {
    function platform() {
      var ua = navigator.userAgent || "";
      if (/iPad|iPhone|iPod/.test(ua)) return "ios";
      if (/android/i.test(ua)) return "android";
      return "fallback";
    }
    function targetUrl() { return CONFIG.storeUrl[platform()] || CONFIG.storeUrl.fallback; }
    function whenReady(cb) {
      if (!window.mraid) return cb();
      if (mraid.getState && mraid.getState() === "loading") {
        mraid.addEventListener("ready", cb);
      } else { cb(); }
    }
    function openStore() {
      track("cta_click");
      var url = targetUrl();
      try { if (window.mraid && typeof mraid.open === "function") { mraid.open(url); return; } } catch (e) {}
      try { if (typeof window.install === "function") { window.install(); return; } } catch (e) {}
      try { if (window.ExitApi && typeof ExitApi.exit === "function") { ExitApi.exit(); return; } } catch (e) {}
      try { if (typeof window.mintegral_playable_exit === "function") { window.mintegral_playable_exit(); return; } } catch (e) {}
      window.open(url, "_blank");
    }
    function track(event, data) {
      try { console.log("[playable]", event, data || ""); } catch (e) {}
    }
    return { whenReady: whenReady, openStore: openStore, track: track };
  })();

  /* ===================================================================
     5. STATE MACHINE
     =================================================================== */
  var UI = {
    show: function (name) {
      ["loading", "intro", "end"].forEach(function (s) {
        $("screen-" + s).classList.toggle("hidden", s !== name);
      });
      $("hud").classList.toggle("hidden", name !== "playing");
      $("cta-bar").classList.toggle("hidden", name !== "playing");
    },
    setScore: function (v) { $("score").textContent = v; },
    setTime:  function (v) { $("time").textContent = v; },
    setEnd:   function (title, score) { $("end-title").textContent = title; $("end-score").textContent = score; }
  };

  var State = "loading";
  function setState(s) { State = s; Ad.track("state", s); UI.show(s === "playing" ? "playing" : s); }

  /* ===================================================================
     6. GAME — Rhythm Tap
     Notes fall down a single lane toward a fixed hit line. Tap when a note
     crosses the line: a small offset is a PERFECT, a larger one is GOOD,
     and missing the window (or letting a note pass) breaks your combo.
     Combo multiplies the score; tempo speeds up as the track plays.
     =================================================================== */
  var Game = (function () {
    var score, timeLeft, notes, combo, bestCombo, spawnTimer, spawnGap,
        fall, banner, ringPulse, elapsed;

    var LANE_X = view.w / 2;
    var LANE_W = 220;
    var HIT_Y = view.h - 320;          // the judgment line (well above the CTA bar)
    var NOTE_R = 46;
    var PERFECT_WIN = 34;              // px distance from the line for a PERFECT
    var GOOD_WIN = 78;                 // px distance for a GOOD
    var PITCHES = [523, 587, 659, 784, 880];

    function reset() {
      score = 0; timeLeft = CONFIG.gameSeconds; elapsed = 0;
      notes = []; combo = 0; bestCombo = 0;
      spawnGap = 0.82; spawnTimer = 0.4; fall = 620;
      banner = null; ringPulse = 0;
      UI.setScore(0); UI.setTime(Math.ceil(timeLeft));
    }

    function spawn() {
      notes.push({ y: -NOTE_R, pitch: Rand.pick(PITCHES),
                   hue: Rand.int(280, 330), judged: false });
    }

    function say(text, color) { banner = { text: text, color: color, t: 0 }; }

    function onDown() {
      // Judge the lowest un-judged note nearest the line.
      var best = null, bestDist = Infinity;
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.judged) continue;
        var d = Math.abs(n.y - HIT_Y);
        if (d < bestDist) { bestDist = d; best = n; }
      }
      if (!best || bestDist > GOOD_WIN) {
        // Tapped with nothing on the line — small combo break, no crash.
        combo = 0;
        Sound.beep(160, 0.08, "square");
        return;
      }
      best.judged = true;
      ringPulse = 1;
      if (bestDist <= PERFECT_WIN) {
        combo++;
        var mult = 1 + Math.floor(combo / 5);
        score += 100 * mult;
        say(combo >= 5 ? "PERFECT x" + mult : "PERFECT!", "#ff6ec7");
        Sound.beep(best.pitch, 0.14, "triangle");
      } else {
        combo++;
        score += 40;
        say("GOOD", "#8bd3ff");
        Sound.beep(best.pitch * 0.75, 0.12, "sine");
      }
      if (combo > bestCombo) bestCombo = combo;
      UI.setScore(score);
    }

    function update(dt) {
      timeLeft -= dt; elapsed += dt;
      UI.setTime(Math.max(0, Math.ceil(timeLeft)));
      if (timeLeft <= 0) return end();

      // Gradually raise the tempo and fall speed.
      spawnGap = Math.max(0.42, 0.82 - elapsed * 0.012);
      fall = 620 + elapsed * 9;

      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawn(); spawnTimer = spawnGap; }

      for (var i = notes.length - 1; i >= 0; i--) {
        var n = notes[i];
        n.y += fall * dt;
        // A note that falls well past the line unhit breaks the combo.
        if (!n.judged && n.y > HIT_Y + GOOD_WIN) {
          n.judged = true; combo = 0;
        }
        if (n.y > view.h + NOTE_R) notes.splice(i, 1);
      }

      if (banner) { banner.t += dt; if (banner.t > 0.7) banner = null; }
      if (ringPulse > 0) ringPulse = Math.max(0, ringPulse - dt * 3);
    }

    function render() {
      // Background gradient that breathes with the combo.
      var bg = ctx.createLinearGradient(0, 0, 0, view.h);
      bg.addColorStop(0, "#160a2e"); bg.addColorStop(1, "#0a0714");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, view.w, view.h);

      // Lane.
      ctx.fillStyle = "rgba(255,255,255,.04)";
      ctx.fillRect(LANE_X - LANE_W / 2, 0, LANE_W, view.h);
      ctx.strokeStyle = "rgba(255,110,199,.25)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(LANE_X - LANE_W / 2, 0); ctx.lineTo(LANE_X - LANE_W / 2, view.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(LANE_X + LANE_W / 2, 0); ctx.lineTo(LANE_X + LANE_W / 2, view.h); ctx.stroke();

      // Hit line + target ring.
      var glow = 0.5 + ringPulse * 0.5;
      ctx.strokeStyle = "rgba(255,110,199," + glow + ")"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(LANE_X - LANE_W / 2, HIT_Y); ctx.lineTo(LANE_X + LANE_W / 2, HIT_Y); ctx.stroke();
      ctx.lineWidth = 3 + ringPulse * 5;
      ctx.strokeStyle = "rgba(255,255,255," + (0.5 + ringPulse * 0.5) + ")";
      ctx.beginPath(); ctx.arc(LANE_X, HIT_Y, NOTE_R + 8 + ringPulse * 14, 0, Math.PI * 2); ctx.stroke();

      // Notes.
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (n.judged && n.y < HIT_Y) continue; // hide already-scored notes cleanly
        ctx.save();
        ctx.globalAlpha = n.judged ? 0.25 : 1;
        var grd = ctx.createRadialGradient(LANE_X, n.y, 4, LANE_X, n.y, NOTE_R);
        grd.addColorStop(0, "hsl(" + n.hue + ",100%,80%)");
        grd.addColorStop(1, "hsl(" + n.hue + ",90%,55%)");
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(LANE_X, n.y, NOTE_R, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.85)";
        ctx.beginPath(); ctx.arc(LANE_X - 12, n.y - 12, 8, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // Combo counter.
      if (combo >= 2) {
        ctx.fillStyle = "#ffd23f";
        ctx.font = "800 40px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(combo + " COMBO", view.w / 2, 120);
      }

      // Judgment banner.
      if (banner) {
        ctx.globalAlpha = Math.max(0, 1 - banner.t / 0.7);
        ctx.fillStyle = banner.color;
        ctx.font = "800 56px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(banner.text, view.w / 2, HIT_Y - 90);
        ctx.globalAlpha = 1;
      }
    }

    function end() {
      Loop.stop();
      Store.set("bestRhythm", Math.max(score, Store.get("bestRhythm", 0)));
      var title = bestCombo >= 15 ? "Flawless!" : bestCombo >= 8 ? "In the groove!" : "Great set!";
      UI.setEnd(title, score);
      setState("end");
      Ad.track("game_end", { score: score, bestCombo: bestCombo });
    }

    return { reset: reset, onDown: onDown, update: update, render: render };
  })();

  /* ===================================================================
     7. BOOTSTRAP
     =================================================================== */
  function startGame() {
    Sound.unlock();
    Game.reset();
    setState("playing");
    Ad.track("game_start");
    Loop.start(Game.update, Game.render);
  }

  function init() {
    fitCanvas();
    $("screen-intro").querySelector(".title").textContent = CONFIG.title;
    Input.on("down", function (p) { if (State === "playing") Game.onDown(p); });
    $("btn-start").addEventListener("click", startGame);
    $("btn-install").addEventListener("click", Ad.openStore);
    $("btn-cta").addEventListener("click", Ad.openStore);
    preloadImages(function () {
      Ad.whenReady(function () {
        setState("intro");
        Ad.track("loaded");
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }

})();
</script>
</body>
</html>
