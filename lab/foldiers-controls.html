<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — foldiers control schemes</title>
<meta name="lab-group" content="tests">
<meta name="lab-game" content="foldiers">
<style>
/* ===========================================================================
   FOLDIERS — CONTROL SCHEMES, A CLEAN SHEET. Five ways to command a paper
   war on a phone, none of them a HUD over a map nor a menu on a region.
   They all answer the same four questions, which pile up as the stages add
   mechanics (cavalry, cannons, gold, generals, engineers, warnings…):

     1. what stands on a region (troops, pieces, buildings, output, alerts);
     2. how to give it an order, with simple taps;
     3. what is still to do, and what is still available;
     4. what is already planned.

   The schemes, one idea each:
     - DISPATCHES: the game asks, you answer. Every region with something to
       decide is a card on a deck; the card says what is there and offers a
       few answers with their verdict. Left-over troops come back as a card.
     - STAMPS: verb first. Pick a stamp (attack, fire, recruit…), the map
       shows only what can use it and the one number that matters for it.
     - POP-UP BOOK: a region opens as a page. Its contents stand at full size
       in the middle, its neighbours are flaps around it, where they lie on
       the map. Piece, then flap.
     - FRONTS: think in fronts, not regions. Every enemy region you touch is a
       tug-of-war; + and − commit troops and the staff picks who leaves.
     - HAND: every troop group and piece left to play is a card in the hand.
       A card played on a target sticks there as a tag.

   The world is the lab's own: a straight-edged Voronoi map, three scenarios
   (early, mid, late) loading more mechanics onto the regions, the game's
   sprites, troop for troop combat (+1 fort, +1 Defend, −2 a cannon shot,
   +1 a general or a drummer), red reinforcing and striking once a tick.
   `#scheme=stamps&level=3&demo=1` opens a state for a headless shot.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }
body { height:100vh; display:flex; overflow:hidden; background:#0b0b12; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

/* ---- panel ---------------------------------------------------------------- */
#panel { flex:0 0 330px; padding:20px 18px; background:#12121c; border-right:1px solid #23233a; overflow:auto; }
#panel h1 { font-size:16px; letter-spacing:.5px; }
#panel p.hint { margin:6px 0 14px; font-weight:500; font-size:12px; color:#8b8ba7; }
#panel h3 { margin:16px 0 8px; font-size:12px; letter-spacing:1px; color:#7ea6ff; }
#schemes button { display:block; width:100%; text-align:left; padding:8px 10px; margin-bottom:6px; background:#1c1c2c; color:#e8e6f5;
  border:1px solid #2c2c47; border-radius:8px; font:inherit; cursor:pointer; }
#schemes button b { display:block; font-size:13px; }
#schemes button span { display:block; font-weight:500; font-size:11.5px; color:#9c9cba; margin-top:2px; }
#schemes button.on { background:#7ea6ff; border-color:#7ea6ff; color:#0b0b12; }
#schemes button.on span { color:#1b2440; }
.seg { display:flex; gap:4px; flex-wrap:wrap; }
.seg button { flex:1; padding:6px 8px; background:#1c1c2c; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit; font-size:12px; cursor:pointer; }
.seg button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
#answers { margin-top:4px; padding:10px 12px; border-radius:8px; background:#1c1c2c; font-weight:500; font-size:12px; color:#c9c9e0; }
#answers p { margin-bottom:7px; }
#answers p:last-child { margin-bottom:0; }
#answers i { font-style:normal; display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; border-radius:50%;
  background:#7ea6ff; color:#0b0b12; font-weight:800; font-size:11px; margin-right:6px; }
#log { margin-top:8px; font-weight:500; font-size:11.5px; color:#8b8ba7; white-space:pre-line; }

/* ---- stage + frame ------------------------------------------------------------ */
#stage { flex:1; display:flex; align-items:center; justify-content:center; padding:16px;
  background-image:linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%),linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%);
  background-size:32px 32px; background-position:0 0,16px 16px; }
#frameBox { position:relative; overflow:hidden; border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.55); }
#frame { position:absolute; left:0; top:0; width:720px; height:1280px; transform-origin:0 0; }
#view { position:absolute; left:0; top:0; width:720px; height:1280px; touch-action:none; }
#ui { position:absolute; left:0; top:0; width:720px; height:1280px; pointer-events:none; color:#2a2418;
  font:700 22px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
#ui .live, #ui button { pointer-events:auto; }
:where(#ui) button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
:where(#ui) svg { width:1em; height:1em; vertical-align:-.15em; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
#ui img { pointer-events:none; }

/* ---- paper ----------------------------------------------------------------- */
.paper { background:#f4ecd8; border:3px solid #2a2418; border-radius:14px; box-shadow:0 7px 0 rgba(42,36,24,.28); }
.pbtn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:64px; padding:6px 14px; border-radius:14px;
  background:#fffaf0; border:3px solid #2a2418 !important; box-shadow:0 5px 0 #2a2418; font-size:22px; }
.pbtn:active { transform:translateY(4px); box-shadow:0 1px 0 #2a2418; }
.pbtn.dim { opacity:.4; }
.pill { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; color:#fff; font-size:20px; white-space:nowrap; }
.v-ok { background:#2f8f4e; } .v-just { background:#c99a10; } .v-tie { background:#6d7486; } .v-bad { background:#c8402f; } .v-none { background:#8a94a8; }
.chip { display:inline-flex; align-items:center; gap:2px; font-size:22px; white-space:nowrap; }
.chip img { height:44px; }
.chip.prod { background:#e9d8ae; color:#5c4a26; border-radius:10px; padding:0 8px; font-size:20px; }
.chip.warn { background:#e07b12; color:#fff; border-radius:10px; padding:0 8px; font-size:20px; }

/* ---- the top band ---------------------------------------------------------------- */
.hud { position:absolute; left:10px; right:10px; top:10px; height:84px; display:flex; align-items:center; gap:10px; padding:0 8px 0 16px; }
.hud .tick { font-size:22px; line-height:1.05; }
.hud .tick small { display:block; font-size:20px; color:#6b5c3c; }
.hud .res { flex:1; display:flex; gap:12px; justify-content:center; }
.hud .res span { display:inline-flex; align-items:center; gap:4px; font-size:24px; }
.hud .res em { font-style:normal; font-size:20px; color:#6b5c3c; }
.hud .send { min-height:66px; padding:4px 18px; background:#2f63c4; color:#fff; border-radius:14px; box-shadow:0 5px 0 #1d3f80; line-height:1; }
.hud .send small { display:block; font-size:20px; margin-top:3px; color:#ffe58a; }
.hud .send.done small { color:#c9f5d5; }
.dot { display:inline-block; width:16px; height:16px; border-radius:50%; background:#ffd23a; border:3px solid #2a2418; vertical-align:middle; }

/* ---- 1. dispatches --------------------------------------------------------------- */
.dp { position:absolute; left:14px; right:14px; top:742px; bottom:12px; }
.dp .layer { position:absolute; inset:0; }
.dp .layer.l1 { transform:translate(8px,-10px) rotate(1.6deg); background:#e9dfc6; }
.dp .layer.l2 { transform:translate(-6px,-18px) rotate(-1.4deg); background:#e2d6b8; }
.dp .card { position:absolute; inset:0; padding:14px 18px; display:flex; flex-direction:column; gap:10px; }
.dp .top { display:flex; align-items:center; gap:10px; font-size:20px; color:#6b5c3c; }
.dp .top .left { flex:1; }
.dp .top button { font-size:20px; padding:4px 12px; border-radius:10px; background:#e9dfc6; }
.dp .title { display:flex; align-items:center; gap:10px; font-size:34px; line-height:1; }
.dp .title .camp { width:18px; height:34px; border-radius:4px; }
.dp .what { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; min-height:50px; }
.dp .situ { font-size:22px; display:flex; align-items:center; gap:8px; }
.dp .situ .sh { width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; color:#fff; font-size:22px; }
.dp .amt { display:flex; align-items:center; gap:12px; font-size:22px; }
.dp .amt button { width:60px; height:56px; border-radius:12px; background:#fffaf0; border:3px solid #2a2418 !important; font-size:30px; }
.dp .amt b { min-width:72px; text-align:center; font-size:30px; }
.dp .amt em { font-style:normal; color:#6b5c3c; }
.dp .ans { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:auto; }
.dp .ans .pbtn { justify-content:flex-start; text-align:left; line-height:1.05; }
.dp .ans .pbtn .tx { flex:1; }
.dp .ans .pbtn.wide { grid-column:1 / -1; justify-content:center; }
.dp .ans .pbtn.attack { background:#dfe8fb; } .dp .ans .pbtn.hold { background:#e3f1e5; }
.dp .given { position:absolute; right:-6px; top:-62px; padding:6px 14px; border-radius:12px; display:flex; align-items:center; gap:8px; }
.dp .glist { display:flex; flex-direction:column; gap:8px; overflow:auto; }
.dp .glist .row { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; background:#fffaf0; border:2px solid #cbbd99; font-size:22px; }
.dp .glist .row .tx { flex:1; }
.dp .glist .row button { width:48px; height:48px; border-radius:10px; background:#f3d6cf; }
.dp .note { font-size:22px; color:#6b5c3c; font-weight:600; }

/* ---- 2. stamps ------------------------------------------------------------------- */
.st-tray { position:absolute; left:10px; right:10px; bottom:12px; height:118px; display:flex; justify-content:space-around; align-items:center; padding:0 6px; }
.st-tray .stamp { position:relative; width:68px; height:86px; border-radius:12px 12px 20px 20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#c79a5a; box-shadow:0 5px 0 #6b4a20; color:#2a2418; font-size:40px; }
.st-tray .stamp:after { content:""; position:absolute; left:6px; right:6px; bottom:-2px; height:10px; border-radius:4px; background:var(--ink,#2f63c4); }
.st-tray .stamp.on { transform:translateY(-16px) rotate(-6deg); box-shadow:0 14px 0 rgba(0,0,0,.25); background:#e2b878; }
.st-tray .stamp.off { opacity:.35; }
.st-tray .stamp .bd { position:absolute; right:-10px; top:-12px; min-width:34px; height:34px; padding:0 6px; border-radius:17px; background:#2a2418; color:#fff;
  font-size:20px; line-height:34px; text-align:center; }
.st-tray .stamp .bd.owed { background:#ffd23a; color:#2a2418; border:3px solid #2a2418; line-height:28px; }
.st-hint { position:absolute; left:20px; right:20px; bottom:142px; padding:8px 14px; display:flex; align-items:center; gap:10px; font-size:22px; }
.st-hint .tx { flex:1; }
.st-hint b { color:#2f63c4; }

/* ---- 3. pop-up book -------------------------------------------------------------- */
.pp-bar { position:absolute; left:14px; right:14px; bottom:12px; height:84px; display:flex; align-items:center; gap:12px; padding:0 14px; font-size:22px; }
.pp-bar .tx { flex:1; }
.pp-page { position:absolute; left:10px; top:110px; width:700px; height:1160px; }
.pp-tile { position:absolute; left:180px; top:240px; width:340px; height:460px; padding:12px; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
.pp-tile svg.sil { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
.pp-tile > * { position:relative; z-index:1; }
.pp-tile .nm { display:flex; align-items:center; gap:8px; font-size:30px; line-height:1; }
.pp-tile .nm .camp { width:14px; height:30px; border-radius:4px; }
.pp-tile .nm small { margin-left:auto; font-size:20px; color:#6b5c3c; }
.pp-tile .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pp-tile .pc { position:relative; height:100px; border-radius:12px; background:rgba(255,250,240,.86); border:3px solid #cbbd99 !important;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:4px; font-size:22px; }
.pp-tile .pc img { height:58px; }
.pp-tile .pc.sel { border-color:#2f63c4 !important; background:#dfe8fb; transform:translateY(-6px); box-shadow:0 6px 0 #2f63c4; }
.pp-tile .pc.done { opacity:.45; }
.pp-tile .pc .tk { position:absolute; right:-6px; top:-8px; padding:0 7px; border-radius:8px; background:#2a2418; color:#fff; font-size:20px; }
.pp-tile .pc .owe { position:absolute; left:-4px; top:-6px; }
.pp-tile .blds { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:auto; }
.pp-tile .defend { align-self:stretch; }
.pp-tile .defend.on { background:#cfe9d6; }
.pp-flap { position:absolute; width:170px; height:80px; padding:4px 10px 4px 16px; display:flex; flex-direction:column; justify-content:center; line-height:1.05;
  background:#fffaf0; border:3px solid #2a2418 !important; border-radius:12px; box-shadow:0 5px 0 rgba(42,36,24,.3); font-size:22px; text-align:left; overflow:visible; }
.pp-flap:before { content:""; position:absolute; left:0; top:0; bottom:0; width:9px; border-radius:9px 0 0 9px; background:var(--camp); }
.pp-flap .row2 { display:flex; align-items:center; gap:6px; font-size:20px; color:#6b5c3c; }
.pp-flap .row2 img { height:30px; }
.pp-flap.lit { background:#fff4c4; box-shadow:0 0 0 6px #ffd23a, 0 5px 0 rgba(42,36,24,.3); }
.pp-flap.off { opacity:.4; }
.pp-flap .tick { position:absolute; right:-10px; top:-18px; transform:rotate(5deg); padding:0 8px; border-radius:8px; color:#fff; font-size:20px; border:2px solid #2a2418; }
.pp-flap .vd { position:absolute; right:-8px; bottom:-16px; }
.pp-close { position:absolute; right:12px; top:12px; width:60px; height:60px; border-radius:14px; background:#e9dfc6; font-size:30px; }
.pp-act { position:absolute; left:200px; right:16px; top:860px; display:flex; flex-direction:column; gap:12px; }
.pp-act .row { display:flex; gap:10px; align-items:center; }
.pp-act .row .pbtn { flex:1; }
.pp-act .amt { display:flex; align-items:center; gap:12px; font-size:22px; }
.pp-act .amt button { width:64px; height:60px; border-radius:12px; background:#fffaf0; border:3px solid #2a2418 !important; font-size:30px; }
.pp-act .amt b { min-width:60px; text-align:center; font-size:32px; }
.pp-act .help { font-size:20px; color:#6b5c3c; font-weight:600; }

/* ---- 4. fronts ------------------------------------------------------------------- */
.fr-tray { position:absolute; left:12px; right:12px; bottom:12px; height:200px; padding:10px 16px; display:flex; flex-direction:column; gap:8px; }
.fr-tray .t1 { display:flex; align-items:center; gap:10px; font-size:24px; }
.fr-tray .t1 small { font-size:20px; color:#6b5c3c; }
.fr-tray .t1 .x { margin-left:auto; width:52px; height:52px; border-radius:12px; background:#e9dfc6; font-size:26px; }
.fr-tray .t2 { display:flex; align-items:center; gap:10px; }
.fr-tray .big { width:78px; height:72px; border-radius:16px; background:#fffaf0; border:3px solid #2a2418 !important; box-shadow:0 5px 0 #2a2418; font-size:36px; }
.fr-tray .score { min-width:150px; text-align:center; font-size:34px; padding:6px 10px; border-radius:14px; color:#fff; }
.fr-tray .src { flex:1; font-size:20px; color:#6b5c3c; line-height:1.15; }
.fr-tray .pbtn.on { background:#cfe9d6; }

/* ---- 5. hand ---------------------------------------------------------------------- */
.hd { position:absolute; left:0; right:0; bottom:0; height:296px; }
.hd .strip { position:absolute; left:14px; right:14px; top:0; height:62px; display:flex; align-items:center; gap:10px; padding:0 12px; font-size:22px; }
.hd .strip .tx { flex:1; font-size:20px; color:#6b5c3c; line-height:1.1; }
.hd .strip button.s { width:54px; height:46px; border-radius:10px; background:#fffaf0; border:3px solid #2a2418 !important; font-size:28px; line-height:1; }
.hd .strip b { min-width:56px; text-align:center; font-size:28px; }
.hd .count { position:absolute; left:12px; bottom:20px; width:76px; text-align:center; font-size:20px; color:#fff; line-height:1.1; }
.hd .count b { display:block; font-size:40px; }
.hd .row { position:absolute; left:92px; right:0; bottom:10px; height:204px; display:flex; align-items:flex-end; overflow-x:auto; overflow-y:visible; padding:0 30px 0 10px; scrollbar-width:none; }
.hd .row::-webkit-scrollbar { display:none; }
.hd .card { flex:0 0 140px; height:190px; margin-right:-34px; position:relative; padding:6px 8px; display:flex; flex-direction:column; align-items:center;
  transition:transform .15s; transform-origin:50% 100%; }
.hd .card .nm { align-self:stretch; padding:1px 4px; border-radius:7px; color:#fff; font-size:20px; text-align:center; white-space:nowrap; overflow:hidden; }
.hd .card img.big { height:74px; margin-top:4px; }
.hd .card .n { font-size:36px; line-height:1; }
.hd .card .sub { font-size:20px; color:#6b5c3c; display:flex; gap:6px; align-items:center; }
.hd .card .sub img { height:26px; }
.hd .card.opt { border-style:dashed !important; background:#efe6cf; }
.hd .card.sel { transform:translateY(-18px) rotate(0deg) !important; z-index:5; box-shadow:0 0 0 6px #ffd23a, 0 7px 0 rgba(42,36,24,.28); }
.hd .card.dim { opacity:.4; }
</style>
</head>
<body>

<div id="panel">
  <h1>Foldiers — control schemes</h1>
  <p class="hint">Five ways to see a region, give orders, see what is left and what is planned — tap only, mobile first. Same world for all five.</p>
  <h3>Scheme</h3>
  <div id="schemes"></div>
  <h3>What it answers</h3>
  <div id="answers"></div>
  <h3>Scenario</h3>
  <div class="seg" id="levels"></div>
  <h3>Map</h3>
  <div class="seg">
    <button id="btnNew">New map</button>
    <button id="btnClear">Clear orders</button>
  </div>
  <h3>Marks on every scheme</h3>
  <div class="seg" id="toggles"></div>
  <div id="log"></div>
</div>

<div id="stage">
  <div id="frameBox">
    <div id="frame">
      <canvas id="view"></canvas>
      <div id="ui"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- the frame, the colours, the numbers --------------------------------------
  const FW = 720, FH = 1280, MAP_Y = 106, MW = 696, MH = 872;

  // ---- the pictograms (lucide paths, one string each so canvas and DOM share them)
  const IC = {
    sword: "M14.5 17.5 3 6V3h3l11.5 11.5 M13 19l6-6 M16 16l4 4 M19 21l2-2",

      joins.forEach((o) => { const p = pieceById(o.piece); if (p.k === "siege") siege = true; else bonus++; });
      const att = inf + cav + bonus, dd = troops(t) + (t.b.fort && !siege ? 1 : 0);

        t.owner = BLUE; t.cav = c; t.inf = left - c; t.pieces = [];
        joins.forEach((o) => { const p = pieceById(o.piece), h = pieceHome(o.piece); h.pieces = h.pieces.filter((x) => x !== p); t.pieces.push(p); });
        if (W.L >= 3 && left < 2) t.warn = ["Revolt risk"];
        lines.push("You take " + t.name + " (" + att + " v " + dd + ")");
      } else {
        let lost = att; const a = Math.min(t.inf, lost); t.inf -= a; lost -= a; t.cav = Math.max(0, t.cav - lost);
        lines.push(t.name + " holds (" + att + " v " + dd + ")");
      }
    });
    O.filter((o) => o.k === "move").forEach((o) => { const t = R_(o.to); t.inf += o.inf; t.cav += o.cav; });
    O.filter((o) => o.k === "recruit").forEach((o) => { R_(o.from).inf += RECRUIT_N; });
    O.filter((o) => o.k === "build").forEach((o) => { const p = pieceById(o.piece), h = R_(o.from); if (p.k === "engineer") h.b.palisade = true; else h.b.depot = true; });
    W.gold -= O.reduce((a, o) => a + (o.cost || 0), 0);

    R.forEach((r) => { if (isBlue(r)) { const out = outputOf(r); W.reserve += out.reserve; W.gold += out.gold; W.grain += out.grain; } });
    if (W.L >= 3) W.grain -= Math.max(0, Math.ceil(R.filter(isBlue).reduce((a, r) => a + troops(r), 0) / 8) - 2);

    R.forEach((r) => { if (r.owner === RED && rnd() < 0.55) r.inf += 1; });
    let best = null;
    // one strike a tick, a region of yours first, else a neutral one it beats
    R.forEach((r) => { if (r.owner !== RED) return; r.nb.map(R_).filter((b) => b.owner !== RED).forEach((b) => {
      const m = troops(r) - 1 - (troops(b) + (b.b.fort ? 1 : 0) + (def.has(b.id) || b.b.palisade ? 1 : 0)), w = m + (isBlue(b) ? 10 : 0);
      if (m > 0 && !b.b.capital && (!best || w > best.w)) best = { r, b, m, w };
    }); });
    if (best) { const was = best.b.owner; best.b.owner = RED; best.b.inf = best.m; best.b.cav = 0; best.b.pieces = []; best.b.warn = []; best.r.inf = 1; best.r.cav = 0; lines.push("Red takes " + best.b.name + (was === NEU ? " (neutral)" : "")); }
    O = []; U = {}; W.tick++; W.clock = 120;
    alerts();
    lastLog = "Tick " + (W.tick - 1) + ": " + (lines.length ? lines.join(" · ") : "quiet");

    });

    if (on) { ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke(); }
    icon(k === "attack" ? "sword" : "shield", 0, 0, 18, "#fff", 3);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(tl, -w / 2 + wl / 2, 1); ctx.fillText(tr, w / 2 - wr / 2, 1);
    ctx.restore();
    hits.push({ b: { x: x - w / 2 - 6, y: y - h / 2 - 6, w: w + 12, h: h + 12 }, fn });
  }
  // a paper tag beside a region: everything on it, the scheme-free way to read one
  function infoTag(r) {
    const p = scr(r.cx, r.cy), rows = [];
    rows.push({ t: r.name + " · " + CAMP_WORD[r.owner], bold: true });
    const tr = []; if (r.inf || !r.cav) tr.push(["inf", r.inf]); if (r.cav) tr.push(["cav", r.cav]); r.pieces.forEach((pc) => tr.push([pc.k, ""]));
    rows.push({ spr: tr });
    const bl = []; ["capital", "town", "fort", "mine", "farm", "palisade", "depot"].forEach((b) => { if (r.b[b]) bl.push([b, ""]); });
    if (bl.length) rows.push({ spr: bl });
    if (isBlue(r)) { const o = outputOf(r), parts = []; if (o.reserve) parts.push("+" + o.reserve + " reserve"); if (o.gold) parts.push("+" + o.gold + " gold"); if (o.grain) parts.push("+" + o.grain + " grain"); if (parts.length) rows.push({ t: parts.join(" · "), col: "#5c4a26", bg: "#e9d8ae" }); }
    if (isBlue(r)) { const s = situLine(r); if (s.v !== "none") rows.push({ t: s.tx.split(" (")[0], col: VCOL[s.v] }); }
    r.warn.forEach((w) => rows.push({ t: "! " + w, col: WARN }));
    ctx.font = "700 20px " + FONT;
    const w = Math.max(200, ...rows.map((x) => x.t ? ctx.measureText(x.t).width + 28 : x.spr.length * 62 + 20)), h = rows.reduce((a, x) => a + (x.spr ? 56 : 30), 16);
    let x = p.x + 60, y = p.y - h / 2; if (x + w > FW - 10) x = p.x - 60 - w; y = clamp(y, MAP_Y + 4, SCH().uiTop() - h - 8);
    ctx.save(); ctx.fillStyle = "rgba(42,36,24,.3)"; rr(x, y + 6, w, h, 12); ctx.fill(); ctx.fillStyle = "#f4ecd8"; rr(x, y, w, h, 12); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    let yy = y + 10;
    rows.forEach((row) => {
      if (row.spr) { row.spr.forEach((s, i) => { sprite(s[0], r.owner, x + 34 + i * 62, yy + 48, 46); if (s[1] !== "") { ctx.fillStyle = INK; ctx.font = "800 22px " + FONT; ctx.textAlign = "left"; ctx.fillText(String(s[1]), x + 52 + i * 62, yy + 44); } }); yy += 56; return; }
      if (row.bg) { ctx.fillStyle = row.bg; rr(x + 8, yy, w - 16, 28, 8); ctx.fill(); }
      ctx.fillStyle = row.col || INK; ctx.font = (row.bold ? "800 " : "700 ") + "20px " + FONT; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText(row.t, x + 14, yy + 3); yy += 30;
    });
    ctx.restore();
  }
  function frameDraw() {
    const t = now();
    for (const k of ["s", "ox", "oy"]) cam[k] += (camGoal[k] - cam[k]) * 0.2;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#3f9c96"; ctx.fillRect(0, 0, FW, FH);
    ctx.fillStyle = "rgba(255,255,255,.05)"; for (let y = 0; y < FH; y += 22) ctx.fillRect(0, y, FW, 2);
    hits = [];
    if (!W) return;
    const sc = SCH();
    drawMap(cam, false);
    drawArrows(cam, sc.arrows);
    sc.overlay();
    if (sc.mini && U.open != null) {
      // the page stands over the map, and keeps a window on it
      ctx.fillStyle = "#efe5cc"; rr(10, 110, 700, 1160, 18); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      ctx.fillStyle = "rgba(42,36,24,.06)"; for (let y = 130; y < 1260; y += 34) ctx.fillRect(24, y, 672, 2);
      const mc = { s: 0.236, ox: 26, oy: 960 };
      ctx.fillStyle = "#3f9c96"; rr(18, 952, 180, 222, 12); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      drawMap(mc, true);
      hits.push({ b: { x: 18, y: 952, w: 180, h: 222 }, fn: () => { U.open = null; U.sel = null; refresh(); } });
    }
  }
  function loop() { frameDraw(); requestAnimationFrame(loop); }

  // ---- the top band and the DOM -------------------------------------------------------------
  function hud() {
    const td = todoCount(), res = [];
    if (W.L >= 2) res.push("<span>" + svg("coin") + goldLeft() + (goldLeft() !== W.gold ? "<em>/" + W.gold + "</em>" : "") + "</span>");
    if (W.L >= 3) res.push('<span style="' + (W.grain <= 0 ? "color:#c8402f" : "") + '">grain ' + W.grain + "</span>");
    const inc = W.R.filter(isBlue).reduce((a, r) => a + outputOf(r).reserve, 0);
    res.push("<span>" + svg("star") + reserveLeft() + "<em>+" + inc + "</em></span>");
    const m = Math.floor(W.clock / 60), s = Math.floor(W.clock % 60);
    return '<div class="hud paper live"><div class="tick">Tick ' + W.tick + "<small>" + m + ":" + (s < 10 ? "0" : "") + s + "</small></div>" +
      '<div class="res">' + res.join("") + "</div>" +
      '<button class="send' + (td ? "" : " done") + '" data-a="send">Send<small>' + (td ? td + " to do" : "all set") + "</small></button></div>";
  }
  function refresh() {
    aimCamera();
    ui.innerHTML = hud() + SCH().dom();
    panelAnswers();
    window.__lab = { S, W, O, U, todo: todoCount() };
  }
  ui.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
    const a = el.dataset.a;
    if (a === "send") { send(); return; }
    SCH().act(a, el); refresh();
  });

  // ---- input on the map ---------------------------------------------------------------------------
  let down = null;
  function pos(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * FW / b.width, y: (e.clientY - b.top) * FH / b.height }; }
  function inPoly(x, y, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) c = !c; } return c; }
  cv.addEventListener("pointerdown", (e) => { down = pos(e); });
  cv.addEventListener("pointerup", (e) => {
    const p = pos(e); if (!down || Math.hypot(p.x - down.x, p.y - down.y) > 14) { down = null; return; } down = null;
    tap(p.x, p.y);
  });
  function tap(x, y) {
    for (let i = hits.length - 1; i >= 0; i--) { const b = hits[i].b; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { hits[i].fn(); refresh(); return; } }
    if (S.scheme === "popup" && U.open != null) return;
    const mx = (x - cam.ox) / cam.s, my = (y - cam.oy) / cam.s;
    const r = W.R.find((r) => inPoly(mx, my, r.poly));
    if (!r) { U.info = null; U.filter = null; U.src = null; U.sel = S.scheme === "hand" || S.scheme === "fronts" ? null : U.sel; refresh(); return; }
    SCH().tapRegion(r); refresh();
  }

  // ---- the panel ------------------------------------------------------------------------------
  function panelAnswers() {
    const sc = SCH();
    document.getElementById("answers").innerHTML = sc.answers.map((a, i) => "<p><i>" + (i + 1) + "</i>" + a + "</p>").join("");
    document.querySelectorAll("#schemes button").forEach((b) => b.classList.toggle("on", b.dataset.k === S.scheme));
    document.querySelectorAll("#levels button").forEach((b) => b.classList.toggle("on", +b.dataset.l === S.level));
    document.querySelectorAll("#toggles button").forEach((b) => b.classList.toggle("on", !!S[b.dataset.k]));
    document.getElementById("log").textContent = (LEVELS[S.level].note) + (lastLog ? "\n" + lastLog : "");
  }
  function buildPanel() {
    const sp = document.getElementById("schemes");
    sp.innerHTML = Object.keys(SCHEMES).map((k, i) => '<button data-k="' + k + '"><b>' + (i + 1) + " · " + SCHEMES[k].name + "</b><span>" + SCHEMES[k].note + "</span></button>").join("");
    sp.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.scheme = b.dataset.k; U = {}; save(); refresh(); };
    const lv = document.getElementById("levels");
    lv.innerHTML = [1, 2, 3].map((l) => '<button data-l="' + l + '">' + LEVELS[l].name + "</button>").join("");
    lv.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.level = +b.dataset.l; save(); lastLog = ""; genWorld(); refresh(); };
    const tg = document.getElementById("toggles");
    tg.innerHTML = '<button data-k="dots">Yellow to-do dots</button><button data-k="shields">Shield when weak</button>';
    tg.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S[b.dataset.k] = !S[b.dataset.k]; save(); refresh(); };
    document.getElementById("btnNew").onclick = () => { S.seed = (S.seed * 7 + 3) % 997; save(); lastLog = ""; genWorld(); refresh(); };
    document.getElementById("btnClear").onclick = () => { O = []; U = {}; refresh(); };
  }

  // ---- a state for a headless shot: a few orders given, something in hand ---------------------
  function demo() {
    const blues = W.R.filter((r) => isBlue(r) && frontline(r)).sort((a, b) => free(b) - free(a));
    const a = blues[0]; if (a) { const t = enemyNb(a)[0]; if (t) sendTroops(a, t, suggest(a, t)); }
    const b = blues[1]; if (b) toggleDefend(b);
    const sc = S.scheme;
    if (sc === "dispatch") { /* the deck opens on the next card */ }
    if (sc === "stamps") { U.stamp = "attack"; const s = W.R.find((r) => isBlue(r) && free(r) > 0 && enemyNb(r).length && r !== a); if (s) U.src = s.id; }
    if (sc === "popup") { const r = W.R.filter((r) => todoOf(r) > 0).sort((x, y) => urgency(y) - urgency(x))[0]; if (r) { U.open = r.id; U.sel = "troops"; } }
    if (sc === "fronts") { const f = SCHEMES.fronts.list().find((f) => f.k === "attack"); if (f) { SCHEMES.fronts.plus(f); SCHEMES.fronts.plus(f); U.sel = f.key; } }
    if (sc === "hand") { const c = items()[0]; if (c) U.sel = c.key; }
  }

  // ---- go -------------------------------------------------------------------------------------
  window.addEventListener("error", (e) => { document.getElementById("log").textContent += "\nERROR " + e.message + " @" + e.lineno; });
  buildPanel(); fit(); genWorld();
  if (HASH.demo) demo();
  refresh();
  // `do=r:Tolen;a:ans,i,0;send` replays taps for a headless check: a region by name, a control by data-a (and one data field), Send
  if (HASH.do) HASH.do.split(";").forEach((st) => {
    const i = st.indexOf(":"), k = i < 0 ? st : st.slice(0, i), v = i < 0 ? "" : st.slice(i + 1);
    if (k === "r") { const r = W.R.find((x) => x.name === v); if (r) { SCH().tapRegion(r); refresh(); } }
    if (k === "a") { const q = v.split(","); const el = [...ui.querySelectorAll('[data-a="' + q[0] + '"]')].find((e) => !q[1] || e.dataset[q[1]] === q[2]); if (el) el.click(); }
    if (k === "send") send();
  });
  for (const k of ["s", "ox", "oy"]) cam[k] = camGoal[k];
  window.addEventListener("resize", () => { fit(); });
  setInterval(() => { if (W && W.clock > 0) { W.clock -= 1; const t = ui.querySelector(".hud .tick small"); if (t) { const m = Math.floor(W.clock / 60), s = Math.floor(W.clock % 60); t.textContent = m + ":" + (s < 10 ? "0" : "") + s; } } }, 1000);
  loop();
})();
</script>
