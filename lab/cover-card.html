<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — itch cover card</title>
<style>
/* ===========================================================================
   COVER CARD — the 630x500 image itch.io asks for, composed from the painted
   artwork a game already owns.

   Four pieces, all of them the game's own, none of them made for this card:

     assets/art/<slug>-background-desk.webp    the scene, in landscape. It was
       drawn to be stretched wide behind a portrait frame, which is exactly the
       shape of this card — so a cover is the game's own world, not a blurred
       screenshot standing in for one.
     assets/art/<slug>-title.webp              the logotype. It replaces the
       CSS title this card used to set in one of six faces at a measured size:
       a drawn logotype has no metrics to fit and no font to wait for.
     assets/art/<slug>-character-happy.webp    the character, standing on the
       bottom edge. It is the piece that makes thirteen covers read as thirteen
       games rather than thirteen screenshots.
     assets/screen/<slug>-NN.jpg               one real frame of play, in a
       tilted portrait panel bled off the right edge — the proof that there is
       a game behind the art.

   itch shows this image wherever it links to a project, down to 315x250 in a
   browse grid. That is the SAME aspect ratio, so the small size is a plain
   downscale, not a crop: nothing gets cut, but everything has to still read at
   half size. Hence a drawn logotype rather than type, a character in silhouette
   rather than in detail, and no small text anywhere.

   Nothing about a game is described twice. The data comes in on the query
   string and `tools/lab/shoot-cover.mjs` fills it from games/<slug>/manifest.json:

     ?slug=vipera&accent=%234dff9b&shot=6

   Opening the page bare shows vipera, and the panel on the left re-composes it
   live for any other game — that is what it is for. It is a lab page: it never
   ships, and it is allowed to load ../assets/ by relative path.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  min-height:100vh;
  display:flex;
  background:#0b0b12;
  color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* ---------------------------------------------------------------------------
   PANEL — the controls.
   --------------------------------------------------------------------------- */
#panel {
  flex:0 0 280px;
  padding:22px 20px;
  background:#12121c;
  border-right:1px solid #23233a;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel p.hint { margin:8px 0 22px; font-weight:500; font-size:12px; color:#8b8ba7; }

.row { margin-bottom:14px; }
.row label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row select {
  width:100%; margin-top:6px; padding:6px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px;
  font:inherit;
}
.row input[type=range] { width:100%; margin-top:6px; accent-color:#7ea6ff; }
.row input[type=color] { width:100%; height:30px; margin-top:6px; background:#0b0b12; border:1px solid #2c2c47; border-radius:6px; }
.miss { margin-top:18px; font-weight:500; font-size:12px; line-height:1.5; color:#ffb4b4; }
.miss:empty { display:none; }

/* ---------------------------------------------------------------------------
   STAGE.
   --------------------------------------------------------------------------- */
#stage {
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px;
  padding:30px;
}
#stage .meta { font-size:12px; color:#8b8ba7; }
#stage .crop { outline:1px dashed #44446a; outline-offset:0; }

/* ---------------------------------------------------------------------------
   THE COVER — 630x500, authored 1:1. The shoot captures it at a device pixel
   ratio of 2 and halves the result, so the artwork's edges stay clean.
   --------------------------------------------------------------------------- */
#cover {
  position:relative;
  width:630px; height:500px;
  overflow:hidden;
  background:#07070e;
  --accent:#4dff9b;
}

/* The game's own landscape scene. It is the whole ground of the card, so it
   is only darkened — never blurred: the point of using the painting is that
   it is worth looking at. */
#cover .bg {
  position:absolute; inset:0;
  background:var(--bg-img) center/cover no-repeat;
  filter:brightness(.74) saturate(1.06);
}
/* Darkened toward the bottom-left, where the logotype and the character are,
   and lifted by the game's accent at the very bottom so the card carries the
   game's colour even where the painting does not. */
#cover .scrim {
  position:absolute; inset:0;
  background:
    linear-gradient(72deg, rgba(4,4,10,.80) 0%, rgba(4,4,10,.46) 38%, rgba(4,4,10,.06) 66%, rgba(4,4,10,.30) 100%),
    linear-gradient(0deg, rgba(4,4,10,.66) 0%, rgba(4,4,10,.10) 34%, transparent 58%),
    radial-gradient(100% 80% at 6% 104%, color-mix(in srgb, var(--accent) 30%, transparent) 0%, transparent 60%);
}

/* One real frame of play: a portrait panel, tilted and bled off the right
   edge. It is the only rectangle on the card, which is what makes it read as
   a screen rather than as part of the painting. */
#cover .shot {
  position:absolute; right:-40px; top:50%;
  width:236px; height:420px;                 /* 720x1280, to scale */
  transform:translateY(-50%) rotate(-4deg);
  border-radius:20px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.16);
  box-shadow:0 26px 60px rgba(0,0,0,.62), 0 0 0 1px rgba(0,0,0,.5);
}
#cover .shot img { display:block; width:100%; height:100%; object-fit:cover; }
/* A slight inner darkening at the bleed edge, so the panel reads as depth. */
#cover .shot::after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent 55%, rgba(4,4,10,.55) 100%);
}

/* The logotype, top-left. Its box stops short of the screenshot panel, and the
   fit is `contain`, so a 3:1 logotype and a 2:1 one both land inside it
   without either being stretched or overlapping the panel. */
#cover .title {
  position:absolute; left:30px; top:34px;
  width:308px; height:132px;
  object-fit:contain; object-position:left top;
  filter:drop-shadow(0 8px 22px rgba(0,0,0,.72));
}

/* The character, standing on the bottom edge and cropped by it: a figure the
   frame cuts stands in the scene, one floating clear of it is a sticker. The
   box is fixed and the fit is `contain` because the masters are portrait for
   some games and landscape for others. */
#cover .face {
  position:absolute; left:14px; bottom:-12px;
  width:250px; height:296px;
  object-fit:contain; object-position:left bottom;
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.6));
}

/* A game whose artwork is not on disk says so on the card, in place of the
   piece that is missing — `tools/lab/shoot-cover.mjs` refuses to shoot it, so
   this is only ever seen in the lab. */
#cover .missing {
  display:flex; align-items:center; justify-content:center;
  border:2px dashed rgba(255,255,255,.22); border-radius:12px;
  font:700 11px/1.3 -apple-system,sans-serif; letter-spacing:1px;
  color:rgba(255,255,255,.45); text-align:center; text-transform:uppercase;
}

/* The shoot hides everything but the card. */
body.shoot { display:block; background:transparent; }
body.shoot #panel, body.shoot #stage .meta { display:none; }
body.shoot #stage { padding:0; gap:0; display:block; }
body.shoot #stage .crop { outline:0; }
</style>
</head>
<body>

<div id="panel">
  <h1>Cover card</h1>
  <p class="hint">The 630&times;500 image itch.io asks for, composed from
    <code>assets/art/</code>. Shoot them all with
    <code>node tools/lab/shoot-cover.mjs</code>.</p>

  <div class="row">
    <label>Game <b id="v-slug">vipera</b></label>
    <select id="slug"></select>
  </div>
  <div class="row">
    <label>Screenshot <b id="v-shot">6</b></label>
    <input id="shot" type="range" min="1" max="10" step="1" value="6">
  </div>
  <div class="row">
    <label>Character</label>
    <select id="face">
      <option value="happy">happy</option>
      <option value="neutral">neutral</option>
      <option value="sad">sad</option>
    </select>
  </div>
  <div class="row">
    <label>Accent</label>
    <input id="accent" type="color" value="#4dff9b">
  </div>
  <p class="miss" id="miss"></p>
</div>

<div id="stage">
  <div class="crop">
    <div id="cover">
      <div class="bg"></div>
      <div class="scrim"></div>
      <div class="shot"><img id="shotimg" alt=""></div>
      <img id="ctitle" class="title" alt="">
      <img id="cface" class="face" alt="">
    </div>
  </div>
  <div class="meta">630 &times; 500 — itch shows it down to 315 &times; 250, the same shape</div>
</div>

<script>
/* The games, for the panel only: the shoot never reads this list, it passes
   everything on the query string. Kept in sync by nothing — it is a
   convenience, and a slug typed into the URL always wins. */
var GAMES = ["arcider", "blight", "bouncetry", "chainring", "echomaze", "gearball",
             "marshmelt", "orbinity", "radiam", "slipdeck", "spinshock", "triverse", "vipera"];

var q = new URLSearchParams(location.search);
var cover = document.getElementById("cover");
var el = {
  slug: document.getElementById("slug"),
  shot: document.getElementById("shot"),
  face: document.getElementById("face"),
  accent: document.getElementById("accent"),
  vslug: document.getElementById("v-slug"),
  vshot: document.getElementById("v-shot"),
  img: document.getElementById("shotimg"),
  ctitle: document.getElementById("ctitle"),
  cface: document.getElementById("cface"),
  miss: document.getElementById("miss")
};

GAMES.forEach(function (g) {
  var o = document.createElement("option");
  o.value = o.textContent = g;
  el.slug.appendChild(o);
});

// --- state, from the query string with the panel's defaults as the fallback
var slug = q.get("slug") || "vipera";
if (GAMES.indexOf(slug) >= 0) el.slug.value = slug;
if (q.get("shot")) el.shot.value = q.get("shot");
if (q.get("face")) el.face.value = q.get("face");
if (q.get("accent")) el.accent.value = q.get("accent");

/* What did not load. The card marks the hole and the panel names it, which is
   how a re-encode that has not been run yet shows up as a sentence instead of
   as a cover that is quietly missing its character. */
var missing = [];
var bgReady = Promise.resolve();

function watch(img, what) {
  img.classList.remove("missing");
  img.removeAttribute("alt");
  img.onerror = function () {
    img.classList.add("missing");
    img.removeAttribute("src");
    img.alt = "no " + what;
    if (missing.indexOf(what) < 0) missing.push(what);
    el.miss.textContent = "Not on disk: " + missing.join(", ") +
      " — run node tools/lab/encode-art.mjs";
  };
}

function paint() {
  var s = el.slug.value;
  var n = String(el.shot.value).padStart(2, "0");

  missing = [];
  el.miss.textContent = "";
  el.vslug.textContent = s;
  el.vshot.textContent = el.shot.value;
  cover.style.setProperty("--accent", el.accent.value);

  var shot = "../assets/screen/" + s + "-" + n + ".jpg";
  watch(el.img, "screenshot");
  el.img.src = shot;

  /* The scene is a CSS background, so it cannot be awaited with decode() like
     the three <img> below. It is loaded through an Image of its own instead —
     `bgReady` is what the shoot's readiness flag waits on, or it would capture
     a card whose whole ground is still blank. */
  var bgUrl = "../assets/art/" + s + "-background-desk.webp";
  cover.querySelector(".bg").style.setProperty("--bg-img", 'url("' + bgUrl + '")');
  bgReady = new Promise(function (res) {
    var probe = new Image();
    probe.onload = function () { res(); };
    probe.onerror = function () {
      if (missing.indexOf("background-desk") < 0) missing.push("background-desk");
      el.miss.textContent = "Not on disk: " + missing.join(", ") +
        " — run node tools/lab/encode-art.mjs";
      res();
    };
    probe.src = bgUrl;
  });

  watch(el.ctitle, "title");
  el.ctitle.src = "../assets/art/" + s + "-title.webp";

  watch(el.cface, "character");
  el.cface.src = "../assets/art/" + s + "-character-" + el.face.value + ".webp";
}

["slug", "shot", "face", "accent"].forEach(function (k) {
  el[k].addEventListener("input", paint);
});
paint();

/* The shoot waits on this: the card is composed and all three images have
   decoded, so the capture cannot land on an empty frame. No font to wait for
   any more — every piece of type on this card is drawn. */
window.__coverReady = 0;
(async function () {
  if (q.get("shoot")) document.body.classList.add("shoot");
  var waits = [];
  [el.img, el.ctitle, el.cface].forEach(function (i) {
    if (i.getAttribute("src")) waits.push(i.decode ? i.decode().catch(function () {}) : Promise.resolve());
  });
  waits.push(bgReady);
  await Promise.all(waits);
  await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
  window.__coverReady = 1;
})();
</script>
</body>
</html>
