<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — 3D effect</title>
<meta name="lab-group" content="css">
<meta name="lab-game" content="dozerflip">
<style>
/* ===========================================================================
   LAB — 3D EFFECT. One 3D model (the hero dozer by default, or another
   vehicle of the library and the kit) on a small stage, and twenty effects
   fired around it from one button each: what a stunt, a power or a hit could
   look like on the machine before any of it moves into a game.

     - TWO KINDS of effect, and every button plays once. A SHOT has its own
       end (a shockwave, an explosion, a manga impact). A SUSTAINED effect (an
       aura, a jet, sparks) would run forever in a game, so here it plays for
       HOLD_PLAY seconds and fades out; pressed again while it plays, it plays
       on. Nothing is a toggle: a click can never switch an effect off.
     - THE MACHINE MOVES if asked: still, a turntable, a drive in a circle, or
       a hop with a flip every two seconds — an aura, a trail or a ghost is
       judged in motion, which is how a game shows it.
     - FIVE BUILDING BLOCKS make all twenty, and nothing else: instanced
       camera-facing particles (round, stretched along their speed, stars,
       smoke puffs), glowing ribbons (lightning, arcs, trails, wind), flat
       waves (rings, flashes, decals), fresnel shells cut from the model's
       own merged geometry (auras, ghosts), and physical chunks (rocks, ice
       shards, confetti). A particle can be born on the model's SURFACE (an
       area-weighted sample of its triangles), so a flame or a spark follows
       the shape of whatever model is loaded.
     - HDR + BLOOM: an effect's core is brighter than white, and only that
       blooms (threshold above the lit scene), so the snow day stays a day.

   Served over HTTP only (make lab): three.js is an ES module, vendored in
   lab/vendor/three/ and named by the import map below.
   ?fx=<id>,<id>&model=<id>&motion=<still|turn|drive|hop>&amb=<day|snow|night>
   opens a state; &manual=1 stops the clock for a headless bench, which then
   steps it with window.__fx3d.tick(n, dt).
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  display:flex; height:100vh; overflow:hidden;
  background:#0b0b12; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
#panel {
  flex:0 0 330px; height:100vh; overflow-y:auto; overflow-x:hidden;
  padding:18px 16px 40px;
  background:#12121c; border-right:1px solid #23233a;
}
#panel h1 { font-size:16px; letter-spacing:.5px; }
#panel p.hint { margin:6px 0 12px; font-weight:500; font-size:12px; color:#8b8ba7; }
#stats { font:500 12px/1.4 ui-monospace,Menlo,monospace; color:#9c9cba; margin-bottom:10px; white-space:pre;
  overflow:hidden; text-overflow:ellipsis; }   /* the holds line grows long: clip it, never let it widen the panel */
.sub { font-size:11px; color:#6c6c8a; margin:12px 0 6px; font-weight:600; }
.fxs { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.fxs button {
  position:relative; padding:7px 8px 7px 30px; text-align:left;
  background:#1b1b2c; color:#cfd0ea; border:1px solid #2c2c47; border-radius:8px;
  font:600 12px/1.25 inherit; cursor:pointer;
}
.fxs button i { position:absolute; left:8px; top:7px; font-style:normal; font:600 10px/16px ui-monospace,Menlo,monospace; color:#6c6c8a; }
.fxs button:hover { border-color:#4a4a72; }
.fxs button.flash { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
.fxs button.flash i { color:#0b0b12; }
.fxs button.on { background:#f2b22a; color:#0b0b12; border-color:#f2b22a; }
.fxs button.on i { color:#0b0b12; }
.btns { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.btns button {
  flex:1 1 30%; padding:7px 8px;
  background:#22223a; color:#e8e6f5; border:1px solid #2c2c47; border-radius:8px;
  font:600 12px/1.2 inherit; cursor:pointer;
}
.btns button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
#desc { min-height:54px; margin-top:10px; padding:8px 10px; border-radius:8px; background:#171726;
  font-weight:500; font-size:12px; color:#9c9cba; }
#desc b { color:#e8e6f5; }
.row { margin-bottom:9px; }
.row label { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:4px; accent-color:#7ea6ff; }
.row select {
  width:100%; margin-top:4px; padding:5px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit; font-size:12px;
}
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
#stage { flex:1; position:relative; min-width:0; }
#view { display:block; width:100%; height:100%; touch-action:none; }
#hud { position:absolute; left:24px; top:20px; pointer-events:none; text-shadow:0 1px 4px rgba(0,0,0,.55); color:#fff; max-width:60%; }
#hud b { display:block; font-size:22px; letter-spacing:.3px; }
#hud span { display:block; font-weight:500; font-size:13px; opacity:.9; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.min.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>

<div id="panel">
  <h1>3D effect</h1>
  <p class="hint">Twenty effects around one model. Every effect plays once: a shot to its end, a sustained one for 3 s — click again to keep it going. Drag to orbit, wheel to zoom.</p>
  <div id="stats">loading…</div>
  <div class="grid2">
    <div class="row"><label>Model</label><select id="model"></select></div>
    <div class="row"><label>Motion</label><select id="motion">
      <option value="still">Still</option><option value="turn">Turntable</option>
      <option value="drive">Drive a circle</option><option value="hop">Hop and flip</option>
    </select></div>
    <div class="row"><label>Ambiance</label><select id="amb">
      <option value="day">Day</option><option value="snow">Snow</option><option value="night">Night</option>
    </select></div>
    <div class="row"><label>Bloom <b id="vBloom">0.6</b></label><input id="bloom" type="range" min="0" max="2" step="0.05" value="0.6"></div>
  </div>
  <div class="row"><label>Time <b id="vTime">×1</b></label><input id="time" type="range" min="0.1" max="1.5" step="0.05" value="1"></div>
  <div class="btns">
    <button id="bClear">Clear all</button>
    <button id="bReel">Showreel</button>
  </div>
  <div class="sub">Shots — play once</div>
  <div class="fxs" id="shots"></div>
  <div class="sub">Sustained — play for 3 s</div>
  <div class="fxs" id="holds"></div>
  <div id="desc">Hover an effect to read what it is made of.</div>
</div>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hud"><b id="hudName"></b><span id="hudDesc"></span></div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { item } from "./models/library.js";

const qs = new URLSearchParams(location.search);
const MANUAL = qs.get("manual") === "1";

// A material is never disposed here. Disposing the last material that uses a
// shader frees its WebGL program, and the next effect to need it links it again
// — synchronously, inside a frame. Every hold freed 1 to 4 programs when it
// stopped and linked them again when it started, and every ring did the same
// as it faded: on a real GPU that is a stall long enough for the next click to
// land in it and switch the hold straight back off. With dispose a no-op, a
// program is linked once (see warmUp, at boot) and kept for the session; the
// material itself is still collected once nothing references it.
THREE.Material.prototype.dispose = function () {};
const TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const ease = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const easeOut = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const rnd = (x = 1) => (Math.random() * 2 - 1) * x;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
// a colour as linear rgb, times k: k > 1 is brighter than white, and blooms
const COL = (hex, k = 1) => { const c = new THREE.Color(hex); return [c.r * k, c.g * k, c.b * k]; };
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// =============================================================================
// THE STAGE — renderer, bloom, light, a round ground
// =============================================================================
const canvas = $("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.info.autoReset = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
camera.position.set(5.6, 3.1, 6.4);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true; controls.dampingFactor = 0.1; controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 2; controls.maxDistance = 30;

const hemi = new THREE.HemisphereLight("#d6e8ff", "#80705e", 1.15);
const sun = new THREE.DirectionalLight("#fff1dc", 2.7);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(hemi, sun, sun.target);
const SUN_OFF = V(4, 9, 5);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.6, 0.4, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const groundCv = document.createElement("canvas"); groundCv.width = groundCv.height = 256;
const groundTex = new THREE.CanvasTexture(groundCv);
groundTex.colorSpace = THREE.SRGBColorSpace; groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(30, 30); groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 72), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// three looks: what the effects are judged against. dust and rock are the
// colours the ground lends to what an effect throws up
const AMBS = {
  day: { bg: "#bcd8ee", fog: "#cfe2ef", near: 16, far: 46, hemi: 1.15, sun: 2.7, sunCol: "#fff1dc", exp: 1,
    tiles: ["#b99a72", "#ab8c66"], grain: ["rgba(70,50,30,0.10)", "rgba(255,240,210,0.10)"], dust: 0xd8c3a0, rock: 0x8a7258 },
  snow: { bg: "#dfe9f2", fog: "#e6eef5", near: 16, far: 46, hemi: 1.3, sun: 2.4, sunCol: "#fff6ea", exp: 0.95,
    tiles: ["#eef3f8", "#e3ebf3"], grain: ["rgba(120,150,190,0.10)", "rgba(255,255,255,0.25)"], dust: 0xf4f8ff, rock: 0x8d9aa8 },
  night: { bg: "#0d1124", fog: "#121733", near: 12, far: 40, hemi: 0.28, sun: 0.55, sunCol: "#9fb6ff", exp: 1.1,
    tiles: ["#2a3042", "#262b3c"], grain: ["rgba(0,0,0,0.18)", "rgba(140,160,220,0.06)"], dust: 0x55607a, rock: 0x3c4152 }
};
let AMB = AMBS.day;
function setAmb(key) {
  AMB = AMBS[key] || AMBS.day;
  scene.background = new THREE.Color(AMB.bg);
  scene.fog = new THREE.Fog(AMB.fog, AMB.near, AMB.far);
  hemi.intensity = AMB.hemi; sun.intensity = AMB.sun; sun.color.set(AMB.sunCol);
  renderer.toneMappingExposure = AMB.exp;
  const g = groundCv.getContext("2d");
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = AMB.tiles[(i + j) % 2]; g.fillRect(i * 128, j * 128, 128, 128); }
  for (let n = 0; n < 2600; n++) { g.fillStyle = AMB.grain[n & 1]; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  groundTex.needsUpdate = true;
  $("amb").value = key;
}

// =============================================================================
// THE MODEL — root (place, heading) > hop (height) > tumble (flips, about the
// centre of mass) > holder (the model, normalised to one length, facing +x)
// =============================================================================
const root = new THREE.Group(), hop = new THREE.Group(), tumble = new THREE.Group(), holder = new THREE.Group();
root.add(hop); hop.add(tumble); tumble.add(holder); scene.add(root);
tumble.rotation.order = "YZX";
const MODEL_LEN = 2.6;

const MATS = new Map();
const LIB = {
  mesh(geo, hex, opt = {}) {
    const key = hex + "|" + (opt.roughness ?? "") + "|" + (opt.metalness ?? "");
    let m = MATS.get(key);
    if (!m) {
      m = hex === 0xf7f8f9 ? new THREE.MeshBasicMaterial({ color: "#fff2cc" })
        : new THREE.MeshStandardMaterial({ color: hex, roughness: opt.roughness ?? 0.72, metalness: opt.metalness ?? 0, flatShading: true });
      MATS.set(key, m);
    }
    const mesh = new THREE.Mesh(geo, m); mesh.castShadow = mesh.receiveShadow = true; return mesh;
  },
  mat: (hex, opt = {}) => new THREE.MeshStandardMaterial({ color: hex, roughness: opt.roughness ?? 0.8, flatShading: true }),
  glow: () => new THREE.MeshBasicMaterial({ color: "#fff2cc" }),
  rnd: Math.random
};
const KIT = "../assets/model/kaykit-city/";
const loader = new GLTFLoader();
// every model is built facing +x (yaw is how the kit's +z cars are turned)
const MODELS = [
  { id: "dozer-hero", name: "Hero dozer", build: async () => item("vehicle-dozer-hero").build(LIB, { toy: 0.6, detail: 2 }) },
  { id: "dozer", name: "Prototype dozer", build: async () => item("vehicle-dozer").build(LIB, {}) },
  { id: "sedan", name: "Sedan (kit)", yaw: Math.PI / 2, build: () => kit("car_sedan") },
  { id: "police", name: "Police car (kit)", yaw: Math.PI / 2, build: () => kit("car_police") },
  { id: "taxi", name: "Taxi (kit)", yaw: Math.PI / 2, build: () => kit("car_taxi") }
];
// a fetch the lab server drops is asked again rather than failing the page
const loadKit = (n, tries = 4) => loader.loadAsync(KIT + n + ".gltf")
  .catch((e) => tries > 1 ? new Promise((r) => setTimeout(r, 250)).then(() => loadKit(n, tries - 1)) : Promise.reject(e));
async function kit(name) {
  const g = (await loadKit(name)).scene;
  g.traverse((m) => { if (m.isMesh) m.castShadow = m.receiveShadow = true; });
  return g;
}

// what the effects read off the model, in holder space
const M = { h: 1, len: 1, wid: 1, minX: 0, maxX: 0, merged: null, surf: null, surfN: null, surfCount: 0, ready: false };
let modelObj = null, buildToken = 0;

async function loadModel(id) {
  const def = MODELS.find((m) => m.id === id) || MODELS[0];
  const token = ++buildToken;
  const obj = await def.build();
  if (token !== buildToken) return;
  if (modelObj) { holder.remove(modelObj); }
  const orient = new THREE.Group(); orient.add(obj); orient.rotation.y = def.yaw || 0;
  modelObj = orient; holder.add(orient);
  // normalise: one length along x, centred on x and z, standing on y = 0
  orient.scale.setScalar(1); orient.position.set(0, 0, 0);
  holder.updateMatrixWorld(true);
  let box = boxIn(orient);
  orient.scale.setScalar(MODEL_LEN / Math.max(0.01, box.max.x - box.min.x));
  holder.updateMatrixWorld(true);
  box = boxIn(orient);
  orient.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
  holder.updateMatrixWorld(true);
  box = boxIn(orient);
  M.h = box.max.y - box.min.y; M.len = box.max.x - box.min.x; M.wid = box.max.z - box.min.z;
  M.minX = box.min.x; M.maxX = box.max.x;
  const comY = M.h * 0.42;
  tumble.position.y = comY; holder.position.y = -comY;
  mergeModel(orient);
  M.ready = true;
  $("model").value = def.id;
}
// a box of an object's meshes in holder space (setFromObject is world space)
function boxIn(obj) {
  root.updateMatrixWorld(true);
  const inv = holder.matrixWorld.clone().invert(), box = new THREE.Box3(), tmp = new THREE.Box3();
  obj.traverse((m) => {
    if (!m.isMesh) return;
    if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    tmp.copy(m.geometry.boundingBox).applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld));
    box.union(tmp);
  });
  return box;
}
// the model as ONE geometry in holder space (positions and normals): what the
// shells and the ghosts draw with one draw call, and what the surface emitter
// samples, weighted by triangle area so a big panel gets its share
function mergeModel(obj) {
  root.updateMatrixWorld(true);
  const inv = holder.matrixWorld.clone().invert();
  const P = [], N = [];
  const mw = new THREE.Matrix4(), nm = new THREE.Matrix3(), a = V(), n = V();
  const addGeo = (geo, mat) => {
    nm.getNormalMatrix(mat);
    const pos = geo.attributes.position, nor = geo.attributes.normal, idx = geo.index;
    const cnt = idx ? idx.count : pos.count;
    for (let i = 0; i < cnt; i++) {
      const k = idx ? idx.getX(i) : i;
      a.fromBufferAttribute(pos, k).applyMatrix4(mat); P.push(a.x, a.y, a.z);
      if (nor) { n.fromBufferAttribute(nor, k).applyMatrix3(nm).normalize(); N.push(n.x, n.y, n.z); } else N.push(0, 1, 0);
    }
  };
  obj.traverse((m) => {
    if (!m.isMesh || !m.visible) return;
    if (m.isInstancedMesh) {
      const im = new THREE.Matrix4();
      for (let i = 0; i < m.count; i++) { m.getMatrixAt(i, im); addGeo(m.geometry, mw.multiplyMatrices(inv, m.matrixWorld).multiply(im)); }
    } else addGeo(m.geometry, mw.multiplyMatrices(inv, m.matrixWorld));
  });
  if (M.merged) M.merged.dispose();
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(N, 3));
  M.merged = g;
  // surface samples
  const tri = P.length / 9, cum = new Float32Array(tri);
  const A = V(), B = V(), C = V(), e1 = V(), e2 = V();
  let tot = 0;
  for (let t = 0; t < tri; t++) {
    A.fromArray(P, t * 9); B.fromArray(P, t * 9 + 3); C.fromArray(P, t * 9 + 6);
    tot += e1.subVectors(B, A).cross(e2.subVectors(C, A)).length() * 0.5; cum[t] = tot;
  }
  const S = 3000; M.surf = new Float32Array(S * 3); M.surfN = new Float32Array(S * 3); M.surfCount = S;
  for (let s = 0; s < S; s++) {
    const r = Math.random() * tot; let lo = 0, hi = tri - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
    A.fromArray(P, lo * 9); B.fromArray(P, lo * 9 + 3); C.fromArray(P, lo * 9 + 6);
    let u = Math.random(), v = Math.random(); if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const p = A.clone().addScaledVector(e1.subVectors(B, A), u).addScaledVector(e2.subVectors(C, A), v);
    const nn = e1.subVectors(B, A).cross(e2.subVectors(C, A)).normalize();
    // a face whose normal points into the body is flipped outward
    if (nn.dot(V(p.x, p.y - M.h / 2, p.z)) < 0) nn.negate();
    p.toArray(M.surf, s * 3); nn.toArray(M.surfN, s * 3);
  }
}

// =============================================================================
// THE WORLD AS EFFECTS SEE IT — refreshed every frame after the motion
// =============================================================================
const W = { C: V(), G: V(), FWD: V(1, 0, 0), UP: V(0, 1, 0), SIDE: V(0, 0, 1), DM: V(), VEL: V(), prevC: V(), mat: new THREE.Matrix4() };
const LP = (x, y, z, out = V()) => out.set(x, y, z).applyMatrix4(holder.matrixWorld);
function surfPoint(out, nOut) {
  const i = (Math.random() * M.surfCount) | 0;
  out.fromArray(M.surf, i * 3).applyMatrix4(holder.matrixWorld);
  if (nOut) nOut.fromArray(M.surfN, i * 3).transformDirection(holder.matrixWorld);
  return out;
}
function refreshWorld(dt) {
  root.updateMatrixWorld(true);
  W.mat.copy(holder.matrixWorld);
  W.prevC.copy(W.C);
  LP(0, M.h * 0.5, 0, W.C);
  W.G.set(root.position.x, 0.02, root.position.z);
  W.FWD.set(1, 0, 0).transformDirection(holder.matrixWorld);
  W.UP.set(0, 1, 0).transformDirection(holder.matrixWorld);
  W.SIDE.set(0, 0, 1).transformDirection(holder.matrixWorld);
  W.DM.subVectors(W.C, W.prevC);
  if (W.DM.length() > 2) W.DM.set(0, 0, 0);   // a model swap or a reset is not a move
  W.VEL.copy(W.DM).multiplyScalar(dt > 0 ? 1 / dt : 0);
}

// =============================================================================
// TEXTURES — every picture an effect wears, drawn here
// =============================================================================
function canvasTex(size, draw, srgb = false, h = size) {
  const c = document.createElement("canvas"); c.width = size; c.height = h;
  draw(c.getContext("2d"), size, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const radial = (stops) => (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  for (const [o, a] of stops) gr.addColorStop(o, `rgba(255,255,255,${a})`);
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
};
const TEX = {
  dot: canvasTex(64, radial([[0, 1], [0.25, 0.85], [0.6, 0.25], [1, 0]])),

// =============================================================================
// EFFECT LIFECYCLE — a shot plays for `dur`, a hold runs with k fading in
// and out (0..1) until stopped
// =============================================================================
const ACTIVE = [];
function shot(d) {
  const s = { t: 0, acc: {} };
  return { begin() { d.start && d.start(s); }, stop() {}, update(dt) {
    s.t += dt;
    if (s.t >= d.dur) { d.end && d.end(s); return false; }
    d.frame && d.frame(s, dt, s.t / d.dur); return true;
  }, kill() { d.end && d.end(s); } };
}
function hold(d) {
  const s = { t: 0, k: 0, on: true, acc: {} };
  return { begin() { d.start && d.start(s); }, stop() { s.on = false; }, update(dt) {
    s.t += dt;
    s.k = s.on ? Math.min(1, s.k + dt / 0.25) : s.k - dt / 0.4;
    if (s.k <= 0) { d.end && d.end(s); return false; }
    d.frame(s, dt, s.k); return true;
  }, kill() { d.end && d.end(s); } };
}

def("charge", "Charge and release", "shot", "Light is drawn in from all around, faster and faster, rings close on the machine and its core swells and flickers; then it lets go in a flash, a ring and a burst of streaks.", () => shot({ dur: 2.4, start(s) {

  s.light = lights.take(s); s.ring = 0; s.done = false;
}, frame(s, dt) {
  const T = 1.6, u = clamp(s.t / T, 0, 1);
  if (s.t < T) {
    emit(s, "in", lerp(40, 260, u), dt, () => {
      const d = V(rnd(), rnd(), rnd()).normalize(), r = rand(2.4, 3.4);

        c0: COL(0xffffff, 3), c1: COL(0x5fd8ff, 2.5), fin: 0.2,
        fn: (p) => { const dx = W.C.x - p.x, dy = W.C.y - p.y, dz = W.C.z - p.z, l = Math.hypot(dx, dy, dz); if (l < 0.25) return false;
          const sp = 2 + p.age * 9; p.vx = dx / l * sp; p.vy = dy / l * sp; p.vz = dz / l * sp; } });
    });
    s.ring -= dt;
    if (s.ring <= 0) { s.ring = lerp(0.4, 0.18, u); wave({ at: W.G, r0: 3.2, r1: 0.3, life: 0.45, col: COL(0x7fe3ff, 2), th0: 0.06, th1: 0.3, follow: 1 }); }
    const f = 0.85 + 0.15 * Math.sin(s.t * 40);
    s.core.position.copy(W.C); s.core.quaternion.copy(camera.quaternion);
    const r = lerp(0.2, 0.9, u * u) * f; s.core.scale.set(r * 2, r * 2, 1);
    s.core.material.uniforms.uA.value = 0.3 + 0.7 * u;
    s.shell.sync(1.05); s.shell.u.uA.value = 0.55 * u * f;
    if (s.light) { s.light.position.copy(W.C); s.light.color.set(0x8fe8ff); s.light.intensity = 25 * u * f; }
    shake(0.08 * u);
  } else if (!s.done) {
    s.done = true; s.core.visible = false; s.shell.u.uA.value = 0;
    if (s.light) { lights.free(s.light); s.light = null; }
    wave({ at: W.C, face: "cam", mode: 1, r0: 1, r1: 6, life: 0.25, col: COL(0xeaffff, 4) });

        c0: COL(0xffffff, 4), c1: COL(0x5fd8ff, 2) });

    lights.flash(W.C, 0xbff4ff, 50, 0.4); shake(0.5);
  }
}, end(s) { s.shell.dispose(); scene.remove(s.core); s.core.material.dispose(); if (s.light) lights.free(s.light); } }));

def("manga", "Manga impact", "shot", "A comic hit: a spiky yellow starburst pops over the machine, a ring of black action lines, a shouted word, a white flash and a few frames of hit-stop.", () => shot({ dur: 0.95, start(s) {
  const spr = (tex, order) => { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true })); m.renderOrder = order; scene.add(m); return m; };
  s.lines = spr(TEX_LINES, 20); s.burst = spr(TEX_BURST, 21); s.word = spr(wordTex(pick(MANGA_WORDS)), 22);
  s.burst.material.rotation = rnd(0.4); s.word.material.rotation = rnd(0.18);
  s.at = W.C.clone(); s.side = Math.random() < 0.5 ? -1 : 1;
  wave({ at: W.C, face: "cam", mode: 1, r0: 1, r1: 3.6, life: 0.16, col: COL(0xffffff, 4) });
  shake(0.45); hitStop = 0.1;
}, frame(s, dt, u) {
  const t = s.t;
  const pop = t < 0.07 ? easeOut(t / 0.07) * 1.15 : t < 0.14 ? lerp(1.15, 1, (t - 0.07) / 0.07) : 1;
  const out = 1 - clamp((t - 0.55) / 0.35, 0, 1);
  s.burst.position.copy(s.at); s.burst.scale.setScalar(2.8 * pop * (0.8 + 0.2 * out)); s.burst.material.opacity = out;
  s.lines.position.copy(s.at); s.lines.scale.setScalar(lerp(5.5, 7.5, easeOut(u))); s.lines.material.opacity = 1 - clamp((t - 0.3) / 0.35, 0, 1);
  const camRight = V(1, 0, 0).applyQuaternion(camera.quaternion);
  s.word.position.copy(s.at).addScaledVector(camRight, 1.5 * s.side).add(V(0, 1.1 + t * 0.4, 0));
  const wp = t < 0.1 ? 0 : t < 0.18 ? easeOut((t - 0.1) / 0.08) * 1.2 : 1;
  s.word.scale.set(2.6 * wp, 1.3 * wp, 1); s.word.material.opacity = out;
}, end(s) { for (const m of [s.lines, s.burst, s.word]) { scene.remove(m); m.material.dispose(); } s.word.material.map.dispose(); } }));

// =============================================================================
// FIRING, TOGGLING, THE SHOWREEL
// =============================================================================
const HOLD_PLAY = 3;         // seconds a sustained effect plays before it fades out
const RUNNING = new Map();   // id -> { inst, t }: the sustained effects playing
const btns = new Map();
function fire(id) {
  const f = FX.find((x) => x.id === id); if (!f || !M.ready) return;
  const b = btns.get(id);
  if (f.kind === "hold") {
    const cur = RUNNING.get(id);
    if (cur) cur.t = HOLD_PLAY;   // pressed again while it plays: it plays on
    else { const inst = f.make(); inst.begin(); ACTIVE.push(inst); RUNNING.set(id, { inst, t: HOLD_PLAY }); }
    b.classList.add("on");
  } else {
    const inst = f.make(); inst.begin(); ACTIVE.push(inst);
    b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 220);
  }
  showHud(f);
}
// a sustained effect's clock, on the simulation's time (the Time slider slows it too)
function stepRunning(dt) {
  for (const [id, r] of RUNNING) {
    r.t -= dt;
    if (r.t <= 0) { r.inst.stop(); RUNNING.delete(id); btns.get(id).classList.remove("on"); }
  }
}
function clearAll() {
  for (const [id, r] of RUNNING) { r.inst.stop(); btns.get(id).classList.remove("on"); }
  RUNNING.clear();
  reel = null; $("bReel").classList.remove("on");
}
function hardReset() {
  for (const a of ACTIVE) a.kill(); ACTIVE.length = 0; RUNNING.clear();
  for (const w of WAVES) { scene.remove(w.mesh); w.mesh.material.dispose(); } WAVES.length = 0;
  SPRITES.forEach((s) => s.clear()); CHUNKS.forEach((c) => c.clear()); LATER.length = 0;
  for (const b of btns.values()) b.classList.remove("on");
}
function showHud(f) { $("hudName").textContent = f.name; $("hudDesc").textContent = f.desc; }
let reel = null;
function stepReel(dt) {
  if (!reel) return;
  reel.t -= dt;
  if (reel.t > 0) return;
  const f = FX[reel.i++ % FX.length];
  fire(f.id); reel.t = f.kind === "hold" ? HOLD_PLAY + 0.6 : 2.4;
}

// =============================================================================
// MOTION
// =============================================================================
let motion = "still", mt = 0;
function setMotion(m) {
  motion = m; mt = 0; $("motion").value = m;
  const dx = -root.position.x, dz = -root.position.z;
  camera.position.x += dx; camera.position.z += dz; controls.target.x += dx; controls.target.z += dz;
  root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); hop.position.y = 0; tumble.rotation.set(0, 0, 0);
}
function stepMotion(dt) {
  mt += dt;
  hop.position.y = 0; tumble.rotation.set(0, 0, 0);
  if (motion === "turn") root.rotation.y += 0.6 * dt;
  else if (motion === "drive") {
    const R = 4, a = mt * 0.55, x = R * Math.cos(a), z = R * Math.sin(a);
    const dx = x - root.position.x, dz = z - root.position.z;
    root.position.set(x, 0, z);
    root.rotation.y = Math.atan2(-Math.cos(a), -Math.sin(a));   // nose (+x) along the velocity (−sin a, 0, cos a)
    camera.position.x += dx; camera.position.z += dz; controls.target.x += dx; controls.target.z += dz;
  } else if (motion === "hop") {
    const P = 2.4, n = Math.floor(mt / P), u = mt - n * P;
    if (u > 0.4 && u < 1.7) {
      const s = (u - 0.4) / 1.3; hop.position.y = 4 * 2.4 * s * (1 - s);
      const r = TAU * easeOutIn(s);
      if (n % 2 === 0) tumble.rotation.z = r; else tumble.rotation.x = r;
    }
  }
}
function easeOutIn(s) { return s < 0.5 ? 0.5 * Math.pow(s * 2, 0.8) : 1 - 0.5 * Math.pow((1 - s) * 2, 0.8); }

// =============================================================================
// THE LOOP
// =============================================================================
const clock = { t: 0 };
let timeScale = 1, last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
function step(dt) {
  dt *= timeScale;
  clock.t += dt;
  if (hitStop > 0) hitStop -= dt; else stepMotion(dt);
  refreshWorld(dt);
  for (let i = LATER.length - 1; i >= 0; i--) { LATER[i].d -= dt; if (LATER[i].d <= 0) { const f = LATER[i].fn; LATER.splice(i, 1); f(); } }
  stepReel(dt);
  stepRunning(dt);
  for (let i = ACTIVE.length - 1; i >= 0; i--) if (!ACTIVE[i].update(dt)) ACTIVE.splice(i, 1);
  SPRITES.forEach((s) => s.update(dt)); CHUNKS.forEach((c) => c.update(dt));
  for (let i = WAVES.length - 1; i >= 0; i--) if (!updWave(WAVES[i], dt)) { scene.remove(WAVES[i].mesh); WAVES[i].mesh.material.dispose(); WAVES.splice(i, 1); }
  lights.update(dt);
  shakeAmp *= Math.exp(-7 * dt);
}
function render() {
  SPRITES.forEach((s) => s.write()); CHUNKS.forEach((c) => c.write());
  controls.update();
  sun.position.copy(controls.target).add(SUN_OFF); sun.target.position.copy(controls.target);
  shakeOff.set(rnd(), rnd(), rnd()).multiplyScalar(shakeAmp * 0.25);
  camera.position.add(shakeOff);
  renderer.info.reset();
  composer.render();
  camera.position.sub(shakeOff);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!MANUAL && M.ready) step(dt);
  render();
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; stats(); }
  requestAnimationFrame(frame);
}
function stats() {
  const n = SPRITES.reduce((a, s) => a + s.list.length, 0) + CHUNKS.reduce((a, c) => a + c.list.length, 0);
  $("stats").textContent = `${fps.toFixed(0)} fps · ${n} particles · ${renderer.info.render.calls} draws\n` +
    `playing: ${[...RUNNING.keys()].map((id) => FX.find((f) => f.id === id).name).join(", ") || "none"}`;
}
function resize() {
  const r = $("stage").getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); composer.setSize(r.width, r.height);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

// =============================================================================
// THE PANEL
// =============================================================================
for (const m of MODELS) { const o = document.createElement("option"); o.value = m.id; o.textContent = m.name; $("model").appendChild(o); }
FX.forEach((f, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<i>${String(i + 1).padStart(2, "0")}</i>${f.name}`;
  b.onclick = () => fire(f.id);
  b.onmouseenter = () => { $("desc").innerHTML = `<b>${f.name}</b> · ${f.kind === "hold" ? "hold" : "shot"}<br>${f.desc}`; };
  btns.set(f.id, b);
  $(f.kind === "hold" ? "holds" : "shots").appendChild(b);
});
// #desc sits under the holds, at the foot of a panel that scrolls: if its height
// followed the effect hovered, a shorter text would clamp the scroll and slide
// every button down under the cursor between the hover and the click, and the
// click would land on nothing. Give it the height of the longest text, once.
{
  const d = $("desc"), keep = d.innerHTML; let h = 0;
  for (const f of FX) { d.innerHTML = `<b>${f.name}</b> · ${f.kind}<br>${f.desc}`; h = Math.max(h, d.offsetHeight); }
  d.innerHTML = keep; d.style.minHeight = h + "px";
}
$("model").onchange = async (e) => { hardReset(); M.ready = false; await loadModel(e.target.value); };
$("motion").onchange = (e) => setMotion(e.target.value);
$("amb").onchange = (e) => setAmb(e.target.value);
$("bloom").oninput = (e) => { bloom.strength = +e.target.value; $("vBloom").textContent = (+e.target.value).toFixed(2); };
$("time").oninput = (e) => { timeScale = +e.target.value; $("vTime").textContent = "×" + (+e.target.value).toFixed(2); };
$("bClear").onclick = clearAll;
$("bReel").onclick = () => {
  if (reel) { clearAll(); return; }
  clearAll(); reel = { i: 0, t: 0 }; $("bReel").classList.add("on");
};

// Link every shader before the first click: all twenty effects run together,
// off the clock, for the length of the longest shot, rendered as they go (a
// program is linked by the render that first meets its material), then the
// stage is wiped. With dispose a no-op, what was linked here stays linked.
function warmUp() {
  const m = motion;
  for (const f of FX) { const inst = f.make(); inst.begin(); ACTIVE.push(inst); }
  for (let i = 0; i < 36; i++) { step(0.1); render(); }
  hardReset(); shakeAmp = 0; hitStop = 0; setMotion(m);
}

// =============================================================================
// BOOT
// =============================================================================
setAmb(qs.get("amb") || "day");
resize();
await loadModel(qs.get("model") || "dozer-hero");
setMotion(qs.get("motion") || "still");
refreshWorld(0); refreshWorld(0);
warmUp();
for (const id of (qs.get("fx") || "").split(",").filter(Boolean)) fire(id);
requestAnimationFrame(frame);
window.__fx3d = {
  ready: () => M.ready, FX, fire, clearAll, setMotion, setAmb, camera, controls,
  tick(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) step(dt); render(); stats(); return SPRITES.reduce((a, s) => a + s.list.length, 0); }
};
</script>
