<style>
/* ===========================================================================
   LAB — LOW POLY DIRECTION. One object, many art directions: the hero
   bulldozer of lab/models/library.js (vehicle-dozer-hero) on a small diorama,
   and every layer of a low poly look on a knob, grouped by the five decisions
   a low poly direction is made of:

     1. THE PALETTE — the most critical choice. Seven roles on the machine
        (body, trim, dark, metal, glass, accent, light) and seven in the scene,
        and nothing else: a direction is a short list of colours, judged on
        its VALUES first (the value check turns the frame grey, and every
        swatch prints its lightness). Colours are VERTEX PAINT, not textures:
        each face carries its colour, a gradient top to bottom, a per-face
        jitter (the hand-painted variation) and a baked occlusion at the foot.
        A global hue / saturation / lightness shift and a harmony generator
        (complementary, analogous, triadic, split, mono) try completely
        different hues on the same values.
     2. THE SILHOUETTE — the dozer's proportions on one knob, real to toy to
        caricature, and its detail on another (0, 1, 2), with the triangle
        count beside it: a part that costs triangles and adds nothing to the
        silhouette is the "mid-poly by accident" to avoid. The silhouette
        check paints it black, and the glance inset shows it at icon size.
     3. SHADING — faceted (flat), creased (smooth under an angle, hard above)
        or soft (every normal smoothed: the PS1 / N64 look); diffuse only
        (Lambert), toon (2 to 5 steps), matte to satin PBR, or unlit with the
        light BAKED into the vertex colours. A key sun, a coloured ambient
        (warm light, blue or purple shadows), a rim light from behind.
     4. MATERIALS — no textures at all: roughness, the metal of the blade,
        what glows (lights, the accent, the glass).
     5. POST AND ATMOSPHERE — fog that takes the horizon's colour, SSAO
        (GTAO), ink (an inverted hull round the machine, depth creases),
        bloom, a grade in linear light with split toning, then on the
        display: pixelation, posterize, Bayer dither, a palette lock that
        snaps every pixel to the palette's own shades, a gradient map,
        vignette and grain.

   Twelve presets are twelve directions; CONTACT SHEET renders all of them on
   the same view, side by side, which is how one is picked. Hold Q to see the
   frame bare (no post). Copy settings hands the panel over as JSON.

   Served over HTTP only (make lab): three.js is an ES module, vendored in
   lab/vendor/three/ and named by the import map below.
   ?preset=N&cam=K&freeze=1 opens a state directly, ?sheet=1 the sheet.
   =========================================================================== */

.body { padding-top:8px; }

  syncPanel(); applyAll("preset");
}

// ---- the swatches: each colour and its VALUE (lightness, 0–100), because a
// palette that reads in grey reads in colour
function lightness(hex) { const c = new THREE.Color(hex); return Math.round(100 * (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) ** (1 / 2.2)); }
function updateSwatches() {
  const draw = (id, keys) => {
    const el = $(id); if (!el) return;
    el.classList.toggle("grey", P.check === "value");
    el.innerHTML = keys.map((k) => { const h = hexOf(k); return `<div title="${k} ${h}"><i style="background:${h}"></i>${lightness(h)}</div>`; }).join("");
  };
  draw("swHero", HERO); draw("swScene", SCENE);
}

// ---- the harmony generator: new hues on a value structure that already works
// (a light body, a darker trim, a near-black, a neutral metal, a contrasting
// accent), so the palette changes and the picture still reads
function harmony(hueOnly) {
  if (hueOnly) {
    // the same palette, turned round the wheel: every value kept
    P.hueShift = Math.round(Math.random() * 300 - 150);
    syncPanel(); markCustom(); applyAll("palette"); return;
  }
  const h0 = Math.random() * 360;
  const off = { complementary: [0, 180, 20, 200], analogous: [0, 35, -30, 15], triadic: [0, 120, 240, 60], split: [0, 150, 210, 30], mono: [0, 0, 8, -8] }[P.scheme];
  const j = () => (Math.random() - 0.5) * 0.06;
  const hx = (d, s, l) => "#" + new THREE.Color().setHSL((((h0 + d) % 360) + 360) % 360 / 360, clamp(s + j(), 0, 1), clamp(l + j(), 0, 1), THREE.SRGBColorSpace).getHexString(THREE.SRGBColorSpace);
  Object.assign(P, {
    body: hx(off[0], 0.72, 0.56), trim: hx(off[0] + 6, 0.62, 0.42), dark: hx(off[1], 0.22, 0.15), metal: hx(off[1], 0.08, 0.62),
    glass: hx(off[1], 0.45, 0.32), accent: hx(off[1], 0.8, 0.5),
    ground: hx(off[2], 0.35, 0.55), dirt: hx(off[2] + 15, 0.35, 0.4), earth: hx(off[2] + 10, 0.3, 0.27), foliage: hx(off[3], 0.45, 0.33),
    rock: hx(off[3], 0.07, 0.6), skyTop: hx(off[1] + 10, 0.45, 0.72), skyHor: hx(off[1] + 30, 0.3, 0.9),
    hemiSky: hx(off[1] + 10, 0.35, 0.8), hemiGround: hx(off[1], 0.3, 0.3), hueShift: 0, satMul: 1, valAdd: 0
  });
  syncPanel(); markCustom(); applyAll("palette");
}

// =============================================================================
// RESIZE, STATS, THE GLANCE INSET, THE CONTACT SHEET
// =============================================================================
function resize() {
  const st = $("stage"), aw = st.clientWidth - 40, ah = st.clientHeight - 40;
  if (P.frame === "portrait") { H = ah; W = Math.round(H * 9 / 16); if (W > aw) { W = aw; H = Math.round(W * 16 / 9); } }
  else if (P.frame === "square") { W = H = Math.min(aw, ah); }
  else { W = aw; H = ah; }
  W = Math.max(200, W); H = Math.max(200, H);
  renderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix();
  buildComposer();
}
new ResizeObserver(() => resize()).observe($("stage"));

let fps = 60, lastT = performance.now();
function updateStats() {
  $("stats").textContent = `dozer ${Math.round(triCount).toLocaleString("en")} tris · ${P.mat}, ${P.normals}\n`;
  $("stats").textContent += `${Math.round(fps)} fps · ${renderer.info.render.calls} draw calls`;
}
$("stats").style.whiteSpace = "pre";

const glance = $("glance"), gctx = glance.getContext("2d");
function drawGlance() {
  const w = P.glance;
  glance.style.display = $("glanceTag").style.display = w > 0 ? "block" : "none";
  if (!w) return;
  const h = Math.round(w * H / W);
  if (glance.width !== w || glance.height !== h) { glance.width = w; glance.height = h; glance.style.width = w + "px"; glance.style.height = h + "px"; }
  $("glanceTag").style.bottom = (30 + h + 6) + "px";
  gctx.imageSmoothingQuality = "high";
  gctx.drawImage(renderer.domElement, 0, 0, w, h);
}

// the silhouette check: the machine in black on a light ground, nothing else
const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const silBg = new THREE.Color(0xf2efe8);
function renderSilhouette() {
  const vis = [plinthGroup.visible, propsGroup.visible, blob.visible, scene.background, scene.fog];
  plinthGroup.visible = propsGroup.visible = blob.visible = false;
  for (const h of hulls) h.visible = false;
  scene.background = silBg; scene.fog = null; scene.overrideMaterial = blackMat;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.render(scene, camera);
  scene.overrideMaterial = null;
  [plinthGroup.visible, propsGroup.visible, blob.visible, scene.background, scene.fog] = vis;
  for (const h of hulls) h.visible = P.hull > 0;
  renderer.toneMapping = TONES[P.tone];
}

let bare = false;
addEventListener("keydown", (e) => { if (e.key === "q" || e.key === "Q") bare = true; });
addEventListener("keyup", (e) => { if (e.key === "q" || e.key === "Q") bare = false; });

function renderFrame() {
  updateFog();
  renderer.info.reset();
  if (P.check === "silhouette") renderSilhouette();
  else if (bare) renderer.render(scene, camera);
  else composer.render();
  drawGlance();
  $("mode").textContent = P.check === "silhouette" ? "Silhouette check" : P.check === "value" ? "Value check" : bare ? "Bare (no post)" : "";
}

async function contactSheet() {
  const sheet = $("sheet"), grid = $("grid");
  sheet.classList.add("on"); grid.innerHTML = "";
  const saved = { P: Object.assign({}, P), idx: presetIdx }, spin = controls.autoRotate;
  controls.autoRotate = false;
  const s = Math.min(W, H), cut = document.createElement("canvas"); cut.width = cut.height = 320;
  const cc = cut.getContext("2d");
  for (let i = 0; i < PRESETS.length; i++) {
    const keep = { cam: P.cam, fov: P.fov, spin: false, frame: P.frame, check: "render", glance: 0 };
    P = Object.assign({}, BASE, PRESETS[i], keep); delete P.name; delete P.note;
    applyAll("sheet");
    renderer.info.reset(); updateFog(); composer.render();
    cc.drawImage(renderer.domElement, (W - s) / 2 * renderer.getPixelRatio(), (H - s) / 2 * renderer.getPixelRatio(), s * renderer.getPixelRatio(), s * renderer.getPixelRatio(), 0, 0, 320, 320);
    const fig = document.createElement("figure");
    fig.innerHTML = `<img src="${cut.toDataURL("image/jpeg", 0.88)}"><figcaption>${PRESETS[i].name}<small>${PRESETS[i].mat}, ${PRESETS[i].normals}${PRESETS[i].pixel > 1 ? ", pixels" : ""}</small></figcaption>`;
    fig.onclick = () => { sheet.classList.remove("on"); setPreset(i); };
    grid.appendChild(fig);
    await new Promise((r) => setTimeout(r, 0));
  }
  P = saved.P; presetIdx = saved.idx; controls.autoRotate = spin;
  syncPanel(); applyAll("sheet");
}
$("bSheet").onclick = contactSheet;
$("bSheetClose").onclick = () => $("sheet").classList.remove("on");
$("bCopy").onclick = () => { const t = JSON.stringify(P, null, 1); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => prompt("Settings", t)); };
$("bPaste").onclick = () => {
  const t = prompt("Paste settings (JSON)"); if (!t) return;
  try { P = Object.assign({}, BASE, JSON.parse(t)); presetIdx = -1; syncPanel(); applyAll("preset"); } catch (e) { alert("Not valid JSON"); }
};
$("bReset").onclick = () => setPreset(Math.max(0, presetIdx));

// =============================================================================
// BOOT AND LOOP
// =============================================================================
buildPanel();
buildMats();
resize();
syncPanel();
applyAll();
if (qs.get("sheet") === "1") contactSheet();

function loop(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  controls.update();
  renderFrame();
  if (Math.floor(t / 500) !== Math.floor((t - dt * 1000) / 500)) updateStats();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__dir = { ready: true, P: () => P, gtao: () => gtaoPass, composer: () => composer, camera, set: (o) => { Object.assign(P, o); syncPanel(); applyAll("preset"); }, preset: setPreset, scene, renderer, render: renderFrame, tris: () => triCount };
</script>
</body>
</html>
