<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — cards editor</title>
<meta name="lab-group" content="tools">
<meta name="lab-game" content="pawko">
<style>
/* ===========================================================================
   PAWKO — THE PATCH CARD, composed. The second round of lab/pawko-cards.html
   picked one look out of nine: the embroidered PATCH (woven cloth in the
   kind's colour, a stitched seam, a rim in the rarity's thread, an iron-on
   badge over a corner, a price tag on a string for the rarity, a woven label
   for the name). This page is where that look is tuned rather than chosen:
   every measure of it is a knob — where the badge sits and how far it hangs
   off, which edge the price tag hangs from and at what angle, how wide the
   label runs, the sizes of the name, the kind, the rarity and the
   description, the threads and the papers.

   HOW IT IS BUILT. The rules of the look (<style id="patch-rules">) never
   change: every measure in them is a custom property. The panel writes those
   properties into <style id="patch-vars">, scoped `.pk-card.s-patch`, and
   COPY CSS hands over the two blocks together — which is exactly what moves
   into games/pawko/skin.css. COPY SETTINGS is the panel's state as JSON, the
   one thing a CSS copy cannot carry back into this page (the corner picked,
   the edge picked: the CSS holds the positions they produced).

   The properties are declared ON THE CARD and not on the page, because a
   value like `var(--r)` is resolved where it is declared: on the card, the
   rarity is that card's.

   THE CARD'S STRUCTURE is the one lab/pawko-cards.html introduced (a body
   that clips, everything else free to leave the card), plus one node:
   .pk-desc, what the card does, which the round's big card and the
   collection write under the card today and which this page can sew onto it.

   Casing: every string is written in normal case; the name, the kind and the
   rarity are shouted through this page's copy of the motor's `upper()`
   (button.html), the description stays in normal case — so its floor is
   20 px bold (CLAUDE.md, hard constraint 8), which its slider starts at.
   =========================================================================== */

@font-face { font-family:"Baloo 2"; src:url("../assets/motor/font/baloo2.woff2") format("woff2"); font-weight:400 800; }
:root { --font:"Baloo 2", ui-rounded, "Trebuchet MS", Roboto, sans-serif; }

* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:#0b0b12; }
body {
  min-height:100vh; display:flex; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* ---- PANEL ---------------------------------------------------------------- */
#panel {
  flex:0 0 320px; padding:18px 18px 40px; background:#12121c; border-right:1px solid #23233a;
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:10;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel p.hint { margin:6px 0 14px; font-weight:500; font-size:12px; color:#8b8ba7; }
details { border:1px solid #23233a; border-radius:10px; margin-bottom:8px; background:#0f0f18; }
summary {
  cursor:pointer; list-style:none; padding:9px 12px; font-size:13px; color:#e8e6f5;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
summary::-webkit-details-marker { display:none; }
summary::after { content:"▸"; color:#6f6a90; transition:transform .15s; }
details[open] > summary::after { transform:rotate(90deg); }
summary small { margin-left:auto; color:#6f6a90; font-weight:500; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.knobs { padding:2px 12px 10px; }
.row { margin-bottom:11px; }
.row > label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:4px; accent-color:#ffb830; }
.row select {
  width:100%; margin-top:4px; padding:5px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit; font-size:12px;
}
.row input[type=color] { width:100%; height:28px; margin-top:4px; border:1px solid #2c2c47; border-radius:6px; background:#0b0b12; padding:2px; }
.seg { display:flex; flex-wrap:wrap; gap:3px; margin-top:4px; background:#1a1a28; border:1px solid #2c2c44; border-radius:9px; padding:3px; }
.seg button {
  flex:1; appearance:none; border:0; background:none; color:#8b8ba7; cursor:pointer;
  font:inherit; font-size:12px; padding:4px 6px; border-radius:6px; white-space:nowrap;
}
.seg button.on { background:#ffb830; color:#2a1402; }
.colors { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
.colors .row { margin-bottom:4px; }
.act {
  width:100%; margin-top:6px; padding:8px 10px;
  background:#ffb830; color:#2a1402; border:0; border-radius:8px;
  font:700 13px/1 inherit; letter-spacing:.5px; cursor:pointer;
}
.act.ghost { background:#23233a; color:#e8e6f5; }
.acts { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
#note { margin-top:8px; font-size:12px; font-weight:500; color:#9c9cba; min-height:18px; }

/* ---- STAGE ---------------------------------------------------------------- */
#stage {
  flex:1; min-width:0; padding:20px 20px 80px;
  display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:4px 0;
  background:#1a050c center/cover no-repeat;
}
#stage.bg-round { background-image:linear-gradient(rgba(10,2,6,.55),rgba(10,2,6,.55)), url("../assets/image/embed/pawko-background-phone-01.webp"); background-attachment:fixed; }
#stage.bg-home  { background-image:linear-gradient(rgba(6,9,26,.5),rgba(6,9,26,.5)), url("../assets/image/embed/pawko-background-home.webp"); background-attachment:fixed; }
#stage.bg-flat  { background:#2a0a14; }
.cell { display:flex; flex-direction:column; align-items:center; }

/* =========================================================================
   THE CARD — the base, as lab/pawko-cards.html has it
   ========================================================================= */
.pk-cbox { position:relative; flex:0 0 auto; }
.pk-card {
  position:absolute; left:0; top:0; width:300px; height:420px; transform-origin:0 0;
  transform:scale(var(--sk, 1));
  font-family:var(--font); font-weight:800; color:#fff;
}
.pk-card > * { position:absolute; }
.pk-back { inset:0; border-radius:28px; overflow:hidden; background:#2a0612; }
.pk-back > * { position:absolute; inset:0; }
.pk-frame { inset:0; border-radius:28px; pointer-events:none; }
.pk-deco { display:none; }
.pk-art { left:0; right:0; top:60px; height:190px; display:flex; align-items:center; justify-content:center; }
.pk-art img { max-width:190px; max-height:180px; display:block; }
.pk-plate {
  left:16px; right:16px; top:266px; height:106px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center;
}
.pk-name { font-size:34px; line-height:1; letter-spacing:.5px; }
.pk-kind { font-size:20px; letter-spacing:3px; line-height:1.1; }
.pk-tag { left:16px; top:16px; width:64px; height:64px; display:flex; align-items:center; justify-content:center; }
.pk-tag svg { position:relative; z-index:1; width:36px; height:36px; fill:currentColor; stroke:currentColor; }
.pk-rar { display:none; align-items:center; white-space:nowrap; font-size:20px; letter-spacing:2px; line-height:1; }
.pk-num { right:16px; top:18px; font-size:28px; line-height:1.1; }
.pk-desc { display:none; }
.pk-back { z-index:0; } .pk-frame { z-index:1; } .pk-art { z-index:2; }
.pk-plate { z-index:3; } .pk-desc { z-index:3; } .pk-tag { z-index:4; } .pk-rar { z-index:5; } .pk-num { z-index:5; }
@keyframes rb-move { from { background-position:0% 50%; } to { background-position:300% 50%; } }
.pk-card.ghost .pk-art img { filter:brightness(0) invert(1) !important; opacity:.42; }
.pk-card.ghost .pk-tag { filter:grayscale(1) brightness(.8); }
</style>

<!-- THE VARIABLES — written by the panel (see `vars()` below) -->
<style id="patch-vars"></style>

<!-- THE RULES OF THE PATCH — never edited by the panel: every measure is a
     variable of the block above. This block and that one are COPY CSS. -->
<style id="patch-rules">
.pk-card.s-patch { transform:scale(var(--sk, 1)) rotate(var(--pt-tilt)); }
.pk-card.s-patch .pk-back {
  border-radius:var(--pt-radius);
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,var(--pt-twill)) 0 3px, transparent 3px 6px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,var(--pt-twill)) 0 3px, transparent 3px 6px),
    linear-gradient(180deg, var(--pt-cloth-a), var(--pt-cloth-b));
  box-shadow:0 14px 26px rgba(0,0,0,.45);
}
.pk-card.s-patch .pk-glow { background:radial-gradient(circle at 50% 36%, rgba(255,255,255,var(--pt-glow)), transparent 50%); }
/* the seam, sewn round the cloth */
.pk-card.s-patch .pk-back::after {
  content:""; position:absolute; inset:var(--pt-seam-inset);
  border:var(--pt-seam-w) var(--pt-seam-style) var(--pt-seam-color);
  border-radius:max(6px, calc(var(--pt-radius) - var(--pt-seam-inset)));
}
/* the rim, in the rarity's thread — a rainbow that moves on an epic */
.pk-card.s-patch .pk-frame {
  border-radius:var(--pt-radius); padding:var(--pt-rim); background:var(--pt-rim-bg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.pk-card.s-patch.r-4 .pk-frame { background:var(--rbg); background-size:300% 100%; animation:rb-move 5s linear infinite; }
/* the object */
.pk-card.s-patch .pk-art { top:var(--art-top); height:var(--art-size); }
.pk-card.s-patch .pk-art img { max-width:var(--art-size); max-height:var(--art-size); filter:var(--art-filter); }
/* the badge: the kind, ironed on over a corner */
.pk-card.s-patch .pk-tag {
  left:var(--tag-l); top:var(--tag-t); width:var(--tag-size); height:var(--tag-size);
  border-radius:var(--tag-radius); color:#200010; transform:rotate(var(--tag-rot));
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 3px, transparent 3px 6px), color-mix(in srgb, var(--k) var(--tag-tint), #fff);
  box-shadow:0 0 0 var(--tag-ring) var(--tag-paper), 0 0 0 calc(var(--tag-ring) + 3px) color-mix(in srgb, var(--k) 50%, #000), 0 10px 16px rgba(0,0,0,.35);
}
.pk-card.s-patch .pk-tag::after { content:""; position:absolute; inset:7px; border-radius:inherit; border:2px dashed rgba(32,0,16,.5); }
.pk-card.s-patch .pk-tag svg { width:calc(var(--tag-size) * .46); height:calc(var(--tag-size) * .46); }
/* the rarity: a price tag hanging off an edge on its string */
.pk-card.s-patch .pk-rar {
  display:flex; left:var(--rt-x); top:var(--rt-y); height:var(--rt-h);
  transform-origin:0 50%; transform:translateY(-50%) rotate(var(--rt-rot));
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.4));
}
.pk-card.s-patch .pk-rar::before {
  content:""; flex:0 0 var(--rt-str); height:12px;
  background:radial-gradient(circle at 5px 50%, #5a3a2a 0 4px, transparent 4.5px), linear-gradient(var(--rt-paper), var(--rt-paper)) center / 100% 3px no-repeat;
}
.pk-card.s-patch .pk-rar span {
  position:relative; display:flex; align-items:center; height:100%;
  padding:3px 20px 0 calc(var(--rt-band) + 28px); color:#200010; font-size:var(--rt-fs);
  background:var(--rt-paper); clip-path:polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%);
}
.pk-card.s-patch .pk-rar span::before { content:""; position:absolute; left:18px; top:0; bottom:0; width:var(--rt-band); background:var(--rbg); background-size:300% 100%; }
.pk-card.s-patch.r-4 .pk-rar span::before { animation:rb-move 4s linear infinite; }
.pk-card.s-patch .pk-rar span::after { content:""; position:absolute; left:8px; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:#5a3a2a; }
.pk-card.s-patch .pk-rar em { font-style:normal; display:inline-block; transform:rotate(var(--rt-flip)); }
/* the name, on a woven label */
.pk-card.s-patch .pk-plate {
  left:var(--pl-l); right:var(--pl-r); top:var(--pl-top); height:var(--pl-h);
  transform:rotate(var(--pl-rot)); filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));
}
.pk-card.s-patch .pk-plate::before { content:""; position:absolute; inset:0; z-index:-1; background:var(--pl-paper); clip-path:var(--pl-clip); }
.pk-card.s-patch .pk-plate::after {
  content:""; position:absolute; inset:7px 26px;
  border-top:2px dashed var(--pl-stitch); border-bottom:2px dashed var(--pl-stitch);
}
.pk-card.s-patch .pk-name { font-size:var(--pl-name); color:color-mix(in srgb, var(--k) var(--pl-ink), #200010); }
.pk-card.s-patch .pk-kind { display:var(--pl-kind-show); font-size:var(--pl-kind); color:color-mix(in srgb, var(--k) 70%, #200010); }
/* what the card does, sewn on: in thread on the cloth, or on a label of its own */
.pk-card.s-patch .pk-desc {
  display:var(--ds-show); left:var(--ds-side); right:var(--ds-side); top:var(--ds-top);
  padding:var(--ds-pad); border-radius:10px; background:var(--ds-bg); color:var(--ds-ink);
  font:700 var(--ds-fs)/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-align:center; text-shadow:var(--ds-shadow); box-shadow:var(--ds-box);
}
/* the count */
.pk-card.s-patch .pk-num {
  left:var(--num-l); right:var(--num-r); top:var(--num-t); bottom:var(--num-b);
  background:#200010; color:#fff8e6; border-radius:14px; padding:2px 12px 0; font-size:var(--num-fs);
}
</style>
</head>
<body>

<div id="panel">
  <h1>Pawko patch</h1>
  <p class="hint">Tune the patch card picked in pawko-cards.html: where every piece sits, how far it hangs off, its angle, its size and its colours.</p>

  <div class="row">
    <label for="preset">preset</label>
    <select id="preset"></select>
  </div>
  <div id="knobs"></div>

  <div class="acts">
    <button class="act" id="copy-css">Copy CSS</button>
    <button class="act ghost" id="copy-set">Copy settings</button>
  </div>
  <div class="acts">
    <button class="act ghost" id="paste-set">Paste settings</button>
    <button class="act ghost" id="reset">Reset</button>
  </div>
  <div id="note"></div>
</div>

<div id="stage" class="bg-round"></div>

  /* The motor's upper(), copied from button.html. */
  function upper(str) {
    var FROM = "ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝŸ";
    var TO = "AAAAAACEEEEIIIINOOOOOOUUUUYY";
    var PAIR = { "Æ": "AE", "Œ": "OE", "ß": "SS" };
    var shouted = String(str == null ? "" : str).replace(
      /[a-zß-öø-ÿœ]+/g, function (run, at, whole) {
        var b = at > 0 ? whole.charAt(at - 1) : "", a = whole.charAt(at + run.length);
        if ((b >= "0" && b <= "9") || (a >= "0" && a <= "9")) return run;
        return run.toUpperCase();
      });
    var out = "", i, c, k;
    for (i = 0; i < shouted.length; i++) {
      c = shouted.charAt(i);
      if (PAIR[c]) { out += PAIR[c]; continue; }
      k = FROM.indexOf(c);
      out += k < 0 ? c : TO.charAt(k);
    }
    return out;
  }

  const $ = function (id) { return document.getElementById(id); };

  /* =========================================================================
     THE VARIABLES, out of the knobs. Positions are worked out here (a corner,
     an edge, an angle), so the rules only ever read numbers.
     ========================================================================= */
  function vars() {
    const V = {}, W = 300, H = 420;
    V["--pt-radius"] = px(S.radius);
    V["--pt-rim"] = px(S.rim);
    V["--pt-rim-bg"] = S.rimStyle === "solid" ? "var(--r)"

    V["--tag-size"] = px(ts);
    V["--tag-l"] = px(S.tagCorner.indexOf("l") >= 0 ? -to : W - ts + to);
    V["--tag-t"] = px(S.tagCorner.indexOf("t") >= 0 ? -to : H - ts + to);
    V["--tag-rot"] = S.tagRot + "deg";
    V["--tag-radius"] = S.tagShape === "circle" ? "50%" : "22%";
    V["--tag-ring"] = px(S.tagRing);
    V["--tag-tint"] = S.tagTint + "%";
    V["--tag-paper"] = S.paperTag;

    // the price tag: pinned at a point of an edge, hanging outward
    const a = S.rtAlong / 100, p = S.rtPin;
    let x, y, th;
    if (S.rtEdge === "right")      { x = W - p; y = a * H; th = 0; }
    else if (S.rtEdge === "left")  { x = p; y = a * H; th = 180; }
    else if (S.rtEdge === "top")   { x = a * W; y = p; th = -90; }
    else                            { x = a * W; y = H - p; th = 90; }
    let rot = th + S.rtRot;
    let n = ((rot % 360) + 540) % 360 - 180;           // into (-180, 180]
    V["--rt-x"] = px(x); V["--rt-y"] = px(y);
    V["--rt-rot"] = rot + "deg";
    V["--rt-flip"] = Math.abs(n) > 90 ? "180deg" : "0deg";   // the word is never upside down
    V["--rt-str"] = px(S.rtStr);
    V["--rt-h"] = px(S.rtH);
    V["--rt-fs"] = px(S.rtFs);
    V["--rt-band"] = px(S.rtBand);
    V["--rt-paper"] = S.paperRt;

    V["--pl-l"] = px(-S.plOut); V["--pl-r"] = px(-S.plOut);

    V["--pl-ink"] = S.plInk + "%";

    // the description
    const label = S.dsShow === "label";
    V["--ds-show"] = S.dsShow === "off" ? "none" : "block";
    V["--ds-top"] = px(S.dsWhere === "under" ? H + S.dsGap : S.plTop + S.plH + S.dsGap);
    V["--ds-side"] = px(S.dsSide);
    V["--ds-fs"] = px(S.dsFs);
    V["--ds-pad"] = label ? "10px 14px" : "0";
    V["--ds-bg"] = label ? S.paperPl : "transparent";
    V["--ds-ink"] = label ? "#200010" : S.dsInk;
    V["--ds-shadow"] = label ? "none" : "0 2px 0 rgba(0,0,0,.45)";
    V["--ds-box"] = label ? "0 8px 12px rgba(0,0,0,.35), inset 0 0 0 2px " + hexA(S.plStitch, 0.25) : "none";

    const P = S.paperTag;
    V["--art-filter"] = S.artLine === "thread"
      ? "drop-shadow(3px 0 0 " + P + ") drop-shadow(-3px 0 0 " + P + ") drop-shadow(0 3px 0 " + P + ") drop-shadow(0 -3px 0 " + P + ") drop-shadow(0 10px 10px rgba(0,0,0,.35))"
      : S.artLine === "shadow" ? "drop-shadow(3px 3px 0 rgba(0,0,0,.25)) drop-shadow(0 12px 14px rgba(0,0,0,.3))" : "none";

    // the count
    const ni = px(S.numIn);

    V["--num-r"] = S.numCorner.indexOf("r") >= 0 ? ni : "auto";
    V["--num-t"] = S.numCorner.indexOf("t") >= 0 ? ni : "auto";
    V["--num-b"] = S.numCorner.indexOf("b") >= 0 ? ni : "auto";
    V["--num-fs"] = px(S.numFs);
    return V;
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";

  function varsCss() {

  /* ---- one card: the structure of lab/pawko-cards.html, plus .pk-desc ------ */
  function kindColor(k) { return S[{ peg: "cPeg", wave: "cWave", charm: "cCharm", meta: "cMeta" }[k]]; }

      '<div class="pk-desc"></div>' +

      '<div class="pk-rar"><span><em></em></span></div>' +

    n.querySelector(".pk-desc").textContent = ghost ? "" : c.desc[lang];

  /* ---- paint --------------------------------------------------------------- */
  function paint() {
    $("patch-vars").textContent = varsCss();
    stage.className = "bg-" + S.ground;
    stage.innerHTML = "";
    const keys = S.view === "single" ? [S.card] : SAMPLE, w = S.width, k = w / 300;
    keys.forEach(function (key) {
      const cell = document.createElement("div");
      cell.className = "cell";
      /* room for what leaves the card, side by side, worked out from what does */
      const rt = S.rtStr + 170 - S.rtPin;                    // a string and a tag, flat
      const tagOn = function (c) { return S.tagCorner.indexOf(c) >= 0 ? S.tagOut + 14 : 0; };
      const side = function (edge, c) { return Math.max(24, tagOn(c), S.plOut + 10, S.rtEdge === edge ? rt : 0); };
      const top = Math.max(30, tagOn("t"), -S.artTop + 16, S.rtEdge === "top" ? rt : 0);
      const bottom = Math.max(40, tagOn("b"), S.rtEdge === "bottom" ? rt : 0,
                              S.dsShow !== "off" && S.dsWhere === "under" ? 150 : 0);
      cell.style.padding = [top, side("right", "r"), bottom, side("left", "l")].map(function (v) { return Math.round(v * k) + "px"; }).join(" ");
      cell.appendChild(cardNode(CARDS[key], w, S.ghost === "on"));
      stage.appendChild(cell);
    });
    summaries();
    save();
  }

  /* =========================================================================
     THE PANEL, built from KNOBS
     ========================================================================= */
  const groups = {}, inputs = {};
  KNOBS.forEach(function (K) {
    const key = K[0], group = K[1], label = K[2], kind = K[3];
    if (!groups[group]) {
      const d = document.createElement("details");
      if (group === "Preview" || group === "Badge") d.open = true;
      d.innerHTML = "<summary>" + group + "<small></small></summary><div class='knobs" + (group === "Colours" ? " colors" : "") + "'></div>";
      $("knobs").appendChild(d);
      groups[group] = { box: d.querySelector(".knobs"), sum: d.querySelector("small"), keys: [] };
    }
    groups[group].keys.push(K);
    const row = document.createElement("div");
    row.className = "row";
    if (kind === "range") {
      const r = K[4];
      row.innerHTML = "<label>" + label + " <b></b></label><input type='range' min='" + r[0] + "' max='" + r[1] + "' step='" + r[2] + "'>";
      const inp = row.querySelector("input"), out = row.querySelector("b");
      inp.addEventListener("input", function () { S[key] = +inp.value; out.textContent = inp.value + r[3]; paint(); });
      inputs[key] = function () { inp.value = S[key]; out.textContent = S[key] + r[3]; };
    } else if (kind === "seg") {
      row.innerHTML = "<label>" + label + "</label><div class='seg'></div>";
      const seg = row.querySelector(".seg");
      K[4].forEach(function (v, i) {
        const b = document.createElement("button");
        b.textContent = K[5][i];
        b.addEventListener("click", function () { S[key] = v; light(); paint(); });
        seg.appendChild(b);
      });
      inputs[key] = function () { [].forEach.call(seg.children, function (b, i) { b.classList.toggle("on", K[4][i] === S[key]); }); };
    } else if (kind === "color") {
      row.innerHTML = "<label>" + label + "</label><input type='color'>";
      const inp = row.querySelector("input");
      inp.addEventListener("input", function () { S[key] = inp.value; paint(); });
      inputs[key] = function () { inp.value = S[key]; };
    } else if (kind === "select") {
      row.innerHTML = "<label>" + label + "</label><select></select>";
      const sel = row.querySelector("select");
      DATA.forEach(function (r) {
        const o = document.createElement("option");
        o.value = r[0]; o.textContent = r[7] + " · " + KIND_NAME[r[1]].en + " · " + RAR_NAME[STEP[r[4]]].en.toLowerCase();
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { S[key] = sel.value; S.view = "single"; light(); paint(); });
      inputs[key] = function () { sel.value = S[key]; };
    }
    groups[group].box.appendChild(row);
  });
  function light() { Object.keys(inputs).forEach(function (k) { inputs[k](); }); }
  /* a closed group still says what it holds, on its header */
  function summaries() {
    const say = {
      Badge: function () { return S.tagCorner + " · " + S.tagSize + "px · " + S.tagRot + "°"; },
      "Rarity tag": function () { return S.rtEdge + " " + S.rtAlong + "% · " + S.rtRot + "°"; },
      "Name label": function () { return S.plEnds + " · +" + S.plOut + "px · " + S.plName + "px"; },
      Description: function () { return S.dsShow === "off" ? "not on the card" : S.dsShow + " · " + S.dsWhere + " · " + S.dsFs + "px"; },
      Object: function () { return S.artSize + "px at " + S.artTop; },
      Count: function () { return S.numCorner + " · " + S.numFs + "px"; },
      Cloth: function () { return S.rimStyle + " · r" + S.radius + " · " + S.tilt + "°"; },
      Colours: function () { return S.epicRb === "on" ? "rainbow epic" : "solid epic"; },
      Preview: function () { return S.view + " · " + S.width + "px · " + S.lang; }
    };
    Object.keys(groups).forEach(function (g) { groups[g].sum.textContent = say[g] ? say[g]() : ""; });
  }

  Object.keys(PRESETS).forEach(function (name) {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    $("preset").appendChild(o);
  });
  $("preset").value = "";
  $("preset").addEventListener("change", function () {
    const keep = { view: S.view, card: S.card, width: S.width, lang: S.lang, ground: S.ground, ghost: S.ghost };
    S = Object.assign({}, BASE, PRESETS[this.value], keep);
    light(); paint();
    note("Preset: " + this.value);
  });
  $("reset").addEventListener("click", function () { S = Object.assign({}, BASE); light(); paint(); note("Back to Round 2"); });

  /* COPY CSS: the variables as they stand and the rules that read them — the
     two blocks that move into games/pawko/skin.css together. */
  $("copy-css").addEventListener("click", function () {
    clip("/* PAWKO — THE PATCH CARD (lab/pawko-patch.html) */\n" + varsCss() + "\n" + $("patch-rules").textContent.trim() + "\n", "CSS copied");
  });
  /* COPY SETTINGS: the panel's own state, which a CSS copy cannot give back —
     and the kind and rarity colours, which are the game's KINDS and RARITY
     (games/pawko/game.js), data rather than style. */
  $("copy-set").addEventListener("click", function () {
    const out = {};
    Object.keys(S).forEach(function (k) { if (["view", "card", "width", "lang", "ground", "ghost"].indexOf(k) < 0) out[k] = S[k]; });
    clip(JSON.stringify(out, null, 2), "Settings copied");
  });
  $("paste-set").addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { note("The browser will not read the clipboard here."); return; }
    navigator.clipboard.readText().then(function (txt) {
      try { S = Object.assign({}, BASE, S, JSON.parse(txt)); light(); paint(); note("Settings pasted"); }
      catch (e) { note("That is not a settings block."); }
    }, function () { note("The browser refused to read the clipboard."); });
  });
  function clip(txt, ok) {
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { note(ok); }, function () { note("Copy refused by the browser."); });
    else note("Copy refused by the browser.");
  }
  function note(t) { $("note").textContent = t; }

  /* `#preset=<name>` opens on a preset, `&view=single&card=<key>` on one card —
     a link to a state, and what a headless shot asks for */
  (function () {
    const h = {};
    (location.hash.slice(1) || "").split("&").forEach(function (kv) { const p = kv.split("="); if (p[1]) h[p[0]] = decodeURIComponent(p[1]); });
    if (h.preset && PRESETS[h.preset]) S = Object.assign({}, BASE, PRESETS[h.preset]);
    ["view", "card", "lang", "ground", "ghost"].forEach(function (k) { if (h[k]) S[k] = h[k]; });
    if (h.width) S.width = +h.width;
  })();

  light();
  paint();
})();
</script>
</body>
</html>
