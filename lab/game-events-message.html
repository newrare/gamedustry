<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — game events message</title>
<meta name="lab-group" content="tools">
<style>
/* ===========================================================================
   EVENTS BENCH · MESSAGE — what a game SAYS, in one list, fired in that game's
   own build, and judged on the moment of the game it fires on.

   The scope is deliberately narrow, and it is the whole point of the page: the
   Pop callouts (`Pop.show` in the DOM, `Pop.text` on the canvas) and the
   Notify notices, in source order, grouped into the beat they fire together
   on. What the game PLAYS is the other page, lab/game-events-sound.html
   (/sound): the clips, their roles in the house kit, their volume and pitch.

   Everything else a beat does — Fx.burst / ring / shake / flash / freeze,
   HUD.punch, and `Overlay.vignette`, which is a coloured glow over the frame
   and not a notification — is juice with no words in it. There is nothing on
   it to read, re-style or re-word, so tools/lab/scan-events.mjs lists it and
   this page does not.

   The right column is the game's own web build TWICE, one under the other —
   once in English, once in French — with everything but the callout layers hidden:
   no backdrop, no menu, no round, no world, a flat ground. The build is there
   because it is the only honest source of the real Pop styles and the real
   SKIN; the backdrop is not, because a callout is reviewed for what it SAYS
   here. A row fires into both at once, so a French word that overflows its
   plate is seen under the English one that fits. `Pop.text` needs the frame
   pipeline, which is not turning, so the bench drives the three calls that
   pipeline would make and nothing more (see `juice`).

     REC           the stage becomes the real game, in English, playable. Every
                   Pop.show / Pop.text / Notify.say / Sound.* call the game makes
                   is caught at its call site (the stack's line in the built
                   game.<hash>.js, mapped back to games/<slug>/game.js through
                   /api/offset) and matched to its row. The canvas is sampled
                   all the time (REC_PRE kept); a callout or a notice with no
                   clip yet keeps that second and REC_POST more, encoded as a
                   webm and saved in lab/events-clips/<slug>/ (ignored by git —
                   playing again is how they are made again). The sound page
                   records its cues into the same place. Pop.text is not drawn
                   while recording, so the number is never baked into the
                   picture.
     LOOP (↻)      on a row with a clip, the clip plays behind both frames
                   (EN and FR), and at the instant the event fired it is fired
                   again — with what the row now says, so an edit is judged on
                   the real action. Everything else that fired in that window,
                   the cues included, fires with it at its own time, so the
                   moment is whole; a chip in the loop bar mutes one of them.
     EN            keep a callout's or a notice's words in English on the
                   French screen. It writes an entry whose French IS the
                   English into web.copy.fr.strings (tools/lab/keep-english.mjs,
                   on APPLY), which the copy desk counts as translated.

   What a clip cannot show: the DOM — the HUD, the callouts (which is the
   point: they are fired live over it) — and a painted backdrop the game lays
   UNDER its canvas (CONFIG.sceneArt): the canvas is drawn on the game's flat
   ground colour instead.

   A word the game BUILDS is run, not stubbed: `"x" + mult + Lang.t(" streak")`
   is evaluated inside each frame, so the French comes out of the very Lang.t
   the game wrapped around its own literal. What the bench cannot read — the
   round's locals, `mult`, `T2.name`, `cardName(c)` — are SLOTS, inputs under
   the row with a plausible value already in them (tools/lab/scan-events.mjs,
   textsOf): a tier is a pick of the table's own keys, a `.name` one of the
   names the source writes, a count a count. Whatever is typed there is the
   bench's and is never written back; it is kept per game in this browser.
   Under the slots, the row reads back what each frame was handed, EN and FR,
   and marks a French that came out identical to the English.

   Every row is editable — the style, the word, the sub, the anchor — so a
   change can be seen before it is written. A notice can also be turned into a
   callout: its first dropdown reads `notify`, and picking a Pop style there
   fires the row as that Pop.show, and apply rewrites the call (kind and icon
   dropped).

   APPLY is what makes it stick. What the rows changed goes to POST /api/apply
   (tools/lab/apply-events.mjs), which splices the arguments back into
   games/<slug>/game.js — one span at a time, so a multi-line call keeps its
   shape — writes the words kept in English into the manifest, and bumps the
   game's patch version. The save trips the server's watcher, the build is
   rebuilt, the page comes back on the change. An argument the game builds at
   runtime (`"+" + gain`) is REFUSED by name rather than overwritten with the
   bench's stand-in.

   A row carries no `copy` button and a beat no `play all`: the one way a change
   leaves this page is APPLY, and the one thing to copy is the beat's own
   `file:line`, which its header hands over on a click.

   Two icons sit on everything the bench can change. REVERT puts the element
   back where the source has it. TRASH deletes nothing by itself — it MARKS,
   the way every other change here is marked, so a removal is reviewed next to
   the rest of the plan, counted in the Apply badge, and taken back with the
   same revert as a typo.

   A line seen is CHECKED — the copy desk's tick — and the three actions
   (check, revert, remove) sit in ONE place on every card: the top-right corner
   of its header, out of the flow, so no wrap can move them. A card acts on its
   whole moment. The mark lands in lab/events-review.json against the call's
   checkId (tools/lab/scan-events.mjs): change the call and the mark no longer
   matches, so the line reads unchecked again. A game whose every callout and
   notice is checked turns green in the picker, and HIDE CHECKED leaves what
   is left.

   Served by `make events` (tools/lab/serve-events.mjs).
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  height:100vh; overflow:hidden;
  display:flex;
  background:#0b0b12;
  color:#e8e6f5;
  font:600 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* ---------------------------------------------------------------------------
   PANEL — one list: the bed, the pack, then the beats.
   --------------------------------------------------------------------------- */
#panel { flex:1 1 auto; min-width:420px; display:flex; flex-direction:column; background:#12121c; border-right:1px solid #23233a; }
#head { padding:16px 18px 14px; border-bottom:1px solid #23233a; }
#head h1 { font-size:15px; letter-spacing:1.5px; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
#head h1 small { font-weight:600; font-size:11px; letter-spacing:.5px; color:#8b8ba7; text-transform:none; }

select, input[type=text], input[type=number] {
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:7px;
  font:inherit; padding:7px 9px;
}
select:focus, input:focus { outline:none; border-color:#7ea6ff; }
/* The game picker is ours and not a <select>: the platform's popup draws its
   own tick on the selected entry, which reads as "checked" next to ours. Each
   entry is a dot (the game being edited), a tick (every line of THIS page
   checked) and the title, nothing else. */
#game-pick { position:relative; margin-top:12px; }
#game-pick .gp-btn {
  position:relative; display:flex; align-items:center; gap:8px; width:100%; text-align:left; cursor:pointer;
  padding:7px 28px 7px 9px; border:1px solid #2c2c47; border-radius:7px;
  background:#0b0b12; color:#e8e6f5; font-family:inherit; font-size:13px; font-weight:700; line-height:1.5;
}
#game-pick .gp-btn::after { content:"\25BE"; position:absolute; right:10px; top:7px; color:#6f6f92; }
#game-pick .gp-btn:hover, #game-pick.open .gp-btn, #game-pick .gp-btn:focus { outline:none; border-color:#7ea6ff; }
#game-pick.done .gp-btn { color:#5fd49a; }
#game-pick .gp-list[hidden] { display:none; }
#game-pick .gp-list {
  position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:60;
  max-height:70vh; overflow:auto; padding:5px;
  background:#12121c; border:1px solid #3b3b5f; border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.6);
}
#game-pick .gp-row {
  display:flex; align-items:center; gap:8px; width:100%; padding:6px 9px; text-align:left; cursor:pointer;
  border:0; border-radius:6px; background:none; color:#c9c9e0;
  font-family:inherit; font-size:13px; font-weight:700; line-height:1.4;
}
#game-pick .gp-row:hover, #game-pick .gp-row.on { background:#1e2740; color:#e8e6f5; }
#game-pick .gp-row.done { color:#5fd49a; }
#game-pick .gp-dot { width:8px; height:8px; border-radius:50%; background:#7ea6ff; flex:0 0 auto; }
#game-pick .gp-ck { color:#5fd49a; flex:0 0 auto; }

#stats { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; font-size:11px; }
#stats span { padding:3px 8px; border-radius:20px; background:#1b1b2b; color:#9c9cba; }
#stats span b { color:#e8e6f5; }

#list { flex:1; overflow:auto; padding:14px 14px 60px; }
#list::-webkit-scrollbar { width:10px; }
#list::-webkit-scrollbar-thumb { background:#26263c; border-radius:8px; }

.section { margin:18px 0 8px; font:700 10px/1 inherit; letter-spacing:1.2px; text-transform:uppercase; color:#6f6f92; }
.section:first-child { margin-top:2px; }
.legend { margin:-2px 0 12px; font-size:11px; color:#6f6f92; }

/* --- one beat: the moment, its rows, its source -------------------------- */
.beat { background:#151522; border:1px solid #22223a; border-radius:10px; margin-bottom:10px; overflow:hidden; }
.bhead { display:flex; align-items:center; gap:10px; padding:8px 10px; background:#191927; border-bottom:1px solid #22223a; flex-wrap:wrap; }
/* A card's three actions — check, revert, remove — sit in ONE place on every
   card: pinned to the top-right corner of its header, out of the flow, so
   neither a long function name, a warning nor a header that wraps can move
   them. The header keeps their room free. */
.bhead.has-acts { position:relative; padding-right:106px; min-height:39px; }
.bhead .acts { position:absolute; top:8px; right:10px; display:flex; gap:7px; }
.call .ln { font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#7ea6ff; cursor:pointer; }
.call .fn { font-size:12px; color:#c9c9e0; }
.call .fn i { color:#6f6f92; font-style:normal; }
.bhead .ln { font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#7ea6ff; cursor:pointer; }
.bhead .fn { font-size:12px; color:#c9c9e0; }
.bhead .fn i { color:#6f6f92; font-style:normal; }
.bhead .sp { flex:1; }
.bhead .warn { color:#ffb648; font-size:11px; cursor:help; }

button.act {
  padding:5px 10px; border-radius:7px; border:0; background:#2a2a44; color:#e8e6f5;
  font:700 11px/1 inherit; letter-spacing:.5px; cursor:pointer;
}
button.act:hover { background:#3b3b5f; }
button.act.go { background:#7ea6ff; color:#0b0b12; }
button.act.go:hover { background:#9dbaff; }
button.act.sm { padding:4px 7px; }
button.act.ghost { background:none; border:1px solid #2c2c47; color:#8b8ba7; }
button.act.ghost:hover { background:#1e1e30; color:#e8e6f5; }

.call { display:flex; align-items:center; gap:7px; padding:7px 10px; border-top:1px solid #1d1d2e; flex-wrap:wrap; }
.call:first-child { border-top:0; }
.tag {
  font:700 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.4px;
  padding:1px 7px; border-radius:5px; background:#22223a; color:#9c9cba; white-space:nowrap;
}
.k-pop     .tag { background:#3a2350; color:#dcb6ff; }
.k-notify .tag { background:#1f3550; color:#9fd0ff; }
.k-notify.as-pop .tag { background:#3a2350; color:#dcb6ff; }

.call input, .call select { padding:3px 7px; border-radius:6px; font:700 12px/1.4 inherit; }
.call input.w { width:150px; }
.call input.s { width:110px; font-weight:600; color:#a8a8c8; }
.call select { font-size:11px; font-weight:700; }

.call .approx { min-width:12px; text-align:center; }
.lbl { font-size:10px; color:#6f6f92; text-transform:uppercase; letter-spacing:.6px; }
.call .meta { font-size:11px; color:#7d7d9d; font-variant-numeric:tabular-nums; }
.call .approx { color:#ffb648; font-size:11px; cursor:help; }
.call .sp { flex:1; }

/* A control the bench changed and APPLY has not written yet. The amber one is
   a control whose value the GAME builds at runtime — it can be previewed, and
   apply will refuse it by name rather than paste the stand-in into the source. */
.call input.dirty, .call select.dirty {
  border-color:#7ea6ff; background:#141d33;
}
.call .expr, .call select.expr, .call input.expr { border-color:#5a4a1e; }
.call .dirty.expr { border-color:#ffb648; background:#251c0e; }


/* The two icons every changeable element carries. Dim until there is something
   to undo; the trash turns red once it is armed. */
.iconbtn {
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:22px; padding:0; border:0; border-radius:6px;
  background:none; color:#4d4d68; cursor:pointer;
}
.iconbtn svg { width:14px; height:14px; }
.iconbtn:hover { background:#22223a; color:#e8e6f5; }
.iconbtn.trash:hover { background:#3a1520; color:#ff8fa3; }
.call.killed .iconbtn.trash, .beat.killed .bhead .iconbtn.trash { color:#ff6b83; }

/* Marked for removal: still readable, plainly on its way out, and one click on
   the revert brings it back. */
.call.killed > *:not(.iconbtn), .beat.killed .bhead > *:not(.acts) {
  opacity:.4; text-decoration:line-through; pointer-events:none;
}
.call.killed { background:#1d1218; }

/* Checked: seen, read and signed off. */
.iconbtn.check.on { background:#5fd49a; color:#0b0b12; }
.iconbtn.check.on:hover { background:#7de3b0; color:#0b0b12; }
.call.checked { background:#13221b; }
.call.checked.killed { background:#1d1218; }
.beat.checked { border-color:#2a5040; }
.beat.checked > .bhead { background:#15241c; }
#stats span.done { background:#13221b; color:#5fd49a; }
#stats span.done b { color:#5fd49a; }
#stats button.hide { margin-left:auto; padding:3px 9px; border-radius:20px; border:1px solid #2c2c47; background:none; color:#8b8ba7; font:700 11px/1.3 inherit; cursor:pointer; }
#stats button.hide:hover { color:#e8e6f5; }
#stats button.hide.on { background:#1e2740; border-color:#7ea6ff; color:#e8e6f5; }
.beat.killed { border-color:#5a2030; }

details.src { border-top:1px solid #1d1d2e; }
details.src summary { padding:6px 10px; font-size:11px; color:#6f6f92; cursor:pointer; list-style:none; }
details.src summary::-webkit-details-marker { display:none; }
details.src summary:hover { color:#9c9cba; }
details.src pre {
  margin:0; padding:10px 12px; background:#0d0d16; overflow:auto;
  font:500 11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9b9d6; white-space:pre;
}

.empty { padding:26px; text-align:center; color:#6f6f92; font-size:12px; }

/* ---------------------------------------------------------------------------
   STAGE — the game's backdrop and the overlay layer, nothing else.
   --------------------------------------------------------------------------- */
#stage { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; padding:14px; background:#08080f; }
#bar { display:flex; align-items:center; gap:7px; margin-bottom:12px; width:100%; }
#bar .sp { flex:1; }
/* The two languages, one under the other, the same frame at the same scale. */
#shell { position:relative; display:flex; flex-direction:column; gap:12px; }
.pane .lang { height:22px; font:700 11px/22px inherit; letter-spacing:1.5px; color:#8b8ba7; text-align:center; }
.fit { transform-origin:top left; }
.frame { width:720px; height:1280px; border:0; border-radius:22px; background:#000; display:block; box-shadow:0 24px 70px rgba(0,0,0,.6); }
#hint { margin-top:9px; text-align:center; font-size:11px; color:#6f6f92; min-height:15px; }
/* The column must not SHRINK its own rows: fit() sizes the frame from what the
   hint and the report measure, and a flex-shrunk report would make it read a
   height it had already caused. */
#bar, #shell, #hint, #report { flex:0 0 auto; }

/* What APPLY did, kept across the rebuild's reload: the line as it is now
   written, and every change that was refused and why. */
#report {
  margin-top:10px; width:100%; max-height:190px; overflow:auto;
  background:#12121c; border:1px solid #23233a; border-radius:9px; padding:9px 11px;
  font:600 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9b9d6;
}
#report:empty { display:none; }
#report .ok { color:#8fe0b8; }
#report .no { color:#ffb648; }
#report .at { color:#6f6f92; display:block; padding-left:14px; white-space:pre-wrap; word-break:break-word; }
#report .ver { color:#7ea6ff; }
#bar .cnt { font:700 11px/1 inherit; color:#0b0b12; background:#7ea6ff; border-radius:20px; padding:3px 7px; }

/* A word the game builds: its expression in place of the field, the round's
   values it needs on the line under it, and what each language reads under
   those. */
.call code.xw {
  max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding:3px 7px; border-radius:6px; border:1px dashed #3b3b5f; background:#0d0d16;
  font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#ffd08a; cursor:help;
}
.call .slots, .call .read { flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding-left:34px; }
.call .slots .lbl { margin-right:-4px; }
.slot { display:inline-flex; align-items:center; gap:5px; }
.slot span { font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#8b8ba7; }
.call .slot input, .call .slot select { padding:2px 6px; font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#ffd08a; }
.call .slot input { width:72px; }
.call .slot input.str { width:150px; }
.call .read { font-size:12px; color:#c9c9e0; gap:4px 16px; }
.read .ln2 { display:inline-flex; align-items:baseline; gap:7px; min-width:0; }
.read .lg { font:700 9px/1 inherit; letter-spacing:1.2px; color:#6f6f92; }
.read b { color:#e8e6f5; }
.read i { font-style:normal; color:#9c9cba; }
.read .same { color:#ffb648; font-size:10px; cursor:help; }
.read .err { color:#ff8fa3; }

/* ---------------------------------------------------------------------------
   The recorder, the loop and the EN toggle.
   --------------------------------------------------------------------------- */
#bar .rec { min-width:64px; }
#bar .rec.on { background:#c0304a; color:#fff; border-color:#c0304a; }
#bar .rec.on::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#fff; margin-right:6px; animation:recblink 1s steps(2) infinite; }
@keyframes recblink { 50% { opacity:0; } }
/* The level picker exists in REC only: it starts a round in the played frame. */
#rec-level { display:none; padding:4px 7px; font-size:11px; font-weight:700; }
body.rec #rec-level { display:inline-block; }
#rec-info { font-size:11px; color:#8b8ba7; font-variant-numeric:tabular-nums; }
#rec-info b { color:#ff8fa3; }
/* REC: the bench frames step aside, alive (a loop needs them back at once). */
#recwrap { display:none; flex:0 0 auto; }
body.rec #recwrap { display:block; }
body.rec #shell { position:absolute; left:-10000px; top:0; }
body.rec #replay { display:none; }

/* The clip lies UNDER the frame: the bench's ground goes transparent while it
   plays, so the callouts are fired over the very action they belong to. */
.fit { position:relative; }
.fit video.clip { position:absolute; left:0; top:0; width:720px; height:1280px; object-fit:cover; border-radius:22px; background:#000; display:none; }
body.looping .fit video.clip { display:block; }
body.looping .frame { background:transparent; position:relative; }

#replay { width:100%; margin-bottom:10px; display:none; flex-wrap:wrap; align-items:center; gap:6px 8px;
  background:#12121c; border:1px solid #2a3a60; border-radius:9px; padding:7px 9px; font-size:11px; color:#b9b9d6; }
body.looping #replay { display:flex; }
#replay .what { font:700 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; color:#9fd0ff; }
#replay .time { font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#6f6f92; font-variant-numeric:tabular-nums; }
#replay .sp { flex:1; }
#replay .ev { padding:2px 7px; border-radius:20px; border:1px solid #2c2c47; background:#1b1b2b; color:#c9c9e0; cursor:pointer; font:600 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
#replay .ev.me { border-color:#7ea6ff; color:#e8e6f5; }
#replay .ev.off { opacity:.35; text-decoration:line-through; }
#replay .ev.k-sound { color:#8fe0b8; }
#replay .ev.k-pop { color:#dcb6ff; }
#replay .ev.k-notify { color:#9fd0ff; }

button.act.loop { background:#1b1b2b; color:#4d4d68; }
button.act.loop.has { background:#1e2740; color:#9fd0ff; }
button.act.loop.has:hover { background:#2a3a60; }
button.act.loop.on { background:#7ea6ff; color:#0b0b12; }
button.act.loop.near { color:#ffd08a; }

button.act.en { background:none; border:1px solid #2c2c47; color:#6f6f92; padding:3px 6px; font-size:10px; letter-spacing:1px; }
button.act.en:hover { color:#e8e6f5; border-color:#7ea6ff; }
button.act.en.on { background:#1d3d31; border-color:#5fd49a; color:#8fe0b8; }
button.act.en.dirty { box-shadow:0 0 0 1px #7ea6ff; }
.read .kept { color:#5fd49a; font-size:10px; cursor:help; }
#stats span.seen b { color:#9fd0ff; }
</style>
</head>
<body>

<aside id="panel">
  <div id="head">
    <h1>Messages <small id="sub">what the game says</small></h1>
    <div id="game-pick"><button type="button" class="gp-btn" title="the game this page reads"></button><div class="gp-list" hidden></div></div>
    <div id="stats"></div>
  </div>
  <div id="list"></div>
</aside>

<main id="stage">
  <div id="bar">
    <button class="act ghost" id="btn-reload">Reload</button>
    <button class="act ghost rec" id="btn-rec" title="play the game here — every callout with no clip yet is recorded with the second before it and the second after">Rec</button>
    <select id="rec-level" title="start any level — locked ones too (the dev force, for this load only)"></select>
    <span id="rec-info"></span>
    <span class="sp"></span>
    <button class="act go" id="btn-apply" disabled title="write the changes into the game's source — its patch version moves with them">Apply</button>
  </div>
  <div id="replay"></div>
  <div id="shell">
    <div class="pane"><div class="lang">EN</div>
      <div class="fit"><video class="clip" data-lang="en" muted playsinline></video><iframe class="frame" data-lang="en" title="the game's callout layers, in English"></iframe></div></div>
    <div class="pane"><div class="lang">FR</div>
      <div class="fit"><video class="clip" data-lang="fr" muted playsinline></video><iframe class="frame" data-lang="fr" title="the game's callout layers, in French"></iframe></div></div>
  </div>
  <div id="recwrap" class="pane"><div class="lang">Rec — play; every callout not yet seen is captured</div>
    <div class="fit rec"><iframe class="recframe frame" id="rec-frame" title="the game itself, played to record its events"></iframe></div></div>
  <div id="hint"></div>
  <div id="report"></div>
</main>

<script>
/* ---------------------------------------------------------------------------
   The motor's own callout styles and anchor names (packages/shell/shell.js —
   Pop.STYLES and Pop.ANCHORS). Copied, not read: the list is needed before a
   build is loaded. lab/overlay-pop.html reads the live table instead.
   --------------------------------------------------------------------------- */
const STYLES = ["score","alert","combo","streak","ribbon","manifest","perfect",
                "ultra","bonus","danger","record","vert"];
const ANCHORS = ["topLeft","top","topRight","upperLeft","upper","upperRight",
  "left","center","right","lowerLeft","lower","lowerRight",
  "bottomLeft","bottom","bottomRight","hudUnder","ctaAbove","edgeLeft","edgeRight"];

/* What this page lists. Canvas juice (Fx.*, HUD.punch) is scanned but not
   listed — see the head — and the cues are the sound page's. */
const KINDS = { pop: 1, notify: 1 };

const el = (id) => document.getElementById(id);
/* One build per language. English is the one that sounds — the cues a loop
   replays around a callout — and the French frame is muted, or every cue
   would be heard twice. */
const LANGS = ["en", "fr"];
const frames = {};
document.querySelectorAll("iframe.frame[data-lang]").forEach((f) => { frames[f.dataset.lang] = f; });
const state = {
  slug: null, data: null,
  // Every game's checked count, for the picker (api/games, then api/check).
  status: {},
  hideChecked: (() => { try { return localStorage.getItem("events:hideChecked") === "1"; } catch (e) { return false; } })(),
  /* What the rows changed and APPLY has not written yet, keyed so a re-render
     (a filter) puts every control back where the hand left it.
       calls:  { "<line>|<Name>": { style, word, sub, at, as } }
       kill:   { calls: { "<line>|<Name>": { line, name } } }
       keepEn: { "<English word>": true | false } — kept in English, or given
               its French back (tools/lab/keep-english.mjs) */
  pending: { calls: {}, kill: { calls: {} }, keepEn: {} },
  // The recorded moments (lab/events-clips/<slug>/index.json) and the
  // line offset that maps the built game.<hash>.js back to its source.
  clips: { clips: {}, byId: {} },
  offset: null
};

const EMPTY_PENDING = () => ({ calls: {}, kill: { calls: {} }, keepEn: {} });

/* A value apply can write back, as opposed to one the game builds at runtime:
   a quoted string, the one shape the splicer accepts for copy
   (tools/lab/apply-events.mjs). */
function isLit(expr) {
  return expr != null && /^\s*(["'])(?:[^\\]|\\.)*?\1\s*$/.test(String(expr));
}
function writable(name, expr) {
  return isLit(expr);
}

function pendKey(call) { return call.line + "|" + call.name; }
function pend(call) {
  const k = pendKey(call);
  return state.pending.calls[k] || (state.pending.calls[k] = {});
}

/* A control is dirty when its value is not the one the row was BUILT with —
   never by comparing against the source, because a value the game computes is
   previewed with a stand-in that differs from the source by construction.
   Typing over it and typing it back is not a change. */
function watch(ctrl, call, name, expr) {
  ctrl.dataset.was = ctrl.value;
  if (expr != null && !writable(name, expr)) {
    ctrl.classList.add("expr");
    ctrl.title = "the game builds this at runtime (" + expr + ") — apply refuses it rather than write the bench's stand-in";
  }
  const sync = () => {
    const changed = ctrl.value !== ctrl.dataset.was;
    ctrl.classList.toggle("dirty", changed);
    const p = pend(call);
    if (changed) p[name] = ctrl.value; else delete p[name];
    if (!Object.keys(p).length) delete state.pending.calls[pendKey(call)];
    countPending();
  };
  ctrl.addEventListener("input", sync);
  ctrl.addEventListener("change", sync);
  // A re-render rebuilds the row: put the pending value back on it.
  const p = state.pending.calls[pendKey(call)];
  if (p && p[name] != null) { ctrl.value = p[name]; ctrl.classList.add("dirty"); }
  return ctrl;
}

function countPending() {
  const kill = state.pending.kill;
  const n = Object.values(state.pending.calls).reduce((a, o) => a + Object.keys(o).length, 0) +
            Object.keys(kill.calls).length +
            Object.keys(state.pending.keepEn).length;
  const btn = el("btn-apply");
  btn.disabled = !n;
  btn.innerHTML = n ? `Apply <span class="cnt">${n}</span>` : "Apply";
  return n;
}

/* --- talking to the game -------------------------------------------------
   The web build injects window.__WEB__, a plain list of motor references (see
   tools/build/build.mjs). Everything below goes through it. */
function web(lang) {
  const f = frames[lang || "en"];
  return f && f.contentWindow && f.contentWindow.__WEB__;
}
function api(mod, lang) {
  const W = web(lang);
  const w = frames[lang || "en"].contentWindow;
  return (W && W[mod]) || (w && w[mod]) || null;
}

/* The language is SET, never asked for by URL: the player's own choice in
   OPTIONS is stored, wins over `?lang=`, and both frames share one origin and
   so one Store. This is what menu.js does on a switch, minus the menu. */
function setLang(W, lang) {
  if (!W || !W.Lang) return;
  const copy = W.CONFIG && W.CONFIG.web && W.CONFIG.web.copy;
  let dict = lang !== "en" && copy && copy[lang] && copy[lang].strings;
  /* A word the bench is about to keep in English is previewed as such: its
     French is the English. Given back, it falls to the English too until
     apply writes the French it had — the bench does not hold that copy. */
  if (dict && lang === "fr" && Object.keys(state.pending.keepEn).length) {
    dict = Object.assign({}, dict);
    for (const [w, on] of Object.entries(state.pending.keepEn)) { if (on) dict[w] = w; else delete dict[w]; }
  }
  W.Lang.set(lang, dict || null);
}

/* The stage is the game's build with everything but the callout layers taken
   out of the way, injected into each iframe and nowhere near the repo: the
   canvas (Pop.text draws there), the overlay (Pop.show) and the notice layer
   (Notify) stay, on a flat ground; the backdrop, the menu, the village, the
   band and every screen go. */
const BENCH_CSS = `
  html, body, #stage, #frame { background:#262834 !important; }
  #frame::before, #frame::after { display:none !important; }
  #backdrop { display:none !important; }
  #frame > *:not(#game):not(#overlay):not(#nt-layer) { display:none !important; }
  #overlay { z-index:40; }
  /* A clip plays UNDER the iframe while a row loops — the ground clears. */
  html.lab-clear, html.lab-clear body, html.lab-clear #stage, html.lab-clear #frame, html.lab-clear #game { background:transparent !important; }
`;
LANGS.forEach((lang) => frames[lang].addEventListener("load", () => {
  try {
    const f = frames[lang], d = f.contentDocument;
    const style = d.createElement("style");
    style.id = "lab-bench";
    style.textContent = BENCH_CSS;
    d.head.appendChild(style);
    const W = web(lang);
    setLang(W, lang);
    if (lang !== "en" && W) {
      try { W.Sound.setMuted(true); W.Music.setMuted(true); } catch (e) {}
    }
    d.documentElement.classList.toggle("lab-clear", !!LOOP.clip);
    refreshReads();
    paintAllEn();
  } catch (e) { note("the build did not load"); }
}));

/* Pop has two halves and the second one is drawn on the canvas, by the frame
   pipeline — which does not turn here, because no round is running. So the
   bench drives the three calls the pipeline would (clear, tick, draw) for as
   long as the number lives, and nothing else: no Game.update, no Game.render,
   no world. That is the whole reason `Pop.text` can be previewed on a bench
   showing only a backdrop. */
const juices = {};
function juice(lang, seconds) {
  const j = juices[lang] || (juices[lang] = { until: 0, running: false });
  j.until = Math.max(j.until, performance.now() + seconds * 1000);
  if (j.running) return;
  const W = web(lang);
  if (!W) return;
  j.running = true;
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    W.clearWorld();
    W.Pop.tick(dt);
    W.Pop.canvas();
    if (now < j.until) requestAnimationFrame(step);
    else { W.clearWorld(); j.running = false; }
  };
  requestAnimationFrame(step);
}

/* iOS and every desktop browser want the AudioContext opened inside a gesture.
   The click that fires a row is one, and user activation reaches a same-origin
   iframe, so unlocking the GAME's context from here is enough — and it decodes
   the whole pack, which is what makes the first cue audible. */
function unlock() {
  const S = api("Sound");
  if (S) { try { S.unlock(); } catch (e) {} }
}

/* What a row will actually call: the source's own arguments, with whatever the
   row's inputs now say written over them. One function, so firing a row and
   copying its line can never disagree. */
function argsFor(call, row, W) {
  const args = JSON.parse(JSON.stringify(call.preview.args));
  if (!row) return args;
  const get = (sel) => row.querySelector(sel);
  const text = (field) => textOf(call, row, field, W);
  if (call.name === "Pop.text") {
    const w = text("word");
    if (w !== undefined) args[2] = w;
  } else if (call.kind === "pop") {
    const o = args[1] = Object.assign({}, args[1]);
    args[0] = get("select.style").value;
    const w = text("word"), sub = text("sub");
    if (w) o.word = w; else delete o.word;          // the style's own word
    if (sub) o.sub = sub; else delete o.sub;
    const at = get("select.at").value;
    if (at) o.at = at; else delete o.at;
  } else if (call.kind === "notify") {
    const w = text("word");
    if (w !== undefined) args[0] = w;
    const o = args[1] = Object.assign({}, args[1] || {});
    const sub = text("sub");
    if (sub) o.sub = sub; else delete o.sub;
    // Turned into a callout: what Pop.show would be handed instead.
    const as = asPop(row);
    if (as) {
      const p = {};
      if (args[0]) p.word = args[0];
      if (sub) p.sub = sub;
      const at = get("select.at").value;
      if (at) p.at = at;
      return [as, p];
    }
  }
  return args;
}

/* ── a built word, run in the frame ───────────────────────────────────────
   One field of a callout — its word or its sub — as the frame `W` will be
   handed it. A literal is the row's own field (the motor translates it whole);
   a built word is the game's expression with the row's slots in it, run with
   that frame's Lang, so its Lang.t pieces come out in that frame's language.
   `undefined` is "the source says nothing here": the motor's own default. */
const RUNNERS = {};
function runner(code) {
  const env = (state.data && state.data.textEnv) || { aliases: {}, tables: {} };
  const key = state.slug + "\n" + code;
  if (RUNNERS[key]) return RUNNERS[key];
  let prelude = "";
  for (const k in env.tables) prelude += "var " + k + " = " + JSON.stringify(env.tables[k]) + ";\n";
  for (const k in env.aliases) prelude += "var " + k + " = " + env.aliases[k] + ";\n";
  return (RUNNERS[key] = new Function("$", "Lang", "CONFIG", "upper", prelude + "return (" + code + ");"));
}

function textOf(call, row, field, W) {
  const f = call.texts && call.texts.fields[field];
  if (f && f.code) {
    if (!W) return undefined;
    try {
      const v = runner(f.code)(slotValues(call, row), W.Lang, W.CONFIG, W.upper);
      return v == null ? "" : String(v);
    } catch (e) { return "⚠ " + e.message; }
  }
  const inp = row && row.querySelector(field === "word" ? "input.w" : "input.s");
  if (inp) return inp.value === "" ? undefined : inp.value;
  return f && f.lit != null ? f.lit : undefined;
}

/* The values a row's slots hold now, typed the way the game would hold them:
   a number reads as a number (`lives === 1` must be able to be true), a
   true/false as a boolean, anything else as the string it is. */
function slotValues(call, row) {
  const slots = (call.texts && call.texts.slots) || [];
  return slots.map((s, i) => {
    const c = row && row.querySelector('.slot [data-i="' + i + '"]');
    const raw = c ? c.value : String(s.value);
    if (/^-?\d+(\.\d+)?$/.test(raw.trim())) return Number(raw);
    if (raw === "true" || raw === "false") return raw === "true";
    return raw;
  });
}

/* What a row's slots were last set to, per game, in this browser only: a
   value typed here is the bench's, never the game's. */
function slotStore() {
  try { return JSON.parse(localStorage.getItem("events:slots:" + state.slug) || "{}"); }
  catch (e) { return {}; }
}
function slotSave(key, value) {
  const all = slotStore();
  if (value == null) delete all[key]; else all[key] = value;
  try { localStorage.setItem("events:slots:" + state.slug, JSON.stringify(all)); } catch (e) {}
}

function slotsHtml(call) {
  const slots = (call.texts && call.texts.slots) || [];
  if (!slots.length) return "";
  const saved = slotStore();
  const id = "dl-" + call.line + "-" + call.method;
  return `<div class="slots"><span class="lbl" title="the round's own values — the bench cannot read them, so it offers one. Never written back.">values</span>` +
    slots.map((s, i) => {
      const k = call.line + "|" + call.name + "|" + s.text;
      const v = saved[k] != null ? saved[k] : String(s.value);
      const head = `<label class="slot" title="${esc(s.text)}"><span>${esc(s.text.length > 22 ? s.text.slice(0, 21) + "…" : s.text)}</span>`;
      if (s.kind === "pick" || s.kind === "bool") {
        const opts = s.kind === "bool" ? ["true", "false"] : s.choices.map(String);
        return head + `<select data-i="${i}" data-k="${esc(k)}">` +
          opts.map((o) => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("") + `</select></label>`;
      }
      const list = s.choices && s.choices.length
        ? `<datalist id="${id}-${i}">${s.choices.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>` : "";
      return head + `<input type="text" data-i="${i}" data-k="${esc(k)}" class="${s.kind}" value="${esc(v)}"` +
        (list ? ` list="${id}-${i}"` : "") + `>${list}</label>`;
    }).join("") + `</div>`;
}

/* What each frame was handed, read back under the row: the word and the sub
   as Lang.t leaves them (the screen shouts them on top of that). A French
   identical to the English is marked — a word with no entry in
   web.copy.fr.strings, or a piece the game forgot to wrap in Lang.t. */
function readHtml(call, row) {
  if (!call.texts) return "";
  const style = row.querySelector("select.style");
  const out = LANGS.map((lang) => {
    const W = web(lang);
    if (!W) return null;
    setLang(W, lang);
    const parts = ["word", "sub"].map((field) => {
      let v = textOf(call, row, field, W);
      if (v === undefined && field === "word" && style && W.Pop.styles && W.Pop.styles[style.value]) v = W.Pop.styles[style.value].word;
      return v == null || v === "" ? "" : String(W.Lang.t(v));
    });
    return { lang, word: parts[0], sub: parts[1] };
  }).filter(Boolean);
  if (!out.length) return "";
  const en = out.find((o) => o.lang === "en");
  return out.map((o) => {
    const txt = o.word + (o.sub ? " · " + o.sub : "");
    const same = o.lang !== "en" && en && txt === en.word + (en.sub ? " · " + en.sub : "") && /[A-Za-z]{2}/.test(txt);
    const kept = same && enState(call).all;
    const err = /⚠/.test(txt);
    return `<span class="ln2"><span class="lg">${o.lang.toUpperCase()}</span>` +
      `<b${err ? ' class="err"' : ""}>${esc(o.word)}</b>${o.sub ? ` <i>${esc(o.sub)}</i>` : ""}` +
      (kept ? ` <span class="kept" title="kept in English on purpose — web.copy.fr.strings holds the English as its French">en kept</span>` :
       same ? ` <span class="same" title="the French reads exactly like the English — no entry in web.copy.fr.strings, or a piece not wrapped in Lang.t">= en</span>` : "") +
      `</span>`;
  }).join("");
}

function refreshReads() {
  document.querySelectorAll(".call").forEach((row) => { if (row._read) row._read(); });
}

// The Pop style a notice row has been turned into, or "" when it is a notice.
function asPop(row) {
  const as = row && row.querySelector("select.as");
  return as ? as.value : "";
}

function fire(call, row) {
  unlock();
  const [mod, meth] = (asPop(row) ? "Pop.show" : call.preview.fn).split(".");
  // A cue (replayed by a loop) is heard once, from the English frame; a word is read in both.
  const langs = call.kind === "sound" ? ["en"] : LANGS;
  for (const lang of langs) {
    const W = web(lang);
    const target = api(mod, lang);
    if (!target || typeof target[meth] !== "function") { note(call.name + " is not reachable in this build"); return; }
    setLang(W, lang);
    const args = argsFor(call, row, W);
    try { target[meth].apply(target, args); }
    catch (e) { note(call.name + " threw: " + e.message); return; }
    // The canvas half only exists while something draws it.
    if (call.name === "Pop.text") juice(lang, ((args[3] && args[3].life) || 0.9) + 0.4);
  }
}

function note(msg) { el("hint").textContent = msg || ""; }
function copy(text) {
  navigator.clipboard.writeText(text).then(() => note(text + "   copied"), () => note(text));
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function add(cls, text) {
  const n = document.createElement("div");
  n.className = cls;
  n.textContent = text;
  el("list").appendChild(n);
  return n;
}

/* ── undo, and remove ─────────────────────────────────────────────────────
   Two icons on everything the bench can change. REVERT puts the element back
   where the source has it — every control to the value the row was built with,
   and the pending entry gone. TRASH does not delete anything on its own: it
   MARKS, the way every other change here is marked, and apply is what carries
   it out. So a removal is reviewed next to the rest of the plan, counted in
   the Apply badge, and taken back with the same revert as a typo.            */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  revert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12a5 5 0 0 1 0 10h-5"/><path d="M7 5 3 9l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>'
};
function iconBtn(cls, name, title) {
  return `<button class="iconbtn ${cls}" title="${esc(title)}">${ICON[name]}</button>`;
}

// Every control of one element, back to what the row was built with.
function resetControls(node) {
  node.querySelectorAll("input, select").forEach((c) => {
    if (c.dataset.was === undefined) return;
    c.value = c.dataset.was;
    c.classList.remove("dirty");
    if (c._sync) c._sync();
  });
}

function revertCall(call, row) {
  delete state.pending.calls[pendKey(call)];
  delete state.pending.kill.calls[pendKey(call)];
  if (row._en) { enWords(call).forEach((w) => { delete state.pending.keepEn[w]; }); refreshReads(); paintAllEn(); }
  resetControls(row);
  row.classList.remove("killed");
  countPending();
  note("");
}

function killCall(call, row) {
  const k = pendKey(call);
  if (state.pending.kill.calls[k]) delete state.pending.kill.calls[k];
  else state.pending.kill.calls[k] = { line: call.line, name: call.name };
  row.classList.toggle("killed", !!state.pending.kill.calls[k]);
  countPending();
  note(state.pending.kill.calls[k]
    ? `${call.name} line ${call.line} will be removed from the source on apply`
    : "");
}

/* --- the rows ------------------------------------------------------------ */
function callRow(call) {
  const row = document.createElement("div");
  row.className = "call k-" + call.kind;
  const bits = [`<button class="act sm play" title="fire it in the game">▶</button>`,
                `<button class="act sm loop" title="loop the moment of the game it fires on">↻</button>`,
                `<span class="tag">${call.name}</span>`];

  /* A field is an input when the source writes it as a literal (or not at
     all), and the game's expression when the game builds it — its values are
     the slots under the row, never the field itself. */
  const fields = (call.texts && call.texts.fields) || {};
  const field = (name, cls, value, ph) => fields[name] && fields[name].code
    ? `<code class="xw" title="${esc(name + " = " + fields[name].expr)} — built by the game, run here with the values below">${esc(fields[name].expr)}</code>`
    : `<input type="text" class="${cls}"${ph ? ` placeholder="${ph}"` : ""} value="${esc(value == null ? "" : value)}">`;

  if (call.name === "Pop.text") {
    // The canvas half: a word at a point in the world, no style and no anchor.
    const o = call.preview.args[3] || {};
    bits.push(`<span class="style">text</span>`);
    bits.push(field("word", "w", String(call.preview.args[2])));
    bits.push(`<span class="meta">${esc(Object.keys(o).map((k) => k + " " + o[k]).join(" · "))}</span>`);
  } else if (call.kind === "pop") {
    const o = call.preview.args[1] || {};
    const style = call.preview.args[0];
    bits.push(`<select class="style">${STYLES.map((s) =>
      `<option${style === s ? " selected" : ""}>${s}</option>`).join("")}</select>`);
    bits.push(field("word", "w", o.word, "style word"));
    bits.push(field("sub", "s", o.sub, "sub"));
    // The empty option is "whatever the style says" — a call that names no
    // anchor must not be previewed at some arbitrary corner of the frame.
    const at = o.at || "";
    bits.push(`<select class="at"><option value=""${at ? "" : " selected"}>style spot</option>${ANCHORS.map((a) =>
      `<option${at === a ? " selected" : ""}>${a}</option>`).join("")}</select>`);
    if (call.cls) bits.push(`<span class="meta">.${esc(call.cls)}</span>`);
    if (call.style !== style) bits.push(`<span class="meta">src: ${esc(call.style)}</span>`);
  } else if (call.kind === "notify") {
    // Notify.say — one look, so a word and a sub and no style. The vignette is
    // scanned as juice (scan-events.mjs) and never reaches this list. The
    // dropdown is what it is SAID as: `notify`, or a Pop style it is turned
    // into — then it takes an anchor like any callout.
    const o = call.preview.args[1] || {};
    bits.push(`<select class="as" title="notify, or a Pop style to turn this notice into a callout — apply rewrites it as Pop.show">` +
      `<option value="">notify</option>${STYLES.map((s) => `<option>${s}</option>`).join("")}</select>`);
    bits.push(field("word", "w", String(call.preview.args[0])));
    bits.push(field("sub", "s", o.sub, "sub"));
    bits.push(`<select class="at" hidden><option value="">style spot</option>${ANCHORS.map((a) =>
      `<option>${a}</option>`).join("")}</select>`);
  }

  // Keep this callout's words in English on the French screen.
  if (state.slug !== "template")
    bits.push(`<button class="act sm en" title="keep it in English on the French screen — apply writes an entry whose French is the English">EN</button>`);
  bits.push(call.preview.exact
    ? `<span class="approx"></span>`
    : `<span class="approx" title="an argument is built from the round's own state — the motor's default is shown instead. Type over it.">≈</span>`);
  if (call.texts) {
    bits.push(slotsHtml(call));
    bits.push(`<div class="read"></div>`);
  }

  row.innerHTML = bits.join("");
  if (call.texts) {
    const read = row.querySelector(".read");
    row._read = () => { read.innerHTML = readHtml(call, row); };
    row.querySelectorAll(".slot [data-i]").forEach((c) => {
      const keep = () => {
        const s = call.texts.slots[Number(c.dataset.i)];
        slotSave(c.dataset.k, c.value === String(s.value) ? null : c.value);
        row._read();
      };
      c.addEventListener("input", keep);
      c.addEventListener("change", keep);
    });
    row.querySelectorAll("input.w, input.s, select.style").forEach((c) => c.addEventListener("input", row._read));
    row._read();
  }
  row.querySelector(".play").onclick = () => fire(call, row);
  row._call = call;
  row.querySelector(".loop").onclick = () => loopToggle(call);
  const enBtn = row.querySelector(".en");
  if (enBtn) {
    row._en = () => paintEn(call, row, enBtn);
    enBtn.onclick = () => toggleEn(call, row);
    row._en();
  }
  row.dataset.check = call.checkId || "";

  /* Which control writes which argument back. `expr` is the source as the game
     wrote it, and it is what tells an editable value from one apply has to
     refuse — the row shows both the same way, so nothing is a surprise. */
  const opts = call.opts || {};
  const bind = (sel, name, expr) => {
    const ctrl = row.querySelector(sel);
    if (!ctrl) return;
    watch(ctrl, call, name, expr);
  };
  if (call.name === "Pop.text") bind("input.w", "word", call.args[2]);
  else if (call.kind === "pop") {
    bind("select.style", "style", call.args[0]);
    bind("input.w", "word", opts.word);
    bind("input.s", "sub", opts.sub);
    bind("select.at", "at", opts.at);
  } else if (call.kind === "notify") {
    bind("input.w", "word", call.args[0]);
    bind("input.s", "sub", opts.sub);
    bind("select.as", "as", null);
    bind("select.at", "at", null);
    const as = row.querySelector("select.as"), at = row.querySelector("select.at");
    /* Back to `notify`, the anchor goes with it: a notice has no spot, and an
       anchor left pending would be refused by apply as a field it lacks. */
    as._sync = () => {
      const on = !!as.value;
      row.classList.toggle("as-pop", on);
      row.querySelector(".tag").textContent = on ? "Notify.say → Pop.show" : call.name;
      at.hidden = !on;
      if (!on && at.value) { at.value = ""; at.dispatchEvent(new Event("change")); }
    };
    as.addEventListener("change", as._sync);
    as._sync();
  }
  return row;
}

function beatCard(beat, calls) {
  const card = document.createElement("div");
  card.className = "beat";
  // The cues are not listed here, but a moment that plays none is still said.
  const silent = calls.some((c) => c.kind === "pop") && !beat.calls.some((c) => c.kind === "sound");
  const head = document.createElement("div");
  head.className = "bhead";
  head.innerHTML =
    `<span class="ln" title="click to copy the path">L${beat.line}</span>` +
    `<span class="fn">${beat.fn ? esc(beat.fn) + "<i>()</i>" : "<i>top level</i>"}</span>` +
    `<span class="sp"></span>` +
    (silent ? `<span class="warn" title="this moment shows a callout and plays nothing — deliberate on a beat that is already loud, a gap otherwise">no sound</span>` : "") +
    `<span class="acts">` +
    iconBtn("check", "check", calls.length > 1 ? "check the " + calls.length + " callouts of this moment" : "mark as checked — seen and read, signed off") +
    iconBtn("revert", "revert", "put this moment back where the source has it") +
    iconBtn("trash", "trash", calls.length > 1 ? "remove the " + calls.length + " callouts of this moment from the game" : "remove this callout from the game") +
    `</span>`;
  head.classList.add("has-acts");
  head.querySelector(".ln").onclick = () => copy(state.data.where + ":" + beat.line);
  card.appendChild(head);

  const rows = calls.map((c) => { const r = callRow(c); card.appendChild(r); return r; });

  /* The card's actions are the moment's: what fires together is checked,
     reverted and removed together. Removing is all or nothing — every line
     marked, or, when they all already are, every line given back. */
  head.querySelector(".check").onclick = () => {
    const ids = calls.map((c) => c.checkId).filter(Boolean);
    toggleCheck(ids, !ids.every(isChecked));
  };
  head.querySelector(".revert").onclick = () => {
    calls.forEach((c, i) => revertCall(c, rows[i]));
    card.classList.remove("killed");
  };
  head.querySelector(".trash").onclick = () => {
    const on = !calls.every((c) => state.pending.kill.calls[pendKey(c)]);
    calls.forEach((c, i) => { if (!!state.pending.kill.calls[pendKey(c)] !== on) killCall(c, rows[i]); });
    card.classList.toggle("killed", on);
  };
  card.classList.toggle("killed", calls.every((c) => state.pending.kill.calls[pendKey(c)]));

  const src = document.createElement("details");
  src.className = "src";
  src.innerHTML = `<summary>source · ${state.data.where}:${beat.codeFrom}</summary><pre>${esc(beat.code)}</pre>`;
  card.appendChild(src);
  return card;
}

/* --- the one list -------------------------------------------------------- */
function render() {
  const list = el("list");
  list.innerHTML = "";
  if (!state.data) { list.innerHTML = `<div class="empty">loading…</div>`; return; }
  const d = state.data;
  add("section", "events — the callouts and the notifications");
  add("legend", "The style dropdown is the callout's look; apply writes it back into the Pop.show line. A value the game builds at runtime is marked and refused rather than overwritten.");
  let n = 0;
  d.beats.forEach((b) => {
    const calls = b.calls.filter((c) => KINDS[c.kind] && !(state.hideChecked && isChecked(c.checkId)));
    if (!calls.length) return;
    list.appendChild(beatCard(b, calls));
    n++;
  });
  if (!n) add("empty", state.hideChecked && sideTotal()
    ? "everything here is checked"
    : "this game fires no callout");

  el("stats").innerHTML =
    `<span><b>${d.counts.pop}</b> callouts</span>` +
    `<span><b>${d.counts.notify}</b> notifications</span>` +
    `<span class="seen-pill seen"></span>` +
    `<span class="checked-pill"></span>` +
    `<button class="hide${state.hideChecked ? " on" : ""}" title="show only what is left to check">Hide checked</button>`;
  el("stats").querySelector("button.hide").onclick = () => {
    state.hideChecked = !state.hideChecked;
    try { localStorage.setItem("events:hideChecked", state.hideChecked ? "1" : "0"); } catch (e) {}
    render();
  };

  paintChecks();
  paintClips();
  countPending();
}

/* ── checked ──────────────────────────────────────────────────────────────
   A mark is the server's (lab/events-review.json) and is matched on the
   call's checkId alone, so the page only ever asks "is this id in the review".
   A click repaints in place rather than re-rendering: a row holds pending
   edits and slot values the hand is in the middle of. With HIDE CHECKED on,
   a row that was just checked leaves the list, which is the point of it. */
function isChecked(id) {
  return !!(id && state.data && state.data.review && state.data.review[id]);
}
function sideCalls() {
  return state.data ? state.data.calls.filter((c) => c.checkId && KINDS[c.kind]) : [];
}
function sideTotal() { return sideCalls().length; }

// In order, one after the other, so the last answer is the whole review.
let checkQueue = Promise.resolve();
function toggleCheck(ids, on) {
  ids = ids.filter(Boolean);
  if (!ids.length) return;
  checkQueue = checkQueue.then(() => sendCheck(ids, on));
}
function sendCheck(ids, on) {
  return fetch("api/check", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: state.slug, ids, on })
  })
    .then((r) => r.json())
    .then((res) => {
      if (res.error) { note(res.error); return; }
      state.data.review = res.review;
      state.status[state.slug] = res.status;
      drawPicker();
      if (state.hideChecked && on) {
        const list = el("list"), top = list.scrollTop;
        render();
        list.scrollTop = top;
      } else paintChecks();
      note(on ? ids.length + " checked" : ids.length + " unchecked");
    })
    .catch((e) => note("check failed: " + e.message));
}

function paintChecks() {
  document.querySelectorAll(".call[data-check]").forEach((row) => {
    const on = isChecked(row.dataset.check);
    row.classList.toggle("checked", on);
    const b = row.querySelector(".iconbtn.check");
    if (b) {
      b.classList.toggle("on", on);
      const m = on && state.data.review[row.dataset.check];
      b.title = on ? "checked " + m.at + " — click to take it back" : "mark as checked — seen and read, signed off";
    }
  });
  // A card is checked when every line on it is.
  document.querySelectorAll("#list .beat").forEach((card) => {
    const rows = [...card.querySelectorAll(".call[data-check]")];
    const all = rows.length > 0 && rows.every((r) => r.classList.contains("checked"));
    card.classList.toggle("checked", all);
    const b = card.querySelector(".bhead .iconbtn.check");
    if (b) b.classList.toggle("on", all);
  });
  if (!state.data) return;
  const pill = el("stats").querySelector(".checked-pill");
  if (pill) {
    const all = sideTotal(), ok = sideCalls().filter((c) => isChecked(c.checkId)).length;
    pill.className = "checked-pill" + (all && ok === all ? " done" : "");
    pill.innerHTML = `<b>${ok}</b> / ${all} checked`;
  }
}

/* ── the game picker ──────────────────────────────────────────────────────
   One button, and a list under it: the game being edited wears a dot, a game
   every line of THIS page's side of which is checked (its callouts and notices, never the other
   page's) wears a tick and goes green. Not a <select>, whose popup draws its
   own tick on the selected entry. */
const picker = { order: [], value: null, idx: -1 };

function pickDone(slug) {
  const st = state.status[slug] && state.status[slug].view;
  return !!(st && st.total && st.checked === st.total);
}

function pickEntry(slug, withDot) {
  const g = state.games && state.games[slug];
  return (withDot && slug === picker.value ? `<span class="gp-dot"></span>` : "") +
    (pickDone(slug) ? `<span class="gp-ck">\u2713</span>` : "") +
    `<span>${esc(g ? g.title : slug)}</span>`;
}

function drawPicker() {
  const box = el("game-pick");
  if (!picker.value) return;
  box.classList.toggle("done", pickDone(picker.value));
  box.querySelector(".gp-btn").innerHTML = pickEntry(picker.value, false);
  const list = box.querySelector(".gp-list");
  list.innerHTML = picker.order.map((slug, i) =>
    `<button type="button" class="gp-row${pickDone(slug) ? " done" : ""}${i === picker.idx ? " on" : ""}" data-slug="${esc(slug)}">${pickEntry(slug, true)}</button>`).join("");
  list.querySelectorAll(".gp-row").forEach((r) => { r.onclick = () => pickGame(r.dataset.slug); });
}

function pickOpen(on) {
  const box = el("game-pick"), list = box.querySelector(".gp-list");
  list.hidden = !on;
  box.classList.toggle("open", on);
  if (!on) return;
  picker.idx = picker.order.indexOf(picker.value);
  drawPicker();
  const cur = list.querySelector(".gp-row.on");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

function pickGame(slug) {
  pickOpen(false);
  if (slug === picker.value) return;
  picker.value = slug;
  drawPicker();
  load(slug);
}

(function wirePicker() {
  const box = el("game-pick"), btn = box.querySelector(".gp-btn"), list = box.querySelector(".gp-list");
  btn.onclick = () => pickOpen(list.hidden);
  box.addEventListener("keydown", (e) => {
    if (list.hidden) {
      if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") { e.preventDefault(); pickOpen(true); }
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); pickOpen(false); btn.focus(); return; }
    if (e.key === "Enter") { e.preventDefault(); if (picker.order[picker.idx]) pickGame(picker.order[picker.idx]); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    picker.idx = Math.max(0, Math.min(picker.order.length - 1, picker.idx + (e.key === "ArrowDown" ? 1 : -1)));
    drawPicker();
    const on = list.querySelector(".gp-row.on");
    if (on) on.scrollIntoView({ block: "nearest" });
  });
  // A click anywhere else, or the window losing focus (a click in a game frame), closes it.
  document.addEventListener("mousedown", (e) => { if (!box.contains(e.target)) pickOpen(false); });
  window.addEventListener("blur", () => pickOpen(false));
})();

function fit() {
  const stage = el("stage"), bar = el("bar"), gap = 12, label = 22;
  // The apply report takes its room out of the frames, never off the bottom of
  // the window: what it costs in height the frames give back.
  const h = stage.clientHeight - bar.offsetHeight - el("hint").offsetHeight - el("report").offsetHeight -
            el("replay").offsetHeight - label * 2 - gap - 75;
  // Two frames stacked in the height the stage gets, never wider than a third of the window.
  const k = Math.max(0.12, Math.min(h / 2560, (window.innerWidth * 0.34 - 28) / 720));
  // REC: ONE frame, as big as the stage allows — it is played, not glanced at.
  const kr = Math.max(0.2, Math.min((h + label + gap) / 1280, (window.innerWidth * 0.45 - 28) / 720));
  if (document.body.classList.contains("rec")) {
    const f = document.querySelector(".fit.rec");
    f.style.transform = "scale(" + kr + ")";
    f.style.width = (720 * kr) + "px"; f.style.height = (1280 * kr) + "px";
    f.parentNode.style.width = (720 * kr) + "px";
    stage.style.flexBasis = (720 * kr + 28) + "px";
    return;
  }
  document.querySelectorAll(".fit:not(.rec)").forEach((f) => {
    f.style.transform = "scale(" + k + ")";
    f.style.width = (720 * k) + "px";
    f.style.height = (1280 * k) + "px";
    f.parentNode.style.width = (720 * k) + "px";
  });
  stage.style.flexBasis = Math.max(300, 720 * k + 28) + "px";
}

function load(slug) {
  if (slug !== state.slug) { state.pending = EMPTY_PENDING(); loopStop(); }
  state.slug = slug;
  loadClips();
  if (REC.on) recLoad();
  localStorage.setItem("events:game", slug);
  LANGS.forEach((lang) => { frames[lang].src = "build/" + slug + "/index.html?first=0&lang=" + lang; });
  fetch("api/events?game=" + encodeURIComponent(slug))
    .then((r) => r.json())
    .then((d) => { state.data = d; state.status[slug] = d.status; drawPicker(); el("sub").textContent = d.title + (d.version ? " v" + d.version : "") + " — " + d.where; render(); });
}

/* ===========================================================================
   EN: a callout kept in English on the French screen.

   A word is kept in English by a dictionary entry whose French IS the English
   (tools/lab/keep-english.mjs). So the words of a row are the ones the
   dictionary is asked about: a literal word or sub, the `Lang.t("…")` pieces
   of a built word, a literal of it the dictionary already knows, the
   CONFIG.copy value it names — and, for a callout that names no word, the
   word of its style.
   =========================================================================== */
function frDict() {
  const W = web("fr") || web("en");
  const c = W && W.CONFIG && W.CONFIG.web && W.CONFIG.web.copy;
  return (c && c.fr && c.fr.strings) || {};
}

function strLits(expr) {
  const out = [], re = /(["'])((?:\\.|(?!\1)[^\\])*)\1/g;
  let m;
  while ((m = re.exec(String(expr)))) {
    try { out.push(JSON.parse('"' + m[2].replace(/\\'/g, "'").replace(/(^|[^\\])"/g, '$1\\"') + '"')); } catch (e) {}
  }
  return out;
}

// The source expression of a field, as the game writes it (scan-events).
function fieldExpr(call, field) {
  const o = call.opts || {};
  if (call.name === "Pop.text") return field === "word" ? call.args[2] : null;
  if (call.name === "Notify.say") return field === "word" ? call.args[0] : o.sub;
  return o[field];
}

function enWords(call) {
  const out = new Set(), dict = frDict(), W = web("en");
  const fields = (call.texts && call.texts.fields) || {};
  for (const k of ["word", "sub"]) {
    const f = fields[k];
    if (!f) continue;
    if (f.code) {
      (String(f.expr).match(/Lang\.t\(\s*(["'])(?:\\.|(?!\1)[^\\])*\1\s*\)/g) || [])
        .forEach((t) => strLits(t).forEach((w) => out.add(w)));
      strLits(f.expr).forEach((w) => { if (dict[w] != null) out.add(w); });
      (String(f.expr).match(/CONFIG\.copy\.\w+/g) || []).forEach((r) => {
        const v = W && W.CONFIG && W.CONFIG.copy && W.CONFIG.copy[r.split(".")[2]];
        if (typeof v === "string") out.add(v);
      });
      // A bare slot (`word`, a helper's parameter) is the bench's guess, not the game's word.
      if (!/^\s*\$\[\d+\]\s*$/.test(f.code)) builtValues(call, f).forEach((w) => { if (dict[w] != null) out.add(w); });
    } else if (f.lit != null && isLit(fieldExpr(call, k))) out.add(f.lit);
  }
  if (call.name === "Pop.show" && !fields.word && W && W.Pop && W.Pop.styles) {
    const st = W.Pop.styles[call.preview.args[0]];
    if (st && typeof st.word === "string") out.add(st.word);
  }
  return [...out].filter((w) => /[A-Za-z]{2}/.test(w));
}

/* A word read out of the round's state (`T2.name`) is every value it can take:
   the code run in English with the dictionary off, over each choice of its
   pick and true/false slots (capped), the others at their default. What comes
   out whole and is a key of the dictionary is a word this callout writes. */
const IDLANG = { t: (x) => x, code: () => "en", set: () => {} };
function builtValues(call, f) {
  const W = web("en");
  if (!W) return [];
  const slots = (call.texts && call.texts.slots) || [];
  let combos = [slotValues(call, null)];
  slots.forEach((sl, i) => {
    const opts = sl.kind === "bool" ? [true, false] : sl.kind === "pick" && sl.choices ? sl.choices : null;
    if (!opts || combos.length * opts.length > 64) return;
    combos = combos.flatMap((c) => opts.map((o) => { const n = c.slice(); n[i] = o; return n; }));
  });
  const out = new Set();
  for (const c of combos) {
    try {
      const v = runner(f.code)(c, IDLANG, W.CONFIG, W.upper);
      if (typeof v === "string") out.add(v);
    } catch (e) {}
  }
  return [...out];
}

function enState(call) {
  const words = enWords(call), dict = frDict(), pend = state.pending.keepEn;
  const cur = (w) => (pend[w] !== undefined ? pend[w] : dict[w] === w);
  return {
    words,
    all: words.length > 0 && words.every(cur),
    dirty: words.some((w) => pend[w] !== undefined)
  };
}

function paintEn(call, row, btn) {
  const st = enState(call);
  btn.classList.toggle("on", st.all);
  btn.classList.toggle("dirty", st.dirty);
  btn.disabled = !st.words.length;
  btn.title = !st.words.length
    ? "nothing here goes through the dictionary — a built word with no Lang.t piece"
    : (st.all ? "kept in English on the French screen — click to give the French back" : "keep it in English on the French screen") +
      " · " + st.words.map((w) => '"' + w + '"').join(", ") + (st.dirty ? " · apply writes it" : "");
}
function paintAllEn() {
  document.querySelectorAll(".call").forEach((r) => { if (r._en) r._en(); });
}

function toggleEn(call) {
  const st = enState(call);
  if (!st.words.length) { note("no word of this call goes through the dictionary"); return; }
  const target = !st.all, dict = frDict();
  st.words.forEach((w) => {
    if ((dict[w] === w) === target) delete state.pending.keepEn[w];
    else state.pending.keepEn[w] = target;
  });
  countPending();
  refreshReads();
  paintAllEn();
  note(target
    ? st.words.map((w) => '"' + w + '"').join(", ") + " will stay English on the French screen — every callout that writes it"
    : "the French comes back on apply");
}

/* ===========================================================================
   The clips: lab/events-clips/<slug>/ (tools/lab/serve-events.mjs).

   A row's clip is the one recorded for its checkId. A call edited since has a
   new checkId; it borrows the clip of the nearest event of the same call name
   in the same function that no live call claims, and says so (amber ↻).
   =========================================================================== */
function loadClips() {
  const slug = state.slug;
  state.offset = null;
  fetch("api/clips?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((idx) => {
    if (slug !== state.slug) return;
    state.clips = idx && idx.clips ? idx : { clips: {}, byId: {} };
    paintClips();
  });
  loadOffset();
}

/* Asked again every time the played frame loads, not only when the game is
   picked: an offset that failed then (a build half-way through) would leave
   REC catching nothing for the whole session, and saying nothing about it. */
function loadOffset() {
  const slug = state.slug;
  fetch("api/offset?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((o) => {
    if (slug !== state.slug) return;
    state.offset = o && o.offset != null ? o.offset : null;
    if (REC.on && state.offset == null) note("rec: " + ((o && o.error) || "no offset for " + slug) + " — nothing can be caught");
  }).catch((e) => { if (REC.on) note("rec: api/offset failed — " + e.message); });
}

function nearEvent(call) {
  const idx = state.clips, live = new Set(state.data ? state.data.calls.map((c) => c.checkId) : []);
  let best = null;
  for (const [file, clip] of Object.entries(idx.clips || {})) {
    for (const e of clip.events || []) {
      if (e.name !== call.name || e.fn !== (call.fn || "") || live.has(e.id)) continue;
      const d = Math.abs(e.line - call.line);
      if (!best || d < best.d) best = { file, clip, e, d };
    }
  }
  return best;
}

function clipFor(call) {
  if (!call || call.inherited || !call.checkId) return null;
  const idx = state.clips, f = idx.byId && idx.byId[call.checkId];
  if (f && idx.clips[f]) return { file: f, clip: idx.clips[f], near: false };
  const n = nearEvent(call);
  return n ? { file: n.file, clip: n.clip, near: true } : null;
}

// A recorded event → the call the source has now (the same id, or the near one).
function callOf(e) {
  const calls = state.data ? state.data.calls : [];
  const hit = calls.find((c) => c.checkId === e.id);
  if (hit) return hit;
  const ids = new Set(calls.map((c) => c.checkId));
  let best = null;
  for (const c of calls) {
    if (c.name !== e.name || (c.fn || "") !== e.fn || c.inherited) continue;
    // A call that has a clip of its own is not the one this event was.
    if (state.clips.byId[c.checkId] && ids.has(c.checkId)) continue;
    const d = Math.abs(c.line - e.line);
    if (!best || d < best.d) best = { c, d };
  }
  return best ? best.c : null;
}

function paintClips() {
  document.querySelectorAll(".call").forEach((row) => {
    const b = row.querySelector(".loop"), c = row._call;
    if (!b || !c) return;
    if (c.inherited) { b.disabled = true; b.title = "a motor line — the recorder catches the game's own calls only"; return; }
    const hit = clipFor(c);
    b.classList.toggle("has", !!hit);
    b.classList.toggle("near", !!(hit && hit.near));
    b.classList.toggle("on", LOOP.id === c.checkId);
    b.title = !hit ? "not seen in play yet — Rec, and play until it fires"
      : LOOP.id === c.checkId ? "stop the loop"
      : "loop the moment of the game it fires on (" + hit.clip.dur.toFixed(1) + " s, recorded " + hit.clip.when.replace("T", " ") + ")" +
        (hit.near ? " — recorded before this call was edited" : "");
  });
  const pill = el("stats").querySelector(".seen-pill");
  if (pill && state.data) {
    const pool = state.data.calls.filter((c) => c.checkId && !c.inherited && KINDS[c.kind]);
    const seen = pool.filter((c) => clipFor(c)).length;
    pill.innerHTML = `<b>${seen}</b> / ${pool.length} seen in play`;
    pill.title = "callouts and notices with a recorded moment — Rec and play to capture the rest";
  }
}

/* ===========================================================================
   The LOOP: the clip under both frames, the moment fired over it.
   =========================================================================== */
const LOOP = { id: null, call: null, clip: null, file: null, near: false, url: null, events: [], muted: {}, raf: 0, prev: -1 };
const clipVideos = () => [...document.querySelectorAll("video.clip")];

function setClear(on) {
  LANGS.forEach((lang) => {
    try { frames[lang].contentDocument.documentElement.classList.toggle("lab-clear", on); } catch (e) {}
  });
}

function loopToggle(call) {
  if (LOOP.id && LOOP.id === call.checkId) { loopStop(); return; }
  const hit = clipFor(call);
  if (!hit) { note("not seen in play yet — Rec, and play until it fires"); return; }
  loopStart(call, hit);
}

function loopStart(call, hit) {
  loopStop();
  if (REC.on) recToggle(false);
  Object.assign(LOOP, { id: call.checkId, call, clip: hit.clip, file: hit.file, near: hit.near, muted: {}, prev: -1 });
  // The whole moment: every event of the window, each at its own time, once.
  const seen = {};
  LOOP.events = (hit.clip.events || []).map((e) => ({ e, call: callOf(e) }))
    .filter((x) => x.call && !seen[x.call.checkId + "@" + x.e.t] && (seen[x.call.checkId + "@" + x.e.t] = 1));
  // A beat's rows hold COPIES of the scan's calls: a call is the same call by its id.
  if (!LOOP.events.some((x) => x.call.checkId === call.checkId)) LOOP.events.push({ e: { id: call.checkId, t: hit.clip.at }, call });
  LOOP.events.sort((a, b) => a.e.t - b.e.t);
  const slug = state.slug, id = call.checkId;
  fetch("clips/" + encodeURIComponent(slug) + "/" + hit.file).then((r) => {
    if (!r.ok) throw new Error("clip " + hit.file + " is gone");
    return r.blob();
  }).then((blob) => {
    if (LOOP.id !== id || slug !== state.slug) return;
    LOOP.url = URL.createObjectURL(blob);
    document.body.classList.add("looping");
    setClear(true);
    clipVideos().forEach((v) => { v.src = LOOP.url; v.currentTime = 0; v.play().catch(() => {}); });
    unlock();
    drawReplay();
    fit();
    paintClips();
    LOOP.raf = requestAnimationFrame(loopTick);
  }).catch((e) => { note("loop: " + e.message); loopStop(); });
  paintClips();
}

function loopStop() {
  cancelAnimationFrame(LOOP.raf);
  const was = !!LOOP.id;
  Object.assign(LOOP, { id: null, call: null, clip: null, file: null, events: [], raf: 0 });
  clipVideos().forEach((v) => { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} });
  if (LOOP.url) { URL.revokeObjectURL(LOOP.url); LOOP.url = null; }
  document.body.classList.remove("looping");
  setClear(false);
  if (was) { drawReplay(); fit(); paintClips(); }
}

function loopRestart() {
  clipVideos().forEach((v) => { try { v.currentTime = 0; v.play().catch(() => {}); } catch (e) {} });
  LOOP.prev = -1;
}

const evKey = (x) => x.call.checkId + "@" + x.e.t;

function loopTick() {
  if (!LOOP.clip) return;
  LOOP.raf = requestAnimationFrame(loopTick);
  const [en, fr] = ["en", "fr"].map((l) => document.querySelector('video.clip[data-lang="' + l + '"]'));
  if (!en || !en.src) return;
  // MediaRecorder writes no duration into a webm: the index's is the one to trust.
  const dur = LOOP.clip.dur || en.duration;
  if (en.ended || (isFinite(dur) && en.currentTime >= dur - 0.03)) { loopRestart(); return; }
  const t = en.currentTime;
  if (t < LOOP.prev - 0.1) LOOP.prev = -1;
  for (const x of LOOP.events) {
    if (LOOP.muted[evKey(x)] || !(x.e.t > LOOP.prev && x.e.t <= t)) continue;
    const row = document.querySelector('.call[data-check="' + CSS.escape(x.call.checkId) + '"]');
    fire(x.call, row);
  }
  LOOP.prev = t;
  if (fr && fr.src && Math.abs(fr.currentTime - t) > 0.15) { try { fr.currentTime = t; } catch (e) {} }
  const tm = el("replay").querySelector(".time");
  if (tm) tm.textContent = t.toFixed(1) + " / " + (isFinite(dur) ? dur.toFixed(1) : "?") + " s";
}

function evLabel(call) {
  if (call.kind === "sound") return String(call.preview.args[0]) + " L" + call.line;
  const w = call.texts && call.texts.fields && call.texts.fields.word;
  const word = w ? (w.lit != null ? w.lit : w.expr) : call.preview.args[0];
  const s = String(word == null ? call.name : word);
  return (s.length > 16 ? s.slice(0, 15) + "…" : s) + " L" + call.line;
}

function drawReplay() {
  const box = el("replay");
  if (!LOOP.clip) { box.innerHTML = ""; return; }
  const c = LOOP.call;
  box.innerHTML =
    `<span class="what">↻ L${c.line} ${c.fn ? esc(c.fn) + "()" : "top level"} · ${esc(c.name)}</span>` +
    `<span class="time"></span>` +
    (LOOP.near ? `<span class="approx" title="the call was edited since this moment was recorded — the clip is the one its older self fired on">recorded before the edit</span>` : "") +
    `<span class="sp"></span>` +
    `<button class="act sm ghost" data-a="drop" title="forget this recording — the next time it fires under Rec, it is captured again">Drop clip</button>` +
    `<button class="act sm" data-a="stop">Stop</button>` +
    `<div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px">` +
    LOOP.events.map((x, i) =>
      `<button class="ev k-${x.call.kind}${x.call.checkId === c.checkId ? " me" : ""}${LOOP.muted[evKey(x)] ? " off" : ""}" data-i="${i}" ` +
      `title="${esc(x.call.name)} at ${x.e.t.toFixed(2)} s — click to mute it in the loop">${esc(evLabel(x.call))} · ${x.e.t.toFixed(1)}s</button>`).join("") +
    `</div>`;
  box.querySelector('[data-a="stop"]').onclick = loopStop;
  box.querySelector('[data-a="drop"]').onclick = dropClip;
  box.querySelectorAll(".ev").forEach((b) => {
    b.onclick = () => {
      const k = evKey(LOOP.events[Number(b.dataset.i)]);
      LOOP.muted[k] = !LOOP.muted[k];
      b.classList.toggle("off", LOOP.muted[k]);
    };
  });
}

function dropClip() {
  const file = LOOP.file, slug = state.slug;
  if (!file) return;
  fetch("api/clip-drop", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game: slug, file }) })
    .then((r) => r.json())
    .then((res) => {
      if (res.error) { note("drop: " + res.error); return; }
      if (slug === state.slug) state.clips = res.index;
      loopStop();
      paintClips();
      note("clip dropped — Rec, and the next time it fires it is captured again");
    });
}

/* ===========================================================================
   REC: the game itself, played, and its events caught as they fire.

   Each watched method of the build is wrapped (Pop, Notify, Sound): the
   wrapper reads its caller off the stack — a line of the built
   game.<hash>.js, which /api/offset maps to the source — and matches it to
   the row scan-events gave that line. A call the motor makes for itself has
   no frame in game.<hash>.js and is ignored.

   The canvas is sampled at REC_FPS into a ring of small canvases holding
   REC_PRE seconds. A callout or a notice with no clip yet keeps the ring and
   REC_POST seconds more — a second on each side is the moment, and more is
   the round going on about something else. Every other event in that window
   (another callout, a cue) rides along in the clip's list, so the loop can
   replay the moment whole; a cue opens no capture of its own here, since the
   sound page is where it is judged and recorded. The frames are encoded into a
   webm in real time (MediaRecorder over a canvas stream, each frame at the
   time it was taken) and posted to /api/clip.
   =========================================================================== */
const REC_PRE = 1, REC_POST = 1, REC_FPS = 20, REC_W = 360, REC_H = 640;
const REC = { on: false, W: null, canvas: null, ground: "#000", ring: [], pool: [], log: [], open: null,
              inflight: new Set(), saved: 0, busy: 0, raf: 0, last: 0 };
const recFrame = el("rec-frame");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function recToggle(on) {
  REC.on = on === undefined ? !REC.on : !!on;
  el("btn-rec").classList.toggle("on", REC.on);
  document.body.classList.toggle("rec", REC.on);
  cancelAnimationFrame(REC.raf);
  if (REC.on) {
    loopStop();
    recLoad();
    REC.raf = requestAnimationFrame(recTick);
    note("play — every callout with no clip yet is captured, a second either side of it");
  } else {
    recDiscard();
    REC.W = REC.canvas = null;
    recFrame.src = "about:blank";
  }
  recInfo();
  fit();
}

function recLoad() {
  recDiscard();
  REC.W = REC.canvas = null;
  // force=1: every level of the map can be started, for this load only (levels.js).
  recFrame.src = "build/" + state.slug + "/index.html?first=0&lang=en&force=1";
  recLevels(0);
}

/* The level picker: filled from the played build once it is up (its climb's
