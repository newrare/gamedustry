<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — conquest ink wash</title>
<meta name="lab-group" content="css">
<style>
/* ===========================================================================
   CONQUEST INK WASH — the look lab/conquest-map.html settled on for
   prototype/conquest-ticks.html, in ten colourways, with the three arrows
   kept from that round.

   The map is the same ink-wash shader: a brush coast on paper, a wash of ink
   on the sea near the shore with a few ripple strokes, the camps laid on in
   watercolour that blooms darker at the edge of every region, and the relief
   brushed in as ink shadow on the far side of the hills. What changes from
   one colourway to the next is the paper, the ink, the wash and the two
   camps — the shader is one function and a colourway is ten colours.

   The arrows are kept for what they say, so the page can use them by ACTION:
   Front for an attack (and a landing), Chevrons for a move between the
   player's own regions, Tracks for a column on a march of several ticks; the
   red orders a spy revealed are Fronts, faded, with the eye. "One arrow" puts
   a single kind on every order instead, to judge it alone.

   Views: One (the colourway picked, at 2x), All (the ten side by side). A
   click on a frame opens it. Nothing here ships.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  min-height:100vh;
  display:flex;
  background:#0b0b12;
  color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

#panel {
  flex:0 0 300px;
  height:100vh; overflow:auto;
  padding:22px 18px;
  background:#12121c;
  border-right:1px solid #23233a;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel h2 { margin:18px 0 8px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#8b8ba7; }
#panel p.hint { margin:8px 0 16px; font-weight:500; font-size:12px; color:#8b8ba7; }
.seg { display:flex; gap:6px; flex-wrap:wrap; }
.seg button, .list button {
  flex:1; padding:7px 10px;
  background:#1b1b2a; color:#e8e6f5; border:1px solid #2c2c47; border-radius:8px;
  font:inherit; cursor:pointer; text-align:left;
}
.seg button { text-align:center; }
.seg button.on, .list button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
.list { display:flex; flex-direction:column; gap:5px; }
.list button { display:flex; gap:10px; align-items:center; }
.list button .sw { flex:0 0 auto; display:flex; border-radius:5px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.15); }
.list button .sw i { display:block; width:9px; height:26px; }
.list button b { display:block; font-size:13px; }
.list button span { display:block; font-weight:500; font-size:11px; opacity:.75; }
.legend { margin-top:8px; font-weight:500; font-size:12px; color:#9c9cba; }
.legend b { color:#e8e6f5; }
.tog { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:#c9c9e0; cursor:pointer; }
.tog input { accent-color:#7ea6ff; }

#stage {
  flex:1; height:100vh; overflow:auto;
  padding:24px;
  background-image:
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%),
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%);
  background-size:32px 32px;
  background-position:0 0, 16px 16px;
}
#stage.one { display:flex; align-items:center; justify-content:center; }
#stage.one .fr { height:calc(100vh - 48px); }
#stage.one canvas { height:calc(100% - 40px); width:auto; }
#stage.all { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:22px 18px; align-content:start; }
#stage.all .fr { cursor:pointer; }
#stage.all canvas:hover { outline:3px solid #7ea6ff; }
#stage .busy { margin:auto; color:#8b8ba7; font-size:15px; }
.fr { display:flex; flex-direction:column; gap:8px; }
.fr canvas { display:block; width:100%; border-radius:14px; box-shadow:0 18px 50px rgba(0,0,0,.5); }
.fr figcaption { font-size:12px; color:#9c9cba; font-weight:500; }
.fr figcaption b { color:#e8e6f5; font-size:13px; }
</style>
</head>
<body>

<div id="panel">
  <h1>Conquest ink</h1>
  <p class="hint">The ink-wash map in ten colourways, with Front, Chevrons and Tracks.</p>

  <div class="seg">
    <button data-v="one">One</button>
    <button data-v="all">All</button>
  </div>

  <h2>Colourway</h2>
  <div class="list" id="ways"></div>

  <h2>Arrows</h2>
  <div class="seg" id="modes">
    <button data-m="action">By action</button>
    <button data-m="front">Front</button>
    <button data-m="chevrons">Chevrons</button>
    <button data-m="tracks">Tracks</button>
  </div>
  <p class="legend"><b>By action</b>: Front attacks and lands, Chevrons moves between your own regions, Tracks marches over several ticks; a spied red order is a faded Front.</p>

  <h2>Show</h2>
  <label class="tog"><input type="checkbox" id="t-anim" checked> Animate</label>
  <label class="tog"><input type="checkbox" id="t-relief" checked> Brushed relief</label>
  <label class="tog"><input type="checkbox" id="t-names"> Region names</label>
  <label class="tog"><input type="checkbox" id="t-hud" checked> Top bar</label>
</div>

<div id="stage"></div>

<script>
(function () {
  "use strict";

  const W = 720, H = 1280;

  /* ==========================================================================
     THE WORLD — the same scene as lab/conquest-map.html.
     ========================================================================== */
  const BLOBS = [
    [150, 260, 115], [305, 225, 125], [470, 245, 120], [610, 310, 105], [225, 400, 115], [420, 405, 120],
    [580, 455, 95], [300, 525, 85], [60, 520, 30],
    [110, 665, 62], [265, 690, 60], [430, 640, 72], [605, 705, 72], [515, 755, 40],
    [180, 905, 105], [370, 880, 115], [565, 920, 105], [255, 1045, 110], [445, 1060, 112], [610, 1065, 72],
    [350, 1185, 82], [175, 1160, 58],
    [675, 560, 32], [650, 1210, 30], [70, 800, 24]
  ];

  const REG = [
    [150, 255, "r", "Norvik", null], [310, 225, "r", "Aldmar", "cap"], [470, 245, "r", "Kestra", null],
    [610, 315, "r", "Varos", "city"], [215, 405, "r", "Myrr", null], [420, 400, "r", "Tolen", "fort"],
    [580, 455, "r", "Ostra", "iron"], [290, 530, "r", "Brann", null],
    [110, 665, "n", "Brevin", "grain"], [265, 690, "n", "Calder", "city"], [430, 645, "n", "Duna", "city"],
    [605, 705, "n", "Esker", "gold"],
    [180, 905, "b", "Falun", null], [370, 885, "b", "Garr", "fort"], [565, 920, "b", "Holm", "city"],
    [255, 1050, "n", "Isel", "grain"], [445, 1065, "b", "Jarrow", "cap"], [610, 1065, "b", "Kalm", "port"],
    [350, 1185, "b", "Lund", null], [675, 560, "n", "Mora", "oil"]
  ].map(function (r, i) {
    return { i: i, x: r[0], y: r[1], o: r[2] === "b" ? 1 : r[2] === "r" ? 2 : 0, name: r[3], mk: r[4] };
  });

  const FLEET = [55, 1000];
  const UNITS = [
    { r: 0, k: "inf", n: 3 }, { r: 1, k: "art", n: 2 }, { r: 2, k: "inf", n: 2 }, { r: 3, k: "inf", n: 2 },
    { r: 4, k: "inf", n: 4 }, { r: 5, k: "inf", n: 7 }, { r: 6, k: "cav", n: 5 }, { r: 7, k: "inf", n: 3 },
    { r: 8, k: "inf", n: 1 }, { r: 9, k: "inf", n: 3 }, { r: 10, k: "inf", n: 2 }, { r: 11, k: "inf", n: 2 },
    { r: 15, k: "inf", n: 2 }, { r: 19, k: "inf", n: 1 },
    { r: 12, k: "inf", n: 5 }, { r: 13, k: "inf", n: 6, gen: true }, { r: 14, k: "cav", n: 4 }, { r: 16, k: "art", n: 3 },
    { r: 17, k: "inf", n: 2 }, { r: 18, k: "inf", n: 1 }, { at: FLEET, o: 1, k: "fleet", n: 3 }
  ];

  // act: what the order does, which picks its arrow "by action".
  const ORDERS = [
    { a: 13, b: 9, o: 1, n: 6, bend: -0.15, act: "attack" },
    { a: 14, b: 11, o: 1, n: 4, bend: 0.15, act: "attack" },
    { a: 16, b: 13, o: 1, n: 3, bend: 0.25, act: "move", thin: true },
    { a: 12, b: 13, o: 1, n: 2, bend: 0.2, act: "move", thin: true },
    { a: FLEET, b: 8, o: 1, n: 3, bend: -0.12, act: "attack" },
    { a: 6, b: 11, o: 2, n: 5, bend: -0.2, act: "attack", ghost: true },
    { a: 4, b: 8, o: 2, n: 4, bend: 0.2, act: "attack", ghost: true }
  ];
  const MARCH = { a: 1, b: 10, o: 2, n: 4, bend: 0.12, at: 0.55, eta: "2 ticks", act: "march" };
  const CLASH = 11;
  const BY_ACTION = { attack: "front", move: "chevrons", march: "tracks" };

  /* ==========================================================================
     THE COLOURWAYS — ten colours each. shade is what the relief is brushed
     with (the ink on light paper, a deeper tone on dark paper).
     ========================================================================== */
  const WAYS = [
    { key: "sumi", name: "Sumi", desc: "Rice paper, black ink, indigo against vermilion.",
      paper: "#f1e8d5", paperL: "#f8f1e3", ink: "#26221e", wash: "#71879a", blue: "#2f4f8f", red: "#c23b26", neutral: "#c9a35a", shade: "#3a332b" },
    { key: "sepia", name: "Sepia", desc: "An old campaign journal: brown ink, Prussian blue against madder.",
      paper: "#ecdcc0", paperL: "#f4e7cf", ink: "#4a3020", wash: "#8a6f55", blue: "#2c4a6b", red: "#a8322a", neutral: "#b8894a", shade: "#5a3f28" },
    { key: "celadon", name: "Celadon", desc: "Pale jade paper, a green-grey sea, cobalt against cinnabar.",
      paper: "#e1e9dd", paperL: "#edf2ea", ink: "#2e3b35", wash: "#5f9584", blue: "#2a4f9e", red: "#c4402f", neutral: "#a6a86a", shade: "#3d4a43" },
    { key: "sakura", name: "Sakura", desc: "Blush paper, plum ink, blue-violet against crimson.",
      paper: "#f5e4e2", paperL: "#fbf0ee", ink: "#3b2430", wash: "#9b7f9c", blue: "#4a4fa8", red: "#c9304f", neutral: "#c7a07a", shade: "#4a3040" },
    { key: "slate", name: "Monsoon", desc: "Rain-grey paper, slate ink, steel blue against rust.",
      paper: "#dfe2e5", paperL: "#edeff1", ink: "#262b31", wash: "#55697a", blue: "#1f5f8b", red: "#b8452c", neutral: "#9e9a86", shade: "#333a42" },
    { key: "kraft", name: "Kraft", desc: "Brown wrapping paper and a heavy grain, cobalt against red.",
      paper: "#c9a57a", paperL: "#d7b78e", ink: "#241a12", wash: "#5d4e3e", blue: "#1f3f86", red: "#b0281c", neutral: "#8f6f3c", shade: "#3a2a1c", grain: 1.8 },
    { key: "gold", name: "Gold leaf", desc: "Ivory paper with a gilded coast, navy against scarlet.",
      paper: "#f3ead6", paperL: "#faf4e6", ink: "#2a2420", coast: "#b8862e", wash: "#8c9aa6", blue: "#1d3570", red: "#b3202a", neutral: "#c9a24a", shade: "#3a332b" },
    { key: "night", name: "Night ink", desc: "Ink-black paper drawn in chalk, sky blue against coral.",
      paper: "#14161f", paperL: "#1e212c", ink: "#e9e3d2", wash: "#35567a", blue: "#4f8fe0", red: "#ef6a4f", neutral: "#8a7a55", shade: "#000000", dark: true },
    { key: "aizome", name: "Aizome", desc: "Indigo-dyed cloth in cream thread, pale sky against persimmon.",
      paper: "#1b2c52", paperL: "#243a68", ink: "#f1ead8", wash: "#0c1734", blue: "#8cc0f2", red: "#f2794c", neutral: "#c9b98a", shade: "#0a1430", dark: true },
    { key: "snow", name: "Snow", desc: "Bright white paper, pure black ink, a clean blue against a clean red.",
      paper: "#f4f4f2", paperL: "#ffffff", ink: "#111111", wash: "#9aa4ad", blue: "#1d4ed8", red: "#dc2626", neutral: "#c8c0b0", shade: "#333333" }
  ];

  /* ==========================================================================
     NOISE & FIELDS — as in lab/conquest-map.html.
     ========================================================================== */
  const VAL = new Float32Array(256), PERM = new Uint8Array(512);
  (function () {
    let s = 1234567;
    const r = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < 256; i++) { VAL[i] = r(); PERM[i] = i; }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)), t = PERM[i]; PERM[i] = PERM[j]; PERM[j] = t; }
    for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
  })();
  function vn(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = VAL[PERM[PERM[X] + Y]], b = VAL[PERM[PERM[X + 1] + Y]], c = VAL[PERM[PERM[X] + Y + 1]], d = VAL[PERM[PERM[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct) {
    let s = 0, amp = 0.5, tot = 0;
    for (let o = 0; o < oct; o++) { s += vn(x, y) * amp; tot += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
    return s / tot;
  }
  const clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  const sstep = function (a, b, v) { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };

  function edt1d(f, n, d, v, z) {
    let k = 0;
    v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  }
  function edt(mask, w, h, target) {
    const g = new Float32Array(w * h), n = Math.max(w, h);
    const f = new Float32Array(n), d = new Float32Array(n), v = new Int32Array(n), z = new Float32Array(n + 1);
    for (let i = 0; i < w * h; i++) g[i] = mask[i] === target ? 0 : 1e20;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      edt1d(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      edt1d(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = d[x];
    }
    return g;
  }

  const FIELDS = {};
  function fields(res) {
    if (FIELDS[res]) return FIELDS[res];
    const w = W * res, h = H * res, N = w * h, n = REG.length;
    const land = new Uint8Array(N), id = new Uint8Array(N), own = new Uint8Array(N);
    const e = new Float32Array(N), f = new Float32Array(N), ht = new Float32Array(N), gr = new Float32Array(N);
    const SX = REG.map(function (r) { return r.x; }), SY = REG.map(function (r) { return r.y; }), SO = REG.map(function (r) { return r.o; });
    const DD = REG.map(function (a) { return REG.map(function (b) { return Math.hypot(a.x - b.x, a.y - b.y) || 1; }); });
    for (let py = 0; py < h; py++) {
      const y = (py + 0.5) / res;
      for (let px = 0; px < w; px++) {
        const x = (px + 0.5) / res, i = py * w + px;
        const wx = x + (fbm(x * 0.006 + 3.1, y * 0.006 + 7.7, 2) - 0.5) * 80;
        const wy = y + (fbm(x * 0.006 + 11.3, y * 0.006 + 1.9, 2) - 0.5) * 80;
        let m = -9;
        for (let k = 0; k < BLOBS.length; k++) {
          const b = BLOBS[k], dx = wx - b[0], dy = wy - b[1], v = 1 - Math.sqrt(dx * dx + dy * dy) / b[2];
          if (v > m) m = v;
        }
        land[i] = m + (fbm(x * 0.022, y * 0.022, 3) - 0.5) * 0.45 > 0 ? 1 : 0;
        const rx = x + (wx - x) * 0.55, ry = y + (wy - y) * 0.55;
        let b1 = 0, d1 = 1e12, b2 = 0, d2 = 1e12;
        for (let k = 0; k < n; k++) {
          const dx = rx - SX[k], dy = ry - SY[k], dd = dx * dx + dy * dy;
          if (dd < d1) { d2 = d1; b2 = b1; d1 = dd; b1 = k; } else if (dd < d2) { d2 = dd; b2 = k; }
        }
        const o1 = SO[b1];
        let bo = -1, dO = 1e12;
        for (let k = 0; k < n; k++) {
          if (SO[k] === o1) continue;
          const dx = rx - SX[k], dy = ry - SY[k], dd = dx * dx + dy * dy;
          if (dd < dO) { dO = dd; bo = k; }
        }
        id[i] = b1; own[i] = o1;
        e[i] = (d2 - d1) / (2 * DD[b1][b2]);
        f[i] = bo < 0 ? 999 : (dO - d1) / (2 * DD[b1][bo]);
        ht[i] = fbm(x * 0.011, y * 0.011, 4);
        gr[i] = vn(x * 0.31, y * 0.31) * 0.55 + vn(x * 1.1 + 50, y * 1.1) * 0.45;
      }
    }
    const toSea = edt(land, w, h, 0), toLand = edt(land, w, h, 1), sdf = new Float32Array(N);
    for (let i = 0; i < N; i++) sdf[i] = land[i] ? (Math.sqrt(toSea[i]) - 0.5) / res : -(Math.sqrt(toLand[i]) - 0.5) / res;

    // The relief, lit from the top left: what the brush shades is the far side of the hills.
    const Hf = new Float32Array(N), lam = new Float32Array(N);
    for (let i = 0; i < N; i++) Hf[i] = sdf[i] > 0 ? Math.pow(clamp01(sdf[i] / 90), 0.6) * (0.25 + 0.75 * ht[i]) : 0;
    const L = [-0.55, -0.6, 0.58], ll = Math.hypot(L[0], L[1], L[2]);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        const gx = (Hf[x < w - 1 ? i + 1 : i] - Hf[x > 0 ? i - 1 : i]) * res / 2 * 140;
        const gy = (Hf[y < h - 1 ? i + w : i] - Hf[y > 0 ? i - w : i]) * res / 2 * 140;
        lam[i] = (-gx * L[0] - gy * L[1] + L[2]) / (Math.hypot(gx, gy, 1) * ll);
      }
    }
    FIELDS[res] = { res: res, w: w, h: h, sdf: sdf, e: e, f: f, id: id, own: own, ht: ht, g: gr, lam: lam, Hf: Hf };
    return FIELDS[res];
  }

  /* ==========================================================================
     THE INK-WASH SHADER — one function, a colourway is its colours.
     ========================================================================== */
  const hx = function (h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
  const set = function (c, a) { c[0] = a[0]; c[1] = a[1]; c[2] = a[2]; };
  const mixTo = function (c, a, t) { if (t <= 0) return; if (t > 1) t = 1; c[0] += (a[0] - c[0]) * t; c[1] += (a[1] - c[1]) * t; c[2] += (a[2] - c[2]) * t; };
  const mul = function (c, k) { c[0] *= k; c[1] *= k; c[2] *= k; };
  const css = function (a, al) { return al == null ? "rgb(" + (a[0] | 0) + "," + (a[1] | 0) + "," + (a[2] | 0) + ")" : "rgba(" + (a[0] | 0) + "," + (a[1] | 0) + "," + (a[2] | 0) + "," + al + ")"; };
  const mixHex = function (a, b, t) { const A = hx(a), B = hx(b); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]; };
  const lum = function (h) { const a = hx(h); return 0.299 * a[0] + 0.587 * a[1] + 0.114 * a[2]; };

  function inkShader(F, cw, relief) {
    const paper = hx(cw.paper), paperL = hx(cw.paperL), ink = hx(cw.ink), coast = hx(cw.coast || cw.ink), wash = hx(cw.wash);
    const blue = hx(cw.blue), red = hx(cw.red), ochre = hx(cw.neutral), shade = hx(cw.shade);
    const gk = cw.grain || 1, dark = !!cw.dark;
    const brush = function (c, d, i) {
      const bw = 1.2 + 2.6 * F.ht[i];
      mixTo(c, coast, (1 - sstep(bw / 2 - 0.6, bw / 2 + 0.5, d)) * 0.92);
    };
    return {
      sea: function (i, x, y, c) {
        const s = F.sdf[i], g = F.g[i];
        set(c, paper); mul(c, 1 - 0.035 * gk + 0.05 * gk * g);
        mixTo(c, wash, Math.exp(s / 30) * (dark ? 0.55 : 0.34) * (0.7 + 0.6 * g));
        for (let k = 0; k < 2; k++) {

    const kind = function (act) { return f.mode === "action" ? BY_ACTION[act] : f.mode; };
    ctx.save(); ctx.globalAlpha = 0.85;
    ARROWS[kind("march")](ctx, MARCH.g, campColors(cw, 2), t, 0.8);
    ctx.restore();
    ORDERS.forEach(function (o) {
      ctx.save();
      if (o.ghost) ctx.globalAlpha = 0.5;
      ARROWS[kind(o.act)](ctx, o.g, campColors(cw, o.o), o.ghost ? t * 0.7 : t, o.thin ? 0.7 : 1);
      ctx.restore();
    });

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(f.top, 0, 0);
    ctx.setTransform(res, 0, 0, res, 0, 0);

    ORDERS.forEach(function (o) {
      const m = o.g.pointAt(o.g.tot * 0.45), w = o.ghost ? 62 : 40;
      pill(ctx, cw, m[0], m[1], w, campOf(cw, o.o), function (cx) {
        ctx.fillStyle = cw.ink; ctx.font = "700 20px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (o.ghost) { icon(ctx, "eye", cx - 13, m[1], 18, cw.ink); ctx.fillText(o.n, cx + 13, m[1] + 1); }
        else ctx.fillText(o.n, cx, m[1] + 1);
      });
    });

    if (f.hud) hud(ctx, cw);
  }

  function hud(ctx, cw) {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.2)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
    rrect(ctx, 16, 16, 688, 86, 6); ctx.fillStyle = css(hx(cw.paperL), 0.95); ctx.fill();
    ctx.restore();
    rrect(ctx, 22, 22, 676, 74, 3); ctx.lineWidth = 1.2; ctx.strokeStyle = css(hx(cw.ink), 0.35); ctx.stroke();
    ctx.fillStyle = cw.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = "700 30px " + FONT; ctx.fillText("Tick 7", 40, 54);
    ctx.font = "italic 500 20px " + FONT; ctx.globalAlpha = 0.75; ctx.fillText("next in 2h 14m", 40, 84); ctx.globalAlpha = 1;
    for (let i = 0; i < 5; i++) {
      rrect(ctx, 268 + i * 34, 38, 26, 20, 3);
      ctx.fillStyle = i < 3 ? "#d99a00" : cw.ink; ctx.globalAlpha = i < 3 ? 1 : 0.16; ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = cw.ink; ctx.globalAlpha = 0.75; ctx.font = "italic 500 18px " + FONT; ctx.fillText("3 couriers", 268, 86); ctx.globalAlpha = 1;
    [[1, 560], [2, 640]].forEach(function (s) {
      ctx.save(); ctx.translate(s[1], 59); ctx.rotate(-0.06);
      rrect(ctx, -28, -22, 56, 44, 5); ctx.fillStyle = s[0] === 1 ? cw.blue : cw.red; ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "700 26px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("7", 0, 2);
      ctx.restore();
    });
  }

  /* ==========================================================================
     PAGE
     ========================================================================== */
  const state = { view: "all", way: "sumi", mode: "action", anim: true, relief: true, names: false, hud: true };
  try {
    const hsh = new URLSearchParams(location.hash.slice(1));
    ["view", "way", "mode"].forEach(function (k) { if (hsh.get(k)) state[k] = hsh.get(k); });
  } catch (err) { /* a bad hash keeps the defaults */ }

  const stage = document.getElementById("stage"), list = document.getElementById("ways");
  let frames = [], t0 = performance.now(), frozen = 0;

  WAYS.forEach(function (cw) {
    const b = document.createElement("button");
    b.dataset.k = cw.key;
    b.innerHTML = '<span class="sw">' + [cw.paper, cw.ink, cw.wash, cw.blue, cw.red].map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") +
      "</span><span><b>" + cw.name + "</b><span>" + cw.desc + "</span></span>";
    b.addEventListener("click", function () { state.way = cw.key; render(); });
    list.appendChild(b);
  });
  document.querySelectorAll(".seg button[data-v]").forEach(function (b) { b.addEventListener("click", function () { state.view = b.dataset.v; render(); }); });
  document.querySelectorAll("#modes button").forEach(function (b) { b.addEventListener("click", function () { state.mode = b.dataset.m; render(); }); });
  ["anim", "relief", "names", "hud"].forEach(function (k) {
    const el = document.getElementById("t-" + k);
    el.checked = state[k];
    el.addEventListener("change", function () { state[k] = el.checked; render(); });
  });

  function render() {
    location.replace("#view=" + state.view + "&way=" + state.way + "&mode=" + state.mode);
    document.querySelectorAll(".seg button[data-v]").forEach(function (b) { b.classList.toggle("on", b.dataset.v === state.view); });
    document.querySelectorAll("#modes button").forEach(function (b) { b.classList.toggle("on", b.dataset.m === state.mode); });
    list.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.k === state.way); });
    const res = state.view === "all" ? 1 : 2;
    stage.className = state.view;
    if (!FIELDS[res]) {
      stage.innerHTML = '<div class="busy">Computing the world at ' + res + 'x…</div>';
      frames = [];
      setTimeout(function () { fields(res); render(); }, 30);
      return;
    }
    const shown = state.view === "one" ? WAYS.filter(function (w) { return w.key === state.way; }) : WAYS;
    stage.innerHTML = "";
    frames = shown.map(function (cw) {
      const fig = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
      fig.className = "fr";
      cv.width = W * res; cv.height = H * res;
      cap.innerHTML = "<b>" + cw.name + "</b> · " + cw.desc;
      fig.appendChild(cv); fig.appendChild(cap); stage.appendChild(fig);
      if (state.view === "all") fig.addEventListener("click", function () { state.way = cw.key; state.view = "one"; render(); });
      return { cv: cv, ctx: cv.getContext("2d"), res: res, cw: cw, mode: state.mode, hud: state.hud,
        bmp: bitmap(cw, res, state.relief), top: topLayer(cw, res, state.names) };
    });
    tick();
  }

  function tick() {
    const t = state.anim ? (performance.now() - t0) / 1000 : frozen;
    if (state.anim) frozen = t;
    frames.forEach(function (f) { drawFrame(f, t); });
  }
  (function loop() { if (state.anim) tick(); requestAnimationFrame(loop); })();
  render();
})();
</script>
</body>
</html>
