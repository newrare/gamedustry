<style>
/* ===========================================================================
   GRUDGEON YOKAI RULES — one way to beat each of the twenty, outside the motor.

   The question: a player who only throws plain blows, without reading how a
   yokai behaves, should have little chance against it. So every yokai gets
   a LOCK (until its key is played every blow still lands, but 80% weaker:
   a door, a cape, a mask, a parry, a tide; and some yokai punish on top:
   a fury, a flood, a drum, a grudge), a KEY (the behaviour to read: knock,
   guard on the charge, answer neither, bow, flee...) and the SIGNALS that
   say which is which: the gold pill on the yokai's bar, a greyed bar, a
   yokai drawn as a shadow, a tag on the red face of a scroll before it is
   played, and a callout when a blow runs into the lock. This page is for
   judging those signals, not for winning: a fight is endless by default —
   a hero never falls under 1 HP and an exorcised yokai comes back.

   Every bonus and malus is a round percentage (+50% damage, -80%, +30%
   attack a fury, +20% slower a water) or a whole number (turns, knocks, gold).
   A duration counts the YOKAI's turns, the ones on the frieze.

   FLEE is a card of every hero's turn, its odds on it: 50%, +4% a point of
   speed over the yokai's, between 20% and 90% — or the yokai's own (Teke
   Teke and Onryo 0%, Jinmenken, Kuchisake, Nopperabo and Gashadokuro 100%).
   Out, the party is back on the map and the yokai moves to another room
   (here: the fight starts again, as met in that room — which is the key of
   Nopperabo and Gashadokuro). Caught, the turn is lost and the yokai strikes
   the hero who tried.

   The panel's FEEDBACK lists every callout as the game would fire it: its
   Pop style, its word, its sub. The stage, the track, the frieze and the
   yokai's bar are lab/grudgeon-cast.html's (look C · Badges), the data
   games/grudgeon/game.js's; the rules are this page's own and replace the
   game's RULES once chosen.

   Keys: R restart the fight, N next yokai. #foe=<id> opens a yokai.
   Nothing here ships.
   =========================================================================== */

@font-face { font-family:"Bebas Neue"; src:url(../assets/motor/font/bebasneue.woff2) format("woff2"); }

* { box-sizing:border-box; margin:0; padding:0; }

body {
  height:100vh; overflow:hidden; display:flex; background:#0b0b12; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* ---------------------------------------------------------------------------
   PANEL — presets, the knobs, the readout
   --------------------------------------------------------------------------- */
#panel { flex:0 0 310px; padding:22px 20px; background:#12121c; border-right:1px solid #23233a; overflow:auto; max-height:100vh; }
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel p.hint { margin:8px 0 14px; font-weight:500; font-size:12px; color:#8b8ba7; }
#panel h3 { margin:18px 0 10px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#7ea6ff; }
.row { margin-bottom:12px; }
.row > label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; margin-bottom:6px; }
.row > label output { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row.na > label { opacity:.4; }
.row input[type=range] { width:100%; accent-color:#7ea6ff; }
.seg { display:flex; flex-wrap:wrap; gap:4px; }
.seg button { flex:1 1 auto; padding:7px 8px; background:#1c1c2c; color:#c9c9e0; border:1px solid #2c2c47;
  border-radius:7px; font:600 12px/1 inherit; cursor:pointer; }
.seg button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
.row.na .seg button, .row.na input { opacity:.4; pointer-events:none; }
.styles { display:flex; flex-direction:column; gap:4px; }
.styles button { text-align:left; padding:8px 10px; background:#1c1c2c; color:#c9c9e0; border:1px solid #2c2c47; border-radius:7px;
  font:600 12px/1.35 inherit; cursor:pointer; }
.styles button b { display:block; color:#e8e6f5; font-size:13px; }
.styles button span { color:#8b8ba7; font-weight:500; }
.styles button.on { border-color:#7ea6ff; background:#20263d; }
.styles button.dirty b::after { content:" · edited"; color:#e0b050; font-weight:600; }
.btns { display:flex; gap:6px; margin-top:10px; }
.btns button { flex:1; padding:8px 10px; background:#1c1c2c; color:#c9c9e0; border:1px solid #2c2c47; border-radius:8px; font:700 12px/1 inherit; cursor:pointer; }
.btns button.main { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
#readout { margin-top:6px; padding:12px 12px 6px; background:#0b0b12; border:1px solid #2c2c47; border-radius:10px; }
#readout div { display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; color:#9c9cba; }
#readout b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
#readout div.big b { font-size:22px; color:#ffd166; }

/* ---------------------------------------------------------------------------
   STAGE — the canvas, and over it the 720x1280 frame the DOM bar lives in
   --------------------------------------------------------------------------- */
#stage { flex:1; min-width:0; height:100vh; display:flex; align-items:center; justify-content:center; padding:18px;
  background-image:linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%),linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%);
  background-size:32px 32px; background-position:0 0,16px 16px; }
#wrap { position:relative; border-radius:14px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.5); background:#07060c; }
canvas { display:block; width:100%; height:100%; touch-action:none; -webkit-touch-callout:none; }
#frame { position:absolute; left:0; top:0; width:720px; height:1280px; transform-origin:0 0; pointer-events:none;
  -webkit-user-select:none; user-select:none; font-family:"Bebas Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

/* Bebas draws a division sign as a tiny plus: the system face draws it */
.dv { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-weight:800; font-size:.92em; }

/* ---- a refused tap says where to aim: a line, never a modal -------------- */
#aim { position:absolute; left:50%; top:458px; z-index:31; transform:translateX(-50%); padding:8px 20px 6px; border-radius:14px;
  background:rgba(8,5,14,.94); border:2px solid #ff8a9a; color:#ffe0e5; font-size:24px; letter-spacing:1px; white-space:nowrap;
  pointer-events:none; opacity:0; transition:opacity .15s ease; }
#aim.on { opacity:1; }

/* hit areas shown: the outline of everything the thumb can press */

/* ---- model D: THE DOCK — the info window, the hero row, the frieze -------
   (the frieze itself is drawn on the canvas, under the row) */
/* THE TRACK: one card a hero TURN, sliding right to left. The card of the
   turn just played shows a sliver at the left edge, the hero in turn is
   unfolded in the middle, the next turn is a whole folded card on the right
   and the one after a sliver at the right edge. The cards are model A's
   tiles: slanted, a colour edge on the left, dark, the hero in turn tinted
   with their colour. A folded card shows the hero's art and nothing else. */
#drow { position:absolute; left:0; width:720px; bottom:152px; height:196px; z-index:29; }
.tc { position:absolute; bottom:0; left:740px; width:100px; height:140px; }
.tc.anim { transition:left .45s cubic-bezier(.3,.7,.3,1), width .3s ease, height .3s ease; }
.tc .plate { position:absolute; inset:0; overflow:hidden; pointer-events:auto; touch-action:none; cursor:pointer;
  transform:skewX(-10deg); transform-origin:50% 100%; background:rgba(10,6,16,.86);
  box-shadow:0 0 0 2px rgba(255,255,255,.14), 0 8px 18px rgba(0,0,0,.55); transition:box-shadow .2s ease, background .3s ease, filter .2s ease; }
.tc .plate::before { content:""; position:absolute; left:0; top:0; bottom:0; width:7px; z-index:2; background:var(--hc); }
/* the card in turn: a breath of the hero's colour at the top (the tint knob), a thin rim, no glow */
.tc.on .plate { background:linear-gradient(180deg, var(--tint), transparent 70%), rgba(12,8,18,.92); box-shadow:0 0 0 2px var(--hc), 0 8px 18px rgba(0,0,0,.55); cursor:default; }
.tc.past .plate { filter:brightness(.55) saturate(.7); pointer-events:none; }
.tc.is-blue:not(.on) .plate { box-shadow:0 0 0 3px #4f9bff, 0 0 18px rgba(79,155,255,.7), 0 8px 18px rgba(0,0,0,.55); }
.tc.is-pin:not(.on) .plate { box-shadow:0 0 0 4px #4f9bff, 0 0 26px rgba(79,155,255,.95), 0 8px 18px rgba(0,0,0,.55); }
.tc b, .tc i { font-weight:400; font-style:normal; }
/* the hero's art: the whole folded card, a window at the left of the unfolded one */
.tc .art { position:absolute; left:-20px; top:0; bottom:0; width:calc(100% + 40px); transform:skewX(10deg);
  background:#2a1a30 no-repeat; background-size:var(--bsF); background-position:var(--bpF); transition:width .3s ease, opacity .3s ease; }
.tc.on .art { width:112px; background-size:var(--bsO); background-position:var(--bpO); -webkit-mask-image:linear-gradient(90deg, #000 65%, transparent); mask-image:linear-gradient(90deg, #000 65%, transparent); }
/* a cursed hero: violet bubbles round the face on the card (Jorogumo's cocoon) */
.tc .curse { position:absolute; left:45px; top:48px; width:0; height:0; z-index:1; opacity:0; transition:opacity .3s ease; pointer-events:none; }
.tc.on .curse { left:38px; top:70px; }
.tc.cursed .curse { opacity:1; }
.tc .curse::before { content:""; position:absolute; left:-40px; top:-40px; width:80px; height:80px; border-radius:50%;
  background:radial-gradient(circle, rgba(154,69,224,.45), rgba(154,69,224,0) 70%); }
.tc .curse i { position:absolute; left:0; top:0; width:10px; height:10px; margin:-5px; border-radius:50%; opacity:0;
  background:radial-gradient(circle at 35% 35%, #f3e6ff 0 18%, #c27cff 32%, #7a2fc0 100%);
  animation:bubble 1.8s ease-in infinite; }
.tc .curse i:nth-child(1) { --bx:-26px; --by:-6px; animation-delay:0s; }
.tc .curse i:nth-child(2) { --bx:22px; --by:-14px; animation-delay:.3s; width:8px; height:8px; }
.tc .curse i:nth-child(3) { --bx:-14px; --by:-28px; animation-delay:.6s; }
.tc .curse i:nth-child(4) { --bx:28px; --by:4px; animation-delay:.9s; width:12px; height:12px; }
.tc .curse i:nth-child(5) { --bx:4px; --by:-34px; animation-delay:1.2s; width:8px; height:8px; }
.tc .curse i:nth-child(6) { --bx:-30px; --by:12px; animation-delay:1.5s; }
@keyframes bubble { 0% { opacity:0; transform:translate(var(--bx), var(--by)) scale(.3); }
  35% { opacity:.95; } 85% { opacity:.8; transform:translate(var(--bx), calc(var(--by) - 16px)) scale(1); }
  100% { opacity:0; transform:translate(var(--bx), calc(var(--by) - 20px)) scale(1.3); } }
/* a stunned hero: violet stars circling the face on the card */
.tc .stun { position:absolute; left:45px; top:36px; width:0; height:0; z-index:1; opacity:0; transition:opacity .3s ease; pointer-events:none; }
.tc.on .stun { left:38px; top:54px; }
.tc.stunned .stun { opacity:1; }
.tc .stun b { position:absolute; left:-34px; top:-12px; width:68px; height:24px; }
.tc .stun i { position:absolute; width:14px; height:14px; margin:-7px; background:#c27cff;
  clip-path:polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  offset-path:ellipse(34px 10px at 34px 12px); animation:stunorbit 1.4s linear infinite; }
.tc .stun i:nth-child(2) { animation-delay:-.47s; background:#d9a8ff; }
.tc .stun i:nth-child(3) { animation-delay:-.93s; }
@keyframes stunorbit { from { offset-distance:0%; } to { offset-distance:100%; } }
.tc .unf { position:absolute; left:84px; right:12px; top:0; bottom:0; transform:skewX(10deg); opacity:0; pointer-events:none; transition:opacity .2s ease; }
.tc.on .unf { opacity:1; pointer-events:auto; transition:opacity .25s ease .2s; }
.tc .dhead { display:flex; align-items:center; gap:10px; height:40px; margin:4px 12px 0 8px; }
.tc .dhead .nm { font-size:28px; letter-spacing:1px; color:#fff4f0; text-shadow:0 2px 0 rgba(0,0,0,.6); }
.tc .dhead .vit { margin-left:auto; display:flex; gap:14px; }
.tc .dhead .vit b { position:relative; display:flex; align-items:baseline; gap:4px; padding-bottom:5px; font-size:30px; line-height:1; color:var(--vc); }
.tc .dhead .vit i { font-size:18px; letter-spacing:1px; opacity:.75; }
.tc .dhead .vit s { text-decoration:none; font-size:20px; color:rgba(244,238,248,.5); }
.tc .dhead .vit b::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--vc) var(--f), rgba(255,255,255,.14) var(--f)); }
.tc .dhead .chips { display:flex; gap:6px; overflow:hidden; white-space:nowrap; }
.tc .dhead .chips span { padding:0 8px; border-radius:11px; border:2px solid currentColor; font-size:20px; line-height:18px; background:rgba(8,5,14,.8); }
.packs { display:flex; justify-content:space-around; height:146px; padding:0 4px; }
#dock.busy .packs, .tc:not(.live) .packs { opacity:.4; }
.tc:not(.live) .packs * { pointer-events:none !important; }

/* ---- THE BUTTON: a power is a pack of two icons, red (the yokai) and blue (an
   ally); a long press on either is its info. The same DOM in every look; the look places it. */
.pk { position:relative; flex:0 0 auto; width:86px; height:146px; }
/* what the power costs, either face: a negative figure in the SP blue, no pill,
   floating between the red icon and the blue one (each look places it) */
.pk .cost { position:absolute; z-index:4; font-size:28px; line-height:1; color:#8fdcff; white-space:nowrap; pointer-events:none;
  -webkit-text-stroke:6px rgba(6,4,10,.9); paint-order:stroke fill; text-shadow:0 2px 4px rgba(0,0,0,.6); }
.ic { position:absolute; pointer-events:auto; touch-action:none; cursor:pointer; border-radius:16px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 12px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.22);
  transition:transform .12s ease, filter .12s ease, opacity .12s ease, box-shadow .12s ease; }
.ic i { display:block; background:#fff; -webkit-mask-size:contain; mask-size:contain; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center; mask-position:center; pointer-events:none; }
.ic.red { background:linear-gradient(180deg, #ff5d6e, #b3122e); }
.ic.blue { background:linear-gradient(180deg, #6fb0ff, #1f4fa8); }
.ic:active { transform:scale(.93); }
.ic.armed { transform:translateY(-6px) scale(1.06); box-shadow:0 0 0 3px #ffd166, 0 0 22px rgba(255,209,102,.8), 0 10px 16px rgba(0,0,0,.6); }
.ic.off { filter:grayscale(1) brightness(.6); opacity:.5; }
@media (hover:hover) { .ic:not(.off):hover { filter:brightness(1.12); } }
.ic .fig { position:absolute; padding:1px 7px 0; border-radius:8px; white-space:nowrap; z-index:2;
  background:rgba(8,5,14,.94); border:2px solid currentColor; color:#ffd7cf; font-size:20px; line-height:20px; pointer-events:none; }
.ic .fig:empty { display:none; }
.ic .fig.hgo { padding:3px 5px; line-height:0; }
.pk .ic .fig.hgo { left:auto; bottom:auto; top:-8px; right:-8px; transform:none; }      /* the hourglass: the red icon's top-right corner, in every look */
.ic .fig span.hg { display:inline-block; width:18px; height:18px; background:currentColor; -webkit-mask:var(--hg) center/contain no-repeat; mask:var(--hg) center/contain no-repeat; }
.ic .who { position:absolute; width:28px; height:28px; border-radius:50%; border:2px solid #4f9bff; background:#2a1a30 no-repeat; background-size:300% auto; pointer-events:none; z-index:2; }
/* a power on the whole party: every living head, piled with a small offset */
.ic .who.all { position:static; display:flex; width:auto; height:auto; border:0; border-radius:0; background:none; --ph:28px; }
.ic .who.all span { flex:0 0 auto; width:var(--ph); height:var(--ph); margin-left:calc(6px - var(--ph)); border-radius:50%; border:3px solid #4f9bff; background:#2a1a30 no-repeat; background-size:300% auto; box-shadow:0 0 0 2px rgba(12,8,18,.95), 0 3px 6px rgba(0,0,0,.5); }
.ic .who.all span:first-child { margin-left:0; }
.ic.blue.is-all { width:auto !important; padding:0; background:none; box-shadow:none; }
.ic.blue.is-all i { display:none !important; }
.ic .who:empty:not([style]) { display:none; }
#frame.hits .ic, #frame.hits .tc .plate { outline:2px dashed rgba(126,166,255,.9); outline-offset:2px; }

/* C · BADGES — an app icon: the red tile is the power, the ally's head a badge
   hanging on its foot, the info a small badge on its corner */
.bv-badges .ic.red { left:6px; top:12px; width:76px; height:76px; border-radius:20px; }
.bv-badges .ic.red i { width:44px; height:44px; }
.bv-badges .ic.blue { left:-6px; top:76px; width:50px; height:50px; border-radius:50%; box-shadow:0 0 0 3px rgba(12,8,18,.95), 0 4px 8px rgba(0,0,0,.5); z-index:3; }
.bv-badges .ic.blue i { display:none; width:28px; height:28px; }
.bv-badges .ic.blue:has(.who:empty:not([style])) i { display:block; }      /* no ally to reach: the glyph, greyed */
.bv-badges .who { left:3px; top:3px; width:44px; height:44px; border-width:0; }
.bv-badges .who.all { --ph:40px; }
.bv-badges .fig { right:-10px; top:42px; }      /* on the right flank: the foot is the ally's, a party pile included */
.bv-badges .pk .cost { left:48px; top:92px; }

/* the info window, over the row: the power's two faces on a long press */
#dinfo { position:absolute; left:26px; width:668px; bottom:360px; z-index:30; padding:8px 16px 10px; pointer-events:none;
  border-radius:16px; background:rgba(8,5,14,.9); border:1px solid rgba(255,209,102,.3); box-shadow:0 10px 30px rgba(0,0,0,.6); }
#dinfo p { margin:0; }
#dinfo .h { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
#dinfo .h b { font-size:28px; letter-spacing:2px; font-weight:400; color:var(--ink, #f4eef8); }
#dinfo .h i { font-style:normal; font-size:20px; letter-spacing:2px; color:#8fdcff; }
#dinfo .face { margin-top:5px; padding:3px 10px 3px 10px; border-radius:10px; border:2px solid transparent; border-left:6px solid var(--fc);
  font:700 20px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#d9d3e4; }
#dinfo .face b { margin-right:10px; font:400 20px "Bebas Neue", -apple-system, sans-serif; letter-spacing:1px; color:var(--fc); }
#dinfo .face em { font-style:normal; margin-left:10px; font:400 24px "Bebas Neue", -apple-system, sans-serif; letter-spacing:1px; color:#ffd7cf; white-space:nowrap; }
#dinfo .face.hot { background:rgba(255,255,255,.07); border-color:var(--fc); border-left-width:6px; color:#fff4f0; }
#dinfo .face.na { opacity:.5; }
#dinfo .a { margin-top:6px; font:700 20px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#ffd166; }
#dinfo .stat { margin-top:5px; font:700 22px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#f4eef8; }
#dinfo .stat b { margin-right:8px; font:400 20px "Bebas Neue", -apple-system, sans-serif; letter-spacing:1px; color:#b69cff; }
#dinfo .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
#dinfo .tags span { padding:3px 12px; border-radius:12px; font:400 20px "Bebas Neue", -apple-system, sans-serif; letter-spacing:1px; border:2px solid currentColor; }

/* ---- THE MOTOR'S HUD BAND, as the game's web build draws it over a fight
   (packages/shell/motor.css, HUD, with grudgeon's SKIN and its tokens) ---- */
#hud { position:absolute; left:0; right:0; top:0; z-index:15; pointer-events:none; height:150px; padding:18px 26px 0;
  display:flex; align-items:flex-start; justify-content:space-between; gap:14px; color:#eafcff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
#hud::before { content:""; position:absolute; left:0; right:0; top:0; bottom:0; z-index:-1; background:linear-gradient(180deg, rgba(4,5,16,.62), rgba(4,5,16,0)); }
#hud-center { position:absolute; left:0; right:0; top:12px; text-align:center; }
#hud-score { display:inline-block; font-size:78px; font-weight:900; line-height:1; color:#eafcff; text-shadow:0 0 14px rgba(226,54,75,.6); font-variant-numeric:tabular-nums; }
#hud-score-lbl { margin-top:2px; font-size:18px; font-weight:800; letter-spacing:5px; color:rgba(255,255,255,.55); }
#hud-left, #hud-right { position:relative; z-index:1; min-width:120px; }
#hud-right { text-align:right; }
.hud-pill { display:inline-block; padding:9px 18px; border-radius:18px; background:rgba(0,0,0,.42); border:1px solid rgba(255,255,255,.09);
  font-size:28px; font-weight:900; text-shadow:0 2px 6px rgba(0,0,0,.5); font-variant-numeric:tabular-nums; }
.hud-pill .lbl { display:block; font-size:18px; font-weight:800; letter-spacing:2px; opacity:.65; }

/* ---- this page: the yokai picker, the rule, the feedback log ------------ */
#panel select { width:100%; padding:8px 10px; background:#1c1c2c; color:#e8e6f5; border:1px solid #2c2c47; border-radius:8px; font:600 13px/1.2 inherit; }
#rule { padding:10px 12px; background:#0b0b12; border:1px solid #2c2c47; border-radius:10px; font-weight:500; font-size:12px; color:#c9c9e0; }
#rule p { margin:0 0 7px; }
#rule p:last-child { margin-bottom:0; }
#rule b { display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; }
#rule .lock b { color:#ff8a9a; } #rule .key b { color:#7ee0a1; } #rule .flee b { color:#9aa5b8; }
#log { max-height:330px; overflow:auto; padding:6px 8px; background:#0b0b12; border:1px solid #2c2c47; border-radius:10px; font-weight:500; font-size:12px; }
#log div { padding:4px 0; border-bottom:1px solid #1a1a28; color:#c9c9e0; }
#log div:first-child { color:#fff; }
#log i { font-style:normal; color:#6c6c88; margin-right:6px; font-variant-numeric:tabular-nums; }
#log b { display:inline-block; min-width:52px; margin-right:6px; padding:0 5px; border-radius:5px; font-size:11px; text-align:center; color:#0b0b12; }

/* the two single cards of a turn: the yokai's RULE (gold) and FLEE (grey) */
.pk.solo .ic.red { top:20px; }
.ic.red.rule { background:linear-gradient(180deg, #f2c94c, #9a6a06); }
.ic.red.flee { background:linear-gradient(180deg, #9aa5b8, #4a5468); }
.pk.solo .ic .fig { left:50%; right:auto; top:auto; bottom:-14px; transform:translateX(-50%); color:#fff4f0; }
/* what the yokai's rule does to this blow, read before it is played */
.ic .rt { position:absolute; left:-6px; top:-14px; z-index:3; padding:1px 7px 0; border-radius:8px; white-space:nowrap; pointer-events:none;
  background:#e9c46a; color:#2a1a00; font-size:20px; line-height:20px; box-shadow:0 2px 6px rgba(0,0,0,.5); }
.ic .rt:empty { display:none; }
.ic .rt.bad { background:#ff5d73; color:#2a0008; }
/* six cards in a turn (the full kit): the packs tighten */
.packs.many .pk { width:72px; }
.packs.many .ic.red { left:3px; width:66px; height:66px; }

.packs.many .pk .cost { left:40px; top:84px; }

  /* The painted art, as the build ships it (assets/image/embed/). Loaded on

  function preload() {

  function preloadFoe(id) { for (let p = 1; p <= 4; p++) img("foe-" + id + "0" + p); }

  /* =========================================================================
     2. THE SETTINGS — the knobs of the panel
     ========================================================================= */
  const S = { party: 1, kit: "arrival", endless: "on", tags: "on", lore: "found",
    /* the casting lab's own knobs, fixed at the look the game shipped (C · Badges) */
    look: "badges", tint: 10, blue: "smart", pin: "on", figs: "order", confirm: "off", longMs: 400, preview: "on", hits: "off" };
  const KNOBS = [
    { k: "party", label: "Heroes (the band's lead first)", o: [1, 2, 3, 4] },
    { k: "kit", label: "Scrolls", o: ["arrival", "full"], names: { arrival: "On arrival: the first one", full: "Both" } },
    { k: "tags", label: "Rule tag on the red faces", o: ["on", "off"] },
    { k: "lore", label: "Weak and resist badges on the bar", o: ["found", "all"], names: { found: "Found by a blow (the game)", all: "All, from the start" } },
    { k: "endless", label: "Endless fight", o: ["on", "off"], names: { on: "On: nobody falls", off: "Off" } }
  ];

  /* =========================================================================
     3. THE FIGHT — the timeline, the intents, the scrolls, the rules, the flight
     ========================================================================= */
  const P = { persp: 7, tilt: 0.75, unit: 112, groundY: 720, pivotZ: 0.3, heroScale: 0.95, foeScale: 1.15,
    follow: 0.6, camSpeed: 4, actZoom: 0.2, dash: 0.75, punch: 0.06, shake: 10, hitstop: 0.07, flash: 0.3, bgDim: 0.35, bgZoom: 1.08, vignette: 0.3 };
  const POS = { foe: [1.2, 1.3], hero: i => [-2.4 + i * 1.0, 0.5 - i * 0.65] };

  let party = [], foe = null, active = 0, turn = 1, busy = false, over = false, extra = false;
  let ward = 0, lastHero = null, gold = GOLD, fightT = 0, score = 0, foesDown = 0;
  let T = 0, RT = 0, hitstop = 0, enterT = 0, flashA = 0, flashC = "#ffffff";
  let jobs = [], tweens = [], parts = [], nums = [], calls = [], fxs = [];
  let TL = [];

  function anim(i) {
    return { hx: 0, hz: 0, tx: 0, tz: 0, dash: 0, dashTo: { x: 0, z: 0 }, kx: 0, kz: 0,
      hurt: 0, lunge: 0, cast: 0, guard: 0, dead: false, flash: 0, boost: 0, fade: 1, phase: i * 1.7, enter: 0, fall: 0, turn: 0, gA: 0 };
  }
  function makeHero(id, i) {
    const b = HEROES[id];
    return Object.assign(anim(i), { kind: "hero", id, b, i, color: b.color, mhp: b.hp, hp: b.hp, msp: b.sp, sp: b.sp, lag: b.hp,
      atk: b.atk, def: b.def, spd: b.spd, pow: 1, ct: 0, n: 0, guarding: false, imbue: null, whet: 0, cover: null,
      known: S.kit === "full" ? b.skills.slice() : b.skills.slice(0, 1) });
  }
  /* THE BESTIARY, as the game's: an element is known on a yokai once a blow
     of it has landed there, and kept for the session. "all" shows every one. */
  const LORE = {};
  function knownOf(id) {
    const out = {}, b = FOES[id];
    if (S.lore === "all") { b.weak.forEach(e => { out[e] = "weak"; }); b.resist.forEach(e => { out[e] = "resist"; }); return out; }
    return Object.assign(out, LORE[id] || {});
  }
  function learn(f, el) {
    const v = f.b.weak.indexOf(el) >= 0 ? "weak" : f.b.resist.indexOf(el) >= 0 ? "resist" : "normal";
    f.known[el] = v; (LORE[f.id] = LORE[f.id] || {})[el] = v;
  }
  function makeFoe(id, o) {
    const b = FOES[id], R = RULES[id], hp = Math.round(b.hp * 1.3 * FOE_HP * BY_PARTY_HP[clamp(+S.party, 1, 4)]), spd = b.spd * (R.spd || 1);
    const f = Object.assign(anim(0.25), { kind: "foe", id, b, color: b.color, mhp: hp, hp, lag: hp,
      atk: b.atk * FOE_ATK * BY_PARTY_ATK[clamp(+S.party, 1, 4)], def: b.def, spd, spd0: spd, ct: 0, n: 0, acts: 0, plan: [], doing: null, taunt: null, pacify: false,
      hitSince: false, lastHitter: null, answered: false, known: knownOf(id), boss: bandOf(id).foes[3] === id });
    f.st = R.st ? R.st(o || {}) : {};
    return f;
  }
  function all() { return foe ? party.concat([foe]) : party.slice(); }
  function alive() { return party.filter(h => !h.dead); }
  function activeHero() { return party[active] && !party[active].dead ? party[active] : null; }
  function randomHero() { const a = alive(); return a[Math.floor(Math.random() * a.length)]; }
  function weakestHero() { return alive().slice().sort((a, b) => a.hp - b.hp)[0] || null; }
  function weakestOther(h) { return alive().filter(x => x !== h).sort((a, b) => a.hp - b.hp)[0] || null; }

  function setTargets(snap) {
    const pos = party.map((h, i) => POS.hero(i));
    party.forEach((h, i) => { h.tx = pos[i][0]; h.tz = pos[i][1]; if (snap) { h.hx = h.tx; h.hz = h.tz; } });
    if (foe) { foe.tx = POS.foe[0]; foe.tz = POS.foe[1]; if (snap) { foe.hx = foe.tx; foe.hz = foe.tz; } }
  }

  /* --- timing helpers ---------------------------------------------------- */
  function later(d, fn) { jobs.push({ t: d, fn }); }
  function tween(o, k, to, d, ease, delay) { tweens.push({ o, k, from: null, to, d, t: -(delay || 0), ease: ease || outCubic }); }
  function outCubic(q) { return 1 - Math.pow(1 - q, 3); }
  function inOut(q) { return q * q * (3 - 2 * q); }
  function outBack(q) { const c = 1.7; return 1 + (c + 1) * Math.pow(q - 1, 3) + c * Math.pow(q - 1, 2); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function copyOf(it, extra) { return Object.assign({}, it, extra); }

  /* --- THE FEEDBACK ------------------------------------------------------
     `pop` stands for the game's Pop.show(style, { word, sub }): a callout in
     the middle of the stage, queued behind the one showing, and a line of
     the panel's log that names its style. */
  const STYLE = { score: "#ffd166", alert: "#ff5d73", bonus: "#7ee0a1", combo: "#ffd166", danger: "#e2364b", ribbon: "#ff8a9a", streak: "#ffd166", event: "#7ea6ff" };
  function pop(style, word, sub) {
    calls.push({ style, word, sub, col: STYLE[style] || "#fff4f0", t: 0, life: style === "combo" || style === "danger" ? 1.4 : 1.1 });
    if (calls.length > 3) calls.splice(1, calls.length - 3);
    if (style === "danger") cam.shake = Math.max(cam.shake, P.shake * 1.4);
    log(style, word, sub);
  }
  function note(a, txt, col) { nums.push({ a, txt, col: col || "#ffd166", t: 0, life: 1.1, weak: false, ox: 0, small: true }); }

  /* --- THE TIMELINE ------------------------------------------------------
     Every living unit counts `ct` down; the lowest acts, a tie goes to the
     heroes in party order, then to the yokai. Acting puts the unit back at
     its wait (TICK / spd) times the weight of what it did. */
  function wait(u) { return TICK / Math.max(1, u.spd); }
  function units() { return alive().concat(foe && !foe.dead ? [foe] : []); }
  function lowest(list) { let best = null; list.forEach(e => { if (!best || e.ct < best.ct - 1e-6) best = e; }); return best; }
  function push(u, share, word, sub) {
    u.ct += wait(u) * share;
    if (word) pop(u.kind === "foe" ? "bonus" : "alert", word, sub || (u.kind === "foe" ? "Pushed back" : u.b.name + " loses time"));
  }
  function rule() { return foe ? RULES[foe.id] : null; }
  function weightOf(h, w) { const R = rule(); return R && R.weight ? R.weight(foe, h, w) : w; }
  function hiddenIntents() { const R = rule(); return !!(R && R.hidden && R.hidden(foe)); }

  /* The next SHOW turns, as the player will see them. While a hero chooses,
     their own next turn is placed with the weight `w` of the scroll under
     the pointer, so the row re-sorts itself before anything is chosen. */
  function timeline(w, guardPrev) {
    if (!foe || foe.dead || over) return [];
    const sim = units().map(u => ({ u, ct: u.ct, n: u.n, guarding: u.guarding }));
    const simOf = u => sim.find(o => o.u === u);
    const out = [], now = turn === 0 ? activeHero() : null;
    let last = lastHero;
    if (now) {
      out.push({ u: now, key: now.id + ":" + now.n, now: true, hits: [] });
      const s = simOf(now);
      s.ct = wait(now) * weightOf(now, w == null ? 1 : w); s.n++; s.guarding = !!guardPrev;
      last = now;
    }
    let fk = 0, wd = ward, hs = now ? 1 : 0;
    AHEAD = [];
    while (out.length < SHOW) {
      const s = lowest(sim); if (!s) break;
      const d = s.ct; sim.forEach(o => { o.ct -= d; });
      const e = { u: s.u, key: s.u.id + ":" + s.n, now: !out.length, hits: [] };
      if (s.u.kind === "foe") {
        const ki = foe.doing ? fk - 1 : fk;
        if (ki >= 0) AHEAD[ki] = hs;
        const it = foe.doing && fk === 0 ? foe.doing : liveIntent(ki);
        fk++;
        const mod = fk === 1;            // the yokai's next turn: the one the scrolls bend
        e.it = it;
        if (it.alt) e.hits = maybeHits(it, simOf, wd > 0, mod);
        else {
          const tg = it.prev ? (last && !last.dead ? [last] : []) : targetsOf(it, mod);
          e.hits = tg.map(h => { const g = simOf(h); return { h, dmg: estimate(it, h, g && g.guarding, wd > 0, mod) }; });
        }
        if (wd > 0) wd--;
        s.ct = wait(s.u) * it.w;
      } else {
        s.guarding = false;
        s.ct = wait(s.u) * weightOf(s.u, 1);
        last = s.u;
        hs++;
      }
      s.n++;
      out.push(e);
    }
    AHEAD = [];
    return out;
  }

  /* --- THE INTENTS -------------------------------------------------------
     The yokai plans its turns ahead (`foe.plan`) so the timeline can show
     them; a rule may plan its own (`plan`) and turn a planned one into
     another, now, from what happened since (`live`). An intent is { kind,
     label, targets | all | prev, pow, flat, halve, w, special } plus what it
     does besides its blow: drain, fear, gale, cocoon, coil, pierce, and
     `after(f)`, run once it has landed. A turn with no blow says `sub`. */
  const POW = { strike: 1, heavy: 1.8, all: 0.75, drain: 1.2, fear: 0.9 };
  function basePlan(f, i) {
    const sp = (i + 1) % SPECIAL_EVERY === 0, mv = sp ? f.b.move : "strike";
    const it = { kind: mv, label: sp ? f.b.special : "Strike", fx: mv, w: sp ? 1.2 : 1, special: sp, pow: POW[mv] };
    if (mv === "all") it.all = true; else it.targets = [randomHero()];
    if (mv === "drain") it.drain = true;
    if (mv === "fear") it.fear = true;
    return it;
  }
  function planWith(special) {
    return (f, j) => { const it = basePlan(f, f.acts + j); return it.special ? copyOf(it, special(f, it)) : it; };
  }
  function pass(kind, label, sub, extra) { return Object.assign({ kind, label, sub, pow: 0, w: 1, targets: [] }, extra || {}); }
  function intent(k) {
    const R = rule();
    while (foe.plan.length <= k) { const j = foe.plan.length; foe.plan.push(R && R.plan ? R.plan(foe, j) : basePlan(foe, foe.acts + j)); }
    return foe.plan[k];
  }
  function liveIntent(k) {
    const R = rule(), it = intent(k);
    return R && R.live ? R.live(foe, it, k) || it : it;
  }
  /* `mod` is true for the yokai's NEXT turn, the one the scrolls laid since its
     last turn bend: a provoking hero draws a blow aimed at one hero, then a hero
     covering the one aimed at steps in front. */
  function targetsOf(it, mod) {
    if (it.all) return alive();
    if (it.prev) return lastHero && !lastHero.dead ? [lastHero] : [];
    const out = (it.targets || []).filter(h => h && !h.dead);
    if (mod && out.length === 1) {
      let h = out[0];
      if (foe.taunt && !foe.taunt.dead) h = foe.taunt;
      if (h.cover && !h.cover.dead) h = h.cover;
      return [h];
    }
    return out;
  }
  /* A yokai's blow is exactly what its intent says: no luck, no crit. A rule
     may raise its attack by a whole percentage (`atk`, Ubume's fury). */
  function estimate(it, h, guarded, warded, mod) {
    if (it.toOne) return Math.max(0, h.hp - 1);           // a blow that leaves every hero on 1 HP (Funayurei's capsize)
    if (it.halve) return Math.max(1, Math.round(h.hp / 2));
    if (!it.pow && !it.flat) return 0;
    const R = rule(), up = R && R.atk ? R.atk(foe) : 0;
    let d = foe.atk * (it.pow || 0) * (1 + up / 100) * 2.4 * (14 / (14 + h.def)) + (it.flat || 0);
    if (mod && foe.pacify) d *= PACIFY;
    if (guarded && !it.pierce) d *= 0.5;
    if (warded) d *= 0.6;
    return Math.max(1, Math.round(d));
  }
  function maybeHits(it, simOf, warded, mod) {
    const out = [];
    [it.alt.red, it.alt.blue].forEach(alt => targetsOf(alt, mod).forEach(h => {
      const g = simOf(h), d = estimate(alt, h, g && g.guarding, warded, mod), o = out.find(x => x.h === h);
      if (o) o.dmg = Math.max(o.dmg, d); else out.push({ h, dmg: d, maybe: true });
    }));

  }

  /* =========================================================================
     THE RULES — one lock and one key a yokai. A rule may:
       lock, key       what the panel says of it (and the game's guide will)
       flee            { p: odds in %, sub: the line of a failed flight, ok: of a good one }
       st(o)           its own state, fresh each fight (o.met: met again after a flight)
       status(f)       the gold pill on its bar
       ghost(f)        drawn as a shadow (Hanako behind her door)
       hidden(f)       its intents shown as "?"
       mod(f, h, id, el)  what it does to a hero's blow, decided BEFORE the blow
                       so the red face and the bar show it: { pct (whole %:
                       LOCKED, -80, while its key is not played — a blow always
                       lands; EXPOSED, +50, once it is), bounce (% back at the
                       striker), tag (the red face's label), bad (a red tag),
                       word, sub }. A plain Attack at LOCKED greys the bar.
       onHit(f, h, s, r, m)  after a hero's blow (s with its element)
       onStrike(f, h, it, dmg)  after each of its own blows on a hero
       plan / live     its intents; begin(f) / turn(f) before / after its turns
       action(f, h)    the gold card of the turn: { label, fig, sub, text, w, run(f, h) }
       weight(f, h, w) make a hero's actions heavier
       atk(f)          its blows, + a whole %
       feast(f)        % of what it drains that heals it (50 for a plain drain)
       onMet(f)        met again after a flight
       heroTurn(f, h, struck)  after each whole hero turn, `struck` if it
                       threw a blow at the yokai; true holds the fight
     A duration counts its own turns, decremented after each (`turn`). A
     state opened DURING its turn skips that decrement (`fresh`).
     ========================================================================= */
  function tick(st, k) {
    if (st[k + "Fresh"]) { st[k + "Fresh"] = false; return false; }
    if (st[k] > 0 && --st[k] === 0) return true;
    return false;
  }
  /* AN OPEN YOKAI stays open for OPEN hero turns at least (`opens` names the
     states counted that way, decremented at the end of every hero turn). A
     state opened DURING a hero turn skips that turn's decrement (`fresh`). */
  const OPEN = 5;
  function openFor(f, k, fresh) { f.st[k] = OPEN; f.st[k + "Fresh"] = !!fresh; }
  /* hero turns the timeline has run before the yokai's k-th turn (none outside it) */
  let AHEAD = [];
  function openAt(f, k, i) { return (f.st[k] || 0) + (f.st[k + "Fresh"] ? 1 : 0) > (i == null ? 0 : AHEAD[i] || 0); }
  /* What a rule NEEDS from the party's scrolls (`needs`: an element, or any
     scroll that strikes): null when the party carries it, else the need. */
  function missingKey() {
    const R = rule(), n = R && R.needs;
    if (!n) return null;
    const ok = alive().some(h => (h.known || []).some(id => {
      const s = SKILLS[id];
      if (!s || !s.el) return false;
      return n.magic ? s.kind === "hit" : s.el === n.el;
    }));
    return ok ? null : n;
  }
  function cursedNow(h) { const R = rule(); return foe && !h.dead && R && R.curse && R.curse(foe, h); }
  const ONRYO_PUSH = 2.2;                  // a blue action pushes Onryo back by this many of the hero's waits: two turns, and a margin
  /* the moment a yokai's key works, which is also when its trap card shows */
  function ubumeOffers(f) { const it = intent(0); return !f.st.bare && !f.answered && !!it.special; }
  function kappaDives(f) { const it = intent(0); return !f.st.dry && !f.answered && !!it.special; }
  const RULES = {
    /* --- Night school (Kenji: slash, Guard) --------------------------------- */
    hanako: {
      lock: "She hides behind the door of the third stall: every blow goes through the door, -80% damage.",
      key: "Knock three times (a quick turn, -40% wait): the door opens for good, +50% damage until the end of the fight.",
      st: () => ({ knocks: 0, open: false }),

    rokurokubi: {
      lock: "Its blows reach past any guard. Its body is out of reach: -80% damage.",

    oni: {

      st: () => ({ last: null }),

    /* Its every turn pays its Grudge back on the whole party: the way is to

    onryo: {
      lock: "It keeps every blow it takes as Grudge, and every one of its turns pays it back on every hero (30% of the Grudge each). Fleeing never works.",
      key: "Hold it back: every blue action (guard, heal, ward, a scroll on an ally) pushes its turn back by two of yours. Alternate a blow and a blue action and it never strikes. A light blow purifies half the Grudge.",
      flee: { p: 0, sub: "Its grudge follows you" },
      st: () => ({ grudge: 0 }),
      status: f => "Grudge " + f.st.grudge,
      live: (f, it) => copyOf(it, { all: true, targets: null, fear: false, drain: false, pow: 0.5, flat: Math.round(f.st.grudge * 0.3), label: "Grudge", special: true, fx: "all",
        after: f2 => { f2.st.grudge = 0; } }),

      onHit: (f, h, s, r) => {

  /* --- what some rules share ------------------------------------------------ */
  function tripTeke(f, during) {
    openFor(f, "down", !during); f.st.rising = false; f.plan = [];   // 5 hero turns fallen, then a turn of hers getting up
    tween(f, "fall", 1, 0.5, outBack);
    pop("combo", "Tripped", "+50% damage until she's up · 5 turns");
  }
  function freeCocoon(f, word) {
    const h = f.st.cocoon;
    f.st.cocoon = null;
    openFor(f, "free", true);
    if (!h || h.dead) return;
    h.ct = 0;
    pop("bonus", word, h.b.name + " acts next");
  }
  /* Gashadokuro's answer to its third blow: every hero, crushed. */
  function boneCrush(f) {
    later(0.35, () => {
      if (!foe || foe !== f || f.dead) return;
      f.lunge = 0.6; f.cast = 1;
      pop("danger", "Bone crush", "Every hero");
      alive().forEach(h => { spell("spells14", h, 1.0); hurtHero(h, estimate({ pow: 1.4 }, h, h.guarding, ward > 0, false), f, true); });
    });
  }
  function ruleAction() {
    const R = rule(), h = activeHero();
    return R && R.action && h && foe && !foe.dead && !over ? R.action(foe, h) : null;
  }

  /* --- the beats --------------------------------------------------------- */
  function impact(target, from, dmg, opts) {
    opts = opts || {};
    target.hurt = 0.4; target.flash = 1;
    const dx = target.hx - from.hx, dz = target.hz - from.hz, d = Math.hypot(dx, dz) || 1;
    target.kx = dx / d * 0.25; target.kz = dz / d * 0.25;
    tween(target, "kx", 0, 0.35); tween(target, "kz", 0, 0.35);
    if (opts.heal) target.hp = Math.min(target.mhp, target.hp + dmg);
    else target.hp = Math.max(0, target.hp - dmg);
    nums.push({ a: target, txt: (opts.heal ? "+" : "-") + dmg, col: opts.heal ? "#7ee0a1" : target.kind === "foe" ? (opts.el ? ELEMENTS[opts.el].color : "#ffffff") : "#ff5d73",
      t: 0, life: 1.1, weak: !!opts.weak, ox: rnd(-20, 20) });
    if (opts.heal) { target.hurt = 0; target.flash = 0.6; return; }
    const k = opts.weak ? 1.6 : opts.big ? 1.3 : 1;
    cam.shake = Math.max(cam.shake, P.shake * k);
    cam.punch = P.punch * k;
    hitstop = P.hitstop * k;
    flashA = P.flash * (opts.weak ? 1 : 0.55); flashC = opts.el ? ELEMENTS[opts.el].color : "#ffffff";
    cam.subject = target;
  }
  /* a blow that lands on nothing: the thud, a grey 0, no health moves */
  function thud(target) {
    target.hurt = 0.25;
    cam.shake = Math.max(cam.shake, P.shake * 0.5);
    nums.push({ a: target, txt: "0", col: "#9aa0b5", t: 0, life: 1.1, weak: false, ox: rnd(-20, 20) });
  }
  /* A hero hurt. In an endless fight they never fall under 1 HP. */
  function hurtHero(h, dmg, from, big) {
    impact(h, from, dmg, { big });
    if (h.hp > 0) return;
    if (S.endless === "on") { h.hp = 1; pop("alert", h.b.name, "Down"); log("event", "Endless", h.b.name + " kept at 1 HP"); return; }
    h.dead = true; h.hp = 0;
    if (foe && foe.st && foe.st.cocoon === h) foe.st.cocoon = null;
    pop("alert", h.b.name, "Down");
  }
  function spell(key, a, scale) { fxs.push({ key, a, t: 0, d: 0.75, s: (scale || 1.1) }); }

  /* The game's damage formula: weak 1.6x (and ONE MORE), resisted 0.5x, 8% crits;
     then the rule's own modifier `m`, a whole percentage. */
  function blowMod(h, id, el) { const R = rule(); return (R && R.mod && R.mod(foe, h, id, el)) || {}; }
  function strike(att, tgt, pow, el, pierce, m) {
    const def = pierce ? tgt.def * 0.3 : tgt.def;
    let d = att.atk * pow * 2.4 * (14 / (14 + def));        // no luck: the preview is what lands (a crit apart)
    let weak = false, resist = false, crit = false;
    if (tgt.b.weak.indexOf(el) >= 0) { weak = true; d *= 1.6; }
    else if (tgt.b.resist.indexOf(el) >= 0) { resist = true; d *= 0.5; }
    learn(tgt, el);
    if (!resist && !m.zero && !m.heal && !m.redirect && !(m.pct < 0) && Math.random() < 0.08) { crit = true; d *= 1.5; }
    const raw = Math.max(1, Math.round(d));
    if (m.pct) d *= 1 + m.pct / 100;
    return { dmg: m.zero ? 0 : Math.max(1, Math.round(d)), raw, weak, resist, crit };
  }
  /* The same, without the luck: what a scroll's face promises the yokai. */
  function hitEstimate(h, id) {
    const s = SKILLS[id], elId = h.imbue || s.el, mult = h.whet || 1, def = s.pierce ? foe.def * 0.3 : foe.def;
    let d = h.atk * s.pow * (id === "attack" ? 1 : h.pow) * mult * 2.4 * (14 / (14 + def));
    const k = foe.known[elId], weak = k === "weak", resist = k === "resist";      // only once FOUND, as the game
    if (weak) d *= 1.6; else if (resist) d *= 0.5;
    const m = blowMod(h, id, elId);
    if (m.pct) d *= 1 + m.pct / 100;
    /* an element never tried on this yokai may be resisted (half) or a weakness
       (+60%): the preview is that range, so it never promises a wrong figure
       and never gives the weakness away */
    const unsure = !k, z = m.zero || m.redirect;
    return { dmg: z ? 0 : Math.max(1, Math.round(d)), lo: z ? 0 : Math.max(1, Math.round(unsure ? d * 0.5 : d)), hi: z ? 0 : Math.max(1, Math.round(unsure ? d * 1.6 : d)),
      unsure, weak, resist, el: elId, m };
  }

  /* --- THE SCROLLS' FACES ------------------------------------------------
     What scroll `id` does on target `tg` ({ foe: true } or { hero }), as a
     label: `word` (what a bar says in words), `fig` (the figure), `sub` (the
     noun next to the figure), a `tag` (Weak, Resist, +5 SP) and its colour.
     The yokai's rule card and the flight are no scroll: they have no face. */
  function fits(id, tg) {
    if (!tg || !SKILLS[id]) return false;
    if (tg.foe) return !!foe && !foe.dead;
    return !!tg.hero && !tg.hero.dead && !(SKILLS[id].noSelf && tg.hero === activeHero());
  }
  function faceOn(id, tg) {
    const s = SKILLS[id], a = activeHero();
    if (!a || !fits(id, tg)) return null;
    if (tg.foe) {
      switch (s.foe) {
        case "hit": {
          const r = hitEstimate(a, id);
          if (r.m.heal) return { kind: "hit", word: "Heals it", fig: "+" + r.dmg, sub: "Heals it", tag: r.m.tag, tagCol: "#7ee0a1", tone: "" };
          return { kind: "hit", word: "Hit", fig: r.unsure ? "−" + r.lo + " to " + r.hi : "−" + r.dmg, sub: "Hit", tag: r.m.tag || (r.weak ? "Weak" : r.resist ? "Resist" : ""), tagCol: r.weak ? ELEMENTS[r.el].color : "#9aa0b5", tone: "dmg" };
        }
        case "provoke": return { kind: "provoke", word: "Provoke", fig: "", sub: "", tag: "", tone: "" };
        case "pacify":  return { kind: "pacify", word: "Blow −50%", fig: "−50%", sub: "Blow", tag: "", tone: "" };
        case "bind":    return { kind: "bind", word: "Push back", fig: "", sub: "", tag: "", tone: "" };
      }
    }
    const x = tg.hero;
    switch (s.ally) {
      case "cover":  return { kind: "cover", word: "Cover", fig: "", sub: "", tag: "", tone: "" };
      case "imbue":  return { kind: "imbue", word: "Next: " + ELEMENTS[s.el].name, fig: ELEMENTS[s.el].name, sub: "Next blow", tag: "", tone: "" };
      case "whet":   return { kind: "whet", word: "Next +50%", fig: "+50%", sub: "Next blow", tag: "", tone: "" };
      case "hasten": return { kind: "hasten", word: "Hasten", fig: "", sub: "", tag: "", tone: "" };
      case "guard":  return { kind: "guard", word: "Blows −50%", fig: "−50%", sub: "Blows", tag: x === a ? "+5 SP" : "", tagCol: "#8fdcff", tone: "" };
      case "heal": {
        const g = Math.min(x.mhp - x.hp, Math.round(x.mhp * s.pow * a.pow));
        return { kind: "heal", word: "+" + g + " HP", fig: "+" + g, sub: "HP", tag: "", tone: "heal" };
      }
      case "ward":   return { kind: "ward", word: "−40% ×" + s.turns, fig: "−40%", sub: "Ward ×" + s.turns, tag: "", tone: "" };
    }
    return null;
  }

  /* --- the heroes: casting a scroll --------------------------------------- */
  function canAct() { return !busy && !over && turn === 0 && !!activeHero() && !!foe && !foe.dead; }

  /* The one way a scroll leaves the hero's hand. Returns false when it did not
     go (no turn, no SP, no face on that target). */
  function cast(id, tg) {
    if (!canAct()) return false;
    const h = activeHero(), s = SKILLS[id];
    if (s.sp > h.sp) { say("Not enough SP"); return false; }
    if (!fits(id, tg)) return false;
    h.sp -= s.sp; busy = true; turn = 1;
    clearUi();
    cam.subject = h;
    const R = rule();
    if (!tg.foe && R && R.onBlue) later(0.5, () => { if (foe && !foe.dead && !over) R.onBlue(foe, h, id); });   // a blue face played (Onryo)
    if (tg.foe) {
      if (s.foe === "hit") { hitFoe(h, id, s); return true; }
      h.cast = 0.9;
      later(0.3, () => {
        if (s.foe === "provoke") {
          foe.taunt = h; h.guarding = true; spell(s.fx, h, 0.9); pop("bonus", "Provoked", h.b.name);
        } else if (s.foe === "pacify") {
          foe.pacify = true; spell(s.fx, foe, 1.0); pop("bonus", "Pacified", "Its next blow −50%");
        } else if (s.foe === "bind") {
          spell(s.fx, foe, 1.0); push(foe, BIND, "Bound");
        }
      });
      later(1.0, () => endHero(h, s.w));
      return true;
    }
    const x = tg.hero;
    if (s.ally === "guard") {
      spell(s.fx, x, 0.9);
      x.guarding = true; x.guard = 1.2; h.cast = 0.4;
      if (x === h) { h.sp = Math.min(h.msp, h.sp + 5); pop("score", "+5 SP"); }
      else pop("bonus", "Guarded", x.b.name);
      later(0.7, () => endHero(h, s.w));
      return true;
    }
    if (s.ally === "heal") {
      h.cast = 0.9;
      later(0.3, () => alive().forEach(y => { spell(s.fx, y, 0.9); impact(y, h, Math.min(y.mhp - y.hp, Math.round(y.mhp * s.pow * h.pow)), { heal: true }); }));
      later(1.0, () => endHero(h, s.w));
      return true;
    }
    if (s.ally === "ward") {
      h.cast = 0.9; ward = s.turns;
      alive().forEach(y => spell(s.fx, y, 0.9));
      pop("bonus", "Spirit ward", "Less damage taken");
      later(1.0, () => endHero(h, s.w));
      return true;
    }
    /* a blow laid on an ally: a gift for their next blow, a body in front of
       them, or a step up the timeline */
    h.cast = 0.9;
    later(0.3, () => {
      x.flash = 0.6;
      spell(s.fx, x, 0.9);
      if (s.ally === "imbue") { x.imbue = s.el; pop("bonus", ELEMENTS[s.el].name, x.b.name); }
      else if (s.ally === "whet") { x.whet = WHET; pop("bonus", "Whetted", x.b.name); }
      else if (s.ally === "cover") { x.cover = h; pop("bonus", "Covered", x.b.name); }
      else if (s.ally === "hasten") { x.ct = Math.max(0, x.ct - wait(x) * HASTEN); pop("bonus", "Hastened", x.b.name); }
    });
    later(1.0, () => endHero(h, s.w));
    return true;
  }
  /* A blow at the yokai: the hero dashes most of the way to it and back. The
     rule's modifier is read the instant it lands: a blow may hit a door (0),
     heal the yokai, land on a cocoon, be parried back, or land harder. */
  function hitFoe(h, id, s) {
    const f = foe, skill = id !== "attack", R = rule();
    let again = false;
    const elId = h.imbue || s.el, mult = h.whet || 1, sk = elId === s.el ? s : Object.assign({}, s, { el: elId });
    h.imbue = null; h.whet = 0;
    if (skill) h.cast = 0.9; else h.lunge = 0.6;
    h.dashTo = { x: f.hx + (h.hx - f.hx) * 0.3, z: f.hz + (h.hz - f.hz) * 0.3 };
    tween(h, "dash", skill ? 0.35 : 1, 0.22);
    later(skill ? 0.38 : 0.24, () => {
      const m = blowMod(h, id, elId), r = strike(h, f, s.pow * (skill ? h.pow : 1) * mult, elId, s.pierce, m);
      spell(r.crit ? "spells14" : s.fx, f, 1.15);
      f.hitSince = true; f.lastHitter = h; h.struck = true;
      if (R.shield && R.shield(f)) f.sA = 1.7;
      if (m.bounce) { const b = Math.max(1, Math.round(r.raw * m.bounce / 100)); later(0.3, () => { if (foe === f) hurtHero(h, b, f); }); }
      if (m.zero) thud(f);
      else if (m.heal) impact(f, h, r.dmg, { heal: true });
      else if (m.redirect && f.st.cocoon) hurtHero(f.st.cocoon, r.dmg, h);
      else impact(f, h, r.dmg, { el: elId, weak: r.weak });
      if (m.word) pop("alert", m.word, m.sub);
      if (f.hp <= 0) return;
      const landed = !m.zero && !m.heal && !m.redirect, full = landed && !(m.pct < 0);   // a blow the lock cut down earns no ONE MORE
      if (s.push && landed) push(f, s.push, "Stunned");
      if (R.onHit) R.onHit(f, h, sk, r, m);
      if (full && r.weak && !extra) { again = true; pop("combo", "Weak!", "One more"); f.boost = 1; tween(f, "boost", 0, 1.2); }
      else if (landed && r.crit) pop("streak", "Critical");
      else if (landed && r.resist) pop("alert", "Resisted");
    });
    later(0.62, () => { tween(h, "dash", 0, 0.32, inOut); });
    later(1.05, () => {
      cam.subject = null;
      if (f.hp <= 0) { exorcise(); return; }
      if (again && !h.dead) { extra = true; busy = false; turn = 0; newTurn(); return; }   // ONE MORE: the same hero, the same slot
      endHero(h, s.w);
    });
  }
  /* The gold card: what the yokai's rule hands the hero whose turn it is. */
  function ruleAct() {
    const ra = ruleAction();
    if (!ra || !canAct()) return;
    const h = activeHero();
    busy = true; turn = 1; clearUi(); cam.subject = h; h.cast = 0.9;
    spell("spells04", h, 0.9);
    later(0.3, () => ra.run(foe, h));
    later(1.0, () => endHero(h, ra.w || 1));
  }
  /* FLEE: the odds a hero has of getting the party out. */
  function fleeOdds(h) {
    const R = rule();
    if (R && R.flee && R.flee.p != null) return R.flee.p;
    return clamp(FLEE.base + FLEE.perSpd * Math.round(h.spd - foe.spd), FLEE.min, FLEE.max);
  }
  function flee() {
    if (!canAct()) return;
    const h = activeHero(), R = rule(), f = foe, p = fleeOdds(h);
    busy = true; turn = 1; clearUi(); cam.subject = h;
    h.dashTo = { x: h.hx - 3, z: h.hz }; tween(h, "dash", 0.6, 0.3);
    const key = R && R.onFlee ? R.onFlee(f, h) : null;   // a rule may make the flight its key: it fails, nothing strikes
    later(0.45, () => {
      if (key) {
        tween(h, "dash", 0, 0.3, inOut);
        later(0.3, () => { if (foe === f) key(); });
        later(1.6, () => endHero(h, 1));
        return;
      }
      if (Math.random() * 100 < p) {
        pop("bonus", "Escaped", (R.flee && R.flee.ok) || "Back on the map · it moves room");
        log("event", "Flight", "In the game: back on the map, the yokai in another room. Here: met again.");
        over = true;
        party.forEach(x => { tween(x, "enter", 0, 0.5, inOut, 0.2); });
        later(1.8, () => startFight(foeId, { met: true }));
        return;
      }
      tween(h, "dash", 0, 0.3, inOut);
      pop("alert", "Can't escape", (R.flee && R.flee.sub) || "It strikes");
      later(0.55, () => {
        if (foe !== f) return;
        f.lunge = 0.6;
        spell("spells13", h, 1.0);
        hurtHero(h, estimate({ pow: 1 }, h, false, ward > 0, false), f);
      });
      later(1.4, () => endHero(h, 1));
    });
  }
  function endHero(h, w) {
    if (over) return;
    const R = rule(), struck = !!h.struck;
    h.struck = false;
    if (R && R.opens) R.opens.forEach(k => { if (tick(foe.st, k) && R.onClose) R.onClose(foe, k); });
    if (R && R.heroTurn && R.heroTurn(foe, h, struck)) { busy = true; cam.subject = null; return; }   // a whole hero turn, a blow at it or none; true holds the fight

    h.n++; h.ct = wait(h) * weightOf(h, w);
    lastHero = h;
    cam.subject = null; busy = false;
    step();
  }

  /* --- the yokai --------------------------------------------------------- */

  /* =========================================================================

  const cam = { x: W / 2, y: H / 2, z: 1, shake: 0, punch: 0, subject: null, sx: 0, sy: 0 };

  /* Where the FACE is on each hero's idle sprite (fractions of the image),

    tengu: { x: 0.3, y: 0.15 }, umibozu: { x: 0.37, y: 0.15 }, rokurokubi: { x: 0.16, y: 0.22 } };      // a yokai's face, where its bubbles go (grudgeon-foe-<id>01.webp)

  /* THE YOKAI'S SHIELD: a red dome round a yokai its rule protects (`shield`,

  }

  /* --- one tap, three icons a power ------------------------------------------
     Every power is a PACK of the same glyph three times: big RED casts it on
     the yokai, mid BLUE on an ally, small GREEN opens its info in the window
     above the row. Nothing asks for a target: the blue icon's ally is picked

  let dHot = null;           // the icon under a finger / the mouse: { id, side }

    const seg = document.createElement("div"); seg.className = "seg";
    d.o.forEach(v => {
      const b = document.createElement("button"); b.textContent = (d.names && d.names[v]) || v; b.dataset.v = v;
      b.onclick = () => { S[d.k] = typeof d.o[0] === "number" ? +v : v; paintKnobs(); changed(d.k); };
      seg.appendChild(b);
    });
    row.appendChild(seg);
    ctl[d.k] = { paint: () => { seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", String(b.dataset.v) === String(S[d.k]))); } };
    knobsEl.appendChild(row);
  });
  function paintKnobs() { for (const k in ctl) ctl[k].paint(); }
  /* a knob moved: the party and the scrolls are a new fight, the tags a new card */
  function changed(k) {
    if (k === "party" || k === "kit") pick(foeId);
    if (k === "tags") dParty = null;
    if (k === "lore" && foe) foe.known = knownOf(foe.id);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
  function paintRule() {
    const R = RULES[foeId], f = R.flee;
    const fl = f && f.p === 0 ? "Never works" + (f.sub ? " (" + f.sub.toLowerCase() + ")" : "") + "." :
      f && f.p === 100 ? "Always works" + (f.ok ? " (" + f.ok.toLowerCase() + ")" : "") + "." :
      "50%, +4% a point of speed over its own (" + FOES[foeId].spd + "), between 20% and 90%.";
    ruleEl.innerHTML = '<p class="lock"><b>Lock · plain blows</b>' + esc(R.lock) + '</p><p class="key"><b>Key</b>' + esc(R.key) + '</p><p class="flee"><b>Flee</b>' + esc(fl) + "</p>";
    foeEl.value = foeId;
    try { history.replaceState(null, "", "#foe=" + foeId); } catch (e) { /* file:// quirks */ }
  }
  /* one line of the feedback, newest on top: the Pop style, the word, the sub */
  function log(style, word, sub) {
    const d = document.createElement("div");
    d.innerHTML = "<i>" + fightT.toFixed(1) + "s</i><b style=\"background:" + (STYLE[style] || "#9aa0b5") + "\">" + esc(style) + "</b>" + esc(word || "") + (sub ? " <span>· " + esc(sub) + "</span>" : "");
    logEl.insertBefore(d, logEl.firstChild);
    while (logEl.children.length > 60) logEl.removeChild(logEl.lastChild);
  }
  function pick(id) { startFight(id, { fresh: true }); }
  document.getElementById("restart").onclick = () => pick(foeId);
  document.getElementById("nextfoe").onclick = () => pick(FOE_IDS[(FOE_IDS.indexOf(foeId) + 1) % FOE_IDS.length]);
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.target === foeEl) return;
    const k = e.key.toLowerCase();
    if (k === "r") pick(foeId);
    else if (k === "n") document.getElementById("nextfoe").click();
  });

  /* --- the canvas fits its stage; the DOM frame scales with it ------------------ */
  function fit() {
    const st = document.getElementById("stage");
    const aw = st.clientWidth - 36, ah = st.clientHeight - 36;
    const h = Math.min(ah, aw * H / W), w = h * W / H;
    wrap.style.width = w + "px"; wrap.style.height = h + "px";
    frameEl.style.transform = "scale(" + (w / W) + ")";
    R = Math.max(0.5, Math.min(2, (window.devicePixelRatio || 1) * h / H));
    cv.width = Math.round(W * R); cv.height = Math.round(H * R);
  }

  /* --- for a headless check: the state, and a way to play a card ---------------- */
  const centre = e => { if (!e) return null; const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  window.__lab = {
    S, canAct, startFight, pick,
    state() { return { foe: foeId, actor: activeHero() && activeHero().id, foeHp: foe && foe.hp, mhp: foe && foe.mhp, st: foe && JSON.stringify(foe.st, (k, v) => v && v.b ? v.id : v),
      party: party.map(h => h.id + ":" + h.hp), packs: activeHero() ? actionsOf(activeHero()) : [], tags: Array.from(frameEl.querySelectorAll("#drow .tc.on .rt")).map(e => e.textContent),
      tl: TL.map(e => e.u.id + (e.it ? "(" + e.it.label + ")" : "")).join(" "), calls: calls.map(c => c.word) }; },
    /* play a card of the turn: a scroll's red or blue face, "rule" or "flee" */
    est(id) { const h = activeHero(); if (!h || !foe) return null; const r = hitEstimate(h, id); return { dmg: r.dmg, lo: r.lo, hi: r.hi, pct: r.m.pct || 0, known: JSON.stringify(foe.known), hp: foe.hp, st: JSON.stringify(foe.st, (k, v) => v && v.b ? v.id : v) }; },
    play(id, side) { if (!canAct()) return false; tapIcon(id, side || "red", false); return true; },
    where(id, side) { return centre(frameEl.querySelector('#drow .tc.on .ic[data-id="' + id + '"][data-side="' + (side || "red") + '"]')); },
    log: () => Array.from(logEl.children).map(d => d.textContent).reverse()
  };

  /* a long press must not open the browser's own menu over the card */
  wrap.addEventListener("contextmenu", e => e.preventDefault());

  /* --- boot --------------------------------------------------------------- */
  preload();
  if (document.fonts && document.fonts.load) document.fonts.load('22px "Bebas Neue"');
  paintKnobs();
  const fromHash = /foe=([a-z]+)/.exec(location.hash || "");
  pick(fromHash && FOES[fromHash[1]] ? fromHash[1] : FOE_IDS[0]);
  fit();
  window.addEventListener("resize", fit);
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  })(last);
})();
</script>
</body>
</html>
