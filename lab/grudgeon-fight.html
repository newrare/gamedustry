<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — Grudgeon fight staging</title>
<!-- Filed in the back office (make lab): tools | css | prototype, and the one game it is about, if any. -->
<meta name="lab-group" content="css">
<meta name="lab-game" content="grudgeon">
<style>
/* ===========================================================================
   GRUDGEON FIGHT STAGING — how a fight is put on screen.

   The fight of games/grudgeon is drawn on the canvas over the band's painted
   scene (drawFight, section 6): the heroes stacked on the left, the yokai on
   the right, a plate of numbers beside each one and the action bar under them.
   This page is that fight with every decision of its staging turned into a
   knob, so a look is chosen by watching it play rather than by argument:

     - the STAGE: seven layouts placed on a ground plane and projected through
       a pseudo-3D camera (distance, tilt, yaw, an orbit sway), so a layout is
       a set of world positions and the camera decides how deep it reads;
     - the BODY: the painted sprite, a paper standee that turns with the
       camera, or a card (four skins, the figure popping out of the frame)
       drawn in true perspective so it can lean, lunge and flip;
     - the LOOK: shadow or reflection on the water, ink outline, rim light,
       the band's tint, depth fog, the heroes who are not acting dimmed;
     - the AURA: glow, spirit outline, flame, miasma, hitodama orbiting in
       depth, a ritual circle on the ground, lightning — for the yokai and
       for the hero whose turn it is;
     - the CAMERA: zoom on the turn and on the action, follow, the cut to the
       target, dash, punch, shake, hit-stop, flash, dutch angle, letterbox,
       slow motion, drift and the parallax of the scene behind;
     - the HUD: five ways to read a hero, five to read a yokai, a turn order,
       four styles of damage number, three action bars — all of it drawn
       in the 720x1280 design space, over the game's own top band and its
       web corners (the guides), at or over the type floor of CLAUDE.md.

   The callouts drawn here ("Weak!", the special's name) stand in for the
   motor's Pop.show, which the game uses: they are here so a hit reads, not
   as a proposal. The presets are the record of seven directions; *Copy
   settings* is the panel's state as JSON, which is what a port needs.

   Keys: A attack, S skill, W weak hit, G guard, H item, F foe attack,
   X foe special, K exorcise, D down / revive, E entrance, Space auto.
   =========================================================================== */

@font-face { font-family:"Bebas Neue"; src:url(../assets/motor/font/bebasneue.woff2) format("woff2"); }

* { box-sizing:border-box; margin:0; padding:0; }

body {
  height:100vh; overflow:hidden;
  display:flex;
  background:#0b0b12;
  color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* ---------------------------------------------------------------------------
   PANEL
   --------------------------------------------------------------------------- */
#panel {
  flex:0 0 330px;
  height:100vh; overflow-y:auto;
  padding:18px 18px 40px;
  background:#12121c;
  border-right:1px solid #23233a;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel p.hint { margin:6px 0 14px; font-weight:500; font-size:12px; color:#8b8ba7; }

.row { margin-bottom:12px; }
.row label { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:4px; accent-color:#e2364b; }
.row select {
  width:100%; margin-top:4px; padding:5px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px;
  font:inherit; font-size:13px;
}
.row.check label { justify-content:flex-start; align-items:center; gap:8px; cursor:pointer; color:#c9c9e0; }
.row.check input { accent-color:#e2364b; }
.row.color label { align-items:center; }
.row.color input { width:44px; height:24px; border:1px solid #2c2c47; border-radius:6px; background:#0b0b12; padding:1px; }
.party { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin-top:4px; }
.party label { justify-content:flex-start; gap:6px; cursor:pointer; color:#c9c9e0; }
.row.hide { display:none; }

details { border-top:1px solid #23233a; padding:10px 0 2px; }
summary {
  cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;
  font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#e8e6f5; margin-bottom:8px;
}
summary::-webkit-details-marker { display:none; }
summary::after { content:"▸"; color:#6c6c8a; transition:transform .15s ease; }
details[open] summary::after { transform:rotate(90deg); }
summary small { font-size:11px; letter-spacing:0; text-transform:none; color:#6c6c8a; font-weight:500; margin-left:auto; margin-right:8px; }

button {
  padding:7px 8px;
  background:#23233a; color:#e8e6f5; border:1px solid #2f2f4d; border-radius:8px;
  font:700 12px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; cursor:pointer;
}
button:hover { background:#2d2d4a; }
button.main { background:#e2364b; border-color:#e2364b; color:#fff; }
button.on { background:#7a1426; border-color:#e2364b; }
.btns { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:12px; }
.btns.two { grid-template-columns:1fr 1fr; }
.btns kbd { font:600 10px/1 ui-monospace,monospace; color:#8b8ba7; margin-left:4px; }
#preset-note { font-size:12px; font-weight:500; color:#8b8ba7; margin:-4px 0 12px; min-height:18px; }

/* ---------------------------------------------------------------------------
   STAGE
   --------------------------------------------------------------------------- */
#stage {
  flex:1; min-width:0;
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  background-image:
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%),
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%);
  background-size:32px 32px;
  background-position:0 0, 16px 16px;
}
canvas { display:block; border-radius:14px; background:#07060c; box-shadow:0 18px 50px rgba(0,0,0,.5); touch-action:none; }
</style>
</head>
<body>

<div id="panel">
  <h1>Grudgeon fight</h1>
  <p class="hint">How a fight is staged: layout and depth, the body, the aura, the camera and the HUD — tried while it plays.</p>

  <div class="row">
    <label for="preset">Preset</label>
    <select id="preset"></select>
  </div>
  <p id="preset-note"></p>
  <div class="btns two">
    <button id="copy">Copy settings</button>
    <button id="reset">Reset fight</button>
  </div>

  <div class="btns" id="acts"></div>

  <div id="sections"></div>
</div>

<div id="stage">
  <canvas id="view"></canvas>
</div>

<script>
/* ===========================================================================
   The page's own code (ES6 — a lab page runs in your browser, not in a
   mobile WebView). Five parts: the data copied from games/grudgeon/game.js,
   the settings and their panel, the fight's little simulation, the camera
   and projection, and the drawing.
   =========================================================================== */
(function () {
  "use strict";

  const W = 720, H = 1280;
  const ART = "../assets/image/embed/grudgeon-";
  const TAU = Math.PI * 2;

  /* The motor's upper(), copied from lab/button.html: capitals are a look,
     and a capital carries no accent. */
  function upper(str) {
    var FROM = "ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝŸ";
    var TO = "AAAAAACEEEEIIIINOOOOOOUUUUYY";
    var PAIR = { "Æ": "AE", "Œ": "OE", "ß": "SS" };
    var shouted = String(str == null ? "" : str).replace(
      /[a-zß-öø-ÿœ]+/g, function (run, at, whole) {
        var b = at > 0 ? whole.charAt(at - 1) : "", a = whole.charAt(at + run.length);
        if ((b >= "0" && b <= "9") || (a >= "0" && a <= "9")) return run;
        return run.toUpperCase();
      });
    var out = "", i, c, k;
    for (i = 0; i < shouted.length; i++) {
      c = shouted.charAt(i);
      if (PAIR[c]) { out += PAIR[c]; continue; }
      k = FROM.indexOf(c);
      out += k < 0 ? c : TO.charAt(k);
    }
    return out;
  }

  /* =========================================================================
     1. THE DATA — games/grudgeon/game.js, trimmed to what the staging reads
     ========================================================================= */
  const ELEMENTS = {
    slash:  { name: "Slash",  color: "#e8e6f0" },

  };
  const HEROES = {
    akane: { name: "Akane", color: "#ff5d73", hp: 72,  sp: 40, skill: "Purify",         fx: "spells01", el: "light" },
    kenji: { name: "Kenji", color: "#5aa9ff", hp: 100, sp: 24, skill: "Iai slash",      fx: "spells03", el: "slash" },
    yuki:  { name: "Yuki",  color: "#9ce7ff", hp: 60,  sp: 60, skill: "Frost talisman", fx: "spells05", el: "ice" },
    haru:  { name: "Haru",  color: "#ffd166", hp: 76,  sp: 36, skill: "Flash",          fx: "spells07", el: "light" }

  const FOES = {

    teketeke:    { name: "Teke Teke",      color: "#c9c2b8", hp: 52,  weak: ["ice"],    resist: ["slash"],  move: "heavy", special: "Teke teke" },
    jinmenken:   { name: "Jinmenken",      color: "#9a7b5a", hp: 66,  weak: ["fire"],   resist: [],         move: "drain", special: "Leave me be" },
    akamanto:    { name: "Aka Manto",      color: "#b3122e", hp: 80,  weak: ["spirit"], resist: ["fire"],   move: "all",   special: "Red or blue?" },

    nureonna:    { name: "Nure-onna",      color: "#3d6f7a", hp: 148, weak: ["light"],  resist: ["ice"],    move: "drain", special: "Coil" },
    funayurei:   { name: "Funayurei",      color: "#7fa3b8", hp: 140, weak: ["fire"],   resist: ["slash"],  move: "all",   special: "Lend us a ladle" },
    umibozu:     { name: "Umibozu",        color: "#22303f", hp: 176, weak: ["light"],  resist: ["slash"],  move: "all",   special: "Black tide" },
    rokurokubi:  { name: "Rokurokubi",     color: "#c99bb0", hp: 168, weak: ["slash"],  resist: ["spirit"], move: "fear",  special: "Long neck" },
    gashadokuro: { name: "Gashadokuro",    color: "#e6dcc4", hp: 200, weak: ["light"],  resist: ["slash", "ice"], move: "heavy", special: "Bone crush" },
    oni:         { name: "Oni",            color: "#c4302b", hp: 190, weak: ["spirit"], resist: ["fire"],   move: "all",   special: "Thunder drum" },
    onryo:       { name: "Onryo",          color: "#e9e6f2", hp: 220, weak: ["light"],  resist: ["spirit", "ice"], move: "fear", special: "Grudge" }
  };
  const BANDS = [
    { name: "Night school",    tint: "#1d2a52", scene: "background-phone-01", foes: ["hanako", "teketeke", "jinmenken", "akamanto"] },
    { name: "Hospital",        tint: "#173d36", scene: "background-phone-02", foes: ["kuchisake", "ubume", "gaki", "nopperabo"] },
    { name: "Shrine forest",   tint: "#3d1a1f", scene: "background-phone-03", foes: ["kasaobake", "chochin", "jorogumo", "tengu"] },
    { name: "Drowned village", tint: "#132f45", scene: "background-phone-04", foes: ["kappa", "nureonna", "funayurei", "umibozu"] },
    { name: "Gate of Yomi",    tint: "#2e1745", scene: "background-phone-05", foes: ["rokurokubi", "gashadokuro", "oni", "onryo"] }
  ];
  const MOVE_FX = { strike: "spells13", heavy: "spells14", all: "spells12", drain: "spells11", fear: "spells10" };
  function bandOf(foe) { for (let i = 0; i < BANDS.length; i++) if (BANDS[i].foes.indexOf(foe) >= 0) return i; return 0; }

  /* The painted art, as the build ships it (assets/image/embed/). Loaded on
     first ask; a sprite that has not decoded yet is simply not drawn. */
  const IMGS = {};
  function img(key) {
    let im = IMGS[key];
    if (!im) { im = new Image(); im.src = ART + key + ".webp"; IMGS[key] = im; }
    return im.complete && im.naturalWidth ? im : null;
  }
  function preload() {
    HERO_IDS.forEach(id => { for (let p = 1; p <= 6; p++) img("hero-" + id + "0" + p); });
    for (const id in FOES) for (let p = 1; p <= 4; p++) img("foe-" + id + "0" + p);
    for (let k = 1; k <= 14; k++) img("spells" + (k < 10 ? "0" : "") + k);
    BANDS.forEach(b => img(b.scene));
  }

  /* =========================================================================
     2. THE SETTINGS, the layouts, the presets and the panel
     ========================================================================= */

  /* A layout is a set of positions on the ground plane — x across, z into
     the screen, one unit ~ a hero's width — plus the camera it was composed
     for. Choosing one in the panel applies that camera; the sliders then
     take over. */
  const LAYOUTS = {
    side: {
      name: "Side line (the game)",
      cam: { persp: 40, tilt: 1.25, unit: 105, groundY: 671, pivotZ: 0, heroScale: 1, foeScale: 1 },
      foe: [1.6, 0],
      heroes: n => spread(n, i => [-2.05, (n - 1) / 2 * 1.58 - i * 1.58])
    },
    diag: {
      name: "Diagonal (classic JRPG)",
      cam: { persp: 7, tilt: 0.75, unit: 112, groundY: 720, pivotZ: 0.3, heroScale: 0.95, foeScale: 1.15 },
      foe: [1.2, 1.3],
      heroes: n => spread(n, i => [-2.4 + i * 1.0, 0.5 - i * 0.65])
    },
    front: {
      name: "Front row (party below)",
      cam: { persp: 8, tilt: 0.8, unit: 110, groundY: 700, pivotZ: 0.2, heroScale: 0.85, foeScale: 1.2 },
      foe: [0, 1.3],
      heroes: n => spread(n, i => { const u = n > 1 ? i / (n - 1) - 0.5 : 0; return [u * 4.2, -1.2 + Math.abs(u) * 0.2]; })
    },
    squad: {
      name: "Squad 2x2 (party below)",
      cam: { persp: 8, tilt: 0.8, unit: 110, groundY: 680, pivotZ: 0.2, heroScale: 0.8, foeScale: 1.15 },
      foe: [0, 1.5],
      heroes: n => spread(n, i => [(i % 2 ? 1 : -1) * (1.3 + Math.floor(i / 2) * 0.35), -0.4 - Math.floor(i / 2) * 1.0])
    },
    ring: {
      name: "Arena ring (orbit)",
      cam: { persp: 6, tilt: 0.85, unit: 105, groundY: 660, pivotZ: 0.4, heroScale: 0.85, foeScale: 1.15 },
      foe: [0, 0.9],
      heroes: n => spread(n, i => { const a = (195 + (n > 1 ? i / (n - 1) : 0.5) * 150) * Math.PI / 180; return [Math.cos(a) * 2.15, 0.45 + Math.sin(a) * 1.3]; })
    },
    duel: {
      name: "Duel (the actor steps forward)",
      cam: { persp: 6, tilt: 0.85, unit: 110, groundY: 690, pivotZ: 0.3, heroScale: 1, foeScale: 1.25 },
      foe: [1.0, 0.6],
      heroes: (n, act) => {
        const out = [], back = [[-2.3, 1.6], [-1.4, 2.3], [-0.5, 2.9]];
        let b = 0;
        for (let i = 0; i < n; i++) out.push(i === act ? [-1.05, -0.9] : back[b++] || [-2.6, 3]);
        return out;
      }
    },
    versus: {
      name: "Versus (split screen)",
      cam: { persp: 9, tilt: 1.1, unit: 100, groundY: 640, pivotZ: 0, heroScale: 0.85, foeScale: 1.15 },
      foe: [1.35, 1.1],
      heroes: n => spread(n, i => [-2.2 + (i % 2), 0.6 - i * 0.7])
    }
  };
  function spread(n, f) { const out = []; for (let i = 0; i < n; i++) out.push(f(i)); return out; }

  const BASE = {
    band: 0, foe: "hanako", party: HERO_IDS.slice(), entrance: "slide",
    layout: "side", persp: 40, tilt: 1.25, unit: 105, groundY: 671, pivotZ: 0, yaw: 0, sway: 0, swaySpeed: 0.25,
    heroScale: 1, foeScale: 1, autoFace: true, flipHero: false, flipFoe: false, floor: "none",
    body: "sprite", cardSkin: "lacquer", cardPop: true, cardTilt: 1,
    ground: "shadow", breath: 1, bob: 1, outline: 0, outlineColor: "#07060c",
    rim: 0, rimColor: "#ff8fa0", rimAngle: -50, tint: 0, fog: 0, dimIdle: 0,
    foeAura: "none", heroAura: "none", heroAuraWho: "active", auraOwn: true, auraColor: "#b69cff",
    auraSize: 1, auraPower: 0.8, auraSpeed: 1,
    turnZoom: 0, actZoom: 0, follow: 0.6, camSpeed: 4, cutToTarget: false, dash: 0.12,
    punch: 0, shake: 8, hitstop: 0, flash: 0.25, dutch: 0, letterbox: false, slowmo: false,
    drift: 0, parallax: 0, bgZoom: 1, bgDim: 0.35, vignette: 0.3, spellBlend: "normal",
    heroHud: "plates", foeHud: "plate", turnOrder: "none", numbers: "float", actionBar: "game",
    gameHud: true, guides: false, face: "bebas"
  };

  /* Seven directions, each a whole staging. A is the game as it ships. */
  const PRESETS = [
    { name: "A · The game today", note: "drawFight as it ships: side line, flat, plates.", set: {} },
    { name: "B · Diagonal stage", note: "Classic JRPG diagonal, rim light, foe in flames, slanted tiles.", set: {
      layout: "diag", ground: "reflection", floor: "mist", rim: 0.6, tint: 0.25, fog: 0.4, dimIdle: 0.25,
      foeAura: "flame", heroAura: "ring", turnZoom: 0.08, actZoom: 0.22, follow: 0.6, cutToTarget: true,
      dash: 0.75, punch: 0.06, shake: 12, hitstop: 0.07, flash: 0.35, dutch: 6, letterbox: true,
      parallax: 0.3, bgZoom: 1.08, drift: 0.01, heroHud: "slants", foeHud: "boss", turnOrder: "top", numbers: "stamp"
    } },
    { name: "C · Front row", note: "The party below, the yokai looming in its miasma, medallions and a scroll.", set: {
      layout: "front", ground: "reflection", floor: "mist", rim: 0.45, tint: 0.2, fog: 0.3,
      foeAura: "smoke", heroAura: "glow", actZoom: 0.2, follow: 0.5, dash: 0.55, punch: 0.05, shake: 10,
      hitstop: 0.05, parallax: 0.25, bgZoom: 1.06, heroHud: "medallions", foeHud: "scroll", numbers: "brush", actionBar: "ofuda"
    } },
    { name: "D · Arena orbit", note: "Paper standees on a rope ring, the camera circling, hitodama around the yokai.", set: {
      layout: "ring", body: "standee", sway: 16, swaySpeed: 0.18, floor: "rope", ground: "shadow",
      foeAura: "wisps", heroAura: "ring", rim: 0.35, tint: 0.2, fog: 0.25, turnZoom: 0.12, actZoom: 0.25, follow: 0.7,
      dash: 0.6, punch: 0.05, shake: 10, parallax: 0.35, bgZoom: 1.1, heroHud: "feet", foeHud: "seal", turnOrder: "side", numbers: "float"
    } },
    { name: "E · Duel", note: "The actor steps forward, the camera cuts on every blow, lightning on the yokai.", set: {
      layout: "duel", ground: "reflection", floor: "mist", rim: 0.55, tint: 0.25, fog: 0.45, dimIdle: 0.45,
      foeAura: "sparks", heroAura: "glow", turnZoom: 0.18, actZoom: 0.35, follow: 0.8, camSpeed: 5, cutToTarget: true,
      dash: 0.85, punch: 0.08, shake: 16, hitstop: 0.1, flash: 0.4, dutch: 8, letterbox: true, slowmo: true,

    } },
    { name: "F · Cards", note: "Every combatant is a lacquer card, the figure breaking out of its frame.", set: {
      layout: "front", heroScale: 0.7, foeScale: 1.05, body: "card", cardSkin: "lacquer", cardPop: true, cardTilt: 1, ground: "shadow", floor: "mist",
      foeAura: "glow", heroAura: "ring", rim: 0.3, actZoom: 0.15, follow: 0.5, dash: 0.6, punch: 0.06, shake: 10,

    { name: "G · Paper theatre", note: "Kamishibai: washi cards on the game's own line, ink and paper everywhere.", set: {
      layout: "side", groundY: 600, tilt: 1, heroScale: 0.7, foeScale: 0.9, body: "card", cardSkin: "washi", cardPop: false, cardTilt: 0.6, ground: "shadow",
      foeAura: "smoke", heroAura: "none", actZoom: 0.12, follow: 0.4, dash: 0.3, punch: 0.04, shake: 8,
      parallax: 0.15, bgZoom: 1.04, bgDim: 0.5, heroHud: "ofuda", foeHud: "seal", numbers: "brush", actionBar: "ofuda"
    } }
  ];

  const STORE_KEY = "lab:grudgeon-fight";
  let P = Object.assign({}, BASE);
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s) P = Object.assign({}, BASE, s.P); } catch (e) { /* no storage */ }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ P })); } catch (e) { /* no storage */ } }

  const AURAS = [["none", "None"], ["glow", "Glow"], ["rim", "Spirit outline"], ["flame", "Flame"], ["smoke", "Miasma"],
                 ["wisps", "Hitodama (orbit)"], ["ring", "Ritual circle"], ["sparks", "Lightning"]];

  /* The panel, declared: one entry per knob. `show` hides a row that only
     means something under another choice. */
  const SECTIONS = [
    { title: "Scene", open: true, rows: [
      { k: "band", label: "Band", type: "select", num: true, opts: () => BANDS.map((b, i) => [i, b.name]) },
      { k: "foe", label: "Yokai", type: "select", opts: () => BANDS[P.band].foes.map(id => [id, FOES[id].name]) },
      { k: "party", label: "Party", type: "party" },

    ] },
    { title: "Stage and depth", open: true, rows: [
      { k: "layout", label: "Layout", type: "select", opts: () => Object.keys(LAYOUTS).map(k => [k, LAYOUTS[k].name]) },

      { k: "bgZoom", label: "Scene zoom", type: "range", min: 1, max: 1.6, step: 0.01 },

    ] },
    { title: "HUD", rows: [
      { k: "heroHud", label: "Heroes", type: "select", opts: [["plates", "Plates (the game)"], ["feet", "Under the feet"], ["ofuda", "Ofuda strips"], ["slants", "Slanted tiles"], ["medallions", "Medallions"], ["none", "None"]] },
      { k: "foeHud", label: "Yokai", type: "select", opts: [["plate", "Plate (the game)"], ["boss", "Boss bar"], ["scroll", "Makimono scroll"], ["seal", "Hanko seal"], ["feet", "Under the feet"], ["none", "None"]] },
      { k: "turnOrder", label: "Turn order", type: "select", opts: [["none", "None"], ["top", "Row on top"], ["side", "Column on the right"]] },
      { k: "numbers", label: "Damage numbers", type: "select", opts: [["float", "Float (Pop.text)"], ["stamp", "Red stamp"], ["brush", "Ink brush"], ["comic", "Comic burst"]] },
      { k: "actionBar", label: "Action bar", type: "select", opts: [["game", "Buttons (the game)"], ["ofuda", "Talismans"], ["fan", "Fan of cards"], ["none", "None"]] },
      { k: "face", label: "Face", type: "select", opts: [["bebas", "Bebas Neue (web.font)"], ["system", "System bold (playable)"]] },
      { k: "gameHud", label: "The game's top band", type: "check" },
      { k: "guides", label: "Guides (Layout, corners)", type: "check" }
    ] }
  ];

  const rowEls = [];
  function digits(step) { const s = String(step); return s.indexOf(".") < 0 ? 0 : s.length - s.indexOf(".") - 1; }
  function buildPanel() {
    const host = document.getElementById("sections");
    host.innerHTML = ""; rowEls.length = 0;
    SECTIONS.forEach(sec => {
      const d = document.createElement("details");
      if (sec.open) d.open = true;
      d.innerHTML = "<summary>" + sec.title + "</summary>";
      sec.rows.forEach(r => {
        const row = document.createElement("div");
        row.className = "row" + (r.type === "check" ? " check" : r.type === "color" ? " color" : "");
        const id = "k-" + r.k;
        if (r.type === "range") {
          row.innerHTML = '<label for="' + id + '">' + r.label + ' <b id="' + id + '-v"></b></label>' +
            '<input id="' + id + '" type="range" min="' + r.min + '" max="' + r.max + '" step="' + r.step + '">';
          const el = row.querySelector("input"), out = row.querySelector("b");
          el.addEventListener("input", () => { P[r.k] = parseFloat(el.value); out.textContent = P[r.k].toFixed(digits(r.step)) + (r.unit || ""); changed(r.k); });
          r.sync = () => { el.value = P[r.k]; out.textContent = (+P[r.k]).toFixed(digits(r.step)) + (r.unit || ""); };
        } else if (r.type === "select") {
          row.innerHTML = '<label for="' + id + '">' + r.label + '</label><select id="' + id + '"></select>';
          const el = row.querySelector("select");
          el.addEventListener("change", () => { P[r.k] = r.num ? +el.value : el.value; changed(r.k); });
          r.sync = () => {
            const opts = typeof r.opts === "function" ? r.opts() : r.opts;
            el.innerHTML = opts.map(o => '<option value="' + o[0] + '">' + o[1] + "</option>").join("");
            el.value = P[r.k];
          };
        } else if (r.type === "check") {
          row.innerHTML = '<label><input id="' + id + '" type="checkbox"> ' + r.label + "</label>";
          const el = row.querySelector("input");
          el.addEventListener("change", () => { P[r.k] = el.checked; changed(r.k); });
          r.sync = () => { el.checked = !!P[r.k]; };
        } else if (r.type === "color") {
          row.innerHTML = '<label for="' + id + '">' + r.label + '<input id="' + id + '" type="color"></label>';
          const el = row.querySelector("input");
          el.addEventListener("input", () => { P[r.k] = el.value; changed(r.k); });
          r.sync = () => { el.value = P[r.k]; };
        } else if (r.type === "party") {
          row.innerHTML = "<label>" + r.label + '</label><div class="party">' +
            HERO_IDS.map(h => '<label><input type="checkbox" value="' + h + '"> ' + HEROES[h].name + "</label>").join("") + "</div>";
          const boxes = row.querySelectorAll("input");
          boxes.forEach(b => b.addEventListener("change", () => {
            const on = HERO_IDS.filter(h => row.querySelector('input[value="' + h + '"]').checked);
            if (!on.length) { b.checked = true; return; }
            P.party = on; changed("party");
          }));
          r.sync = () => { boxes.forEach(b => { b.checked = P.party.indexOf(b.value) >= 0; }); };
        }
        d.appendChild(row);
        rowEls.push({ r, row });
      });
      host.appendChild(d);
    });
    syncPanel();
  }
  function syncPanel() {
    rowEls.forEach(o => { o.r.sync(); o.row.classList.toggle("hide", !!o.r.show && !o.r.show()); });
  }

  function changed(k) {
    if (k === "band") { P.foe = BANDS[P.band].foes[0]; newFoe(); syncPanel(); }
    else if (k === "foe") { newFoe(); }
    else if (k === "party") { resetFight(false); }
    else if (k === "layout") { Object.assign(P, LAYOUTS[P.layout].cam); setTargets(); syncPanel(); }
    else if (k === "entrance") { replayEntrance(); }
    else rowEls.forEach(o => o.row.classList.toggle("hide", !!o.r.show && !o.r.show()));
    if (k === "layout" || k === "party") setTargets();
    document.getElementById("preset").value = "";
    document.getElementById("preset-note").textContent = "Edited.";
    save();
  }

  function applyPreset(i) {
    const keep = { band: P.band, foe: P.foe, party: P.party };
    P = Object.assign({}, BASE, PRESETS[i].set);
    Object.assign(P, LAYOUTS[P.layout].cam, PRESETS[i].set, keep);
    document.getElementById("preset-note").textContent = PRESETS[i].note;
    syncPanel(); save();
    resetFight(true);
  }

  /* =========================================================================
     3. THE FIGHT — a little simulation, only as deep as the staging needs
     ========================================================================= */
  let party = [], foe = null, active = 0, turn = 0, foeTurns = 0, busy = false, auto = false, autoWait = 0;
  let T = 0;                 // world clock (stops on a hit-stop, slows on a slow motion)
  let RT = 0;                // real clock
  let hitstop = 0, slow = 0, special = 0, enterT = 0;
  let jobs = [], tweens = [], parts = [], nums = [], calls = [], fxs = [];
  let flashA = 0, flashC = "#ffffff";

  function makeHero(id, i) {
    const b = HEROES[id];
    return { kind: "hero", id, b, i, color: b.color, mhp: b.hp, hp: b.hp, msp: b.sp, sp: b.sp, lag: b.hp,
      hx: 0, hz: 0, tx: 0, tz: 0, dash: 0, dashTo: { x: 0, z: 0 }, kx: 0, kz: 0,
      hurt: 0, lunge: 0, cast: 0, guard: 0, dead: false, flash: 0, boost: 0, spin: 0, hover: 0, fade: 1, phase: i * 1.7, enter: 0 };
  }
  function makeFoe(id) {
    const b = FOES[id];
    return { kind: "foe", id, b, color: b.color, mhp: b.hp, hp: b.hp, lag: b.hp,
      hx: 0, hz: 0, tx: 0, tz: 0, dash: 0, dashTo: { x: 0, z: 0 }, kx: 0, kz: 0,
      hurt: 0, lunge: 0, cast: 0, guard: 0, dead: false, flash: 0, boost: 0, spin: 0, hover: 0, fade: 1, phase: 0.4, enter: 0 };
  }
  function all() { return foe ? party.concat([foe]) : party.slice(); }
  function alive() { return party.filter(h => !h.dead); }
  function activeHero() { return party[active] && !party[active].dead ? party[active] : null; }

  function setTargets(snap) {
    const L = LAYOUTS[P.layout], pos = L.heroes(party.length, active);
    party.forEach((h, i) => { h.tx = pos[i][0]; h.tz = pos[i][1]; if (snap) { h.hx = h.tx; h.hz = h.tz; } });
    if (foe) { foe.tx = L.foe[0]; foe.tz = L.foe[1]; if (snap) { foe.hx = foe.tx; foe.hz = foe.tz; } }
  }

  function resetFight(entrance) {
    jobs = []; tweens = []; parts = []; nums = []; calls = []; fxs = [];
    busy = false; hitstop = 0; slow = 0; special = 0; turn = 0; foeTurns = 0;
    party = P.party.map((id, i) => makeHero(id, i));
    foe = makeFoe(P.foe);
    active = 0;
    setTargets(true);
    if (entrance !== false) replayEntrance(); else all().forEach(a => { a.enter = 1; });
  }
  function newFoe() {
    foe = makeFoe(P.foe);
    setTargets(true);
    foe.enter = 0; enterT = 0;
    tween(foe, "enter", 1, 0.7, outCubic, 0.1);
  }
  function replayEntrance() {
    enterT = 0;
    all().forEach((a, i) => { a.enter = 0; tween(a, "enter", 1, 0.55, outCubic, a.kind === "foe" ? 0.62 : 0.45 + i * 0.09); });
  }

  /* --- timing helpers ---------------------------------------------------- */
  function later(d, fn) { jobs.push({ t: d, fn }); }
  function tween(o, k, to, d, ease, delay) { tweens.push({ o, k, from: null, to, d, t: -(delay || 0), ease: ease || outCubic }); }
  function outCubic(q) { return 1 - Math.pow(1 - q, 3); }
  function inOut(q) { return q * q * (3 - 2 * q); }
  function outBack(q) { const c = 1.7; return 1 + (c + 1) * Math.pow(q - 1, 3) + c * Math.pow(q - 1, 2); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* --- the beats --------------------------------------------------------- */
  function impact(target, from, dmg, opts) {
    opts = opts || {};
    target.hurt = 0.4; target.flash = 1;
    const dx = target.hx - from.hx, dz = target.hz - from.hz, d = Math.hypot(dx, dz) || 1;
    target.kx = dx / d * 0.25; target.kz = dz / d * 0.25;
    tween(target, "kx", 0, 0.35); tween(target, "kz", 0, 0.35);
    if (opts.heal) target.hp = Math.min(target.mhp, target.hp + dmg);
    else target.hp = Math.max(0, target.hp - dmg);
    nums.push({ a: target, txt: (opts.heal ? "+" : "") + dmg, col: opts.heal ? "#7ee0a1" : target.kind === "foe" ? (opts.el ? ELEMENTS[opts.el].color : "#ffffff") : "#ff5d73",
      t: 0, life: 1.1, weak: !!opts.weak, heal: !!opts.heal, ox: rnd(-20, 20) });
    if (opts.heal) { target.hurt = 0; target.flash = 0.6; return; }
    const k = opts.weak ? 1.6 : opts.big ? 1.3 : 1;
    cam.shake = Math.max(cam.shake, P.shake * k);
    cam.punch = P.punch * k;
    hitstop = P.hitstop * k;
    if (P.flash > 0) { flashA = P.flash * (opts.weak ? 1 : 0.55); flashC = opts.el ? ELEMENTS[opts.el].color : "#ffffff"; }
    if (P.cutToTarget) cam.subject = target;
  }
  function spell(key, a, scale) {
    fxs.push({ key, a, t: 0, d: 0.75, s: (scale || 1.1) });
  }
  function callout(word, col, sub) { calls.push({ word, col, sub, t: 0, life: 1.3 }); }

  function heroAct(kind) {
    if (busy) return;
    const h = activeHero(); if (!h || !foe || foe.dead) return;
    busy = true;
    const weak = kind === "weak", skill = kind === "skill" || weak;
    const el = weak ? foe.b.weak[0] : skill ? h.b.el : "slash";
    const fx = skill ? h.b.fx : "spells13";
    cam.subject = h;
    if (skill) { h.cast = 0.9; h.sp = Math.max(0, h.sp - 8); }
    else h.lunge = 0.6;
    h.dashTo = { x: foe.hx + (h.hx - foe.hx) * 0.3, z: foe.hz + (h.hz - foe.hz) * 0.3 };
    tween(h, "dash", skill ? 0.35 : 1, 0.22);
    later(skill ? 0.38 : 0.24, () => {
      spell(fx, foe, 1.15);
      const dmg = Math.round((skill ? 22 : 12) * (weak ? 1.6 : 1) + rnd(0, 6));
      impact(foe, h, dmg, { el, weak });
      if (weak) { callout("Weak!", "#ffd166", "One more"); foe.boost = 1; tween(foe, "boost", 0, 1.2); }
    });
    later(0.62, () => { tween(h, "dash", 0, 0.32, inOut); });
    later(1.05, () => {
      cam.subject = null; busy = false;
      if (foe.hp <= 0) { exorcise(); return; }
      if (!weak) nextTurn();
    });
  }
  function heroGuard() {
    if (busy) return;
    const h = activeHero(); if (!h) return;
    busy = true; cam.subject = h;
    h.guard = 1.2; spell("spells04", h, 0.9);
    later(0.9, () => { cam.subject = null; busy = false; nextTurn(); });
  }
  function heroItem() {
    if (busy) return;
    const h = activeHero(); if (!h) return;
    busy = true; cam.subject = h; h.cast = 0.7;
    later(0.25, () => { spell("spells02", h, 0.9); impact(h, h, Math.round(rnd(14, 24)), { heal: true }); });
    later(1.0, () => { cam.subject = null; busy = false; nextTurn(); });
  }
  function foeAttack() {
    if (busy || !foe || foe.dead) return;
    const tgts = alive(); if (!tgts.length) return;
    busy = true;
    const h = tgts[Math.floor(Math.random() * tgts.length)];
    cam.subject = foe; foe.lunge = 0.6;
    foe.dashTo = { x: h.hx + (foe.hx - h.hx) * 0.3, z: h.hz + (foe.hz - h.hz) * 0.3 };
    tween(foe, "dash", 1, 0.24);
    later(0.26, () => {
      spell("spells13", h, 1.0);
      impact(h, foe, Math.round(rnd(8, 15) * (h.guard > 0 ? 0.6 : 1)), {});
      if (h.hp <= 0) down(h, true);
    });
    later(0.62, () => { tween(foe, "dash", 0, 0.34, inOut); });
    later(1.05, () => { cam.subject = null; busy = false; endFoeTurn(); });
  }
  function foeSpecial() {
    if (busy || !foe || foe.dead) return;
    busy = true; special = 1;
    cam.subject = foe; foe.cast = 1.5; foe.boost = 1.5;
    tween(foe, "boost", 0.3, 1.6, inOut);
    later(0.35, () => callout(foe.b.special, "#e2364b"));
    const move = foe.b.move;
    later(1.05, () => {
      const tg = move === "all" ? alive() : alive().slice(0, 1);
      tg.forEach(h => { spell(MOVE_FX[move], h, 1.05); impact(h, foe, Math.round(rnd(10, 18) * (move === "heavy" ? 1.6 : 0.8)), { big: true, el: "spirit" }); });
      flashC = "#e2364b"; flashA = Math.max(flashA, P.flash * 0.8);
      if (P.cutToTarget) cam.subject = null;
    });
    later(1.9, () => { special = 0; foe.boost = 0; tween(foe, "boost", 0, 0.3); cam.subject = null; busy = false; party.forEach(h => { if (h.hp <= 0) down(h, true); }); endFoeTurn(); });
  }
  function exorcise() {
    if (!foe || foe.dead) return;
    busy = true;
    cam.subject = foe;
    spell("spells01", foe, 1.5);
    impact(foe, party[0] || foe, foe.hp, { el: "light", big: true });
    foe.dead = true;
    if (P.slowmo) slow = 0.9;
    callout("Exorcised", "#fff2a8");
    later(0.3, () => {
      tween(foe, "fade", 0, 1.3, inOut);
      if (P.body === "card") tween(foe, "spin", Math.PI, 1.0, inOut);

    ctx.restore();
  }

  function drawActionBar() {
    hits.length = 0;
    if (P.actionBar === "none") return;
    const h = activeHero(), top = 1004, bottom = 1204;
    const acts = [["attack", "Attack", null], ["skill", h ? h.b.skill : "Skill", h ? h.b.el : null], ["guard", "Guard", null], ["item", "Item", null]];
    ctx.save();
    ctx.globalAlpha = (turn === 0 && !busy ? 1 : 0.45) * (1 - cam.lb);
    if (P.actionBar === "game") {
      if (h) text(upper(h.b.name), W / 2, top + 12, 22, h.color, "center", 6);
      const bw = (W - 52 - 14) / 2, bh = 72;
      acts.forEach((ac, i) => {
        const x = 26 + (i % 2) * (bw + 14), y = top + 34 + Math.floor(i / 2) * (bh + 12);
        ctx.fillStyle = "#4a0c18"; rr(ctx, x, y + 6, bw, bh, 24); ctx.fill();
        const gr = ctx.createLinearGradient(0, y, 0, y + bh); gr.addColorStop(0, "#e2364b"); gr.addColorStop(1, "#7a1426");
        ctx.fillStyle = gr; rr(ctx, x, y, bw, bh, 24); ctx.fill();
        text(upper(ac[1]), x + bw / 2, y + bh / 2 + 2, 30, "#fff4f0");
        hits.push({ x, y, w: bw, h: bh, act: ac[0] });
      });
    } else if (P.actionBar === "ofuda") {
      const n = 4, gap = 14, tw = (W - 52 - gap * 3) / n, th = bottom - top - 10;
      acts.forEach((ac, i) => {
        const x = 26 + i * (tw + gap), y = top + 6, ry = (i - 1.5) * 0.025;
        ctx.save(); ctx.translate(x + tw / 2, y + th / 2); ctx.rotate(ry); ctx.translate(-tw / 2, -th / 2);
        ctx.fillStyle = "#efe6cf"; ctx.fillRect(0, 0, tw, th);
        ctx.fillStyle = "#b3122e"; ctx.fillRect(0, 0, tw, 40);
        ctx.beginPath(); ctx.arc(tw / 2, 20, 12, 0, TAU); ctx.fillStyle = ac[2] ? ELEMENTS[ac[2]].color : "#efe6cf"; ctx.fill();
        ctx.strokeStyle = "#b3122e"; ctx.lineWidth = 2; ctx.strokeRect(6, 46, tw - 12, th - 52);
        const words = upper(ac[1]).split(" ");
        words.forEach((wd, j) => text(wd, tw / 2, 104 + (j - (words.length - 1) / 2) * 32, 30, "#1a1012"));
        ctx.restore();
        hits.push({ x, y, w: tw, h: th, act: ac[0] });
      });
    } else if (P.actionBar === "fan") {
      const px = W / 2, py = 1640, rad = 600, cw = 140, chh = 190;
      acts.forEach((ac, i) => {
        const ang = (i - 1.5) * 0.25;
        const cx = px + Math.sin(ang) * rad, cy = py - Math.cos(ang) * rad;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
        const gr = ctx.createLinearGradient(0, -chh / 2, 0, chh / 2); gr.addColorStop(0, "#2a0f18"); gr.addColorStop(1, "#0b0508");
        ctx.fillStyle = gr; rr(ctx, -cw / 2, -chh / 2, cw, chh, 12); ctx.fill();
        ctx.strokeStyle = "#e9c46a"; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = ac[2] ? ELEMENTS[ac[2]].color : "#e2364b"; ctx.beginPath(); ctx.arc(0, -chh / 2 + 42, 22, 0, TAU); ctx.fill();
        const words = upper(ac[1]).split(" ");
        words.forEach((wd, j) => text(wd, 0, -chh / 2 + 104 + j * 30, 26, "#f6d58a"));
        ctx.restore();
        hits.push({ x: cx - cw / 2, y: cy - chh / 2, w: cw, h: chh, act: ac[0], rot: ang, cx, cy });
      });
    }
    ctx.restore();
  }

  function drawGameHud() {
    if (!P.gameHud) return;
    const gr = ctx.createLinearGradient(0, 0, 0, 150);
    gr.addColorStop(0, "rgba(4,3,8,.7)"); gr.addColorStop(1, "rgba(4,3,8,0)");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 150);
    text(upper("Gold"), 70, 44, 20, "rgba(240,236,250,.6)");
    text("120", 70, 82, 44, "#e9c46a");
    text("4 820", W / 2, 70, 64, "#fff4f0");
    text(upper("Yokai"), W - 70, 44, 20, "rgba(240,236,250,.6)");
    text("3", W - 70, 82, 44, "#fff4f0");
  }
  function drawGuides() {
    if (!P.guides) return;
    ctx.save();
    ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(126,166,255,.8)"; ctx.strokeRect(26, 150, W - 52, 1254 - 150);
    ctx.strokeStyle = "rgba(233,196,106,.8)"; ctx.strokeRect(26, 1004, W - 52, 200);
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(226,54,75,.22)";
    ctx.fillRect(26, 1184, 230, 70); ctx.fillRect(W - 26 - 230, 1184, 230, 70);
    ctx.fillStyle = "rgba(126,166,255,.12)"; ctx.fillRect(0, 0, W, 150);
    ctx.font = "600 22px -apple-system,sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(126,166,255,.95)"; ctx.fillText("HUD band (150)", 34, 120); ctx.fillText("Layout", 34, 158);
    ctx.fillStyle = "rgba(233,196,106,.95)"; ctx.fillText("Action bar", 34, 1010);
    ctx.fillStyle = "rgba(255,140,150,.95)"; ctx.fillText("Stars pill", 34, 1192); ctx.textAlign = "right"; ctx.fillText("Web corner", W - 34, 1192);
    ctx.restore();
  }

  /* --- one frame ---------------------------------------------------------- */
  function render() {
    ctx.setTransform(R, 0, 0, R, 0, 0);
    drawScene();
    ctx.save();
    applyCamera(ctx);
    drawFloor();
    const list = all().filter(a => a.sx != null).sort((a, b) => b.depth - a.depth);
    list.forEach(drawActor);
    drawSpells();
    ctx.restore();

    if (flashA > 0.01) { ctx.fillStyle = rgba(flashC, flashA); ctx.globalCompositeOperation = "lighter"; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = "source-over"; }
    if (P.vignette > 0) {
      const gr = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
      gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0," + P.vignette + ")");
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    }
    if (cam.lb > 0.01) { const b = 130 * cam.lb; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, b); ctx.fillRect(0, H - b, W, b); }

    drawNumbers();
    let y = hudTop();
    ctx.save(); ctx.globalAlpha = 1 - cam.lb * 0.85;
    drawGameHud();
    ctx.restore();
    if (P.turnOrder === "top") { drawTurnOrder(y); y += 92; } else drawTurnOrder(y);
    if (P.foeHud === "plate") drawFoeHud(hudTop() + (P.turnOrder === "top" ? 92 : 0) + 4);
    else drawFoeHud(y);
    ctx.save(); ctx.globalAlpha = 1 - cam.lb * 0.85;
    drawHeroHud();
    ctx.restore();
    drawActionBar();
    drawCallouts();
    drawGuides();
  }

  /* --- the clock ---------------------------------------------------------- */
  function update(rdt) {
    RT += rdt;
    let dt = rdt;
    if (hitstop > 0) { hitstop -= rdt; dt = 0; }
    if (slow > 0) { slow -= rdt; dt *= 0.3; }
    T += dt; enterT += dt;
    yawNow = (P.yaw + Math.sin(RT * P.swaySpeed * TAU * 0.5) * P.sway) * Math.PI / 180;

    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i]; tw.t += dt;
      if (tw.t < 0) continue;
      if (tw.from === null) tw.from = tw.o[tw.k];
      const q = Math.min(1, tw.t / tw.d);
      tw.o[tw.k] = tw.from + (tw.to - tw.from) * tw.ease(q);
      if (q >= 1) tweens.splice(i, 1);
    }
    for (let i = jobs.length - 1; i >= 0; i--) { const j = jobs[i]; j.t -= dt; if (j.t <= 0) { jobs.splice(i, 1); j.fn(); } }
    all().forEach(a => {
      a.hx += (a.tx - a.hx) * Math.min(1, dt * 5); a.hz += (a.tz - a.hz) * Math.min(1, dt * 5);
      a.hurt = Math.max(0, a.hurt - dt); a.lunge = Math.max(0, a.lunge - dt); a.cast = Math.max(0, a.cast - dt);
      a.guard = Math.max(0, a.guard - dt); a.flash = Math.max(0, a.flash - dt * 5);
      a.lag += (a.hp - a.lag) * Math.min(1, dt * (a.lag > a.hp ? 1.6 : 8));
      if (a.kind === "hero" && !a.dead) a.sp = Math.min(a.msp, a.sp + dt * 0.6);
      place(a);
      spawnAura(a, dt);
      if (P.body === "card" && a.sx != null && pointer) {
        const ins = Math.abs(pointer.x - a.sx) < a.s * 0.4 && pointer.y < a.sy && pointer.y > a.sy - a.s;
        const want = ins ? clamp((pointer.x - a.sx) / (a.s * 0.4), -1, 1) * 0.5 : 0;
        a.hover += (want - a.hover) * Math.min(1, rdt * 8);
      } else a.hover *= 0.9;
    });
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = fxs.length - 1; i >= 0; i--) { fxs[i].t += dt; if (fxs[i].t >= fxs[i].d) fxs.splice(i, 1); }
    for (let i = nums.length - 1; i >= 0; i--) { nums[i].t += rdt; if (nums[i].t >= nums[i].life) nums.splice(i, 1); }
    for (let i = calls.length - 1; i >= 0; i--) { calls[i].t += rdt; if (calls[i].t >= calls[i].life) calls.splice(i, 1); }
    flashA *= Math.pow(0.0001, rdt);
    updateCamera(rdt);
    if (auto && !busy) { autoWait -= rdt; if (autoWait <= 0) { autoWait = 0.45; autoStep(); } }
  }

  /* --- the canvas, the pointer, the keys --------------------------------- */
  let pointer = null;
  function fit() {
    const st = document.getElementById("stage");
    const aw = st.clientWidth - 32, ah = st.clientHeight - 32;
    const h = Math.min(ah, aw * H / W), w = h * W / H;
    cv.style.width = w + "px"; cv.style.height = h + "px";
    R = Math.min(2, (window.devicePixelRatio || 1) * h / H * 1.0);
    R = Math.max(0.5, R);
    cv.width = Math.round(W * R); cv.height = Math.round(H * R);
  }
  function design(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  cv.addEventListener("pointermove", e => { const d = design(e); pointer = toCamera(d.x, d.y); });
  cv.addEventListener("pointerleave", () => { pointer = null; });
  cv.addEventListener("pointerdown", e => {
    const d = design(e);
    for (const hb of hits) {
      let x = d.x, y = d.y;
      if (hb.rot) { const c = Math.cos(-hb.rot), s = Math.sin(-hb.rot), dx = x - hb.cx, dy = y - hb.cy; x = hb.cx + dx * c - dy * s; y = hb.cy + dx * s + dy * c; }
      if (x >= hb.x && x <= hb.x + hb.w && y >= hb.y && y <= hb.y + hb.h) { ACT[hb.act](); return; }
    }
    const p = toCamera(d.x, d.y);
    for (let i = 0; i < party.length; i++) {
      const h = party[i];
      if (!h.dead && Math.abs(p.x - h.sx) < h.s * 0.3 && p.y < h.sy + 10 && p.y > h.sy - h.s * 0.9 && !busy) { active = i; turn = 0; setTargets(); return; }
    }
    if (foe && Math.abs(p.x - foe.sx) < foe.s * 0.35 && p.y < foe.sy && p.y > foe.sy - foe.s) ACT.attack();
  });

  const ACT = {
    attack: () => heroAct("attack"), skill: () => heroAct("skill"), weak: () => heroAct("weak"),
    guard: heroGuard, item: heroItem, foe: foeAttack, special: foeSpecial, exorcise,
    down: () => { const h = party[active]; if (h) down(h, !h.dead); },
    entrance: replayEntrance,
    auto: () => { auto = !auto; autoWait = 0.2; document.getElementById("b-auto").classList.toggle("on", auto); }
  };
  const BUTTONS = [
    ["attack", "Attack", "A"], ["skill", "Skill", "S"], ["weak", "Weak hit", "W"],
    ["guard", "Guard", "G"], ["item", "Item", "H"], ["down", "Down", "D"],
    ["foe", "Foe attack", "F"], ["special", "Special", "X"], ["exorcise", "Exorcise", "K"],
    ["entrance", "Entrance", "E"], ["auto", "Auto", "␣"]
  ];
  const KEYS = { a: "attack", s: "skill", w: "weak", g: "guard", h: "item", d: "down", f: "foe", x: "special", k: "exorcise", e: "entrance", " ": "auto" };
  function buildActs() {
    const host = document.getElementById("acts");
    host.innerHTML = BUTTONS.map(b => '<button id="b-' + b[0] + '"' + (b[0] === "auto" ? ' class="main"' : "") + ">" + b[1] + "<kbd>" + b[2] + "</kbd></button>").join("");
    BUTTONS.forEach(b => document.getElementById("b-" + b[0]).addEventListener("click", () => ACT[b[0]]()));
  }
  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || e.metaKey || e.ctrlKey) return;
    const k = KEYS[e.key.toLowerCase()];
    if (k) { e.preventDefault(); ACT[k](); }
  });

  function buildPresets() {
    const sel = document.getElementById("preset");
    sel.innerHTML = '<option value="">—</option>' + PRESETS.map((p, i) => '<option value="' + i + '">' + p.name + "</option>").join("");
    sel.addEventListener("change", () => { if (sel.value !== "") applyPreset(+sel.value); });
    document.getElementById("copy").addEventListener("click", () => {
      const json = JSON.stringify(P, null, 2);
      const done = () => { const b = document.getElementById("copy"); b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy settings"; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(done, () => window.prompt("Settings", json));
      else window.prompt("Settings", json);
    });
    document.getElementById("reset").addEventListener("click", () => resetFight(true));
    const fromHash = () => {
      const m = /preset=([A-Ga-g])/.exec(location.hash);
      if (m) { const i = m[1].toUpperCase().charCodeAt(0) - 65; sel.value = i; applyPreset(i); }
    };
    window.addEventListener("hashchange", fromHash);
    fromHash();
  }

  /* --- boot --------------------------------------------------------------- */
  preload();
  if (FOES[P.foe] == null) P.foe = "hanako";
  P.band = bandOf(P.foe);
  buildPanel();
  buildActs();
  resetFight(true);
  buildPresets();
  fit();
  window.addEventListener("resize", fit);
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  })(last);
})();
</script>
</body>
</html>
