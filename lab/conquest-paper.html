<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — conquest paper map</title>
<meta name="lab-group" content="css">
<style>
/* ===========================================================================
   CONQUEST PAPER MAP — the world of prototype/conquest-ticks.html built as a
   cut-paper diorama, the direction the marketing round picked (layered
   paper, origami pieces), and the CAMERA that shows it.

   The map is baked once into a flat texture, as if photographed from straight
   above: every land sheet sits on the one under it and shows its thickness
   on its near edge and its shadow beyond it, the sea is three sheets cut
   along waves, the beaches are a cream sheet under the land, and every sheet
   is a mosaic of torn shards a shade apart. The camp orders are folded paper
   strips laid on it.

   The OCEAN fills the screen whatever the camera does: the texture is baked
   with a margin around the frame, and past it a tile of deep sea repeats
   forever. The tile and the texture's open sea come out of the same
   functions — wave strips and shards made periodic over the tile — so the
   two meet without a seam. The sea's colour is its own choice, because a
   blue ocean under a blue camp reads as one sheet: the colourways move it
   away from the camp's hue (teal, lagoon) or its value (night navy).

   The camera projects that ground onto a tilted plane, one screen row at a
   time (a flat plane under perspective is a scale per row), and stands the
   pieces upright on it, sorted far to near and scaled by depth. The pieces
   are the three asset sheets of the prompts, cut into lab/conquest-paper/
   (temporary material); a piece whose file is missing falls back to a
   code-drawn placeholder.

   Views: One (the camera of the panel), Compare (the presets side by side).
   Drag the frame to pan. Nothing here ships.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  min-height:100vh;
  display:flex;
  background:#0b0b12;
  color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

#panel {
  flex:0 0 290px;
  height:100vh; overflow:auto;
  padding:22px 18px;
  background:#12121c;
  border-right:1px solid #23233a;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel h2 { margin:18px 0 8px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#8b8ba7; }
#panel p.hint { margin:8px 0 16px; font-weight:500; font-size:12px; color:#8b8ba7; }
.seg { display:flex; gap:6px; flex-wrap:wrap; }
.seg button {
  flex:1 1 40%; padding:7px 10px;
  background:#1b1b2a; color:#e8e6f5; border:1px solid #2c2c47; border-radius:8px;
  font:inherit; cursor:pointer;
}
.seg button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
.seg button .sw { display:inline-flex; vertical-align:middle; margin-right:6px; border-radius:4px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.2); }
.seg button .sw i { display:block; width:8px; height:16px; }
.row { margin-bottom:12px; }
.row label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:4px; accent-color:#7ea6ff; }
.tog { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:#c9c9e0; cursor:pointer; }
.tog input { accent-color:#7ea6ff; }

#stage {
  flex:1; height:100vh; overflow:auto;
  padding:24px;
  display:flex; align-items:center; justify-content:center; gap:16px;
  background-image:
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%),
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%);
  background-size:32px 32px;
  background-position:0 0, 16px 16px;
}
#stage .busy { color:#8b8ba7; font-size:15px; }
.fr { display:flex; flex-direction:column; gap:8px; height:calc(100vh - 48px); }
.fr canvas { display:block; height:calc(100% - 30px); width:auto; border-radius:14px; box-shadow:0 18px 50px rgba(0,0,0,.5); cursor:grab; }
.fr figcaption { font-size:12px; color:#9c9cba; font-weight:500; }
.fr figcaption b { color:#e8e6f5; font-size:13px; }
#stage.compare .fr { height:auto; width:calc((100% - 64px) / 5); cursor:pointer; }
#stage.compare .fr canvas { width:100%; height:auto; }
</style>
</head>
<body>

<div id="panel">
  <h1>Conquest paper</h1>
  <p class="hint">A cut-paper world under a camera you can tilt, the ocean to the edges, origami pieces standing on it.</p>

  <div class="seg" id="views">
    <button data-v="one">One</button>
    <button data-v="compare">Compare</button>
  </div>

  <h2>Camera</h2>
  <div class="seg" id="presets"></div>
  <div style="height:12px"></div>
  <div class="row"><label for="pitch">tilt <b id="pitch-v"></b></label><input id="pitch" type="range" min="0" max="68" step="1"></div>
  <div class="row"><label for="persp">perspective <b id="persp-v"></b></label><input id="persp" type="range" min="0" max="100" step="1"></div>
  <div class="row"><label for="zoom">zoom <b id="zoom-v"></b></label><input id="zoom" type="range" min="70" max="260" step="1"></div>
  <div class="row"><label for="panY">frame height <b id="panY-v"></b></label><input id="panY" type="range" min="-700" max="700" step="5"></div>
  <div class="row"><label for="piece">piece size <b id="piece-v"></b></label><input id="piece" type="range" min="50" max="200" step="5"></div>

  <h2>Ocean</h2>
  <div class="seg" id="seas"></div>

  <h2>Show</h2>
  <label class="tog"><input type="checkbox" id="t-pieces" checked> Pieces</label>
  <label class="tog"><input type="checkbox" id="t-sprites" checked> Paper assets (the sheets)</label>
  <label class="tog"><input type="checkbox" id="t-arrows" checked> Paper arrows</label>
  <label class="tog"><input type="checkbox" id="t-anim" checked> Animate the crane</label>
</div>

<div id="stage"></div>

<script>
(function () {
  "use strict";

  const W = 720, H = 1280, TR = 1.5;           // design frame, texture resolution
  const X0 = -160, Y0 = -300, DW = 1040, DH = 1700;   // the baked ground: the frame plus a margin of open sea
  const T = 416;                                // the deep-sea tile, every periodic pattern divides it
  const MCX = 360, MCY = 690;                   // the map's centre, what the camera turns around

  /* ==========================================================================
     THE WORLD — the scene of the other conquest pages.
     ========================================================================== */
  const BLOBS = [
    [150, 260, 115], [305, 225, 125], [470, 245, 120], [610, 310, 105], [225, 400, 115], [420, 405, 120],
    [580, 455, 95], [300, 525, 85], [60, 520, 30],
    [110, 665, 62], [265, 690, 60], [430, 640, 72], [605, 705, 72], [515, 755, 40],
    [180, 905, 105], [370, 880, 115], [565, 920, 105], [255, 1045, 110], [445, 1060, 112], [610, 1065, 72],
    [350, 1185, 82], [175, 1160, 58],
    [675, 560, 32], [650, 1210, 30], [70, 800, 24]
  ];
  const REG = [
    [150, 255, "r", null], [310, 225, "r", "cap"], [470, 245, "r", null], [610, 315, "r", "city"],
    [215, 405, "r", null], [420, 400, "r", "fort"], [580, 455, "r", "iron"], [290, 530, "r", null],
    [110, 665, "n", "grain"], [265, 690, "n", "city"], [430, 645, "n", "glass"], [605, 705, "n", "gold"],
    [180, 905, "b", null], [370, 885, "b", "fort"], [565, 920, "b", "city"], [255, 1050, "n", "grain"],
    [445, 1065, "b", "cap"], [610, 1065, "b", null], [350, 1185, "b", null], [675, 560, "n", "oil"]
  ].map(function (r, i) { return { i: i, x: r[0], y: r[1], o: r[2] === "b" ? 1 : r[2] === "r" ? 2 : 0, mk: r[3] }; });

  const UNITS = [
    { r: 0, k: "inf", n: 3 }, { r: 1, k: "art", n: 2 }, { r: 2, k: "inf", n: 2 }, { r: 3, k: "inf", n: 2 },
    { r: 4, k: "inf", n: 4 }, { r: 5, k: "inf", n: 6 }, { r: 6, k: "cav", n: 5 }, { r: 7, k: "inf", n: 3 },
    { r: 12, k: "inf", n: 5 }, { r: 13, k: "inf", n: 6, gen: true }, { r: 14, k: "cav", n: 4 }, { r: 16, k: "art", n: 3 },
    { r: 17, k: "inf", n: 2 }, { r: 18, k: "inf", n: 1 }
  ];
  // What the camps hold beyond their garrisons: camps, watchtowers, a supply wagon, ships, balloons, the courier.
  const EXTRAS = [
    [228, 968, "tent", 1], [160, 330, "tent", 2],
    [298, 822, "watchtower", 1], [520, 520, "watchtower", 2],
    [420, 968, "wagon", 1],
    [55, 1000, "warship", 1], [672, 850, "warship", 2], [630, 618, "rowboat", 2],
    [520, 800, "balloon", 1, { h: 80 }], [240, 470, "balloon", 2, { h: 90 }],
    [0, 0, "crane", 0, { fly: true }]
  ];
  const ORDERS = [
    { a: 13, b: 10, o: 1, bend: -0.12 }, { a: 14, b: 11, o: 1, bend: 0.15 },
    { a: 5, b: 10, o: 2, bend: 0.12 }, { a: 4, b: 8, o: 2, bend: 0.2 }
  ];

  const CAMP = {
    0: { base: "#b9a77d", light: "#d8c79c", dark: "#8a7a55" },
    1: { base: "#2f63c4", light: "#5b8fe0", dark: "#1d3f8a" },
    2: { base: "#d9412f", light: "#ee6a4a", dark: "#a52a1f" }
  };

  // The ocean's colourways: deep, mid, shallow sheets. "Blue" is the one that sank into the blue camp.
  const SEAS = [
    { key: "teal", name: "Teal", c: ["#156c7a", "#1f8a96", "#38a6ad"] },
    { key: "lagoon", name: "Lagoon", c: ["#11705f", "#1b8d78", "#36aa90"] },
    { key: "navy", name: "Night navy", c: ["#14284a", "#1e3a64", "#2b5184"] },
    { key: "aqua", name: "Aqua", c: ["#2a97a8", "#49b1bf", "#78cad2"] },
    { key: "blue", name: "Blue (before)", c: ["#2b62ad", "#3c7cc6", "#5b98d6"] }
  ];

  /* ==========================================================================
     NOISE & FIELDS
     ========================================================================== */
  const VAL = new Float32Array(256), PERM = new Uint8Array(512);
  (function () {
    let s = 1234567;
    const r = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < 256; i++) { VAL[i] = r(); PERM[i] = i; }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)), t = PERM[i]; PERM[i] = PERM[j]; PERM[j] = t; }
    for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
  })();
  function vn(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = VAL[PERM[PERM[X] + Y]], b = VAL[PERM[PERM[X + 1] + Y]], c = VAL[PERM[PERM[X] + Y + 1]], d = VAL[PERM[PERM[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct) {
    let s = 0, amp = 0.5, tot = 0;
    for (let o = 0; o < oct; o++) { s += vn(x, y) * amp; tot += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
    return s / tot;
  }
  const hash2 = function (a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const mod = function (a, n) { return ((a % n) + n) % n; };

  function edt1d(f, n, d, v, z) {
    let k = 0;
    v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  }
  function edt(mask, w, h, target) {
    const g = new Float32Array(w * h), n = Math.max(w, h);
    const f = new Float32Array(n), d = new Float32Array(n), v = new Int32Array(n), z = new Float32Array(n + 1);
    for (let i = 0; i < w * h; i++) g[i] = mask[i] === target ? 0 : 1e20;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      edt1d(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      edt1d(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = d[x];
    }
    return g;
  }

  // sdf (coast), e (region border), own, ht (height noise), g (grain) — over the baked ground at TR.
  function fields() {
    const w = DW * TR, h = DH * TR, N = w * h, n = REG.length;
    const land = new Uint8Array(N), own = new Uint8Array(N);
    const e = new Float32Array(N), ht = new Float32Array(N), gr = new Float32Array(N);
    const DD = REG.map(function (a) { return REG.map(function (b) { return Math.hypot(a.x - b.x, a.y - b.y) || 1; }); });
    for (let py = 0; py < h; py++) {
      const y = Y0 + (py + 0.5) / TR;
      for (let px = 0; px < w; px++) {
        const x = X0 + (px + 0.5) / TR, i = py * w + px;
        const wx = x + (fbm(x * 0.006 + 3.1, y * 0.006 + 7.7, 2) - 0.5) * 80;
        const wy = y + (fbm(x * 0.006 + 11.3, y * 0.006 + 1.9, 2) - 0.5) * 80;
        let m = -9;
        for (let k = 0; k < BLOBS.length; k++) {
          const b = BLOBS[k], dx = wx - b[0], dy = wy - b[1], v = 1 - Math.sqrt(dx * dx + dy * dy) / b[2];
          if (v > m) m = v;
        }
        land[i] = m + (fbm(x * 0.022, y * 0.022, 3) - 0.5) * 0.45 > 0 ? 1 : 0;
        if (m < -0.6) { own[i] = 0; e[i] = 99; continue; }   // open sea: no region to read
        const rx = x + (wx - x) * 0.55, ry = y + (wy - y) * 0.55;
        let b1 = 0, d1 = 1e12, b2 = 0, d2 = 1e12;
        for (let k = 0; k < n; k++) {
          const dx = rx - REG[k].x, dy = ry - REG[k].y, dd = dx * dx + dy * dy;
          if (dd < d1) { d2 = d1; b2 = b1; d1 = dd; b1 = k; } else if (dd < d2) { d2 = dd; b2 = k; }
        }
        own[i] = REG[b1].o;
        e[i] = (d2 - d1) / (2 * DD[b1][b2]);
        ht[i] = fbm(x * 0.011, y * 0.011, 4);
        gr[i] = vn(x * 0.31, y * 0.31) * 0.55 + vn(x * 1.1 + 50, y * 1.1) * 0.45;
      }
    }
    const toSea = edt(land, w, h, 0), toLand = edt(land, w, h, 1), sdf = new Float32Array(N);
    for (let i = 0; i < N; i++) sdf[i] = land[i] ? (Math.sqrt(toSea[i]) - 0.5) / TR : -(Math.sqrt(toLand[i]) - 0.5) / TR;
    return { w: w, h: h, sdf: sdf, e: e, own: own, ht: ht, g: gr };
  }

  /* ==========================================================================
     THE PAPER — every pixel knows which sheet it is on (KIND: 1 sea, 2 beach,
     3 land) and how high that sheet sits (LEVEL); thickness, shadow and lit
     edges are read off the levels of its neighbours. The sea's patterns are
     periodic over T, so the open sea of the texture IS the tile.
     ========================================================================== */
  const hx = function (h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
  const CREAM = hx("#f6ecd2"), BEACH = hx("#f2e0b0");
  const LAND = {
    0: [hx("#e9d79e"), hx("#b9d27a"), hx("#94c060")],
    1: [hx("#3d7cd4"), hx("#5d98e0"), hx("#82b4ee")],
    2: [hx("#e2533c"), hx("#ec6f46"), hx("#f28c55")]
  };

  // The cut wave strips of the open sea: periodic over T in x and in y.
  function stripAt(x, y) {
    const yy = (y + 12 * Math.sin(x * Math.PI * 2 * 3 / T)) / 52, b = Math.floor(yy);
    return yy - b < 0.13 && mod(x + b * 104, T) < 240;
  }
  function seaLevel(x, y, s) {
    const d = -s + 6 * Math.sin(x * 0.045 + y * 0.012) + 4 * Math.sin(x * 0.11 - y * 0.031);
    if (d < 18) return 3;
    if (d < 52) return 2;
    return stripAt(x, y) ? 2 : 1;
  }

  // A mosaic of shards; n cells across makes it periodic (n * size = T for the sea).
  let SH_ID = 0, SH_EDGE = 0;
  function shard(x, y, size, n) {
    const cx = Math.floor(x / size), cy = Math.floor(y / size);
    let d1 = 1e9, d2 = 1e9, id = 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const gx = cx + dx, gy = cy + dy, mx = mod(gx, n), my = mod(gy, n);
        const px = (gx + hash2(mx, my)) * size, py = (gy + hash2(my * 1.7 + 3, mx * 3.1)) * size;
        const d = (x - px) * (x - px) + (y - py) * (y - py);
        if (d < d1) { d2 = d1; d1 = d; id = mx * 7919 + my * 104729; } else if (d < d2) d2 = d;
      }
    }
    SH_ID = id; SH_EDGE = Math.sqrt(d2) - Math.sqrt(d1);
  }
  function tone(c, size, n, x, y) {
    shard(x, y, size, n);
    const t = 0.93 + 0.12 * hash2(SH_ID, 1.3);
    c[0] *= t * (1 + (hash2(SH_ID, 7.1) - 0.5) * 0.05); c[1] *= t; c[2] *= t * (1 + (hash2(SH_ID, 2.9) - 0.5) * 0.05);
    if (SH_EDGE < 0.9) { c[0] *= 0.95; c[1] *= 0.95; c[2] *= 0.95; }
  }
  // One pixel of paper: the near edge of a higher sheet, or this sheet shaded by its neighbours.
  function paper(x, y, c, lvAt, topOf) {
    const L = lvAt(x, y);
    if (lvAt(x, y - 5) > L) {
      topOf(x, y - 5, c);
      c[0] = c[0] * 0.66 + CREAM[0] * 0.14; c[1] = c[1] * 0.66 + CREAM[1] * 0.14; c[2] = c[2] * 0.66 + CREAM[2] * 0.14;
      return false;
    }
    topOf(x, y, c);
    if (lvAt(x - 4, y - 10) > L) { c[0] *= 0.76; c[1] *= 0.76; c[2] *= 0.8; }
    else if (lvAt(x - 2, y - 5) > L) { c[0] *= 0.87; c[1] *= 0.87; c[2] *= 0.9; }
    else if (lvAt(x - 1.5, y - 2.5) < L) { c[0] += (255 - c[0]) * 0.16; c[1] += (255 - c[1]) * 0.16; c[2] += (255 - c[2]) * 0.16; }
    return true;
  }

  // Levels of the baked ground, computed once (they do not depend on colours).
  let BASE = null;
  function buildBase() {
    const F = fields(), w = F.w, h = F.h, N = w * h, KD = new Uint8Array(N), LV = new Uint8Array(N);
    for (let py = 0; py < h; py++) {
      const y = Y0 + (py + 0.5) / TR;
      for (let px = 0; px < w; px++) {
        const x = X0 + (px + 0.5) / TR, i = py * w + px, s = F.sdf[i];
        if (s > 0) {
          const hv = s / 22 + (F.ht[i] - 0.45) * 2.4;
          KD[i] = 3; LV[i] = hv < 1 ? 5 : hv < 2.3 ? 6 : 7;
        } else if (s > -7 + 3 * Math.sin(x * 0.08 + y * 0.05)) { KD[i] = 2; LV[i] = 4; }
        else { KD[i] = 1; LV[i] = seaLevel(x, y, s); }
      }
    }
    return { F: F, KD: KD, LV: LV };
  }

  const SHADED = {};
  function shaded(sea) {
    if (SHADED[sea.key]) return SHADED[sea.key];
    const SEA = [null, hx(sea.c[0]), hx(sea.c[1]), hx(sea.c[2])], F = BASE.F, KD = BASE.KD, LV = BASE.LV, w = F.w, h = F.h;
    const seaTop = function (L, x, y, c) { const a = SEA[L]; c[0] = a[0]; c[1] = a[1]; c[2] = a[2]; tone(c, 26, T / 26, x, y); };

    // The tile: open sea only.
    const tile = document.createElement("canvas"), TP = T * TR;
    tile.width = tile.height = TP;
    {
      const ctx = tile.getContext("2d"), img = ctx.createImageData(TP, TP), d = img.data, c = [0, 0, 0];
      const lv = function (x, y) { return stripAt(x, y) ? 2 : 1; };
      const top = function (x, y, cc) { seaTop(lv(x, y), x, y, cc); };
      for (let py = 0; py < TP; py++) {
        const y = (py + 0.5) / TR;
        for (let px = 0; px < TP; px++) {
          const x = (px + 0.5) / TR, o = (py * TP + px) * 4;
          paper(x, y, c, lv, top);
          d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // The ground: land, beaches and the sea around them.
    const idx = function (x, y) {
      let px = ((x - X0) * TR) | 0, py = ((y - Y0) * TR) | 0;

    { key: "board", name: "Board 30°", cam: { pitch: 30, persp: 35, zoom: 108, panY: 40, piece: 105 } },
    { key: "poster", name: "Poster 52°", cam: { pitch: 52, persp: 70, zoom: 100, panY: 140, piece: 120 } },
    { key: "iso", name: "Iso 45°", cam: { pitch: 45, persp: 0, zoom: 98, panY: 150, piece: 110 } }
  ];

  function draw(f, t) {
    const ctx = f.ctx, R = f.R, cam = f.cam, G = f.tex;
    const th = cam.pitch * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
    const D = cam.persp <= 0 ? 1e7 : 6000 + (900 - 6000) * (cam.persp / 100);
    const zf = cam.zoom / 100, fz = D * zf, cxS = 360 + (f.panX || 0), cyS = 640 + cam.panY;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = G.haze; ctx.fillRect(0, 0, f.cv.width, f.cv.height);
    const ground = G.ground, tile = G.tile, gw = ground.width, tw = tile.width;
    for (let py = 0; py < f.cv.height; py++) {
      const sy = (py + 0.5) / R, k = (sy - cyS) / fz, den = c + k * s;
      if (den <= 0.02) continue;
      const Y = k * D / den, depth = D - Y * s;
      if (depth <= 1) continue;
      const sc = fz / depth, v = Y + MCY;
      // Far rows dissolve into the haze: past this scale a row would be thousands of tiles wide.
      if (sc < 0.08) continue;
      const uL = MCX - cxS / sc, uR = MCX + (W - cxS) / sc, row = Math.floor(mod(v, T) * TR);
      for (let u = Math.floor(uL / T) * T; u < uR; u += T) {
        ctx.drawImage(tile, 0, row, tw, 1, (cxS + sc * (u - MCX)) * R - 0.5, py, T * sc * R + 1, 1.6);
      }
      if (v >= Y0 && v < Y0 + DH) {
        ctx.drawImage(ground, 0, Math.floor((v - Y0) * TR), gw, 1, (cxS + sc * (X0 - MCX)) * R, py, DW * sc * R, 1.6);
      }
      if (sc < 0.45) {
        ctx.globalAlpha = Math.min(1, (0.45 - sc) / 0.37); ctx.fillStyle = G.haze;
        ctx.fillRect(0, py, f.cv.width, 1.6); ctx.globalAlpha = 1;
      }
    }
    if (!f.pieces) return;
    const proj = function (u, v, h) {
      const X = u - MCX, Y = v - MCY, depth = D - Y * s - h * c, sc = fz / depth;
      return { x: cxS + X * sc, y: cyS + (Y * c - h * s) * sc, sc: sc, depth: depth };
    };
    const list = [];
    PIECES.forEach(function (p) {
      let u = p.u, v = p.v, h = p.h || 0;
      if (p.fly) { u = 470 + Math.cos(t * 0.35) * 150; v = 575 + Math.sin(t * 0.35) * 45; h = 95 + Math.sin(t * 1.3) * 6; }
      else if (h) h += Math.sin(t * 0.8 + u) * 4;
      const g = proj(u, v, 0), q = h ? proj(u, v, h) : g;
      if (g.depth > 1) list.push({ p: p, g: g, q: q, h: h });
    });
    list.sort(function (a, b) { return b.q.depth - a.q.depth; });
    ctx.setTransform(R, 0, 0, R, 0, 0);
    list.forEach(function (it) {
      const p = it.p, k = it.g.sc * (cam.piece / 100) * (p.s || 1);
      const key = f.sprites ? spriteKey(p, t) : null, im = key && IMG[key], m = key && META[key];
      let w = 0, hgt = 0;
      if (im && im.complete && im.naturalWidth) {
        if (p.t === "crane") { w = 50 * k; hgt = w * m[1] / m[0]; } else { hgt = TALL[p.t] * k; w = hgt * m[0] / m[1]; }
      }
      // The contact shadow lies on the paper, flattened by the tilt; a flying piece's is fainter.
      const rx = w ? w * 0.34 : 12 * k;
      ctx.beginPath(); ctx.ellipse(it.g.x + 3 * k, it.g.y + 1 * k, rx, rx * Math.max(0.32, 0.25 + 0.75 * c * c * 0.6), 0, 0, Math.PI * 2);
      ctx.fillStyle = it.h ? "rgba(10,25,40,.14)" : "rgba(10,25,40,.28)"; ctx.fill();
      if (w) {
        if (p.t === "crane") ctx.drawImage(im, it.q.x - w / 2, it.q.y - hgt / 2, w, hgt);
        else ctx.drawImage(im, it.q.x - m[2] * w, it.q.y - hgt, w, hgt);
        return;
      }
      ctx.save(); ctx.translate(it.q.x, it.q.y); ctx.scale(k, k);
      DRAW[FALLBACK[p.t]](ctx, CAMP[p.o], t, p.t === "capital");
      ctx.restore();
    });
  }

  /* ==========================================================================
     PAGE
     ========================================================================== */
  const state = { view: "one", preset: "close", sea: "teal", cam: Object.assign({}, PRESETS[0].cam), panX: 0,
    pieces: true, sprites: true, arrows: true, anim: true };
  try {
    const hsh = new URLSearchParams(location.hash.slice(1));
    if (hsh.get("view")) state.view = hsh.get("view");
    if (SEAS.some(function (q) { return q.key === hsh.get("sea"); })) state.sea = hsh.get("sea");
    const pr = PRESETS.find(function (p) { return p.key === hsh.get("preset"); });
    if (pr) { state.preset = pr.key; state.cam = Object.assign({}, pr.cam); }
  } catch (err) { /* a bad hash keeps the defaults */ }

  const stage = document.getElementById("stage"), presets = document.getElementById("presets"), seas = document.getElementById("seas");
  const KNOBS = [["pitch", function (v) { return v + "°"; }], ["persp", function (v) { return v ? v + "%" : "ortho"; }],
    ["zoom", function (v) { return (v / 100).toFixed(2); }], ["panY", function (v) { return Math.round(v); }], ["piece", function (v) { return (v / 100).toFixed(2); }]];
  PRESETS.forEach(function (p) {
    const b = document.createElement("button");
    b.textContent = p.name; b.dataset.k = p.key;
    b.addEventListener("click", function () { state.preset = p.key; state.cam = Object.assign({}, p.cam); state.panX = 0; render(); });
    presets.appendChild(b);
  });
  SEAS.forEach(function (q) {
    const b = document.createElement("button");
    b.dataset.k = q.key;
    b.innerHTML = '<span class="sw">' + q.c.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + "</span>" + q.name;
    b.addEventListener("click", function () { state.sea = q.key; render(); });
    seas.appendChild(b);
  });
  KNOBS.forEach(function (kn) {
    const el = document.getElementById(kn[0]);
    el.addEventListener("input", function () { state.cam[kn[0]] = +el.value; state.preset = ""; syncKnobs(); redraw(); });
  });
  function syncKnobs() {
    KNOBS.forEach(function (kn) {
      document.getElementById(kn[0]).value = state.cam[kn[0]];
      document.getElementById(kn[0] + "-v").textContent = kn[1](state.cam[kn[0]]);
    });
    presets.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.k === state.preset); });
    seas.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.k === state.sea); });
  }
  document.querySelectorAll("#views button").forEach(function (b) { b.addEventListener("click", function () { state.view = b.dataset.v; render(); }); });
  ["pieces", "sprites", "arrows", "anim"].forEach(function (k) {
    const el = document.getElementById("t-" + k);
    el.checked = state[k];
    el.addEventListener("change", function () { state[k] = el.checked; render(); });
  });

  let frames = [], t0 = performance.now(), tFrozen = 0;
  function render() {
    location.replace("#view=" + state.view + "&preset=" + (state.preset || "custom") + "&sea=" + state.sea);
    document.querySelectorAll("#views button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === state.view); });
    syncKnobs();
    const sea = SEAS.find(function (q) { return q.key === state.sea; });
    if (!BASE || !TEX[sea.key + (state.arrows ? "+a" : "")]) {
      stage.className = "";
      stage.innerHTML = '<div class="busy">' + (BASE ? "Dyeing the sea…" : "Cutting the paper… (a few seconds)") + "</div>";
      frames = [];
      setTimeout(function () {
        if (!BASE) { BASE = buildBase(); placeScenery(BASE.F); }
        texture(sea, state.arrows);
        render();
      }, 30);
      return;
    }
    const G = texture(sea, state.arrows);
    stage.className = state.view;
    stage.innerHTML = "";
    const list = state.view === "one" ? [{ name: "Camera", cam: state.cam, live: true }] : PRESETS.map(function (p) { return { name: p.name, cam: p.cam, key: p.key }; });
    const R = state.view === "one" ? 1.5 : 0.75;
    frames = list.map(function (it) {
      const fig = document.createElement("figure"), cv = document.createElement("canvas"), cap = document.createElement("figcaption");
      fig.className = "fr"; cv.width = W * R; cv.height = H * R;
      cap.innerHTML = "<b>" + it.name + "</b> · tilt " + it.cam.pitch + "°, " + (it.cam.persp ? "perspective " + it.cam.persp + "%" : "orthographic") + ", zoom " + (it.cam.zoom / 100).toFixed(2);
      fig.appendChild(cv); fig.appendChild(cap); stage.appendChild(fig);
      const f = { cv: cv, ctx: cv.getContext("2d"), R: R, cam: it.cam, tex: G, pieces: state.pieces, sprites: state.sprites, panX: it.live ? state.panX : 0 };
      if (it.live) dragPan(cv, f);
      else fig.addEventListener("click", function () {
        const p = PRESETS.find(function (q) { return q.key === it.key; });
        state.preset = p.key; state.cam = Object.assign({}, p.cam); state.panX = 0; state.view = "one"; render();
      });
      return f;
    });
    redraw();
  }
  function dragPan(cv, f) {
    let last = null;
    cv.addEventListener("pointerdown", function (e) { last = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing"; });
    cv.addEventListener("pointermove", function (e) {
      if (!last) return;
      const k = W / cv.getBoundingClientRect().width;
      f.panX += (e.clientX - last[0]) * k; state.panX = f.panX;
      state.cam.panY = Math.round(state.cam.panY + (e.clientY - last[1]) * k);
      last = [e.clientX, e.clientY]; state.preset = ""; syncKnobs(); redraw();
    });
    cv.addEventListener("pointerup", function () { last = null; cv.style.cursor = ""; });
  }
  function redraw() {
    const t = state.anim ? (performance.now() - t0) / 1000 : tFrozen;
    if (state.anim) tFrozen = t;
    frames.forEach(function (f) { draw(f, t); });
  }
  (function loop() { if (state.anim && frames.length) redraw(); requestAnimationFrame(loop); })();
  render();
})();
</script>
</body>
</html>
