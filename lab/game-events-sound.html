  if (!on) return;
  picker.idx = picker.order.indexOf(picker.value);
  drawPicker();
  const cur = list.querySelector(".gp-row.on");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

function pickGame(slug) {
  pickOpen(false);
  if (slug === picker.value) return;
  picker.value = slug;
  drawPicker();
  load(slug);
}

(function wirePicker() {
  const box = el("game-pick"), btn = box.querySelector(".gp-btn"), list = box.querySelector(".gp-list");
  btn.onclick = () => pickOpen(list.hidden);
  box.addEventListener("keydown", (e) => {
    if (list.hidden) {
      if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") { e.preventDefault(); pickOpen(true); }
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); pickOpen(false); btn.focus(); return; }
    if (e.key === "Enter") { e.preventDefault(); if (picker.order[picker.idx]) pickGame(picker.order[picker.idx]); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    picker.idx = Math.max(0, Math.min(picker.order.length - 1, picker.idx + (e.key === "ArrowDown" ? 1 : -1)));
    drawPicker();
    const on = list.querySelector(".gp-row.on");
    if (on) on.scrollIntoView({ block: "nearest" });
  });
  // A click anywhere else, or the window losing focus (a click in a game frame), closes it.
  document.addEventListener("mousedown", (e) => { if (!box.contains(e.target)) pickOpen(false); });
  window.addEventListener("blur", () => pickOpen(false));
})();

function fit() {
  const stage = el("stage"), bar = el("bar"), gap = 12, label = 22;
  // The apply report takes its room out of the frames, never off the bottom of
  // the window: what it costs in height the frames give back.
  const h = stage.clientHeight - bar.offsetHeight - el("hint").offsetHeight - el("report").offsetHeight -
            el("replay").offsetHeight - label - 75;
  // One frame in the height the stage gets, never wider than a third of the window.
  const k = Math.max(0.12, Math.min(h / 1280, (window.innerWidth * 0.34 - 28) / 720));
  // REC: ONE frame, as big as the stage allows — it is played, not glanced at.
  const kr = Math.max(0.2, Math.min((h + label + gap) / 1280, (window.innerWidth * 0.45 - 28) / 720));
  if (document.body.classList.contains("rec")) {
    const f = document.querySelector(".fit.rec");
    f.style.transform = "scale(" + kr + ")";
    f.style.width = (720 * kr) + "px"; f.style.height = (1280 * kr) + "px";
    f.parentNode.style.width = (720 * kr) + "px";
    stage.style.flexBasis = (720 * kr + 28) + "px";
    return;
  }
  document.querySelectorAll(".fit:not(.rec)").forEach((f) => {
    f.style.transform = "scale(" + k + ")";
    f.style.width = (720 * k) + "px";
    f.style.height = (1280 * k) + "px";
    f.parentNode.style.width = (720 * k) + "px";
  });
  stage.style.flexBasis = (document.body.classList.contains("looping") ? Math.max(300, 720 * k + 28) : 300) + "px";
}

function load(slug) {
  if (slug !== state.slug) { state.pending = EMPTY_PENDING(); loopStop(); }
  state.slug = slug;
  loadClips();
  if (REC.on) recLoad();
  localStorage.setItem("events:game", slug);
  LANGS.forEach((lang) => { frames[lang].src = "build/" + slug + "/index.html?first=0&lang=" + lang; });
  fetch("api/events?game=" + encodeURIComponent(slug))
    .then((r) => r.json())
    .then((d) => { state.data = d; state.status[slug] = d.status; drawPicker(); el("sub").textContent = d.title + (d.version ? " v" + d.version : "") + " — " + d.where; render(); });
}

/* ===========================================================================
   The clips: lab/events-clips/<slug>/ (tools/lab/serve-events.mjs).

   A row's clip is the one recorded for its checkId. A call edited since has a
   new checkId; it borrows the clip of the nearest event of the same call name
   in the same function that no live call claims, and says so (amber ↻).
   =========================================================================== */
function loadClips() {
  const slug = state.slug;
  state.offset = null;
  fetch("api/clips?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((idx) => {
    if (slug !== state.slug) return;
    state.clips = idx && idx.clips ? idx : { clips: {}, byId: {} };
    paintClips();
  });
  loadOffset();
}

/* Asked again every time the played frame loads, not only when the game is
   picked: an offset that failed then (a build half-way through) would leave
   REC catching nothing for the whole session, and saying nothing about it. */
function loadOffset() {
  const slug = state.slug;
  fetch("api/offset?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((o) => {
    if (slug !== state.slug) return;
    state.offset = o && o.offset != null ? o.offset : null;
    if (REC.on && state.offset == null) note("rec: " + ((o && o.error) || "no offset for " + slug) + " — nothing can be caught");
  }).catch((e) => { if (REC.on) note("rec: api/offset failed — " + e.message); });
}

function nearEvent(call) {
  const idx = state.clips, live = new Set(state.data ? state.data.calls.map((c) => c.checkId) : []);
  let best = null;
  for (const [file, clip] of Object.entries(idx.clips || {})) {
    for (const e of clip.events || []) {
      if (e.name !== call.name || e.fn !== (call.fn || "") || live.has(e.id)) continue;
      const d = Math.abs(e.line - call.line);
      if (!best || d < best.d) best = { file, clip, e, d };
    }
  }
  return best;
}

function clipFor(call) {
  if (!call || call.inherited || !call.checkId) return null;
  const idx = state.clips, f = idx.byId && idx.byId[call.checkId];
  if (f && idx.clips[f]) return { file: f, clip: idx.clips[f], near: false };
  const n = nearEvent(call);
  return n ? { file: n.file, clip: n.clip, near: true } : null;
}

// A recorded event → the call the source has now (the same id, or the near one).
function callOf(e) {
  const calls = state.data ? state.data.calls : [];
  const hit = calls.find((c) => c.checkId === e.id);
  if (hit) return hit;
  const ids = new Set(calls.map((c) => c.checkId));
  let best = null;
  for (const c of calls) {
    if (c.name !== e.name || (c.fn || "") !== e.fn || c.inherited) continue;
    // A call that has a clip of its own is not the one this event was.
    if (state.clips.byId[c.checkId] && ids.has(c.checkId)) continue;
    const d = Math.abs(c.line - e.line);
    if (!best || d < best.d) best = { c, d };
  }
  return best ? best.c : null;
}

function paintClips() {
  document.querySelectorAll(".call").forEach((row) => {
    const b = row.querySelector(".loop"), c = row._call;
    if (!b || !c) return;
    if (c.inherited) { b.disabled = true; b.title = "a motor line — the recorder catches the game's own calls only"; return; }
    const hit = clipFor(c);
    b.classList.toggle("has", !!hit);
    b.classList.toggle("near", !!(hit && hit.near));
    b.classList.toggle("on", LOOP.id === c.checkId);
    b.title = !hit ? "not seen in play yet — Rec, and play until it fires"
      : LOOP.id === c.checkId ? "stop the loop"
      : "loop the moment of the game it fires on (" + hit.clip.dur.toFixed(1) + " s, recorded " + hit.clip.when.replace("T", " ") + ")" +
        (hit.near ? " — recorded before this call was edited" : "");
  });
  const pill = el("stats").querySelector(".seen-pill");
  if (pill && state.data) {
    const pool = state.data.calls.filter((c) => c.checkId && !c.inherited && c.kind === "sound");
    const seen = pool.filter((c) => clipFor(c)).length;
    pill.innerHTML = `<b>${seen}</b> / ${pool.length} seen in play`;
    pill.title = "cues with a recorded moment — Rec and play to capture the rest";
  }
}

/* ===========================================================================
   The LOOP: the clip under the frame, the moment fired over it.
   =========================================================================== */
const LOOP = { id: null, call: null, clip: null, file: null, near: false, url: null, events: [], muted: {}, raf: 0, prev: -1 };
const clipVideos = () => [...document.querySelectorAll("video.clip")];

function setClear(on) {
  LANGS.forEach((lang) => {
    try { frames[lang].contentDocument.documentElement.classList.toggle("lab-clear", on); } catch (e) {}
  });
}

function loopToggle(call) {
  if (LOOP.id && LOOP.id === call.checkId) { loopStop(); return; }
  const hit = clipFor(call);
  if (!hit) { note("not seen in play yet — Rec, and play until it fires"); return; }
  loopStart(call, hit);
}

function loopStart(call, hit) {
  loopStop();
  if (REC.on) recToggle(false);
  Object.assign(LOOP, { id: call.checkId, call, clip: hit.clip, file: hit.file, near: hit.near, muted: {}, prev: -1 });
  // The whole moment: every event of the window, each at its own time, once.
  const seen = {};
  LOOP.events = (hit.clip.events || []).map((e) => ({ e, call: callOf(e) }))
    .filter((x) => x.call && !seen[x.call.checkId + "@" + x.e.t] && (seen[x.call.checkId + "@" + x.e.t] = 1));
  // A beat's rows hold COPIES of the scan's calls: a call is the same call by its id.
  if (!LOOP.events.some((x) => x.call.checkId === call.checkId)) LOOP.events.push({ e: { id: call.checkId, t: hit.clip.at }, call });
  LOOP.events.sort((a, b) => a.e.t - b.e.t);
  const slug = state.slug, id = call.checkId;
  fetch("clips/" + encodeURIComponent(slug) + "/" + hit.file).then((r) => {
    if (!r.ok) throw new Error("clip " + hit.file + " is gone");
    return r.blob();
  }).then((blob) => {
    if (LOOP.id !== id || slug !== state.slug) return;
    LOOP.url = URL.createObjectURL(blob);
    document.body.classList.add("looping");
    setClear(true);
    clipVideos().forEach((v) => { v.src = LOOP.url; v.currentTime = 0; v.play().catch(() => {}); });
    unlock();
    drawReplay();
    fit();
    paintClips();
    LOOP.raf = requestAnimationFrame(loopTick);
  }).catch((e) => { note("loop: " + e.message); loopStop(); });
  paintClips();
}

function loopStop() {
  cancelAnimationFrame(LOOP.raf);
  const was = !!LOOP.id;
  Object.assign(LOOP, { id: null, call: null, clip: null, file: null, events: [], raf: 0 });
  clipVideos().forEach((v) => { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} });
  if (LOOP.url) { URL.revokeObjectURL(LOOP.url); LOOP.url = null; }
  document.body.classList.remove("looping");
  setClear(false);
  if (was) { drawReplay(); fit(); paintClips(); }
}

function loopRestart() {
  clipVideos().forEach((v) => { try { v.currentTime = 0; v.play().catch(() => {}); } catch (e) {} });
  LOOP.prev = -1;
}

const evKey = (x) => x.call.checkId + "@" + x.e.t;

function loopTick() {
  if (!LOOP.clip) return;
  LOOP.raf = requestAnimationFrame(loopTick);
  const en = document.querySelector('video.clip[data-lang="en"]');
  if (!en || !en.src) return;
  // MediaRecorder writes no duration into a webm: the index's is the one to trust.
  const dur = LOOP.clip.dur || en.duration;
  if (en.ended || (isFinite(dur) && en.currentTime >= dur - 0.03)) { loopRestart(); return; }
  const t = en.currentTime;
  if (t < LOOP.prev - 0.1) LOOP.prev = -1;
  for (const x of LOOP.events) {
    if (LOOP.muted[evKey(x)] || !(x.e.t > LOOP.prev && x.e.t <= t)) continue;
    const row = document.querySelector('.call[data-check="' + CSS.escape(x.call.checkId) + '"]');
    fire(x.call, row);
  }
  LOOP.prev = t;
  const tm = el("replay").querySelector(".time");
  if (tm) tm.textContent = t.toFixed(1) + " / " + (isFinite(dur) ? dur.toFixed(1) : "?") + " s";
}

function evLabel(call) {
  if (call.kind === "sound") return String(call.preview.args[0]) + " L" + call.line;
  const w = call.texts && call.texts.fields && call.texts.fields.word;
  const word = w ? (w.lit != null ? w.lit : w.expr) : call.preview.args[0];
  const s = String(word == null ? call.name : word);
  return (s.length > 16 ? s.slice(0, 15) + "…" : s) + " L" + call.line;
}

function drawReplay() {
  const box = el("replay");
  if (!LOOP.clip) { box.innerHTML = ""; return; }
  const c = LOOP.call;
  box.innerHTML =
    `<span class="what">↻ L${c.line} ${c.fn ? esc(c.fn) + "()" : "top level"} · ${esc(c.name)}</span>` +
    `<span class="time"></span>` +
    (LOOP.near ? `<span class="approx" title="the call was edited since this moment was recorded — the clip is the one its older self fired on">recorded before the edit</span>` : "") +
    `<span class="sp"></span>` +
    `<button class="act sm ghost" data-a="drop" title="forget this recording — the next time it fires under Rec, it is captured again">Drop clip</button>` +
    `<button class="act sm" data-a="stop">Stop</button>` +
    `<div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px">` +
    LOOP.events.map((x, i) =>
      `<button class="ev k-${x.call.kind}${x.call.checkId === c.checkId ? " me" : ""}${LOOP.muted[evKey(x)] ? " off" : ""}" data-i="${i}" ` +
      `title="${esc(x.call.name)} at ${x.e.t.toFixed(2)} s — click to mute it in the loop">${esc(evLabel(x.call))} · ${x.e.t.toFixed(1)}s</button>`).join("") +
    `</div>`;
  box.querySelector('[data-a="stop"]').onclick = loopStop;
  box.querySelector('[data-a="drop"]').onclick = dropClip;
  box.querySelectorAll(".ev").forEach((b) => {
    b.onclick = () => {
      const k = evKey(LOOP.events[Number(b.dataset.i)]);
      LOOP.muted[k] = !LOOP.muted[k];
      b.classList.toggle("off", LOOP.muted[k]);
    };
  });
}

function dropClip() {
  const file = LOOP.file, slug = state.slug;
  if (!file) return;
  fetch("api/clip-drop", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game: slug, file }) })
    .then((r) => r.json())
    .then((res) => {
      if (res.error) { note("drop: " + res.error); return; }
      if (slug === state.slug) state.clips = res.index;
      loopStop();
      paintClips();
      note("clip dropped — Rec, and the next time it fires it is captured again");
    });
}

/* ===========================================================================
   REC: the game itself, played, and its events caught as they fire.

   Each watched method of the build is wrapped (Pop, Notify, Sound): the
   wrapper reads its caller off the stack — a line of the built
   game.<hash>.js, which /api/offset maps to the source — and matches it to
   the row scan-events gave that line. A call the motor makes for itself has
   no frame in game.<hash>.js and is ignored.

   The canvas is sampled at REC_FPS into a ring of small canvases holding
   REC_PRE seconds. A CUE with no clip yet keeps the ring and REC_POST seconds
   more — a second on each side is the moment, and more is the round going on
   about something else. Every other event in that window (another cue, a
   callout) rides along in the clip's list, so the loop can replay the moment
   whole; a callout opens no capture of its own, since nothing here judges it. The frames are encoded into a
   webm in real time (MediaRecorder over a canvas stream, each frame at the
   time it was taken) and posted to /api/clip.
   =========================================================================== */
const REC_PRE = 1, REC_POST = 1, REC_FPS = 20, REC_W = 360, REC_H = 640;
const REC = { on: false, W: null, canvas: null, ground: "#000", ring: [], pool: [], log: [], open: null,
              inflight: new Set(), saved: 0, busy: 0, raf: 0, last: 0 };
const recFrame = el("rec-frame");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function recToggle(on) {
  REC.on = on === undefined ? !REC.on : !!on;
  el("btn-rec").classList.toggle("on", REC.on);
  document.body.classList.toggle("rec", REC.on);
  cancelAnimationFrame(REC.raf);
  if (REC.on) {
    loopStop();
    recLoad();
    REC.raf = requestAnimationFrame(recTick);
    note("play — every cue with no clip yet is captured, a second either side of it");
  } else {
    recDiscard();
    REC.W = REC.canvas = null;
    recFrame.src = "about:blank";
  }
  recInfo();
  fit();
}

function recLoad() {
  recDiscard();
  REC.W = REC.canvas = null;
  // force=1: every level of the map can be started, for this load only (levels.js).
  recFrame.src = "build/" + state.slug + "/index.html?first=0&lang=en&force=1";
  recLevels(0);
}

/* The level picker: filled from the played build once it is up (its climb's
   length — the template and a game with no map have none), and a pick starts
   that level's round at once, from whatever screen the frame is on. */
function recLevels(n) {
  const sel = el("rec-level");
  sel.innerHTML = n
    ? `<option value="">Level…</option>` +
      Array.from({ length: n }, (_, i) => `<option value="${i + 1}">Level ${i + 1}</option>`).join("") +
      `<option value="${n + 1}">Endless</option>`
    : `<option value="">No levels</option>`;
  sel.disabled = !n;
}

el("rec-level").onchange = () => {
  const sel = el("rec-level"), n = Number(sel.value);
  sel.value = "";
  const w = recFrame.contentWindow, L = w && w.__LEVELS__;
  if (!n || !L || !L.play) return;
  // A round under way is taken down by startGame itself (bootstrap.js): no score, no end screen.
  recDiscard();
  L.play(n);
  try { w.focus(); } catch (e) {}
  note(n > L.count() ? "endless run started" : "level " + n + " started");
};

// The colour under the canvas: the SKIN's --bg when it is a plain colour, the frame's otherwise.
function groundOf(w) {
  const d = w.document;
  const tok = w.getComputedStyle(d.documentElement).getPropertyValue("--bg").trim();
  if (/^(#|rgb|hsl)/.test(tok)) return tok;
  for (const n of [d.getElementById("frame"), d.getElementById("stage"), d.body]) {
    if (!n) continue;
    const bg = w.getComputedStyle(n).backgroundColor;
    if (bg && bg !== "transparent" && !/rgba\(.*,\s*0\)$/.test(bg)) return bg;
  }
  return "#000";
}

recFrame.addEventListener("load", () => {
  if (!REC.on) return;
  try {
    const w = recFrame.contentWindow, W = w && w.__WEB__;
    if (!W) return;
    REC.W = W;
    REC.canvas = w.document.getElementById("game");
    REC.ground = groundOf(w);
    loadOffset();
    recLevels(w.__LEVELS__ && w.__LEVELS__.active() && w.__LEVELS__.count ? w.__LEVELS__.count() : 0);
    ["show", "text"].forEach((m) => hook(W.Pop, m, "Pop." + m));
    hook(W.Notify, "say", "Notify.say");
    ["clip", "cue", "beep", "arp"].forEach((m) => hook(W.Sound, m, "Sound." + m));
    w.document.addEventListener("mousedown", () => closeFileMenu());
    try { w.focus(); } catch (e) {}
  } catch (e) { note("rec: the build did not load — " + e.message); }
});

function hook(obj, meth, name) {
  const orig = obj && obj[meth];
  if (typeof orig !== "function" || orig.__lab) return;
  const f = function () {
    if (REC.on) recSaw(name, new Error().stack);
    // The number is fired live over the loop: drawn here, it would be baked into the clip.
    if (name === "Pop.text") return;
    return orig.apply(this, arguments);
  };
  f.__lab = true;
  obj[meth] = f;
}

function callAt(name, line) {
  const pool = state.data.calls.filter((c) => c.name === name && !c.inherited && c.checkId);
  let best = null;
  for (const c of pool) {
    const d = Math.abs(c.line - line);
    if (d <= 2 && (!best || d < best.d)) best = { c, d };
  }
  return best && best.c;
}

function recSaw(name, stack) {
  if (state.offset == null || !state.data) return;
  /* The frames, in any engine's spelling: Chrome opens on an "Error" line and
     writes "at f (url:l:c)", Firefox and Safari open on the first frame and
     write "f@url:l:c". So the lines that end on a location are kept — [0] is
     the wrapper, [1] whoever called it — rather than counted from the top. */
  const frames = String(stack).split("\n").filter((l) => /:\d+:\d+\)?\s*$/.test(l));
  const m = /\/game\.[0-9a-f]+\.js:(\d+):\d+/.exec(frames[1] || "");
  if (!m) return;
  const call = callAt(name, Number(m[1]) + state.offset);
  if (!call) return;
  const t = performance.now();
  REC.log.push({ id: call.checkId, name: call.name, line: call.line, fn: call.fn || "", t });
  if (REC.log.length > 400) REC.log.splice(0, 200);
  if (call.kind !== "sound") return;
  if ((state.clips.byId && state.clips.byId[call.checkId]) || REC.inflight.has(call.checkId)) return;
  if (!REC.open) recOpen(t);
  REC.open.ids.add(call.checkId);
  REC.inflight.add(call.checkId);
  recInfo();
}

function recRelease(f) { if (--f.refs <= 0) REC.pool.push(f); }

function recTick(now) {
  if (!REC.on) return;
  REC.raf = requestAnimationFrame(recTick);
  if (!REC.canvas || now - REC.last < 1000 / REC_FPS - 4) return;
  REC.last = now;
  const f = REC.pool.pop() || { c: Object.assign(document.createElement("canvas"), { width: REC_W, height: REC_H }), t: 0, refs: 0 };
  const g = f.c.getContext("2d");
  g.fillStyle = REC.ground;
  g.fillRect(0, 0, REC_W, REC_H);
  try { g.drawImage(REC.canvas, 0, 0, REC_W, REC_H); } catch (e) {}
  f.t = now;
  f.refs = 1;
  REC.ring.push(f);
  if (REC.open) {
    f.refs++;
    REC.open.frames.push(f);
    if (now >= REC.open.until) recClose();
  }
  while (REC.ring.length && REC.ring[0].t < now - REC_PRE * 1000 - 100) recRelease(REC.ring.shift());
}

function recOpen(t) {
  const frames = REC.ring.filter((f) => f.t >= t - REC_PRE * 1000);
  frames.forEach((f) => { f.refs++; });
  REC.open = { slug: state.slug, t0: frames.length ? frames[0].t : t, frames, until: t + REC_POST * 1000, ids: new Set() };
}

function recClose() {
  const cap = REC.open;
  REC.open = null;
  if (!cap.frames.length) { cap.ids.forEach((id) => REC.inflight.delete(id)); return; }
  const t1 = cap.frames[cap.frames.length - 1].t;
  const events = REC.log.filter((e) => e.t >= cap.t0 && e.t <= t1)
    .map((e) => ({ id: e.id, name: e.name, line: e.line, fn: e.fn, t: Math.round((e.t - cap.t0)) / 1000 }));
  const claim = [...cap.ids];
  const first = events.find((e) => cap.ids.has(e.id));
  recEncode(cap, events, claim, first ? first.t : REC_PRE);
  recInfo();
}

function recDiscard() {
  if (REC.open) {
    REC.open.frames.forEach(recRelease);
    REC.open.ids.forEach((id) => REC.inflight.delete(id));
    REC.open = null;
  }
  REC.ring.forEach(recRelease);
  REC.ring = [];
}

function blobB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

async function recEncode(cap, events, claim, at) {
  REC.busy++;
  recInfo();
  try {
    const c = Object.assign(document.createElement("canvas"), { width: REC_W, height: REC_H });
    const g = c.getContext("2d");
    g.drawImage(cap.frames[0].c, 0, 0);
    const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
    const stream = c.captureStream(REC_FPS);
    const mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
    const chunks = [];
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise((r) => { mr.onstop = r; });
    mr.start();
    // Real time, each frame at the moment it was taken: the event's `at` stays true.
    const start = performance.now();
    for (const f of cap.frames) {
      const wait = start + (f.t - cap.t0) - performance.now();
      if (wait > 0) await sleep(wait);
      g.drawImage(f.c, 0, 0);
    }
    await sleep(1000 / REC_FPS);
    mr.stop();
    await stopped;
    stream.getTracks().forEach((t) => t.stop());
    const dur = (cap.frames[cap.frames.length - 1].t - cap.t0) / 1000 + 1 / REC_FPS;
    const webm = await blobB64(new Blob(chunks, { type: "video/webm" }));
    const res = await fetch("api/clip", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ game: cap.slug, webm, dur, at, events, claim })
    }).then((r) => r.json());
    if (res.error) note("rec: " + res.error);
    else {
      REC.saved++;
      if (cap.slug === state.slug) { state.clips = res.index; paintClips(); }
    }
  } catch (e) { note("rec: " + e.message); }
  finally {
    cap.frames.forEach(recRelease);
    claim.forEach((id) => REC.inflight.delete(id));
    REC.busy--;
    recInfo();
  }
}

function recInfo() {
  el("rec-info").innerHTML = REC.on || REC.busy
    ? `<b>${REC.saved}</b> captured` + (REC.open ? " · recording" : "") + (REC.busy ? " · encoding " + REC.busy : "")
    : "";
}

el("btn-rec").onclick = () => recToggle();

fetch("api/sfx").then((r) => r.json()).then((files) => {
  state.sfx = files;
  if (state.data) render();
});

// The gameplay variants of the house kit, for the clip cards' kit selector.
fetch("api/kit").then((r) => r.json()).then((k) => {
  state.kitIds = [];
  state.kitUsers = k.users || {};
  for (const [role, r] of Object.entries(k.roles || {})) {
    if (r.group !== "game") continue;
    for (const v of Object.keys(r.variants || {})) state.kitIds.push(role + "/" + v);
  }
  if (state.data) render();
}).catch(() => {});
fetch("api/games").then((r) => r.json()).then((list) => {
  state.games = {};
  list.forEach((g) => { state.games[g.slug] = g; state.status[g.slug] = g.status; });
  picker.order = list.map((g) => g.slug);
  const saved = localStorage.getItem("events:game");
  picker.value = list.some((g) => g.slug === saved) ? saved : list[0].slug;
  drawPicker();
  load(picker.value);
});

/* --- APPLY — the one thing on this page that writes ----------------------
   What the rows changed goes to the server as a plan, never as a patch: the
   page names the call by LINE and by NAME, and tools/lab/apply-events.mjs
   re-reads the source and splices the argument itself. So a file that moved
   under the bench is refused by name instead of being written over blind.

   The write trips the server's watcher, which rebuilds and reloads the page —
   which is why the report is parked in sessionStorage and read back on the way
   in. It is the only record of what was refused.                            */
function applyPlan() {
  const calls = [];
  for (const [k, set] of Object.entries(state.pending.calls)) {
    const [line, name] = k.split("|");
    if (Object.keys(set).length) calls.push({ line: Number(line), name, set });
  }
  const sfx = Object.entries(state.pending.sfx).map(([key, v]) => ({ key, file: v.file, len: v.len }));
  const kill = {
    calls: Object.values(state.pending.kill.calls),
    clips: Object.keys(state.pending.kill.clips)
  };
  /* The version always moves with the source — CLAUDE.md, and it is the number
     the title screen signs itself with, so a build nobody can name is worse
     than a patch number nobody reads. There is no switch for it here. */
  const kit = Object.entries(state.pending.kit || {}).map(([key, id]) => ({ key, id }));
  return { game: state.slug, calls, sfx, kill, kit, bump: true };
}

function showReport(r) {
  const box = el("report");
  if (!r) { box.innerHTML = ""; fit(); return; }
  if (r.error) { box.innerHTML = `<div class="no">apply failed — ${esc(r.error)}</div>`; return; }
  const seen = {};
  const lines = [];
  for (const a of r.applied || []) {
    lines.push(`<div class="ok">✓ ${esc(a.what)} → ${esc(a.value)}</div>`);
    // Several changes land on one line; the line as it now reads is printed once.
    if (a.after && !seen[a.at]) { seen[a.at] = 1; lines.push(`<span class="at">${a.at}: ${esc(a.after)}</span>`); }
  }
  for (const w of r.skipped || []) lines.push(`<div class="no">! ${esc(w)}</div>`);
  if (r.version) lines.push(`<div class="ver">version → ${esc(r.version)}</div>`);
  if (!lines.length) lines.push(`<div class="no">nothing to apply</div>`);
  box.innerHTML = lines.join("");
  fit();
}

function applyNow() {
  const plan = applyPlan();
  if (!plan.calls.length && !plan.sfx.length && !plan.kill.calls.length && !plan.kill.clips.length && !plan.kit.length) return;
  const btn = el("btn-apply");
  btn.disabled = true;
  btn.textContent = plan.sfx.length ? "Cutting…" : "Writing…";
  note("writing " + (plan.game === "template" ? "template" : "games/" + plan.game) + (plan.calls.length || plan.sfx.length || plan.kill.calls.length || plan.kill.clips.length ? "/game.js…" : "/manifest.json…"));
  fetch("api/apply", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(plan)
  })
    .then((r) => r.json())
    .then((r) => {
      state.pending = EMPTY_PENDING();
      try { sessionStorage.setItem("events:report", JSON.stringify(r)); } catch (e) {}
      showReport(r);
      note(r.written ? "written — rebuilding" : "nothing written");
      countPending();
      render();
    })
    .catch((e) => { note("apply failed: " + e.message); countPending(); });
}

el("btn-apply").onclick = applyNow;
try {
  const saved = sessionStorage.getItem("events:report");
  if (saved) showReport(JSON.parse(saved));
} catch (e) {}

el("btn-reload").onclick = () => load(state.slug);

/* The report is the only thing on the stage that outlives its moment. Click
   it away. */
el("report").onclick = () => {
  showReport(null);
  try { sessionStorage.removeItem("events:report"); } catch (e) {}
};

window.addEventListener("resize", fit);
fit();
</script>
</body>
</html>
