  const btn = input.closest(".rng").querySelector(".rrst"), expr = call.args[2];
  // A constant in the source, or no argument at all (×1); null when the code builds it.
  const src = expr == null ? 1 : isNum(expr) ? Number(expr) : null;
  const writes = !call.inherited && /^Sound\.(clip|cue|ui)$/.test(call.name);
  input.dataset.was = input.value;
  if (src == null) input.classList.add("expr");
  row._rateSync = () => {
    const changed = input.value !== input.dataset.was;
    input.classList.toggle("dirty", changed);
    if (input._show) input._show();
    btn.disabled = Number(input.value) === 1;
  };
  const sync = () => {
    row._rateSync();
    // A motor line's pitch moves for the ear only, like its volume.
    if (!writes) return;
    const p = pend(call), v = Number(input.value);
    delete p.rate;
    // Back to ×1 over a constant: the argument goes rather than being written as 1.
    if (input.value !== input.dataset.was) p.rate = v === 1 && src != null ? "" : input.value;
    if (!Object.keys(p).length) delete state.pending.calls[pendKey(call)];
    countPending();
  };
  input.addEventListener("input", sync);
  input.addEventListener("change", sync);
  btn.onclick = () => {
    input.value = 1;
    input.dispatchEvent(new Event("input"));
    if (writes && src != null && src !== 1) note(`line ${call.line} will play ${row.dataset.key} at ×1 — the ×${src} leaves the call on apply`);
  };
  // A re-render rebuilds the row: put the pending pitch back on it.
  const p = state.pending.calls[pendKey(call)];
  if (p && p.rate != null) input.value = p.rate === "" ? 1 : p.rate;
  row._rateSync();
}

/* ── split: one line of a kit key to a key of its own ─────────────────────
   Two lines playing one key play one sound: a wingbeat and a cry share
   `dive`, and moving the variant of one moves the other. The scissors give
   the line a NEW key (`dive2`, or a name typed in), mapped in the manifest to
   the variant the key ships with today — so it sounds the same on apply, and
   its own card then picks its own variant. The last line of a key stays: a key
   nothing plays is not a split, it is a removal. */
const KEY_NAME = /^[A-Za-z_$][\w$]*$/;
function splitTaken(name) {
  return name === "music" || (state.data.sounds || []).some((x) => x.key === name);
}
function splitLine(call, row) {
  const k = pendKey(call);
  if (state.pending.split[k]) { delete state.pending.split[k]; row._splitSync(); countPending(); note(""); return; }
  const card = row.closest(".beat"), from = card.dataset.key;
  if (!card.dataset.kit) { note(from + " is an embedded clip — hand it to a kit variant first, then split it"); return; }
  const rows = [...card.querySelectorAll(".call")].filter((r) => r._call && !state.pending.split[pendKey(r._call)]);
  if (rows.length < 2) { note(from + " keeps its last line — a key nothing plays is a removal, not a split"); return; }
  const used = (n) => splitTaken(n) || Object.values(state.pending.split).some((s) => s.to === n && s.from !== from);
  let i = 2;
  while (used(from + i)) i++;
  const to = (prompt(`A key of its own for line ${call.line} (${call.fn || "top level"}) — it plays ${card.dataset.kit} until you pick another variant on its card`, from + i) || "").trim();
  if (!to) return;
  if (!KEY_NAME.test(to)) { note(`"${to}" is not a sound key — letters, digits, _ and $`); return; }
  if (to === from || used(to)) { note(to + " is already a key of this game"); return; }
  state.pending.split[k] = { line: call.line, name: call.name, from, to, id: card.dataset.kit };
  row._splitSync();
  countPending();
  note(`line ${call.line} will play ${to} on apply — mapped to ${card.dataset.kit}, so it sounds the same until its own card moves it`);
}

/* When a line fires, under it: the conditions it sits in, outermost first,
   the comment above it, and what fires with it — the callout's style and
   word, the notice, the juice, the other cues (scan-events.mjs, cueContext).
   It is a <details>: a click opens the code it was read from. */
function ctxHtml(call) {
  const x = call.ctx;
  if (!x) return "";
  const bits = [];
  if (x.guards.length) bits.push(x.guards.map((g) => `<span class="cg" title="${esc(g)}">${esc(g)}</span>`).join(`<span class="sep">›</span>`));
  else bits.push(`<span class="always">every time ${call.fn ? esc(call.fn) + "()" : "the top level"} reaches it</span>`);
  if (x.beat.length) bits.push(`<span class="sep">with</span>` + x.beat.map((t) =>
    `<span class="ct ${t.k}" title="${esc({ pop: "a callout fired in the same moment", notify: "a notice said in the same moment", sound: "another cue of the same moment", fx: "juice of the same moment", music: "the bed, in the same moment" }[t.k] || "")}">${t.k === "sound" ? "♪ " : ""}${esc(t.t)}</span>`).join(""));
  if (x.comment) bits.push(`<span class="cc" title="${esc(x.comment)}">// ${esc(x.comment.length > 110 ? x.comment.slice(0, 109) + "…" : x.comment)}</span>`);
  bits.push(`<span class="code" title="the code around the line">{ }</span>`);
  return `<details class="ctx"><summary>${bits.join("")}</summary><pre>${esc(x.code)}</pre></details>`;
}

function callRow(call) {
  const row = document.createElement("div");
  row.className = "call k-" + call.kind;
  /* The clip itself — which file it is cut from, and how long the cut is, or
     the kit variant it plays — belongs to the KEY, and it is written once on
     the card's header. What a line owns is how LOUD it plays it, in this
     game's source, and at what PITCH, on top of the variant's own; a rate the
     code builds is the game's own melody, heard here and left to it.
     A line of the MOTOR (the template's end-screen cues) is named by its
     file, since it is not in the unit's own source. */
  const bits = [`<button class="act sm play" title="play it in the game">▶</button>`,
                `<button class="act sm loop" title="loop the moment of the game it fires on">↻</button>`,
                `<span class="tag">${call.name}</span>`];
  bits.push(call.inherited
    ? `<span class="ln motor" title="${esc(call.source)} — a motor line: auditioned here, changed in the source">${esc(call.where.split("/").pop())}:${call.line}</span>`
    : `<span class="ln" title="${esc(call.source)}">L${call.line}</span>`);
  bits.push(`<span class="fn">${call.fn ? esc(call.fn) + "<i>()</i>" : "<i>top level</i>"}</span>`);
  bits.push(slider("vol", call.preview.args[1], 0, 1, 0.05, 0.1, "vol", "how loud this line plays it — the one thing a line owns; the sound itself is its variant's"));
  bits.push(rateCell(call));
  /* The marker holds its cell whether or not it has anything to say: a cue row
     is a GRID, and a column that appears on some lines and not on others is a
     column that never lines up. */
  bits.push(call.preview.exact
    ? `<span class="approx"></span>`
    : `<span class="approx" title="an argument is built from the round's own state — the motor's default is shown instead. Slide over it.">≈</span>`);
  // A line of a kit key can leave for a key of its own (splitLine).
  const splittable = !call.inherited && call.kind === "sound" && call.soundLiteral !== false &&
    (call.name === "Sound.clip" || call.name === "Sound.cue") && state.slug !== "template" && state.slug !== "shell";
  bits.push(splittable
    ? iconBtn("split", "split", "give this line a key of its own — it plays the same variant on apply, then its card picks another")
    : `<span class="iconbtn"></span>`);
  // Each line carries its own three: one clip is played by several lines and
  // each is its own decision.
  bits.push(iconBtn("check", "check", "mark as checked — heard, signed off"));
  bits.push(iconBtn("revert", "revert", "put this line back where the source has it"));
  bits.push(call.inherited
    ? `<span class="iconbtn" title="a motor line — apply writes the clip, not this line"></span>`
    : iconBtn("trash", "trash", "remove this line from the game — the clip stays, the other lines that play it stay"));

  row.innerHTML = bits.join("") + ctxHtml(call);
  // Before the bindings below: the snap has to run first, so everything that
  // reads the value reads the one the grid gave it.
  wireSliders(row);
  row.querySelector(".play").onclick = () => fire(call, row);
  row._call = call;
  row.querySelector(".loop").onclick = () => loopToggle(call);
  row.dataset.check = call.checkId || "";
  // A shell role is keyed apart from the game's keys: `deny` the role is not a clip named deny.
  row.dataset.key = call.method === "ui" ? "ui:" + call.sound : String(call.preview.args[0]);
  if (call.shell && state.slug !== "shell") row.classList.add("shell");
  row.querySelector(".check").onclick = () => toggleCheck([call.checkId], !isChecked(call.checkId));
  row.querySelector(".revert").onclick = () => revertCall(call, row);
  if (row.querySelector(".trash")) row.querySelector(".trash").onclick = () => killCall(call, row);
  wireRate(call, row);
  const sp = row.querySelector(".iconbtn.split");
  if (sp) {
    row._splitSync = () => {
      const s = state.pending.split[pendKey(call)];
      row.classList.toggle("split", !!s);
      sp.classList.toggle("on", !!s);
      let tag = row.querySelector(".splitto");
      if (s && !tag) { tag = document.createElement("span"); tag.className = "splitto"; row.querySelector(".fn").appendChild(tag); }
      if (tag) { if (s) tag.textContent = " → " + s.to; else tag.remove(); }
    };
    sp.onclick = () => splitLine(call, row);
    row._splitSync();
  }

  /* A motor line's volume moves for the ear only: nothing pends, and revert
     puts it back where the motor has it. */
  if (call.inherited) {
    row.classList.add("inherited");
    row.querySelectorAll("input[type=range]").forEach((c) => { c.dataset.was = c.value; });
    row.querySelector(".ln").onclick = () => copy(call.where + ":" + call.line);
    return row;
  }

  /* Which slider writes which argument back. `expr` is the source as the game
     wrote it, and it is what tells an editable value from one apply has to
     refuse. A call apply cannot write back (Sound.beep, Sound.arp) is still
     played from here — it is read-only, not hidden. */
  const editable = call.name === "Sound.clip" || call.name === "Sound.cue" || call.name === "Sound.ui";
  [["input.vol", "vol", call.args[1]]].forEach(([sel, name, expr]) => {
    const ctrl = row.querySelector(sel);
    if (!ctrl) return;
    if (!editable) { ctrl.disabled = true; ctrl.title = "apply does not write this call — change it in the source"; return; }
    watch(ctrl, call, name, expr);
  });
  row.querySelector(".ln").onclick = () => copy(state.data.where + ":" + call.line);
  return row;
}

/* ── one card per CLIP ────────────────────────────────────────────────────
   A pack of eight clips is played by eighteen lines, and listing the clip once
   per line said the same thing eighteen times — worse, it offered the same
   file dropdown eighteen times for one decision. The clip is the card: the
   file it is cut from and the length of the cut are written once, at the top,
   and the lines that play it are underneath with the only things that are
   theirs — how loud, and how high.                                          */
/* The kit selector of a clip card: hand this key to one VARIANT of the house
   kit's gameplay roles (a crash in one game is not a crash in another). On
   Apply the manifest maps it (`sfx`) and its clip leaves game.js
   (tools/lab/cut-kit.mjs, mapKeys); the lines that play it do not change. A
   key already in the kit can move to another variant, not back to a clip.

   It is the file picker's menu and not a <select>, for the file picker's
   reason: a native popup fires nothing over its rows, and a variant is
   chosen by ear. Hovering a row plays one shot of it — levelled, as it will
   ship, the draft of a variant edited on a card included — and the arrows do
   the same from the keyboard. */
function kitSelect(key, current) {
  if (state.slug === "template" || !(state.kitIds || []).length) return "";
  return `<button type="button" class="kitsel" data-current="${esc(current || "")}" title="play the house kit's variant instead — hover a variant to hear it, tune it on the card itself (kit button)"></button>`;
}
// Every variant the selector offers, a variant forked on a card included: apply creates it first.
function kitChoices() {
  return state.kitIds.concat(Object.keys(state.pending.roles || {}).filter((id) => !state.kitIds.includes(id) && id.includes("/")));
}
// One shot of a variant, the way the game plays it: its takes in turn, never the same twice in a row.
const kitLast = {};
function kitShot(id) {
  const v = kitDraft(id), n = v ? v.takes.length : 0;
  if (!n) return;
  let i = 0;
  const prev = kitLast[id] == null ? -1 : kitLast[id];
  if (n > 1) { i = Math.floor(Math.random() * (prev < 0 ? n : n - 1)); if (prev >= 0 && i >= prev) i++; }
  kitLast[id] = i;
  kstop(); kitPlay(v.takes[i]);
}
function openKitMenu(btn, key) {
  const box = el("filemenu");
  if (fileMenu.btn === btn && !box.hidden) { closeFileMenu(); return; }
  closeFileMenu();
  fileMenu.btn = btn; fileMenu.key = key;
  btn.classList.add("open");
  const list = box.querySelector(".fm-list");
  list.innerHTML = "";
  fileMenu.rows = [];
  const cats = [], now = btn.dataset.value || "";
  const row = (value, label, sub, cat, hay, play) => {
    const node = document.createElement("button");
    node.className = "fm-row" + (value === now ? " cur" : "") + (value === "__new__" ? " fm-new" : "");
    node.innerHTML = esc(label) + `<br><span class="sz">${esc(sub)}</span>`;
    node.onmouseenter = () => {
      clearTimeout(fileMenu.hover);
      fileMenu.hover = setTimeout(play, 110);
    };
    node.onmouseleave = () => clearTimeout(fileMenu.hover);
    const pick = () => btn._choose(value);
    node.onclick = () => { pick(); closeFileMenu(); };
    list.appendChild(node);
    fileMenu.rows.push({ node, value, cat, hay: hay.toLowerCase(), play, pick });
  };
  /* A key already in the kit: the first row makes it a sound of this game's
     own, a copy of the one it plays — the others are left as they ship. */
  if (btn.dataset.current && (state.pending.kit[key] || btn.dataset.current) !== KIT_EMPTY) {
    const from = state.pending.kit[key] || btn.dataset.current;

/* The games whose manifest maps a key to a kit variant (`sfx`), read off

/* The foot of a kit card: the icon of every game that plays the variant,

function forkName(role) {
