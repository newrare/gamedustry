      if (k.dataset.k === "shipped") shipped();
      if (k.dataset.k === "own") forkKey(key, id());
      if (k.dataset.k === "other") { const sel = node.closest(".beat").querySelector(".kitsel"); if (sel) openKitMenu(sel, key); }
      return;
    }
    if (locked() && !e.target.closest('[data-act="play"]')) return;
    const act = e.target.closest("[data-act]");
    if (act) {
      const i = +act.dataset.i;
      if (act.dataset.act === "play") { kstop(); kitPlay(takes()[i]); }
      if (act.dataset.act === "drop" && takes().length > 1) { edit().splice(i, 1); E.take = 0; changed(); paint(); }
      return;
    }
    const tl = e.target.closest("[data-tail]");
    if (tl) {
      const i = +tl.dataset.i, t = edit()[i];
      if (tl.dataset.tail) { t.tail = tl.dataset.tail; t.tailLength = r3(Math.min(t.length, t.tailLength || kitDefaultTail(t.length))); }
      else { delete t.tail; delete t.tailLength; }
      E.take = i;
      changed(); paint();
      kstop(); kitPlay(t);
      return;
    }
    const add = e.target.closest("[data-add]");
    if (add) {
      if (takes().length >= KIT_MAX_TAKES) return;
      const tk = edit();
      tk.push(withFile(tk[E.take], add.dataset.add));
      E.take = tk.length - 1;
      changed(); paint();
      kstop(); kitPlay(tk[E.take]);
      return;
    }
    const row = e.target.closest(".krow");
    if (row) { setFile(E.take, row.dataset.stem); return; }
    const box = e.target.closest(".ktake");
    if (box && e.target.tagName !== "INPUT" && e.target.tagName !== "CANVAS") selectTake(+box.dataset.i);
  });
  node.addEventListener("change", (e) => {
    const k = e.target.dataset.k;
    if (!k || e.target.tagName !== "INPUT" || locked()) return;
    const i = +e.target.dataset.i, v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    const t = edit()[i];
    if (k === "length") t.length = r3(Math.min(3, Math.max(0.02, v)));
    if (k === "start") t.start = r3(Math.max(0, v));
    if (k === "rate") { const rt = Math.round(Math.min(2, Math.max(0.5, v)) * 100) / 100; if (rt === 1) delete t.rate; else t.rate = rt; }
    if (k === "tailLength" || (k === "length" && t.tail)) t.tailLength = r3(Math.min(t.length, Math.max(0.02, k === "tailLength" ? v : t.tailLength)));
    selectTake(i);
    syncNums(i); drawWave(i); changed();
    if (k === "start" || k === "length") paintAlike();
    kstop(); kitPlay(t);
  });
  node.addEventListener("input", (e) => {
    if (!e.target.classList.contains("ksearch")) return;
    E.q = e.target.value;
    paintSearch();
  });
  // Hover hears a file as the active take would play it, after a short intent delay.
  let hover = null, hoverRow = null;
  node.addEventListener("mouseover", (e) => {
    const row = e.target.closest(".krow");
    if (row === hoverRow) return;
    hoverRow = row;
    clearTimeout(hover);
    if (!row) return;
    hover = setTimeout(() => { kstop(); kitPlay(withFile(takes()[E.take], row.dataset.stem)); }, 110);
  });
  node.addEventListener("mouseleave", () => { hoverRow = null; clearTimeout(hover); });

  /* The cut is taken by its grips, as on the kit page: an edge moves that
     edge, inside the window moves it whole, the amber grip is where the tail
     begins, a press outside draws a new window (and a click there moves it). */
  const GRIP = 9, MIN = 0.02, MAX = 3;
  const CURSOR = { start: "ew-resize", end: "ew-resize", tail: "ew-resize", move: "grab", new: "crosshair" };
  function hitOf(cv, t, x) {
    const { x0, x1, xt } = geom(cv, t);
    const near = [["start", Math.abs(x - x0)], ["end", Math.abs(x - x1)]];
    if (xt != null) near.push(["tail", Math.abs(x - xt) - 1]);
    near.sort((a, b) => a[1] - b[1]);
    if (near[0][1] <= GRIP) return near[0][0];
    return x > x0 && x < x1 ? "move" : "new";
  }
  let drag = null;
  node.addEventListener("pointerdown", (e) => {
    const cv = e.target.closest("canvas");
    if (!cv || !cv.dataset.dur || e.button || locked()) return;
    e.preventDefault();
    const i = +cv.dataset.i, t = takes()[i], rect = cv.getBoundingClientRect(), dur = +cv.dataset.dur;
    const at = (x) => Math.max(0, Math.min(dur, ((x - rect.left) / rect.width) * dur));
    const mode = hitOf(cv, t, e.clientX - rect.left);
    selectTake(i);
    drag = { i, cv, at, dur, mode, x: e.clientX, from: at(e.clientX), start: t.start, end: t.start + t.length, moved: false };
    if (mode === "move") cv.style.cursor = "grabbing";
    cv.setPointerCapture(e.pointerId);
  });
  node.addEventListener("pointermove", (e) => {
    if (!drag) {
      const cv = e.target.closest("canvas");
      if (cv && cv.dataset.dur) cv.style.cursor = CURSOR[hitOf(cv, takes()[+cv.dataset.i], e.clientX - cv.getBoundingClientRect().left)];
      return;
    }
    if (!drag.moved && Math.abs(e.clientX - drag.x) < 3) return;
    drag.moved = true;
    const t = edit()[drag.i], to = drag.at(e.clientX), d = drag;
    if (d.mode === "start") {
      const s = Math.max(Math.max(0, d.end - MAX), Math.min(d.end - MIN, to));
      t.start = r3(s); t.length = r3(d.end - s);
    } else if (d.mode === "end") {
      t.length = r3(Math.max(d.start + MIN, Math.min(Math.min(d.dur, d.start + MAX), to)) - d.start);
    } else if (d.mode === "move") {
      const len = d.end - d.start;
      t.start = r3(Math.max(0, Math.min(d.dur - len, d.start + to - d.from)));
    } else if (d.mode === "tail") {
      t.tailLength = r3(Math.max(MIN, Math.min(t.length, t.start + t.length - to)));
    } else {
      const a = Math.min(d.from, to), b = Math.max(a + MIN, Math.min(a + MAX, Math.max(d.from, to)));
      t.start = r3(a); t.length = r3(b - a);
    }
    if (t.tail) t.tailLength = r3(Math.min(t.length, t.tailLength));
    drawWave(drag.i); syncNums(drag.i);
  });
  function release() {
    if (!drag) return;
    const d = drag;
    drag = null;
    d.cv.style.cursor = "";
    const t = edit()[d.i];
    if (!d.moved && d.mode === "new") t.start = r3(Math.max(0, Math.min(d.dur - t.length, d.from)));
    if (!d.moved && d.mode !== "new") { changed(); kstop(); kitPlay(t); return; }
    drawWave(d.i); syncNums(d.i); changed(); paintAlike();
    kstop(); kitPlay(t);
  }
  node.addEventListener("pointerup", release);
  node.addEventListener("pointercancel", release);

  node._paint = paint;
  return node;
}

/* --- auditioning a raw file ----------------------------------------------
   A file of assets/audio/sfx/ picked in a dropdown is not embedded yet, so the
   motor cannot play it: the PAGE plays it, off /sfx/…, with its own <audio>.
   It stops at the cut length rather than running the whole file — most clips
   are mostly tail, and what the game will ship is the first `len` seconds. */
const sfxAudio = {};
let sfxPlaying = null, sfxStop = null;

function sfxVol() {
  const v = parseFloat(localStorage.getItem("events:libvol"));
  return isNaN(v) ? 0.9 : v;
}

function sfxPlay(file, len) {
  if (sfxPlaying) sfxPlaying.pause();
  clearTimeout(sfxStop);
  const a = sfxAudio[file] || (sfxAudio[file] = new Audio("sfx/" + encodeURIComponent(file)));
  a.volume = sfxVol();
  try { a.currentTime = 0; } catch (e) {}
  a.play().catch(() => note("cannot play " + file));
  sfxPlaying = a;
  if (len > 0) sfxStop = setTimeout(() => { try { a.pause(); } catch (e) {} }, len * 1000);
}

/* --- the one list -------------------------------------------------------- */
function render() {
  const list = el("list");
  list.innerHTML = "";
  if (!state.data) { list.innerHTML = `<div class="empty">loading…</div>`; return; }
  const d = state.data;
  if (d.slug === "shell") {
    add("section", "the shell — what every game plays, one card per role");
    add("legend", "The end screen (the score landing, its stars, its rows), the round's live stars and its end, the meta layer's coins and gifts: roles of the house kit " +
      "played by the motor and the web shell, the same in every game. A check here is given once, for all of them; the kit button tunes the role for all of them. " +
      "Shoot films them in the game picked beside it — the DOM included — so each line loops over the screen it is heard on.");
  } else
  add("section", "cues — one card per clip, and the lines that play it");
  if (d.slug === "template") add("legend",
    "The template's clips are the end screen's: the motor plays them (packages/shell/shell.js, and the web shell's map and menu), " +
    "so the lines below are motor lines — play them, sweep their volume and pitch by ear. Apply re-cuts the CLIP into template/game.js; " +
    "every game keeps the copy it was made with until it is re-cut on its own entry.");
  if (d.slug !== "shell") add("legend", "What a clip sounds like belongs to the clip, so it is written once, at the top of its card — for a key of the house kit, the kit button opens its variant: " +
    "its takes, their cut, their end and their pitch, and the library's files that look alike. Change it and every line below follows, in every game that plays it. " +
    "A line owns its volume and nothing else: its pitch is read, never set. Under each line, when it fires — its conditions, its comment and what fires with it; a click opens the code.");
  let n = 0;
  // Grouped by the clip, the groups in the order their first line appears.
  const groups = new Map();
  d.calls.filter((c) => c.kind === "sound").forEach((c) => {
    const key = c.method === "ui" ? "ui:" + c.sound : String(c.preview.args[0]);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  });
  groups.forEach((calls, key) => {
    if (state.hideChecked && calls.every((c) => isChecked(c.checkId))) return;
    list.appendChild(key.startsWith("ui:") ? shellCard(key.slice(3), calls, false) : clipCard(key, calls)); n++;
  });
  if (!n) add("empty", state.hideChecked && sideTotal()
    ? "every cue is checked"
    : "this game plays no cue");

  /* A clip nothing plays has no beat, so it has no row — the pill is the only
     place it is still named, and it names it: dead bytes in every build. */
  const dead = d.sounds.filter((x) => !x.music && !x.plays.length).map((x) => x.key);
  /* A clip the manifest has not handed to a role of the house kit (`sfx`) is
     the game's own file: the pill names every key still waiting for a role. */
  // A key mapped to empty has no role either: its variant was deleted on /kit.
  const loose = d.sounds.filter((x) => !x.music && (!x.kit || x.kit === KIT_EMPTY)).map((x) => x.key);
  el("stats").innerHTML =
    `<span><b>${d.counts.sound}</b> cues</span>` +
    (d.slug === "shell" ? `<span><b>${new Set(d.calls.map((c) => c.sound)).size}</b> roles</span>` : `<span><b>${d.sounds.length}</b> clips</span>`) +
    (dead.length ? `<span style="background:#3a2a12" title="${esc(dead.join(", "))} — embedded in every build and played by no beat. Delete them from ASSETS.sounds, or give them one."><b style="color:#ffb648">${dead.length}</b> never played</span>` : "") +
    (loose.length ? `<span style="background:#2a1f3d" title="${esc(loose.join(", "))} — a clip of the game's own, or a key left silent (empty) when its variant was deleted: in no role of the house kit. Pick one in the kit selector of its card."><b style="color:#c8b8ff">${loose.length}</b> without a role</span>` : "") +
    `<span class="seen-pill seen"></span>` +
    `<span class="checked-pill"></span>` +
    (d.slug === "shell" || d.slug === "template" ? "" :
      `<button class="probe" title="play every level of the map in a headless browser, a blind pilot pressing at random, and note on each card the first level its sound was heard on — a few minutes">Find stages</button>`) +
    `<button class="hide${state.hideChecked ? " on" : ""}" title="show only what is left to check">Hide checked</button>`;
  const probe = el("stats").querySelector("button.probe");
  if (probe) probe.onclick = () => {
    fetch("api/probe-stages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game: state.slug }) })
      .then((r) => r.json()).then((o) => {
        if (o.error) { note("find stages: " + o.error); return; }
        note("finding stages for " + o.keys.length + " key" + (o.keys.length > 1 ? "s" : "") + " — the cards fill in as it goes");
        loadStages();
      }).catch((e) => note("find stages failed — " + e.message));
  };
  el("stats").querySelector("button.hide").onclick = () => {
    state.hideChecked = !state.hideChecked;
    try { localStorage.setItem("events:hideChecked", state.hideChecked ? "1" : "0"); } catch (e) {}
    render();
  };

  paintChecks();
  paintClips();
  paintStages();
  refreshFiles();
  countPending();
}

/* ── checked ──────────────────────────────────────────────────────────────
   A mark is the server's (lab/events-review.json) and is matched on the
   call's checkId alone, so the page only ever asks "is this id in the review".
   A click repaints in place rather than re-rendering: a row holds pending
   edits and slot values the hand is in the middle of. With HIDE CHECKED on,
   a row that was just checked leaves the list, which is the point of it. */
/* A kit line's check holds the fingerprint of the cut it was given on, and a
   line whose key plays something the build does not ship as is — a draft, a
   variant it is being moved to — is checked only if its check was given on
   THAT: the server fingerprints the cut the line plays now (heardHash, kept
   per key by syncPreview) and the two are compared. A check given on the
   draft reads checked until apply writes it (the server alone would call it
   stale), and one given on the old cut reads unchecked while the key plays
   another. Touch the draft again and it reads unchecked, which it is. */
const heardHash = {};
function markOf(id) {
  const m = state.data.review && state.data.review[id];
  return m ? m.kit || "plain" : (state.data.staleKit || {})[id] || null;
}
function heardKey(id) {
  const row = document.querySelector('.call[data-check="' + CSS.escape(id) + '"]');
  const key = row && row.dataset.key;
  return key && previewWanted(key) ? key : null;
}
function isChecked(id) {
  if (!id || !state.data) return false;
  const key = heardKey(id);
  if (!key) return !!(state.data.review && state.data.review[id]);
  return !!heardHash[key] && markOf(id) === heardHash[key].hash;
}
// A check there is, given on another cut than the line plays now.
function isStaleCheck(id) {
  return !isChecked(id) && !!markOf(id);
}
function sideCalls() {
  return state.data ? state.data.calls.filter((c) => c.checkId && KINDS[c.kind]) : [];
}
function sideTotal() { return sideCalls().length; }

// In order, one after the other, so the last answer is the whole review.
let checkQueue = Promise.resolve();
function toggleCheck(ids, on) {
  ids = ids.filter(Boolean);
  if (!ids.length) return;
  checkQueue = checkQueue.then(() => sendCheck(ids, on));
}
/* A line of the kit is checked on what it was HEARD on. When the key plays
   a draft, or a variant it is being moved to, that is not the shipped cut,
   and the server is told which takes it was — or the check would read stale
   the moment apply writes the very cut that was signed off. */
function heardFor(ids) {
  const out = {};
  ids.forEach((id) => {
    const row = document.querySelector('.call[data-check="' + CSS.escape(id) + '"]');
    const w = row && row.dataset.key && previewWanted(row.dataset.key);
    if (w) out[id] = kitDraft(w).takes;
  });
  return out;
}
function sendCheck(ids, on) {
  const heard = on ? heardFor(ids) : {};
  return fetch("api/check", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: state.slug, ids, on, heard })
  })
    .then((r) => r.json())
    .then((res) => {
      if (res.error) { note(res.error); return; }
      state.data.review = res.review;
      state.data.stale = res.stale || [];
      state.data.staleKit = res.staleKit || {};
      state.status[state.slug] = res.status;
      refreshKitChecked();
      drawPicker();
      if (state.hideChecked && on) {
        const list = el("list"), top = list.scrollTop;
        render();
        list.scrollTop = top;
      } else paintChecks();
      note(on ? ids.length + " checked" : ids.length + " unchecked");
    })
    .catch((e) => note("check failed: " + e.message));
}

function paintChecks() {
  document.querySelectorAll(".call[data-check]").forEach((row) => {
    const on = isChecked(row.dataset.check);
    row.classList.toggle("checked", on);
    const b = row.querySelector(".iconbtn.check");
    if (b) {
      b.classList.toggle("on", on);
      const m = on && (state.data.review[row.dataset.check] || { at: "on the draft" });
      const stale = isStaleCheck(row.dataset.check);
      b.classList.toggle("stale", stale);
      b.title = on ? "checked " + m.at + " — click to take it back"
        : stale ? "checked on another cut than the one it plays now — the takes changed, or the key moved: hear it again, then check it"
        : "mark as checked — heard, signed off";
    }
  });
  // A card is checked when every line on it is.
  document.querySelectorAll("#list .beat").forEach((card) => {
    const rows = [...card.querySelectorAll(".call[data-check]")];
    const all = rows.length > 0 && rows.every((r) => r.classList.contains("checked"));
    card.classList.toggle("checked", all);
    const b = card.querySelector(".bhead .iconbtn.check");
    if (b) b.classList.toggle("on", all);
  });
  if (!state.data) return;
  const pill = el("stats").querySelector(".checked-pill");
  if (pill) {
    const all = sideTotal(), ok = sideCalls().filter((c) => isChecked(c.checkId)).length;
    pill.className = "checked-pill" + (all && ok === all ? " done" : "");
    pill.innerHTML = `<b>${ok}</b> / ${all} checked`;
  }
}

/* ── the game picker ──────────────────────────────────────────────────────
   One button, and a list under it: the game being edited wears a dot, a game
   every line of THIS page's side of which is checked (its cues, never the other
   page's) wears a tick and goes green. Not a <select>, whose popup draws its
   own tick on the selected entry. */
const picker = { order: [], value: null, idx: -1 };

function pickDone(slug) {
  const st = state.status[slug] && state.status[slug].sound;
  return !!(st && st.total && st.checked === st.total);
}

function pickEntry(slug, withDot) {
  const g = state.games && state.games[slug];
  return (withDot && slug === picker.value ? `<span class="gp-dot"></span>` : "") +
    (pickDone(slug) ? `<span class="gp-ck">\u2713</span>` : "") +
    `<span>${esc(g ? g.title : slug)}</span>`;
}

function drawPicker() {
  const box = el("game-pick");
  if (!picker.value) return;
  box.classList.toggle("done", pickDone(picker.value));
  box.querySelector(".gp-btn").innerHTML = pickEntry(picker.value, false);
  const list = box.querySelector(".gp-list");
  list.innerHTML = picker.order.map((slug, i) =>
    `<button type="button" class="gp-row${pickDone(slug) ? " done" : ""}${i === picker.idx ? " on" : ""}" data-slug="${esc(slug)}">${pickEntry(slug, true)}</button>`).join("");
  list.querySelectorAll(".gp-row").forEach((r) => { r.onclick = () => pickGame(r.dataset.slug); });
}

function pickOpen(on) {
  const box = el("game-pick"), list = box.querySelector(".gp-list");
  list.hidden = !on;
  box.classList.toggle("open", on);
  if (!on) return;
  picker.idx = picker.order.indexOf(picker.value);
  drawPicker();
  const cur = list.querySelector(".gp-row.on");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

function pickGame(slug) {
  pickOpen(false);
  if (slug === picker.value) return;
  picker.value = slug;
  drawPicker();
  load(slug);
}

(function wirePicker() {
  const box = el("game-pick"), btn = box.querySelector(".gp-btn"), list = box.querySelector(".gp-list");
  btn.onclick = () => pickOpen(list.hidden);
  box.addEventListener("keydown", (e) => {
    if (list.hidden) {
      if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") { e.preventDefault(); pickOpen(true); }
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); pickOpen(false); btn.focus(); return; }
    if (e.key === "Enter") { e.preventDefault(); if (picker.order[picker.idx]) pickGame(picker.order[picker.idx]); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    picker.idx = Math.max(0, Math.min(picker.order.length - 1, picker.idx + (e.key === "ArrowDown" ? 1 : -1)));
    drawPicker();
    const on = list.querySelector(".gp-row.on");
    if (on) on.scrollIntoView({ block: "nearest" });
  });
  // A click anywhere else, or the window losing focus (a click in a game frame), closes it.
  document.addEventListener("mousedown", (e) => { if (!box.contains(e.target)) pickOpen(false); });
  window.addEventListener("blur", () => pickOpen(false));
})();

function fit() {
  const stage = el("stage"), bar = el("bar"), gap = 12, label = 22;
  // The apply report takes its room out of the frames, never off the bottom of
  // the window: what it costs in height the frames give back.
  const h = stage.clientHeight - bar.offsetHeight - el("hint").offsetHeight - el("report").offsetHeight -
            el("replay").offsetHeight - label - 75;
  // One frame in the height the stage gets, never wider than a third of the window.
  const k = Math.max(0.12, Math.min(h / 1280, (window.innerWidth * 0.34 - 28) / 720));
  // REC: ONE frame, as big as the stage allows — it is played, not glanced at.
  const kr = Math.max(0.2, Math.min((h + label + gap) / 1280, (window.innerWidth * 0.45 - 28) / 720));
  if (document.body.classList.contains("rec")) {
    const f = document.querySelector(".fit.rec");
    f.style.transform = "scale(" + kr + ")";
    f.style.width = (720 * kr) + "px"; f.style.height = (1280 * kr) + "px";
    f.parentNode.style.width = (720 * kr) + "px";
    stage.style.flexBasis = (720 * kr + 28) + "px";
    return;
  }
  document.querySelectorAll(".fit:not(.rec)").forEach((f) => {
    f.style.transform = "scale(" + k + ")";
    f.style.width = (720 * k) + "px";
    f.style.height = (1280 * k) + "px";
    f.parentNode.style.width = (720 * k) + "px";
  });
  stage.style.flexBasis = (document.body.classList.contains("looping") ? Math.max(300, 720 * k + 28) : 300) + "px";
}

function load(slug) {
  if (slug !== state.slug) { state.pending = EMPTY_PENDING(); loopStop(); }
  state.slug = slug;
  loadClips();
  if (REC.on) recLoad();
  localStorage.setItem("events:game", slug);
  // The shell unit has no build of its own: its roles ship in every one, the template's included.
  document.body.classList.toggle("shell-unit", slug === "shell");
  LANGS.forEach((lang) => { frames[lang].src = "build/" + (slug === "shell" ? "template" : slug) + "/index.html?first=0&lang=" + lang; });
  fetch("api/events?game=" + encodeURIComponent(slug))
    .then((r) => r.json())
    .then((d) => { state.data = d; state.status[slug] = d.status; drawPicker(); el("sub").textContent = d.title + (d.version ? " v" + d.version : "") + " — " + d.where; render(); });
}

/* ===========================================================================
   The clips: lab/events-clips/<slug>/ (tools/lab/serve-events.mjs).

   A row's clip is the one recorded for its checkId. A call edited since has a
   new checkId; it borrows the clip of the nearest event of the same call name
   in the same function that no live call claims, and says so (amber ↻).
   =========================================================================== */
function loadClips() {
  const slug = state.slug;
  state.offset = null;
  autoLoad();
  fetch("api/clips?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((idx) => {
    if (slug !== state.slug) return;
    state.clips = idx && idx.clips ? idx : { clips: {}, byId: {} };
    paintClips();
  });
  loadOffset();
  loadStages();
}

/* ── STAGES: one level of the map each key is heard on ─────────────────────
   lab/events-stages.json, written by the recorder (every cue seen fire, with
   the level it fired on) and by Find stages (tools/lab/probe-stages.mjs, a
   headless walk of the levels). A card says it beside its count; a tap on it
   starts that level in the Rec frame, so the cue can be played for. */
let stageTimer = 0;
function loadStages() {
  const slug = state.slug;
  clearTimeout(stageTimer);
  fetch("api/stages?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((o) => {
    if (slug !== state.slug) return;
    state.stages = (o && o.stages) || {};
    state.probe = (o && o.probe) || null;
    paintStages();
    if (state.probe && state.probe.game === slug) stageTimer = setTimeout(loadStages, 3000);
  }).catch(() => {});
}
function paintStages() {
  const pr = state.probe, running = pr && pr.game === state.slug, over = pr && !pr.game && pr.done === state.slug;
  document.querySelectorAll(".beat .bhead[data-key]").forEach((head) => {
    const key = head.dataset.key, n = (state.stages || {})[key];
    let tag = head.querySelector(".stage");
    if (!tag) {
      tag = document.createElement("span");
      tag.className = "stage";
      const at = head.querySelector(".plays") || head.querySelector(".acts");
      head.insertBefore(tag, at);
      tag.onclick = () => { if (tag.dataset.n) recPlayLevel(Number(tag.dataset.n)); };
    }
    const missing = over && (pr.left || []).includes(key);
    tag.hidden = !n && !missing && !running;
    tag.classList.toggle("none", !n);
    tag.dataset.n = n || "";
    tag.textContent = n ? "Stage " + n : running ? "stage…" : "not heard";
    tag.title = n ? "heard on level " + n + " — a tap starts it in the Rec frame"
      : running ? "Find stages is walking the levels"
      : "the blind pilot never heard it — a move it cannot make, or a level past the ones it walked";
  });
  const b = el("stats").querySelector("button.probe");
  if (b) {
    b.disabled = !!running;
    b.textContent = running ? "Finding stages · level " + (pr.level || 0) + "/" + (pr.count || "?") + " · " + (pr.left || []).length + " left" : "Find stages";
    if (over && pr.error) b.title = "the last walk failed: " + pr.error;
  }
}
// A level started in the Rec frame — Rec opened first when it is not.
function recPlayLevel(n) {
  const w = recFrame.contentWindow, L = w && w.__LEVELS__;
  if (!REC.on || !L || !L.play) { note("press Rec, then tap Stage " + n + " again — or pick level " + n + " in its list"); return; }
  recDiscard();
  L.play(n);
  try { w.focus(); } catch (e) {}
  note("level " + n + " started");
}

/* Asked again every time the played frame loads, not only when the game is
   picked: an offset that failed then (a build half-way through) would leave
   REC catching nothing for the whole session, and saying nothing about it. */
function loadOffset() {
  const slug = state.slug;
  fetch("api/offset?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((o) => {
    if (slug !== state.slug) return;
    state.offset = o && o.offset != null ? o.offset : null;
    state.shellMap = (o && o.shell) || [];
    if (REC.on && state.offset == null) note("rec: " + ((o && o.error) || "no offset for " + slug) + " — nothing can be caught");
  }).catch((e) => { if (REC.on) note("rec: api/offset failed — " + e.message); });
}

// Every row a capture can belong to: the game's lines and the shell's.
const recCalls = () => (state.data ? state.data.calls.concat(state.data.shell || []) : []);
function nearEvent(call) {
  const idx = state.clips, live = new Set(recCalls().map((c) => c.checkId));
  let best = null;
  for (const [file, clip] of Object.entries(idx.clips || {})) {
    for (const e of clip.events || []) {
      if (e.name !== call.name || e.fn !== (call.fn || "") || live.has(e.id)) continue;
      const d = Math.abs(e.line - call.line);
      if (!best || d < best.d) best = { file, clip, e, d };
    }
  }
  return best;
}

function clipFor(call) {
  if (!call || (call.inherited && !call.shell) || !call.checkId) return null;
  const idx = state.clips, f = idx.byId && idx.byId[call.checkId];
  if (f && idx.clips[f]) return { file: f, clip: idx.clips[f], near: false };
  const n = nearEvent(call);
  return n ? { file: n.file, clip: n.clip, near: true } : null;
}

// A recorded event → the call the source has now (the same id, or the near one).
function callOf(e) {
  const calls = recCalls();
  const hit = calls.find((c) => c.checkId === e.id);
  if (hit) return hit;
  const ids = new Set(calls.map((c) => c.checkId));
  let best = null;
  for (const c of calls) {
    if (c.name !== e.name || (c.fn || "") !== e.fn || (c.inherited && !c.shell)) continue;
    // A call that has a clip of its own is not the one this event was.
    if (state.clips.byId[c.checkId] && ids.has(c.checkId)) continue;
    const d = Math.abs(c.line - e.line);
    if (!best || d < best.d) best = { c, d };
  }
  return best ? best.c : null;
}

function paintClips() {
  document.querySelectorAll(".call").forEach((row) => {
    const b = row.querySelector(".loop"), c = row._call;
    if (!b || !c) return;
    if (c.inherited && !c.shell) { b.disabled = true; b.title = "a motor line — the recorder catches the game's own calls and the shell's roles only"; return; }
    const hit = clipFor(c);
    b.classList.toggle("has", !!hit);
    b.classList.toggle("near", !!(hit && hit.near));
    b.classList.toggle("on", LOOP.id === c.checkId);
    b.title = !hit ? "not seen in play yet — Rec, and play until it fires"
      : LOOP.id === c.checkId ? "stop the loop"
      : "loop the moment of the game it fires on (" + hit.clip.dur.toFixed(1) + " s, recorded " + hit.clip.when.replace("T", " ") + ")" +
        (hit.near ? " — recorded before this call was edited" : "");
  });
  const pill = el("stats").querySelector(".seen-pill");
  if (pill && state.data) {
    const pool = state.data.calls.filter((c) => c.checkId && (!c.inherited || c.shell) && c.kind === "sound");
    const seen = pool.filter((c) => clipFor(c)).length;
    pill.innerHTML = `<b>${seen}</b> / ${pool.length} seen in play`;
    pill.title = "cues with a recorded moment — Rec and play to capture the rest";
  }
}

/* ===========================================================================
   The LOOP: the clip under the frame, the moment fired over it.
   =========================================================================== */
const LOOP = { id: null, call: null, clip: null, file: null, near: false, url: null, events: [], muted: {}, raf: 0, prev: -1 };
const clipVideos = () => [...document.querySelectorAll("video.clip")];

function setClear(on) {
  LANGS.forEach((lang) => {
    try { frames[lang].contentDocument.documentElement.classList.toggle("lab-clear", on); } catch (e) {}
  });
}

function loopToggle(call) {
  if (LOOP.id && LOOP.id === call.checkId) { loopStop(); return; }
  const hit = clipFor(call);
  if (!hit) { note("not seen in play yet — Rec, and play until it fires"); return; }
  loopStart(call, hit);
}

function loopStart(call, hit) {
  loopStop();
  if (REC.on) recToggle(false);
  Object.assign(LOOP, { id: call.checkId, call, clip: hit.clip, file: hit.file, near: hit.near, muted: {}, prev: -1 });
  // The whole moment: every event of the window, each at its own time, once.
  const seen = {};
  LOOP.events = (hit.clip.events || []).map((e) => ({ e, call: callOf(e) }))
    .filter((x) => x.call && !seen[x.call.checkId + "@" + x.e.t] && (seen[x.call.checkId + "@" + x.e.t] = 1));
  // A beat's rows hold COPIES of the scan's calls: a call is the same call by its id.
  if (!LOOP.events.some((x) => x.call.checkId === call.checkId)) LOOP.events.push({ e: { id: call.checkId, t: hit.clip.at }, call });
  LOOP.events.sort((a, b) => a.e.t - b.e.t);
  // The sound being judged is the one heard: every other cue of the window starts muted.
  LOOP.events.forEach((x) => { if (x.call.kind === "sound" && x.call.checkId !== call.checkId) LOOP.muted[x.call.checkId] = true; });
  const slug = state.slug, id = call.checkId;
  fetch("clips/" + encodeURIComponent(slug) + "/" + hit.file).then((r) => {
    if (!r.ok) throw new Error("clip " + hit.file + " is gone");
    return r.blob();
  }).then((blob) => {
    if (LOOP.id !== id || slug !== state.slug) return;
    LOOP.url = URL.createObjectURL(blob);
    document.body.classList.add("looping");
    setClear(true);
    clipVideos().forEach((v) => { v.src = LOOP.url; v.currentTime = 0; v.play().catch(() => {}); });
    unlock();
    drawReplay();
    fit();
    paintClips();
    LOOP.raf = requestAnimationFrame(loopTick);
  }).catch((e) => { note("loop: " + e.message); loopStop(); });
  paintClips();
}

function loopStop() {
  cancelAnimationFrame(LOOP.raf);
  const was = !!LOOP.id;
  Object.assign(LOOP, { id: null, call: null, clip: null, file: null, events: [], raf: 0 });
  clipVideos().forEach((v) => { try { v.pause(); v.removeAttribute("src"); v.load(); } catch (e) {} });
  if (LOOP.url) { URL.revokeObjectURL(LOOP.url); LOOP.url = null; }
  document.body.classList.remove("looping");
  setClear(false);
  if (was) { drawReplay(); fit(); paintClips(); }
}

function loopRestart() {
  clipVideos().forEach((v) => { try { v.currentTime = 0; v.play().catch(() => {}); } catch (e) {} });
  LOOP.prev = -1;
}

function loopTick() {
  if (!LOOP.clip) return;
  LOOP.raf = requestAnimationFrame(loopTick);
  const en = document.querySelector('video.clip[data-lang="en"]');
  if (!en || !en.src) return;
  // MediaRecorder writes no duration into a webm: the index's is the one to trust.
  const dur = LOOP.clip.dur || en.duration;
  if (en.ended || (isFinite(dur) && en.currentTime >= dur - 0.03)) { loopRestart(); return; }
  const t = en.currentTime;
  if (t < LOOP.prev - 0.1) LOOP.prev = -1;
  for (const x of LOOP.events) {
    if (LOOP.muted[x.call.checkId] || !(x.e.t > LOOP.prev && x.e.t <= t)) continue;
    // A screen clip has its callouts in the picture: only its cues are fired again.
    if (LOOP.clip.screen && x.call.kind !== "sound") continue;
    const row = document.querySelector('.call[data-check="' + CSS.escape(x.call.checkId) + '"]');
    fire(x.call, row);
  }
  LOOP.prev = t;
  const tm = el("replay").querySelector(".time");
  if (tm) tm.textContent = t.toFixed(1) + " / " + (isFinite(dur) ? dur.toFixed(1) : "?") + " s";
}

function evLabel(call) {
  if (call.kind === "sound") return String(call.preview.args[0]) + (call.shell ? " " + call.where.split("/").pop() + ":" : " L") + call.line;
  const w = call.texts && call.texts.fields && call.texts.fields.word;
  const word = w ? (w.lit != null ? w.lit : w.expr) : call.preview.args[0];
  const s = String(word == null ? call.name : word);
  return (s.length > 16 ? s.slice(0, 15) + "…" : s) + " L" + call.line;
}

function drawReplay() {
  const box = el("replay");
  if (!LOOP.clip) { box.innerHTML = ""; return; }
  const c = LOOP.call;
  /* One chip per LINE, not per firing: a line that fired thirty times in the
     window (a pop per coin) is one decision, and thirty chips pushed the frame
     out of the stage, which is sized from the room left under this bar. The
     looped line first. */
  const byId = new Map();
  LOOP.events.forEach((x) => {
    if (!byId.has(x.call.checkId)) byId.set(x.call.checkId, { list: [] });
    byId.get(x.call.checkId).list.push(x);
  });
  const groups = [...byId.values()].sort((a, b) => (b.list[0].call.checkId === c.checkId) - (a.list[0].call.checkId === c.checkId));
  box.innerHTML =
    `<span class="what">↻ L${c.line} ${c.fn ? esc(c.fn) + "()" : "top level"} · ${esc(c.name)}</span>` +
    `<span class="time"></span>` +
    (LOOP.near ? `<span class="approx" title="the call was edited since this moment was recorded — the clip is the one its older self fired on">recorded before the edit</span>` : "") +
    (LOOP.clip.screen ? "" : `<span class="approx" title="recorded from the game's canvas alone: the DOM — the HUD, the callouts, the live star pill, the end screen — is not in the picture. Rec again with the screen shared and it is replaced.">canvas only</span>`) +
    `<span class="sp"></span>` +
    `<button class="act sm ghost" data-a="drop" title="forget this recording — the next time it fires under Rec, it is captured again">Drop clip</button>` +
    `<button class="act sm" data-a="stop">Stop</button>` +
    `<div class="evs">` +
    groups.map((g) => {
      const x = g.list[0], me = x.call.checkId === c.checkId;
      return `<button class="ev k-${x.call.kind}${me ? " me" : ""}${LOOP.muted[x.call.checkId] ? " off" : ""}" data-id="${esc(x.call.checkId)}" ` +
        `title="${esc(x.call.name)} — ${g.list.map((y) => y.e.t.toFixed(2) + " s").join(", ")} — click to ${LOOP.muted[x.call.checkId] ? "hear" : "mute"} it in the loop">` +
        `${esc(evLabel(x.call))} · ${x.e.t.toFixed(1)}s${g.list.length > 1 ? " ×" + g.list.length : ""}</button>`;
    }).join("") +
    `</div>`;
  box.querySelector('[data-a="stop"]').onclick = loopStop;
  box.querySelector('[data-a="drop"]').onclick = dropClip;
  box.querySelectorAll(".ev").forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.id;
      LOOP.muted[k] = !LOOP.muted[k];
      b.classList.toggle("off", LOOP.muted[k]);
      b.title = b.title.replace(/click to (hear|mute)/, "click to " + (LOOP.muted[k] ? "hear" : "mute"));
    };
  });
}

function dropClip() {
  const file = LOOP.file, slug = state.slug;
  if (!file) return;
  fetch("api/clip-drop", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game: slug, file }) })
    .then((r) => r.json())
    .then((res) => {
      if (res.error) { note("drop: " + res.error); return; }
      if (slug === state.slug) state.clips = res.index;
      loopStop();
      paintClips();
      note("clip dropped — Rec, and the next time it fires it is captured again");
    });
}

/* ===========================================================================
   REC: the game itself, played, and its events caught as they fire.

   Each watched method of the build is wrapped (Pop, Notify, Sound): the
   wrapper reads its caller off the stack — a line of the built
   game.<hash>.js, which /api/offset maps to the source — and matches it to
   the row scan-events gave that line. A Sound.ui the SHELL plays (the end
   screen, the round's stars, the meta layer) has its frame in the shared
   engine.<hash>.js or boot.<hash>.js instead, where each shell file is copied
   whole: /api/offset says where (`shell`), and the call is matched to its
   shared row, so a shell role is recorded and looped like a game's cue. Any
   other call the motor makes for itself is ignored.

   The canvas is sampled at REC_FPS into a ring of small canvases holding
   REC_PRE seconds. A CUE with no clip yet keeps the ring and REC_POST seconds
   more — a second on each side is the moment, and more is the round going on
   about something else. Every other event in that window (another cue, a
   callout) rides along in the clip's list, so the loop can replay the moment
   whole; a callout opens no capture of its own, since nothing here judges it. The frames are encoded into a
   webm in real time (MediaRecorder over a canvas stream, each frame at the
   time it was taken) and posted to /api/clip.

   SCREEN. The canvas alone misses everything the DOM draws — the HUD, the
   callouts, the live star pill, the whole end screen — and a sound of the
   shell plays on exactly those. So REC first asks the browser for this tab
   (getDisplayMedia, preferCurrentTab) and crops it to the played frame
   (CropTarget): the ring is then fed with the frame as the player sees it.
   Refused, or in a browser without Region Capture, it falls back to the
   canvas. A screen clip is marked `screen`: its callouts are in the picture,
   so a loop replays only its cues over it, and Pop.text is drawn while
   recording instead of being kept for the loop.
   =========================================================================== */
const REC_PRE = 1, REC_POST = 1, REC_FPS = 20, REC_W = 360, REC_H = 640;
const REC = { on: false, W: null, canvas: null, ground: "#000", ring: [], pool: [], log: [], open: null,
              inflight: new Set(), saved: 0, busy: 0, raf: 0, last: 0, screen: null, screenWhy: "" };

/* The played frame as the player sees it: this tab, cropped to it. Called in
   the Rec click itself — getDisplayMedia wants the gesture — and resolved to
   null wherever it cannot be (refused, no Region Capture). */
/* Why the screen is not recorded, said rather than swallowed — on the REC
   pane itself, with a button to ask again: a canvas clip of an end-screen
   sound shows the round, and that reads as a broken replay.

   The tab is asked for, and the played frame is cut out of it: by the
   browser (Region Capture: CropTarget, Chrome) where it can, by hand
   otherwise — the frame's box measured in the top window, this page sitting
   in the back office's iframe or not, and scaled to the captured picture.
   Anything but THIS TAB shared cannot be cut, and is said so. */
async function recScreen() {
  const md = navigator.mediaDevices;
  REC.screenWhy = "";
  if (!md || !md.getDisplayMedia) { REC.screenWhy = "this browser cannot capture the screen"; return null; }
  const fp = document.featurePolicy || document.permissionsPolicy;
  if (fp && fp.allowsFeature && !fp.allowsFeature("display-capture")) {
    REC.screenWhy = "the frame this page is in may not capture the screen — reload the back office (make lab), or open /sound on its own";
    return null;
  }
  REC.screenWhy = "asking — share THIS TAB in the browser's prompt";
  recInfo();
  let stream = null;
  try {
    stream = await md.getDisplayMedia({ video: { frameRate: REC_FPS }, audio: false, preferCurrentTab: true, selfBrowserSurface: "include" });
  } catch (e) {
    console.warn("[rec] getDisplayMedia:", e);
    REC.screenWhy = e && e.name === "NotAllowedError" ? "the screen share was refused or dismissed" : "the screen share failed: " + ((e && (e.message || e.name)) || e);
    return null;
  }
  const track = stream.getVideoTracks()[0];
  const surface = track.getSettings ? track.getSettings().displaySurface : "";
  if (surface && surface !== "browser") {
    stream.getTracks().forEach((t) => t.stop());
    REC.screenWhy = "a " + surface + " was shared — share THIS TAB, so the played frame can be cut out of it";
    return null;
  }
  let cropped = false;
  if (window.CropTarget && track.cropTo) {
    try { await track.cropTo(await CropTarget.fromElement(document.querySelector(".fit.rec"))); cropped = true; }
    catch (e) { console.warn("[rec] cropTo, cut by hand instead:", e); }
  }
  const video = Object.assign(document.createElement("video"), { muted: true, playsInline: true });
  video.srcObject = stream;
  try { await video.play(); } catch (e) { console.warn("[rec] video.play:", e); }
  track.onended = () => {
    if (REC.screen && REC.screen.stream === stream) {
      REC.screen = null; REC.screenWhy = "the screen share was stopped"; recInfo();
    }
  };
  REC.screenWhy = "";
  return { stream, video, cropped };
}
/* The played frame's box in the captured picture, for a capture the browser
   did not crop: its box in the top window (through every same-origin frame
   this page sits in), scaled from that window's viewport to the video. */
function recCut(video) {
  const box = document.querySelector(".fit.rec").getBoundingClientRect();
  let x = box.left, y = box.top, w = window;
  try {
    while (w !== w.top && w.frameElement) {
      const fe = w.frameElement, fr = fe.getBoundingClientRect();
      x += fr.left + fe.clientLeft; y += fr.top + fe.clientTop;
      w = w.parent;
    }
  } catch (e) {}
  const kx = video.videoWidth / w.innerWidth, ky = video.videoHeight / w.innerHeight;
  return [x * kx, y * ky, box.width * kx, box.height * ky];
}
function recScreenStop() {
  if (REC.screen) REC.screen.stream.getTracks().forEach((t) => t.stop());
  REC.screen = null;
}
const recFrame = el("rec-frame");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function recToggle(on) {
  REC.on = on === undefined ? !REC.on : !!on;
  el("btn-rec").classList.toggle("on", REC.on);
  document.body.classList.toggle("rec", REC.on);
  cancelAnimationFrame(REC.raf);
  if (REC.on) {
    loopStop();
    // First, in the click: the browser asks once, and the crop needs the frame on screen.
    recScreen().then((sc) => {
      if (!REC.on) { if (sc) sc.stream.getTracks().forEach((t) => t.stop()); return; }
      REC.screen = sc;
      recInfo();
      clearInterval(REC.asking);
      note(sc ? "play — the frame is recorded as you see it, DOM included; every cue with no clip yet (or only a canvas one) is captured"
              : "canvas only — " + REC.screenWhy + ". The DOM (HUD, callouts, the end screen) will not be in the clips");
    });
    recLoad();
    REC.raf = requestAnimationFrame(recTick);
    // The prompt can take a while: the bar says it is waiting rather than "canvas only".
    clearInterval(REC.asking);
    REC.asking = setInterval(recInfo, 500);
    note("share this tab in the browser's prompt — the frame is then recorded as you see it");
  } else {
    clearInterval(REC.asking);
    recScreenStop();
    recDiscard();
    REC.W = REC.canvas = null;
    recFrame.src = "about:blank";
  }
  recInfo();
  fit();
}

function recLoad() {
  recDiscard();
  REC.W = REC.canvas = null;
  // force=1: every level of the map can be started, for this load only (levels.js).
  recFrame.src = "build/" + (state.slug === "shell" ? shellGame() : state.slug) + "/index.html?first=0&lang=en&force=1";
  recLevels(0);
}

/* The level picker: filled from the played build once it is up (its climb's
   length — the template and a game with no map have none), and a pick starts
   that level's round at once, from whatever screen the frame is on. */
function recLevels(n) {
  const sel = el("rec-level");
  sel.innerHTML = n
    ? `<option value="">Level…</option>` +
      Array.from({ length: n }, (_, i) => `<option value="${i + 1}">Level ${i + 1}</option>`).join("") +
      `<option value="${n + 1}">Endless</option>`
    : `<option value="">No levels</option>`;
  sel.disabled = !n;
}

el("rec-level").onchange = () => {
  const sel = el("rec-level"), n = Number(sel.value);
  sel.value = "";
  const w = recFrame.contentWindow, L = w && w.__LEVELS__;
  if (!n || !L || !L.play) return;
  // A round under way is taken down by startGame itself (bootstrap.js): no score, no end screen.
  recDiscard();
  L.play(n);
  try { w.focus(); } catch (e) {}
  note(n > L.count() ? "endless run started" : "level " + n + " started");
};

// The colour under the canvas: the SKIN's --bg when it is a plain colour, the frame's otherwise.
function groundOf(w) {
  const d = w.document;
  const tok = w.getComputedStyle(d.documentElement).getPropertyValue("--bg").trim();
  if (/^(#|rgb|hsl)/.test(tok)) return tok;
  for (const n of [d.getElementById("frame"), d.getElementById("stage"), d.body]) {
    if (!n) continue;
    const bg = w.getComputedStyle(n).backgroundColor;
    if (bg && bg !== "transparent" && !/rgba\(.*,\s*0\)$/.test(bg)) return bg;
  }
  return "#000";
}

recFrame.addEventListener("load", () => {
  if (!REC.on) return;
  try {
    const w = recFrame.contentWindow, W = w && w.__WEB__;
    if (!W) return;
    REC.W = W;
    REC.canvas = w.document.getElementById("game");
    REC.ground = groundOf(w);
    loadOffset();
    recLevels(w.__LEVELS__ && w.__LEVELS__.active() && w.__LEVELS__.count ? w.__LEVELS__.count() : 0);
    ["show", "text"].forEach((m) => hook(W.Pop, m, "Pop." + m));
    hook(W.Notify, "say", "Notify.say");
    ["clip", "cue", "beep", "arp", "ui"].forEach((m) => hook(W.Sound, m, "Sound." + m));
    w.document.addEventListener("mousedown", () => closeFileMenu());
    try { w.focus(); } catch (e) {}
  } catch (e) { note("rec: the build did not load — " + e.message); }
});

function hook(obj, meth, name) {
  const orig = obj && obj[meth];
  if (typeof orig !== "function" || orig.__lab) return;
  const f = function () {
    if (REC.on) recSaw(name, new Error().stack);
    // The number is fired live over a canvas loop: drawn here, it would be baked into the clip.
    // A screen clip has the callouts in the picture and replays none, so there it is drawn.
    if (name === "Pop.text" && !REC.screen) return;
    return orig.apply(this, arguments);
  };
  f.__lab = true;
  obj[meth] = f;
}

function callAt(name, line) {
  const pool = state.data.calls.filter((c) => c.name === name && !c.inherited && c.checkId);
  let best = null;
  for (const c of pool) {
    const d = Math.abs(c.line - line);
    if (d <= 2 && (!best || d < best.d)) best = { c, d };
  }
  return best && best.c;
}

// A frame of a shared built script → the shell row of that source line.
function shellAt(name, file, line) {
  const e = (state.shellMap || []).find((x) => x.file === file && line >= x.from && line < x.from + x.lines);
  if (!e) return null;
  const at = line - e.from + 1;
  let best = null;
  for (const c of recCalls()) {
    if (!c.shell) continue;
    if (c.where !== e.where || c.name !== name) continue;
    const d = Math.abs(c.line - at);
    if (d <= 2 && (!best || d < best.d)) best = { c, d };
  }
  return best && best.c;
}

function recSaw(name, stack) {
  if (state.offset == null || !state.data) return;
  /* The frames, in any engine's spelling: Chrome opens on an "Error" line and
     writes "at f (url:l:c)", Firefox and Safari open on the first frame and
     write "f@url:l:c". So the lines that end on a location are kept — [0] is
     the wrapper, [1] whoever called it — rather than counted from the top. */
  const frames = String(stack).split("\n").filter((l) => /:\d+:\d+\)?\s*$/.test(l));
  const m = /\/game\.[0-9a-f]+\.js:(\d+):\d+/.exec(frames[1] || "");
  const sh = !m && /\/((?:engine|boot)\.[0-9a-f]+\.js):(\d+):\d+/.exec(frames[1] || "");
  const call = m ? callAt(name, Number(m[1]) + state.offset) : sh ? shellAt(name, sh[1], Number(sh[2])) : null;
  if (!call) return;
  const t = performance.now();
  REC.log.push({ id: call.checkId, name: call.name, line: call.line, fn: call.fn || "", t });
  if (REC.log.length > 400) REC.log.splice(0, 200);
  if (call.kind !== "sound") return;
  // The level it fired on, kept for its card when it is a lower one than the card says.
  if (!call.shell && call.sound) {
    const L = recFrame.contentWindow && recFrame.contentWindow.__LEVELS__, lv = L && L.current ? L.current() : 0;
    const was = (state.stages || {})[call.sound];
    if (lv >= 1 && (!was || lv < was)) {
      (state.stages = state.stages || {})[call.sound] = lv;
      paintStages();
      fetch("api/stage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game: state.slug, key: call.sound, level: lv }) }).catch(() => {});
    }
  }
  /* A cue with a clip is not captured again — unless the screen is recorded
     now and its clip is the canvas alone: that one is replaced. */
  const have = state.clips.byId && state.clips.byId[call.checkId], was = have && state.clips.clips[have];
  if ((was && (was.screen || !REC.screen)) || REC.inflight.has(call.checkId)) return;
  if (!REC.open) recOpen(t);
  REC.open.ids.add(call.checkId);
  REC.inflight.add(call.checkId);
  recInfo();
}

function recRelease(f) { if (--f.refs <= 0) REC.pool.push(f); }

function recTick(now) {
  if (!REC.on) return;
  REC.raf = requestAnimationFrame(recTick);
  if (!REC.canvas || now - REC.last < 1000 / REC_FPS - 4) return;
  REC.last = now;
  const f = REC.pool.pop() || { c: Object.assign(document.createElement("canvas"), { width: REC_W, height: REC_H }), t: 0, refs: 0 };
  const g = f.c.getContext("2d");
  g.fillStyle = REC.ground;
  g.fillRect(0, 0, REC_W, REC_H);
  const v = REC.screen && REC.screen.video;
  try {
    if (v && v.readyState >= 2 && v.videoWidth) {
      if (REC.screen.cropped) g.drawImage(v, 0, 0, REC_W, REC_H);
      else { const [sx, sy, sw, sh] = recCut(v); g.drawImage(v, sx, sy, sw, sh, 0, 0, REC_W, REC_H); }
    }
    else g.drawImage(REC.canvas, 0, 0, REC_W, REC_H);
  } catch (e) {}
  f.t = now;
  f.refs = 1;
  REC.ring.push(f);
  if (REC.open) {
    f.refs++;
    REC.open.frames.push(f);
    if (now >= REC.open.until) recClose();
  }
  while (REC.ring.length && REC.ring[0].t < now - REC_PRE * 1000 - 100) recRelease(REC.ring.shift());
}

function recOpen(t) {
  const frames = REC.ring.filter((f) => f.t >= t - REC_PRE * 1000);
  frames.forEach((f) => { f.refs++; });
  REC.open = { slug: state.slug, t0: frames.length ? frames[0].t : t, frames, until: t + REC_POST * 1000, ids: new Set(), screen: !!REC.screen };
}

function recClose() {
  const cap = REC.open;
  REC.open = null;
  if (!cap.frames.length) { cap.ids.forEach((id) => REC.inflight.delete(id)); return; }
  const t1 = cap.frames[cap.frames.length - 1].t;
  const events = REC.log.filter((e) => e.t >= cap.t0 && e.t <= t1)
    .map((e) => ({ id: e.id, name: e.name, line: e.line, fn: e.fn, t: Math.round((e.t - cap.t0)) / 1000 }));
  const claim = [...cap.ids];
  const first = events.find((e) => cap.ids.has(e.id));
  recEncode(cap, events, claim, first ? first.t : REC_PRE);
  recInfo();
}

function recDiscard() {
  if (REC.open) {
    REC.open.frames.forEach(recRelease);
    REC.open.ids.forEach((id) => REC.inflight.delete(id));
    REC.open = null;
  }
  REC.ring.forEach(recRelease);
  REC.ring = [];
}

function blobB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

async function recEncode(cap, events, claim, at) {
  REC.busy++;
  recInfo();
  try {
    const c = Object.assign(document.createElement("canvas"), { width: REC_W, height: REC_H });
    const g = c.getContext("2d");
    g.drawImage(cap.frames[0].c, 0, 0);
    const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
    const stream = c.captureStream(REC_FPS);
    const mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
    const chunks = [];
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise((r) => { mr.onstop = r; });
    mr.start();
    // Real time, each frame at the moment it was taken: the event's `at` stays true.
    const start = performance.now();
    for (const f of cap.frames) {
      const wait = start + (f.t - cap.t0) - performance.now();
      if (wait > 0) await sleep(wait);
      g.drawImage(f.c, 0, 0);
    }
    await sleep(1000 / REC_FPS);
    mr.stop();
    await stopped;
    stream.getTracks().forEach((t) => t.stop());
    const dur = (cap.frames[cap.frames.length - 1].t - cap.t0) / 1000 + 1 / REC_FPS;
    const webm = await blobB64(new Blob(chunks, { type: "video/webm" }));
    const res = await fetch("api/clip", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ game: cap.slug, webm, dur, at, events, claim, screen: cap.screen })
    }).then((r) => r.json());
    if (res.error) note("rec: " + res.error);
    else {
      REC.saved++;
      if (cap.slug === state.slug) { state.clips = res.index; paintClips(); }
    }
  } catch (e) { note("rec: " + e.message); }
  finally {
    cap.frames.forEach(recRelease);
    claim.forEach((id) => REC.inflight.delete(id));
    REC.busy--;
    recInfo();
  }
}

// The REC pane says what it records, and why not the screen when it is not.
function recState() {
  const box = el("rec-state");
  if (!box) return;
  if (!REC.on) { box.className = "lang"; box.textContent = "Rec — play; every cue not yet seen is captured"; return; }
  if (REC.screen) { box.className = "lang ok"; box.textContent = "Rec · screen — the frame as you see it, DOM included"; return; }
  if (/^asking/.test(REC.screenWhy)) { box.className = "lang wait"; box.textContent = "Rec · " + REC.screenWhy; return; }
  box.className = "lang bad";
  box.innerHTML = `Rec · canvas only — ${esc(REC.screenWhy || "no screen capture")}. The HUD, the callouts and the end screen will not be in the clips. ` +
    `<button class="act sm" id="rec-share">Share the screen</button>`;
  el("rec-share").onclick = () => {
    recScreen().then((sc) => { if (!REC.on) { if (sc) sc.stream.getTracks().forEach((t) => t.stop()); return; } REC.screen = sc; recInfo(); });
  };
}

function recInfo() {
  recState();
  el("rec-info").innerHTML = REC.on || REC.busy
    ? `<b>${REC.saved}</b> captured` + (REC.on ? (REC.screen ? " · screen" : /^asking/.test(REC.screenWhy) ? " · asking for the screen…" : ` · <span title="${esc(REC.screenWhy || "no screen capture")}" style="color:#ffb648;cursor:help">canvas only</span>`) : "") + (REC.open ? " · recording" : "") + (REC.busy ? " · encoding " + REC.busy : "")
    : "";
}

el("btn-rec").onclick = () => recToggle();

/* ===========================================================================
   AUTO REC: the same capture with nobody playing (tools/lab/auto-rec.mjs). A
   headless Chrome walks the levels with Find stages' blind pilot and films
   every callout, notice and cue still without a clip — the whole page, so a
   clip is `screen`, its callouts in the picture. The server runs it in the
   background, one game at a time; the page polls and the rows fill in.
   =========================================================================== */
const AUTO = { timer: 0, clips: -1, was: null };
function autoLoad() {
  const slug = state.slug;
  clearTimeout(AUTO.timer);
  fetch("api/auto-rec?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((o) => {
    if (slug !== state.slug) return;
    const a = (o && o.auto) || null, running = !!(a && a.game === slug);
    if (a && a.clips !== AUTO.clips) {
      AUTO.clips = a.clips;
      fetch("api/clips?game=" + encodeURIComponent(slug)).then((r) => r.json()).then((idx) => {
        if (slug !== state.slug || !idx || !idx.clips) return;
        state.clips = idx;
        paintClips();
      }).catch(() => {});
    }
    if (AUTO.was === slug && !running && a) {
      note("auto rec: " + a.clips + " clip" + (a.clips === 1 ? "" : "s") + ", " + a.left + " line" + (a.left === 1 ? "" : "s") +
        " never fired under the pilot" + (a.error ? " — " + a.error : "") + (a.left ? " — Rec and play those yourself" : ""));
    }
    AUTO.was = running ? slug : null;
    autoPaint(a, running, o && o.busy);
    if (running || (o && o.busy)) AUTO.timer = setTimeout(autoLoad, 3000);
  }).catch(() => {});
}
function autoPaint(a, running, busy) {
  const b = el("btn-auto");
  b.hidden = state.slug === "template" || state.slug === "shell";
  b.classList.toggle("on", running);
  b.disabled = running || !!busy;
  b.textContent = running
    ? "Auto rec · level " + (a.level || 0) + " (" + (a.done || 0) + "/" + (a.count || "?") + ") · " + a.clips + " clips · " + a.left + " left"
    : "Auto rec";
  b.title = busy && !running ? "Auto rec is playing " + busy + " — one game at a time"
    : running ? "a headless Chrome is playing the levels — the rows fill in as their clips land"
    : "play every level in a headless browser, a blind pilot pressing at random, and film every callout, notice and cue with no clip yet — the whole page, a second either side — several minutes" +
      (a && a.over === state.slug ? " · last run: " + a.clips + " clips, " + a.left + " never fired" + (a.error ? ", " + a.error : "") : "");
}
el("btn-auto").onclick = () => {
  fetch("api/auto-rec", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game: state.slug }) })
    .then((r) => r.json()).then((o) => {
      if (o.error) { note("auto rec: " + o.error); return; }
      note("auto rec started: " + o.wanted + " line" + (o.wanted > 1 ? "s" : "") + " without a clip — the rows fill in as it plays");
      AUTO.clips = -1;
      autoLoad();
    }).catch((e) => note("auto rec failed — " + e.message));
};

fetch("api/sfx").then((r) => r.json()).then((files) => {
  state.sfx = files;
  state.sfxByStem = {};
  files.forEach((f) => { state.sfxByStem[f.stem] = f; });
  if (state.data) render();
});

/* The house kit: its gameplay variants for the clip cards' kit selector, and
   the whole of it for the kit card's editor — read again after an apply. */
function loadKit() {
  return fetch("api/kit").then((r) => r.json()).then((k) => {
    state.kit = k;
    state.kitIds = [];
    state.kitUsers = k.users || {};
    for (const [role, r] of Object.entries(k.roles || {})) {
      if (r.group !== "game") continue;
      for (const v of Object.keys(r.variants || {})) state.kitIds.push(role + "/" + v);
    }
    if (state.data) render();
    refreshKitChecked();
  }).catch(() => {});
}
loadKit();
/* ── SHOOT: the shell, filmed ────────────────────────────────────────────
   The server plays a scenario in the picked game in a headless Chrome and
   films the whole page (tools/lab/shoot-shell.mjs); each shell line it heard
   gets its clip under the shell unit, and the rows pick them up. */
function shellGame() {
  const sel = el("shell-game");
  return (sel && sel.value) || "chainring";
}
function fillShellGames() {
  const sel = el("shell-game"), list = Object.values(state.games || {}).filter((g) => g.slug !== "shell" && g.slug !== "template");
  let want = "chainring";
  try { want = localStorage.getItem("events:shellGame") || want; } catch (e) {}
  sel.innerHTML = list.map((g) => `<option value="${esc(g.slug)}"${g.slug === want ? " selected" : ""}>${esc(g.title)}</option>`).join("");
  sel.onchange = () => {
    try { localStorage.setItem("events:shellGame", sel.value); } catch (e) {}
    if (REC.on) recLoad();
  };
}
el("btn-shoot").onclick = () => {
  const btn = el("btn-shoot"), game = shellGame();
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = "Shooting…";
  note("filming the shell in " + game + " — three stars, the end screen, the gifts, a missed objective (~40 s)");
  fetch("api/shoot-shell", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game }) })
    .then((r) => r.json())
    .then((res) => {
      if (res.error) { note("shoot: " + res.error); return; }
      if (state.slug === "shell") { state.clips = res.index; paintClips(); }
      note(res.clips + " clips filmed in " + game + ", " + res.heard.length + " shell lines heard — ↻ on a line loops it");
    })
    .catch((e) => note("shoot failed: " + e.message))
    .finally(() => { btn.disabled = false; btn.textContent = "Shoot"; });
};

fetch("api/games").then((r) => r.json()).then((list) => {
  state.games = {};
  list.forEach((g) => { state.games[g.slug] = g; state.status[g.slug] = g.status; });
  picker.order = list.map((g) => g.slug);
  fillShellGames();
  const saved = localStorage.getItem("events:game");
  picker.value = list.some((g) => g.slug === saved) ? saved : list[0].slug;
  drawPicker();
  load(picker.value);
});

/* --- APPLY — the one thing on this page that writes ----------------------
   What the rows changed goes to the server as a plan, never as a patch: the
   page names the call by LINE and by NAME, and tools/lab/apply-events.mjs
   re-reads the source and splices the argument itself. So a file that moved
   under the bench is refused by name instead of being written over blind.

   The write trips the server's watcher, which rebuilds and reloads the page —
   which is why the report is parked in sessionStorage and read back on the way
   in. It is the only record of what was refused.                            */
function applyPlan() {
  const calls = [];
  for (const [k, set] of Object.entries(state.pending.calls)) {
    const [line, name] = k.split("|");
    if (Object.keys(set).length) calls.push({ line: Number(line), name, set });
  }
  const sfx = Object.entries(state.pending.sfx).map(([key, v]) => ({ key, file: v.file, len: v.len }));
  const kill = {
    calls: Object.values(state.pending.kill.calls),
    clips: Object.keys(state.pending.kill.clips)
  };
  /* The version always moves with the source — CLAUDE.md, and it is the number
     the title screen signs itself with, so a build nobody can name is worse
     than a patch number nobody reads. There is no switch for it here. */
  const kit = Object.entries(state.pending.kit || {}).map(([key, id]) => ({ key, id }));
  /* A line split off: its call names the new key (the `clip` argument), and
     the manifest maps that key to the variant its old key ships with. */
  for (const s of Object.values(state.pending.split || {})) {
    let c = calls.find((x) => x.line === s.line && x.name === s.name);
    if (!c) calls.push(c = { line: s.line, name: s.name, set: {} });
    c.set = Object.assign({}, c.set, { clip: s.to });
    if (!kit.some((x) => x.key === s.to)) kit.push({ key: s.to, id: s.id, split: true });
  }
  // The kit variants edited on their cards: written to kit.json and re-cut before the rest.
  const roles = Object.keys(state.pending.roles || {}).filter(kitDirty).map((id) => ({ id, takes: state.pending.roles[id].takes }));
  return { game: state.slug, calls, sfx, kill, kit, roles, bump: true };
}

function showReport(r) {
  const box = el("report");
  if (!r) { box.innerHTML = ""; fit(); return; }
  if (r.error) { box.innerHTML = `<div class="no">apply failed — ${esc(r.error)}</div>`; return; }
  const seen = {};
  const lines = [];
  for (const a of r.applied || []) {
    lines.push(`<div class="ok">✓ ${esc(a.what)} → ${esc(a.value)}</div>`);
    // Several changes land on one line; the line as it now reads is printed once.
    if (a.after && !seen[a.at]) { seen[a.at] = 1; lines.push(`<span class="at">${a.at}: ${esc(a.after)}</span>`); }
  }
  for (const w of r.skipped || []) lines.push(`<div class="no">! ${esc(w)}</div>`);
  if (r.version) lines.push(`<div class="ver">version → ${esc(r.version)}</div>`);
  if (!lines.length) lines.push(`<div class="no">nothing to apply</div>`);
  box.innerHTML = lines.join("");
  fit();
}

function applyNow() {
  const plan = applyPlan();
  const game = plan.calls.length || plan.sfx.length || plan.kill.calls.length || plan.kill.clips.length || plan.kit.length;
  if (!game && !plan.roles.length) return;
  const btn = el("btn-apply");
  btn.disabled = true;
  btn.textContent = plan.sfx.length || plan.roles.length ? "Cutting…" : "Writing…";
  note("writing " + (plan.roles.length ? "the kit" + (game ? " and " : "") : "") +
    (!game ? "" : (plan.game === "template" ? "template" : "games/" + plan.game) + (plan.calls.length || plan.sfx.length || plan.kill.calls.length || plan.kill.clips.length ? "/game.js…" : "/manifest.json…")));
  fetch("api/apply", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(plan)
  })
    .then((r) => r.json())
    .then((r) => {
      state.pending = EMPTY_PENDING();
      try { sessionStorage.setItem("events:report", JSON.stringify(r)); } catch (e) {}
      showReport(r);
      note(r.written || (plan.roles.length && !r.error) ? "written — rebuilding" : "nothing written");
      countPending();
      if (plan.roles.length) loadKit(); else render();
    })
    .catch((e) => { note("apply failed: " + e.message); countPending(); });
}

el("btn-apply").onclick = applyNow;
try {
  const saved = sessionStorage.getItem("events:report");
  if (saved) showReport(JSON.parse(saved));
} catch (e) {}

el("btn-reload").onclick = () => load(state.slug);

/* The report is the only thing on the stage that outlives its moment. Click
   it away. */
el("report").onclick = () => {
  showReport(null);
  try { sessionStorage.removeItem("events:report"); } catch (e) {}
};

window.addEventListener("resize", fit);
fit();
</script>
</body>
</html>
