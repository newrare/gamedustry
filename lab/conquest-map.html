<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — conquest map looks</title>
<meta name="lab-group" content="css">
<style>
/* ===========================================================================
   CONQUEST MAP LOOKS — ten ways to paint the world of
   prototype/conquest-ticks.html, and ten ways to draw an order on it, any
   arrow on any map.

   The map is not drawn from polygons. It is SHADED, pixel by pixel, out of a
   few fields computed once over the 720x1280 frame:
     - sdf  signed distance to the coast (+ on land), from a distance transform
            of a land mask made of noisy blobs;
     - e    distance to the nearest region border (a domain-warped Voronoi, so
            borders wander like real ones);
     - f    distance to the nearest region of ANOTHER owner (the camps' front);
     - h    a height noise, g a fine grain.
   Every look is a shader over those fields — porcelain seams, ink washes,
   neon fronts, hill shading, low-poly facets, a hex board, a dot matrix,
   paper terraces, soft 3D, stained glass — which is what a canvas game would
   bake into its map layer once per level. Units, markers and the arrows are
   drawn on top every frame, the arrows animated.

   The scene: blue (south, the player) and red (north, the AI), the neutral
   archipelago between them, the player's orders (two attacks, a
   reinforcement, a landing), the red orders a spy revealed (faded, with the
   eye), a red column two ticks away, and the clash at Esker.

   Views: One (the map and the arrow picked, at 2x), Maps (the ten maps with
   the arrow picked), Arrows (the ten arrows on the map picked, zoomed on the
   orders). A click on a frame opens it. Nothing here ships.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  min-height:100vh;
  display:flex;
  background:#0b0b12;
  color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

#panel {
  flex:0 0 300px;
  height:100vh; overflow:auto;
  padding:22px 18px;
  background:#12121c;
  border-right:1px solid #23233a;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel h2 { margin:18px 0 8px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#8b8ba7; }
#panel p.hint { margin:8px 0 16px; font-weight:500; font-size:12px; color:#8b8ba7; }
.seg { display:flex; gap:6px; }
.seg button, .list button {
  flex:1; padding:7px 10px;
  background:#1b1b2a; color:#e8e6f5; border:1px solid #2c2c47; border-radius:8px;
  font:inherit; cursor:pointer; text-align:left;
}
.seg button { text-align:center; }
.seg button.on, .list button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
.list { display:flex; flex-direction:column; gap:5px; }
.list button b { display:block; font-size:13px; }
.list button span { display:block; font-weight:500; font-size:11px; opacity:.75; }
.tog { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:#c9c9e0; cursor:pointer; }
.tog input { accent-color:#7ea6ff; }

#stage {
  flex:1; height:100vh; overflow:auto;
  padding:24px;
  background-image:
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%),
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%);
  background-size:32px 32px;
  background-position:0 0, 16px 16px;
}
#stage.one { display:flex; align-items:center; justify-content:center; }
#stage.one .fr { height:calc(100vh - 48px); }
#stage.one canvas { height:calc(100% - 40px); width:auto; }
#stage.maps, #stage.arrows { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:22px 18px; align-content:start; }
#stage.maps .fr, #stage.arrows .fr { cursor:pointer; }
#stage.maps canvas:hover, #stage.arrows canvas:hover { outline:3px solid #7ea6ff; }
#stage .busy { margin:auto; color:#8b8ba7; font-size:15px; }
.fr { display:flex; flex-direction:column; gap:8px; }
.fr canvas { display:block; width:100%; border-radius:14px; box-shadow:0 18px 50px rgba(0,0,0,.5); }
.fr figcaption { font-size:12px; color:#9c9cba; font-weight:500; }
.fr figcaption b { color:#e8e6f5; font-size:13px; }
</style>
</head>
<body>

<div id="panel">
  <h1>Conquest map</h1>
  <p class="hint">Ten shaded maps and ten animated arrows for prototype/conquest-ticks.html, any arrow on any map.</p>

  <div class="seg">
    <button data-v="one">One</button>
    <button data-v="maps">Maps</button>
    <button data-v="arrows">Arrows</button>
  </div>

  <h2>Map</h2>
  <div class="list" id="maps"></div>

  <h2>Arrow</h2>
  <div class="list" id="arrows"></div>

  <h2>Show</h2>
  <label class="tog"><input type="checkbox" id="t-anim" checked> Animate</label>
  <label class="tog"><input type="checkbox" id="t-names"> Region names</label>
  <label class="tog"><input type="checkbox" id="t-hud" checked> Top bar</label>
</div>

<div id="stage"></div>

<script>
(function () {
  "use strict";

  const W = 720, H = 1280;

  /* ==========================================================================
     THE WORLD — land blobs, regions, units, orders.
     ========================================================================== */
  // x, y, radius — a noisy union of these is the land.
  const BLOBS = [
    [150, 260, 115], [305, 225, 125], [470, 245, 120], [610, 310, 105], [225, 400, 115], [420, 405, 120],
    [580, 455, 95], [300, 525, 85], [60, 520, 30],
    [110, 665, 62], [265, 690, 60], [430, 640, 72], [605, 705, 72], [515, 755, 40],
    [180, 905, 105], [370, 880, 115], [565, 920, 105], [255, 1045, 110], [445, 1060, 112], [610, 1065, 72],
    [350, 1185, 82], [175, 1160, 58],
    [675, 560, 32], [650, 1210, 30], [70, 800, 24]
  ];

  // x, y, owner (n b r), name, marker
  const REG = [
    [150, 255, "r", "Norvik", null], [310, 225, "r", "Aldmar", "cap"], [470, 245, "r", "Kestra", null],
    [610, 315, "r", "Varos", "city"], [215, 405, "r", "Myrr", null], [420, 400, "r", "Tolen", "fort"],
    [580, 455, "r", "Ostra", "iron"], [290, 530, "r", "Brann", null],
    [110, 665, "n", "Brevin", "grain"], [265, 690, "n", "Calder", "city"], [430, 645, "n", "Duna", "city"],
    [605, 705, "n", "Esker", "gold"],
    [180, 905, "b", "Falun", null], [370, 885, "b", "Garr", "fort"], [565, 920, "b", "Holm", "city"],
    [255, 1050, "n", "Isel", "grain"], [445, 1065, "b", "Jarrow", "cap"], [610, 1065, "b", "Kalm", "port"],
    [350, 1185, "b", "Lund", null], [675, 560, "n", "Mora", "oil"]
  ].map(function (r, i) {
    return { i: i, x: r[0], y: r[1], o: r[2] === "b" ? 1 : r[2] === "r" ? 2 : 0, name: r[3], mk: r[4] };
  });

  const FLEET = [55, 1000];
  const UNITS = [
    { r: 0, k: "inf", n: 3 }, { r: 1, k: "art", n: 2 }, { r: 2, k: "inf", n: 2 }, { r: 3, k: "inf", n: 2 },
    { r: 4, k: "inf", n: 4 }, { r: 5, k: "inf", n: 7 }, { r: 6, k: "cav", n: 5 }, { r: 7, k: "inf", n: 3 },
    { r: 8, k: "inf", n: 1 }, { r: 9, k: "inf", n: 3 }, { r: 10, k: "inf", n: 2 }, { r: 11, k: "inf", n: 2 },
    { r: 15, k: "inf", n: 2 }, { r: 19, k: "inf", n: 1 },
    { r: 12, k: "inf", n: 5 }, { r: 13, k: "inf", n: 6, gen: true }, { r: 14, k: "cav", n: 4 }, { r: 16, k: "art", n: 3 },
    { r: 17, k: "inf", n: 2 }, { r: 18, k: "inf", n: 1 }, { at: FLEET, o: 1, k: "fleet", n: 3 }
  ];

  const ORDERS = [
    { a: 13, b: 9, o: 1, n: 6, bend: -0.15 },
    { a: 14, b: 11, o: 1, n: 4, bend: 0.15 },
    { a: 16, b: 13, o: 1, n: 3, bend: 0.25, thin: true },
    { a: FLEET, b: 8, o: 1, n: 3, bend: -0.12 },
    { a: 6, b: 11, o: 2, n: 5, bend: -0.2, ghost: true },
    { a: 4, b: 8, o: 2, n: 4, bend: 0.2, ghost: true }
  ];
  const MARCH = { a: 1, b: 10, o: 2, n: 4, bend: 0.12, at: 0.55, eta: "2 ticks" };
  const CLASH = 11;
  const ZOOM = [20, 360, 680, 740];

  /* ==========================================================================
     NOISE
     ========================================================================== */
  const VAL = new Float32Array(256), PERM = new Uint8Array(512);
  (function () {
    let s = 1234567;
    const r = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < 256; i++) { VAL[i] = r(); PERM[i] = i; }
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)), t = PERM[i]; PERM[i] = PERM[j]; PERM[j] = t; }
    for (let i = 0; i < 256; i++) PERM[i + 256] = PERM[i];
  })();
  function vn(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = VAL[PERM[PERM[X] + Y]], b = VAL[PERM[PERM[X + 1] + Y]], c = VAL[PERM[PERM[X] + Y + 1]], d = VAL[PERM[PERM[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, oct) {
    let s = 0, amp = 0.5, tot = 0;
    for (let o = 0; o < oct; o++) { s += vn(x, y) * amp; tot += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
    return s / tot;
  }
  const hash2 = function (a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  const sstep = function (a, b, v) { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };

  /* ==========================================================================
     FIELDS — computed once per resolution, shared by every look.
     ========================================================================== */
  function edt1d(f, n, d, v, z) {
    let k = 0;
    v[0] = 0; z[0] = -1e20; z[1] = 1e20;
    for (let q = 1; q < n; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
    }
    k = 0;
    for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  }
  // Squared distance from every pixel to the nearest pixel whose mask equals target.
  function edt(mask, w, h, target) {
    const g = new Float32Array(w * h), n = Math.max(w, h);
    const f = new Float32Array(n), d = new Float32Array(n), v = new Int32Array(n), z = new Float32Array(n + 1);
    for (let i = 0; i < w * h; i++) g[i] = mask[i] === target ? 0 : 1e20;
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = g[y * w + x];
      edt1d(f, h, d, v, z);
      for (let y = 0; y < h; y++) g[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = g[y * w + x];
      edt1d(f, w, d, v, z);
      for (let x = 0; x < w; x++) g[y * w + x] = d[x];
    }
    return g;
  }

  const FIELDS = {};
  function fields(res) {
    if (FIELDS[res]) return FIELDS[res];
    const w = W * res, h = H * res, N = w * h, n = REG.length;
    const land = new Uint8Array(N), id = new Uint8Array(N), own = new Uint8Array(N);
    const e = new Float32Array(N), f = new Float32Array(N), hh = new Float32Array(N), gr = new Float32Array(N);
    const SX = REG.map(function (r) { return r.x; }), SY = REG.map(function (r) { return r.y; }), SO = REG.map(function (r) { return r.o; });
    const DD = REG.map(function (a) { return REG.map(function (b) { return Math.hypot(a.x - b.x, a.y - b.y) || 1; }); });
    for (let py = 0; py < h; py++) {
      const y = (py + 0.5) / res;
      for (let px = 0; px < w; px++) {
        const x = (px + 0.5) / res, i = py * w + px;
        const wx = x + (fbm(x * 0.006 + 3.1, y * 0.006 + 7.7, 2) - 0.5) * 80;
        const wy = y + (fbm(x * 0.006 + 11.3, y * 0.006 + 1.9, 2) - 0.5) * 80;
        let m = -9;
        for (let k = 0; k < BLOBS.length; k++) {
          const b = BLOBS[k], dx = wx - b[0], dy = wy - b[1], v = 1 - Math.sqrt(dx * dx + dy * dy) / b[2];
          if (v > m) m = v;
        }
        land[i] = m + (fbm(x * 0.022, y * 0.022, 3) - 0.5) * 0.45 > 0 ? 1 : 0;
        const rx = x + (wx - x) * 0.55, ry = y + (wy - y) * 0.55;
        let b1 = 0, d1 = 1e12, b2 = 0, d2 = 1e12;
        for (let k = 0; k < n; k++) {
          const dx = rx - SX[k], dy = ry - SY[k], dd = dx * dx + dy * dy;
          if (dd < d1) { d2 = d1; b2 = b1; d1 = dd; b1 = k; } else if (dd < d2) { d2 = dd; b2 = k; }
        }
        const o1 = SO[b1];
        let bo = -1, dO = 1e12;
        for (let k = 0; k < n; k++) {
          if (SO[k] === o1) continue;
          const dx = rx - SX[k], dy = ry - SY[k], dd = dx * dx + dy * dy;
          if (dd < dO) { dO = dd; bo = k; }
        }
        id[i] = b1; own[i] = o1;
        e[i] = (d2 - d1) / (2 * DD[b1][b2]);
        f[i] = bo < 0 ? 999 : (dO - d1) / (2 * DD[b1][bo]);
        hh[i] = fbm(x * 0.011, y * 0.011, 4);
        gr[i] = vn(x * 0.31, y * 0.31) * 0.55 + vn(x * 1.1 + 50, y * 1.1) * 0.45;
      }
    }
    const toSea = edt(land, w, h, 0), toLand = edt(land, w, h, 1), sdf = new Float32Array(N);
    for (let i = 0; i < N; i++) sdf[i] = land[i] ? (Math.sqrt(toSea[i]) - 0.5) / res : -(Math.sqrt(toLand[i]) - 0.5) / res;
    FIELDS[res] = { res: res, w: w, h: h, sdf: sdf, e: e, f: f, id: id, own: own, ht: hh, g: gr };
    return FIELDS[res];
  }
  function S(F, arr, x, y) {
    let px = (x * F.res) | 0, py = (y * F.res) | 0;
    if (px < 0) px = 0; else if (px >= F.w) px = F.w - 1;
    if (py < 0) py = 0; else if (py >= F.h) py = F.h - 1;
    return arr[py * F.w + px];
  }

  /* ==========================================================================
     COLOUR HELPERS
     ========================================================================== */
  const hx = function (h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; };
  const WHITE = [255, 255, 255], BLACK = [0, 0, 0];
  const set = function (c, a) { c[0] = a[0]; c[1] = a[1]; c[2] = a[2]; };
  const mixTo = function (c, a, t) { if (t <= 0) return; if (t > 1) t = 1; c[0] += (a[0] - c[0]) * t; c[1] += (a[1] - c[1]) * t; c[2] += (a[2] - c[2]) * t; };
  const mul = function (c, k) { c[0] *= k; c[1] *= k; c[2] *= k; };
  const add = function (c, a, k) { c[0] += a[0] * k; c[1] += a[1] * k; c[2] += a[2] * k; };
  const lerp3 = function (a, b, t, c) { c[0] = a[0] + (b[0] - a[0]) * t; c[1] = a[1] + (b[1] - a[1]) * t; c[2] = a[2] + (b[2] - a[2]) * t; };
  function ramp(stops, t, c) {
    if (t <= stops[0][0]) { set(c, stops[0][1]); return; }
    for (let k = 1; k < stops.length; k++) {
      if (t <= stops[k][0]) { lerp3(stops[k - 1][1], stops[k][1], (t - stops[k - 1][0]) / (stops[k][0] - stops[k - 1][0]), c); return; }
    }
    set(c, stops[stops.length - 1][1]);
  }
  const css = function (a, al) { return al == null ? "rgb(" + (a[0] | 0) + "," + (a[1] | 0) + "," + (a[2] | 0) + ")" : "rgba(" + (a[0] | 0) + "," + (a[1] | 0) + "," + (a[2] | 0) + "," + al + ")"; };
  const mixHex = function (a, b, t) { const A = hx(a), B = hx(b); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]; };

  // A height field shaded by one light; returns the lambert term per pixel.
  function lightField(F, Hf, scale, L) {
    const w = F.w, h = F.h, out = new Float32Array(w * h), r = F.res;
    const ll = Math.hypot(L[0], L[1], L[2]), lx = L[0] / ll, ly = L[1] / ll, lz = L[2] / ll;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        const hxv = (Hf[x < w - 1 ? i + 1 : i] - Hf[x > 0 ? i - 1 : i]) * r / 2 * scale;
        const hyv = (Hf[y < h - 1 ? i + w : i] - Hf[y > 0 ? i - w : i]) * r / 2 * scale;
        const nl = Math.hypot(hxv, hyv, 1);
        out[i] = (-hxv * lx - hyv * ly + lz) / nl;
      }
    }
    return out;
  }

  /* ==========================================================================
     THE TEN MAPS — each a shader factory over the fields, plus the dress
     of what is drawn on top (chip, marker, label, HUD, font, camp colours).
     A factory returns { land, sea } (blended across the coast) or { all }.
     ========================================================================== */
  const MAPS = [];

  // ---- 1. Porcelain ---------------------------------------------------------
  MAPS.push({
    key: "porcelain", name: "Porcelain", desc: "White glazed tiles, soft seams, a thin coloured front, a pale sea with rings.",
    font: "'Avenir Next', 'Helvetica Neue', sans-serif", blue: "#3c6cf0", red: "#e8503e", chip: "porcelain",
    ink: "#2b3445", labelBg: "#ffffff", mkBg: "#ffffff", mkInk: "#2b3445", hud: { bg: "rgba(255,255,255,.92)", ink: "#2b3445", r: 26 },
    shader: function (F) {
      const sea0 = hx("#e8eef3"), sea1 = hx("#b9c8d5"), n = hx("#faf8f4"), b = hx("#dce6fc"), r = hx("#fce0db"), bS = hx("#3c6cf0"), rS = hx("#e8503e");
      return {
        sea: function (i, x, y, c) {
          const s = F.sdf[i];
          lerp3(sea0, sea1, clamp01(-s / 180), c);
          if (-s < 90) { const rr = (-s) % 26; mixTo(c, WHITE, (1 - sstep(0.4, 1.4, Math.abs(rr - 13))) * (1 + s / 90) * 0.6); }
          mul(c, 1 - sstep(-18, 4, S(F, F.sdf, x - 7, y - 12)) * 0.16);
        },
        land: function (i, x, y, c) {
          const s = F.sdf[i], o = F.own[i], e = F.e[i];
          set(c, o === 1 ? b : o === 2 ? r : n);
          mul(c, 1 - 0.13 * Math.exp(-Math.min(e, s) / 7));
          mul(c, 1 - 0.18 * (1 - sstep(0.5, 1.5, e)));
          if (o) mixTo(c, o === 1 ? bS : rS, 1 - sstep(2.6, 3.8, Math.min(F.f[i], s + 0.5)));
          mixTo(c, WHITE, (1 - sstep(0.8, 2.8, s)) * 0.7);
          mul(c, 0.985 + 0.03 * F.ht[i]);
        }
      };
    }
  });

  // ---- 2. Ink wash ----------------------------------------------------------
  MAPS.push({
    key: "ink", name: "Ink wash", desc: "Brush coast on rice paper, watercolour camps blooming at their edges.",
    font: "Baskerville, 'Hoefler Text', Georgia, serif", blue: "#2f4f8f", red: "#c23b26", chip: "seal",
    ink: "#26221e", labelBg: "#f7f0e2", mkBg: "#f7f0e2", mkInk: "#26221e", hud: { bg: "rgba(247,240,226,.94)", ink: "#26221e", r: 4 },
    shader: function (F) {
      const paper = hx("#f1e8d5"), paperL = hx("#f8f1e3"), ink = hx("#26221e"), wash = hx("#71879a"), blue = hx("#2f4f8f"), red = hx("#c23b26"), ochre = hx("#c9a35a");
      return {
        sea: function (i, x, y, c) {
          const s = F.sdf[i], g = F.g[i];
          set(c, paper); mul(c, 0.965 + 0.05 * g);
          mixTo(c, wash, Math.exp(s / 30) * 0.34 * (0.7 + 0.6 * g));
          for (let k = 0; k < 2; k++) {
            const tg = (k ? 36 : 17) * (0.9 + 0.25 * F.ht[i]);
            mixTo(c, ink, (1 - sstep(0.3, 1.1, Math.abs(-s - tg))) * (g > 0.45 ? 0.38 : 0) * (k ? 0.6 : 1));
          }
          const bw = 1.2 + 2.6 * F.ht[i];
          mixTo(c, ink, (1 - sstep(bw / 2 - 0.6, bw / 2 + 0.5, -s)) * 0.9);
        },
        land: function (i, x, y, c) {

    ctx.lineTo(B[0] + t[1] * hw / 2 - t[0] * (back || 0) + dx, B[1] - t[0] * hw / 2 - t[1] * (back || 0) + dy);
    for (let i = E.R.length - 1; i >= 0; i--) ctx.lineTo(E.R[i][0] + dx, E.R[i][1] + dy);

  }
  function polyline(ctx, g, s0, s1, off, step) {

  }
  function headOnly(ctx, g, hw, hl, fill, edge) {
    const s1 = g.tot - hl, B = g.pointAt(s1), t = g.tanAt(s1), tip = g.pointAt(g.tot);
    ctx.beginPath();
    ctx.moveTo(B[0] - t[1] * hw / 2, B[1] + t[0] * hw / 2); ctx.lineTo(tip[0], tip[1]); ctx.lineTo(B[0] + t[1] * hw / 2, B[1] - t[0] * hw / 2); ctx.closePath();
    if (edge) { ctx.lineWidth = 3.5; ctx.lineJoin = "round"; ctx.strokeStyle = edge; ctx.stroke(); }
    ctx.fillStyle = fill; ctx.fill();
  }

  /* ==========================================================================
     THE TEN ARROWS — ctx in design units, t in seconds, C the camp colours.
     ========================================================================== */
  const ARROWS = [
    {
      key: "brush", name: "Brush", desc: "A calligraphic stroke swelling then tapering into a swept head.",
      draw: function (ctx, g, C, t, th) {
        const s1 = g.tot - 32 * th;
        const wf = function (s) { const u = Math.min(1, s / s1); return th * (4 + 17 * Math.pow(Math.sin(u * Math.PI * 0.62), 0.9)) + Math.sin(s * 0.09) * 1.1; };
        ctx.save(); ctx.translate(2, 4); arrowShape(ctx, g, wf, 50 * th, 32 * th, 9 * th); ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fill(); ctx.restore();
        arrowShape(ctx, g, wf, 50 * th, 32 * th, 9 * th);
        ctx.fillStyle = C.base; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = C.dark; ctx.stroke();
        polyline(ctx, g, 10, s1 * 0.85, -2.5 * th); ctx.lineWidth = 2; ctx.strokeStyle = C.light; ctx.globalAlpha *= 0.6; ctx.stroke();
      }
    },
    {
      key: "ribbon", name: "Ribbon 3D", desc: "A thick band lying on the map, its side showing, light chevrons riding it.",
      draw: function (ctx, g, C, t, th) {
        const wf = function () { return 22 * th; };
        arrowShape(ctx, g, wf, 56 * th, 36 * th, 0, 0, 9 * th); ctx.fillStyle = C.dark; ctx.fill();
        arrowShape(ctx, g, wf, 56 * th, 36 * th, 0);
        const a = g.pointAt(0), b = g.pointAt(g.tot), gr = ctx.createLinearGradient(a[0], a[1], b[0], b[1]);
        gr.addColorStop(0, C.light); gr.addColorStop(1, C.base);
        ctx.fillStyle = gr; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = C.light; ctx.stroke();
        ctx.save(); ctx.clip();
        ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 3.5 * th; ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (let s = (t * 46) % 32; s < g.tot - 40 * th; s += 32) {
          const p = g.pointAt(s), tg = g.tanAt(s), k = 7 * th;
          ctx.beginPath();
          ctx.moveTo(p[0] - tg[0] * k - tg[1] * k, p[1] - tg[1] * k + tg[0] * k); ctx.lineTo(p[0], p[1]); ctx.lineTo(p[0] - tg[0] * k + tg[1] * k, p[1] - tg[1] * k - tg[0] * k);
          ctx.stroke();
        }
        ctx.restore();
      }
    },
    {
      key: "shimmer", name: "Shimmer", desc: "A solid tapered arrow with a white edge and light sweeping along it.",
      draw: function (ctx, g, C, t, th) {
        const wf = function (s) { return th * (10 + 12 * s / g.tot); };
        ctx.save(); ctx.translate(0, 5); arrowShape(ctx, g, wf, 52 * th, 34 * th, 4); ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fill(); ctx.restore();
        arrowShape(ctx, g, wf, 52 * th, 34 * th, 4);
        ctx.lineWidth = 6; ctx.lineJoin = "round"; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.fillStyle = C.base; ctx.fill();
        const p = ((t * 0.55) % 1.6) - 0.3, a = g.pointAt(0), b = g.pointAt(g.tot), gr = ctx.createLinearGradient(a[0], a[1], b[0], b[1]);
        const st = function (o, c) { if (o >= 0 && o <= 1) gr.addColorStop(o, c); };
        gr.addColorStop(0, "rgba(255,255,255,0)");
        st(p - 0.14, "rgba(255,255,255,0)"); st(p, "rgba(255,255,255,.7)"); st(p + 0.14, "rgba(255,255,255,0)");
        gr.addColorStop(1, "rgba(255,255,255,0)");
        ctx.save(); ctx.clip(); ctx.fillStyle = gr; ctx.fillRect(-50, -50, W + 100, H + 100); ctx.restore();
      }
    },
    {
      key: "march", name: "March", desc: "Bold dashes marching toward a solid head, outlined in white.",
      draw: function (ctx, g, C, t, th) {
        const s1 = g.tot - 30 * th;
        polyline(ctx, g, 0, s1);
        ctx.lineCap = "round"; ctx.setLineDash([22, 14]); ctx.lineDashOffset = -t * 52;
        ctx.lineWidth = 19 * th; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.lineWidth = 12 * th; ctx.strokeStyle = C.base; ctx.stroke();
        ctx.setLineDash([]);
        headOnly(ctx, g, 46 * th, 34 * th, C.base, "#fff");
      }
    },
    {
      key: "chevrons", name: "Chevrons", desc: "A stream of chevrons growing toward the target, flowing.",
      draw: function (ctx, g, C, t, th) {
        polyline(ctx, g, 0, g.tot - 20); ctx.lineCap = "round"; ctx.lineWidth = 20 * th; ctx.strokeStyle = C.base; ctx.globalAlpha *= 0.18; ctx.stroke(); ctx.globalAlpha /= 0.18;
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (let s = (t * 40) % 28; s < g.tot - 34 * th; s += 28) {
          const k = (0.6 + 0.55 * s / g.tot) * th, p = g.pointAt(s), tg = g.tanAt(s);
          ctx.beginPath();
          ctx.moveTo(p[0] - tg[0] * 8 * k - tg[1] * 11 * k, p[1] - tg[1] * 8 * k + tg[0] * 11 * k); ctx.lineTo(p[0] + tg[0] * 6 * k, p[1] + tg[1] * 6 * k);
          ctx.lineTo(p[0] - tg[0] * 8 * k + tg[1] * 11 * k, p[1] - tg[1] * 8 * k - tg[0] * 11 * k);
          ctx.lineWidth = 11 * k; ctx.strokeStyle = "#fff"; ctx.stroke();
          ctx.lineWidth = 6.5 * k; ctx.strokeStyle = C.base; ctx.stroke();
        }
        headOnly(ctx, g, 46 * th, 32 * th, C.base, "#fff");
      }
    },
    {
      key: "particles", name: "Particles", desc: "A comet of particles streaming along a faint track, tightening at the head.",
      draw: function (ctx, g, C, t, th) {
        polyline(ctx, g, 0, g.tot - 20); ctx.lineCap = "round"; ctx.lineWidth = 16 * th; ctx.strokeStyle = C.base; ctx.globalAlpha *= 0.2; ctx.stroke(); ctx.globalAlpha /= 0.2;
        const n = Math.round(g.tot / 8);
        for (let i = 0; i < n; i++) {
          const p = (i / n + t * 0.3) % 1, s = p * (g.tot - 24), q = g.pointAt(s), tg = g.tanAt(s), j = Math.sin(i * 91.7) * 8 * (1 - p) * th;
          ctx.beginPath(); ctx.arc(q[0] - tg[1] * j, q[1] + tg[0] * j, (1.8 + 3.4 * p) * th, 0, Math.PI * 2);
          ctx.fillStyle = i & 1 ? C.base : C.light; ctx.globalAlpha *= 0.25 + 0.75 * p; ctx.fill(); ctx.globalAlpha /= 0.25 + 0.75 * p;
        }
        headOnly(ctx, g, 40 * th, 30 * th, C.base, "#fff");
      }
    },
    {
      key: "rail", name: "Rail", desc: "A supply line: rails, sleepers and a convoy running to the front.",
      draw: function (ctx, g, C, t, th) {
        const s1 = g.tot - 30 * th;
        ctx.lineCap = "round";
        for (let s = 4; s < s1; s += 11) {
          const p = g.pointAt(s), tg = g.tanAt(s), k = 10 * th;
          ctx.beginPath(); ctx.moveTo(p[0] - tg[1] * k, p[1] + tg[0] * k); ctx.lineTo(p[0] + tg[1] * k, p[1] - tg[0] * k);
          ctx.lineWidth = 3.5; ctx.strokeStyle = C.light; ctx.stroke();
        }
        [-6, 6].forEach(function (off) { polyline(ctx, g, 0, s1, off * th); ctx.lineWidth = 2.6; ctx.strokeStyle = C.dark; ctx.stroke(); });
        for (let k = 0; k < 3; k++) {
          const s = (t * 60 + k * 22) % Math.max(1, s1 - 20) + 8, p = g.pointAt(s), tg = g.tanAt(s), a = Math.atan2(tg[1], tg[0]);
          ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(a);
          rrect(ctx, -8, -6 * th, 16, 12 * th, 4); ctx.fillStyle = k ? C.base : "#fff"; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = C.dark; ctx.stroke();
          ctx.restore();
        }
        headOnly(ctx, g, 42 * th, 30 * th, C.base, "#fff");
      }
    },
    {
      key: "front", name: "Front", desc: "An operational arrow: a wide hatched band, a swallow tail, a big head.",
      draw: function (ctx, g, C, t, th) {
        const w = 30 * th, hw = 66 * th, hl = 42 * th, s1 = g.tot - hl;
        const shape = function (dx, dy) {
          const E = edges(g, 0, s1, function () { return w; }), B = g.pointAt(s1), tg = g.tanAt(s1), tip = g.pointAt(g.tot), a = g.pointAt(0), ta = g.tanAt(0);
          ctx.beginPath();
          ctx.moveTo(a[0] + ta[0] * 14 * th + dx, a[1] + ta[1] * 14 * th + dy);
          E.L.forEach(function (p) { ctx.lineTo(p[0] + dx, p[1] + dy); });
          ctx.lineTo(B[0] - tg[1] * hw / 2 + dx, B[1] + tg[0] * hw / 2 + dy); ctx.lineTo(tip[0] + dx, tip[1] + dy);
          ctx.lineTo(B[0] + tg[1] * hw / 2 + dx, B[1] - tg[0] * hw / 2 + dy);
          for (let i = E.R.length - 1; i >= 0; i--) ctx.lineTo(E.R[i][0] + dx, E.R[i][1] + dy);
          ctx.closePath();
        };
        shape(2, 6); ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fill();
        shape(0, 0); ctx.fillStyle = C.base; ctx.fill();
        ctx.save(); ctx.clip();
        ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 5;
        const off = (t * 12) % 14;
        for (let k = -H; k < W + H; k += 14) { ctx.beginPath(); ctx.moveTo(k + off, 0); ctx.lineTo(k + off - H, H); ctx.stroke(); }
        ctx.restore();
        shape(0, 0); ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.strokeStyle = C.dark; ctx.stroke();
      }
    },
    {
      key: "tube", name: "Tube", desc: "A glossy cylinder lit from above with a shaded cone for a head, rings sliding.",
      draw: function (ctx, g, C, t, th) {
        const s1 = g.tot - 32 * th, D = hx(C.darkHex), Lc = hx(C.lightHex);
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.save(); ctx.translate(2, 6); polyline(ctx, g, 0, s1 + 4); ctx.lineWidth = 20 * th; ctx.strokeStyle = "rgba(0,0,0,.16)"; ctx.stroke(); ctx.restore();
        for (let k = 0; k <= 7; k++) {
          const f = k / 7;
          ctx.save(); ctx.translate(0, -k * 0.6 * th);
          polyline(ctx, g, 0, s1 + 4); ctx.lineWidth = (20 - k * 2.3) * th;
          ctx.strokeStyle = css([D[0] + (Lc[0] - D[0]) * f, D[1] + (Lc[1] - D[1]) * f, D[2] + (Lc[2] - D[2]) * f]); ctx.stroke();
          ctx.restore();
        }
        polyline(ctx, g, 0, s1); ctx.setLineDash([3, 24]); ctx.lineDashOffset = -t * 40; ctx.lineWidth = 18 * th; ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.stroke(); ctx.setLineDash([]);
        const B = g.pointAt(s1), tg = g.tanAt(s1), hw = 46 * th, gr = ctx.createLinearGradient(B[0] - tg[1] * hw / 2, B[1] + tg[0] * hw / 2, B[0] + tg[1] * hw / 2, B[1] - tg[0] * hw / 2);
        gr.addColorStop(0, C.light); gr.addColorStop(0.35, C.base); gr.addColorStop(1, C.dark);
        headOnly(ctx, g, hw, 32 * th, gr);
      }
    },
    {
      key: "tracks", name: "Tracks", desc: "Footprints walking to the target, the newest crisp, the oldest fading.",
      draw: function (ctx, g, C, t, th) {
        const s1 = g.tot - 30 * th, ph = (t * 0.45) % 1.35;
        let side = 1;
        for (let s = 8; s < s1; s += 14, side = -side) {
          const q = s / g.tot, a = q <= ph ? Math.max(0.35, 1 - (ph - q) * 1.1) : 0.16;
          const p = g.pointAt(s), tg = g.tanAt(s), off = side * 6 * th, x = p[0] - tg[1] * off, y = p[1] + tg[0] * off, ang = Math.atan2(tg[1], tg[0]);
          ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha *= a;
          ctx.beginPath(); ctx.ellipse(1.5, 0, 5 * th, 3.3 * th, 0, 0, Math.PI * 2); ctx.fillStyle = C.base; ctx.fill();
          ctx.beginPath(); ctx.ellipse(-5 * th, 0, 2.4 * th, 2.6 * th, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        headOnly(ctx, g, 36 * th, 28 * th, C.base, "#fff");
      }
    }
  ];

  function campColors(mp, o) {
    const base = o === 1 ? mp.blue : mp.red, A = hx(base);
    const dk = [A[0] * 0.6, A[1] * 0.6, A[2] * 0.6], lt = mixHex(base, "#ffffff", 0.45);
    const hex2 = function (a) { return "#" + a.map(function (v) { return ("0" + Math.round(v).toString(16)).slice(-2); }).join(""); };
    return { base: base, dark: css(dk), light: css(lt), darkHex: hex2(dk), lightHex: hex2(lt) };
  }

  /* ==========================================================================
     ONE FRAME
     ========================================================================== */
  function drawFrame(f, t) {
    const ctx = f.ctx, res = f.res, vb = f.vb, mp = f.mp, ar = f.ar;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(f.bmp, vb[0] * res, vb[1] * res, vb[2] * res, vb[3] * res, 0, 0, f.cv.width, f.cv.height);
    ctx.setTransform(res, 0, 0, res, -vb[0] * res, -vb[1] * res);

    // the column on its way, under everything
    ctx.save();
    polyline(ctx, MARCH.g, 0, MARCH.g.tot - 24); ctx.setLineDash([0.1, 15]); ctx.lineDashOffset = -t * 18; ctx.lineCap = "round";
    ctx.lineWidth = 8; ctx.strokeStyle = campOf(mp, 2); ctx.globalAlpha = 0.7; ctx.stroke(); ctx.setLineDash([]);
    headOnly(ctx, MARCH.g, 26, 22, campOf(mp, 2));
    ctx.restore();

    ORDERS.forEach(function (o) {
      ctx.save();
      if (o.ghost) ctx.globalAlpha = 0.5;
      ar.draw(ctx, o.g, campColors(mp, o.o), o.ghost ? t * 0.7 : t, o.thin ? 0.7 : 1);
      ctx.restore();
    });

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(f.top, vb[0] * res, vb[1] * res, vb[2] * res, vb[3] * res, 0, 0, f.cv.width, f.cv.height);
    ctx.setTransform(res, 0, 0, res, -vb[0] * res, -vb[1] * res);

    ORDERS.forEach(function (o) {
      const m = o.g.pointAt(o.g.tot * 0.45), w = o.ghost ? 62 : 40, col = campOf(mp, o.o);
      pill(ctx, mp, m[0], m[1], w, col, function (cx) {
        ctx.fillStyle = mp.ink; ctx.font = "800 20px " + mp.font; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (o.ghost) { icon(ctx, "eye", cx - 13, m[1], 18, mp.ink); ctx.fillText(o.n, cx + 13, m[1] + 1); }
        else ctx.fillText(o.n, cx, m[1] + 1);
      });
    });

    if (f.hud) hud(ctx, mp);
  }

  function hud(ctx, mp) {
    const h = mp.hud;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.22)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
    rrect(ctx, 16, 16, 688, 86, h.r); ctx.fillStyle = h.bg; ctx.fill();
    ctx.restore();
    if (h.line) { rrect(ctx, 16, 16, 688, 86, h.r); ctx.lineWidth = 1.5; ctx.strokeStyle = h.line; ctx.stroke(); }
    ctx.fillStyle = h.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = "800 30px " + mp.font; ctx.fillText("Tick 7", 40, 54);
    ctx.font = "500 20px " + mp.font; ctx.globalAlpha = 0.72; ctx.fillText("next in 2h 14m", 40, 84); ctx.globalAlpha = 1;
    for (let i = 0; i < 5; i++) {
      rrect(ctx, 268 + i * 34, 38, 26, 20, 6);
      ctx.fillStyle = i < 3 ? "#f5b301" : h.ink; ctx.globalAlpha = i < 3 ? 1 : 0.16; ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.fillStyle = h.ink; ctx.globalAlpha = 0.72; ctx.font = "500 18px " + mp.font; ctx.fillText("3 couriers", 268, 86); ctx.globalAlpha = 1;
    [[1, 560], [2, 640]].forEach(function (s) {
      rrect(ctx, s[1] - 30, 37, 60, 44, h.r > 8 ? 14 : 3); ctx.fillStyle = campOf(mp, s[0]); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "800 24px " + mp.font; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("7", s[1], 60);
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    });
  }

  /* ==========================================================================
     PAGE
     ========================================================================== */
  const state = { view: "maps", map: "porcelain", arrow: "shimmer", anim: true, names: false, hud: true };
  try {
    const hsh = new URLSearchParams(location.hash.slice(1));
    ["view", "map", "arrow"].forEach(function (k) { if (hsh.get(k)) state[k] = hsh.get(k); });
  } catch (err) { /* a bad hash keeps the defaults */ }

  const stage = document.getElementById("stage");
  let frames = [], t0 = performance.now(), frozen = 0;

  function fillList(id, items, key) {
    const list = document.getElementById(id);
    items.forEach(function (it) {
      const b = document.createElement("button");
      b.dataset.k = it.key;
      b.innerHTML = "<b>" + it.name + "</b><span>" + it.desc + "</span>";
      b.addEventListener("click", function () { state[key] = it.key; render(); });
      list.appendChild(b);
    });
  }
  fillList("maps", MAPS, "map");
  fillList("arrows", ARROWS, "arrow");
  document.querySelectorAll(".seg button").forEach(function (b) { b.addEventListener("click", function () { state.view = b.dataset.v; render(); }); });
  ["anim", "names", "hud"].forEach(function (k) {
    const el = document.getElementById("t-" + k);
    el.checked = state[k];
    el.addEventListener("change", function () { state[k] = el.checked; render(); });
  });

  const byKey = function (list, k) { return list.find(function (x) { return x.key === k; }) || list[0]; };

  function render() {
    location.replace("#view=" + state.view + "&map=" + state.map + "&arrow=" + state.arrow);
    document.querySelectorAll(".seg button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === state.view); });
    document.querySelectorAll("#maps button").forEach(function (b) { b.classList.toggle("on", b.dataset.k === state.map); });
    document.querySelectorAll("#arrows button").forEach(function (b) { b.classList.toggle("on", b.dataset.k === state.arrow); });
    const res = state.view === "maps" ? 1 : 2;
    stage.className = state.view;
    if (!FIELDS[res]) {
      stage.innerHTML = '<div class="busy">Computing the world at ' + res + 'x…</div>';
      frames = [];
      setTimeout(function () { fields(res); render(); }, 30);
      return;
    }
    let list;
    if (state.view === "one") list = [{ mp: byKey(MAPS, state.map), ar: byKey(ARROWS, state.arrow) }];
    else if (state.view === "maps") list = MAPS.map(function (mp) { return { mp: mp, ar: byKey(ARROWS, state.arrow) }; });
    else list = ARROWS.map(function (ar) { return { mp: byKey(MAPS, state.map), ar: ar }; });
    stage.innerHTML = "";
    frames = list.map(function (it) {
      const vb = state.view === "arrows" ? ZOOM : [0, 0, W, H];
      const fig = document.createElement("figure"), cv = document.createElement("canvas");
      fig.className = "fr";
      cv.width = vb[2] * res; cv.height = vb[3] * res;
      const cap = document.createElement("figcaption");
      cap.innerHTML = state.view === "arrows" ? "<b>" + it.ar.name + "</b> · " + it.ar.desc
        : "<b>" + it.mp.name + "</b> · " + it.mp.desc + (state.view === "one" ? " — arrow: " + it.ar.name : "");
      fig.appendChild(cv); fig.appendChild(cap); stage.appendChild(fig);
      if (state.view !== "one") fig.addEventListener("click", function () { state.map = it.mp.key; state.arrow = it.ar.key; state.view = "one"; render(); });
      return { cv: cv, ctx: cv.getContext("2d"), res: res, vb: vb, mp: it.mp, ar: it.ar, hud: state.hud && state.view !== "arrows",
        bmp: bitmap(it.mp, res), top: topLayer(it.mp, res, state.names) };
    });
    tick();
  }

  function tick() {
    const t = state.anim ? (performance.now() - t0) / 1000 : frozen;
    if (state.anim) frozen = t;
    frames.forEach(function (f) { drawFrame(f, t); });
  }
  (function loop() { if (state.anim) tick(); requestAnimationFrame(loop); })();
  render();
})();
</script>
