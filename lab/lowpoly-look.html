/* ===========================================================================
   LAB — LOW POLY LOOK. The final render of dozerflip, looked for on a still
   slice of its world before any of it moves into the game.

   The prototype's boxes lit well still read as a prototype: what sells the
   reference picture is the CONTENT (objects with a roof, a door, a kerb) and
   the LIGHT, not the polygon count. So this page builds one diorama out of
   real models — KayKit City Builder Bits, CC0, in assets/model/kaykit-city/,
   one palette texture shared by every model — plus what the kit has not got,
   made in code in the same spirit: the skate bowl, a ride rail, trees, rocks,
   a pond, the dozer and a demolition site.

   Then every layer of the look is a knob: the sun and the sky (which also
   light the scene as an environment), soft shadows, screen-space ambient
   occlusion (GTAO), fog, a tilt-shift that turns the city into a miniature,
   a grade in linear light (saturation, contrast around mid-grey, warmth,
   lifted shadows, vignette) and the tone mapping. Four presets are starting
   points; Copy settings hands the panel over as JSON.

   The gameplay question rides along: a block's TIER is a colour, and here
   that colour is an ACCENT (a band on the roof, a ring on the pavement, a
   tint) on a building that keeps its own colours. "Full colour" is the
   prototype's way, for comparison.

   Served over HTTP only (make lab): three.js is an ES module, vendored in
   lab/vendor/three/ and named by the import map below.
   ?preset=N&cam=K&freeze=1 open a state directly (what a headless shot uses).
   =========================================================================== */

    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const c = cell(i, j), x = tx(i), z = tz(j);
    if (c === "r") {
      const need = Object.keys(DIRS).filter((d) => isRoad(i + DIRS[d][0], j + DIRS[d][1]));

      if (need.length === 4) { name = "road_junction"; canon = ["N", "E", "S", "W"]; }
      else if (need.length === 3) { name = "road_tsplit"; canon = ["N", "E", "S"]; }
      else if (need.length === 2 && !(need.includes("N") && need.includes("S")) && !(need.includes("E") && need.includes("W"))) { name = "road_corner"; canon = ["E", "S"]; }

    const c = cell(i, j), x = tx(i), z = tz(j);
    if (c !== "b") continue;
    const road = ["S", "N", "E", "W"].find((d) => isRoad(i + DIRS[d][0], j + DIRS[d][1]));
    if (road) {
      const dv = DIRS[road];
      // the lamp's arm points along -x in the kit: turn it over the road
      const lamp = place("streetlight", x + dv[0] * 0.78 + (dv[1] ? (i % 2 ? 0.5 : -0.5) : 0), z + dv[1] * 0.78, rotFor(["W"], [road]));
      lamp.updateMatrixWorld(true);
      const head = lamp.localToWorld(new THREE.Vector3(-0.2, 0, 0));
      lightPool(head.x, 0.104, head.z, 0.8, "lamp");
      if (rnd() < 0.6) place("firehydrant", x + dv[0] * 0.7 + (dv[1] ? -0.2 : 0.3), z + dv[1] * 0.7 + (dv[0] ? 0.3 : 0), rr(0, TAU));
    }
    const k = rnd();
    if (k < 0.35) { place("bench", x - 0.3, z - 0.25, facing(road || "S")); place(pick(["trash_A", "trash_B"]), x + 0.25, z - 0.3, rr(0, TAU)); }
    else if (k < 0.65) { for (let n = 0; n < 3; n++) place("bush", x + rr(-0.6, 0.6), z + rr(-0.6, 0.2), rr(0, TAU), rr(1.2, 1.8)); }
    else if (k < 0.85) { place("dumpster", x - 0.3, z - 0.4, facing(road || "S")); place(pick(["box_A", "box_B"]), x + 0.35, z - 0.45, rr(0, TAU)); }
    else { roundTree(x + rr(-0.4, 0.4), z + rr(-0.5, 0.1), rr(0.7, 0.9)); }
  }
}

// cars in their lanes, traffic lights on the junctions
function buildTraffic() {
  const cars = ["car_sedan", "car_taxi", "car_hatchback", "car_stationwagon", "car_police"];
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    if (cell(i, j) !== "r") continue;
    const x = tx(i), z = tz(j);
    const ew = isRoad(i - 1, j) && isRoad(i + 1, j), ns = isRoad(i, j - 1) && isRoad(i, j + 1);
    if (ew && ns) {
      for (const [sx, sz] of [[1, 1], [-1, -1]]) place(pick(["trafficlight_A", "trafficlight_B", "trafficlight_C"]), x + sx * 1.15, z + sz * 1.15, sx > 0 ? Math.PI : 0);
      continue;
    }
    if (rnd() > 0.45) continue;
    const lane = rnd() < 0.5 ? 1 : -1;
    if (ew) place(pick(cars), x + rr(-0.4, 0.4), z + lane * 0.45, lane > 0 ? Math.PI / 2 : -Math.PI / 2);
    else if (ns) place(pick(cars), x - lane * 0.45, z + rr(-0.4, 0.4), lane > 0 ? 0 : Math.PI);
  }
}

// the skate bowl: a stadium sunk into the ground, painted at the bottom, with
// its coping and a concrete deck around it
function stadiumRing(c, d) {
  const out = [], N = 14;
  for (let k = 0; k <= N; k++) { const t = -Math.PI / 2 + Math.PI * k / N; out.push([c.cx + c.a, c.cz, Math.cos(t), Math.sin(t)]); }
  for (let k = 0; k <= N; k++) { const t = Math.PI / 2 + Math.PI * k / N; out.push([c.cx - c.a, c.cz, Math.cos(t), Math.sin(t)]); }
  return out;
}
function ringAt(ring, d) { return ring.map((a) => [a[0] + a[2] * d, a[1] + a[3] * d]); }
let poolOutline;
function buildPool() {
  const ring = stadiumRing(POOL), Rt = POOL.D + POOL.lip, R = POOL.F + Rt;
  const prof = [[0, -POOL.D, 0], [POOL.F, -POOL.D, 0.05]];
  for (let j = 1; j <= 8; j++) { const a = j / 8 * Math.PI / 2; prof.push([POOL.F + Rt * Math.sin(a), -POOL.D + Rt * (1 - Math.cos(a)), 0.05 + 0.95 * j / 8]); }
  const bowl = new THREE.Mesh(sheet(ring, prof, [0x4fa9cc, 0xe7e1d5]),
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9, side: THREE.DoubleSide }));
  bowl.receiveShadow = true; world.add(bowl);
  poolOutline = ringAt(ring, R);
  // the deck: a slab with the bowl cut out of it, chamfered all round
  const w = 3.7, h = 2.2, rc = 0.5, pts = [];
  for (let q = 0; q < 4; q++) {
    const cxq = POOL.cx + (q === 0 || q === 3 ? w - rc : -w + rc), czq = POOL.cz + (q < 2 ? h - rc : -h + rc);
    for (let s = 0; s <= 4; s++) { const t = q * Math.PI / 2 + s / 4 * Math.PI / 2; pts.push(v2(cxq + Math.cos(t) * rc, czq + Math.sin(t) * rc)); }
  }
  const deckShape = new THREE.Shape(pts);
  deckShape.holes.push(new THREE.Path(poolOutline.map((p) => v2(p[0], p[1]))));
  const dg = new THREE.ExtrudeGeometry(deckShape, { depth: POOL.lip - 0.03, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 1, curveSegments: 4 });
  dg.rotateX(-Math.PI / 2);
  const deckMesh = pmesh(dg, 0xd9d2c4); deckMesh.receiveShadow = true; world.add(deckMesh);
  const pts3 = poolOutline.map((p) => new THREE.Vector3(p[0], POOL.lip + 0.02, p[1]));
  const cope = pmesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts3, true), pts3.length * 2, 0.045, 6, true), 0xc9ced4, { roughness: 0.35, metalness: 0.6 });
  world.add(shadowy(cope));
}

// the ride rail: candy stripes, a loop, posts where nothing runs under it
function buildRail() {
  const R = 1.05, cx = 2.2, cz = -6.6, cy = 0.35 + R, pts = [];
  pts.push(new THREE.Vector3(cx, 0.32, -3.4), new THREE.Vector3(cx, 0.34, -4.6), new THREE.Vector3(cx, 0.35, -5.7));
  for (let k = 0; k <= 16; k++) {
    const a = k / 16, th = -Math.PI / 2 + TAU * a;
    pts.push(new THREE.Vector3(cx + 0.55 * a, cy + R * Math.sin(th), cz - R * Math.cos(th)));
  }
  pts.push(new THREE.Vector3(cx + 0.55, 0.35, -7.6), new THREE.Vector3(cx + 0.55, 0.34, -8.8), new THREE.Vector3(cx + 0.55, 0.3, -9.8));
  const curve = new THREE.CatmullRomCurve3(pts), segs = 260, radial = 8;
  const geo = new THREE.TubeGeometry(curve, segs, 0.075, radial, false);
  const n = geo.attributes.position.count, cols = new Float32Array(n * 3), ca = new THREE.Color(0xff3d8b), cb = new THREE.Color(0xffffff);
  const len = curve.getLength();
  for (let i = 0; i < n; i++) { const ringI = Math.floor(i / (radial + 1)), c = Math.floor(ringI / segs * len / 0.35) % 2 ? cb : ca; cols.set([c.r, c.g, c.b], i * 3); }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  railMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.4, emissive: 0xff3d8b, emissiveIntensity: 0 });
  world.add(shadowy(new THREE.Mesh(geo, railMat)));
  for (let k = 0; k <= 40; k++) {
    const p = curve.getPointAt(k / 40);
    if (Math.abs(p.z - cz) < R + 0.25 && p.y > 0.5) continue;
    if (k % 4) continue;
    const post = pmesh(bevelBox(0.07, p.y, 0.07, 0.015), 0x55595f);
    post.position.set(p.x, p.y / 2, p.z); world.add(shadowy(post));
  }
  const pillar = pmesh(jitter(new THREE.CylinderGeometry(0.16, 0.2, cy, 7), 0.004, 3), 0x55595f);
  pillar.position.set(cx + 0.27, cy / 2, cz); world.add(shadowy(pillar));
  // the way in: a ring on the ground
  const ringM = new THREE.Mesh(flat(new THREE.RingGeometry(0.38, 0.5, 24), 0.012), new THREE.MeshBasicMaterial({ color: 0xff3d8b, transparent: true, opacity: 0.85 }));
  ringM.position.set(cx, 0, -3.1); world.add(ringM);
}

// a pond: a hole in the grass, a sand bank, a dark bed and a glossy surface
let pondOutline;
function buildPond() {
  const N = 16, ring = [];
  for (let k = 0; k < N; k++) {
    const t = k / N * TAU, r = rr(1.0, 1.3);
    ring.push([POND.cx, POND.cz, Math.cos(t) * r, Math.sin(t) * r * 0.8]);
  }
  pondOutline = ring.map((a) => [a[0] + a[2], a[1] + a[3]]);
  const bank = new THREE.Mesh(sheet(ring, [[1.0, 0.004, 0], [0.92, -0.12, 0.5], [0.7, -0.28, 1]], [0xd8c49a, 0x5d5a48]),
    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, side: THREE.DoubleSide }));
  world.add(shadowy(bank, false, true));

  world.add(bed);
  const water = new THREE.Mesh(flat(new THREE.ShapeGeometry(new THREE.Shape(ring.map((a) => v2(a[0] + a[2] * 0.97, a[1] + a[3] * 0.97)))), -0.07),

// the ground: grass with the bowl and the pond cut out of it, a slab of earth
// under it, and around it the sea (or nothing, or more grass)
function noiseTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 256, 256);
  const r2 = mulberry(5);
  for (let k = 0; k < 160; k++) {
    const x = r2() * 256, y = r2() * 256, rad = 8 + r2() * 30, dark = r2() < 0.5;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, dark ? "rgba(40,60,20,0.10)" : "rgba(255,255,220,0.12)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / 9, 1 / 9);
  return t;
}
function buildGround() {
  const m = 0.6, outer = new THREE.Shape([v2(-HALFX - m, -HALFZ - m), v2(HALFX + m, -HALFZ - m), v2(HALFX + m, HALFZ + m), v2(-HALFX - m, HALFZ + m)]);
  outer.holes.push(new THREE.Path(poolOutline.map((p) => v2(p[0], p[1]))));
  outer.holes.push(new THREE.Path(pondOutline.map((p) => v2(p[0], p[1]))));
  grassNoise = noiseTexture();
  groundMat = new THREE.MeshStandardMaterial({ color: P.grass, roughness: 1, map: grassNoise });
  const ground = new THREE.Mesh(flat(new THREE.ShapeGeometry(outer), 0), groundMat);
  ground.receiveShadow = true; world.add(ground);
  // the slab: its top is never drawn (the grass is), so the bowl stays open
  const H = 2.2, sw = 2 * (HALFX + m), sd = 2 * (HALFZ + m);
  const earthMat = new THREE.MeshStandardMaterial({ color: P.earth, roughness: 1, flatShading: true });
  const hidden = new THREE.MeshBasicMaterial({ visible: false });
  slab = new THREE.Group();
  // the earth is open on top down to under the bowl's floor, so the bowl shows
  const U = 1.0;
  const upper = new THREE.Mesh(new THREE.BoxGeometry(sw, U, sd), [earthMat, earthMat, hidden, earthMat, earthMat, earthMat]);
  upper.position.y = -U / 2 - 0.002;
  const lower = pmesh(bevelBox(sw - 0.1, H - U, sd - 0.1, 0.12), 0x6b4a33);
  lower.position.y = -U - (H - U) / 2;
  const grassLip = new THREE.Mesh(new THREE.BoxGeometry(sw + 0.04, 0.08, sd + 0.04), [groundMat, groundMat, hidden, groundMat, groundMat, groundMat]);
  grassLip.position.y = -0.04;
  slab.add(upper, lower, grassLip); slab.userData.earth = earthMat;
  world.add(shadowy(slab, false, true));
  seaMesh = new THREE.Mesh(flat(new THREE.PlaneGeometry(400, 400), -0.9),
    new THREE.MeshStandardMaterial({ color: P.water, roughness: 0.15, metalness: 0.05 }));
  seaMesh.receiveShadow = true; scene.add(seaMesh);
  endless = new THREE.Mesh(flat(new THREE.PlaneGeometry(400, 400), -0.01), groundMat);
  endless.receiveShadow = true; scene.add(endless);
}

// crystals: the cold light against the warm one, as in a painted key art
const crystalMats = { A: null, B: null };
const CRYSTAL_SPOTS = [[3.9, -4.2, "A", true], [-6.7, -9.9, "B", true], [6.9, -9.7, "B", false], [-7.2, -4.6, "A", false]];
function buildCrystals() {
  for (const k of ["A", "B"]) crystalMats[k] = new THREE.MeshStandardMaterial({ color: 0x223040, emissive: 0xffffff, emissiveIntensity: 1, flatShading: true, roughness: 0.15, metalness: 0.1 });
  for (const [cx, cz, k, lit] of CRYSTAL_SPOTS) {
    const g = item("crystal-cluster").build(LIB, { key: k, n: lit ? 7 : 4 });
    for (let i = 0; i < 3; i++) { const r = rock(cx + rr(-0.5, 0.5), cz + rr(-0.5, 0.5), rr(0.4, 0.7)); }
    g.position.set(cx, 0, cz); world.add(shadowy(g, true, false));
    lightPool(cx, 0.012, cz, lit ? 1.6 : 0.9, "crystal" + k);
    if (lit) { const pl = new THREE.PointLight(0xffffff, 1, 5, 2); pl.position.set(cx, 0.8, cz); world.add(pl); realLights.push({ l: pl, kind: "crystal" + k }); }
  }
}

function buildPark() {
  // trees along the north and west edges and in clumps, nowhere on the bowl,
  // the rail, the pond or the dozer's lap
  const avoid = (x, z) =>
    (Math.abs(x - POOL.cx) < 4.6 && Math.abs(z - POOL.cz) < 3.2) ||
    (Math.abs(x - 2.5) < 1.0 && z < -2.8) ||
    (Math.hypot(x - POND.cx, (z - POND.cz) / 0.8) < 1.8) || z > -3.4 ||
    CRYSTAL_SPOTS.some((c) => Math.hypot(x - c[0], z - c[1]) < 1.0);
  let placed = 0, tries = 0;
  while (placed < 26 && tries++ < 600) {
    const x = rr(-HALFX + 0.6, HALFX - 0.6), z = rr(-HALFZ + 0.5, -3.6);
    const edge = z < -HALFZ + 2.2 || x < -HALFX + 1.2 || x > HALFX - 1.2;
    if (avoid(x, z) || (!edge && rnd() < 0.7)) continue;
    if (rnd() < 0.55) conifer(x, z, rr(0.85, 1.35)); else roundTree(x, z, rr(0.8, 1.15));
    placed++;
  }
  for (let k = 0; k < 10; k++) { const x = rr(-HALFX + 0.5, HALFX - 0.5), z = rr(-HALFZ + 0.4, -3.6); if (!avoid(x, z)) rock(x, z, rr(0.5, 1.2)); }
  for (let k = 0; k < 14; k++) { const x = rr(-HALFX + 0.5, HALFX - 0.5), z = rr(-HALFZ + 0.4, -3.6); if (!avoid(x, z)) place("bush", x, z, rr(0, TAU), rr(1.4, 2.2)); }
  place("bench", POOL.cx - 1.2, POOL.cz + 2.6, Math.PI);
  place("bench", POOL.cx + 1.2, POOL.cz + 2.6, Math.PI);
}

const emberMat = new THREE.MeshStandardMaterial({ color: 0x3a1a0a, emissive: 0xff6a1a, emissiveIntensity: 1, flatShading: true, roughness: 0.6 });
// the demolition sites: a heap of rubble in the tier's colour and in concrete

    realLights.push({ l: pl, kind: "ember" });

// the dozer: chamfered boxes, the prototype's parts at the kit's scale
function buildDozer() {
  const g = item("vehicle-dozer").build(LIB), k = g.userData.k, inner = g.getObjectByName("body");
  // headlights: two lamps on the cab, a real spot ahead and a pool of its light

  for (const sz of [-0.55, 0.55]) { const m = new THREE.Mesh(bevelBox(0.18 * k, 0.28 * k, 0.32 * k, 0.01), headMat); m.position.set(1.15 * k, 2.15 * k, sz * k); inner.add(m); }

// dust: faceted puffs that rise, swell and shrink away
const puffGeo = puffGeometry();
function puff(x, y, z, s, still) {
  const m = new THREE.Mesh(puffGeo, matFor(0xece2cc, { roughness: 1 }));
  m.position.set(x, y, z); m.scale.setScalar(s); m.rotation.set(rr(0, TAU), rr(0, TAU), 0);
  m.castShadow = true; world.add(m);

// ---- the tier, as an accent ------------------------------------------------------
function applyAccent() {
  for (const b of buildings) {
    if (b.accent) { b.group.remove(b.accent); b.accent = null; b.accentMat = null; }
    const tc = new THREE.Color(TIERS[b.tier]), full = P.accent === "full";
    if (!!b.mat.map === full) b.mat.needsUpdate = true;
    b.mat.map = full ? null : b.map0;
    if (full) b.mat.color.copy(tc);
    else if (P.accent === "tint") b.mat.color.setRGB(1, 1, 1).lerp(tc, 0.5);
    else b.mat.color.setRGB(1, 1, 1);
    if (P.accent !== "band" && P.accent !== "ring") continue;
    const g = new THREE.Group(), bb = b.box, mat = P.accent === "band"
      ? new THREE.MeshStandardMaterial({ color: tc, emissive: tc, emissiveIntensity: 0.35, roughness: 0.5, flatShading: true })
      : new THREE.MeshBasicMaterial({ color: tc });
    b.accentMat = mat; b.tierColor = tc;
    const frame = (x0, x1, z0, z1, y, t, h) => {
      const w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
      [[w + t, t, cx, z0], [w + t, t, cx, z1]].forEach((e) => { const m = new THREE.Mesh(bevelBox(e[0], h, e[1], 0.015), mat); m.position.set(e[2], y, e[3]); g.add(m); });
      [[t, d - t, x0, cz], [t, d - t, x1, cz]].forEach((e) => { const m = new THREE.Mesh(bevelBox(e[0], h, e[1], 0.015), mat); m.position.set(e[2], y, e[3]); g.add(m); });
    };
    if (P.accent === "band") frame(bb.min.x + 0.03, bb.max.x - 0.03, bb.min.z + 0.03, bb.max.z - 0.03, bb.max.y + 0.03, 0.06, 0.08);
    else frame(-0.93, 0.93, -0.93, 0.93, 0.108, 0.07, 0.016);
    shadowy(g, P.accent === "band", false);
    b.group.add(g); b.accent = g;
  }
}

// =============================================================================
// POST — GTAO, tilt-shift, a grade in linear light, then the tone mapping
// =============================================================================
const QUAD_VS = "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }";
const TILT = {
  uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() }, uFocus: { value: 0.5 },
    uBand: { value: 0.1 }, uSoft: { value: 0.3 }, uMax: { value: 3 } },
  vertexShader: QUAD_VS,
  fragmentShader: [
    "uniform sampler2D tDiffuse; uniform vec2 uDir; uniform float uFocus, uBand, uSoft, uMax; varying vec2 vUv;",
    "void main() {",
    "  float r = uMax * smoothstep(uBand, uBand + uSoft, abs(vUv.y - uFocus));",
    "  if (r < 0.05) { gl_FragColor = texture2D(tDiffuse, vUv); return; }",
    "  vec4 c = vec4(0.0); float ws = 0.0;",
    "  for (int i = -6; i <= 6; i++) {",
    "    float fi = float(i), w = exp(-fi * fi / 18.0); vec4 s = texture2D(tDiffuse, vUv + uDir * fi * r / 3.0);",
    "    if (s == s) { c += s * w; ws += w; }            // a NaN sample is skipped, never spread",

const NAMES = ["base", "road_straight", "road_straight_crossing", "road_corner", "road_tsplit", "road_junction",
  "building_A", "building_B", "building_C", "building_D", "building_E", "building_F", "building_G", "building_H",
  "streetlight", "firehydrant", "bench", "trash_A", "trash_B", "bush", "dumpster", "box_A", "box_B",
  "car_sedan", "car_taxi", "car_hatchback", "car_stationwagon", "car_police",
  "trafficlight_A", "trafficlight_B", "trafficlight_C", "watertower"];
const loader = new GLTFLoader();
Promise.all(NAMES.map((n) => loader.loadAsync(KIT + n + ".gltf").then((g) => { kit[n] = g.scene; })))
  .then(() => {
    document.getElementById("loading").remove();
    buildPanel(); syncPanel();
    kit.base.traverse((m) => { if (m.isMesh && m.material.map && !atlas) readAtlas(m.material.map.image); });
    for (const n in kit) kit[n].traverse((m) => { if (m.isMesh && m.material.map) m.material.map = atlasTex; });
    buildMasks();
    buildRoads(); buildCity(); buildStreetProps(); buildTraffic();
    buildPool(); buildRail(); buildPond(); buildGround(); buildCrystals(); buildPark(); buildRubble();
    dozer = buildDozer();
    // water and what glows keep their own colour under a biome
    for (const m of [seaMesh.material, emberMat, railMat, headMat, crystalMats.A, crystalMats.B]) if (m) m.userData.noWeather = true;
    world.traverse((o) => { if (o.userData.water && o.material) o.material.userData.noWeather = true; });
    // the hero stays clean: the dozer's own copies of its materials (the palette texture shared)
    dozer.traverse((m) => { if (m.isMesh && m.material.isMeshStandardMaterial && m.material !== headMat) { m.material = m.material.clone(); m.material.userData.noWeather = true; m.userData.keepMat = true; } });
    rebuildSky();
    applyCam(Math.min(camIdx, CAMS.length - 1));
    applyAll();
    refreshButtons();
    requestAnimationFrame(frame);
  })
  .catch((e) => { document.getElementById("loading").textContent = "Could not load the kit: " + e.message + " (open this page through make lab)"; console.error(e); });
</script>
</body>
</html>
