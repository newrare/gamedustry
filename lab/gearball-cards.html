<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — gearball upgrade cards</title>
<meta name="lab-group" content="css">
<meta name="lab-game" content="gearball">
<style>
/* ===========================================================================
   GEARBALL — UPGRADE CARD STYLES. Every time an electric marble reaches the
   socket (30 s cooldown) the machine pauses and two cards are dealt; the
   player taps one. This page picks the LOOK of that card, and is where the
   catalogue (CARD_FAMS of games/gearball/game.js, 49 families, 113 cards) is
   configured: the inspector edits a family, COPY CATALOGUE hands the whole
   array back as source.

   ONE RULE ABOVE THE REST: a help card and a score card must not be told
   apart by their look. No kind tag, no kind colour, no kind word — the
   `kind` field is data and is never drawn. What differs between two cards is
   their own colour (--c, picked per family so it says nothing of the kind),
   the icon, the rarity, the duration, and a risk card's COST line.

   THE CARD — the contract games/gearball/game.js (cardNode) builds the same:

     .gb-cbox                       the sized box, w x 1.4w
       .gb-card.s-<style>.r-<1..4>[.has-cost][.ghost]
                                    300 x 420 design px, scaled by --sk; it
                                    clips nothing, so pieces may leave it
         .gb-back                   the body, rounded and clipped:
           .gb-bg .gb-glow .gb-shine   a pattern, the light, a moving foil
         .gb-frame                  the rim
         .gb-deco                   the style's own ornament (optional)
         .gb-art > svg              the lucide pictogram, stroked currentColor
         .gb-rar > span             the rarity, WRITTEN
         .gb-name                   the card's name
         .gb-desc                   what it does
         .gb-cost                   a risk card's price (only when it has one)
         .gb-dur                    how long it lasts

   Tokens: --sk the scale (w / 300), --c the card's own colour, --r its
   rarity's colour, --rbg the rarity as a background (a colour, or the moving
   gold-and-current gradient of a legendary). .ghost is a card not collected
   yet: "???", no desc, no cost, no duration, grey tokens, class r-1.

   The card is a FLEX COLUMN: art, name, desc and cost flow, and the art is
   the one piece that gives way, so a long description shrinks the picture
   and never the type. The rarity and the duration are absolute and hang off
   the edges.

   Text floors at the card's own 300 px (hard constraint 8): the name, the
   rarity and the duration are capitals in Russo One (bold) — 28, 18, 18; the
   description and the cost are normal case at 600 — 22. AUDIT TEXT in the
   panel checks every card, in every style, in both languages.

   Each style is its own <style data-style> block scoped `.gb-card.s-<key>`;
   COPY CSS hands over the base block plus that one. Strings are written in
   normal case and shouted through this page's copy of the motor's `upper()`
   (button.html): a capital carries no accent (LEGENDAIRE).
   =========================================================================== */

@font-face { font-family:"Russo One"; src:url("../assets/motor/font/russoone.woff2") format("woff2"); font-weight:400; }

* { box-sizing:border-box; margin:0; padding:0; }
html, body { background:#0b0b12; }
body {
  min-height:100vh; display:flex; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* ---- PANEL ---------------------------------------------------------------- */
#panel {
  flex:0 0 310px; padding:22px 20px 40px; background:#12121c; border-right:1px solid #23233a;
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:10;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel h2 { font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#ffb830; margin:22px 0 10px; padding-top:14px; border-top:1px solid #23233a; }
#panel p.hint { margin:8px 0 18px; font-weight:500; font-size:12px; color:#8b8ba7; }
.row { margin-bottom:14px; }
.row > label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:6px; accent-color:#ffb830; }
.row select, .f input, .f textarea, .f select, .tier input, .tier select {
  width:100%; margin-top:6px; padding:6px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit; font-size:13px;
}
.f textarea { resize:vertical; min-height:56px; font-weight:500; }
.seg { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; background:#1a1a28; border:1px solid #2c2c44; border-radius:10px; padding:3px; }
.seg button {
  flex:1; appearance:none; border:0; background:none; color:#8b8ba7; cursor:pointer;
  font:inherit; font-size:12px; padding:5px 7px; border-radius:7px; white-space:nowrap;
}
.seg button.on { background:#ffb830; color:#2a1402; }
#styles { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
#styles button {
  appearance:none; text-align:left; border:1px solid #2c2c47; background:#0f0f18; color:#c9c7de;
  font:inherit; font-size:13px; padding:7px 10px; border-radius:8px; cursor:pointer;
}
#styles button.on { border-color:#ffb830; color:#fff; background:#2a1a08; }
.act {
  width:100%; margin-top:6px; padding:8px 10px;
  background:#ffb830; color:#2a1402; border:0; border-radius:8px;
  font:700 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; letter-spacing:.5px; cursor:pointer;
}
.act.soft { background:#1f1f30; color:#e8e6f5; border:1px solid #33334f; }
.act:disabled { opacity:.4; cursor:default; }
.note { margin-top:8px; font-size:12px; font-weight:500; color:#9c9cba; min-height:18px; }
#about { margin-top:10px; font-size:12px; font-weight:500; color:#8b8ba7; line-height:1.5; }
#audit-out { margin-top:8px; font:500 11px/1.45 ui-monospace,Menlo,monospace; color:#c9c7de; white-space:pre-wrap; max-height:260px; overflow:auto; }
#audit-out:empty { display:none; }

/* the inspector */
.f { display:block; margin-bottom:10px; font-size:12px; color:#9c9cba; }
.f2 { display:flex; gap:8px; }
.f2 .f { flex:1; }
.f input[type=color] { height:34px; padding:2px; }
.meta { font-size:12px; color:#8b8ba7; font-weight:500; margin:-4px 0 10px; }
.meta i { font-style:normal; color:#ffb830; }
.tier { display:grid; grid-template-columns:1.3fr .8fr 1fr 26px; gap:5px; align-items:end; margin-bottom:6px; }
.tier input, .tier select { margin-top:0; padding:5px 6px; font-size:12px; }
.tier button { appearance:none; height:28px; border:1px solid #33334f; border-radius:6px; background:#1a1a28; color:#c9c7de; cursor:pointer; font:inherit; }
.tier-head { display:grid; grid-template-columns:1.3fr .8fr 1fr 26px; gap:5px; font-size:11px; color:#8b8ba7; margin-bottom:4px; }

/* ---- STAGE ---------------------------------------------------------------- */
#stage {
  flex:1; min-width:0; padding:20px 20px 60px;
  display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:4px 0;
  background:#0a0718 center/cover no-repeat;
}
#stage.bg-round { background-image:linear-gradient(rgba(7,4,22,.6),rgba(7,4,22,.6)), url("../assets/image/embed/gearball-background-phone.webp"); background-attachment:fixed; }
#stage.bg-home  { background-image:linear-gradient(rgba(7,4,22,.45),rgba(7,4,22,.45)), url("../assets/image/embed/gearball-background-home.webp"); background-attachment:fixed; }
#stage.bg-flat  { background:#0a0718; }
#stage.v-pick { align-content:center; align-items:center; padding:20px; height:100vh; }
.cell { display:flex; flex-direction:column; align-items:center; gap:14px; border-radius:18px; }
.cell .cap { font-size:12px; color:#e8e6f5; text-shadow:0 1px 3px #000; text-align:center; }
.cell .cap i { font-style:normal; color:#ffb830; }
.cell { cursor:pointer; }
.cell.sel { box-shadow:inset 0 0 0 2px rgba(255,184,48,.75); }

/* the pick screen, a 720 x 1280 frame scaled to fit */
.pick-box { position:relative; flex:0 0 auto; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); }
.pick-frame {
  position:absolute; left:0; top:0; width:720px; height:1280px; transform-origin:0 0;
  background:#0a0718 url("../assets/image/embed/gearball-background-phone.webp") center/cover no-repeat;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:"Russo One", sans-serif; color:#f0f4ff;
}
.pick-veil { position:absolute; inset:0; background:radial-gradient(90% 60% at 50% 50%, rgba(7,4,22,.62), rgba(7,4,22,.88)); }
.pick-frame > :not(.pick-veil) { position:relative; }
.pick-eyebrow { font-size:26px; letter-spacing:6px; color:#7ef9ff; text-shadow:0 0 18px rgba(126,249,255,.75); }
.pick-title { margin-top:10px; font-size:64px; line-height:1; letter-spacing:2px; text-shadow:0 4px 0 #0b0720, 0 0 30px rgba(179,137,255,.5); }
.pick-row { display:flex; gap:44px; margin-top:96px; margin-bottom:84px; }
.pick-row .gb-cbox { cursor:pointer; }
.pick-tap { font-size:24px; letter-spacing:3px; color:#a99cc6; animation:pick-tap 1.8s ease-in-out infinite; }
@keyframes pick-tap { 0%,100% { opacity:.55; } 50% { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .pick-tap { animation:none; } }
</style>

<!-- ===========================================================================
     THE BASE — every style starts from it. Positions, the flow, the sizes,
     the painting order and the two shared animations. COPY CSS includes it.
     =========================================================================== -->
<style id="card-base">
.gb-cbox { position:relative; flex:0 0 auto; }
.gb-card {
  --gb-font:var(--web-font, "Russo One"), "Arial Black", sans-serif;
  --gb-text:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --rsz:100% 100%;
  position:absolute; left:0; top:0; width:300px; height:420px; transform-origin:0 0;
  transform:scale(var(--sk, 1));
  display:flex; flex-direction:column; gap:8px; padding:50px 22px 62px;
  font-family:var(--gb-font); font-weight:400; color:#f0f4ff; text-align:center;
  -webkit-font-smoothing:antialiased;
}
.gb-card.r-4 { --rsz:300% 100%; }
.gb-back, .gb-frame, .gb-deco, .gb-rar, .gb-dur { position:absolute; }
.gb-art, .gb-name, .gb-desc, .gb-cost { position:relative; flex:none; }
.gb-back { inset:0; border-radius:22px; overflow:hidden; background:#140e2e; }
.gb-back > * { position:absolute; inset:0; }
.gb-frame { inset:0; border-radius:22px; pointer-events:none; }
.gb-deco { display:none; pointer-events:none; }
/* the art is the one piece that gives way to a long text */
.gb-art { flex:1 1 auto; min-height:64px; display:flex; align-items:center; justify-content:center; color:var(--c); }
.gb-art svg { display:block; position:relative; z-index:1; height:100%; max-height:108px; width:auto; aspect-ratio:1; overflow:visible; }
.gb-name { font-size:28px; line-height:1.05; letter-spacing:.5px; }
.gb-desc, .gb-cost { font-family:var(--gb-text); font-weight:600; font-size:22px; line-height:1.18; letter-spacing:0; }
.gb-desc { color:#ddd7f6; }
.gb-cost { color:#ff9ab3; }
.gb-rar { left:50%; top:-16px; height:36px; transform:translateX(-50%); display:flex; white-space:nowrap; font-size:18px; letter-spacing:2px; line-height:1; }
.gb-rar span { display:flex; align-items:center; padding:2px 18px 0; }
.gb-dur { left:22px; right:22px; bottom:16px; height:34px; display:flex; align-items:center; justify-content:center; white-space:nowrap; font-size:18px; letter-spacing:0; line-height:1; }
/* the painting order: body, rim and ornament under the picture, the words over it */
.gb-back { z-index:0; } .gb-frame { z-index:1; } .gb-deco { z-index:1; } .gb-art { z-index:2; }
.gb-name, .gb-desc, .gb-cost { z-index:3; } .gb-dur { z-index:4; } .gb-rar { z-index:5; }
/* a card not collected yet */
.gb-card.ghost .gb-desc, .gb-card.ghost .gb-cost, .gb-card.ghost .gb-dur { display:none; }
.gb-card.ghost .gb-art { opacity:.45; }
.gb-card.ghost .gb-art svg { filter:none !important; }
/* the painted illustration (art.objects card-<family>): in the porthole, a little bigger than the pictogram */
.gb-art.pic img { display:block; position:relative; z-index:1; height:100%; max-height:124px; width:auto; max-width:200px; object-fit:contain; filter:drop-shadow(0 6px 8px rgba(0,0,0,.55)); }
.gb-card.ghost .gb-art.pic img { filter:brightness(0) invert(1) !important; opacity:.42; }
/* the legendary's gradient flows; a foil sweeps */
@keyframes gb-flow  { from { background-position:0% 50%; } to { background-position:300% 50%; } }
@keyframes gb-sweep { from { background-position:150% 0; } to { background-position:-50% 0; } }
@media (prefers-reduced-motion: reduce) {
  .gb-card, .gb-card *, .gb-card *::before, .gb-card *::after { animation:none !important; }
}
</style>

<!-- ===========================================================================
     THE STYLES. One block each, scoped `.gb-card.s-<key>`; data-name and
     data-about are what the panel lists.
     =========================================================================== -->
<style data-style="plate" data-name="Chrome plate" data-about="A riveted plate of the machine's own violet steel, brushed: a chrome bevel tinted by the rarity (a flowing gold-and-current rim on a legendary), the icon lit in a porthole, the rarity on a riveted tab over the top edge, the duration engraved in a slot at the foot. Epic and legendary glow; a legendary's plate catches a sweeping light.">
.gb-card.s-plate .gb-back { border-radius:20px; background:linear-gradient(180deg, #3b3080 0%, #251c58 46%, #150f38 100%); box-shadow:0 18px 30px rgba(0,0,0,.5); }
.gb-card.s-plate .gb-bg { background:repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 3px), linear-gradient(100deg, transparent 30%, rgba(255,255,255,.07) 45%, transparent 60%); }
.gb-card.s-plate .gb-glow { background:radial-gradient(56% 30% at 50% 30%, color-mix(in srgb, var(--c) 38%, transparent), transparent 72%); }
.gb-card.s-plate.r-4 .gb-shine { background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.28) 48%, transparent 58%); background-size:300% 100%; animation:gb-sweep 3s ease-in-out infinite; }
.gb-card.s-plate.r-3 .gb-back, .gb-card.s-plate.r-4 .gb-back { box-shadow:0 0 28px color-mix(in srgb, var(--r) 65%, transparent), 0 18px 30px rgba(0,0,0,.5); }
.gb-card.s-plate .gb-frame {
  border-radius:20px; padding:8px;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  background:linear-gradient(160deg, #ffffff 0%, color-mix(in srgb, var(--r) 55%, #ece8ff) 16%, color-mix(in srgb, var(--r) 45%, #2c2360) 48%, color-mix(in srgb, var(--r) 70%, #ece8ff) 80%, #ffffff 100%);
}
.gb-card.s-plate.r-4 .gb-frame { background:var(--rbg); background-size:var(--rsz); animation:gb-flow 5s linear infinite; }
/* four rivets, six from rare up */
.gb-card.s-plate .gb-deco {
  display:block; inset:12px;
  --rv:radial-gradient(circle 6px, #ffffff 0 1.5px, #c9c2f2 2.5px, #5a4f9a 5px, rgba(0,0,0,.55) 6px, transparent 6.5px);
  background:var(--rv) 0 0 / 14px 14px no-repeat, var(--rv) 100% 0 / 14px 14px no-repeat,
             var(--rv) 0 100% / 14px 14px no-repeat, var(--rv) 100% 100% / 14px 14px no-repeat;
}
.gb-card.s-plate.r-2 .gb-deco, .gb-card.s-plate.r-3 .gb-deco, .gb-card.s-plate.r-4 .gb-deco {
  background:var(--rv) 0 0 / 14px 14px no-repeat, var(--rv) 100% 0 / 14px 14px no-repeat,
             var(--rv) 0 100% / 14px 14px no-repeat, var(--rv) 100% 100% / 14px 14px no-repeat,
             var(--rv) 0 50% / 14px 14px no-repeat, var(--rv) 100% 50% / 14px 14px no-repeat;
}
.gb-card.s-plate .gb-art::before {
  content:""; position:absolute; left:50%; top:50%; height:calc(100% - 4px); max-height:128px; aspect-ratio:1; transform:translate(-50%, -50%);
  border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--c) 24%, #0b0720) 0 52%, #0b0720 70%);
  box-shadow:inset 0 5px 12px rgba(0,0,0,.8), 0 0 0 5px #6f63ad, 0 0 0 7px #2c2360, 0 2px 0 7px rgba(255,255,255,.22);
}
.gb-card.s-plate .gb-art svg { height:calc(100% - 38px); max-height:78px; filter:drop-shadow(0 0 8px color-mix(in srgb, var(--c) 70%, transparent)); }
/* a big painted gear behind the plate, faint: 460 px across, its hub set in from one side of the card
   (--gx, --gy: 0 or 1, per family), so it covers a little more than half of the body, which clips the rest */
.gb-card.s-plate .gb-back::before {
  content:""; position:absolute; width:460px; height:460px;
  left:calc(var(--gx, 1) * 220px + 40px - 230px); top:calc(var(--gy, 1) * 180px + 120px - 230px);
  background:var(--gear, none) center / contain no-repeat; opacity:.16;
  filter:grayscale(1);       /* monochrome: the gear is texture, never a colour of the card */
}
/* an illustration stands on its own: no porthole behind it */
.gb-card.s-plate .gb-art.pic::before { content:none; }
.gb-card.s-plate .gb-art.pic img { max-height:136px; }
.gb-card.s-plate .gb-name { color:#ffffff; text-shadow:0 2px 0 #0b0720, 0 0 14px rgba(0,0,0,.5); }
.gb-card.s-plate .gb-desc { color:#dcd6fa; }
.gb-card.s-plate .gb-cost { padding:4px 10px 5px; border-radius:10px; background:rgba(255,61,110,.12); box-shadow:inset 0 0 0 2px rgba(255,61,110,.5); color:#ffa3b9; }
.gb-card.s-plate .gb-rar { top:-18px; height:40px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
.gb-card.s-plate .gb-rar span {
  padding:2px 24px 0; border-radius:10px; color:#0b0720;
  background:radial-gradient(circle 3px at 10px 50%, #0b0720 0 2px, transparent 3px), radial-gradient(circle 3px at calc(100% - 10px) 50%, #0b0720 0 2px, transparent 3px),
             linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0) 50%, rgba(0,0,0,.18)), var(--rbg);
  background-size:100% 100%, 100% 100%, 100% 100%, var(--rsz);
  box-shadow:0 0 0 3px #0b0720;
}
.gb-card.s-plate.r-4 .gb-rar span { animation:gb-flow 5s linear infinite; }
.gb-card.s-plate .gb-dur { left:20px; right:20px; bottom:16px; border-radius:8px; background:#0b0720; color:#bdb3ee; box-shadow:inset 0 2px 5px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.22); }
</style>

<style data-style="blueprint" data-name="Blueprint" data-about="The machine's drawing: an indigo sheet with its grid, a drafting border, crop marks off the corners, the icon drawn over a compass circle and its axes, the rarity a title tag pinned off the top-right corner, the duration in the title block at the foot, a risk's cost a correction in red pencil. The border doubles in the rarity from rare up and flows on a legendary.">
.gb-card.s-blueprint .gb-back { border-radius:8px; background:radial-gradient(120% 80% at 50% 30%, #262a86, #171a5a 80%); box-shadow:0 16px 30px rgba(0,0,0,.5); }
.gb-card.s-blueprint .gb-bg {
  background:
    linear-gradient(rgba(220,230,255,.16) 1px, transparent 1px) -1px -1px / 100px 100px,
    linear-gradient(90deg, rgba(220,230,255,.16) 1px, transparent 1px) -1px -1px / 100px 100px,
    linear-gradient(rgba(220,230,255,.07) 1px, transparent 1px) -1px -1px / 20px 20px,
    linear-gradient(90deg, rgba(220,230,255,.07) 1px, transparent 1px) -1px -1px / 20px 20px;
}
.gb-card.s-blueprint .gb-glow { background:radial-gradient(50% 28% at 50% 30%, color-mix(in srgb, var(--c) 30%, transparent), transparent 75%); }
.gb-card.s-blueprint .gb-frame { inset:10px; border-radius:3px; border:2px solid rgba(232,240,255,.85); }
.gb-card.s-blueprint.r-2 .gb-frame, .gb-card.s-blueprint.r-3 .gb-frame { border-color:var(--r); box-shadow:inset 0 0 0 4px #1d2070, inset 0 0 0 6px var(--r); }
.gb-card.s-blueprint.r-3 .gb-frame { box-shadow:inset 0 0 0 4px #1d2070, inset 0 0 0 6px var(--r), 0 0 18px var(--r), inset 0 0 18px color-mix(in srgb, var(--r) 50%, transparent); }
.gb-card.s-blueprint.r-4 .gb-frame { border-color:transparent; box-shadow:0 0 22px rgba(255,212,59,.6); }
.gb-card.s-blueprint.r-4 .gb-frame::before {
  content:""; position:absolute; inset:-2px; padding:6px; border-radius:3px;
  background:var(--rbg); background-size:var(--rsz); animation:gb-flow 4s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
/* crop marks, outside the sheet */
.gb-card.s-blueprint .gb-deco {
  display:block; inset:-14px;
  --tk:rgba(232,240,255,.7);
  background:
    linear-gradient(var(--tk), var(--tk)) 0 14px / 10px 2px no-repeat, linear-gradient(var(--tk), var(--tk)) 14px 0 / 2px 10px no-repeat,
    linear-gradient(var(--tk), var(--tk)) 100% 14px / 10px 2px no-repeat, linear-gradient(var(--tk), var(--tk)) calc(100% - 14px) 0 / 2px 10px no-repeat,
    linear-gradient(var(--tk), var(--tk)) 0 calc(100% - 14px) / 10px 2px no-repeat, linear-gradient(var(--tk), var(--tk)) 14px 100% / 2px 10px no-repeat,
    linear-gradient(var(--tk), var(--tk)) 100% calc(100% - 14px) / 10px 2px no-repeat, linear-gradient(var(--tk), var(--tk)) calc(100% - 14px) 100% / 2px 10px no-repeat;
}
.gb-card.s-blueprint .gb-art::before {
  content:""; position:absolute; left:50%; top:50%; height:calc(100% - 6px); max-height:124px; aspect-ratio:1; transform:translate(-50%, -50%);
  border-radius:50%; border:2px dashed rgba(232,240,255,.45);
}
.gb-card.s-blueprint .gb-art::after {

<style data-style="neon" data-name="Neon sign" data-about="A neon sign on the dark wall behind the machine: the icon bent in glowing tube in the card's own colour, the rim a tube in the rarity's — unlit on a common, lit on a rare, flickering on an epic, cycling gold and current on a legendary — the rarity a lit box sign over the top edge and the duration a small plaque hung under the card.">

@keyframes gb-neon-flicker { 0%, 40%, 44%, 76%, 80%, 100% { opacity:1; } 42%, 78% { opacity:.35; } }
@keyframes gb-neon-cycle {
  0%, 100% { border-color:#fff1a8; box-shadow:0 0 8px #ffd43b, 0 0 24px rgba(255,212,59,.75), inset 0 0 8px #ffd43b, inset 0 0 20px rgba(255,212,59,.45); }

.gb-card.s-neon .gb-dur { left:50%; right:auto; transform:translateX(-50%); bottom:-17px; height:34px; padding:2px 16px 0; border-radius:4px; background:#16112e; color:#bdb3ee; box-shadow:0 0 0 2px #3a2f78, 0 8px 12px rgba(0,0,0,.5); }

</head>
<body>

<div id="panel">
  <h1>Gearball cards</h1>
  <p class="hint">The upgrade cards dealt two at a time when the socket charges. Pick a look, then configure the cards. A help card and a score card must read alike: the kind is never drawn.</p>

  <div class="row">
    <label>view</label>
    <div class="seg" id="view">
      <button data-v="style">Style</button>
      <button data-v="compare">Compare</button>
      <button data-v="pick">Pick</button>
    </div>
  </div>

  <div class="row" id="row-styles">
    <label>style</label>
    <div id="styles"></div>
  </div>

  <div class="row" id="row-biome">
    <label>biome</label>
    <div class="seg" id="biome">
      <button data-v="all">All</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button>
    </div>
  </div>

  <div class="row" id="row-rar">
    <label>rarity</label>
    <div class="seg" id="rar">
      <button data-v="all">All</button><button data-v="1">Common</button><button data-v="2">Rare</button><button data-v="3">Epic</button><button data-v="4">Legend.</button>
    </div>
  </div>

  <div class="row">
    <label for="card">card</label>
    <select id="card"></select>
  </div>

  <div class="row" id="row-deal">
    <button class="act soft" id="deal">Deal again</button>
  </div>

  <div class="row" id="row-size">
    <label for="size">width <b id="size-v">300</b></label>
    <input id="size" type="range" min="160" max="440" step="10" value="300">
  </div>

  <div class="row">
    <label>language</label>
    <div class="seg" id="lang"><button data-v="en">EN</button><button data-v="fr">FR</button></div>
  </div>

  <div class="row">
    <label>ground</label>
    <div class="seg" id="ground"><button data-v="round">Round</button><button data-v="home">Village</button><button data-v="flat">Flat</button></div>
  </div>

  <div class="row" id="row-art">
    <label>art</label>
    <div class="seg" id="art"><button data-v="on">Illustration</button><button data-v="off">Pictogram</button></div>
  </div>
  <div class="row" id="row-ghost">
    <label>not collected (ghost)</label>
    <div class="seg" id="ghost"><button data-v="off">Off</button><button data-v="mix">Some</button><button data-v="on">All</button></div>
  </div>

  <div class="row">
    <button class="act" id="copy">Copy CSS</button>
    <button class="act soft" id="audit">Audit text</button>
    <div class="note" id="note"></div>
    <div id="about"></div>
    <div id="audit-out"></div>
  </div>

  <h2>Inspector</h2>
  <div id="insp">
    <div class="meta" id="f-meta"></div>
    <label class="f">name <input id="f-name" type="text"></label>
    <label class="f">text — {n} is the tier's value <textarea id="f-text" rows="3"></textarea></label>
    <label class="f">one — the wording for a value of 1 <input id="f-one" type="text"></label>
    <label class="f">all — the wording for a value of 99 <input id="f-all" type="text"></label>
    <label class="f">cost — a risk card's price <input id="f-cost" type="text"></label>
    <div class="f2">
      <label class="f">colour <input id="f-color" type="color"></label>
      <label class="f">icon <select id="f-icon"></select></label>
    </div>
    <div class="tier-head"><span>rarity</span><span>value</span><span>duration</span><span></span></div>
    <div id="f-tiers"></div>
    <datalist id="durs"><option value="0"><option value="next"><option value="shift"><option value="10"><option value="15"><option value="20"><option value="30"></datalist>
    <button class="act soft" id="f-add">Add a tier</button>
    <button class="act soft" id="f-revert">Revert this family</button>
    <button class="act" id="f-copycat">Copy catalogue</button>
    <div class="note" id="f-note"></div>
  </div>
</div>

<div id="stage" class="bg-round"></div>

    "Tesla coil": "Bobine Tesla",
    "The socket recharges in 20 s": "La prise se recharge en 20 s"
  };

  const BIOMES = ["", "Workshop", "Glassworks", "Maelstrom", "Depths", "Clockwork"];
  const RARITY = {
    1: { en: "Common",    color: "#b8b2dd" },
    2: { en: "Rare",      color: "#3fa0ff" },
    3: { en: "Epic",      color: "#d64dff" },
    4: { en: "Legendary", color: "#ffd43b",
         bg: "linear-gradient(90deg, #ffd43b 0%, #fff3b0 18%, #7ef9ff 36%, #3fa8ff 50%, #7ef9ff 64%, #fff3b0 82%, #ffd43b 100%)" }
  };
  const GHOST = { c: "#5d567a", r: "#6d6690" };

  /* The motor's upper(), copied from button.html: the accents come off and a
     lowercase run glued to a digit (x5, 10 s) is left alone. */
  function upper(str) {
    var FROM = "ÀÁÂÃÄÅÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝŸ";
    var TO = "AAAAAACEEEEIIIINOOOOOOUUUUYY";
    var PAIR = { "Æ": "AE", "Œ": "OE", "ß": "SS" };
    var shouted = String(str == null ? "" : str).replace(
      /[a-zß-öø-ÿœ]+/g, function (run, at, whole) {
        var b = at > 0 ? whole.charAt(at - 1) : "", a = whole.charAt(at + run.length);
        if ((b >= "0" && b <= "9") || (a >= "0" && a <= "9")) return run;
        return run.toUpperCase();
      });
    var out = "", i, c, k;
    for (i = 0; i < shouted.length; i++) {
      c = shouted.charAt(i);
      if (PAIR[c]) { out += PAIR[c]; continue; }
      k = FROM.indexOf(c);
      out += k < 0 ? c : TO.charAt(k);
    }
    return out;
  }

  /* ---- the catalogue, with the inspector's edits over it ------------------- */
  const KEYS = ["key", "biome", "kind", "icon", "color", "name", "text", "one", "all", "cost", "tiers"];
  const STORE = "lab:gearball-cards:edits";
  function clone(f) { return JSON.parse(JSON.stringify(f)); }
  const ORIG = {};
  CARD_FAMS.forEach(function (f) { ORIG[f.key] = clone(f); });
  let EDITS = {};
  try { EDITS = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { EDITS = {}; }
  const FAMS = CARD_FAMS.map(function (f) { return EDITS[f.key] && EDITS[f.key].key === f.key ? clone(EDITS[f.key]) : clone(f); });
  FAMS.forEach(function (f) { KEYS.forEach(function (k) { if (f[k] === "" || f[k] === null) delete f[k]; }); });
  const FAM = {};
  FAMS.forEach(function (f) { FAM[f.key] = f; });
  function famSrc(f) {
    const q = JSON.stringify;
    let a = "      { key: " + q(f.key) + ", biome: " + f.biome + ", kind: " + q(f.kind) + ", icon: " + q(f.icon) +
            ", color: " + q(f.color) + ", name: " + q(f.name) + ",\n        text: " + q(f.text);
    if (f.one != null) a += ", one: " + q(f.one);
    if (f.all != null) a += ", all: " + q(f.all);
    if (f.cost != null) a += ", cost: " + q(f.cost);
    a += ", tiers: [" + f.tiers.map(function (t) {
      return "[" + t[0] + ", " + t[1] + ", " + (typeof t[2] === "number" ? t[2] : q(t[2])) + "]";
    }).join(", ") + "] }";
    return a;
  }
  function edited(key) { return famSrc(FAM[key]) !== famSrc(ORIG[key]); }
  function persist(key) {
    if (edited(key)) EDITS[key] = clone(FAM[key]); else delete EDITS[key];
    try { localStorage.setItem(STORE, JSON.stringify(EDITS)); } catch (e) { /* private window: edits live in memory */ }
  }
  function catalogueSrc() {
    let out = "    var CARD_FAMS = [\n", last = 0;
    FAMS.forEach(function (f, i) {
      if (f.biome !== last) { out += (i ? "\n" : "") + "      " + (BIOME_NOTE[f.biome] || "// " + f.biome + " · " + BIOMES[f.biome]) + "\n"; last = f.biome; }
      out += famSrc(f) + (i < FAMS.length - 1 ? ",\n" : "\n");
    });
    return out + "    ];\n";
  }

  /* ---- the cards: one per tier of a family -------------------------------- */
  function cards() {
    const list = [];
    FAMS.forEach(function (f) { f.tiers.forEach(function (t, i) { list.push({ id: f.key + ":" + i, fam: f, tier: i }); }); });
    return list;
  }
  function byId(id) {
    const p = String(id).split(":"), f = FAM[p[0]];
    if (!f) return null;
    const i = Math.max(0, Math.min(f.tiers.length - 1, +p[1] || 0));
    return { id: f.key + ":" + i, fam: f, tier: i };
  }

  /* ---- the words ----------------------------------------------------------- */
  function T(str, lang) { return lang === "fr" && FR[str] ? FR[str] : str; }
  /* French puts a space before % : ; ! ? — a no-break one, so the sign never
     starts a line alone ("20 %" stays whole) */
  function nb(str) { return String(str).replace(/ ([%:;!?»])/g, "\u00a0$1").replace(/« /g, "«\u00a0"); }
  function descOf(f, t, lang) {
    const v = t[1];
    const tpl = v === 1 && f.one ? f.one : v >= 99 && f.all ? f.all : f.text;
    return nb(T(tpl, lang).split("{n}").join(String(v)));
  }
  function durOf(d, lang) {
    if (d === "next") return T("Until the next pick", lang);
    if (d === "shift") return T("Whole shift", lang);
    if (typeof d === "number" && d > 0) return "{n} s".split("{n}").join(String(d));
    return T("Now", lang);
  }

  /* THE STYLES, read off their own <style data-style> blocks */
  const STYLES = [].map.call(document.querySelectorAll("style[data-style]"), function (n) {
    return { key: n.getAttribute("data-style"), name: n.getAttribute("data-name"), about: n.getAttribute("data-about"), node: n };
  });

  /* THE ILLUSTRATION a family ships: `card-<family>` of art.objects, encoded
     into assets/image/embed/ (games/gearball/game.js, cardArt). The panel's
     "art" switch puts the lucide pictogram back, to compare. */
  // the plate's gear corner, per family — the same hash as gearCorner in game.js
  function gearCorner(key) { var h = 0, i; for (i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) | 0; return (h >>> 0) % 4; }
  function artSrc(key) {
    return "../assets/image/embed/gearball-card-" + key.replace(/[A-Z]/g, function (c) { return "-" + c.toLowerCase(); }) + ".webp";
  }

  /* ONE CARD — the structure the head comment describes; cardNode in
     games/gearball/game.js builds the same nodes and the same tokens. */
  function cardNode(card, style, w, ghost, lang) {
    const f = card.fam, t = f.tiers[card.tier], R = RARITY[t[0]] || RARITY[1];
    const cost = !ghost && f.cost;
    const box = document.createElement("div");
    box.className = "gb-cbox";
    box.style.width = w + "px"; box.style.height = Math.round(w * 1.4) + "px";
    const n = document.createElement("div");
    n.className = "gb-card s-" + style + " r-" + (ghost ? 1 : t[0]) + (cost ? " has-cost" : "") + (ghost ? " ghost" : "");
    n.style.setProperty("--sk", w / 300);
    n.style.setProperty("--c", ghost ? GHOST.c : f.color);
    n.style.setProperty("--r", ghost ? GHOST.r : R.color);
    n.style.setProperty("--rbg", ghost ? GHOST.r : (R.bg || R.color));
    n.style.setProperty("--gear", 'url("../assets/image/embed/gearball-decor-02.webp")');
    n.style.setProperty("--gx", gearCorner(f.key) & 1); n.style.setProperty("--gy", gearCorner(f.key) >> 1);
    n.innerHTML =
      '<div class="gb-back"><div class="gb-bg"></div><div class="gb-glow"></div><div class="gb-shine"></div></div>' +
      '<div class="gb-frame"></div>' +
      '<div class="gb-deco"></div>' +
      (S.art === "off" ? '<div class="gb-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        (CARD_SVG[f.icon] || "") + "</svg></div>" :
        '<div class="gb-art pic"><img alt="" draggable="false" src="' + artSrc(f.key) + '"></div>') +
      '<div class="gb-rar"><span></span></div>' +
      '<div class="gb-name"></div>' +
      '<div class="gb-desc"></div>' +
      (cost ? '<div class="gb-cost"></div>' : "") +
      '<div class="gb-dur"></div>';
    n.querySelector(".gb-rar span").textContent = ghost ? "???" : upper(T(R.en, lang));
    n.querySelector(".gb-name").textContent = ghost ? "???" : upper(T(f.name, lang));
    n.querySelector(".gb-desc").textContent = ghost ? "" : descOf(f, t, lang);
    if (cost) n.querySelector(".gb-cost").textContent = nb(T(f.cost, lang));
    n.querySelector(".gb-dur").textContent = ghost ? "" : upper(durOf(t[2], lang));
    box.appendChild(n);
    return box;
  }

  /* ---- the state, kept in the hash so a reload comes back to it ----------- */
  const S = { art: "on", view: "style", style: "plate", biome: "1", rar: "all", card: "spareHeart:0", size: 300,
              lang: "en", ground: "round", ghost: "off", pair: "" };
  let AUTO_AUDIT = false;
  (location.hash.slice(1) || "").split("&").forEach(function (kv) {
    const p = kv.split("=");
    if (p[0] === "audit") AUTO_AUDIT = true;
    if (p[0] in S && p[1]) S[p[0]] = p[0] === "size" ? +p[1] : decodeURIComponent(p[1]);
  });
  if (!byId(S.card)) S.card = cards()[0].id;
  if (!STYLES.some(function (s) { return s.key === S.style; })) S.style = STYLES[0].key;
  function save() {
    history.replaceState(null, "", "#" + Object.keys(S).map(function (k) { return k + "=" + encodeURIComponent(S[k]); }).join("&"));
  }

  const $ = function (id) { return document.getElementById(id); };
  const stage = $("stage");

  function filtered() {
    return cards().filter(function (c) {
      return (S.biome === "all" || c.fam.biome === +S.biome) && (S.rar === "all" || c.fam.tiers[c.tier][0] === +S.rar);
    });
  }

  /* the pick: one help card against one of the others, in either order */
  function deal() {
    const top = S.biome === "all" ? 5 : +S.biome;
    const pool = cards().filter(function (c) { return c.fam.biome <= top; });
    const help = pool.filter(function (c) { return c.fam.kind === "help"; });
    const other = pool.filter(function (c) { return c.fam.kind !== "help"; });
    const pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
    const pair = [pick(help), pick(other)];
    if (Math.random() < 0.5) pair.reverse();
    S.pair = pair.map(function (c) { return c.id; }).join(",");
  }

  function cellFor(node, size, cap, onClick, sel) {
    const cell = document.createElement("div");
    cell.className = "cell" + (sel ? " sel" : "");
    /* room for what leaves the card: a tab, a dial, a plaque off the foot */
    const pad = Math.round(70 * size / 300);
    cell.style.padding = pad + "px " + Math.round(pad * 0.8) + "px " + Math.round(pad * 0.6) + "px";
    cell.style.gap = Math.round(14 + 18 * size / 300) + "px";
    cell.appendChild(node);
    if (cap) { const c = document.createElement("div"); c.className = "cap"; c.innerHTML = cap; cell.appendChild(c); }
    cell.addEventListener("click", onClick);
    return cell;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function paint() {
    stage.innerHTML = "";
    stage.className = "bg-" + S.ground + " v-" + S.view;
    $("row-styles").style.display = S.view === "compare" ? "none" : "";
    $("row-rar").style.display = S.view === "style" ? "" : "none";
    $("row-biome").style.display = S.view === "compare" ? "none" : "";
    $("row-deal").style.display = S.view === "pick" ? "" : "none";
    $("row-size").style.display = S.view === "pick" ? "none" : "";
    $("row-ghost").style.display = S.view === "pick" ? "none" : "";
    if (S.view === "style") {
      filtered().forEach(function (c, i) {
        const ghost = S.ghost === "on" || (S.ghost === "mix" && i % 3 === 2);
        const cap = esc(BIOMES[c.fam.biome]) + " · tier " + (c.tier + 1) + (edited(c.fam.key) ? " · <i>edited</i>" : "");
        stage.appendChild(cellFor(cardNode(c, S.style, S.size, ghost, S.lang), S.size, cap,
          function () { S.card = c.id; light(); paint(); }, c.id === S.card));
      });
      if (!stage.children.length) stage.textContent = "No card in this filter.";
    } else if (S.view === "compare") {
      const c = byId(S.card);
      STYLES.forEach(function (st, i) {
        const ghost = S.ghost === "on" || (S.ghost === "mix" && i % 3 === 2);
        stage.appendChild(cellFor(cardNode(c, st.key, S.size, ghost, S.lang), S.size, esc(st.name),
          function () { S.view = "style"; S.style = st.key; sync(); }, false));
      });
    } else {
      paintPick();
    }
    const st = STYLES.filter(function (s) { return s.key === S.style; })[0];
    $("about").textContent = S.view === "compare" ? "Click a card to open that style." : (st ? st.about : "");
    $("copy").textContent = "Copy CSS — " + (st ? st.name : "");
    save();
  }

  function paintPick() {
    let pair = S.pair.split(",").map(byId).filter(Boolean);
    if (pair.length !== 2) { deal(); pair = S.pair.split(",").map(byId); }
    const W = Math.max(200, stage.clientWidth - 40), H = Math.max(300, window.innerHeight - 40);
    const k = Math.min(W / 720, H / 1280);
    const box = document.createElement("div");
    box.className = "pick-box";
    box.style.width = Math.round(720 * k) + "px"; box.style.height = Math.round(1280 * k) + "px";
    const fr = document.createElement("div");
    fr.className = "pick-frame";
    fr.style.transform = "scale(" + k + ")";
    fr.innerHTML = '<div class="pick-veil"></div><div class="pick-eyebrow"></div><div class="pick-title"></div><div class="pick-row"></div><div class="pick-tap"></div>';
    fr.querySelector(".pick-eyebrow").textContent = upper(T("Socket charged", S.lang));
    fr.querySelector(".pick-title").textContent = upper(T("Pick one", S.lang));
    fr.querySelector(".pick-tap").textContent = upper(T("Tap a card to take it", S.lang));
    pair.forEach(function (c) {
      const n = cardNode(c, S.style, 290, false, S.lang);
      n.addEventListener("click", function () { S.card = c.id; light(); fillInspector(); save(); });
      fr.querySelector(".pick-row").appendChild(n);
    });
    box.appendChild(fr);
    stage.appendChild(box);
  }

  /* ---- the panel ---------------------------------------------------------- */
  STYLES.forEach(function (st) {
    const b = document.createElement("button");
    b.setAttribute("data-v", st.key);
    b.textContent = st.name;
    b.addEventListener("click", function () { S.style = st.key; sync(); });
    $("styles").appendChild(b);
  });
  function fillCardSelect() {
    const sel = $("card");
    sel.innerHTML = "";
    let group = null, last = 0;
    cards().forEach(function (c) {
      if (c.fam.biome !== last) {
        group = document.createElement("optgroup"); group.label = c.fam.biome + " · " + BIOMES[c.fam.biome];
        sel.appendChild(group); last = c.fam.biome;
      }
      const o = document.createElement("option");
      o.value = c.id;
      o.textContent = (edited(c.fam.key) ? "● " : "") + c.fam.name + " · " + BIOMES[c.fam.biome] + " · " + RARITY[c.fam.tiers[c.tier][0]].en;
      group.appendChild(o);
    });
    sel.value = S.card;
  }
  $("card").addEventListener("change", function () { S.card = this.value; light(); fillInspector(); paint(); });
  function seg(id, key) {
    [].forEach.call($(id).querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () { S[key] = b.getAttribute("data-v"); sync(); });
    });
  }
  seg("view", "view"); seg("biome", "biome"); seg("rar", "rar"); seg("lang", "lang"); seg("ground", "ground"); seg("ghost", "ghost"); seg("art", "art");
  $("size").addEventListener("input", function () { S.size = +this.value; sync(); });
  $("deal").addEventListener("click", function () { deal(); paint(); });
  window.addEventListener("resize", function () { if (S.view === "pick") paint(); });

  function light() {
    [["view", "view"], ["biome", "biome"], ["rar", "rar"], ["lang", "lang"], ["ground", "ground"], ["ghost", "ghost"], ["art", "art"], ["styles", "style"]].forEach(function (p) {
      [].forEach.call($(p[0]).querySelectorAll("button"), function (b) { b.classList.toggle("on", b.getAttribute("data-v") === String(S[p[1]])); });
    });
    $("card").value = S.card;
    $("size").value = S.size;
    $("size-v").textContent = S.size;
  }
  function sync() { light(); paint(); }

  function copyText(text, note, label) {
    const done = function (ok) { $(note).textContent = ok ? "Copied: " + label : "Copy refused by the browser — select it in the page source."; };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    else done(false);
  }
  /* COPY CSS: the base block and the style's own block, which is what moves
     into the SKIN */
  $("copy").addEventListener("click", function () {
    const st = STYLES.filter(function (s) { return s.key === S.style; })[0];
    const css = "/* ---- GEARBALL UPGRADE CARD — base ---- */\n" + $("card-base").textContent.trim() +
                "\n\n/* ---- GEARBALL UPGRADE CARD — " + st.name + " ---- */\n" + st.node.textContent.trim() + "\n";
    copyText(css, "note", "base + " + st.name);
  });

  /* ---- the inspector ------------------------------------------------------- */
  Object.keys(CARD_SVG).forEach(function (k) {
    const o = document.createElement("option"); o.value = k; o.textContent = k; $("f-icon").appendChild(o);
  });
  function cur() { return byId(S.card).fam; }
  function fillInspector() {
    const f = cur();
    $("f-meta").innerHTML = esc(f.key) + " · " + esc(BIOMES[f.biome]) + " · kind " + esc(f.kind) + " (never drawn)" + (edited(f.key) ? " · <i>edited</i>" : "");
    $("f-name").value = f.name || "";
    $("f-text").value = f.text || "";
    $("f-one").value = f.one || "";
    $("f-all").value = f.all || "";
    $("f-cost").value = f.cost || "";
    $("f-color").value = /^#[0-9a-f]{6}$/i.test(f.color) ? f.color : "#ffffff";
    $("f-icon").value = f.icon;
    const box = $("f-tiers");
    box.innerHTML = "";
    f.tiers.forEach(function (t, i) {
      const row = document.createElement("div");
      row.className = "tier";
      row.innerHTML = '<select data-i="' + i + '" data-k="0">' +
        [1, 2, 3, 4].map(function (r) { return '<option value="' + r + '">' + RARITY[r].en + "</option>"; }).join("") + "</select>" +
        '<input data-i="' + i + '" data-k="1" type="number" step="any">' +
        '<input data-i="' + i + '" data-k="2" type="text" list="durs" title="seconds, next, shift, or 0 for now">' +
        '<button data-i="' + i + '" title="Remove this tier">×</button>';
      row.querySelector('[data-k="0"]').value = t[0];
      row.querySelector('[data-k="1"]').value = t[1];
      row.querySelector('[data-k="2"]').value = t[2];
      box.appendChild(row);
    });
    $("f-revert").disabled = !edited(f.key);
  }
  function changed() {
    const f = cur();
    persist(f.key);
    fillCardSelect();
    $("f-revert").disabled = !edited(f.key);
    $("f-meta").innerHTML = esc(f.key) + " · " + esc(BIOMES[f.biome]) + " · kind " + esc(f.kind) + " (never drawn)" + (edited(f.key) ? " · <i>edited</i>" : "");
    paint();
  }
  [["f-name", "name"], ["f-text", "text"], ["f-one", "one"], ["f-all", "all"], ["f-cost", "cost"]].forEach(function (p) {
    $(p[0]).addEventListener("input", function () {
      const f = cur();
      if (this.value === "" && p[1] !== "name" && p[1] !== "text") delete f[p[1]]; else f[p[1]] = this.value;
      changed();
    });
  });
  $("f-color").addEventListener("input", function () { cur().color = this.value; changed(); });
  $("f-icon").addEventListener("change", function () { cur().icon = this.value; changed(); });
  $("f-tiers").addEventListener("input", function (e) {
    const el = e.target, i = +el.getAttribute("data-i"), k = +el.getAttribute("data-k");
    if (isNaN(k)) return;
    const t = cur().tiers[i];
    if (k === 0) t[0] = +el.value;
    else if (k === 1) { const v = parseFloat(el.value); if (!isNaN(v)) t[1] = v; }
    else { const v = el.value.trim(); if (/^\d+(\.\d+)?$/.test(v)) t[2] = +v; else if (v === "next" || v === "shift") t[2] = v; else return; }
    changed();
  });
  $("f-tiers").addEventListener("click", function (e) {
    if (e.target.tagName !== "BUTTON") return;
    const f = cur();
    if (f.tiers.length < 2) { $("f-note").textContent = "A family keeps at least one tier."; return; }
    f.tiers.splice(+e.target.getAttribute("data-i"), 1);
    S.card = byId(S.card).id;
    fillInspector(); changed();
  });
  $("f-add").addEventListener("click", function () {
    const f = cur(), t = f.tiers[f.tiers.length - 1];
    f.tiers.push([Math.min(4, t[0] + 1), t[1], t[2]]);
    S.card = f.key + ":" + (f.tiers.length - 1);
    fillInspector(); changed();
  });
  $("f-revert").addEventListener("click", function () {
    const k = cur().key, o = clone(ORIG[k]), f = FAM[k];
    Object.keys(f).forEach(function (p) { delete f[p]; });
    Object.assign(f, o);
    S.card = byId(S.card).id;
    persist(k); fillInspector(); fillCardSelect(); paint();
    $("f-note").textContent = "Reverted: " + o.name;
  });
  $("f-copycat").addEventListener("click", function () {
    const n = Object.keys(EDITS).length;
    copyText(catalogueSrc(), "f-note", "CARD_FAMS, " + FAMS.length + " families" + (n ? ", " + n + " edited" : ""));
  });

  /* ---- AUDIT TEXT: every card, in every style, in both languages ----------
     A word under its floor, a word wider than its line, a plate whose text
     leaves it, two words that overlap, a picture squeezed by a long text. */
  function audit() {
    const host = document.createElement("div");
    host.style.cssText = "position:absolute; left:0; top:0; width:1px; height:1px; overflow:hidden; visibility:hidden; pointer-events:none;";
    document.body.appendChild(host);
    const out = [], counts = {};
    const all = cards();
    function rectOf(el, ink) {
      if (!ink) return el.getBoundingClientRect();
      const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect();
    }
    function hit(a, b) {
      return Math.min(a.right, b.right) - Math.max(a.left, b.left) > 2 && Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) > 2;
    }
    STYLES.forEach(function (st) {
      ["en", "fr"].forEach(function (lang) {
        [false, true].forEach(function (ghost) {
          host.innerHTML = "";
          const nodes = (ghost ? all.slice(0, 3) : all).map(function (c) { const b = cardNode(c, st.key, 300, ghost, lang); host.appendChild(b); return { c: c, n: b.firstChild }; });
          nodes.forEach(function (o) {
            const n = o.n, tag = st.key + " " + lang + (ghost ? " ghost" : "") + " " + o.c.id + ": ";
            const parts = [["rar", n.querySelector(".gb-rar span"), true, false], ["name", n.querySelector(".gb-name"), true, true],
                           ["desc", n.querySelector(".gb-desc"), false, true], ["cost", n.querySelector(".gb-cost"), false, false],
                           ["dur", n.querySelector(".gb-dur"), true, false]]
              .filter(function (p) { return p[1] && getComputedStyle(p[1]).display !== "none" && p[1].textContent; });
            const fail = function (msg) { out.push(tag + msg); counts[st.key] = (counts[st.key] || 0) + 1; };
            parts.forEach(function (p) {
              const cs = getComputedStyle(p[1]), fs = parseFloat(cs.fontSize);
              const bold = +cs.fontWeight >= 600 || /russo|bungee|bebas/i.test(cs.fontFamily);
              const floor = p[2] ? (bold ? 18 : 20) : (bold ? 20 : 22);
              if (fs < floor) fail(p[0] + " at " + fs + " px, floor " + floor);
              if (p[1].scrollWidth > p[1].clientWidth + 1) fail(p[0] + " wider than its box (" + p[1].scrollWidth + " > " + p[1].clientWidth + ")");
            });
            for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) {
              if (hit(rectOf(parts[i][1], parts[i][3]), rectOf(parts[j][1], parts[j][3]))) fail(parts[i][0] + " overlaps " + parts[j][0]);
            }
            const svg = n.querySelector(".gb-art svg").getBoundingClientRect();
            if (svg.height < 46) fail("art squeezed to " + Math.round(svg.height) + " px");
          });
        });
      });
    });
    host.remove();
    const head = STYLES.map(function (s) { return s.key + " " + (counts[s.key] || 0); }).join(" · ");
    $("audit-out").textContent = (out.length ? out.length + " problem(s) — " : "No problem — ") + head + (out.length ? "\n" + out.join("\n") : "");
  }
  $("audit").addEventListener("click", function () {
    $("audit-out").textContent = "Auditing…";
    setTimeout(audit, 20);
  });

  fillCardSelect();
  fillInspector();
  sync();
  if (AUTO_AUDIT) {
    const go = function () { setTimeout(audit, 50); };
    if (document.fonts && document.fonts.load) document.fonts.load('28px "Russo One"').then(go, go); else go();
  }
})();
</script>
</body>
