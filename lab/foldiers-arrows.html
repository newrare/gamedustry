<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ===========================================================================
   FOLDIERS ORDER ARROWS — every order the round can give, in the look it is
   drawn in, and the one change tried here: AN ORDER CARRIES ITS TROOPS.

   The problem it answers: past a handful of orders the map reads as a pile.
   Every figure still stands on its region whether it was given an order or
   not, every arrow runs out of that crowd, and the eye has to pair each
   arrow with the figures it moves. So here, once a troop or a piece has an
   order it LEAVES the map: what is left standing on a region is what still
   owes an order, and the troops given one ride ON their arrow — one small
   paper bead a kind of troop (infantry, cavalry, a cannon, a ship…), no
   count, the troop printed big and cropped by the disc, the disc cut out
   of the same paper as every tag (fold, crease, grain, hand-cut edge),
   strung along the shaft around its middle, so the string follows
   the curve and never sticks out of it. Two strings that would touch slide
   along their own arrows until they clear each other.

   Round 2 also settles the shapes: ONE folded strip for every march (an
   attack and a reinforcement alike — the chevrons are gone), a head on the
   dashed lines (cannon shot, bridge) and on the footprints (road march,
   fleet, a march under way), so every order says which way it goes. Defend
   and Wait are one element each: the paper badge of what stays, whose
   border IS the looped arrow, a folded strip in the order's colour. A
   rival's plan carries no eye: what shows it is already on the map.

   Three views:
     - Map: a dense stage, every kind of order on it at once;
     - Before / after: the map as the round draws it today (figures, counts,
       chevrons, the loop over the figure) beside the beads;
     - Catalogue: every kind of order alone on a scrap of map.

   The arrows, the paper generator (ppSheet, ppSprite, paperOn…), the tags,
   the old loop and the eye are copied as they are from
   games/foldiers/game.js (THE ARROWS, THE PAPER, THE TAGS). The ground is a
   stand-in for the round's paper: a Voronoi of regions in shards, tinted by
   owner. Copy settings is the panel as JSON.

   Nothing here ships by itself. What was picked — paper discs, troops on
   the arrow only, 45 % along, no lift, 32 px, sliding to clear, no tag at
   the head, no count on the map — is ported into games/foldiers/game.js as
   THE ORDER CARRIES ITS TROOPS (orderBeads, beadSprite, ringSprite,
   holdRing) and in THE ARROWS (one strip, orderHead).
   =========================================================================== */
@font-face { font-family:"Baloo 2"; src:url("../assets/motor/font/baloo2.woff2") format("woff2"); font-weight:400 800; }

* { box-sizing:border-box; margin:0; padding:0; }
body {
  min-height:100vh; display:flex; background:#0b0b12; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
#panel { flex:0 0 300px; padding:22px 20px; background:#12121c; border-right:1px solid #23233a; overflow:auto; max-height:100vh; }
#panel h1 { font-size:16px; letter-spacing:1px; }

.row { margin-bottom:12px; }
.row > label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; margin-bottom:6px; }
.row > label output { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; accent-color:#7ea6ff; }
.seg { display:flex; flex-wrap:wrap; gap:4px; }
.seg button { flex:1 1 auto; padding:7px 8px; background:#1c1c2c; color:#c9c9e0; border:1px solid #2c2c47;
  border-radius:7px; font:600 12px/1 inherit; cursor:pointer; }

.btns button.main { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }

#stage { flex:1; height:100vh; overflow:auto; display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:22px; padding:20px;
  background-image:linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%),linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%);
  background-size:32px 32px; background-position:0 0,16px 16px; }

<body>
<div id="panel">
  <h1>Foldiers · order arrows</h1>
  <p class="hint">Every order the round can give, its troops strung on the arrow as small paper beads, one a kind. A troop with an order leaves the map: what still stands on a region still owes one.</p>

  <h3>View</h3>
  <div class="seg" id="view">
    <button data-v="map">Map</button><button data-v="compare">Before / after</button><button data-v="cat">Catalogue</button>
  </div>

  <h3>Troops with an order</h3>
  <div class="seg" id="hide">
    <button data-v="1">On the arrow only</button><button data-v="0">Left on the map</button>
  </div>

  <h3>Badge</h3>
  <div class="seg" id="style">
    <button data-v="disc">Paper discs</button><button data-v="rosette">Rosettes</button><button data-v="none">None</button>
  </div>
  <div class="row" style="margin-top:12px"><label>Along the arrow <output id="o-t"></output></label><input type="range" id="t" min="0.2" max="0.8" step="0.05"></div>
  <div class="row"><label>Off the shaft <output id="o-lift"></output></label><input type="range" id="lift" min="0" max="30" step="2"></div>
  <div class="row"><label>Badge size <output id="o-size"></output></label><input type="range" id="size" min="22" max="48" step="2"></div>
  <div class="seg" id="slide">
    <button data-v="1">Slide along to clear</button><button data-v="0">Leave them</button>
  </div>

  <h3>Counts</h3>
  <div class="seg" id="head">
    <button data-v="1">Forecast at the head</button><button data-v="0">No head tag</button>
  </div>
  <div class="seg" id="counts" style="margin-top:6px">
    <button data-v="1">Counts on the map</button><button data-v="0">No counts</button>
  </div>

  <h3>Map</h3>
  <div class="row"><label>Zoom <output id="o-z"></output></label><input type="range" id="z" min="1.2" max="2.4" step="0.1"></div>
  <div class="row"><label>Paper tilt <output id="o-tilt"></output></label><input type="range" id="tilt" min="0" max="12" step="1"></div>
  <div class="kinds" id="kinds"></div>

  <div class="btns"><button id="reseed">Reseed paper</button><button class="main" id="copy">Copy settings</button></div>
  <div id="copied"></div>
</div>
<div id="stage"></div>
<script>
// ---- what the copied game code expects around it ---------------------------
var view = { dpr: 2 };
var ctx = null;
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function freeCanvas(cv) { if (cv) { cv.width = 0; cv.height = 0; } return null; }
var FONT = '"Baloo 2", system-ui, -apple-system, sans-serif';
function font(size, bold) { return (bold ? "700 " : "500 ") + size + "px " + FONT; }

// ---- the camps and the inks (games/foldiers/game.js) -----------------------
var NEUTRAL = 0, BLUE = 1, RED = 2, GREEN = 3;
var CAMP = [
  { base: "#b9a77d", light: "#d8c79c", dark: "#8a7a55", rgb: [150, 140, 110] },
  { base: "#2f63c4", light: "#5b8fe0", dark: "#1d3f8a", rgb: [47, 99, 196] },
  { base: "#d9412f", light: "#ee6a4a", dark: "#a52a1f", rgb: [217, 65, 47] },
  { base: "#2f9e5a", light: "#5cc283", dark: "#1d6b3c", rgb: [47, 158, 90] }
];
var OK_COL = "#2f8f4e", BAD_COL = "#c8402f", RISK_COL = "#d08a12", TIE_COL = "#6d7486", LATER_COL = "#b07a10";
var PAPER = "#f6ecd2", INK = "#2a2418", IDLE_COL = "#8a94a8", RIVER_INK = "#2f7fb5", SHOT_COL = "#e07a2a";

// ======================================================================
//  COPIED FROM games/foldiers/game.js — THE ARROWS (curve, paperArrow,
//  chevrons, footprints), as they are.
// ======================================================================
function curve(a, b, bend, r0, r1) {
  var dx = b[0] - a[0], dy = b[1] - a[1], c = [(a[0] + b[0]) / 2 - dy * bend, (a[1] + b[1]) / 2 + dx * bend], pts = [];
  for (var i = 0; i <= 40; i++) {
    var t = i / 40, u = 1 - t;
    var p = [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]];
    if (Math.hypot(p[0] - a[0], p[1] - a[1]) < r0 || Math.hypot(p[0] - b[0], p[1] - b[1]) < r1) continue;
    pts.push(p);
  }
  return pts;
}
function paperArrow(pts, C, draft) {
  var n = pts.length;
  if (n < 3) return null;
  var hl = 30, w = 11, hw = 26, L = 0, cum = [0], i;
  for (i = 1; i < n; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(L); }
  var iB = n - 1;
  while (iB > 1 && L - cum[iB] < hl) iB--;
  var left = [], mid = [], right = [];
  for (i = 0; i <= iB; i++) {
    var p = pts[i], q = pts[Math.min(n - 1, i + 1)], o = pts[Math.max(0, i - 1)];
    var tx = q[0] - o[0], ty = q[1] - o[1], l = Math.hypot(tx, ty) || 1;
    tx /= l; ty /= l;
    left.push([p[0] - ty * w, p[1] + tx * w]); right.push([p[0] + ty * w, p[1] - tx * w]); mid.push(p);
  }
  var B2 = pts[iB], Tp = pts[n - 1], dx = Tp[0] - B2[0], dy = Tp[1] - B2[1], dl = Math.hypot(dx, dy) || 1, nx = -dy / dl, ny = dx / dl;
  var wl = [B2[0] + nx * hw, B2[1] + ny * hw], wr = [B2[0] - nx * hw, B2[1] - ny * hw];
  function outline(ox, oy) {
    ctx.beginPath();
    left.forEach(function (pp, ix) { ctx[ix ? "lineTo" : "moveTo"](pp[0] + ox, pp[1] + oy); });
    ctx.lineTo(wl[0] + ox, wl[1] + oy); ctx.lineTo(Tp[0] + ox, Tp[1] + oy); ctx.lineTo(wr[0] + ox, wr[1] + oy);
    for (var k = right.length - 1; k >= 0; k--) ctx.lineTo(right[k][0] + ox, right[k][1] + oy);
    ctx.closePath();
  }
  outline(4, 7); ctx.fillStyle = "rgba(20,30,70,.22)"; ctx.fill();
  outline(0, 0); ctx.fillStyle = draft ? C.light : C.base; ctx.fill();
  ctx.beginPath();
  left.forEach(function (pp, ix) { ctx[ix ? "lineTo" : "moveTo"](pp[0], pp[1]); });
  ctx.lineTo(wl[0], wl[1]); ctx.lineTo(Tp[0], Tp[1]);
  for (i = mid.length - 1; i >= 0; i--) ctx.lineTo(mid[i][0], mid[i][1]);
  ctx.closePath(); ctx.fillStyle = draft ? "rgba(255,255,255,.55)" : C.light; ctx.fill();
  ctx.beginPath(); mid.forEach(function (pp, ix) { ctx[ix ? "lineTo" : "moveTo"](pp[0], pp[1]); }); ctx.lineTo(Tp[0], Tp[1]);
  if (draft) ctx.setLineDash([7, 6]);
  ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();
  ctx.setLineDash([]);
  outline(0, 0); ctx.lineWidth = 1.4; ctx.strokeStyle = C.dark; ctx.stroke();
  return Tp;
}
function chevrons(pts, C, draft) {
  if (pts.length < 4) return null;
  var step = 6;
  for (var i = 3; i < pts.length - 1; i += step) {
    var p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)], dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
    ctx.beginPath();
    ctx.moveTo(p[0] - dx * 9 - dy * 13, p[1] - dy * 9 + dx * 13);
    ctx.lineTo(p[0] + dx * 7, p[1] + dy * 7);
    ctx.lineTo(p[0] - dx * 9 + dy * 13, p[1] - dy * 9 - dx * 13);
    ctx.lineTo(p[0] - dx * 3, p[1] - dy * 3);
    ctx.closePath();
    ctx.fillStyle = draft ? C.light : C.base; ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = C.dark; ctx.stroke();
  }
  return pts[pts.length - 1];
}
function footprints(pts, C) {
  for (var i = 2, s = 0; i < pts.length; i += 4, s++) {
    var p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)], dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
    var side = s % 2 ? 1 : -1;
    ctx.beginPath(); ctx.ellipse(p[0] - dy * 6 * side, p[1] + dx * 6 * side, 5, 3.4, Math.atan2(dy, dx), 0, Math.PI * 2);
    ctx.fillStyle = C.dark; ctx.globalAlpha = 0.75; ctx.fill(); ctx.globalAlpha = 1;
  }
  return pts[pts.length - 1];
}

// ======================================================================
//  COPIED FROM games/foldiers/game.js — THE PAPER (LOOK, the generator,
//  ppSprite, paperOn / paperOff), as it is.
// ======================================================================
var LOOK = { tilt: 6, rough: 7, fold: "crumple", depth: 0.8, kink: 0, ear: 10, tape: "clear", tapeSmall: true,
             grain: 0.5, shadow: 0.5, seed: 19 };
var PP_BACK = "#e3d2a6", PP_EDGE = "rgba(110,85,40,.28)";
var PP_TAPE = {
  masking: { a: "rgba(236,220,172,.9)" },
  clear: { a: "rgba(255,255,255,.32)", gloss: true }
};
var ACT_EARS = [1, 1, 0, 1];
// What each kind of piece is made of, before the look (the lab's recipeOf).
var PP_RECIPE = {
  card:    { sheet: true, earCorner: 2, tape: ["tl", "tr"], tiltK: 0.35, tapeLen: 100 },
  rtitle:  { sheet: true, earCorner: 3, tape: ["t"], tiltK: 0.6, tapeLen: 80 },
  send:    { sheet: true, earCorner: 1, tape: ["l", "r"], tiltK: 0.6 },
  own:     { fold: "diag", tiltK: 1.2 },
  act:     { fold: LOOK.fold === "accordion" ? "accordion" : LOOK.fold === "none" ? "none" : "diag", ear: Math.min(LOOK.ear, 16), tiltK: 0.8 },
  chip:    { tape: ["l"], small: true, tapeLen: 40, tiltK: 0.9, notch: 7, edge: "rgba(0,0,0,.25)" },
  tag:     { fold: LOOK.fold === "none" ? "none" : "tent", tape: ["t"], small: true, tapeLen: 30, tiltK: 1.6 },
  prod:    { fold: LOOK.fold === "none" ? "none" : "tent", tiltK: 2 },
  shield:  { shape: "shield", tiltK: 1.4 },
  threat:  { fold: LOOK.fold === "none" ? "none" : "diag", tape: ["r"], small: true, tapeLen: 30, tiltK: 1.4 },
  verdict: { notch: 9, fold: LOOK.fold === "none" ? "none" : "diag", tape: ["l"], small: true, tapeLen: 36, tiltK: 1.4 },
  bub:     { shape: "radial", tiltK: 2, edge: "rgba(0,0,0,.25)" },
  // the hand's cards and their prices (lab/foldiers-cards.html, D · Origami)
  hand:    { sheet: true, tiltK: 5 / 6, depth: 0.9 },
  coin:    { shape: "radial", tiltK: 2, edge: "rgba(0,0,0,.25)" }
};

function ppRng(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ppHash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
function ppLerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
// A colour on the back of the paper: the ink, washed toward white.
function ppTint(hex, k) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return PP_BACK;
  var n = parseInt(hex.slice(1), 16);
  return "rgb(" + [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { return Math.round(v + (255 - v) * k); }).join(",") + ")";
}

// keep the side of line A->B where cross >= 0 (sign = 1) or <= 0 (sign = -1)
function ppClip(poly, A, B, sign) {
  var out = [];
  function side(p) { return sign * ((B[0] - A[0]) * (p[1] - A[1]) - (B[1] - A[1]) * (p[0] - A[0])); }
  for (var i = 0; i < poly.length; i++) {
    var p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
    if (sp >= 0) out.push(p);
    if ((sp >= 0) !== (sq >= 0)) out.push(ppLerp(p, q, sp / (sp - sq)));
  }
  return out;
}

/* A sheet: four off-square corners, hand-cut edges, the creases of its
   fold (whose ends kink the edge out for a mountain, in for a valley), an
   optional dog-ear and an optional V notch (a ribbon's end). */
function ppSheet(w, h, o, r) {
  var J = o.rough;
  function jit() { return (r() * 2 - 1) * J; }
  var P = [[jit(), jit()], [w + jit(), jit()], [w + jit(), h + jit()], [jit(), h + jit()]];
  var kinks = [[], [], [], []], creases = [];
  // edge e runs P[e] -> P[e+1]; f is the fraction read left->right / top->bottom
  function tOf(e, f) { return e === 2 || e === 3 ? 1 - f : f; }
  function crease(e1, f1, e2, f2, mountain) {
    var id = creases.length, off = (mountain ? 1 : -1) * o.kink * (0.6 + r() * 0.6);
    kinks[e1].push({ t: tOf(e1, f1), off: off, id: id, end: 0 });
    kinks[e2].push({ t: tOf(e2, f2), off: off, id: id, end: 1 });
    creases.push({ a: null, b: null, mountain: mountain });
  }
  var i, fold = o.fold;
  if (fold === "diag") {
    if (w >= h * 1.3) crease(0, 0.52 + r() * 0.2, 2, 0.34 + r() * 0.2, true);
    else crease(3, 0.3 + r() * 0.2, 1, 0.5 + r() * 0.2, true);
  } else if (fold === "tent") {
    crease(3, 0.46 + r() * 0.1, 1, 0.46 + r() * 0.1, true);
  } else if (fold === "accordion") {
    var na = Math.max(1, Math.min(6, Math.round(w / 110)));
    for (i = 1; i <= na; i++) {
      var f = i / (na + 1) + (r() - 0.5) * 0.06, slant = (r() - 0.5) * 0.06;
      crease(0, f + slant, 2, f - slant, i % 2 === 1);
    }
  } else if (fold === "cross") {
    crease(0, 0.46 + r() * 0.08, 2, 0.46 + r() * 0.08, true);
    if (h > 50) crease(3, 0.44 + r() * 0.12, 1, 0.44 + r() * 0.12, false);
  }
  if (o.notch) kinks[1].push({ t: 0.5, off: -o.notch, id: -1 });

  var L = P.map(function (p, k) { var q = P[(k + 1) % 4]; return Math.hypot(q[0] - p[0], q[1] - p[1]); });
  var ear = -1, d = 0;
  if (o.ear > 0 && o.earCorner != null) {
    ear = o.earCorner;
    d = Math.min(o.ear, 0.42 * Math.min(w, h));
    if (d < 6) ear = -1;
  }
  var out = [], a = null, b = null;
  for (var e = 0; e < 4; e++) {
    var u = P[e], v = P[(e + 1) % 4], dx = (v[0] - u[0]) / L[e], dy = (v[1] - u[1]) / L[e], nx = dy, ny = -dx;
    var t0 = e === ear ? d / L[e] : 0, t1 = (e + 1) % 4 === ear ? 1 - d / L[e] : 1;
    var n = Math.max(1, Math.round(L[e] / 26)), list = [];
    for (i = 1; i < n; i++) list.push({ t: i / n, off: (r() * 2 - 1) * J * 0.3 });
    kinks[e].forEach(function (k) { list.push(k); });
    list.sort(function (p, q) { return p.t - q.t; });
    var at = (function (u, v, nx, ny) {
      return function (t, off) { return [u[0] + (v[0] - u[0]) * t + nx * off, u[1] + (v[1] - u[1]) * t + ny * off]; };
    })(u, v, nx, ny);
    if (e === ear) { b = at(t0, 0); out.push(b); } else out.push(u);
    for (i = 0; i < list.length; i++) {
      var k = list[i];
      if (k.t <= t0 + 0.02 || k.t >= t1 - 0.02) {
        if (k.id >= 0) creases[k.id][k.end ? "b" : "a"] = at(k.t, 0);   // still a line, no kink
        continue;
      }
      var p = at(k.t, k.off);
      if (k.id >= 0) creases[k.id][k.end ? "b" : "a"] = p;
      // a kink is a sharp corner: the points either side stay on the cut
      if (k.id !== undefined) { out.push(at(k.t - 0.012, 0)); out.push(p); out.push(at(k.t + 0.012, 0)); }
      else out.push(p);
    }
    if ((e + 1) % 4 === ear) { a = at(t1, 0); out.push(a); }
  }
  var flap = null;

  for (i = 0; i <= 40; i++) { a = a0 + (a1 - a0) * i / 40; mid.push([Math.cos(a) * Rc, Math.sin(a) * Rc]); }
  var light = outA.concat([[Math.cos(a1) * (Rc + hw), Math.sin(a1) * (Rc + hw)], [Math.cos(a1 + ha) * Rc, Math.sin(a1 + ha) * Rc]], mid.slice().reverse());
  // the disc and its troop
  ppShadow(g, disc, "rgba(20,30,70,.38)", 1.5, 3, 2.2, d);
  g.fillStyle = PAPER; ppPath(g, disc); g.fill();
  g.save(); ppPath(g, disc); g.clip();
  var ok = cropFigure(g, kind, camp, 0, 0, D * 0.86);
  g.restore();
  paperFinish(g, disc, 0, 0, R, rng, d);
  g.lineWidth = 1; g.strokeStyle = "rgba(0,0,0,.25)"; ppPath(g, disc); g.stroke();
  // the strip, folded along its middle: the outer face lit, a crease, a cut edge
  ppShadow(g, strip, "rgba(0,0,0,.3)", 1, 2, 1.4, d);
  g.fillStyle = col; ppPath(g, strip); g.fill();
  g.fillStyle = "rgba(255,255,255,.28)"; ppPath(g, light); g.fill();
  g.beginPath(); mid.forEach(function (p, k) { g[k ? "lineTo" : "moveTo"](p[0], p[1]); }); g.lineTo(Math.cos(a1 + ha) * Rc, Math.sin(a1 + ha) * Rc);
  g.lineWidth = 1; g.strokeStyle = "rgba(0,0,0,.3)"; g.stroke();
  paperFinish(g, strip, 0, 0, R + hw, rng, d);
  g.lineWidth = 1.1; g.lineJoin = "round"; g.strokeStyle = "rgba(0,0,0,.35)"; ppPath(g, strip); g.stroke();
  if (ok) BEAD_CACHE[id] = cv;
  return cv;
}
var RING_K = 1.4;   // a ringed badge stands alone on its region: a little bigger than a bead
function ringed(kinds, camp, cx, cy, D, col, key, opt) {
  var S = ringSprite(kinds[0], camp, D, col);
  ctx.drawImage(S.cv, cx + S.x, cy + S.y, S.w, S.h);
}

function drawScene(cv, sc, opt, cssW) {
  var R = view.dpr = (window.devicePixelRatio || 1) * cssW / sc.w, z = opt.z, byId = {}, D = opt.size;
  cv.width = Math.round(sc.w * R); cv.height = Math.round(sc.h * R);
  cv.style.width = cssW + "px"; cv.style.height = Math.round(cssW * sc.h / sc.w) + "px";
  ctx = cv.getContext("2d");
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.drawImage(ground(sc, R), 0, 0, sc.w, sc.h);
  drawRiver(sc.river);
  sc.regions.forEach(function (r) { byId[r.id] = r; });
  var orders = sc.orders.filter(function (o) { return !o.hidden && (sc.id !== "map" || opt.off.indexOf(o.kind) < 0); });

  // ---- what still stands: a troop with an order leaves its region ----------
  var left = {};
  sc.regions.forEach(function (r) { left[r.id] = { foot: r.foot, cav: r.cav, pieces: r.pieces.slice() }; });
  if (opt.hide) orders.forEach(function (o) {
    var L = left[o.from || o.at];
    if (!L || o.kind === "transit") return;
    L.foot -= o.foot || 0; L.cav -= o.cav || 0;
    cargo(o).forEach(function (k) { var ix = L.pieces.indexOf(k); if (ix >= 0) L.pieces.splice(ix, 1); });
  });
  var figs = [], tags = [], guns = {};
  sc.regions.forEach(function (r) {
    var L = left[r.id], camp = r.owner;
    if (r.build) figs.push({ k: r.build, camp: camp, x: r.x, y: r.y + 10, h: TALL[r.build] * z * 0.85 });
    else if (camp) figs.push({ k: "flag", camp: camp, x: r.x + 10, y: r.y + 4, h: TALL.flag * z });
    var gi = r.pieces.indexOf("cannon");
    if (gi >= 0) { var gq = spot(r, "pieces", gi, z); guns[r.id] = [gq[0], gq[1] - TALL.cannon * z * 0.6]; }
    if (!camp) {
      if (L.foot > 0 && opt.counts) tags.push({ x: r.x + 44 * z / 1.8, y: r.y + 34 * z / 1.8, n: L.foot, camp: 0, key: "n" + r.id });
      return;
    }
    if (L.foot > 0) {
      var s = spot(r, "infantry", 0, z);
      figs.push({ k: "infantry", camp: camp, x: s[0], y: s[1], h: TALL.infantry * z });
      if (opt.counts) tags.push({ x: s[0] + 24, y: s[1] - 8, n: L.foot, camp: camp, key: "f" + r.id + L.foot });
    }
    if (L.cav > 0) {
      var c = spot(r, "cavalry", 0, z);
      figs.push({ k: "cavalry", camp: camp, x: c[0], y: c[1], h: TALL.cavalry * z });
      if (opt.counts) tags.push({ x: c[0] + 30, y: c[1] - 8, n: L.cav, camp: camp, key: "c" + r.id + L.cav });
    }
    L.pieces.forEach(function (p, i) {
      var q = spot(r, "pieces", r.pieces.indexOf(p), z);
      figs.push({ k: p, camp: camp, x: q[0], y: q[1], h: TALL[p] * z * (p === "warship" ? 0.8 : 1) });
    });
  });
  figs.sort(function (a, b) { return a.y - b.y; });
  figs.forEach(function (f) { figure(f.k, f.camp, f.x, f.y, f.h, true); });
  tags.forEach(function (t) { tag(t.x, t.y, t.n, t.camp, t.key); });

  // ---- the arrows (the round's own, in world units scaled by the zoom) -----
  var strings = [], heads = [], loops = [], rings = [];
  orders.forEach(function (o, ix) {
    var camp = campOf(o), C = CAMP[camp], ghost = o.kind === "spied", alpha = ghost ? 0.5 : o.kind === "transit" ? 0.45 : 1;
    var key = sc.id + ":" + ix;
    if (o.kind === "defend" || o.kind === "wait") {
      var r = byId[o.at], col = o.kind === "defend" ? OK_COL : IDLE_COL;
      var k = o.kind === "defend" ? "infantry" : "pieces", sp = spot(r, k, k === "pieces" ? r.pieces.indexOf(o.pieces[0]) : 0, z);
      var tall = TALL[o.kind === "defend" ? "infantry" : o.pieces[0]] * z;
      if (opt.legacy) loops.push({ x: sp[0] + 16, y: sp[1] - tall * 0.92, col: col });
      else {
        var hw = RING_K * D / 2 + 14;   // the ring stays inside the frame
        rings.push({ kinds: cargo(o), camp: camp, x: clamp(sp[0], hw, sc.w - hw), y: opt.hide ? sp[1] - tall * 0.45 : sp[1] - tall - D / 2 - 10, col: col, key: key });
      }
      return;
    }
    var a = o.pt ? { x: o.pt[0], y: o.pt[1] } : byId[o.from], b = byId[o.to];
    ctx.save(); ctx.scale(z, z);
    function W(p) { return [p[0] / z, p[1] / z]; }
    var path = null, tip = null, shotPath = null;
    if (o.fire) {
      var gun = guns[o.from];
      // beside a convoy the shot is lobbed the other way, an arc clear of the troops' strip
      var shot = curve(W(gun || [a.x, a.y - 8]), W([b.x, b.y]), o.kind === "fire" ? 0.16 : -0.42, gun ? 18 : 44, 16);
      shotPath = shot;
      if (o.kind === "fire") { path = shot; tip = shot[shot.length - 1]; }
    }
    if (!path) {
      var bend = o.bend != null ? o.bend : o.kind === "ride" ? 0.2 : o.kind === "ship" ? 0.28 : o.kind === "transit" ? 0.05 : 0.1;
      var pts = curve(W([a.x, a.y - 8]), W([b.x, b.y]), bend, o.kind === "transit" ? 10 : 44, 16);
      ctx.globalAlpha = alpha;
      if (o.kind === "bridge") {
        dashed(pts, RIVER_INK);
        if (!opt.legacy) arrowHead(pts, RIVER_INK, 16, 10);
        tip = pts[pts.length - 1];
      } else if (o.kind === "road" || o.kind === "ship" || o.kind === "transit") {
        tip = footprints(pts, C);
        if (!opt.legacy) { ctx.globalAlpha = alpha * 0.9; arrowHead(pts, C.dark, 18, 12); }
      } else if (opt.legacy && b.owner === camp) tip = chevrons(pts, C, !ghost);
      else tip = paperArrow(pts, C, !ghost);     // one strip for every march: an attack and a reinforcement alike
      ctx.globalAlpha = 1;
      path = pts;
    }
    // the shot last: its dashes cross over the strip rather than under it
    if (shotPath) {
      ctx.globalAlpha = alpha; dashed(shotPath, SHOT_COL);
      if (!opt.legacy) arrowHead(shotPath, SHOT_COL, 16, 10);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    path = path.map(function (p) { return [p[0] * z, p[1] * z]; });
    tip = tip && [tip[0] * z, tip[1] * z];
    var kinds = cargo(o);
    // a cannon that FIRES rides on its own dashed shot, never on the troops' strip (it would read as marching)
    if (o.fire && o.kind !== "fire") kinds = kinds.filter(function (k) { return k !== "cannon"; });
    strings.push({ o: o, key: key, M: measure(path), kinds: kinds, camp: camp, alpha: ghost ? 0.85 : 1 });
    if (o.fire && o.kind !== "fire") {
      strings.push({ o: o, key: key + "s", M: measure(shotPath.map(function (p) { return [p[0] * z, p[1] * z]; })), kinds: ["cannon"], camp: camp, alpha: ghost ? 0.85 : 1,
                     far: path });
    }
    if (tip) heads.push({ o: o, x: o.kind === "transit" ? a.x : tip[0], y: o.kind === "transit" ? a.y + 30 : tip[1], key: key, camp: camp });
  });
  loops.forEach(function (l) { loopIcon(l.x, l.y, l.col); });

  // ---- the tags at the heads: measured first, the beads keep off them ------
  var beadsOn = opt.style !== "none";
  heads.forEach(function (h) {
    var o = h.o;
    h.text = o.head && o.head[0]; h.col = o.head && o.head[1];
    // the round's spied plan writes its troops at the head
    if (o.kind === "spied") { h.text = opt.legacy ? String(o.foot) : null; h.col = CAMP[h.camp].dark; }
    if (!opt.head || !h.text) { h.text = null; return; }
    h.box = { x: h.x, y: h.y - 26, w: plateW("verdict", h.text, 20) + (o.kind === "spied" ? 30 : 0), h: 34 };
  });

  // ---- the beads: each string slides along ITS arrow until it is clear ------
  if (beadsOn) {
    var placed = [], boxes = heads.filter(function (h) { return h.box; }).map(function (h) { return h.box; });
    rings.forEach(function (g) { boxes.push({ x: g.x, y: g.y, w: RING_K * D + 14, h: RING_K * D + 14 }); });
    strings.forEach(function (st) {
      var tries = opt.slide ? [0, 0.1, -0.1, 0.2, -0.2, 0.3, -0.3] : [0], pick = null;
      var ts = tries.map(function (d) { return clamp(opt.t + d, 0.12, 0.88); });
      // a cannon's shot beside its convoy: the bead goes where the dashes stand farthest from the strip
      if (st.far) {
        var gap = function (t) {
          var b = string(st.M, t, 1, D, 0, 0)[0], m = 1e9;
          st.far.forEach(function (f) { m = Math.min(m, Math.hypot(b[0] - f[0], b[1] - f[1])); });
          return m;
        };
        ts = [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.88].sort(function (x, y) { return gap(y) - gap(x); });
      }
      for (var i = 0; i < ts.length && !pick; i++) {
        var B = string(st.M, ts[i], st.kinds.length, D, 2, opt.lift);
        if (!hits(B, D, placed, boxes)) pick = B;
      }
      st.beads = pick || string(st.M, ts[0], st.kinds.length, D, 2, opt.lift);
      st.beads.forEach(function (b) { placed.push([b[0], b[1], D]); });
    });
    strings.forEach(function (st) {
      ctx.save(); ctx.globalAlpha = st.alpha;
      st.beads.forEach(function (b, i) { bead(st.kinds[i], st.camp, b[0], b[1], D, st.key + "b" + i, opt); });
      ctx.restore();
    });
    rings.forEach(function (g) { ringed(g.kinds, g.camp, g.x, g.y, Math.round(RING_K * D), g.col, g.key, opt); });
  }
  heads.forEach(function (h) {
    if (!h.text) return;
    var w = plate("verdict", "h" + h.key + h.text, h.x, h.y - 26, h.text, h.col, "#fff", 20);
    if (h.o.kind === "spied") eyeMark(h.x - w / 2 - 14, h.y - 26, h.col);
  });
}

// ======================================================================
//  THE PAGE
// ======================================================================
var stage = document.getElementById("stage");
var pending = false;
function later() { if (pending) return; pending = true; requestAnimationFrame(function () { pending = false; render(); }); }
function opts(over) { var o = {}, k; for (k in S) o[k] = S[k]; for (k in over || {}) o[k] = over[k]; return o; }
function fitH() { return Math.max(400, window.innerHeight - 40); }
// The round as it is drawn today: figures on the map, counts, chevrons, the loop over the figure.
var TODAY = { hide: 0, style: "none", head: 1, counts: 1, legacy: 1 };

function render() {
  LOOK.tilt = S.tilt;
  LOOK.seed = S.seed;
  stage.innerHTML = "";
  if (S.view === "map") {
    var c = canvasCell("", "");
    drawScene(c.cv, MAP, opts(), Math.min(720, fitH() * 720 / 1280, stage.clientWidth - 40));
  } else if (S.view === "compare") {
    var room = (stage.clientWidth - 80) / 2, w = Math.min(720, room, (fitH() - 60) * 720 / 1280);
    var a = canvasCell("Before — the round today", "Every figure stays on its region; the arrow's head says how many go.");
    drawScene(a.cv, MAP, opts(TODAY), w);
    var b = canvasCell("After — the order carries its troops", "A troop with an order leaves the map and rides on its arrow.");
    drawScene(b.cv, MAP, opts(), w);
  } else {
    KINDS.forEach(function (k) {
      var c = canvasCell(k[1], k[2]);
      drawScene(c.cv, cell(k[0]), opts({ z: 1.3 }), 380);
    });
  }
}
function canvasCell(name, what) {
  var d = document.createElement("div"), cv = document.createElement("canvas");
  d.className = "cell"; d.appendChild(cv);
  if (name) { var n = document.createElement("div"); n.className = "name"; n.textContent = name; d.appendChild(n); }
  if (what) { var w = document.createElement("div"); w.className = "what"; w.textContent = what; d.appendChild(w); }
  stage.appendChild(d);
  return { cv: cv };
}

// ---- the panel -------------------------------------------------------------
function seg(id, field, num) {
  var el = document.getElementById(id);
  function sync() { [].forEach.call(el.children, function (b) { b.classList.toggle("on", String(S[field]) === b.dataset.v); }); }
  el.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    S[field] = num ? +b.dataset.v : b.dataset.v; sync(); save(); render();
  });
  sync();
}
function slider(id, fmt, reset) {
  var el = document.getElementById(id), out = document.getElementById("o-" + id);
  function sync() { el.value = S[id]; out.textContent = fmt(S[id]); }
  el.addEventListener("input", function () {
    S[id] = +el.value; sync(); save();
    if (reset) { PP_CACHE = {}; PP_N = 0; }
    render();
  });
  sync();
}
seg("view", "view"); seg("hide", "hide", true); seg("style", "style"); seg("slide", "slide", true); seg("head", "head", true); seg("counts", "counts", true);
slider("t", function (v) { return Math.round(v * 100) + " %"; });
slider("lift", function (v) { return v + " px"; });
slider("size", function (v) { return v + " px"; });
slider("z", function (v) { return "×" + v.toFixed(1); });
slider("tilt", function (v) { return v + "°"; }, true);
(function () {
  var box = document.getElementById("kinds"), seen = {};
  MAP.orders.forEach(function (o) { if (!o.hidden) seen[o.kind] = true; });
  KINDS.forEach(function (k) {
    if (!seen[k[0]]) return;
    var l = document.createElement("label"), i = document.createElement("input");
    i.type = "checkbox"; i.checked = S.off.indexOf(k[0]) < 0;
    i.addEventListener("change", function () {
      S.off = S.off.filter(function (x) { return x !== k[0]; });
      if (!i.checked) S.off.push(k[0]);
      save(); render();
    });
    l.appendChild(i); l.appendChild(document.createTextNode(k[1])); box.appendChild(l);
  });
})();
document.getElementById("reseed").addEventListener("click", function () {
  S.seed = (S.seed * 7 + 13) % 997; PP_CACHE = {}; PP_N = 0; BEAD_CACHE = {}; save(); render();
});
document.getElementById("copy").addEventListener("click", function () {
  var txt = JSON.stringify({ style: S.style, hide: !!S.hide, t: S.t, lift: S.lift, size: S.size, slide: !!S.slide, head: !!S.head, counts: !!S.counts, tilt: S.tilt, seed: S.seed });
  var done = function () { document.getElementById("copied").textContent = "Copied: " + txt; };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function () { document.getElementById("copied").textContent = txt; });
  else document.getElementById("copied").textContent = txt;
});
window.addEventListener("resize", later);
render();
if (document.fonts) document.fonts.load("700 22px \"Baloo 2\"").then(later, later);
</script>
