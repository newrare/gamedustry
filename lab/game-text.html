<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — game text</title>
<meta name="lab-group" content="tools">
<style>
/* ===========================================================================
   COPY DESK — every word a game shows a player, read as COPY.

   A game's copy is written where it is USED, which is the right place to write
   it and the wrong place to proofread it. An intro sentence lives in three
   files. A HUD label is the second argument of a call nine hundred lines down,
   between the physics and the spawner. The French half of it all is in a
   manifest nobody opens while writing gameplay. So the copy is never read AS
   copy — it is read one call at a time, in English, next to the code that
   fires it, which is how a game ends up saying LENGTH in one corner and BODY
   in another.

   This page is that list, and nothing else. Two sections, EN and FR, each cut
   into the seven places a player reads something:

     LISTING        the site, itch and the store cards — read before install
     TITLE SCREEN   the one sentence that explains the game
     SHELL          the buttons and labels the motor draws around the round
     HUD            the two side slots of the top band
     THE ROUND      callouts, floating values, what the canvas paints
     END SCREEN     the title and the stat rows
     LEVELS         the objective, one sentence with {n} in it

   and, for a game that declares `web.army`, the four the barracks add: its own
   screens (packages/webshell/army.js), the officers, the missions and the camp
   events — hundreds of `{ en, fr }` stories in the manifest.

   It opens on nothing. The list of games is the manifests alone, and a game
   is parsed when it is picked — a spinner while it is. French first, because
   the French half is the one nobody reads while writing the game.

   Every row says WHERE it is read: the function the call is written in and
   the line of source, and for a dictionary entry every call that writes its
   English — the key says what it means, not where it shows.

   And every row opens on WHAT it is printed on — the SURFACE, a coloured pill:
   the website, a store image, a notification, a callout, a floating value, a
   card's description, the end screen… One fixed list (SURFACES in
   tools/lab/scan-text.mjs), read off the source: the path in the manifest,
   the call the literal is an argument of, the game's own wrapper around that
   call, or the table it sits in. A dictionary entry wears one pill per
   surface its English reaches, and each of its uses wears its own. Where the
   source cannot say, the pill says so — GAME DATA (a table, named) or IN CODE
   (built at runtime) — rather than guess. The select beside the filter keeps
   one surface.

   CHECKED is the proofreader's own mark: a row read and signed off turns
   green, and the mark lands in lab/text-review.json with the text it was
   given on. A string edited since reads as unchecked again — a sign-off is
   for words, not for a slot. A pending edit is amber, so green only ever
   means read and right.

   A mark travels: the same row reading the same words in another game is the
   same decision, so checking it here checks it there. An edit that is applied
   is checked by that apply, and a game every row of which is checked — with
   nothing untranslated and nothing left to update — turns green in the
   picker.

   A French edit carries its English with it: the same APPLY adapts every
   English it translates to the new French (tools/lab/translate-en.mjs, the
   local `claude -p`) and writes it — a dictionary key moving with an English
   the game writes. That English lands UNCHECKED, since a machine wrote it,
   and the report lists each one, kept or changed. Only when the translator
   cannot be reached is the action left open instead: TO UPDATE, closed when
   that English is checked (still right) or changed. The TO UPDATE mode lists
   them.

   NO USE FOUND is a dictionary entry whose English the game no longer writes.
   It is marked for removal as soon as the game is read — struck through and
   counted in APPLY, taken back with revert like any change — and APPLY takes
   it out of the manifest.

   Every row is one string with an edit field, and APPLY writes the lot back
   (tools/lab/apply-text.mjs) — into manifest.json, games/<slug>/game.js and
   games/<slug>/page.html, whichever holds it — then rebuilds the game and the
   two catalogues, so a proofreading pass leaves a tree that still passes
   `node tools/update.mjs`.

   Three things make a row honest, and they are the whole reason this is not a
   find-and-replace:

     ONE ROW, EVERY SITE.  "LENGTH" is the HUD's left label written at three
     call sites. It is ONE row here, and applying it writes all three — editing
     one of the three is exactly the bug the page exists to prevent. The count
     is on the row.

     A MIRROR IS NOT A SECOND STRING.  #intro-title and #intro-tagline in
     page.html are rewritten from CONFIG at boot. They ride on the CONFIG row
     and are written with it; they are never offered on their own, because
     editing one alone changes nothing a player would see and desyncs the
     source.

     A FRAGMENT KEEPS ITS EXPRESSION.  A game writes
     `st === 3 ? "APEX VIPER!" : CONFIG.copy.gameOver`. Both branches are copy,
     so the unit here is the STRING LITERAL and not the argument: the row is
     the literal, marked as a fragment, with the expression around it printed
     under it. Nothing is ever reprinted — an edit splices one literal — so the
     ternary, the concatenation and their comments come back as they were.

   What is NOT here is as deliberate. The motor's own menu strings (PLAY,
   OPTIONS, LEAVE?) belong to packages/webshell/menu.js and are the same for
   the thirteen; a game that wants its own wording writes it under `web.copy`,
   which IS listed — the army layer is the one exception, since a single game
   shows it. Copy a game assembles in a local variable before the call
   is out of reach of a parser and is not listed either — tools/lab/scan-text.mjs
   says so rather than half-listing it.

   Served by `make text` (tools/lab/serve-text.mjs). The same list as text, no
   browser: `node tools/lab/scan-text.mjs <slug>`.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  height:100vh; overflow:hidden; display:flex; flex-direction:column;
  background:#0b0b12; color:#e8e6f5;
  font:600 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* --- the bar ------------------------------------------------------------- */
#head { padding:14px 18px; border-bottom:1px solid #23233a; background:#12121c; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
#head h1 { font-size:14px; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }
#head h1 small { display:block; font-weight:600; font-size:11px; letter-spacing:.4px; color:#8b8ba7; text-transform:none; }

select, input[type=text], textarea {
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:7px;
  font:inherit; padding:7px 9px;
}
select:focus, input:focus, textarea:focus { outline:none; border-color:#7ea6ff; }
/* The game picker is ours and not a <select>: a native popup draws its
   options without their colour, and its own tick on the selected entry reads
   as "checked" next to ours. Same picker as the events bench: a dot on the
   game being edited, a tick and green on a game every row of which is
   checked, and what is left on the others. */
#game-pick { position:relative; min-width:230px; }
#game-pick .gp-btn {
  position:relative; display:flex; align-items:center; gap:8px; width:100%; text-align:left; cursor:pointer;
  padding:7px 28px 7px 9px; border:1px solid #2c2c47; border-radius:7px;
  background:#0b0b12; color:#e8e6f5; font-family:inherit; font-size:13px; font-weight:700; line-height:1.5;
}
#game-pick .gp-btn::after { content:"\25BE"; position:absolute; right:10px; top:7px; color:#6f6f92; }
#game-pick .gp-btn:hover, #game-pick.open .gp-btn, #game-pick .gp-btn:focus { outline:none; border-color:#7ea6ff; }
#game-pick.done .gp-btn { color:#5fd49a; border-color:#2a5040; }
#game-pick .gp-list[hidden] { display:none; }
#game-pick .gp-list {
  position:absolute; left:0; min-width:100%; top:calc(100% + 4px); z-index:60;
  max-height:70vh; overflow:auto; padding:5px;
  background:#12121c; border:1px solid #3b3b5f; border-radius:10px; box-shadow:0 18px 50px rgba(0,0,0,.6);
}
#game-pick .gp-row {
  display:flex; align-items:center; gap:8px; width:100%; padding:6px 9px; text-align:left; cursor:pointer;
  border:0; border-radius:6px; background:none; color:#c9c9e0; white-space:nowrap;
  font-family:inherit; font-size:13px; font-weight:700; line-height:1.4;
}
#game-pick .gp-row:hover, #game-pick .gp-row.on { background:#1e2740; color:#e8e6f5; }
#game-pick .gp-row.done { color:#5fd49a; }
#game-pick .gp-dot { width:8px; height:8px; border-radius:50%; background:#7ea6ff; flex:0 0 auto; }
#game-pick .gp-ck { color:#5fd49a; flex:0 0 auto; }
#game-pick .gp-v { color:#6f6f92; font-weight:600; }
#game-pick .gp-left { margin-left:auto; padding-left:14px; color:#6f6f92; font-weight:600; font-size:11px; font-variant-numeric:tabular-nums; }
#game-pick .gp-left em { font-style:normal; color:#b89cff; }
#filter { flex:1 1 200px; min-width:140px; }

#stats { display:flex; gap:6px; font-size:11px; flex-wrap:wrap; }
#stats span { padding:3px 8px; border-radius:20px; background:#1b1b2b; color:#9c9cba; white-space:nowrap; }
#stats span b { color:#e8e6f5; }
#stats span.warn { background:#3a2c14; color:#ffb648; }

#modes { display:flex; gap:3px; padding:3px; background:#0b0b12; border:1px solid #2c2c47; border-radius:9px; }
#modes button {
  padding:6px 12px; border:0; border-radius:7px; background:none; color:#8b8ba7;
  font:700 11px/1 inherit; letter-spacing:1.1px; cursor:pointer;
}
#modes button:hover { color:#e8e6f5; }
#modes button.on { background:#2a2a44; color:#e8e6f5; }

#todo {
  padding:8px 12px; border:1px solid #2c2c47; border-radius:9px; background:#0b0b12; color:#8b8ba7;
  font:700 11px/1 inherit; letter-spacing:1.1px; cursor:pointer; white-space:nowrap;
}
#todo:hover { color:#e8e6f5; }
#todo.on { background:#13221b; border-color:#2a5040; color:#5fd49a; }
#stats span.done { background:#13221b; color:#5fd49a; }

#apply {
  padding:9px 16px; border:0; border-radius:8px; background:#2a2a44; color:#6f6f92;
  font:700 11px/1 inherit; letter-spacing:1.2px; cursor:not-allowed; white-space:nowrap;
}
#apply.live { background:#7ea6ff; color:#0b0b12; cursor:pointer; }
#apply.live:hover { background:#9dbaff; }
#apply b { font-variant-numeric:tabular-nums; }

/* --- the list ------------------------------------------------------------ */
/* A column, not a page: copy is proofread at a readable measure, and a row
   stretched across a 27-inch window puts the edit icon a foot from its text. */
#list { flex:1; overflow:auto; padding:0 18px 80px; }
#list > * { max-width:1120px; margin-left:auto; margin-right:auto; }
#list::-webkit-scrollbar { width:10px; }
#list::-webkit-scrollbar-thumb { background:#26263c; border-radius:8px; }

.lang {
  position:sticky; top:0; z-index:2; padding:10px 0 9px;
  background:#0b0b12; border-bottom:1px solid #23233a;
  font:800 12px/1 inherit; letter-spacing:2px; display:flex; align-items:center; gap:10px;
}
.lang i { font-style:normal; font-weight:600; font-size:11px; letter-spacing:.4px; color:#6f6f92; }

.group { margin:18px 0 8px; display:flex; align-items:baseline; gap:10px; }
.group b { font:700 10px/1 inherit; letter-spacing:1.3px; text-transform:uppercase; color:#7ea6ff; }
.group i { font-style:normal; font-size:11px; color:#6f6f92; }

.row { background:#151522; border:1px solid #22223a; border-left:3px solid #22223a; border-radius:9px; margin-bottom:7px; padding:8px 11px; }
.row:hover { border-color:#2e2e4c; border-left-color:#2e2e4c; }
.row.changed { border-left-color:#ffb648; background:#211c12; }
.row.checked { border-left-color:#5fd49a; background:#13221b; border-color:#1f3a2c; }
.row.checked:hover { border-color:#2a5040; border-left-color:#5fd49a; }
.row.editing { border-left-color:#7ea6ff; }
.row.todo { border-left-color:#b89cff; background:#1a1628; border-color:#2f2748; }
.row.dropped { border-left-color:#e07aa8; background:#22141c; }
.row.dropped .val { color:#8b6a7a; text-decoration:line-through; }

.meta { display:flex; align-items:center; gap:9px; font-size:11px; flex-wrap:wrap; }
.meta .ctx { font-weight:700; color:#c9c9e0; }
.meta .at { font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#7ea6ff; cursor:pointer; }
.meta .at:hover { text-decoration:underline; }
.meta .pill { padding:2px 7px; border-radius:20px; background:#1b1b2b; color:#8b8ba7; font-size:10px; letter-spacing:.3px; }
.meta .pill.frag { background:#2a2214; color:#c99a4a; }
.meta .pill.sites { background:#1a2430; color:#7ea6ff; }
.meta .pill.desync { background:#3a2c14; color:#ffb648; }
.meta .hint { color:#5d5d7c; font-weight:600; }
.meta .sp { flex:1; }

.ico { width:24px; height:22px; border:0; border-radius:6px; background:#1f1f31; color:#8b8ba7; font-size:12px; line-height:1; cursor:pointer; }
.ico:hover { background:#2a2a44; color:#e8e6f5; }
.ico.hide { display:none; }
.ico.check.on { background:#5fd49a; color:#0b0b12; }
.ico.check.on:hover { background:#7de3b0; }
.meta .pill.stale { background:#2a2214; color:#c99a4a; }
.meta .pill.todo { background:#2a2240; color:#b89cff; }
.meta .pill.drop { background:#3a1a2a; color:#e07aa8; }
.todo-fr { margin-top:4px; font-size:12px; color:#b89cff; }
.todo-fr u { text-decoration:none; font:700 10px/1 inherit; letter-spacing:1px; color:#7a68a8; margin-right:7px; }
.todo-fr s { color:#6f6f92; margin-right:6px; }
#stats span.todo { background:#2a2240; color:#b89cff; cursor:pointer; }

.val { margin-top:5px; font-size:14px; font-weight:500; color:#e8e6f5; white-space:pre-wrap; word-break:break-word; cursor:text; }
.val:empty::before { content:"(empty)"; color:#4f4f6b; font-style:italic; }
.row.changed .val { color:#ffcf85; }
.row.changed .was { margin-top:3px; font-size:11px; color:#6f6f92; text-decoration:line-through; }

textarea.ed { display:block; width:100%; margin-top:5px; font-size:14px; font-weight:500; resize:vertical; min-height:38px; }

/* What the markup in a tagline or a store line actually reads as. The SKIN's
   `w-…` colours are the game's, not this page's, so every <b> takes one accent
   — the point is the GROUPING, which is what those spans are for. */
.prev { margin-top:4px; font-size:13px; color:#9c9cba; }
.prev b { color:#8fe0b8; font-weight:800; }
.prev::before { content:"renders  "; font-size:10px; letter-spacing:1px; color:#4f4f6b; }

.other { margin-top:4px; font-size:12px; color:#8b8ba7; }
.other u { text-decoration:none; font:700 10px/1 inherit; letter-spacing:1px; color:#5d5d7c; margin-right:7px; }
.expr { margin-top:4px; font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#6f6f92; word-break:break-all; }
.expr mark { background:none; color:#c99a4a; }

.empty { padding:40px 0; text-align:center; color:#5d5d7c; }

/* Where the row is read: the function and the source line, dimmed, one line
   each — enough to place the moment, not a code viewer. */
.uses { margin-top:6px; padding-left:9px; border-left:2px solid #22223a; display:flex; flex-direction:column; gap:3px; }
.use-h { font-size:11px; color:#8b8ba7; }
.use-h b { color:#b3b3cc; font-weight:700; }
.use-h code { font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b89cff; }
.use-h .ln { font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#5d5d7c; margin-left:4px; }
.use .src { font:500 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#5d5d7c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.use .src mark { background:none; color:#c9c9e0; }
.use.more { font-size:11px; color:#5d5d7c; }
.meta .pill.unused { background:#2a1a24; color:#e07aa8; }

/* The surface: what the words are printed on. One hue per family — the
   listing outside the game, the shell around the round, the round itself,
   the content a player reads at leisure, and grey where the source is mute. */
.sf { display:inline-flex; align-items:baseline; gap:5px; padding:2px 8px; border-radius:5px; font-size:10px; font-weight:800;
  letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; background:#1b1b2b; color:#9c9cba; }
.sf small { font-size:10px; font-weight:600; letter-spacing:.2px; text-transform:none; opacity:.75; }
.sf.site, .sf.meta, .sf.storeimg, .sf.gallery { background:#13263a; color:#6cc4ff; }
.sf.title, .sf.help, .sf.guide, .sf.menu, .sf.end, .sf.level { background:#1e2236; color:#a4b4ff; }
.sf.character { background:#33201a; color:#ff9c7a; }
.sf.world { background:#122a2a; color:#5fd4cf; }
.sf.hud, .sf.canvas, .sf.float { background:#2a2214; color:#e8b860; }
.sf.callout { background:#33162a; color:#ff7ac8; }
.sf.notice { background:#13281f; color:#5fd49a; }
.sf.card, .sf.item, .sf.rank, .sf.info, .sf.panel, .sf.barracks, .sf.mission, .sf.event { background:#271a38; color:#c79cff; }
.sf.data, .sf.code { background:#1a1a24; color:#7a7a96; }
.use-h .sf { padding:1px 6px; margin-right:3px; }
#surface-pick { max-width:190px; }

.loading { padding:60px 0; display:flex; flex-direction:column; align-items:center; gap:14px; color:#6f6f92; }
.spin { width:28px; height:28px; border-radius:50%; border:3px solid #26263c; border-top-color:#7ea6ff; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* --- the report ---------------------------------------------------------- */
#report {
  position:fixed; right:18px; bottom:18px; width:420px; max-height:60vh; overflow:auto;
  background:#151522; border:1px solid #2e2e4c; border-radius:10px; padding:12px 14px;
  box-shadow:0 18px 50px rgba(0,0,0,.55); font-size:12px; z-index:5;
}
#report.hide { display:none; }
#report h2 { font:800 11px/1 inherit; letter-spacing:1.4px; margin-bottom:9px; display:flex; align-items:center; gap:8px; }
#report h2 button { margin-left:auto; }
#report p { margin:4px 0; color:#9c9cba; }
#report p.ok { color:#8fe0b8; }
#report p.no { color:#ffb648; }
#report p small { display:block; color:#6f6f92; }
</style>
</head>
<body>

<div id="head">
  <h1>Copy desk<small id="sub">every word a game shows</small></h1>
  <div id="game-pick"><button type="button" class="gp-btn" title="the game this page reads"></button><div class="gp-list" hidden></div></div>
  <div id="modes">
    <button data-mode="fr" class="on">FR</button>
    <button data-mode="en">EN</button>
    <button data-mode="all">All</button>
    <button data-mode="todo">To update</button>
    <button data-mode="changed">Changed</button>
  </div>
  <button id="todo" title="show only what is left to read">Hide checked</button>
  <input type="text" id="filter" placeholder="filter — a word, a context, a file  ( / )">
  <select id="surface-pick" title="keep the rows printed on one surface"><option value="">Every surface</option></select>
  <div id="stats"></div>
  <button id="apply">Apply</button>
</div>

<div id="list"><div class="empty">Choose a game</div></div>
<div id="report" class="hide"></div>

<script>
/* ---------------------------------------------------------------------------
   The page holds one scan and one PLAN: id → the new text. Nothing else is
   state. Apply sends the plan with the value each row was READ at (`was`), so
   a string the file changed under the page is refused by name instead of being
   spliced over — see tools/lab/apply-text.mjs.
   --------------------------------------------------------------------------- */
var $ = function (id) { return document.getElementById(id); };
var scan = null, plan = {}, mode = "fr", filter = "", surface = "";
var drop = {};                              // id → true: an unused entry APPLY removes
// Not `status`: a global of that name IS window.status, which turns any
// object written into it into a string, so no game could ever go green.
var gameStatus = {}, titles = {};           // slug → what the server says of it, and its name
var hideChecked = false;
var loading = null;                         // the slug being fetched, or null

var LANGS = { en: "English", fr: "Français", all: "Every language" };

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* The markup a tagline or a store line carries, shown as it reads. Only the
   handful of tags the copy actually uses is let through — this is a preview of
   the game's own words, not a place to run whatever is typed into a row. */
function preview(text) {
  return esc(text)
    .replace(/&lt;(\/?)(b|i|em|strong|br)(\s[^&]*?)?&gt;/g, function (m, close, tag) {
      return "<" + close + (tag === "strong" ? "b" : tag === "em" ? "i" : tag) + ">";
    })
    .replace(/&amp;nbsp;/g, "&nbsp;");
}

function hasMarkup(text) { return /<[a-z/]/i.test(text); }

/* --- surfaces ------------------------------------------------------------ */
function surfaceDef(key) {
  var list = (scan && scan.surfaces) || [];
  for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
  return { key: key, label: key, note: "" };
}
function surfacePill(s) {
  if (!s) return "";
  var d = surfaceDef(s.key);
  return '<span class="sf ' + esc(s.key) + '" title="' + esc(d.note) + '">' + esc(d.label) +
    (s.detail ? " <small>" + esc(s.detail) + "</small>" : "") + "</span>";
}
function surfacesOf(row) { return row.surfaces || (row.surface ? [row.surface] : []); }

// The picker lists the surfaces this game actually uses, in the scanner's order.
function drawSurfacePick() {
  var pick = $("surface-pick"), used = {};
  if (scan) scan.rows.forEach(function (r) { surfacesOf(r).forEach(function (s) { used[s.key] = (used[s.key] || 0) + 1; }); });
  if (surface && !used[surface]) surface = "";
  pick.innerHTML = '<option value="">Every surface</option>' + ((scan && scan.surfaces) || []).filter(function (d) { return used[d.key]; })
    .map(function (d) { return '<option value="' + esc(d.key) + '"' + (d.key === surface ? " selected" : "") + ">" +
      esc(d.label) + "  ·  " + used[d.key] + "</option>"; }).join("");
}

function changed(row) {
  if (!Object.prototype.hasOwnProperty.call(plan, row.id)) return false;
  // A desynced mirror counts as a change at the value it already has: writing
  // CONFIG's string into page.html IS the repair.
  return plan[row.id] !== row.text || row.desync != null;
}
function valueOf(row) {
  return Object.prototype.hasOwnProperty.call(plan, row.id) ? plan[row.id] : row.text;
}
function dropped(row) { return !!drop[row.id]; }
function pending(row) { return changed(row) || dropped(row); }
function countChanged() {
  return scan ? scan.rows.filter(pending).length : 0;
}
// What the reader typed, as opposed to the removals the scan proposed itself.
function countEdits() {
  return scan ? scan.rows.filter(changed).length : 0;
}
function todo(row) { return scan && scan.todo ? scan.todo[row.id] : null; }

/* A mark counts while the file still reads the text it was given on. */
function mark(row) { return scan && scan.review ? scan.review[row.id] : null; }
function checked(row) { var m = mark(row); return !!m && m.text === row.text; }
function stale(row) { var m = mark(row); return !!m && m.text !== row.text; }

/* --- drawing ------------------------------------------------------------- */
function where(row) {
  var line = row.lines ? row.lines[0] : row.line;
  return line ? row.where + ":" + line : row.where;
}

/* Where the row is read in the game. A game.js row lists its own call sites;
   a dictionary entry lists every row that writes its English; an army.js key
   the first place the barracks read it. */
function drawUses(row) {
  var u = row.uses || [];
  if (!u.length) return "";
  var needle = esc(JSON.stringify(row.group === "words" ? row.context : row.text));
  var out = u.slice(0, 3).map(function (x) {
    var head = [];
    if (x.surface && (row.group === "words" || surfacesOf(row).length > 1)) head.push(surfacePill(x.surface));
    if (row.group === "words" && x.context) head.push("<b>" + esc(x.context) + "</b>");
    if (x.fn) head.push("in <code>" + esc(x.fn) + "</code>");
    head.push('<span class="ln">' + esc((x.file || "game.js") + (x.line ? ":" + x.line : "")) + "</span>");
    var src = x.src ? esc(x.src).split(needle).join("<mark>" + needle + "</mark>") : "";
    return '<div class="use"><div class="use-h">' + head.join(" ") + "</div>" +
      (src ? '<div class="src" title="' + esc(x.src) + '">' + src + "</div>" : "") + "</div>";
  });
  if (u.length > 3) out.push('<div class="use more">+ ' + (u.length - 3) + " more</div>");
  return '<div class="uses">' + out.join("") + "</div>";
}

function drawRow(row) {
  var el = document.createElement("div");
  el.className = "row" + (dropped(row) ? " dropped" : changed(row) ? " changed" : todo(row) ? " todo" :
    checked(row) ? " checked" : "");
  el.dataset.id = row.id;

  var sites = row.targets.length;
  var bits = [];
  surfacesOf(row).slice(0, 3).forEach(function (s) { bits.push(surfacePill(s)); });
  if (surfacesOf(row).length > 3) bits.push('<span class="pill">+' + (surfacesOf(row).length - 3) + "</span>");
  bits.push('<span class="ctx">' + esc(row.context) + "</span>");
  bits.push('<span class="at" title="click to copy">' + esc(where(row)) + "</span>");
  if (sites > 1) {
    var extra = row.where === "game.js" && row.lines && row.lines.length > 1
      ? row.lines.length + " call sites"
      : "written in " + sites + " files";
    bits.push('<span class="pill sites" title="applying this row writes all of them">' + extra + "</span>");
  }
  if (row.fragment) bits.push('<span class="pill frag" title="one literal inside a bigger expression">fragment</span>');
  if (row.unused) bits.push('<span class="pill unused" title="nothing in game.js writes this English — stale, or built at runtime">no use found</span>');
  if (dropped(row)) bits.push('<span class="pill drop" title="Apply takes this entry out of the manifest">will be removed</span>');
  if (todo(row)) bits.push('<span class="pill todo" title="the French it translates changed on ' + esc(todo(row).at) +
    ' — check it if it still reads right, or edit it">FR changed · update EN</span>');
  if (row.desync != null) {
    bits.push('<span class="pill desync" title="page.html reads &ldquo;' + esc(row.desync) +
      '&rdquo; — the shell overwrites it from CONFIG at boot, so the source lies">page.html drifted</span>');
    bits.push('<button class="ico sync" title="write this string into page.html too">&#8646;</button>');
  }
  if (stale(row)) bits.push('<span class="pill stale" title="checked on &ldquo;' + esc(mark(row).text) +
    '&rdquo; — the text has changed since">changed since checked</span>');
  if (row.hint) bits.push('<span class="hint">' + esc(row.hint) + "</span>");
  bits.push('<span class="sp"></span>');
  // A pending edit is not what the file says yet, so there is nothing to sign off.
  // On a row with an action, the check answers it: the English still reads right.
  var on = checked(row) && !todo(row);
  if (!pending(row)) bits.push('<button class="ico check' + (on ? " on" : "") + '" title="' +
    (todo(row) ? "Still right — check it and close the action" :
     on ? "Checked " + esc(mark(row).at) + " — click to take it back" : "Mark as checked") + '">&#10003;</button>');
  if (row.unused && !dropped(row)) bits.push('<button class="ico trash" title="Remove it from the manifest on Apply">&#128465;</button>');
  if (!dropped(row)) bits.push('<button class="ico edit" title="Edit">&#9998;</button>');
  bits.push('<button class="ico undo' + (pending(row) ? "" : " hide") + '" title="Revert">&#8634;</button>');

  var html = '<div class="meta">' + bits.join("") + "</div>";
  html += '<div class="val">' + esc(valueOf(row)) + "</div>";
  if (changed(row)) html += '<div class="was">' + esc(row.text) + "</div>";
  if (hasMarkup(valueOf(row))) html += '<div class="prev">' + preview(valueOf(row)) + "</div>";
  if (row.other != null) {
    html += '<div class="other"><u>' + (row.lang === "fr" ? "EN" : "FR") + "</u>" + esc(row.other) + "</div>";
  }
  if (todo(row)) html += '<div class="todo-fr"><u>FR NOW</u>' + (todo(row).was != null ? "<s>" + esc(todo(row).was) + "</s>" : "") +
    esc(todo(row).fr) + "</div>";
  if (row.expr) html += '<div class="expr">' + esc(row.expr) + "</div>";
  html += drawUses(row);

  el.innerHTML = html;
  return el;
}

function matches(row) {
  if (mode === "changed") return pending(row);
  if (mode === "todo") return !!todo(row);
  if (hideChecked && checked(row) && !todo(row)) return false;
  // A string with no language is read in both, so both modes show it.
  if (mode !== "all" && row.lang !== mode && row.lang !== "all") return false;
  if (surface && !surfacesOf(row).some(function (s) { return s.key === surface; })) return false;
  if (!filter) return true;
  var hay = (row.context + " " + valueOf(row) + " " + where(row) + " " + (row.other || "") + " " + (row.hint || "") + " " +
    surfacesOf(row).map(function (s) { return surfaceDef(s.key).label + " " + (s.detail || ""); }).join(" ") + " " +
    (row.uses || []).map(function (u) { return (u.fn || "") + " " + (u.context || ""); }).join(" ")).toLowerCase();
  return hay.indexOf(filter) >= 0;
}

function draw() {
  var list = $("list");
  // Redrawing empties the list, which would throw the reader back to the top.
  var keep = list.scrollTop;
  list.innerHTML = "";
  if (loading) {
    list.innerHTML = '<div class="loading"><div class="spin"></div>reading ' + esc(loading) + "…</div>";
    drawHead();
    return;
  }
  if (!scan) { list.innerHTML = '<div class="empty">Choose a game</div>'; drawHead(); return; }

  var shown = 0;
  ["en", "fr", "all"].forEach(function (lang) {
    var mine = scan.rows.filter(function (r) { return r.lang === lang && matches(r); });
    if (!mine.length) return;
    var head = document.createElement("div");
    head.className = "lang";
    head.innerHTML = lang.toUpperCase() + " <i>" + LANGS[lang] + " · " + mine.length + "</i>";
    list.appendChild(head);

    scan.groups.forEach(function (g) {
      var rows = mine.filter(function (r) { return r.group === g.key; });
      if (!rows.length) return;
      var gh = document.createElement("div");
      gh.className = "group";
      gh.innerHTML = "<b>" + esc(g.label) + "</b><i>" + esc(g.note) + "</i>";
      list.appendChild(gh);
      rows.forEach(function (r) { list.appendChild(drawRow(r)); shown++; });
    });
  });

  if (!shown) list.innerHTML = '<div class="empty">nothing matches</div>';
  list.scrollTop = keep;
  drawHead();
}

function drawHead() {
  var n = countChanged();
  var btn = $("apply");
  btn.className = n ? "live" : "";
  btn.innerHTML = n ? "Apply <b>" + n + "</b>" : "Apply";
  if (!scan) { $("stats").innerHTML = ""; $("sub").textContent = "every word a game shows"; return; }
  var s = ['<span><b>' + scan.counts.en + "</b> EN</span>", '<span><b>' + scan.counts.fr + "</b> FR</span>"];
  if (scan.counts.fragments) s.push("<span>" + scan.counts.fragments + " fragments</span>");
  // What is left to read, in the language on screen.
  var pool = scan.rows.filter(function (r) { return mode === "all" || mode === "changed" || mode === "todo" || r.lang === mode || r.lang === "all"; });
  var ok = pool.filter(function (r) { return checked(r) && !todo(r); }).length;
  s.push('<span class="' + (ok && ok === pool.length ? "done" : "") + '"><b>' + ok + "</b> / " + pool.length + " checked</span>");
  var todos = scan.rows.filter(todo).length;
  if (todos) s.push('<span class="todo" id="todo-chip" title="English whose French changed — show them">' + todos + " EN to update</span>");
  // The work left, not a number of rows: a game is done when it is 0.
  s.push(scan.counts.untranslated
    ? '<span class="warn" title="' + esc((scan.missing || []).join(" · ")) + '">' +
      scan.counts.untranslated + " untranslated</span>"
    : "<span>fully translated</span>");
  (scan.warnings || []).forEach(function (w) { s.push('<span class="warn" title="' + esc(w) + '">' + esc(w.slice(0, 44)) + "…</span>"); });
  $("stats").innerHTML = s.join("");
  $("sub").textContent = scan.title + " · v" + scan.version;
}

/* --- checking ------------------------------------------------------------
   The mark is written by the server, which refuses it when the file no longer
   reads what the page shows; the page redraws on the marks it hands back. */
function toggleCheck(row) {
  if (!row || pending(row)) return;
  var on = !checked(row) || !!todo(row);
  fetch("api/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: scan.slug, id: row.id, text: on ? row.text : null })
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res.error) { report({ applied: [], skipped: [], error: res.error }); return; }
    scan.review = res.review;
    scan.todo = res.todo || {};
    setStatus(res.status);
    if (res.also && res.also.length) note((on ? "checked" : "unchecked") + " in " + res.also.length + " other game" +
      (res.also.length > 1 ? "s" : "") + " too — " + res.also.map(function (g) { return titles[g] || g; }).join(", "));
    // One card changes: redraw it alone, unless hiding checked rows takes it away.
    var el = $("list").querySelector('.row[data-id="' + CSS.escape(row.id) + '"]');
    if (el && !hideChecked && mode !== "todo") { el.replaceWith(drawRow(row)); drawHead(); }
    else draw();
  }).catch(function (e) { report({ applied: [], skipped: [], error: String(e) }); });
}

/* --- editing ------------------------------------------------------------- */
function rowById(id) {
  for (var i = 0; i < scan.rows.length; i++) if (scan.rows[i].id === id) return scan.rows[i];
  return null;
}

function edit(el) {
  var row = rowById(el.dataset.id);
  if (!row || el.querySelector("textarea")) return;
  el.classList.add("editing");
  var ta = document.createElement("textarea");
  ta.className = "ed";
  ta.value = valueOf(row);
  var val = el.querySelector(".val");
  val.style.display = "none";
  val.parentNode.insertBefore(ta, val.nextSibling);
  ta.style.height = Math.max(38, ta.scrollHeight) + "px";
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  function close(commit) {
    if (commit) {
      // A break is <br>, the way the taglines already write one: apply-text
      // refuses a newline, so it never reaches the source as one.
      var next = ta.value.replace(/[\r\n]+/g, " ");
      if (next === row.text) delete plan[row.id]; else plan[row.id] = next;
    }
    el.classList.remove("editing");
    draw();
  }
  ta.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); close(false); }
    else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); close(true); }
  });
  ta.addEventListener("blur", function () { close(true); });
  ta.addEventListener("input", function () {
    ta.style.height = "auto";
    ta.style.height = Math.max(38, ta.scrollHeight) + "px";
  });
}

$("list").addEventListener("click", function (e) {
  var el = e.target.closest(".row");
  if (!el) return;
  if (e.target.closest(".undo")) { delete plan[el.dataset.id]; delete drop[el.dataset.id]; draw(); return; }
  if (e.target.closest(".trash")) { drop[el.dataset.id] = true; draw(); return; }
  if (e.target.closest(".check")) { toggleCheck(rowById(el.dataset.id)); return; }
  if (e.target.closest(".sync")) { plan[el.dataset.id] = rowById(el.dataset.id).text; draw(); return; }
  if (e.target.closest(".at")) {
    var row = rowById(el.dataset.id);
    var file = row.targets[0].file;
    var ref = (file.indexOf("/") >= 0 ? file : "games/" + scan.slug + "/" + file) + (row.line ? ":" + row.line : "");
    navigator.clipboard && navigator.clipboard.writeText(ref);
    e.target.textContent = "copied";
    setTimeout(draw, 600);
    return;
  }
  if (e.target.closest(".edit") || e.target.closest(".val")) edit(el);
});

/* --- loading and applying ------------------------------------------------ */
/* An entry nothing writes is proposed for removal the moment the game is read:
   the reader sees it struck through and counted, and keeps it with revert. */
function proposeDrops() {
  drop = {};
  if (scan) scan.rows.forEach(function (r) { if (r.unused) drop[r.id] = true; });
}

function load(slug) {
  plan = {};
  drop = {};
  scan = null;
  drawSurfacePick();
  loading = slug || null;
  draw();
  if (!slug) return;
  fetch("api/text?game=" + encodeURIComponent(slug))
    .then(function (r) { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
    .then(function (data) {
      if (loading !== slug) return;           // another game was picked meanwhile
      loading = null;
      scan = data;
      proposeDrops();
      drawSurfacePick();
      draw();
    })
    .catch(function (e) {
      if (loading !== slug) return;
      loading = null;
      draw();
      $("list").innerHTML = '<div class="empty">could not read ' + esc(slug) + " — " + esc(e.message) + "</div>";
    });
}

function report(res) {
  var box = $("report");
  var html = '<h2>APPLY <button class="ico" id="report-x">&times;</button></h2>';
  if (res.error) html += '<p class="no">' + esc(res.error) + "</p>";
  res.applied.forEach(function (a) {
    html += '<p class="ok">' + esc(a.what) + "<small>&ldquo;" + esc(a.from) + "&rdquo; &rarr; &ldquo;" + esc(a.to) + "&rdquo; · " + esc(a.where) + "</small></p>";
  });
  (res.removed || []).forEach(function (d) {
    html += '<p class="ok">' + esc(d.what) + "<small>removed from manifest.json &mdash; &ldquo;" + esc(d.text) + "&rdquo;</small></p>";
  });
  if (res.retranslated && res.retranslated.length) {
    html += '<p>English adapted to the new French &mdash; unchecked, to be read</p>';
    res.retranslated.forEach(function (t) {
      html += '<p class="ok">' + esc(t.what) + "<small>" + (t.kept ? "kept &mdash; &ldquo;" + esc(t.from) + "&rdquo; still says it"
        : "&ldquo;" + esc(t.from) + "&rdquo; &rarr; &ldquo;" + esc(t.to) + "&rdquo; · " + esc(t.where)) + "</small></p>";
    });
  }
  if (res.translateError) html += '<p class="no">' + esc(res.translateError) + "</p>";
  if (res.todo && res.todo.length) html += '<p>' + res.todo.length + " English string" + (res.todo.length > 1 ? "s" : "") +
    " to update after the French &mdash; the <b>To update</b> mode lists them</p>";
  res.skipped.forEach(function (s) { html += '<p class="no">' + esc(s) + "</p>"; });
  if (!res.applied.length && !(res.removed || []).length && !res.skipped.length && !res.error) html += "<p>nothing to apply</p>";
  if (res.version) html += "<p>version &rarr; <b>" + esc(res.version) + "</b></p>";
  if (res.rebuilt) html += "<p>rebuilt " + esc(res.rebuilt.join(", ")) + "</p>";
  box.innerHTML = html;
  box.classList.remove("hide");
  $("report-x").addEventListener("click", function () { box.classList.add("hide"); });
}

$("apply").addEventListener("click", function () {
  if (!countChanged()) return;
  var edits = scan.rows.filter(changed).map(function (r) {
    return { id: r.id, was: r.text, text: plan[r.id] };
  });
  var remove = scan.rows.filter(dropped).map(function (r) { return { id: r.id, was: r.text }; });
  // A French edit waits on the English pass (~5 s), so say so.
  $("apply").innerHTML = edits.some(function (e) { var r = rowById(e.id); return r && r.lang === "fr"; })
    ? "Applying + EN…" : "Applying…";
  fetch("api/apply", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: scan.slug, edits: edits, remove: remove })
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res.scan) { scan = res.scan; plan = {}; proposeDrops(); drawSurfacePick(); }
    setStatus(res.status);
    // A refused edit keeps its typing, so it can be looked at rather than lost.
    (res.skipped || []).forEach(function (s) {
      edits.forEach(function (e) { if (s.indexOf(e.id) === 0) plan[e.id] = e.text; });
    });
    draw();
    report(res);
  }).catch(function (e) { report({ applied: [], skipped: [], error: String(e) }); });
});

$("filter").addEventListener("input", function () { filter = this.value.trim().toLowerCase(); draw(); });
$("surface-pick").addEventListener("change", function () { surface = this.value; draw(); });
var picked = "";
function pickGame(slug) {
  pickOpen(false);
  if (slug === picked) return;
  if (countEdits() && !confirm(countEdits() + " unapplied change(s) on " + scan.title + " — drop them?")) return;
  picked = slug;
  drawPicker();
  load(slug);
}
$("stats").addEventListener("click", function (e) {
  if (!e.target.closest("#todo-chip")) return;
  setMode("todo");
});
$("todo").addEventListener("click", function () {
  hideChecked = !hideChecked;
  this.classList.toggle("on", hideChecked);
  draw();
});
$("modes").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (b) setMode(b.dataset.mode);
});
function setMode(m) {
  mode = m;
  [].forEach.call($("modes").children, function (c) { c.classList.toggle("on", c.dataset.mode === m); });
  draw();
}

document.addEventListener("keydown", function (e) {
  if (e.key === "/" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement !== $("filter")) {
    e.preventDefault(); $("filter").focus();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); $("apply").click(); }
});

/* The manifests only, so the picker is up at once; nothing is parsed until a
   game is chosen. */
var versions = {}, order = [], pickIdx = -1;
fetch("api/games").then(function (r) { return r.json(); }).then(function (list) {
  list.forEach(function (g) { titles[g.slug] = g.title; versions[g.slug] = g.version; });
  order = list.map(function (g) { return g.slug; });
  drawPicker();
  // Every game's status, read after the picker is up: it parses what the
  // server has not cached yet (~2 s cold).
  return fetch("api/status").then(function (r) { return r.json(); }).then(setStatus);
});

/* ── the game picker ──────────────────────────────────────────────────────
   One button, and a list under it. A game every row of which is checked —
   nothing untranslated, nothing left to update — wears a tick and goes
   green; any other says how far along it is, and how many rows to update. */
function pickDone(slug) { return !!(gameStatus[slug] && gameStatus[slug].done); }

function pickEntry(slug, inList) {
  var st = gameStatus[slug];
  var html = (inList && slug === picked ? '<span class="gp-dot"></span>' : "") +
    (pickDone(slug) ? '<span class="gp-ck">\u2713</span>' : "") +
    "<span>" + esc(titles[slug] || slug) +
    (versions[slug] ? ' <span class="gp-v">· v' + esc(versions[slug]) + "</span>" : "") + "</span>";
  if (inList && st && !st.done) {
    html += '<span class="gp-left">' + st.checked + "/" + st.total +
      (st.todo ? " · <em>" + st.todo + " to update</em>" : "") + "</span>";
  }
  return html;
}

function drawPicker() {
  var box = $("game-pick");
  box.classList.toggle("done", !!picked && pickDone(picked));
  box.querySelector(".gp-btn").innerHTML = picked ? pickEntry(picked, false) : "<span>Choose a game</span>";
  box.querySelector(".gp-list").innerHTML = order.map(function (slug, i) {
    return '<button type="button" class="gp-row' + (pickDone(slug) ? " done" : "") + (i === pickIdx ? " on" : "") +
      '" data-slug="' + esc(slug) + '">' + pickEntry(slug, true) + "</button>";
  }).join("");
}

function pickOpen(on) {
  var box = $("game-pick"), list = box.querySelector(".gp-list");
  list.hidden = !on;
  box.classList.toggle("open", on);
  if (!on) return;
  pickIdx = Math.max(0, order.indexOf(picked));
  drawPicker();
  var cur = list.querySelector(".gp-row.on");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

(function wirePicker() {
  var box = $("game-pick"), btn = box.querySelector(".gp-btn"), list = box.querySelector(".gp-list");
  btn.addEventListener("click", function () { pickOpen(list.hidden); });
  list.addEventListener("click", function (e) {
    var r = e.target.closest(".gp-row");
    if (r) pickGame(r.dataset.slug);
  });
  box.addEventListener("keydown", function (e) {
    if (list.hidden) {
      if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") { e.preventDefault(); pickOpen(true); }
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); pickOpen(false); btn.focus(); return; }
    if (e.key === "Enter") { e.preventDefault(); if (order[pickIdx]) pickGame(order[pickIdx]); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    pickIdx = Math.max(0, Math.min(order.length - 1, pickIdx + (e.key === "ArrowDown" ? 1 : -1)));
    drawPicker();
    var on = list.querySelector(".gp-row.on");
    if (on) on.scrollIntoView({ block: "nearest" });
  });
  // A click anywhere else, or the window losing focus, closes it.
  document.addEventListener("mousedown", function (e) { if (!box.contains(e.target)) pickOpen(false); });
  window.addEventListener("blur", function () { pickOpen(false); });
})();

function setStatus(map) {
  if (!map) return;
  Object.keys(map).forEach(function (slug) { gameStatus[slug] = map[slug]; });
  drawPicker();
}

// A line in the report box, for what a click did beyond the row it was on.
function note(text) {
  var box = $("report");
  box.innerHTML = '<h2>CHECK <button class="ico" id="report-x">&times;</button></h2><p>' + esc(text) + "</p>";
  box.classList.remove("hide");
  $("report-x").addEventListener("click", function () { box.classList.add("hide"); });
}
</script>
</body>
</html>
