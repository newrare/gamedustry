    `<a class="kitbtn" href="kit#${esc(snd.kit)}" target="_blank" title="this key plays a variant of the house kit — its takes are chosen on the kit page, for every game that maps to it">kit: ${esc(snd.kit)} ↗</a>` +
    kitSelect(key, snd.kit) +
    `<span class="sp"></span><span class="plays">${calls.length}×</span>` +
    `<span class="acts">` +
    iconBtn("check", "check", "check every line of this clip at once") +
    iconBtn("revert", "revert", "put this key back where the source has it") +
    iconBtn("trash", "trash", "take this key out of the house kit (sfx in manifest.json), and every line of the game that plays it") +
    `</span>`;
  head.querySelector(".key").onclick = () => copy(key);
  head.querySelector(".revert").onclick = () => revertClip(key, card);
  head.querySelector(".trash").onclick = () => killClip(key, card);
  head.querySelector(".check").onclick = () => {
    const ids = calls.map((c) => c.checkId).filter(Boolean);
    toggleCheck(ids, !ids.every(isChecked));
  };
  card.appendChild(head);
  calls.forEach((c) => card.appendChild(callRow(c)));
  wireKitSelect(head.querySelector(".kitsel"), key, snd.kit);
  return card;
}

function beatCard(beat, calls) {
  const card = document.createElement("div");
  card.className = "beat";
  const silent = calls.some((c) => c.kind === "pop") && !calls.some((c) => c.kind === "sound");
  const head = document.createElement("div");
  head.className = "bhead";
  head.innerHTML =
    `<span class="ln" title="click to copy the path">L${beat.line}</span>` +
    `<span class="fn">${beat.fn ? esc(beat.fn) + "<i>()</i>" : "<i>top level</i>"}</span>` +
    `<span class="sp"></span>` +
    (silent ? `<span class="warn" title="this moment shows a callout and plays nothing — deliberate on a beat that is already loud, a gap otherwise">no sound</span>` : "") +
    `<span class="acts">` +
    iconBtn("check", "check", calls.length > 1 ? "check the " + calls.length + " callouts of this moment" : "mark as checked — seen and read, signed off") +
    iconBtn("revert", "revert", "put this moment back where the source has it") +
    iconBtn("trash", "trash", calls.length > 1 ? "remove the " + calls.length + " callouts of this moment from the game" : "remove this callout from the game") +
    `</span>`;
  head.classList.add("has-acts");
  head.querySelector(".ln").onclick = () => copy(state.data.where + ":" + beat.line);
  card.appendChild(head);

  const rows = calls.map((c) => { const r = callRow(c); card.appendChild(r); return r; });

  /* The card's actions are the moment's: what fires together is checked,
     reverted and removed together. Removing is all or nothing — every line
     marked, or, when they all already are, every line given back. */
  head.querySelector(".check").onclick = () => {
    const ids = calls.map((c) => c.checkId).filter(Boolean);
    toggleCheck(ids, !ids.every(isChecked));
  };
  head.querySelector(".revert").onclick = () => {
    calls.forEach((c, i) => revertCall(c, rows[i]));
    card.classList.remove("killed");
  };
  head.querySelector(".trash").onclick = () => {
    const on = !calls.every((c) => state.pending.kill.calls[pendKey(c)]);
    calls.forEach((c, i) => { if (!!state.pending.kill.calls[pendKey(c)] !== on) killCall(c, rows[i]); });
    card.classList.toggle("killed", on);
  };
  card.classList.toggle("killed", calls.every((c) => state.pending.kill.calls[pendKey(c)]));

  const src = document.createElement("details");
  src.className = "src";
  src.innerHTML = `<summary>source · ${state.data.where}:${beat.codeFrom}</summary><pre>${esc(beat.code)}</pre>`;
  card.appendChild(src);
  return card;
}

/* --- auditioning a raw file ----------------------------------------------
   A file of assets/audio/sfx/ picked in a dropdown is not embedded yet, so the
   motor cannot play it: the PAGE plays it, off /sfx/…, with its own <audio>.
   It stops at the cut length rather than running the whole file — most clips
   are mostly tail, and what the game will ship is the first `len` seconds. */
const sfxAudio = {};
let sfxPlaying = null, sfxStop = null;

function sfxVol() {
  const v = parseFloat(localStorage.getItem("events:libvol"));
  return isNaN(v) ? 0.9 : v;
}

function sfxPlay(file, len) {
  if (sfxPlaying) sfxPlaying.pause();
  clearTimeout(sfxStop);
  const a = sfxAudio[file] || (sfxAudio[file] = new Audio("sfx/" + encodeURIComponent(file)));
  a.volume = sfxVol();
  try { a.currentTime = 0; } catch (e) {}
  a.play().catch(() => note("cannot play " + file));
  sfxPlaying = a;
  if (len > 0) sfxStop = setTimeout(() => { try { a.pause(); } catch (e) {} }, len * 1000);
}

/* --- the one list -------------------------------------------------------- */
function render() {
  const list = el("list");
  list.innerHTML = "";
  if (!state.data) { list.innerHTML = `<div class="empty">loading…</div>`; return; }
  const d = state.data;
  const sound = state.view === "sound";
  if (document.body.classList.contains("sound") !== sound) { document.body.classList.toggle("sound", sound); fit(); }

  // 1. the bed — the one sound nothing in the game ever calls.
  const bed = sound && d.sounds.find((s) => s.music);
  if (bed) {
    add("section", "music — the background bed");
    const m = d.music || {};
    const settings = Object.keys(m).map((k) => k + " " + m[k]).join(" · ");
    const row = document.createElement("div");
    row.className = "sfx bed";
    row.innerHTML = `<span class="key">${esc(bed.key)}</span><span class="note">` +
      esc(bed.note || "assets/audio/music/" + d.slug + ".mp3") +
      (settings ? ` — <b style="color:#c98fb0">${esc(settings)}</b>` : "") + `</span>`;
    const play = document.createElement("button");
    play.className = "act sm";
    play.textContent = "▶ play";
    play.onclick = () => { unlock(); const M = api("Music"); if (M) M.start(); };
    const stop = document.createElement("button");
    stop.className = "act sm ghost";
    stop.textContent = "stop";
    stop.onclick = () => { const M = api("Music"); if (M) M.stop(); };
    row.appendChild(play); row.appendChild(stop);
    list.appendChild(row);
    add("legend", "The shell starts it, ducks it on the end screen and pauses it off-screen. A game only embeds it and sets CONFIG.music.");
  }

  /* 2. the beats, in source order, with only this side of each showing. The
        pack is not listed a second time: a clip is reached through the beat
        that plays it, which is the only place it can be judged anyway. */
  add("section", sound ? "cues — one card per clip, and the lines that play it" : "events — the callouts and the notifications");
  if (sound && d.slug === "template") add("legend",
    "The template's clips are the end screen's: the motor plays them (packages/shell/shell.js, and the web shell's map and menu), " +
    "so the lines below are motor lines — play them, sweep their volume and pitch by ear. Apply re-cuts the CLIP into template/game.js; " +
    "every game keeps the copy it was made with until it is re-cut on its own entry.");
  add("legend", sound
    ? "The file a clip is cut from and the length of the cut belong to the clip, so they are written once, at the top of its card — change them and every line below follows. Open the file list and hover a row to hear it. Volume and pitch are each line's own."
    : "The style dropdown is the callout's look; apply writes it back into the Pop.show line. A value the game builds at runtime is marked and refused rather than overwritten.");
  let n = 0;
  if (sound) {
    // Grouped by the clip, the groups in the order their first line appears.
    const groups = new Map();
    d.calls.filter((c) => c.kind === "sound").forEach((c) => {
      const key = String(c.preview.args[0]);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    });
    groups.forEach((calls, key) => {
      if (state.hideChecked && calls.every((c) => isChecked(c.checkId))) return;
      list.appendChild(clipCard(key, calls)); n++;
    });
  } else {
    const kinds = VIEWS[state.view].kinds;
    d.beats.forEach((b) => {
      const calls = b.calls.filter((c) => kinds[c.kind] && !(state.hideChecked && isChecked(c.checkId)));
      if (!calls.length) return;
      list.appendChild(beatCard(b, calls));
      n++;
    });
  }
  if (!n) add("empty", state.hideChecked && sideTotal(state.view)
    ? "everything on this side is checked"
    : sound ? "this game plays no cue" : "this game fires no callout");

  /* A clip nothing plays has no beat, so it has no row — the pill is the only
     place it is still named, and it names it: dead bytes in every build. */
  const dead = d.sounds.filter((x) => !x.music && !x.plays.length).map((x) => x.key);
  /* A clip the manifest has not handed to a role of the house kit (`sfx`) is
     the game's own file: the pill names every key still waiting for a role. */
  const loose = d.sounds.filter((x) => !x.music && !x.kit).map((x) => x.key);
  el("stats").innerHTML =
    `<span><b>${d.counts.pop}</b> callouts</span>` +
    `<span><b>${d.counts.notify}</b> notifications</span>` +
    `<span><b>${d.counts.sound}</b> cues</span>` +
    `<span><b>${d.sounds.length}</b> clips</span>` +
    (dead.length ? `<span style="background:#3a2a12" title="${esc(dead.join(", "))} — embedded in every build and played by no beat. Delete them from ASSETS.sounds, or give them one."><b style="color:#ffb648">${dead.length}</b> never played</span>` : "") +
    (loose.length ? `<span style="background:#2a1f3d" title="${esc(loose.join(", "))} — a clip of the game's own, in no role of the house kit. Pick one in the kit selector of its card."><b style="color:#c8b8ff">${loose.length}</b> without a role</span>` : "") +
    `<span class="checked-pill"></span>` +
    `<button class="hide${state.hideChecked ? " on" : ""}" title="show only what is left to check">Hide checked</button>`;
  el("stats").querySelector("button.hide").onclick = () => {
    state.hideChecked = !state.hideChecked;
    try { localStorage.setItem("events:hideChecked", state.hideChecked ? "1" : "0"); } catch (e) {}
    render();
  };

  el("tabs").querySelectorAll("button").forEach((btn) => {
    const v = btn.dataset.view;
    btn.classList.toggle("on", v === state.view);
    btn.title = VIEWS[v].label;
    btn.querySelector("b").textContent =
      d.beats.reduce((a, b2) => a + b2.calls.filter((c) => VIEWS[v].kinds[c.kind]).length, 0);
  });
  paintChecks();
  refreshFiles();
  countPending();
}

/* ── checked ──────────────────────────────────────────────────────────────
   A mark is the server's (lab/events-review.json) and is matched on the
   call's checkId alone, so the page only ever asks "is this id in the review".
   A click repaints in place rather than re-rendering: a row holds pending
   edits and slot values the hand is in the middle of. With HIDE CHECKED on,
   a row that was just checked leaves the list, which is the point of it. */
function isChecked(id) {
  return !!(id && state.data && state.data.review && state.data.review[id]);
}
function sideCalls(view) {
  const kinds = VIEWS[view].kinds;
  return state.data ? state.data.calls.filter((c) => c.checkId && kinds[c.kind]) : [];
}
function sideTotal(view) { return sideCalls(view).length; }

// In order, one after the other, so the last answer is the whole review.
let checkQueue = Promise.resolve();
function toggleCheck(ids, on) {
  ids = ids.filter(Boolean);
  if (!ids.length) return;
  checkQueue = checkQueue.then(() => sendCheck(ids, on));
}
function sendCheck(ids, on) {
  return fetch("api/check", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ game: state.slug, ids, on })
  })
    .then((r) => r.json())
    .then((res) => {
      if (res.error) { note(res.error); return; }
      state.data.review = res.review;
      state.status[state.slug] = res.status;
      drawOption(state.slug);
      if (state.hideChecked && on) {
        const list = el("list"), top = list.scrollTop;
        render();
        list.scrollTop = top;
      } else paintChecks();
      note(on ? ids.length + " checked" : ids.length + " unchecked");
    })
    .catch((e) => note("check failed: " + e.message));
}

function paintChecks() {
  document.querySelectorAll(".call[data-check]").forEach((row) => {
    const on = isChecked(row.dataset.check);
    row.classList.toggle("checked", on);
    const b = row.querySelector(".iconbtn.check");
    if (b) {
      b.classList.toggle("on", on);
      const m = on && state.data.review[row.dataset.check];
      b.title = on ? "checked " + m.at + " — click to take it back" : "mark as checked — seen and heard, signed off";
    }
  });
  // A card is checked when every line on it is.
  document.querySelectorAll("#list .beat").forEach((card) => {
    const rows = [...card.querySelectorAll(".call[data-check]")];
    const all = rows.length > 0 && rows.every((r) => r.classList.contains("checked"));
    card.classList.toggle("checked", all);
    const b = card.querySelector(".bhead .iconbtn.check");
    if (b) b.classList.toggle("on", all);
  });
  if (!state.data) return;
  const done = (view) => sideCalls(view).filter((c) => isChecked(c.checkId)).length;
  const pill = el("stats").querySelector(".checked-pill");
  if (pill) {
    const all = sideTotal("view") + sideTotal("sound"), ok = done("view") + done("sound");
    pill.className = "checked-pill" + (all && ok === all ? " done" : "");
    pill.innerHTML = `<b>${ok}</b> / ${all} checked`;
  }
  el("tabs").querySelectorAll("button").forEach((btn) => {
    const v = btn.dataset.view, t = sideTotal(v);
    btn.classList.toggle("done", t > 0 && done(v) === t);
    btn.querySelector("b").textContent = t ? done(v) + "/" + t : "0";
  });
}

/* The picker's label: a tick and green once the game is done, its count
   otherwise — what is left to check is the reason to open it. */
function drawOption(slug) {
  const pick = el("game-pick");
  const opt = pick.querySelector('option[value="' + CSS.escape(slug) + '"]');
  const g = state.games && state.games[slug];
  if (!opt || !g) return;
  const st = state.status[slug];
  opt.textContent = (st && st.done ? "\u2713 " : "") + g.title + " — " + g.counts.pop + " callouts, " + g.counts.sound + " cues" +
    (st && !st.done && st.total ? "  ·  " + st.checked + "/" + st.total + " checked" : "");
  opt.className = st && st.done ? "done" : "";
  if (pick.value === slug) pick.className = opt.className;
}

function fit() {
  const stage = el("stage"), bar = el("bar"), gap = 12, label = 22;
  // The apply report takes its room out of the frames, never off the bottom of
  // the window: what it costs in height the frames give back.
  const h = stage.clientHeight - bar.offsetHeight - el("hint").offsetHeight - el("report").offsetHeight - label * 2 - gap - 75;
  // Two frames stacked in the height the stage gets, never wider than a third of the window.
  const k = Math.max(0.12, Math.min(h / 2560, (window.innerWidth * 0.34 - 28) / 720));
  document.querySelectorAll(".fit").forEach((f) => {
    f.style.transform = "scale(" + k + ")";
    f.style.width = (720 * k) + "px";
    f.style.height = (1280 * k) + "px";
    f.parentNode.style.width = (720 * k) + "px";
  });
  stage.style.flexBasis = (document.body.classList.contains("sound") ? 300 : Math.max(300, 720 * k + 28)) + "px";
}

function load(slug) {
  if (slug !== state.slug) state.pending = EMPTY_PENDING();
  state.slug = slug;
  localStorage.setItem("events:game", slug);
  LANGS.forEach((lang) => { frames[lang].src = "build/" + slug + "/index.html?lang=" + lang; });
  fetch("api/events?game=" + encodeURIComponent(slug))
    .then((r) => r.json())
    .then((d) => { state.data = d; state.status[slug] = d.status; drawOption(slug); el("sub").textContent = d.title + (d.version ? " v" + d.version : "") + " — " + d.where; render(); });
}

fetch("api/sfx").then((r) => r.json()).then((files) => {
  state.sfx = files;
  if (state.data) render();
});

// The gameplay variants of the house kit, for the clip cards' kit selector.
fetch("api/kit").then((r) => r.json()).then((k) => {
  state.kitIds = [];
  for (const [role, r] of Object.entries(k.roles || {})) {
    if (r.group !== "game") continue;
    for (const v of Object.keys(r.variants || {})) state.kitIds.push(role + "/" + v);
  }
  if (state.data) render();
}).catch(() => {});
fetch("api/games").then((r) => r.json()).then((list) => {
  const pick = el("game-pick");
  state.games = {};
  pick.innerHTML = list.map((g) => {
    state.games[g.slug] = g;
    state.status[g.slug] = g.status;
    return `<option value="${g.slug}"></option>`;
  }).join("");
  const saved = localStorage.getItem("events:game");
  pick.value = list.some((g) => g.slug === saved) ? saved : list[0].slug;
  list.forEach((g) => drawOption(g.slug));
  pick.onchange = () => { drawOption(pick.value); load(pick.value); };
  load(pick.value);
});

/* --- APPLY — the one thing on this page that writes ----------------------
   What the rows changed goes to the server as a plan, never as a patch: the
   page names the call by LINE and by NAME, and tools/lab/apply-events.mjs
   re-reads the source and splices the argument itself. So a file that moved
   under the bench is refused by name instead of being written over blind.

   The write trips the server's watcher, which rebuilds and reloads the page —
   which is why the report is parked in sessionStorage and read back on the way
   in. It is the only record of what was refused.                            */
function applyPlan() {
  const calls = [];
  for (const [k, set] of Object.entries(state.pending.calls)) {
    const [line, name] = k.split("|");
    if (Object.keys(set).length) calls.push({ line: Number(line), name, set });
  }
  const sfx = Object.entries(state.pending.sfx).map(([key, v]) => ({ key, file: v.file, len: v.len }));
  const kill = {
    calls: Object.values(state.pending.kill.calls),
    clips: Object.keys(state.pending.kill.clips)
  };
  /* The version always moves with the source — CLAUDE.md, and it is the number
     the title screen signs itself with, so a build nobody can name is worse
     than a patch number nobody reads. There is no switch for it here. */
  const kit = Object.entries(state.pending.kit || {}).map(([key, id]) => ({ key, id }));
  return { game: state.slug, calls, sfx, kill, kit, bump: true };
}

function showReport(r) {
  const box = el("report");
  if (!r) { box.innerHTML = ""; fit(); return; }
  if (r.error) { box.innerHTML = `<div class="no">apply failed — ${esc(r.error)}</div>`; return; }
  const seen = {};
  const lines = [];
  for (const a of r.applied || []) {
    lines.push(`<div class="ok">✓ ${esc(a.what)} → ${esc(a.value)}</div>`);
    // Several changes land on one line; the line as it now reads is printed once.
    if (a.after && !seen[a.at]) { seen[a.at] = 1; lines.push(`<span class="at">${a.at}: ${esc(a.after)}</span>`); }
  }
  for (const w of r.skipped || []) lines.push(`<div class="no">! ${esc(w)}</div>`);
  if (r.version) lines.push(`<div class="ver">version → ${esc(r.version)}</div>`);
  if (!lines.length) lines.push(`<div class="no">nothing to apply</div>`);
  box.innerHTML = lines.join("");
  fit();
}

function applyNow() {
  const plan = applyPlan();
  if (!plan.calls.length && !plan.sfx.length && !plan.kill.calls.length && !plan.kill.clips.length && !plan.kit.length) return;
  const btn = el("btn-apply");
  btn.disabled = true;
  btn.textContent = plan.sfx.length ? "Cutting…" : "Writing…";
  note("writing " + (plan.game === "template" ? "template" : "games/" + plan.game) + "/game.js…");
  fetch("api/apply", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(plan)
  })
    .then((r) => r.json())
    .then((r) => {
      state.pending = EMPTY_PENDING();
      try { sessionStorage.setItem("events:report", JSON.stringify(r)); } catch (e) {}
      showReport(r);
      note(r.written ? "written — rebuilding" : "nothing written");
      countPending();
      render();
    })
    .catch((e) => { note("apply failed: " + e.message); countPending(); });
}

el("btn-apply").onclick = applyNow;
el("tabs").querySelectorAll("button").forEach((btn) => {
  btn.onclick = () => {
    state.view = btn.dataset.view;
    localStorage.setItem("events:view", state.view);
    render();
    el("list").scrollTop = 0;
  };
});
try {
  const saved = sessionStorage.getItem("events:report");
  if (saved) showReport(JSON.parse(saved));
} catch (e) {}

el("btn-reload").onclick = () => load(state.slug);

/* The report is the only thing on the stage that outlives its moment — a
   callout expires on its own and the bed is started and stopped from its own
   row in SOUND. Click it away. */
el("report").onclick = () => {
  showReport(null);
  try { sessionStorage.removeItem("events:report"); } catch (e) {}
};

window.addEventListener("resize", fit);
fit();
</script>
</body>
</html>
