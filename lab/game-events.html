<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — game events</title>
<meta name="lab-group" content="tools">
<style>
/* ===========================================================================
   EVENTS BENCH — what a game SAYS and what it PLAYS, in one list, played on
   that game's own backdrop.

   The scope is deliberately narrow, and it is the whole point of the page.
   The list has TWO sides, and they are the two questions a beat is reviewed
   against — what the player READS and what the player HEARS:

     VIEW          the Pop callouts (`Pop.show` in the DOM, `Pop.text` on the
                   canvas) and the Overlay notifications, in source order,
                   grouped into the beat they fire together on
     SOUND         the background bed and its CONFIG.music, then ONE CARD PER
                   CLIP — the file of assets/audio/sfx/ it is cut from and how
                   long the cut is at the top, and under it every line of the
                   game that plays it, with the volume and the pitch that line
                   asks for

   The card is the clip and not the line, because 18 cues in a game are 7 clips:
   listing the clip once per line said the same thing five times over and
   offered the same file list five times for one decision. What is shared is
   written once; what a line owns — how loud, how high, since one sample covers
   a family of events through `rate` — stays on the line.

   The whole of assets/audio/sfx/ opens from the file button, and HOVERING a row
   plays it, trimmed to the cut length: a clip is chosen by ear, 127 file names
   say nothing, and picking them one at a time to hear them is not choosing.
   That is also why the list is not a <select> — a native popup is drawn by the
   operating system and fires nothing over its rows. A clip nothing plays has no
   line and therefore no card: the "never played" pill in the header names it,
   which is the one thing a separate list of the pack was for.

   Everything else a beat does — Fx.burst / ring / shake / flash / freeze,
   HUD.punch, and `Overlay.vignette`, which is a coloured glow over the frame
   and not a notification — is juice with no words in it. There is nothing on
   it to read, re-style or re-word, so tools/lab/scan-events.mjs lists it and
   this page does not.

   The right column is the game's own web build TWICE, one under the other —
   once in English, once in French — with everything but the callout layers hidden:
   no backdrop, no menu, no round, no world, a flat ground. The build is there
   because it is the only honest source of the real Pop styles, the real SKIN
   and the real samples; the backdrop is not, because a callout is reviewed for
   what it SAYS here. A row fires into both at once, so a French word that
   overflows its plate is seen under the English one that fits; a sound plays
   in the English frame only. On SOUND there is nothing to look at, so the two
   frames leave the stage and run on off-screen, still playing the rows. `Pop.text` needs the frame pipeline, which is not
   turning, so the bench drives the three calls that pipeline would make and
   nothing more (see `juice`).

   A word the game BUILDS is run, not stubbed: `"x" + mult + Lang.t(" streak")`
   is evaluated inside each frame, so the French comes out of the very Lang.t
   the game wrapped around its own literal. What the bench cannot read — the
   round's locals, `mult`, `T2.name`, `cardName(c)` — are SLOTS, inputs under
   the row with a plausible value already in them (tools/lab/scan-events.mjs,
   textsOf): a tier is a pick of the table's own keys, a `.name` one of the
   names the source writes, a count a count. Whatever is typed there is the
   bench's and is never written back; it is kept per game in this browser.
   Under the slots, the row reads back what each frame was handed, EN and FR,
   and marks a French that came out identical to the English.

   Every row is editable — the style, the word, the anchor, the clip, the file
   that clip is cut from, the volume, the pitch — so a change can be seen and
   heard before it is written. A notice can also be turned into a callout: its
   first dropdown reads `notify`, and picking a Pop style there fires the row
   as that Pop.show, and apply rewrites the call (kind and icon dropped).

   APPLY is what makes it stick. What the rows changed goes to POST /api/apply
   (tools/lab/apply-events.mjs), which splices the arguments back into
   games/<slug>/game.js — one span at a time, so a multi-line call keeps its
   shape — re-cuts a clip with ffmpeg when its FILE changed, moves the
   provenance comment with it, and bumps the game's patch version. The save
   trips the server's watcher, the build is rebuilt, the page comes back on the
   change. An argument the game builds at runtime (`"+" + gain`) is REFUSED by
   name rather than overwritten with the bench's stand-in.

   A row carries no `copy` button and a beat no `play all`: the one way a change
   leaves this page is APPLY, and the one thing to copy is the beat's own
   `file:line`, which its header hands over on a click. A number is a slider
   rather than a field, because a volume and a pitch are swept, not typed.

   Two icons sit on everything the bench can change. REVERT puts the element
   back where the source has it. TRASH deletes nothing by itself — it MARKS,
   the way every other change here is marked, so a removal is reviewed next to
   the rest of the plan, counted in the Apply badge, and taken back with the
   same revert as a typo. On a cue line it removes that line; on a clip's card
   it removes the clip from ASSETS.sounds AND every line that plays it, because
   a game calling a clip it no longer ships gets silence rather than an error.

   A line seen and heard is CHECKED — the copy desk's tick — and the three
   actions (check, revert, remove) sit in ONE place on every card: the
   top-right corner of its header, out of the flow, so no wrap can move them.
   A callout's card acts on its whole moment; a cue line keeps its own three
   in the last columns of its grid, right under its clip card's. The mark lands in lab/events-review.json against the call's
   checkId (tools/lab/scan-events.mjs): the call's source in its function, and
   for a cue the clip it plays. Change the call, or re-cut its clip, and the
   mark no longer matches: the line reads unchecked again. A clip's card ticks
   every line under it at once. A game whose every callout, notice and cue line
   is checked turns green in the picker, and HIDE CHECKED leaves what is left.

   The picker's first entry is the TEMPLATE, played in its own web build. The
   end screen's sounds are not its clips any more: they are the house kit's
   (Sound.ui), chosen on the kit page (/kit, lab/sound-kit.html).
   Served by `make events` (tools/lab/serve-events.mjs).
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  height:100vh; overflow:hidden;
  display:flex;
  background:#0b0b12;
  color:#e8e6f5;
  font:600 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* ---------------------------------------------------------------------------
   PANEL — one list: the bed, the pack, then the beats.
   --------------------------------------------------------------------------- */
#panel { flex:1 1 auto; min-width:420px; display:flex; flex-direction:column; background:#12121c; border-right:1px solid #23233a; }
#head { padding:16px 18px 14px; border-bottom:1px solid #23233a; }
#head h1 { font-size:15px; letter-spacing:1.5px; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
#head h1 small { font-weight:600; font-size:11px; letter-spacing:.5px; color:#8b8ba7; text-transform:none; }

select, input[type=text], input[type=number] {
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:7px;
  font:inherit; padding:7px 9px;
}
select:focus, input:focus { outline:none; border-color:#7ea6ff; }
#game-pick { width:100%; margin-top:12px; font-weight:700; }
/* A game every line of which is checked — green, and a tick in its label,
   since a native popup may draw the options without their colour. */
#game-pick.done { border-color:#2a5040; color:#5fd49a; }
#game-pick option { color:#e8e6f5; background:#0b0b12; }
#game-pick option.done { color:#5fd49a; }

/* The two sides of the list. VIEW is what the player reads, SOUND is what the
   player hears — and a beat that does both shows its own half in each. */
#tabs { display:flex; gap:4px; margin-top:12px; padding:3px; background:#0b0b12; border:1px solid #2c2c47; border-radius:9px; }
#tabs button {
  flex:1; padding:7px 0; border:0; border-radius:7px; background:none; color:#8b8ba7;
  font:700 11px/1 inherit; letter-spacing:1.2px; text-transform:uppercase; cursor:pointer;
}
#tabs button:hover { color:#e8e6f5; }
#tabs button.on { background:#2a2a44; color:#e8e6f5; }
#tabs button b { color:#6f6f92; font-weight:700; }
#tabs button.on b { color:#7ea6ff; }

#stats { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; font-size:11px; }
#stats span { padding:3px 8px; border-radius:20px; background:#1b1b2b; color:#9c9cba; }
#stats span b { color:#e8e6f5; }

#list { flex:1; overflow:auto; padding:14px 14px 60px; }
#list::-webkit-scrollbar { width:10px; }
#list::-webkit-scrollbar-thumb { background:#26263c; border-radius:8px; }

.section { margin:18px 0 8px; font:700 10px/1 inherit; letter-spacing:1.2px; text-transform:uppercase; color:#6f6f92; }
.section:first-child { margin-top:2px; }
.legend { margin:-2px 0 12px; font-size:11px; color:#6f6f92; }

/* --- one beat: the moment, its rows, its source -------------------------- */
.beat { background:#151522; border:1px solid #22223a; border-radius:10px; margin-bottom:10px; overflow:hidden; }
.bhead { display:flex; align-items:center; gap:10px; padding:8px 10px; background:#191927; border-bottom:1px solid #22223a; flex-wrap:wrap; }
/* A card's three actions — check, revert, remove — sit in ONE place on every
   card of both tabs: pinned to the top-right corner of its header, out of the
   flow, so neither a long function name, a warning nor a header that wraps can
   move them. The header keeps their room free. The 7px gap and the 10px edge
   are the cue lines' own, so on a clip's card the header's three sit right
   above each line's three. */
.bhead.has-acts { position:relative; padding-right:106px; min-height:39px; }
.bhead .acts { position:absolute; top:8px; right:10px; display:flex; gap:7px; }
/* A clip's card: the shared decisions on top, the lines that play it below. */
.bhead .key { font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#8fe0b8; min-width:58px; cursor:pointer; }
.bhead .filebtn { flex:1 1 180px; min-width:150px; max-width:280px; }
.bhead .plays { font-size:11px; color:#8fe0b8; font-variant-numeric:tabular-nums; }
.bhead .approx { color:#ffb648; font-size:11px; cursor:help; }
.beat.clip .call { padding-left:16px; }
.call .ln { font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#7ea6ff; cursor:pointer; }
.call .fn { font-size:12px; color:#c9c9e0; }
.call .fn i { color:#6f6f92; font-style:normal; }
.bhead .ln { font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#7ea6ff; cursor:pointer; }
.bhead .fn { font-size:12px; color:#c9c9e0; }
.bhead .fn i { color:#6f6f92; font-style:normal; }
.bhead .sp { flex:1; }
.bhead .warn { color:#ffb648; font-size:11px; cursor:help; }

button.act {
  padding:5px 10px; border-radius:7px; border:0; background:#2a2a44; color:#e8e6f5;
  font:700 11px/1 inherit; letter-spacing:.5px; cursor:pointer;
}
button.act:hover { background:#3b3b5f; }
button.act.go { background:#7ea6ff; color:#0b0b12; }
button.act.go:hover { background:#9dbaff; }
button.act.sm { padding:4px 7px; }
button.act.ghost { background:none; border:1px solid #2c2c47; color:#8b8ba7; }
button.act.ghost:hover { background:#1e1e30; color:#e8e6f5; }

.call { display:flex; align-items:center; gap:7px; padding:7px 10px; border-top:1px solid #1d1d2e; flex-wrap:wrap; }
.call:first-child { border-top:0; }
.tag {
  font:700 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.4px;
  padding:1px 7px; border-radius:5px; background:#22223a; color:#9c9cba; white-space:nowrap;
}
.k-pop     .tag { background:#3a2350; color:#dcb6ff; }
.k-notify .tag { background:#1f3550; color:#9fd0ff; }
.k-notify.as-pop .tag { background:#3a2350; color:#dcb6ff; }
.k-sound   .tag { background:#1d3d31; color:#8fe0b8; }

.call input, .call select { padding:3px 7px; border-radius:6px; font:700 12px/1.4 inherit; }
.call input.w { width:150px; }
.call input.s { width:110px; font-weight:600; color:#a8a8c8; }
.call select { font-size:11px; font-weight:700; }

/* A number here is a FEEL — a volume, a pitch, how much of a file to keep —
   and a feel is swept, not typed. The track carries the step as a printed
   grid, and the thumb lands on it, so the value is read off the position and
   two rows are comparable at a glance. */
/* Label, track and value are three columns of a fixed grid, so VOL and RATE
   sit under VOL and RATE all the way down a card however long the words to
   their left are. */
.rng { display:grid; grid-template-columns:30px 96px 34px; align-items:center; gap:7px; }
.rng > .lbl { text-align:right; }

/* THE GROOVE IS THIS SPAN, not the input's pseudo-track: `::-webkit-slider-*`
   styles or does not depending on the engine, and where it does not the slider
   comes out as a bare thumb over nothing. Three layers, topmost first — the
   grid of ticks, the fill up to the thumb, the groove — so the extent AND the
   value read at rest instead of only under the hand. */
.rng .track {
  position:relative; height:9px; border-radius:5px; border:1px solid #4a4a78;
  background:
    repeating-linear-gradient(90deg, rgba(160,160,215,.32) 0 1px, transparent 1px var(--tick, 8px)),
    linear-gradient(90deg, #35507f 0 var(--fill, 0%), #07070d var(--fill, 0%));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
.rng.dirty .track { border-color:#7ea6ff; }
.rng.dirty .track {
  background:
    repeating-linear-gradient(90deg, rgba(190,210,255,.38) 0 1px, transparent 1px var(--tick, 8px)),
    linear-gradient(90deg, #4a6dad 0 var(--fill, 0%), #07070d var(--fill, 0%));
}
.rng.expr .track { border-color:#6b5824; }

/* The input is an invisible overlay: it keeps the dragging, the keyboard and
   the snapping, and contributes nothing but its thumb. */
.rng .track input[type=range] {
  -webkit-appearance:none; appearance:none;
  position:absolute; left:-1px; right:-1px; top:-5px; height:19px;
  margin:0; padding:0; border:0; background:transparent; cursor:pointer;
}
.rng .track input[type=range]::-webkit-slider-runnable-track { height:19px; background:transparent; border:0; }
.rng .track input[type=range]::-moz-range-track { height:19px; background:transparent; border:0; }
.rng .track input[type=range]::-moz-range-progress { background:transparent; }

.rng .track input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none;
  width:14px; height:14px; margin-top:2px; border-radius:50%;
  background:#7ea6ff; border:2px solid #12121c; box-shadow:0 0 0 1px #7ea6ff;
}
.rng .track input[type=range]::-moz-range-thumb {
  width:14px; height:14px; border-radius:50%;
  background:#7ea6ff; border:2px solid #12121c; box-shadow:0 0 0 1px #7ea6ff;
}
.rng .track input[type=range]:hover::-webkit-slider-thumb { background:#9dbaff; }
.rng .track input[type=range]:hover::-moz-range-thumb { background:#9dbaff; }
.rng .track input[type=range]:focus { outline:none; }
.rng .track input[type=range]:focus::-webkit-slider-thumb { box-shadow:0 0 0 1px #7ea6ff, 0 0 0 4px rgba(126,166,255,.3); }
.rng .track input[type=range]:focus::-moz-range-thumb { box-shadow:0 0 0 1px #7ea6ff, 0 0 0 4px rgba(126,166,255,.3); }
.rng.dirty .track input[type=range]::-webkit-slider-thumb { background:#9dbaff; box-shadow:0 0 0 1px #9dbaff; }
.rng.dirty .track input[type=range]::-moz-range-thumb { background:#9dbaff; box-shadow:0 0 0 1px #9dbaff; }
.rng.dirty.expr .track input[type=range]::-webkit-slider-thumb { background:#ffb648; box-shadow:0 0 0 1px #ffb648; }
.rng.dirty.expr .track input[type=range]::-moz-range-thumb { background:#ffb648; box-shadow:0 0 0 1px #ffb648; }

.rng b {
  font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:#c9c9e0; font-variant-numeric:tabular-nums; text-align:right;
}
.rng.dirty b { color:#9dbaff; }

/* A cue line is a grid and not a flow: nine cells, the same nine on every
   line, so nothing in front of a slider can push it out of its column. */
.call.k-sound {
  display:grid; align-items:center; gap:7px;
  grid-template-columns: 26px 76px 46px minmax(40px, 1fr) auto auto 14px 24px 24px 24px;
}
.call.k-sound .fn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.call .approx { min-width:12px; text-align:center; }
.lbl { font-size:10px; color:#6f6f92; text-transform:uppercase; letter-spacing:.6px; }
.call .meta { font-size:11px; color:#7d7d9d; font-variant-numeric:tabular-nums; }
.call .approx { color:#ffb648; font-size:11px; cursor:help; }
.call .sp { flex:1; }

/* A control the bench changed and APPLY has not written yet. The amber one is
   a control whose value the GAME builds at runtime — it can be previewed, and
   apply will refuse it by name rather than paste the stand-in into the source. */
.call input.dirty, .call select.dirty, .sfx select.dirty, .sfx input.dirty {
  border-color:#7ea6ff; background:#141d33;
}
.call .expr, .call select.expr, .call input.expr { border-color:#5a4a1e; }
.call .dirty.expr, .sfx .dirty.expr { border-color:#ffb648; background:#251c0e; }
/* The file picker is NOT a <select>: a native popup is drawn by the OS and
   fires no event over its rows, so a clip could only be heard by committing to
   it. This one is ours — hovering a row plays it, and nothing is chosen until
   a click. */
.filebtn {
  flex:1 1 200px; min-width:150px; max-width:300px; text-align:left;
  padding:3px 22px 3px 7px; border-radius:6px; border:1px solid #2c2c47; background:#0b0b12;
  font:600 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:#9fd0ff;
  cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  position:relative;
}
.filebtn::after { content:"▾"; position:absolute; right:7px; top:3px; color:#6f6f92; }
.kitbtn { flex:1 1 180px; min-width:150px; max-width:280px; padding:3px 9px; border:1px solid #3a3260; border-radius:7px; background:#1a1630; color:#c8b8ff; font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; text-decoration:none; }
.kitbtn:hover { border-color:#c8b8ff; }
.kitsel { flex:0 1 170px; min-width:110px; padding:3px 6px; background:#151522; color:#c8b8ff; border:1px solid #3a3260; border-radius:7px; font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
.kitsel.dirty { border-color:#ffd08a; color:#ffd08a; }
.filebtn:hover, .filebtn.open { border-color:#7ea6ff; background:#141d33; }
.filebtn.swap { color:#ffd08a; }
.filebtn.dirty { border-color:#7ea6ff; background:#141d33; }

/* The list itself, anchored to the button and parked on the body so the
   panel's own overflow cannot clip it. */
/* `display:flex` beats the hidden attribute's UA rule, so say it again. */
#filemenu[hidden] { display:none; }
#filemenu {
  position:fixed; z-index:50; width:340px; max-height:390px; display:flex; flex-direction:column;
  background:#12121c; border:1px solid #3b3b5f; border-radius:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.6); overflow:hidden;
}
#filemenu .fm-head { padding:8px; border-bottom:1px solid #23233a; }
#filemenu input.fm-filter { width:100%; font-weight:600; }
#filemenu .fm-note { padding:6px 10px 0; font-size:10px; color:#6f6f92; }
#filemenu .fm-list { overflow:auto; padding:6px; }
#filemenu .fm-list::-webkit-scrollbar { width:9px; }
#filemenu .fm-list::-webkit-scrollbar-thumb { background:#26263c; border-radius:8px; }
#filemenu .fm-row {
  display:block; width:100%; text-align:left; padding:5px 8px; border:0; border-radius:6px;
  background:none; color:#b9b9d6; cursor:pointer;
  font:600 11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  word-break:break-word; overflow-wrap:anywhere;
}
#filemenu .fm-row:hover, #filemenu .fm-row.on { background:#1e2740; color:#e8e6f5; }
#filemenu .fm-row.cur { color:#ffd08a; }
#filemenu .fm-row .sz { color:#5f5f80; font-size:9px; }
#filemenu .fm-row.used .sz { color:#8fe0b8; }
#filemenu .fm-none { padding:14px; text-align:center; color:#6f6f92; font-size:11px; }
#filemenu .fm-cat { padding:8px 8px 2px; font:700 9px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; letter-spacing:1.5px; text-transform:uppercase; color:#6f6f92; }
#filemenu .fm-cat[hidden] { display:none; }
#head .lib { display:inline-block; margin-top:6px; font-size:11px; color:#7ea6ff; text-decoration:none; }
#head .lib:hover { text-decoration:underline; }


/* The two icons every changeable element carries. Dim until there is something
   to undo; the trash turns red once it is armed. */
.iconbtn {
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:22px; padding:0; border:0; border-radius:6px;
  background:none; color:#4d4d68; cursor:pointer;
}
.iconbtn svg { width:14px; height:14px; }
.iconbtn:hover { background:#22223a; color:#e8e6f5; }
.iconbtn.trash:hover { background:#3a1520; color:#ff8fa3; }
.call.killed .iconbtn.trash, .beat.killed .bhead .iconbtn.trash { color:#ff6b83; }

/* Marked for removal: still readable, plainly on its way out, and one click on
   the revert brings it back. */
.call.killed > *:not(.iconbtn), .beat.killed .bhead > *:not(.acts) {
  opacity:.4; text-decoration:line-through; pointer-events:none;
}
.call.killed { background:#1d1218; }

/* Checked: seen, heard and signed off. */
.iconbtn.check.on { background:#5fd49a; color:#0b0b12; }
.iconbtn.check.on:hover { background:#7de3b0; color:#0b0b12; }
.call.checked { background:#13221b; }
.call.checked.killed { background:#1d1218; }
.beat.checked { border-color:#2a5040; }
.beat.checked > .bhead { background:#15241c; }
#stats span.done { background:#13221b; color:#5fd49a; }
#stats span.done b { color:#5fd49a; }
#stats button.hide { margin-left:auto; padding:3px 9px; border-radius:20px; border:1px solid #2c2c47; background:none; color:#8b8ba7; font:700 11px/1.3 inherit; cursor:pointer; }
#stats button.hide:hover { color:#e8e6f5; }
#stats button.hide.on { background:#1e2740; border-color:#7ea6ff; color:#e8e6f5; }
#tabs button.done b { color:#5fd49a; }
.beat.killed { border-color:#5a2030; }

details.src { border-top:1px solid #1d1d2e; }
details.src summary { padding:6px 10px; font-size:11px; color:#6f6f92; cursor:pointer; list-style:none; }
details.src summary::-webkit-details-marker { display:none; }
details.src summary:hover { color:#9c9cba; }
details.src pre {
  margin:0; padding:10px 12px; background:#0d0d16; overflow:auto;
  font:500 11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9b9d6; white-space:pre;
}

/* --- the bed and the pack ------------------------------------------------ */
.sfx { display:flex; align-items:center; gap:10px; padding:8px 10px; background:#151522; border:1px solid #22223a; border-radius:9px; margin-bottom:7px; }
.sfx .key { font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#e8e6f5; width:84px; }
.sfx .note { flex:1; font-size:11px; color:#7d7d9d; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sfx.bed { border-color:#4a2338; background:#181220; }
.sfx.bed .key { color:#f0a0c0; }
.empty { padding:26px; text-align:center; color:#6f6f92; font-size:12px; }

/* ---------------------------------------------------------------------------
   STAGE — the game's backdrop and the overlay layer, nothing else.
   --------------------------------------------------------------------------- */
#stage { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; padding:14px; background:#08080f; }
#bar { display:flex; align-items:center; gap:7px; margin-bottom:12px; width:100%; }
#bar .sp { flex:1; }
/* The two languages, one under the other, the same frame at the same scale. */
#shell { position:relative; display:flex; flex-direction:column; gap:12px; }
/* SOUND has nothing to look at: the frames leave the stage, which keeps the
   bar, the hint and the report. They stay loaded and rendered off-screen —
   the English one is what plays a row. */
body.sound #shell { position:absolute; left:-10000px; top:0; }
.pane .lang { height:22px; font:700 11px/22px inherit; letter-spacing:1.5px; color:#8b8ba7; text-align:center; }
.fit { transform-origin:top left; }
.frame { width:720px; height:1280px; border:0; border-radius:22px; background:#000; display:block; box-shadow:0 24px 70px rgba(0,0,0,.6); }
#hint { margin-top:9px; text-align:center; font-size:11px; color:#6f6f92; min-height:15px; }
/* The column must not SHRINK its own rows: fit() sizes the frame from what the
   hint and the report measure, and a flex-shrunk report would make it read a
   height it had already caused. */
#bar, #shell, #hint, #report { flex:0 0 auto; }

/* What APPLY did, kept across the rebuild's reload: the line as it is now
   written, and every change that was refused and why. */
#report {
  margin-top:10px; width:100%; max-height:190px; overflow:auto;
  background:#12121c; border:1px solid #23233a; border-radius:9px; padding:9px 11px;
  font:600 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9b9d6;
}
#report:empty { display:none; }
#report .ok { color:#8fe0b8; }
#report .no { color:#ffb648; }
#report .at { color:#6f6f92; display:block; padding-left:14px; white-space:pre-wrap; word-break:break-word; }
#report .ver { color:#7ea6ff; }
#bar .cnt { font:700 11px/1 inherit; color:#0b0b12; background:#7ea6ff; border-radius:20px; padding:3px 7px; }
.call.inherited .ln.motor { color:#8fb0ff; cursor:pointer; }
/* A motor line names its FILE as well as its line (levels.js:1030), which the
   46px cell sized for "L123" cannot hold: it spilled over the function name. */
.call.k-sound.inherited { grid-template-columns: 26px 76px 100px minmax(40px, 1fr) auto auto 14px 24px 24px 24px; }
.call.k-sound .ln { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.call.inherited { background:rgba(126,166,255,.05); }

/* A word the game builds: its expression in place of the field, the round's
   values it needs on the line under it, and what each language reads under
   those. */
.call code.xw {
  max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding:3px 7px; border-radius:6px; border:1px dashed #3b3b5f; background:#0d0d16;
  font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#ffd08a; cursor:help;
}
.call .slots, .call .read { flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding-left:34px; }
.call .slots .lbl { margin-right:-4px; }
.slot { display:inline-flex; align-items:center; gap:5px; }
.slot span { font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#8b8ba7; }
.call .slot input, .call .slot select { padding:2px 6px; font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#ffd08a; }
.call .slot input { width:72px; }
.call .slot input.str { width:150px; }
.call .read { font-size:12px; color:#c9c9e0; gap:4px 16px; }
.read .ln2 { display:inline-flex; align-items:baseline; gap:7px; min-width:0; }
.read .lg { font:700 9px/1 inherit; letter-spacing:1.2px; color:#6f6f92; }
.read b { color:#e8e6f5; }
.read i { font-style:normal; color:#9c9cba; }
.read .same { color:#ffb648; font-size:10px; cursor:help; }
.read .err { color:#ff8fa3; }
</style>
</head>
<body>

<aside id="panel">
  <div id="head">
    <h1>Events <small id="sub">what the game says, and what it plays</small></h1>
    <select id="game-pick"></select>
    <a class="lib" href="library" target="_blank" title="every file of assets/audio/sfx/ by category — hover to hear, click to copy the name">Sound library ↗</a>
    <div id="tabs">
      <button data-view="view">View <b></b></button>
      <button data-view="sound">Sound <b></b></button>
    </div>
    <div id="stats"></div>
  </div>
  <div id="list"></div>
</aside>

<main id="stage">
  <div id="bar">
    <button class="act ghost" id="btn-reload">Reload</button>
    <span class="sp"></span>
    <button class="act go" id="btn-apply" disabled title="write the changes into the game's source — its patch version moves with them">Apply</button>
  </div>
  <div id="shell">
    <div class="pane"><div class="lang">EN</div>
      <div class="fit"><iframe class="frame" data-lang="en" title="the game's callout layers, in English"></iframe></div></div>
    <div class="pane"><div class="lang">FR</div>
      <div class="fit"><iframe class="frame" data-lang="fr" title="the game's callout layers, in French"></iframe></div></div>
  </div>
  <div id="hint"></div>
  <div id="report"></div>
</main>

<div id="filemenu" hidden>
  <div class="fm-head">
    <input class="fm-filter" type="text" placeholder="filter — ping, wooden error, pop…">
    <div class="fm-note">Hover to hear it · click to keep it · esc to leave</div>
  </div>
  <div class="fm-list"></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   The motor's own callout styles and anchor names (packages/shell/shell.js —
   Pop.STYLES and Pop.ANCHORS). Copied, not read: the list is needed before a
   build is loaded. lab/overlay-pop.html reads the live table instead.
   --------------------------------------------------------------------------- */
const STYLES = ["score","alert","combo","streak","ribbon","manifest","perfect",
                "ultra","bonus","danger","record","vert"];
const ANCHORS = ["topLeft","top","topRight","upperLeft","upper","upperRight",
  "left","center","right","lowerLeft","lower","lowerRight",
  "bottomLeft","bottom","bottomRight","hudUnder","ctaAbove","edgeLeft","edgeRight"];

/* The two sides of the list. Canvas juice (Fx.*, HUD.punch) is scanned but
   listed by neither — see the head. */
const VIEWS = {
  view:  { kinds: { pop: 1, notify: 1 }, label: "what the game says" },
  sound: { kinds: { sound: 1 },           label: "what the game plays" }
};

const el = (id) => document.getElementById(id);
/* One build per language. English is the source and the one that sounds: the
   French frame is muted, or every cue would be heard twice. */
const LANGS = ["en", "fr"];
const frames = {};
document.querySelectorAll("iframe.frame").forEach((f) => { frames[f.dataset.lang] = f; });
const state = {
  slug: null, data: null, sfx: [],
  view: localStorage.getItem("events:view") === "sound" ? "sound" : "view",
  // Every game's checked count, for the picker (api/games, then api/check).
  status: {},
  hideChecked: (() => { try { return localStorage.getItem("events:hideChecked") === "1"; } catch (e) { return false; } })(),
  /* What the rows changed and APPLY has not written yet, keyed so a re-render
     (a tab, a filter) puts every control back where the hand left it.
       calls: { "<line>|<Name>": { style, word, sub, at, clip, vol, rate } }
       sfx:   { "<key>": { file, len } }   — the clip is re-cut from that file */
  pending: { calls: {}, sfx: {}, kill: { calls: {}, clips: {} }, kit: {} }
};

const EMPTY_PENDING = () => ({ calls: {}, sfx: {}, kill: { calls: {}, clips: {} }, kit: {} });

/* A value apply can write back, as opposed to one the game builds at runtime.
   The two shapes are the two the splicer accepts (tools/lab/apply-events.mjs):
   a quoted string where the argument is copy, a bare number where it is a knob.
   `Sound.clip("wall", 0.32, 1.15)` is three literals, not one. */
function isLit(expr) {
  return expr != null && /^\s*(["'])(?:[^\\]|\\.)*?\1\s*$/.test(String(expr));
}
function isNum(expr) {
  return expr != null && /^\s*-?\d+(\.\d+)?\s*$/.test(String(expr));
}
const NUMERIC = { vol: 1, rate: 1 };
function writable(name, expr) {
  return NUMERIC[name] ? isNum(expr) : isLit(expr);
}

function pendKey(call) { return call.line + "|" + call.name; }
function pend(call) {
  const k = pendKey(call);
  return state.pending.calls[k] || (state.pending.calls[k] = {});
}

/* A control is dirty when its value is not the one the row was BUILT with —
   never by comparing against the source, because a value the game computes is
   previewed with a stand-in that differs from the source by construction.
   Typing over it and typing it back is not a change. */
function watch(ctrl, call, name, expr) {
  ctrl.dataset.was = ctrl.value;
  if (expr != null && !writable(name, expr)) {
    ctrl.classList.add("expr");
    ctrl.title = "the game builds this at runtime (" + expr + ") — apply refuses it rather than write the bench's stand-in";
  }
  const sync = () => {
    const changed = ctrl.value !== ctrl.dataset.was;
    ctrl.classList.toggle("dirty", changed);
    // A slider's wrapper carries the marking, and this runs AFTER the readout
    // (wireSliders binds first, so the snap lands before anything reads it).
    if (ctrl._show) ctrl._show();
    const p = pend(call);
    if (changed) p[name] = ctrl.value; else delete p[name];
    if (!Object.keys(p).length) delete state.pending.calls[pendKey(call)];
    countPending();
  };
  ctrl.addEventListener("input", sync);
  ctrl.addEventListener("change", sync);
  // A tab away and back rebuilds the row: put the pending value back on it.
  const p = state.pending.calls[pendKey(call)];
  if (p && p[name] != null) { ctrl.value = p[name]; ctrl.classList.add("dirty"); }
  return ctrl;
}

function countPending() {
  const kill = state.pending.kill;
  const n = Object.values(state.pending.calls).reduce((a, o) => a + Object.keys(o).length, 0) +
            Object.keys(state.pending.sfx).length +
            Object.keys(kill.calls).length + Object.keys(kill.clips).length +
            Object.keys(state.pending.kit || {}).length;
  const btn = el("btn-apply");
  btn.disabled = !n;
  btn.innerHTML = n ? `Apply <span class="cnt">${n}</span>` : "Apply";
  return n;
}

/* --- talking to the game -------------------------------------------------
   The web build injects window.__WEB__, a plain list of motor references (see
   tools/build/build.mjs). Everything below goes through it. */
function web(lang) {
  const f = frames[lang || "en"];
  return f && f.contentWindow && f.contentWindow.__WEB__;
}
function api(mod, lang) {
  const W = web(lang);
  const w = frames[lang || "en"].contentWindow;
  return (W && W[mod]) || (w && w[mod]) || null;
}

/* The language is SET, never asked for by URL: the player's own choice in
   OPTIONS is stored, wins over `?lang=`, and both frames share one origin and
   so one Store. This is what menu.js does on a switch, minus the menu. */
function setLang(W, lang) {
  if (!W || !W.Lang) return;
  const copy = W.CONFIG && W.CONFIG.web && W.CONFIG.web.copy;
  const dict = lang !== "en" && copy && copy[lang] && copy[lang].strings;
  W.Lang.set(lang, dict || null);
}

/* The stage is the game's build with everything but the callout layers taken
   out of the way, injected into each iframe and nowhere near the repo: the
   canvas (Pop.text draws there), the overlay (Pop.show) and the notice layer
   (Notify) stay, on a flat ground; the backdrop, the menu, the village, the
   band and every screen go. */
const BENCH_CSS = `
  html, body, #stage, #frame { background:#262834 !important; }
  #frame::before, #frame::after { display:none !important; }
  #backdrop { display:none !important; }
  #frame > *:not(#game):not(#overlay):not(#nt-layer) { display:none !important; }
  #overlay { z-index:40; }
`;
LANGS.forEach((lang) => frames[lang].addEventListener("load", () => {
  try {
    const f = frames[lang], d = f.contentDocument;
    const style = d.createElement("style");
    style.id = "lab-bench";
    style.textContent = BENCH_CSS;
    d.head.appendChild(style);
    // A click on the game is a click away from anything this page has open.
    d.addEventListener("mousedown", () => closeFileMenu());
    const W = web(lang);
    setLang(W, lang);
    if (lang !== "en" && W) {
      try { W.Sound.setMuted(true); W.Music.setMuted(true); } catch (e) {}
    }
    refreshReads();
  } catch (e) { note("the build did not load"); }
}));

/* Pop has two halves and the second one is drawn on the canvas, by the frame
   pipeline — which does not turn here, because no round is running. So the
   bench drives the three calls the pipeline would (clear, tick, draw) for as
   long as the number lives, and nothing else: no Game.update, no Game.render,
   no world. That is the whole reason `Pop.text` can be previewed on a bench
   showing only a backdrop. */
const juices = {};
function juice(lang, seconds) {
  const j = juices[lang] || (juices[lang] = { until: 0, running: false });
  j.until = Math.max(j.until, performance.now() + seconds * 1000);
  if (j.running) return;
  const W = web(lang);
  if (!W) return;
  j.running = true;
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    W.clearWorld();
    W.Pop.tick(dt);
    W.Pop.canvas();
    if (now < j.until) requestAnimationFrame(step);
    else { W.clearWorld(); j.running = false; }
  };
  requestAnimationFrame(step);
}

/* iOS and every desktop browser want the AudioContext opened inside a gesture.
   The click that fires a row is one, and user activation reaches a same-origin
   iframe, so unlocking the GAME's context from here is enough — and it decodes
   the whole pack, which is what makes the first cue audible. */
function unlock() {
  const S = api("Sound");
  if (S) { try { S.unlock(); } catch (e) {} }
}

/* What a row will actually call: the source's own arguments, with whatever the
   row's inputs now say written over them. One function, so firing a row and
   copying its line can never disagree. */
function argsFor(call, row, W) {
  const args = JSON.parse(JSON.stringify(call.preview.args));
  if (!row) return args;
  const get = (sel) => row.querySelector(sel);
  const text = (field) => textOf(call, row, field, W);
  if (call.name === "Pop.text") {
    const w = text("word");
    if (w !== undefined) args[2] = w;
  } else if (call.kind === "pop") {
    const o = args[1] = Object.assign({}, args[1]);
    args[0] = get("select.style").value;
    const w = text("word"), sub = text("sub");
    if (w) o.word = w; else delete o.word;          // the style's own word
    if (sub) o.sub = sub; else delete o.sub;
    const at = get("select.at").value;
    if (at) o.at = at; else delete o.at;
  } else if (call.kind === "sound") {
    args[1] = num(get("input.vol"), args[1]);
    args[2] = num(get("input.rate"), args[2]);
  } else if (call.kind === "notify") {
    const w = text("word");
    if (w !== undefined) args[0] = w;
    const o = args[1] = Object.assign({}, args[1] || {});
    const sub = text("sub");
    if (sub) o.sub = sub; else delete o.sub;
    // Turned into a callout: what Pop.show would be handed instead.
    const as = asPop(row);
    if (as) {
      const p = {};
      if (args[0]) p.word = args[0];
      if (sub) p.sub = sub;
      const at = get("select.at").value;
      if (at) p.at = at;
      return [as, p];
    }
  }
  return args;
}

/* ── a built word, run in the frame ───────────────────────────────────────
   One field of a callout — its word or its sub — as the frame `W` will be
   handed it. A literal is the row's own field (the motor translates it whole);
   a built word is the game's expression with the row's slots in it, run with
   that frame's Lang, so its Lang.t pieces come out in that frame's language.
   `undefined` is "the source says nothing here": the motor's own default. */
const RUNNERS = {};
function runner(code) {
  const env = (state.data && state.data.textEnv) || { aliases: {}, tables: {} };
  const key = state.slug + "\n" + code;
  if (RUNNERS[key]) return RUNNERS[key];
  let prelude = "";
  for (const k in env.tables) prelude += "var " + k + " = " + JSON.stringify(env.tables[k]) + ";\n";
  for (const k in env.aliases) prelude += "var " + k + " = " + env.aliases[k] + ";\n";
  return (RUNNERS[key] = new Function("$", "Lang", "CONFIG", "upper", prelude + "return (" + code + ");"));
}

function textOf(call, row, field, W) {
  const f = call.texts && call.texts.fields[field];
  if (f && f.code) {
    if (!W) return undefined;
    try {
      const v = runner(f.code)(slotValues(call, row), W.Lang, W.CONFIG, W.upper);
      return v == null ? "" : String(v);
    } catch (e) { return "⚠ " + e.message; }
  }
  const inp = row && row.querySelector(field === "word" ? "input.w" : "input.s");
  if (inp) return inp.value === "" ? undefined : inp.value;
  return f && f.lit != null ? f.lit : undefined;
}

/* The values a row's slots hold now, typed the way the game would hold them:
   a number reads as a number (`lives === 1` must be able to be true), a
   true/false as a boolean, anything else as the string it is. */
function slotValues(call, row) {
  const slots = (call.texts && call.texts.slots) || [];
  return slots.map((s, i) => {
    const c = row && row.querySelector('.slot [data-i="' + i + '"]');
    const raw = c ? c.value : String(s.value);
    if (/^-?\d+(\.\d+)?$/.test(raw.trim())) return Number(raw);
    if (raw === "true" || raw === "false") return raw === "true";
    return raw;
  });
}

/* What a row's slots were last set to, per game, in this browser only: a
   value typed here is the bench's, never the game's. */
function slotStore() {
  try { return JSON.parse(localStorage.getItem("events:slots:" + state.slug) || "{}"); }
  catch (e) { return {}; }
}
function slotSave(key, value) {
  const all = slotStore();
  if (value == null) delete all[key]; else all[key] = value;
  try { localStorage.setItem("events:slots:" + state.slug, JSON.stringify(all)); } catch (e) {}
}

function slotsHtml(call) {
  const slots = (call.texts && call.texts.slots) || [];
  if (!slots.length) return "";
  const saved = slotStore();
  const id = "dl-" + call.line + "-" + call.method;
  return `<div class="slots"><span class="lbl" title="the round's own values — the bench cannot read them, so it offers one. Never written back.">values</span>` +
    slots.map((s, i) => {
      const k = call.line + "|" + call.name + "|" + s.text;
      const v = saved[k] != null ? saved[k] : String(s.value);
      const head = `<label class="slot" title="${esc(s.text)}"><span>${esc(s.text.length > 22 ? s.text.slice(0, 21) + "…" : s.text)}</span>`;
      if (s.kind === "pick" || s.kind === "bool") {
        const opts = s.kind === "bool" ? ["true", "false"] : s.choices.map(String);
        return head + `<select data-i="${i}" data-k="${esc(k)}">` +
          opts.map((o) => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("") + `</select></label>`;
      }
      const list = s.choices && s.choices.length
        ? `<datalist id="${id}-${i}">${s.choices.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>` : "";
      return head + `<input type="text" data-i="${i}" data-k="${esc(k)}" class="${s.kind}" value="${esc(v)}"` +
        (list ? ` list="${id}-${i}"` : "") + `>${list}</label>`;
    }).join("") + `</div>`;
}

/* What each frame was handed, read back under the row: the word and the sub
   as Lang.t leaves them (the screen shouts them on top of that). A French
   identical to the English is marked — a word with no entry in
   web.copy.fr.strings, or a piece the game forgot to wrap in Lang.t. */
function readHtml(call, row) {
  if (!call.texts) return "";
  const style = row.querySelector("select.style");
  const out = LANGS.map((lang) => {
    const W = web(lang);
    if (!W) return null;
    setLang(W, lang);
    const parts = ["word", "sub"].map((field) => {
      let v = textOf(call, row, field, W);
      if (v === undefined && field === "word" && style && W.Pop.styles && W.Pop.styles[style.value]) v = W.Pop.styles[style.value].word;
      return v == null || v === "" ? "" : String(W.Lang.t(v));
    });
    return { lang, word: parts[0], sub: parts[1] };
  }).filter(Boolean);
  if (!out.length) return "";
  const en = out.find((o) => o.lang === "en");
  return out.map((o) => {
    const txt = o.word + (o.sub ? " · " + o.sub : "");
    const same = o.lang !== "en" && en && txt === en.word + (en.sub ? " · " + en.sub : "") && /[A-Za-z]{2}/.test(txt);
    const err = /⚠/.test(txt);
    return `<span class="ln2"><span class="lg">${o.lang.toUpperCase()}</span>` +
      `<b${err ? ' class="err"' : ""}>${esc(o.word)}</b>${o.sub ? ` <i>${esc(o.sub)}</i>` : ""}` +
      (same ? ` <span class="same" title="the French reads exactly like the English — no entry in web.copy.fr.strings, or a piece not wrapped in Lang.t">= en</span>` : "") +
      `</span>`;
  }).join("");
}

function refreshReads() {
  document.querySelectorAll(".call").forEach((row) => { if (row._read) row._read(); });
}
function num(input, fallback) {
  if (!input) return fallback;
  const v = parseFloat(input.value);
  return isNaN(v) ? fallback : v;
}

// The Pop style a notice row has been turned into, or "" when it is a notice.
function asPop(row) {
  const as = row && row.querySelector("select.as");
  return as ? as.value : "";
}

function fire(call, row) {
  /* A clip picked but not applied is not in the build yet, so the motor cannot
     play it: the page plays the file itself, whole and untrimmed, which is the
     honest preview of what the cut will be taken from. */
  /* A clip picked but not applied is not in the build yet, so the motor cannot
     play it: the page plays the file itself, cut to the length the card asks
     for, which is the honest preview of what apply would embed. */
  if (call.kind === "sound" && row && row.dataset.key) {
    const p = state.pending.sfx[row.dataset.key];
    if (p) {
      sfxPlay(p.file, p.len);
      note(p.file + " — " + p.len + "s of it, which is what apply would cut");
      return;
    }
  }
  unlock();
  const [mod, meth] = (asPop(row) ? "Pop.show" : call.preview.fn).split(".");
  // A sound is heard once, from the English frame; a word is read in both.
  const langs = call.kind === "sound" ? ["en"] : LANGS;
  for (const lang of langs) {
    const W = web(lang);
    const target = api(mod, lang);
    if (!target || typeof target[meth] !== "function") { note(call.name + " is not reachable in this build"); return; }
    setLang(W, lang);
    const args = argsFor(call, row, W);
    try { target[meth].apply(target, args); }
    catch (e) { note(call.name + " threw: " + e.message); return; }
    // The canvas half only exists while something draws it.
    if (call.name === "Pop.text") juice(lang, ((args[3] && args[3].life) || 0.9) + 0.4);
  }
}

function note(msg) { el("hint").textContent = msg || ""; }
function copy(text) {
  navigator.clipboard.writeText(text).then(() => note(text + "   copied"), () => note(text));
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function add(cls, text) {
  const n = document.createElement("div");
  n.className = cls;
  n.textContent = text;
  el("list").appendChild(n);
  return n;
}

/* --- swapping the FILE a clip is cut from --------------------------------
   `Sound.clip("orb")` names a KEY, and the key names a cut of one file of
   assets/audio/sfx/ — the only record of which is the provenance comment.
   Changing the file is therefore a change to the PACK, not to the call: it
   reaches every beat that plays that key, which is why the swap is shown on
   every row holding it and not only on the one that made it.               */
/* ── the file picker ──────────────────────────────────────────────────────
   One panel for the whole page, moved to whichever button opened it. A native
   <select> could not do this: its popup is drawn by the operating system and
   fires nothing over its rows, so every clip would have to be COMMITTED to be
   heard — 127 files, one click each. Here the pointer is the audition and the
   click is the decision, which is the order a clip is actually picked in.

   Nothing is written until that click: leaving by escape or by clicking away
   puts the button back where it was.                                        */
const fileMenu = { btn: null, key: null, rows: [], hover: null, idx: -1 };

function closeFileMenu() {
  const box = el("filemenu");
  box.hidden = true;
  clearTimeout(fileMenu.hover);
  if (fileMenu.btn) fileMenu.btn.classList.remove("open");
  fileMenu.btn = null; fileMenu.key = null; fileMenu.rows = []; fileMenu.idx = -1;
}

function openFileMenu(btn, key) {
  const box = el("filemenu");
  if (fileMenu.btn === btn && !box.hidden) { closeFileMenu(); return; }
  closeFileMenu();
  fileMenu.btn = btn; fileMenu.key = key;
  btn.classList.add("open");

  // Which files this game already embeds, and under which key — the same mark
  // the library grid used to carry, now where the choice is made.
  const used = {};
  (state.data ? state.data.sounds : []).forEach((x) => { if (x.file) used[x.file] = x.key; });

  const list = box.querySelector(".fm-list");
  list.innerHTML = "";
  // Grouped by the category a file's name starts with — the folder is sorted
  // by name, so the groups fall out of the order it comes in.
  fileMenu.rows = [];
  const cats = [];
  let lastCat = null;
  (state.sfx || []).forEach((f) => {
    const cat = f.category || "other";
    if (cat !== lastCat) {
      const h = document.createElement("div");
      h.className = "fm-cat"; h.textContent = cat; h.dataset.cat = cat;
      list.appendChild(h); cats.push(h); lastCat = cat;
    }
    const row = document.createElement("button");
    row.className = "fm-row" + (used[f.file] ? " used" : "") + (f.file === btn.value ? " cur" : "");
    row.innerHTML = `${esc(f.label)}<br><span class="sz">` +
      (f.seconds != null ? f.seconds.toFixed(2) + " s · " : "") + `${Math.round(f.size / 1024)} KB` +
      (f.pack ? " · " + esc(f.pack) : "") + (used[f.file] ? " · " + esc(used[f.file]) : "") + `</span>`;
    // A short intent delay, so sweeping the list does not fire every file it
    // crosses on the way to the one being aimed at.
    row.onmouseenter = () => {
      clearTimeout(fileMenu.hover);
      fileMenu.hover = setTimeout(() => sfxPlay(f.file, cutLen(key)), 110);
    };
    row.onmouseleave = () => clearTimeout(fileMenu.hover);
    row.onclick = () => { pickFile(btn, key, f.file); closeFileMenu(); };
    list.appendChild(row);
    fileMenu.rows.push({ node: row, file: f.file, cat, hay: (f.file + " " + f.label + " " + cat + " " + (f.pack || "")).toLowerCase() });
  });
  const none = document.createElement("div");
  none.className = "fm-none";
  none.textContent = "nothing matches";
  none.hidden = true;
  list.appendChild(none);

  // Every space-separated term has to be in the name — "wooden error" is an AND.
  const filter = box.querySelector("input.fm-filter");
  filter.value = "";
  filter.oninput = () => {
    const terms = filter.value.toLowerCase().split(/\s+/).filter(Boolean);
    let n = 0;
    fileMenu.rows.forEach((r) => {
      const hit = terms.every((t) => r.hay.indexOf(t) >= 0);
      r.node.hidden = !hit;
      if (hit) n++;
    });
    cats.forEach((h) => { h.hidden = !fileMenu.rows.some((r) => r.cat === h.dataset.cat && !r.node.hidden); });
    none.hidden = !!n;
    fileMenu.idx = -1;
  };

  // Anchored to the button, flipped up when the bottom of the window is close.
  const r = btn.getBoundingClientRect();
  box.hidden = false;
  const h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - box.offsetWidth - 8)) + "px";
  box.style.top = (r.bottom + h + 8 < window.innerHeight ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + "px";

  const cur = fileMenu.rows.find((x) => x.file === btn.value);
  if (cur) cur.node.scrollIntoView({ block: "center" });
  filter.focus();
}

// Keeping one: the button takes the value, the pending re-cut follows.
function pickFile(btn, key, file) {
  btn.value = file;
  btn.textContent = sfxLabelOf(file);
  btn.title = file;
  syncPending(key, btn.closest(".call"));
}

function sfxLabelOf(file) {
  const f = (state.sfx || []).find((x) => x.file === file);
  return f ? f.label : (file || "— no provenance comment —");
}

/* The arrows walk the list and play as they go — the same audition as the
   pointer, for a hand already on the keyboard. */
function fileMenuKey(e) {
  const box = el("filemenu");
  if (box.hidden) return;
  const live = fileMenu.rows.filter((r) => !r.node.hidden);
  if (e.key === "Escape") { closeFileMenu(); fileMenu.btn && fileMenu.btn.focus(); e.preventDefault(); return; }
  if (e.key === "Enter") {
    const r = live[fileMenu.idx];
    if (r) { pickFile(fileMenu.btn, fileMenu.key, r.file); closeFileMenu(); }
    e.preventDefault();
    return;
  }
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  if (!live.length) return;
  fileMenu.idx = Math.max(0, Math.min(live.length - 1, fileMenu.idx + (e.key === "ArrowDown" ? 1 : -1)));
  live.forEach((r) => r.node.classList.remove("on"));
  const r = live[fileMenu.idx];
  r.node.classList.add("on");
  r.node.scrollIntoView({ block: "nearest" });
  sfxPlay(r.file, cutLen(fileMenu.key));
}

function awayFromMenu(e) {
  if (el("filemenu").hidden) return;
  if (e && (el("filemenu").contains(e.target) || e.target === fileMenu.btn)) return;
  closeFileMenu();
}

document.addEventListener("keydown", fileMenuKey);
document.addEventListener("mousedown", awayFromMenu);
/* The stage is an IFRAME, and a click inside one never reaches this document —
   so a menu left open over the game stayed open however hard the picture was
   clicked. The frame is same-origin, so it gets the same handler on every load
   (see the load listener that dresses it), and losing the window entirely
   closes the menu too. */
window.addEventListener("blur", () => closeFileMenu());
window.addEventListener("resize", () => closeFileMenu());
el("list").addEventListener("scroll", () => closeFileMenu());

// What the embedded clip measures, which is the length a re-cut starts from.
function clipSeconds(snd) {
  return snd && snd.bytes ? Math.max(0.05, Math.round(snd.bytes / 8000 * 20) / 20) : 0.6;
}
function cutLen(key) {
  const p = state.pending.sfx[key];
  if (p && p.len) return p.len;
  const snd = (state.data.sounds || []).find((s) => s.key === key);
  return clipSeconds(snd);
}

/* ── the pending re-cut of one key ────────────────────────────────────────
   Two controls describe it — the FILE the clip is cut from and how long the
   cut is — and either one off the source is a re-cut. They are read together,
   from the row that was just touched, so moving one never drops the other:
   picking a file back to its original with a shorter `cut` still standing is a
   re-cut of the same file, not a cancellation.

   `row` is the one the hand is in. A key is played by several beats and each
   of them carries the pair; refreshFiles() puts the others back in step.     */
function syncPending(key, row) {
  if (!key) return;
  row = row || document.querySelector('.bhead[data-key="' + key + '"]');
  const sel = row && row.querySelector(".filebtn");
  const len = row && row.querySelector("input.len");
  const snd = (state.data.sounds || []).find((x) => x.key === key);
  const wasFile = (snd && snd.file) || "";
  const file = sel ? sel.value : wasFile;
  const v = len ? parseFloat(len.value) : NaN;
  const nowLen = isNaN(v) ? cutLen(key) : v;
  const moved = (!!file && file !== wasFile) || (len && String(nowLen) !== len.dataset.was);
  if (!moved || !file) delete state.pending.sfx[key];
  else state.pending.sfx[key] = { file: file, len: nowLen };
  refreshFiles();
  countPending();
}

/* One file select, wherever it is shown. `key` is read off the row so a swap
   made on one beat shows on every other beat that plays the same clip. */
function wireFile(sel, keyOf) {
  const sync = () => {
    const key = keyOf();
    const snd = (state.data.sounds || []).find((s) => s.key === key);
    const was = (snd && snd.file) || "";
    sel.dataset.was = was;
    const p = state.pending.sfx[key];
    const now = p ? p.file : was;
    if (sel.value !== now) sel.value = now;
    sel.textContent = sfxLabelOf(now);
    sel.title = now || "this clip has no provenance comment — nothing says which file it was cut from";
    sel.classList.toggle("swap", !!p);
    sel.classList.toggle("dirty", !!p);
  };
  sel.onclick = () => openFileMenu(sel, keyOf());
  sel.onkeydown = (e) => {
    if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openFileMenu(sel, keyOf());
    }
  };
  sel._sync = sync;
  sync();
  return sel;
}

/* The cut length, per KEY and shown on every beat that plays it. A length on
   its own is a re-cut too: the same file, a shorter clip. */
function wireLen(len, key) {
  if (!len) return;
  len.dataset.was = String(cutLen(key));
  len.onchange = len.oninput = () => {
    const v = parseFloat(len.value);
    if (isNaN(v)) return;
    const row = len.closest(".bhead");
    const sel = row && row.querySelector(".filebtn");
    /* A cut needs something to cut FROM, and a clip whose game never wrote a
       provenance comment names no file. Pick one first; a length alone would
       come back refused. */
    if (!(sel && sel.value)) {
      note(key + " has no provenance comment — pick the file it comes from first");
      return;
    }
    syncPending(key, row);
  };
}

// Every file select on the page agrees about every key, always.
function refreshFiles() {
  document.querySelectorAll(".filebtn").forEach((sel) => { if (sel._sync) sel._sync(); });
  // One card per clip, so one pair of controls to put back in step.
  document.querySelectorAll(".bhead[data-key]").forEach((row) => {
    const p = state.pending.sfx[row.dataset.key];
    const len = row.querySelector("input.len");
    if (!len) return;
    if (p && String(p.len) !== len.value) len.value = p.len;
    len.classList.toggle("dirty", !!p && String(p.len) !== len.dataset.was);
    if (len._show) len._show();
  });
}

/* One number as a slider cut into magnetic segments, with the value printed
   beside it. Two grids, and the difference between them is the whole trick:

     `grid`   what the HAND lands on. Dragging snaps to it, so the round values
              are the easy ones to hit — 0.05, 0.10, 0.15…
     `tick`   what the EYE reads, drawn on the track. Coarser where a step-sized
              graduation would be a grey smear (a 0.05 cut over three seconds is
              59 segments).

   The snap is applied on the MOVE, never on the draw: 43 of the 340 volumes
   and pitches in the thirteen games sit off a 0.05 grid (0.32, 1.45, 0.62…),
   and a slider whose `step` was 0.05 would rewrite them the moment the row was
   drawn — a change nobody asked for, in a tool whose whole job is to write
   changes back. So the input is free (`step` 0.01, which every source value is
   already on) and the handler rounds what the hand moves. The first drag of
   0.32 lands on 0.30, which the hand did ask for.                            */
function slider(cls, value, min, max, grid, tickEvery, label, title) {
  const v = Math.min(max, Math.max(min, Number(value) || 0));
  const tick = 78 / ((max - min) / tickEvery);
  /* The groove is a NODE of ours, not `::-webkit-slider-runnable-track`. The
     pseudo-element is the usual way and it is the wrong one here: whether it
     styles at all depends on the engine, and where it does not the slider comes
     out as a bare thumb floating on nothing — which is exactly what it did.
     A span we draw ourselves renders the same everywhere; the input lies over
     it, transparent, and only its THUMB is styled, in every vendor spelling. */
  return `<span class="rng" title="${esc(title || "")}"><span class="lbl">${label}</span>` +
    `<span class="track" style="--tick:${tick.toFixed(2)}px">` +
    `<input class="n ${cls}" type="range" min="${min}" max="${max}" step="0.01" value="${v}" data-grid="${grid}">` +
    `</span><b>${v}</b></span>`;
}

// The snap itself. Rounded to the hundredth too, or 0.1 * 3 prints 0.30000000000000004.
function snapTo(v, grid) {
  return Math.round(Math.round(v / grid) * grid * 100) / 100;
}

/* The readout follows the thumb. Kept out of `watch` on purpose: the dirty
   marking is about the pending change, this is about reading the value. */
function wireSliders(row) {
  row.querySelectorAll(".rng").forEach((box) => {
    const input = box.querySelector("input[type=range]");
    const out = box.querySelector("b");
    const grid = Number(input.dataset.grid) || 0.05;
    const show = () => {
      out.textContent = input.value;
      // How much of the track is behind the thumb, for the fill (see the CSS).
      const lo = Number(input.min), hi = Number(input.max);
      const track = input.parentNode;
      track.style.setProperty("--fill", ((Number(input.value) - lo) / (hi - lo) * 100).toFixed(1) + "%");
      box.classList.toggle("dirty", input.classList.contains("dirty"));
      box.classList.toggle("expr", input.classList.contains("expr"));
    };
    /* The snap runs BEFORE the listeners that read the value — `watch` and
       `wireLen` are bound after this one, so they see the rounded number and
       never a 0.37 the hand did not choose. */
    input.addEventListener("input", () => {
      const v = snapTo(parseFloat(input.value), grid);
      if (String(v) !== input.value) input.value = v;
    });
    input.addEventListener("input", show);
    input.addEventListener("change", show);
    input._show = show;             // refreshFiles() moves one from elsewhere
    show();
  });
}

/* ── undo, and remove ─────────────────────────────────────────────────────
   Two icons on everything the bench can change. REVERT puts the element back
   where the source has it — every control to the value the row was built with,
   and the pending entry gone. TRASH does not delete anything on its own: it
   MARKS, the way every other change here is marked, and apply is what carries
   it out. So a removal is reviewed next to the rest of the plan, counted in
   the Apply badge, and taken back with the same revert as a typo.            */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  revert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12a5 5 0 0 1 0 10h-5"/><path d="M7 5 3 9l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>'
};
function iconBtn(cls, name, title) {
  return `<button class="iconbtn ${cls}" title="${esc(title)}">${ICON[name]}</button>`;
}

// Every control of one element, back to what the row was built with.
function resetControls(node) {
  node.querySelectorAll("input, select, .filebtn").forEach((c) => {
    if (c.dataset.was === undefined) return;
    c.value = c.dataset.was;
    c.classList.remove("dirty", "swap");
    if (c._show) c._show();
    if (c._sync) c._sync();
  });
}

function revertCall(call, row) {
  delete state.pending.calls[pendKey(call)];
  delete state.pending.kill.calls[pendKey(call)];
  resetControls(row);
  row.classList.remove("killed");
  countPending();
  note("");
}

function revertClip(key, card) {
  delete state.pending.sfx[key];
  delete state.pending.kill.clips[key];
  if (state.pending.kit) delete state.pending.kit[key];
  const ks = card.querySelector(".kitsel");
  if (ks) { ks.value = ks.querySelector("option[selected]") ? ks.querySelector("option[selected]").value : ""; ks.classList.remove("dirty"); }
  // The controls first: with the pending entry gone, refreshFiles() has
  // nothing left to put them back from.
  resetControls(card.querySelector(".bhead"));
  card.querySelectorAll(".call").forEach((r) => r.classList.remove("killed"));
  card.classList.remove("killed");
  refreshFiles();
  countPending();
  note("");
}

function killCall(call, row) {
  const k = pendKey(call);
  if (state.pending.kill.calls[k]) delete state.pending.kill.calls[k];
  else state.pending.kill.calls[k] = { line: call.line, name: call.name };
  row.classList.toggle("killed", !!state.pending.kill.calls[k]);
  countPending();
  note(state.pending.kill.calls[k]
    ? `${call.name} line ${call.line} will be removed from the source on apply`
    : "");
}

function killClip(key, card) {
  const kill = state.pending.kill.clips;
  if (kill[key]) delete kill[key];
  else kill[key] = 1;
  const on = !!kill[key];
  card.classList.toggle("killed", on);
  card.querySelectorAll(".call").forEach((r) => r.classList.toggle("killed", on));
  countPending();
  const n = card.querySelectorAll(".call").length;
  note(on
    ? `${key} will be removed from ${card.querySelector(".kitbtn") ? "the kit mapping (sfx)" : "ASSETS.sounds"} on apply, and so will the ${n} line${n > 1 ? "s" : ""} that play it`
    : "");
}

/* --- the rows ------------------------------------------------------------ */
function callRow(call) {
  const row = document.createElement("div");
  row.className = "call k-" + call.kind;
  const bits = [`<button class="act sm play" title="fire it in the game">▶</button>`,
                `<span class="tag">${call.name}</span>`];

  /* A field is an input when the source writes it as a literal (or not at
     all), and the game's expression when the game builds it — its values are
     the slots under the row, never the field itself. */
  const fields = (call.texts && call.texts.fields) || {};
  const field = (name, cls, value, ph) => fields[name] && fields[name].code
    ? `<code class="xw" title="${esc(name + " = " + fields[name].expr)} — built by the game, run here with the values below">${esc(fields[name].expr)}</code>`
    : `<input type="text" class="${cls}"${ph ? ` placeholder="${ph}"` : ""} value="${esc(value == null ? "" : value)}">`;

  if (call.name === "Pop.text") {
    // The canvas half: a word at a point in the world, no style and no anchor.
    const o = call.preview.args[3] || {};
    bits.push(`<span class="style">text</span>`);
    bits.push(field("word", "w", String(call.preview.args[2])));
    bits.push(`<span class="meta">${esc(Object.keys(o).map((k) => k + " " + o[k]).join(" · "))}</span>`);
  } else if (call.kind === "pop") {
    const o = call.preview.args[1] || {};
    const style = call.preview.args[0];
    bits.push(`<select class="style">${STYLES.map((s) =>
      `<option${style === s ? " selected" : ""}>${s}</option>`).join("")}</select>`);
    bits.push(field("word", "w", o.word, "style word"));
    bits.push(field("sub", "s", o.sub, "sub"));
    // The empty option is "whatever the style says" — a call that names no
    // anchor must not be previewed at some arbitrary corner of the frame.
    const at = o.at || "";
    bits.push(`<select class="at"><option value=""${at ? "" : " selected"}>style spot</option>${ANCHORS.map((a) =>
      `<option${at === a ? " selected" : ""}>${a}</option>`).join("")}</select>`);
    if (call.cls) bits.push(`<span class="meta">.${esc(call.cls)}</span>`);
    if (call.style !== style) bits.push(`<span class="meta">src: ${esc(call.style)}</span>`);
  } else if (call.kind === "sound") {
    /* The clip itself — which file it is cut from, and how long the cut is —
       belongs to the KEY, and it is written once on the card's header. What a
       line owns is how loud and how high IT plays it: one sample covers a whole
       family of events through `rate`, which is the point of the pack.
       A line of the MOTOR (the template's end-screen cues) is named by its
       file, since it is not in the unit's own source. */
    bits.push(call.inherited
      ? `<span class="ln motor" title="${esc(call.source)} — a motor line: auditioned here, changed in the source">${esc(call.where.split("/").pop())}:${call.line}</span>`
      : `<span class="ln" title="${esc(call.source)}">L${call.line}</span>`);
    bits.push(`<span class="fn">${call.fn ? esc(call.fn) + "<i>()</i>" : "<i>top level</i>"}</span>`);
    bits.push(slider("vol", call.preview.args[1], 0, 1, 0.05, 0.1, "vol", "how loud this line plays it"));
    bits.push(slider("rate", call.preview.args[2], 0.5, 2, 0.05, 0.25, "rate",
      "the pitch — one sample covers a whole family of events through this, instead of a clip each"));
  } else if (call.kind === "notify") {
    // Notify.say — one look, so a word and a sub and no style. The vignette is
    // scanned as juice (scan-events.mjs) and never reaches this list. The
    // dropdown is what it is SAID as: `notify`, or a Pop style it is turned
    // into — then it takes an anchor like any callout.
    const o = call.preview.args[1] || {};
    bits.push(`<select class="as" title="notify, or a Pop style to turn this notice into a callout — apply rewrites it as Pop.show">` +
      `<option value="">notify</option>${STYLES.map((s) => `<option>${s}</option>`).join("")}</select>`);
    bits.push(field("word", "w", String(call.preview.args[0])));
    bits.push(field("sub", "s", o.sub, "sub"));
    bits.push(`<select class="at" hidden><option value="">style spot</option>${ANCHORS.map((a) =>
      `<option>${a}</option>`).join("")}</select>`);
  }

  /* The marker holds its cell whether or not it has anything to say: a cue row
     is a GRID, and a column that appears on some lines and not on others is a
     column that never lines up. */
  bits.push(call.preview.exact
    ? `<span class="approx"></span>`
    : `<span class="approx" title="an argument is built from the round's own state — the motor's default is shown instead. Type over it.">≈</span>`);
  /* A cue line carries its own three, in the last columns of its grid: one
     clip is played by several lines and each is its own decision. A callout's
     are its card's (beatCard), in the header's corner. */
  if (call.kind === "sound") {
    bits.push(iconBtn("check", "check", "mark as checked — seen and heard, signed off"));
    bits.push(iconBtn("revert", "revert", "put this line back where the source has it"));
    bits.push(call.inherited
      ? `<span class="iconbtn" title="a motor line — apply writes the clip, not this line"></span>`
      : iconBtn("trash", "trash", "remove this line from the game — the clip stays, the other lines that play it stay"));
  }

  if (call.texts) {
    bits.push(slotsHtml(call));
    bits.push(`<div class="read"></div>`);
  }

  row.innerHTML = bits.join("");
  // Before the bindings below: the snap has to run first, so everything that
  // reads the value reads the one the grid gave it.
  wireSliders(row);
  if (call.texts) {
    const read = row.querySelector(".read");
    row._read = () => { read.innerHTML = readHtml(call, row); };
    row.querySelectorAll(".slot [data-i]").forEach((c) => {
      const keep = () => {
        const s = call.texts.slots[Number(c.dataset.i)];
        slotSave(c.dataset.k, c.value === String(s.value) ? null : c.value);
        row._read();
      };
      c.addEventListener("input", keep);
      c.addEventListener("change", keep);
    });
    row.querySelectorAll("input.w, input.s, select.style").forEach((c) => c.addEventListener("input", row._read));
    row._read();
  }
  row.querySelector(".play").onclick = () => fire(call, row);
  row.dataset.check = call.checkId || "";
  if (row.querySelector(".check")) row.querySelector(".check").onclick = () => toggleCheck([call.checkId], !isChecked(call.checkId));
  if (row.querySelector(".revert")) row.querySelector(".revert").onclick = () => revertCall(call, row);
  if (row.querySelector(".trash")) row.querySelector(".trash").onclick = () => killCall(call, row);

  /* A motor line's volume and pitch move for the ear only: nothing pends, and
     revert puts them back where the motor has them. */
  if (call.inherited) {
    row.classList.add("inherited");
    row.dataset.key = String(call.preview.args[0]);
    row.querySelectorAll("input[type=range]").forEach((c) => { c.dataset.was = c.value; });
    row.querySelector(".ln").onclick = () => copy(call.where + ":" + call.line);
    return row;
  }

  /* Which control writes which argument back. `expr` is the source as the game
     wrote it, and it is what tells an editable value from one apply has to
     refuse — the row shows both the same way, so nothing is a surprise. */
  const opts = call.opts || {};
  const bind = (sel, name, expr) => {
    const ctrl = row.querySelector(sel);
    if (!ctrl) return;
    // A call apply cannot write back (Sound.beep, Sound.arp) is still played
    // from here — it is read-only, not hidden.
    if (!name) { ctrl.disabled = true; ctrl.title = "apply does not write this call — change it in the source"; return; }
    watch(ctrl, call, name, expr);
  };
  if (call.name === "Pop.text") bind("input.w", "word", call.args[2]);
  else if (call.kind === "pop") {
    bind("select.style", "style", call.args[0]);
    bind("input.w", "word", opts.word);
    bind("input.s", "sub", opts.sub);
    bind("select.at", "at", opts.at);
  } else if (call.kind === "sound") {
    const editable = call.name === "Sound.clip" || call.name === "Sound.cue";
    bind("input.vol", editable ? "vol" : null, call.args[1]);
    bind("input.rate", editable ? "rate" : null, call.args[2]);
    row.dataset.key = String(call.preview.args[0]);
    row.querySelector(".ln").onclick = () => copy(state.data.where + ":" + call.line);
  } else if (call.kind === "notify") {
    bind("input.w", "word", call.args[0]);
    bind("input.s", "sub", opts.sub);
    bind("select.as", "as", null);
    bind("select.at", "at", null);
    const as = row.querySelector("select.as"), at = row.querySelector("select.at");
    /* Back to `notify`, the anchor goes with it: a notice has no spot, and an
       anchor left pending would be refused by apply as a field it lacks. */
    as._sync = () => {
      const on = !!as.value;
      row.classList.toggle("as-pop", on);
      row.querySelector(".tag").textContent = on ? "Notify.say → Pop.show" : call.name;
      at.hidden = !on;
      if (!on && at.value) { at.value = ""; at.dispatchEvent(new Event("change")); }
    };
    as.addEventListener("change", as._sync);
    as._sync();
  }
  return row;
}

/* ── one card per CLIP ────────────────────────────────────────────────────
   A pack of eight clips is played by eighteen lines, and listing the clip once
   per line said the same thing eighteen times — worse, it offered the same
   file dropdown eighteen times for one decision. The clip is the card: the
   file it is cut from and the length of the cut are written once, at the top,
   and the lines that play it are underneath with the only things that are
   theirs — how loud, and how high.                                          */
/* The kit selector of a clip card: hand this key to one VARIANT of the house
   kit's gameplay roles (a crash in one game is not a crash in another). On
   Apply the manifest maps it (`sfx`) and its clip leaves game.js
   (tools/lab/cut-kit.mjs, mapKeys); the lines that play it do not change. A
   key already in the kit can move to another variant, not back to a clip. */
function kitSelect(key, current) {
  if (state.slug === "template" || !(state.kitIds || []).length) return "";
  const groups = {};
  state.kitIds.forEach((id) => { const r = id.split("/")[0]; (groups[r] = groups[r] || []).push(id); });
  return `<select class="kitsel" title="play the house kit's variant instead of this clip — chosen and tuned at /kit">` +
    (current ? "" : `<option value="">clip</option>`) +
    Object.entries(groups).map(([r, list]) => `<optgroup label="${esc(r)}">` +
      list.map((id) => `<option value="${esc(id)}"${id === current ? " selected" : ""}>kit: ${esc(id)}</option>`).join("") +
      `</optgroup>`).join("") +
    `</select>`;
}
function wireKitSelect(sel, key, current) {
  if (!sel) return;
  const p = state.pending.kit[key];
  if (p) sel.value = p;
  sel.classList.toggle("dirty", !!p);
  sel.onchange = () => {
    const v = sel.value;
    if (!v || v === current) delete state.pending.kit[key];
    else { state.pending.kit[key] = v; delete state.pending.sfx[key]; delete state.pending.kill.clips[key]; }
    sel.classList.toggle("dirty", !!state.pending.kit[key]);
    countPending();
    note(state.pending.kit[key]
      ? `${key} will play the kit's ${v} on apply` + (current ? "" : " — its clip leaves game.js, the lines that play it stay")
      : "");
  };
}

function clipCard(key, calls) {
  const card = document.createElement("div");
  card.className = "beat clip";
  card.dataset.key = key;
  const snd = (state.data.sounds || []).find((x) => x.key === key);
  if (snd && snd.kit) return kitCard(key, snd, calls, card);

  const head = document.createElement("div");
  head.className = "bhead";
  head.dataset.key = key;
  head.innerHTML =
    `<span class="key" title="ASSETS.sounds.${esc(key)}">${esc(key)}</span>` +
    `<button class="filebtn" title="the file in assets/audio/sfx/ this clip is cut from — open it, hover to hear, click to keep. Apply re-cuts the clip, for every line below."></button>` +
    kitSelect(key, null) +
    slider("len", cutLen(key), 0.05, 3, 0.05, 0.5, "cut",
      "how much of the file the clip keeps — mono 32 kHz / 64 kbps with a 70 ms fade. It starts at what the embedded clip measures.") +
    `<span class="sp"></span>` +
    (snd ? `<span class="plays">${calls.length}×</span>`
         : `<span class="approx" title="this game embeds no clip under that name — every line below plays nothing">no clip</span>`) +
    `<span class="acts">` +
    iconBtn("check", "check", "check every line of this clip at once") +
    iconBtn("revert", "revert", "put this clip back where the source has it") +
    iconBtn("trash", "trash", "remove this clip from ASSETS.sounds, and every line of the game that plays it") +
    `</span>`;
  head.classList.add("has-acts");
  head.querySelector(".key").onclick = () => copy(key);
  head.querySelector(".revert").onclick = () => revertClip(key, card);
  head.querySelector(".trash").onclick = () => killClip(key, card);
  // Every line on (or every line off when they all are): one decision, one clip.
  head.querySelector(".check").onclick = () => {
    const ids = calls.map((c) => c.checkId).filter(Boolean);
    toggleCheck(ids, !ids.every(isChecked));
  };
  card.appendChild(head);

  calls.forEach((c) => card.appendChild(callRow(c)));

  wireSliders(head);                       // the snap, before what reads it
  wireFile(head.querySelector(".filebtn"), () => key);
  wireLen(head.querySelector("input.len"), key);
  wireKitSelect(head.querySelector(".kitsel"), key, null);
  return card;
}

/* A key the manifest maps to a role of the house kit (`sfx` in manifest.json):
   the game embeds no clip for it, and what it sounds like is chosen on the
   kit page, for every game that maps a key to that role. So the card names
   the role and opens the kit instead of offering a file — the lines under it
   keep their own volume and pitch, which are the game's. */
function kitCard(key, snd, calls, card) {
  const head = document.createElement("div");
  head.className = "bhead has-acts";
  head.dataset.key = key;
  head.innerHTML =
    `<span class="key" title="manifest.json sfx.${esc(key)}">${esc(key)}</span>` +
