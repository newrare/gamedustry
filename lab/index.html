<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — back office</title>
<link rel="icon" href="data:,">
<style>
/* ===========================================================================
   BACK OFFICE — every lab page in one list, and the one it opens beside it.

   Served by `make lab` (tools/lab/serve-lab.mjs) at http://localhost:8095/,
   and only there: the list is read off lab/*.html by the server, so over
   file:// the page says so and stops. Nothing here is a lab of its own — it is
   the door to all of them.

   The pages are OPENED IN A FRAME rather than navigated to, so the list stays
   on screen and the next page is one click away. Each one is still the page it
   always was, on the same origin: the four that need a server are mounted
   under their prefix (/events/, /text/, /store/, /village/), the others are
   served as files under /lab/. `↗` opens the current one in a tab of its own,
   which is what a page wanting the whole window (or a platform EyeDropper
   that refuses a frame) asks for.

   The list is filed in three groups the pages declare themselves, with
   `<meta name="lab-group">`: BACKOFFICE (what a game is built and checked with),
   FRONT (a look being tried before it moves into the motor or a SKIN) and
   TESTS (a mechanic tried outside the motor), then PROTOTYPE, every page of
   prototype/, which is filed by its folder unless it declares a group.
   `<meta name="lab-game">` tags a page with the one game it is about, and a
   page with none is tagged "all" — "none" for a prototype. Inside a group
   the pages are sorted by tag — "all" first, then the games alphabetically,
   "none" last — and by name; each group folds on its heading.

   The ⋮ at the end of an entry edits those declarations without opening the
   file: its name, its section and its tag, written back into the page by
   the server (`/api/labs/edit`) — a lab page's name is the end of its
   <title>, a prototype's its `<meta name="lab-name">`. The list is still
   read off the pages: nothing is kept here.

   The location is the hash — `#/events/`, `#/lab/button.html` — so a reload
   comes back to the same page, and a page that navigates inside the frame
   moves the hash with it.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg:#0b0b12; --panel:#12121c; --line:#23233a; --field:#2c2c47;
  --ink:#e8e6f5; --dim:#8b8ba7; --soft:#9c9cba; --accent:#7ea6ff; --warn:#ffb86b; --ok:#4dd68c;
}

html, body { height:100%; }
body {
  display:flex;
  background:var(--bg);
  color:var(--ink);
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;
}

/* ---------------------------------------------------------------------------
   PANEL — the list.
   --------------------------------------------------------------------------- */
#panel {
  flex:0 0 272px;
  display:flex; flex-direction:column;
  background:var(--panel);
  border-right:1px solid var(--line);
  min-width:0;
  transition:margin-left .18s ease;
}
body.shut #panel { margin-left:-272px; }

#panel header { padding:18px 16px 10px; }
#panel h1 { font-size:15px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
#panel h1 small { font-size:11px; letter-spacing:0; text-transform:none; color:var(--dim); font-weight:500; margin-left:6px; }
#filter {
  width:100%; margin-top:10px; padding:6px 8px;
  background:var(--bg); color:var(--ink); border:1px solid var(--field); border-radius:6px;
  font:inherit; font-weight:500;
}
#filter:focus { outline:none; border-color:var(--accent); }

#list { flex:1; overflow-y:auto; padding:4px 8px 16px; }
#list h2 {
  margin:14px 8px 4px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--dim);
}
#list summary { list-style:none; cursor:pointer; border-radius:6px; }
#list summary::-webkit-details-marker { display:none; }
#list summary h2 { display:flex; align-items:center; gap:6px; margin:10px 0 2px; padding:4px 8px; }
#list summary h2::before {
  content:""; width:0; height:0;
  border-left:5px solid currentColor; border-top:4px solid transparent; border-bottom:4px solid transparent;
  transition:transform .15s ease;
}
#list details[open] > summary h2::before { transform:rotate(90deg); }
#list summary h2 small { font-size:10px; letter-spacing:0; font-weight:500; }
#list summary:hover h2 { color:var(--ink); }
#list .row { display:flex; align-items:center; border-radius:6px; }
#list a {
  flex:1; min-width:0;
  display:flex; align-items:center; gap:8px;
  padding:6px 2px 6px 8px;
  color:var(--soft); text-decoration:none; font-weight:500;
}
#list .row:hover, #list .row.menu { background:#1a1a29; }
#list .row:hover a, #list .row.menu a { color:var(--ink); }
#list .row.on { background:#1e2340; }
#list .row.on a { color:var(--ink); }
/* a checklist tool whose every item is checked */
#list .row.done span, .card.done b { color:var(--ok); }
#list a span { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ⋮ — the entry's own menu, shown on hover and while it is open */
#list .more {
  flex:none; width:20px; height:24px; margin-right:2px;
  background:none; border:0; border-radius:4px;
  color:var(--dim); font:700 15px/24px inherit; cursor:pointer;
  opacity:0;
}
#list .row:hover .more, #list .row.menu .more, #list .more:focus-visible { opacity:1; }
#list .more:hover, #list .row.menu .more { color:var(--ink); background:var(--field); }

#menu {
  position:fixed; z-index:10; width:232px; padding:8px;
  background:var(--panel); border:1px solid var(--field); border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  font-weight:500; font-size:13px;
}
#menu[hidden] { display:none; }
#menu h3 { margin:6px 4px 4px; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); }
#menu h3:first-child { margin-top:0; }
#menu form { display:flex; gap:6px; }
#menu input {
  flex:1; min-width:0; padding:4px 7px;
  background:var(--bg); color:var(--ink); border:1px solid var(--field); border-radius:6px;
  font:inherit;
}
#menu input:focus { outline:none; border-color:var(--accent); }
#menu form button {
  flex:none; padding:0 9px;
  background:transparent; color:var(--soft); border:1px solid var(--field); border-radius:6px;
  font:600 12px/24px inherit; cursor:pointer;
}
#menu form button:hover { color:var(--ink); border-color:var(--accent); }
#menu .grp {
  display:flex; align-items:center; gap:8px; width:100%;
  padding:5px 6px; border:0; border-radius:5px;
  background:none; color:var(--soft); font:inherit; text-align:left; cursor:pointer;
}
#menu .grp::before { content:""; width:12px; flex:none; text-align:center; }
#menu .grp.on::before { content:"✓"; color:var(--accent); }
#menu .grp.on { color:var(--ink); }
#menu .grp:hover { background:#1a1a29; color:var(--ink); }
#menu .err { margin:6px 4px 0; color:var(--warn); font-size:12px; }
#menu .err:empty { display:none; }
#menu.busy { opacity:.6; pointer-events:none; }

.pill {
  flex:none;
  padding:1px 6px; border-radius:99px;
  font-size:10px; font-weight:700; letter-spacing:.3px;
  background:#1f1f33; color:var(--dim);
}
.pill.game { background:rgba(126,166,255,.12); color:var(--accent); }

#panel footer { padding:10px 16px 14px; font-size:11px; font-weight:500; color:var(--dim); border-top:1px solid var(--line); }
#panel footer code { color:var(--soft); }

/* ---------------------------------------------------------------------------
   MAIN — the bar over the page, the page, or the home grid.
   --------------------------------------------------------------------------- */
#main { flex:1; display:flex; flex-direction:column; min-width:0; }

#bar {
  flex:none; display:flex; align-items:center; gap:10px;
  height:38px; padding:0 10px;
  background:var(--panel); border-bottom:1px solid var(--line);
}
#bar b { font-size:13px; }
#bar code { font-size:11px; color:var(--dim); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#bar .grow { flex:1; }
#bar button, #bar a.btn {
  flex:none;
  height:26px; min-width:26px; padding:0 8px;
  background:transparent; color:var(--soft); border:1px solid var(--field); border-radius:6px;
  font:600 13px/24px inherit; text-decoration:none; text-align:center; cursor:pointer;
}
#bar button:hover, #bar a.btn:hover { color:var(--ink); border-color:var(--accent); }
body.home #bar .page-only { display:none; }

#frame { flex:1; width:100%; border:0; background:var(--bg); }
body.home #frame { display:none; }

#home { flex:1; overflow-y:auto; padding:26px 28px 40px; display:none; }
body.home #home { display:block; }
#home h2 { margin:22px 0 10px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); }
#home h2:first-child { margin-top:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
.card {
  display:flex; flex-direction:column; gap:6px;
  padding:14px 14px 12px; border-radius:10px;
  background:var(--panel); border:1px solid var(--line);
  color:var(--ink); text-decoration:none;
}
.card:hover { border-color:var(--accent); }
.card .top { display:flex; align-items:center; gap:6px; }
.card .top b { flex:1; font-size:14px; }
.card p { font-size:12px; font-weight:500; color:var(--soft); line-height:1.45; }
.card code { font-size:11px; color:var(--dim); font-weight:500; margin-top:auto; }

#offline { max-width:520px; margin:12vh auto; padding:0 20px; font-weight:500; color:var(--soft); }
#offline h1 { font-size:18px; color:var(--ink); margin-bottom:10px; }
#offline code { color:var(--ink); }
</style>
</head>
<body class="home">

<aside id="panel">
  <header>
    <h1 id="to-home" title="Home">Lab <small id="where"></small></h1>
    <input id="filter" type="search" placeholder="Filter  ( / )" autocomplete="off">
  </header>
  <nav id="list"></nav>
  <footer>Localhost only — <code>make lab</code><br>A tool's server starts the first time it is opened.</footer>
</aside>

<main id="main">
  <div id="bar">
    <button id="toggle" title="Hide the list  ( \ )">☰</button>
    <b id="cur-name">All labs</b>
    <code id="cur-file"></code>
    <span class="grow"></span>
    <button id="reload" class="page-only" title="Reload the page">↻</button>
    <a id="open" class="btn page-only" target="_blank" title="Open in a tab of its own">↗</a>
  </div>
  <!-- display-capture: the events bench's REC records the played frame as it is seen (getDisplayMedia). -->
  <iframe id="frame" title="Lab page" allow="display-capture; autoplay"></iframe>
  <section id="home"></section>
</main>

<div id="menu" hidden>
  <h3>Name</h3>
  <form id="m-name"><input name="v" autocomplete="off" spellcheck="false"><button>Rename</button></form>
  <h3>Section</h3>
  <div id="m-groups"></div>
  <h3>Tag</h3>
  <form id="m-tag"><input name="v" list="m-tags" autocomplete="off" spellcheck="false" placeholder="all, none or a game"><button>Set</button></form>
  <datalist id="m-tags"></datalist>
  <p class="err" id="m-err"></p>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var LABS = [];
  var GROUPS = [["tools", "Backoffice"], ["css", "Front"], ["tests", "Tests"], ["prototype", "Prototype"], ["other", "Other"]];
  var frame = $("frame");

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  // A lab page about no game in particular is about all of them; a prototype
  // about none is about none. The server says which, a page may declare either.
  function tag(l) { return l.tag || l.game || (l.path.indexOf("prototype/") === 0 ? "none" : "all"); }

  function pills(l) {
    return '<i class="pill' + (l.game ? " game" : "") + '">' + esc(tag(l)) + "</i>";
  }

  function groups() {
    var q = $("filter").value.trim().toLowerCase();
    var hit = LABS.filter(function (l) {
      return !q || (l.name + " " + l.file + " " + tag(l) + " " + l.summary).toLowerCase().indexOf(q) >= 0;
    });
    // Filed by the page's own <meta name="lab-group">, then sorted by tag —
    // "all" first, then the games in alphabetical order — and by name inside.
    return GROUPS.map(function (g) {
      return [g[1], hit.filter(function (l) { return l.group === g[0]; })
        .sort(function (a, b) {
          var ta = tag(a), tb = tag(b);
          if (ta !== tb) return ta === "all" || tb === "none" ? -1 : tb === "all" || ta === "none" ? 1 : ta.localeCompare(tb);
          return a.name.localeCompare(b.name);
        }), g[0]];
    }).filter(function (g) { return g[1].length; });
  }

  /* Each group of the list folds on its heading. The folded ones are kept per
     browser; a filter being typed opens them all, since a match hidden in a
     closed group reads as no match. */
  var shutGroups = {};
  try { shutGroups = JSON.parse(localStorage.getItem("lab:groups") || "{}") || {}; } catch (e) {}

  function renderList() {
    var cur = current();
    var q = $("filter").value.trim();
    $("list").innerHTML = groups().map(function (g) {
      var open = q || !shutGroups[g[2]];
      return '<details data-group="' + esc(g[2]) + '"' + (open ? " open" : "") + "><summary><h2>" + g[0] +
        " <small>" + g[1].length + "</small></h2></summary>" + g[1].map(function (l) {
        var cls = (cur && cur.url === l.url ? " on" : "") + (isDone(l) ? " done" : "") + (menuFor === l.path ? " menu" : "");
        return '<div class="row' + cls + '"><a href="#' + esc(l.url) + '"' +
          ' title="' + esc(doneTip(l) + l.summary) + '"><span>' + esc(l.name) + "</span>" + pills(l) + "</a>" +
          '<button class="more" data-path="' + esc(l.path) + '" title="Rename, move or retag">⋮</button></div>';
      }).join("") + "</details>";
    }).join("") || '<h2>Nothing matches</h2>';
  }

  // Only a click on a heading is the player's choice: a <details> written open
  // by renderList fires "toggle" too.
  $("list").addEventListener("click", function (e) {
    var more = e.target.closest(".more");
    if (more) { e.preventDefault(); return menuFor === more.dataset.path ? closeMenu() : openMenu(more); }
    var s = e.target.closest("summary");
    if (!s || $("filter").value.trim()) return;
    var d = s.parentNode;
    if (d.open) shutGroups[d.dataset.group] = 1; else delete shutGroups[d.dataset.group];
    try { localStorage.setItem("lab:groups", JSON.stringify(shutGroups)); } catch (e2) {}
  });

  /* ⋮ — one menu for every entry, laid beside the button that opened it. Each
     field is sent on its own and written into the page at once; the answer is
     the list read again, so what the menu shows next is what the file says. */
  var menuFor = null, TAGS = null;
  var entry = function () {
    return LABS.filter(function (l) { return l.path === menuFor; })[0];
  };

  function fillMenu() {
    var l = entry();
    if (!l) return closeMenu();
    $("m-name").v.value = l.name;
    $("m-tag").v.value = tag(l);
    $("m-groups").innerHTML = GROUPS.filter(function (g) { return g[0] !== "other"; }).map(function (g) {
      return '<button class="grp' + (l.group === g[0] ? " on" : "") + '" data-group="' + g[0] + '">' + g[1] + "</button>";
    }).join("");
  }

  function openMenu(btn) {
    menuFor = btn.dataset.path;
    $("m-err").textContent = "";
    fillMenu();
    var m = $("menu"), r = btn.getBoundingClientRect();
    m.hidden = false;
    m.style.left = Math.round(r.right + 6) + "px";
    m.style.top = Math.round(Math.max(8, Math.min(r.top - 8, innerHeight - m.offsetHeight - 8))) + "px";
    renderList();
    if (!TAGS) fetch("api/labs/tags").then(function (r2) { return r2.json(); }).then(function (t) {
      TAGS = t;
      $("m-tags").innerHTML = t.map(function (x) { return '<option value="' + esc(x) + '">'; }).join("");
    }).catch(function () {});
  }

  function closeMenu() {
    if (!menuFor) return;
    menuFor = null;
    $("menu").hidden = true;
    renderList();
  }

  function save(change) {
    var m = $("menu");
    change.path = menuFor;
    m.classList.add("busy");
    $("m-err").textContent = "";
    fetch("api/labs/edit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(change) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || r.status); return d; }); })
      .then(function (list) {
        LABS = list;
        fillMenu();
        route();
      })
      .catch(function (e) { $("m-err").textContent = e.message; })
      .then(function () { m.classList.remove("busy"); });
  }

  $("m-name").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = this.v.value.trim();
    if (v && v !== entry().name) save({ name: v });
  });
  $("m-tag").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = this.v.value.trim().toLowerCase();
    if (v && v !== tag(entry())) save({ tag: v });
  });
  $("m-groups").addEventListener("click", function (e) {
    var b = e.target.closest(".grp");
    if (b && b.dataset.group !== entry().group) save({ group: b.dataset.group });
  });
  // A field is replaced rather than edited, and a tag field emptied by the
  // selection lists every tag its datalist holds.
  $("menu").addEventListener("focusin", function (e) { if (e.target.tagName === "INPUT") e.target.select(); });
  document.addEventListener("mousedown", function (e) {
    if (menuFor && !e.target.closest("#menu, .more")) closeMenu();
  });
  $("list").addEventListener("scroll", closeMenu);
  window.addEventListener("resize", closeMenu);

  function renderHome() {
    $("home").innerHTML = groups().map(function (g) {
      return "<h2>" + g[0] + '</h2><div class="grid">' + g[1].map(function (l) {
        return '<a class="card' + (isDone(l) ? " done" : "") + '" href="#' + esc(l.url) + '" title="' + esc(doneTip(l)) +
          '"><div class="top"><b>' + esc(l.name) + "</b>" + pills(l) +
          "</div><p>" + esc(l.summary) + "</p><code>" + esc(l.path) + "</code></a>";
      }).join("") + "</div>";
    }).join("");
  }

  /* A tool whose page is a checklist (`lab-done`) says whether everything on
     it is checked, across every game: its entry goes green when it is. Asked
     on load and again on every move, since a tick given in the frame changes
     it. A tool that does not answer simply stays as it is. */
  var DONE = {};
  function isDone(l) { return !!(l.done && DONE[l.done] && DONE[l.done].done); }
  function doneTip(l) {
    var d = l.done && DONE[l.done];
    return d ? d.checked + " / " + d.total + " checked" + (d.done ? "" : ", not done") + " — " : "";
  }
  function askDone() {
    LABS.forEach(function (l) {
      if (!l.done) return;
      fetch(l.done).then(function (r) { return r.json(); }).then(function (d) {
        DONE[l.done] = d;
        renderList();
        if (!location.hash.slice(1)) renderHome();
      }).catch(function () {});
    });
  }

  /* The lab the hash points at. `/events/library` is the sound library and
     `/events/` the bench, so the longest url that prefixes the path wins. */
  function current() {
    var p = location.hash.slice(1);
    if (!p) return null;
    var best = null;
    LABS.forEach(function (l) {
      var u = l.url.replace(/\/$/, "");
      if ((p === l.url || p === u || p.indexOf(u + "/") === 0 || p.indexOf(l.url + "?") === 0) &&
          (!best || l.url.length > best.url.length)) best = l;
    });
    return best;
  }

  function route() {
    var p = location.hash.slice(1);
    var home = !p;
    document.body.classList.toggle("home", home);
    var l = current();
    $("cur-name").textContent = home ? "All labs" : (l ? l.name : p);
    $("cur-file").textContent = home ? LABS.length + " pages" : (l ? l.path : "");
    document.title = home ? "Lab — back office" : "Lab — " + (l ? l.name : p);
    $("open").href = p || "/";
    if (!home && framePath() !== p) frame.src = p;
    if (home) frame.removeAttribute("src");
    renderList();
    if (home) renderHome();
  }

  function framePath() {
    try {
      var loc = frame.contentWindow.location;
      return loc.href === "about:blank" ? "" : loc.pathname + loc.search;
    } catch (e) { return ""; }
  }

  // A page that navigates inside the frame takes the hash with it.
  frame.addEventListener("load", function () {
    var p = framePath();
    if (p && p !== location.hash.slice(1)) {
      history.replaceState(null, "", "#" + p);
      route();
    }
  });

  window.addEventListener("hashchange", function () { closeMenu(); route(); askDone(); });
  $("filter").addEventListener("input", function () { renderList(); if (!location.hash.slice(1)) renderHome(); });
  $("to-home").addEventListener("click", function () { location.hash = ""; });
  $("reload").addEventListener("click", function () {
    try { frame.contentWindow.location.reload(); } catch (e) { frame.src = frame.src; }
  });

  function toggle() {
    document.body.classList.toggle("shut");
    try { localStorage.setItem("lab:shut", document.body.classList.contains("shut") ? "1" : ""); } catch (e) {}
  }
  $("toggle").addEventListener("click", toggle);
  try { if (localStorage.getItem("lab:shut")) document.body.classList.add("shut"); } catch (e) {}

  document.addEventListener("keydown", function (e) {
    if (menuFor && e.key === "Escape") { closeMenu(); return; }
    if (e.target.tagName === "INPUT") {
      if (e.target.id === "filter" && e.key === "Escape") { e.target.value = ""; e.target.blur(); renderList(); renderHome(); }
      return;
    }
    if (e.key === "/") { e.preventDefault(); if (document.body.classList.contains("shut")) toggle(); $("filter").focus(); }
    else if (e.key === "\\") toggle();
  });

  $("where").textContent = location.host;

  fetch("api/labs").then(function (r) { return r.json(); }).then(function (list) {
    LABS = list;
    route();
    askDone();
  }).catch(function () {
    document.body.innerHTML = '<div id="offline"><h1>The back office needs its server</h1>' +
      "<p>The list is read off <code>lab/*.html</code> by <code>tools/lab/serve-lab.mjs</code>. " +
      "Run <code>make lab</code> and open <code>http://localhost:8095/</code>.</p></div>";
  });
})();
</script>
</body>
</html>
