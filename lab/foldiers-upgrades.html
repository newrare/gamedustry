<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — foldiers upgrades, works and weather</title>
<meta name="lab-group" content="css">

<style>
/* ===========================================================================
   FOLDIERS UPGRADES, WORKS AND WEATHER — four things the round knows and the
   map does not say, each tried in a few looks side by side.

   1. UPGRADES. From stage 11 on, a stage turns up what the player already
      has (veterans, long guns, heavy shells, a charge, richer towns…,
      RULE_AT in games/foldiers/game.js). Today a notice says it once
      ("New: Veterans") and nothing on screen says it again. Tried here: a
      row of paper stamps over the resources, a column under the HUD, or the
      stamp worn by the pieces it upgrades — each stamp the piece cropped in
      a paper disc, a paper arrow pointing up in it (this is an upgrade) and
      the value on a tag, the upgrade of THIS stage tagged New. A stamp is meant to open its guide page on a tap.
   2. THE FORECAST. The rosette over a target says "5 vs 4"; the +1 of the
      veterans, the +1 of a hold, the −1 of a river are inside the numbers
      and nowhere else (attackParts). Tried: today's, a second line of
      words, a row of stamps over the rosette (yours left, theirs right, a
      cancelled one struck), and the sum written out.
   3. THE ENGINEER'S WORKS. A palisade is a purchase: nothing on the map
      says one is coming until the bell. Tried: today's, a ghost palisade,
      the ringed badge Defend and Wait already wear (in the works' gold), and
      the built palisade. The same for a bridge: the arrow alone, a ghost
      bridge on the river, the built bridge.
   4. THE WEATHER. Today: a throbbing rosette over the region, a notice, a
      line on the region's card. Tried: the rosette with what it will take
      ("−2"), a cloud hanging over the region, and the region itself marked.
      Play the bell strikes every cell at once.
   5. THE WONDER. Not a look but the flow, and a proposal: today a gold
      "n / 5" chip counts the player's bells in a row and Red's count is
      never drawn. Tried: the wonder visible from the first tick through
      the fog and shining, and the chip turned into a tug-of-war GAUGE —
      yellow in the middle, Blue's five steps on one side, Red's on the
      other; each bell the holder moves it a step toward its side, an even
      bell (or nobody's) leaves it, a camp's end wins or loses the stage.
      Beat by beat in the round's own pieces, and one run bell by bell.
      Picked and ported into games/foldiers/game.js (wonderG, wonderGauge,
      wonderGlint, shineAt's rays only).

   The paper generator, the arrows, the tags, the pin and the weather
   rosette are copied as they are from games/foldiers/game.js; the beads and
   the ringed badge come from lab/foldiers-arrows.html (shipped). The ground
   is that page's stand-in. Nothing here ships by itself. Picked and ported
   into games/foldiers/game.js: the column under the HUD with the up arrow
   (stamp 56, values, New), the forecast's stamps laid over the pin, the
   cloud over the region with the loss in its middle, the ringed badge for a
   palisade AND a bridge (on the river), and the built works bigger, with a
   gold tag for the tick after.
   =========================================================================== */
@font-face { font-family:"Baloo 2"; src:url("../assets/motor/font/baloo2.woff2") format("woff2"); font-weight:400 800; }

  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

<body>
<div id="panel">
  <h1>Foldiers · upgrades, works, weather</h1>
  <p class="hint">What the round knows and the map does not say: the upgrades in force, what a fight adds up, the engineer's works on their way, the weather coming, and how the wonder is won or lost. Several looks of each, side by side.</p>

  <h3>View</h3>
  <div class="seg" id="view">
    <button data-v="upg">Upgrades</button><button data-v="fight">Forecast</button><button data-v="works">Works</button><button data-v="wx">Weather</button><button data-v="wonder">Wonder</button>
  </div>

  <div data-for="upg">
    <h3>Upgrades in force</h3>
    <div class="row"><label>At stage <output id="o-lvl"></output></label><input type="range" id="lvl" min="11" max="30" step="1"></div>
    <div class="row"><label>Stamp size <output id="o-stamp"></output></label><input type="range" id="stamp" min="30" max="56" step="2"></div>
    <div class="seg" id="vals"><button data-v="1">Values</button><button data-v="0">No values</button></div>

</div>
<div id="stage"></div>
<script>
// ---- what the copied game code expects around it ---------------------------
var view = { dpr: 2 };
var ctx = null;
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function freeCanvas(cv) { if (cv) { cv.width = 0; cv.height = 0; } return null; }
var FONT = '"Baloo 2", system-ui, -apple-system, sans-serif';
function font(size, bold) { return (bold ? "700 " : "500 ") + size + "px " + FONT; }

// ---- the camps and the inks (games/foldiers/game.js) -----------------------
var NEUTRAL = 0, BLUE = 1, RED = 2, GREEN = 3;
var CAMP = [
  { base: "#b9a77d", light: "#d8c79c", dark: "#8a7a55", rgb: [150, 140, 110] },
  { base: "#2f63c4", light: "#5b8fe0", dark: "#1d3f8a", rgb: [47, 99, 196] },
  { base: "#d9412f", light: "#ee6a4a", dark: "#a52a1f", rgb: [217, 65, 47] },
  { base: "#2f9e5a", light: "#5cc283", dark: "#1d6b3c", rgb: [47, 158, 90] }
];
var OK_COL = "#2f8f4e", BAD_COL = "#c8402f", RISK_COL = "#d08a12", TIE_COL = "#6d7486", LATER_COL = "#b07a10";
var PAPER = "#f6ecd2", INK = "#2a2418", IDLE_COL = "#8a94a8", RIVER_INK = "#2f7fb5", SHOT_COL = "#e07a2a";

// ======================================================================
//  COPIED FROM games/foldiers/game.js — THE ARROWS (curve, paperArrow,
//  chevrons, footprints), as they are.
// ======================================================================
function curve(a, b, bend, r0, r1) {
  var dx = b[0] - a[0], dy = b[1] - a[1], c = [(a[0] + b[0]) / 2 - dy * bend, (a[1] + b[1]) / 2 + dx * bend], pts = [];
  for (var i = 0; i <= 40; i++) {
    var t = i / 40, u = 1 - t;
    var p = [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]];
    if (Math.hypot(p[0] - a[0], p[1] - a[1]) < r0 || Math.hypot(p[0] - b[0], p[1] - b[1]) < r1) continue;
    pts.push(p);
  }
  return pts;
}
function paperArrow(pts, C, draft) {
  var n = pts.length;
  if (n < 3) return null;
  var hl = 30, w = 11, hw = 26, L = 0, cum = [0], i;
  for (i = 1; i < n; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(L); }
  var iB = n - 1;
  while (iB > 1 && L - cum[iB] < hl) iB--;
  var left = [], mid = [], right = [];
  for (i = 0; i <= iB; i++) {
    var p = pts[i], q = pts[Math.min(n - 1, i + 1)], o = pts[Math.max(0, i - 1)];
    var tx = q[0] - o[0], ty = q[1] - o[1], l = Math.hypot(tx, ty) || 1;
    tx /= l; ty /= l;
    left.push([p[0] - ty * w, p[1] + tx * w]); right.push([p[0] + ty * w, p[1] - tx * w]); mid.push(p);
  }
  var B2 = pts[iB], Tp = pts[n - 1], dx = Tp[0] - B2[0], dy = Tp[1] - B2[1], dl = Math.hypot(dx, dy) || 1, nx = -dy / dl, ny = dx / dl;
  var wl = [B2[0] + nx * hw, B2[1] + ny * hw], wr = [B2[0] - nx * hw, B2[1] - ny * hw];
  function outline(ox, oy) {
    ctx.beginPath();
    left.forEach(function (pp, ix) { ctx[ix ? "lineTo" : "moveTo"](pp[0] + ox, pp[1] + oy); });
    ctx.lineTo(wl[0] + ox, wl[1] + oy); ctx.lineTo(Tp[0] + ox, Tp[1] + oy); ctx.lineTo(wr[0] + ox, wr[1] + oy);
    for (var k = right.length - 1; k >= 0; k--) ctx.lineTo(right[k][0] + ox, right[k][1] + oy);
    ctx.closePath();
  }
  outline(4, 7); ctx.fillStyle = "rgba(20,30,70,.22)"; ctx.fill();
  outline(0, 0); ctx.fillStyle = draft ? C.light : C.base; ctx.fill();
  ctx.beginPath();
  left.forEach(function (pp, ix) { ctx[ix ? "lineTo" : "moveTo"](pp[0], pp[1]); });
  ctx.lineTo(wl[0], wl[1]); ctx.lineTo(Tp[0], Tp[1]);
  for (i = mid.length - 1; i >= 0; i--) ctx.lineTo(mid[i][0], mid[i][1]);
  ctx.closePath(); ctx.fillStyle = draft ? "rgba(255,255,255,.55)" : C.light; ctx.fill();
  ctx.beginPath(); mid.forEach(function (pp, ix) { ctx[ix ? "lineTo" : "moveTo"](pp[0], pp[1]); }); ctx.lineTo(Tp[0], Tp[1]);
  if (draft) ctx.setLineDash([7, 6]);
  ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();
  ctx.setLineDash([]);
  outline(0, 0); ctx.lineWidth = 1.4; ctx.strokeStyle = C.dark; ctx.stroke();
  return Tp;
}
function chevrons(pts, C, draft) {
  if (pts.length < 4) return null;
  var step = 6;
  for (var i = 3; i < pts.length - 1; i += step) {
    var p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)], dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
    ctx.beginPath();
    ctx.moveTo(p[0] - dx * 9 - dy * 13, p[1] - dy * 9 + dx * 13);
    ctx.lineTo(p[0] + dx * 7, p[1] + dy * 7);
    ctx.lineTo(p[0] - dx * 9 + dy * 13, p[1] - dy * 9 - dx * 13);
    ctx.lineTo(p[0] - dx * 3, p[1] - dy * 3);
    ctx.closePath();
    ctx.fillStyle = draft ? C.light : C.base; ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = C.dark; ctx.stroke();
  }
  return pts[pts.length - 1];
}
function footprints(pts, C) {
  for (var i = 2, s = 0; i < pts.length; i += 4, s++) {
    var p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)], dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
    var side = s % 2 ? 1 : -1;
    ctx.beginPath(); ctx.ellipse(p[0] - dy * 6 * side, p[1] + dx * 6 * side, 5, 3.4, Math.atan2(dy, dx), 0, Math.PI * 2);
    ctx.fillStyle = C.dark; ctx.globalAlpha = 0.75; ctx.fill(); ctx.globalAlpha = 1;
  }
  return pts[pts.length - 1];
}

// ======================================================================
//  COPIED FROM games/foldiers/game.js — THE PAPER (LOOK, the generator,
//  ppSprite, paperOn / paperOff), as it is.
// ======================================================================
var LOOK = { tilt: 6, rough: 7, fold: "crumple", depth: 0.8, kink: 0, ear: 10, tape: "clear", tapeSmall: true,
             grain: 0.5, shadow: 0.5, seed: 19 };
var PP_BACK = "#e3d2a6", PP_EDGE = "rgba(110,85,40,.28)";
var PP_TAPE = {
  masking: { a: "rgba(236,220,172,.9)" },
  clear: { a: "rgba(255,255,255,.32)", gloss: true }
};
var ACT_EARS = [1, 1, 0, 1];
// What each kind of piece is made of, before the look (the lab's recipeOf).
var PP_RECIPE = {
  card:    { sheet: true, earCorner: 2, tape: ["tl", "tr"], tiltK: 0.35, tapeLen: 100 },
  rtitle:  { sheet: true, earCorner: 3, tape: ["t"], tiltK: 0.6, tapeLen: 80 },
  send:    { sheet: true, earCorner: 1, tape: ["l", "r"], tiltK: 0.6 },
  own:     { fold: "diag", tiltK: 1.2 },
  act:     { fold: LOOK.fold === "accordion" ? "accordion" : LOOK.fold === "none" ? "none" : "diag", ear: Math.min(LOOK.ear, 16), tiltK: 0.8 },
  chip:    { tape: ["l"], small: true, tapeLen: 40, tiltK: 0.9, notch: 7, edge: "rgba(0,0,0,.25)" },
  tag:     { fold: LOOK.fold === "none" ? "none" : "tent", tape: ["t"], small: true, tapeLen: 30, tiltK: 1.6 },
  prod:    { fold: LOOK.fold === "none" ? "none" : "tent", tiltK: 2 },
  shield:  { shape: "shield", tiltK: 1.4 },
  threat:  { fold: LOOK.fold === "none" ? "none" : "diag", tape: ["r"], small: true, tapeLen: 30, tiltK: 1.4 },
  verdict: { notch: 9, fold: LOOK.fold === "none" ? "none" : "diag", tape: ["l"], small: true, tapeLen: 36, tiltK: 1.4 },
  bub:     { shape: "radial", tiltK: 2, edge: "rgba(0,0,0,.25)" },
  // the hand's cards and their prices (lab/foldiers-cards.html, D · Origami)
  hand:    { sheet: true, tiltK: 5 / 6, depth: 0.9 },
  coin:    { shape: "radial", tiltK: 2, edge: "rgba(0,0,0,.25)" }
};

function ppRng(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function ppHash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
function ppLerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
// A colour on the back of the paper: the ink, washed toward white.
function ppTint(hex, k) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return PP_BACK;
  var n = parseInt(hex.slice(1), 16);
  return "rgb(" + [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { return Math.round(v + (255 - v) * k); }).join(",") + ")";
}

// keep the side of line A->B where cross >= 0 (sign = 1) or <= 0 (sign = -1)
function ppClip(poly, A, B, sign) {
  var out = [];
  function side(p) { return sign * ((B[0] - A[0]) * (p[1] - A[1]) - (B[1] - A[1]) * (p[0] - A[0])); }
  for (var i = 0; i < poly.length; i++) {
    var p = poly[i], q = poly[(i + 1) % poly.length], sp = side(p), sq = side(q);
    if (sp >= 0) out.push(p);
    if ((sp >= 0) !== (sq >= 0)) out.push(ppLerp(p, q, sp / (sp - sq)));
  }
  return out;
}

/* A sheet: four off-square corners, hand-cut edges, the creases of its
   fold (whose ends kink the edge out for a mountain, in for a valley), an
   optional dog-ear and an optional V notch (a ribbon's end). */
function ppSheet(w, h, o, r) {
  var J = o.rough;
  function jit() { return (r() * 2 - 1) * J; }
  var P = [[jit(), jit()], [w + jit(), jit()], [w + jit(), h + jit()], [jit(), h + jit()]];
  var kinks = [[], [], [], []], creases = [];
  // edge e runs P[e] -> P[e+1]; f is the fraction read left->right / top->bottom
  function tOf(e, f) { return e === 2 || e === 3 ? 1 - f : f; }
  function crease(e1, f1, e2, f2, mountain) {
    var id = creases.length, off = (mountain ? 1 : -1) * o.kink * (0.6 + r() * 0.6);
    kinks[e1].push({ t: tOf(e1, f1), off: off, id: id, end: 0 });
    kinks[e2].push({ t: tOf(e2, f2), off: off, id: id, end: 1 });
    creases.push({ a: null, b: null, mountain: mountain });
  }
  var i, fold = o.fold;
  if (fold === "diag") {
    if (w >= h * 1.3) crease(0, 0.52 + r() * 0.2, 2, 0.34 + r() * 0.2, true);
    else crease(3, 0.3 + r() * 0.2, 1, 0.5 + r() * 0.2, true);
  } else if (fold === "tent") {
    crease(3, 0.46 + r() * 0.1, 1, 0.46 + r() * 0.1, true);
  } else if (fold === "accordion") {
    var na = Math.max(1, Math.min(6, Math.round(w / 110)));
    for (i = 1; i <= na; i++) {
      var f = i / (na + 1) + (r() - 0.5) * 0.06, slant = (r() - 0.5) * 0.06;
      crease(0, f + slant, 2, f - slant, i % 2 === 1);
    }
  } else if (fold === "cross") {
    crease(0, 0.46 + r() * 0.08, 2, 0.46 + r() * 0.08, true);
    if (h > 50) crease(3, 0.44 + r() * 0.12, 1, 0.44 + r() * 0.12, false);
  }
  if (o.notch) kinks[1].push({ t: 0.5, off: -o.notch, id: -1 });

  var L = P.map(function (p, k) { var q = P[(k + 1) % 4]; return Math.hypot(q[0] - p[0], q[1] - p[1]); });
  var ear = -1, d = 0;
  if (o.ear > 0 && o.earCorner != null) {
    ear = o.earCorner;
    d = Math.min(o.ear, 0.42 * Math.min(w, h));
    if (d < 6) ear = -1;
  }
  var out = [], a = null, b = null;
  for (var e = 0; e < 4; e++) {
    var u = P[e], v = P[(e + 1) % 4], dx = (v[0] - u[0]) / L[e], dy = (v[1] - u[1]) / L[e], nx = dy, ny = -dx;
    var t0 = e === ear ? d / L[e] : 0, t1 = (e + 1) % 4 === ear ? 1 - d / L[e] : 1;
    var n = Math.max(1, Math.round(L[e] / 26)), list = [];
    for (i = 1; i < n; i++) list.push({ t: i / n, off: (r() * 2 - 1) * J * 0.3 });
    kinks[e].forEach(function (k) { list.push(k); });
    list.sort(function (p, q) { return p.t - q.t; });
    var at = (function (u, v, nx, ny) {
      return function (t, off) { return [u[0] + (v[0] - u[0]) * t + nx * off, u[1] + (v[1] - u[1]) * t + ny * off]; };
    })(u, v, nx, ny);
    if (e === ear) { b = at(t0, 0); out.push(b); } else out.push(u);
    for (i = 0; i < list.length; i++) {
      var k = list[i];
      if (k.t <= t0 + 0.02 || k.t >= t1 - 0.02) {
        if (k.id >= 0) creases[k.id][k.end ? "b" : "a"] = at(k.t, 0);   // still a line, no kink
        continue;
      }
      var p = at(k.t, k.off);
      if (k.id >= 0) creases[k.id][k.end ? "b" : "a"] = p;
      // a kink is a sharp corner: the points either side stay on the cut
      if (k.id !== undefined) { out.push(at(k.t - 0.012, 0)); out.push(p); out.push(at(k.t + 0.012, 0)); }
      else out.push(p);
    }
    if ((e + 1) % 4 === ear) { a = at(t1, 0); out.push(a); }
  }
  var flap = null;
  if (ear >= 0 && a && b) {

// Flakes falling from y0 to y1 around x, deterministic in time (no particles to keep).
function flakes(x, y0, y1, spread, dense) {
  ctx.save(); ctx.fillStyle = "#fff";
  for (var i = 0; i < 18 * dense; i++) {
    var ph = (i * 0.618) % 1, sp = 0.35 + 0.3 * ((i * 0.37) % 1), f = (clock * sp + ph) % 1;
    var fx = x + (((i * 97) % 200) / 200 - 0.5) * spread * 2 + Math.sin(clock * 2 + i) * 6, fy = y0 + (y1 - y0) * f;
    ctx.globalAlpha = Math.min(1, (1 - f) * 3) * 0.9;
    ctx.beginPath(); ctx.arc(fx, fy, 2.2 + (i % 3), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ======================================================================
//  5. THE WONDER — a PROPOSAL, how a stage with a wonder would play out
//  with a tug-of-war gauge in place of today's "n / 5" chip (game.js:
//  rules.wonder, wonderHold, WONDER_HOLD, failReason, drawTags).
//  The wonder stands on the map from the first tick, through the fog, and
//  shines. Over it, a gauge: yellow in the middle (nobody), Blue's five
//  steps on one side, Red's five on the other. At every bell the camp that
//  holds the region moves it one step toward its own side — Blue pulls back
//  through the yellow middle and on into blue, a step a bell — and a bell
//  where the region is nobody's, or where Blue and Red end even on it,
//  leaves it where it is. The end of a side is that camp's: Blue's wins
//  the stage, a rival's loses it.
// ======================================================================
var WONDER_HOLD = 5, WD_YELLOW = "#f2c230";
function wonderScene(id, owner, foot) {
  return { id: "wd-" + id, w: 420, h: 380, sea: null, river: null,
    regions: [
      region(92, 300, BLUE, { build: "capital", foot: 4, cav: 1 }),
      region(220, 206, owner, { build: "wonder", foot: foot }),
      region(384, 112, RED, { build: "town", foot: 3 })
    ] };
}
var WD_BEATS = [
  { id: "start", owner: NEUTRAL, foot: 5, g: 0, fog: true, name: "1 · From the first tick",
    what: "The wonder stands on the map from the start, through the fog, shining. Its gauge rests on the yellow middle: nobody's yet." },
  { id: "plan", owner: NEUTRAL, foot: 5, g: 0, march: true, name: "2 · Plan — send more than its guard",
    what: "Its guard is 3 troops plus one every 15 stages (5 at stage 22). Red wants it too: it rates the wonder above any town." },
  { id: "taken", owner: BLUE, foot: 2, g: 1, step: 1, name: "3 · Bell 1 — Blue takes it",
    what: "The bell that takes it already counts: the gauge moves one step to Blue's side." },
  { id: "hold", owner: BLUE, foot: 4, g: 4, step: 1, defend: true, name: "4 · Bells 2 to 4 — Blue holds",
    what: "Every bell Blue still holds it, one more step toward Blue: 4 of 5." },
  { id: "tie", owner: BLUE, foot: 0, g: 4, red: true, defend: true, tie: true, name: "5 · Bell 5 — even",
    what: "Blue and Red end even on the region: the gauge does not move. So does a bell where the region is nobody's." },
  { id: "back", owner: RED, foot: 2, g: 3, step: -1, name: "6 · Red takes it — the gauge comes back",
    what: "Every bell Red holds it pulls the gauge one step back toward Red: 4 becomes 3, then 2, 1 and the yellow middle." },
  { id: "cross", owner: RED, foot: 3, g: -2, step: -1, name: "7 · Past the middle — red",
    what: "On through the yellow middle the gauge fills red, one step a bell, for as long as Red holds the region." },
  { id: "won", owner: BLUE, foot: 3, g: 5, verdict: ["Stage won", OK_COL], name: "8 · Blue's end — won",
    what: "The gauge reaches Blue's end: the stage is won at once. The other two stars: capital never attacked, done within 15 ticks." },
  { id: "fail", owner: RED, foot: 5, g: -5, verdict: ["A rival held the wonder", BAD_COL], name: "9 · Red's end — lost",
    what: "It reaches Red's (or Green's) end: the stage is lost. In the endless war it can only lose." }
];
var WD_SC = {};
WD_BEATS.forEach(function (B) { WD_SC[B.id] = wonderScene(B.id, B.owner, B.foot); });

// The shine of a badge to win (game.js shineAt), its rays only: the disc under them is dropped.
function shineAt(x, y, R, t) {
  ctx.save(); ctx.translate(x, y);
  var gl = ctx.createRadialGradient(0, 0, R * 0.15, 0, 0, R);
  gl.addColorStop(0, "rgba(255,232,140,.85)"); gl.addColorStop(0.6, "rgba(255,206,60,.35)"); gl.addColorStop(1, "rgba(255,196,40,0)");
  ctx.fillStyle = gl;
  ctx.rotate(t * 0.6);
  ctx.beginPath();
  for (var i = 0; i < 10; i++) { var a = i / 10 * Math.PI * 2; ctx.moveTo(0, 0); ctx.arc(0, 0, R, a, a + Math.PI / 14); ctx.closePath(); }
  ctx.fill();
  ctx.restore();
}
// The wonder, very bright: the rays behind it, the piece, a glint running up its gold (from the foot of the obelisk, over the plinth).
function brightWonder(x, y, h) {
  shineAt(x, y - h * 0.5, h * 1.25, clock);
  var d = figure("wonder", BLUE, x, y, h);
  if (!d) return;
  var t = (clock * 0.7) % 1.6;
  if (t < 1) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.55 * Math.sin(t * Math.PI);
    var gy = y - h * (0.3 + 0.62 * t), g = ctx.createLinearGradient(0, gy - 14, 0, gy + 14);
    g.addColorStop(0, "rgba(255,240,180,0)"); g.addColorStop(0.5, "rgba(255,250,220,1)"); g.addColorStop(1, "rgba(255,240,180,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, gy, d.w * 0.32, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* THE GAUGE — a paper strip: Blue's five steps on the left (the side the
   player's land is on here), the yellow middle, Red's five on the right.
   Every step is a scrap of paper of its own, cut a little crooked and
   folded, filled in the camp's ink between the middle and `g`, pale past
   it. No count written: the filled steps are the count, and nothing says
   which way it will move next. */
var GAUGE_W = 184, GAUGE_H = 26;
// One step: a quad cut a little crooked (seeded), a fold across it, a cut edge.
function gaugeSlot(x, y, w, h, col, on, key) {
  var r = ppRng(ppHash(key)), j = function () { return (r() * 2 - 1) * 1.1; };
  var P = [[x + j(), y + j()], [x + w + j(), y + j()], [x + w + j(), y + h + j()], [x + j(), y + h + j()]];
  function path() { ctx.beginPath(); P.forEach(function (p, i) { ctx[i ? "lineTo" : "moveTo"](p[0], p[1]); }); ctx.closePath(); }
  ctx.save();
  ctx.translate(0.6, 1.2); path(); ctx.fillStyle = "rgba(40,25,0,.22)"; ctx.fill(); ctx.translate(-0.6, -1.2);
  path(); ctx.fillStyle = on ? col : ppTint(col, 0.74); ctx.fill();
  ctx.clip();
  // the fold: one face a shade darker, the crease, a lit line beside it
  var f = 0.35 + r() * 0.3;
  ctx.beginPath(); ctx.moveTo(x - 2, y + h * f - 3); ctx.lineTo(x + w + 2, y + h * f + 3); ctx.lineTo(x + w + 2, y + h + 2); ctx.lineTo(x - 2, y + h + 2); ctx.closePath();
  ctx.fillStyle = on ? "rgba(20,10,0,.16)" : "rgba(20,10,0,.07)"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 2, y + h * f - 3); ctx.lineTo(x + w + 2, y + h * f + 3);
  ctx.lineWidth = 0.8; ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.stroke();
  ctx.restore();
  path(); ctx.lineWidth = 0.8; ctx.strokeStyle = "rgba(40,25,0,.3)"; ctx.stroke();
}
function gaugeAt(cx, cy, g, step, key) {
  var w = GAUGE_W, h = GAUGE_H, pad = 5, mid = 20, gap = 2, cw = (w - pad * 2 - mid) / 10;
  var S = paperOn("chip", "gauge" + key, cx - w / 2, cy - h / 2, w, h, { fill: "#efe2bf" });
  // local coords: 0..w, 0..h
  function cellX(k) { return k > 0 ? pad + (5 - k) * cw : pad + 5 * cw + mid + (-k - 1) * cw; }
  for (var k = 1; k <= 5; k++) {
    [k, -k].forEach(function (s) {
      var camp = s > 0 ? BLUE : RED, on = s > 0 ? g >= s : g <= s;
      gaugeSlot(cellX(s) + gap / 2, 4, cw - gap, h - 8, CAMP[camp].base, on, "slot" + key + s);
    });
  }
  // the ends: a camp's end is its goal, a notch of its dark ink
  ctx.fillStyle = CAMP[BLUE].dark; ctx.fillRect(pad - 3, 3, 2.5, h - 6);
  ctx.fillStyle = CAMP[RED].dark; ctx.fillRect(w - pad + 0.5, 3, 2.5, h - 6);
  // the yellow middle
  var mx = pad + 5 * cw + mid / 2, pulse = g === 0 ? 1 + 0.12 * Math.max(0, Math.sin(clock * 5)) : 1;
  ctx.save(); ctx.translate(mx, h / 2); ctx.scale(pulse, pulse);
  ctx.fillStyle = WD_YELLOW; ctx.strokeStyle = "#8a6a1a"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, -7.5); ctx.lineTo(7.5, 0); ctx.lineTo(0, 7.5); ctx.lineTo(-7.5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  paperOff(S);
}
function drawWonder(B) {
  var sc = WD_SC[B.id], z = 1.6, home = sc.regions[0], wd = sc.regions[1], red = sc.regions[2];
  var hide = { 1: { foot: B.defend || B.fog || !wd.foot } };
  drawMap(sc, z, hide, null, { 1: true });
  if (B.fog) {
    var F = regionMask(sc, 1, "fog", function (g, W, H) {
      g.fillStyle = "rgba(236,240,246,.82)"; g.fillRect(0, 0, W, H);
      g.strokeStyle = "rgba(160,170,190,.5)"; g.lineWidth = 2;
      for (var x = -H; x < W; x += 14) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + H, H); g.stroke(); }
    });
    ctx.drawImage(F, 0, 0, sc.w, sc.h);
  }
  var wh = TALL.wonder * z * 0.95;
  brightWonder(wd.x, wd.y + 10, wh);
  if (B.march) {
    var pts = curve([home.x + 10, home.y - 30], [wd.x - 6, wd.y + 10], -0.12, 30, 40);
    paperArrow(pts, CAMP[BLUE]);
    var m = along(pts, 0.45);
    sprite(beadSprite("infantry", BLUE, 32), m[0], m[1]);
    floatPin(0, "wdpin", wd.x + 112, wd.y + 4, "6 vs 5", OK_COL, 0);
  }
  if (B.red) {
    var rp = curve([red.x - 10, red.y + 20], [wd.x + 34, wd.y - 10], 0.15, 30, 40);
    paperArrow(rp, CAMP[RED]);
    var rm = along(rp, 0.45);
    sprite(beadSprite("infantry", RED, 32), rm[0], rm[1]);
  }
  if (B.defend) {
    var fs = spot(wd, "infantry", 0, z), D = 60;
    sprite(ringSprite("infantry", BLUE, D, OK_COL), fs[0], fs[1] - D * 0.6);
  }
  gaugeAt(wd.x - 4, 40, B.g, B.step, B.id);
  if (B.tie) plate("verdict", "wdtie", wd.x + 92, wd.y + 40, "Even", TIE_COL, "#fff", 22);
  if (B.verdict) plate("verdict", "wdv" + B.id, sc.w / 2, sc.h - 34, B.verdict[0], B.verdict[1], "#fff", 22);
}
// One run, bell by bell: who held the wonder after each bell (0: even) and where the gauge stood.
var WD_RUN = [BLUE, BLUE, BLUE, BLUE, 0, RED, RED, BLUE, BLUE, BLUE];
function miniGauge(cx, cy, g) {
  var cw = 5, mid = 8, w = cw * 10 + mid, x0 = cx - w / 2;
  for (var k = 1; k <= 5; k++) {
    ctx.fillStyle = g >= k ? CAMP[BLUE].base : ppTint(CAMP[BLUE].base, 0.72); ctx.fillRect(x0 + (5 - k) * cw, cy - 7, cw - 1, 14);
    ctx.fillStyle = g <= -k ? CAMP[RED].base : ppTint(CAMP[RED].base, 0.72); ctx.fillRect(x0 + 5 * cw + mid + (k - 1) * cw + 1, cy - 7, cw - 1, 14);
  }
  ctx.fillStyle = WD_YELLOW; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
}
function drawWonderRun() {
  var W = 860, n = WD_RUN.length, cw = 66, gap = 6, x0 = 112, g = 0, i;
  ctx.fillStyle = "#e9dcb8"; ctx.fillRect(0, 0, W, 300);
  ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.fillStyle = INK; ctx.font = font(20, true);
  ctx.fillText("Held by", 20, 70); ctx.fillText("Gauge", 20, 150); ctx.fillText("Step", 20, 205);
  for (i = 0; i < n; i++) {
    var o = WD_RUN[i], x = x0 + i * (cw + gap), cx = x + cw / 2;
    if (o === BLUE) g = Math.min(WONDER_HOLD, g + 1); else if (o === RED) g = Math.max(-WONDER_HOLD, g - 1);
    ctx.textAlign = "center"; ctx.fillStyle = INK; ctx.font = font(18, false);
    ctx.fillText("Bell " + (i + 1), cx, 26);
    var S = paperOn("tag", "own" + i + o, x + 6, 48, cw - 12, 44, { fill: o ? CAMP[o].base : TIE_COL });
    if (!o) { ctx.font = font(18, true); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.fillText("even", (cw - 12) / 2, 23); }
    paperOff(S);
    miniGauge(cx, 138, g);
    ctx.font = font(18, true); ctx.textAlign = "center";
    ctx.fillStyle = g > 0 ? CAMP[BLUE].dark : g < 0 ? CAMP[RED].dark : "#8a6a1a";
    ctx.fillText(Math.abs(g) + " / 5", cx, 164);
    ctx.fillStyle = o === BLUE ? CAMP[BLUE].dark : o === RED ? CAMP[RED].dark : "rgba(42,36,24,.5)";
    ctx.fillText(o === BLUE ? "→ blue" : o === RED ? "→ red" : "holds", cx, 205);
    if (g === WONDER_HOLD) plate("verdict", "wdrun", cx, 262, "Won", OK_COL, "#fff", 20);
  }
  ctx.strokeStyle = "rgba(42,36,24,.25)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(16, 112); ctx.lineTo(W - 16, 112); ctx.moveTo(16, 184); ctx.lineTo(W - 16, 184); ctx.stroke();
}

// ======================================================================
//  THE PAGE — one canvas a cell, every cell redrawn each frame (the pins,
//  the rosettes and the ghosts breathe).
// ======================================================================
var DEFAULTS = { view: "upg", lvl: 18, stamp: 48, vals: 1, isnew: 1, arrow: 1 };
var STORE_KEY = "foldiers-upgrades";
var S = {};
(function () {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { saved = null; }
  for (var k in DEFAULTS) S[k] = saved && saved[k] !== undefined ? saved[k] : DEFAULTS[k];
})();
if (location.hash.length > 1) location.hash.slice(1).split("&").forEach(function (p) {
  var kv = p.split("="); if (kv.length > 1 && kv[0] in DEFAULTS) S[kv[0]] = isNaN(+kv[1]) ? kv[1] : +kv[1];
});
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* private window */ } }

var stage = document.getElementById("stage"), CELLS = [];
function group(title) {
  var g = document.createElement("div"), h = document.createElement("h2"), c = document.createElement("div");
  g.className = "group"; h.textContent = title; c.className = "cells";
  g.appendChild(h); g.appendChild(c); stage.appendChild(g);
  return c;
}
function addCell(box, name, what, w, h, cssW, draw) {
  var d = document.createElement("div"), cv = document.createElement("canvas");
  d.className = "cell"; d.appendChild(cv);
  var n = document.createElement("div"); n.className = "name"; n.textContent = name; d.appendChild(n);
  var t = document.createElement("div"); t.className = "what"; t.textContent = what; t.style.maxWidth = cssW + "px"; d.appendChild(t);
  box.appendChild(d);
  var R = (window.devicePixelRatio || 1) * cssW / w;
  cv.width = Math.round(w * R); cv.height = Math.round(h * R);
  cv.style.width = cssW + "px"; cv.style.height = Math.round(cssW * h / w) + "px";
  CELLS.push({ cv: cv, g: cv.getContext("2d"), R: R, draw: draw });
}
function build() {
  stage.innerHTML = ""; CELLS = [];
  document.querySelectorAll("[data-for]").forEach(function (el) { el.style.display = el.dataset.for === S.view ? "block" : "none"; });
  if (S.view === "upg") {
    var box = group("Upgrades in force at stage " + S.lvl);
    UPG_LOOKS.forEach(function (L) { addCell(box, L[1], L[2], 720, 620, 460, function () { drawUpg(L[0], S); }); });
    document.getElementById("upglist").textContent = upgradesAt(S.lvl).map(function (u) { return u.name + " (" + u.at + ")"; }).join(" · ") || "None yet";
  } else if (S.view === "fight") {
    FIGHTS.forEach(function (F) {
      var box = group(F.name);
      FIGHT_LOOKS.forEach(function (L, i) { addCell(box, L[1], L[2], 420, 400, 320, function () { drawFight(F, L[0], i); }); });
    });
  } else if (S.view === "works") {
    var b1 = group("Palisade"), b2 = group("Bridge");
    WORKS.forEach(function (W) { addCell(W[0].indexOf("pal") === 0 ? b1 : b2, W[1], W[2], 420, 360, 320, function () { drawWorks(W[0]); }); });
  } else if (S.view === "wonder") {
    var wb = group("The wonder's gauge — how a stage with a wonder plays out (stage 22)");
    WD_BEATS.forEach(function (B) { addCell(wb, B.name, B.what, 420, 380, 320, function () { drawWonder(B); }); });
    var wr = group("The count, bell by bell");
    addCell(wr, "One run", "Blue takes it and holds four bells, bell 5 ends even (the gauge holds), Red holds two bells (back to 2), Blue takes it back: Blue's end at bell 10.", 860, 300, 660, drawWonderRun);
  } else {
    ["snow", "storm"].forEach(function (kind) {
      var box = group(kind === "snow" ? "Snow — takes half the troops at the next bell" : "Storm — takes every troop at the next bell");
      WX_LOOKS.forEach(function (L, i) { addCell(box, L[1], L[2], 420, 380, 320, function () { drawWx(kind, L[0], i); }); });
    });
  }
}
var t0 = performance.now();
function frame(now) {
  clock = (now - t0) / 1000;
  CELLS.forEach(function (c) {
    view.dpr = c.R; ctx = c.g;
    ctx.setTransform(c.R, 0, 0, c.R, 0, 0);
    ctx.clearRect(0, 0, c.cv.width, c.cv.height);
    c.draw();
  });
  requestAnimationFrame(frame);
}

// ---- the panel -------------------------------------------------------------
function seg(id, field, num) {
  var el = document.getElementById(id);
  function sync() { [].forEach.call(el.children, function (b) { b.classList.toggle("on", String(S[field]) === b.dataset.v); }); }
  el.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    S[field] = num ? +b.dataset.v : b.dataset.v; sync(); save(); build();
  });
  sync();
}
function slider(id, fmt) {
  var el = document.getElementById(id), out = document.getElementById("o-" + id);
  function sync() { el.value = S[id]; out.textContent = fmt(S[id]); }
  el.addEventListener("input", function () { S[id] = +el.value; sync(); save(); build(); });
  sync();
}
seg("view", "view"); seg("vals", "vals", true); seg("isnew", "isnew", true); seg("arrow", "arrow", true);
slider("lvl", function (v) { return String(v); });
slider("stamp", function (v) { return v + " px"; });
document.getElementById("bell").addEventListener("click", function () { bellAt = clock; });
document.getElementById("copy").addEventListener("click", function () {
  var txt = JSON.stringify(S);
  var done = function () { document.getElementById("copied").textContent = "Copied: " + txt; };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, function () { document.getElementById("copied").textContent = txt; });
  else document.getElementById("copied").textContent = txt;
});
build();
requestAnimationFrame(frame);
// #view=wx&bell rings the bell half a second in (a headless shot of the strike)
if (/[#&]bell/.test(location.hash)) setTimeout(function () { bellAt = clock; }, 500);
</script>
</body>
