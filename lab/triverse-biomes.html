        nextItemP = s.p + len + R.range(280, 380); return true;
      }
      if (kind === "comet") {
        items.push({ type: "comet", path: R.int(0, 2), p: p + 300, v: R.range(220, 360) });
        nextItemP = p + R.range(360, 480); return true;
      }
      return false;
    }
    function spawnItems(horizon) {
      while (nextItemP < horizon) {
        const p = nextItemP, rule = B().rule;
        const rk = rule === "all" ? R.pick(["gate", "break", "comet"]) : rule;
        if ((rk === "gate" || rk === "break" || rk === "comet") && R.chance(rule === "all" ? 0.22 : 0.3)) {
          if (spawnRule(rk, p)) continue;
        }
        if (R.chance(0.5) && p - lastHazardP > 300) {
          if (R.chance(0.25)) {
            buildAll(p + T.hazardClear + 60);
            const free = R.int(0, 2);
            if (crossingFree(free, p)) {
              items.push({ type: "mine", path: (free + 1) % 3, p, seed: R.range(0, TAU) });
              items.push({ type: "mine", path: (free + 2) % 3, p, seed: R.range(0, TAU) });
              lastHazardP = p; nextItemP = p + R.range(480, 620); continue;
            }
          }
          const s = spot(p);
          if (s) {
            items.push({ type: R.chance(0.72) ? "mine" : "void", path: s.path, p: s.p, seed: R.range(0, TAU) });
            lastHazardP = s.p; nextItemP = s.p + R.range(300, 460);
          } else nextItemP = p + R.range(200, 320);
        } else if (R.chance(0.18)) {
          items.push({ type: R.pick(["x2", "shield", "star"]), path: R.int(0, 2), p, seed: 0 });
          nextItemP = p + R.range(250, 380);
        } else {
          const lp = R.chance(0.45) ? Wd.lane : (Wd.lane + 1 + R.int(0, 1)) % 3, n = R.int(3, 5), gap = R.range(70, 92);
          for (let i = 0; i < n; i++) items.push({ type: "gem", path: lp, p: p + i * gap, seed: 0 });
          nextItemP = p + n * gap + R.range(140, 240);
        }
      }
    }

    /* ---- the autopilot: hop away from what is coming, sometimes for fun --- */
    function blocked(l, d) {
      const rule = S.rule;
      for (const it of items) {
        if (it.type === "gate") { if (rule && it.p > Wd.camP && it.p < Wd.camP + d && it.rope !== l) return true; continue; }
        if (it.path !== l) continue;
        if (it.type === "break") { if (rule && it.p < Wd.camP + d && it.p + it.len > Wd.camP) return true; continue; }
        if (it.type === "comet" && !rule) continue;
        if ((it.type === "mine" || it.type === "void" || it.type === "comet") && it.p > Wd.camP && it.p < Wd.camP + d) return true;
      }
      return false;
    }
    function neighbours() {
      const o = [0, 1, 2].sort((u, v) => pathX(u, Wd.camP) - pathX(v, Wd.camP)), k = o.indexOf(Wd.lane), n = [];
      if (k > 0) n.push(o[k - 1]);
      if (k < 2) n.push(o[k + 1]);
      return n;
    }
    function hop(to) {
      // the side it hops to, for the lean (the game's switchDir)
      Wd.switchDir = pathX(to, Wd.camP) > pathX(Wd.lane, Wd.camP) ? 1 : -1;
      Wd.prevLane = Wd.lane; Wd.lane = to; Wd.switchT = 0; Wd.heat = 0;
    }

    Wd.reset = function () {
      paths = [0, 1, 2].map(i => ({ idx: i, segs: [] }));
      genP = 0; sway = 0; onGrid = true; slotRope = [0, 1, 2];
      curX = [slotX(0), slotX(1), slotX(2)];
      items = []; nextItemP = 700; lastHazardP = -1e9;
      Wd.camP = 0; Wd.lane = 1; Wd.prevLane = 1; Wd.switchT = 1; Wd.heat = 0; Wd.trail = [];
      pushRails(0);
      buildAll(1800);
    };

    Wd.update = function (dt) {
      Wd.t += dt;
      Wd.camP += S.speed * dt;
      buildAll(Wd.camP + 1800);
      spawnItems(Wd.camP + 1650);
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        if (it.type === "comet") it.p -= it.v * dt;
        if ((it.p + (it.len || 0)) < Wd.camP - 400) items.splice(i, 1);
      }
      if (Wd.switchT < 1) Wd.switchT = Math.min(1, Wd.switchT + dt / T.switchTime);
      Wd.hopT -= dt;
      if (Wd.switchT >= 1 && (Wd.hopT <= 0 || blocked(Wd.lane, 460))) {
        const ns = neighbours().filter(n => !blocked(n, 460));
        if (ns.length) hop(R.pick(ns));
        Wd.hopT = R.range(0.9, 1.9);
      }
      if (S.rule && (B().rule === "heat" || B().rule === "all")) Wd.heat = Math.min(1, Wd.heat + dt / 2.4);
      else Wd.heat = 0;
      // lightning, for the rain
      Wd.flashT = Math.max(0, Wd.flashT - dt);
      Wd.flashIn -= dt;
      if (Wd.flashIn <= 0) {
        Wd.flashIn = R.range(2.5, 6);
        if (B().particles === "rain") {
          Wd.flashT = 0.38;
          const pts = []; let x = R.range(120, 600), y = -20;
          const end = H * R.range(0.32, 0.55);
          while (y < end) { pts.push([x, y]); y += R.range(40, 80); x += R.range(-46, 46); }
          Wd.bolt = pts;
        }
      }
      // the decorative comets of the comet sky
      for (let i = Wd.deco.length - 1; i >= 0; i--) {
        const d = Wd.deco[i]; d.x += d.vx * dt; d.y += d.vy * dt;
        if (d.y > H + 200 || d.x < -300) Wd.deco.splice(i, 1);
      }
      if (B().particles === "comets" && Wd.deco.length < Math.round(2 * B().density) && R.chance(dt * 0.9)) {
        const sp = R.range(520, 900);
        Wd.deco.push({ x: R.range(300, 900), y: R.range(-160, H * 0.3), vx: -sp * 0.62, vy: sp * 0.78, len: R.range(160, 260) });
      }
    };

    /* ---- drawing --------------------------------------------------------- */
    const sy = y => ANCHOR - (y - Wd.camP);

    Wd.drawBackdrop = function (ctx, still) {
      const b = B();
      drawGround(ctx, b);
      if (S.particles) drawParticles(ctx, b, Wd, still);
    };

    function brokenAt(i, p) {
      if (!S.rule) return null;
      for (const it of items) if (it.type === "break" && it.path === i && p >= it.p && p <= it.p + it.len) return it;
      return null;
    }

    function drawPath(ctx, i, hot) {
      const b = B(), segs = paths[i].segs, pMin = Wd.camP - (H - ANCHOR) - 200, pMax = Wd.camP + ANCHOR + 200;
      let col = b.ropes[i];
      if (hot && Wd.heat > 0) col = mix(col, "#ffffff", Math.round(Wd.heat * 5) / 10);
      for (const s of segs) {
        if (s.p1 < pMin || s.p0 > pMax) continue;
        const k0 = Math.max(0, Math.floor((pMin - s.p0) / s.step)), k1 = Math.ceil((Math.min(pMax, s.p1) - s.p0) / s.step);
        for (let k = k0; k <= k1; k++) {
          const p = s.p0 + k * s.step;
          if (p > s.p1) break;
          if (brokenAt(i, p)) continue;
          segEval(s, p, pa);
          const y = sy(pa.y);
          if (y < -40 || y > H + 40) continue;
          segEval(s, p + 2, pb);
          const ang = Math.atan2(-(pb.y - pa.y), pb.x - pa.x);
          drawDot(ctx, b.material, col, hot, pa.x, y, ang, k, s.step, Wd.t, hot ? Wd.heat : 0);
        }
      }
    }

    function drawRule(ctx) {
      for (const it of items) {
        if (it.type === "gate") {
          const y = sy(it.p);
          if (y < -60 || y > H + 60) continue;
          const xs = [0, 1, 2].map(i => ({ i, x: pathPoint(i, it.p, pa).x }));
          drawGate(ctx, y, xs, it.rope, B().ropes);
        } else if (it.type === "break") {
          for (const end of [it.p, it.p + it.len]) {
            pathPoint(it.path, end, pa);
            const y = sy(pa.y);
            if (y > -40 && y < H + 40) drawSnap(ctx, pa.x, y, Wd.t + end);
          }
        }
      }
    }

    function drawItems(ctx) {
      for (const it of items) {
        if (it.type === "gate" || it.type === "break") continue;
        if (it.type === "comet") {
          if (!S.rule) continue;
          const tail = [];
          for (let q = 0; q <= 240; q += 16) { pathPoint(it.path, it.p + q, pa); tail.push([pa.x, sy(pa.y)]); }
          if (tail[0][1] > -80 && tail[0][1] < H + 80) drawComet(ctx, tail, Wd.t);
          continue;
        }
        if (!S.items) continue;
        pathPoint(it.path, it.p, pa);
        const y = sy(pa.y);
        if (y < -70 || y > H + 70) continue;
        drawItem(ctx, it.type, pa.x, y, B().ropes[it.path], Wd.t, it.seed);
      }
    }

    function drawArrowAll(ctx) {
      const e = ease(Wd.switchT);
      pathPoint(Wd.lane, Wd.camP, pa);
      let x = pa.x, y = pa.y;
      if (Wd.switchT < 1) { pathPoint(Wd.prevLane, Wd.camP, pb); x = pb.x + (pa.x - pb.x) * e; y = pb.y + (pa.y - pb.y) * e; }
      pathPoint(Wd.lane, Wd.camP + 7, pb); pathPoint(Wd.lane, Wd.camP - 7, pc);
      let ang = Math.atan2(-(pb.y - pc.y), pb.x - pc.x);
      if (Wd.switchT < 1) ang += Wd.switchDir * 0.5 * Math.sin(Math.PI * Wd.switchT);   // lean into the hop
      Wd.trail.push({ x, y }); if (Wd.trail.length > 18) Wd.trail.shift();
      drawTrail(ctx, Wd.trail.map(p => ({ x: p.x, y: sy(p.y) })), B().ropes[Wd.lane]);
      drawArrow(ctx, B().arrow, x, sy(y), ang, B().ropes[Wd.lane], S.rule && (B().rule === "heat" || B().rule === "all") ? Wd.heat : -1);
    }

    Wd.render = function (ctx) {
      Wd.drawBackdrop(ctx);
      for (let i = 0; i < 3; i++) if (i !== Wd.lane) drawPath(ctx, i, false);
      drawPath(ctx, Wd.lane, true);
      if (S.rule) drawRule(ctx);
      drawItems(ctx);
      if (S.arrow) drawArrowAll(ctx);
    };

    Wd.reset();
    return Wd;
  }

  /* =========================================================================
     DRAWING — pure functions, shared by the live cards and the item sheet.
     ========================================================================= */
  function drawGround(ctx, b) {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.3, 40, W * 0.5, H * 0.42, H * 0.95);
    g.addColorStop(0, b.ground[0]); g.addColorStop(0.55, b.ground[1]); g.addColorStop(1, b.ground[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (b.glowA > 0) {
      const r = ctx.createRadialGradient(W * 0.5, H * 1.08, 20, W * 0.5, H * 1.08, H * 0.75);
      r.addColorStop(0, rgba(b.glow, b.glowA)); r.addColorStop(1, rgba(b.glow, 0));
      ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
    }
  }

  /* The particle fields, built once per kind and density, then scrolled off
     the camera with their own parallax — the way `sparks` already is. */
  function buildParts(w, b) {
    const key = b.particles + ":" + b.density;
    if (w.partKey === key) return;
    w.partKey = key;
    const R = makeRand(9001 + w.bi), n = Math.round(b.density * ({ stars: 70, shards: 34, rain: 90, comets: 60, embers: 60, grid: 30, bubbles: 40, snow: 80 })[b.particles]);
    w.parts = [];
    for (let i = 0; i < n; i++) {
      const star = i < n * 0.68;
      // Prism shards stay out of red, violet and pink: those hues belong to the hazards and the pink rope.
      const hues = [R.range(40, 70), R.range(120, 170), R.range(185, 250)];
      w.parts.push({
        x: R.range(0, W), y: R.range(0, H + 80), star, a: R.range(0.25, 0.6),
        w: star ? R.range(2, 3.4) : 2, h: star ? R.range(2, 3.4) : R.range(40, 110),
        par: star ? R.range(0.16, 0.42) : R.range(0.85, 1.3),
        r: R.range(5, 13), rot: R.range(0, TAU), spin: R.range(-0.8, 0.8), hue: R.pick(hues),
        v: R.range(900, 1500), len: R.range(30, 70), rise: R.range(60, 150), ph: R.range(0, TAU), f: R.range(4, 11)
      });
    }
  }

  function drawParticles(ctx, b, w, still) {
    buildParts(w, b);
    const span = H + 80, t = w.t, cam = w.camP;
    const wrap = y => { y %= span; return y < 0 ? y + span : y; };
    ctx.save();
    if (b.particles === "stars" || b.particles === "comets") {
      ctx.fillStyle = b.tint;
      for (const s of w.parts) {
        if (b.particles === "comets" && !s.star) continue;          // a still sky: no speed streaks
        ctx.globalAlpha = s.star ? s.a : s.a * 0.22;
        ctx.fillRect(s.x, wrap(s.y + cam * s.par) - 40, s.w, s.h);
      }
      if (b.particles === "comets") {
        for (const d of w.deco) {
          const nx = -0.62, ny = 0.78, g = ctx.createLinearGradient(d.x, d.y, d.x - nx * d.len, d.y - ny * d.len);
          g.addColorStop(0, rgba(b.tint, 0.75)); g.addColorStop(1, rgba(b.tint, 0));
          ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - nx * d.len, d.y - ny * d.len); ctx.stroke();
          ctx.fillStyle = rgba(b.tint, 0.9); ctx.beginPath(); ctx.arc(d.x, d.y, 3.2, 0, TAU); ctx.fill();
        }
      }
    } else if (b.particles === "shards") {
      // three wide beams of refracted light, drifting, under the shards
      for (let i = 0; i < 3; i++) {
        const x = ((i * 290 + t * 14) % (W + 500)) - 250;
        ctx.save(); ctx.translate(x, H * 0.5); ctx.rotate(-0.36);
        const g = ctx.createLinearGradient(-90, 0, 90, 0);
        g.addColorStop(0, rgba(b.tint, 0)); g.addColorStop(0.5, rgba(b.tint, 0.07)); g.addColorStop(1, rgba(b.tint, 0));
        ctx.fillStyle = g; ctx.fillRect(-90, -H, 180, H * 2);
        ctx.restore();
      }
      for (const s of w.parts) {
        const y = wrap(s.y + cam * (s.par * 0.6)) - 40;
        ctx.save(); ctx.translate(s.x, y); ctx.rotate(s.rot + t * s.spin);
        ctx.globalAlpha = s.a * 0.7;
        ctx.fillStyle = "hsl(" + s.hue + ",90%,72%)";
        ctx.beginPath(); ctx.moveTo(0, -s.r); ctx.lineTo(s.r * 0.4, 0); ctx.lineTo(0, s.r); ctx.lineTo(-s.r * 0.4, 0); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    } else if (b.particles === "rain") {
      if (w.flashT > 0 && !still) {
        const k = w.flashT / 0.38;
        ctx.globalAlpha = 0.10 * k; ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
        if (w.bolt) {
          ctx.lineJoin = "round"; ctx.lineCap = "round";
          for (const [lw, a] of [[14, 0.12], [4, 0.5]]) {
            ctx.globalAlpha = a * k; ctx.strokeStyle = b.tint; ctx.lineWidth = lw;
            ctx.beginPath(); w.bolt.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
          }
        }
      }
      ctx.strokeStyle = b.tint; ctx.lineWidth = 2; ctx.lineCap = "round";
      for (const s of w.parts) {
        const y = wrap(s.y + cam * s.par * 0.5 + t * s.v * 0.5) - 40;
        ctx.globalAlpha = s.a * 0.45;
        ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x - s.len * 0.22, y + s.len); ctx.stroke();
      }
    } else if (b.particles === "embers") {
      ctx.fillStyle = b.tint;
      for (const s of w.parts) {
        const y = wrap(s.y + cam * 0.12 - t * s.rise) - 40;
        const x = s.x + Math.sin(t * 1.3 + s.ph) * 14;
        ctx.globalAlpha = s.a * (0.55 + 0.45 * Math.sin(t * s.f + s.ph));
        ctx.beginPath(); ctx.arc(x, y, s.w * 0.8, 0, TAU); ctx.fill();
      }
    } else if (b.particles === "bubbles") {
      ctx.strokeStyle = b.tint; ctx.lineWidth = 2;
      for (const s of w.parts) {
        const y = wrap(s.y + cam * 0.15 - t * s.rise * 0.7) - 40;
        const x = s.x + Math.sin(t * 1.7 + s.ph) * 10;
        ctx.globalAlpha = s.a * 0.6;
        ctx.beginPath(); ctx.arc(x, y, 3 + s.r * 0.45, 0, TAU); ctx.stroke();
      }
    } else if (b.particles === "snow") {
      ctx.fillStyle = b.tint;
      for (const s of w.parts) {
        const y = wrap(s.y + cam * s.par * 0.5 + t * 50 * s.par) - 40;
        const x = s.x + Math.sin(t * 0.9 + s.ph) * 22;
        ctx.globalAlpha = s.a * 0.8;
        ctx.beginPath(); ctx.arc(x, y, 1.5 + s.w * 0.6, 0, TAU); ctx.fill();
      }
    } else if (b.particles === "grid") {
      /* The synthwave floor: a perspective grid under a horizon, rolling toward
         the player with the camera, stars above it. It stays faint — the ropes
         run over it and must not be read as one of its lines. */
      const hz = H * 0.36, a = Math.min(1, b.density);
      ctx.fillStyle = "#ffffff";
      for (const s of w.parts) {
        if (s.y > hz) continue;
        ctx.globalAlpha = s.a * 0.7; ctx.fillRect(s.x, s.y, 2, 2);
      }
      ctx.strokeStyle = b.tint; ctx.lineWidth = 2;
      const roll = (cam / 220) % 1;
      for (let i = 0; i < 14; i++) {
        const z = (i + roll) / 14, y = hz + (H - hz) * z * z;
        ctx.globalAlpha = 0.28 * z * a;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      for (let j = -9; j <= 9; j++) {
        ctx.globalAlpha = 0.16 * a;
        ctx.beginPath(); ctx.moveTo(W / 2 + j * 14, hz); ctx.lineTo(W / 2 + j * 130, H); ctx.stroke();
      }
      ctx.globalAlpha = 0.5 * a; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, hz); ctx.lineTo(W, hz); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- the rope's material: one dot -------------------------------------
     dots, beads and rings are one sprite per colour (what `dotSprite` does
     today, no per-frame cost); dashes and links follow the rope's tangent,
     so in the game they would be a stroke per dot instead of a drawImage. */
  const SPR = new Map();
  function sprite(mat, color, hot) {
    const key = mat + color + hot;
    if (SPR.has(key)) return SPR.get(key);
    const s = hot ? 46 : 38, c = document.createElement("canvas"), h = s / 2;
    c.width = s; c.height = s;
    const k = c.getContext("2d");
    const g = k.createRadialGradient(h, h, 0, h, h, h);
    g.addColorStop(0, rgba(color, hot ? 0.55 : 0.26)); g.addColorStop(0.45, rgba(color, hot ? 0.2 : 0.08)); g.addColorStop(1, rgba(color, 0));
    k.fillStyle = g; k.fillRect(0, 0, s, s);
    if (mat === "dots") {
      k.fillStyle = color; k.beginPath(); k.arc(h, h, hot ? 7.5 : 5.2, 0, TAU); k.fill();
      if (hot) { k.fillStyle = "rgba(255,255,255,.92)"; k.beginPath(); k.arc(h, h, 3.4, 0, TAU); k.fill(); }
    } else if (mat === "beads") {
      const r = hot ? 9.5 : 7.2;
      k.beginPath(); k.moveTo(h, h - r); k.lineTo(h + r, h); k.lineTo(h, h + r); k.lineTo(h - r, h); k.closePath();
      k.fillStyle = color; k.fill();
      k.beginPath(); k.moveTo(h, h - r); k.lineTo(h, h); k.lineTo(h - r, h); k.closePath();
      k.fillStyle = "rgba(255,255,255,.55)"; k.fill();
      k.beginPath(); k.moveTo(h, h + r); k.lineTo(h + r, h); k.lineTo(h, h); k.closePath();
      k.fillStyle = "rgba(0,0,0,.28)"; k.fill();
      if (hot) { k.fillStyle = "#ffffff"; k.beginPath(); k.arc(h - r * 0.3, h - r * 0.3, 2, 0, TAU); k.fill(); }
    } else {                                                     // rings
      k.strokeStyle = color; k.lineWidth = hot ? 3.6 : 3;
      k.beginPath(); k.arc(h, h, hot ? 8.5 : 6.5, 0, TAU); k.stroke();
      if (hot) { k.fillStyle = "#ffffff"; k.beginPath(); k.arc(h, h, 2.6, 0, TAU); k.fill(); }
    }
    SPR.set(key, c);
    return c;
  }

  function drawDot(ctx, mat, color, hot, x, y, ang, k, step, t, heat) {
    if (mat === "dots" || mat === "beads" || mat === "rings") {
      const s = sprite(mat, color, hot);
      ctx.drawImage(s, x - s.width / 2, y - s.height / 2);
      return;
    }
    const ux = Math.cos(ang), uy = Math.sin(ang);
    if (mat === "dashes") {
      // an electric dash, crackling sideways a little every twentieth of a second
      const len = step * 0.36, j = (hash(k * 7.1 + Math.floor(t * 20)) - 0.5) * 5;
      const cx = x - uy * j, cy = y + ux * j;
      ctx.lineCap = "round";
      ctx.strokeStyle = rgba(color, hot ? 0.32 : 0.16); ctx.lineWidth = hot ? 15 : 11;
      ctx.beginPath(); ctx.moveTo(cx - ux * len, cy - uy * len); ctx.lineTo(cx + ux * len, cy + uy * len); ctx.stroke();
      ctx.strokeStyle = color; ctx.lineWidth = hot ? 5 : 3.6;
      ctx.beginPath(); ctx.moveTo(cx - ux * len, cy - uy * len); ctx.lineTo(cx + ux * len, cy + uy * len); ctx.stroke();
      if (hot) {
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(cx - ux * len, cy - uy * len); ctx.lineTo(cx + ux * len, cy + uy * len); ctx.stroke();
      }
      return;
    }
    // links: a chain, one link seen flat, the next edge-on; the ridden rope glows with its heat
    const glowA = (hot ? 0.3 : 0.14) + heat * 0.35;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    if (k % 2 === 0) {
      ctx.strokeStyle = rgba(color, glowA); ctx.lineWidth = hot ? 11 : 9;
      ctx.beginPath(); ctx.ellipse(0, 0, step * 0.5, 7, 0, 0, TAU); ctx.stroke();
      ctx.strokeStyle = color; ctx.lineWidth = hot ? 4 : 3.2;
      ctx.beginPath(); ctx.ellipse(0, 0, step * 0.5, 7, 0, 0, TAU); ctx.stroke();
    } else {
      ctx.lineCap = "round";
      ctx.strokeStyle = rgba(color, glowA); ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(-step * 0.42, 0); ctx.lineTo(step * 0.42, 0); ctx.stroke();
      ctx.strokeStyle = color; ctx.lineWidth = hot ? 5 : 4;
      ctx.beginPath(); ctx.moveTo(-step * 0.42, 0); ctx.lineTo(step * 0.42, 0); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- the items, as drawItem() in games/triverse/game.js --------------- */
  function halo(ctx, x, y, r, col) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, 0.5)); g.addColorStop(0.42, rgba(col, 0.16)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  function diamond(ctx, x, y, r, rot, top, mid, bot, ink) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, top); if (mid) g.addColorStop(0.5, mid); g.addColorStop(1, bot);
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.72, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.72, 0); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = Math.max(3.5, r * 0.2); ctx.strokeStyle = ink; ctx.stroke();
    ctx.restore();
  }
  function spiked(ctx, x, y, n, ro, ri, fill, ink, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * TAU, r = i % 2 ? ri : ro;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = Math.max(3.5, ro * 0.13); ctx.strokeStyle = ink; ctx.stroke();
    ctx.restore();
  }
  function drawItem(ctx, type, x, y, col, t, seed) {
    let pu;
    if (type === "gem") {
      halo(ctx, x, y, 36, col); diamond(ctx, x, y, 21, t * 1.6, "#ffffff", null, col, "rgba(4,5,15,.75)");
    } else if (type === "star") {
      pu = 1 + Math.sin(t * 5) * 0.07;
      halo(ctx, x, y, 52 * pu, "#ffd43b"); diamond(ctx, x, y, 31 * pu, -t * 1.2, "#fffbe8", "#ffd43b", "#ff9f1c", "#2b1a00");
    } else if (type === "mine") {
      pu = 1 + Math.sin(t * 7 + seed) * 0.09;
      halo(ctx, x, y, 66 * pu, "#ff2d55");
      spiked(ctx, x, y, 7, 47 * pu, 18, "#2b0410", "#ff2d55", seed - t * 0.85);
      ctx.fillStyle = "#ff2d55"; ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#ffe3ea"; ctx.beginPath(); ctx.arc(x, y, 6.5, 0, TAU); ctx.fill();
    } else if (type === "void") {
      halo(ctx, x, y, 54, "#a24bff");
      ctx.fillStyle = "#160a24"; ctx.beginPath(); ctx.arc(x, y, 31, 0, TAU); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = "#c07bff"; ctx.beginPath(); ctx.arc(x, y, 31, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#e8ccff"; ctx.fillRect(x - 16, y - 4, 32, 8);
    } else if (type === "x2") {
      halo(ctx, x, y, 46, "#a6ff3d");
      ctx.fillStyle = "#0c2a12"; ctx.beginPath(); ctx.arc(x, y, 28, 0, TAU); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = "#a6ff3d"; ctx.beginPath(); ctx.arc(x, y, 28, 0, TAU); ctx.stroke();
      ctx.fillStyle = "#eaffd0"; ctx.font = "900 32px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("x2", x, y + 1);
    } else {
      halo(ctx, x, y, 46, "#8ffff2");
      spiked(ctx, x, y, 6, 30, 27, "#062229", "#8ffff2", Math.PI / 6);
      ctx.fillStyle = "#d8fffb"; ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU); ctx.fill();
    }
  }

  /* ---- the four rules, as looks ------------------------------------------ */
  // A colour gate: a bar across the three ropes, in the colour of the one rope it lets through.
  function drawGate(ctx, y, xs, rope, ropes) {
    const col = ropes[rope], open = xs.find(o => o.i === rope).x, gap = 46;
    const runs = [[L.left - 20, open - gap], [open + gap, L.right + 20]];
    ctx.lineCap = "round";
    for (const [w, a] of [[20, 0.16], [7, 0.9], [2, 0.7]]) {
      ctx.strokeStyle = w === 2 ? rgba("#ffffff", a) : rgba(col, a); ctx.lineWidth = w;
      ctx.beginPath();
      for (const [x0, x1] of runs) if (x1 > x0) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
      ctx.stroke();
    }
    // two posts frame the opening
    ctx.fillStyle = col;
    for (const x of [open - gap, open + gap]) { ctx.fillRect(x - 4, y - 18, 8, 36); }
    // a lock on every other rope
    for (const o of xs) {
      if (o.i === rope) continue;
      ctx.save(); ctx.translate(o.x, y); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = "#0b0b14"; ctx.fillRect(-15, -15, 30, 30);
      ctx.lineWidth = 4; ctx.strokeStyle = col; ctx.strokeRect(-15, -15, 30, 30);
      ctx.restore();
    }
  }
  // The torn end of a broken rope: a few sparks, flickering.
  function drawSnap(ctx, x, y, t) {
    ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const a = hash(i * 3.7 + Math.floor(t * 18)) * TAU, l = 10 + hash(i + Math.floor(t * 18)) * 14;
      ctx.strokeStyle = i % 2 ? "#ffffff" : "#ffe9a8"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
    }
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
  }
  // A comet sliding down a rope at the arrow: the mine's red, a white-hot head, its tail up the rope.
  function drawComet(ctx, tail, t) {
    for (let i = tail.length - 1; i >= 1; i--) {
      const k = 1 - i / tail.length;
      ctx.fillStyle = rgba(COMET, 0.55 * k); ctx.beginPath(); ctx.arc(tail[i][0], tail[i][1], 4 + 12 * k, 0, TAU); ctx.fill();
    }
    const [x, y] = tail[0], pu = 1 + Math.sin(t * 14) * 0.08;
    halo(ctx, x, y, 58 * pu, COMET);
    ctx.fillStyle = COMET; ctx.beginPath(); ctx.arc(x, y, 19 * pu, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fff4f6"; ctx.beginPath(); ctx.arc(x, y + 3, 10, 0, TAU); ctx.fill();
  }

  function drawTrail(ctx, trail, col) {
    const n = trail.length;
    if (n < 2) return;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass ? "#ffffff" : rgba(col, 0.5);
      for (let i = 1; i < n; i++) {
        const t = i / n;
        ctx.globalAlpha = pass ? t * 0.4 : t * 0.75; ctx.lineWidth = (pass ? 5 : 16) * t;
        ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  /* ---- the arrow ----------------------------------------------------------
     `arrowPath` traces the outline of a shape in its own frame (point up),
     `drawArrow` fills it the game's way — white tip, rope-coloured belly,
     dark contour — over one soft halo, and adds the shape's own detail. */
  function poly(ctx, pts) { ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); }
  function arrowPath(ctx, shape) {
    ctx.beginPath();
    if (shape === "trident") poly(ctx, [0, -40, 7, -16, 19, -30, 16, 0, 27, 28, 0, 17, -27, 28, -16, 0, -19, -30, -7, -16]);
    else if (shape === "dart") poly(ctx, [0, -42, 10, -4, 22, 28, 7, 16, 0, 24, -7, 16, -22, 28, -10, -4]);
    else if (shape === "jet") poly(ctx, [0, -40, 7, -14, 7, -4, 32, 16, 32, 22, 7, 14, 9, 28, 0, 24, -9, 28, -7, 14, -32, 22, -32, 16, -7, -4, -7, -14]);
    else if (shape === "kite") poly(ctx, [0, -42, 18, -4, 0, 30, -18, -4]);
    else if (shape === "drop") {
      ctx.moveTo(0, -40);
      ctx.bezierCurveTo(10, -22, 22, -6, 22, 8);
      ctx.arc(0, 8, 22, 0, Math.PI, false);
      ctx.bezierCurveTo(-22, -6, -10, -22, 0, -40);
    } else if (shape === "prow") {
      // a beak whose base sits on the ball, so the contour is one line
      ctx.moveTo(0, -38); ctx.lineTo(11.6, -10.3);
      ctx.arc(0, 6, 20, -Math.PI / 2 + 0.62, -Math.PI / 2 - 0.62, false);
    } else poly(ctx, [0, -36, 26, 27, 0, 14, -26, 27]);              // chevron
    ctx.closePath();
  }
  // heat < 0: no gauge. The gauge is gold to orange — never the mine's red.
  function drawArrow(ctx, shape, x, y, ang, col, heat) {
    ctx.save(); ctx.translate(x, y);
    if (heat >= 0) {
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(0, 0, 52, 0, TAU); ctx.stroke();
      ctx.strokeStyle = mix("#ffd43b", "#ff8a1c", heat); ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(0, 0, 52, -Math.PI / 2, -Math.PI / 2 + TAU * heat); ctx.stroke();
    }
    ctx.rotate(ang + Math.PI / 2);
    let g = ctx.createRadialGradient(0, 0, 0, 0, 0, 54);
    g.addColorStop(0, rgba(col, 0.55)); g.addColorStop(0.4, rgba(col, 0.2)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 54, 0, TAU); ctx.fill();
    g = ctx.createLinearGradient(0, -40, 0, 28);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.55, col); g.addColorStop(1, "#ffffff");
    arrowPath(ctx, shape);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineJoin = "round"; ctx.lineWidth = 5; ctx.strokeStyle = "rgba(3,4,12,.9)"; ctx.stroke();
    // the detail that makes each shape more than a silhouette
    ctx.lineCap = "round";
    if (shape === "trident" || shape === "dart" || shape === "kite") {
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(0, shape === "trident" ? -30 : -32); ctx.lineTo(0, shape === "kite" ? 18 : 10); ctx.stroke();
    } else if (shape === "jet") {
      ctx.fillStyle = "rgba(3,4,12,.75)"; ctx.beginPath(); ctx.ellipse(0, -16, 3.5, 8, 0, 0, TAU); ctx.fill();
    } else if (shape === "drop" || shape === "prow") {
      const cy = shape === "drop" ? 8 : 6;
      ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.beginPath(); ctx.arc(0, cy, 8.5, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* ---- the item sheet: every object at rest on the selected ground ------- */
  function renderSheet(ctx, w) {
    const b = BIOMES[w.bi], t = w.t;
    w.drawBackdrop(ctx, true);
    const label = (s, x, y) => {
      ctx.fillStyle = "rgba(232,230,245,.78)"; ctx.font = "600 22px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y);
    };
    const cols = [170, 360, 550];
    const rope = (i, x, y0, y1, hot, skip) => {
      for (let y = y0, k = 0; y <= y1; y += T.dot, k++) {
        if (skip && y > skip[0] && y < skip[1]) continue;
        drawDot(ctx, b.material, b.ropes[i], hot, x, y, -Math.PI / 2, k, T.dot, t, 0);
      }
    };
    // row 1: what costs
    drawItem(ctx, "mine", cols[0], 240, FIXED.mine, t, 0); label("Mine", cols[0], 340);
    drawItem(ctx, "void", cols[1], 240, FIXED.void, t, 0); label("Void", cols[1], 340);
    const tail = []; for (let q = 0; q <= 240; q += 16) tail.push([cols[2], 250 - q * 0.55]);
    drawComet(ctx, tail, t); label("Comet", cols[2], 340);
    // row 2: the gems, one per rope colour, sitting on their rope
    for (let i = 0; i < 3; i++) { rope(i, cols[i], 400, 520, false); drawItem(ctx, "gem", cols[i], 460, b.ropes[i], t, 0); }
    label("Gems", cols[1], 560);
    // row 3: what helps
    drawItem(ctx, "star", cols[0], 650, FIXED.star, t, 0); label("Mega gem", cols[0], 740);
    drawItem(ctx, "x2", cols[1], 650, FIXED.x2, t, 0); label("x2", cols[1], 740);
    drawItem(ctx, "shield", cols[2], 650, FIXED.shield, t, 0); label("Shield", cols[2], 740);
    // row 4: a colour gate over the three ropes, letting the pink one through
    for (let i = 0; i < 3; i++) rope(i, cols[i], 790, 900, i === 1);
    drawGate(ctx, 845, cols.map((x, i) => ({ i, x })), 1, b.ropes); label("Colour gate", cols[1], 940);
    // row 5: a broken rope, and the arrow riding a rope with its heat gauge
    rope(0, cols[0], 990, 1180, false, [1050, 1120]);
    drawSnap(ctx, cols[0], 1050, t); drawSnap(ctx, cols[0], 1120, t + 3); label("Broken rope", cols[0], 1225);
    rope(2, cols[2], 990, 1180, true);
    drawArrow(ctx, b.arrow, cols[2], 1085, -Math.PI / 2, b.ropes[2], 0.5 + 0.5 * Math.sin(t * 0.8)); label("Rope heat", cols[2], 1225);
  }

  /* =========================================================================
     THE PAGE
     ========================================================================= */
  let seed = 1;
  let worlds = BIOMES.map((b, i) => makeWorld(i, seed * 101 + i * 7));
  const grid = document.getElementById("grid");
  const cards = [], acards = [], pcards = [];

  function buildCards() {
    grid.innerHTML = ""; cards.length = 0;
    BIOMES.forEach((b, i) => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = '<canvas></canvas><div class="txt"><div class="name"></div><div class="note"></div>' +
                     '<div class="fit"></div><div class="chips"></div><div class="verdict"></div></div>';
      el.addEventListener("click", () => select(i));
      el.addEventListener("dblclick", () => { select(i); setView("focus"); });
      grid.appendChild(el);
      cards.push({ el, cv: el.querySelector("canvas") });
    });
    describe();
  }

  function describe() {
    BIOMES.forEach((b, i) => {
      const c = cards[i]; if (!c) return;
      c.el.classList.toggle("picked", i === S.sel);
      c.el.querySelector(".name").innerHTML = b.name + "<em>levels " + b.levels + "</em>";
      c.el.querySelector(".note").textContent = RULES[b.rule];
      c.el.querySelector(".fit").textContent = PARTICLES[b.particles] + " · " + MATERIALS[b.material] + " · " +
                                               FIGSETS[b.figures].label + " · " + ARROWS[b.arrow].label;
      const res = checks(b), bad = res.filter(r => r.why.length);
      c.el.querySelector(".chips").innerHTML = res.map(r =>
        '<span class="chip' + (r.why.length ? " warn" : "") + '" style="--c:' + r.col + '" title="' +
        (r.why.length ? r.why.join(", ") : "contrast " + r.ratio.toFixed(1)) + '">' + r.name + "</span>").join("");
      const v = c.el.querySelector(".verdict");
      v.className = "verdict" + (bad.length ? " bad" : "");
      v.textContent = bad.length ? bad.length + " to check — hover a chip" : "Everything reads on this ground";
    });
    const b = BIOMES[S.sel];
    document.getElementById("focus-cap").textContent = b.name + ", levels " + b.levels + " — " + RULES[b.rule];
    describeArrows();
  }

  /* ---- the preset catalogue: each preset as its five biomes, still -------- */
  function buildPresetCards() {
    const host = document.getElementById("presets");
    host.innerHTML = ""; pcards.length = 0;
    PRESETS.forEach((pr, pi) => {
      const el = document.createElement("div");
      el.className = "preset";
      el.innerHTML = "<h3></h3><div class=\"note\"></div><div class=\"row5\"></div>";
      el.querySelector("h3").innerHTML = pr.name + "<em>" + ARROWS[pr.arrow].label + "</em>";
      el.querySelector(".note").textContent = pr.note;
      const row = el.querySelector(".row5"), cells = [];
      pr.biomes.forEach(() => {
        const c = document.createElement("div");
        c.innerHTML = "<canvas></canvas><div class=\"bn\"></div><div class=\"bw\"></div>";
        row.appendChild(c); cells.push(c);
      });
      el.addEventListener("click", () => applyPreset(pi, false));
      host.appendChild(el);
      pcards.push({ el, cells });
    });
  }
  // Drawn once per visit (and on resize): twenty animated frames would be noise, not a comparison.
  function renderPresets() {
    PRESETS.forEach((pr, pi) => {
      const src = presetBiomes(pr), pc = pcards[pi];
      pc.el.classList.toggle("picked", S.preset === pi);
      src.forEach((b, i) => {
        const w = makeWorld(i, 77 + i * 13, src);
        for (let n = 0; n < 150; n++) w.update(1 / 60);
        draw(pc.cells[i].querySelector("canvas"), ctx => w.render(ctx));
        const bad = checks(b).filter(r => r.why.length), bw = pc.cells[i].querySelector(".bw");
        pc.cells[i].querySelector(".bn").textContent = b.name + " · levels " + b.levels;
        bw.className = "bw" + (bad.length ? " bad" : "");
        bw.textContent = bad.length ? bad.map(r => r.name + ": " + r.why[0]).join("; ") : "Everything reads";
      });
    });
  }
  function applyPreset(pi, onlySelected) {
    const pr = PRESETS[pi];
    BIOMES.forEach((b, i) => {
      if (onlySelected && i !== S.sel) return;
      Object.assign(b, clone(pr.biomes[i]), { arrow: pr.arrow });
      worlds[i] = makeWorld(i, seed * 101 + i * 7);
    });
    S.preset = onlySelected ? S.preset : pi;
    $("preset").value = pi;
    save(); syncPanel(); describe();
    if (S.view === "presets") renderPresets();
  }

  /* ---- the arrow catalogue: one card per shape, on the selected ground ---- */
  function buildArrowCards() {
    const host = document.getElementById("arrows");
    host.innerHTML = ""; acards.length = 0;
    Object.keys(ARROWS).forEach(key => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = '<canvas class="wide"></canvas><div class="txt"><div class="name"></div><div class="note"></div><div class="fit"></div></div>';
      el.querySelector(".name").textContent = ARROWS[key].label;
      el.querySelector(".note").textContent = ARROWS[key].note;
      el.addEventListener("click", () => { edit(b => { b.arrow = key; }); syncPanel(); });
      host.appendChild(el);
      acards.push({ key, el, cv: el.querySelector("canvas") });
    });
  }
  function describeArrows() {
    const b = BIOMES[S.sel];
    acards.forEach(c => {
      const worn = BIOMES.filter(o => o.arrow === c.key).map(o => o.name);
      c.el.classList.toggle("picked", c.key === b.arrow);
      c.el.querySelector(".fit").textContent = worn.length ? "Worn by " + worn.join(", ") : "Click to give it to " + b.name;
    });
    document.getElementById("arrows-cap").textContent = "On " + b.name + "'s ground and ropes, at 1.5 times the game's size. " +
      "The middle one rides the hot rope and leans into a hop, the way the game leans it. Click a shape to give it to " + b.name + ".";
  }
  // 480x360 design px shown, i.e. the 720-wide frame zoomed 1.5 times
  function renderArrowCard(ctx, key, t) {
    const b = BIOMES[S.sel], cols = [90, 240, 390];
    ctx.scale(1.5, 1.5);
    drawGround(ctx, b);
    for (let i = 0; i < 3; i++) {
      for (let y = -10, k = 0; y < 380; y += T.dot, k++) drawDot(ctx, b.material, b.ropes[i], i === 1, cols[i], y, -Math.PI / 2, k, T.dot, t, 0);
    }
    const lean = 0.5 * Math.sin(Math.PI * ((t * 0.7) % 1)) * (Math.floor(t * 0.7) % 2 ? 1 : -1);
    drawArrow(ctx, key, cols[0], 200, -Math.PI / 2, b.ropes[0], -1);
    drawArrow(ctx, key, cols[1], 200, -Math.PI / 2 + lean, b.ropes[1], -1);
    drawArrow(ctx, key, cols[2], 200, -Math.PI / 2, b.ropes[2], -1);
  }

  /* ---- panel ------------------------------------------------------------- */
  const $ = id => document.getElementById(id);
  function fill(sel, obj) { sel.innerHTML = Object.keys(obj).map(k => '<option value="' + k + '">' + (obj[k].label || obj[k]) + "</option>").join(""); }
  $("biome").innerHTML = BIOMES.map((b, i) => '<option value="' + i + '">' + b.name + " — levels " + b.levels + "</option>").join("");
  fill($("particles"), PARTICLES); fill($("material"), MATERIALS); fill($("figures"), FIGSETS); fill($("rule"), RULES);
  fill($("arrow"), ARROWS);
  $("preset").innerHTML = PRESETS.map((pr, i) => '<option value="' + i + '">' + pr.name + "</option>").join("");
  $("preset-all").addEventListener("click", () => applyPreset(+$("preset").value, false));
  $("preset-one").addEventListener("click", () => applyPreset(+$("preset").value, true));

  function syncPanel() {
    const b = BIOMES[S.sel];
    $("biome").value = S.sel;
    ["g0", "g1", "g2"].forEach((id, i) => { $(id).value = b.ground[i]; });
    $("glow").value = b.glow; $("glowA").value = Math.round(b.glowA * 100); $("glowA-v").textContent = b.glowA.toFixed(2);
    $("particles").value = b.particles; $("tint").value = b.tint;
    $("density").value = Math.round(b.density * 10); $("density-v").textContent = b.density.toFixed(1);
    $("material").value = b.material; $("figures").value = b.figures; $("rule").value = b.rule;
    ["r0", "r1", "r2"].forEach((id, i) => { $(id).value = b.ropes[i]; });
    $("arrow").value = b.arrow;
  }
  function select(i) { S.sel = i; syncPanel(); describe(); }
  function edit(fn, regen) {
    fn(BIOMES[S.sel]); save(); describe();
    if (regen) { worlds[S.sel] = makeWorld(S.sel, seed * 101 + S.sel * 7); }
  }
  $("biome").addEventListener("change", e => select(+e.target.value));
  ["g0", "g1", "g2"].forEach((id, i) => $(id).addEventListener("input", e => edit(b => { b.ground[i] = e.target.value; })));
  $("glow").addEventListener("input", e => edit(b => { b.glow = e.target.value; }));
  $("glowA").addEventListener("input", e => edit(b => { b.glowA = e.target.value / 100; $("glowA-v").textContent = b.glowA.toFixed(2); }));
  $("particles").addEventListener("change", e => edit(b => { b.particles = e.target.value; }));
  $("tint").addEventListener("input", e => edit(b => { b.tint = e.target.value; }));
  $("density").addEventListener("input", e => edit(b => { b.density = e.target.value / 10; $("density-v").textContent = b.density.toFixed(1); }));
  $("material").addEventListener("change", e => edit(b => { b.material = e.target.value; }));
  ["r0", "r1", "r2"].forEach((id, i) => $(id).addEventListener("input", e => edit(b => { b.ropes[i] = e.target.value; })));
  $("arrow").addEventListener("change", e => edit(b => { b.arrow = e.target.value; }));
  $("arrow-all").addEventListener("click", () => {
    const shape = BIOMES[S.sel].arrow;
    BIOMES.forEach(b => { b.arrow = shape; }); save(); describe();
  });
  $("figures").addEventListener("change", e => edit(b => { b.figures = e.target.value; }, true));
  $("rule").addEventListener("change", e => edit(b => { b.rule = e.target.value; }, true));

  [["t-items", "items"], ["t-rule", "rule"], ["t-particles", "particles"], ["t-arrow", "arrow"], ["t-anim", "anim"]]
    .forEach(([id, key]) => $(id).addEventListener("change", e => { S[key] = e.target.checked; }));
  $("speed").addEventListener("input", e => { S.speed = +e.target.value; $("speed-v").textContent = S.speed; });
  $("reseed").addEventListener("click", () => { seed++; worlds = BIOMES.map((b, i) => makeWorld(i, seed * 101 + i * 7)); });

  function setView(v) {
    S.view = v;
    document.body.classList.toggle("focus", v === "focus");
    document.body.classList.toggle("arrows", v === "arrows");
    document.body.classList.toggle("presets", v === "presets");
    ["gallery", "focus", "arrows", "presets"].forEach(n => $("v-" + n).classList.toggle("on", v === n));
    sizeFocus(); describeArrows();
    if (v === "presets") requestAnimationFrame(renderPresets);
  }
  window.addEventListener("resize", () => { if (S.view === "presets") renderPresets(); });
  ["gallery", "focus", "arrows", "presets"].forEach(n => $("v-" + n).addEventListener("click", () => setView(n)));

  $("copy").addEventListener("click", () => {
    const text = JSON.stringify(BIOMES, null, 2);
    const done = () => { $("copied").textContent = "Copied — " + BIOMES.length + " biomes"; };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
    else fallback(text, done);
  });
  function fallback(text, done) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove(); done();
  }
  $("reset").addEventListener("click", () => {
    BIOMES = clone(DEFAULTS); save(); syncPanel(); describe();
    worlds = BIOMES.map((b, i) => makeWorld(i, seed * 101 + i * 7));
  });

  /* ---- sizing: every canvas is the 720x1280 design space, scaled -------- */
  function fit(cv, aspect) {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.round(w * (aspect || H / W));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    return w / W;
  }
  function sizeFocus() {
    // two frames side by side: bounded by the window's height AND the stage's width
    const room = document.getElementById("stage").clientWidth - 48 - 20;
    const h = Math.max(320, Math.min(window.innerHeight - 90, room / 2 * H / W)), w = Math.round(h * W / H);
    for (const id of ["focus-live", "focus-sheet"]) { $(id).style.width = w + "px"; $(id).style.height = h + "px"; }
  }
  window.addEventListener("resize", sizeFocus);

  function draw(cv, fn, aspect) {
    const k = fit(cv, aspect), ctx = cv.getContext("2d");
    ctx.setTransform(k, 0, 0, k, 0, 0);
    fn(ctx);
  }

  let last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (S.anim) clock += dt;
    if (S.view === "presets") {
      // still pictures: drawn by renderPresets
    } else if (S.view === "arrows") {
      acards.forEach(c => draw(c.cv, ctx => renderArrowCard(ctx, c.key, clock), 3 / 4));
    } else if (S.view === "gallery") {
      worlds.forEach((w, i) => { if (S.anim) w.update(dt); draw(cards[i].cv, ctx => w.render(ctx)); });
    } else {
      const w = worlds[S.sel];
      if (S.anim) w.update(dt);
      draw($("focus-live"), ctx => w.render(ctx));
      draw($("focus-sheet"), ctx => renderSheet(ctx, w));
    }
    requestAnimationFrame(frame);
  }

  buildPresetCards(); buildArrowCards(); buildCards(); syncPanel(); sizeFocus();
  // #focus=2 opens a biome in the focus view straight away, #arrows=2 the arrow catalogue on it
  const fh = /(focus|arrows|presets)=(\d)/.exec(location.hash);
  if (fh && BIOMES[+fh[2]]) { select(+fh[2]); setView(fh[1]); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
