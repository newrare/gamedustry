<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Lab — triverse biomes</title>

<style>
/* ===========================================================================
   TRIVERSE BIOMES — what each stretch of the climb LOOKS like, before any of
   it goes into games/triverse.

   Today the thirty levels of triverse are one road driven faster: one radial
   ground, one field of stars, one kind of dotted rope. This page tries five
   biomes of six levels each, and a biome is four layers the game can change
   without touching what the player must read:
     - the GROUND, three stops of the radial gradient `metrics()` builds, plus
       an optional glow rising from the bottom edge;
     - the PARTICLES, what `sparks` becomes: stars, prism shards, rain with
       lightning, comets crossing, embers rising;
     - the rope's MATERIAL, what `dotSprite()` draws per dot: dots, faceted
       beads, electric dashes, hollow rings, chain links;
     - the FIGURES, the weights the band generator draws from (`FIGURES`),
       which change the shape of the whole screen.

   Two more layers ride with the biome since the first round:
     - the three ROPE COLOURS. Cyan, pink and lime were the game's identity;
       a biome now deals its own three. The gems take the colour of their
       rope and the Prism gates the colour of the rope they let through, so
       both follow. In the game this is more than `play.colors`: the SKIN's
       `--p0/1/2`, the `pop-l0/1/2` callouts and the intro demo carry the rope
       colours too, so a biome would write them on #frame at level start;
     - the ARROW's shape. The chevron is the game today; the Arrows view lays
       seven shapes side by side on the selected ground, in the selected
       biome's three colours, leaning into a hop the way the game leans it.
       "This arrow on every biome" is there because the arrow is the player's
       own piece and most likely stays one shape for the whole climb.

   One thing never moves, and the page holds it fixed on purpose: the items —
   mine, void, gem, mega gem, x2, shield — keep their colour and silhouette in
   every biome, so a danger reads the same everywhere.

   So the question a biome has to answer is "does everything still read on
   this ground?", and the chips under each card answer it: an item whose hue
   sits too close to a saturated ground stop, to the glow or (for a hazard) to
   the particles, or whose contrast against the ground falls under 3, is
   flagged. A rope is held to more: it must not wear a hazard's hue (a mine on
   a red rope disappears), nor the mega gem's gold (every gem on it would read
   as one), nor sit too close to another rope of the same biome (two ropes the
   player cannot tell apart break the gates and the braids). That leaves a
   rope four families — greens, cyans, blues and magentas — plus white. The free
   hues for a saturated GROUND are narrower still — roughly greens (114–144°)
   and blues (221–242°) — so everything else there has to be dark or grey.

   The RULE of each biome (colour gates, broken rope, moving hazard, rope heat)
   is drawn too, as a look and not as a mechanic: the arrow is an autopilot
   that hops away from what it sees, nothing collides, nothing scores.

   Gallery: the five side by side, the comparison a biome is chosen on. Focus:
   one biome at full height beside its item sheet, every object at rest on that
   ground. The panel edits the selected biome; Copy settings hands the five
   over as JSON. Nothing here ships.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }
body {
  min-height:100vh; display:flex;
  background:#0b0b12; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
#panel {
  flex:0 0 290px; padding:22px 20px;
  background:#12121c; border-right:1px solid #23233a;
  position:sticky; top:0; height:100vh; overflow:auto;
}
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel p.hint { margin:8px 0 18px; font-weight:500; font-size:12px; color:#8b8ba7; }
#panel h2 { margin:20px 0 8px; font-size:12px; color:#9c9cba; letter-spacing:.5px; }
.row { margin-bottom:12px; }
.row label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:6px; accent-color:#7ea6ff; }
.row select {
  width:100%; margin-top:6px; padding:6px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit;
}
.swatches { display:flex; gap:6px; margin-top:6px; }
.swatches input[type=color] {
  flex:1; height:30px; padding:0; border:1px solid #2c2c47; border-radius:6px; background:#0b0b12; cursor:pointer;
}
.check { display:flex; gap:8px; align-items:center; font-size:12px; color:#c9c9e0; margin-bottom:8px; cursor:pointer; }
.seg { display:flex; gap:4px; margin-top:6px; }
.seg button { flex:1; margin:0; background:#1d1d2e; color:#c9c9e0; }
.seg button.on { background:#7ea6ff; color:#0b0b12; }
button {
  width:100%; margin-top:6px; padding:8px 10px;
  background:#7ea6ff; color:#0b0b12; border:0; border-radius:8px;
  font:700 13px/1 inherit; letter-spacing:.5px; cursor:pointer;
}
button.ghost { background:#1d1d2e; color:#c9c9e0; }
#copied { font-size:11px; color:#8b8ba7; min-height:16px; margin-top:6px; }

#stage { flex:1; padding:24px; min-width:0; }
#grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:18px; }
#focus { display:none; gap:20px; align-items:flex-start; }
body.focus #grid, body.arrows #grid { display:none; }
body.focus #focus { display:flex; }
#arrows { display:none; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px; }
body.arrows #arrows { display:grid; }
#arrows-cap { display:none; font-size:12px; color:#9c9cba; margin-bottom:14px; }
body.arrows #arrows-cap { display:block; }
body.presets #grid { display:none; }
#presets { display:none; flex-direction:column; gap:18px; }
body.presets #presets { display:flex; }
.preset { background:#12121c; border:1px solid #23233a; border-radius:14px; padding:14px; cursor:pointer; transition:border-color .15s; }
.preset:hover { border-color:#4a4a72; }
.preset.picked { border-color:#7ea6ff; box-shadow:0 0 0 2px #7ea6ff inset; }
.preset h3 { font-size:15px; }
.preset h3 em { font-style:normal; color:#7ea6ff; font-size:11px; margin-left:8px; }
.preset .note { font-size:12px; font-weight:500; color:#b4b4cc; margin:2px 0 10px; }
.preset .row5 { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; }
.preset canvas { display:block; width:100%; aspect-ratio:9/16; border-radius:8px; }
.preset .bn { font-size:12px; margin-top:4px; }
.preset .bw { font-size:11px; font-weight:500; color:#7be0a0; }
.preset .bw.bad { color:#ffd27a; }
.card canvas.wide { aspect-ratio:4/3; }
#focus .col { display:flex; flex-direction:column; gap:8px; }
#focus .cap { font-size:12px; color:#9c9cba; }

.card {
  background:#12121c; border:1px solid #23233a; border-radius:14px; overflow:hidden; cursor:pointer;
  transition:border-color .15s, transform .15s;
}
.card:hover { border-color:#4a4a72; transform:translateY(-2px); }
.card.picked { border-color:#7ea6ff; box-shadow:0 0 0 2px #7ea6ff inset; }
.card canvas { display:block; width:100%; aspect-ratio:9/16; }
.card .txt { padding:10px 12px 12px; }
.card .name { font-size:14px; }
.card .name em { font-style:normal; color:#7ea6ff; font-size:11px; margin-left:6px; }
.card .note { font-size:12px; font-weight:500; color:#b4b4cc; margin-top:2px; }
.card .fit { font-size:11px; font-weight:500; color:#8b8ba7; margin-top:4px; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.chip {
  display:inline-flex; align-items:center; gap:5px;
  padding:2px 7px 2px 5px; border-radius:99px;
  background:#1a1a28; border:1px solid #2a2a40; font-size:11px; font-weight:600; color:#c9c9e0;
}
.chip::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--c); }
.chip.warn { border-color:#ffb020; color:#ffd27a; background:#2a1f08; }
.chip.warn::after { content:"!"; font-weight:900; }
.verdict { font-size:11px; font-weight:600; margin-top:6px; color:#7be0a0; }
.verdict.bad { color:#ffd27a; }
canvas.big { display:block; border-radius:14px; box-shadow:0 18px 50px rgba(0,0,0,.5); }
</style>
</head>
<body>

<div id="panel">
  <h1>Triverse biomes</h1>
  <p class="hint">Five looks for the five stretches of the climb. The items never change; the ground, the particles, the ropes' colours and material, the figures and the arrow do.</p>

  <div class="row">
    <label>View</label>
    <div class="seg"><button id="v-gallery" class="on">Gallery</button><button id="v-focus">Focus</button><button id="v-arrows">Arrows</button><button id="v-presets">Presets</button></div>
  </div>
  <label class="check"><input type="checkbox" id="t-items" checked> Items</label>
  <label class="check"><input type="checkbox" id="t-rule" checked> The biome's rule</label>
  <label class="check"><input type="checkbox" id="t-particles" checked> Particles</label>
  <label class="check"><input type="checkbox" id="t-arrow" checked> Arrow</label>
  <label class="check"><input type="checkbox" id="t-anim" checked> Animate</label>
  <div class="row">
    <label for="speed">Scroll speed <b id="speed-v">780</b></label>
    <input id="speed" type="range" min="300" max="1300" step="10" value="780">
  </div>
  <button id="reseed" class="ghost">New ropes</button>

  <h2>Selected biome</h2>
  <div class="row">
    <label for="biome">Biome</label>
    <select id="biome"></select>
  </div>
  <div class="row">
    <label>Ground (top, middle, edge)</label>
    <div class="swatches"><input type="color" id="g0"><input type="color" id="g1"><input type="color" id="g2"></div>
  </div>
  <div class="row">
    <label for="glowA">Glow from below <b id="glowA-v">0</b></label>
    <div class="swatches"><input type="color" id="glow"></div>
    <input id="glowA" type="range" min="0" max="50" value="0">
  </div>
  <div class="row">
    <label for="particles">Particles</label>
    <select id="particles"></select>
    <div class="swatches"><input type="color" id="tint"></div>
  </div>
  <div class="row">
    <label for="density">Density <b id="density-v">1.0</b></label>
    <input id="density" type="range" min="0" max="25" value="10">
  </div>
  <div class="row">
    <label>Rope colours</label>
    <div class="swatches"><input type="color" id="r0"><input type="color" id="r1"><input type="color" id="r2"></div>
  </div>
  <div class="row">
    <label for="material">Rope material</label>
    <select id="material"></select>
  </div>
  <div class="row">
    <label for="arrow">Arrow</label>
    <select id="arrow"></select>
    <button id="arrow-all" class="ghost">This arrow on every biome</button>
  </div>
  <div class="row">
    <label for="figures">Figures</label>
    <select id="figures"></select>
  </div>
  <div class="row">
    <label for="rule">Rule</label>
    <select id="rule"></select>
  </div>

  <h2>Presets</h2>
  <div class="row">
    <label for="preset">A whole look for the five biomes</label>
    <select id="preset"></select>
    <button id="preset-all">Apply to the five biomes</button>
    <button id="preset-one" class="ghost">Apply to the selected biome only</button>
  </div>

  <h2>Hand over</h2>
  <button id="copy">Copy settings</button>
  <button id="reset" class="ghost">Back to the defaults</button>
  <div id="copied"></div>
</div>

<div id="stage">
  <div id="grid"></div>
  <div id="arrows-cap"></div>
  <div id="presets"></div>
  <div id="arrows"></div>
  <div id="focus">
    <div class="col"><canvas id="focus-live" class="big"></canvas><div class="cap" id="focus-cap"></div></div>
    <div class="col"><canvas id="focus-sheet" class="big"></canvas><div class="cap">Every object at rest on this ground</div></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---- the frame, as games/triverse/game.js sees it (web target) ---------
     720x1280, a 150 px HUD band, no CTA bar, the 26 px house margin at the
     foot. The tunables are CONFIG.play's own values. */
  const W = 720, H = 1280, TAU = Math.PI * 2;
  const L = { left: 30, right: 690, w: 660, cx: 360, top: 150, bottom: 1254 };
  const T = { edge: 84, dot: 27, loopR: 88, loopClear: 76, sway: 26, anchorUp: 170,
              switchTime: 0.13, hazardClear: 130, hazardApart: 118 };
  const ANCHOR = L.bottom - T.anchorUp;

  // Fixed across every biome: the items. The ropes are the biome's (`ropes`).
  const FIXED = { mine: "#ff2d55", void: "#c07bff", star: "#ffd43b", x2: "#a6ff3d", shield: "#8ffff2" };
  // Every hazard speaks the mine's red, the comet included: one colour for danger.
  const COMET = "#ff2d55";

  const FIGSETS = {
    classic: { label: "Rails and shifts", list: ["rails", "rails", "ribbon", "ribbon", "shift", "shift", "shift", "coil", "braid"] },
    braids:  { label: "Braids", list: ["braid", "braid", "braid", "braid", "shift", "shift", "shift", "ribbon", "helix", "rails"] },
    coils:   { label: "Coils and loops", list: ["coil", "coil", "coil", "ribbon", "ribbon", "rails", "breath", "loop", "loop", "spring"] },
    helix:   { label: "Helix and breath", list: ["helix", "helix", "breath", "breath", "breath", "braid", "braid", "spring", "eight"] },
    all:     { label: "Everything (the game today)", list: ["rails", "rails", "ribbon", "ribbon", "coil", "coil",
               "braid", "braid", "braid", "breath", "breath", "helix", "shift", "shift", "shift", "loop", "loop", "eight", "spring"] }
  };
  const PARTICLES = { stars: "Stars and speed streaks", shards: "Prism shards and light beams",
                      grid: "Synthwave floor", bubbles: "Bubbles rising", snow: "Snow drifting",
                      rain: "Rain and lightning", comets: "Comets crossing", embers: "Embers rising" };
  const MATERIALS = { dots: "Dots (the game today)", beads: "Faceted beads", dashes: "Electric dashes",
                      rings: "Hollow rings", links: "Chain links" };
  /* The arrow's shapes. Every one points up (-y) in its own frame, fits the
     chevron's box (about 36 up, 28 down, 34 across) so the hop and the halo
     need no retuning, and wears the same dark contour: the arrow sits ON a
     glowing rope and has to be cut out of it. */
  const ARROWS = {
    chevron: { label: "Chevron (the game today)", note: "The open V: reads at once, says nothing of the game." },
    trident: { label: "Trident", note: "Three prongs for three ropes — the name of the game in the piece." },
    dart:    { label: "Dart", note: "Slim and notched: speed, and the rope stays visible on both sides." },
    jet:     { label: "Jet", note: "Swept wings and a tail: a vehicle rather than a cursor." },
    drop:    { label: "Drop", note: "A head of light with its point forward: soft, kin to the comet." },
    kite:    { label: "Kite", note: "A long diamond with a spine — but the gems are diamonds too." },
    prow:    { label: "Orb and prow", note: "A ball with a beak: a creature riding the rope." }
  };
  const RULES = { none: "None", gate: "Colour gates", break: "Broken rope", comet: "Moving hazard",
                  heat: "Rope heat", all: "Rope heat, and every rule before" };

  /* The rope triads. Neon keeps the game's own three; the others are picked
     out of what is left once the hazards, the mega gem and the ground have
     taken their hues: a blue and a white on Prism's green, ice, white and an
     electric magenta for Storm, a mint / blue / orchid dusk for Comets, and cool ropes on Fusion's
     warm ground, because every warm hue there belongs to a mine or a gem. */
  const DEFAULTS = [
    { key: "neon",   name: "Neon",   levels: "1–6",   ground: ["#141a44", "#080b22", "#03040c"], glow: "#3ce0ff", glowA: 0,
      particles: "stars",  tint: "#ffffff", density: 1, ropes: ["#3ce0ff", "#ff5ad4", "#a6ff3d"],
      material: "dots",   arrow: "trident", figures: "classic", rule: "none" },
    { key: "prism",  name: "Prism",  levels: "7–12",  ground: ["#0b3a1a", "#05200e", "#020a05"], glow: "#3dff8a", glowA: 0,
      particles: "shards", tint: "#d8fff0", density: 1, ropes: ["#5a8cff", "#ff6fd8", "#f4fbff"],
      material: "beads",  arrow: "trident", figures: "braids",  rule: "gate" },
    { key: "storm",  name: "Storm",  levels: "13–18", ground: ["#2a3442", "#121820", "#06080c"], glow: "#cfe3ff", glowA: 0,
      particles: "rain",   tint: "#cfe3ff", density: 1, ropes: ["#7fe9ff", "#ff5ae0", "#ffffff"],
      material: "dashes", arrow: "trident", figures: "coils",   rule: "break" },
    { key: "comets", name: "Comets", levels: "19–24", ground: ["#1f1a2e", "#110e1c", "#05040a"], glow: "#ff9d7a", glowA: 0.24,
      particles: "comets", tint: "#e8eeff", density: 1, ropes: ["#4dffc3", "#4f7bff", "#ff7ae6"],
      material: "rings",  arrow: "trident", figures: "helix",   rule: "comet" },
    { key: "fusion", name: "Fusion", levels: "25–30", ground: ["#2a1810", "#140b07", "#060302"], glow: "#ff6a1c", glowA: 0.18,
      particles: "embers", tint: "#ffb347", density: 1, ropes: ["#4af0ff", "#fff1dc", "#7dff6a"],
      material: "links",  arrow: "trident", figures: "all",     rule: "all" }
  ];

  /* ---- presets: a whole look for the five biomes at once ------------------
     A preset is an art direction, not five unrelated picks: the five grounds
     read as one family, the arrow is one shape for the whole climb, and each
     biome still differs from its neighbours in hue. It carries the LOOK only —
     name, ground, glow, particles, ropes, material, arrow. The rule and the
     figures are gameplay and stay with the biome's slot (none, gates, broken
     rope, moving hazard, heat). Every preset was tuned against the checker:
     the Presets view prints what it says, biome by biome. */
  const LOOK = ["name", "ground", "glow", "glowA", "particles", "tint", "density", "ropes", "material"];
  const PRESETS = [
    { key: "arcade", name: "Neon arcade", arrow: "trident",
      note: "The game as it is, pushed five ways: the house look, one new idea per stretch.",
      biomes: DEFAULTS.map(b => { const o = {}; LOOK.forEach(k => { o[k] = clone(b[k]); }); return o; }) },
    { key: "space", name: "Deep space", arrow: "jet",
      note: "A ship crossing the cosmos: near-black skies, a nebula, an ion storm, a meteor field, a dying star.",
      biomes: [
        { name: "Orbit", ground: ["#0e1430", "#070a1c", "#020308"], glow: "#5a7bff", glowA: 0, particles: "stars", tint: "#ffffff",
          density: 1.2, ropes: ["#7fd8ff", "#ff8ae8", "#c8ff7a"], material: "dots" },
        { name: "Nebula", ground: ["#12301f", "#081a10", "#020604"], glow: "#5a7bff", glowA: 0.16, particles: "shards", tint: "#cfe0ff",
          density: 0.8, ropes: ["#5ad8ff", "#ff6fd8", "#ffffff"], material: "beads" },
        { name: "Ion storm", ground: ["#1b2236", "#0d111c", "#040509"], glow: "#a9c4ff", glowA: 0, particles: "rain", tint: "#a9c4ff",
          density: 1, ropes: ["#7ff0ff", "#ff6ae0", "#d6ffa0"], material: "dashes" },
        { name: "Meteor field", ground: ["#221a14", "#120d0a", "#050403"], glow: "#ff7a3a", glowA: 0.2, particles: "comets", tint: "#fff0e0",
          density: 1.3, ropes: ["#6fd8ff", "#8dff9a", "#ff8ae8"], material: "rings" },
        { name: "Supernova", ground: ["#2a0d22", "#150610", "#050205"], glow: "#ff5a2a", glowA: 0.22, particles: "embers", tint: "#ffd0a0",
          density: 1.2, ropes: ["#4af0ff", "#ffffff", "#9dff6a"], material: "links" }
      ] },
    { key: "elements", name: "Elements", arrow: "prow",
      note: "Water, wood, ice, crystal, fire: five natures the player recognises before reading anything.",
      biomes: [
        { name: "Abyss", ground: ["#062a44", "#03182a", "#01070e"], glow: "#9fe8ff", glowA: 0, particles: "bubbles", tint: "#9fe8ff",
          density: 1, ropes: ["#b8ff7a", "#ff8ae8", "#ffffff"], material: "rings" },
        { name: "Forest", ground: ["#10361c", "#071d0e", "#020803"], glow: "#d8ff7a", glowA: 0, particles: "embers", tint: "#d8ff7a",
          density: 0.7, ropes: ["#5ab4ff", "#ff7ae6", "#ffffff"], material: "beads" },
        { name: "Blizzard", ground: ["#283040", "#12161f", "#05060a"], glow: "#eef4ff", glowA: 0, particles: "snow", tint: "#eef4ff",
          density: 1.2, ropes: ["#7fe9ff", "#ff5ae0", "#b8ff6a"], material: "dots" },
        { name: "Crystal", ground: ["#102a4a", "#08162a", "#02060d"], glow: "#7fd0ff", glowA: 0.16, particles: "shards", tint: "#e0f4ff",
          density: 1, ropes: ["#4dffc3", "#ff7ae6", "#ffffff"], material: "beads" },
        { name: "Magma", ground: ["#2a1810", "#140b07", "#060302"], glow: "#ff6a1c", glowA: 0.18, particles: "embers", tint: "#ffb347",
          density: 1.2, ropes: ["#4af0ff", "#fff1dc", "#7dff6a"], material: "links" }
      ] },
    { key: "synth", name: "Synthwave", arrow: "dart",
      note: "A night drive in 1986: magenta skies, a sunset floor, a laser grid, a wet city, then the redline.",
      biomes: [
        { name: "Sunset drive", ground: ["#3d0f3a", "#1c0820", "#07020a"], glow: "#ff6a2a", glowA: 0.26, particles: "grid", tint: "#ff5ae0",
          density: 1, ropes: ["#35f0ff", "#6a7dff", "#ffffff"], material: "dots" },
        { name: "Laser grid", ground: ["#0a1440", "#050a24", "#01030c"], glow: "#35f0ff", glowA: 0, particles: "grid", tint: "#35f0ff",
          density: 1, ropes: ["#ff5ae0", "#a6ff3d", "#ffffff"], material: "dashes" },
        { name: "Night city", ground: ["#1a1a2a", "#0c0c16", "#040408"], glow: "#ff8ae8", glowA: 0, particles: "rain", tint: "#ff8ae8",
          density: 0.9, ropes: ["#35f0ff", "#a6ff3d", "#ff5ae0"], material: "rings" },
        { name: "Chrome sky", ground: ["#241e30", "#110e1a", "#050408"], glow: "#ff5a2a", glowA: 0.22, particles: "comets", tint: "#ffe0f4",
          density: 1, ropes: ["#4dffc3", "#6a7dff", "#ff7ae6"], material: "beads" },
        { name: "Overdrive", ground: ["#36082e", "#1a0416", "#060105"], glow: "#ff6a2a", glowA: 0.2, particles: "embers", tint: "#ff9a5a",
          density: 1.1, ropes: ["#35f0ff", "#ffffff", "#a6ff3d"], material: "links" }
      ] }
  ];
  // The five biomes a preset would give: the preset's look over the slots' rules and figures.
  function presetBiomes(pr) { return BIOMES.map((b, i) => Object.assign(clone(b), clone(pr.biomes[i]), { arrow: pr.arrow })); }

  const STORE = "lab:triverse-biomes";
  const S = { view: "gallery", sel: 0, preset: -1, items: true, rule: true, particles: true, arrow: true, anim: true, speed: 780 };
  let BIOMES = clone(DEFAULTS);
  try { const saved = JSON.parse(localStorage.getItem(STORE) || "null");
        // a save from an older round of the page lacks the newer keys: fill them from the defaults
        if (saved && saved.length === DEFAULTS.length) BIOMES = saved.map((b, i) => Object.assign(clone(DEFAULTS[i]), b));
      } catch (e) {}
  function save() { try { localStorage.setItem(STORE, JSON.stringify(BIOMES)); } catch (e) {} }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---- colour helpers --------------------------------------------------- */
  function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function rgba(hex, a) { const c = rgb(hex); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

    if (!d) return { h: 0, s: 0, l, ch: 0 };

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ---- the readability check ---------------------------------------------
     What a biome must not do to the items. Hue is only judged against a stop
     that is saturated AND light enough to carry a hue at all — a near-black
     ground has no colour to clash with. The particles are judged against the
     hazards only: a gold spark near a gem is harmless, a red one near a mine
     is not. */
  const HUE_MIN = 24, CONTRAST_MIN = 3, ROPE_APART = 110;
  // Plain RGB distance, out of ~441: crude, and enough to catch two ropes the eye merges.
  function dist(a, b) { const x = rgb(a), y = rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); }
  function checks(b) {
    const list = [
      ["Mine", FIXED.mine, "hazard"], ["Void", FIXED.void, "hazard"],
      ["Mega gem", FIXED.star, "item"], ["x2", FIXED.x2, "item"], ["Shield", FIXED.shield, "item"]
    ];
    if (b.rule === "comet" || b.rule === "all") list.push(["Comet", COMET, "hazard"]);
    b.ropes.forEach((c, i) => list.push(["Rope " + (i + 1), c, "rope", i]));
    const stops = b.ground.filter(c => { const h = hsl(c); return h.s >= 0.35 && h.l >= 0.12; });
    const glowOn = b.glowA >= 0.15, tintH = hsl(b.tint);
    const hazards = list.filter(r => r[2] === "hazard");
    return list.map(([name, col, kind, ri]) => {
      // judged on chroma, not HSL saturation, which calls a near-white fully saturated
      const why = [], hc = hsl(col), h = hc.h, tinted = hc.ch >= 0.3;
      const ratio = contrast(col, b.ground[1]);
      if (ratio < CONTRAST_MIN) why.push("contrast " + ratio.toFixed(1) + " on the ground");
      if (tinted) {
        stops.forEach(s => { if (hueGap(h, hsl(s).h) < HUE_MIN) why.push("hue near the ground " + s); });
        if (glowOn && hueGap(h, hsl(b.glow).h) < HUE_MIN) why.push("hue near the glow");
      }
      if (kind === "hazard" && b.particles !== "shards" && tintH.s >= 0.35 && hueGap(h, tintH.h) < HUE_MIN) why.push("hue near the particles");
      if (kind === "rope") {
        if (tinted) {
          hazards.forEach(z => { if (hueGap(h, hsl(z[1]).h) < HUE_MIN) why.push("in the hue of the " + z[0].toLowerCase()); });
          if (hueGap(h, hsl(FIXED.star).h) < HUE_MIN) why.push("its gems read as mega gems");
        }
        b.ropes.forEach((o, j) => { if (j !== ri && dist(col, o) < ROPE_APART) why.push("too close to rope " + (j + 1)); });
      }
      return { name, col, why, ratio };
    });
  }

  /* ---- seeded random, so a card keeps its ropes across a redraw ---------- */
  function makeRand(seed) {
    let a = seed >>> 0;
    const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);

  }

  /* =========================================================================
     ONE WORLD — the band generator of games/triverse/game.js, ported as is,
     with the biome's figure weights; the items, a reduced version of the
     game's spawner plus the four rules; and an autopilot arrow.
     ========================================================================= */
  // `src` is the list of biomes the world reads (BIOMES unless a preset is being previewed)
  function makeWorld(bi, seed, src) {
    const R = makeRand(seed);
    const Wd = { bi, t: 0, camP: 0, lane: 1, prevLane: 1, switchT: 1, switchDir: 1, hopT: 1, heat: 0,
                 trail: [], flashT: 0, flashIn: 2, bolt: null, parts: [], partKey: "", deco: [] };
    let paths, genP, curX, slotRope, sway, onGrid, items, nextItemP, lastHazardP;
    const pa = { x: 0, y: 0 }, pb = { x: 0, y: 0 }, pc = { x: 0, y: 0 }, sa = { x: 0, y: 0 }, sb = { x: 0, y: 0 };
    const B = () => (src || BIOMES)[Wd.bi];

    function segEval(s, p, out) {
      let t, th;
      if (s.k === 0) { out.x = s.x; out.y = p; }
      else if (s.k === 1) { t = (p - s.p0) / (s.p1 - s.p0); out.x = s.x0 + (s.x1 - s.x0) * ease(t); out.y = p; }
      else if (s.k === 2) { out.x = s.x + s.amp * Math.sin(TAU * (p - s.p0) / s.wl + s.ph); out.y = p; }
      else { th = TAU * (p - s.p0) / (s.p1 - s.p0); out.x = s.x + s.dir * s.r * (1 - Math.cos(th)); out.y = p + s.r * Math.sin(th); }
    }
    function pathSeg(path, p) {
      const segs = path.segs;
      for (let i = 0; i < segs.length; i++) if (p < segs[i].p1) return segs[i];
      return segs[segs.length - 1];
    }
    function pathPoint(i, p, out) { segEval(pathSeg(paths[i], p), p, out); return out; }
    function pathX(i, p) { return pathPoint(i, p, pc).x; }
    function dotStep(kind, a, b) {
      if (kind === 2) return T.dot / Math.sqrt(1 + (a * TAU / b) * (a * TAU / b) * 0.5);
      if (kind === 3) return T.dot * b / Math.sqrt(a * a + b * b);
      return T.dot;
    }
    function slotHalf() { return L.w * 0.5 - T.edge; }
    function slotX(s) { return L.cx + sway + (s - 1) * slotHalf(); }
    function wallRoom(x, dir) { return dir > 0 ? (L.right - 26) - x : x - (L.left + 26); }
    function emitStraight(i, p0, p1) { paths[i].segs.push({ k: 0, p0, p1, x: curX[i], step: T.dot }); }
    function emitCurve(i, p0, p1, x1) { paths[i].segs.push({ k: 1, p0, p1, x0: curX[i], x1, step: T.dot * 0.86 }); curX[i] = x1; }
    function emitSine(i, p0, wl, n, center, amp, ph) {
      paths[i].segs.push({ k: 2, p0, p1: p0 + wl * n, x: center, amp, wl, ph, step: dotStep(2, Math.abs(amp), wl) });
    }
    function emitLoop(i, p0, span, r, dir) {
      paths[i].segs.push({ k: 3, p0, p1: p0 + span, x: curX[i], r, dir, step: dotStep(3, r, span / TAU) });
    }
    function ferryTo(perm) {
      let len = 0;
      for (let i = 0; i < 3; i++) len = Math.max(len, Math.abs(slotX(i) - curX[perm[i]]));
      len = clamp(250 + len * 1.05, 280, 660);
      for (let i = 0; i < 3; i++) emitCurve(perm[i], genP, genP + len, slotX(i));
      slotRope = perm; onGrid = true; genP += len;
    }
    function ferryHome() { const o = [0, 1, 2]; o.sort((u, v) => curX[u] - curX[v]); ferryTo(o); }
    const SHIFTS = [[1, 0, 2], [0, 2, 1], [2, 1, 0], [1, 2, 0], [2, 0, 1]];
    function pushRails(p0) { const len = R.range(190, 330); for (let i = 0; i < 3; i++) emitStraight(i, p0, p0 + len); genP = p0 + len; }

    function pushBand() {
      const p0 = genP;
      let i, a, b, ia, ib, ic, center, amp, wl, n, ph, xs, len, off, mid, li, gapL, gapR, r, dir, spans, total, q;
      if (!onGrid) { ferryHome(); return; }
      const kind = R.pick((FIGSETS[B().figures] || FIGSETS.all).list);
      if (kind === "rails") { pushRails(p0); return; }
      if (kind === "shift") {
        sway = clamp(sway + R.range(-T.sway, T.sway), -T.sway, T.sway);
        a = R.pick(SHIFTS);
        ferryTo([slotRope[a[0]], slotRope[a[1]], slotRope[a[2]]]);
        return;
      }

        amp = Math.min(kind === "coil" ? 42 : 58, Math.min(wallRoom(slotX(0), -1), wallRoom(slotX(2), 1)));
        if (amp < 22) { pushRails(p0); return; }
        wl = kind === "coil" ? R.range(160, 220) : R.range(320, 460);
        n = kind === "coil" ? R.int(3, 4) : R.int(1, 2);
        for (i = 0; i < 3; i++) emitSine(i, p0, wl, n, curX[i], amp, 0);
        genP = p0 + wl * n; return;
      }
      if (kind === "braid") {
        a = R.chance(0.5) ? 0 : 1; b = a + 1;
        ia = slotRope[a]; ib = slotRope[b]; ic = slotRope[3 - a - b];
        center = (slotX(a) + slotX(b)) * 0.5; amp = (slotX(b) - slotX(a)) * 0.5;
        wl = R.range(320, 440); n = R.int(1, 2);
        emitSine(ia, p0, wl, n, center, amp, -Math.PI / 2);
        emitSine(ib, p0, wl, n, center, amp, Math.PI / 2);
        emitStraight(ic, p0, p0 + wl * n);
        genP = p0 + wl * n; return;
      }
      if (kind === "helix") {
        center = L.cx + sway; amp = slotHalf() * 0.68; ph = [-TAU / 3, 0, TAU / 3];
        xs = []; len = 0;
        for (i = 0; i < 3; i++) xs.push(center + amp * Math.sin(ph[i]));
        for (i = 0; i < 3; i++) len = Math.max(len, Math.abs(xs[i] - curX[slotRope[i]]));
        len = clamp(240 + len * 1.05, 270, 620);
        for (i = 0; i < 3; i++) emitCurve(slotRope[i], p0, p0 + len, xs[i]);
        genP = p0 + len;
        wl = R.range(330, 450); n = R.int(1, 2);
        for (i = 0; i < 3; i++) emitSine(slotRope[i], genP, wl, n, center, amp, ph[i]);
        genP += wl * n; onGrid = false; return;
      }
      if (kind === "breath") {
        center = L.cx + sway; mid = R.range(0.80, 0.88);
        wl = R.range(320, 440); n = R.int(1, 2);
        for (i = 0; i < 3; i++) {
          off = slotX(i) - center;
          if (Math.abs(off) < 4) emitStraight(slotRope[i], p0, p0 + wl * n);
          else emitSine(slotRope[i], p0, wl, n, center + off * mid, off * (1 - mid), Math.PI / 2);
        }
        genP = p0 + wl * n; return;
      }
      li = kind === "loop" ? slotRope[R.int(0, 2)] : slotRope[1];
      gapL = wallRoom(curX[li], -1); gapR = wallRoom(curX[li], 1);
      for (i = 0; i < 3; i++) {
        if (i === li) continue;
        if (curX[i] < curX[li]) gapL = Math.min(gapL, curX[li] - curX[i]);
        else gapR = Math.min(gapR, curX[i] - curX[li]);
      }
      if (kind === "eight") { dir = R.chance(0.5) ? 1 : -1; r = Math.min(T.loopR, (Math.min(gapL, gapR) - T.loopClear) * 0.5); }
      else { dir = gapR >= gapL ? 1 : -1; r = Math.min(T.loopR, (Math.max(gapL, gapR) - T.loopClear) * 0.5); }
      if (r < 44) { pushRails(p0); return; }
      n = kind === "loop" ? 1 : kind === "eight" ? 2 : R.int(2, 3);
      spans = []; total = 0;
      for (i = 0; i < n; i++) { q = r * R.range(1.8, 2.7); spans.push(q); total += q; }
      for (i = 0; i < 3; i++) if (i !== li) emitStraight(i, p0, p0 + total);
      q = p0;
      for (i = 0; i < n; i++) { emitLoop(li, q, spans[i], r, kind === "eight" && (i % 2) ? -dir : dir); q += spans[i]; }
      genP = p0 + total;
    }
    function buildAll(horizon) {
      while (genP < horizon) pushBand();
      for (let i = 0; i < 3; i++) { const s = paths[i].segs; while (s.length > 1 && s[0].p1 < Wd.camP - 700) s.shift(); }
    }

    /* ---- items ----------------------------------------------------------- */
    function freeRange(idx, p0, p1) {
      for (let i = 0; i < 3; i++) {
        if (i === idx) continue;
        for (let q = p0; q <= p1; q += 20) {
          pathPoint(idx, q, sa); pathPoint(i, q, sb);
          if (Math.abs(sa.x - sb.x) < T.hazardApart) return false;
        }
      }
      return true;
    }
    function crossingFree(idx, p) { return freeRange(idx, p - T.hazardClear, p + T.hazardClear); }
    function spot(p, len) {
      for (let tries = 0; tries < 5; tries++) {
        buildAll(p + (len || 0) + T.hazardClear + 60);
        const order = [Wd.lane, (Wd.lane + 1) % 3, (Wd.lane + 2) % 3];
        for (let i = 0; i < 3; i++) {
          if (len ? freeRange(order[i], p - 60, p + len + 60) : crossingFree(order[i], p)) return { path: order[i], p };
        }
        p += 150;
      }
      return null;
    }
    function spawnRule(kind, p) {
      if (kind === "gate") {
        for (let tries = 0; tries < 4; tries++, p += 150) {
          buildAll(p + T.hazardClear + 60);
          if (crossingFree(0, p) && crossingFree(1, p) && crossingFree(2, p)) {
            items.push({ type: "gate", p, rope: R.int(0, 2) });
            nextItemP = p + R.range(420, 560); return true;
          }
        }
        return false;
      }
      if (kind === "break") {
        const len = R.range(170, 240), s = spot(p, len);
