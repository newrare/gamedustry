<style>
/* ===========================================================================
   LAB — TILE DIORAMA. Can a level be built out of stacked blocks, the way a
   floating-islands diorama is, and still read as ONE place rather than a pile
   of cubes? And can it be lit the way such a picture is: a cold blue dusk,
   with a few cyan and amber lights that carry the eye?

   A level is TEXT, one token per cell of a grid (the Level panel):

       <height><surface><prop>[<turn>]        "2gT"  "4s."  "3bo"  "2gP1"  "..."

     height   0-9, in half blocks (a block is 1 x 1 x 1, so "2" is one block)
     surface  g grass (sand on the beach, snow on the snow) · s stone path
              (ice on the snow) · r river (lava on the lava) · m swamp · u toxic
              river · d river of sand · w wood deck (a deck
              on stilts on the beach) · b bridge (no block under it) · v sea (no
              block, a prop standing in the water: "0vY", a boat)
     prop     . none · T tower · P portal · C cave · o coin · S sword · r rock
              k bush · t tree · n pine · x crystal · f fence (on every edge
              that drops) · e stairs (up to the cell behind) · p palm · H hut
              u parasol and deckchair · B barrel · X crate · F torch · L lantern
              U surfboard · Y boat · a pot · V volcano · R ribcage · h chest
              (a biome may redefine any letter: see BIOME_PROPS)
              ("v" is a lava tile on the lava: "1v.", a channel at height 1)
     turn     0-3, quarter turns of the prop (a tower's door faces +z at 0)
     "..."    void

   What makes the pile one place is AUTOTILING, not the models: a block looks
   at its four neighbours. A face that drops gets the grass lip that hangs over
   it, the grass drips and the stones bedded in the cliff; a face against a
   neighbour as high gets nothing; a fence runs only along a drop; a bridge
   picks its axis from what it joins and sags over its whole run. Every cell
   is seeded by its own position, so an edit changes that cell and its
   neighbours, never the rest of the level.

   The light is the second half. A hemisphere of blue sky over a dark mauve
   ground, a low cold moon with soft shadows, a HEIGHT fog that dissolves the
   foot of every block into the background (the blocks hang in the blue), and
   two accent colours that are both emissive and light: cyan (portals, the
   tower's door, crystals) and amber (the cave, the coins). Each accent is a
   material that blooms, a disc of light painted on the ground under it, and
   — for the first N of them, by priority — a real point light.

   A level belongs to a BIOME, and a biome is a set of tile models. The isle
   is the dusk diorama above. The beach keeps the same grid and the same
   tokens, and the same TILE SKELETON (THE TILE, below): body, thick cap with
   its lip, drips, stones in the cliff, top. Only the skin changes — a body of
   darker sand in strata under a cap of packed pale sand, slate in the cliffs,
   pebbles and starfish on top — plus two tiles that are not blocks: a deck on
   stilts in the
   water, piers whose posts go down to the sea floor, and a SEA — one plane
   whose colour, shallows and foam are read off a distance field to the land,
   rebuilt with the level, so the foam rings every block and every rock.

   The lava is the fourth skin: a basalt body veined with glowing cracks under
   every drop, a thick cap of ash stone laid with flagstones, thorns and rocks
   on top. Its sea cell "v" is not a sea but a LAVA TILE of the skeleton: the
   same body, a molten sheet for a cap, and a lava fall down every face that
   drops (so a channel of lava pours off the edge of the level). The lava is a
   material of its own: emissive only, a moving crust of cells in world space,
   that flows down on a vertical face. A bridge over lava keeps lava under it.
   Its props: a smoking volcano (V), a skull cave (C), a brazier tower (T),
   rubies on a plinth (x), a ribcage (R), rock spires (r), dead trees (n, t).

   RIVERS are the lava tile with water in it: "r" in any biome is a block
   whose cap is a sheet of liquid, with a fall down every side that drops.
   The sheet is one surface with no seam — its pattern is read from UNFOLDED
   coordinates (a fall is laid out flat beyond its lip, so the pattern runs on
   over the edge), its flow comes from a field (every cell flows toward the
   nearest fall, averaged at the corners so neighbours agree), drawn as a
   two-phase flowmap, and its banks are what hide the joint with the stone:
   the lava cools into a dark crust there, the water foams. Water is lit,
   shallow at the banks and white where it runs fast; foam heaps where a fall
   lands, and on the beach a river falls into the sea. Three more liquids
   run in the same tile: a swamp (murky green, slow, duckweed drifting on it,
   thickest by the banks), a toxic river (violet, its ripples and bubbles
   glowing, lighting its banks) and a river of sand (matte, rippled across its
   flow, streaking down a fall, piling up at the foot).

   The snow is the third skin of the same skeleton: a body of cold blue stone
   in strata, a thick rounded cap of snow whose lip droops in lumps and grows
   ICICLES over every drop (the odd long one running down the cliff), and on
   top frozen puddles, snow lumps and frost plants. Its stone path is a sheet
   of cracked ice, its pines carry snow on every tier, its rock a snow dome,
   its cave is a dry-stone arch glowing blue inside, its tower a snowed pillar
   with a lantern on a gallows. Ice is its own material (glossy, a faint cyan
   glow), so it reads as ice and not as pale blue paint.

   Borrowed, never modified: bevelBox, jitter and the tree, rock and crystal
   items of lab/models/library.js, and the post chain of lowpoly-look.html
   (GTAO with normals from depth, bloom, tilt-shift, the grade) copied here.
   Everything else is this page's own, so it can go wherever it likes.

   Served over HTTP only (make lab): three.js is an ES module, vendored in
   lab/vendor/three/ and named by the import map below.
   ?preset=N&level=<name>&cam=K&freeze=1 open a state directly (a headless shot).
   =========================================================================== */

html, body { height:100%; }
body {

details { border-top:1px solid #23233a; padding:8px 0; }

.body { padding-top:8px; }

.row { margin-bottom:10px; }
.row label { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:#9c9cba; }

  width:100%; margin-top:4px; padding:5px 8px;

.btns { display:flex; flex-wrap:wrap; gap:6px; }
.btns button, button.wide {
  flex:1 1 45%; padding:7px 8px;

.sub { margin:10px 0 6px; font-size:11px; color:#6c6c8a; letter-spacing:.4px; }

  dark: { water: false }, mine: { water: false }, pirate: { water: true } };
const BIOME = () => BIOMES[LEVELS[levelName].biome];
const SNOW = () => LEVELS[levelName].biome === "snow";

const STEP = 0.5;                 // one height digit, in blocks
const BIG = { T: 1, P: 1, C: 1, t: 1, n: 1, H: 1, p: 1, u: 1, Y: 1, V: 1, R: 1 };

function parseCell(t) {
  if (!t || t[0] === ".") return null;
  const h = parseInt(t[0], 10);
  if (isNaN(h)) return null;
  const s = "gswbvrmud".includes(t[1]) ? t[1] : "g";
  const p = t[2] && t[2] !== "." ? t[2] : "";
  return { h, s, p, r: (parseInt(t[3], 10) || 0) % 4 };
}
function parseLevel(txt) {
  const rows = txt.split("\n").map((l) => l.trim()).filter((l) => l && !l.startsWith("#"));
  const grid = rows.map((r) => r.split(/\s+/).map(parseCell));
  const cols = Math.max(1, ...grid.map((r) => r.length));
  grid.forEach((r) => { while (r.length < cols) r.push(null); });
  return grid;
}
const cellText = (c) => !c ? "..." : c.h + c.s + (c.p || ".") + (c.r ? String(c.r) : "");
function levelText(grid) {
  const w = Math.max(3, ...grid.flat().map((c) => cellText(c).length));
  return grid.map((r) => r.map((c) => cellText(c).padEnd(w)).join(" ").trimEnd()).join("\n");
}

// ---- the lava: emissive only, a crust of moving cells ----------------------
// Its coordinates, its flow and its distance to the bank come from the
// geometry (see THE LAVA SHEET), and the flow is drawn as a FLOWMAP: two
// copies of the pattern carried along the flow, each fading out before it
// is reset, half a cycle apart, so a flow that changes from vertex to vertex
// (slow on the sheet, fast down the lip) never tears. The height fog is

// what every liquid shares: the vertex attributes, a moving voronoi, the height fog
function liquidVertex(sh) {

    .replace("#include <common>", "#include <common>\nattribute vec2 aLava, aFlow; attribute float aBank;\nvarying vec3 vWP; varying vec2 vLava, vFlow; varying float vBank;")

  "uniform float uTime;",
  "uniform vec3 uHFogCol; uniform float uHFogTop, uHFogBot, uHFogAmt;",
  "vec2 lh2(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }",
  "vec2 lvor(vec2 x) {",

  "  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {",

  "    vec2 r = g + o - f; float d = dot(r, r);",

  "float lsh(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }",
  "float lsn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);",
  "  return mix(mix(lsh(i), lsh(i + vec2(1.0, 0.0)), f.x), mix(lsh(i + vec2(0.0, 1.0)), lsh(i + vec2(1.0, 1.0)), f.x), f.y); }"].join("\n");

  "gl_FragColor.rgb = mix(gl_FragColor.rgb, uHFogCol, uHFogAmt * (1.0 - smoothstep(uHFogBot, uHFogTop, vWP.y)));";
// the flowmap's two phases, half a cycle apart, and the weight between them
const LIQ_PHASES = "float lp1 = fract(uTime * 0.5), lp2 = fract(uTime * 0.5 + 0.5), lw = abs(1.0 - 2.0 * lp1);";

        "float wcell = mix(v1.x, v2.x, lw), fast = smoothstep(0.5, 1.0, wsp);",
        "vec3 wc = mix(uDeep, uShallow, 0.3 + 0.6 * wbk);                // shallow toward the banks",
        "wc = mix(wc, uShallow * 1.3, wedge * 0.4 * uRipple);            // ripples",
        "// rafts of scum (duckweed): a slow noise carried by the flow, thicker toward the banks",

const SAND = { uTime: SEA.uTime, uLight: { value: new THREE.Color() }, uDark: { value: new THREE.Color() } };

      let g = jitter(box(0.84, 0.035, 0.06, 0.015), 0.01, sd + 90 + d); tint(g, P.snowTop, P.snowSide); f(g, 0, 0.285, 0.04);
      for (const u of [-0.4, 0, 0.4]) { g = new THREE.IcosahedronGeometry(0.045, 0); g.scale(1, 0.6, 1); tint(g, P.snowTop, P.snowSide); f(g, u, 0.33, 0); }
    }
  }
}

// ---- a bridge: planks across its axis, sagging over the whole run ----------
function buildBridge(i, j, c) {
  {                                                              // over a channel, the river or the lava runs on under the bridge
    const ls = DIRS.map(([dx, dz]) => at(i + dx, j + dz)).filter(isLiquid).sort((a, b) => a.h - b.h);
    if (ls.length) buildTile(i, j, { h: ls[0].h, s: ls[0].s, p: "", r: 0 });
  }
  const rnd = cellRnd(i, j), sd = Math.floor(rnd() * 1e6);
  const ax = (link(at(i - 1, j)) ? 1 : 0) + (link(at(i + 1, j)) ? 1 : 0), az = (link(at(i, j - 1)) ? 1 : 0) + (link(at(i, j + 1)) ? 1 : 0);
  const alongX = ax >= az, [dx, dz] = alongX ? [1, 0] : [0, 1];
  const isB = (n) => n && n.s === "b";
  let back = 0, fwd = 0;
  while (isB(at(i - dx * (back + 1), j - dz * (back + 1)))) back++;
  while (isB(at(i + dx * (fwd + 1), j + dz * (fwd + 1)))) fwd++;
  const n = back + fwd + 1, k = back, y = c.h * STEP - 0.05;
  const f = frame(X(i), y, Z(j), alongX ? 0 : -Math.PI / 2);   // local +x runs along the bridge
  const sagAt = (u) => -P.sag * Math.sin(Math.PI * Math.min(1, Math.max(0, (k + u + 0.5) / n)));
  const N = 6, first = k === 0, last = k === n - 1;
  for (let p = -1; p <= N; p++) {
    if ((p === -1 && !first) || (p === N && !last)) continue;
    const u = -0.5 + (p + 0.5) / N + (p === -1 ? -0.02 : p === N ? 0.02 : 0);
    const g = jitter(box(0.145, 0.05, 0.84 + rnd() * 0.08, 0.012), 0.01, sd + p);
    tintHex(g, WOOD(), 1.08, 0.7);
    g.rotateY((rnd() - 0.5) * 0.12); g.rotateX((rnd() - 0.5) * 0.06);
    f(g, u, sagAt(u) + (rnd() - 0.5) * 0.015, (rnd() - 0.5) * 0.04);
  }
  for (const s of [-0.34, 0.34]) {                               // the stringers under the planks
    for (const half of [-0.25, 0.25]) {
      const g = box(0.52, 0.06, 0.07, 0.015);
      tintHex(g, WOOD(), 0.8, 0.5);
      g.rotateZ(-(sagAt(half + 0.25) - sagAt(half - 0.25)) * 2);
      f(g, half, sagAt(half) - 0.06, s);
    }
  }
  for (const s of [-0.44, 0.44]) {                               // the posts and the rail
    for (const u of [-0.5, 0.5]) {
      if (u === 0.5 && !last) continue;
      const g = jitter(box(0.07, 0.4, 0.07, 0.015), 0.01, sd + 30 + u * 4 + s * 9);
      tintHex(g, WOOD(), 1.0, 0.55); f(g, u, sagAt(u) + 0.12, s);
    }
    const g = box(1.0, 0.035, 0.035, 0.008);
    tintHex(g, RAIL(), 1.1, 0.75); f(g, 0, sagAt(0) + 0.28 + P.sag * 0.3, s);
    if (SNOW()) {                                                // snow on the rail, a lump on each post
      const sg = jitter(box(0.96, 0.03, 0.055, 0.012), 0.008, sd + 40 + s * 9); tint(sg, P.snowTop, P.snowSide);
      f(sg, 0, sagAt(0) + 0.31 + P.sag * 0.3, s);
    }
  }
  if (SNOW()) {                                                  // snow drifted against the rails, over the plank ends
    for (const s of [-0.36, 0.36]) for (let p = 0; p < 3; p++) {
      if (rnd() < 0.35) continue;
      const u = -0.5 + (p + 0.5) / 3 + (rnd() - 0.5) * 0.1, len = 0.14 + rnd() * 0.16;
      const g = jitter(new THREE.IcosahedronGeometry(1, 1), 0.1, sd + 60 + p + s * 9);
      g.scale(len, 0.035, 0.08); tint(g, P.snowTop, P.snowSide); f(g, u, sagAt(u) + 0.03, s);
    }
  }
  if (BIOME().water) {                                          // a pier stands on piles down to the sea floor
    for (const s of [-0.4, 0.4]) {
      const ph = y + P.depth;
      const g = jitter(new THREE.CylinderGeometry(0.05, 0.055, ph, 6), 0.006, sd + 50 + s * 9);
      tintHex(g, WOOD(), 0.85, 0.45); f(g, 0, -ph / 2 - 0.04, s);
      const wp = new THREE.Vector3(0, 0, s).applyAxisAngle(new THREE.Vector3(0, 1, 0), alongX ? 0 : -Math.PI / 2);
      seaShapes.push({ x: X(i) + wp.x, z: Z(j) + wp.z, r: 0.05 });
    }
  }
  if (c.p === "o") coin(X(i), y + sagAt(0) + 0.05, Z(j));
}

// PROPS
// =============================================================================
function emitter(e) { emitters.push(Object.assign({ prio: 1, pool: 0.6, flicker: 0 }, e)); }
function coin(x, ground, z) {
  coins.push({ x, y: ground + 0.36, z, phase: (x * 3.1 + z * 1.7) % TAU });
  emitter({ x, y: ground + 0.35, z, ground, kind: "amber", prio: 1, pool: 0.42, coin: true });
}

// a library item (models/library.js), built in this page's materials and baked
function bake(id, opts, x, y, z, ry, s, rnd) {
  const ctx = {
    rnd,
    mesh: (geo, hex) => { tintHex(geo, hex); return new THREE.Mesh(geo, baseMat); },
    glow: (key) => GLOW[key] || cyanMat,
    mat: () => baseMat
  };
  const grp = item(id).build(ctx, opts || {});
  grp.scale.setScalar(s); grp.rotation.y = ry; grp.position.set(x, y, z);
  grp.updateMatrixWorld(true);
  grp.traverse((m) => { if (m.isMesh) push(m.geometry.clone().applyMatrix4(m.matrixWorld), m.material); });
}

function buildProp(p, x, T, z, ry, rnd, sd, i, j) {
  const f = frame(x, T, z, ry);
  const wpos = (lx, ly, lz) => {
    const v = new THREE.Vector3(lx, ly, lz).applyAxisAngle(new THREE.Vector3(0, 1, 0), ry);
    return { x: x + v.x, y: T + v.y, z: z + v.z };
  };
  let g;
  const bp = biomeProp(p);                                        // a biome's own model for this letter
  if (bp) { bp({ f, wpos, x, T, z, ry, rnd, sd, i, j }); return; }
  switch (p) {
    case "o": coin(x, T, z); break;
    case "h": chest(f, rnd, sd, false); break;

    case "r": {
      if (BIOME().molten) { lavaSpires(f, rnd, sd); break; }
      if (SNOW()) {
        snowRock(f, rnd, sd, 1.3 + rnd() * 0.3, (rnd() - 0.5) * 0.15, (rnd() - 0.5) * 0.15);
        if (rnd() < 0.6) snowRock(f, rnd, sd + 7, 0.55, 0.3, 0.25);
        break;
      }
      bake("rock-single", null, x + (rnd() - 0.5) * 0.2, T - 0.02, z + (rnd() - 0.5) * 0.2, rnd() * TAU, 1.5 + rnd() * 0.5, rnd);
      if (rnd() < 0.5) bake("rock-single", null, x + 0.25, T - 0.02, z - 0.2, rnd() * TAU, 0.7, rnd);
      break;
    }
    case "k": {
      if (BIOME().water) { for (let k = 0; k < 2; k++) tropical(x + (rnd() - 0.5) * 0.3, T, z + (rnd() - 0.5) * 0.3, 1.1 + rnd() * 0.4, rnd); break; }
      if (BIOME().molten) { for (let k = 0; k < 2; k++) thornPlant(x + (rnd() - 0.5) * 0.35, T, z + (rnd() - 0.5) * 0.35, 1.1 + rnd() * 0.5, rnd); break; }
      if (SNOW()) { for (let k = 0; k < 2; k++) frostPlant(x + (rnd() - 0.5) * 0.35, T, z + (rnd() - 0.5) * 0.35, 1.1 + rnd() * 0.5, rnd); break; }
      const n = 3 + Math.floor(rnd() * 3);
      for (let k = 0; k < n; k++) {
        const r = 0.14 + rnd() * 0.12, a = rnd() * TAU, d = k ? 0.1 + rnd() * 0.12 : 0;
        g = jitter(new THREE.IcosahedronGeometry(r, 0), r * 0.18, sd + 90 + k);
        g.scale(1, 0.85, 1);
        tint(g, shade(P.leaf, 1.15), shade(P.grassSide, 0.8));
        f(g, Math.cos(a) * d, r * 0.75, Math.sin(a) * d);
      }
      break;
    }
    case "V": volcano(f, wpos, T, rnd, sd); break;
    case "R": ribcage(f, rnd, sd); break;
    case "t": if (BIOME().molten) { deadTree(f, rnd, sd, 0.75); break; } if (SNOW()) snowPine(f, rnd, sd, 0.6); else bake("tree-round", null, x, T - 0.02, z, rnd() * TAU, 0.95, rnd); break;
    case "n": if (BIOME().molten) { deadTree(f, rnd, sd, 1.05); break; } if (SNOW()) snowPine(f, rnd, sd, 1); else bake("tree-conifer", null, x, T - 0.02, z, rnd() * TAU, 0.9, rnd); break;
    case "x": {
      if (BIOME().molten) { rubies(f, wpos, x, T, z, rnd, sd); break; }
      bake("crystal-cluster", { key: "A", n: 6 }, x, T - 0.02, z, rnd() * TAU, SNOW() ? 0.55 : 0.45, rnd);
      emitter({ ...wpos(0, 0.35, 0), ground: T, kind: "cyan", prio: 2, pool: 0.7 });
      break;
    }
    case "S": {
      for (let k = 0; k < 4; k++) {
        const a = k * TAU / 4 + rnd(), r = 0.06 + rnd() * 0.04;
        g = jitter(new THREE.DodecahedronGeometry(r, 0), r * 0.2, sd + 100 + k); tintHex(g, P.rock, 1.0, 0.65);
        f(g, Math.cos(a) * 0.08, r * 0.5, Math.sin(a) * 0.08);
      }
      g = box(0.05, 0.46, 0.014, 0.006); tint(g, "#f2f6ff", "#9aa6c0"); g.rotateZ(0.06); f(g, 0, 0.25, 0);
      g = box(0.2, 0.035, 0.045, 0.01); tintHex(g, 0xe8b043, 1.1, 0.7); g.rotateZ(0.06); f(g, 0.03, 0.49, 0);
      g = box(0.035, 0.11, 0.035, 0.008); tintHex(g, 0x8a3a30); g.rotateZ(0.06); f(g, 0.035, 0.56, 0);
      g = new THREE.IcosahedronGeometry(0.03, 0); tintHex(g, 0xe8b043); f(g, 0.04, 0.63, 0);
      break;
    }
    case "p": palm(f, rnd, sd); break;
    case "H": hut(f, wpos, T, rnd, sd); break;
    case "u": parasol(f, rnd, sd); break;
    case "B": barrel(f, rnd, sd); if (rnd() < 0.5) barrel(f, rnd, sd, 0.26, 0.12, 0.8); break;
    case "X": crate(f, rnd, sd); break;
    case "F": torch(f, wpos, T, rnd, sd); break;
    case "L": lanternPost(f, wpos, T, rnd, sd); break;
    case "T": if (BIOME().molten) { brazierTower(f, wpos, T, rnd, sd); break; } if (SNOW()) { snowTower(f, wpos, T, rnd, sd, x, z, ry); break; } tower(f, wpos, x, T, z, ry, rnd, sd, i, j); break;
    case "C": if (BIOME().molten) { skullCave(f, wpos, T, rnd, sd); break; } if (SNOW()) { iceCave(f, wpos, T, rnd, sd); break; } cave(f, wpos, T, rnd, sd); break;
    case "U": surfboard(f, rnd, sd); break;
    case "a": pot(f, rnd, sd); break;
    case "e": stairs(f, T, ry, i, j, rnd, sd); break;
    case "Y": boat(x, P.sea, z, ry, rnd, sd); break;
    case "P": portal(f, wpos, T, rnd, sd); break;
  }
}

function tower(f, wpos, x, T, z, ry, rnd, sd, i, j) {
  let g = jitter(new THREE.CylinderGeometry(0.4, 0.45, 1.05, 8), 0.012, sd);

  for (let k = 0; k < 8; k++) {                                   // the boards of the wooden storey

  }
  g = box(0.15, 0.15, 0.05, 0.015); tintHex(g, 0x1b2238); f(g, 0, 1.3, 0.44);
  g = box(0.2, 0.2, 0.04, 0.015); tint(g, P.towerStone, shade(P.towerStone, 0.8)); f(g, 0, 1.3, 0.425);
  g = jitter(new THREE.CylinderGeometry(0.58, 0.48, 0.26, 8), 0.008, sd + 30);
  tint(g, shade(P.towerStone, 1.1), shade(P.towerStone, 0.75)); f(g, 0, 1.66, 0);
  g = new THREE.CylinderGeometry(0.42, 0.42, 0.02, 8); tintHex(g, 0x1a1830); f(g, 0, 1.79, 0);
  for (let k = 0; k < 4; k++) {                                   // the merlons
    const a = Math.PI / 4 + k * Math.PI / 2;
    g = jitter(box(0.32, 0.24, 0.17, 0.035), 0.008, sd + 40 + k);
    tint(g, shade(P.towerStone, 1.12), shade(P.towerStone, 0.85)); g.rotateY(a); f(g, Math.sin(a) * 0.46, 1.9, Math.cos(a) * 0.46);
  }
  for (const a of [0.55, -0.9]) {                                 // the banners
    g = box(0.15, 0.48, 0.02, 0.006); tint(g, shade(P.banner, 1.15), shade(P.banner, 0.7));
    g.rotateY(a); f(g, Math.sin(a) * 0.6, 1.38, Math.cos(a) * 0.6);
    g = box(0.17, 0.03, 0.025, 0.006); tintHex(g, 0xe8b043, 1.1, 0.8);
    g.rotateY(a); f(g, Math.sin(a) * 0.6, 1.62, Math.cos(a) * 0.6);
  }
  g = jitter(box(0.3, 0.44, 0.08, 0.02), 0.006, sd + 50); tintHex(g, P.towerStone, 0.8, 0.55); f(g, 0, 0.22, 0.42);
  g = box(0.21, 0.36, 0.05, 0.03); f(g, 0, 0.19, 0.445, cyanMat);
  for (let k = 0; k < 3; k++) {                                   // the step stones before the door
    g = jitter(box(0.16, 0.04, 0.12, 0.015), 0.01, sd + 60 + k); tintHex(g, P.stone, 1.0, 0.7);
    f(g, (k - 1) * 0.17, 0.01, 0.6 + (k % 2) * 0.05);
  }
  emitter({ ...wpos(0, 0.3, 0.85), ground: T, kind: "cyan", prio: 4, pool: 0.7, soft: 0.6 });
  // a lean-to on the left, when the block there is as high to stand it on
  const lx = -1, n = at(i + Math.round(Math.cos(ry) * lx), j + Math.round(-Math.sin(ry) * lx));
  if (solid(n) && n.h === grid[j][i].h) {
    for (const s of [-0.35, 0.35]) {
      g = jitter(box(0.06, 0.62, 0.06, 0.012), 0.01, sd + 70 + s * 10); tintHex(g, P.wood, 1.0, 0.55); f(g, -0.95, 0.31, s);
    }
    for (let k = 0; k < 6; k++) {

function portal(f, wpos, T, rnd, sd) {
  let g = jitter(new THREE.CylinderGeometry(0.43, 0.47, 0.08, 8), 0.008, sd);
  tintHex(g, P.stone, 1.0, 0.65); f(g, 0, 0.04, 0);

  tintHex(g, P.stone, 1.1, 0.75); f(g, 0, 0.1, 0);
  g = new THREE.CylinderGeometry(0.26, 0.26, 0.015, 24); f(g, 0, 0.135, 0, cyanMat);
  g = new THREE.TorusGeometry(0.12, 0.022, 4, 16); g.rotateX(Math.PI / 2); tintHex(g, 0x14243a); f(g, 0, 0.145, 0);
  g = box(0.04, 0.012, 0.16, 0.004); tintHex(g, 0x14243a); f(g, 0.03, 0.146, 0.02);
  const zA = -0.2;
  for (const s of [-1, 1]) {                                      // the pillars
    g = jitter(box(0.13, 0.62, 0.15, 0.025), 0.01, sd + 10 + s); tintHex(g, P.stone, 1.05, 0.6);
    f(g, s * 0.3, 0.44, zA);
  }
  for (let k = 0; k <= 6; k++) {                                  // the voussoirs of the arch
    const a = k * Math.PI / 6;
    g = jitter(box(0.14, 0.12, 0.15, 0.022), 0.008, sd + 20 + k); tintHex(g, P.stone, 1.08, 0.7);
    g.rotateZ(a - Math.PI / 2); f(g, Math.cos(a) * 0.3, 0.75 + Math.sin(a) * 0.3, zA);
  }
  for (let k = 0; k < 4; k++) {                                   // the glow running down the inner arch
    const a = Math.PI / 2 - k * 0.22;
    g = box(0.05, 0.08, 0.03, 0.01); g.rotateZ(a - Math.PI / 2);
    f(g, Math.cos(a) * 0.215, 0.75 + Math.sin(a) * 0.215, zA + 0.02, cyanMat);
  }
  g = box(0.035, 0.32, 0.025, 0.01); f(g, 0.17, 0.72, zA + 0.03, cyanMat);
  for (let k = 0; k < 6; k++) {                                   // vines on the arch
    const a = rnd() * Math.PI, s = 0.4 + rnd() * 0.3;

  emitter({ ...wpos(0, 0.4, 0), ground: T, kind: "cyan", prio: 5, pool: 0.95 });
}

function cave(f, wpos, T, rnd, sd) {
  const blobs = [[0, 0.32, -0.1, 0.48], [-0.28, 0.22, 0.05, 0.34], [0.3, 0.24, 0.02, 0.36], [0.05, 0.62, -0.18, 0.32],

// =============================================================================
// THE BEACH — the same tile skeleton, other skins
// =============================================================================
// A beach block is a buildTile with the beach's skin: a body of darker sand in
// strata, a cap of packed pale sand with its lip, slate bedded in the cliff.
// What is the beach's own is what lies on top (pebbles, starfish, tropical
// plants) and the two tiles that are not blocks: a deck on stilts and a sea cell.
function scatterBeach(x, T, z, c, rnd, sd) {
  for (let k = Math.floor(rnd() * 4); k > 0; k--) {             // pebbles
    const r = 0.035 + rnd() * 0.035;
    const g = jitter(new THREE.DodecahedronGeometry(r, 0), r * 0.2, sd + 30 + k); g.scale(1, 0.6, 1);
    tintHex(g, P.slate, 1.1, 0.7); g.translate(x + (rnd() - 0.5) * 0.8, T + r * 0.3, z + (rnd() - 0.5) * 0.8); push(g);
  }
  if (rnd() < 0.14) starfish(x + (rnd() - 0.5) * 0.6, T, z + (rnd() - 0.5) * 0.6, rnd() * TAU, 0.8 + rnd() * 0.5);
  let n = Math.floor(P.ferns * rnd() * 1.8);
  if (BIG[c.p]) n = Math.min(n, 1);
  for (let k = 0; k < n; k++) {
    const a = rnd() * 0.84 - 0.42, b = (rnd() < 0.5 ? -1 : 1) * (0.3 + rnd() * 0.12);
    const [fx, fz] = rnd() < 0.5 ? [a, b] : [b, a];
    tropical(x + fx, T, z + fz, 0.55 + rnd() * 0.5, rnd);
  }
}

// a wood deck standing in the water: planks, beams, four piles to the sea floor
function buildStilts(i, j, c) {
  const rnd = cellRnd(i, j), x = X(i), z = Z(j), T = c.h * STEP, w = 1 - P.gap, sd = Math.floor(rnd() * 1e6);
  planks(x, T - 0.06, z, w, sd);
  for (const s of [-0.36, 0.36]) {
    const g = box(w, 0.07, 0.08, 0.015); tintHex(g, P.wood, 0.8, 0.5); g.translate(x, T - 0.1, z + s); push(g);
  }
  for (const [px, pz] of [[-0.4, -0.4], [0.4, -0.4], [-0.4, 0.4], [0.4, 0.4]]) {
    const ph = T + P.depth;
    const g = jitter(new THREE.CylinderGeometry(0.055, 0.06, ph, 6), 0.006, sd + px * 7 + pz * 3);
    tintHex(g, P.wood, 0.85, 0.45); g.translate(x + px, T - 0.08 - ph / 2, z + pz); push(g);
    seaShapes.push({ x: x + px, z: z + pz, r: 0.06 });
  }
  const nb = DIRS.map(([dx, dz]) => at(i + dx, j + dz));
  if (c.p === "f") fences(x, T - 0.03, z, w, nb.map((n) => !link(n)), sd);
  else if (c.p) buildProp(c.p, x, T - 0.03, z, c.r * Math.PI / 2, rnd, sd, i, j);
}

// a sea cell: no block, only what stands in the water
function buildSeaCell(i, j, c) {
  const rnd = cellRnd(i, j), x = X(i), z = Z(j), y = P.sea, sd = Math.floor(rnd() * 1e6);
  if (c.p && biomeProp(c.p)) {                                    // a biome's own thing in the water (a ship, an anchor)
    buildProp(c.p, x, y, z, c.r * Math.PI / 2, rnd, sd, i, j);
    seaShapes.push({ x, z, r: 0.34 });
  } else if (c.p === "r") {
    bake("rock-single", null, x, y - 0.2, z, rnd() * TAU, 2.3 + rnd() * 0.5, rnd);
    seaShapes.push({ x, z, r: 0.42 });
  } else if (c.p === "Y") {
    boat(x, y, z, c.r * Math.PI / 2, rnd, sd);
    seaShapes.push({ x, z, r: 0.28 });
  } else if (c.p) buildProp(c.p, x, y, z, c.r * Math.PI / 2, rnd, sd, i, j);
}

function tropical(x, y, z, s, rnd) {
  const n = 5 + Math.floor(rnd() * 3), a0 = rnd() * TAU;
  for (let k = 0; k < n; k++) {
    const g = new THREE.ConeGeometry(0.1, 0.42, 4);
    g.translate(0, 0.21, 0); g.scale(1, 1, 0.22);
    g.rotateX(0.55 + rnd() * 0.6); g.rotateY(a0 + k * TAU / n + (rnd() - 0.5) * 0.3);

  }
}

// a cylinder from one point to another (a palm's trunk, a pole)
function limb(a, b, r0, r1, seg) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const g = new THREE.CylinderGeometry(r1, r0, len, seg);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()));
  g.translate((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
  return g;
}
// a palm frond: a strip that rises and droops, folded along its rib, serrated
function frond(len, width, droop) {
  const N = 7, pos = [], c = [], L = [], Rr = [];
  for (let k = 0; k <= N; k++) {
    const t = k / N, hw = width * Math.sin(Math.PI * Math.min(1, t * 1.08)) * (k % 2 ? 0.72 : 1);
    const cx = len * t, cy = 0.16 * t - droop * t * t;
    c.push([cx, cy, 0]); L.push([cx - hw * 0.25, cy - hw * 0.45, -hw]); Rr.push([cx - hw * 0.25, cy - hw * 0.45, hw]);
  }
  const tri = (a, b, d) => { pos.push(...a, ...b, ...d, ...a, ...d, ...b); };   // both faces
  for (let k = 0; k < N; k++) { tri(c[k], L[k], c[k + 1]); tri(L[k], L[k + 1], c[k + 1]); tri(c[k], c[k + 1], Rr[k]); tri(Rr[k], c[k + 1], Rr[k + 1]); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}
// a lathe from a profile of [radius, y] pairs
const lathe = (pts, seg) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg);

function palm(f, rnd, sd) {
  const H = 1.45 + rnd() * 0.45, lean = 0.22 + rnd() * 0.25, segs = 7;
  const at2 = (t) => new THREE.Vector3(lean * t * t, H * t, 0);
  for (let k = 0; k < segs; k++) {
    const t0 = k / segs, t1 = (k + 1) / segs;
    const g = limb(at2(t0), at2(t1), 0.095 - 0.035 * t0, 0.085 - 0.035 * t1, 7);
    tintHex(g, P.trunk, k % 2 ? 1.0 : 0.82, k % 2 ? 0.7 : 0.6); f(g);
  }
  const top = at2(1);
  for (let k = 0; k < 3; k++) {                                 // coconuts
    const a = k * TAU / 3 + 0.4, g = new THREE.IcosahedronGeometry(0.065, 0);
    tintHex(g, 0x7a4a2c, 1.0, 0.6); f(g, top.x + Math.cos(a) * 0.07, top.y - 0.09, top.z + Math.sin(a) * 0.07);
  }
  const n = 8;
  for (let k = 0; k < n; k++) {
    const a = k * TAU / n + rnd() * 0.3;
    const g = frond(0.75 + rnd() * 0.25, 0.15, 0.45 + rnd() * 0.3);
    g.rotateZ((rnd() - 0.3) * 0.25); g.rotateY(a);
    tint(g, shade(P.palm, 1.1), shade(P.palm, 0.55)); f(g, top.x, top.y, top.z);
  }
  const g = new THREE.IcosahedronGeometry(0.08, 0); tintHex(g, P.trunk); f(g, top.x, top.y, top.z);
}

// a staircase on this cell, rising to the block behind it (local -z)
function stairs(f, T, ry, i, j, rnd, sd) {
  const v = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), ry);
  const n = at(i + Math.round(v.x), j + Math.round(v.z));
  const Tn = solid(n) ? n.h * STEP : T + 0.3, rise = Math.max(0.1, Tn - T), steps = Math.max(2, Math.round(rise / 0.12));
  const run = 0.62, sh = rise / steps, sdp = run / steps;
  for (let k = 0; k < steps; k++) {
    let g = box(0.52, 0.045, sdp + 0.02, 0.01); tintHex(g, P.wood, 1.08, 0.7);
    f(g, 0, (k + 1) * sh - 0.022, 0.12 - (k + 0.5) * sdp);
    g = box(0.48, (k + 1) * sh - 0.04, 0.03, 0.006); tintHex(g, P.wood, 0.75, 0.5);
    f(g, 0, ((k + 1) * sh - 0.04) / 2, 0.12 - (k + 1) * sdp + 0.02);
  }
  const ang = Math.atan2(rise, run), len = Math.hypot(rise, run);
  for (const s of [-0.28, 0.28]) {
    const g = box(0.05, 0.08, len, 0.01); g.rotateX(ang); tintHex(g, P.wood, 0.9, 0.55);
    f(g, s, rise / 2 + 0.02, 0.12 - run / 2);
  }
}
function boat(x, y, z, ry, rnd, sd) {

  sh.quadraticCurveTo(-0.2, 0.45, -0.25, 0.05); sh.closePath();
  let g = new THREE.ExtrudeGeometry(sh, { depth: 0.24, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 1, curveSegments: 4 });
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let k = 0; k < p.count; k++) if (p.getY(k) < 0.08) { p.setX(k, p.getX(k) * 0.7); p.setZ(k, p.getZ(k) * 0.82); }
  g.computeVertexNormals();
  tintHex(g, P.wood, 1.05, 0.55); f(g, 0, -0.1, 0);
  g = box(0.36, 0.03, 0.8, 0.01); tintHex(g, P.wood, 0.7, 0.5); f(g, 0, 0.1, -0.05);
  g = box(0.4, 0.05, 0.08, 0.01); tintHex(g, P.wood, 1.1, 0.7); f(g, 0, 0.14, 0.05);
  g = jitter(box(0.16, 0.12, 0.14, 0.015), 0.005, sd); tintHex(g, P.wood, 1.0, 0.6); f(g, 0, 0.17, -0.3);
  g = limb(new THREE.Vector3(0, 0.1, 0.1), new THREE.Vector3(0, 1.15, 0.1), 0.025, 0.02, 6); tintHex(g, P.wood, 0.9, 0.6); f(g);
  g = box(0.03, 0.03, 0.55, 0.006); tintHex(g, P.wood); f(g, 0, 0.34, -0.12);
  g = box(0.015, 0.62, 0.48, 0.005); tint(g, P.sail, shade(P.sail, 0.8)); g.rotateY(0.18); f(g, 0.03, 0.68, -0.12);
  g = box(0.01, 0.1, 0.18, 0.003); tintHex(g, P.cloth); f(g, 0, 1.12, 0.02);

    const m = new THREE.Mesh(mergeGeometries(geos, false), mat); m.castShadow = true; m.receiveShadow = true; grp.add(m);
    geos.forEach((q) => q.dispose());

  buckets = saved;
  grp.position.set(x, y, z); grp.rotation.y = ry;

// =============================================================================
// THE SNOW — the same tile skeleton, a third skin
// =============================================================================
// A snow block is a buildTile with the snow's skin: a cold stone body in
// strata, a thick rounded cap of snow whose lip droops in lumps, icicles under
// every drop. What is the snow's own is the ice (a material of its own), what
// lies on top and the props that read differently under snow.
const snowTint = (g) => tint(g, P.snowTop, P.snowSide);
const iceTint = (g, k = 1) => tint(g, shade(P.ice, 1.12 * k), shade(P.iceDeep, 0.95 * k));

// icicles over a drop: a row of short ones hanging from the cap, and now and
// then a long one running down the cliff against the stone
function icicles(x, y, z, along, dx, dz, w, ov, fall, rnd, sd, mat = iceMat, paint = iceTint) {
  const n = 2 + Math.floor(rnd() * 4);
  for (let k = 0; k < n; k++) {
    const u = (rnd() - 0.5) * 0.8, long = fall > 0.55 && rnd() < 0.22;
    const len = long ? 0.3 + rnd() * Math.min(0.45, fall - 0.35) : 0.07 + rnd() * 0.18;
    const r = long ? 0.04 + rnd() * 0.025 : 0.018 + rnd() * 0.022;
    const g = jitter(new THREE.ConeGeometry(r, len, 5), r * 0.2, sd + k);
    g.rotateX(Math.PI);                                            // the point down, the thick end lit
    if (long) g.scale(along ? 1.4 : 0.55, 1, along ? 0.55 : 1.4);  // flattened against the face
    paint(g);
    const e = long ? w / 2 - 0.01 : w / 2 + ov - 0.03 - r;
    g.translate(x + (along ? u : dx * e), y - len / 2, z + (along ? dz * e : u));
    push(g, mat);
  }
}

// a stone path under snow is a sheet of ice: a dark bed, the sheet, its cracks
// as light polylines, and snow drifted into two of its corners
function iceSheet(x, T, z, rnd, sd) {

// a frost plant: a rosette of stiff blue blades

// =============================================================================
// THE LAVA — the same tile skeleton, a fourth skin
// =============================================================================
// A lava block is a buildTile with the lava's skin: a basalt body in strata,
// a thick cap of ash stone, no drips but VEINS of lava in the cliff under it.
// A lava cell ("v") is a buildTile too, with a molten sheet for a cap and a
// lava fall for a lip. Everything that glows is either the lava material

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// The pattern is not projected per face (that is what showed every tile and
// every edge): each vertex carries its own coordinates in the pattern, its
// flow and its distance to the bank.
//   aLava  UNFOLDED coordinates: the top is the xz plane, and a fall is laid
//          out flat beyond its edge (the edge point plus the arc length down
//          the fall), so the pattern runs on over the lip without a break
//   aFlow  where the lava goes, in that same plane: each cell flows toward the
//          nearest fall (a breadth-first walk from the outlets), averaged at
//          the cell corners so two tiles agree on their shared edge, and
//          speeding up smoothly down the lip of a fall

//          cools into a dark crust along its banks, which is what hides the
//          line where it meets the rock

// the height of the lava in a cell: a lava cell's, or under a bridge the lowest lava beside it
function lavaAt(i, j) {
  const n = at(i, j);
  if (!n) return null;
  if (isLiquid(n)) return n.h;
  if (n.s === "b") {
    const hs = DIRS.map(([dx, dz]) => at(i + dx, j + dz)).filter(isLiquid).map((m) => m.h);
    return hs.length ? Math.min(...hs) : null;

}

  const [dx, dz] = DIRS[d], lh = lavaAt(i + dx, j + dz), n = at(i + dx, j + dz);

}

  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const h = lavaAt(i, j);
    if (h == null) continue;
    let fx = 0, fz = 0;
    for (let d = 0; d < 4; d++) if (lavaSide(i, j, h, d) === "fall") { fx += DIRS[d][0]; fz += DIRS[d][1]; }

    const [i, j] = q[k], h = lavaAt(i, j);

      const kk = key(i + dx, j + dz);

      dist.set(kk, dist.get(key(i, j)) + 1); q.push([i + dx, j + dz]); M.set(kk, [-dx, -dz]);

function cornerFlow(I, J, h) {

    if (kind !== "lava" && bottom > -P.depth + 0.1) foamFoot(kind, i, j, d, x + dx * (e0 + 0.04), bottom, z + dz * (e0 + 0.04), tx, tz, ta, tb);
  }

  g.setAttribute("aLava", new THREE.Float32BufferAttribute(lav, 2));
  g.setAttribute("aFlow", new THREE.Float32BufferAttribute(flo, 2));

// veins of lava in a cliff: now and then a seam under the cap, and cracks that
// zigzag down the face, the odd one branching
function lavaVeins(x, y, z, along, dx, dz, w, ov, fall, rnd, sd, mat = veinMat) {
  const face = w / 2 - 0.012;
  const put = (u, yy, L, ang, t = 0.024) => {
    const g = along ? box(L, t, 0.02, 0.006) : box(0.02, t, L, 0.006);
    if (along) g.rotateZ(ang); else g.rotateX(-ang);
    g.translate(x + (along ? u : dx * face), yy, z + (along ? dz * face : u)); push(g, mat);
  };
  if (rnd() < 0.4) put((rnd() - 0.5) * 0.3, y - 0.07, 0.3 + rnd() * 0.4, 0, 0.02);
  if (fall < 0.35) return;
  const n = rnd() < 0.6 ? 1 : 2;
  for (let c = 0; c < n; c++) {
    let u = (rnd() - 0.5) * 0.6, yy = y - 0.08 - rnd() * 0.15;
    for (let s = 0; s < 6; s++) {
      const du = (rnd() - 0.5) * 0.26, dy = -(0.08 + rnd() * 0.16);
      if (yy + dy < y - fall + 0.05 || Math.abs(u + du) > 0.42) break;
      put(u + du / 2, yy + dy / 2, Math.hypot(du, dy) + 0.02, Math.atan2(dy, du));
      if (rnd() < 0.25) put(u + du + 0.05, yy + dy - 0.03, 0.12, -0.6, 0.018);
      u += du; yy += dy;
    }
  }
  if (fall > 0.6 && rnd() < 0.45) put((rnd() - 0.5) * 0.4, y - fall + 0.08 + rnd() * 0.1, 0.25 + rnd() * 0.3, (rnd() - 0.5) * 0.3, 0.02);
}

// the lava's scatter: a plate or two, stones, a crack of lava, thorns on the rim
function scatterLava(x, T, z, c, rnd, sd) {

    for (let k = Math.floor(rnd() * 2.4); k > 0; k--) {

      g.rotateY(rnd() * TAU); g.translate(x + (rnd() - 0.5) * 0.6, T + 0.005, z + (rnd() - 0.5) * 0.6); push(g);
    }

      let px = (rnd() - 0.5) * 0.4, pz = (rnd() - 0.5) * 0.4, a = rnd() * TAU;
      for (let s = 0; s < 3; s++) {
        const L = 0.1 + rnd() * 0.12, nx = px + Math.cos(a) * L, nz = pz + Math.sin(a) * L;
        if (Math.abs(nx) > 0.4 || Math.abs(nz) > 0.4) break;
        g = box(L + 0.02, 0.012, 0.024, 0.004); g.rotateY(-a); g.translate(x + (px + nx) / 2, T + 0.002, z + (pz + nz) / 2); push(g, veinMat);
        px = nx; pz = nz; a += (rnd() - 0.5) * 1.4;

    g.translate(x + (rnd() - 0.5) * 0.8, T + r * 0.3, z + (rnd() - 0.5) * 0.8); push(g);
  }
  let n = Math.floor(P.ferns * rnd() * 1.3);

}

// =============================================================================
// MORE BIOMES — garden, factory, castle, fair, dark, mine, pirate
// =============================================================================
// Each is a skin of the same tile skeleton (SKINS) and a table of its own
// models (BIOME_PROPS): a letter of the level means what that biome makes of
// it ("T" is a round tower in the castle, a striped chimney in the factory,
// a watchtower for the pirates), and every letter it does not redefine keeps
// its common model.
const biomeProp = (p) => (BIOME_PROPS[LEVELS[levelName].biome] || {})[p];

// ---- shared helpers ------------------------------------------------------------
// a frame stuck on a cliff face: local +z points out of the face, local x runs
// along it, local y is the world's height
const faceFrame = (x, z, dx, dz, dist) => frame(x + dx * dist, 0, z + dz * dist, Math.atan2(dx, dz));
// colours by triangle: stripes around the vertical axis (a tent, a parasol), or bands up it (a chimney)
function stripeBy(geo, n, ca, cb, byHeight) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const p = g.attributes.position, col = new Float32Array(p.count * 3), A = new THREE.Color(ca), B = new THREE.Color(cb);
  g.computeBoundingBox();
  const y0 = g.boundingBox.min.y, span = Math.max(1e-4, g.boundingBox.max.y - y0);
  for (let t = 0; t < p.count; t += 3) {
    const cx = (p.getX(t) + p.getX(t + 1) + p.getX(t + 2)) / 3, cy = (p.getY(t) + p.getY(t + 1) + p.getY(t + 2)) / 3, cz = (p.getZ(t) + p.getZ(t + 1) + p.getZ(t + 2)) / 3;
    const k = byHeight ? Math.floor((cy - y0) / span * n * 0.999) % 2 : Math.floor(((Math.atan2(cz, cx) + Math.PI) / TAU) * n) % 2;
    for (let v = 0; v < 3; v++) {
      const sh = 0.72 + 0.35 * (p.getY(t + v) - y0) / span, c = k ? A : B;
      col.set([c.r * sh, c.g * sh, c.b * sh], 3 * (t + v));
    }
  }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  return g;
}
function starGeo(r, depth, inner = 0.45) {
  const sh = new THREE.Shape();
  for (let k = 0; k < 10; k++) {
    const a = Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * inner : r;
    if (k) sh.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else sh.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: depth * 0.3, bevelSize: depth * 0.3, bevelSegments: 1 });
  return g.translate(0, 0, -depth / 2);
}
function gearGeo(rOut, rIn, teeth, depth, hole) {
  const sh = new THREE.Shape();
  for (let t = 0; t < teeth; t++) for (const [q, r] of [[0, rIn], [0.18, rOut], [0.5, rOut], [0.68, rIn]]) {
    const a = (t + q) / teeth * TAU;
    if (!t && !q) sh.moveTo(Math.cos(a) * r, Math.sin(a) * r); else sh.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  sh.closePath();
  if (hole) { const h = new THREE.Path(); h.absarc(0, 0, hole, 0, TAU, true); sh.holes.push(h); }
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 1, curveSegments: 10 });
  return g.translate(0, 0, -depth / 2);
}
// a thorny vine along a curve: a tube, and spikes standing out of it
function thornTube(f, pts, r, spikes, rnd) {
  const curve = new THREE.CatmullRomCurve3(pts.map(([a, b, c]) => V3(a, b, c)));

const QUAD_VS = "varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }";
const TILT = {
  uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() }, uFocus: { value: 0.5 },
    uBand: { value: 0.1 }, uSoft: { value: 0.3 }, uMax: { value: 3 } },
  vertexShader: QUAD_VS,
  fragmentShader: [
    "uniform sampler2D tDiffuse; uniform vec2 uDir; uniform float uFocus, uBand, uSoft, uMax; varying vec2 vUv;",
    "void main() {",
    "  float r = uMax * smoothstep(uBand, uBand + uSoft, abs(vUv.y - uFocus));",
    "  if (r < 0.05) { gl_FragColor = texture2D(tDiffuse, vUv); return; }",
    "  vec4 c = vec4(0.0); float ws = 0.0;",
    "  for (int i = -6; i <= 6; i++) {",
    "    float fi = float(i), w = exp(-fi * fi / 18.0); vec4 s = texture2D(tDiffuse, vUv + uDir * fi * r / 3.0);",
    "    if (s == s) { c += s * w; ws += w; }",
    "  }",
    "  gl_FragColor = ws > 0.0 ? c / ws : vec4(0.0);",
    "}"].join("\n")
};
const GRADE = {
  uniforms: { tDiffuse: { value: null }, uSat: { value: 1 }, uCon: { value: 1 }, uWarm: { value: 0 }, uTint: { value: 0 },
    uLift: { value: new THREE.Color() }, uLiftAmt: { value: 0 }, uVig: { value: 0 } },
  vertexShader: QUAD_VS,
  fragmentShader: [
    "uniform sampler2D tDiffuse; uniform float uSat, uCon, uWarm, uTint, uLiftAmt, uVig; uniform vec3 uLift; varying vec2 vUv;",
    "void main() {",
    "  vec3 c = texture2D(tDiffuse, vUv).rgb;",
    "  c *= vec3(1.0 + uWarm, 1.0 - uTint, 1.0 - uWarm);",
    "  c = 0.18 * pow(max(c, vec3(1e-5)) / 0.18, vec3(uCon));",
    "  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));",

    "  c += uLift * uLiftAmt * (1.0 - smoothstep(0.0, 0.35, l));",
    "  c *= mix(1.0, smoothstep(0.95, 0.25, length((vUv - 0.5) * vec2(1.0, 1.25))), uVig);",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n")

function buildComposer() {

  composer = new EffectComposer(renderer, rt);

  for (const m of [gtaoPass.gtaoMaterial, gtaoPass.pdMaterial]) { m.defines.NORMAL_VECTOR_TYPE = 0; m.needsUpdate = true; }

  ["p:", "No prop"], ["p:f", "Fence"], ["p:o", "Coin"], ["p:r", "Rock"], ["p:k", "Bush"], ["p:t", "Tree"],
  ["p:n", "Pine"], ["p:x", "Crystal"], ["p:S", "Sword"], ["p:T", "Tower"], ["p:P", "Portal"], ["p:C", "Cave"],
  ["p:e", "Stairs"], ["p:p", "Palm"], ["p:H", "Hut"], ["p:u", "Parasol"], ["p:B", "Barrel"], ["p:X", "Crate"],
  ["p:F", "Torch"], ["p:L", "Lantern"], ["p:U", "Surfboard"], ["p:Y", "Boat"], ["p:a", "Pot"], ["p:V", "Volcano"], ["p:R", "Ribcage"], ["p:h", "Chest"]
];
let tool = "orbit";
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function cellUnder(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  let p;
  if (hit) {
    p = hit.point.clone();
    if (hit.face) p.addScaledVector(hit.face.normal, -0.05);
  } else {
    p = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), BIOME().water ? -P.sea : 0), p)) return null;
  }
  const i = Math.round(p.x + cols / 2 - 0.5), j = Math.round(p.z + rows / 2 - 0.5);
  return i >= 0 && j >= 0 && i < cols && j < rows ? { i, j } : null;
}
function neighbourHeight(i, j) {
  let s = 0, n = 0;
  for (const [dx, dz] of DIRS) { const c = at(i + dx, j + dz); if (c) { s += c.h; n++; } }
  return n ? Math.round(s / n) : 2;
}
function editAt(i, j) {
  let c = grid[j][i];
  if (tool === "raise") c = c ? { ...c, h: Math.min(9, c.h + 1) } : { h: Math.max(1, neighbourHeight(i, j)), s: "g", p: "", r: 0 };
  else if (tool === "lower") c = !c ? null : c.h <= 0 ? null : { ...c, h: c.h - 1 };
  else if (tool === "turn") { if (c) c = { ...c, r: (c.r + 1) % 4 }; }
  else if (tool === "void") c = null;
  else if (tool.startsWith("s:")) {
    const s = tool[2];
    c = c ? { ...c, s } : { h: neighbourHeight(i, j), s, p: "", r: 0 };
    if (s === "b" && c.p && c.p !== "o") c.p = "";
  } else if (tool.startsWith("p:")) {
    if (c) c = { ...c, p: tool.slice(2) };
    else if (BIOME().water && "rY".includes(tool.slice(2))) c = { h: 0, s: "v", p: tool.slice(2), r: 0 };
  }
  grid[j][i] = c;
  levelChanged();
}
function levelChanged() {
  edits[levelName] = levelText(grid); store.set("edits", edits);
  if (levelTextEl) levelTextEl.value = levelText(grid);
  buildLevel();
}

let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt || tool === "orbit") return;
  if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) return;
  const c = cellUnder(e);
  if (c) editAt(c.i, c.j);
});
const tip = document.getElementById("cellTip"), hover = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 0.02, 1)), new THREE.LineBasicMaterial({ color: 0xffffff }));
hover.visible = false; scene.add(hover);
canvas.addEventListener("pointermove", (e) => {
  if (tool === "orbit" || e.buttons) { tip.style.display = "none"; hover.visible = false; return; }
  const c = cellUnder(e);
  if (!c) { tip.style.display = "none"; hover.visible = false; return; }
  const cell = grid[c.j][c.i];
  hover.visible = true; hover.position.set(X(c.i), cell ? cell.h * STEP + 0.03 : 0.01, Z(c.j));
  const r = stage.getBoundingClientRect();
  tip.style.display = "block"; tip.style.left = e.clientX - r.left + 14 + "px"; tip.style.top = e.clientY - r.top + 14 + "px";
  tip.textContent = "col " + c.i + " · row " + c.j + " · " + cellText(cell);
});
canvas.addEventListener("pointerleave", () => { tip.style.display = "none"; hover.visible = false; });

// =============================================================================
// PANEL
// =============================================================================
const presetBtns = [], camBtns = [], toolBtns = [], levelBtns = [];
let levelTextEl = null;
function refreshButtons() {
  presetBtns.forEach((b, i) => b.classList.toggle("on", i === presetIdx));
  camBtns.forEach((b, i) => b.classList.toggle("on", i === camIdx));
  toolBtns.forEach((b) => b.classList.toggle("on", b.dataset.tool === tool));
  levelBtns.forEach((b) => b.classList.toggle("on", b.dataset.level === levelName));
}
const inputs = {};
function fmt(v, step) { return typeof v === "number" ? (step >= 1 ? v.toFixed(0) : step >= 0.1 ? v.toFixed(1) : step >= 0.01 ? v.toFixed(2) : v.toFixed(3)) : v; }
let rebuildTimer = 0;
function rebuildSoon() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(buildLevel, 140); }
function button(label, cls, fn) { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; return b; }
function buildPanel() {
  const root = document.getElementById("controls");
  const sec = (title, open) => { const d = document.createElement("details"); d.open = open; d.innerHTML = "<summary>" + title + "</summary><div class='body'></div>"; root.appendChild(d); return d.querySelector(".body"); };
  const btnRow = (parent, cls) => { const r = document.createElement("div"); r.className = "btns" + (cls ? " " + cls : ""); parent.appendChild(r); return r; };

  let b = sec("Presets", true), row = btnRow(b);
  PRESETS.forEach((p, i) => { const bt = button(p.name, "", () => { presetIdx = i; P = Object.assign({}, BASE, PRESETS[i]); syncPanel(); buildLevel(); refreshButtons(); saveSoon(); }); row.appendChild(bt); presetBtns.push(bt); });

  b = sec("Camera", true); row = btnRow(b);
  CAMS.forEach((c, i) => { const bt = button(c.name, "", () => applyCam(i)); row.appendChild(bt); camBtns.push(bt); });
  b.appendChild(button("Freeze / resume", "wide", () => { frozen = !frozen; }));

  b = sec("Level", true); row = btnRow(b);
  Object.keys(LEVELS).forEach((name) => {
    const bt = button(name[0].toUpperCase() + name.slice(1), "", () => {
      const was = LEVELS[levelName].biome;
      levelName = name; store.set("level", name);
      if (LEVELS[name].biome !== was) { presetIdx = presetFor(LEVELS[name].biome); P = Object.assign({}, BASE, PRESETS[presetIdx]); syncPanel(); saveSoon(); }
      grid = parseLevel(edits[name] || LEVELS[name].text); levelTextEl.value = levelText(grid);
      buildLevel(); applyCam(camIdx); refreshButtons();
    });
    bt.dataset.level = name; row.appendChild(bt); levelBtns.push(bt);
  });
  let s = document.createElement("div"); s.className = "sub"; s.textContent = "Edit tool (click a cell)"; b.appendChild(s);
  row = btnRow(b, "tools");
  TOOLS.forEach(([key, label]) => { const bt = button(label, "", () => { tool = key; refreshButtons(); }); bt.dataset.tool = key; row.appendChild(bt); toolBtns.push(bt); });
  s = document.createElement("div"); s.className = "sub"; s.textContent = "Level as text — height, surface, prop, turn"; b.appendChild(s);
  levelTextEl = document.createElement("textarea"); levelTextEl.id = "levelText"; levelTextEl.spellcheck = false;
  levelTextEl.value = levelText(grid); b.appendChild(levelTextEl);
  row = btnRow(b);
  row.append(
    button("Apply text", "", () => { grid = parseLevel(levelTextEl.value); levelChanged(); applyCam(camIdx); }),
    button("Copy level", "", () => { const t = levelText(grid); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => prompt("Level", t)); }),
    button("Grow margin", "", () => { grid = [Array(cols + 2).fill(null), ...grid.map((r) => [null, ...r, null]), Array(cols + 2).fill(null)]; levelChanged(); applyCam(camIdx); }),
    button("Reset level", "", () => { delete edits[levelName]; store.set("edits", edits); grid = parseLevel(LEVELS[levelName].text); levelTextEl.value = levelText(grid); buildLevel(); applyCam(camIdx); }),
    button("Reseed", "", () => { seed = (seed * 48271 + 11) % 2147483647; store.set("seed", seed); buildLevel(); })
  );

  for (const [title, items] of SCHEMA) {
    b = sec(title, false);
    for (const [key, label, type, a, c, step] of items) {
      const r = document.createElement("div"); r.className = "row " + type;
      let el;
      if (type === "range") { el = document.createElement("input"); el.type = "range"; el.min = a; el.max = c; el.step = step; }
      else if (type === "color") { el = document.createElement("input"); el.type = "color"; }
      else if (type === "bool") { el = document.createElement("input"); el.type = "checkbox"; }
      else { el = document.createElement("select"); a.forEach((o) => { const op = document.createElement("option"); op.value = o; op.textContent = o; el.appendChild(op); }); }
      const lab = document.createElement("label"), out = document.createElement("b");
      lab.append(label, type === "range" ? out : el);
      r.appendChild(lab); if (type === "range") r.appendChild(el);
      el.addEventListener("input", () => {
        P[key] = type === "range" ? +el.value : type === "bool" ? el.checked : el.value;
        if (type === "range") out.textContent = fmt(P[key], step);
        if (REBUILD.has(key)) rebuildSoon(); else applyAll();
        saveSoon();
      });
      inputs[key] = { el, out, type, step };
      b.appendChild(r);
    }
  }
  b = sec("Settings", false);
  const cp = button("Copy settings", "wide", () => {
    const t = JSON.stringify(P, null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { cp.textContent = "Copied"; setTimeout(() => (cp.textContent = "Copy settings"), 1200); }, () => prompt("Settings", t));
  });
  const ps = button("Paste settings", "wide", () => {
    const t = prompt("Paste the settings JSON"); if (!t) return;
    try { P = Object.assign({}, BASE, JSON.parse(t)); syncPanel(); buildLevel(); saveSoon(); } catch (e) { alert("Not valid JSON"); }
  });
  b.append(cp, ps);
}
function syncPanel() {
  for (const k in inputs) {
    const { el, out, type, step } = inputs[k];
    if (type === "bool") el.checked = !!P[k]; else el.value = P[k];
    if (type === "range") out.textContent = fmt(P[k], step);
  }
}

// =============================================================================
// LOOP
// =============================================================================
function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(200, Math.floor(r.width)); H = Math.max(200, Math.floor(r.height));
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  buildComposer(); applyAll();
}
window.addEventListener("resize", () => { resize(); });

let frozen = qs.has("freeze"), time = 0, last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
const statsEl = document.getElementById("stats");
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!frozen) time += dt;
  const pulse = P.pulse ? 1 : 0;
  SEA.uTime.value = time;
  for (const a of animated) {
    if (a.update) { a.update(time * pulse); continue; }           // a ride that turns (a wheel, a carousel)
    if (a.smoke) {                                              // smoke puffs rise out of the crater, swell and thin out
      a.puffs.forEach((m, k) => {
        const ph = ((frozen ? 0.3 : time) * 0.16 + k / a.puffs.length) % 1;
        const sc = a.s || 1, s = sc * (0.1 + ph * 0.2) * Math.min(1, ph / 0.12) * (ph > 0.8 ? (1 - ph) / 0.2 : 1);
        m.position.set(sc * (Math.sin(ph * 4 + k) * 0.06 + ph * 0.12), sc * ph * 1.0, sc * Math.cos(ph * 3 + k) * 0.05);
        m.scale.setScalar(Math.max(0.001, s));
      });
      continue;
    }
    // a boat rocks on the swell
    a.obj.position.y = a.y + Math.sin(time * 1.3 + a.phase) * 0.025 * pulse;
    a.obj.rotation.z = Math.sin(time * 1.1 + a.phase) * 0.05 * pulse;
    a.obj.rotation.x = Math.sin(time * 0.9 + a.phase * 2) * 0.03 * pulse;
  }
  for (const cn of coins) {
    cn.mesh.rotation.y = time * 1.6 + cn.phase;
    cn.mesh.position.y = cn.y + Math.sin(time * 2.2 + cn.phase) * 0.04 * pulse;
  }
  const flick = 1 + pulse * (0.09 * Math.sin(time * 13.1) + 0.06 * Math.sin(time * 7.3 + 1.2) + 0.05 * Math.sin(time * 23.7));
  const breathe = 1 + pulse * 0.12 * Math.sin(time * 2.1);
  cyanMat.emissiveIntensity = P.cyanInt * breathe;
  veinMat.emissiveIntensity = P.lavaInt * 1.8 * (1 + pulse * 0.1 * Math.sin(time * 1.7));
  rubyMat.emissiveIntensity = P.rubyInt * breathe;
  magicMat.emissiveIntensity = P.magicInt * breathe;
  amberMat.emissiveIntensity = P.amberInt * flick;
  coinMat.emissiveIntensity = P.coinGlow;
  for (const l of lights) {
    const e = l.userData.e;
    l.intensity = P.lightInt * (e.coin ? 0.35 : e.soft || 1) * (e.kind === "amber" ? (e.flicker ? flick : 1) : breathe);
  }
  for (const p of pools) p.m.material.opacity = p.e.flicker ? Math.min(1, 0.85 * flick) : p.e.kind === "cyan" ? Math.min(1, 0.9 * breathe) : 1;
  controls.update();
  // fog in units of the camera's distance, so every view gets the same depth
  if (scene.fog) { const dd = camera.position.distanceTo(controls.target); scene.fog.near = dd * P.fogNear; scene.fog.far = dd * Math.max(P.fogFar, P.fogNear + 0.1); }
  composer.render();
  fpsAcc += Math.max(dt, (now - (tick.t || now)) / 1000); tick.t = now; fpsN++;
  if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    statsEl.textContent = cols + " × " + rows + " cells · " + Math.round(stats.tris / 1000) + "k tris\n" +
      levelGroup.children.length + " meshes · " + lights.length + " lights · " + emitters.length + " emitters\n" +
      "build " + stats.ms.toFixed(0) + " ms · " + fps.toFixed(0) + " fps";
    statsEl.style.whiteSpace = "pre";
  }
  requestAnimationFrame(tick);
}

buildPanel();
syncPanel();
resize();
buildLevel();
applyCam(camIdx);
refreshButtons();
document.getElementById("loading").remove();
requestAnimationFrame(tick);
window.__ready = true;
// a handle for a headless bench: read the level back, pick a tool
window.__diorama = { level: () => levelText(grid), tool: (t) => { tool = t; refreshButtons(); } };
</script>
</body>
</html>
