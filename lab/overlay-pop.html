<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — game pop message</title>
<meta name="lab-group" content="tools">
<style>
/* ===========================================================================
   GAME POP MESSAGE — every style of the motor's Pop, fired in a real game.

   This page used to be a design atelier with its own copy of the callout
   machinery, and the copy drifted: it still had eleven styles under their
   first names (incredible, revolution, go) when the motor shipped twelve
   (ribbon, manifest, vert, and `alert` for a mistake as it happens), and
   nothing of `Pop.text`. So it no longer carries a copy of anything. It is
   served by the events bench (`make events` → /pop, `make lab` →
   /events/pop), and it loads the chosen game's own WEB BUILD in the frame —
   the motor's `Pop`, the game's SKIN and face, its painted backdrop — through
   `window.__WEB__`, the same handle lab/game-events-message.html plays a game's
   callouts with.

   What it reads is the motor's own table, `Pop.styles`, so a style added to
   packages/shell/shell.js appears here on the next rebuild with nothing to
   register, and every number printed on a style is the one that ships.

     CALLOUT   Pop.show(style, { word, sub, at, rot, hold }) — the MOMENT a
               game writes. The word and the sub are typed in normal case; the
               motor shouts them with upper() and translates them with Lang.t,
               exactly as in a round.
     VALUE     Pop.text(x, y, str, { color, size, tier, life }) — the number
               floating up from a point of the world, on the canvas. The frame
               pipeline does not turn outside a round, so the page drives the
               three calls it would (clear, tick, draw) while a value lives.

   A click on the game fires the current one THERE: a callout at that point
   (`at` as coordinates), a value from that point. The anchors toggle marks
   the motor's named anchors on the frame, resolved against the game's own
   Layout. The line under the controls is the call as a game would write it.

   What is not here: a new LOOK. A style is designed in the motor itself —
   the POP LAYER block of packages/shell/motor.css and the STYLES table of
   packages/shell/shell.js — and the rebuild the events server runs on save
   brings it straight into this frame. Mind docs/ENGINE.md, "The overlay must
   never cost the gameplay a frame", before adding a layer to one.
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }

body {
  height:100vh; overflow:hidden; display:flex;
  background:#0b0b12; color:#e8e6f5;
  font:600 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

/* --- the panel ----------------------------------------------------------- */
#panel { flex:0 0 400px; display:flex; flex-direction:column; border-right:1px solid #23233a; background:#12121c; min-width:0; }
#head { padding:14px 16px 10px; border-bottom:1px solid #23233a; }
#head h1 { font-size:14px; letter-spacing:1.5px; text-transform:uppercase; }
#head h1 small { display:block; font-weight:600; font-size:11px; letter-spacing:.4px; color:#8b8ba7; text-transform:none; }
#head .line { display:flex; gap:8px; margin-top:10px; }

select, input[type=text], input[type=number] {
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:7px;
  font:inherit; padding:6px 8px; min-width:0;
}
select:focus, input:focus { outline:none; border-color:#7ea6ff; }
#game-pick { flex:1; font-weight:700; }

#body { flex:1; overflow-y:auto; padding:6px 16px 20px; }
#body::-webkit-scrollbar { width:10px; }
#body::-webkit-scrollbar-thumb { background:#26263c; border-radius:8px; }

h2 { margin:16px 0 8px; font-size:10px; font-weight:700; line-height:1.4; letter-spacing:1.3px; text-transform:uppercase; color:#7ea6ff; display:flex; gap:8px; align-items:baseline; }
h2 i { font-style:normal; font-weight:600; letter-spacing:.3px; text-transform:none; color:#6f6f92; }

#modes { display:flex; gap:3px; padding:3px; background:#0b0b12; border:1px solid #2c2c47; border-radius:9px; margin-top:12px; }
#modes button { flex:1; padding:7px 10px; border:0; border-radius:7px; background:none; color:#8b8ba7; font-family:inherit; font-size:11px; font-weight:700; line-height:1; letter-spacing:1.1px; cursor:pointer; }
#modes button:hover { color:#e8e6f5; }
#modes button.on { background:#2a2a44; color:#e8e6f5; }
body[data-mode="value"] .only-callout, body[data-mode="callout"] .only-value { display:none; }

/* One tile per style of the motor's table, keyed 1-9 then 0, -, =. */
#styles { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
#styles button {
  position:relative; padding:9px 8px 8px; border:1px solid #26263c; border-radius:8px;
  background:#171725; color:#c9c9e0; text-align:left; cursor:pointer; font-family:inherit; font-size:12px; font-weight:700; line-height:1.2;
}
#styles button:hover { border-color:#3a3a5c; color:#fff; }
#styles button.on { border-color:#7ea6ff; background:#1a2138; color:#fff; }
#styles button kbd { position:absolute; top:6px; right:7px; font:700 10px/1 ui-monospace,Menlo,monospace; color:#5d5d7c; }
#styles button small { display:block; margin-top:3px; font-size:10px; font-weight:600; line-height:1.2; color:#6f6f92; }

.spec { margin-top:8px; padding:8px 10px; border-radius:8px; background:#0e0e18; border:1px solid #1f1f33; font:600 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:#8b8ba7; }
.spec b { color:#c9c9e0; font-weight:700; }

.field { display:grid; grid-template-columns:78px 1fr; gap:8px; align-items:center; margin-top:7px; }
.field label { font-size:11px; color:#8b8ba7; }
.field .row { display:flex; gap:6px; align-items:center; min-width:0; }
.field .row > * { flex:1; }
.field output { flex:0 0 58px; text-align:right; font:700 11px/1 ui-monospace,Menlo,monospace; color:#c9c9e0; }
input[type=range] { accent-color:#7ea6ff; }
input[type=color] { flex:0 0 42px !important; height:30px; border:1px solid #2c2c47; border-radius:7px; background:#0b0b12; padding:2px; }

.btns { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
.btn {
  padding:9px 14px; border:1px solid #2c2c47; border-radius:8px; background:#1b1b2b; color:#c9c9e0;
  font-family:inherit; font-size:11px; font-weight:700; line-height:1; letter-spacing:1px; cursor:pointer; white-space:nowrap;
}
.btn:hover { border-color:#7ea6ff; color:#fff; }
.btn.main { background:#7ea6ff; border-color:#7ea6ff; color:#0b0b12; }
.btn.main:hover { background:#9dbaff; }
.btn.on { border-color:#5fd49a; color:#5fd49a; }

#call {
  margin-top:12px; padding:9px 10px; border-radius:8px; background:#0e0e18; border:1px solid #1f1f33;
  font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b89cff; word-break:break-all; cursor:pointer;
}
#call:hover { border-color:#3a3a5c; }
#hint { margin-top:8px; font-size:11px; color:#6f6f92; min-height:16px; }

/* --- the stage ----------------------------------------------------------- */
#stage { flex:1; display:flex; align-items:center; justify-content:center; background:#08080f; min-width:0; padding:14px; }
#fit { position:relative; transform-origin:top left; }
#frame { display:block; width:720px; height:1280px; border:0; border-radius:26px; background:#05040c; box-shadow:0 30px 80px rgba(0,0,0,.6); }
#veil { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
  font-size:26px; color:#6f6f92; border-radius:26px; background:#0b0b12; }
#veil.hide { display:none; }
.spin { width:48px; height:48px; border-radius:50%; border:5px solid #26263c; border-top-color:#7ea6ff; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body data-mode="callout">

<aside id="panel">
  <div id="head">
    <h1>Game pop message<small id="sub">the motor's Pop, in a real game</small></h1>
    <div class="line"><select id="game-pick"></select></div>
    <div id="modes">
      <button data-mode="callout" class="on">Callout · Pop.show</button>
      <button data-mode="value">Value · Pop.text</button>
    </div>
  </div>

  <div id="body">
    <div class="only-callout">
      <h2>Style <i>the motor's table, keys 1–9, 0, −, =</i></h2>
      <div id="styles"></div>
      <div class="spec" id="spec"></div>

      <h2>Words <i>normal case — the motor shouts</i></h2>
      <div class="field"><label for="word">Word</label><input type="text" id="word"></div>
      <div class="field"><label for="sub-in">Sub</label><input type="text" id="sub-in" placeholder="(none)"></div>

      <h2>Placement <i>empty keeps the style's own</i></h2>
      <div class="field"><label for="at">Anchor</label><select id="at"></select></div>
      <div class="field"><label for="rot">Tilt</label>
        <div class="row"><input type="range" id="rot" min="-20" max="20" step="1"><output id="rot-o"></output></div></div>
      <div class="field"><label for="hold">Hold</label>
        <div class="row"><input type="range" id="hold" min="0" max="3000" step="20"><output id="hold-o"></output></div></div>
    </div>

    <div class="only-value">
      <h2>Value <i>the house look: size 22, life 0.6, tier 1</i></h2>
      <div class="field"><label for="v-text">Text</label><input type="text" id="v-text" value="+40"></div>
      <div class="field"><label for="v-color">Colour</label>
        <div class="row"><input type="color" id="v-color" value="#ffd23f"><input type="text" id="v-color-t" value="#ffd23f"></div></div>
      <div class="field"><label for="v-tier">Tier</label>
        <div class="row"><input type="range" id="v-tier" min="0" max="3" step="1" value="1"><output id="v-tier-o"></output></div></div>
      <div class="field"><label for="v-size">Size</label>
        <div class="row"><input type="range" id="v-size" min="18" max="72" step="1" value="22"><output id="v-size-o"></output></div></div>
      <div class="field"><label for="v-life">Life</label>
        <div class="row"><input type="range" id="v-life" min="0.2" max="2" step="0.05" value="0.6"><output id="v-life-o"></output></div></div>
    </div>

    <div class="btns">
      <button class="btn main" id="fire">Fire  ( space )</button>
      <button class="btn only-callout" id="all">Every style</button>
      <button class="btn" id="anchors">Anchors</button>
      <button class="btn" id="reset">Reset</button>
    </div>
    <div id="call" title="click to copy"></div>
    <div id="hint">A click on the game fires it there.</div>
  </div>
</aside>

<main id="stage">
  <div id="fit">
    <iframe id="frame" title="the game's web build"></iframe>
    <div id="veil"><div class="spin"></div><span id="veil-t">building the games…</span></div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const frame = $("frame");

/* A sample word per style, for what each one is FOR — never a label. A style
   the motor grows later gets its own name until someone writes it one. */
const SAMPLES = {
  score:    { word: "+250" },
  alert:    { word: "Combo lost" },
  combo:    { word: "Combo x2", sub: "+40" },
  streak:   { word: "x5 streak" },
  ribbon:   { word: "Incredible" },
  manifest: { word: "Level up", sub: "Level 12 unlocked" },
  perfect:  { word: "Perfect", sub: "No miss" },
  ultra:    { word: "Ultra", sub: "x12" },
  bonus:    { word: "Mega bonus", sub: "+1000" },
  danger:   { word: "Last chance" },
  record:   { word: "New record", sub: "18 420 pts" },
  vert:     { word: "Go go go" }
};
const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "="];

let styles = {}, anchors = {}, style = null, mode = "callout", showAnchors = false;

/* --- the game ------------------------------------------------------------ */
function web() { try { return frame.contentWindow && frame.contentWindow.__WEB__; } catch (e) { return null; } }

/* The build with everything but the picture out of the way — the stack
   lab/game-events-message.html uses: the overlay over the intro, the intro's painted
   backdrop under the canvas, the menu and the round's controls hidden. */
const BENCH_CSS = `
  #overlay { z-index:40; }
  #screen-intro { z-index:-1 !important; }
  #screen-intro > *:not(.screen-art):not(.decor-layer) { display:none !important; }
  /* A game with a village leaves its splash for the hub after two seconds:
     the hub and its wallet band are views, and none of them is reviewed here. */
  #web-ctls, #screen-end, #screen-loading, #web-hud, #web-village, .wv-screen { display:none !important; }
  .lab-anchor { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
    background:#5ce1ff; box-shadow:0 0 0 4px rgba(0,0,0,.6); z-index:60; pointer-events:none; }
  .lab-anchor b { position:absolute; left:50%; top:20px; transform:translateX(-50%); white-space:nowrap;
    font:800 18px/1 -apple-system,sans-serif; color:#04121e; background:#5ce1ff; padding:4px 7px; border-radius:6px; }
  .lab-anchor.on { background:#ffd23f; } .lab-anchor.on b { background:#ffd23f; }
`;

frame.addEventListener("load", () => {
  let d;
  try { d = frame.contentDocument; } catch (e) { return veil("the build did not load"); }
  if (!d || !frame.contentWindow.__WEB__) return veil("no web build for this game yet — the events server builds it on start");
  const st = d.createElement("style");
  st.textContent = BENCH_CSS;
  d.head.appendChild(st);
  // A click on the game fires the current one where it landed.
  d.addEventListener("pointerdown", (e) => {
    const box = d.getElementById("frame");
    if (!box) return;
    const r = box.getBoundingClientRect();
    const k = 720 / r.width;
    fire({ x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k });
  });
  // The motor's own tables, read once the build has booted.
  const W = web();
  styles = W.Pop.styles || {};
  anchors = W.Pop.anchors || {};
  drawStyles();
  drawAnchorsSelect();
  if (!style || !styles[style]) pick(Object.keys(styles)[0]);
  drawAnchors();
  veil(null);
});

function veil(msg) {
  $("veil").classList.toggle("hide", !msg);
  if (msg) $("veil-t").textContent = msg;
}

function load(slug) {
  veil("loading " + slug + "…");
  try { localStorage.setItem("pop:game", slug); } catch (e) {}
  frame.src = "build/" + slug + "/index.html";
}

/* The value half is drawn on the canvas by the frame pipeline, which is not
   turning outside a round: drive clear, tick and draw while a value lives. */
let juiceUntil = 0, juiceRunning = false;
function juice(seconds) {
  juiceUntil = Math.max(juiceUntil, performance.now() + seconds * 1000);
  if (juiceRunning) return;
  const W = web();
  if (!W) return;
  juiceRunning = true;
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    W.clearWorld(); W.Pop.tick(dt); W.Pop.canvas();
    if (now < juiceUntil) requestAnimationFrame(step);
    else { W.clearWorld(); juiceRunning = false; }
  };
  requestAnimationFrame(step);
}

/* --- the style tiles ----------------------------------------------------- */
function drawStyles() {
  $("styles").innerHTML = Object.keys(styles).map((k, i) =>
    `<button data-k="${k}"${k === style ? ' class="on"' : ""}>${k}` +
    `<small>${styles[k].anim} · ${styles[k].at}</small>${KEYS[i] ? `<kbd>${KEYS[i]}</kbd>` : ""}</button>`).join("");
}

function drawAnchorsSelect() {
  $("at").innerHTML = '<option value="">(the style\'s own)</option>' +
    Object.keys(anchors).map((a) => `<option value="${a}">${a}</option>`).join("");
}

function spec(k) {
  const s = styles[k];
  if (!s) return "";
  const bits = [
    `<b>${k}</b>  anim ${s.anim} · ${s.enter} / ${s.hold} / ${s.exit} ms`,
    `at ${s.at}${s.rot ? " · tilt " + s.rot + "°" : ""}${s.decor && s.decor.length ? " · decor " + s.decor.join(", ") : ""}`
  ];
  const fx = [];
  if (s.letters) fx.push("letters");
  if (s.vertical) fx.push("vertical");
  if (s.pulse) fx.push("pulse");
  if (s.shake) fx.push("shake " + s.shake);
  if (s.flash) fx.push("flash " + s.flash);
  if (s.vignette) fx.push("vignette" + (s.vignetteMs ? " " + s.vignetteMs + " ms" : ""));
  if (s.confetti) fx.push("confetti " + s.confetti);
  if (fx.length) bits.push(fx.join(" · "));
  return bits.join("<br>");
}

function pick(k) {
  if (!styles[k]) return;
  style = k;
  const s = styles[k], sample = SAMPLES[k] || { word: k.charAt(0).toUpperCase() + k.slice(1) };
  $("word").value = sample.word;
  $("sub-in").value = sample.sub || "";
  $("at").value = "";
  $("rot").value = s.rot || 0;
  $("hold").value = s.hold;
  [].forEach.call($("styles").children, (b) => b.classList.toggle("on", b.dataset.k === k));
  $("spec").innerHTML = spec(k);
  sync();
  drawAnchors();
}

/* --- what a fire sends ---------------------------------------------------- */
function calloutOpts(at) {
  const s = styles[style] || {};
  const o = { word: $("word").value };
  if ($("sub-in").value) o.sub = $("sub-in").value;
  if (at) o.at = { x: Math.round(at.x), y: Math.round(at.y) };
  else if ($("at").value) o.at = $("at").value;
  const rot = +$("rot").value;
  if (rot !== (s.rot || 0)) o.rot = rot;
  const hold = +$("hold").value;
  if (hold !== s.hold) o.hold = hold;
  return o;
}

function valueOpts() {
  return { color: $("v-color-t").value, size: +$("v-size").value, tier: +$("v-tier").value, life: +$("v-life").value };
}

// The call as a game would write it — normal-case strings, only what differs.
function callLine() {
  const js = (v) => JSON.stringify(v);
  const obj = (o) => "{ " + Object.keys(o).map((k) =>
    k + ": " + (o[k] && typeof o[k] === "object" ? "{ x: " + o[k].x + ", y: " + o[k].y + " }" : js(o[k]))).join(", ") + " }";
  if (mode === "value") return `Pop.text(x, y, ${js($("v-text").value)}, ${obj(valueOpts())});`;
  return `Pop.show(${js(style)}, ${obj(calloutOpts())});`;
}

function sync() {
  $("rot-o").textContent = $("rot").value + "°";
  $("hold-o").textContent = $("hold").value + " ms";
  $("v-tier-o").textContent = $("v-tier").value;
  $("v-size-o").textContent = $("v-size").value + " px";
  $("v-life-o").textContent = (+$("v-life").value).toFixed(2) + " s";
  $("call").textContent = style || mode === "value" ? callLine() : "";
}

function fire(at) {
  const W = web();
  if (!W) return;
  try { W.Sound.unlock(); } catch (e) {}
  if (mode === "value") {
    const L = W.Layout;
    const x = at ? at.x : L.cx + (Math.random() - 0.5) * L.w * 0.4;
    const y = at ? at.y : L.cy + (Math.random() - 0.5) * L.h * 0.2;
    W.Pop.text(x, y, $("v-text").value, valueOpts());
    juice(+$("v-life").value + 0.3);
    return;
  }
  if (!style) return;
  W.Pop.show(style, calloutOpts(at));
}

/* Every style in the table's order, each one after the last has left. */
let reel = null;
function playAll() {
  const W = web();
  if (!W) return;
  if (reel) { clearTimeout(reel); reel = null; $("all").classList.remove("on"); return; }
  const keys = Object.keys(styles);
  let i = 0;
  $("all").classList.add("on");
  const next = () => {
    if (i >= keys.length) { reel = null; $("all").classList.remove("on"); return; }
    pick(keys[i++]);
    fire();
    reel = setTimeout(() => { reel = setTimeout(next, 250); }, Math.max(400, W.Pop.pending()));
  };
  next();
}

/* --- the anchors, drawn into the game's own overlay ----------------------- */
function drawAnchors() {
  const W = web();
  let d;
  try { d = frame.contentDocument; } catch (e) { return; }
  if (!W || !d) return;
  d.querySelectorAll(".lab-anchor").forEach((n) => n.remove());
  if (!showAnchors) return;
  const host = d.getElementById("overlay") || d.getElementById("frame");
  const L = W.Layout;
  const cur = $("at").value || (styles[style] && styles[style].at);
  Object.keys(anchors).forEach((name) => {
    const a = anchors[name];
    const n = d.createElement("div");
    n.className = "lab-anchor" + (name === cur ? " on" : "");
    n.style.left = (L.left + a[0] * L.w) + "px";
    n.style.top = (L.top + a[1] * L.h) + "px";
    n.innerHTML = "<b>" + name + "</b>";
    host.appendChild(n);
  });
}

/* --- wiring --------------------------------------------------------------- */
$("styles").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) { pick(b.dataset.k); fire(); }
});
$("modes").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  mode = b.dataset.mode;
  document.body.dataset.mode = mode;
  [].forEach.call($("modes").children, (c) => c.classList.toggle("on", c === b));
  sync();
});
["word", "sub-in", "rot", "hold", "v-text", "v-tier", "v-size", "v-life"].forEach((id) => $(id).addEventListener("input", sync));
$("at").addEventListener("change", () => { sync(); drawAnchors(); });
$("v-color").addEventListener("input", () => { $("v-color-t").value = $("v-color").value; sync(); });
$("v-color-t").addEventListener("input", () => {
  if (/^#[0-9a-f]{6}$/i.test($("v-color-t").value)) $("v-color").value = $("v-color-t").value;
  sync();
});
$("fire").addEventListener("click", () => fire());
$("all").addEventListener("click", playAll);
$("anchors").addEventListener("click", () => {
  showAnchors = !showAnchors;
  $("anchors").classList.toggle("on", showAnchors);
  drawAnchors();
});
$("reset").addEventListener("click", () => {
  if (style) pick(style);
  $("v-text").value = "+40"; $("v-color").value = $("v-color-t").value = "#ffd23f";
  $("v-tier").value = 1; $("v-size").value = 22; $("v-life").value = 0.6;
  sync();
  const W = web();
  if (W) W.Pop.clear();
});
$("call").addEventListener("click", () => {
  const t = $("call").textContent;
  navigator.clipboard && navigator.clipboard.writeText(t).then(() => { $("hint").textContent = "copied"; setTimeout(() => { $("hint").textContent = "A click on the game fires it there."; }, 900); });
});
$("game-pick").addEventListener("change", function () { load(this.value); });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); fire(); return; }
  const i = KEYS.indexOf(e.key);
  const k = Object.keys(styles)[i];
  if (i >= 0 && k) { if (mode !== "callout") $("modes").children[0].click(); pick(k); fire(); }
});

/* The frame is the design space, scaled to the room the stage has. */
function fit() {
  const st = $("stage");
  const k = Math.max(0.2, Math.min((st.clientHeight - 28) / 1280, (st.clientWidth - 28) / 720));
  $("fit").style.transform = "scale(" + k + ")";
  $("fit").style.width = "720px";
  $("fit").style.height = "1280px";
  $("fit").style.margin = (-(1280 * (1 - k)) / 2) + "px " + (-(720 * (1 - k)) / 2) + "px";
  $("fit").style.transformOrigin = "center center";
}
window.addEventListener("resize", fit);
fit();

fetch("api/games").then((r) => r.json()).then((list) => {
  const pickEl = $("game-pick");
  pickEl.innerHTML = list.map((g) => `<option value="${g.slug}">${g.title}${g.built ? "" : "  (not built yet)"}</option>`).join("");
  let saved = null;
  try { saved = localStorage.getItem("pop:game"); } catch (e) {}
  if (saved && list.some((g) => g.slug === saved)) pickEl.value = saved;
  load(pickEl.value);
}).catch(() => veil("this page needs its server — make events, then /pop"));
</script>
