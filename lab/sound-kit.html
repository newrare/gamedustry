<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — sound kit</title>
<meta name="lab-group" content="tools">
<style>
/* ===========================================================================
   SOUND KIT — what the shell sounds like, in every game, picked one role at a
   time.

   The web shell used to play three clips copied into every game.js (uiScore,
   uiStar, uiRow), pitched every which way for some seventy moments: a tab, a
   coin landing, a gift opened, a mission lost. The kit names the moments
   instead. A ROLE is what an event MEANS — `tap`, `open`, `coin`, `star`,
   `reward`, `fail` — and holds one to three TAKES cut out of
   assets/audio/sfx/. The shell calls `Sound.ui(role)` and never a file.

   This page is where a role's takes are chosen: the role on the left, its
   takes in the middle — the source drawn as a waveform with the cut on it,
   dragged to move it — and the library under them, narrowed by a search the
   role pre-fills. Hover a file to hear it, click it to put it in the active
   take, + to add it as another one.

   EVERYTHING IS HEARD LEVELLED. tools/lab/cut-kit.mjs brings every take to
   one loudness (its loudest 50 ms window to kit.target dBFS RMS, its peak
   under kit.peak), and this page applies the same measure before it plays a
   thing — a candidate, a take, a role — so two files are compared as they
   will ship and not as two vendors mastered them. `Shipped` plays the files
   on disk now, which is what the games wear until Save.

   Two groups of roles. SHELL roles are what the menus and the end screen play,
   the same in every game: one variant each, `default`. GAMEPLAY roles are a
   game's own events, and a crash in one game is not a crash in another, so
   they hold named VARIANTS (`crash/explosion`, `crash/glass`) — created,
   renamed and dropped here — and a game's manifest maps a key it already plays
   to ONE of them (`"sfx": { "crash": "crash/explosion" }`), which the events
   bench's kit selector writes. The list says which game plays each variant,
   so a take is never changed without knowing who hears it. Hovering a role or
   a variant in the list plays one shot of it, levelled.

   A take is cut on its waveform by its grips: the left edge is the start,
   the right edge the end, the middle moves the window and keeps its length,
   and a press outside it draws a new one. A take cut in the middle of its
   sound may END rather than stop — `Fade` dies out over its last seconds,
   `Drop` does the same while its pitch falls an octave — and the amber grip
   inside the window is where that tail begins. The tail is rendered by the
   same function tools/lab/cut-kit.mjs cuts with (tailPcm, copied below).
   `Pitch` plays the take higher (2 is an octave up) or lower (0.5), and the
   cutter bakes it into the file: the role is the one place a sound is shaped,
   so a game that maps a key to it only says how loud a line plays it. A sound
   that should sound different is another variant, not a setting in a game.

   Inside a variant the TAKES are interchangeable: the engine alternates
   between them so a sound heard twenty times a round does not repeat. They
   are never a choice — a different sound is a different variant.

   Every role and variant says WHO CALLS IT, as tags under its name: the
   shell's files that play it by name (`album`, `barracks`, `every card &
   view`…), and a game that calls `Sound.ui` itself, by its icon — read off
   the source (api/kit `calls`, roleCalls in tools/lab/cut-kit.mjs). A
   gameplay variant also shows the games whose manifest maps a key to it.
   Nothing calling it reads `unused`.

   The + beside a group's heading ADDS A ROLE to it — its name, then one line
   saying what it means — and the + beside a gameplay role's heading adds a
   variant to it. Either starts with no take: click one to three files of the
   library, then Save. `Delete role` drops a role and its variants, and
   `Delete variant` one variant — refused while a source calls it by name or
   a game has CHECKED a line playing it on the events bench (the button says
   which, and the server refuses the same on Save). A game that maps a key to
   it without having checked it is not in the way: its key goes to `empty`,
   which plays nothing, and waits on the events bench for a sound — the
   `Silent` row at the foot of the list counts those keys.

   `Move to…` takes a gameplay variant out of its role and files it under
   another (`bonus`, or `bonus/name` to rename it on the way): a variant
   filed under the wrong meaning is moved, not rebuilt. It is a rename of its
   id, so it follows the same rule — refused only by a call by name — and a
   game that CHECKED it keeps its marks, since a mark stands on the takes and
   the takes travel with it. Moving a role's last variant deletes the role.

   `Rename role` and `Rename` (a variant) are refused only by a call by name,
   which a rename cannot reach: every manifest that maps a key to it follows
   the new name on Save, its version moved, and the checked marks of its lines
   move with it. The page keeps what moved in S.remap ({ old id: new id or
   empty }) and sends it with the kit.

   Save writes assets/audio/kit/kit.json, re-cuts every take and rebuilds the
   web build of the bench: the cut files are committed, the games pick them up
   on the next `node tools/update.mjs`. A gameplay variant is edited the same
   way from the events bench (/sound), on the card of a key that plays it.

   Served by `make events` (tools/lab/serve-events.mjs) at /kit, beside the
   library it reads. Over file:// it has nothing to read and says so.

   Same rules as every lab page: one file, no framework, no CDN, no web font,
   strings in normal case.
   =========================================================================== */
* { box-sizing:border-box; margin:0; padding:0; }
body {
  height:100vh; display:flex; overflow:hidden;
  background:#0b0b12; color:#e8e6f5;
  font:600 13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
button { font:inherit; color:inherit; }
#roles {
  flex:0 0 280px; display:flex; flex-direction:column; gap:4px;
  padding:18px 12px; background:#12121c; border-right:1px solid #23233a; overflow:auto;
}
#roles h1 { font-size:15px; letter-spacing:1px; text-transform:uppercase; padding:0 6px 10px; }
#rq {
  margin:0 4px 8px; padding:7px 10px; background:#0b0b12; color:#e8e6f5;
  border:1px solid #2c2c47; border-radius:8px; font:inherit; font-weight:500;
}
#rq:focus { outline:0; border-color:#7ea6ff; }
#roles .none-left { padding:10px; color:#6f6f92; font-weight:500; }
#roles h1 small { display:block; margin-top:4px; font-size:11px; font-weight:500; color:#8b8ba7; letter-spacing:0; text-transform:none; }
.role {
  display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:8px 10px;
  border:0; border-radius:8px; background:none; text-align:left; cursor:pointer;
}
.role:hover { background:#1a1a2a; }
.role.on { background:#1e2740; }
.role b { font-size:13px; }
.role .n { color:#6f6f92; font-size:11px; }
.role .w { grid-column:1 / -1; color:#8b8ba7; font-size:11px; font-weight:500; }
.role.dirty b::after { content:" •"; color:#ffd08a; }
.role .u { grid-column:1 / -1; color:#8fe0b8; font-size:11px; font-weight:500; }
.role .u.none { color:#6f6f92; }
.role .g { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.role .g img { width:24px; height:24px; border-radius:6px; display:block; background:#1a1a2a; outline-offset:2px; }
.role .g.pending img { animation:kitwait 1.1s ease-in-out infinite; }
@keyframes kitwait { 50% { opacity:.45; } }
.role .g img.v-ok { outline:2px solid #5fd49a; }
.role .g img.v-part { outline:2px dashed #5fd49a; }
.role .g img.v-stale { outline:2px solid #ffb648; }
.role.var { margin-left:12px; padding:5px 10px; }
.role.silent { cursor:default; }
.role.silent:hover { background:none; }
.role-h { padding:8px 10px; border-radius:8px; display:grid; grid-template-columns:1fr auto auto; gap:1px 8px; align-items:center; cursor:pointer; }
.role-h:hover { background:#1a1a2a; }
.role-h.on { background:#1e2740; }
.role-h.open { padding-bottom:2px; }
.role-h .n { color:#6f6f92; font-size:11px; }
.role-h .chev { display:inline-block; width:14px; color:#6f6f92; }
.role-h .w { grid-column:1 / -1; }
.role-h b { font-size:13px; }
.role-h .w { color:#8b8ba7; font-size:11px; font-weight:500; }
.role-h.dirty b::after { content:" •"; color:#ffd08a; }
.vacts { display:flex; gap:6px; }
.grp { padding:14px 10px 4px; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#6f6f92; display:flex; align-items:center; gap:8px; }
.grp span, .role-h .t { flex:1; }
.add {
  flex:0 0 auto; width:22px; height:22px; padding:0; border:1px solid #2c2c47; border-radius:6px;
  background:none; color:#9c9cba; font-size:14px; line-height:1; cursor:pointer;
}
.add:hover { border-color:#7ea6ff; color:#e8e6f5; }
.calls { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; align-items:center; }
.calls .c { padding:0 6px; border-radius:10px; background:#1d2a2a; color:#8fe0b8; font-size:10px; font-weight:600; }
.calls .c.none { background:#1a1a2a; color:#6f6f92; }
.calls img { width:18px; height:18px; border-radius:5px; display:block; }
.calls .lbl { color:#9c9cba; font-size:11px; font-weight:500; margin-right:4px; }
#role-head .calls { flex-basis:100%; margin:0; }
#takes .empty { padding:16px 14px; border:1px dashed #3a3a5c; border-radius:10px; color:#9c9cba; font-weight:500; }
.tag { display:inline-block; margin-left:6px; padding:0 6px; border-radius:10px; background:#2a2440; color:#c8b8ff; font-size:10px; font-weight:600; }
#roles .foot { margin-top:auto; padding:12px 6px 0; display:flex; flex-direction:column; gap:8px; font-size:11px; color:#9c9cba; }
#roles .foot label { display:flex; justify-content:space-between; align-items:center; }
#roles .foot input[type=range] { width:130px; accent-color:#7ea6ff; }

#main { flex:1; display:flex; flex-direction:column; min-width:0; }
#bar {
  display:flex; align-items:center; gap:10px; padding:12px 18px;
  border-bottom:1px solid #23233a; font-size:12px; color:#8b8ba7;
}
#bar .grow { flex:1; }
.btn {
  padding:6px 12px; border:1px solid #2c2c47; border-radius:8px; background:#151522; cursor:pointer;
  font-size:12px;
}
.btn:hover { border-color:#7ea6ff; }
.btn.primary { background:#7ea6ff; border-color:#7ea6ff; color:#0b0b12; }

#role-head { padding:16px 18px 8px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
#role-head h2 { font-size:18px; }
#role-head .w { flex-basis:100%; color:#9c9cba; font-weight:500; }
#role-head label { display:flex; align-items:center; gap:8px; font-size:12px; color:#9c9cba; }
#role-head input[type=range] { width:140px; accent-color:#7ea6ff; }

#takes { padding:4px 18px 10px; display:flex; flex-direction:column; gap:8px; }
.take {
  display:grid; grid-template-columns:28px 1fr auto; gap:6px 10px; align-items:center;
  padding:8px 10px; border:1px solid #23233a; border-radius:10px; background:#11111b; cursor:pointer;
}
.take.on { border-color:#7ea6ff; }
.take .ix { color:#6f6f92; font-size:12px; text-align:center; }
.take .file { font:600 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; }
.take .file small { color:#7d7d9d; font-weight:500; margin-left:8px; }
.take .acts { display:flex; gap:6px; }
.take canvas { grid-column:2 / -1; width:100%; height:72px; display:block; border-radius:6px; background:#0b0b12; cursor:crosshair; touch-action:none; }
.take .nums { grid-column:2 / -1; display:flex; gap:14px; font-size:11px; color:#9c9cba; align-items:center; }
.take .nums label { display:flex; align-items:center; gap:6px; }
.seg { display:inline-flex; border:1px solid #2c2c47; border-radius:7px; overflow:hidden; }
.seg button { padding:3px 10px; border:0; background:none; cursor:pointer; font-size:11px; color:#9c9cba; }
.seg button + button { border-left:1px solid #2c2c47; }
.seg button.on { background:#7ea6ff; color:#0b0b12; }
.take .nums input { width:70px; padding:3px 6px; background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit; }
.ic { width:28px; height:28px; padding:0; border:1px solid #2c2c47; border-radius:7px; background:none; cursor:pointer; }
.ic:hover { border-color:#7ea6ff; }
.ic:disabled { opacity:.35; cursor:default; }

#lib { flex:1; display:flex; flex-direction:column; min-height:0; border-top:1px solid #23233a; }
#lib-head { display:flex; gap:10px; align-items:center; padding:10px 18px; }
#lib-head input {
  flex:1; padding:7px 10px; background:#0b0b12; color:#e8e6f5;
  border:1px solid #2c2c47; border-radius:8px; font:inherit;
}
#lib-head input:focus { outline:0; border-color:#7ea6ff; }
#lib-head span { font-size:11px; color:#6f6f92; }
#list { flex:1; overflow:auto; padding:0 18px 30px; }
#list::-webkit-scrollbar { width:10px; }
#list::-webkit-scrollbar-thumb { background:#26263c; border-radius:8px; }
.file-row {
  display:grid; grid-template-columns:minmax(220px, 1fr) 60px 130px 32px; gap:12px; align-items:center;
  padding:4px 8px; border-radius:7px; cursor:pointer;
  font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9b9d6;
}
.file-row:hover { background:#1e2740; color:#e8e6f5; }
.file-row.in { color:#8fe0b8; }
.file-row .sec { color:#7d7d9d; font-size:11px; font-variant-numeric:tabular-nums; }
.file-row .pack { color:#5f5f80; font-size:11px; }
#offline { padding:60px 40px; color:#9c9cba; font-weight:500; max-width:560px; line-height:1.6; }
#offline code { color:#7ea6ff; }
</style>
</head>
<body>

<aside id="roles">
  <h1>Sound kit <small>the house sounds, picked one role at a time</small></h1>
  <input id="rq" type="search" autocomplete="off" placeholder="Filter roles, variants, games">
  <div id="role-list"></div>
  <div class="foot">
    <label>Volume <input id="vol" type="range" min="0" max="1" step="0.05"></label>
    <span>Every sound here is heard levelled, as cut-kit will ship it.</span>
  </div>
</aside>

<div id="main">
  <div id="bar">
    <button class="btn" id="play">Play</button>
    <button class="btn" id="seq">Sequence</button>
    <button class="btn" id="shipped">Shipped</button>
    <span class="grow"></span>
    <span id="status"></span>
    <button class="btn" id="revert" disabled>Revert</button>
    <button class="btn primary" id="save" disabled>Save</button>
  </div>
  <div id="role-head"></div>
  <div id="takes"></div>
  <div id="lib">
    <div id="lib-head">
      <input id="q" type="text" autocomplete="off" placeholder="Search the library">
      <span>hover hears it · click puts it in the active take · + adds a take</span>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* What the library is searched for when a role is opened — a start, not a
     fence: the box is the player's to change. */
  const SEARCH = {
    tap: "click", open: "ui open", close: "ui close", deny: "error",
    tick: "ui select", coin: "coins", score: "confirm", star: "impact light",
    gain: "pickup", buy: "coins", draw: "chip handle", reward: "powerup",
    win: "confirm", fail: "error",
    pickup: "pickup", bonus: "powerup", combo: "tone", power: "powerup",
    malus: "phaser", crash: "explosion", move: "swish",
    launch: "launch", hit: "impact", bounce: "bounce", burst: "pop",
    toggle: "switch", card: "card", miss: "error", warn: "alarm",
    world: "explosion", goal: "jingle", defeat: "lose",
    select: "click", refuse: "error"
  };
  /* How the shell plays a role in a row: the stars climb, the rows tick up,
     the coins cascade. A role that is not a ladder is played five times, which
     is how its takes are heard. */
  const LADDER = {
    star: { rates: [1, 1.19, 1.42], gap: 220 },
    tick: { rates: [1, 1.07, 1.14, 1.21], gap: 125 },
    coin: { rates: [1, 1.035, 1.07, 1.105, 1.14, 1.175, 1.21, 1.245], gap: 70 },
    pickup: { rates: [1, 1.045, 1.09, 1.135, 1.18, 1.225, 1.27, 1.315], gap: 110 }
  };
  const GROUPS = { shell: "Shell — every game's menus and end screen", game: "Gameplay — mapped by a game's manifest (sfx)" };
  /* A shell file named by what the player sees it as: `army` is the barracks,
     `view` plays the door of every card and view. A file not listed is
     shown by its own name. */
  const WHERE = {
    shell: "end screen", levels: "level map", meta: "rewards", album: "album", army: "barracks",
    codex: "codex", daily: "daily road", guide: "guide", menu: "menu", view: "every card & view", village: "village"
  };
  const WINDOW = 0.05, MAX_TAKES = 3;
  // The silent mapping (tools/lab/cut-kit.mjs EMPTY): a key that plays nothing.
  const EMPTY = "empty";

  /* `open` is the one gameplay role whose variants are listed: the list opens
     folded, unfolding a role folds the one before it, and a filter lists the
     variants it matches whatever is folded. */
  const S = { kit: null, checked: null, saved: "", files: [], byStem: {}, role: null, take: 0, q: "", rq: "", open: null, remap: {} };

  // ---- audio -------------------------------------------------------------
  let ac = null;
  const bufs = {}, decoded = {};
  function ctx() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; }
  function vol() { try { const v = parseFloat(localStorage.getItem("kit:vol")); return isNaN(v) ? 0.7 : v; } catch (e) { return 0.7; } }
  function bufOf(stem) {
    const f = S.byStem[stem];
    if (!f) return Promise.reject(new Error("no file " + stem));
    if (!bufs[stem]) bufs[stem] = fetch("sfx/" + encodeURIComponent(f.file))
      .then((r) => r.arrayBuffer()).then((b) => ctx().decodeAudioData(b))
      .then((buf) => { decoded[stem] = buf; return buf; });
    return bufs[stem];
  }
  // The measure tools/lab/cut-kit.mjs applies: the loudest window, and the peak.
  function levelOf(buf, start, length) {
    const rate = buf.sampleRate, a = Math.floor(start * rate), b = Math.min(buf.length, Math.floor((start + length) * rate));
    const n = Math.max(1, b - a), mono = new Float32Array(n);
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) mono[i] += (d[a + i] || 0) / buf.numberOfChannels;
    }
    let peak = 0, best = 0;
    for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(mono[i]));
    const win = Math.max(1, Math.round(WINDOW * rate)), hop = Math.max(1, win >> 2);
    for (let s = 0; ; s += hop) {
      let sum = 0, k = 0;
      for (let i = s; i < Math.min(s + win, n); i++, k++) sum += mono[i] * mono[i];
      if (k) best = Math.max(best, Math.sqrt(sum / k));
      if (s + win >= n) break;
    }
    const db = (v) => v > 0 ? 20 * Math.log10(v) : -120;
    return { rms: db(best), peak: db(peak) };
  }
  function gainDb(buf, start, length) {
    const l = levelOf(buf, start, length);
    return Math.min(S.kit.target - l.rms, S.kit.peak - l.peak);
  }
  /* THE TAIL — a copy of tailPcm in tools/lab/cut-kit.mjs, so the page hears
     the take the cutter writes. Keep the two identical. */
  const TAILS = ["fade", "drop"], DROP_TO = 0.5;
  const defaultTail = (length) => Math.round(Math.min(0.3, length * 0.4) * 1000) / 1000;
  function tailPcm(pcm, rate, tail, tailLength) {
    const n = pcm.length, t0 = Math.max(0, n - Math.round(tailLength * rate)), span = Math.max(1, n - t0);
    const out = [];
    let p = 0;
    while (p < n - 1) {
      const i = Math.floor(p), f = p - i;
      const s = pcm[i] * (1 - f) + pcm[i + 1] * f;
      const u = p < t0 ? 0 : (p - t0) / span;
      out.push(s * (1 - u) * (1 - u));
      p += tail === "drop" ? 1 - (1 - DROP_TO) * u : 1;
    }
    return Float32Array.from(out);
  }
  // The cut with its tail, as one mono buffer — the channels averaged, like the cutter.
  const rendered = new Map();
  function renderTake(buf, t) {
    const key = [t.file, t.start, t.length, t.tail, t.tailLength].join("|");   // the pitch is the playback's
    if (rendered.has(key)) return rendered.get(key);
    const rate = buf.sampleRate, a = Math.floor(t.start * rate);
    const n = Math.max(2, Math.min(buf.length - a, Math.floor(t.length * rate))), mono = new Float32Array(n);
    for (let c = 0; c < buf.numberOfChannels; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) mono[i] += (d[a + i] || 0) / buf.numberOfChannels;
    }
    const out = tailPcm(mono, rate, t.tail, t.tailLength || defaultTail(t.length));
    const ab = ctx().createBuffer(1, Math.max(1, out.length), rate);
    ab.copyToChannel(out, 0);
    if (rendered.size > 40) rendered.clear();
    rendered.set(key, ab);
    return ab;
  }
  let voices = [];
  function stopAll() { voices.forEach((v) => { try { v.stop(); } catch (e) {} }); voices = []; }
  // A take — { file, start, length, rate?, tail? } — levelled and played the way it will ship.
  function playTake(t, rate, at) {
    return bufOf(t.file).then((buf) => {
      const a = ctx(), src = a.createBufferSource(), g = a.createGain();
      const t0 = a.currentTime + (at || 0), r = (rate || 1) * (t.rate || 1), start = t.start || 0, length = t.length;
      const level = Math.pow(10, gainDb(buf, start, length) / 20) * vol();
      src.playbackRate.value = r;
      src.connect(g); g.connect(a.destination);
      if (t.tail) {
        src.buffer = renderTake(buf, t);
        g.gain.setValueAtTime(level, t0);
        src.start(t0);
      } else {
        const real = length / r, fade = Math.min(0.07, length * 0.3) / r;
        src.buffer = buf;
        g.gain.setValueAtTime(level, t0);
        g.gain.setValueAtTime(level, t0 + Math.max(0, real - fade));

    if (!cv || !t) return;
    const buf = decoded[t.file];
    if (!buf) { bufOf(t.file).then(() => drawWave(i)).catch(() => {}); return; }
    const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    cv.dataset.dur = buf.duration;
    const g = cv.getContext("2d"), p = peaksOf(t.file, buf, w), { x0, x1, xt } = geom(cv, t);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    g.fillStyle = "rgba(126,166,255,0.16)"; g.fillRect(x0, 0, x1 - x0, h);
    for (let x = 0; x < w; x++) {
      const y = p[x] * (h / 2 - 2);
      let k = 1;
      if (xt != null && x > xt && x <= x1) k = 1 - (x - xt) / Math.max(1, x1 - xt);
      g.fillStyle = x >= x0 && x <= x1 ? "rgba(157,184,255," + (0.25 + 0.75 * k * k) + ")" : "#3a4160";
      g.fillRect(x, h / 2 - y, 1, Math.max(1, y * 2));
    }
    // The tail: a ramp down to silence, and its grip — amber, the colour of an unsaved change.
    if (xt != null) {
      g.strokeStyle = "#ffd08a"; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(xt, 6); g.lineTo(x1, h - 6); g.stroke();
      g.setLineDash([3, 3]); g.beginPath(); g.moveTo(xt, 0); g.lineTo(xt, h); g.stroke(); g.setLineDash([]);
      g.fillStyle = "#ffd08a"; g.fillRect(xt - 4, 0, 8, 10);
    }
    // The two grips of the window: a bar and a tab to take it by.
    g.fillStyle = "#7ea6ff";
    [x0, x1].forEach((x, k) => {
      g.fillRect(k ? x - 2 : x, 0, 2, h);
      g.fillRect(k ? x - 8 : x, h / 2 - 12, 8, 24);
    });
    const gl = document.querySelector('.gain[data-i="' + i + '"]');
    if (gl) { const db = gainDb(buf, t.start, t.length); gl.textContent = "levelled " + (db >= 0 ? "+" : "") + db.toFixed(1) + " dB"; }
  }
  function terms() { return S.q.toLowerCase().split(/\s+/).filter(Boolean); }
  function paintList() {
    const tt = terms(), inKit = new Set(cur().takes.map((t) => t.file));
    const rows = S.files.filter((f) => tt.every((x) => (f.stem + " " + f.category + " " + f.pack).toLowerCase().includes(x)));
    $("list").innerHTML = rows.length ? rows.map((f) =>
      '<div class="file-row' + (inKit.has(f.stem) ? " in" : "") + '" data-stem="' + esc(f.stem) + '">' +
      "<span>" + esc(f.stem) + '</span><span class="sec">' + (+f.seconds || 0).toFixed(2) + ' s</span><span class="pack">' + esc(f.pack) + "</span>" +
      '<button class="ic" data-add="' + esc(f.stem) + '" title="Add as another take"' + (cur().takes.length >= MAX_TAKES ? " disabled" : "") + ">+</button></div>"
    ).join("") : '<p id="offline">Nothing in the library matches.</p>';
  }
  function paint() { paintRoles(); paintHead(); paintTakes(); paintList(); }

  // ---- editing -----------------------------------------------------------
  function defaultLength(stem) {
    const f = S.byStem[stem], was = cur().takes[S.take];
    return Math.round(Math.min(+f.seconds || 0.4, was ? was.length : 0.4) * 100) / 100;
  }
  // A new file keeps the take's pitch: it is the role's shape, not the file's.
  function setTake(i, stem) {
    const was = cur().takes[i];
    cur().takes[i] = { file: stem, start: 0, length: defaultLength(stem) };
    if (was && was.rate) cur().takes[i].rate = was.rate;
    paint();
    const t = cur().takes[i];
    play(t);
  }

  /* A new name, asked for and checked the way cut-kit.mjs will check it on
     Save — so a typo is said here and not after the cut. */
  function askName(msg, taken, was) {
    const n = (prompt(msg, was || "") || "").trim().toLowerCase();
    if (!n || n === was) return null;
    if (n === EMPTY) { status(EMPTY + " is the silent mapping — pick another name", true); return null; }
    if (!/^[a-z][a-z0-9]{0,23}$/.test(n)) { status("A name is lowercase letters and digits, a letter first", true); return null; }
    if (taken(n)) { status(n + " already exists", true); return null; }
    return n;
  }
  // A role lands at the end of its own group, since the list is painted in kit order.
  function addRole(group) {
    const role = askName("Name of the new " + (group === "shell" ? "shell" : "gameplay") + " role (eat, jump, unlock…)", (n) => !!S.kit.roles[n]);
    if (!role) return;
    const what = (prompt("What does " + role + " mean? One line — \"The player eats a fruit\"") || "").trim();
    if (!what) { status("A role says in one line what it means", true); return; }
    const out = {}, names = Object.keys(S.kit.roles);
    const lastOf = names.filter((n) => S.kit.roles[n].group === group).pop();
    let put = false;
    for (const n of names) {
      out[n] = S.kit.roles[n];
      if (n === lastOf) { out[role] = { group, what, variants: { default: { takes: [] } } }; put = true; }
    }
    if (!put) out[role] = { group, what, variants: { default: { takes: [] } } };
    S.kit.roles = out;
    sel(group === "shell" ? role : role + "/default");
    status("New role " + role + " — pick one to three sounds below, then Save");
  }
  function addVariant(role) {
    const x = S.kit.roles[role];
    const n = askName("Name of the new " + role + " variant (glass, metal, soft…)", (v) => !!x.variants[v]);
    if (!n) return;
    x.variants[n] = { takes: [] };
    sel(role + "/" + n);
    status("New variant " + role + "/" + n + " — pick one to three sounds below, then Save");
  }
  $("role-list").addEventListener("click", (e) => {
    const nr = e.target.closest("[data-new-role]");
    if (nr) { addRole(nr.dataset.newRole); return; }
    const nv = e.target.closest("[data-new-var]");
    if (nv) { addVariant(nv.dataset.newVar); return; }
    const fold = e.target.closest("[data-fold]");
    if (fold) { S.open = S.open === fold.dataset.fold ? null : fold.dataset.fold; paintRoles(); return; }
    const b = e.target.closest(".role[data-id]");
    if (b) sel(b.dataset.id);
  });
  /* Hovering a role or a variant in the list plays one shot of it, the way
     the library plays a file: its takes start decoding on the way in, so the
     shot is ready when the delay is up. A row repainted under the pointer is
     the same id and is not heard twice. */
  let roleHover = null, roleTimer = null;
  $("role-list").addEventListener("mouseover", (e) => {
    const row = e.target.closest(".role[data-id]"), id = row ? row.dataset.id : null;
    if (id === roleHover) return;
    roleHover = id;
    clearTimeout(roleTimer);
    const v = id && variantOf(id);
    if (!v || !v.takes.length) return;
    v.takes.forEach((t) => bufOf(t.file).catch(() => {}));
    roleTimer = setTimeout(() => { stopAll(); shotOf(id); }, 110);
  });
  $("role-list").addEventListener("mouseleave", () => { roleHover = null; clearTimeout(roleTimer); });
  function selectTake(i) {
    S.take = i;
    document.querySelectorAll(".take").forEach((n) => n.classList.toggle("on", +n.dataset.i === S.take));
  }
  const play = (t) => { stopAll(); playTake(t); };
  $("takes").addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]");
    if (act) {
      const i = +act.dataset.i, t = cur().takes[i];
      if (act.dataset.act === "play") play(t);
      if (act.dataset.act === "drop" && cur().takes.length > 1) { cur().takes.splice(i, 1); S.take = 0; paint(); }
      return;
    }
    const tl = e.target.closest("[data-tail]");
    if (tl) {
      const i = +tl.dataset.i, t = cur().takes[i];
      if (tl.dataset.tail) { t.tail = tl.dataset.tail; t.tailLength = Math.min(t.length, t.tailLength || defaultTail(t.length)); }
      else { delete t.tail; delete t.tailLength; }
      S.take = i;
      paintTakes(); paintRoles(); play(t);
      return;
    }
    const box = e.target.closest(".take");
    if (box && +box.dataset.i !== S.take && e.target.tagName !== "INPUT" && e.target.tagName !== "CANVAS") selectTake(+box.dataset.i);
  });
  $("takes").addEventListener("change", (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    const i = +e.target.dataset.i, t = cur().takes[i], v = parseFloat(e.target.value);
    if (isNaN(v)) return;
    if (k === "length") t.length = r3(Math.min(3, Math.max(0.02, v)));
    if (k === "start") t.start = r3(Math.max(0, v));
    if (k === "rate") { const rt = Math.round(Math.min(2, Math.max(0.5, v)) * 100) / 100; if (rt === 1) delete t.rate; else t.rate = rt; }
    if (k === "tailLength" || (k === "length" && t.tail)) t.tailLength = r3(Math.min(t.length, Math.max(0.02, k === "tailLength" ? v : t.tailLength)));
    syncNums(i); drawWave(i); paintRoles();
    play(t);
  });

  /* The cut is taken by its grips. Within GRIP px of an edge, that edge moves
     and the other stays; inside the window, the window moves and keeps its
     length; the amber grip is where the tail begins; a press outside draws a
     new window from where it went down to where it comes up — and a click
     there with no drag moves the window to it. */
  const GRIP = 9, MIN = 0.02, MAX = 3;
  function hitOf(cv, t, x) {
    const { x0, x1, xt } = geom(cv, t);
    const near = [["start", Math.abs(x - x0)], ["end", Math.abs(x - x1)]];
    if (xt != null) near.push(["tail", Math.abs(x - xt) - 1]);
    near.sort((a, b) => a[1] - b[1]);
    if (near[0][1] <= GRIP) return near[0][0];
    return x > x0 && x < x1 ? "move" : "new";
  }
  const CURSOR = { start: "ew-resize", end: "ew-resize", tail: "ew-resize", move: "grab", new: "crosshair" };
  let drag = null;
  $("takes").addEventListener("pointerdown", (e) => {
    const cv = e.target.closest("canvas");
    if (!cv || !cv.dataset.dur || e.button) return;
    e.preventDefault();
    const i = +cv.dataset.i, t = cur().takes[i], rect = cv.getBoundingClientRect(), dur = +cv.dataset.dur;
    const at = (x) => Math.max(0, Math.min(dur, ((x - rect.left) / rect.width) * dur));
    const mode = hitOf(cv, t, e.clientX - rect.left);
    selectTake(i);
    drag = { i, cv, at, dur, mode, x: e.clientX, from: at(e.clientX), start: t.start, end: t.start + t.length, moved: false };
    if (mode === "move") cv.style.cursor = "grabbing";
    cv.setPointerCapture(e.pointerId);
  });
  $("takes").addEventListener("pointermove", (e) => {
    if (!drag) {
      const cv = e.target.closest("canvas");
      if (cv && cv.dataset.dur) cv.style.cursor = CURSOR[hitOf(cv, cur().takes[+cv.dataset.i], e.clientX - cv.getBoundingClientRect().left)];
      return;
    }
    if (!drag.moved && Math.abs(e.clientX - drag.x) < 3) return;
    drag.moved = true;
    const t = cur().takes[drag.i], to = drag.at(e.clientX), d = drag;
    if (d.mode === "start") {
      const s = Math.max(Math.max(0, d.end - MAX), Math.min(d.end - MIN, to));
      t.start = r3(s); t.length = r3(d.end - s);
    } else if (d.mode === "end") {
      t.length = r3(Math.max(d.start + MIN, Math.min(Math.min(d.dur, d.start + MAX), to)) - d.start);
    } else if (d.mode === "move") {
      const len = d.end - d.start;
      t.start = r3(Math.max(0, Math.min(d.dur - len, d.start + to - d.from)));
    } else if (d.mode === "tail") {
      t.tailLength = r3(Math.max(MIN, Math.min(t.length, t.start + t.length - to)));
    } else {
      const a = Math.min(d.from, to), b = Math.max(a + MIN, Math.min(a + MAX, Math.max(d.from, to)));
      t.start = r3(a); t.length = r3(b - a);
    }
    if (t.tail) t.tailLength = r3(Math.min(t.length, t.tailLength));
    drawWave(drag.i); syncNums(drag.i);
  });
  function release() {
    if (!drag) return;
    const d = drag, t = cur().takes[d.i];
    drag = null;
    d.cv.style.cursor = "";
    if (!d.moved && d.mode === "new") t.start = r3(Math.max(0, Math.min(d.dur - t.length, d.from)));
    drawWave(d.i); syncNums(d.i); paintRoles();
    play(t);
  }
  $("takes").addEventListener("pointerup", release);
  $("takes").addEventListener("pointercancel", release);

  $("list").addEventListener("click", (e) => {
    const add = e.target.closest("[data-add]");
    if (add) {
      if (cur().takes.length >= MAX_TAKES) return;
      S.take = cur().takes.length;
      setTake(S.take, add.dataset.add);
      return;
    }
    const row = e.target.closest(".file-row");
    if (row) setTake(S.take, row.dataset.stem);
  });
  let hoverTimer = null;
  $("list").addEventListener("mouseover", (e) => {
    const row = e.target.closest(".file-row");
    if (!row || row === $("list").__hover) return;
    $("list").__hover = row;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => {
      const stem = row.dataset.stem;
      stopAll(); playTake({ file: stem, start: 0, length: defaultLength(stem) });
    }, 90);
  });
  $("list").addEventListener("mouseleave", () => { $("list").__hover = null; clearTimeout(hoverTimer); });
  $("q").addEventListener("input", (e) => { S.q = e.target.value; paintList(); });
  $("rq").addEventListener("input", (e) => {
    S.rq = e.target.value;
    try { localStorage.setItem("kit:rq", S.rq); } catch (err) {}
    paintRoles();
  });
  try { S.rq = localStorage.getItem("kit:rq") || ""; } catch (e) {}
  $("rq").value = S.rq;

  $("play").onclick = () => { stopAll(); shot(1); };
  $("seq").onclick = () => sequence();
  $("shipped").onclick = () => shipped();
  $("vol").value = vol();
  $("vol").oninput = (e) => { try { localStorage.setItem("kit:vol", e.target.value); } catch (err) {} };

  $("revert").onclick = () => {
    S.kit.roles = JSON.parse(S.saved); S.remap = {};
    sel(S.kit.roles[S.role] ? idNow() : Object.keys(S.kit.roles)[0]); status("Reverted");
  };
  $("save").onclick = () => {
    // A server started before renames and silent deletes existed would refuse them on a played variant.
    if (Object.keys(S.remap).length && !(S.kit.accepts || []).includes("remap")) {
      status("This server predates renames and deletes to empty — restart it (pkill -f serve-lab.mjs && make lab), reload, then redo", true);
      return;
    }
    // A variant with no take would be refused by the cutter: say which, and open it.
    for (const [role, r] of Object.entries(S.kit.roles)) {
      for (const [name, v] of Object.entries(r.variants)) {
        if (!v.takes.length) { sel(idOf(role, name)); status(idOf(role, name) + " has no take yet — pick one in the library", true); return; }
      }
    }
    $("save").disabled = true;
    status("Cutting…");
    fetch("api/kit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...S.kit, remap: S.remap }) })
      .then((r) => r.json()).then((out) => {
        if (out.error) { status(out.error, true); paintRoles(); return; }
        S.kit = out.kit; S.saved = dump(S.kit); S.remap = {};
        readChecked();
        const moved = (out.remapped || []).map((m) => m.slug + (m.version ? " v" + m.version : "") + ": " + m.keys.join(", "));
        status("Saved — " + out.log.length + " takes cut and levelled" + (moved.length ? "; " + moved.join(" · ") : "") + " — the bench is rebuilding");
        paint();
      }).catch((e) => { status(String(e), true); paintRoles(); });
  };
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); $("play").click(); }
    if (e.key === "/") { e.preventDefault(); $("q").focus(); }
  });
  window.addEventListener("resize", () => { if (S.role) paintTakes(); });
  // Every change here lives in the page until Save: a reload would drop it without a word.
  window.addEventListener("beforeunload", (e) => { if (S.kit && dirtyIds().length) { e.preventDefault(); e.returnValue = ""; } });

  // Who validated each variant on the events bench: read after the kit, since it reads games.
  function readChecked() {
    fetch("api/kit-checked").then((r) => r.json()).then((c) => { S.checked = c || {}; paintRoles(); }).catch(() => {});
  }

  // ---- boot --------------------------------------------------------------
  Promise.all([fetch("api/kit").then((r) => r.json()), fetch("api/sfx").then((r) => r.json())])
    .then(([kit, files]) => {
      S.kit = kit; S.saved = dump(kit);
      S.files = files.slice().sort((a, b) => a.stem.localeCompare(b.stem));
      S.files.forEach((f) => { S.byStem[f.stem] = f; });
      const want = decodeURIComponent(location.hash.slice(1));
      sel(kit.roles[want.split("/")[0]] ? want : Object.keys(kit.roles)[0]);
      if (!kit.calls) status("This server predates the who-calls-it tags — restart make events / make lab", true);
      readChecked();
    })
    .catch(() => {
      $("main").innerHTML = '<p id="offline">This page reads the kit and the library from its server. Run <code>make events</code> and open <code>/kit</code>.</p>';
    });
})();
</script>
</body>
</html>
