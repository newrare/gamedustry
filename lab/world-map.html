<style>
/* ===========================================================================
   LAB — WORLD MAP. Can the over-world of a platformer — the map a player walks
   from level to level — be GENERATED, in 3D, and still read as a place someone
   drew? Plateaus stepped like a layer cake with striped cliffs, a sea ringed in
   foam, rivers that fall off every terrace, a road from level to level that
   climbs a ladder and crosses a bridge, a castle at the end of every region.

   One seed makes one map, in this order (GENERATE, below):

     1. MASK      where the land is, one of four shapes: a continent, an
                  archipelago (one biome per island), a lake country (land
                  everywhere, lakes punched in it) and a coast (land at the
                  back, the sea at the front).
     2. REGIONS   the land cut into "worlds", nearest seed with a warped
                  distance, each given a biome; the route visits them in order
                  (a greedy tour from the front left), so the first is a meadow
                  and the last the darkest biome on the list.
     3. RELIEF    the elevation, scaled and lifted per biome (a snow region is
                  a mountain, a volcano a cone with a crater) and blurred across
                  the borders, then cut into TERRACES: one contour per level,
                  traced by marching squares, filled flat at its height and
                  walled down to the level under it. 0 terraces is the smooth
                  low-poly hill instead.
     4. WATER     one sea plane at y = 0, read off a distance field to the land
                  (shallows, depth bands, foam rings that roll in, wave strokes);
                  lakes are holes in the land, so they are the same sea.
     5. RIVERS    from the high ground to the sea down a Dijkstra field that
                  hates climbing; a ribbon draped on the terrain, and wherever it
                  crosses a contour it hugs the wall down: a waterfall.
     6. ROUTE     level nodes per region, joined in order by A* on the grid
                  (climbing a terrace costs, water costs more, an existing road
                  is cheap so roads merge), plus a few forks to a secret node.
                  Each climb is a ladder or a stair, a river crossed is a plank
                  bridge, a short water run a bridge, a long one a dotted sea
                  route. The last node of a region is a fort, the last of all a
                  castle.
     7. DECOR     the biome's trees, rocks, houses, cacti… instanced, in
                  clusters, kept off the road, the rivers and the cliff edges;
                  clouds overhead that cast shadows, a frame of clouds round the
                  edge.

   Cliffs are not textured: a shader paints them off world position — vertical
   stripes, horizontal strata, a darker foot, and the grass LIP hanging over
   the edge with a dark line under it, its length wobbling along the contour.

   The look is a set of knobs (light, ink outline, GTAO, bloom, tilt-shift,
   grade, posterise) and a RENDER SCALE: under 1 the frame is rendered small
   and blown up without smoothing, which is the pixel-art map.

   Served over HTTP only (make lab): three.js is an ES module, vendored in
   lab/vendor/three/ and named by the import map below.
   ?preset=N&seed=S&cam=K&freeze=1 open a state directly (a headless shot).
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  display:flex; height:100vh; overflow:hidden;
  background:#0b0b12; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

#panel {
  flex:0 0 310px; height:100vh; overflow-y:auto;
  padding:18px 16px 40px;
  background:#12121c; border-right:1px solid #23233a;
}
#panel h1 { font-size:16px; letter-spacing:.5px; }
#panel p.hint { margin:6px 0 14px; font-weight:500; font-size:12px; color:#8b8ba7; }
#stats { font:500 12px/1.4 ui-monospace,Menlo,monospace; color:#9c9cba; margin-bottom:12px; white-space:pre; }

details { border-top:1px solid #23233a; padding:8px 0; }
summary { cursor:pointer; font-size:13px; color:#cfd0ea; list-style:none; display:flex; justify-content:space-between; }
summary::after { content:"›"; transform:rotate(90deg); transition:transform .15s; color:#6c6c8a; }
details:not([open]) summary::after { transform:none; }
.body { padding-top:8px; }

.row { margin-bottom:10px; }
.row label { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:#9c9cba; }
.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:4px; accent-color:#7ea6ff; }
.row select {
  width:100%; margin-top:4px; padding:5px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit; font-size:12px;
}
.row.color label, .row.bool label { align-items:center; }
.row input[type=color] { width:44px; height:24px; border:1px solid #2c2c47; border-radius:6px; background:none; padding:0; }
.row input[type=checkbox] { width:16px; height:16px; accent-color:#7ea6ff; }

.btns { display:flex; flex-wrap:wrap; gap:6px; }
.btns button, button.wide {
  flex:1 1 45%; padding:7px 8px;
  background:#22223a; color:#e8e6f5; border:1px solid #2c2c47; border-radius:8px;
  font:600 12px/1.2 inherit; cursor:pointer;
}
.btns button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
button.wide { width:100%; margin-top:6px; }
.seedrow { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
.seedrow input {
  flex:1; min-width:0; padding:6px 8px; background:#0b0b12; color:#e8e6f5;
  border:1px solid #2c2c47; border-radius:6px; font:500 12px ui-monospace,Menlo,monospace;
}
.seedrow button { flex:0 0 auto; width:auto; padding:7px 10px; }

#stage { flex:1; position:relative; overflow:hidden; background:#0b0b12; }
#view { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#view.pixel { image-rendering:pixelated; }
#loading { position:absolute; left:20px; top:16px; font-size:13px; color:#9c9cba; }
#nodeTip {
  position:absolute; pointer-events:none; display:none;
  padding:4px 8px; border-radius:6px; background:rgba(10,12,24,.82); color:#e8e6f5;
  font:500 12px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

    const ou = outlinePass.uniforms;
    ou.uStr.value = P.outline; ou.uSens.value = P.outlineSens; ou.uThick.value = P.outlineThick; ou.uInk.value.set(P.ink);
    ou.cameraNear.value = camera.near; ou.cameraFar.value = camera.far;
    bloomPass.enabled = P.bloom > 0; bloomPass.strength = P.bloom; bloomPass.radius = P.bloomRadius; bloomPass.threshold = P.bloomThreshold;
    tiltH.enabled = tiltV.enabled = P.tilt && P.tiltBlur > 0;
    for (const t of [tiltH, tiltV]) { const u = t.uniforms; u.uFocus.value = P.tiltFocus; u.uBand.value = P.tiltBand; u.uSoft.value = P.tiltSoft; u.uMax.value = P.tiltBlur * renderer.getPixelRatio(); }
    const u = gradePass.uniforms;
    u.uSat.value = P.saturation; u.uCon.value = P.contrast; u.uWarm.value = P.warmth; u.uTint.value = P.tint;
    u.uLift.value.set(P.lift); u.uLiftAmt.value = P.liftAmt; u.uVig.value = P.vignette; u.uPost.value = P.posterize;
  }
}
// the camera: frame the whole map at the chosen elevation
function applyCam(i, keepAngle) {
  camIdx = i;
  const c = CAMS[i] || CAMS[1];
  const el = c.el * Math.PI / 180, az = c.az * Math.PI / 180, t = Math.tan(camera.fov * Math.PI / 360), asp = W / H;
  const dist = Math.max(P.mapW / (2 * t * asp) * 1.02, (P.mapH * Math.sin(el) + 1.5 * Math.cos(el)) / (2 * t) * 1.04) * P.zoom;
  if (keepAngle) {
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, dist);
  } else {
    controls.target.set(0, 0.4, 0);
    camera.position.set(Math.sin(az) * Math.cos(el) * dist, Math.sin(el) * dist + 0.4, Math.cos(az) * Math.cos(el) * dist);
  }
  camera.near = Math.max(0.3, dist * 0.04); camera.far = dist * 4; camera.updateProjectionMatrix();
  controls.update();
  if (outlinePass) { outlinePass.uniforms.cameraNear.value = camera.near; outlinePass.uniforms.cameraFar.value = camera.far; }
  camBtns.forEach((b, k) => b.classList.toggle("on", k === camIdx));
}

// =============================================================================
// PANEL
// =============================================================================
const inputs = {}, presetBtns = [], camBtns = [];
let seedEl;
function fmt(v, step) { return typeof v === "number" ? (step >= 1 ? v.toFixed(0) : step >= 0.1 ? v.toFixed(1) : step >= 0.01 ? v.toFixed(2) : v.toFixed(4)) : v; }
let rebuildTimer = 0;
function rebuildSoon() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 160); }
function rebuild() { generate(); setWalkPath(); applyAll(); seedEl.value = P.seed; }
function button(label, cls, fn) { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; return b; }
function refreshButtons() { presetBtns.forEach((b, k) => b.classList.toggle("on", k === presetIdx)); camBtns.forEach((b, k) => b.classList.toggle("on", k === camIdx)); }
function buildPanel() {
  const root = document.getElementById("controls");
  const sec = (title, open) => { const d = document.createElement("details"); d.open = open; d.innerHTML = "<summary>" + title + "</summary><div class='body'></div>"; root.appendChild(d); return d.querySelector(".body"); };
  const btnRow = (parent) => { const r = document.createElement("div"); r.className = "btns"; parent.appendChild(r); return r; };

  let b = sec("Styles", true), row = btnRow(b);
  PRESETS.forEach((p, i) => row.appendChild(button(p.name, "", () => {
    const seed = P.seed;
    presetIdx = i; P = Object.assign({}, BASE, PRESETS[i], { seed });
    syncPanel(); resize(); rebuild(); applyCam(PRESETS[i].cam ?? 1); refreshButtons(); saveSoon();
  })));
  presetBtns.push(...row.children);

  b = sec("Seed", true);
  const sr = document.createElement("div"); sr.className = "seedrow";
  seedEl = document.createElement("input"); seedEl.value = P.seed; seedEl.spellcheck = false;
  seedEl.addEventListener("change", () => { P.seed = Math.max(1, parseInt(seedEl.value, 10) || 1); rebuild(); saveSoon(); });
  sr.append(seedEl, button("New map", "", () => { P.seed = 1 + Math.floor(Math.random() * 999999); rebuild(); saveSoon(); }));
  b.appendChild(sr);

  b = sec("Camera", true); row = btnRow(b);
  CAMS.forEach((c, i) => row.appendChild(button(c.name, "", () => applyCam(i))));
  camBtns.push(...row.children);
  b.appendChild(button("Freeze / resume", "wide", () => { frozen = !frozen; }));

  for (const [title, items] of SCHEMA) {
    b = sec(title, false);
    for (const [key, label, type, a, c, step] of items) {
      const r = document.createElement("div"); r.className = "row " + type;
      let el;
      if (type === "range") { el = document.createElement("input"); el.type = "range"; el.min = a; el.max = c; el.step = step; }
      else if (type === "color") { el = document.createElement("input"); el.type = "color"; }
      else if (type === "bool") { el = document.createElement("input"); el.type = "checkbox"; }
      else { el = document.createElement("select"); a.forEach((o) => { const op = document.createElement("option"); op.value = o; op.textContent = o; el.appendChild(op); }); }
      const lab = document.createElement("label"), out = document.createElement("b");
      lab.append(label, type === "range" ? out : el);
      r.appendChild(lab); if (type === "range") r.appendChild(el);
      el.addEventListener("input", () => {
        P[key] = type === "range" ? +el.value : type === "bool" ? el.checked : el.value;
        if (type === "range") out.textContent = fmt(P[key], step);
        if (key === "pixel") resize();
        if (key === "zoom") applyCam(camIdx, true);
        if (REBUILD.has(key)) rebuildSoon(); else applyAll();
        saveSoon();
      });
      inputs[key] = { el, out, type, step };
      b.appendChild(r);
    }
  }
  b = sec("Settings", false);
  const cp = button("Copy settings", "wide", () => {
    const t = JSON.stringify(P, null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { cp.textContent = "Copied"; setTimeout(() => (cp.textContent = "Copy settings"), 1200); }, () => prompt("Settings", t));
  });
  const ps = button("Paste settings", "wide", () => {
    const t = prompt("Paste the settings JSON"); if (!t) return;
    try { P = Object.assign({}, BASE, JSON.parse(t)); syncPanel(); resize(); rebuild(); saveSoon(); } catch (e) { alert("Not valid JSON"); }
  });
  b.append(cp, ps);
}
function syncPanel() {
  for (const k in inputs) {
    const { el, out, type, step } = inputs[k];
    if (type === "bool") el.checked = !!P[k]; else el.value = P[k];
    if (type === "range") out.textContent = fmt(P[k], step);
  }
  if (seedEl) seedEl.value = P.seed;
}

// ---- picking a level: hover names it, a click walks there ---------------------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById("nodeTip");
const KIND_NAME = { home: "Home", level: "Level", fort: "Fort", castle: "Castle", house: "House", tower: "Tower", cave: "Cave", temple: "Temple", lighthouse: "Lighthouse", secret: "Secret level" };
function pickNode(ev) {
  const r = canvas.getBoundingClientRect();
  mouse.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  let best = null, bd = 0.6;
  for (const nd of nodes) {
    const d = ray.ray.distanceToPoint(new THREE.Vector3(nd.x, (nd.y || 0) + 0.2, nd.z));
    if (d < bd) { bd = d; best = nd; }
  }
  return best;
}
canvas.addEventListener("pointermove", (ev) => {
  const nd = pickNode(ev);
  if (!nd) { tip.style.display = "none"; return; }
  const r = stage.getBoundingClientRect();
  tip.style.display = "block"; tip.style.left = (ev.clientX - r.left + 14) + "px"; tip.style.top = (ev.clientY - r.top + 10) + "px";
  tip.textContent = KIND_NAME[nd.kind] + (nd.kind === "secret" ? "" : " " + (nd.num + 1)) + " · " + BIOMES[nd.biome].name + " · " + nd.state;
});
let downAt = null;
canvas.addEventListener("pointerdown", (ev) => { downAt = [ev.clientX, ev.clientY]; });
canvas.addEventListener("pointerup", (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 4) return;
  const nd = pickNode(ev);
  if (nd && nd.kind !== "secret") { walkTarget = nodeDist(nd); walkIdle = -6; }
});

// =============================================================================
// LOOP
// =============================================================================
function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(200, Math.floor(r.width)); H = Math.max(200, Math.floor(r.height));
  const pr = P.pixel < 1 ? P.pixel : Math.min(2, window.devicePixelRatio || 1);
  renderer.setPixelRatio(pr);
  renderer.setSize(W, H, false);
  canvas.classList.toggle("pixel", P.pixel < 1);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  buildComposer(); applyAll();
}
window.addEventListener("resize", () => { resize(); applyCam(camIdx, true); });

let frozen = qs.has("freeze"), time = 0, last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
const statsEl = document.getElementById("stats");
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!frozen) time += dt;
  SEA.uTime.value = time; RIV.uTime.value = time;
  for (const a of animated) {
    if (a.cloud) {
      if (!frozen) a.cloud.position.x += a.speed * dt;
      if (a.cloud.position.x > -X0 + 3) a.cloud.position.x = X0 - 3;
    } else if (a.pulse) {
      const s = 1 + 0.12 * Math.sin(time * 4 + a.phase);
      a.pulse.scale.set(s, 1, s);
    } else if (a.smoke) {
      a.smoke.forEach((m, k) => {
        const ph = (time * 0.18 + k / a.smoke.length) % 1, s = (0.08 + ph * 0.28) * Math.min(1, ph / 0.12) * (ph > 0.8 ? (1 - ph) / 0.2 : 1);
        m.position.set(a.x + ph * 0.5 + Math.sin(ph * 4 + k) * 0.08, a.y + ph * 1.6, a.z + Math.cos(ph * 3 + k) * 0.08);
        m.scale.setScalar(Math.max(0.001, s));
      });
    }
  }
  // the walker: to a clicked level, or round the route when idle
  if (walkPath.length > 1 && P.walk) {
    const total = walkLen[walkLen.length - 1];
    if (!frozen) {
      // idle a while: walk on to the next level, round and round (a demo of the map)
      if (walkTarget == null && (walkIdle += dt) > 2.2) {
        walkIdle = 0;
        const main = nodes.slice(0, mainCount), here = main.findIndex((n) => Math.abs(nodeDist(n) - walkT) < 0.05);
        const next = main[(here + 1) % main.length];
        if (next) walkTarget = nodeDist(next);
        if (here === main.length - 1) walkT = 0, walkTarget = null;
      }
      if (walkTarget != null) {
        const d = walkTarget - walkT, stepLen = P.walkSpeed * dt;
        if (Math.abs(d) <= stepLen) { walkT = walkTarget; walkTarget = null; } else walkT += Math.sign(d) * stepLen;
      }
    }
    walkT = Math.max(0, Math.min(total, walkT));
    const p = walkerAt(walkT);
    if (p) {
      walker.position.set(p.x, p.y + (walkTarget != null ? Math.abs(Math.sin(time * 12)) * 0.04 : 0), p.z);
      if (Math.hypot(p.dx, p.dz) > 1e-4 && walkTarget != null) walker.rotation.y = Math.atan2(p.dx, p.dz) + (walkTarget < walkT ? Math.PI : 0);
    }
  }
  controls.update();
  composer.render();
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) {
    fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    const counts = {};
    regions.forEach((r) => (counts[r.biome] = (counts[r.biome] || 0) + 1));
    statsEl.textContent = NX + " × " + NZ + " grid · " + Math.round(stats.tris / 1000) + "k tris\n" +
      regions.length + " regions · " + stats.nodes + " levels\n" +
      regions.map((r) => BIOMES[r.biome].name).join(" → ") + "\n" +
      "build " + stats.ms.toFixed(0) + " ms · " + fps.toFixed(0) + " fps";
  }
  requestAnimationFrame(tick);
}

buildPanel();
syncPanel();
resize();
rebuild();
applyCam(camIdx);
refreshButtons();
document.getElementById("loading").remove();
requestAnimationFrame(tick);
window.__ready = true;
window.__worldMap = { nodes: () => nodes.map((n) => ({ kind: n.kind, biome: n.biome, state: n.state, x: +n.x.toFixed(2), z: +n.z.toFixed(2) })), stats: () => stats };
</script>
</body>
</html>
