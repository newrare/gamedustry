<style>
/* ===========================================================================
   LAB — HD-2D LOOK. A game's own 2D cuts stood up in a small 3D diorama,
   to see whether flat painted pieces and a lit 3D world can read as one
   picture before any game is built on the idea.

   The trick (Octopath Traveler, Triangle Strategy) is a controlled friction
   between a modern 3D render and flat 2D pieces, and every lever of it is a
   knob here:

   - BILLBOARDS: a sprite is a quad standing on its feet (the middle of its
     base, the village composer's rule), turned toward the camera on the
     vertical axis only, leaning back a little so a view from above does not
     squash it. Its animation is cel animation: stepped frames, never tweened.
   - PIXELS: the scene can be rendered at a fraction of the screen and blown
     up without smoothing, the sprites resampled so that ONE texel of theirs
     is one pixel of that render (constant texel density, the ground
     included), and the orthographic camera and the sprites snapped to that
     grid so nothing shimmers while the view moves.
   - LIGHT: a sprite is lit by the same sun, sky and lanterns as the world,
     through a normal map generated here from its own alpha (a pillow out of
     the distance to its edge, plus a relief out of its luminance). Its
     shadow is its silhouette, cast by an invisible card turned toward the
     sun, so it never thins to a line when the camera turns; a soft contact
     blob grounds it.
   - DIORAMA: depth of field or tilt-shift, bloom, light beams, god rays,
     motes or fireflies, fog, a grade with split toning and a vignette.

   The sprites are the game's adopted cuts (art.objects of its manifest,
   assets/image/object/) plus its three character moods. Pick a game, click a
   cut, click the scene to stand it there; drag a sprite to move it. The 3D
   pieces are lab/models/library.js, flat-coloured.

   Served over HTTP only (make lab): three.js is an ES module, vendored in
   lab/vendor/three/ and named by the import map below.
   ?preset=N&cam=K&freeze=1 open a state directly (what a headless shot uses).
   =========================================================================== */

* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {

  background:#0b0b12; color:#e8e6f5;

}

#panel {

details:not([open]) summary::after { transform:none; }
.body { padding-top:8px; }

.row { margin-bottom:10px; }

.row label b { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; margin-top:4px; accent-color:#7ea6ff; }
.row select, .row input[type=search] {
  width:100%; margin-top:4px; padding:5px 8px;
  background:#0b0b12; color:#e8e6f5; border:1px solid #2c2c47; border-radius:6px; font:inherit; font-size:12px;
}
.row.color label, .row.bool label { align-items:center; }
.row input[type=color] { width:44px; height:24px; border:1px solid #2c2c47; border-radius:6px; background:none; padding:0; }
.row input[type=checkbox] { width:16px; height:16px; accent-color:#7ea6ff; }

.btns { display:flex; flex-wrap:wrap; gap:6px; }
.btns button, button.wide {
  flex:1 1 45%; padding:7px 8px;
  background:#22223a; color:#e8e6f5; border:1px solid #2c2c47; border-radius:8px;
  font:600 12px/1.2 inherit; cursor:pointer;
}
.btns button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
.btns button:disabled { opacity:.4; cursor:default; }
button.wide { width:100%; margin-top:6px; }

/* the palette: the game's cuts, one tile each */
#palette {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(52px, 1fr)); gap:4px;
  max-height:270px; overflow-y:auto; margin-top:6px; padding:4px;
  background:#0b0b12; border:1px solid #23233a; border-radius:8px;
}
#palette .tile {
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border:1px solid transparent; border-radius:6px; cursor:pointer; background:#16161f;
}
#palette .tile:hover { border-color:#3a3a5c; }
#palette .tile.armed { border-color:#7ea6ff; background:#1d2440; }
#palette .tile img { max-width:44px; max-height:44px; object-fit:contain; pointer-events:none; }
#paletteNote, #selNote { margin-top:6px; font-weight:500; font-size:12px; color:#8b8ba7; }
#selNote b { color:#e8e6f5; }

#stage {
  flex:1; display:flex; align-items:center; justify-content:center; padding:20px; position:relative;
  background-image:
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%),
    linear-gradient(45deg, #16161f 25%, transparent 25% 75%, #16161f 75%);
  background-size:32px 32px; background-position:0 0, 16px 16px;
}
#view { display:block; border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.5); touch-action:none; }
#view.pixelated { image-rendering:pixelated; }
#view.armed { cursor:crosshair; }
#loading { position:absolute; font-size:13px; color:#9c9cba; }

const PRESETS = [

const CAMS = [

// [key, label, type, min, max, step] — or options for a select
const SCHEMA = [
  ["Pixels", [

  ["Sun and sky", [

const STORE_KEY = "hd2dLook";
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; } }
const stored = load();
let presetIdx = qs.has("preset") ? +qs.get("preset") : stored ? stored.preset : 0;
let camIdx = qs.has("cam") ? +qs.get("cam") : stored ? stored.cam : 0;
let aspect = stored && stored.aspect || "portrait";
let gameSlug = qs.get("game") || (stored && stored.game) || "foldiers";
let P = Object.assign({}, BASE, qs.has("preset") || !stored ? PRESETS[presetIdx] || PRESETS[0] : stored.P);
let frozen = qs.get("freeze") === "1";
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ P, cam: camIdx, preset: presetIdx, aspect, game: gameSlug,

  } catch (e) {}
}

// =============================================================================
// RENDERER, SCENE, LIGHTS, SKY
// =============================================================================
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.info.autoReset = false;
const scene = new THREE.Scene();
const perspCam = new THREE.PerspectiveCamera(22, 9 / 16, 1, 200);
const orthoCam = new THREE.OrthographicCamera(-5, 5, 9, -9, 0.1, 200);
let camera = perspCam, controls = null;

const hemi = new THREE.HemisphereLight(0xffffff, 0x888888, 0.3);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

function sunDir(out) {
  const az = P.sunAz * Math.PI / 180, el = P.sunEl * Math.PI / 180;
  return out.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
}

// the sky: a gradient sphere prefiltered (PMREM) into the scene's environment,
// so everything — the sprites included — takes a soft coloured light from all around
const skyScene = new THREE.Scene();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, gnd: { value: new THREE.Color() },
    sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } },
  vertexShader: "varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: [
    "uniform vec3 top, hor, gnd, sunDir, sunCol; varying vec3 vDir;",
    "void main() {",
    "  vec3 d = normalize(vDir); float y = d.y;",
    "  vec3 c = y > 0.0 ? mix(hor, top, pow(y, 0.6)) : mix(hor, gnd, pow(-y, 0.35));",
    "  c += sunCol * (pow(max(dot(d, sunDir), 0.0), 600.0) * 30.0 + pow(max(dot(d, sunDir), 0.0), 12.0) * 0.25);",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n")
});
skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24), skyMat));
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
const skyCanvas = document.createElement("canvas"); skyCanvas.width = 2; skyCanvas.height = 256;
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace;
const bgColor = new THREE.Color();
let skyTimer = 0;

    if (s.anim === "breathe") { const b = k & 1; sy = 1 + 0.035 * b; sx = 1 - 0.015 * b; }
    else if (s.anim === "hop") y += HOP[k % HOP.length] * 0.03 * s.size;
    else if (s.anim === "sway") rz = SWAY[k % SWAY.length] * 0.05;
    else if (s.anim === "walk") {
      const a = t * 0.45 + s.phase; x += Math.sin(a) * 0.6; y = groundAt(x, z) + (k & 1) * 0.02 * s.size;
      flip = (Math.cos(a) < 0) !== s.flip;
    } else if (s.anim === "flipbook" && s.frames.length) frame = k % s.frames.length;
    showFrame(s, frame);
    s.group.position.set(x, y, z);
    if (snap) snapToGrid(s.group.position, px);
    let yaw = 0;
    if (P.billboard === "plane") yaw = planeYaw;
    else if (P.billboard === "toward") yaw = Math.atan2(camera.position.x - x, camera.position.z - z);
    if (P.billboard === "sphere") { s.mesh.quaternion.copy(camera.quaternion); s.mesh.rotateZ(rz); }
    else s.mesh.rotation.set(-pitch * P.lean, yaw, rz, "YXZ");

    s.card.rotation.set(0, sunYaw, 0); s.card.scale.copy(s.mesh.scale);

  }
  if (selected) {
    const sel = selected;
    ring.position.set(sel.group.position.x, sel.y + 0.015, sel.group.position.z);
    const f = sel.frames[0]; ring.scale.setScalar(f ? Math.max(0.6, f.bake.w * sel.size / f.bake.art * 0.9) : 1);
    vS.copy(camera.position).sub(sel.group.position).setY(0).normalize();

function frame(now) {

  if (!frozen) clock += dt;
  controls.update();
  // drift and snap move the camera for this frame only: the controls keep their own position
  savedPos.copy(camera.position);
  camera.updateMatrixWorld();
  camRight.setFromMatrixColumn(camera.matrixWorld, 0); camUp.setFromMatrixColumn(camera.matrixWorld, 1);
  if (P.drift) camera.position.addScaledVector(camRight, Math.sin(clock * 0.3) * 1.2).addScaledVector(camUp, Math.sin(clock * 0.21) * 0.4);
  if (P.snap && camera.isOrthographicCamera) {
    const s = 1 / pxPerUnit(), a = camera.position.dot(camRight), b = camera.position.dot(camUp);
    camera.position.addScaledVector(camRight, Math.round(a / s) * s - a).addScaledVector(camUp, Math.round(b / s) * s - b);
  }
  camera.updateMatrixWorld();
  // the texel density follows the zoom: re-resampled once the view settles
  if (P.pixelate && P.ppuMode === "screen" && (ppuT -= dt) < 0) {
    ppuT = 0.3; const p = currentPpu();
    if (Math.abs(p - worldPpu) / worldPpu > 0.08) rebakeSoon();
  }
  updateSprites(clock);
  updateParticles(clock);
  updateBeams(clock);
  if (waterMat.map && !frozen) waterMat.map.offset.set(Math.floor(clock * P.animFps * 0.5) / Math.max(8, worldPpu), 0);
  sunDir(sun.position).multiplyScalar(40); sun.target.position.set(0, 0, 0);
  if (scene.fog) { const dd = camera.position.distanceTo(controls.target); scene.fog.near = dd * P.fogNear; scene.fog.far = dd * Math.max(P.fogFar, P.fogNear + 0.1); }
  // the post's uniforms that follow the view
  const near = camera.near, far = camera.far, ortho = camera.isOrthographicCamera ? 1 : 0;
  for (const p of [raysPass, dofPass]) { const u = p.uniforms; u.cameraNear.value = near; u.cameraFar.value = far; u.uOrtho.value = ortho; }
  vS.copy(sunDir(vA)).multiplyScalar(100).add(camera.position).project(camera);
  raysPass.uniforms.uSun.value.set(vS.x * 0.5 + 0.5, vS.y * 0.5 + 0.5);
  camFwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  raysPass.uniforms.uVis.value = clamp((camFwd.dot(vA) + 0.6) / 0.6, 0, 1);
  const focusOn = P.dofTarget === "selected" && selected ? vFocus.copy(selected.group.position).setY(selected.y + selected.size * 0.5) : vFocus.copy(controls.target);
  dofPass.uniforms.uFocus.value = Math.max(0.1, vS.copy(focusOn).sub(camera.position).dot(camFwd));
  const want = P.tiltFollow && selected ? clamp(vS.copy(focusOn).project(camera).y * 0.5 + 0.5, 0.1, 0.9) : P.tiltFocus;
  focusY += (want - focusY) * (1 - Math.exp(-5 * dt));

  composer.render(dt);

  if ((statT -= dt) < 0) {
    statT = 0.5;
    document.getElementById("stats").textContent = Math.round(fps) + " fps · " + RW + "×" + RH + " render · " + Math.round(currentPpu()) + " texels/unit · " +
      renderer.info.render.calls + " draws · " + sprites.length + " sprites";
  }
  window.__hd2d = { ready: true, fps: Math.round(fps), sprites, P: () => P, scene, renderer, THREE, cam: () => camera,
    set: (o) => { Object.assign(P, o); syncPanel(); resize(); applyAll(); rebakeSoon(); }, select, preset: (i) => presetBtns[i].click(), pick: (x, y) => { ndc.set(x, y); const g = hitGround(), s = hitSprite(); return { ground: g && g.toArray().map((v) => +v.toFixed(2)), sprite: s && s.name }; } };
  requestAnimationFrame(frame);
}

// =============================================================================
// BOOT
// =============================================================================
buildDiorama();
buildPanel(); syncPanel();
document.getElementById("loading").remove();
rebuildSky();
applyCam(Math.min(camIdx, CAMS.length - 1));
bakeWorld(currentPpu());
applyAll();
refreshButtons();
loadPalette().then(() => {
  if (stored && stored.sprites && stored.game === gameSlug && !qs.has("game")) for (const o of stored.sprites) addSprite(o);
  else defaultSprites();
  if (sprites[0]) select(frozen ? null : sprites[0]);
  save();
});
requestAnimationFrame(frame);
</script>
