<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — foldiers actions on the targets</title>
<meta name="lab-group" content="tests">
<meta name="lab-game" content="foldiers">
<style>
/* ===========================================================================
   FOLDIERS — ACTIONS ON THE TARGETS. An answer to "giving an order is
   heavy": the drag that draws an order, the ring of bubbles it opens and the
   card's action buttons all fight the camera, which pans on the same finger.

   The idea tried here: a whole region is the thing a tap selects again, and
   once a blue region is in hand, EVERY region it can act on wears its own
   actions, as paper icons standing on it — attack with every troop, with
   half, fire the cannon, ride, airlift, move into a region of one's own.
   One tap picks the source, one tap on an icon gives the order; a drag is
   only ever the camera, so the two never compete for the finger.

   What the page lets you judge: how the icons are laid on a target (fan,
   row, ring, along the border, a stack), how many show at once (all, or one
   per target opened on a tap), how they appear and go (pop, unfold, drop,
   rise out of the troops, fade, staggered as a wave by distance), what a tap
   does next (deselect, keep the region, move on to the next one), and what
   the camera does when a region is selected (nothing, fit what is offscreen,
   centre). Sizes are design px of the 720x1280 frame.

   The map is a fresh straight-edged Voronoi map (the game's own cut), with
   the game's camps, a mountain border (no way through, so no icon) and a
   river (an attack across it loses a point a troop). The pieces are the
   game's adopted cuts, read from ../assets. Red does nothing: Send resolves
   the orders with the game's points (attack 2, defence 3, capital +1, river
   -1) and every camp produces, so a flow can be played for a few ticks.

   G · Chosen is the pick (a stack of pictograms, 72 px, no labels). Its
   open question was the camera: a selection brings every tappable thing
   on screen — the region in hand and each target's icons, laid out as they
   will be — between the HUD and the region card the game opens above Send
   (mocked here, its height a knob), moving as little as it can: no move if
   all fits, else the smallest pan, else a zoom out bounded by a floor, else
   the farthest targets left off with an arrow on the edge (a tap on it
   brings that target in). The readout at the foot says which it did.

   Nothing here ships. Copy settings is the panel as JSON.
   =========================================================================== */
* { box-sizing:border-box; margin:0; padding:0; }
body {
  min-height:100vh; display:flex; background:#0b0b12; color:#e8e6f5;
  font:600 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
#panel { flex:0 0 310px; padding:22px 20px; background:#12121c; border-right:1px solid #23233a; overflow:auto; max-height:100vh; }
#panel h1 { font-size:16px; letter-spacing:1px; text-transform:uppercase; }
#panel p.hint { margin:8px 0 14px; font-weight:500; font-size:12px; color:#8b8ba7; }
#panel h3 { margin:18px 0 10px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#7ea6ff; }
.row { margin-bottom:12px; }
.row > label { display:flex; justify-content:space-between; font-size:12px; color:#9c9cba; margin-bottom:6px; }
.row > label output { color:#e8e6f5; font-variant-numeric:tabular-nums; }
.row input[type=range] { width:100%; accent-color:#7ea6ff; }
.seg { display:flex; flex-wrap:wrap; gap:4px; }
.seg button { flex:1 1 auto; padding:7px 8px; background:#1c1c2c; color:#c9c9e0; border:1px solid #2c2c47;
  border-radius:7px; font:600 12px/1 inherit; cursor:pointer; }
.seg button.on { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
.seg button:disabled { opacity:.35; cursor:default; }
.styles { display:flex; flex-direction:column; gap:4px; }
.styles button { text-align:left; padding:8px 10px; background:#1c1c2c; color:#c9c9e0; border:1px solid #2c2c47; border-radius:7px;
  font:600 12px/1.35 inherit; cursor:pointer; }
.styles button b { display:block; color:#e8e6f5; font-size:13px; }
.styles button span { color:#8b8ba7; font-weight:500; }
.styles button.on { border-color:#7ea6ff; background:#20263d; }
.styles button.dirty b::after { content:" · edited"; color:#e0b050; font-weight:600; }
.btns { display:flex; gap:6px; margin-top:10px; }
.btns button { flex:1; padding:8px 10px; background:#1c1c2c; color:#c9c9e0; border:1px solid #2c2c47; border-radius:8px; font:700 12px/1 inherit; cursor:pointer; }
.btns button.main { background:#7ea6ff; color:#0b0b12; border-color:#7ea6ff; }
#selinfo { font-size:12px; color:#8b8ba7; font-weight:500; margin-bottom:8px; }

#stage { flex:1; height:100vh; display:flex; align-items:center; justify-content:center; padding:18px;
  background-image:linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%),linear-gradient(45deg,#16161f 25%,transparent 25% 75%,#16161f 75%);
  background-size:32px 32px; background-position:0 0,16px 16px; }
#view { height:100%; max-height:calc(100vh - 36px); aspect-ratio:720/1280; border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.5);
  touch-action:none; cursor:grab; background:#1f8a96; }
#view.panning { cursor:grabbing; }
#view.over { cursor:pointer; }
</style>
</head>
<body>

<div id="panel">
  <h1>Foldiers targets</h1>
  <p class="hint">Tap a blue region: every region it can act on wears its actions. A tap on an icon gives the order. A drag is the camera, always (wheel or pinch to zoom).</p>
  <h3>Preset</h3>
  <div class="styles" id="presets"></div>
  <div id="knobs"></div>
  <h3>Region in hand</h3>
  <div id="selinfo">None: tap a blue region.</div>
  <div class="row"><label>Carries</label><div class="seg" id="carry"></div></div>
  <div class="row"><label>Troops</label><div class="seg" id="troops"></div></div>
  <div class="btns"><button id="newmap">New map</button><button id="send">Send</button><button id="recam">Camera</button></div>
  <div class="btns"><button id="reset">Reset preset</button><button id="copy" class="main">Copy settings</button></div>
</div>

<div id="stage"><canvas id="view"></canvas></div>

<script>
/* The page's own code: a map, a camera, the icons and the panel. */
(function () {
  "use strict";

  // ---- the knobs ------------------------------------------------------------
  const DEFAULTS = {
    layout: "fan", density: "all", glyph: "pieces", labels: "on", verdict: "ring",
    size: 84, gap: 10, lift: 90, follow: "off", stem: "off", spread: "on",
    appear: "pop", inMs: 260, stagger: 40, waveMs: 60, disappear: "reverse", outMs: 160, idle: "bob",
    after: "deselect", tapRegion: "all", camera: "fit", dim: 0.35, outline: "on", zoom: 1.0,
    floor: 0.8, margin: 16, cardH: 240, hints: "on"
  };
  const PRESETS = [
    { name: "A · Fan, pop", note: "Every action over its target, a wave from the troops.", v: {} },
    { name: "B · Along the border", note: "The icons stand on the border they would cross, unfolding.",
      v: { layout: "border", lift: 0, size: 72, gap: 4, appear: "unfold", inMs: 320, stagger: 50, idle: "none", labels: "off" } },
    { name: "C · Compact", note: "One icon a target, the rest on a tap; the region gives All.",
      v: { density: "compact", layout: "fan", appear: "pop", tapRegion: "all" } },
    { name: "D · Row on stems", note: "A row pinned to the troops by a stem, dropping in.",
      v: { layout: "row", stem: "on", lift: 110, appear: "drop", inMs: 380, labels: "off", verdict: "chip" } },
    { name: "E · Out of the troops", note: "They leave the region in hand and fly back to it.",
      v: { layout: "ring", lift: 20, appear: "rise", disappear: "fly", inMs: 340, stagger: 20, waveMs: 30 } },
    { name: "F · Stack, keep in hand", note: "The main action big, the rest small; the region stays selected.",
      v: { layout: "stack", after: "keep", labels: "off", camera: "centre" } },
    { name: "G · Chosen", note: "The pick of 2026-10-23: a stack of pictograms, the camera fitting them over the card.",
      v: { layout: "stack", glyph: "pictograms", labels: "off", size: 72, gap: 0, lift: 50, spread: "off", waveMs: 70, outline: "off" } }
  ];
  const CHOSEN = PRESETS.length - 1;
  const KNOBS = [
    { h: "Icons" },
    { k: "layout", o: ["fan", "row", "ring", "border", "stack"] },
    { k: "density", label: "How many", o: ["all", "compact"] },
    { k: "glyph", o: ["pieces", "pictograms"] },
    { k: "labels", o: ["on", "off"] },
    { k: "verdict", o: ["ring", "chip", "none"] },
    { k: "size", min: 56, max: 130, step: 2 },
    { k: "gap", min: -10, max: 40, step: 2 },
    { k: "lift", label: "Lift above the troops", min: 0, max: 160, step: 5 },
    { k: "follow", label: "Size follows the zoom", o: ["off", "on"] },
    { k: "stem", o: ["off", "on"] },
    { k: "spread", label: "Push neighbours apart", o: ["off", "on"] },
    { h: "Motion" },
    { k: "appear", o: ["pop", "unfold", "drop", "rise", "fade"] },
    { k: "inMs", label: "Appear (ms)", min: 80, max: 700, step: 10 },
    { k: "stagger", label: "Stagger in a target (ms)", min: 0, max: 150, step: 5 },
    { k: "waveMs", label: "Wave by distance (ms)", min: 0, max: 200, step: 5 },
    { k: "disappear", o: ["reverse", "shrink", "fly", "fade"] },
    { k: "outMs", label: "Disappear (ms)", min: 60, max: 500, step: 10 },
    { k: "idle", o: ["none", "bob", "breathe"] },
    { h: "Flow" },
    { k: "after", label: "After a choice", o: ["deselect", "keep", "next"] },
    { k: "tapRegion", label: "Tap on a target region", o: ["nothing", "all", "expand"] },
    { k: "dim", label: "Dim the rest", min: 0, max: 0.7, step: 0.05 },
    { k: "outline", label: "Outline the targets", o: ["off", "on"] },
    { h: "Camera" },
    { k: "camera", label: "On select", o: ["off", "fit", "centre"] },
    { k: "floor", label: "Fit zooms out to (× the zoom)", min: 0.5, max: 1, step: 0.05 },
    { k: "margin", label: "Safe margin (px)", min: 0, max: 60, step: 2 },
    { k: "cardH", label: "Region card height (px)", min: 0, max: 420, step: 10 },
    { k: "hints", label: "Off-screen hints", o: ["off", "on"] },
    { k: "zoom", label: "Start zoom", min: 0.5, max: 2, step: 0.05 }
  ];
  const STORE = "foldiers-target-actions";
  let preset = CHOSEN, S = Object.assign({}, DEFAULTS, PRESETS[CHOSEN].v);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved) { Object.assign(S, saved.S || {}); preset = saved.preset | 0; }
  } catch (e) { /* defaults */ }
  function save() { try { localStorage.setItem(STORE, JSON.stringify({ S: S, preset: preset })); } catch (e) { /* private window */ } }

  // ---- the game's colours and numbers -----------------------------------------
  const NEUTRAL = 0, BLUE = 1, RED = 2;
  const CAMP = [
    { base: "#b9a77d", light: "#d8c79c", dark: "#8a7a55", rgb: [150, 140, 110] },
    { base: "#2f63c4", light: "#5b8fe0", dark: "#1d3f8a", rgb: [47, 99, 196] },
    { base: "#d9412f", light: "#ee6a4a", dark: "#a52a1f", rgb: [217, 65, 47] }
  ];
  const OK_COL = "#2f8f4e", BAD_COL = "#c8402f", TIE_COL = "#6d7486";
  const PAPER = "#f6ecd2", PAPER2 = "#e6d6b0", INK = "#2a2418";
  const ATTACK_PTS = 2, DEF_PTS = 3, CAPITAL_PTS = 1, RIVER_PTS = -1, CANNON_DAMAGE = 2, LIFT_MAX = 6, LIFT_RANGE = 470;
  const TERRAIN = [["#a8c870", "#94c060"], ["#e2c66e", "#d4b45a"], ["#79ae60", "#6a9d52"]];
  const FONT = "system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";

  // ---- the frame: 720x1280, a mocked HUD on top and Send at the foot --------
  const FW = 720, FH = 1280, TOP = 130, BOT = 1090, CX = FW / 2, CYM = (TOP + BOT) / 2;
  const TILT = Math.cos(30 * Math.PI / 180);
  const SEND = { x: 360, y: 1170, w: 300, h: 84 };
  // The card of the region in hand stands on Send, as in the game (footTop):
  // the camera fits against its resting top, whatever its slide is doing.
  let cardK = 0;
  const cardTop = () => SEND.y - SEND.h / 2 - 18 - S.cardH;
  const inCard = (p) => cardK > 0.5 && S.cardH > 0 && p.y >= cardTop() && p.y <= SEND.y - SEND.h / 2 - 18 && p.x >= 16 && p.x <= FW - 16;
  const cv = document.getElementById("view"), ctx = cv.getContext("2d");
  let K = 1;
  function fitCanvas() {
    const r = cv.getBoundingClientRect();
    K = Math.max(1, Math.min(2, (r.height * (window.devicePixelRatio || 1)) / FH));
    cv.width = Math.round(FW * K); cv.height = Math.round(FH * K);
  }

  // ---- art ---------------------------------------------------------------------
  const PIECE_FILE = {
    infB: "army-blue-05", infR: "army-red-05", capB: "army-blue-01", capR: "army-red-01",
    cavB: "army-blue-07", cavR: "army-red-07", canB: "army-blue-09", canR: "army-red-09",
    balB: "army-blue-15", balR: "army-red-15", flagN: "scenery-08"
  };
  const IMG = {};
  for (const k in PIECE_FILE) { const im = new Image(); im.src = "../assets/image/object/foldiers-" + PIECE_FILE[k] + ".png"; IMG[k] = im; }
  const PICT = {};
  ["sword", "bomb", "zap", "chevrons-right", "chevrons-up", "x", "check"].forEach((n) => {
    const im = new Image(); im.src = "../assets/motor/lucide/" + n + ".svg"; PICT[n] = im;
  });
  const ready = (im) => im && im.complete && im.naturalWidth > 0;
  const tintCache = {};
  function tinted(name, col) {
    const key = name + col;
    if (tintCache[key]) return tintCache[key];
    const im = PICT[name];
    if (!ready(im)) return null;
    const c = document.createElement("canvas"); c.width = c.height = 96;
    const g = c.getContext("2d");
    g.drawImage(im, 0, 0, 96, 96);
    g.globalCompositeOperation = "source-in"; g.fillStyle = col; g.fillRect(0, 0, 96, 96);
    return (tintCache[key] = c);
  }

  // ---- the actions -------------------------------------------------------------
  const ACT = {
    all:      { label: "All",       pict: "sword",          piece: "inf", fill: 1 },
    half:     { label: "Half",      pict: "sword",          piece: "inf", fill: 0.5 },
    move:     { label: "Move",      pict: "chevrons-right", piece: "inf", fill: 1, friendly: true },
    movehalf: { label: "Move half", pict: "chevrons-right", piece: "inf", fill: 0.5, friendly: true },
    fire:     { label: "Fire",      pict: "bomb",           piece: "can" },
    ride:     { label: "Ride",      pict: "zap",            piece: "cav" },
    lift:     { label: "Airlift",   pict: "chevrons-up",    piece: "bal" },
    cancel:   { label: "Cancel",    pict: "x" }
  };

  // ---- the map: a straight-edged Voronoi cut, the game's way -------------------
  const W = 1100, H = 1500;
  let R = [], adj = [], borders = {}, orders = {}, tick = 1, seed = 7;
  const key = (a, b) => a < b ? a + ":" + b : b + ":" + a;
  function rng(s) {
    s = (s >>> 0) || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  // keep the side of the bisector of a and b nearest a; every vertex carries
  // the neighbour across the edge that starts at it (-1 for the frame)
  function clip(P, a, b, j) {
    const nx = b.x - a.x, ny = b.y - a.y, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const f = (p) => (p.x - mx) * nx + (p.y - my) * ny;
    const out = [];
    for (let k = 0; k < P.length; k++) {
      const A = P[k], B = P[(k + 1) % P.length], fa = f(A), fb = f(B);
      if (fa <= 0) out.push(A);
      if ((fa <= 0) !== (fb <= 0)) {
        const t = fa / (fa - fb), I = { x: A.x + (B.x - A.x) * t, y: A.y + (B.y - A.y) * t };
        I.tag = fa <= 0 ? j : A.tag;
        out.push(I);
      }
    }
    return out;
  }
  function centroid(P) {
    let a = 0, x = 0, y = 0;
    for (let k = 0; k < P.length; k++) {
      const p = P[k], q = P[(k + 1) % P.length], c = p.x * q.y - q.x * p.y;
      a += c; x += (p.x + q.x) * c; y += (p.y + q.y) * c;
    }
    return { x: x / (3 * a), y: y / (3 * a) };
  }
  function genMap(s) {
    const rnd = rng(s * 2654435761), COLS = 7, ROWS = 9, seeds = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = (c + 0.5 + (rnd() - 0.5) * 0.75) * W / COLS, y = (r + 0.5 + (rnd() - 0.5) * 0.75) * H / ROWS;
      const nx = (x - W / 2) / (W * 0.5), ny = (y - H / 2) / (H * 0.48);
      seeds.push({ x: x, y: y, land: nx * nx + ny * ny + (rnd() - 0.5) * 0.4 < 0.8 });
    }
    const polys = seeds.map((a, i) => {
      let P = [{ x: 0, y: 0, tag: -1 }, { x: W, y: 0, tag: -1 }, { x: W, y: H, tag: -1 }, { x: 0, y: H, tag: -1 }];
      seeds.forEach((b, j) => { if (j !== i && Math.hypot(a.x - b.x, a.y - b.y) < 520) P = clip(P, a, b, j); });
      return P;
    });
    // the largest piece of land, so every region is reachable
    const nb = (i) => {
      const L = [];
      polys[i].forEach((p, k) => {
        const q = polys[i][(k + 1) % polys[i].length];
        if (p.tag >= 0 && seeds[p.tag].land && Math.hypot(q.x - p.x, q.y - p.y) > 22 && L.indexOf(p.tag) < 0) L.push(p.tag);
      });
      return L;
    };
    let best = [];
    const seen = {};
    seeds.forEach((sd, i) => {
      if (!sd.land || seen[i]) return;
      const comp = [i]; seen[i] = true;
      for (let h = 0; h < comp.length; h++) nb(comp[h]).forEach((j) => { if (!seen[j]) { seen[j] = true; comp.push(j); } });
      if (comp.length > best.length) best = comp;
    });
    best.sort((a, b) => a - b);
    const idx = {};
    best.forEach((g, i) => { idx[g] = i; });
    R = best.map((g, i) => {
      const P = polys[g], c = centroid(P);
      return { id: i, poly: P.map((p) => ({ x: p.x, y: p.y, tag: p.tag >= 0 && idx[p.tag] != null ? idx[p.tag] : -1 })),
               cx: c.x, cy: c.y, owner: NEUTRAL, troops: 1 + Math.floor(rnd() * 3), terrain: Math.floor(rnd() * 3),
               capital: false, cannon: false, cav: 0, balloon: false };
    });
    adj = best.map((g) => nb(g).map((j) => idx[j]));
    // the camps: blue in the south-west, red as far as the paths go
    const dist = (from) => {
      const D = R.map(() => Infinity); D[from] = 0;
      const q = [from];
      for (let h = 0; h < q.length; h++) adj[q[h]].forEach((j) => { if (D[j] === Infinity) { D[j] = D[q[h]] + 1; q.push(j); } });
      return D;
    };
    let bc = 0;
    R.forEach((r) => { if (r.cy - r.cx * 0.4 > R[bc].cy - R[bc].cx * 0.4) bc = r.id; });
    const Db = dist(bc);
    let rc = 0;
    R.forEach((r) => { if (Db[r.id] > Db[rc] && Db[r.id] !== Infinity) rc = r.id; });
    const Dr = dist(rc);
    const take = (D, camp, n) => R.slice().sort((a, b) => D[a.id] - D[b.id]).filter((r) => r.owner === NEUTRAL).slice(0, n)
      .forEach((r) => { r.owner = camp; r.troops = 3 + Math.floor(rnd() * 6); });
    take(Db, BLUE, 5); take(Dr, RED, 5);
    Object.assign(R[bc], { capital: true, troops: 12, cannon: true, cav: 3 });
    Object.assign(R[rc], { capital: true, troops: 10, cannon: true });
    const blues = R.filter((r) => r.owner === BLUE && !r.capital);
    if (blues.length) blues[blues.length - 1].balloon = true;
    // one mountain and one river on blue's front, one more river further off
    borders = {};
    const front = [];
    R.forEach((r) => { if (r.owner === BLUE) adj[r.id].forEach((j) => { if (R[j].owner !== BLUE) front.push([r.id, j]); }); });
    const pick = (L) => L.splice(Math.floor(rnd() * L.length), 1)[0];
    const notCap = front.filter((e) => !R[e[0]].capital);
    if (notCap.length) { const e = pick(notCap); borders[key(e[0], e[1])] = "mountain"; }
    const rest = front.filter((e) => !borders[key(e[0], e[1])]);
    if (rest.length) { const e = pick(rest); borders[key(e[0], e[1])] = "river"; }
    const far = [];
    R.forEach((r) => adj[r.id].forEach((j) => { if (j > r.id && r.owner !== BLUE && R[j].owner !== BLUE) far.push([r.id, j]); }));
    if (far.length) { const e = pick(far); borders[key(e[0], e[1])] = "river"; }
    orders = {}; tick = 1; sel = -1; openT = -1; icons = [];
    camHome();
  }
  const borderOf = (a, b) => borders[key(a, b)] || "";
  const isNb = (a, b) => adj[a].indexOf(b) >= 0;

  // ---- what the region in hand can do, target by target ---------------------
  function sendCount(r, act) {
    if (act === "all" || act === "move") return r.troops;
    if (act === "half" || act === "movehalf") return Math.floor(r.troops / 2);
    if (act === "ride") return r.cav;
    if (act === "lift") return Math.min(LIFT_MAX, r.troops);
    return 0;
  }
  function targetsOf(s) {
    const r = R[s], T = {}, list = [];
    const at = (id) => T[id] || (list.push(T[id] = { id: id, acts: [] }), T[id]);
    adj[s].forEach((j) => {
      if (borderOf(s, j) === "mountain") return;
      if (R[j].owner === BLUE) {
        if (r.troops > 0) at(j).acts.push("move");
        if (r.troops > 1) at(j).acts.push("movehalf");
      } else {
        if (r.troops > 0) at(j).acts.push("all");
        if (r.troops > 1) at(j).acts.push("half");
        if (r.cannon) at(j).acts.push("fire");
      }
    });
    if (r.cav > 0) {
      // two steps away, over borders a rider can cross

    if (camGoal) {
      const k = Math.min(1, dt * 6);
      cam.x += (camGoal.x - cam.x) * k; cam.y += (camGoal.y - cam.y) * k; cam.z += (camGoal.z - cam.z) * k;
      if (Math.abs(camGoal.x - cam.x) + Math.abs(camGoal.y - cam.y) < 0.5 && Math.abs(camGoal.z - cam.z) < 0.002) camGoal = null;
    }
    dimK += ((sel >= 0 ? 1 : 0) - dimK) * Math.min(1, dt * 8);
    if (sel >= 0) cardSel = sel;
    cardK = Math.max(0, Math.min(1, cardK + (sel >= 0 ? dt : -dt) / 0.22));
    ctx.setTransform(K, 0, 0, K, 0, 0);
    const targets = sel >= 0 ? targetsOf(sel) : [];
    drawGround(targets);
    drawPieces();
    drawOrders();
    drawIcons(dt);
    drawCard();
    drawHints();
    drawHud();
    drawReadout();
    requestAnimationFrame(frame);
  }

  // ---- the panel ---------------------------------------------------------------
  const knobsEl = document.getElementById("knobs"), presetsEl = document.getElementById("presets");
  const pretty = (k) => k.charAt(0).toUpperCase() + k.slice(1);
  const ctl = {};
  function presetValues(i) { return Object.assign({}, DEFAULTS, PRESETS[i].v); }
  function isDirty() { const P = presetValues(preset); return Object.keys(DEFAULTS).some((k) => P[k] !== S[k]); }
  function paintPresets() {
    presetsEl.querySelectorAll("button").forEach((b, i) => {
      b.classList.toggle("on", i === preset);
      b.classList.toggle("dirty", i === preset && isDirty());
    });
  }
  PRESETS.forEach((p, i) => {
    const b = document.createElement("button");
    b.innerHTML = "<b></b><span></span>";
    b.querySelector("b").textContent = p.name; b.querySelector("span").textContent = p.note;
    b.onclick = () => { preset = i; S = presetValues(i); paintKnobs(); changed(true); };
    presetsEl.appendChild(b);
  });
  KNOBS.forEach((d) => {
    if (d.h) { const h = document.createElement("h3"); h.textContent = d.h; knobsEl.appendChild(h); return; }
    const row = document.createElement("div"); row.className = "row";
    const lab = document.createElement("label"); lab.textContent = d.label || pretty(d.k);
    row.appendChild(lab);
    if (d.o) {
      const seg = document.createElement("div"); seg.className = "seg";
      d.o.forEach((v) => {
        const b = document.createElement("button"); b.textContent = v; b.dataset.v = v;
        b.onclick = () => { S[d.k] = v; paintKnobs(); changed(d.k === "zoom"); };
        seg.appendChild(b);
      });
      row.appendChild(seg);
      ctl[d.k] = { paint: () => seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === S[d.k])) };
    } else {
      const out = document.createElement("output"); lab.appendChild(out);
      const inp = document.createElement("input"); inp.type = "range"; inp.min = d.min; inp.max = d.max; inp.step = d.step;
      inp.oninput = () => { S[d.k] = +inp.value; out.textContent = S[d.k]; changed(false, d.k); };
      row.appendChild(inp);
      ctl[d.k] = { paint: () => { inp.value = S[d.k]; out.textContent = S[d.k]; } };
    }
    knobsEl.appendChild(row);
  });
  function paintKnobs() { for (const k in ctl) ctl[k].paint(); }
  function changed(recam, k) {
    save(); paintPresets();
    if (k === "zoom") { cam.z = S.zoom; clampCam(cam); }
    if (recam) camHome();
    // re-deal the icons so a new motion is seen at once
    if (sel >= 0) { icons.forEach((ic) => { ic.dead = now; }); refresh(); cameraOnSelect(); }
  }

  // the region in hand: what it carries, how many troops it holds
  const carryEl = document.getElementById("carry"), troopsEl = document.getElementById("troops"), selInfo = document.getElementById("selinfo");
  const CARRY = [["cannon", "Cannon"], ["cav", "Cavalry"], ["balloon", "Balloon"]];
  CARRY.forEach(([k, label]) => {
    const b = document.createElement("button"); b.textContent = label; b.dataset.k = k;
    b.onclick = () => {
      if (sel < 0) return;
      const r = R[sel];
      if (k === "cav") r.cav = r.cav ? 0 : Math.min(3, r.troops); else r[k] = !r[k];
      refresh();
    };
    carryEl.appendChild(b);
  });
  [["−", -1], ["+", 1], ["1", 0]].forEach(([label, d]) => {
    const b = document.createElement("button"); b.textContent = label;
    b.onclick = () => {
      if (sel < 0) return;
      const r = R[sel];
      r.troops = d ? Math.max(0, r.troops + d) : 1;
      r.cav = Math.min(r.cav, r.troops);
      refresh();
    };
    troopsEl.appendChild(b);
  });
  function syncPanel() {
    const r = sel >= 0 ? R[sel] : null;
    selInfo.textContent = r ? "Region " + r.id + (r.capital ? " (capital)" : "") + " · " + r.troops + " troops · " + targetsOf(sel).length + " targets" : "None: tap a blue region.";
    carryEl.querySelectorAll("button").forEach((b) => {
      b.disabled = !r;
      b.classList.toggle("on", !!r && (b.dataset.k === "cav" ? r.cav > 0 : !!r[b.dataset.k]));
    });
    troopsEl.querySelectorAll("button").forEach((b) => { b.disabled = !r; });
  }

  document.getElementById("newmap").onclick = () => { seed++; genMap(seed); syncPanel(); };
  document.getElementById("send").onclick = send;
  document.getElementById("recam").onclick = camHome;
  document.getElementById("reset").onclick = () => { S = presetValues(preset); paintKnobs(); changed(true); };
  document.getElementById("copy").onclick = () => {
    const txt = JSON.stringify(Object.assign({ preset: PRESETS[preset].name }, S), null, 2);
    try { navigator.clipboard.writeText(txt); } catch (e) { /* no clipboard */ }
    console.log(txt);
  };
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") select(-1);
    if (e.key === "Enter") send();
  });
  window.addEventListener("resize", fitCanvas);

  // for a headless check: the state, read-only
  window.__lab = { cam: cam, get goal() { return camGoal; }, get sel() { return sel; }, fitItems: fitItems, viewRect: viewRect, scr: scr };
  fitCanvas();
  genMap(seed);
  paintKnobs(); paintPresets(); syncPanel();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
