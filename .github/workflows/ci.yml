# The build gate. A game's index.html is a build output, not a source, and the
# two catalogues (site/games.js and the root index.html GAMES block) are
# generated from the manifests — so the one thing CI has to catch is a source
# and its artifact drifting apart, which is invisible in a diff and only shows
# up as a game that no longer matches its own code.
#
# Nothing here needs a secret, a network call or a browser: the three checks
# rebuild in memory and compare.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Rebuilds all 14 units in memory and compares byte for byte. A DIFF
      # means someone edited an index.html by hand, or changed a source
      # without rebuilding.
      - name: build artifacts match their sources
        run: node tools/build/build.mjs --check

      # site/games.js and the root gallery are generated from the manifests.
      - name: catalogues are up to date
        run: node tools/build/gen-catalogues.mjs --check

      # Ad networks reject a creative over 5 MB.
      - name: creatives are within budget
        run: node tools/build/check-size.mjs
